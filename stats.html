<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>BGG Collection Stats</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }

    .stat-card {
      transition: all 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }

    .skeleton {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      background: linear-gradient(90deg, #e2e8f0 25%, #cbd5e1 50%, #e2e8f0 75%);
      background-size: 200% 100%;
    }

    @keyframes pulse {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .distribution-bar {
      transition: width 0.5s ease, background-color 0.3s ease;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="pb-20">

  <header class="sticky top-0 z-30 w-full bg-white/90 backdrop-blur-md border-b shadow-lg">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-gradient-to-br from-purple-600 to-indigo-600 text-white p-3 rounded-xl shadow-lg">
          <i class="fa-solid fa-chart-bar text-xl"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-tight bg-gradient-to-r from-purple-600 to-indigo-600 bg-clip-text text-transparent">Collection Stats</h1>
          <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Deep Dive Analytics</p>
        </div>
      </div>
      <div id="statsBox" class="text-right hidden">
        <div class="text-3xl font-bold bg-gradient-to-r from-purple-600 to-indigo-600 bg-clip-text text-transparent" id="totalCount">0</div>
        <div class="text-[10px] text-slate-500 uppercase font-bold tracking-wider">Total Items</div>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 space-y-6">
    
    <!-- Fetch Section -->
    <div id="fetchSection" class="bg-white/95 backdrop-blur-sm rounded-2xl shadow-xl border border-white/50 p-6">
      <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
        <i class="fa-solid fa-download text-purple-600"></i>
        Load Collection
      </h2>
      <div class="space-y-4">
        <div>
          <label class="text-xs font-bold text-slate-500 uppercase mb-2 block">BGG Username</label>
          <input 
            id="username" 
            type="text" 
            value="sportomax" 
            class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-100 outline-none transition-all font-semibold"
          >
        </div>
        
        <!-- Collection Filters -->
        <div>
          <label class="text-xs font-bold text-slate-500 uppercase mb-2 block">Collection Filters</label>
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2">
            <label class="flex items-center gap-2 cursor-pointer bg-slate-50 px-3 py-2 rounded-lg hover:bg-slate-100 transition-colors">
              <input type="checkbox" id="filter-own" class="form-checkbox text-purple-600 rounded" checked>
              <span class="text-sm font-semibold text-slate-700">Owned</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer bg-slate-50 px-3 py-2 rounded-lg hover:bg-slate-100 transition-colors">
              <input type="checkbox" id="filter-prevowned" class="form-checkbox text-purple-600 rounded">
              <span class="text-sm font-semibold text-slate-700">Prev. Owned</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer bg-slate-50 px-3 py-2 rounded-lg hover:bg-slate-100 transition-colors">
              <input type="checkbox" id="filter-fortrade" class="form-checkbox text-purple-600 rounded">
              <span class="text-sm font-semibold text-slate-700">For Trade</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer bg-slate-50 px-3 py-2 rounded-lg hover:bg-slate-100 transition-colors">
              <input type="checkbox" id="filter-want" class="form-checkbox text-purple-600 rounded">
              <span class="text-sm font-semibold text-slate-700">Want</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer bg-slate-50 px-3 py-2 rounded-lg hover:bg-slate-100 transition-colors">
              <input type="checkbox" id="filter-wanttoplay" class="form-checkbox text-purple-600 rounded">
              <span class="text-sm font-semibold text-slate-700">Want To Play</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer bg-slate-50 px-3 py-2 rounded-lg hover:bg-slate-100 transition-colors">
              <input type="checkbox" id="filter-wishlist" class="form-checkbox text-purple-600 rounded">
              <span class="text-sm font-semibold text-slate-700">Wishlist</span>
            </label>
          </div>
        </div>
        
        <button 
          onclick="fetchStats()" 
          id="fetchBtn"
          class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white py-4 rounded-xl font-bold hover:shadow-2xl hover:scale-[1.02] transition-all shadow-lg shadow-purple-200 flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-chart-line"></i> Analyze Collection
        </button>
      </div>
    </div>

    <!-- Loading Section -->
    <div id="loadingSection" class="hidden">
      <div class="bg-white/95 backdrop-blur-sm rounded-2xl shadow-xl border border-white/50 p-8">
        <div class="flex items-center justify-center gap-3 mb-4">
          <i class="fa-solid fa-circle-notch fa-spin text-purple-600 text-3xl"></i>
          <span class="font-bold text-slate-700 text-lg">Loading collection data...</span>
        </div>
        <div class="text-sm text-slate-500 text-center mb-4" id="loadingStatus">Fetching games...</div>
        <div class="bg-slate-100 rounded-full h-3 overflow-hidden">
          <div id="progressBar" class="bg-gradient-to-r from-purple-600 to-indigo-600 h-full transition-all duration-300 shadow-lg" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- Error Message -->
    <div id="errorSection" class="hidden">
      <div class="bg-red-50 border-2 border-red-200 rounded-2xl shadow-xl p-6">
        <div class="flex items-center gap-3 mb-2">
          <i class="fa-solid fa-exclamation-triangle text-red-600 text-2xl"></i>
          <h3 class="font-bold text-red-900 text-lg">Error Loading Data</h3>
        </div>
        <p class="text-red-700" id="errorMessage"></p>
      </div>
    </div>

    <!-- Core Stats Grid -->
    <div id="coreStatsSection" class="hidden space-y-6">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="coreStats">
        <!-- Core stat cards will be injected here -->
      </div>
    </div>

    <!-- Weight Distribution Section -->
    <div id="weightSection" class="hidden">
      <div class="bg-white/95 backdrop-blur-sm rounded-2xl shadow-xl border border-white/50 p-6">
        <div class="flex items-center gap-3 mb-6">
          <div class="bg-gradient-to-br from-amber-500 to-orange-600 text-white p-3 rounded-xl">
            <i class="fa-solid fa-weight-hanging"></i>
          </div>
          <div>
            <h2 class="text-2xl font-bold">Complexity Distribution</h2>
            <p class="text-sm text-slate-500">Average Weight (1-5 scale)</p>
          </div>
        </div>
        <div id="weightDistribution" class="space-y-3">
          <!-- Weight bars will be injected here -->
        </div>
      </div>
    </div>

    <!-- Detailed Stats Grid -->
    <div id="detailedStatsSection" class="hidden">
      <h2 class="text-2xl font-bold text-white mb-4 flex items-center gap-2">
        <i class="fa-solid fa-chart-pie"></i>
        Detailed Distributions
      </h2>
      <div id="detailedStats" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
        <!-- Detailed stat cards will be injected here -->
      </div>
    </div>

  </main>

  <script>
    const BATCH_SIZE = 100;
    const RETRY_DELAY = 3000;
    const MAX_RETRIES = 15;

    let allGames = [];
    let thingData = new Map();

    async function fetchStats() {
      const username = document.getElementById('username').value.trim();
      if (!username) {
        showError('Please enter a BGG username');
        return;
      }

      const filterParams = getFilterParams();
      if (!filterParams) {
        showError('Please select at least one collection filter');
        return;
      }

      // Reset UI
      document.getElementById('fetchSection').classList.add('hidden');
      document.getElementById('loadingSection').classList.remove('hidden');
      document.getElementById('errorSection').classList.add('hidden');
      document.getElementById('coreStatsSection').classList.add('hidden');
      document.getElementById('weightSection').classList.add('hidden');
      document.getElementById('detailedStatsSection').classList.add('hidden');

      try {
        // Step 1: Fetch collection
        updateProgress('Fetching collection from BGG...', 10);
        const collectionXml = await fetchCollection(username, filterParams);
        const items = Array.from(collectionXml.querySelectorAll('item'));
        
        if (items.length === 0) {
          showError('No items found matching your filters');
          return;
        }

        updateProgress(`Found ${items.length} items. Fetching detailed data...`, 30);

        // Step 2: Extract game IDs
        const gameIds = items
          .filter(item => {
            const subtype = item.getAttribute('subtype');
            return subtype === 'boardgame' || subtype === 'boardgameexpansion';
          })
          .map(item => item.getAttribute('objectid'));

        // Step 3: Fetch thing data in parallel batches
        await fetchThingDataParallel(gameIds);
        
        updateProgress('Processing statistics...', 90);

        // Step 4: Process and render
        processAndRender(items);
        
        updateProgress('Complete!', 100);
        
        // Hide loading, show results
        setTimeout(() => {
          document.getElementById('loadingSection').classList.add('hidden');
          document.getElementById('coreStatsSection').classList.remove('hidden');
          document.getElementById('weightSection').classList.remove('hidden');
          document.getElementById('detailedStatsSection').classList.remove('hidden');
          document.getElementById('statsBox').classList.remove('hidden');
        }, 500);

      } catch (err) {
        console.error(err);
        showError(err.message);
      }
    }

    function getFilterParams() {
      const checkboxes = document.querySelectorAll('[id^="filter-"]');
      let params = '';
      let hasAny = false;
      
      checkboxes.forEach(cb => {
        if (cb.checked) {
          const filterName = cb.id.replace('filter-', '');
          params += `&${filterName}=1`;
          hasAny = true;
        }
      });
      
      return hasAny ? params : null;
    }

    async function fetchCollection(username, filterParams, attempt = 0) {
      const url = `/api/bgg-helper?endpoint=collection&username=${username}&stats=1${filterParams}`;
      
      const response = await fetch(url);

      if (response.status === 202) {
        if (attempt >= MAX_RETRIES) {
          throw new Error('Collection request timed out');
        }
        updateProgress(`BGG is preparing collection (attempt ${attempt + 1}/${MAX_RETRIES})...`, 10 + attempt * 2);
        await new Promise(resolve => setTimeout(resolve, RETRY_DELAY));
        return fetchCollection(username, filterParams, attempt + 1);
      }

      if (!response.ok) {
        throw new Error(`API error: ${response.status} ${response.statusText}`);
      }

      const xmlText = await response.text();
      const parser = new DOMParser();
      return parser.parseFromString(xmlText, 'text/xml');
    }

    async function fetchThingDataParallel(gameIds) {
      const batches = [];
      for (let i = 0; i < gameIds.length; i += BATCH_SIZE) {
        batches.push(gameIds.slice(i, i + BATCH_SIZE));
      }

      updateProgress(`Fetching detailed data (${batches.length} batches in parallel)...`, 40);

      // Fetch all batches in parallel
      const promises = batches.map((batch, idx) => 
        fetchThingBatch(batch, idx + 1, batches.length)
      );

      await Promise.all(promises);
    }

    async function fetchThingBatch(ids, batchNum, totalBatches) {
      const idsString = ids.join(',');
      const url = `/api/bgg-helper?endpoint=thing&id=${idsString}&stats=1`;
      
      try {
        const response = await fetch(url);
        if (!response.ok) return;

        const xmlText = await response.text();
        const parser = new DOMParser();
        const xml = parser.parseFromString(xmlText, 'text/xml');
        
        const items = xml.querySelectorAll('item');
        items.forEach(item => {
          const id = item.getAttribute('id');
          thingData.set(id, item);
        });

        updateProgress(`Fetching batch ${batchNum}/${totalBatches}...`, 40 + (batchNum / totalBatches) * 40);
      } catch (err) {
        console.warn(`Failed to fetch batch ${batchNum}:`, err);
      }
    }

    function processAndRender(items) {
      // Initialize counters
      const stats = {
        total: items.length,
        avgBggRating: 0,
        avgUserRating: 0,
        avgWeight: 0,
        ratedCount: 0,
        userRatedCount: 0,
        weightedCount: 0,
        minYear: Infinity,
        maxYear: -Infinity,
        yearCounts: new Map(),
        playerCounts: new Map(),
        timeCounts: new Map(),
        ratingCounts: new Map(),
        weightCounts: new Map(),
        mechanicCounts: new Map(),
        categoryCounts: new Map(),
        designerCounts: new Map(),
        rankCounts: new Map()
      };

      let sumBgg = 0, sumUser = 0, sumWeight = 0;

      // Process each item
      items.forEach(item => {
        const gameId = item.getAttribute('objectid');
        const name = item.querySelector('name')?.textContent || 'Unknown';
        
        // Year
        const yearStr = item.querySelector('yearpublished')?.textContent;
        if (yearStr && yearStr !== '0') {
          const year = parseInt(yearStr);
          stats.minYear = Math.min(stats.minYear, year);
          stats.maxYear = Math.max(stats.maxYear, year);
          incrementMap(stats.yearCounts, groupYear(year));
        }

        // Get stats from collection XML
        const statsTag = item.querySelector('stats');
        if (statsTag) {
          // Playing time
          const time = parseInt(statsTag.getAttribute('playingtime') || '0');
          incrementMap(stats.timeCounts, groupTime(time));

          // Players
          const minP = parseInt(statsTag.getAttribute('minplayers') || '0');
          const maxP = parseInt(statsTag.getAttribute('maxplayers') || '0');
          for (let p = minP; p <= Math.min(maxP, 10); p++) {
            if (p > 0) incrementMap(stats.playerCounts, p.toString());
          }
          if (maxP > 10) incrementMap(stats.playerCounts, '10+');

          const ratings = statsTag.querySelector('rating');
          if (ratings) {
            // BGG Rating
            const bggRating = parseFloat(ratings.querySelector('average')?.getAttribute('value') || '0');
            if (bggRating > 0) {
              stats.ratedCount++;
              sumBgg += bggRating;
              incrementMap(stats.ratingCounts, Math.floor(bggRating).toString());
            }

            // Rank
            const rankElem = ratings.querySelector('rank[type="subtype"][id="1"]');
            if (rankElem) {
              const rankVal = rankElem.getAttribute('value');
              if (rankVal && rankVal !== 'Not Ranked') {
                incrementMap(stats.rankCounts, groupRank(parseInt(rankVal)));
              }
            }
          }
        }

        // User rating
        const userRating = parseFloat(item.querySelector('status')?.getAttribute('rating') || '0');
        if (userRating > 0) {
          stats.userRatedCount++;
          sumUser += userRating;
        }

        // Get thing data for weight
        const thing = thingData.get(gameId);
        if (thing) {
          const thingStats = thing.querySelector('statistics ratings');
          if (thingStats) {
            // Weight
            const weight = parseFloat(thingStats.querySelector('averageweight')?.getAttribute('value') || '0');
            if (weight > 0) {
              stats.weightedCount++;
              sumWeight += weight;
              incrementMap(stats.weightCounts, groupWeight(weight));
            }
          }

          // Links
          thing.querySelectorAll('link').forEach(link => {
            const type = link.getAttribute('type');
            const value = link.getAttribute('value');
            if (type === 'boardgamemechanic') incrementMap(stats.mechanicCounts, value);
            if (type === 'boardgamecategory') incrementMap(stats.categoryCounts, value);
            if (type === 'boardgamedesigner') incrementMap(stats.designerCounts, value);
          });
        }
      });

      // Calculate averages
      stats.avgBggRating = stats.ratedCount > 0 ? sumBgg / stats.ratedCount : 0;
      stats.avgUserRating = stats.userRatedCount > 0 ? sumUser / stats.userRatedCount : 0;
      stats.avgWeight = stats.weightedCount > 0 ? sumWeight / stats.weightedCount : 0;

      // Render all sections
      renderCoreStats(stats);
      renderWeightDistribution(stats);
      renderDetailedStats(stats);

      document.getElementById('totalCount').textContent = stats.total.toLocaleString();
    }

    function renderCoreStats(stats) {
      const container = document.getElementById('coreStats');
      container.innerHTML = '';

      const cards = [
        { icon: 'fa-gamepad', label: 'Total Items', value: stats.total.toLocaleString(), color: 'purple' },
        { icon: 'fa-star', label: 'Avg BGG Rating', value: stats.avgBggRating.toFixed(2), color: 'amber' },
        { icon: 'fa-heart', label: 'Avg Your Rating', value: stats.avgUserRating > 0 ? stats.avgUserRating.toFixed(2) : 'N/A', color: 'rose' },
        { icon: 'fa-weight-hanging', label: 'Avg Complexity', value: stats.avgWeight.toFixed(2), color: 'indigo' },
        { icon: 'fa-calendar', label: 'Year Range', value: `${stats.minYear === Infinity ? 'N/A' : stats.minYear} - ${stats.maxYear === -Infinity ? 'N/A' : stats.maxYear}`, color: 'blue' },
        { icon: 'fa-puzzle-piece', label: 'Mechanics', value: stats.mechanicCounts.size, color: 'green' },
        { icon: 'fa-tag', label: 'Categories', value: stats.categoryCounts.size, color: 'cyan' },
        { icon: 'fa-user', label: 'Designers', value: stats.designerCounts.size, color: 'orange' }
      ];

      cards.forEach(card => {
        container.innerHTML += `
          <div class="stat-card bg-white rounded-xl p-4 shadow-lg border border-slate-100">
            <div class="flex items-center gap-3 mb-2">
              <div class="bg-${card.color}-100 text-${card.color}-600 p-2 rounded-lg">
                <i class="fa-solid ${card.icon}"></i>
              </div>
              <div class="text-xs font-bold text-slate-500 uppercase">${card.label}</div>
            </div>
            <div class="text-3xl font-bold bg-gradient-to-r from-${card.color}-600 to-${card.color}-700 bg-clip-text text-transparent">${card.value}</div>
          </div>
        `;
      });
    }

    function renderWeightDistribution(stats) {
      const container = document.getElementById('weightDistribution');
      container.innerHTML = '';

      const sorted = Array.from(stats.weightCounts.entries()).sort((a, b) => {
        const order = ['1.0-1.5', '1.5-2.0', '2.0-2.5', '2.5-3.0', '3.0-3.5', '3.5-4.0', '4.0-4.5', '4.5-5.0'];
        return order.indexOf(a[0]) - order.indexOf(b[0]);
      });

      const maxCount = Math.max(...sorted.map(x => x[1]));
      const colors = ['bg-green-500', 'bg-emerald-500', 'bg-yellow-500', 'bg-orange-500', 'bg-red-500', 'bg-pink-500', 'bg-purple-500', 'bg-indigo-500'];

      sorted.forEach(([range, count], idx) => {
        const percentage = (count / maxCount) * 100;
        const color = colors[idx % colors.length];
        
        container.innerHTML += `
          <div class="flex items-center gap-3">
            <div class="w-24 text-sm font-bold text-slate-700">${range}</div>
            <div class="flex-1 bg-slate-100 rounded-full h-8 overflow-hidden">
              <div class="distribution-bar ${color} h-full flex items-center justify-end pr-3 text-white font-bold text-sm" style="width: ${percentage}%">
                ${count}
              </div>
            </div>
          </div>
        `;
      });
    }

    function renderDetailedStats(stats) {
      const container = document.getElementById('detailedStats');
      container.innerHTML = '';

      const sections = [
        { title: 'Year Published', map: stats.yearCounts, icon: 'fa-calendar', color: 'blue' },
        { title: 'Player Count', map: stats.playerCounts, icon: 'fa-users', color: 'purple' },
        { title: 'Playing Time', map: stats.timeCounts, icon: 'fa-clock', color: 'rose' },
        { title: 'BGG Rating', map: stats.ratingCounts, icon: 'fa-star', color: 'amber' },
        { title: 'BGG Rank', map: stats.rankCounts, icon: 'fa-trophy', color: 'green' },
        { title: 'Top Mechanics', map: stats.mechanicCounts, icon: 'fa-cog', color: 'indigo', limit: 15 }
      ];

      sections.forEach(section => {
        let sorted = Array.from(section.map.entries()).sort((a, b) => b[1] - a[1]);
        if (section.limit) sorted = sorted.slice(0, section.limit);

        const html = `
          <div class="bg-white/95 backdrop-blur-sm rounded-xl shadow-lg border border-white/50 p-5">
            <div class="flex items-center gap-2 mb-4">
              <div class="bg-${section.color}-100 text-${section.color}-600 p-2 rounded-lg">
                <i class="fa-solid ${section.icon}"></i>
              </div>
              <h3 class="font-bold text-lg">${section.title}</h3>
            </div>
            <div class="space-y-2 max-h-80 overflow-y-auto">
              ${sorted.map(([key, count]) => `
                <div class="flex justify-between items-center py-1.5 px-2 hover:bg-${section.color}-50 rounded transition-colors">
                  <span class="text-sm font-semibold text-slate-700">${key}</span>
                  <span class="text-sm font-bold text-${section.color}-600">${count}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
        container.innerHTML += html;
      });
    }

    function incrementMap(map, key) {
      map.set(key, (map.get(key) || 0) + 1);
    }

    function groupYear(year) {
      if (year < 1980) return 'Pre-1980';
      if (year < 1990) return '1980-1989';
      if (year < 2000) return '1990-1999';
      if (year < 2010) return '2000-2009';
      if (year < 2015) return '2010-2014';
      if (year < 2020) return '2015-2019';
      if (year < 2023) return '2020-2022';
      if (year < 2025) return '2023-2024';
      return '2025+';
    }

    function groupTime(time) {
      if (time === 0) return 'Unknown';
      if (time <= 30) return '0-30 min';
      if (time <= 60) return '30-60 min';
      if (time <= 90) return '60-90 min';
      if (time <= 120) return '90-120 min';
      if (time <= 180) return '2-3 hours';
      return '3+ hours';
    }

    function groupWeight(weight) {
      if (weight < 1.5) return '1.0-1.5';
      if (weight < 2.0) return '1.5-2.0';
      if (weight < 2.5) return '2.0-2.5';
      if (weight < 3.0) return '2.5-3.0';
      if (weight < 3.5) return '3.0-3.5';
      if (weight < 4.0) return '3.5-4.0';
      if (weight < 4.5) return '4.0-4.5';
      return '4.5-5.0';
    }

    function groupRank(rank) {
      if (rank === 0) return 'Not Ranked';
      if (rank <= 100) return 'Top 100';
      if (rank <= 500) return '101-500';
      if (rank <= 1000) return '501-1000';
      if (rank <= 5000) return '1001-5000';
      return '5000+';
    }

    function updateProgress(message, percent) {
      document.getElementById('loadingStatus').textContent = message;
      document.getElementById('progressBar').style.width = percent + '%';
    }

    function showError(message) {
      document.getElementById('loadingSection').classList.add('hidden');
      document.getElementById('errorSection').classList.remove('hidden');
      document.getElementById('errorMessage').textContent = message;
      document.getElementById('fetchSection').classList.remove('hidden');
    }
  </script>

  <!-- Vercel Web Analytics -->
  <script type="module" src="analytics-init.js"></script>
</body>
</html>
