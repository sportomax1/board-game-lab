<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Ninja - Board Game Collection Clicker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: white;
            overflow: hidden; /* Hide scrollbars for the game area */
        }

        /* Game Area styling */
        #gameArea {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Game Card (Image) styling */
        .game-object {
            position: absolute;
            width: 80px;
            height: 100px;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -2px rgba(0, 0, 0, 0.5);
            transition: border-color 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-object img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none; /* Crucial for click-through */
        }

        /* Indicator for target games */
        .target-game {
            border-color: #f97316; /* Orange for target */
            box-shadow: 0 0 12px rgba(249, 115, 22, 0.6), 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        /* Loading Spinner */
        .loader {
            border: 4px solid #1e293b;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center">

    <div id="settingsModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 w-full max-w-lg rounded-2xl border border-slate-700 shadow-2xl overflow-hidden relative p-6 space-y-5">
            <h2 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-amber-400 mb-1 text-center">⚔️ Game Ninja Setup ⚔️</h2>
            <p class="text-slate-400 text-sm mb-6 text-center">Slice and dice your BGG collection!</p>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-2">BGG Username</label>
                <input type="text" id="usernameInput" value="sportomax" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-slate-600 transition-all">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="bg-slate-900/50 rounded-xl p-4 border border-slate-700/50">
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-3">Games to Put in Play</label>
                    <div id="playFilters" class="space-y-2">
                        <label class="flex items-center gap-3"><input type="checkbox" id="playFilterOwn" checked class="accent-violet-500"> <span class="text-sm">Own</span></label>
                        <label class="flex items-center gap-3"><input type="checkbox" id="playFilterWantToPlay" class="accent-violet-500"> <span class="text-sm">Want to Play</span></label>
                        <label class="flex items-center gap-3"><input type="checkbox" id="playFilterWantToBuy" class="accent-violet-500"> <span class="text-sm">Want to Buy</span></label>
                        <label class="flex items-center gap-3"><input type="checkbox" id="playFilterPrevOwned" class="accent-violet-500"> <span class="text-sm">Prev. Owned</span></label>
                    </div>
                </div>

                <div class="bg-slate-900/50 rounded-xl p-4 border border-slate-700/50">
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-3">Target Games (For Points)</label>
                    <div id="targetFilters" class="space-y-2">
                         <label class="flex items-center gap-3"><input type="radio" name="targetFilter" value="own" checked class="accent-orange-500"> <span class="text-sm">Own (+10)</span></label>
                        <label class="flex items-center gap-3"><input type="radio" name="targetFilter" value="wanttoplay" class="accent-orange-500"> <span class="text-sm">Want to Play (+10)</span></label>
                        <label class="flex items-center gap-3"><input type="radio" name="targetFilter" value="wanttobuy" class="accent-orange-500"> <span class="text-sm">Want to Buy (+10)</span></label>
                        <label class="flex items-center gap-3"><input type="radio" name="targetFilter" value="prevowned" class="accent-orange-500"> <span class="text-sm">Prev. Owned (+10)</span></label>
                    </div>
                </div>
            </div>

            <div class="bg-slate-900/50 rounded-xl p-4 border border-slate-700/50">
                <label class="block text-xs font-bold text-slate-400 uppercase mb-3">Game Speed / Pace</label>
                <div class="flex items-center gap-4">
                    <span class="text-sm text-slate-400">Slow</span>
                    <input type="range" id="gameSpeed" min="1" max="10" value="5" class="flex-1 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-red-500">
                    <span class="text-sm text-slate-400">Fast</span>
                </div>
                <p class="text-xs text-slate-500 mt-2 text-right">Higher speed means more games per second.</p>
            </div>

            <div id="statusMsg" class="text-center text-sm min-h-[20px] font-medium text-amber-400 break-words"></div>

            <button id="startGameBtn" class="w-full bg-gradient-to-r from-red-600 to-amber-600 hover:from-red-500 hover:to-amber-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-red-900/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                <span>Start Game</span>
            </button>
        </div>
    </div>

    <div id="gameArea" class="hidden">
        <div class="absolute top-4 left-4 p-3 bg-slate-800/70 backdrop-blur rounded-xl border border-slate-700 z-10">
            <p class="text-lg font-extrabold">Score: <span id="scoreDisplay" class="text-3xl text-yellow-400">0</span></p>
        </div>

        <div class="absolute top-4 right-4 p-3 bg-slate-800/70 backdrop-blur rounded-xl border border-slate-700 z-10">
            <p class="text-lg font-extrabold">Time: <span id="timerDisplay" class="text-3xl text-blue-400">60</span>s</p>
        </div>

        <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-4 z-10">
            <button id="pauseBtn" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-full font-semibold transition-colors">⏸ Pause</button>
            <button id="restartBtn" class="px-4 py-2 bg-red-600 hover:bg-red-500 rounded-full font-semibold transition-colors">🔄 Restart</button>
            <button id="settingsBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-full font-semibold transition-colors">⚙️ Settings</button>
        </div>

        <div class="absolute bottom-4 right-4 flex items-center gap-3 bg-slate-800/70 backdrop-blur rounded-xl border border-slate-700 px-4 py-2 z-10">
            <span class="text-xs font-bold text-slate-400 uppercase">Pace:</span>
            <input type="range" id="gamePaceSlider" min="1" max="10" value="5" class="w-32 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-red-500">
            <span id="paceValue" class="text-sm font-bold text-red-400 w-8 text-center">5</span>
        </div>

        <div id="gameOverModal" class="absolute inset-0 bg-black/80 flex items-center justify-center z-20 hidden">
            <div class="bg-slate-800 p-8 rounded-xl border border-slate-700 text-center space-y-4">
                <h3 class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-amber-400">GAME OVER!</h3>
                <p class="text-xl text-white">Final Score: <span id="finalScore" class="text-4xl font-black text-yellow-400">0</span></p>
                <button onclick="restartGame()" class="px-6 py-3 bg-red-600 hover:bg-red-500 rounded-lg font-bold">Play Again</button>
                <button onclick="showSettings()" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 rounded-lg font-bold ml-4">Change Settings</button>
            </div>
        </div>
    </div>

    <script>
        // --- Game State ---
        let allGamesData = []; // Full list of loaded games
        let targetFilter = 'own'; // Default target filter
        let score = 0;
        let timeRemaining = 60; // seconds
        let gameInterval = null;
        let spawnInterval = null;
        let gameIsPaused = true;
        let gameIsOver = false;
        let currentSpawnRate = 1200; // ms between spawns
        
        // --- DOM Elements ---
        const settingsModal = document.getElementById('settingsModal');
        const gameArea = document.getElementById('gameArea');
        const startGameBtn = document.getElementById('startGameBtn');
        const statusMsg = document.getElementById('statusMsg');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        const pauseBtn = document.getElementById('pauseBtn');
        const restartBtn = document.getElementById('restartBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const gameOverModal = document.getElementById('gameOverModal');
        const gamePaceSlider = document.getElementById('gamePaceSlider');
        const paceValue = document.getElementById('paceValue');

        // --- Physics Constants ---
        const GRAVITY = 0.2;
        const MAX_ROTATION = 720; // Full rotations during flight
        const FRICTION = 0.99; // Air friction

        // --- BGG API Helper ---
        async function fetchWithRetry(url, maxRetries = 3, delay = 1500) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url);
                    if (response.status === 202) {
                        console.log('BGG is processing (202), retrying...');
                        throw new Error('Collection is processing, please wait...');
                    }
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response;
                } catch (error) {
                    console.warn(`Attempt ${i+1} failed: ${error.message}`);
                    if (i < maxRetries - 1) {
                        statusMsg.textContent = `Retrying... (${i+1}/${maxRetries})`;
                        await new Promise(resolve => setTimeout(resolve, delay * (i + 1)));
                    } else {
                        throw error;
                    }
                }
            }
        }

        async function fetchGameCollection(username, playFilters) {
            let filters = playFilters.map(f => `${f}=1`);
            const filterStr = filters.length > 0 ? '&' + filters.join('&') : '&own=1';
            const safeUsername = encodeURIComponent(username);
            
            const response = await fetchWithRetry(`/api/bgg-helper?endpoint=collection&username=${safeUsername}${filterStr}`);
            
            const text = await response.text();
            const parser = new DOMParser();
            const xml = parser.parseFromString(text, 'text/xml');
            
            const items = xml.querySelectorAll('item[subtype="boardgame"], item[subtype="boardgameexpansion"]');
            
            if (items.length === 0) {
                const errorNode = xml.querySelector('error');
                if (errorNode) throw new Error(errorNode.textContent || 'BGG API returned an error');
                throw new Error('No games found matching filters. Try checking more status flags.');
            }

            const games = Array.from(items).map(item => {
                const name = item.querySelector('name')?.textContent || 'Unknown';
                const image = item.querySelector('image')?.textContent || item.querySelector('thumbnail')?.textContent || '';
                
                const statusNode = item.querySelector('status');
                const status = {
                    own: statusNode?.getAttribute('own') === '1',
                    prevowned: statusNode?.getAttribute('prevowned') === '1',
                    wanttoplay: statusNode?.getAttribute('wanttoplay') === '1',
                    wanttobuy: statusNode?.getAttribute('wanttobuy') === '1',
                };
                
                return {
                    id: item.getAttribute('objectid'),
                    name: name,
                    image: image,
                    status: status
                };
            }).filter(g => g.image);

            let uniqueGames = Array.from(new Map(games.map(g => [g.name, g])).values());

            if (uniqueGames.length > 100) {
                 uniqueGames = uniqueGames.sort(() => Math.random() - 0.5).slice(0, 100);
            }
            
            return uniqueGames;
        }

        // --- Game Logic ---
        
        function startGame() {
            if (allGamesData.length === 0) {
                statusMsg.textContent = "Error: No games loaded. Check username and filters.";
                return;
            }
            
            score = 0;
            timeRemaining = 60;
            gameIsPaused = false;
            gameIsOver = false;

            clearGameIntervals();
            document.querySelectorAll('.game-object').forEach(obj => obj.remove());
            
            const speedSetting = parseInt(document.getElementById('gameSpeed').value) || 5;
            currentSpawnRate = 1500 - (speedSetting * 100); // 1400ms (slowest) to 500ms (fastest)
            updatePaceDisplay(speedSetting);

            settingsModal.style.display = 'none';
            gameArea.classList.remove('hidden');
            gameOverModal.classList.add('hidden');

            updateScore(0);
            
            gameInterval = setInterval(updateGame, 30); // 30ms frame rate for smooth physics
            spawnInterval = setInterval(spawnGameObject, currentSpawnRate);
            
            gameIntervals.timer = setInterval(updateTimer, 1000);
        }

        const gameIntervals = {
            main: null,
            spawn: null,
            timer: null
        };

        function clearGameIntervals() {
            clearInterval(gameIntervals.main);
            clearInterval(gameIntervals.spawn);
            clearInterval(gameIntervals.timer);
        }

        function updatePaceDisplay(value) {
            paceValue.textContent = value;
        }

        function updateTimer() {
            if (gameIsPaused || gameIsOver) return;

            timeRemaining--;
            timerDisplay.textContent = timeRemaining;

            if (timeRemaining <= 0) {
                endGame();
            }
        }

        function spawnGameObject() {
            if (gameIsPaused || gameIsOver || allGamesData.length === 0) return;

            const gameIndex = Math.floor(Math.random() * allGamesData.length);
            const game = allGamesData[gameIndex];
            
            const obj = document.createElement('div');
            obj.className = 'game-object';
            obj.dataset.gameId = game.id;
            obj.dataset.isTarget = game.status[targetFilter] ? 'true' : 'false';
            
            if (obj.dataset.isTarget === 'true') {
                 obj.classList.add('target-game');
            }

            const img = document.createElement('img');
            img.src = `/api/image-proxy?url=${encodeURIComponent(game.image)}`;
            img.alt = game.name;
            obj.appendChild(img);

            // Spawn from bottom with parabolic arc
            const gameAreaWidth = gameArea.offsetWidth;
            const gameAreaHeight = gameArea.offsetHeight;
            const cardSize = 80;
            
            // Spawn from bottom, random horizontal position
            const startX = Math.random() * (gameAreaWidth - cardSize);
            const startY = gameAreaHeight - 20; // Start just below visible area
            
            obj.style.left = `${startX}px`;
            obj.style.top = `${startY}px`;
            
            // Calculate launch velocity for arc (like Fruit Ninja)
            const speedMultiplier = (parseInt(document.getElementById('gameSpeed').value) || 5) / 5;
            const angle = 45 + (Math.random() - 0.5) * 30; // 30-60 degree launch angle
            const speed = 8 * speedMultiplier; // Launch speed
            
            const radians = (angle * Math.PI) / 180;
            obj.velocity = {
                x: speed * Math.cos(radians) * ((Math.random() - 0.5) < 0 ? -1 : 1), // Random left/right
                y: -speed * Math.sin(radians) // Negative = upward
            };
            
            // Rotation
            obj.rotation = 0;
            obj.rotationVelocity = (Math.random() - 0.5) * 15; // -7.5 to 7.5 deg/frame
            
            obj.addEventListener('click', handleGameClick);
            gameArea.appendChild(obj);
        }

        function updateGame() {
            if (gameIsPaused || gameIsOver) return;

            const gameObjects = document.querySelectorAll('.game-object');
            const gameAreaHeight = gameArea.offsetHeight;
            const gameAreaWidth = gameArea.offsetWidth;

            gameObjects.forEach(obj => {
                // Apply gravity
                obj.velocity.y += GRAVITY;
                
                // Apply friction
                obj.velocity.x *= FRICTION;
                obj.velocity.y *= FRICTION;
                
                // Update position
                let newX = parseFloat(obj.style.left) + obj.velocity.x;
                let newY = parseFloat(obj.style.top) + obj.velocity.y;
                
                // Bounce off walls
                if (newX < 0 || newX > gameAreaWidth - 80) {
                    obj.velocity.x *= -0.8; // Dampen bounce
                    newX = Math.max(0, Math.min(newX, gameAreaWidth - 80));
                }
                
                // Bounce off bottom
                if (newY > gameAreaHeight - 100) {
                    obj.velocity.y *= -0.6; // Dampen bounce
                    newY = gameAreaHeight - 100;
                }
                
                // Update rotation
                obj.rotation += obj.rotationVelocity;
                
                obj.style.left = `${newX}px`;
                obj.style.top = `${newY}px`;
                obj.style.transform = `rotate(${obj.rotation}deg)`;

                // Check if object has left the screen
                if (newY > gameAreaHeight + 50 || newX < -100 || newX > gameAreaWidth + 100) {
                    if (obj.dataset.isTarget === 'true') {
                        updateScore(-20, 'miss');
                    }
                    obj.remove();
                }
            });
        }

        function handleGameClick(e) {
            if (gameIsPaused || gameIsOver) return;

            const obj = e.currentTarget;
            const isTarget = obj.dataset.isTarget === 'true';

            if (isTarget) {
                updateScore(10, 'hit');
            } else {
                updateScore(-10, 'miss');
            }
            
            // Fling away effect
            obj.style.transition = 'all 0.3s ease-out';
            obj.style.transform = 'scale(0.3) rotate(720deg)';
            obj.style.opacity = '0';

            setTimeout(() => {
                obj.remove();
            }, 300);
        }
        
        function updateScore(points, type = 'normal') {
            score += points;
            scoreDisplay.textContent = score;

            const feedback = document.createElement('span');
            feedback.textContent = (points > 0 ? '+' : '') + points;
            feedback.className = `absolute text-xl font-bold transition-all duration-500 opacity-0 transform translate-y-0 ${points > 0 ? 'text-green-400' : 'text-red-400'}`;
            
            const position = scoreDisplay.getBoundingClientRect();
            feedback.style.left = `${position.left + (position.width / 2)}px`;
            feedback.style.top = `${position.top}px`;
            
            document.body.appendChild(feedback);

            setTimeout(() => {
                feedback.style.opacity = '1';
                feedback.style.transform = 'translateY(-30px)';
            }, 10);
            
            setTimeout(() => {
                feedback.style.opacity = '0';
                feedback.remove();
            }, 500);
        }

        function togglePause() {
            gameIsPaused = !gameIsPaused;
            pauseBtn.textContent = gameIsPaused ? '▶ Resume' : '⏸ Pause';
        }

        function endGame() {
            gameIsOver = true;
            clearGameIntervals();
            
            document.querySelectorAll('.game-object').forEach(obj => {
                obj.style.animationPlayState = 'paused';
            });
            
            document.getElementById('finalScore').textContent = score;
            gameOverModal.classList.remove('hidden');
        }
        
        function restartGame() {
            startGame();
        }

        function showSettings() {
            clearGameIntervals();
            gameArea.classList.add('hidden');
            settingsModal.style.display = 'flex';
            gameOverModal.classList.add('hidden');
        }

        // --- Event Handlers ---
        
        startGameBtn.addEventListener('click', async () => {
            const username = document.getElementById('usernameInput').value.trim();
            if (!username) {
                statusMsg.textContent = "Please enter a username";
                return;
            }

            const playCheckboxes = document.querySelectorAll('#playFilters input:checked');
            const playFilters = Array.from(playCheckboxes).map(cb => cb.id.replace('playFilter', '').toLowerCase());
            
            targetFilter = document.querySelector('#targetFilters input:checked').value;
            
            if (playFilters.length === 0) {
                statusMsg.textContent = "Please select at least one filter for 'Games to Put in Play'.";
                return;
            }

            if (!playFilters.includes(targetFilter)) {
                 statusMsg.textContent = `Warning: Your target filter ('${targetFilter}') is not selected for 'Games to Put in Play'. You might only see non-targets!`;
            }

            startGameBtn.innerHTML = '<span class="loader"></span> Loading Games...';
            startGameBtn.disabled = true;
            statusMsg.textContent = "";

            try {
                const games = await fetchGameCollection(username, playFilters);
                
                allGamesData = games;
                statusMsg.textContent = `Loaded ${games.length} games. Starting...`;
                
                setTimeout(() => {
                    startGame();
                    startGameBtn.innerHTML = '<span>Start Game</span>';
                    startGameBtn.disabled = false;
                }, 1000);
                
            } catch (err) {
                console.error(err);
                
                let msg = err.message;
                if (msg.includes('HTTP error') || msg.includes('Failed to fetch')) msg = "Network or API Error. Check connection or username.";
                
                statusMsg.textContent = msg;
                startGameBtn.innerHTML = '<span>Try Again</span>';
                startGameBtn.disabled = false;
            }
        });
        
        pauseBtn.addEventListener('click', togglePause);
        restartBtn.addEventListener('click', restartGame);
        settingsBtn.addEventListener('click', showSettings);
        
        // Dynamic pace control during gameplay
        gamePaceSlider.addEventListener('input', (e) => {
            const newPace = parseInt(e.target.value);
            updatePaceDisplay(newPace);
            
            if (!gameIsPaused && !gameIsOver) {
                // Update spawn rate in real-time
                clearInterval(spawnInterval);
                currentSpawnRate = 1500 - (newPace * 100);
                spawnInterval = setInterval(spawnGameObject, currentSpawnRate);
                
                // Update velocity of existing objects
                document.querySelectorAll('.game-object').forEach(obj => {
                    const speedMultiplier = newPace / 5;
                    obj.velocity.x *= speedMultiplier / (parseInt(document.getElementById('gameSpeed').value) || 5 / 5);
                });
            }
        });

    </script>
</body>
</html>
