<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Ninja - Board Game Collection Clicker</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>⚔️</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: white;
            overflow: hidden; /* Hide scrollbars for the game area */
        }

        /* Game Area styling */
        #gameArea {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Game Card (Image) styling */
        .game-object {
            position: absolute;
            width: 80px;
            height: 100px;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -2px rgba(0, 0, 0, 0.5);
            transition: border-color 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-object img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none; /* Crucial for click-through */
        }

        /* Indicator for target games */
        .target-game {
            border-color: #f97316; /* Orange for target */
            box-shadow: 0 0 12px rgba(249, 115, 22, 0.6), 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        /* Loading Spinner */
        .loader {
            border: 4px solid #1e293b;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center">

    <div id="settingsModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 w-full max-w-lg rounded-2xl border border-slate-700 shadow-2xl overflow-hidden relative p-6 space-y-5">
            <h2 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-amber-400 mb-1 text-center">⚔️ Game Ninja Setup ⚔️</h2>
            <p class="text-slate-400 text-sm mb-6 text-center">Slice and dice your BGG collection!</p>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-2">BGG Username</label>
                <input type="text" id="usernameInput" value="sportomax" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-slate-600 transition-all">
            </div>

            <div class="bg-slate-900/50 rounded-xl p-4 border border-slate-700/50">
                <label class="block text-xs font-bold text-slate-400 uppercase mb-3">📋 Collections to Show (Select All)</label>
                <div id="collectionFilters" class="space-y-2">
                    <label class="flex items-center gap-3"><input type="checkbox" name="collectionFilter" value="own" checked class="accent-blue-500"> <span class="text-sm">Own</span></label>
                    <label class="flex items-center gap-3"><input type="checkbox" name="collectionFilter" value="wanttoplay" checked class="accent-blue-500"> <span class="text-sm">Want to Play</span></label>
                    <label class="flex items-center gap-3"><input type="checkbox" name="collectionFilter" value="wanttobuy" checked class="accent-blue-500"> <span class="text-sm">Want to Buy</span></label>
                    <label class="flex items-center gap-3"><input type="checkbox" name="collectionFilter" value="prevowned" checked class="accent-blue-500"> <span class="text-sm">Prev. Owned</span></label>
                </div>
            </div>

            <div class="bg-slate-900/50 rounded-xl p-4 border border-slate-700/50">
                <label class="block text-xs font-bold text-slate-400 uppercase mb-3">⭐ Scoring (Positive Points)</label>
                <div id="scoringFilters" class="space-y-2">
                    <label class="flex items-center gap-3"><input type="checkbox" name="scoringFilter" value="own" checked class="accent-orange-500"> <span class="text-sm">Own (+10)</span></label>
                    <label class="flex items-center gap-3"><input type="checkbox" name="scoringFilter" value="wanttoplay" class="accent-orange-500"> <span class="text-sm">Want to Play (+10)</span></label>
                    <label class="flex items-center gap-3"><input type="checkbox" name="scoringFilter" value="wanttobuy" class="accent-orange-500"> <span class="text-sm">Want to Buy (+10)</span></label>
                    <label class="flex items-center gap-3"><input type="checkbox" name="scoringFilter" value="prevowned" class="accent-orange-500"> <span class="text-sm">Prev. Owned (+10)</span></label>
                </div>
                <p class="text-xs text-slate-500 mt-3">Games in other collections score -10 points.</p>
            </div>

            <div class="bg-slate-900/50 rounded-xl p-4 border border-slate-700/50">
                <label class="block text-xs font-bold text-slate-400 uppercase mb-3">Game Speed / Pace</label>
                <div class="flex items-center gap-4">
                    <span class="text-sm text-slate-400">Slow</span>
                    <input type="range" id="gameSpeed" min="1" max="10" value="5" class="flex-1 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-red-500">
                    <span class="text-sm text-slate-400">Fast</span>
                </div>
                <p class="text-xs text-slate-500 mt-2 text-right">Higher speed means more games per second.</p>
            </div>

            <div id="statusMsg" class="text-center text-sm min-h-[20px] font-medium text-amber-400 break-words"></div>

            <button id="startGameBtn" class="w-full bg-gradient-to-r from-red-600 to-amber-600 hover:from-red-500 hover:to-amber-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-red-900/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                <span>Start Game</span>
            </button>
        </div>
    </div>

    <div id="gameArea" class="hidden">
        <div class="absolute top-4 left-4 p-3 bg-slate-800/70 backdrop-blur rounded-xl border border-slate-700 z-10">
            <p class="text-lg font-extrabold">Score: <span id="scoreDisplay" class="text-3xl text-yellow-400">0</span></p>
        </div>

        <div class="absolute top-4 right-4 p-3 bg-slate-800/70 backdrop-blur rounded-xl border border-slate-700 z-10">
            <p class="text-lg font-extrabold">Time: <span id="timerDisplay" class="text-3xl text-blue-400">60</span>s</p>
        </div>

        <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-4 z-10">
            <button id="pauseBtn" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-full font-semibold transition-colors">⏸ Pause</button>
            <button id="restartBtn" class="px-4 py-2 bg-red-600 hover:bg-red-500 rounded-full font-semibold transition-colors">🔄 Restart</button>
            <button id="settingsBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-full font-semibold transition-colors">⚙️ Settings</button>
        </div>

        <div class="absolute bottom-4 right-4 flex items-center gap-3 bg-slate-800/70 backdrop-blur rounded-xl border border-slate-700 px-4 py-2 z-10">
            <span class="text-xs font-bold text-slate-400 uppercase">Pace:</span>
            <input type="range" id="gamePaceSlider" min="1" max="10" value="5" class="w-32 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-red-500">
            <span id="paceValue" class="text-sm font-bold text-red-400 w-8 text-center">5</span>
        </div>

        <div id="gameOverModal" class="absolute inset-0 bg-black/80 flex items-center justify-center z-20 hidden">
            <div class="bg-slate-800 p-8 rounded-xl border border-slate-700 text-center space-y-4">
                <h3 class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-amber-400">GAME OVER!</h3>
                <p class="text-xl text-white">Final Score: <span id="finalScore" class="text-4xl font-black text-yellow-400">0</span></p>
                <button onclick="restartGame()" class="px-6 py-3 bg-red-600 hover:bg-red-500 rounded-lg font-bold">Play Again</button>
                <button onclick="showSettings()" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 rounded-lg font-bold ml-4">Change Settings</button>
            </div>
        </div>
    </div>

    <script>
        // --- Game State ---
        let allGamesData = []; // Full list of loaded games
        let collectionFilters = ['own', 'wanttoplay', 'wanttobuy', 'prevowned']; // Default: show all
        let scoringFilters = ['own']; // Default: only own gives positive points
        let score = 0;
        let timeRemaining = 60; // seconds
        let gameInterval = null;
        let spawnInterval = null;
        let gameIsPaused = true;
        let gameIsOver = false;
        let currentSpawnRate = 1200; // ms between spawns
        
        // --- DOM Elements ---
        const settingsModal = document.getElementById('settingsModal');
        const gameArea = document.getElementById('gameArea');
        const startGameBtn = document.getElementById('startGameBtn');
        const statusMsg = document.getElementById('statusMsg');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        const pauseBtn = document.getElementById('pauseBtn');
        const restartBtn = document.getElementById('restartBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const gameOverModal = document.getElementById('gameOverModal');
        const gamePaceSlider = document.getElementById('gamePaceSlider');
        const paceValue = document.getElementById('paceValue');

        // --- Physics Constants ---
        const GRAVITY = 0.2;
        const MAX_ROTATION = 720; // Full rotations during flight
        const FRICTION = 0.99; // Air friction

        // --- BGG API Helper ---
        async function fetchWithRetry(url, maxRetries = 4, delayStages = [1000, 3000, 5000, 10000]) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const displayUrl = url.length > 80 ? url.substring(0, 77) + '...' : url;
                    statusMsg.textContent = `🔗 API Call: ${displayUrl}`;
                    console.log(`Attempt ${i+1}/${maxRetries}: ${url}`);
                    
                    const response = await fetch(url);
                    if (response.status === 202) {
                        const delaySeconds = delayStages[Math.min(i, delayStages.length - 1)] / 1000;
                        statusMsg.textContent = `⏳ BGG Processing (202)... Retry in ${delaySeconds}s`;
                        console.log(`BGG is processing (202), retrying in ${delaySeconds}s...`);
                        throw new Error('Collection is processing, please wait...');
                    }
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    statusMsg.textContent = `✅ API Response received`;
                    return response;
                } catch (error) {
                    console.warn(`Attempt ${i+1} failed: ${error.message}`);
                    if (i < maxRetries - 1) {
                        const delay = delayStages[i];
                        const delaySeconds = delay / 1000;
                        statusMsg.textContent = `⚠️ Attempt ${i+1} failed. Retrying in ${delaySeconds}s... (${i+1}/${maxRetries})`;
                        await new Promise(resolve => setTimeout(resolve, delay));
                    } else {
                        throw error;
                    }
                }
            }
        }

        async function fetchGameCollection(username) {
            const safeUsername = encodeURIComponent(username);
            
            // Build array of selected collections
            let selectedCollections = [];
            let filterNames = [];
            if (collectionFilters.includes('own')) { selectedCollections.push('own'); filterNames.push('Own'); }
            if (collectionFilters.includes('wanttoplay')) { selectedCollections.push('wanttoplay'); filterNames.push('Want to Play'); }
            if (collectionFilters.includes('wanttobuy')) { selectedCollections.push('wanttobuy'); filterNames.push('Want to Buy'); }
            if (collectionFilters.includes('prevowned')) { selectedCollections.push('prevowned'); filterNames.push('Prev. Owned'); }
            
            // If no filters selected, default to all
            if (selectedCollections.length === 0) {
                selectedCollections = ['own', 'wanttoplay', 'wanttobuy', 'prevowned'];
                filterNames = ['Own', 'Want to Play', 'Want to Buy', 'Prev. Owned'];
            }
            
            statusMsg.textContent = `🔍 Fetching collections: ${filterNames.join(', ')}...`;
            
            // Fetch each collection separately and merge (OR logic)
            const allGamesMap = new Map(); // Use Map to prevent duplicates
            let totalFetched = 0;
            
            for (let i = 0; i < selectedCollections.length; i++) {
                const collectionType = selectedCollections[i];
                const collectionName = filterNames[i];
                
                try {
                    statusMsg.textContent = `📡 Fetching ${collectionName}... (${i+1}/${selectedCollections.length})`;
                    
                    // Build URL for SINGLE collection type
                    const url = `/api/bgg-helper?endpoint=collection&username=${safeUsername}&${collectionType}=1&stats=1`;
                    console.log(`Fetching ${collectionName}:`, url);
                    
                    const response = await fetchWithRetry(url);
                    const text = await response.text();
                    console.log(`${collectionName} API Response:`, text.substring(0, 300));
                    
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(text, 'text/xml');
                    
                    // Check for parse errors
                    if (xml.documentElement.nodeName === 'parsererror') {
                        console.error(`XML Parse Error for ${collectionName}:`, xml.documentElement.textContent);
                        continue; // Skip this collection and try the next
                    }
                    
                    // Check for BGG error responses
                    const errorNode = xml.querySelector('error');
                    if (errorNode) {
                        console.warn(`BGG Error for ${collectionName}:`, errorNode.textContent);
                        continue; // Skip this collection and try the next
                    }
                    
                    // Get all items from this collection
                    const items = xml.querySelectorAll('item');
                    console.log(`Found ${items.length} items in ${collectionName}`);
                    
                    // Add games to map (prevents duplicates across collections)
                    Array.from(items).forEach(item => {
                        const name = item.querySelector('name')?.textContent || 'Unknown';
                        const image = item.querySelector('image')?.textContent || item.querySelector('thumbnail')?.textContent || '';
                        
                        if (image) { // Only keep games with images
                            const statusNode = item.querySelector('status');
                            const status = {
                                own: statusNode?.getAttribute('own') === '1',
                                prevowned: statusNode?.getAttribute('prevowned') === '1',
                                wanttoplay: statusNode?.getAttribute('wanttoplay') === '1',
                                wanttobuy: statusNode?.getAttribute('wanttobuy') === '1',
                            };
                            
                            const gameKey = name; // Use name as unique key
                            if (!allGamesMap.has(gameKey)) {
                                allGamesMap.set(gameKey, {
                                    id: item.getAttribute('objectid'),
                                    name: name,
                                    image: image,
                                    status: status
                                });
                            }
                        }
                    });
                    
                    totalFetched += items.length;
                    
                } catch (err) {
                    console.error(`Error fetching ${collectionName}:`, err);
                    // Continue to next collection instead of failing
                }
                
                // Small delay between requests to avoid overwhelming API
                if (i < selectedCollections.length - 1) {
                    await new Promise(resolve => setTimeout(resolve, 500));
                }
            }
            
            if (allGamesMap.size === 0) {
                throw new Error('No games found in selected collections. Try different filters or check your username.');
            }
            
            // Convert map to array
            const uniqueGames = Array.from(allGamesMap.values());
            console.log(`Fetched ${totalFetched} total items, ${uniqueGames.length} unique games with images`);
            statusMsg.textContent = `🎮 Loaded ${uniqueGames.length} unique games from ${selectedCollections.length} collection(s)!`;
            
            return uniqueGames;
        }

        // --- Game Logic ---
        
        function startGame() {
            if (allGamesData.length === 0) {
                statusMsg.textContent = "Error: No games loaded. Check username and filters.";
                return;
            }
            
            score = 0;
            timeRemaining = 60;
            gameIsPaused = false;
            gameIsOver = false;

            clearGameIntervals();
            document.querySelectorAll('.game-object').forEach(obj => obj.remove());
            
            const speedSetting = parseInt(document.getElementById('gameSpeed').value) || 5;
            currentSpawnRate = 1500 - (speedSetting * 100); // 1400ms (slowest) to 500ms (fastest)
            updatePaceDisplay(speedSetting);

            settingsModal.style.display = 'none';
            gameArea.classList.remove('hidden');
            gameOverModal.classList.add('hidden');

            updateScore(0);
            
            gameInterval = setInterval(updateGame, 30); // 30ms frame rate for smooth physics
            spawnInterval = setInterval(spawnGameObject, currentSpawnRate);
            
            gameIntervals.timer = setInterval(updateTimer, 1000);
        }

        const gameIntervals = {
            main: null,
            spawn: null,
            timer: null
        };

        function clearGameIntervals() {
            clearInterval(gameIntervals.main);
            clearInterval(gameIntervals.spawn);
            clearInterval(gameIntervals.timer);
        }

        function updatePaceDisplay(value) {
            paceValue.textContent = value;
        }

        function updateTimer() {
            if (gameIsPaused || gameIsOver) return;

            timeRemaining--;
            timerDisplay.textContent = timeRemaining;

            if (timeRemaining <= 0) {
                endGame();
            }
        }

        function spawnGameObject() {
            if (gameIsPaused || gameIsOver || allGamesData.length === 0) return;

            const gameIndex = Math.floor(Math.random() * allGamesData.length);
            const game = allGamesData[gameIndex];
            
            // Check if this game should score positively
            const isPositiveScore = scoringFilters.some(filter => game.status[filter]);
            
            const obj = document.createElement('div');
            obj.className = 'game-object';
            obj.dataset.gameId = game.id;
            obj.dataset.isTarget = isPositiveScore ? 'true' : 'false';
            
            if (obj.dataset.isTarget === 'true') {
                 obj.classList.add('target-game');
            }

            const img = document.createElement('img');
            img.src = `/api/image-proxy?url=${encodeURIComponent(game.image)}`;
            img.alt = game.name;
            obj.appendChild(img);

            const gameAreaWidth = gameArea.offsetWidth;
            const gameAreaHeight = gameArea.offsetHeight;
            const cardSize = 80;
            
            // Fruit Ninja style: spawn from bottom OR sides
            const spawnSide = Math.random();
            let startX, startY, velocityX, velocityY;
            
            const speedMultiplier = (parseInt(document.getElementById('gameSpeed').value) || 5) / 5;
            const baseSpeed = 12 + Math.random() * 8; // 12-20 speed variation
            
            if (spawnSide < 0.6) {
                // Spawn from BOTTOM (60% chance) - like fruit ninja
                startX = Math.random() * (gameAreaWidth - cardSize);
                startY = gameAreaHeight + 50; // Start below screen
                
                // Launch upward at angle
                const angle = 60 + Math.random() * 40; // 60-100 degrees (mostly vertical)
                const radians = (angle * Math.PI) / 180;
                velocityX = baseSpeed * speedMultiplier * Math.cos(radians) * (Math.random() > 0.5 ? 1 : -1);
                velocityY = -baseSpeed * speedMultiplier * Math.sin(radians); // Negative = upward
                
            } else if (spawnSide < 0.8) {
                // Spawn from LEFT side (20% chance)
                startX = -100;
                startY = gameAreaHeight * 0.3 + Math.random() * (gameAreaHeight * 0.4);
                
                const angle = 30 + Math.random() * 30; // 30-60 degrees upward
                const radians = (angle * Math.PI) / 180;
                velocityX = baseSpeed * speedMultiplier * Math.cos(radians);
                velocityY = -baseSpeed * speedMultiplier * Math.sin(radians);
                
            } else {
                // Spawn from RIGHT side (20% chance)
                startX = gameAreaWidth + 100;
                startY = gameAreaHeight * 0.3 + Math.random() * (gameAreaHeight * 0.4);
                
                const angle = 30 + Math.random() * 30; // 30-60 degrees upward
                const radians = (angle * Math.PI) / 180;
                velocityX = -baseSpeed * speedMultiplier * Math.cos(radians);
                velocityY = -baseSpeed * speedMultiplier * Math.sin(radians);
            }
            
            obj.style.left = `${startX}px`;
            obj.style.top = `${startY}px`;
            
            obj.velocity = { x: velocityX, y: velocityY };
            
            // Spinning rotation like fruit ninja
            obj.rotation = Math.random() * 360;
            obj.rotationVelocity = (Math.random() - 0.5) * 20; // -10 to 10 deg/frame
            
            obj.addEventListener('click', handleGameClick);
            gameArea.appendChild(obj);
        }

        function updateGame() {
            if (gameIsPaused || gameIsOver) return;

            const gameObjects = document.querySelectorAll('.game-object');
            const gameAreaHeight = gameArea.offsetHeight;
            const gameAreaWidth = gameArea.offsetWidth;

            gameObjects.forEach(obj => {
                // Apply gravity (Fruit Ninja physics)
                obj.velocity.y += GRAVITY * 1.2; // Slightly stronger gravity
                
                // Less friction for more arc-like motion
                obj.velocity.x *= 0.995;
                
                // Update position
                let newX = parseFloat(obj.style.left) + obj.velocity.x;
                let newY = parseFloat(obj.style.top) + obj.velocity.y;
                
                // Update rotation (continuous spin)
                obj.rotation += obj.rotationVelocity;
                
                obj.style.left = `${newX}px`;
                obj.style.top = `${newY}px`;
                obj.style.transform = `rotate(${obj.rotation}deg)`;

                // Remove when off-screen (falls below or exits sides)
                if (newY > gameAreaHeight + 100 || newX < -150 || newX > gameAreaWidth + 150 || newY < -150) {
                    if (obj.dataset.isTarget === 'true' && newY > gameAreaHeight + 100) {
                        // Only penalize targets that fall below (missed)
                        updateScore(-20, 'miss');
                    }
                    obj.remove();
                }
            });
        }

        function handleGameClick(e) {
            if (gameIsPaused || gameIsOver) return;

            const obj = e.currentTarget;
            const isTarget = obj.dataset.isTarget === 'true';

            if (isTarget) {
                updateScore(10, 'hit');
            } else {
                updateScore(-10, 'miss');
            }
            
            // Fruit Ninja slice effect - split and fly away
            const rect = obj.getBoundingClientRect();
            
            // Create two halves
            for (let i = 0; i < 2; i++) {
                const half = obj.cloneNode(true);
                half.style.clipPath = i === 0 ? 'polygon(0 0, 100% 0, 50% 100%, 0 100%)' : 'polygon(50% 0, 100% 0, 100% 100%, 50% 100%)';
                half.style.transition = 'all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                half.style.left = obj.style.left;
                half.style.top = obj.style.top;
                
                gameArea.appendChild(half);
                
                // Animate halves flying apart
                setTimeout(() => {
                    const angle = i === 0 ? -30 : 30;
                    half.style.transform = `translate(${i === 0 ? -100 : 100}px, 200px) rotate(${angle * 10}deg) scale(0.5)`;
                    half.style.opacity = '0';
                }, 10);
                
                setTimeout(() => half.remove(), 650);
            }
            
            // Remove original
            obj.remove();
        }
        
        function updateScore(points, type = 'normal') {
            score += points;
            scoreDisplay.textContent = score;

            const feedback = document.createElement('span');
            feedback.textContent = (points > 0 ? '+' : '') + points;
            feedback.className = `absolute text-xl font-bold transition-all duration-500 opacity-0 transform translate-y-0 ${points > 0 ? 'text-green-400' : 'text-red-400'}`;
            
            const position = scoreDisplay.getBoundingClientRect();
            feedback.style.left = `${position.left + (position.width / 2)}px`;
            feedback.style.top = `${position.top}px`;
            
            document.body.appendChild(feedback);

            setTimeout(() => {
                feedback.style.opacity = '1';
                feedback.style.transform = 'translateY(-30px)';
            }, 10);
            
            setTimeout(() => {
                feedback.style.opacity = '0';
                feedback.remove();
            }, 500);
        }

        function togglePause() {
            gameIsPaused = !gameIsPaused;
            pauseBtn.textContent = gameIsPaused ? '▶ Resume' : '⏸ Pause';
        }

        function endGame() {
            gameIsOver = true;
            clearGameIntervals();
            
            document.querySelectorAll('.game-object').forEach(obj => {
                obj.style.animationPlayState = 'paused';
            });
            
            document.getElementById('finalScore').textContent = score;
            gameOverModal.classList.remove('hidden');
        }
        
        function restartGame() {
            startGame();
        }

        function showSettings() {
            clearGameIntervals();
            gameArea.classList.add('hidden');
            settingsModal.style.display = 'flex';
            gameOverModal.classList.add('hidden');
        }

        // --- Event Handlers ---
        
        startGameBtn.addEventListener('click', async () => {
            const username = document.getElementById('usernameInput').value.trim();
            if (!username) {
                statusMsg.textContent = "Please enter a username";
                return;
            }

            // Get collection filters (which collections to show)
            collectionFilters = Array.from(document.querySelectorAll('#collectionFilters input:checked')).map(el => el.value);
            if (collectionFilters.length === 0) {
                statusMsg.textContent = "Select at least one collection";
                return;
            }

            // Get scoring filters (which collections give positive points)
            scoringFilters = Array.from(document.querySelectorAll('#scoringFilters input:checked')).map(el => el.value);
            if (scoringFilters.length === 0) {
                statusMsg.textContent = "Select at least one collection for positive scoring";
                return;
            }

            startGameBtn.innerHTML = '<span class="loader"></span> Initializing...';
            startGameBtn.disabled = true;
            statusMsg.textContent = `👤 Username: ${username}`;

            try {
                const games = await fetchGameCollection(username);
                
                allGamesData = games;
                statusMsg.textContent = `✨ Ready! ${games.length} games loaded. Starting in 1s...`;
                
                setTimeout(() => {
                    startGame();
                    startGameBtn.innerHTML = '<span>Start Game</span>';
                    startGameBtn.disabled = false;
                }, 1000);
                
            } catch (err) {
                console.error(err);
                
                let msg = err.message;
                if (msg.includes('HTTP error') || msg.includes('Failed to fetch')) msg = "Network or API Error. Check connection or username.";
                
                statusMsg.textContent = `❌ ${msg}`;
                startGameBtn.innerHTML = '<span>Try Again</span>';
                startGameBtn.disabled = false;
            }
        });
        
        pauseBtn.addEventListener('click', togglePause);
        restartBtn.addEventListener('click', restartGame);
        settingsBtn.addEventListener('click', showSettings);
        
        // Dynamic pace control during gameplay
        gamePaceSlider.addEventListener('input', (e) => {
            const newPace = parseInt(e.target.value);
            updatePaceDisplay(newPace);
            
            if (!gameIsPaused && !gameIsOver) {
                // Update spawn rate in real-time
                clearInterval(spawnInterval);
                currentSpawnRate = 1500 - (newPace * 100);
                spawnInterval = setInterval(spawnGameObject, currentSpawnRate);
                
                // Update velocity of existing objects
                document.querySelectorAll('.game-object').forEach(obj => {
                    const speedMultiplier = newPace / 5;
                    obj.velocity.x *= speedMultiplier / (parseInt(document.getElementById('gameSpeed').value) || 5 / 5);
                });
            }
        });

    </script>
    <!-- Vercel Web Analytics -->
    <script type="module" src="analytics-init.js"></script>

</body>
