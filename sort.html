<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>BGG Collection Sorter</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧐</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    .game-card { transition: all 0.2s ease; }
    .game-card:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.08); }
    .skeleton { animation: pulse 2s cubic-bezier(0.4,0,0.6,1) infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  </style>
</head>
<body class="pb-20">

  <header class="sticky top-0 z-30 w-full bg-white/80 backdrop-blur-md border-b px-4 py-3 shadow-sm">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 text-white p-2 rounded-lg"><i class="fa-solid fa-sort"></i></div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">Collection Sorter</h1>
          <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Sort Owned Games</p>
        </div>
      </div>
      <div id="statsBox" class="text-right">
        <div class="text-2xl font-bold text-indigo-600" id="gameCount">0</div>
        <div class="text-[10px] text-slate-500 uppercase font-bold">Games</div>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 space-y-4">

    <!-- Fetch Section -->
    <div id="fetchSection" class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
      <h2 class="text-lg font-bold mb-3">Load Collection</h2>
      <div class="flex gap-2">
        <input id="username" type="text" value="sportomax" placeholder="BGG username" class="flex-1 px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
        <button onclick="fetchCollection()" id="fetchBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg font-bold transition">Load</button>
      </div>
    </div>

    <!-- Loading Section -->
    <div id="loadingSection" class="hidden">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
        <div class="flex items-center justify-center gap-3 mb-3">
          <i class="fa-solid fa-circle-notch fa-spin text-indigo-600 text-2xl"></i>
          <span class="font-bold text-slate-700" id="loadingStatus">Loading collection...</span>
        </div>
        <div class="bg-slate-100 rounded-full h-2 overflow-hidden">
          <div id="progressBar" class="bg-indigo-600 h-full transition-all duration-300" style="width:0%"></div>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div id="controlsSection" class="hidden bg-white rounded-2xl shadow-sm border border-slate-100 p-4 space-y-3">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div>
                <label class="text-xs font-bold text-slate-500">Primary Sort</label>
                <div class="flex">
                    <select id="sortSelect" onchange="sortGames()" class="flex-1 px-3 py-2 rounded-l-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none text-sm bg-white font-bold"></select>
                    <button id="sortDirBtn" onclick="toggleSortDir()" class="px-3 py-2 rounded-r-lg border border-l-0 border-slate-200 bg-white text-sm">▼</button>
                </div>
            </div>
            <div>
                <label class="text-xs font-bold text-slate-500">Tiebreaker Sort</label>
                <div class="flex">
                    <select id="tiebreakerSortSelect" onchange="sortGames()" class="flex-1 px-3 py-2 rounded-l-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none text-sm bg-white font-bold"></select>
                    <button id="tiebreakerSortDirBtn" onclick="toggleTiebreakerSortDir()" class="px-3 py-2 rounded-r-lg border border-l-0 border-slate-200 bg-white text-sm">▼</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Games Grid -->
    <div id="gamesGrid" class="hidden grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 gap-4"></div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-12">
      <i class="fa-solid fa-inbox text-slate-300 text-5xl mb-4 block"></i>
      <p class="text-slate-500 font-semibold">No games found</p>
    </div>

  </main>

<script>
const API_BASE = '/api/bgg-helper';
let allGames = [];
let displayedGames = [];
let sortAsc = false;
let tiebreakerSortAsc = false;

const sortFields = [
    { value: 'name', label: 'Name' },
    { value: 'bggRating', label: 'BGG Rating' },
    { value: 'bayesaverage', label: 'Bayes Average' },
    { value: 'stddev', label: 'Std Dev' },
    { value: 'minage', label: 'Min Age' },
    { value: 'usersrated', label: 'Users Rated' },
    { value: 'owned', label: 'Owned' },
    { value: 'trading', label: 'Trading' },
    { value: 'wanting', label: 'Wanting' },
    { value: 'wishing', label: 'Wishing' },
    { value: 'numcomments', label: 'Comments' },
    { value: 'numweights', label: 'Weight Votes' },
    { value: 'averageweight', label: 'Average Weight' },
    { value: 'year', label: 'Year' },
    { value: 'playingtime', label: 'Playing Time' }
];

function populateSortOptions() {
    const sortSelect = document.getElementById('sortSelect');
    const tiebreakerSortSelect = document.getElementById('tiebreakerSortSelect');
    
    sortFields.forEach(field => {
        const option = new Option(field.label, field.value);
        sortSelect.add(option);
        tiebreakerSortSelect.add(option.cloneNode(true));
    });

    // Set defaults
    sortSelect.value = 'bggRating';
    tiebreakerSortSelect.value = 'bayesaverage';
}

window.addEventListener('DOMContentLoaded', populateSortOptions);

async function fetchCollection() {
  const username = document.getElementById('username').value.trim() || 'sportomax';
  document.getElementById('fetchBtn').disabled = true;
  document.getElementById('fetchSection').classList.add('hidden');
  document.getElementById('loadingSection').classList.remove('hidden');

  try {
    updateLoadingStatus('Fetching collection...');
    updateProgress(0);
    const collXml = await fetchWithRetry(`${API_BASE}?endpoint=collection&username=${encodeURIComponent(username)}&own=1`);
    const collDoc = new DOMParser().parseFromString(collXml, 'text/xml');
    const collItems = Array.from(collDoc.querySelectorAll('item[own="1"]'));
    
    if (collItems.length === 0) {
      updateLoadingStatus('No owned games found');
      return;
    }

    const objectIds = collItems.map(i => i.getAttribute('objectid'));
    updateLoadingStatus(`Found ${objectIds.length} owned games. Fetching details…`);
    updateProgress(10);

    allGames = [];
    const batchSize = 20;
    const batches = [];
    for (let i = 0; i < objectIds.length; i += batchSize) {
      batches.push(objectIds.slice(i, i + batchSize));
    }

    await Promise.all(batches.map(async (batch, idx) => {
      try {
        const ids = batch.join(',');
        const fetchUrl = `${API_BASE}?endpoint=thing&id=${encodeURIComponent(ids)}&stats=1`;
        const xml = await fetchWithRetry(fetchUrl);
        const doc = new DOMParser().parseFromString(xml, 'text/xml');
        Array.from(doc.querySelectorAll('item')).forEach(item => {
          const id = item.getAttribute('id');
          const name = item.querySelector('name[type="primary"]')?.getAttribute('value') || 'N/A';
          const thumb = item.querySelector('thumbnail')?.textContent || '';
          const year = parseInt(item.querySelector('yearpublished')?.getAttribute('value') || '0');
          const ratings = item.querySelector('statistics ratings');
          const gameData = {
            id, name, thumb, year,
            bggRating: parseFloat(ratings?.querySelector('average')?.getAttribute('value') || '0'),
            bayesaverage: parseFloat(ratings?.querySelector('bayesaverage')?.getAttribute('value') || '0'),
            stddev: parseFloat(ratings?.querySelector('stddev')?.getAttribute('value') || '0'),
            minage: parseInt(item.querySelector('minage')?.getAttribute('value') || '0'),
            usersrated: parseInt(ratings?.querySelector('usersrated')?.getAttribute('value') || '0'),
            owned: parseInt(ratings?.querySelector('owned')?.getAttribute('value') || '0'),
            trading: parseInt(ratings?.querySelector('trading')?.getAttribute('value') || '0'),
            wanting: parseInt(ratings?.querySelector('wanting')?.getAttribute('value') || '0'),
            wishing: parseInt(ratings?.querySelector('wishing')?.getAttribute('value') || '0'),
            numcomments: parseInt(ratings?.querySelector('numcomments')?.getAttribute('value') || '0'),
            numweights: parseInt(ratings?.querySelector('numweights')?.getAttribute('value') || '0'),
            averageweight: parseFloat(ratings?.querySelector('averageweight')?.getAttribute('value') || '0'),
            playingtime: (parseInt(item.querySelector('minplaytime')?.getAttribute('value') || '0') + parseInt(item.querySelector('maxplaytime')?.getAttribute('value') || '0')) / 2,
          };
          allGames.push(gameData);
        });
        updateProgress(10 + ((idx + 1) / batches.length) * 90);
        updateLoadingStatus(`Fetching details ${idx + 1}/${batches.length}…`);
      } catch (e) { console.error('Batch error', e); }
    }));

    updateLoadingStatus('Complete!');
    document.getElementById('controlsSection').classList.remove('hidden');
    document.getElementById('gamesGrid').classList.remove('hidden');
    document.getElementById('gameCount').textContent = allGames.length;
    
    displayedGames = [...allGames];
    sortGames();
    
    setTimeout(() => { document.getElementById('loadingSection').classList.add('hidden'); }, 500);
  } catch (err) {
    console.error(err);
    updateLoadingStatus(`Error: ${err.message}`);
  } finally {
    document.getElementById('fetchBtn').disabled = false;
  }
}

async function fetchWithRetry(url, maxRetries = 5) {
  for (let attempt = 0; attempt < maxRetries; attempt++) {
    try {
      const res = await fetch(url);
      if (res.status === 202) { await new Promise(r => setTimeout(r, 3000)); continue; }
      if (res.ok) return await res.text();
      await new Promise(r => setTimeout(r, 2000));
    } catch (e) { await new Promise(r => setTimeout(r, 1500 * Math.pow(2, attempt))); }
  }
  throw new Error('Failed to fetch');
}

function sortGames() {
  const sortBy = document.getElementById('sortSelect').value;
  const tiebreakerSortBy = document.getElementById('tiebreakerSortSelect').value;

  displayedGames.sort((a, b) => {
    let res = 0;
    
    const valA = a[sortBy] || 0;
    const valB = b[sortBy] || 0;
    
    if (sortBy === 'name') {
        res = valA.localeCompare(valB);
    } else {
        res = valB - valA;
    }

    if (sortAsc) res = -res;

    if (res === 0) {
        const tieValA = a[tiebreakerSortBy] || 0;
        const tieValB = b[tiebreakerSortBy] || 0;
        
        if (tiebreakerSortBy === 'name') {
            res = tieValA.localeCompare(tieValB);
        } else {
            res = tieValB - tieValA;
        }
        if (tiebreakerSortAsc) res = -res;
    }
    
    return res;
  });
  renderGames();
}

function toggleSortDir() {
  sortAsc = !sortAsc;
  document.getElementById('sortDirBtn').textContent = sortAsc ? '▲' : '▼';
  sortGames();
}

function toggleTiebreakerSortDir() {
  tiebreakerSortAsc = !tiebreakerSortAsc;
  document.getElementById('tiebreakerSortDirBtn').textContent = tiebreakerSortAsc ? '▲' : '▼';
  sortGames();
}

function renderGames() {
  const container = document.getElementById('gamesGrid');
  const emptyState = document.getElementById('emptyState');
  const sortBy = document.getElementById('sortSelect').value;
  
  if (displayedGames.length === 0) {
    container.classList.add('hidden');
    emptyState.classList.remove('hidden');
    return;
  }
  
  container.classList.remove('hidden');
  emptyState.classList.add('hidden');

  container.innerHTML = displayedGames.map(g => {
    const sortValue = g[sortBy];
    let displayValue = '';
    if (typeof sortValue === 'number') {
        displayValue = sortValue.toFixed(2).replace(/\.00$/, '');
    } else {
        displayValue = sortValue;
    }

    return `
      <div class="game-card bg-white rounded-lg shadow-sm border border-slate-100 overflow-hidden p-2 flex flex-col items-center text-center cursor-pointer" title="${g.name}">
        <a href="https://boardgamegeek.com/boardgame/${g.id}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">
          <img src="${g.thumb}" alt="${g.name}" class="w-24 h-24 rounded-md object-cover bg-slate-200">
        </a>
        <h3 class="font-bold text-xs text-slate-800 mt-2 h-8 line-clamp-2">${g.name}</h3>
        <div class="text-xs text-indigo-600 font-bold mt-1 bg-indigo-50 px-2 py-0.5 rounded-full">${displayValue}</div>
      </div>
    `;
  }).join('');
}

function updateLoadingStatus(status) {
  document.getElementById('loadingStatus').textContent = status;
}

function updateProgress(percent) {
  document.getElementById('progressBar').style.width = `${percent}%`;
}

</script>
</body>
</html>
