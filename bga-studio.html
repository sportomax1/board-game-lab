<body class="pb-24">

            class="px-3 py-2 rounded-xl border border-slate-200 bg-white text-xs font-bold text-slate-600 outline-none focus:ring-2 focus:ring-emerald-500">

        </div>

    </div>

    <!-- STATS BAR -->

      <div class="bg-white rounded-xl border border-slate-100 shadow-sm p-4 text-center">
        <div class="text-2xl font-black text-indigo-600" id="statTotal">0</div>
        <div class="text-[10px] font-black uppercase text-slate-500 tracking-widest mt-0.5">Collection</div>
      </div>
      <div class="bg-white rounded-xl border border-emerald-100 shadow-sm p-4 text-center">
        <div class="text-2xl font-black text-emerald-600" id="statMatch">0</div>
        <div class="text-[10px] font-black uppercase text-slate-500 tracking-widest mt-0.5">In BGA Studio</div>
      </div>

        <div class="text-2xl font-black text-amber-600" id="statWithProject">0</div>
        <div class="text-[10px] font-black uppercase text-slate-500 tracking-widest mt-0.5">Has Project</div>
      </div>
      <div class="bg-white rounded-xl border border-slate-100 shadow-sm p-4 text-center">
        <div class="text-2xl font-black text-rose-500" id="statNoMatch">0</div>

    <!-- GAME CARDS GRID -->

      <!-- populated by JS -->
    </div>

    <!-- EMPTY STATE -->

      <div class="text-4xl mb-3">🎲</div>
      <div class="text-slate-500 font-bold">No games match your filters</div>
    </div>

  </main>

  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

<script>
const IMAGE_PROXY = '/api/image-proxy?url=';

// ── State ──────────────────────────────────────────────────────────────────
let collectionGames = []; // All games from BGG collection
let studioData = [];      // Rows from bga-studio.csv
let displayGames = [];    // Currently shown (filtered/sorted)
let studioFilter = 'all'; // 'all' | 'match' | 'nomatch'

// ── CSV Parser ─────────────────────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.split('\n');
  const headers = parseCSVRow(lines[0]);
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const values = parseCSVRow(line);
    const row = {};
    headers.forEach((h, idx) => { row[h.trim()] = (values[idx] || '').trim(); });
    rows.push(row);
  }
  return rows;
}

function parseCSVRow(line) {
  const result = [];
  let cur = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (inQuotes && line[i+1] === '"') { cur += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if (ch === ',' && !inQuotes) {
      result.push(cur); cur = '';
    } else {
      cur += ch;
    }
  }
  result.push(cur);
  return result;
}

// ── Fuzzy Name Matching ───────────────────────────────────────────────────
// Words stripped before token comparison (too common to signal a real match)
const FILLER = new Set(['the','a','an','of','and','or','in','at','to','for',
  'with','by','on','from','as','is','n','its','it','s','de','la','le','les',
  'el','los','das','die','der','du','des','di','vs']);

function tokenize(name) {
  return name
    .toLowerCase()
    .replace(/[''`]/g, '')           // "Man's" → "mans"
    .replace(/&/g, 'and')
    .replace(/[^a-z0-9\s]/g, ' ')   // special chars → space
    .replace(/\s+/g, ' ')
    .trim()
    .split(' ')
    .filter(w => (w.length >= 2 || /^\d+$/.test(w)) && !FILLER.has(w));
}

// Levenshtein edit distance
function editDist(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({length: n + 1}, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    let prev = dp[0]; dp[0] = i;
    for (let j = 1; j <= n; j++) {
      const tmp = dp[j];
      dp[j] = a[i-1] === b[j-1] ? prev : 1 + Math.min(prev, dp[j], dp[j-1]);
      prev = tmp;
    }
  }
  return dp[n];
}

// Per-token similarity: 1.0 if exact; fuzzy credit for length≥4 tokens if
// edit-distance ratio ≥ 0.75, catches typos & minor suffix differences.
function tokenSim(a, b) {
  if (a === b) return 1;
  const maxLen = Math.max(a.length, b.length);
  if (maxLen < 4) return 0;
  const sim = 1 - editDist(a, b) / maxLen;
  return sim >= 0.75 ? sim : 0;
}

// Greedy best-token alignment score.
// Denominator = max(|tokensA|, |tokensB|) so extra words in either name
// dilute the score — "Treasure" alone won't fake a match.
// Examples:
//   "Another Man's Treasure" vs "Treasure Hunter"  → 1/3 ≈ 33%  (no match)
//   "Another Man's Treasure" vs "Treasure 'N Mutiny!" → 1/3 ≈ 33%  (no match)
//   "7 Wonders Duel" vs "7 Wonders: Architects"     → 1/3 ≈ 33%  (no match)
//   "Wingspan" vs "Wingspan"                          → 1/1 = 100% (exact)
//   "Azul" vs "Azul: Summer Pavilion"                → 1/2 = 50%  (borderline)
function computeScore(nameA, nameB) {
  const ta = tokenize(nameA);
  const tb = tokenize(nameB);
  if (!ta.length || !tb.length) return 0;
  const usedB = new Set();
  let total = 0;
  for (const tok of ta) {
    let best = 0, bestJ = -1;
    tb.forEach((t, j) => {
      if (usedB.has(j)) return;
      const sim = tokenSim(tok, t);
      if (sim > best) { best = sim; bestJ = j; }
    });
    if (bestJ >= 0) { total += best; usedB.add(bestJ); }
  }
  return total / Math.max(ta.length, tb.length);
}

// ── Studio Lookup ──────────────────────────────────────────────────────────
// Returns { entry, score } for the best-scoring match above threshold, or null.
function findStudioMatch(collectionName, matchType) {
  const threshold = matchType === 'full' ? 0.88 : 0.50;
  let best = null, bestScore = 0;
  for (const row of studioData) {
    const sn = row['Game name'] || '';
    if (!sn) continue;
    const score = computeScore(collectionName, sn);
    if (score >= threshold && score > bestScore) {
      bestScore = score; best = row;
    }
  }
  return best ? { entry: best, score: bestScore } : null;
}

// ── BGG API Helper ─────────────────────────────────────────────────────────
async function fetchAPI(endpoint, id, params = '', retries = 6) {
  const key = endpoint === 'thing' ? 'id' : 'username';
  const url = `/api/bgg-helper?endpoint=${endpoint}&${key}=${encodeURIComponent(id)}${params}`;
  for (let i = 0; i < retries; i++) {
    try {
      const res = await fetch(url);
      if (res.status === 202) { await wait(2500 * (i + 1)); continue; }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.text();
    } catch(e) {
      if (i === retries - 1) throw e;
      await wait(1200 * (i + 1));
    }
  }
}
function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── Main Load ──────────────────────────────────────────────────────────────
async function loadData() {
  const username = document.getElementById('usernameInput').value.trim();
  if (!username) { alert('Please enter a BGG username.'); return; }

  const loadBtn = document.getElementById('loadBtn');
  loadBtn.disabled = true;
  show('loadingSection'); hide('controlsSection'); hide('statsBar');
  hide('gamesGrid'); hide('emptyState');

  try {
    // 1. Load bga-studio.csv
    setLoading('Loading BGA Studio data…', '', 5);
    const csvRes = await fetch('bga-studio.csv');
    if (!csvRes.ok) throw new Error('Could not load bga-studio.csv');
    const csvText = await csvRes.text();
    studioData = parseCSV(csvText).filter(r => r['Game name']);

    // 2. Fetch BGG collection
    setLoading(`Fetching collection for ${username}…`, 'Calling BGG API…', 20);
    const xml = await fetchAPI('collection', username, '&stats=1');
    const doc = new DOMParser().parseFromString(xml, 'text/xml');

    // Check for errors
    const errorEl = doc.querySelector('errors message');
    if (errorEl) throw new Error(errorEl.textContent);

    const items = Array.from(doc.querySelectorAll('item'));

    // 3. Determine active status filters
    const statusFilters = ['own','wanttoplay','wanttobuy','wishlist','prevowned','fortrade'];
    const activeStatuses = statusFilters.filter(s => document.getElementById('cb_' + s)?.checked);

    // 4. Parse collection items
    collectionGames = items
      .map(item => {
        const statusEl = item.querySelector('status');
        const statsEl  = item.querySelector('stats');
        const ratingEl = item.querySelector('stats ratings average');
        const rankEl   = item.querySelector('stats ratings ranks rank[name="boardgame"]');

        const status = {};
        statusFilters.forEach(s => {
          status[s] = statusEl?.getAttribute(s) === '1';
        });

        return {
          objectid:   item.getAttribute('objectid'),
          name:       item.querySelector('name')?.textContent?.trim() || 'Unknown',
          thumb:      item.querySelector('thumbnail')?.textContent?.trim() || '',
          image:      item.querySelector('image')?.textContent?.trim() || '',
          year:       item.querySelector('yearpublished')?.textContent || '',
          numplays:   parseInt(item.querySelector('numplays')?.textContent || '0'),
          rating:     parseFloat(ratingEl?.getAttribute('value') || '0'),
          rank:       (() => {
            const v = rankEl?.getAttribute('value');
            return v && v !== 'Not Ranked' ? parseInt(v) : 0;
          })(),
          status
        };
      })
      .filter(g => {
        if (activeStatuses.length === 0) return true;
        return activeStatuses.some(s => g.status[s]);
      });

    setLoading('Matching with BGA Studio…', `${collectionGames.length} games loaded`, 70);
    await wait(50); // Let UI breathe

    // 5. Match with studio data
    const matchType = document.getElementById('matchTypeSelect').value;
    collectionGames.forEach(g => {
      const sm = findStudioMatch(g.name, matchType);
      g.studioEntry = sm?.entry || null;
      g.studioScore = sm?.score || 0;
    });

    setLoading('Rendering games…', '', 95);
    await wait(50);

    // 6. Show UI
    hide('loadingSection');
    show('controlsSection'); show('statsBar'); show('gamesGrid');
    updateStats();
    applyFilters();

    // Update header counts
    const matched = collectionGames.filter(g => g.studioEntry).length;
    document.getElementById('totalCount').textContent = collectionGames.length;
    document.getElementById('matchCount').textContent = matched;

  } catch(e) {
    console.error(e);
    hide('loadingSection');
    alert('Error loading data: ' + e.message);
  }

  loadBtn.disabled = false;
}

// Rematch when match type changes
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('matchTypeSelect').addEventListener('change', () => {
    if (!collectionGames.length) return;
    const matchType = document.getElementById('matchTypeSelect').value;
    collectionGames.forEach(g => {
      const sm = findStudioMatch(g.name, matchType);
      g.studioEntry = sm?.entry || null;
      g.studioScore = sm?.score || 0;
    });
    updateStats();
    applyFilters();
    const matched = collectionGames.filter(g => g.studioEntry).length;
    document.getElementById('totalCount').textContent = collectionGames.length;
    document.getElementById('matchCount').textContent = matched;
  });

  // Allow load on Enter key
  document.getElementById('usernameInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') loadData();
  });
});

// ── Stats ──────────────────────────────────────────────────────────────────
function updateStats() {
  const total     = collectionGames.length;
  const matched   = collectionGames.filter(g => g.studioEntry).length;
  const withProj  = collectionGames.filter(g => g.studioEntry?.['Studio projects']).length;
  const unmatched = total - matched;
  document.getElementById('statTotal').textContent    = total;
  document.getElementById('statMatch').textContent    = matched;
  document.getElementById('statWithProject').textContent = withProj;
  document.getElementById('statNoMatch').textContent  = unmatched;
}

// ── Studio Filter Buttons ─────────────────────────────────────────────────
function setStudioFilter(val) {
  studioFilter = val;
  ['sfAll','sfMatch','sfNoMatch'].forEach(id => {
    document.getElementById(id).className = 'px-3 py-1.5 rounded-lg text-xs font-black transition-all text-slate-500 hover:text-slate-700';
  });
  const activeId = val === 'all' ? 'sfAll' : val === 'match' ? 'sfMatch' : 'sfNoMatch';
  document.getElementById(activeId).className = 'px-3 py-1.5 rounded-lg text-xs font-black transition-all bg-white shadow text-emerald-700';
  applyFilters();
}

// ── Filter + Sort + Render ─────────────────────────────────────────────────
function applyFilters() {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const sort   = document.getElementById('sortSelect').value;

  let games = [...collectionGames];

  // Studio filter
  if (studioFilter === 'match')   games = games.filter(g => g.studioEntry);
  if (studioFilter === 'nomatch') games = games.filter(g => !g.studioEntry);

  // Search filter
  if (search) {
    games = games.filter(g =>
      g.name.toLowerCase().includes(search) ||
      (g.studioEntry?.['Publisher'] || '').toLowerCase().includes(search) ||
      (g.studioEntry?.['Designer'] || '').toLowerCase().includes(search)
    );
  }

  // Sort
  if (sort === 'name') {
    games.sort((a,b) => a.name.localeCompare(b.name));
  } else if (sort === 'rating-desc') {
    games.sort((a,b) => b.rating - a.rating);
  } else if (sort === 'studio-first') {
    games.sort((a,b) => {
      if (a.studioEntry && !b.studioEntry) return -1;
      if (!a.studioEntry && b.studioEntry) return 1;
      return a.name.localeCompare(b.name);
    });
  } else if (sort === 'status') {
    const order = ['own','wanttoplay','wanttobuy','wishlist','prevowned','fortrade'];
    games.sort((a,b) => {
      const ai = order.findIndex(s => a.status[s]);
      const bi = order.findIndex(s => b.status[s]);
      return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi) || a.name.localeCompare(b.name);
    });
  }

  displayGames = games;
  document.getElementById('resultLabel').textContent = `${games.length} game${games.length !== 1 ? 's' : ''}`;
  renderGames();
}

// ── Render ─────────────────────────────────────────────────────────────────
function renderGames() {
  const grid = document.getElementById('gamesGrid');
  const empty = document.getElementById('emptyState');

  if (!displayGames.length) {
    hide('gamesGrid'); show('emptyState'); return;
  }
  show('gamesGrid'); hide('emptyState');

  grid.innerHTML = displayGames.map(g => buildCard(g)).join('');
}

function buildCard(g) {
  const s = g.studioEntry;
  const hasStudio = !!s;
  const thumb = g.thumb
    ? `${IMAGE_PROXY}${encodeURIComponent(g.thumb)}`
    : 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" fill="%23e2e8f0"/><text x="40" y="50" text-anchor="middle" fill="%2394a3b8" font-size="28">🎲</text></svg>';

  // Status badges
  const statusBadges = buildStatusBadges(g.status);

  // Studio license color
  const licenseStatus = s?.['License status'] || '';
  const licenseGranted = licenseStatus.toLowerCase().includes('good to go');
  const licenseColor = licenseGranted
    ? 'bg-emerald-100 text-emerald-800 border-emerald-200'
    : 'bg-amber-100 text-amber-800 border-amber-200';

  // Studio projects
  const projects = s?.['Studio projects'] || '';
  const projectTokens = projects ? projects.split(',').map(p => p.trim()).filter(Boolean) : [];

  // Rating badge
  const ratingBadge = g.rating > 0
    ? `<span class="text-[10px] font-black bg-amber-50 border border-amber-200 text-amber-700 px-1.5 py-0.5 rounded-md">⭐ ${g.rating.toFixed(1)}</span>`
    : '';

  // Rank badge
  const rankBadge = g.rank > 0
    ? `<span class="text-[10px] font-black ${g.rank <= 100 ? 'bg-green-100 border-green-200 text-green-700' : g.rank <= 500 ? 'bg-blue-100 border-blue-200 text-blue-700' : 'bg-slate-100 border-slate-200 text-slate-600'} border px-1.5 py-0.5 rounded-md">#${g.rank}</span>`
    : '';

  return `
    <div class="game-card bg-white rounded-2xl border-2 ${hasStudio ? 'border-emerald-200 studio-match' : 'border-slate-100 studio-no-match'} overflow-hidden fade-in">
      <div class="flex gap-3 p-3.5">
        <!-- Thumbnail -->
        <a href="https://boardgamegeek.com/boardgame/${g.objectid}" target="_blank" class="flex-shrink-0" title="View on BGG">
          <img src="${thumb}" alt="${escHtml(g.name)}"
            class="w-20 h-20 rounded-xl object-cover bg-slate-100 border border-slate-100"
            onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22><rect width=%2280%22 height=%2280%22 fill=%22%23e2e8f0%22/><text x=%2240%22 y=%2250%22 text-anchor=%22middle%22 fill=%22%2394a3b8%22 font-size=%2228%22>🎲</text></svg>'">
        </a>
        <!-- Info -->
        <div class="flex-1 min-w-0">
          <div class="flex items-start gap-1.5 mb-1">
            <a href="https://boardgamegeek.com/boardgame/${g.objectid}" target="_blank"
               class="font-black text-sm text-slate-900 leading-tight hover:text-emerald-700 transition-colors line-clamp-2 flex-1">
              ${escHtml(g.name)}
            </a>
          </div>
          <!-- Rating + Rank -->
          <div class="flex flex-wrap gap-1 mb-1.5">
            ${ratingBadge}
            ${rankBadge}
            ${g.numplays > 0 ? `<span class="text-[10px] font-black bg-slate-100 border border-slate-200 text-slate-600 px-1.5 py-0.5 rounded-md"><i class="fa-solid fa-play" style="font-size:8px"></i> ${g.numplays}</span>` : ''}
          </div>
          <!-- Status badges -->
          <div class="flex flex-wrap gap-1">
            ${statusBadges}
          </div>
        </div>
      </div>

      <!-- Studio Section -->
      ${hasStudio ? `
      <div class="border-t border-emerald-100 bg-emerald-50/50 px-3.5 py-2.5">
        <div class="flex items-center gap-1.5 mb-1.5">
          <span class="text-[9px] font-black uppercase tracking-widest text-emerald-700"><i class="fa-solid fa-circle-check mr-1"></i>BGA Studio</span>
          ${studioScoreBadge(g.studioScore)}
          <span class="ml-auto text-[9px] font-black px-1.5 py-0.5 rounded border ${licenseColor}">${escHtml(licenseStatus.replace(/\(license granted:[^)]+\)/,'').trim())}</span>
        </div>
        ${licenseStatus.match(/\d{4}-\d{2}-\d{2}/) ? `<div class="text-[9px] text-emerald-600 font-bold mb-1"><i class="fa-solid fa-calendar-check mr-1 opacity-60"></i>Licensed: ${licenseStatus.match(/(\d{4}-\d{2}-\d{2})/)?.[1] || ''}</div>` : ''}
        ${s['Publisher'] ? `<div class="text-[10px] text-slate-600 font-bold truncate"><i class="fa-solid fa-building mr-1 opacity-50"></i>${escHtml(s['Publisher'])}</div>` : ''}
        ${s['Designer'] ? `<div class="text-[10px] text-slate-500 font-medium truncate"><i class="fa-solid fa-pen-nib mr-1 opacity-40"></i>${escHtml(s['Designer'])}</div>` : ''}
        ${projectTokens.length ? `
        <div class="mt-1.5 flex flex-wrap gap-1">
          ${projectTokens.slice(0,4).map(p => `
            <a href="https://studio.boardgamearena.com/${escHtml(p)}" target="_blank"
               class="text-[9px] font-black bg-emerald-100 hover:bg-emerald-200 text-emerald-800 border border-emerald-200 px-1.5 py-0.5 rounded transition-colors">
              <i class="fa-solid fa-code mr-0.5 opacity-60"></i>${escHtml(p)}
            </a>`).join('')}
          ${projectTokens.length > 4 ? `<span class="text-[9px] text-slate-400 font-bold self-center">+${projectTokens.length - 4} more</span>` : ''}
        </div>` : ''}
      </div>` : `
      <div class="border-t border-slate-100 px-3.5 py-2 bg-slate-50/50">
        <span class="text-[10px] font-black text-slate-400"><i class="fa-regular fa-circle-xmark mr-1"></i>Not in BGA Studio</span>
      </div>`}
    </div>
  `;
}

function buildStatusBadges(status) {
  const map = [
    ['own',       'badge-own',        'Own'],
    ['wanttoplay','badge-wanttoplay', 'Want to Play'],
    ['wanttobuy', 'badge-wanttobuy',  'Want to Buy'],
    ['wishlist',  'badge-wishlist',   'Wishlist'],
    ['prevowned', 'badge-prevowned',  'Prev Owned'],
    ['fortrade',  'badge-fortrade',   'For Trade'],
  ];
  return map
    .filter(([key]) => status[key])
    .map(([,cls,label]) => `<span class="text-[9px] font-black px-1.5 py-0.5 rounded-md ${cls}">${label}</span>`)
    .join('');
}

function escHtml(s) {
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Score badge: color + label based on confidence tier
function studioScoreBadge(score) {
  const pct = Math.round((score || 0) * 100);
  if (pct <= 0) return '';
  const [bg, border, text, label] =
    pct >= 88 ? ['bg-emerald-100','border-emerald-300','text-emerald-800','Exact'] :
    pct >= 70 ? ['bg-sky-100','border-sky-300','text-sky-800','Strong'] :
               ['bg-amber-100','border-amber-300','text-amber-800','Partial'];
  return `<span class="${bg} ${text} border ${border} text-[9px] font-black px-1.5 py-0.5 rounded-md" title="Fuzzy match score: ${pct}%">${pct}%&nbsp;${label}</span>`;
}

// ── Helpers ────────────────────────────────────────────────────────────────
function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }
function setLoading(msg, sub, pct) {
  document.getElementById('loadingMsg').textContent = msg;
  document.getElementById('loadingSub').textContent = sub;
  document.getElementById('progressBar').style.width = pct + '%';
}
</script>
</body>
