<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Game Measurements</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>📏</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            height: 100%;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            max-width: none;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            padding-top: env(safe-area-inset-top, 0);
            padding-bottom: env(safe-area-inset-bottom, 0);
            padding-left: env(safe-area-inset-left, 0);
            padding-right: env(safe-area-inset-right, 0);
        }

        .header {
            flex-shrink: 0;
            padding: 1rem;
            border-bottom: 1px solid #eee;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .setup-section {
            flex-shrink: 0;
            padding: 1rem;
            background: white;
            border-bottom: 1px solid #eee;
        }

        .input-group {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
            align-items: flex-end;
        }

        .input-field {
            flex: 1;
            min-width: 200px;
        }

        .input-field label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: #666;
        }

        .input-field input, .input-field select {
            width: 100%;
            padding: 0.7rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            -webkit-appearance: none;
            appearance: none;
            transition: all 0.2s;
        }

        .input-field input:focus, .input-field select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 0.7rem 1.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            font-size: 1rem;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
            opacity: 0.9;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            font-size: 0.85rem;
            color: #666;
            padding: 0.75rem;
            background: #f9f9f9;
            border-radius: 6px;
            text-align: center;
            border-left: 4px solid #667eea;
        }

        .status.loading {
            color: #667eea;
            font-weight: 600;
        }

        .status.error {
            background: #ffebee;
            border-left-color: #f44336;
            color: #c62828;
        }

        .status.success {
            background: #e8f5e9;
            border-left-color: #4caf50;
            color: #2e7d32;
        }

        .copy-btn {
            margin-top: 0.5rem;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .tabs-container {
            flex-shrink: 0;
            display: flex;
            border-bottom: 1px solid #eee;
            background: white;
            gap: 0;
        }

        .tab-button {
            flex: 1;
            padding: 1rem;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-weight: 600;
            color: #999;
            font-size: 0.95rem;
            transition: all 0.2s;
            text-align: center;
            -webkit-appearance: none;
            appearance: none;
        }

        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-button:active {
            background: #f5f5f5;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .tab-content {
            display: none;
            flex: 1;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .tab-content.active {
            display: flex;
        }

        .search-bar {
            flex-shrink: 0;
            padding: 0.75rem 1rem;
            background: white;
            border-bottom: 1px solid #eee;
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .search-input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            -webkit-appearance: none;
            appearance: none;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .table-wrapper {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .table-header {
            display: grid;
            grid-template-columns: 60px 1fr 80px 70px 70px 70px;
            gap: 0.75rem;
            padding: 0.75rem;
            background: #f5f5f5;
            border-bottom: 2px solid #e0e0e0;
            font-weight: 600;
            font-size: 0.85rem;
            color: #666;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .table-header-cell {
            padding: 0.5rem;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: color 0.2s;
        }

        .table-header-cell:hover {
            color: #333;
        }

        .sort-indicator {
            font-size: 0.8rem;
            color: #667eea;
        }

        .table-row {
            display: grid;
            grid-template-columns: 50px 1fr 50px 50px 50px 50px 50px 45px 45px 45px 70px;
            gap: 0.4rem;
            padding: 0.5rem;
            border-bottom: 1px solid #eee;
            align-items: center;
            transition: background 0.2s;
        }

        .table-row.all-tab {
            grid-template-columns: 60px 1fr 80px 70px 70px 70px;
            gap: 0.75rem;
            padding: 0.75rem;
        }

        .table-header {
            display: grid;
            grid-template-columns: 50px 1fr 50px 50px 50px 50px 50px 45px 45px 45px 70px;
            gap: 0.4rem;
            padding: 0.5rem;
            background: #f5f5f5;
            border-bottom: 2px solid #667eea;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .table-header.all-tab {
            grid-template-columns: 60px 1fr 80px 70px 70px 70px;
            gap: 0.75rem;
            padding: 0.75rem;
        }

        .table-row:hover {
            background: #f9f9f9;
        }

        .table-row:active {
            background: #f0f4ff;
        }

        .thumbnail-cell {
            width: 60px;
            height: 60px;
            flex-shrink: 0;
            background: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        .thumbnail-cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .name-cell {
            font-weight: 600;
            color: #333;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .id-cell, .dimension-cell {
            font-size: 0.85rem;
            color: #666;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .variants-cell {
            font-size: 0.85rem;
            color: #666;
            text-align: center;
        }

        .dimension-select {
            width: 100%;
            padding: 0.3rem 0.4rem;
            font-size: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            background: #f9f9f9;
            color: #333;
            font-weight: 500;
        }

        .dimension-select:hover {
            border-color: #667eea;
            background: #f0f5ff;
        }

        .dimension-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }

        .change-btn {
            padding: 0.4rem 0.5rem;
            font-size: 0.7rem;
            font-weight: 600;
            border: 1px solid #667eea;
            border-radius: 4px;
            background: #667eea;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .change-btn:hover {
            background: #5568d3;
            border-color: #5568d3;
            box-shadow: 0 2px 4px rgba(102, 126, 234, 0.3);
        }

        .change-btn:active {
            background: #4855b8;
            transform: scale(0.98);
        }

        .count-cell {
            text-align: center;
            font-weight: 600;
            color: #667eea;
            background: #f0f4ff;
            border-radius: 4px;
            padding: 0.3rem;
        }

        .variants-cell {
            text-align: center;
            font-size: 0.85rem;
            color: #ff9800;
            padding: 0.3rem;
            background: #fff3e0;
            border-radius: 4px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            text-align: center;
            padding: 2rem;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        .progress-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 2rem;
        }

        .progress-bar {
            width: 100%;
            max-width: 300px;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s;
            width: 0%;
        }

        .progress-text {
            font-size: 0.9rem;
            color: #666;
        }

        @media (max-width: 768px) {
            .table-header, .table-row {
                grid-template-columns: 50px 1fr 60px 60px 60px 60px;
                gap: 0.5rem;
            }

            .thumbnail-cell {
                width: 50px;
                height: 50px;
            }

            .table-header-cell, .table-row {
                font-size: 0.8rem;
                padding: 0.5rem;
            }

            .name-cell {
                font-size: 0.85rem;
            }

            .dimension-cell {
                font-size: 0.8rem;
            }

            .input-group {
                gap: 0.5rem;
            }

            .input-field {
                min-width: 150px;
            }
        }

        @media (max-width: 480px) {
            .table-header, .table-row {
                grid-template-columns: 45px 1fr 50px 50px 50px 50px;
                gap: 0.4rem;
            }

            .thumbnail-cell {
                width: 45px;
                height: 45px;
            }

            .header h1 {
                font-size: 1.2rem;
            }

            .table-header-cell, .table-row {
                font-size: 0.75rem;
                padding: 0.4rem;
            }

            .input-group {
                flex-direction: column;
            }

            .input-field {
                min-width: 100%;
            }

            .btn {
                width: 100%;
            }

            .tab-button {
                padding: 0.75rem;
                font-size: 0.85rem;
            }
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 90vw;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 2px solid #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex-shrink: 0;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.25rem;
        }

        .modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .modal-close:hover {
            transform: scale(1.2);
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .modal-footer {
            padding: 1rem;
            border-top: 1px solid #eee;
            display: flex;
            gap: 1rem;
            flex-shrink: 0;
        }

        .cube-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .cube-card {
            border: 2px solid #667eea;
            border-radius: 6px;
            padding: 1rem;
            background: #f9f9f9;
        }

        .cube-title {
            font-weight: 700;
            color: #667eea;
            margin: 0 0 0.75rem 0;
            font-size: 0.95rem;
        }

        .cube-game {
            padding: 0.5rem;
            margin: 0.25rem 0;
            background: white;
            border-left: 3px solid #667eea;
            font-size: 0.85rem;
            border-radius: 3px;
        }

        .cube-game-name {
            font-weight: 600;
            color: #333;
        }

        .cube-game-info {
            color: #666;
            font-size: 0.8rem;
            margin-top: 0.25rem;
        }

        .cube-stats {
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid #ddd;
            font-size: 0.8rem;
            color: #666;
        }

        .shelf-summary {
            background: #f0f4ff;
            border: 2px solid #667eea;
            border-radius: 6px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
            color: #667eea;
        }

        .shelf-summary-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
        }

        .cube-visualization {
            margin-bottom: 1rem;
            border: 2px solid #333;
            background: white;
            aspect-ratio: 1;
            position: relative;
            overflow: hidden;
            border-radius: 3px;
            min-height: 150px;
        }

        .cube-box {
            position: absolute;
            border: 1px solid #333;
            box-shadow: inset 0 0 2px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 600;
            color: #333;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            padding: 2px;
        }

        .shelf-warning {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 4px;
            padding: 0.75rem;
            margin-bottom: 1rem;
            color: #856404;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📏 Game Measurements</h1>
        </div>

        <div class="setup-section">
            <div class="input-group">
                <div class="input-field">
                    <label for="username">BGG Username</label>
                    <input type="text" id="username" placeholder="e.g., sportomax" value="sportomax">
                </div>
                <div class="input-field">
                    <label for="maxGames">Max Games</label>
                    <input type="number" id="maxGames" value="100" min="1" max="500">
                </div>
                <button class="btn" id="fetchBtn" onclick="fetchMeasurements()">Fetch Data</button>
            </div>
            <div id="statusDiv" class="status hidden">Loading...</div>
        </div>

        <div class="tabs-container" id="tabsContainer">
            <button class="tab-button active" onclick="switchTab('all')">📋 All Measurements</button>
            <button class="tab-button" onclick="switchTab('popular')">⭐ Most Popular</button>
        </div>

        <div class="main-content">
            <!-- All Measurements Tab -->
            <div class="tab-content active" id="allTab">
                <div class="search-bar">
                    <input type="text" class="search-input" id="searchAll" placeholder="Search game name..." onkeyup="filterTable('all')">
                </div>
                <div class="table-wrapper">
                    <div id="allTableContainer">
                        <div class="empty-state">
                            <div class="empty-state-icon">📏</div>
                            <p>Enter a username and click Fetch Data to see all measurements</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Most Popular Tab -->
            <div class="tab-content" id="popularTab">
                <div class="search-bar">
                    <input type="text" class="search-input" id="searchPopular" placeholder="Search game name..." onkeyup="filterTable('popular')">
                    <button class="btn copy-btn" id="copyBtn" onclick="copyPopularTableAsText()">📋 Copy as Text</button>
                    <button class="btn copy-btn" id="shelfTimeBtn" onclick="openShelfTimeModal()">📦 Shelf Time</button>
                </div>
                <div class="table-wrapper">
                    <div id="popularTableContainer">
                        <div class="empty-state">
                            <div class="empty-state-icon">⭐</div>
                            <p>Enter a username and click Fetch Data to see most popular measurements</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Shelf Time Modal -->
    <div id="shelfTimeModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📦 Kallax Shelf Time - Cube Packing</h2>
                <button class="modal-close" onclick="closeShelfTimeModal()">✕</button>
            </div>
            <div class="modal-body" id="shelfTimeBody">
                <div style="text-align: center; padding: 2rem;">Loading...</div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeShelfTimeModal()">Close</button>
            </div>
        </div>
    </div>

    <script>
        // Prevent double-tap zoom
        document.addEventListener('touchstart', function(e) {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, false);

        let allMeasurements = [];
        let popularMeasurements = [];
        let filteredAllData = [];
        let filteredPopularData = [];
        let currentSortColumn = 'name';
        let currentSortDirection = 'asc';
        let currentTab = 'all';
        let selectedMeasurements = {}; // Track which measurement variant to show for each game

        const statusDiv = document.getElementById('statusDiv');
        const fetchBtn = document.getElementById('fetchBtn');

        async function fetchWithRetry(url, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    console.log(`[measure.html] 📡 [Attempt ${i + 1}/${maxRetries}] GET ${url.substring(0, 100)}...`);
                    const response = await fetch(url);
                    console.log(`[measure.html] ✓ Response status: ${response.status}`);

                    if (response.status === 202) {
                        const delay = 2000 * (i + 1);
                        console.warn(`[measure.html] ⏳ Got 202 - retrying after ${delay}ms`);
                        statusDiv.textContent = `BGG is processing... (${maxRetries - i - 1} retries left)`;
                        await new Promise(r => setTimeout(r, delay));
                        continue;
                    }

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }

                    const text = await response.text();
                    console.log(`[measure.html] ✓ Response received (${text.length} bytes)`);
                    return text;
                } catch (error) {
                    console.error(`[measure.html] ❌ [Attempt ${i + 1}] Error:`, error.message);
                    if (i === maxRetries - 1) throw error;
                    const delay = 1000 * (i + 1);
                    await new Promise(r => setTimeout(r, delay));
                }
            }
        }

        async function fetchMeasurements() {
            const username = document.getElementById('username').value.trim();
            const maxGames = parseInt(document.getElementById('maxGames').value);

            if (!username) {
                showStatus('Please enter a username', 'error');
                return;
            }

            if (maxGames < 1 || maxGames > 500) {
                showStatus('Max games must be between 1 and 500', 'error');
                return;
            }

            fetchBtn.disabled = true;
            showStatus(`Fetching collection for ${username} (own=1)...`, 'loading');

            try {
                // Fetch collection using proxy
                console.log(`[measure.html] 👤 Starting fetch for user: ${username}`);
                const collectionUrl = `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1`;
                console.log(`[measure.html] 🔗 Collection URL: ${collectionUrl}`);
                const collectionText = await fetchWithRetry(collectionUrl);

                const parser = new DOMParser();
                const collectionXml = parser.parseFromString(collectionText, 'text/xml');
                console.log(`[measure.html] 📄 Parsed collection XML (${collectionText.length} bytes)`);

                if (collectionXml.querySelector('error')) {
                    console.error(`[measure.html] ❌ BGG returned an error in collection XML`);
                    throw new Error('Invalid BGG response - user not found or collection is private');
                }

                const items = Array.from(collectionXml.querySelectorAll('item')).slice(0, maxGames);
                console.log(`[measure.html] 🎮 Found ${items.length} owned games (limited to ${maxGames})`);

                if (items.length === 0) {
                    console.error(`[measure.html] ❌ No owned games found in collection`);
                    throw new Error('No owned games found');
                }

                showStatus(`Found ${items.length} games. Fetching measurements...`, 'loading');

                const gameIds = items.map(item => item.getAttribute('objectid'));
                console.log(`[measure.html] 🔢 Game IDs to process: ${gameIds.join(', ')}`);
                allMeasurements = [];
                const batchSize = 20;

                for (let i = 0; i < gameIds.length; i += batchSize) {
                    const batch = gameIds.slice(i, i + batchSize);
                    const progress = Math.round((i / gameIds.length) * 100);
                    showStatus(`Fetching batch ${Math.ceil((i + 1) / batchSize)} of ${Math.ceil(gameIds.length / batchSize)}... (${progress}%)`, 'loading');

                    // Fetch thing data using proxy
                    const ids = batch.join(',');
                    const thingUrl = `/api/bgg-helper?endpoint=thing&id=${ids}&type=boardgame&versions=1`;
                    console.log(`[measure.html] 📦 Fetching batch for game IDs: ${ids}`);
                    const thingText = await fetchWithRetry(thingUrl);

                    const thingXml = parser.parseFromString(thingText, 'text/xml');
                    
                    // Build lookup for game info from the batch
                    const gameInfo = {};
                    Array.from(thingXml.querySelectorAll('item[type="boardgame"]')).forEach(item => {
                        const id = item.getAttribute('id');
                        gameInfo[id] = {
                            name: item.querySelector('name[type="primary"]')?.getAttribute('value') || 'Unknown',
                            thumbnail: item.querySelector('thumbnail')?.textContent || ''
                        };
                    });
                    console.log(`[measure.html] 📋 Found ${Object.keys(gameInfo).length} games in batch`);

                    // Get all version items (not nested in versions element)
                    const versionItems = thingXml.querySelectorAll('item[type="boardgameversion"]');
                    console.log(`[measure.html] 📏 Found ${versionItems.length} version items in batch`);
                    
                    Array.from(versionItems).forEach(version => {
                        // Find the parent game link
                        const gameLink = version.querySelector('link[type="boardgameversion"][inbound="true"]');
                        if (!gameLink) {
                            console.log(`[measure.html] ⚠️ Version ${version.getAttribute('id')} has no parent game link`);
                            return;
                        }
                        
                        const gameId = gameLink.getAttribute('id');
                        const game = gameInfo[gameId];
                        if (!game) {
                            console.log(`[measure.html] ⚠️ Game ${gameId} not found in batch info`);
                            return;
                        }

                        const versionId = version.getAttribute('id');
                        const widthAttr = version.querySelector('width')?.getAttribute('value');
                        const lengthAttr = version.querySelector('length')?.getAttribute('value');
                        const depthAttr = version.querySelector('depth')?.getAttribute('value');
                        
                        const width = widthAttr ? parseFloat(widthAttr) : null;
                        const length = lengthAttr ? parseFloat(lengthAttr) : null;
                        const depth = depthAttr ? parseFloat(depthAttr) : null;

                        if (width !== null && length !== null && depth !== null && width > 0 && length > 0 && depth > 0) {
                            allMeasurements.push({
                                name: game.name,
                                gameId: gameId,
                                versionId: versionId,
                                width: width,
                                // Note: BGG API provides 'depth', but we store as 'height' to match 
                                // the existing display table structure (W x H x L)
                                height: depth,
                                length: length,
                                thumbnail: game.thumbnail,
                            });
                            console.log(`[measure.html] ✅ Added measurement for ${game.name}: ${width}" x ${length}" x ${depth}"`);
                        }
                    });

                    console.log(`[measure.html] 📊 Total measurements so far: ${allMeasurements.length}`);

                    // Rate limiting
                    await new Promise(r => setTimeout(r, 500));
                }

                // Calculate popular measurements
                console.log(`[measure.html] 📊 Calculating popular measurements from ${allMeasurements.length} total measurements`);
                const gameGrouped = {};
                allMeasurements.forEach(m => {
                    if (!gameGrouped[m.gameId]) {
                        gameGrouped[m.gameId] = {
                            name: m.name,
                            gameId: m.gameId,
                            thumbnail: m.thumbnail,
                            versions: []
                        };
                    }
                    gameGrouped[m.gameId].versions.push(m);
                });

                console.log(`[measure.html] 🎯 Grouped measurements into ${Object.keys(gameGrouped).length} unique games`);

                popularMeasurements = Object.values(gameGrouped).map(g => {
                    // Find most common measurement, with cubic footage as tie-breaker
                    const measurementKey = m => `${m.width}x${m.height}x${m.length}`;
                    const measurementCounts = {};
                    const measurementByKey = {};
                    let maxCount = 0;
                    let mostPopularMeasure = null;

                    g.versions.forEach(v => {
                        const key = measurementKey(v);
                        measurementCounts[key] = (measurementCounts[key] || 0) + 1;
                        if (!measurementByKey[key]) {
                            measurementByKey[key] = v;
                        }
                    });

                    // Find max count and apply cubic footage tie-breaker
                    Object.entries(measurementCounts).forEach(([key, count]) => {
                        const measure = measurementByKey[key];
                        const cubicFootage = measure.width * measure.height * measure.length;
                        
                        if (count > maxCount) {
                            maxCount = count;
                            mostPopularMeasure = measure;
                        } else if (count === maxCount && mostPopularMeasure) {
                            // Tie-breaker: use cubic footage
                            const existingCubic = mostPopularMeasure.width * mostPopularMeasure.height * mostPopularMeasure.length;
                            if (cubicFootage > existingCubic) {
                                mostPopularMeasure = measure;
                            }
                        }
                    });

                    const differentMeasures = Object.keys(measurementCounts).length;

                    return {
                        name: g.name,
                        gameId: g.gameId,
                        thumbnail: g.thumbnail,
                        width: mostPopularMeasure.width,
                        height: mostPopularMeasure.height,
                        length: mostPopularMeasure.length,
                        count: maxCount,
                        differentMeasures: differentMeasures,
                        variants: differentMeasures > 1 ? differentMeasures - 1 : 0,
                        totalVersions: g.versions.length,
                        versionsMatchingSpec: maxCount,
                        versions: g.versions
                    };
                });

                console.log(`[measure.html] ⭐ Created ${popularMeasurements.length} popular measurement entries`);

                filteredAllData = [...allMeasurements];
                filteredPopularData = [...popularMeasurements];

                const successMessage = `Successfully loaded ${allMeasurements.length} measurements from ${popularMeasurements.length} games`;
                console.log(`[measure.html] ✅ ${successMessage}`);
                showStatus(successMessage, 'success');
                renderAllTab();
                renderPopularTab();

            } catch (error) {
                console.error(`[measure.html] ❌ Error occurred:`, error);
                console.error(`[measure.html] ❌ Error stack:`, error.stack);
                showStatus(`Error: ${error.message}`, 'error');
            } finally {
                fetchBtn.disabled = false;
                console.log(`[measure.html] 🏁 Fetch process completed`);
            }
        }

        function renderAllTab() {
            const container = document.getElementById('allTableContainer');
            
            if (filteredAllData.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📏</div><p>No measurements found</p></div>';

                    <div class="table-header-cell" onclick="sortTable('all', 'versionId')">Version <span class="sort-indicator">${currentTab === 'all' && currentSortColumn === 'versionId' ? (currentSortDirection === 'asc' ? '▲' : '▼') : ''}</span></div>
                    <div class="table-header-cell" onclick="sortTable('all', 'width')">W<span class="sort-indicator">${currentTab === 'all' && currentSortColumn === 'width' ? (currentSortDirection === 'asc' ? '▲' : '▼') : ''}</span></div>
                    <div class="table-header-cell" onclick="sortTable('all', 'height')">H<span class="sort-indicator">${currentTab === 'all' && currentSortColumn === 'height' ? (currentSortDirection === 'asc' ? '▲' : '▼') : ''}</span></div>
                    <div class="table-header-cell" onclick="sortTable('all', 'length')">L<span class="sort-indicator">${currentTab === 'all' && currentSortColumn === 'length' ? (currentSortDirection === 'asc' ? '▲' : '▼') : ''}</span></div>
                </div>
            `;

            filteredAllData.forEach(m => {
                html += `

                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function renderPopularTab() {
            const container = document.getElementById('popularTableContainer');

            if (filteredPopularData.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⭐</div><p>No games found</p></div>';
                return;
            }

            let html = `
                <div class="table-header">
                    <div style="text-align: center; padding: 0.5rem;">Thumb</div>
                    <div style="padding: 0.5rem;" onclick="sortTable('popular', 'name')" style="cursor: pointer;">Game Name ${currentTab === 'popular' && currentSortColumn === 'name' ? (currentSortDirection === 'asc' ? '▲' : '▼') : ''}</div>
                    <div style="text-align: center; padding: 0.5rem;" onclick="sortTable('popular', 'width')" style="cursor: pointer;">W ${currentTab === 'popular' && currentSortColumn === 'width' ? (currentSortDirection === 'asc' ? '▲' : '▼') : ''}</div>
                    <div style="text-align: center; padding: 0.5rem;" onclick="sortTable('popular', 'height')" style="cursor: pointer;">H ${currentTab === 'popular' && currentSortColumn === 'height' ? (currentSortDirection === 'asc' ? '▲' : '▼') : ''}</div>
                    <div style="text-align: center; padding: 0.5rem;" onclick="sortTable('popular', 'length')" style="cursor: pointer;">L ${currentTab === 'popular' && currentSortColumn === 'length' ? (currentSortDirection === 'asc' ? '▲' : '▼') : ''}</div>
                    <div style="text-align: center; padding: 0.5rem;" onclick="sortTable('popular', 'middle')" style="cursor: pointer;">Mid ${currentTab === 'popular' && currentSortColumn === 'middle' ? (currentSortDirection === 'asc' ? '▲' : '▼') : ''}</div>
                    <div style="text-align: center; padding: 0.5rem;" onclick="sortTable('popular', 'short')" style="cursor: pointer;">Short ${currentTab === 'popular' && currentSortColumn === 'short' ? (currentSortDirection === 'asc' ? '▲' : '▼') : ''}</div>
                    <div style="text-align: center; padding: 0.5rem; font-size: 0.7rem;">Shared</div>
                    <div style="text-align: center; padding: 0.5rem; font-size: 0.7rem;">Types</div>
                    <div style="text-align: center; padding: 0.5rem; font-size: 0.7rem;">Total</div>
                    <div style="text-align: center; padding: 0.5rem; font-size: 0.7rem;">Change</div>
                </div>
            `;

            filteredPopularData.forEach(g => {
                // Get selected variant or use the most popular one
                const selectedVariant = selectedMeasurements[g.gameId] || 0;
                const selectedMeasure = g.versions && g.versions[selectedVariant] ? g.versions[selectedVariant] : {
                    width: g.width,
                    height: g.height,
                    length: g.length
                };
                
                // Count how many versions match the selected measurement (with safety check)
                let countForSelected = 1;
                if (g.versions && Array.isArray(g.versions)) {
                    countForSelected = g.versions.filter(v => 
                        v.width === selectedMeasure.width && 
                        v.height === selectedMeasure.height && 
                        v.length === selectedMeasure.length
                    ).length;
                }

                // Calculate middle measurement for display
                const middleMeasure = getMiddleMeasurement(selectedMeasure.width, selectedMeasure.height, selectedMeasure.length);
                const shortestMeasure = getShortestMeasurement(selectedMeasure.width, selectedMeasure.height, selectedMeasure.length);
                
                // Build change dropdown
                let changeDropdown = '';
                if (g.versions && g.versions.length > 1) {
                    // Sort variants by: count (desc), then cubic footage (desc)
                    const variantsWithCounts = g.versions.map((v, idx) => {
                        const count = g.versions.filter(x => 
                            x.width === v.width && x.height === v.height && x.length === v.length
                        ).length;
                        const cubicFootage = v.width * v.height * v.length;
                        return { variant: v, index: idx, count, cubicFootage };
                    });
                    
                    // Remove duplicates (keep first occurrence of each measurement)
                    const seen = new Set();
                    const uniqueVariants = variantsWithCounts.filter(item => {
                        const key = `${item.variant.width}x${item.variant.height}x${item.variant.length}`;
                        if (seen.has(key)) return false;
                        seen.add(key);
                        return true;
                    });
                    
                    // Sort by count (desc), then by cubic footage (desc)
                    uniqueVariants.sort((a, b) => {
                        if (a.count !== b.count) return b.count - a.count;
                        return b.cubicFootage - a.cubicFootage;
                    });
                    
                    changeDropdown = `<select class="dimension-select" onchange="swapMeasurementVariant('${g.gameId}', this.value); renderPopularTab()" style="margin-top: 0.25rem; font-size: 0.75rem; padding: 0.25rem;">`;
                    uniqueVariants.forEach(item => {
                        const isSelected = selectedVariant === item.index ? 'selected' : '';
                        const v = item.variant;
                        changeDropdown += `<option value="${item.index}" ${isSelected}>${v.width.toFixed(0)}"×${v.height.toFixed(0)}"×${v.length.toFixed(0)}" (${item.count})</option>`;
                    });
                    changeDropdown += `</select>`;
                } else {
                    changeDropdown = `<div style="font-size: 0.75rem; color: #999;">—</div>`;
                }

                html += `
                    <div class="table-row">
                        <div class="thumbnail-cell">
                            <img src="${g.thumbnail || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect fill=%22%23f0f0f0%22 width=%22100%22 height=%22100%22/%3E%3C/svg%3E'}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect fill=%22%23f0f0f0%22 width=%22100%22 height=%22100%22/%3E%3C/svg%3E'" alt="">
                        </div>
                        <div class="name-cell" title="${g.name}">${g.name}</div>
                        <div class="dimension-cell" style="text-align: center;">${selectedMeasure.width.toFixed(1)}"</div>
                        <div class="dimension-cell" style="text-align: center;">${selectedMeasure.height.toFixed(1)}"</div>
                        <div class="dimension-cell" style="text-align: center;">${selectedMeasure.length.toFixed(1)}"</div>
                        <div class="dimension-cell" style="text-align: center;">${middleMeasure.toFixed(1)}"</div>
                        <div class="dimension-cell" style="text-align: center;">${shortestMeasure.toFixed(1)}"</div>
                        <div style="text-align: center; font-size: 0.85rem; font-weight: 600;">${countForSelected}</div>
                        <div style="text-align: center; font-size: 0.85rem;">${g.differentMeasures}</div>
                        <div style="text-align: center; font-size: 0.85rem;">${g.totalVersions}</div>
                        <div style="text-align: center;">${changeDropdown}</div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function swapMeasurementVariant(gameId, variantIndex) {
            selectedMeasurements[gameId] = parseInt(variantIndex);
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-button').forEach((btn, i) => {
                btn.classList.toggle('active', (i === 0 && tab === 'all') || (i === 1 && tab === 'popular'));
            });

            document.getElementById('allTab').classList.toggle('active', tab === 'all');
            document.getElementById('popularTab').classList.toggle('active', tab === 'popular');

            if (tab === 'all') {
                renderAllTab();
            } else {
                renderPopularTab();
            }
        }

        function getMiddleMeasurement(width, height, length) {
            const dims = [width, height, length].sort((a, b) => a - b);
            return dims[1];
        }

        function getShortestMeasurement(width, height, length) {
            return Math.min(width, height, length);
        }

        function sortTable(tab, column) {
            const data = tab === 'all' ? filteredAllData : filteredPopularData;
            
            if (currentSortColumn === column) {
                currentSortDirection = currentSortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                currentSortColumn = column;
                // Mid and Short columns should default to desc (largest first)
                currentSortDirection = (column === 'middle' || column === 'short') ? 'desc' : 'asc';
            }

            data.sort((a, b) => {
                let aVal, bVal;

                if (column === 'middle') {
                    // For popular tab, use selected variant; for all tab, use direct values
                    if (tab === 'popular') {
                        const selectedVariantA = selectedMeasurements[a.gameId] || 0;
                        const measureA = a.versions && a.versions[selectedVariantA] ? a.versions[selectedVariantA] : { width: a.width, height: a.height, length: a.length };
                        const selectedVariantB = selectedMeasurements[b.gameId] || 0;
                        const measureB = b.versions && b.versions[selectedVariantB] ? b.versions[selectedVariantB] : { width: b.width, height: b.height, length: b.length };
                        aVal = getMiddleMeasurement(measureA.width, measureA.height, measureA.length);
                        bVal = getMiddleMeasurement(measureB.width, measureB.height, measureB.length);
                    } else {
                        aVal = getMiddleMeasurement(a.width, a.height, a.length);
                        bVal = getMiddleMeasurement(b.width, b.height, b.length);
                    }
                } else if (column === 'short') {
                    // For popular tab, use selected variant; for all tab, use direct values
                    if (tab === 'popular') {
                        const selectedVariantA = selectedMeasurements[a.gameId] || 0;
                        const measureA = a.versions && a.versions[selectedVariantA] ? a.versions[selectedVariantA] : { width: a.width, height: a.height, length: a.length };
                        const selectedVariantB = selectedMeasurements[b.gameId] || 0;
                        const measureB = b.versions && b.versions[selectedVariantB] ? b.versions[selectedVariantB] : { width: b.width, height: b.height, length: b.length };
                        aVal = getShortestMeasurement(measureA.width, measureA.height, measureA.length);
                        bVal = getShortestMeasurement(measureB.width, measureB.height, measureB.length);
                    } else {
                        aVal = getShortestMeasurement(a.width, a.height, a.length);
                        bVal = getShortestMeasurement(b.width, b.height, b.length);
                    }
                } else {
                    aVal = a[column] || '';
                    bVal = b[column] || '';
                }

                if (typeof aVal === 'number' && typeof bVal === 'number') {
                    return currentSortDirection === 'asc' ? aVal - bVal : bVal - aVal;
                }

                aVal = String(aVal).toLowerCase();
                bVal = String(bVal).toLowerCase();
                const cmp = aVal.localeCompare(bVal);
                return currentSortDirection === 'asc' ? cmp : -cmp;
            });

            if (tab === 'all') {
                renderAllTab();
            } else {
                renderPopularTab();
            }
        }

        function filterTable(tab) {
            const searchInput = tab === 'all' ? document.getElementById('searchAll') : document.getElementById('searchPopular');
            const searchTerm = searchInput.value.toLowerCase();

            if (tab === 'all') {
                filteredAllData = allMeasurements.filter(m => m.name.toLowerCase().includes(searchTerm));
                renderAllTab();
            } else {
                filteredPopularData = popularMeasurements.filter(g => g.name.toLowerCase().includes(searchTerm));
                renderPopularTab();
            }
        }

        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.classList.remove('hidden', 'loading', 'error', 'success');
            statusDiv.classList.add(type);
        }

        function toggleStatusVisibility(show) {
            statusDiv.classList.toggle('hidden', !show);
        }

        async function copyPopularTableAsText() {
            if (filteredPopularData.length === 0) {
                showStatus('No data to copy', 'error');
                return;
            }

            // Create text representation of the table
            let text = 'Game Name\tW (in)\tH (in)\tL (in)\tVars\n';
            text += '='.repeat(60) + '\n';
            
            filteredPopularData.forEach(g => {
                text += `${g.name}\t${g.width.toFixed(1)}\t${g.height.toFixed(1)}\t${g.length.toFixed(1)}\t${g.versionsMatchingSpec}/${g.totalVersions}\n`;
            });

            try {
                await navigator.clipboard.writeText(text);
                showStatus('Table copied to clipboard!', 'success');
                setTimeout(() => {
                    toggleStatusVisibility(false);
                }, 2000);
            } catch (err) {
                console.error('Failed to copy:', err);
                showStatus('Failed to copy to clipboard', 'error');
            }
        }

        function calculateShelfTime() {
            const MID_LIMIT = 13;
            const SHORT_LIMIT = 13;
            
            if (filteredPopularData.length === 0) {
                return { cubes: [], skipped: 0 };
            }

            // Create working copy sorted by Mid descending
            const gamesToProcess = filteredPopularData.map(g => {
                const selectedVariant = selectedMeasurements[g.gameId] || 0;
                const selectedMeasure = g.versions && g.versions[selectedVariant] ? g.versions[selectedVariant] : {
                    width: g.width,
                    height: g.height,
                    length: g.length
                };
                return {
                    ...g,
                    mid: getMiddleMeasurement(selectedMeasure.width, selectedMeasure.height, selectedMeasure.length),
                    short: getShortestMeasurement(selectedMeasure.width, selectedMeasure.height, selectedMeasure.length)
                };
            }).sort((a, b) => b.mid - a.mid);

            let cubes = [];
            let currentCube = [];
            let currentShortSum = 0;
            let skipped = 0;

            gamesToProcess.forEach(game => {
                // Skip games where Mid >= 13"
                if (game.mid >= MID_LIMIT) {
                    skipped++;
                    return;
                }

                // Check if Short fits in current cube (compounding)
                if (currentShortSum + game.short <= SHORT_LIMIT) {
                    currentCube.push(game);
                    currentShortSum += game.short;
                } else {
                    // Start new cube
                    if (currentCube.length > 0) {
                        cubes.push({
                            games: currentCube,
                            shortSum: currentShortSum
                        });
                    }
                    currentCube = [game];
                    currentShortSum = game.short;
                }
            });

            // Push last cube if it has games
            if (currentCube.length > 0) {
                cubes.push({
                    games: currentCube,
                    shortSum: currentShortSum
                });
            }

            return { cubes, skipped };
        }

        function openShelfTimeModal() {
            const modal = document.getElementById('shelfTimeModal');
            const body = document.getElementById('shelfTimeBody');

            const { cubes, skipped } = calculateShelfTime();

            let html = '';

            // Summary section
            html += `<div class="shelf-summary">
                <div class="shelf-summary-row">
                    <span>Total Cubes Needed:</span>
                    <span style="font-size: 1.3rem;">${cubes.length}</span>
                </div>
                <div class="shelf-summary-row">
                    <span>Games Assigned:</span>
                    <span>${filteredPopularData.length - skipped}</span>
                </div>`;
            
            if (skipped > 0) {
                html += `<div class="shelf-summary-row">
                    <span>Games Skipped (Mid ≥ 13"):</span>
                    <span style="color: #ff6b6b;">${skipped}</span>
                </div>`;
            }
            
            html += `</div>`;

            if (skipped > 0) {
                html += `<div class="shelf-warning">
                    ⚠️ ${skipped} game(s) skipped because their middle dimension is ≥ 13"
                </div>`;
            }

            // Cubes section
            html += `<div class="cube-container">`;
            
            const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E2', '#F8B88B', '#52C9B5'];
            
            cubes.forEach((cube, idx) => {
                html += `<div class="cube-card">
                    <div class="cube-title">Cube ${idx + 1}</div>`;
                
                // Create visualization
                const totalShort = cube.shortSum;
                const scale = 150 / 13; // Scale to 150px (representing 13")
                let posY = 0;
                
                html += `<div class="cube-visualization">`;
                
                cube.games.forEach((game, gameIdx) => {
                    const boxHeight = (game.short * scale);
                    const boxColor = colors[gameIdx % colors.length];
                    const gameName = game.name.substring(0, 12);
                    html += `<div class="cube-box" style="top: ${posY}px; left: 0; width: 100%; height: ${boxHeight}px; background-color: ${boxColor};">${gameName}</div>`;
                    posY += boxHeight;
                });
                
                // Add white space for remaining
                const remainingShort = 13 - totalShort;
                if (remainingShort > 0) {
                    const whiteHeight = (remainingShort * scale);
                    html += `<div style="position: absolute; top: ${posY}px; left: 0; width: 100%; height: ${whiteHeight}px; background-color: white; border: 1px dashed #ccc;"></div>`;
                }
                
                html += `</div>`;
                
                cube.games.forEach(game => {
                    const thumbnail = game.thumbnail || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect fill=%22%23f0f0f0%22 width=%22100%22 height=%22100%22/%3E%3C/svg%3E';
                    html += `<div class="cube-game">
                        <div style="display: flex; gap: 0.5rem; align-items: flex-start;">
                            <img src="${thumbnail}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect fill=%22%23f0f0f0%22 width=%22100%22 height=%22100%22/%3E%3C/svg%3E'" alt="" style="width: 40px; height: 40px; border-radius: 3px; object-fit: cover; flex-shrink: 0;">
                            <div style="flex: 1;">
                                <div class="cube-game-name">${game.name}</div>
                                <div class="cube-game-info">
                                    Mid: ${game.mid.toFixed(1)}" | Short: ${game.short.toFixed(1)}"
                                </div>
                            </div>
                        </div>
                    </div>`;
                });

                const cubeRemaining = 13 - cube.shortSum;
                html += `<div class="cube-stats">
                    <div>Games: ${cube.games.length}</div>
                    <div>Short Sum: ${cube.shortSum.toFixed(1)}"</div>
                    <div style="color: ${cubeRemaining < 1 ? '#ff6b6b' : '#4caf50'};">
                        Available: ${cubeRemaining.toFixed(1)}"
                    </div>
                </div>`;
                
                html += `</div>`;
            });

            html += `</div>`;

            body.innerHTML = html;
            modal.style.display = 'flex';
        }

        function closeShelfTimeModal() {
            document.getElementById('shelfTimeModal').style.display = 'none';
        }

        // Close modal when clicking outside
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById('shelfTimeModal');
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    closeShelfTimeModal();
                }
            });
        });

        // Initialize
        document.getElementById('username').focus();
    </script>
</body>
</html>
