<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Game Measurements</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>📏</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            height: 100%;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            max-width: none;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            padding-top: env(safe-area-inset-top, 0);
            padding-bottom: env(safe-area-inset-bottom, 0);
            padding-left: env(safe-area-inset-left, 0);
            padding-right: env(safe-area-inset-right, 0);
        }

        .header {
            flex-shrink: 0;
            padding: 1rem;
            border-bottom: 1px solid #eee;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .setup-section {
            flex-shrink: 0;
            padding: 1rem;
            background: white;
            border-bottom: 1px solid #eee;
        }

        .input-group {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
            align-items: flex-end;
        }

        .input-field {
            flex: 1;
            min-width: 200px;
        }

        .input-field label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: #666;
        }

        .input-field input, .input-field select {
            width: 100%;
            padding: 0.7rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            -webkit-appearance: none;
            appearance: none;
            transition: all 0.2s;
        }

        .input-field input:focus, .input-field select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 0.7rem 1.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            font-size: 1rem;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
            opacity: 0.9;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            font-size: 0.85rem;
            color: #666;
            padding: 0.75rem;
            background: #f9f9f9;
            border-radius: 6px;
            text-align: center;
            border-left: 4px solid #667eea;
        }

        .status.loading {
            color: #667eea;
            font-weight: 600;
        }

        .status.error {
            background: #ffebee;
            border-left-color: #f44336;
            color: #c62828;
        }

        .status.success {
            background: #e8f5e9;
            border-left-color: #4caf50;
            color: #2e7d32;
        }

        .tabs-container {
            flex-shrink: 0;
            display: flex;
            border-bottom: 1px solid #eee;
            background: white;
            gap: 0;
        }

        .tab-button {
            flex: 1;
            padding: 1rem;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-weight: 600;
            color: #999;
            font-size: 0.95rem;
            transition: all 0.2s;
            text-align: center;
            -webkit-appearance: none;
            appearance: none;
        }

        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-button:active {
            background: #f5f5f5;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .tab-content {
            display: none;
            flex: 1;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .tab-content.active {
            display: flex;
        }

        .search-bar {
            flex-shrink: 0;
            padding: 0.75rem 1rem;
            background: white;
            border-bottom: 1px solid #eee;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            -webkit-appearance: none;
            appearance: none;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .table-wrapper {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .table-header {
            display: grid;
            grid-template-columns: 60px 1fr 80px 70px 70px 70px;
            gap: 0.75rem;
            padding: 0.75rem;
            background: #f5f5f5;
            border-bottom: 2px solid #e0e0e0;
            font-weight: 600;
            font-size: 0.85rem;
            color: #666;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .table-header-cell {
            padding: 0.5rem;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: color 0.2s;
        }

        .table-header-cell:hover {
            color: #333;
        }

        .sort-indicator {
            font-size: 0.8rem;
            color: #667eea;
        }

        .table-row {
            display: grid;
            grid-template-columns: 60px 1fr 80px 70px 70px 70px;
            gap: 0.75rem;
            padding: 0.75rem;
            border-bottom: 1px solid #eee;
            align-items: center;
            transition: background 0.2s;
        }

        .table-row:hover {
            background: #f9f9f9;
        }

        .table-row:active {
            background: #f0f4ff;
        }

        .thumbnail-cell {
            width: 60px;
            height: 60px;
            flex-shrink: 0;
            background: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        .thumbnail-cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .name-cell {
            font-weight: 600;
            color: #333;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .id-cell, .dimension-cell {
            font-size: 0.9rem;
            color: #666;
            text-align: right;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .count-cell {
            text-align: center;
            font-weight: 600;
            color: #667eea;
            background: #f0f4ff;
            border-radius: 4px;
            padding: 0.3rem;
        }

        .variants-cell {
            text-align: center;
            font-size: 0.85rem;
            color: #ff9800;
            padding: 0.3rem;
            background: #fff3e0;
            border-radius: 4px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            text-align: center;
            padding: 2rem;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        .progress-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 2rem;
        }

        .progress-bar {
            width: 100%;
            max-width: 300px;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s;
            width: 0%;
        }

        .progress-text {
            font-size: 0.9rem;
            color: #666;
        }

        @media (max-width: 768px) {
            .table-header, .table-row {
                grid-template-columns: 50px 1fr 60px 60px 60px 60px;
                gap: 0.5rem;
            }

            .thumbnail-cell {
                width: 50px;
                height: 50px;
            }

            .table-header-cell, .table-row {
                font-size: 0.8rem;
                padding: 0.5rem;
            }

            .name-cell {
                font-size: 0.85rem;
            }

            .dimension-cell {
                font-size: 0.8rem;
            }

            .input-group {
                gap: 0.5rem;
            }

            .input-field {
                min-width: 150px;
            }
        }

        @media (max-width: 480px) {
            .table-header, .table-row {
                grid-template-columns: 45px 1fr 50px 50px 50px 50px;
                gap: 0.4rem;
            }

            .thumbnail-cell {
                width: 45px;
                height: 45px;
            }

            .header h1 {
                font-size: 1.2rem;
            }

            .table-header-cell, .table-row {
                font-size: 0.75rem;
                padding: 0.4rem;
            }

            .input-group {
                flex-direction: column;
            }

            .input-field {
                min-width: 100%;
            }

            .btn {
                width: 100%;
            }

            .tab-button {
                padding: 0.75rem;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📏 Game Measurements</h1>
        </div>

        <div class="setup-section">
            <div class="input-group">
                <div class="input-field">
                    <label for="username">BGG Username</label>
                    <input type="text" id="username" placeholder="e.g., sportomax" value="sportomax">
                </div>
                <div class="input-field">
                    <label for="maxGames">Max Games</label>
                    <input type="number" id="maxGames" value="100" min="1" max="500">
                </div>
                <button class="btn" id="fetchBtn" onclick="fetchMeasurements()">Fetch Data</button>
            </div>
            <div id="statusDiv" class="status hidden">Loading...</div>
        </div>

        <div class="tabs-container" id="tabsContainer">
            <button class="tab-button active" onclick="switchTab('all')">📋 All Measurements</button>
            <button class="tab-button" onclick="switchTab('popular')">⭐ Most Popular</button>
        </div>

        <div class="main-content">
            <!-- All Measurements Tab -->
            <div class="tab-content active" id="allTab">
                <div class="search-bar">
                    <input type="text" class="search-input" id="searchAll" placeholder="Search game name..." onkeyup="filterTable('all')">
                </div>
                <div class="table-wrapper">
                    <div id="allTableContainer">
                        <div class="empty-state">
                            <div class="empty-state-icon">📏</div>
                            <p>Enter a username and click Fetch Data to see all measurements</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Most Popular Tab -->
            <div class="tab-content" id="popularTab">
                <div class="search-bar">
                    <input type="text" class="search-input" id="searchPopular" placeholder="Search game name..." onkeyup="filterTable('popular')">
                </div>
                <div class="table-wrapper">
                    <div id="popularTableContainer">
                        <div class="empty-state">
                            <div class="empty-state-icon">⭐</div>
                            <p>Enter a username and click Fetch Data to see most popular measurements</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Prevent double-tap zoom
        document.addEventListener('touchstart', function(e) {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, false);

        let allMeasurements = [];
        let popularMeasurements = [];
        let filteredAllData = [];
        let filteredPopularData = [];
        let currentSortColumn = 'name';
        let currentSortDirection = 'asc';
        let currentTab = 'all';

        const statusDiv = document.getElementById('statusDiv');
        const fetchBtn = document.getElementById('fetchBtn');

        async function fetchFromBGG(endpoint, params = {}, retries = 5) {
            const queryParams = new URLSearchParams(params).toString();
            const fullUrl = `/api/bgg-helper?endpoint=${endpoint}&${queryParams}`;

            try {
                const response = await fetch(fullUrl);

                if (response.status === 202 && retries > 0) {
                    statusDiv.textContent = `BGG is processing... (${retries} retries left)`;
                    await new Promise(r => setTimeout(r, 3000));
                    return fetchFromBGG(endpoint, params, retries - 1);
                }

                if (!response.ok) throw new Error(`API Status ${response.status}`);
                return await response.text();
            } catch (error) {
                throw new Error(`Network/API error: ${error.message}`);
            }
        }

        async function fetchMeasurements() {
            const username = document.getElementById('username').value.trim();
            const maxGames = parseInt(document.getElementById('maxGames').value);

            if (!username) {
                showStatus('Please enter a username', 'error');
                return;
            }

            if (maxGames < 1 || maxGames > 500) {
                showStatus('Max games must be between 1 and 500', 'error');
                return;
            }

            fetchBtn.disabled = true;
            showStatus(`Fetching collection for ${username} (own=1)...`, 'loading');

            try {
                // Fetch collection using proxy
                const collectionText = await fetchFromBGG('collection', {
                    username: username,
                    own: '1',
                    stats: '1'
                });

                const parser = new DOMParser();
                const collectionXml = parser.parseFromString(collectionText, 'text/xml');

                if (collectionXml.querySelector('error')) {
                    throw new Error('Invalid BGG response - user not found or collection is private');
                }

                const items = Array.from(collectionXml.querySelectorAll('item')).slice(0, maxGames);

                if (items.length === 0) {
                    throw new Error('No owned games found');
                }

                showStatus(`Found ${items.length} games. Fetching measurements...`, 'loading');

                const gameIds = items.map(item => item.getAttribute('objectid'));
                allMeasurements = [];
                const batchSize = 20;

                for (let i = 0; i < gameIds.length; i += batchSize) {
                    const batch = gameIds.slice(i, i + batchSize);
                    const progress = Math.round((i / gameIds.length) * 100);
                    showStatus(`Fetching batch ${Math.ceil((i + 1) / batchSize)} of ${Math.ceil(gameIds.length / batchSize)}... (${progress}%)`, 'loading');

                    // Fetch thing data using proxy
                    const thingText = await fetchFromBGG('thing', {
                        ids: batch.join(','),
                        versions: '1'
                    });

                    const thingXml = parser.parseFromString(thingText, 'text/xml');

                    Array.from(thingXml.querySelectorAll('item')).forEach(item => {
                        const gameName = item.querySelector('name')?.getAttribute('value') || 'Unknown';
                        const gameId = item.getAttribute('id');
                        const thumbnail = item.querySelector('thumbnail')?.textContent;

                        // Get all versions
                        const versions = item.querySelector('versions');
                        if (versions) {
                            Array.from(versions.querySelectorAll('version')).forEach(version => {
                                const versionId = version.getAttribute('id');
                                const width = version.querySelector('width')?.textContent;
                                const height = version.querySelector('height')?.textContent;
                                const length = version.querySelector('length')?.textContent;

                                if (width && height && length) {
                                    allMeasurements.push({
                                        name: gameName,
                                        gameId: gameId,
                                        versionId: versionId,
                                        width: parseFloat(width),
                                        height: parseFloat(height),
                                        length: parseFloat(length),
                                        thumbnail: thumbnail,
                                    });
                                }
                            });
                        }
                    });

                    // Rate limiting
                    await new Promise(r => setTimeout(r, 500));
                }

                // Calculate popular measurements
                const gameGrouped = {};
                allMeasurements.forEach(m => {
                    if (!gameGrouped[m.gameId]) {
                        gameGrouped[m.gameId] = {
                            name: m.name,
                            gameId: m.gameId,
                            thumbnail: m.thumbnail,
                            versions: []
                        };
                    }
                    gameGrouped[m.gameId].versions.push(m);
                });

                popularMeasurements = Object.values(gameGrouped).map(g => {
                    // Find most common measurement
                    const measurementKey = m => `${m.width}x${m.height}x${m.length}`;
                    const measurementCounts = {};
                    let maxCount = 0;
                    let mostPopularMeasure = null;

                    g.versions.forEach(v => {
                        const key = measurementKey(v);
                        measurementCounts[key] = (measurementCounts[key] || 0) + 1;
                        if (measurementCounts[key] > maxCount) {
                            maxCount = measurementCounts[key];
                            mostPopularMeasure = v;
                        }
                    });

                    const differentMeasures = Object.keys(measurementCounts).length;

                    return {
                        name: g.name,
                        gameId: g.gameId,
                        thumbnail: g.thumbnail,
                        width: mostPopularMeasure.width,
                        height: mostPopularMeasure.height,
                        length: mostPopularMeasure.length,
                        count: maxCount,
                        differentMeasures: differentMeasures,
                        variants: differentMeasures > 1 ? differentMeasures - 1 : 0
                    };
                });

                filteredAllData = [...allMeasurements];
                filteredPopularData = [...popularMeasurements];

                showStatus(`Successfully loaded ${allMeasurements.length} measurements from ${popularMeasurements.length} games`, 'success');
                renderAllTab();
                renderPopularTab();

            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
            } finally {
                fetchBtn.disabled = false;
            }
        }

        function renderAllTab() {
            const container = document.getElementById('allTableContainer');
            
            if (filteredAllData.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📏</div><p>No measurements found</p></div>';
                return;
            }

            let html = `
                <div class="table-header">
                    <div class="table-header-cell" onclick="sortTable('all', 'thumbnail')">Thumb</div>
                    <div class="table-header-cell" onclick="sortTable('all', 'name')">Game Name ${currentTab === 'all' && currentSortColumn === 'name' ? (currentSortDirection === 'asc' ? '▲' : '▼') : ''}</div>
                    <div class="table-header-cell" onclick="sortTable('all', 'versionId')">Version <span class="sort-indicator">${currentTab === 'all' && currentSortColumn === 'versionId' ? (currentSortDirection === 'asc' ? '▲' : '▼') : ''}</span></div>
                    <div class="table-header-cell" onclick="sortTable('all', 'width')">W<span class="sort-indicator">${currentTab === 'all' && currentSortColumn === 'width' ? (currentSortDirection === 'asc' ? '▲' : '▼') : ''}</span></div>
                    <div class="table-header-cell" onclick="sortTable('all', 'height')">H<span class="sort-indicator">${currentTab === 'all' && currentSortColumn === 'height' ? (currentSortDirection === 'asc' ? '▲' : '▼') : ''}</span></div>
                    <div class="table-header-cell" onclick="sortTable('all', 'length')">L<span class="sort-indicator">${currentTab === 'all' && currentSortColumn === 'length' ? (currentSortDirection === 'asc' ? '▲' : '▼') : ''}</span></div>
                </div>
            `;

            filteredAllData.forEach(m => {
                html += `
                    <div class="table-row">
                        <div class="thumbnail-cell">
                            <img src="${m.thumbnail || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect fill=%22%23f0f0f0%22 width=%22100%22 height=%22100%22/%3E%3C/svg%3E'}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect fill=%22%23f0f0f0%22 width=%22100%22 height=%22100%22/%3E%3C/svg%3E'" alt="">
                        </div>
                        <div class="name-cell" title="${m.name}">${m.name}</div>
                        <div class="id-cell">${m.versionId}</div>
                        <div class="dimension-cell">${m.width.toFixed(1)}"</div>
                        <div class="dimension-cell">${m.height.toFixed(1)}"</div>
                        <div class="dimension-cell">${m.length.toFixed(1)}"</div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function renderPopularTab() {
            const container = document.getElementById('popularTableContainer');

            if (filteredPopularData.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⭐</div><p>No games found</p></div>';
                return;
            }

            let html = `
                <div class="table-header">
                    <div class="table-header-cell" onclick="sortTable('popular', 'thumbnail')">Thumb</div>
                    <div class="table-header-cell" onclick="sortTable('popular', 'name')">Game Name ${currentTab === 'popular' && currentSortColumn === 'name' ? (currentSortDirection === 'asc' ? '▲' : '▼') : ''}</div>
                    <div class="table-header-cell" onclick="sortTable('popular', 'width')">W<span class="sort-indicator">${currentTab === 'popular' && currentSortColumn === 'width' ? (currentSortDirection === 'asc' ? '▲' : '▼') : ''}</span></div>
                    <div class="table-header-cell" onclick="sortTable('popular', 'height')">H<span class="sort-indicator">${currentTab === 'popular' && currentSortColumn === 'height' ? (currentSortDirection === 'asc' ? '▲' : '▼') : ''}</span></div>
                    <div class="table-header-cell" onclick="sortTable('popular', 'length')">L<span class="sort-indicator">${currentTab === 'popular' && currentSortColumn === 'length' ? (currentSortDirection === 'asc' ? '▲' : '▼') : ''}</span></div>
                    <div class="table-header-cell" onclick="sortTable('popular', 'variants')">Vars<span class="sort-indicator">${currentTab === 'popular' && currentSortColumn === 'variants' ? (currentSortDirection === 'asc' ? '▲' : '▼') : ''}</span></div>
                </div>
            `;

            filteredPopularData.forEach(g => {
                html += `
                    <div class="table-row">
                        <div class="thumbnail-cell">
                            <img src="${g.thumbnail || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect fill=%22%23f0f0f0%22 width=%22100%22 height=%22100%22/%3E%3C/svg%3E'}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect fill=%22%23f0f0f0%22 width=%22100%22 height=%22100%22/%3E%3C/svg%3E'" alt="">
                        </div>
                        <div class="name-cell" title="${g.name}">${g.name}</div>
                        <div class="dimension-cell">${g.width.toFixed(1)}"</div>
                        <div class="dimension-cell">${g.height.toFixed(1)}"</div>
                        <div class="dimension-cell">${g.length.toFixed(1)}"</div>
                        <div class="variants-cell">${g.variants}</div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-button').forEach((btn, i) => {
                btn.classList.toggle('active', (i === 0 && tab === 'all') || (i === 1 && tab === 'popular'));
            });

            document.getElementById('allTab').classList.toggle('active', tab === 'all');
            document.getElementById('popularTab').classList.toggle('active', tab === 'popular');

            if (tab === 'all') {
                renderAllTab();
            } else {
                renderPopularTab();
            }
        }

        function sortTable(tab, column) {
            const data = tab === 'all' ? filteredAllData : filteredPopularData;
            
            if (currentSortColumn === column) {
                currentSortDirection = currentSortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                currentSortColumn = column;
                currentSortDirection = 'asc';
            }

            data.sort((a, b) => {
                let aVal = a[column] || '';
                let bVal = b[column] || '';

                if (typeof aVal === 'number' && typeof bVal === 'number') {
                    return currentSortDirection === 'asc' ? aVal - bVal : bVal - aVal;
                }

                aVal = String(aVal).toLowerCase();
                bVal = String(bVal).toLowerCase();
                const cmp = aVal.localeCompare(bVal);
                return currentSortDirection === 'asc' ? cmp : -cmp;
            });

            if (tab === 'all') {
                renderAllTab();
            } else {
                renderPopularTab();
            }
        }

        function filterTable(tab) {
            const searchInput = tab === 'all' ? document.getElementById('searchAll') : document.getElementById('searchPopular');
            const searchTerm = searchInput.value.toLowerCase();

            if (tab === 'all') {
                filteredAllData = allMeasurements.filter(m => m.name.toLowerCase().includes(searchTerm));
                renderAllTab();
            } else {
                filteredPopularData = popularMeasurements.filter(g => g.name.toLowerCase().includes(searchTerm));
                renderPopularTab();
            }
        }

        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.classList.remove('hidden', 'loading', 'error', 'success');
            statusDiv.classList.add(type);
        }

        function toggleStatusVisibility(show) {
            statusDiv.classList.toggle('hidden', !show);
        }

        // Initialize
        document.getElementById('username').focus();
    </script>
</body>
</html>
