<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Overlap Pro - Board Game Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: white; overflow: hidden; }
        
        .stage-container {
            position: relative;
            width: 100%;
            height: 60vh;
            border-radius: 1.5rem;
            overflow: hidden;
            background: #111;
            border: 1px solid #333;
        }

        /* Panel Mode: Full BG + Floating Thumbnail */
        .bg-full {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: var(--bg-filter, none);
            transition: all 0.5s ease;
        }

        .overlay-thumb {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            object-fit: cover;
            border: 4px solid rgba(255,255,255,0.2);
            border-radius: 1rem;
            opacity: 0.5;
            z-index: 20;
            transition: all 0.5s ease;
        }

        /* Pixel Mode */
        .pixelated {
            image-rendering: pixelated;
            filter: blur(var(--pixel-blur, 10px)) contrast(120%);
        }

        .reveal-active .overlay-thumb { opacity: 1; width: 80%; height: 80%; border-color: #ec4899; }
        .reveal-active .bg-full { filter: none !important; opacity: 0.3; }
        .result-entry { display:inline-flex; gap:6px; align-items:center; padding:6px; border-radius:8px; background: rgba(255,255,255,0.02); margin-right:8px; }
        .result-entry .thumb { width:48px; height:48px; border-radius:6px; object-fit:cover; border:2px solid rgba(255,255,255,0.06); }
        .result-entry .thumb.front { box-shadow: 0 6px 18px rgba(46,204,113,0.12); border-color: rgba(46,204,113,0.3); }
        .swap-anim { animation: swapAnim 420ms ease; }
        @keyframes swapAnim { 0% { transform: rotateY(0) scale(1); } 50% { transform: rotateY(90deg) scale(0.98); } 100% { transform: rotateY(0) scale(1); } }
        .round-transition { animation: roundFade 360ms ease; }
        @keyframes roundFade { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <div id="setup" class="flex-1 flex flex-col items-center justify-center p-6 space-y-8">
        <div class="text-center">
            <h1 class="text-5xl font-black italic tracking-tighter text-pink-500">OVERLAP</h1>
            <p class="text-gray-400 font-medium">Identify the blended board games</p>
        </div>

        <div class="w-full max-w-sm space-y-4 bg-gray-900/50 p-8 rounded-3xl border border-white/10 backdrop-blur-md">
            <input type="text" id="username" value="sportomax" class="w-full bg-black/40 p-4 rounded-xl border border-gray-700 outline-none focus:border-pink-500 transition-all text-center font-bold">
            
            <!-- Mode selector: 'overlap' produces alternating vertical strips from each image
                 'pixel' produces a checker/block alternation. Renamed from 'panel' to 'overlap'. -->
            <select id="mode" class="w-full bg-black/40 p-4 rounded-xl border border-gray-700 font-bold">
                <option value="overlap">Overlap Strips (vertical alternating strips)</option>
                <option value="pixel">Pixel Mode (alternating pixel blocks)</option>
                <option value="blend">Blend Mode (full image A at 100%, image B at 50% overlay)</option>
            </select>

            <button id="startBtn" class="w-full bg-gradient-to-r from-pink-600 to-purple-600 py-4 rounded-xl font-black text-lg shadow-lg shadow-pink-500/20 active:scale-95 transition-all">
                START CHALLENGE
            </button>
        </div>
    </div>

    <div id="game" class="hidden flex-1 flex flex-col p-4 max-w-4xl mx-auto w-full gap-4">
        <div class="flex justify-between items-center px-2">
            <div id="scoreLabel" class="text-pink-500 font-black">SCORE: 0</div>
            <div id="progressLabel" class="text-gray-500 font-bold uppercase text-xs tracking-widest">Game 1 / 10</div>
        </div>

        <!-- Stage: we use a single canvas so both images are drawn to the exact same box size.
             Canvas rendering implements both 'overlap' (vertical strips) and 'pixel' (block alternation).
             When revealed we draw the back image at full opacity and the front image at 50% on top.
        -->
        <div class="stage-container" id="stage">
            <canvas id="stageCanvas" style="width:100%; height:100%; display:block;"></canvas>
            <!-- Fallback thumbnails kept but hidden; canvas is authoritative -->
            <img id="mainImg" class="bg-full" src="" style="display:none">
            <img id="subImg" class="overlay-thumb" src="" style="display:none">
        </div>

        <div id="resultsPanel" class="hidden mt-2 p-2 rounded-xl" style="max-height:120px;overflow:auto;">
            <!-- past result thumbnails will be appended here -->
        </div>

        <div class="grid grid-cols-3 gap-3">
            <button id="swapBtn" class="py-3 col-span-1 bg-gray-800 text-white font-bold rounded-2xl">SWAP</button>
            <button id="revealBtn" class="col-span-2 py-4 bg-white text-black font-black rounded-2xl text-xl">REVEAL</button>
            <div id="validationBtns" class="hidden col-span-3 grid grid-cols-2 gap-3">
                <button onclick="nextRound(false)" class="py-4 bg-red-600/20 border border-red-600 text-red-500 font-bold rounded-2xl hover:bg-red-600 hover:text-white transition-all">MISSED IT</button>
                <button onclick="nextRound(true)" class="py-4 bg-green-600/20 border border-green-600 text-green-500 font-bold rounded-2xl hover:bg-green-600 hover:text-white transition-all">GOT BOTH!</button>
            </div>
        </div>

        <div id="nameDisplay" class="hidden text-center p-4 bg-gray-900 rounded-2xl border border-gray-800">
            <p id="gameNames" class="text-lg font-bold text-pink-400"></p>
        </div>
    </div>

    <script>
        let gameStack = [];
        let cursor = 0;
        let score = 0;

        async function fetchBGG(user) {
            const res = await fetch(`/api/bgg-helper?endpoint=collection&username=${user}&own=1&stats=1`);
            const xmlText = await res.text();
            const xml = new DOMParser().parseFromString(xmlText, 'text/xml');
            return Array.from(xml.querySelectorAll('item')).map(item => ({
                name: item.querySelector('name')?.textContent || 'Unknown',
                img: item.querySelector('image')?.textContent || ''
            })).filter(g => g.img);
        }

        document.getElementById('startBtn').onclick = async () => {
            const user = document.getElementById('username').value;
            document.getElementById('startBtn').innerText = "SYNCING...";
            gameStack = await fetchBGG(user);
            gameStack.sort(() => Math.random() - 0.5);
            // ensure at least 20 entries by looping if necessary
            if (gameStack.length < 20) {
                const base = gameStack.slice();
                while (gameStack.length < 20) gameStack = gameStack.concat(base).slice(0, Math.max(20, gameStack.length+base.length));
            }
            
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('game').classList.remove('hidden');
            roundsPlayed = 0;
            maxRounds = 10;
            loadGame();
        };

        let roundsPlayed = 0;
        let maxRounds = 10;

        function loadGame() {
            const mode = document.getElementById('mode').value;
            const g1 = gameStack[cursor];
            const g2 = gameStack[(cursor + 1) % gameStack.length];
            const canvas = document.getElementById('stageCanvas');
            const ctx = canvas.getContext('2d');

            // Reset UI state
            document.getElementById('stage').classList.remove('reveal-active');
            document.getElementById('validationBtns').classList.add('hidden');
            document.getElementById('nameDisplay').classList.add('hidden');
            document.getElementById('revealBtn').classList.remove('hidden');
            document.getElementById('progressLabel').innerText = `Game ${cursor + 1} / 10`;

            // Ensure canvas backing store matches display size for crisp rendering
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = Math.max(1, Math.floor(rect.width * dpr));
            canvas.height = Math.max(1, Math.floor(rect.height * dpr));
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            // Draw pattern depending on mode. load two images first via proxy to avoid CORS
            const imgA = new Image(); imgA.crossOrigin = 'anonymous'; imgA.src = proxied(g1.img);
            const imgB = new Image(); imgB.crossOrigin = 'anonymous'; imgB.src = proxied(g2.img);

            // also set fallback img elements to the proxied sources (they remain hidden)
            const mainImgEl = document.getElementById('mainImg');
            const subImgEl = document.getElementById('subImg');
            if (mainImgEl) mainImgEl.src = proxied(g1.img);
            if (subImgEl) subImgEl.src = proxied(g2.img);

            Promise.all([imgLoaded(imgA), imgLoaded(imgB)]).then(() => {
                if (mode === 'overlap') {
                    renderOverlapStrips(ctx, imgA, imgB, rect.width, rect.height);
                } else if (mode === 'blend') {
                    renderBlend(ctx, imgA, imgB, rect.width, rect.height);
                } else {
                    renderPixelBlocks(ctx, imgA, imgB, rect.width, rect.height);
                }
            }).catch(err => {
                console.error('Image load error', err);
            });
        }

        // Blend mode: draw A at 100% then draw B on top at 50% covering same area
        function renderBlend(ctx, imgA, imgB, w, h){
            drawImageCover(ctx, imgA, 0, 0, w, h, 1.0);
            ctx.save();
            ctx.globalAlpha = 0.5;
            drawImageCover(ctx, imgB, 0, 0, w, h, 1.0);
            ctx.restore();
        }

        // helper: wait for image load
        function imgLoaded(img){
            return new Promise((resolve, reject) => {
                if (img.complete && img.naturalWidth) return resolve(img);
                img.onload = () => resolve(img);
                img.onerror = reject;
            });
        }

        // Return a proxied URL that sets CORS headers via the server-side proxy
        function proxied(url){
            if (!url) return '';
            return '/api/image-proxy?url=' + encodeURIComponent(url);
        }

        // Render vertical alternating strips: even strips from imgA (back, full opacity), odd strips from imgB (front, 0.5)
        function renderOverlapStrips(ctx, imgA, imgB, w, h){
            // Fill background with imgA first (back image)
            drawImageCover(ctx, imgA, 0, 0, w, h, 1.0);

            const strips = Math.max(8, Math.round(w / 30)); // adaptive number of strips
            const stripW = w / strips;

            for (let i = 0; i < strips; i++){
                const x = Math.floor(i * stripW);
                // alternate: even -> show imgA (already visible), odd -> draw imgB over this strip at 50% opacity
                if (i % 2 === 1){
                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(x, 0, Math.ceil(stripW), h);
                    ctx.clip();
                    ctx.globalAlpha = 0.5; // front image semi-transparent
                    drawImageCover(ctx, imgB, 0, 0, w, h, 1.0);
                    ctx.restore();
                    ctx.globalAlpha = 1.0;
                }
            }
        }

        // Render pixel/block alternation: create square blocks that alternate between images
        function renderPixelBlocks(ctx, imgA, imgB, w, h){
            // draw back image fully first
            drawImageCover(ctx, imgA, 0, 0, w, h, 1.0);

            const block = Math.max(12, Math.round(Math.min(w,h) / 18));
            for (let y = 0; y < h; y += block){
                for (let x = 0; x < w; x += block){
                    const xi = Math.floor(x / block);
                    const yi = Math.floor(y / block);
                    if ((xi + yi) % 2 === 1){
                        ctx.save();
                        ctx.beginPath();
                        ctx.rect(x, y, block, block);
                        ctx.clip();
                        ctx.globalAlpha = 0.5;
                        drawImageCover(ctx, imgB, 0, 0, w, h, 1.0);
                        ctx.restore();
                        ctx.globalAlpha = 1.0;
                    }
                }
            }
        }

        // Draw image to cover the rectangle while preserving aspect ratio (like CSS background-size: cover)
        function drawImageCover(ctx, img, x, y, w, h, alpha){
            const iw = img.naturalWidth;
            const ih = img.naturalHeight;
            const ir = iw / ih;
            const rr = w / h;
            let dw, dh, dx, dy;
            if (ir > rr){
                // image wider than box -> height fits
                dh = h; dw = h * ir;
                dx = x - (dw - w) / 2; dy = y;
            } else {
                dw = w; dh = w / ir;
                dx = x; dy = y - (dh - h) / 2;
            }
            ctx.globalAlpha = alpha !== undefined ? alpha : 1.0;
            ctx.drawImage(img, dx, dy, dw, dh);
            ctx.globalAlpha = 1.0;
        }

        // Append a structured result history entry and allow brief swap animation on click
        function appendResultHistory(aImg, bImg, frontIdx = 0) {
            const panel = document.getElementById('resultsPanel');
            if (!panel) return;
            panel.classList.remove('hidden');
            const d = document.createElement('div');
            d.className = 'result-entry round-transition';
            const time = document.createElement('div');
            time.style.textAlign = 'center';
            time.style.fontSize = '12px';
            time.style.color = '#aaa';
            time.style.marginRight = '6px';
            time.innerText = new Date().toLocaleTimeString();
            const container = document.createElement('div');
            container.style.display = 'flex';
            container.style.gap = '6px';
            container.style.alignItems = 'center';
            const ta = document.createElement('img');
            ta.className = 'thumb ' + (frontIdx === 0 ? 'front' : '');
            ta.src = aImg;
            const tb = document.createElement('img');
            tb.className = 'thumb ' + (frontIdx === 1 ? 'front' : '');
            tb.src = bImg;
            container.appendChild(ta);
            container.appendChild(tb);
            d.appendChild(time);
            d.appendChild(container);
            d.addEventListener('click', ()=>{
                ta.classList.add('swap-anim');
                tb.classList.add('swap-anim');
                setTimeout(()=>{ ta.classList.remove('swap-anim'); tb.classList.remove('swap-anim'); }, 520);
            });
            panel.prepend(d);
        }

        document.getElementById('revealBtn').onclick = () => {
            const g1 = gameStack[cursor];
            const g2 = gameStack[(cursor + 1) % gameStack.length];
            const mode = document.getElementById('mode').value;

            document.getElementById('stage').classList.add('reveal-active');
            document.getElementById('mainImg').classList.remove('pixelated');
            document.getElementById('revealBtn').classList.add('hidden');
            document.getElementById('validationBtns').classList.remove('hidden');
            document.getElementById('nameDisplay').classList.remove('hidden');
            
            // show both game names when revealed
            document.getElementById('gameNames').innerText = `${g1.name} + ${g2.name}`;

            // append result thumbnails into results panel for history
            const results = document.getElementById('resultsPanel');
            if (results) {
                appendResultHistory(proxied(g1.img), proxied(g2.img), 1);
            }
        };

        // Swap current pair (A <-> B) and re-render
        document.getElementById('swapBtn').onclick = () => {
            const a = gameStack[cursor];
            const bIndex = (cursor + 1) % gameStack.length;
            const b = gameStack[bIndex];
            gameStack[cursor] = b;
            gameStack[bIndex] = a;
            loadGame();
        };

        function nextRound(win) {
            if (win) {
                score++;
                document.getElementById('scoreLabel').innerText = `SCORE: ${score}`;
            }
            // advance by two so both games change between rounds
            cursor += 2;
            roundsPlayed++;
            if (roundsPlayed < maxRounds) {
                loadGame();
            } else {
                alert(`Challenge Complete! Score: ${score}/${maxRounds}`);
                // optionally reset
                document.getElementById('setup').classList.remove('hidden');
                document.getElementById('game').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
