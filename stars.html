<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stars App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0?deps=react@18.2.0"
        }
    }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useMemo, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Search, Star, Plus, List, Settings, Trash2, Share2, Sparkles, X, MessageSquare, ClipboardCheck, LayoutGrid, Sliders, CheckCircle2, Tag, Hash } from 'lucide-react';

        // Simple UUID generator fallback
        const generateUUID = () => {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                return crypto.randomUUID();
            }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        };

        const App = () => {
            const [apps, setApps] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [maxRating, setMaxRating] = useState(5); 
            const [isAdding, setIsAdding] = useState(false);
            const [editingReview, setEditingReview] = useState(null); 
            const [bulkInput, setBulkInput] = useState('');
            const [copied, setCopied] = useState(false);
            const [activeTab, setActiveTab] = useState('manage'); 
            const [availableTags, setAvailableTags] = useState(['Utility', 'Game', 'WIP']);
            const [newTagInput, setNewTagInput] = useState('');

            useEffect(() => {
                window.scrollTo(0, 0);
            }, [activeTab]);

            const handleScaleToggle = () => {
                const newMax = maxRating === 5 ? 10 : 5;
                const ratio = newMax / maxRating;
                setApps(apps.map(app => ({
                ...app,
                rating: Math.round((app.rating * ratio) * 10) / 10
                })));
                setMaxRating(newMax);
            };

            const toggleAppTag = (appId, tagName) => {
                setApps(apps.map(app => {
                if (app.id !== appId) return app;
                const currentTags = app.tags || [];
                const newTags = currentTags.includes(tagName)
                    ? currentTags.filter(t => t !== tagName)
                    : [...currentTags, tagName];
                return { ...app, tags: newTags };
                }));
            };

            const addGlobalTag = () => {
                if (newTagInput.trim() && !availableTags.includes(newTagInput.trim())) {
                setAvailableTags([...availableTags, newTagInput.trim()]);
                setNewTagInput('');
                }
            };

            const removeGlobalTag = (tagName) => {
                setAvailableTags(availableTags.filter(t => t !== tagName));
                setApps(apps.map(app => ({
                ...app,
                tags: (app.tags || []).filter(t => t !== tagName)
                })));
            };

            const manageGroups = useMemo(() => {
                const filtered = apps.filter(app => app.name.toLowerCase().includes(searchTerm.toLowerCase()));
                const sorted = [...filtered].sort((a, b) => a.name.localeCompare(b.name));
                return sorted.reduce((acc, app) => {
                const letter = app.name[0]?.toUpperCase() || '#';
                if (!acc[letter]) acc[letter] = [];
                acc[letter].push(app);
                return acc;
                }, {});
            }, [apps, searchTerm]);

            const reviewApps = useMemo(() => {
                return [...apps]
                .filter(app => app.name.toLowerCase().includes(searchTerm.toLowerCase()))
                .sort((a, b) => {
                    if (b.rating !== a.rating) return b.rating - a.rating;
                    return a.name.localeCompare(b.name);
                });
            }, [apps, searchTerm]);

            const addAppsFromText = (textOverride) => {
                const input = textOverride || bulkInput;
                const lines = input.split('\n').filter(line => line.trim() !== '');
                const newApps = lines.map(name => ({
                id: generateUUID(),
                name: name.trim(),
                rating: 0,
                review: '',
                tags: [],
                date: new Date().toLocaleDateString()
                }));
                setApps(prev => [...prev, ...newApps]);
                setBulkInput('');
                setIsAdding(false);
            };

            const seedSampleData = () => {
                const samples = [
                    "angrybox.html", "avatar.html", "battle.html", "battleship.html", "bga.html", "blur.html", 
                    "boardgametype.html", "boxcrush.html", "boxjumper.html", "boxrunner.html", "bracket.html", 
                    "breaker.html", "build.html", "cards.html", "checkers.html", "codenames.html", "collage.html", 
                    "collection.html", "colors.html", "compare.html", "component.html", "connectfour.html", 
                    "connections.html", "connectsix.html", "convert.html", "crafting.html", "credits.html", 
                    "crossword.html", "cubes.html", "cubewizard.html", "dice.html", "dotsandboxes.html", 
                    "draft.html", "expansion.html", "firstplayer.html", "flappybox.html", "forums.html", 
                    "gamenight.html", "gameninja.html", "geeklist.html", "hangman.html", "helmetshuffle.html", 
                    "home.html", "hotgames.html", "idrank.html", "index.html", "inventory.html", "jeopardy.html", 
                    "lanegame.html", "lastman.html", "lastmanstanding.html", "layers.html", "letters.html", 
                    "library.html", "librarystats.html", "library_bgg-live.html", "library_bgg.html", 
                    "library_dte.html", "library_dtw.html", "maps.html", "marketplace.html", "master_index.html", 
                    "matching.html", "maze.html", "menu.html", "metaVFM.html", "metermaster.html", "overboxed.html", 
                    "overlap.html", "pacman.html", "playingcards.html", "plays.html", "pocketvalue.html", 
                    "pong.html", "printbox.html", "printcards.html", "priority.html", "pubrank.html", "puzzle.html", 
                    "questions.html", "quiz.html", "race.html", "random9.html", "rankfile.html", "ranks.html", 
                    "ratings.html", "recommend.html", "rostercap.html", "scavengerhunt.html", "scorepad.html", 
                    "scramble.html", "search.html", "share.html", "shelfie.html", "similar.html", "simon.html", 
                    "sleeve.html", "slots.html", "snake.html", "spelling.html", "spotit.html", "stars.html", 
                    "startbenchcut.html", "stats.html", "suggested.html", "swipe.html", "tetris.html", 
                    "tictactoe.html", "timer.html", "toptier.html", "typerank.html", "user.html", "versions.html", 
                    "vfm.html", "videos.html", "virtualcards.html", "wanted.html", "wonder.html", "wordle.html", 
                    "wordsearch.html", "wrapped.html"
                ].join('\n');
                addAppsFromText(samples);
            };

            const clearAll = () => {
                if (confirm('Clear your entire list?')) setApps([]);
            };

            const updateRating = (id, newRating) => {
                setApps(apps.map(app => app.id === id ? { ...app, rating: newRating } : app));
            };

            const saveReview = (id, text) => {
                setApps(apps.map(app => app.id === id ? { ...app, review: text } : app));
                setEditingReview(null);
            };

            const handleShare = () => {
                const summary = reviewApps.map(a => `${a.name}: ${a.rating}/${maxRating}${a.tags?.length ? ` [${a.tags.join(', ')}]` : ''}${a.review ? ` - ${a.review}` : ''}`).join('\n');
                const textToCopy = `App Ratings (Sorted by Score):\n\n${summary}`;
                const textArea = document.createElement("textarea");
                textArea.value = textToCopy;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                document.execCommand('copy');
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
                } catch (err) {}
                document.body.removeChild(textArea);
            };

            return (
                <div className="min-h-screen bg-slate-50 text-slate-900 font-sans pb-32">
                <header className="sticky top-0 z-20 bg-white/80 backdrop-blur-md border-b border-slate-200 px-4 pt-6 pb-4">
                    <div className="max-w-md mx-auto flex justify-between items-center">
                    <h1 className="text-2xl font-black tracking-tight capitalize">{activeTab}</h1>
                    {activeTab !== 'settings' && (
                        <div className="relative flex-1 ml-4">
                        <Search className="absolute left-3 top-2.5 text-slate-400" size={16} />
                        <input 
                            type="text"
                            placeholder="Search..."
                            className="w-full bg-slate-100 border-none rounded-xl py-2 pl-9 pr-4 text-sm outline-none focus:ring-2 focus:ring-blue-500"
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                        />
                        </div>
                    )}
                    </div>
                </header>

                <main className="max-w-md mx-auto p-4">
                    {activeTab === 'manage' && (
                    Object.keys(manageGroups).sort().map(letter => (
                        <section key={letter} className="mb-6">
                        <div className="sticky top-[89px] bg-slate-50/90 py-2 text-[10px] font-black text-slate-400 tracking-widest z-10">
                            {letter}
                        </div>
                        <div className="space-y-3 mt-1">
                            {manageGroups[letter].map(app => (
                            <div key={app.id} className="bg-white rounded-3xl p-5 border border-slate-100 shadow-sm relative">
                                <div className="flex justify-between mb-2">
                                <h3 className="font-bold text-slate-800 leading-tight pr-6">{app.name}</h3>
                                <button onClick={() => setApps(apps.filter(a => a.id !== app.id))} className="text-slate-200 hover:text-red-400"><X size={16} /></button>
                                </div>
                                
                                <div className="flex flex-wrap gap-1.5 mb-4">
                                {availableTags.map(tag => (
                                    <button
                                    key={tag}
                                    onClick={() => toggleAppTag(app.id, tag)}
                                    className={`text-[10px] font-bold px-2.5 py-1 rounded-full transition-all border ${
                                        (app.tags || []).includes(tag) 
                                        ? 'bg-blue-600 border-blue-600 text-white' 
                                        : 'bg-slate-50 border-slate-100 text-slate-400 hover:border-slate-300'
                                    }`}
                                    >
                                    {tag}
                                    </button>
                                ))}
                                </div>

                                <div className="flex items-center justify-between">
                                <div className="flex gap-1">
                                    {[...Array(maxRating)].map((_, i) => (
                                    <button key={i} onClick={() => updateRating(app.id, i + 1)}>
                                        <Star size={maxRating === 10 ? 16 : 22} fill={i < app.rating ? "#f59e0b" : "none"} className={i < app.rating ? "text-amber-500" : "text-slate-200"} />
                                    </button>
                                    ))}
                                </div>
                                <button onClick={() => setEditingReview(app)} className={`p-2 rounded-full ${app.review ? 'bg-blue-50 text-blue-600' : 'bg-slate-50 text-slate-400'}`}>
                                    <MessageSquare size={18} />
                                </button>
                                </div>
                            </div>
                            ))}
                        </div>
                        </section>
                    ))
                    )}

                    {activeTab === 'review' && (
                    <div className="space-y-4">
                        <div className="flex justify-between items-center px-1 mb-2">
                        <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">Ranked Results</span>
                        <button onClick={handleShare} className="flex items-center gap-2 text-blue-600 font-bold text-xs bg-blue-50 px-4 py-2 rounded-full active:scale-95 transition-all">
                            {copied ? <CheckCircle2 size={14} /> : <Share2 size={14} />}
                            {copied ? 'Copied' : 'Share Results'}
                        </button>
                        </div>
                        {reviewApps.map((app, idx) => (
                        <div key={app.id} className="bg-white rounded-[32px] p-6 border border-slate-100 shadow-sm">
                            <div className="flex justify-between items-start">
                            <div className="flex gap-3 items-start">
                                <span className="text-2xl font-black text-slate-100 mt-0.5">{(idx + 1).toString().padStart(2, '0')}</span>
                                <div>
                                <h2 className="text-lg font-black text-slate-800 leading-tight">{app.name}</h2>
                                <div className="flex flex-wrap gap-1 mt-1.5 mb-2">
                                    {app.tags?.map(tag => (
                                    <span key={tag} className="text-[9px] font-black uppercase bg-slate-100 text-slate-500 px-2 py-0.5 rounded-md">
                                        {tag}
                                    </span>
                                    ))}
                                </div>
                                <div className="flex gap-0.5">
                                    {[...Array(maxRating)].map((_, i) => (
                                    <Star key={i} size={10} fill={i < Math.floor(app.rating) ? "#f59e0b" : "none"} className={i < Math.floor(app.rating) ? "text-amber-500" : "text-slate-100"} />
                                    ))}
                                </div>
                                </div>
                            </div>
                            <div className="text-right">
                                <div className="text-xl font-black text-blue-600 leading-none">{app.rating}</div>
                                <div className="text-[10px] font-bold text-slate-300 uppercase tracking-tighter">Scale {maxRating}</div>
                            </div>
                            </div>
                            {app.review && (
                            <div className="mt-4 pt-4 border-t border-slate-50 text-sm text-slate-500 italic leading-relaxed">
                                "{app.review}"
                            </div>
                            )}
                        </div>
                        ))}
                    </div>
                    )}

                    {activeTab === 'settings' && (
                    <div className="space-y-6">
                        <div className="bg-white rounded-3xl p-6 border border-slate-100 shadow-sm">
                        <h2 className="text-sm font-black uppercase tracking-widest text-slate-400 mb-4 flex items-center gap-2">
                            <Tag size={16} /> Custom Tags
                        </h2>
                        <div className="flex gap-2 mb-4">
                            <input 
                            type="text" 
                            placeholder="New tag name..." 
                            className="flex-1 bg-slate-50 border border-slate-100 rounded-xl px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500"
                            value={newTagInput}
                            onChange={(e) => setNewTagInput(e.target.value)}
                            onKeyPress={(e) => e.key === 'Enter' && addGlobalTag()}
                            />
                            <button onClick={addGlobalTag} className="bg-blue-600 text-white p-2 rounded-xl">
                            <Plus size={20} />
                            </button>
                        </div>
                        <div className="flex flex-wrap gap-2">
                            {availableTags.map(tag => (
                            <div key={tag} className="flex items-center gap-2 bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-xl">
                                <span className="text-xs font-bold text-slate-700">{tag}</span>
                                <button onClick={() => removeGlobalTag(tag)} className="text-slate-300 hover:text-red-500">
                                <X size={14} />
                                </button>
                            </div>
                            ))}
                        </div>
                        </div>

                        <div className="bg-white rounded-3xl p-6 border border-slate-100 shadow-sm">
                        <h2 className="text-sm font-black uppercase tracking-widest text-slate-400 mb-4 flex items-center gap-2">
                            <Sliders size={16} /> Scale System
                        </h2>
                        <div className="flex items-center justify-between p-4 bg-slate-50 rounded-2xl">
                            <div>
                            <div className="font-bold text-slate-800">Rating Scale</div>
                            <div className="text-xs text-slate-500">1-{maxRating} (Auto-Conversion)</div>
                            </div>
                            <button onClick={handleScaleToggle} className="bg-blue-600 text-white text-xs font-bold px-4 py-2 rounded-xl">Switch to {maxRating === 5 ? '10' : '5'}</button>
                        </div>
                        </div>

                        <div className="bg-white rounded-3xl p-6 border border-slate-100 shadow-sm">
                        <h2 className="text-sm font-black uppercase tracking-widest text-slate-400 mb-4 flex items-center gap-2">
                            <Plus size={16} /> Bulk Import
                        </h2>
                        <textarea 
                            className="w-full h-32 bg-slate-50 border border-slate-200 rounded-2xl p-4 text-sm outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="Paste app names here..."
                            value={bulkInput}
                            onChange={(e) => setBulkInput(e.target.value)}
                        />
                        <div className="flex gap-2 mt-4">
                            <button onClick={() => addAppsFromText()} disabled={!bulkInput.trim()} className="flex-1 bg-blue-600 disabled:opacity-50 text-white font-bold py-3 rounded-xl">Import Now</button>
                            <button onClick={seedSampleData} className="px-4 bg-amber-50 text-amber-600 rounded-xl border border-amber-100"><Sparkles size={18} /></button>
                        </div>
                        </div>

                        <div className="bg-white rounded-3xl p-6 border border-slate-100 shadow-sm">
                        <h2 className="text-sm font-black uppercase tracking-widest text-slate-400 mb-4 text-red-400">Danger Zone</h2>
                        <button onClick={clearAll} className="w-full flex items-center justify-center gap-2 text-red-600 font-bold bg-red-50 py-3 rounded-xl border border-red-100">
                            <Trash2 size={18} /> Wipe All Data
                        </button>
                        </div>
                    </div>
                    )}
                </main>

                {editingReview && (
                    <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white w-full max-w-sm rounded-[32px] p-6 shadow-2xl animate-in zoom-in-95 duration-200">
                        <h2 className="text-xl font-black mb-1">{editingReview.name}</h2>
                        <p className="text-xs text-slate-400 mb-4">Enter review or notes</p>
                        <textarea autoFocus className="w-full h-32 bg-slate-50 border border-slate-200 rounded-2xl p-4 text-sm outline-none focus:ring-2 focus:ring-blue-500" defaultValue={editingReview.review} id="review-text" />
                        <div className="flex gap-2 mt-4">
                        <button onClick={() => setEditingReview(null)} className="flex-1 bg-slate-100 text-slate-600 font-bold py-3 rounded-xl">Cancel</button>
                        <button onClick={() => saveReview(editingReview.id, document.getElementById('review-text').value)} className="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl">Save</button>
                        </div>
                    </div>
                    </div>
                )}

                <nav className="fixed bottom-6 left-4 right-4 bg-white/90 backdrop-blur-xl border border-slate-200/50 rounded-[28px] shadow-2xl px-6 py-3 max-w-md mx-auto z-40">
                    <div className="flex justify-around items-center">
                    <button onClick={() => setActiveTab('manage')} className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'manage' ? 'text-blue-600 scale-110' : 'text-slate-400'}`}>
                        <List size={20} />
                        <span className="text-[10px] font-black uppercase tracking-tighter">Manage</span>
                    </button>
                    <button onClick={() => setActiveTab('review')} className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'review' ? 'text-blue-600 scale-110' : 'text-slate-400'}`}>
                        <LayoutGrid size={20} />
                        <span className="text-[10px] font-black uppercase tracking-tighter">Review</span>
                    </button>
                    <button onClick={() => setActiveTab('settings')} className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'settings' ? 'text-blue-600 scale-110' : 'text-slate-400'}`}>
                        <Settings size={20} />
                        <span className="text-[10px] font-black uppercase tracking-tighter">Settings</span>
                    </button>
                    </div>
                </nav>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
