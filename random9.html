<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>BGG Random 9 Grid</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🎲</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
    }

    .game-cell {
      transition: all 0.2s ease;
      background-color: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 0.5rem;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-center: center;
    }

    .game-cell:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
    }

    .game-cell.drag-over {
      box-shadow: 0 0 0 3px #6366f1;
    }

    .game-cell img {
      object-fit: contain;
      background-color: #f1f5f9;
      transition: opacity 0.2s;
      width: 100%;
      height: 100%;
      display: block;
    }

    .game-cell img.dragging {
      opacity: 0.5;
      cursor: grabbing;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 0.75rem;
    }
  </style>
</head>
<body class="pb-20">

  <header class="sticky top-0 z-30 w-full bg-white/80 backdrop-blur-md border-b px-4 py-4 shadow-sm">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 text-white p-2 rounded-lg">
          <i class="fa-solid fa-dice"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">Random 9 Grid</h1>
          <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Pick & Rearrange</p>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6">
    
    <!-- Fetch Section -->
    <div id="fetchSection" class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
      <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
        <i class="fa-solid fa-sliders text-indigo-600"></i>
        Configuration
      </h2>
      <div class="space-y-4">
        <div>
          <label class="text-xs font-bold text-slate-500 uppercase mb-2 block">BGG Username</label>
          <input 
            id="username-input" 
            type="text" 
            value="sportomax" 
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all"
          >
        </div>

        <!-- Collection Filters -->
        <div>
          <label class="text-xs font-bold text-slate-500 uppercase mb-2 block">Collection Filters</label>
          <div class="filter-grid">
            <label class="flex items-center gap-2 cursor-pointer bg-slate-50 px-3 py-2 rounded-lg hover:bg-slate-100 transition-colors">
              <input type="checkbox" id="filter-own" class="form-checkbox text-indigo-600 rounded" checked>
              <span class="text-sm font-semibold text-slate-700">Owned</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer bg-slate-50 px-3 py-2 rounded-lg hover:bg-slate-100 transition-colors">
              <input type="checkbox" id="filter-prevowned" class="form-checkbox text-indigo-600 rounded">
              <span class="text-sm font-semibold text-slate-700">Prev Owned</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer bg-slate-50 px-3 py-2 rounded-lg hover:bg-slate-100 transition-colors">
              <input type="checkbox" id="filter-wanttoplay" class="form-checkbox text-indigo-600 rounded">
              <span class="text-sm font-semibold text-slate-700">Want To Play</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer bg-slate-50 px-3 py-2 rounded-lg hover:bg-slate-100 transition-colors">
              <input type="checkbox" id="filter-wanttobuy" class="form-checkbox text-indigo-600 rounded">
              <span class="text-sm font-semibold text-slate-700">Want To Buy</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer bg-slate-50 px-3 py-2 rounded-lg hover:bg-slate-100 transition-colors">
              <input type="checkbox" id="filter-wishlist" class="form-checkbox text-indigo-600 rounded">
              <span class="text-sm font-semibold text-slate-700">Wishlist</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer bg-slate-50 px-3 py-2 rounded-lg hover:bg-slate-100 transition-colors">
              <input type="checkbox" id="filter-preordered" class="form-checkbox text-indigo-600 rounded">
              <span class="text-sm font-semibold text-slate-700">Preordered</span>
            </label>
          </div>
          <label class="flex items-center gap-2 cursor-pointer mt-2">
            <input type="checkbox" id="filter-expansions" class="form-checkbox text-indigo-600 rounded" checked>
            <span class="text-sm font-semibold text-slate-700">Include Expansions</span>
          </label>
        </div>

        <!-- Additional Filters -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="text-xs font-bold text-slate-500 uppercase mb-2 block">Player Count</label>
            <select id="player-count-select" class="w-full px-3 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none text-sm font-semibold">
              <option value="any">Any</option>
              <option value="2">2 Players</option>
              <option value="3">3 Players</option>
              <option value="4">4 Players</option>
              <option value="5">5 Players</option>
              <option value="6">6 Players</option>
              <option value="2-3">2-3 Players</option>
              <option value="3-4">3-4 Players</option>
              <option value="4-5">4-5 Players</option>
              <option value="2-4">2-4 Players</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-bold text-slate-500 uppercase mb-2 block">Weight</label>
            <select id="weight-select" class="w-full px-3 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none text-sm font-semibold">
              <option value="all">All Weights</option>
              <option value="1-2">Light (1.0-2.0)</option>
              <option value="2-3">Medium-Light (2.0-3.0)</option>
              <option value="3-4">Medium (3.0-4.0)</option>
              <option value="4-5">Heavy (4.0-5.0)</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-bold text-slate-500 uppercase mb-2 block">Playing Time</label>
            <select id="playtime-select" class="w-full px-3 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none text-sm font-semibold">
              <option value="all">Any Length</option>
              <option value="0-15">15 min or less</option>
              <option value="15-30">15-30 min</option>
              <option value="30-45">30-45 min</option>
              <option value="45-60">45-60 min</option>
              <option value="60-90">60-90 min</option>
              <option value="90-">90+ min</option>
            </select>
          </div>
        </div>

        <!-- Sort Before -->
        <div>
          <label class="text-xs font-bold text-slate-500 uppercase mb-2 block">Sort Before Selection</label>
          <div class="space-y-2">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" id="sort-random-before" name="sort-method-before" value="random" checked class="form-radio text-indigo-600">
              <span class="text-sm font-semibold text-slate-700">Truly Random</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" id="sort-rating-before" name="sort-method-before" value="rating" class="form-radio text-indigo-600">
              <span class="text-sm font-semibold text-slate-700">By BGG Rating (High to Low)</span>
            </label>
          </div>
        </div>

        <button 
          id="submit-btn"
          class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold hover:bg-indigo-700 shadow-lg shadow-indigo-100 flex items-center justify-center gap-2 transition-all"
        >
          <i class="fa-solid fa-dice"></i> Get 9 Games
        </button>
      </div>
    </div>

    <!-- Status -->
    <div id="status" class="text-center text-slate-600 italic text-sm">Select your filters and click "Get 9 Games" to start.</div>

    <!-- Game Grid -->
    <div id="game-grid" class="hidden grid grid-cols-3 gap-2 aspect-square bg-white rounded-xl shadow-sm border border-slate-100 p-4">
      <!-- 9 game cells will be populated here -->
    </div>

    <!-- Sort After Section -->
    <div id="sort-after-section" class="hidden bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
      <div class="flex gap-2">
        <button 
          id="sort-random-after-btn" 
          onclick="resortGames('random')"
          class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 rounded-lg font-semibold text-sm transition-all flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-shuffle"></i> Shuffle
        </button>
        <button 
          id="sort-rating-after-btn" 
          onclick="resortGames('rating')"
          class="flex-1 bg-amber-50 hover:bg-amber-100 text-amber-700 py-2 rounded-lg font-semibold text-sm transition-all flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-star"></i> By Rating
        </button>
      </div>
    </div>

    <!-- Action Buttons -->
    <div id="action-buttons" class="hidden space-y-3">
      <button 
        id="generate-btn" 
        onclick="handleGenerateImage()"
        class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-bold shadow-lg shadow-green-100 flex items-center justify-center gap-2 transition-all"
      >
        <i class="fa-solid fa-image"></i> Generate Image
      </button>
      <div id="share-section" class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 hidden">
        <textarea 
          id="share-text" 
          placeholder="Add custom text to share with your image (optional)..." 
          class="w-full h-20 px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-purple-500 outline-none transition-all text-sm resize-none"
        ></textarea>
        <button 
          id="share-btn" 
          onclick="handleShareImage()"
          class="w-full mt-2 bg-purple-600 hover:bg-purple-700 text-white py-3 rounded-xl font-bold shadow-lg shadow-purple-100 flex items-center justify-center gap-2 transition-all"
        >
          <i class="fa-solid fa-share-nodes"></i> Share Image
        </button>
      </div>
      <div id="download-area"></div>
    </div>

  </main>

  <script>
    // ... (All original functionality code will go here - preserved from original) ...
    
    const IMAGE_PROXY = 'https://images.weserv.nl/?url=';
    let draggedCell = null;
    let touchTargetCell = null;
    let currentCanvas = null;
    let currentGameData = [];

    document.addEventListener('DOMContentLoaded', () => {
      const usernameInput = document.getElementById('username-input');
      const submitBtn = document.getElementById('submit-btn');
      const grid = document.getElementById('game-grid');
      const status = document.getElementById('status');
      const generateBtn = document.getElementById('generate-btn');
      const shareSection = document.getElementById('share-section');
      const shareBtn = document.getElementById('share-btn');
      const shareText = document.getElementById('share-text');
      const downloadArea = document.getElementById('download-area');
      const sortAfterSection = document.getElementById('sort-after-section');
      const actionButtons = document.getElementById('action-buttons');

      const filterOwn = document.getElementById('filter-own');
      const filterPrevOwned = document.getElementById('filter-prevowned');
      const filterWantToPlay = document.getElementById('filter-wanttoplay');
      const filterWantToBuy = document.getElementById('filter-wanttobuy');
      const filterWishlist = document.getElementById('filter-wishlist');
      const filterPreordered = document.getElementById('filter-preordered');
      const filterExpansions = document.getElementById('filter-expansions');

      const playerCountSelect = document.getElementById('player-count-select');
      const weightSelect = document.getElementById('weight-select');
      const playtimeSelect = document.getElementById('playtime-select');
      const sortRadios = document.getElementsByName('sort-method-before');

      function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
      }

      function wait(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      async function fetchBGG(endpoint, params = {}, retries = 5) {
        const queryParams = new URLSearchParams(params).toString();
        const fullUrl = `/api/bgg-helper?endpoint=${endpoint}&${queryParams}`;
        
        try {
          const response = await fetch(fullUrl);

          if (response.status === 202 && retries > 0) {
            status.textContent = `BGG is processing. Retrying in 3 seconds... (${retries} left)`;
            await wait(3000);
            return fetchBGG(endpoint, params, retries - 1);
          }

          if (!response.ok) {
            throw new Error(`BGG API fetch failed: Status ${response.status}`);
          }

          return await response.text();

        } catch (error) {
          throw error;
        }
      }

      function swapCellContent(cell1, cell2) {
        const img1 = cell1.querySelector('img');
        const img2 = cell2.querySelector('img');
        const data1 = cell1.data;
        const data2 = cell2.data;

        cell1.querySelector('img').src = img2.src;
        cell2.querySelector('img').src = img1.src;
        cell1.data = data2;
        cell2.data = data1;
      }

      function renderGrid(games) {
        grid.innerHTML = '';
        currentGameData = games;

        for (let i = 0; i < 9; i++) {
          const cell = document.createElement('div');
          cell.className = 'game-cell bg-slate-50 rounded-lg overflow-hidden border border-slate-200 cursor-grab relative group';
          cell.data = games[i] || null;

          if (games[i]) {
            const img = document.createElement('img');
            img.src = games[i].thumb || '';
            img.alt = games[i].name;
            img.draggable = true;
            
            cell.appendChild(img);

            img.addEventListener('dragstart', (e) => {
              draggedCell = cell;
              img.classList.add('dragging');
              e.dataTransfer.effectAllowed = 'move';
            });

            img.addEventListener('dragend', () => {
              img.classList.remove('dragging');
              draggedCell = null;
            });

            cell.addEventListener('dragover', (e) => {
              e.preventDefault();
              if (draggedCell && draggedCell !== cell) {
                cell.classList.add('drag-over');
              }
            });

            cell.addEventListener('dragleave', () => {
              cell.classList.remove('drag-over');
            });

            cell.addEventListener('drop', (e) => {
              e.preventDefault();
              cell.classList.remove('drag-over');
              if (draggedCell && draggedCell !== cell) {
                swapCellContent(draggedCell, cell);
                draggedCell = null;
              }
            });

            cell.addEventListener('touchstart', (e) => {
              draggedCell = cell;
              touchTargetCell = null;
              draggedCell.classList.add('touch-dragging');
              draggedCell.startX = e.touches[0].clientX;
              draggedCell.startY = e.touches[0].clientY;
              const rect = draggedCell.getBoundingClientRect();
              draggedCell.initialX = rect.left + window.scrollX;
              draggedCell.initialY = rect.top + window.scrollY;
            });
          }

          grid.appendChild(cell);
        }
      }

      async function handleSubmit() {
        submitBtn.disabled = true;
        status.textContent = 'Fetching your collection...';
        grid.classList.add('hidden');
        actionButtons.classList.add('hidden');
        sortAfterSection.classList.add('hidden');

        try {
          const username = usernameInput.value.trim() || 'sportomax';
          let params = { username, stats: '1' };

          if (filterOwn.checked) params.own = '1';
          if (filterPrevOwned.checked) params.prevowned = '1';
          if (filterWantToPlay.checked) params.wanttoplay = '1';
          if (filterWantToBuy.checked) params.wanttobuy = '1';
          if (filterWishlist.checked) params.wishlist = '1';
          if (filterPreordered.checked) params.preordered = '1';

          const collectionXML = await fetchBGG('collection', params);
          const parser = new DOMParser();
          const doc = parser.parseFromString(collectionXML, 'text/xml');
          
          let items = Array.from(doc.querySelectorAll('item')).map(item => ({
            objectid: item.getAttribute('objectid'),
            name: item.querySelector('name')?.textContent || '',
            year: item.querySelector('yearpublished')?.textContent || '',
            thumb: item.querySelector('thumbnail')?.textContent || '',
            minplayers: parseInt(item.querySelector('stats')?.getAttribute('minplayers') || '1'),
            maxplayers: parseInt(item.querySelector('stats')?.getAttribute('maxplayers') || '1'),
            playingtime: parseInt(item.querySelector('stats')?.getAttribute('playingtime') || '0'),
            rating: parseFloat(item.querySelector('stats rating')?.querySelector('average')?.getAttribute('value') || '0')
          }));

          if (!filterExpansions.checked) {
            items = items.filter(item => {
              const subtype = doc.querySelector(`item[objectid="${item.objectid}"]`)?.getAttribute('subtype');
              return subtype !== 'boardgameexpansion';
            });
          }

          items = items.filter(game => {
            const pc = playerCountSelect.value;
            if (pc !== 'any') {
              const [min, max] = pc.includes('-') ? pc.split('-').map(Number) : [Number(pc), Number(pc)];
              if (game.maxplayers < min || game.minplayers > max) return false;
            }

            const w = weightSelect.value;
            if (w !== 'all') {
              const [wmin, wmax] = w.split('-').map(Number);
              // Weight would need to be fetched from thing API - simplified for now
            }

            const pt = playtimeSelect.value;
            if (pt !== 'all') {
              const [ptmin, ptmax] = pt === '90-' ? [90, Infinity] : pt.split('-').map(Number);
              if (game.playingtime < ptmin || game.playingtime > ptmax) return false;
            }

            return true;
          });

          if (items.length < 9) {
            status.textContent = `Not enough games found (${items.length} found, need 9)`;
            submitBtn.disabled = false;
            return;
          }

          const sortMethod = Array.from(sortRadios).find(r => r.checked).value;
          if (sortMethod === 'rating') {
            items.sort((a, b) => (b.rating || 0) - (a.rating || 0));
          }

          shuffleArray(items);
          const selected = items.slice(0, 9);

          renderGrid(selected);
          grid.classList.remove('hidden');
          actionButtons.classList.remove('hidden');
          sortAfterSection.classList.remove('hidden');
          status.textContent = '';

        } catch (error) {
          status.textContent = `Error: ${error.message}`;
        } finally {
          submitBtn.disabled = false;
        }
      }

      async function handleGenerateImage() {
        generateBtn.disabled = true;
        status.textContent = 'Generating image...';

        try {
          const canvas = document.createElement('canvas');
          canvas.width = 900;
          canvas.height = 900;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, 900, 900);

          const cellSize = 300;
          const cells = Array.from(grid.querySelectorAll('.game-cell'));

          for (let i = 0; i < 9; i++) {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.src = IMAGE_PROXY + encodeURIComponent(cells[i].querySelector('img').src);
            await new Promise(resolve => {
              img.onload = resolve;
              img.onerror = resolve;
            });

            const row = Math.floor(i / 3);
            const col = i % 3;
            ctx.drawImage(img, col * cellSize, row * cellSize, cellSize, cellSize);
          }

          currentCanvas = canvas;
          shareSection.style.display = 'block';
        } catch (error) {
          status.textContent = `Error: ${error.message}`;
        } finally {
          generateBtn.disabled = false;
        }
      }

      async function handleShareImage() {
        shareBtn.disabled = true;
        try {
          const canvas = currentCanvas;
          const customText = shareText.value;
          canvas.toBlob(blob => {
            const file = new File([blob], 'random9-grid.png', { type: 'image/png' });
            downloadArea.innerHTML = `<a href="${URL.createObjectURL(blob)}" download="random9-grid.png" class="inline-block mt-3 px-4 py-2 bg-indigo-600 text-white rounded-lg font-bold hover:bg-indigo-700 transition-all"><i class="fa-solid fa-download"></i> Download Image</a>`;
          });
        } catch (error) {
          status.textContent = `Error: ${error.message}`;
        } finally {
          shareBtn.disabled = false;
        }
      }

      submitBtn.addEventListener('click', handleSubmit);
      generateBtn.addEventListener('click', handleGenerateImage);
      shareBtn.addEventListener('click', handleShareImage);

      document.addEventListener('touchmove', (e) => {
        if (draggedCell) {
          e.preventDefault();
          const touch = e.touches[0];
          const dx = touch.clientX - draggedCell.startX;
          const dy = touch.clientY - draggedCell.startY;
          
          draggedCell.style.position = 'fixed';
          draggedCell.style.zIndex = '10';
          draggedCell.style.left = `${draggedCell.initialX + dx}px`;
          draggedCell.style.top = `${draggedCell.initialY + dy}px`;

          const elementOver = document.elementFromPoint(touch.clientX, touch.clientY);
          const currentTargetCell = elementOver ? elementOver.closest('.game-cell') : null;

          if (currentTargetCell && currentTargetCell !== draggedCell && currentTargetCell !== touchTargetCell) {
            if (touchTargetCell) touchTargetCell.classList.remove('drag-over');
            currentTargetCell.classList.add('drag-over');
            touchTargetCell = currentTargetCell;
          } else if (!currentTargetCell && touchTargetCell) {
            touchTargetCell.classList.remove('drag-over');
            touchTargetCell = null;
          }
        }
      });

      document.addEventListener('touchend', (e) => {
        if (draggedCell) {
          if (touchTargetCell && touchTargetCell !== draggedCell) {
            swapCellContent(touchTargetCell, draggedCell);
          }
          draggedCell.classList.remove('touch-dragging');
          draggedCell.style.position = 'relative';
          draggedCell.style.zIndex = 'auto';
          draggedCell.style.left = 'auto';
          draggedCell.style.top = 'auto';
          if (touchTargetCell) touchTargetCell.classList.remove('drag-over');
          draggedCell = null;
          touchTargetCell = null;
        }
      });
    });

    // Global functions accessible from HTML onclick handlers
    function resortGames(method) {
      if (method === 'random') {
        shuffleArray(currentGameData);
      } else if (method === 'rating') {
        currentGameData.sort((a, b) => (b.rating || 0) - (a.rating || 0));
      }
      renderGrid(currentGameData);
    }
  </script>

  <!-- Vercel Web Analytics -->
  <script type="module" src="analytics-init.js"></script>
</body>
</html>
