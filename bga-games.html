<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BGA Game Catalog</title>
<style>
:root{
  --bg:#0b1020;--panel:#121a2d;--panel2:#18233a;--line:#2b3855;--line2:#354565;
  --text:#eef3ff;--muted:#94a3c4;--accent:#7c9cff;--good:#49d17d;--warn:#ffc857;--chip:#22304e;
  --font-ui:"Aptos","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:"Cascadia Code","SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:14px;line-height:1.35;font-weight:450;letter-spacing:.005em}
button,input,select,textarea{font:inherit}
a,a:visited,a:hover,a:active{color:inherit;text-decoration:none}
.app{height:100vh;display:flex;flex-direction:column;padding:9px 11px;gap:7px}
.topbar{display:flex;align-items:center;gap:14px;min-height:46px}
.brand{font-size:21px;font-weight:750;letter-spacing:-.02em;white-space:nowrap}
.brand small{display:block;margin-top:1px;color:var(--muted);font-size:10px;font-weight:500;letter-spacing:.01em}
.actions{margin-left:auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.action-group{display:flex;align-items:center;gap:5px;padding-left:8px;border-left:1px solid var(--line)}
.action-group:first-child{padding-left:0;border-left:0}
.action-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#7383a7;margin-right:1px}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:6px 9px;border-radius:7px;cursor:pointer;font-weight:650;font-size:11px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:#5c72a2;background:#1d2a45}.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:#081020;border-color:transparent}.btn.good{background:#19482d;color:#c5f7d5;border-color:#2c6843}
.username-wrap{display:flex;align-items:center;gap:4px;background:#0a1326;border:1px solid var(--line);border-radius:7px;padding:0 7px;height:29px}
.username-wrap span{font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.username-wrap input{width:92px;border:0;outline:0;background:transparent;color:var(--text);font-size:11px;font-weight:650;padding:0}
.stats{display:grid;grid-template-columns:repeat(7,minmax(82px,1fr));gap:5px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px;min-height:43px}.stat strong{font-size:18px;font-weight:720;display:block;line-height:1}.stat span{font-size:9px;color:var(--muted);font-weight:600}
.filters{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px;display:grid;gap:5px}.filterrow{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.search{flex:1 1 270px;min-width:180px}.input,.select{background:#0a1326;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:11px}.search input{width:100%}.input:focus,.select:focus{outline:1px solid #566fa5;border-color:#566fa5}
.quick{display:flex;gap:4px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--chip);color:#b2bfda;padding:4px 7px;border-radius:999px;cursor:pointer;font-size:10px;font-weight:650}.chip:hover{border-color:#5c72a2}.chip.active{background:var(--accent);color:#081020;border-color:transparent}
.meta{margin-left:auto;color:var(--muted);font-size:10px;white-space:nowrap}.statusline{font-size:10px;color:var(--muted);min-height:14px;margin-left:auto}
.utility{display:none;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px;max-height:36vh;overflow:auto}.utility.active{display:block}.utility textarea{width:100%;min-height:165px;background:#07101f;color:#d9e4ff;border:1px solid var(--line);border-radius:7px;padding:8px;font-family:var(--font-mono);font-size:11px}.drop{border:1px dashed #4a5d84;border-radius:7px;padding:9px;text-align:center;color:var(--muted);margin-bottom:6px;font-size:11px}
.tablewrap{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:9px;background:#0e1628}.table{width:100%;border-collapse:collapse;min-width:1080px}.table th,.table td{padding:6px 8px;border-bottom:1px solid #23314c;text-align:left;vertical-align:middle}.table th{position:sticky;top:0;background:#18233a;z-index:2;color:#c7d2eb;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap;letter-spacing:.015em}.table td{font-size:12px}.table tbody tr:hover{background:#15213a}.thumb{width:40px;height:40px;border-radius:6px;object-fit:cover;background:#24304a;border:1px solid #39496a;display:block}.thumb-link{display:inline-block;border-radius:6px}.thumb-link:hover .thumb{border-color:#7288b8;filter:brightness(1.06)}.gamename{font-weight:700;display:inline-block}.gamename:hover{color:#cbd6f3}.subname{font-size:10px;margin-top:1px}.muted{color:var(--muted)}.pill{display:inline-block;padding:2px 6px;border-radius:999px;background:#26344f;font-size:9px;margin:1px 2px 1px 0}.pill.good{background:#174128;color:#c0f4cf}.pill.warn{background:#4b3c16;color:#ffe49a}.right{text-align:right!important}.sortmark{opacity:.55;margin-left:3px}
@media(max-width:1100px){.topbar{align-items:flex-start}.actions{max-width:720px}.action-label{display:none}}
@media(max-width:900px){.stats{grid-template-columns:repeat(4,1fr)}.brand small{display:none}.topbar{flex-wrap:wrap}.actions{width:100%;margin-left:0;justify-content:flex-start}.action-group{padding-left:0;border-left:0}}
@media(max-width:600px){.app{padding:6px}.brand{font-size:18px}.stats{grid-template-columns:repeat(3,1fr)}.username-wrap input{width:82px}.meta,.statusline{width:100%;margin-left:0}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">BGA Game Catalog<small>BGA catalog + BoardGameGeek collection enrichment</small></div>
    <div class="actions">
      <div class="action-group">
        <span class="action-label">Data</span>
        <button class="btn" id="loadDb">1 · Load DB</button>
        <button class="btn" id="saveDb">2 · Save DB</button>
      </div>
      <div class="action-group">
        <span class="action-label">BGG</span>
        <label class="username-wrap"><span>User</span><input id="bggUsername" value="sportomax" autocomplete="off" spellcheck="false" aria-label="BGG username"></label>
        <button class="btn good" id="syncBgg">3 · Sync BGG → DB</button>
      </div>
      <div class="action-group">
        <span class="action-label">Tools</span>
        <button class="btn" data-panel="importPanel">Import</button>
        <button class="btn" data-panel="scraperPanel">Scraper</button>
        <button class="btn primary" id="exportCsv">Export</button>
      </div>
      <div class="action-group"><button class="btn" id="accessBtn">Access Key</button></div>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><strong id="sTotal">0</strong><span>Games</span></div>
    <div class="stat"><strong id="sPublic">0</strong><span>Public</span></div>
    <div class="stat"><strong id="sBeta">0</strong><span>Beta</span></div>
    <div class="stat"><strong id="sAlpha">0</strong><span>Alpha</span></div>
    <div class="stat"><strong id="sPremium">0</strong><span>Premium</span></div>
    <div class="stat"><strong id="sBgg">0</strong><span>BGG Matched</span></div>
    <div class="stat"><strong id="sPlayed">0</strong><span>Played on BGG</span></div>
  </div>

  <div class="filters">
    <div class="filterrow">
      <div class="search"><input class="input" id="search" placeholder="Search game, BGA codename, or BGG match…"></div>
      <select class="select" id="playerFilter"><option value="">Players</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select>
      <select class="select" id="timeFilter"><option value="">Time</option><option value="15">≤15m</option><option value="30">≤30m</option><option value="60">≤60m</option><option value="120">≤120m</option></select>
      <select class="select" id="sortSelect"><option value="nameAsc">Name A→Z</option><option value="nameDesc">Name Z→A</option><option value="playsDesc">Plays high→low</option><option value="playsAsc">Plays low→high</option><option value="minutesAsc">Minutes low→high</option><option value="minutesDesc">Minutes high→low</option><option value="status">Status</option></select>
      <span class="meta" id="showing">0 games</span>
    </div>
    <div class="filterrow">
      <div class="quick" id="quickFilters">
        <button class="chip active" data-kind="all">All</button><button class="chip" data-kind="public">Public</button><button class="chip" data-kind="beta">Beta</button><button class="chip" data-kind="alpha">Alpha</button><button class="chip" data-kind="premium">Premium</button><button class="chip" data-kind="owned">Owned</button><button class="chip" data-kind="played">Played</button><button class="chip" data-kind="unplayed">Unplayed</button><button class="chip" data-kind="matched">BGG Match</button><button class="chip" data-kind="unmatched">No BGG</button><button class="chip" data-kind="wishlist">Wishlist</button><button class="chip" data-kind="wanttoplay">Want to Play</button>
      </div>
      <div class="statusline" id="statusMsg"></div>
    </div>
  </div>

  <div class="utility" id="importPanel">
    <div class="drop" id="drop">Drop CSV here</div>
    <div class="filterrow"><input type="file" id="file" accept=".csv,text/csv"><button class="btn" id="parsePaste">Parse pasted CSV</button><button class="btn" id="clear">Clear</button></div>
    <textarea id="paste" placeholder="Paste CSV: Game,Key,Status,Players,Minutes,Premium,URL"></textarea>
  </div>
  <div class="utility" id="scraperPanel">
    <div class="filterrow"><div class="muted">Run on boardgamearena.com/gamelist in DevTools Console.</div><button class="btn" id="copyScript">Copy scraper</button></div>
    <textarea id="scraperCode" readonly></textarea>
  </div>

  <div class="tablewrap"><table class="table"><thead><tr>
    <th>BGG</th><th data-sort="game">Game <span class="sortmark">↕</span></th><th>Key</th><th data-sort="status">BGA Status</th><th>Players</th><th data-sort="minutes" class="right">Minutes</th><th data-sort="plays" class="right">BGG Plays</th><th>Premium</th><th>Collection Status</th>
  </tr></thead><tbody id="tbody"></tbody></table></div>
</div>
<script>
const $=id=>document.getElementById(id);
const DEFAULT_BGG_USER='sportomax';
const savedBggUser=(localStorage.getItem('bgaCatalog.bggUsername')||DEFAULT_BGG_USER).trim();
const state={rows:[],quick:'all',sort:'nameAsc',bggUser:savedBggUser};
$('bggUsername').value=state.bggUser;
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,'and').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bgaUrl=r=>r.url||`https://boardgamearena.com/gamepanel?game=${encodeURIComponent(r.game_key)}`;
const bggUrl=r=>r.bgg_id?`https://boardgamegeek.com/boardgame/${encodeURIComponent(r.bgg_id)}`:'';
const collectionLabels=[['own','Owned'],['prevowned','Prev. Owned'],['fortrade','For Trade'],['want','Want'],['wanttoplay','Want to Play'],['wanttobuy','Want to Buy'],['wishlist','Wishlist'],['preordered','Preordered']];
function setStatus(s){$('statusMsg').textContent=s||''}
function accessKey(force=false){let key=force?'':sessionStorage.getItem('bgl-access-key')||'';if(!key){key=prompt('Board Game Lab access key:')||'';if(key)sessionStorage.setItem('bgl-access-key',key)}return key}
async function dbCall(action,extra={}){const password=accessKey();if(!password)throw new Error('Access key required');const r=await fetch('/api/bga-game-catalog',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,password,...extra})});const j=await r.json().catch(()=>({ok:false,error:`HTTP ${r.status}`}));if(r.status===401)sessionStorage.removeItem('bgl-access-key');if(!r.ok||!j.ok)throw new Error(j.error||`HTTP ${r.status}`);return j}
function currentBggUser(){const user=$('bggUsername').value.trim()||DEFAULT_BGG_USER;state.bggUser=user;$('bggUsername').value=user;localStorage.setItem('bgaCatalog.bggUsername',user);return user}
function csvParse(text){const out=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'&&text[i+1]==='"'){cell+='"';i++}else if(ch==='"')q=false;else cell+=ch}else if(ch==='"')q=true;else if(ch===','){row.push(cell);cell=''}else if(ch==='\n'){row.push(cell.replace(/\r$/,''));out.push(row);row=[];cell=''}else cell+=ch}if(cell||row.length){row.push(cell);out.push(row)}const headers=(out.shift()||[]).map(x=>x.trim());return out.filter(r=>r.some(v=>String(v).trim())).map(vals=>Object.fromEntries(headers.map((h,i)=>[h,vals[i]??''])))}
function normalizeRows(rows){return rows.map(r=>({game:String(r.game??r.Game??'').trim(),game_key:String(r.game_key??r.Key??'').trim(),status:String(r.status??r.Status??'').trim(),players:String(r.players??r.Players??'').trim(),minutes:(r.minutes??r.Minutes)===''||((r.minutes==null)&&(r.Minutes==null))?null:Number(r.minutes??r.Minutes),premium:typeof r.premium==='boolean'?r.premium:/^(yes|true|1)$/i.test(String(r.premium??r.Premium??'')),url:String(r.url??r.URL??'').trim(),source:r.source||'bga_gamelist',bgg_id:r.bgg_id?Number(r.bgg_id):null,bgg_name:r.bgg_name||null,bgg_thumbnail:r.bgg_thumbnail||null,bgg_username:r.bgg_username||null,bgg_status:r.bgg_status&&typeof r.bgg_status==='object'?r.bgg_status:{},bgg_numplays:r.bgg_numplays===''||r.bgg_numplays==null?null:Number(r.bgg_numplays)})).filter(r=>r.game&&r.game_key)}
function isStatus(r,k){return Number(r.bgg_status?.[k])>0}
function filtered(){const q=norm($('search').value),pf=$('playerFilter').value,tf=Number($('timeFilter').value||0);let rows=state.rows.filter(r=>{if(q&&!norm(r.game+' '+r.game_key+' '+(r.bgg_name||'')).includes(q))return false;if(pf&&!String(r.players).split(/[–—-]/).includes(pf))return false;if(tf&&(!Number.isFinite(r.minutes)||r.minutes>tf))return false;switch(state.quick){case'public':return r.status==='public';case'beta':return r.status==='beta';case'alpha':return r.status==='alpha';case'premium':return r.premium;case'owned':return isStatus(r,'own');case'played':return Number(r.bgg_numplays)>0;case'unplayed':return r.bgg_id&&Number(r.bgg_numplays||0)===0;case'matched':return !!r.bgg_id;case'unmatched':return !r.bgg_id;case'wishlist':return isStatus(r,'wishlist');case'wanttoplay':return isStatus(r,'wanttoplay');default:return true}});const num=v=>Number.isFinite(Number(v))?Number(v):null;const cmp={nameAsc:(a,b)=>a.game.localeCompare(b.game),nameDesc:(a,b)=>b.game.localeCompare(a.game),playsDesc:(a,b)=>(num(b.bgg_numplays)??-1)-(num(a.bgg_numplays)??-1)||a.game.localeCompare(b.game),playsAsc:(a,b)=>(num(a.bgg_numplays)??1e12)-(num(b.bgg_numplays)??1e12)||a.game.localeCompare(b.game),minutesAsc:(a,b)=>(num(a.minutes)??1e12)-(num(b.minutes)??1e12)||a.game.localeCompare(b.game),minutesDesc:(a,b)=>(num(b.minutes)??-1)-(num(a.minutes)??-1)||a.game.localeCompare(b.game),status:(a,b)=>a.status.localeCompare(b.status)||a.game.localeCompare(b.game)}[state.sort]||((a,b)=>a.game.localeCompare(b.game));return rows.sort(cmp)}
function pills(r){const active=collectionLabels.filter(([k])=>isStatus(r,k));return active.length?active.map(([k,l])=>`<span class="pill ${k==='own'?'good':'warn'}">${l}</span>`).join(''):'<span class="muted">—</span>'}
function render(){const rows=filtered();$('showing').textContent=`${rows.length.toLocaleString()} / ${state.rows.length.toLocaleString()}`;$('tbody').innerHTML=rows.map(r=>`<tr><td>${r.bgg_thumbnail?`<a class="thumb-link" href="${esc(bggUrl(r))}" target="_blank" rel="noopener" title="Open on BoardGameGeek"><img class="thumb" src="${esc(r.bgg_thumbnail)}" alt=""></a>`:(r.bgg_id?`<a href="${esc(bggUrl(r))}" target="_blank" rel="noopener">BGG</a>`:'<span class="muted">—</span>')}</td><td><a class="gamename" href="${esc(bgaUrl(r))}" target="_blank" rel="noopener" title="Open on Board Game Arena">${esc(r.game)}</a>${r.bgg_name&&norm(r.bgg_name)!==norm(r.game)?`<div class="muted subname">${esc(r.bgg_name)}</div>`:''}</td><td class="muted">${esc(r.game_key)}</td><td>${esc(r.status)}</td><td>${esc(r.players)}</td><td class="right">${r.minutes??''}</td><td class="right">${r.bgg_id?(r.bgg_numplays??0):''}</td><td>${r.premium?'Yes':'No'}</td><td>${pills(r)}</td></tr>`).join('');$('sTotal').textContent=state.rows.length;$('sPublic').textContent=state.rows.filter(r=>r.status==='public').length;$('sBeta').textContent=state.rows.filter(r=>r.status==='beta').length;$('sAlpha').textContent=state.rows.filter(r=>r.status==='alpha').length;$('sPremium').textContent=state.rows.filter(r=>r.premium).length;$('sBgg').textContent=state.rows.filter(r=>r.bgg_id).length;$('sPlayed').textContent=state.rows.filter(r=>Number(r.bgg_numplays)>0).length}
async function loadDb(){try{setStatus('Loading database…');const j=await dbCall('READ');state.rows=normalizeRows(j.rows||[]);const users=[...new Set(state.rows.map(r=>r.bgg_username).filter(Boolean))];if(users.length===1&&!localStorage.getItem('bgaCatalog.bggUsername')){$('bggUsername').value=users[0];state.bggUser=users[0]}render();setStatus(`Loaded ${state.rows.length.toLocaleString()} records`)}catch(e){setStatus(`Error: ${e.message}`)}}
async function saveDb(statusPrefix='Saved'){if(!state.rows.length)throw new Error('No rows to save');const j=await dbCall('UPSERT',{rows:state.rows});setStatus(`${statusPrefix} ${Number(j.saved||0).toLocaleString()} records`);return j}
function parseCollection(xmlText){const xml=new DOMParser().parseFromString(xmlText,'text/xml');if(xml.querySelector('parsererror'))throw new Error('BGG returned invalid XML');const map=new Map();xml.querySelectorAll('item').forEach(item=>{const name=(item.querySelector('name')?.textContent||'').trim();if(!name)return;const status=item.querySelector('status');const obj={bgg_id:Number(item.getAttribute('objectid')),bgg_name:name,bgg_thumbnail:(item.querySelector('thumbnail')?.textContent||'').trim(),bgg_numplays:Number(item.querySelector('numplays')?.textContent||0),bgg_status:{}};['own','prevowned','fortrade','want','wanttoplay','wanttobuy','wishlist','preordered'].forEach(k=>obj.bgg_status[k]=Number(status?.getAttribute(k)||0));map.set(norm(name),obj)});return map}
async function syncBgg(){try{const user=currentBggUser();if(!state.rows.length)throw new Error('Load or import the BGA catalog first');setStatus(`1/2 Loading BGG collection for ${user}…`);const r=await fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(user)}&stats=1&subtype=boardgame`);const text=await r.text();if(!r.ok)throw new Error(text||`BGG HTTP ${r.status}`);const map=parseCollection(text);let matched=0;state.rows=state.rows.map(row=>{const hit=map.get(norm(row.game));if(!hit)return row;matched++;return {...row,...hit,bgg_username:user}});render();setStatus(`2/2 Saving ${matched.toLocaleString()} BGG matches for ${user}…`);await saveDb(`Synced ${matched.toLocaleString()} matches; saved`)}catch(e){setStatus(`Error: ${e.message}`)}}
function exportCsv(){const rows=filtered(),cols=['Game','Key','Status','Players','Minutes','Premium','URL','BGG ID','BGG Name','BGG User','BGG Plays','BGG Thumbnail','Collection Status'],cell=v=>`"${String(v??'').replace(/"/g,'""')}"`;const lines=[cols.map(cell).join(','),...rows.map(r=>[r.game,r.game_key,r.status,r.players,r.minutes??'',r.premium?'Yes':'No',bgaUrl(r),r.bgg_id??'',r.bgg_name??'',r.bgg_username??'',r.bgg_numplays??'',r.bgg_thumbnail??'',collectionLabels.filter(([k])=>isStatus(r,k)).map(([,l])=>l).join('|')].map(cell).join(','))];const blob=new Blob([lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bga-game-catalog.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importCsv(text){const rows=normalizeRows(csvParse(text));if(!rows.length)throw new Error('No valid rows found');state.rows=rows;render();setStatus(`Imported ${rows.length.toLocaleString()} rows`)}
const scraper=`(() => {const html=document.documentElement.innerHTML;const marker='"game_list":';const markerIndex=html.indexOf(marker);if(markerIndex<0)throw new Error('Open https://boardgamearena.com/gamelist, then run this again.');const arrayStart=html.indexOf('[',markerIndex+marker.length);let depth=0,inString=false,escaped=false,arrayEnd=-1;for(let i=arrayStart;i<html.length;i++){const ch=html[i];if(inString){if(escaped)escaped=false;else if(ch==='\\\\')escaped=true;else if(ch==='"')inString=false}else if(ch==='"')inString=true;else if(ch==='[')depth++;else if(ch===']'&&--depth===0){arrayEnd=i+1;break}}const games=JSON.parse(html.slice(arrayStart,arrayEnd)).filter(g=>g.status!=='private_alpha').map(g=>({Game:g.display_name_en||g.name,Key:g.name,Status:g.status,Players:(g.player_numbers||[]).join('–'),Minutes:g.average_duration??'',Premium:g.premium?'Yes':'No',URL:\`https://boardgamearena.com/gamepanel?game=\${encodeURIComponent(g.name)}\`})).sort((a,b)=>a.Game.localeCompare(b.Game));const columns=Object.keys(games[0]);const cell=value=>'"'+String(value??'').replace(/"/g,'""')+'"';const csv=[columns.map(cell).join(','),...games.map(game=>columns.map(key=>cell(game[key])).join(','))].join('\\r\\n');copy(csv);const blobUrl=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=blobUrl;a.download='bga-all-games.csv';a.click();setTimeout(()=>URL.revokeObjectURL(blobUrl),10000);console.log(\`✅ Copied \${games.length} games to clipboard and requested bga-all-games.csv download.\`);})();`;
$('scraperCode').value=scraper;
document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{const p=$(b.dataset.panel),on=p.classList.contains('active');document.querySelectorAll('.utility').forEach(x=>x.classList.remove('active'));if(!on)p.classList.add('active')});
$('quickFilters').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{state.quick=b.dataset.kind;$('quickFilters').querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));render()});
['search','playerFilter','timeFilter'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('sortSelect').onchange=e=>{state.sort=e.target.value;render()};$('bggUsername').addEventListener('change',()=>{const user=currentBggUser();setStatus(`BGG username set to ${user}`)});
$('loadDb').onclick=loadDb;$('saveDb').onclick=async()=>{try{setStatus('Saving database…');await saveDb()}catch(e){setStatus(`Error: ${e.message}`)}};$('syncBgg').onclick=syncBgg;$('exportCsv').onclick=exportCsv;$('accessBtn').onclick=()=>{sessionStorage.removeItem('bgl-access-key');accessKey(true);setStatus('Access key updated for this tab')};
$('parsePaste').onclick=()=>{try{importCsv($('paste').value)}catch(e){setStatus(`Error: ${e.message}`)}};$('clear').onclick=()=>{state.rows=[];render();setStatus('Cleared')};$('file').onchange=async e=>{const f=e.target.files?.[0];if(f)try{importCsv(await f.text())}catch(err){setStatus(`Error: ${err.message}`)}};$('drop').ondragover=e=>e.preventDefault();$('drop').ondrop=async e=>{e.preventDefault();const f=e.dataTransfer.files?.[0];if(f)try{importCsv(await f.text())}catch(err){setStatus(`Error: ${err.message}`)}};$('copyScript').onclick=async()=>{await navigator.clipboard.writeText(scraper);setStatus('Scraper copied')};document.querySelectorAll('th[data-sort]').forEach(th=>th.onclick=()=>{const map={game:'nameAsc',status:'status',minutes:'minutesAsc',plays:'playsDesc'};if(map[th.dataset.sort]){state.sort=map[th.dataset.sort];$('sortSelect').value=state.sort;render()}});
render();if(sessionStorage.getItem('bgl-access-key'))loadDb();
</script>
