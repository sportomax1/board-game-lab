<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Collection History</title><style>body{font:14px -apple-system,system-ui;margin:0;background:#f4f5f7;color:#111827}.app{max-width:760px;margin:auto;padding:16px 12px 90px}h1{font-size:28px}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;overflow:auto;background:#fff;border-top:1px solid #ddd;padding-bottom:env(safe-area-inset-bottom)}.nav button{min-width:78px;padding:14px 8px;border:0;background:#fff}.nav .on{color:#2563eb;font-weight:800}.view{display:none}.view.on{display:block}.panel,.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:12px;margin:10px 0}.stats,.games{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat b{display:block;font-size:24px}.toolbar,.chips{display:flex;gap:7px;overflow:auto;margin:8px 0}.ctl,.btn,.chip{min-height:40px;border:1px solid #d0d5dd;border-radius:11px;background:#fff;padding:0 11px;white-space:nowrap}.btn{background:#111827;color:#fff}.chip.on{background:#dbeafe}.card img{width:100%;aspect-ratio:1.3;object-fit:cover;border-radius:10px}.muted{color:#667085;font-size:12px}.row{padding:10px 0;border-top:1px solid #eee}.log{background:#111827;color:#eee;padding:10px;border-radius:12px;white-space:pre-wrap;font:11px monospace;max-height:50vh;overflow:auto}@media(min-width:600px){.games{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(4,1fr)}}</style></head><body><main class="app"><h1>Collection History</h1><div id="status" class="muted">Ready</div><section id="dashboard" class="view on"><h2>Dashboard</h2><div class="toolbar"><input id="dashDate" type="date" class="ctl"><button class="btn" onclick="dashboard()">Load</button></div><div id="stats" class="stats"></div></section><section id="collection" class="view"><h2>Collection</h2><div class="toolbar"><input id="colDate" type="date" class="ctl"><select id="sort" class="ctl"><option value="name">Name</option><option value="rank">BGG Rank (best first)</option><option value="rating">Your Rating</option><option value="avg">BGG Rating</option><option value="plays">Plays</option></select></div><div id="statuses" class="chips"></div><input id="search" class="ctl" style="width:100%" placeholder="Search"><p id="count" class="muted"></p><div id="cards" class="games"></div></section><section id="newgames" class="view"><h2>New Games</h2><div class="toolbar"><input id="newA" type="date" class="ctl"><input id="newB" type="date" class="ctl"><button class="btn" onclick="newGames()">Compare</button></div><div id="newCards" class="games"></div></section><section id="changes" class="view"><h2>Changes</h2><div class="toolbar"><input id="chgA" type="date" class="ctl"><input id="chgB" type="date" class="ctl"><button class="btn" onclick="changes()">Compare</button></div><div id="fields" class="chips"></div><div id="changeList" class="panel"></div></section><section id="rankings" class="view"><h2>All-Time Rankings</h2><div class="toolbar"><select id="metric" class="ctl"><option value="primary_rank">BGG Rank</option><option value="user_rating">Your Rating</option><option value="average_rating">BGG Rating</option><option value="num_plays">Plays</option></select><select id="rankMode" class="ctl"><option value="high">Highest / Best</option><option value="low">Lowest / Worst</option><option value="avg">Average</option><option value="delta">Largest Delta</option></select><button class="btn" onclick="rankings()">Load</button></div><div id="rankList" class="panel"></div></section><section id="console" class="view"><h2>Console</h2><button class="btn" onclick="runs()">Refresh</button><div id="runs" class="panel"></div><div id="log" class="log"></div></section><section id="settings" class="view"><h2>Settings</h2><div class="panel"><select id="ttl" class="ctl"><option value="5">5 min cache</option><option value="15">15 min cache</option><option value="60">1 hour cache</option></select><button class="btn" onclick="clearCache()">Clear cache</button><p class="muted">Data loads on demand. Snapshot pages and all-time history use explicit offset pagination.</p></div></section></main><nav id="nav" class="nav"></nav><script>const U='https://jadyqyrpgcmaixroizov.supabase.co',K='sb_publishable_1aiH7EnJyY7XtXYVbSWvjg_NIBK0kYz',H={apikey:K,Authorization:`Bearer ${K}`},STATUS=['own','for_trade','want','want_to_play','want_to_buy','wishlist','preordered'],FIELDS=[...STATUS,'num_plays','user_rating','average_rating','primary_rank'];let current=[],statusOn=new Set,fieldOn=new Set(FIELDS),loaded=new Set(['dashboard']);const $=x=>document.getElementById(x),lab=x=>x.replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase()),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function log(x){$('log').textContent=new Date().toLocaleTimeString()+' '+x+'\n'+$('log').textContent;console.log(x)}function err(e){$('status').textContent='Error: '+e.message;log('ERROR '+e.message)}async function api(path){let r=await fetch(U+'/rest/v1/'+path,{headers:H});if(!r.ok)throw Error(r.status+' '+await r.text());let j=await r.json();log(`${j.length} rows`);return j}async function paged(path,pageSize=1000){let out=[],offset=0;while(true){let sep=path.includes('?')?'&':'?',url=path+sep+`limit=${pageSize}&offset=${offset}`,j=await api(url);out.push(...j);$('status').textContent=`Loading… ${out.length.toLocaleString()} rows`;if(j.length<pageSize)break;offset+=pageSize;await new Promise(r=>setTimeout(r,0))}log(`complete ${out.length} rows`);return out}function day(d){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Denver'}).format(d)}function initDates(){let t=new Date(),y=new Date(t-864e5);['dashDate','colDate','newB','chgB'].forEach(x=>$(x).value=day(t));['newA','chgA'].forEach(x=>$(x).value=day(y))}function dateWindow(d){let start=new Date(d+'T00:00:00'),end=new Date(d+'T23:59:59.999');return[start.toISOString(),end.toISOString()]}async function snap(d){let k='bggch:v4:'+d,c;try{c=JSON.parse(localStorage.getItem(k));if(c&&Date.now()-c.t<+$('ttl').value*60000){log(`cache ${d}: ${c.r.length}`);return c.r}}catch{}let[a,b]=dateWindow(d),rows=await paged(`bgg_collection_game_history?select=*&run_time=gte.${encodeURIComponent(a)}&run_time=lte.${encodeURIComponent(b)}&order=run_time.desc,bgg_id.asc`),m=new Map;rows.forEach(x=>{if(!m.has(String(x.bgg_id)))m.set(String(x.bgg_id),x)});let r=[...m.values()];try{localStorage.setItem(k,JSON.stringify({t:Date.now(),r}))}catch(e){log('cache write skipped')}return r}const active=(g,f)=>+g[f]===1||g[f]===true,img=g=>g.thumbnail_url||g.image_url||'';function card(g){return `<div class="card">${img(g)?`<img src="${esc(img(g))}" loading="lazy">`:''}<b>${esc(g.game_name)}</b><div class="muted">BGG ${g.bgg_id} · Rank ${g.primary_rank??'—'} · ${g.num_plays??0} plays</div><div class="muted">${STATUS.filter(f=>active(g,f)).map(lab).join(' · ')}</div></div>`}async function dashboard(){try{$('status').textContent='Loading dashboard…';let r=await snap($('dashDate').value);$('stats').innerHTML=[['Games',r.length],...STATUS.map(f=>[lab(f),r.filter(g=>active(g,f)).length])].map(x=>`<div class="stat card">${x[0]}<b>${x[1]}</b></div>`).join('');$('status').textContent=`${r.length} games loaded`}catch(e){err(e)}}function statusChips(){$('statuses').innerHTML=STATUS.map(f=>`<button class="chip ${statusOn.has(f)?'on':''}" data-f="${f}">${lab(f)}</button>`).join('');$('statuses').querySelectorAll('button').forEach(b=>b.onclick=()=>{statusOn.has(b.dataset.f)?statusOn.delete(b.dataset.f):statusOn.add(b.dataset.f);statusChips();renderCollection()})}async function collection(){try{current=await snap($('colDate').value);renderCollection();$('status').textContent=`${current.length} games loaded`}catch(e){err(e)}}function renderCollection(){let a=[...current],q=$('search').value.toLowerCase();if(q)a=a.filter(g=>(g.game_name||'').toLowerCase().includes(q)||String(g.bgg_id).includes(q));if(statusOn.size)a=a.filter(g=>[...statusOn].every(f=>active(g,f)));let s=$('sort').value;a.sort(s==='rank'?(a,b)=>(+a.primary_rank||Infinity)-(+b.primary_rank||Infinity):s==='rating'?(a,b)=>(+b.user_rating||-1)-(+a.user_rating||-1):s==='avg'?(a,b)=>(+b.average_rating||-1)-(+a.average_rating||-1):s==='plays'?(a,b)=>(+b.num_plays||0)-(+a.num_plays||0):(a,b)=>(a.game_name||'').localeCompare(b.game_name||''));$('count').textContent=`${a.length} of ${current.length}`;$('cards').innerHTML=a.map(card).join('')}async function newGames(){try{let[a,b]=await Promise.all([snap($('newA').value),snap($('newB').value)]),m=new Set(a.map(x=>String(x.bgg_id))),n=b.filter(x=>!m.has(String(x.bgg_id)));$('newCards').innerHTML=n.map(card).join('')||'No new games.';$('status').textContent=`${n.length} new games`}catch(e){err(e)}}function fieldChips(){$('fields').innerHTML=FIELDS.map(f=>`<button class="chip ${fieldOn.has(f)?'on':''}" data-f="${f}">${lab(f)}</button>`).join('');$('fields').querySelectorAll('button').forEach(b=>b.onclick=()=>{fieldOn.has(b.dataset.f)?fieldOn.delete(b.dataset.f):fieldOn.add(b.dataset.f);fieldChips();changes()})}async function changes(){try{let[a,b]=await Promise.all([snap($('chgA').value),snap($('chgB').value)]),m=new Map(a.map(x=>[String(x.bgg_id),x])),out=[];b.forEach(g=>{let p=m.get(String(g.bgg_id));if(!p)return;let c=[...fieldOn].filter(f=>String(p[f]??'')!==String(g[f]??''));if(c.length)out.push([g,c,p])});$('changeList').innerHTML=out.map(([g,c,p])=>`<div class="row"><b>${esc(g.game_name)}</b>${c.map(f=>`<div>${lab(f)}: ${esc(p[f]??'—')} → <b>${esc(g[f]??'—')}</b></div>`).join('')}</div>`).join('')||'No changes.';$('status').textContent=`${out.length} changed games`}catch(e){err(e)}}async function rankings(){try{$('status').textContent='Loading ranking history…';let metric=$('metric').value,rows=await paged(`bgg_collection_game_history?select=bgg_id,game_name,${metric},run_time&${metric}=not.is.null&order=run_time.asc,bgg_id.asc`),groups=new Map;rows.forEach(r=>{let v=+r[metric];if(!Number.isFinite(v)||(metric==='primary_rank'&&v<=0))return;let k=String(r.bgg_id);if(!groups.has(k))groups.set(k,{name:r.game_name,v:[]});groups.get(k).v.push(v)});let isRank=metric==='primary_rank',a=[...groups].map(([id,o])=>{let min=Math.min(...o.v),max=Math.max(...o.v);return{id,name:o.name,best:isRank?min:max,worst:isRank?max:min,avg:o.v.reduce((s,x)=>s+x,0)/o.v.length,delta:max-min,n:o.v.length}}),mode=$('rankMode').value;a.sort((x,y)=>mode==='high'?(isRank?x.best-y.best:y.best-x.best):mode==='low'?(isRank?y.worst-x.worst:x.worst-y.worst):mode==='avg'?(isRank?x.avg-y.avg:y.avg-x.avg):y.delta-x.delta);$('rankList').innerHTML=a.slice(0,250).map((x,i)=>`<div class="row"><b>${i+1}. ${esc(x.name)}</b><div>${isRank?'Best rank':'High'}: ${x.best.toFixed(2)} · ${isRank?'Worst rank':'Low'}: ${x.worst.toFixed(2)} · Avg: ${x.avg.toFixed(2)} · Δ ${x.delta.toFixed(2)}</div></div>`).join('');$('status').textContent=`${rows.length.toLocaleString()} history rows · ${a.length.toLocaleString()} games`}catch(e){err(e)}}async function runs(){try{let r=await api('bgg_collection_run_dashboard?select=*&order=run_time.desc&limit=100');$('runs').innerHTML=r.map(x=>`<div class="row">${new Date(x.run_time).toLocaleString()} · ${x.item_count??'—'} items</div>`).join('')}catch(e){err(e)}}function clearCache(){Object.keys(localStorage).filter(x=>x.startsWith('bggch:')).forEach(x=>localStorage.removeItem(x));$('status').textContent='Cache cleared'}function nav(){let n=[['dashboard','Dashboard'],['collection','Collection'],['newgames','New'],['changes','Changes'],['rankings','Rankings'],['console','Console'],['settings','Settings']];$('nav').innerHTML=n.map((x,i)=>`<button data-v="${x[0]}" class="${i?'':'on'}">${x[1]}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=async()=>{document.querySelectorAll('.view,.nav button').forEach(x=>x.classList.remove('on'));$(b.dataset.v).classList.add('on');b.classList.add('on');if(!loaded.has(b.dataset.v)){loaded.add(b.dataset.v);if(b.dataset.v==='collection')await collection();if(b.dataset.v==='newgames')await newGames();if(b.dataset.v==='changes')await changes();if(b.dataset.v==='rankings')await rankings();if(b.dataset.v==='console')await runs()}})}initDates();statusChips();fieldChips();nav();$('ttl').value=localStorage.getItem('bggttl')||'15';$('ttl').onchange=e=>localStorage.setItem('bggttl',e.target.value);$('colDate').onchange=collection;$('sort').onchange=renderCollection;$('search').oninput=renderCollection;dashboard();</script></body></html>
