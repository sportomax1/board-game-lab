<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BGA Studio Project Dashboard</title>
<style>
:root{--bg:#0b1020;--panel:#11182c;--card:#171f35;--line:#27324f;--text:#eef3ff;--muted:#93a1c2;--blue:#3377ef;--green:#45d483;--yellow:#ffbd4a;--red:#ff6b78}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:9px 12px;background:rgba(11,16,32,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.brand{font-weight:850;margin-right:auto}.brand small{display:block;color:var(--muted);font-weight:500;font-size:11px}.btn{border:1px solid var(--line);border-radius:9px;background:#18213a;color:var(--text);padding:8px 10px;font-weight:750;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue)}.btn:disabled{opacity:.45}
main{max-width:1920px;margin:auto;padding:10px 12px 20px}.drop{border:1.5px dashed #3a4a76;border-radius:14px;text-align:center;padding:34px 15px;background:#10172a;cursor:pointer}.drop.drag{border-color:#5f9bff;background:#142448}
.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:8px}.stat{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:9px 10px}.stat b{font-size:20px}.stat span{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.toolbar{display:grid;grid-template-columns:1fr 170px auto;gap:8px;margin-bottom:7px}.toolbar input,.toolbar select{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);padding:9px 10px}.switch{display:flex}.switch button{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:0 11px}.switch button:first-child{border-radius:9px 0 0 9px}.switch button:last-child{border-radius:0 9px 9px 0}.switch .active{background:#294272;color:white}
.filters{display:flex;gap:6px;overflow:auto;margin:5px 0 7px}.chip{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:#18213a;color:#dce6ff;padding:6px 9px;font-size:11px;font-weight:800;cursor:pointer}.chip.active{background:#315da8}.summary{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin:5px 2px 9px}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(245px,1fr));gap:9px;align-items:start;overflow-x:auto}.lane{border:1px solid var(--line);border-radius:12px;background:#10172a;overflow:hidden}.laneHead{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-bottom:1px solid var(--line);font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.04em}.cards{display:grid;gap:7px;padding:7px}.card{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:8px}.top{display:flex;gap:8px;align-items:flex-start}.thumb,.fallback{width:42px;height:42px;border-radius:8px;border:1px solid var(--line);flex:0 0 auto}.thumb{object-fit:cover}.fallback{display:grid;place-items:center;background:#26324f;font-weight:850}.grow{min-width:0;flex:1}.name{font-size:13px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.badge{font-size:9px;font-weight:800;border:1px solid var(--line);border-radius:6px;padding:3px 5px;background:#0d1528}.ok{color:#8ff0b2;border-color:#286e44}.warn{color:#ffd47d;border-color:#6c5426}.bad{color:#ff9aa4;border-color:#783440}.actions{display:flex;gap:5px;margin-top:6px}.actions a,.actions button{flex:1;border:1px solid var(--line);border-radius:7px;background:#111a30;color:#dce6ff;padding:5px;font-size:10px;font-weight:800;text-align:center;text-decoration:none;cursor:pointer}
.tableWrap{display:none;overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:11px;text-align:left;white-space:nowrap}th{background:#151e34;color:#bcc8e0;text-transform:uppercase;font-size:10px}
@media(max-width:1100px){.kanban{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,32vw)}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr auto}.toolbar input{grid-column:1/-1}.kanban{grid-auto-columns:minmax(275px,88vw)}header .secondary{display:none}}
</style>
</head>
<body>
<header><div class="brand">BGA Studio Project Dashboard<small>CSV viewer · local browser only</small></div><button class="btn primary" id="upload">Upload CSV</button><button class="btn secondary" id="export" disabled>Export filtered</button><button class="btn secondary" id="clear" disabled>Clear</button></header>
<main>
<input id="file" class="hidden" type="file" accept=".csv,text/csv" multiple>
<section id="drop" class="drop"><h2>Drop BGA Studio CSV here</h2><p>or click to choose <code>bga-studio-games-*.csv</code></p></section>
<section id="dash" class="hidden">
<div id="stats" class="stats"></div>
<div class="toolbar"><input id="search" placeholder="Search game, ID, status, version…"><select id="sort"><option value="date-desc">Newest updated</option><option value="date-asc">Oldest updated</option><option value="name">Name A–Z</option><option value="issues">Most issues</option></select><div class="switch"><button id="swim" class="active">Swimlanes</button><button id="tableBtn">Table</button></div></div>
<div id="filters" class="filters"></div><div class="summary"><span id="count"></span><span id="fileInfo"></span></div>
<div id="kanban" class="kanban"></div><div id="tableWrap" class="tableWrap"><table><thead><tr><th>Name</th><th>Status</th><th>Game ID</th><th>Updated</th><th>Public Version</th><th>Checks</th><th>Studio</th></tr></thead><tbody id="tbody"></tbody></table></div>
</section></main>
<script>
(()=>{
const $=s=>document.querySelector(s),order=["released","beta","public alpha","private alpha","not deployed"],labels={"released":"Released","beta":"Beta","public alpha":"Public Alpha","private alpha":"Private Alpha","not deployed":"Not Deployed","other":"Other"};
const E={file:$("#file"),drop:$("#drop"),dash:$("#dash"),stats:$("#stats"),search:$("#search"),sort:$("#sort"),filters:$("#filters"),count:$("#count"),fileInfo:$("#fileInfo"),kanban:$("#kanban"),tableWrap:$("#tableWrap"),tbody:$("#tbody"),upload:$("#upload"),export:$("#export"),clear:$("#clear"),swim:$("#swim"),tableBtn:$("#tableBtn")};
let rows=[],filtered=[],status="all",sources=[];
const clean=v=>String(v??"").trim(),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])),date=v=>{const t=Date.parse(clean(v).replace(" ","T"));return Number.isFinite(t)?t:0},fmt=v=>date(v)?new Date(date(v)).toLocaleString([], {month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"}):clean(v)||"—";
function parseCSV(text){const out=[];let row=[],field="",q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(q){if(c=='"'&&n=='"'){field+='"';i++}else if(c=='"')q=false;else field+=c}else{if(c=='"')q=true;else if(c==","){row.push(field);field=""}else if(c=="\n"){row.push(field.replace(/\r$/,""));out.push(row);row=[];field=""}else field+=c}}if(field||row.length){row.push(field.replace(/\r$/,""));out.push(row)}if(!out.length)return[];const h=out.shift().map(x=>x.trim());return out.filter(r=>r.some(v=>clean(v))).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??""])));}
function normalize(r,source){const s=clean(r.Status).toLowerCase(),check=clean(r["Last Project Check"]);return {...r,__source:source,__status:order.includes(s)?s:"other",__date:date(r["Local Version Date"]),__warn:+((check.match(/(\d+)\s*⚠️/)||[])[1]||0),__err:+((check.match(/(\d+)\s*🚨/)||[])[1]||0)}}
async function load(files){const all=[];sources=[];for(const f of files){const parsed=parseCSV(await f.text());if(parsed[0]&&"Name" in parsed[0]&&"Status" in parsed[0]){all.push(...parsed.map(r=>normalize(r,f.name)));sources.push(f.name)}}if(!all.length)return alert("No valid BGA Studio rows found.");const map=new Map;for(const r of all){const k=(clean(r["Game ID"])||clean(r.Name)).toLowerCase(),p=map.get(k);if(!p||r.__date>=p.__date)map.set(k,r)}rows=[...map.values()];status="all";E.search.value="";E.drop.classList.add("hidden");E.dash.classList.remove("hidden");E.export.disabled=E.clear.disabled=false;render()}
function counts(s){return rows.filter(r=>r.__status===s).length}
function render(){const q=E.search.value.toLowerCase().trim();filtered=rows.filter(r=>(status==="all"||r.__status===status)&&(!q||["Name","Game ID","Status","Public Version","Local Version Date","Last Project Check","Card Text"].some(k=>clean(r[k]).toLowerCase().includes(q))));const mode=E.sort.value;filtered.sort((a,b)=>mode==="date-desc"?b.__date-a.__date:mode==="date-asc"?a.__date-b.__date:mode==="issues"?(b.__err*100+b.__warn)-(a.__err*100+a.__warn):clean(a.Name).localeCompare(clean(b.Name)));stats();filters();cards();table();E.count.textContent=`Showing ${filtered.length} of ${rows.length} projects`;E.fileInfo.textContent=sources.length===1?sources[0]:`${sources.length} files merged`}
function stats(){const d=rows.filter(r=>r.__status!=="not deployed").length,i=rows.filter(r=>r.__warn||r.__err).length;E.stats.innerHTML=[["Projects",rows.length],["Deployed",d],["Public Alpha",counts("public alpha")],["Beta",counts("beta")],["Released",counts("released")],["With Issues",i]].map(([l,n])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("")}
function filters(){const ss=[...order];if(rows.some(r=>r.__status==="other"))ss.push("other");E.filters.innerHTML=`<button class="chip ${status==="all"?"active":""}" data-s="all">All ${rows.length}</button>`+ss.map(s=>`<button class="chip ${status===s?"active":""}" data-s="${s}">${labels[s]} ${counts(s)}</button>`).join("");E.filters.querySelectorAll("button").forEach(b=>b.onclick=()=>{status=b.dataset.s;render()})}
function card(r){const n=clean(r.Name)||clean(r["Game ID"])||"Unnamed",id=clean(r["Game ID"]),u=clean(r["Studio Project URL"]),t=clean(r["Thumbnail URL"]),issue=r.__err?`<span class="badge bad">🚨 ${r.__err}</span>`:r.__warn?`<span class="badge warn">⚠️ ${r.__warn}</span>`:'<span class="badge ok">✓ Clean</span>';return `<article class="card"><div class="top">${t?`<img class="thumb" src="${esc(t)}" loading="lazy">`:`<div class="fallback">BGA</div>`}<div class="grow"><div class="name">${esc(n)}</div><div class="meta">${esc(id||"No ID")} · ${esc(fmt(r["Local Version Date"]))}</div></div></div><div class="badges">${issue}${clean(r["Public Version"])?`<span class="badge">${esc(clean(r["Public Version"]).replace(/^'/,""))}</span>`:""}</div><div class="actions"><a href="${esc(u||"#")}" target="_blank" rel="noopener">Open Studio</a><button data-copy="${esc(id||n)}">Copy ID</button></div></article>`}
function cards(){const groups=status==="all"?[...order]:[status];E.kanban.innerHTML=groups.map(s=>{const rs=filtered.filter(r=>r.__status===s);return `<section class="lane"><div class="laneHead"><span>${labels[s]||s}</span><span>${rs.length}</span></div><div class="cards">${rs.length?rs.map(card).join(""):'<div class="meta">No matching projects</div>'}</div></section>`}).join("");E.kanban.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>navigator.clipboard.writeText(b.dataset.copy))}
function table(){E.tbody.innerHTML=filtered.map(r=>`<tr><td>${esc(r.Name)}</td><td>${esc(r.Status)}</td><td>${esc(r["Game ID"])}</td><td>${esc(fmt(r["Local Version Date"]))}</td><td>${esc(r["Public Version"])}</td><td>${esc(r["Last Project Check"])}</td><td>${clean(r["Studio Project URL"])?`<a href="${esc(r["Studio Project URL"])}" target="_blank">Open ↗</a>`:"—"}</td></tr>`).join("")}
function setView(table){E.kanban.style.display=table?"none":"grid";E.tableWrap.style.display=table?"block":"none";E.swim.classList.toggle("active",!table);E.tableBtn.classList.toggle("active",table)}
function exportCSV(){if(!filtered.length)return;const h=Object.keys(filtered[0]).filter(k=>!k.startsWith("__")),cell=v=>{const s=String(v??"");return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s},csv=[h.map(cell).join(","),...filtered.map(r=>h.map(k=>cell(r[k])).join(","))].join("\r\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="bga-studio-filtered.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
E.upload.onclick=()=>E.file.click();E.drop.onclick=()=>E.file.click();E.file.onchange=e=>load([...e.target.files]);E.drop.ondragover=e=>{e.preventDefault();E.drop.classList.add("drag")};E.drop.ondragleave=()=>E.drop.classList.remove("drag");E.drop.ondrop=e=>{e.preventDefault();E.drop.classList.remove("drag");load([...e.dataTransfer.files].filter(f=>f.name.toLowerCase().endsWith(".csv")))};E.search.oninput=render;E.sort.onchange=render;E.swim.onclick=()=>setView(false);E.tableBtn.onclick=()=>setView(true);E.export.onclick=exportCSV;E.clear.onclick=()=>location.reload();
})();
</script>
</body></html>
