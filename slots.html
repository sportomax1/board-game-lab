<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 Board Game Slots Machine</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23ff6b9d' width='100' height='100'/><text x='50' y='70' font-size='60' fill='white' text-anchor='middle' font-family='sans-serif' font-weight='bold'>🎰</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Arial Black', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 3px 3px 6px rgba(0,0,0,0.3), 0 0 10px rgba(255,255,100,0.5); }
            50% { text-shadow: 3px 3px 6px rgba(0,0,0,0.3), 0 0 20px rgba(255,255,100,0.8); }
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .machine {
            background: linear-gradient(145deg, #ff6b9d, #c44569);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
            margin-bottom: 30px;
        }

        .slots-container {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .slot {
            width: 140px;
            height: 200px;
            background: linear-gradient(to bottom, #1a1a2e, #0f3460);
            border: 3px solid #ffd700;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.5), 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
        }

        .slot::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, rgba(255,255,255,0.1) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.1) 75%, transparent 75%, transparent);
            background-size: 20px 20px;
            z-index: 1;
        }

        .slot-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            position: relative;
            z-index: 2;
            color: white;
            text-align: center;
            padding: 10px;
        }

        .slot-image {
            width: 100px;
            height: 120px;
            background: rgba(255,255,255,0.05);
            border-radius: 5px;
            margin-bottom: 5px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slot-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slot-name {
            font-size: 0.7rem;
            font-weight: bold;
            line-height: 1;
            color: #ffd700;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .slot.spinning {
            animation: shake 0.1s infinite;
        }

        @keyframes shake {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .slot.winner {
            animation: pulse 0.5s ease-in-out;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.5), 0 10px 30px rgba(255,215,0,0.6);
            background: linear-gradient(to bottom, #2a5a2a, #1a3a1a);
            border-color: #00ff00;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .status-bar {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
            color: white;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.1rem;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-spin {
            background: linear-gradient(145deg, #ffd700, #ffed4e);
            color: #333;
        }

        .btn-spin:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255,215,0,0.4);
        }

        .btn-spin:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-spin:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-reset {
            background: linear-gradient(145deg, #4f46e5, #7c3aed);
            color: white;
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79,70,229,0.4);
        }

        .btn-reset:active {
            transform: translateY(0);
        }

        .results {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 10px;
            color: white;
            text-align: center;
        }

        .results h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #ffd700;
        }

        .results p {
            font-size: 1.1rem;
            margin: 5px 0;
            opacity: 0.9;
        }

        .result-animation {
            animation: bounce 0.6s ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .loading {
            text-align: center;
            color: white;
            padding: 20px;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #ffd700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .match-emoji {
            font-size: 2rem;
            margin: 10px 0;
            animation: bounce-emoji 0.6s ease-in-out;
        }

        @keyframes bounce-emoji {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.2); }
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
            font-size: 0.95rem;
        }

        .stat-item {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
        }

        .stat-label {
            opacity: 0.8;
        }

        .stat-value {
            font-weight: bold;
            color: #ffd700;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 2rem;
            }

            .slots-container {
                gap: 10px;
            }

            .slot {
                width: 100px;
                height: 150px;
            }

            .slot-image {
                width: 80px;
                height: 100px;
            }

            .slot-name {
                font-size: 0.6rem;
            }

            .controls {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎰 SLOTS!</h1>
            <p>Spin your collection!</p>
        </div>

        <div class="machine">
            <div id="setupForm" style="background: rgba(0,0,0,0.3); padding: 20px; border-radius: 10px; margin-bottom: 20px; text-align: center;">
                <div style="color: white; margin-bottom: 15px;">
                    <label for="usernameInput" style="display: block; margin-bottom: 10px; font-size: 1.1rem; font-weight: bold;">⚙️ SETUP</label>
                    <p style="margin-bottom: 15px; font-size: 0.95rem; opacity: 0.9;">Enter your BoardGameGeek username to load your collection</p>
                    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                        <input type="text" id="usernameInput" placeholder="e.g., sportomax" style="flex: 1; padding: 12px; border: 2px solid rgba(255,255,255,0.3); border-radius: 8px; font-size: 1rem; background: rgba(255,255,255,0.1); color: white;" autocomplete="off">
                        <button id="loadBtn" class="btn btn-spin" style="margin: 0; min-width: 120px;">📥 LOAD</button>
                    </div>
                    
                    <!-- Collection Filters -->
                    <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; margin-bottom: 15px; text-align: left;">
                        <p style="font-size: 0.95rem; font-weight: bold; margin-bottom: 10px;">📚 Collection Status Filters:</p>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9rem;">
                                <input type="checkbox" id="filterOwn" checked style="cursor: pointer; width: 18px; height: 18px;">
                                <span>✅ Own</span>
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9rem;">
                                <input type="checkbox" id="filterPrevOwned" style="cursor: pointer; width: 18px; height: 18px;">
                                <span>⏪ Previously Owned</span>
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9rem;">
                                <input type="checkbox" id="filterWantToPlay" style="cursor: pointer; width: 18px; height: 18px;">
                                <span>🎮 Want to Play</span>
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9rem;">
                                <input type="checkbox" id="filterWant" style="cursor: pointer; width: 18px; height: 18px;">
                                <span>🎁 Want</span>
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9rem;">
                                <input type="checkbox" id="filterWishlist" style="cursor: pointer; width: 18px; height: 18px;">
                                <span>⭐ Wishlist</span>
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9rem;">
                                <input type="checkbox" id="filterForTrade" style="cursor: pointer; width: 18px; height: 18px;">
                                <span>🔄 For Trade</span>
                            </label>
                        </div>
                    </div>

                    <p style="font-size: 0.85rem; opacity: 0.7;">💡 Tip: Your collection must be public on BGG to load</p>
                    <p style="margin-top: 8px; font-size: 0.85rem; opacity: 0.7;">⏳ Loading may take 10-30 seconds for large collections</p>
                </div>
            </div>

            <div class="status-bar" id="statusBar" style="display: none;">Loading your collection...</div>

            <div class="slots-container" id="slotsContainer">
                <div class="slot">
                    <div class="slot-content">
                        <div class="loading">
                            <div class="spinner"></div>
                            Loading...
                        </div>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-spin" id="spinBtn" disabled>🎰 SPIN</button>
                <button class="btn btn-reset" id="resetBtn">🔄 NEW SPIN</button>
            </div>

            <div class="results" id="results" style="display:none;">
                <h2 id="resultTitle">🎉 MATCH!</h2>
                <div id="resultEmoji" class="match-emoji"></div>
                <p id="resultText"></p>
                <div class="stats" id="stats"></div>
            </div>
        </div>
    </div>

    <script>
        let collection = [];
        let isSpinning = false;
        let spinCount = 0;
        let matchCount = 0;
        let currentSlots = [null, null, null];

        const spinBtn = document.getElementById('spinBtn');
        const resetBtn = document.getElementById('resetBtn');
        const slotsContainer = document.getElementById('slotsContainer');
        const statusBar = document.getElementById('statusBar');
        const results = document.getElementById('results');
        const setupForm = document.getElementById('setupForm');
        const usernameInput = document.getElementById('usernameInput');
        const loadBtn = document.getElementById('loadBtn');

        // Load collection
        async function loadCollection(username) {
            if (!username || username.trim() === '') {
                statusBar.textContent = '❌ Please enter a username!';
                statusBar.style.display = 'block';
                return;
            }

            try {
                statusBar.style.display = 'block';
                statusBar.textContent = '🔄 Loading your collection (this may take 10-30 seconds)...';
                setupForm.style.display = 'none';
                spinBtn.disabled = true;

                // Build filter query string
                let queryParams = '&own=1'; // Default to own collection
                
                // Check which filters are selected
                if (document.getElementById('filterPrevOwned').checked) queryParams += '&prevowned=1';
                if (document.getElementById('filterWantToPlay').checked) queryParams += '&wanttoplay=1';
                if (document.getElementById('filterWant').checked) queryParams += '&want=1';
                if (document.getElementById('filterWishlist').checked) queryParams += '&wishlist=1';
                if (document.getElementById('filterForTrade').checked) queryParams += '&fortrade=1';

                // Use our API proxy instead of direct BGG API call
                const url = `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&stats=1${queryParams}`;
                console.log('Fetching from:', url);

                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`API Error ${response.status}: ${response.statusText}. Check that the username exists and collection is public.`);
                }

                const xmlText = await response.text();
                console.log('Response length:', xmlText.length);
                
                if (!xmlText || xmlText.length === 0) {
                    throw new Error('Empty response from server');
                }

                const xml = new DOMParser().parseFromString(xmlText, 'text/xml');

                // Check for errors in XML
                if (xml.querySelector('error')) {
                    const errorMsg = xml.querySelector('error')?.textContent || 'Unknown error';
                    throw new Error(`BGG Error: ${errorMsg}. Check that your username is correct and your collection is public.`);
                }
                
                // Check for parser errors
                if (xml.querySelector('parsererror')) {
                    throw new Error('Invalid XML response from server. The API may be temporarily unavailable.');
                }

                collection = Array.from(xml.querySelectorAll('item')).map(item => ({
                    id: item.getAttribute('objectid'),
                    name: item.querySelector('name')?.textContent || 'Unknown',
                    thumbnail: item.querySelector('thumbnail')?.textContent?.trim() || '',
                    image: item.querySelector('image')?.textContent?.trim() || ''
                })).filter(g => g.thumbnail || g.image);

                if (collection.length === 0) {
                    statusBar.textContent = '❌ No games found with selected filters! Try adjusting your filters or check that your collection is set to public on BoardGameGeek.';
                    setupForm.style.display = 'block';
                    spinBtn.disabled = true;
                    return;
                }

                statusBar.textContent = `✅ Loaded ${collection.length} games! Ready to spin! Press SPIN to start.`;
                spinBtn.disabled = false;
                renderSlots([null, null, null]);
            } catch (error) {
                console.error('Error:', error);
                statusBar.textContent = `❌ Error: ${error.message}`;
                setupForm.style.display = 'block';
                statusBar.style.display = 'block';
                spinBtn.disabled = true;
            }
        }

        function getRandomGame() {
            return collection[Math.floor(Math.random() * collection.length)];
        }

        function renderSlots(slots) {
            slotsContainer.innerHTML = slots.map((game, idx) => `
                <div class="slot" id="slot-${idx}">
                    <div class="slot-content">
                        ${game ? `
                            <div class="slot-image">
                                <img src="${game.image || game.thumbnail}" alt="${game.name}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22120%22%3E%3Crect fill=%22%23333%22 width=%22100%22 height=%22120%22/%3E%3C/svg%3E'">
                            </div>
                            <div class="slot-name">${game.name.substring(0, 15)}</div>
                        ` : `<div style="color: #999; font-size: 2rem;">?</div>`}
                    </div>
                </div>
            `).join('');
        }

        async function spin() {
            if (isSpinning || collection.length === 0) return;

            isSpinning = true;
            spinBtn.disabled = true;
            results.style.display = 'none';
            spinCount++;
            statusBar.textContent = '🎰 SPINNING...';

            // Add spinning animation
            const slots = document.querySelectorAll('.slot');
            slots.forEach(slot => slot.classList.add('spinning'));

            // Spin duration
            const spinDuration = 2000; // 2 seconds
            const spinStart = Date.now();

            // Quick random display during spin
            const spinInterval = setInterval(() => {
                const randomSlots = [getRandomGame(), getRandomGame(), getRandomGame()];
                renderSlots(randomSlots);
            }, 100);

            // Wait for spin to complete
            await new Promise(resolve => setTimeout(resolve, spinDuration));
            clearInterval(spinInterval);

            // Get final matching set
            const firstGame = getRandomGame();
            currentSlots = [firstGame, firstGame, firstGame]; // Always match!
            renderSlots(currentSlots);

            // Remove spinning animation
            slots.forEach(slot => slot.classList.remove('spinning'));

            // Add winner animation
            slots.forEach((slot, idx) => {
                setTimeout(() => {
                    slot.classList.add('winner');
                }, idx * 150);
            });

            matchCount++;
            showResults();

            isSpinning = false;
            spinBtn.disabled = false;
        }

        function showResults() {
            const game = currentSlots[0];
            const resultTitle = document.getElementById('resultTitle');
            const resultEmoji = document.getElementById('resultEmoji');
            const resultText = document.getElementById('resultText');
            const statsDiv = document.getElementById('stats');

            resultTitle.textContent = '🎉 TRIPLE MATCH! 🎉';
            resultEmoji.textContent = '💰';
            resultText.textContent = `You matched: ${game.name}!`;

            statsDiv.innerHTML = `
                <div class="stat-item">
                    <span class="stat-label">Total Spins:</span>
                    <span class="stat-value">${spinCount}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Matches:</span>
                    <span class="stat-value">${matchCount}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Match Rate:</span>
                    <span class="stat-value">${Math.round((matchCount / spinCount) * 100)}%</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Win Streak:</span>
                    <span class="stat-value">${matchCount}</span>
                </div>
            `;

            results.classList.remove('result-animation');
            void results.offsetWidth; // Trigger reflow
            results.classList.add('result-animation');
            results.style.display = 'block';

            statusBar.textContent = '✨ JACKPOT! Click SPIN for another round!';
        }

        function reset() {
            spinCount = 0;
            matchCount = 0;
            currentSlots = [null, null, null];
            results.style.display = 'none';
            renderSlots([null, null, null]);
            statusBar.textContent = `✅ Ready to play! Press SPIN to start!`;
            spinBtn.disabled = false;
        }

        spinBtn.addEventListener('click', spin);
        resetBtn.addEventListener('click', reset);
        loadBtn.addEventListener('click', () => loadCollection(usernameInput.value));
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loadCollection(usernameInput.value);
        });

        // Initialize
        usernameInput.value = 'sportomax';
        spinBtn.disabled = true; // Disabled until collection is loaded
        statusBar.textContent = '👉 Enter a username and press LOAD to get started';
        statusBar.style.display = 'block';
    </script>
</body>
</html>
