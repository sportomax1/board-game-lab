<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Games Hub</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕹️</text></svg>">
  <script src="/bgg-cache.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
      padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
    }

    /* ── Header ─────────────────────────────────────────── */
    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid #e2e8f0;
      padding: max(0.75rem, env(safe-area-inset-top)) 1rem 0.75rem;
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .brand { display: flex; align-items: center; gap: 0.55rem; flex-shrink: 0; }
    .brand-icon {
      width: 36px; height: 36px;
      background: #7c3aed; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; color: #fff;
    }
    .brand-title { font-size: 1.05rem; font-weight: 800; line-height: 1.1; }
    .brand-sub   { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #64748b; }

    .controls { display: flex; align-items: center; gap: 0.5rem; flex: 1; flex-wrap: wrap; }

    .search-input {
      padding: 8px 14px; border-radius: 10px; border: 1.5px solid #e2e8f0;
      font-size: 14px; font-weight: 500; font-family: inherit;
      outline: none; transition: border-color .2s; flex: 1; min-width: 180px; max-width: 320px;
      background: #fff;
    }
    .search-input:focus { border-color: #7c3aed; }

    .sort-select {
      padding: 8px 12px; border-radius: 10px; border: 1.5px solid #e2e8f0;
      font-size: 13px; font-weight: 600; font-family: inherit;
      background: #fff; outline: none; cursor: pointer;
    }

    #gameCount { font-size: 12px; color: #64748b; font-weight: 500; white-space: nowrap; }

    /* ── Hamburger button ────────────────────────────────── */
    .hamburger-btn {
      width: 36px; height: 36px;
      background: transparent; border: 1.5px solid #e2e8f0;
      border-radius: 10px; cursor: pointer;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
      flex-shrink: 0; padding: 0; transition: border-color .15s;
    }
    .hamburger-btn:hover { border-color: #7c3aed; }
    .hamburger-btn span {
      display: block; width: 15px; height: 2px;
      background: #64748b; border-radius: 2px; transition: background .15s;
    }
    .hamburger-btn:hover span { background: #7c3aed; }

    /* ── Left navigation sidebar ─────────────────────────── */
    .left-nav {
      position: fixed; top: 0; left: 0;
      width: 210px; height: 100vh;
      background: #fff; border-right: 1px solid #e2e8f0;
      z-index: 25;
      display: flex; flex-direction: column;
      padding: 86px 6px 16px;
      overflow-y: auto; overflow-x: hidden;
      transition: transform .22s cubic-bezier(.4,0,.2,1);
      scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent;
    }
    body.nav-collapsed .left-nav { transform: translateX(-100%); }

    /* ── Nav button ──────────────────────────────────────── */
    .nav-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; border-radius: 10px; border: none;
      font-weight: 700; font-size: 0.8rem; font-family: inherit;
      color: #64748b; background: transparent; cursor: pointer;
      text-align: left; width: 100%; white-space: nowrap;
      transition: all .15s; flex-shrink: 0;
    }
    .nav-btn:hover:not(.active) { background: #f1f5f9; color: #334155; }
    .nav-btn.active { background: #ede9fe; color: #7c3aed; }
    .nav-count {
      margin-left: auto; font-size: 10px; font-weight: 800;
      padding: 1px 6px; border-radius: 999px;
      background: #f1f5f9; color: #64748b;
    }
    .nav-btn.active .nav-count { background: #ddd6fe; color: #7c3aed; }
    .nav-divider {
      font-size: 9px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .08em; color: #94a3b8; padding: 14px 12px 4px;
    }

    .nav-search-wrap { padding: 0 4px 6px; flex-shrink: 0; }
    .nav-search { width: 100%; padding: 6px 10px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 0.78rem; font-family: inherit; background: #f8fafc; color: #334155; outline: none; box-sizing: border-box; }
    .nav-search:focus { border-color: #a78bfa; background: #fff; }

    /* ── Mobile nav overlay ──────────────────────────────── */
    .nav-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(15,23,42,.45); z-index: 24;
      backdrop-filter: blur(2px); cursor: pointer;
    }
    body.nav-open .nav-overlay { display: block; }

    /* ── Shared view wrapper ─────────────────────────────── */
    .view-wrap {
      max-width: 1400px; padding: 1.25rem 1rem;
      margin-left: 210px;
      transition: margin-left .22s cubic-bezier(.4,0,.2,1);
    }
    body.nav-collapsed .view-wrap { margin-left: 0; }

    /* ── Mobile ─────────────────────────────────────────── */
    @media (max-width: 768px) {
      .left-nav { transform: translateX(-100%); z-index: 40; padding-top: 16px; }
      body.nav-open .left-nav { transform: translateX(0); }
      .view-wrap { margin-left: 0 !important; }
    }

    /* ── Game card grid ──────────────────────────────────── */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 0.85rem;
    }

    .game-card {
      display: flex; flex-direction: column; align-items: flex-start;
      background: #fff; border-radius: 14px;
      border: 1px solid #e2e8f0;
      padding: 1rem;
      text-decoration: none; color: inherit;
      cursor: pointer;
      transition: box-shadow .18s, border-color .18s, transform .15s;
      box-shadow: 0 1px 4px rgba(15,23,42,.05);
      position: relative;
    }
    .game-card:hover {
      border-color: #a78bfa;
      box-shadow: 0 6px 20px rgba(124,58,237,.12);
      transform: translateY(-2px);
    }

    .game-emoji {
      font-size: 2.2rem; line-height: 1;
      margin-bottom: 0.55rem;
    }
    .game-name {
      font-size: 0.88rem; font-weight: 800;
      color: #0f172a; margin-bottom: 0.3rem;
      line-height: 1.25;
    }
    .game-desc {
      font-size: 0.72rem; color: #64748b;
      font-weight: 500; line-height: 1.45;
      flex: 1;
    }
    .game-credit {
      font-size: 0.65rem; color: #94a3b8; font-weight: 600;
      margin-top: 0.4rem; font-style: italic;
    }
    .game-star {
      position: absolute; top: 8px; right: 10px;
      font-size: 0.65rem; color: #f59e0b; font-weight: 800;
    }

    /* ── Empty state ─────────────────────────────────────── */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center; padding: 4rem 1rem; color: #94a3b8;
    }
    .empty-state .e-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .empty-state .e-msg  { font-size: 0.95rem; font-weight: 700; }
    .empty-state .e-sub  { font-size: 0.78rem; margin-top: 4px; }

    /* ── Section heading inside grid ─────────────────────── */
    .grid-section-head {
      grid-column: 1 / -1;
      font-size: 0.72rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: .07em;
      color: #94a3b8; padding: 0.5rem 0 0.15rem;
      border-bottom: 1px solid #f1f5f9;
      margin-bottom: 0.15rem;
    }

    /* ── Collection loader in header ─────────────────────── */
    #usernameInput {
      padding: 8px 14px; border-radius: 10px; border: 1.5px solid #e2e8f0;
      font-size: 13px; font-weight: 600; font-family: inherit;
      outline: none; transition: border-color .2s; width: 140px; background: #fff;
    }
    #usernameInput:focus { border-color: #7c3aed; }
    #loadBtn {
      padding: 8px 18px; background: #7c3aed; color: #fff; border: none;
      border-radius: 10px; font-weight: 700; font-size: 0.85rem;
      font-family: inherit; cursor: pointer;
      transition: background .2s, opacity .2s; min-height: 36px; white-space: nowrap;
    }
    #loadBtn:hover:not(:disabled) { background: #6d28d9; }
    #loadBtn:disabled { opacity: 0.55; cursor: not-allowed; }
    #statusText { font-size: 12px; color: #64748b; font-weight: 500; white-space: nowrap; }

    /* ── Status filter bar ──────────────────────────────── */
    .status-filter-bar { border-top: 1px solid #f1f5f9; padding: 5px 1rem; }
    .status-filter-inner { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; gap: 3px; flex-wrap: wrap; }
    .sf-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #94a3b8; letter-spacing: .05em; margin-right: 3px; flex-shrink: 0; }
    .sf-chip {
      padding: 2px 7px; border-radius: 6px; border: 1.5px solid #e2e8f0;
      font-size: 10px; font-weight: 700; font-family: inherit;
      cursor: pointer; background: #fff; color: #64748b;
      transition: all .1s; user-select: none; white-space: nowrap;
    }
    .sf-chip[data-state="yes"] { background: #7c3aed; color: #fff; border-color: #7c3aed; }
    .sf-chip[data-state="no"]  { background: #fef2f2; color: #dc2626; border-color: #fecaca; }

    /* ── Game frame panel ────────────────────────────────── */
    #framePanel { display: none; flex-direction: column; gap: 0.5rem; }
    .view-wrap.game-active {
      padding: 0.5rem 0.75rem; max-width: none;
      height: calc(100vh - 70px);
      overflow: hidden;
      display: flex; flex-direction: column;
    }
    .view-wrap.game-active #framePanel { display: flex; flex: 1; min-height: 0; }
    .view-wrap.game-active #gameGrid   { display: none; }

    .frame-bar {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.4rem 0.65rem; background: #fff;
      border: 1px solid #e2e8f0; border-radius: 10px; flex-shrink: 0;
    }
    .frame-back {
      padding: 4px 10px; border-radius: 7px; border: 1.5px solid #e2e8f0;
      font-size: 12px; font-weight: 700; font-family: inherit;
      cursor: pointer; background: #fff; color: #334155; white-space: nowrap;
    }
    .frame-back:hover { border-color: #7c3aed; color: #7c3aed; }
    #frameTitle { font-size: 0.88rem; font-weight: 800; flex: 1; }
    .frame-newtab {
      padding: 4px 10px; border-radius: 7px; background: #f8fafc;
      font-size: 12px; font-weight: 700; color: #64748b; text-decoration: none; white-space: nowrap;
    }
    .frame-newtab:hover { background: #ede9fe; color: #7c3aed; }
    #gameFrame {
      flex: 1; min-height: 0; border: none; border-radius: 12px;
      background: #fff; box-shadow: 0 4px 20px rgba(15,23,42,.08);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <button class="hamburger-btn" onclick="toggleNav()" title="Toggle navigation" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <div class="brand">
        <div class="brand-icon">🕹️</div>
        <div>
          <div class="brand-title">Games Hub</div>
          <div class="brand-sub">Arcade · Board · Puzzle · Word</div>
        </div>
      </div>
      <div class="controls">
        <input type="text" id="searchInput" class="search-input"
               placeholder="🔍 Search games…"
               oninput="onSearch(this.value)"
               autocomplete="off" spellcheck="false">
        <select id="sortSelect" class="sort-select" onchange="render()">
          <option value="rating">⭐ Top Rated</option>
          <option value="alpha">🔤 A–Z</option>
        </select>
        <span id="gameCount"></span>
        <div style="width:1px;height:20px;background:#e2e8f0;flex-shrink:0"></div>
        <input type="text" id="usernameInput" placeholder="BGG username"
               value="sportomax"
               autocapitalize="none" autocorrect="off" spellcheck="false"
               onkeydown="if(event.key==='Enter') loadCollection()">
        <button id="loadBtn" onclick="loadCollection()">Load</button>
        <span id="statusText"></span>
      </div>
    </div>
    <div class="status-filter-bar">
      <div class="status-filter-inner">
        <span class="sf-lbl">Filter:</span>
        <button class="sf-chip" data-field="own"        data-state="either" onclick="cycleStatus('own')">Own</button>
        <button class="sf-chip" data-field="prevowned"  data-state="either" onclick="cycleStatus('prevowned')">Prev</button>
        <button class="sf-chip" data-field="fortrade"   data-state="either" onclick="cycleStatus('fortrade')">Trade</button>
        <button class="sf-chip" data-field="want"       data-state="either" onclick="cycleStatus('want')">Want</button>
        <button class="sf-chip" data-field="wanttoplay" data-state="either" onclick="cycleStatus('wanttoplay')">WTP</button>
        <button class="sf-chip" data-field="wanttobuy"  data-state="either" onclick="cycleStatus('wanttobuy')">WTB</button>
        <button class="sf-chip" data-field="wishlist"   data-state="either" onclick="cycleStatus('wishlist')">Wish</button>
        <button class="sf-chip" data-field="preordered" data-state="either" onclick="cycleStatus('preordered')">Pre</button>
      </div>
    </div>
  </header>

  <div class="nav-overlay" id="navOverlay" onclick="toggleNav()"></div>

  <!-- ── Left nav ────────────────────────────────────────── -->
  <nav class="left-nav" id="leftNav">
    <div class="nav-search-wrap">
      <input type="text" id="navSearch" class="nav-search" placeholder="🔍 Filter…" oninput="filterNav(this.value)">
    </div>
    <button class="nav-btn active" id="navBtn-all"      onclick="switchTab('all')">🎮 <span>All Games</span> <span class="nav-count" id="cnt-all"></span></button>
    <button class="nav-btn"        id="navBtn-arcade"   onclick="switchTab('arcade')">🕹️ <span>Arcade</span> <span class="nav-count" id="cnt-arcade"></span></button>
    <button class="nav-btn"        id="navBtn-board"    onclick="switchTab('board')">🎲 <span>Board</span> <span class="nav-count" id="cnt-board"></span></button>
    <button class="nav-btn"        id="navBtn-puzzle"   onclick="switchTab('puzzle')">🧩 <span>Puzzle</span> <span class="nav-count" id="cnt-puzzle"></span></button>
    <button class="nav-btn"        id="navBtn-word"     onclick="switchTab('word')">📝 <span>Word</span> <span class="nav-count" id="cnt-word"></span></button>
    <button class="nav-btn"        id="navBtn-quiz"     onclick="switchTab('quiz')">🎯 <span>Quiz</span> <span class="nav-count" id="cnt-quiz"></span></button>
    <button class="nav-btn"        id="navBtn-fun"      onclick="switchTab('fun')">🎰 <span>Fun</span> <span class="nav-count" id="cnt-fun"></span></button>
    <div style="flex:1"></div>
    <button class="nav-btn" onclick="window.location.href='home.html'" style="margin-top:8px; color:#94a3b8; font-size:0.75rem;">🏠 <span>Home</span></button>
    <button class="nav-btn" onclick="window.location.href='collectionhub.html'" style="color:#94a3b8; font-size:0.75rem;">🗂️ <span>Collection Hub</span></button>
  </nav>

  <!-- ── Main content ─────────────────────────────────────── -->
  <div class="view-wrap" id="viewWrap">
    <!-- Frame panel (shown when a game is active) -->
    <div id="framePanel">
      <div class="frame-bar">
        <button class="frame-back" onclick="closeGame()">← Games</button>
        <span id="frameTitle"></span>
        <a id="frameNewTab" href="#" target="_blank" rel="noopener" class="frame-newtab">↗ Open full</a>
      </div>
      <iframe id="gameFrame" src="about:blank" allow="autoplay; fullscreen"></iframe>
    </div>
    <!-- Game card grid -->
    <div class="game-grid" id="gameGrid"></div>
  </div>

  <script>
    /* ─── Game data ─────────────────────────────────────── */
    const GAMES = [

      // ── Word ────────────────────────────────────────────
      { name: 'Scramble',       emoji: '🔀', desc: 'Unscramble board game words.',                         url: 'games/scramble.html',      cat: 'word', rating: 5 },
      { name: 'Spelling Game',  emoji: '📝', desc: 'Test spelling knowledge with board game-themed words.', url: 'games/spelling.html',    cat: 'word', rating: 4 },
      { name: 'Hangman',        emoji: '🎪', desc: 'Classic hangman with board game terms.',               url: 'games/hangman.html',       cat: 'word', rating: 3 },
      { name: 'Boardle',        emoji: '📝', desc: 'Guess the board game name in 6 tries.',                url: 'games/boardle.html',       cat: 'word', rating: 2, credit: 'Based on Wordle' },
      { name: 'Crossword',      emoji: '✏️', desc: 'Board game crossword puzzles.',                        url: 'games/crossword.html',     cat: 'word', rating: 1 },
      { name: 'Word Search',    emoji: '🔎', desc: 'Word search puzzles with board game terms.',           url: 'games/wordsearch.html',    cat: 'word', rating: 1 },
      { name: 'Spell',          emoji: '🔤', desc: 'Spell game alternative.',                              url: 'games/spell.html',         cat: 'word', rating: 1 },

      // ── Quiz ────────────────────────────────────────────
      { name: 'Scavenger Hunt', emoji: '🔍', desc: 'Find games in collection scavenger hunt challenges.',  url: 'games/scavengerhunt.html', cat: 'quiz', rating: 5 },
      { name: 'TriviaBox',      emoji: '🌟', desc: 'Guess the board game from clues.',                     url: 'games/triviabox.html',     cat: 'quiz', rating: 2, credit: 'Based on Jeopardy' },
      { name: 'Quiz',           emoji: '❓', desc: 'Board game trivia and quizzes.',                       url: 'games/quiz.html',          cat: 'quiz', rating: 1 },

      // ── Fun ─────────────────────────────────────────────
      { name: 'Random Game',    emoji: '🎲', desc: 'Random game picker for indecisive players.',           url: 'games/random9.html',       cat: 'fun', rating: 3 },
      { name: 'First Player',   emoji: '🥇', desc: 'Choose who goes first randomly.',                      url: 'games/firstplayer.html',   cat: 'fun', rating: 3 },
      { name: 'Swipe Games',    emoji: '👆', desc: 'Tinder-style game browsing.',                          url: 'games/swipe.html',         cat: 'fun', rating: 2 },
      { name: 'Timer',          emoji: '⏱️', desc: 'Game timer for tracking turns and rounds.',            url: 'games/timer.html',         cat: 'fun', rating: 1 },
    ];

    const CAT_LABELS = {
      all:    '🎮 All Games',
      arcade: '🕹️ Arcade',
      board:  '🎲 Board',
      puzzle: '🧩 Puzzle',
      word:   '📝 Word',
      quiz:   '🎯 Quiz',
      fun:    '🎰 Fun',
    };
    const TABS = ['all', 'arcade', 'board', 'puzzle', 'word', 'quiz', 'fun'];

    let currentTab = 'all';
    let searchQuery = '';
    let rendered    = [];   // tracks cards shown in current render pass
    let hubUsername = '';   // BGG username loaded by hub

    const API_BASE = '/api/bgg-helper';

    async function fetchBGGraw(url, retries = 6) {
      const res = await fetch(url);
      if (res.status === 202 && retries > 0) {
        await new Promise(r => setTimeout(r, 3000));
        return fetchBGGraw(url, retries - 1);
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.text();
    }

    /* ─── Init ──────────────────────────────────────────── */
    function init() {
      try {
        const raw = localStorage.getItem('bgg_hub_cache');
        if (raw) {
          const { username, ts } = JSON.parse(raw);
          if (username) {
            document.getElementById('usernameInput').value = username;
            hubUsername = username;
            const age = Math.round((Date.now() - ts) / 60000);
            document.getElementById('statusText').textContent =
              age < 1 ? '✓ just loaded' : `✓ cached ${age}m ago`;
          }
        }
      } catch(e) {}
      updateCounts();
      render();
    }

    /* ─── Status chip cycle (either → yes → no → either) ── */
    function cycleStatus(field) {
      const btn = document.querySelector(`.sf-chip[data-field="${field}"]`);
      if (!btn) return;
      const cur = btn.dataset.state || 'either';
      btn.dataset.state = cur === 'either' ? 'yes' : cur === 'yes' ? 'no' : 'either';
    }

    function activeStatuses() {
      const yes = [], no = [];
      document.querySelectorAll('.sf-chip').forEach(c => {
        if (c.dataset.state === 'yes') yes.push(c.dataset.field);
        if (c.dataset.state === 'no')  no.push(c.dataset.field);
      });
      return { yes, no };
    }

    /* ─── Hub collection loader ──────────────────────────── */
    async function loadCollection() {
      const user = (document.getElementById('usernameInput').value || '').trim().toLowerCase();
      if (!user) return;
      hubUsername = user;
      localStorage.removeItem('bgg_hub_cache'); // bypass bgg-cache.js for forced reload
      const btn = document.getElementById('loadBtn');
      btn.disabled = true;
      document.getElementById('statusText').textContent = 'Loading…';
      try {
        // stats=1 gives ratings, ranks, weight, player counts
        const url = `${API_BASE}?endpoint=collection&username=${encodeURIComponent(user)}&stats=1`;
        const xml = await fetchBGGraw(url);
        const count = (xml.match(/<item /g) || []).length;
        // Save to shared cache so all game pages benefit
        try {
          localStorage.setItem('bgg_hub_cache', JSON.stringify({
            username: user, xmlText: xml, ts: Date.now()
          }));
        } catch(e) {}
        document.getElementById('statusText').textContent = `✓ ${count} games cached`;
      } catch(err) {
        document.getElementById('statusText').textContent = `Error: ${err.message}`;
      }
      btn.disabled = false;
    }

    /* ─── Open game in iframe ───────────────────────────── */
    function openGame(i) {
      const g = rendered[i];
      if (!g) return;
      // Build URL with username + active status flags
      const usp = new URLSearchParams();
      if (hubUsername) usp.set('bgguser', hubUsername);
      const { yes } = activeStatuses();
      if (yes.length) usp.set('status', yes.join(','));
      const url = `${g.url}${usp.toString() ? '?' + usp.toString() : ''}`;
      const iframe = document.getElementById('gameFrame');
      document.getElementById('frameTitle').textContent = `${g.emoji} ${g.name}`;
      document.getElementById('frameNewTab').href = g.url;
      if (iframe.getAttribute('data-src') !== g.url) {
        iframe.src = url;
        iframe.setAttribute('data-src', g.url);
      }
      document.getElementById('viewWrap').classList.add('game-active');
      document.body.classList.remove('nav-open');
    }

    /* ─── Back to game grid ─────────────────────────────── */
    function closeGame() {
      document.getElementById('viewWrap').classList.remove('game-active');
    }

    function updateCounts() {
      TABS.forEach(tab => {
        const el = document.getElementById('cnt-' + tab);
        if (!el) return;
        const n = tab === 'all' ? GAMES.length : GAMES.filter(g => g.cat === tab).length;
        el.textContent = n;
      });
    }

    /* ─── Tab switching ─────────────────────────────────── */
    function switchTab(tab) {
      currentTab = tab;
      TABS.forEach(t => {
        const btn = document.getElementById('navBtn-' + t);
        if (btn) btn.classList.toggle('active', t === tab);
      });
      render();
      // close nav on mobile
      if (window.innerWidth <= 768) document.body.classList.remove('nav-open');
    }

    /* ─── Search ────────────────────────────────────────── */
    function onSearch(val) {
      searchQuery = val;
      render();
    }

    /* ─── Render ────────────────────────────────────────── */
    function render() {
      const q = searchQuery.trim().toLowerCase();
      const sortMode = document.getElementById('sortSelect').value;

      let filtered = GAMES.filter(g => {
        if (currentTab !== 'all' && g.cat !== currentTab) return false;
        if (q && !g.name.toLowerCase().includes(q) && !g.desc.toLowerCase().includes(q)) return false;
        return true;
      });

      if (sortMode === 'alpha') {
        filtered.sort((a, b) => a.name.localeCompare(b.name));
      } else {
        filtered.sort((a, b) => b.rating - a.rating || a.name.localeCompare(b.name));
      }

      rendered = []; // reset for new render pass
      const grid = document.getElementById('gameGrid');
      const count = document.getElementById('gameCount');
      count.textContent = filtered.length + ' game' + (filtered.length !== 1 ? 's' : '');

      if (!filtered.length) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="e-icon">🔍</div>
            <div class="e-msg">No games found</div>
            <div class="e-sub">Try a different search or category</div>
          </div>`;
        return;
      }

      // Group by sub-category when showing "All"
      if (currentTab === 'all' && !q && sortMode === 'rating') {
        let html = '';
        const catOrder = ['arcade', 'board', 'puzzle', 'word', 'quiz', 'fun'];
        catOrder.forEach(cat => {
          const inCat = filtered.filter(g => g.cat === cat);
          if (!inCat.length) return;
          html += `<div class="grid-section-head">${CAT_LABELS[cat]}</div>`;
          inCat.forEach(g => { html += cardHtml(g); });
        });
        grid.innerHTML = html;
      } else {
        grid.innerHTML = filtered.map(cardHtml).join('');
      }
    }

    function cardHtml(g) {
      const i     = rendered.push(g) - 1; // index for openGame()
      const stars = g.rating >= 5 ? '★★★★★'
                  : g.rating >= 4 ? '★★★★'
                  : g.rating >= 3 ? '★★★'
                  : '';
      return `
        <a class="game-card" href="${g.url}" onclick="event.preventDefault();openGame(${i})">
          ${stars ? `<div class="game-star">${stars}</div>` : ''}
          <div class="game-emoji">${g.emoji}</div>
          <div class="game-name">${g.name}</div>
          <div class="game-desc">${g.desc}</div>
          ${g.credit ? `<div class="game-credit">${g.credit}</div>` : ''}
        </a>`;
    }

    /* ─── Nav filter ─────────────────────────────────────── */
    function filterNav(q) {
      const lq = q.toLowerCase();
      document.querySelectorAll('.nav-btn').forEach(btn => {
        if (!btn.id.startsWith('navBtn-')) return;
        const label = btn.querySelector('span')?.textContent || '';
        btn.style.display = (!lq || label.toLowerCase().includes(lq)) ? '' : 'none';
      });
    }

    /* ─── Nav toggle ─────────────────────────────────────── */
    function toggleNav() {
      const collapsed = document.body.classList.toggle('nav-collapsed');
      if (!collapsed) document.body.classList.remove('nav-open');
      if (window.innerWidth <= 768) {
        document.body.classList.remove('nav-collapsed');
        document.body.classList.toggle('nav-open');
      }
    }

    init();
  </script>
</body>
</html>
