<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <title>My Board Game Top 10s</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: rgba(15, 29, 48, .82);
      --panel-2: rgba(20, 39, 64, .92);
      --line: rgba(255,255,255,.10);
      --text: #f4f7fb;
      --muted: #9fb0c5;
      --accent: #6ee7b7;
      --accent-2: #7dd3fc;
      --danger: #fda4af;
      --shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, rgba(14,165,233,.20), transparent 32rem),
        radial-gradient(circle at 92% 12%, rgba(16,185,129,.16), transparent 28rem),
        var(--bg);
    }
    button, input, select { font: inherit; }
    button { color: inherit; }
    a { color: inherit; }
    .shell { width: min(1480px, 100%); margin: 0 auto; padding: 18px clamp(14px, 3vw, 34px) 56px; }
    .hero {
      position: sticky;
      top: 0;
      z-index: 20;
      margin: -18px calc(clamp(14px, 3vw, 34px) * -1) 20px;
      padding: calc(18px + env(safe-area-inset-top)) clamp(14px, 3vw, 34px) 16px;
      background: rgba(7,17,31,.88);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }
    .hero-row { width: min(1480px, 100%); margin: 0 auto; display: flex; gap: 16px; align-items: flex-end; justify-content: space-between; }
    .eyebrow { color: var(--accent); font-size: .72rem; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 5px 0 5px; font-size: clamp(1.65rem, 4vw, 3rem); line-height: 1; letter-spacing: -.045em; }
    .subtitle { color: var(--muted); margin: 0; font-size: .92rem; }
    .hero-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .status {
      display: inline-flex; align-items: center; gap: 8px; min-height: 38px;
      padding: 8px 12px; border: 1px solid var(--line); background: rgba(255,255,255,.04);
      border-radius: 999px; color: var(--muted); font-size: .78rem; font-weight: 800;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; box-shadow: 0 0 0 4px rgba(100,116,139,.12); }
    .status.ready .dot { background: var(--accent); box-shadow: 0 0 0 4px rgba(110,231,183,.12); }
    .status.error .dot { background: var(--danger); box-shadow: 0 0 0 4px rgba(253,164,175,.12); }
    .btn {
      min-height: 38px; padding: 8px 13px; border-radius: 11px; border: 1px solid var(--line);
      background: rgba(255,255,255,.05); cursor: pointer; font-weight: 850; font-size: .79rem;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }
    .btn:hover { transform: translateY(-1px); background: rgba(255,255,255,.09); border-color: rgba(255,255,255,.20); }
    .controls {
      display: grid; grid-template-columns: minmax(220px, 1fr) auto auto; gap: 10px;
      padding: 12px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 17px;
      background: var(--panel); box-shadow: var(--shadow);
    }
    .search-wrap { position: relative; }
    .search-wrap span { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); opacity: .58; pointer-events: none; }
    input[type="search"], select {
      width: 100%; min-height: 42px; border: 1px solid var(--line); border-radius: 12px;
      background: rgba(4,12,24,.72); color: var(--text); outline: none;
    }
    input[type="search"] { padding: 0 14px 0 40px; }
    select { padding: 0 34px 0 12px; cursor: pointer; }
    input:focus, select:focus { border-color: rgba(125,211,252,.65); box-shadow: 0 0 0 3px rgba(125,211,252,.10); }
    .toggle {
      display: inline-flex; align-items: center; gap: 9px; min-height: 42px; padding: 0 12px;
      border: 1px solid var(--line); border-radius: 12px; background: rgba(4,12,24,.72);
      font-size: .78rem; color: var(--muted); font-weight: 800; white-space: nowrap;
    }
    .toggle input { accent-color: #34d399; width: 17px; height: 17px; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 14px; scrollbar-width: thin; }
    .chip {
      flex: 0 0 auto; border: 1px solid var(--line); background: rgba(255,255,255,.04);
      border-radius: 999px; padding: 8px 12px; cursor: pointer; font-size: .76rem; font-weight: 850; color: var(--muted);
    }
    .chip.active { color: #042017; background: var(--accent); border-color: var(--accent); }
    .summary {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 18px;
    }
    .metric { padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); }
    .metric-label { color: var(--muted); text-transform: uppercase; letter-spacing: .12em; font-size: .62rem; font-weight: 900; }
    .metric-value { margin-top: 4px; font-size: clamp(1.1rem, 3vw, 1.65rem); font-weight: 950; letter-spacing: -.03em; }
    .sections { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .section {
      min-width: 0; border: 1px solid var(--line); border-radius: 20px; overflow: hidden;
      background: linear-gradient(180deg, rgba(20,39,64,.92), rgba(12,25,43,.91));
      box-shadow: var(--shadow);
    }
    .section-head {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
      padding: 16px 16px 13px; border-bottom: 1px solid var(--line);
    }
    .section-title { margin: 0; font-size: 1.05rem; letter-spacing: -.02em; }
    .section-desc { color: var(--muted); font-size: .72rem; margin-top: 3px; }
    .unit-badge {
      flex: 0 0 auto; padding: 6px 9px; border-radius: 999px; background: rgba(125,211,252,.09);
      border: 1px solid rgba(125,211,252,.19); color: var(--accent-2); font-size: .65rem; font-weight: 900;
    }
    .rank-list { list-style: none; padding: 0; margin: 0; }
    .rank-row {
      display: grid; grid-template-columns: 34px 50px minmax(0,1fr) auto; gap: 10px; align-items: center;
      min-height: 68px; padding: 9px 14px; border-bottom: 1px solid rgba(255,255,255,.065); cursor: pointer;
      transition: background .14s ease;
    }
    .rank-row:last-child { border-bottom: 0; }
    .rank-row:hover { background: rgba(125,211,252,.07); }
    .rank-num { font-size: .82rem; font-weight: 950; color: var(--muted); text-align: center; }
    .rank-row:nth-child(1) .rank-num { color: #fde68a; font-size: 1.1rem; }
    .rank-row:nth-child(2) .rank-num { color: #dbeafe; }
    .rank-row:nth-child(3) .rank-num { color: #fdba74; }
    .cover { width: 50px; height: 50px; object-fit: cover; border-radius: 10px; background: #0f1e31; border: 1px solid var(--line); }
    .game { min-width: 0; }
    .game-name { font-size: .84rem; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .game-meta { margin-top: 4px; color: var(--muted); font-size: .67rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .score { text-align: right; min-width: 68px; }
    .score-main { font-size: .92rem; font-weight: 950; color: var(--accent); }
    .score-rating { color: var(--muted); font-size: .65rem; margin-top: 3px; }
    .empty, .loading { grid-column: 1 / -1; padding: 42px 18px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 18px; }
    dialog {
      width: min(720px, calc(100% - 22px)); max-height: min(84vh, 760px); border: 1px solid var(--line);
      border-radius: 22px; padding: 0; overflow: hidden; color: var(--text); background: #0d1b2d; box-shadow: 0 30px 100px #000;
    }
    dialog::backdrop { background: rgba(2,8,18,.78); backdrop-filter: blur(8px); }
    .modal-top { display: grid; grid-template-columns: 150px 1fr; gap: 18px; padding: 18px; }
    .modal-cover { width: 150px; aspect-ratio: 1; object-fit: cover; border-radius: 16px; border: 1px solid var(--line); background: #091525; }
    .modal-name { margin: 0; font-size: clamp(1.35rem, 5vw, 2rem); line-height: 1.05; }
    .modal-id { margin-top: 7px; color: var(--muted); font-size: .76rem; }
    .modal-stats { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; margin-top: 15px; }
    .modal-stat { padding: 10px; border-radius: 12px; background: rgba(255,255,255,.045); border: 1px solid var(--line); }
    .modal-stat b { display: block; font-size: .95rem; }
    .modal-stat span { color: var(--muted); font-size: .63rem; text-transform: uppercase; letter-spacing: .08em; }
    .modal-actions { display: flex; gap: 8px; padding: 12px 18px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); justify-content: flex-end; }
    .modal-link { text-decoration: none; background: #0ea5e9; border-color: #38bdf8; }
    .close { background: rgba(255,255,255,.05); }
    @media (max-width: 880px) {
      .hero-row { align-items: flex-start; flex-direction: column; }
      .hero-actions { justify-content: flex-start; }
      .controls { grid-template-columns: 1fr 1fr; }
      .search-wrap { grid-column: 1 / -1; }
      .sections { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .hero { position: relative; }
      .shell { padding-top: 0; }
      .hero { margin-top: 0; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .controls { grid-template-columns: 1fr; }
      .search-wrap { grid-column: auto; }
      .rank-row { grid-template-columns: 28px 44px minmax(0,1fr) auto; gap: 8px; padding: 8px 10px; }
      .cover { width: 44px; height: 44px; }
      .score { min-width: 58px; }
      .modal-top { grid-template-columns: 92px 1fr; gap: 13px; }
      .modal-cover { width: 92px; }
      .modal-stats { grid-template-columns: repeat(2,minmax(0,1fr)); }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-row">
      <div>
        <div class="eyebrow">BGG Collection Analytics</div>
        <h1>My Board Game Top 10s</h1>
        <p class="subtitle">Every tie is broken by the higher BGG average rating, then alphabetically.</p>
      </div>
      <div class="hero-actions">
        <div id="status" class="status"><span class="dot"></span><span id="statusText">Connecting…</span></div>
        <button id="refreshBtn" class="btn" type="button">↻ Refresh</button>
      </div>
    </div>
  </header>

  <main class="shell">
    <section class="controls" aria-label="Filters">
      <label class="search-wrap">
        <span>⌕</span>
        <input id="searchInput" type="search" placeholder="Filter game names…" autocomplete="off" />
      </label>
      <select id="limitSelect" aria-label="Number of games per category">
        <option value="5">Top 5</option>
        <option value="10" selected>Top 10</option>
        <option value="15">Top 15</option>
        <option value="25">Top 25</option>
      </select>
      <label class="toggle"><input id="ownedOnly" type="checkbox" checked /> My owned games only</label>
    </section>

    <nav id="chips" class="chips" aria-label="Category groups"></nav>

    <section class="summary" aria-label="Collection summary">
      <article class="metric"><div class="metric-label">Games Loaded</div><div id="countMetric" class="metric-value">—</div></article>
      <article class="metric"><div class="metric-label">Avg Rating</div><div id="ratingMetric" class="metric-value">—</div></article>
      <article class="metric"><div class="metric-label">Avg Weight</div><div id="weightMetric" class="metric-value">—</div></article>
      <article class="metric"><div class="metric-label">Total Plays</div><div id="playsMetric" class="metric-value">—</div></article>
    </section>

    <section id="sections" class="sections">
      <div class="loading">Loading rankings from your BGG data vault…</div>
    </section>
  </main>

  <dialog id="gameDialog">
    <div id="modalContent"></div>
    <div class="modal-actions">
      <button class="btn close" type="button" onclick="document.getElementById('gameDialog').close()">Close</button>
      <a id="bggLink" class="btn modal-link" target="_blank" rel="noopener">Open on BGG ↗</a>
    </div>
  </dialog>

<script>
(() => {
  'use strict';

  const TABLE_NAME = 'bgg_collection';
  const FALLBACK_IMAGE = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="100%" height="100%" fill="#10233b"/><text x="50%" y="52%" fill="#8da2bb" font-family="Arial" font-size="54" text-anchor="middle">🎲</text></svg>'
  );

  const GROUPS = [
    { id: 'all', label: 'All Categories' },
    { id: 'time', label: 'Playtime' },
    { id: 'weight', label: 'Complexity' },
    { id: 'ratings', label: 'Ratings' },
    { id: 'popularity', label: 'Popularity' },
    { id: 'collection', label: 'My Collection' },
    { id: 'history', label: 'IDs & Years' }
  ];

  const CATEGORIES = [
    {
      id: 'shortest', group: 'time', icon: '⚡', title: 'Shortest Games',
      description: 'Lowest listed maximum playtime', field: 'maxplaytime', direction: 'asc',
      valid: g => n(g.maxplaytime) > 0, display: g => `${integer(g.maxplaytime)} min`, unit: 'Max time'
    },
    {
      id: 'longest', group: 'time', icon: '⌛', title: 'Longest Games',
      description: 'Highest listed maximum playtime', field: 'maxplaytime', direction: 'desc',
      valid: g => n(g.maxplaytime) > 0, display: g => `${integer(g.maxplaytime)} min`, unit: 'Max time'
    },
    {
      id: 'quickest-floor', group: 'time', icon: '🏁', title: 'Lowest Minimum Time',
      description: 'Lowest listed minimum playtime', field: 'minplaytime', direction: 'asc',
      valid: g => n(g.minplaytime) > 0, display: g => `${integer(g.minplaytime)} min`, unit: 'Min time'
    },
    {
      id: 'widest-time', group: 'time', icon: '↔', title: 'Widest Time Range',
      description: 'Largest difference between max and min time', value: g => n(g.maxplaytime) - n(g.minplaytime), direction: 'desc',
      valid: g => n(g.maxplaytime) > 0 && n(g.maxplaytime) >= n(g.minplaytime),
      display: g => `${integer(n(g.maxplaytime) - n(g.minplaytime))} min`, unit: 'Range'
    },
    {
      id: 'heaviest', group: 'weight', icon: '🏋️', title: 'Heaviest Games',
      description: 'Highest BGG complexity weight', field: 'avgweight', direction: 'desc',
      valid: g => n(g.avgweight) > 0, display: g => decimal(g.avgweight, 2), unit: 'Weight / 5'
    },
    {
      id: 'lightest', group: 'weight', icon: '🪶', title: 'Lightest Games',
      description: 'Lowest BGG complexity weight', field: 'avgweight', direction: 'asc',
      valid: g => n(g.avgweight) > 0, display: g => decimal(g.avgweight, 2), unit: 'Weight / 5'
    },
    {
      id: 'highest-user-rating', group: 'ratings', icon: '❤️', title: 'My Highest Rated',
      description: 'Your personal BGG rating', field: 'user_rating', direction: 'desc',
      valid: g => n(g.user_rating) > 0, display: g => decimal(g.user_rating, 1), unit: 'My rating'
    },
    {
      id: 'highest-bgg-rating', group: 'ratings', icon: '⭐', title: 'Highest BGG Average',
      description: 'Highest community average rating', field: 'bgg_rating', direction: 'desc',
      valid: g => n(g.bgg_rating) > 0, display: g => decimal(g.bgg_rating, 2), unit: 'Avg rating'
    },
    {
      id: 'highest-bayes', group: 'ratings', icon: '🏆', title: 'Highest Geek Rating',
      description: 'Highest Bayesian average', field: 'bayesaverage', direction: 'desc',
      valid: g => n(g.bayesaverage) > 0, display: g => decimal(g.bayesaverage, 2), unit: 'Geek rating'
    },
    {
      id: 'best-rank', group: 'ratings', icon: '🥇', title: 'Best Overall Rank',
      description: 'Lowest valid BGG board-game rank', field: 'primary_rank', direction: 'asc',
      valid: g => n(g.primary_rank) > 0, display: g => `#${integer(g.primary_rank)}`, unit: 'BGG rank'
    },
    {
      id: 'most-rated', group: 'popularity', icon: '🗳️', title: 'Most User Ratings',
      description: 'Most BGG ratings submitted', field: 'user_rated', direction: 'desc',
      valid: g => n(g.user_rated) > 0, display: g => compact(g.user_rated), unit: 'Ratings'
    },
    {
      id: 'most-owned', group: 'popularity', icon: '📦', title: 'Most Owned',
      description: 'Most BGG users reporting ownership', field: 'owned', direction: 'desc',
      valid: g => n(g.owned) > 0, display: g => compact(g.owned), unit: 'Owners'
    },
    {
      id: 'most-wanted', group: 'popularity', icon: '🔥', title: 'Most Wanted',
      description: 'Most BGG users marking “wanting”', field: 'wanting', direction: 'desc',
      valid: g => n(g.wanting) > 0, display: g => compact(g.wanting), unit: 'Wanting'
    },
    {
      id: 'most-wished', group: 'popularity', icon: '✨', title: 'Most Wished',
      description: 'Most BGG users with game on wishlist', field: 'wishing', direction: 'desc',
      valid: g => n(g.wishing) > 0, display: g => compact(g.wishing), unit: 'Wishing'
    },
    {
      id: 'most-traded', group: 'popularity', icon: '🔄', title: 'Most Available for Trade',
      description: 'Most BGG users listing it for trade', field: 'trading', direction: 'desc',
      valid: g => n(g.trading) > 0, display: g => compact(g.trading), unit: 'Trading'
    },
    {
      id: 'most-comments', group: 'popularity', icon: '💬', title: 'Most Discussed',
      description: 'Highest BGG comment count', field: 'numcomments', direction: 'desc',
      valid: g => n(g.numcomments) > 0, display: g => compact(g.numcomments), unit: 'Comments'
    },
    {
      id: 'most-played', group: 'collection', icon: '🎮', title: 'My Most Played',
      description: 'Highest logged play count in your collection', field: 'numplays', direction: 'desc',
      valid: g => n(g.numplays) > 0, display: g => compact(g.numplays), unit: 'My plays'
    },
    {
      id: 'unplayed', group: 'collection', icon: '🆕', title: 'Highest Rated Unplayed',
      description: 'No logged plays, ordered by BGG average', field: 'bgg_rating', direction: 'desc',
      valid: g => n(g.numplays) === 0 && n(g.bgg_rating) > 0, display: g => decimal(g.bgg_rating, 2), unit: 'Avg rating'
    },
    {
      id: 'want-to-play', group: 'collection', icon: '🎯', title: 'My Want-to-Play List',
      description: 'Collection entries marked want to play', field: 'bgg_rating', direction: 'desc',
      valid: g => truthy(g.wanttoplay), display: g => decimal(g.bgg_rating, 2), unit: 'Avg rating'
    },
    {
      id: 'wishlist', group: 'collection', icon: '📝', title: 'My Wishlist',
      description: 'Collection entries marked on your wishlist', field: 'bgg_rating', direction: 'desc',
      valid: g => truthy(g.wishlist), display: g => decimal(g.bgg_rating, 2), unit: 'Avg rating'
    },
    {
      id: 'largest-id', group: 'history', icon: '🔢', title: 'Largest BGG IDs',
      description: 'Highest BoardGameGeek object IDs', field: 'bgg_id', direction: 'desc',
      valid: g => n(g.bgg_id) > 0, display: g => integer(g.bgg_id), unit: 'BGG ID'
    },
    {
      id: 'smallest-id', group: 'history', icon: '#️⃣', title: 'Smallest BGG IDs',
      description: 'Lowest BoardGameGeek object IDs', field: 'bgg_id', direction: 'asc',
      valid: g => n(g.bgg_id) > 0, display: g => integer(g.bgg_id), unit: 'BGG ID'
    },
    {
      id: 'newest', group: 'history', icon: '🚀', title: 'Newest Published',
      description: 'Most recent publication year', field: 'year', direction: 'desc',
      valid: g => n(g.year) > 0, display: g => integer(g.year), unit: 'Year'
    },
    {
      id: 'oldest', group: 'history', icon: '🏛️', title: 'Oldest Published',
      description: 'Earliest publication year', field: 'year', direction: 'asc',
      valid: g => n(g.year) > 0, display: g => integer(g.year), unit: 'Year'
    },
    {
      id: 'widest-player-count', group: 'history', icon: '👥', title: 'Widest Player Range',
      description: 'Largest max-minus-min player range', value: g => n(g.maxplayers) - n(g.minplayers), direction: 'desc',
      valid: g => n(g.maxplayers) > 0 && n(g.maxplayers) >= n(g.minplayers),
      display: g => `${integer(g.minplayers)}–${integer(g.maxplayers)}`, unit: 'Players'
    }
  ];

  const state = { db: null, games: [], group: 'all', query: '', limit: 10, ownedOnly: true };

  const $ = id => document.getElementById(id);
  const n = value => Number.isFinite(Number(value)) ? Number(value) : 0;
  const truthy = value => value === true || value === 1 || value === '1';
  const integer = value => Math.round(n(value)).toLocaleString();
  const decimal = (value, places = 2) => n(value).toFixed(places);
  const compact = value => new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 1 }).format(n(value));
  const rating = game => n(game.bgg_rating);
  const safeText = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));

  function setStatus(text, kind = '') {
    $('statusText').textContent = text;
    $('status').className = `status ${kind}`.trim();
  }

  function renderChips() {
    $('chips').innerHTML = GROUPS.map(group =>
      `<button class="chip ${state.group === group.id ? 'active' : ''}" data-group="${group.id}" type="button">${group.label}</button>`
    ).join('');
    $('chips').querySelectorAll('[data-group]').forEach(button => {
      button.addEventListener('click', () => {
        state.group = button.dataset.group;
        renderChips();
        render();
      });
    });
  }

  function eligibleGames() {
    const q = state.query.toLowerCase().trim();
    return state.games.filter(game => {
      if (state.ownedOnly && !truthy(game.own)) return false;
      if (q && !String(game.name || '').toLowerCase().includes(q)) return false;
      return true;
    });
  }

  function categoryValue(category, game) {
    return category.value ? n(category.value(game)) : n(game[category.field]);
  }

  function rank(category, games) {
    return games
      .filter(game => category.valid ? category.valid(game) : true)
      .sort((a, b) => {
        const av = categoryValue(category, a);
        const bv = categoryValue(category, b);
        const primary = category.direction === 'asc' ? av - bv : bv - av;
        if (primary !== 0) return primary;
        const ratingTie = rating(b) - rating(a);
        if (ratingTie !== 0) return ratingTie;
        return String(a.name || '').localeCompare(String(b.name || ''));
      })
      .slice(0, state.limit);
  }

  function renderSummary(games) {
    const rated = games.filter(g => n(g.bgg_rating) > 0);
    const weighted = games.filter(g => n(g.avgweight) > 0);
    $('countMetric').textContent = games.length.toLocaleString();
    $('ratingMetric').textContent = rated.length ? decimal(rated.reduce((s,g) => s + n(g.bgg_rating), 0) / rated.length, 2) : '—';
    $('weightMetric').textContent = weighted.length ? decimal(weighted.reduce((s,g) => s + n(g.avgweight), 0) / weighted.length, 2) : '—';
    $('playsMetric').textContent = games.reduce((s,g) => s + n(g.numplays), 0).toLocaleString();
  }

  function renderRow(game, category, index) {
    const cover = safeText(game.thumb || game.image || FALLBACK_IMAGE);
    const title = safeText(game.name || 'Untitled');
    const year = n(game.year) > 0 ? integer(game.year) : 'Year unknown';
    const players = n(game.maxplayers) > 0 ? `${integer(game.minplayers)}–${integer(game.maxplayers)} players` : 'Players unknown';
    return `
      <li class="rank-row" data-id="${integer(game.bgg_id)}" tabindex="0" role="button" aria-label="View ${title}">
        <div class="rank-num">${index + 1}</div>
        <img class="cover" src="${cover}" alt="" loading="lazy" onerror="this.src='${FALLBACK_IMAGE}'" />
        <div class="game">
          <div class="game-name">${title}</div>
          <div class="game-meta">${year} · ${players} · Weight ${n(game.avgweight) ? decimal(game.avgweight,2) : '—'}</div>
        </div>
        <div class="score">
          <div class="score-main">${safeText(category.display(game))}</div>
          <div class="score-rating">BGG ${n(game.bgg_rating) ? decimal(game.bgg_rating,2) : '—'}</div>
        </div>
      </li>`;
  }

  function render() {
    const games = eligibleGames();
    renderSummary(games);
    const categories = CATEGORIES.filter(category => state.group === 'all' || category.group === state.group);
    const visible = categories.map(category => ({ category, games: rank(category, [...games]) })).filter(block => block.games.length);

    if (!visible.length) {
      $('sections').innerHTML = `<div class="empty">No games match the current filters or these categories lack usable values.</div>`;
      return;
    }

    $('sections').innerHTML = visible.map(({ category, games: ranked }) => `
      <article class="section" id="${category.id}">
        <header class="section-head">
          <div>
            <h2 class="section-title">${category.icon} ${category.title}</h2>
            <div class="section-desc">${category.description}</div>
          </div>
          <span class="unit-badge">${category.unit}</span>
        </header>
        <ol class="rank-list">${ranked.map((game, index) => renderRow(game, category, index)).join('')}</ol>
      </article>
    `).join('');

    $('sections').querySelectorAll('.rank-row').forEach(row => {
      const open = () => showGame(Number(row.dataset.id));
      row.addEventListener('click', open);
      row.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); open(); }
      });
    });
  }

  function showGame(id) {
    const game = state.games.find(g => n(g.bgg_id) === id);
    if (!game) return;
    const image = safeText(game.image || game.thumb || FALLBACK_IMAGE);
    const stat = (label, value) => `<div class="modal-stat"><b>${safeText(value)}</b><span>${label}</span></div>`;
    $('modalContent').innerHTML = `
      <div class="modal-top">
        <img class="modal-cover" src="${image}" alt="" onerror="this.src='${FALLBACK_IMAGE}'" />
        <div>
          <h2 class="modal-name">${safeText(game.name)}</h2>
          <div class="modal-id">BGG ID ${integer(game.bgg_id)} · ${n(game.year) ? integer(game.year) : 'Year unknown'}</div>
          <div class="modal-stats">
            ${stat('BGG average', n(game.bgg_rating) ? decimal(game.bgg_rating,2) : '—')}
            ${stat('My rating', n(game.user_rating) ? decimal(game.user_rating,1) : '—')}
            ${stat('Weight', n(game.avgweight) ? decimal(game.avgweight,2) : '—')}
            ${stat('Playtime', n(game.maxplaytime) ? `${integer(game.minplaytime)}–${integer(game.maxplaytime)} min` : '—')}
            ${stat('Players', n(game.maxplayers) ? `${integer(game.minplayers)}–${integer(game.maxplayers)}` : '—')}
            ${stat('My plays', integer(game.numplays))}
            ${stat('BGG owners', compact(game.owned))}
            ${stat('Wanting', compact(game.wanting))}
            ${stat('BGG rank', n(game.primary_rank) ? `#${integer(game.primary_rank)}` : '—')}
          </div>
        </div>
      </div>`;
    $('bggLink').href = `https://boardgamegeek.com/boardgame/${integer(game.bgg_id)}`;
    $('gameDialog').showModal();
  }

  async function load() {
    setStatus('Connecting…');
    $('sections').innerHTML = '<div class="loading">Loading rankings from your BGG data vault…</div>';
    try {
      if (!state.db) {
        const response = await fetch('/api/supabase-config', { cache: 'no-store' });
        if (!response.ok) throw new Error(`Config request failed (${response.status})`);
        const config = await response.json();
        if (!config.url || !config.anonKey) throw new Error('Supabase config is incomplete');
        state.db = supabase.createClient(config.url, config.anonKey);
      }

      const { data, error } = await state.db.from(TABLE_NAME).select('*');
      if (error) throw error;
      state.games = Array.isArray(data) ? data : [];
      setStatus(`${state.games.length.toLocaleString()} games loaded`, 'ready');
      render();
    } catch (error) {
      console.error(error);
      setStatus('Could not load data', 'error');
      $('sections').innerHTML = `<div class="empty"><strong>Unable to load the collection.</strong><br><br>${safeText(error.message)}<br><br>This page expects the existing <code>/api/supabase-config</code> endpoint and <code>bgg_collection</code> table.</div>`;
    }
  }

  $('searchInput').addEventListener('input', event => { state.query = event.target.value; render(); });
  $('limitSelect').addEventListener('change', event => { state.limit = Number(event.target.value) || 10; render(); });
  $('ownedOnly').addEventListener('change', event => { state.ownedOnly = event.target.checked; render(); });
  $('refreshBtn').addEventListener('click', load);
  $('gameDialog').addEventListener('click', event => {
    if (event.target === $('gameDialog')) $('gameDialog').close();
  });

  renderChips();
  load();
})();
</script>
</body>
</html>
