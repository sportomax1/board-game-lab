<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Day Number Games | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>📅</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        * { box-sizing: border-box; }
        html { height: 100%; }
        body {
            height: 100%;
            height: 100dvh;
            /* iOS Safari fallback */
            height: -webkit-fill-available;
            overflow: hidden; margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }

        /* Glass */
        .glass {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.09);
        }

        /* Form control */
        .ctrl {
            appearance: none; -webkit-appearance: none;
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 0.75rem;
            color: #f1f5f9;
            font-family: inherit; font-size: 0.875rem; font-weight: 600;
            padding: 0.6rem 1rem;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        .ctrl:focus { border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99,102,241,.2); }
        .ctrl::placeholder { color: #475569; }

        /* Tab nav */
        .tab-pill {
            flex-shrink: 0;
            padding: 0.45rem 0.9rem;
            border-radius: 999px;
            font-size: 11px; font-weight: 800;
            text-transform: uppercase; letter-spacing: .06em;
            color: #64748b;
            transition: all .2s ease;
            white-space: nowrap;
            cursor: pointer;
            border: none; background: transparent;
        }
        .tab-pill.active {
            background: rgba(99,102,241,.2);
            color: #818cf8;
        }

        /* Category cards */
        .cat-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 1.25rem;
            padding: 0.85rem;
            transition: border-color .2s, transform .2s;
            cursor: pointer;
        }
        .cat-card:hover { border-color: rgba(99,102,241,.4); transform: translateY(-1px); }
        .cat-card:active { transform: scale(.98); }

        /* Scrollable zone */
        .scroll-zone {
            flex: 1; overflow-y: auto; overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            /* safe area at bottom so last card isn't hidden on iPhone */
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
        }
        .scroll-zone::-webkit-scrollbar { width: 3px; }
        .scroll-zone::-webkit-scrollbar-track { background: transparent; }
        .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 10px; }

        /* Tab content */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Date stat pill */
        .dstat {
            display: flex; flex-direction: column; align-items: center;
            padding: 0.4rem 0.5rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 0.875rem;
            min-width: 0;
            flex: 1;
        }
        .dstat-val { font-size: clamp(1rem, 4vw, 1.4rem); font-weight: 900; color: #818cf8; line-height: 1; }
        .dstat-lbl { font-size: 7px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #475569; margin-top: 3px; text-align: center; white-space: nowrap; }
        .dstat-sub { font-size: 7.5px; color: #334155; font-weight: 600; margin-top: 1px; }

        /* Category label pill */
        .cat-badge {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 8.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em;
            padding: 3px 8px; border-radius: 999px;
            background: rgba(99,102,241,.15); color: #818cf8;
            border: 1px solid rgba(99,102,241,.2);
            margin-bottom: 0.6rem;
        }

        /* Buttons */
        .btn-indigo { background: linear-gradient(135deg,#6366f1,#4f46e5); box-shadow: 0 4px 14px rgba(99,102,241,.35); }

        /* Animations */
        @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
        .anim { animation: fadeUp .3s ease-out both; }
        @keyframes spin { to{transform:rotate(360deg)} }
        .spin { animation: spin .9s linear infinite; }

        /* Status toast */
        #status-bar {
            transition: opacity .3s;
        }
    </style>
</head>
<body>

<!-- Background glow -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
    <div class="absolute -top-24 -left-24 w-[45%] h-[45%] bg-indigo-900/25 blur-[130px] rounded-full"></div>
    <div class="absolute bottom-0 right-0 w-[55%] h-[45%] bg-violet-900/10 blur-[130px] rounded-full"></div>
</div>

<!-- App shell -->
<div class="relative z-10 flex flex-col" style="height:100dvh;height:-webkit-fill-available;">

    <!-- ── Header ── -->
    <header class="shrink-0 border-b border-white/5 bg-slate-900/60 backdrop-blur-md"
            style="padding-top: max(10px, env(safe-area-inset-top)); padding-left: max(1rem, env(safe-area-inset-left)); padding-right: max(1rem, env(safe-area-inset-right));">
        <div class="max-w-5xl mx-auto pb-2">
            <!-- Row 1: brand + status -->
            <div class="flex items-center gap-3 mb-2">
                <div class="w-8 h-8 bg-indigo-500/20 rounded-xl flex items-center justify-center border border-indigo-500/30 shrink-0">
                    <i data-lucide="calendar-days" class="w-4 h-4 text-indigo-400"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <h1 class="text-[16px] font-black italic uppercase tracking-tighter leading-none text-white truncate">Day <span class="text-indigo-400">Games</span></h1>
                    <p id="status-bar" class="text-[8px] font-bold text-slate-500 uppercase tracking-widest mt-0.5 truncate">Games from your collection based on today</p>
                </div>
            </div>
            <!-- Row 2: input + button (full width on mobile) -->
            <div class="flex items-center gap-2">
                <input type="text" id="usernameInput" value="sportomax" placeholder="BGG username"
                    class="ctrl flex-1 text-xs py-2"
                    onkeydown="if(event.key==='Enter')loadCollection()">
                <button id="loadBtn" onclick="loadCollection()"
                    class="btn-indigo text-white px-4 py-2 rounded-xl font-black text-[10px] uppercase tracking-widest flex items-center gap-1.5 whitespace-nowrap active:scale-95 transition-transform shrink-0">
                    <i data-lucide="refresh-cw" id="load-icon" class="w-3 h-3"></i>
                    Load
                </button>
            </div>
        </div>
    </header>

    <!-- ── Date stat row ── -->
    <div class="shrink-0 px-4 py-2 border-b border-white/5">
        <div class="max-w-5xl mx-auto flex gap-2" id="dateRow"></div>
    </div>

    <!-- ── Tab nav ── -->
    <div class="shrink-0 px-4 py-1.5 border-b border-white/5 overflow-x-auto" style="-webkit-overflow-scrolling:touch;">
        <div class="max-w-5xl mx-auto flex gap-1" id="tabNav"></div>
    </div>

    <!-- ── Tab content (scrollable) ── -->
    <div class="flex-1 min-h-0 scroll-zone">
        <div class="max-w-5xl mx-auto px-4 py-3" id="tabContents"></div>
    </div>

</div><!-- /app shell -->

<!-- Toast -->
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 opacity-0 pointer-events-none transition-opacity duration-300 whitespace-nowrap">
    <div class="bg-slate-800 border border-white/10 text-white px-5 py-2.5 rounded-full shadow-2xl flex items-center gap-2">
        <span id="toast-msg" class="text-[10px] font-black uppercase tracking-widest"></span>
    </div>
</div>

<script>
lucide.createIcons();
let allGames = [];

// ── Date helpers ─────────────────────────────────────────────────────────
function getDateInfo() {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const dayOfYear = Math.floor((now - start) / 86400000);
    const dayOfMonth = now.getDate();
    const dayOfWeek = now.getDay() === 0 ? 7 : now.getDay();
    const monthOfYear = now.getMonth() + 1;
    const dayNames   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    return { dayOfYear, dayOfMonth, dayOfWeek, monthOfYear,
             dayName: dayNames[now.getDay()], monthName: monthNames[now.getMonth()] };
}

function renderDateRow() {
    const info = getDateInfo();
    document.getElementById('dateRow').innerHTML = `
        <div class="dstat"><span class="dstat-val">${info.dayOfYear}</span><span class="dstat-lbl">Day of Year</span></div>
        <div class="dstat"><span class="dstat-val">${info.dayOfMonth}</span><span class="dstat-lbl">Day of Month</span></div>
        <div class="dstat"><span class="dstat-val">${info.dayOfWeek}</span><span class="dstat-lbl">Day of Week</span><span class="dstat-sub">${info.dayName.slice(0,3)}</span></div>
        <div class="dstat"><span class="dstat-val">${info.monthOfYear}</span><span class="dstat-lbl">Month</span><span class="dstat-sub">${info.monthName.slice(0,3)}</span></div>
    `;
}

// ── API ──────────────────────────────────────────────────────────────────
async function fetchWithRetry(url, maxRetries = 5) {
    for (let i = 0; i < maxRetries; i++) {
        try {
            const res = await fetch(url);
            if (res.status === 202 || res.status === 429 || res.status === 502) {
                await new Promise(r => setTimeout(r, 3000 * (i + 1)));
                continue;
            }
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res;
        } catch (err) {
            if (i === maxRetries - 1) throw err;
            await new Promise(r => setTimeout(r, 2000 * (i + 1)));
        }
    }
}

// ── Load ─────────────────────────────────────────────────────────────────
async function loadCollection() {
    const username = document.getElementById('usernameInput').value.trim();
    if (!username) return showToast('Enter a username first');

    allGames = [];
    setStatus('Loading collection…');
    setLoading(true);

    try {
        const res = await fetchWithRetry(
            `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&stats=1&own=1`
        );
        const xml = new DOMParser().parseFromString(await res.text(), 'text/xml');
        if (xml.querySelector('errors error')) throw new Error('Collection not found');

        const items = Array.from(xml.querySelectorAll('item'));
        setStatus(`Processing ${items.length} games…`);

        items.forEach(item => {
            const rating = item.querySelector('stats rating');
            const myRating = parseFloat(rating?.getAttribute('value') || 0);
            const average  = parseFloat(rating?.querySelector('average')?.getAttribute('value') || 0);
            const rankEl   = rating?.querySelector('rank[name="boardgame"]');
            const rankRaw  = rankEl?.getAttribute('value') || 'Not Ranked';
            allGames.push({
                id:          item.getAttribute('objectid'),
                name:        item.querySelector('name')?.textContent || 'Unknown',
                thumbnail:   item.querySelector('thumbnail')?.textContent || '',
                image:       item.querySelector('image')?.textContent || '',
                yearPublished: parseInt(item.querySelector('yearpublished')?.textContent) || 0,
                playingTime: parseInt(item.querySelector('stats')?.getAttribute('playingtime') || 0),
                myRating, average,
                rank:        rankRaw === 'Not Ranked' ? Infinity : parseInt(rankRaw),
                rankDisplay: rankRaw
            });
        });

        setStatus(`${allGames.length} games · ${document.getElementById('usernameInput').value.trim()}`);
        renderResults();
    } catch (err) {
        setStatus('Error: ' + err.message);
        showToast(err.message);
    } finally {
        setLoading(false);
    }
}

function setLoading(on) {
    const icon = document.getElementById('load-icon');
    icon.setAttribute('data-lucide', on ? 'loader-2' : 'refresh-cw');
    if (on) icon.classList.add('spin'); else icon.classList.remove('spin');
    lucide.createIcons();
    document.getElementById('loadBtn').disabled = on;
}

function setStatus(msg) {
    document.getElementById('status-bar').textContent = msg;
}

// ── Game selection ────────────────────────────────────────────────────────
function getGame(category, position, dateType) {
    if (!allGames.length) return null;
    let pool = [...allGames];
    switch (category) {
        case 'alpha':
            if (dateType === 'dayOfYear') {
                const letter = String.fromCharCode(64 + ((position - 1) % 26 + 1));
                let sub = pool.filter(g => g.name.toUpperCase().startsWith(letter));
                if (!sub.length) {
                    for (let i = 1; i <= 26; i++) {
                        const l2 = String.fromCharCode(64 + ((position - 1 + i) % 26 + 1));
                        sub = pool.filter(g => g.name.toUpperCase().startsWith(l2));
                        if (sub.length) break;
                    }
                }
                if (!sub.length) sub = pool;
                return sub[Math.floor(Math.random() * sub.length)];
            }
            pool.sort((a, b) => a.name.localeCompare(b.name));
            return pool[(position - 1) % pool.length];
        case 'rank':
            pool.sort((a, b) => a.rank - b.rank);
            return pool[(position - 1) % pool.length];
        case 'rating':
            pool = pool.filter(g => g.myRating > 0);
            if (!pool.length) return null;
            pool.sort((a, b) => b.myRating - a.myRating);
            return pool[(position - 1) % pool.length];
        case 'average':
            pool.sort((a, b) => b.average - a.average);
            return pool[(position - 1) % pool.length];
        case 'playtime':
            pool = pool.filter(g => g.playingTime > 0);
            if (!pool.length) return null;
            pool.sort((a, b) => b.playingTime - a.playingTime);
            return pool[(position - 1) % pool.length];
        default: return null;
    }
}

// ── Render ────────────────────────────────────────────────────────────────
const DATE_TYPES = [
    { key: 'dayOfYear',   label: 'Day of Year',   icon: 'calendar-days' },
    { key: 'dayOfMonth',  label: 'Day of Month',  icon: 'calendar' },
    { key: 'dayOfWeek',   label: 'Day of Week',   icon: 'calendar-check' },
    { key: 'monthOfYear', label: 'Month',         icon: 'layers' }
];

const CATEGORIES = [
    { key: 'alpha',    label: 'Alphabetical', icon: 'a-large-small',  color: '#818cf8' },
    { key: 'rank',     label: 'BGG Rank',     icon: 'trophy',         color: '#f59e0b' },
    { key: 'rating',   label: 'Your Rating',  icon: 'hand',           color: '#34d399' },
    { key: 'average',  label: 'BGG Average',  icon: 'star',           color: '#60a5fa' },
    { key: 'playtime', label: 'Play Time',    icon: 'timer',          color: '#f87171' }
];

function renderResults() {
    const info = getDateInfo();
    const nav  = document.getElementById('tabNav');
    const body = document.getElementById('tabContents');

    nav.innerHTML = DATE_TYPES.map((dt, i) => `
        <button class="tab-pill${i === 0 ? ' active' : ''}" data-tab="${dt.key}">
            ${dt.label} · <span class="opacity-70">${info[dt.key]}</span>
        </button>
    `).join('');

    body.innerHTML = DATE_TYPES.map((dt, i) => {
        const cardsHtml = CATEGORIES.map(cat => {
            const game = getGame(cat.key, info[dt.key], dt.key);
            if (!game) return `
                <div class="cat-card opacity-40 cursor-default">
                    <div class="cat-badge">${cat.label}</div>
                    <p class="text-[10px] text-slate-600 font-bold uppercase tracking-widest mt-1">No games available</p>
                </div>`;

            let detail = '';
            switch (cat.key) {
                case 'alpha':    detail = dt.key === 'dayOfYear'
                    ? `Letter ${String.fromCharCode(64 + ((info[dt.key]-1)%26+1))} · ${game.yearPublished || '—'}`
                    : `Position #${info[dt.key]} · ${game.yearPublished || '—'}`;    break;
                case 'rank':     detail = `BGG Rank ${game.rankDisplay} · Avg ${game.average.toFixed(1)}`;  break;
                case 'rating':   detail = `Your ${game.myRating}/10 · BGG ${game.average.toFixed(1)}`;      break;
                case 'average':  detail = `BGG Avg ${game.average.toFixed(1)} · Rank ${game.rankDisplay}`;  break;
                case 'playtime': detail = `${game.playingTime} min · Avg ${game.average.toFixed(1)}`;       break;
            }

            const thumb = game.thumbnail || game.image || '';
            const fallback = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 56'%3E%3Crect fill='%231e293b' width='56' height='56'/%3E%3C/svg%3E";

            return `
                <div class="cat-card anim" onclick="window.open('https://boardgamegeek.com/boardgame/${game.id}','_blank')">
                    <div class="cat-badge">${cat.label}</div>
                    <div class="flex items-center gap-3">
                        <div class="shrink-0 w-14 h-14 rounded-xl overflow-hidden bg-slate-800 border border-white/5">
                            <img src="${thumb}" alt="${escHtml(game.name)}" class="w-full h-full object-cover"
                                onerror="this.src='${fallback}'">
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="text-[13px] font-black text-white leading-tight line-clamp-2 italic uppercase tracking-tight">${escHtml(game.name)}</div>
                            <div class="text-[9px] text-slate-500 uppercase tracking-widest font-bold mt-1">${detail}</div>
                        </div>
                        <div class="shrink-0 text-slate-700">
                            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                        </div>
                    </div>
                </div>`;
        }).join('');

        return `<div class="tab-content${i === 0 ? ' active' : ''}" id="content-${dt.key}">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5 pb-2">${cardsHtml}</div>
        </div>`;
    }).join('');

    // Tab click
    document.querySelectorAll('.tab-pill').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-pill').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('content-' + btn.dataset.tab).classList.add('active');
        });
    });
}

// ── Toast ─────────────────────────────────────────────────────────────────
function showToast(msg) {
    const el = document.getElementById('toast');
    document.getElementById('toast-msg').textContent = msg;
    el.style.opacity = '1';
    clearTimeout(el._t);
    el._t = setTimeout(() => el.style.opacity = '0', 2600);
}

function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Init ──────────────────────────────────────────────────────────────────
renderDateRow();
renderResults(); // renders empty state first
</script>
<script type="module" src="analytics-init.js"></script>
</body>
</html>
