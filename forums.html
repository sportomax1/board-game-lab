<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Game Forums</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>💬</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            height: 100%;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            max-width: none;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            padding-top: env(safe-area-inset-top, 0);
            padding-bottom: env(safe-area-inset-bottom, 0);
            padding-left: env(safe-area-inset-left, 0);
            padding-right: env(safe-area-inset-right, 0);
        }

        .header {
            flex-shrink: 0;
            padding: 1rem;
            border-bottom: 1px solid #eee;
            background: white;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            color: #333;
        }

        .setup-section {
            flex-shrink: 0;
            padding: 1rem;
            background: white;
            border-bottom: 1px solid #eee;
            max-height: 50vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .setup-input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            -webkit-appearance: none;
            appearance: none;
        }

        .setup-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn {
            padding: 0.75rem 1rem;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            font-size: 1rem;
            min-width: 50px;
        }

        .btn:active {
            opacity: 0.9;
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #333;
        }

        .btn-secondary:active {
            background: #d1d5db;
        }

        .metrics-bar {
            padding: 0.75rem 1rem;
            background: #f0f9ff;
            border-bottom: 1px solid #bfdbfe;
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            flex-wrap: wrap;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .metric-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
            padding: 0.5rem 0.75rem;
            background: white;
            border-radius: 6px;
            border: 1px solid #dbeafe;
        }

        .metric-label {
            font-weight: 600;
            color: #1e40af;
            font-size: 0.8rem;
        }

        .metric-value {
            font-weight: 700;
            color: #333;
            font-size: 0.95rem;
        }

        .progress-bar {
            flex: 1;
            min-width: 150px;
            height: 20px;
            background: white;
            border: 1px solid #dbeafe;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: 700;
            color: white;
        }

        .filter-section {
            margin-bottom: 0.75rem;
        }

        .filter-title {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            color: #333;
        }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .filter-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            flex: 0 1 calc(50% - 0.25rem);
        }

        .filter-checkbox:active {
            background: #e0e0e0;
        }

        .filter-checkbox input {
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #ddd;
            border-radius: 4px;
            background: white;
            margin: 0;
        }

        .filter-checkbox input:checked {
            background: #6366f1;
            border-color: #6366f1;
        }

        .status {
            font-size: 0.85rem;
            color: #666;
            padding: 0.5rem;
            background: #f9f9f9;
            border-radius: 4px;
            text-align: center;
        }

        .status.active {
            color: #6366f1;
            font-weight: 600;
        }

        .cache-info {
            font-size: 0.75rem;
            color: #999;
            margin-top: 0.5rem;
            padding: 0.5rem;
            background: #f9f9f9;
            border-radius: 4px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .search-bar {
            flex-shrink: 0;
            padding: 0.75rem 1rem;
            background: white;
            border-bottom: 1px solid #eee;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            -webkit-appearance: none;
            appearance: none;
        }

        .search-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .sort-controls {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .sort-btn {
            padding: 0.5rem 0.75rem;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-appearance: none;
            appearance: none;
        }

        .sort-btn:active, .sort-btn.active {
            background: #6366f1;
            color: white;
            border-color: #6366f1;
        }

        .games-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-height: 400px;
        }

        .game-card {
            background: white;
            border: 1px solid #eee;
            border-radius: 6px;
            padding: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .game-card:active {
            background: #e7f3ff;
            border-color: #6366f1;
            transform: scale(0.98);
        }

        .game-card-main {
            display: contents;
        }

        .game-thumbnail {
            width: 50px;
            height: 50px;
            flex-shrink: 0;
            background: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        .game-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-info {
            flex: 1;
            min-width: 0;
        }

        .game-header {
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
            margin: 0;
            word-break: break-word;
            display: -webkit-box;
            line-clamp: 1;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .game-count {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 0.5rem;
        }

        .no-data {
            text-align: center;
            padding: 2rem 1rem;
            color: #999;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-overlay.hidden {
            display: none;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 430px;
            width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid #eee;
            font-size: 1.3rem;
            font-weight: 700;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #999;
            cursor: pointer;
            padding: 0;
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .modal-close:active {
            background: #f0f0f0;
            color: #333;
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 1rem;
        }

        .modal-footer {
            padding: 1rem;
            border-top: 1px solid #eee;
            display: flex;
            gap: 0.5rem;
            background: #f9f9f9;
        }

        .modal-footer button {
            flex: 1;
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 Game Forums</h1>
        </div>

        <div class="main-content">
            <div class="metrics-bar" id="metricsBar">
                <div class="metric-item">
                    <span class="metric-label">📊 Progress:</span>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width: 0%;">0%</div>
                    </div>
                </div>
                <div class="metric-item">
                    <span class="metric-label">🎮 Loaded:</span>
                    <span class="metric-value" id="gamesLoadedMetric">0</span>
                </div>
                <div class="metric-item">
                    <span class="metric-label">📡 API Calls:</span>
                    <span class="metric-value" id="apiCallsMetric">0</span>
                </div>
                <div class="metric-item">
                    <span class="metric-label">⏱️ Elapsed:</span>
                    <span class="metric-value" id="elapsedMetric">0s</span>
                </div>
                <div class="metric-item">
                    <span class="metric-label">🔄 Status:</span>
                    <span class="metric-value" id="statusMetric">Ready</span>
                </div>
            </div>

            <div class="search-bar">
                <input type="text" id="searchInput" class="search-input" placeholder="Search games...">
                <div class="sort-controls">
                    <button class="sort-btn" id="sortNameAsc" title="Sort by name (A-Z)">A→Z Name</button>
                    <button class="sort-btn" id="sortNameDesc" title="Sort by name (Z-A)">Z→A Name</button>
                    <button class="sort-btn" id="sortCountAsc" title="Sort by thread count (low to high)">⬆️ Threads</button>
                    <button class="sort-btn" id="sortCountDesc" title="Sort by thread count (high to low)">⬇️ Threads</button>
                </div>
            </div>

            <div class="games-list" id="gamesList"></div>
        </div>

        <!-- Settings Modal -->
        <div class="modal-overlay" id="settingsModal">
            <div class="modal-content">
                <div class="modal-header">
                    ⚙️ Settings
                    <button class="modal-close" id="modalCloseBtn">✕</button>
                </div>
                <div class="modal-body">
                    <div style="margin-bottom: 1rem;">
                        <div class="filter-title">👤 Username</div>
                        <input type="text" id="usernameInput" class="setup-input" placeholder="Enter BGG username" value="sportomax">
                    </div>

                    <div class="filter-section">
                        <div class="filter-title">📦 Collection Status</div>
                        <div class="filter-group">
                            <label class="filter-checkbox">
                                <input type="checkbox" name="status" value="own" checked>
                                Own
                            </label>
                            <label class="filter-checkbox">
                                <input type="checkbox" name="status" value="wanttoplay">
                                Want to Play
                            </label>
                            <label class="filter-checkbox">
                                <input type="checkbox" name="status" value="wanttobuy">
                                Want to Buy
                            </label>
                            <label class="filter-checkbox">
                                <input type="checkbox" name="status" value="prevowned">
                                Prev. Owned
                            </label>
                        </div>
                    </div>

                    <div class="status" id="processingStatus" style="margin-top: 1rem;"></div>
                    <div class="cache-info" id="cacheInfo"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn" id="loadBtn">📦 Load</button>
                    <button class="btn btn-secondary" id="clearBtn">🗑️ Clear</button>
                </div>
            </div>
        </div>

        <div class="modal-overlay hidden" id="detailsModal">
            <div class="modal-content">
                <div class="modal-header" id="detailsHeader"></div>
                <div class="modal-body" id="detailsBody"></div>
                <div class="modal-footer">
                    <button class="btn" onclick="closeDetailsModal()">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY_COLLECTION = 'bgg_forums_collection';
        const STORAGE_KEY_TIMESTAMP = 'bgg_forums_timestamp';

        let allGames = [];
        let gameForums = {};
        let currentUsername = 'sportomax';
        let originalSettingsHTML = null;
        let totalApiCalls = 0;
        let startTime = null;
        let currentSort = 'nameAsc';

        const usernameInput = document.getElementById('usernameInput');
        const loadBtn = document.getElementById('loadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        const processingStatus = document.getElementById('processingStatus');
        const cacheInfo = document.getElementById('cacheInfo');
        const gamesList = document.getElementById('gamesList');
        const searchInput = document.getElementById('searchInput');
        const settingsModal = document.getElementById('settingsModal');
        const progressFill = document.getElementById('progressFill');
        const gamesLoadedMetric = document.getElementById('gamesLoadedMetric');
        const apiCallsMetric = document.getElementById('apiCallsMetric');
        const elapsedMetric = document.getElementById('elapsedMetric');
        const statusMetric = document.getElementById('statusMetric');

        // Show modal on load
        function showModal() {
            if (!originalSettingsHTML) {
                originalSettingsHTML = document.querySelector('.modal-body').innerHTML;
            }
            settingsModal.classList.remove('hidden');
        }

        // Update metrics display
        function updateMetrics() {
            if (startTime) {
                const elapsed = Math.round((Date.now() - startTime) / 1000);
                elapsedMetric.textContent = elapsed + 's';
            }
            gamesLoadedMetric.textContent = Object.keys(gameForums).length;
            apiCallsMetric.textContent = totalApiCalls;
        }

        // Update progress bar
        function updateProgress(current, total) {
            if (total === 0) return;
            const percent = Math.round((current / total) * 100);
            progressFill.style.width = percent + '%';
            progressFill.textContent = percent + '%';
        }

        // Hide modal
        function hideModal() {
            settingsModal.classList.add('hidden');
        }

        // Load button
        loadBtn.addEventListener('click', () => {
            hideModal();
            loadCollection();
        });

        // Close modal button
        modalCloseBtn.addEventListener('click', hideModal);

        // Sort buttons
        document.getElementById('sortNameAsc').addEventListener('click', () => {
            currentSort = 'nameAsc';
            updateSortButtons();
            renderGames();
        });
        document.getElementById('sortNameDesc').addEventListener('click', () => {
            currentSort = 'nameDesc';
            updateSortButtons();
            renderGames();
        });
        document.getElementById('sortCountAsc').addEventListener('click', () => {
            currentSort = 'countAsc';
            updateSortButtons();
            renderGames();
        });
        document.getElementById('sortCountDesc').addEventListener('click', () => {
            currentSort = 'countDesc';
            updateSortButtons();
            renderGames();
        });

        function updateSortButtons() {
            document.querySelectorAll('.sort-btn').forEach(btn => btn.classList.remove('active'));
            if (currentSort === 'nameAsc') document.getElementById('sortNameAsc').classList.add('active');
            if (currentSort === 'nameDesc') document.getElementById('sortNameDesc').classList.add('active');
            if (currentSort === 'countAsc') document.getElementById('sortCountAsc').classList.add('active');
            if (currentSort === 'countDesc') document.getElementById('sortCountDesc').classList.add('active');
        }

        // Clear cache
        clearBtn.addEventListener('click', () => {
            localStorage.removeItem(STORAGE_KEY_COLLECTION);
            localStorage.removeItem(STORAGE_KEY_TIMESTAMP);
            processingStatus.textContent = '✅ Cache cleared';
            processingStatus.classList.add('active');
            allGames = [];
            gameForums = {};
            gamesList.innerHTML = '';
            cacheInfo.textContent = '';
            setTimeout(() => { processingStatus.classList.remove('active'); }, 2000);
        });

        // Search
        searchInput.addEventListener('input', renderGames);

        // Helper functions
        async function fetchWithRetry(url, maxRetries = 3) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    totalApiCalls++;
                    updateMetrics();
                    console.log(`📡 [API Call ${i + 1}] GET ${url}`);
                    const response = await fetch(url);
                    if (response.status === 202) {
                        console.log(`⏳ [API] Status 202 - retrying after ${2000 * (i + 1)}ms`);
                        await new Promise(resolve => setTimeout(resolve, 2000 * (i + 1)));
                        continue;
                    }
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    console.log(`✅ [API] Response received`);
                    return response;
                } catch (error) {
                    console.error(`❌ [API] Error on attempt ${i + 1}:`, error.message);
                    if (i === maxRetries - 1) throw error;
                    await new Promise(resolve => setTimeout(resolve, 1000 * (i + 1)));
                }
            }
        }

        // Get selected statuses
        function getSelectedStatuses() {
            const checkboxes = document.querySelectorAll('input[name="status"]:checked');
            return Array.from(checkboxes).map(cb => cb.value);
        }

        // Load collection
        async function loadCollection() {
            const username = usernameInput.value.trim();
            if (!username) {
                processingStatus.textContent = '❌ Please enter a username';
                processingStatus.classList.add('active');
                return;
            }

            const statuses = getSelectedStatuses();
            if (statuses.length === 0) {
                processingStatus.textContent = '❌ Select at least one status';
                processingStatus.classList.add('active');
                return;
            }

            // Reset metrics
            startTime = Date.now();
            totalApiCalls = 0;
            statusMetric.textContent = 'Loading...';
            updateMetrics();
            updateProgress(0, 100);

            currentUsername = username;
            localStorage.setItem('bgg_forums_username', username);

            processingStatus.classList.add('active');
            processingStatus.textContent = '📦 Loading collection...';
            console.log('🔍 Fetching collection for:', username);

            try {
                // Check cache
                const cached = localStorage.getItem(STORAGE_KEY_COLLECTION);
                if (cached) {
                    allGames = JSON.parse(cached);
                    processingStatus.textContent = `✅ Loaded ${allGames.length} games from cache. Fetching forum data...`;
                    console.log('✅ Loaded collection from cache:', allGames.length, 'games');
                    updateCacheInfo();
                    // Still fetch forum data fresh
                    await processGameBatches();
                    hideModal();
                } else {
                    // Fetch collection
                    const statusParams = statuses.map(s => `&${s}=1`).join('');
                    const url = `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}${statusParams}&stats=1`;
                    console.log('🔗 API URL:', url);
                    
                    const response = await fetchWithRetry(url);
                    const xml = new DOMParser().parseFromString(await response.text(), 'text/xml');
                    const items = xml.querySelectorAll('item');

                    allGames = Array.from(items).map(item => ({
                        id: item.getAttribute('objectid'),
                        name: item.querySelector('name')?.textContent || 'Unknown',
                        image: item.querySelector('image')?.textContent || ''
                    })).filter(g => g.id);

                    console.log('📦 Collection fetched:', allGames.length, 'games');
                    localStorage.setItem(STORAGE_KEY_COLLECTION, JSON.stringify(allGames));
                    processingStatus.textContent = `✅ Loaded ${allGames.length} games`;
                    updateCacheInfo();

                    // Process games in batches
                    await processGameBatches();
                    hideModal();
                }

            } catch (error) {
                processingStatus.textContent = `❌ Error: ${error.message}`;
                console.error('❌ Error:', error);
            }
        }

        // Process games in batches with parallel processing (100x faster like weight.html)
        async function processGameBatches() {
            const batchSize = 20;
            const parallelBatches = 100; // Process 100 batches in parallel for faster loading
            let processed = 0;
            gameForums = {};

            // Create batches
            const batches = [];
            for (let i = 0; i < allGames.length; i += batchSize) {
                batches.push(allGames.slice(i, i + batchSize));
            }

            // Process batches in parallel groups
            for (let i = 0; i < batches.length; i += parallelBatches) {
                const batchGroup = batches.slice(i, i + parallelBatches);
                processingStatus.textContent = `💬 Fetching forums ${Math.min(i + parallelBatches, batches.length)}/${batches.length}...`;
                console.log(`\n🔄 Parallel group ${Math.floor(i / parallelBatches) + 1}/${Math.ceil(batches.length / parallelBatches)}: Processing ${batchGroup.length} batches in parallel`);

                await Promise.all(batchGroup.map(async (batch, batchIndex) => {
                    // Fetch forums for each game in the batch in parallel
                    await Promise.all(batch.map(async (game) => {
                        try {
                            const url = `/api/bgg-helper?endpoint=forumlist&type=thing&id=${game.id}`;
                            const response = await fetchWithRetry(url);
                            const xml = new DOMParser().parseFromString(await response.text(), 'text/xml');
                            const forums = Array.from(xml.querySelectorAll('forum')).map(f => ({
                                id: f.getAttribute('id'),
                                title: f.getAttribute('title'),
                                numthreads: parseInt(f.getAttribute('numthreads') || 0),
                                numposts: parseInt(f.getAttribute('numposts') || 0),
                                lastpostdate: f.getAttribute('lastpostdate'),
                                description: f.getAttribute('description') || ''
                            }));
                            
                            if (forums.length > 0) {
                                gameForums[game.id] = {
                                    name: game.name,
                                    image: game.image,
                                    forums: forums,
                                    totalThreads: forums.reduce((sum, f) => sum + f.numthreads, 0),
                                    totalPosts: forums.reduce((sum, f) => sum + f.numposts, 0)
                                };
                                console.log(`  ✅ Found ${forums.length} forums for ${game.name} (${gameForums[game.id].totalThreads} threads)`);
                            }
                        } catch (e) {
                            console.error(`  ⚠️ Error fetching forums for ${game.name}:`, e.message);
                        }
                    }));
                }));

                processed += batchGroup.reduce((sum, batch) => sum + batch.length, 0);
                updateProgress(processed, allGames.length);
                statusMetric.textContent = `Batch ${Math.min(i + parallelBatches, batches.length)}/${batches.length}`;
                updateMetrics();
                renderGames();

                // Throttle between parallel groups
                await new Promise(resolve => setTimeout(resolve, 500));
            }

            // Now fetch thread details in batches
            await fetchThreadDetailsBatches();

            localStorage.setItem(STORAGE_KEY_TIMESTAMP, new Date().toISOString());

            const resultText = `✅ Done! Found forums for ${Object.keys(gameForums).length} games`;
            processingStatus.textContent = resultText;
            statusMetric.textContent = 'Complete';
            updateProgress(100, 100);
            updateMetrics();
            console.log(resultText);
            hideModal();
            setTimeout(() => { processingStatus.classList.remove('active'); }, 3000);
            renderGames();
        }

        // Fetch thread details in batches of 20
        async function fetchThreadDetailsBatches() {
            const threadsToFetch = [];

            // Collect all thread IDs to fetch
            Object.entries(gameForums).forEach(([gameId, game]) => {
                game.forums.forEach(forum => {
                    if (forum.numthreads > 0) {
                        threadsToFetch.push({
                            gameId: gameId,
                            forumId: forum.id,
                            forumTitle: forum.title
                        });
                    }
                });
            });

            if (threadsToFetch.length === 0) {
                console.log('No threads to fetch');
                return;
            }

            console.log(`\n📋 Fetching thread details for ${threadsToFetch.length} threads...`);
            processingStatus.textContent = `📋 Fetching thread details...`;

            const threadBatchSize = 20;
            let threadsFetched = 0;

            for (let i = 0; i < threadsToFetch.length; i += threadBatchSize) {
                const threadBatch = threadsToFetch.slice(i, i + threadBatchSize);
                const threadIds = threadBatch.map(t => t.forumId).join(',');

                try {
                    console.log(`\n🔄 Thread Batch ${Math.ceil((i + 1) / threadBatchSize)}/${Math.ceil(threadsToFetch.length / threadBatchSize)}: Fetching ${threadBatch.length} thread forums`);
                    
                    const url = `/api/bgg-helper?endpoint=thread&id=${threadIds}`;
                    const response = await fetchWithRetry(url);
                    const xml = new DOMParser().parseFromString(await response.text(), 'text/xml');
                    const threads = xml.querySelectorAll('thread');

                    Array.from(threads).forEach(thread => {
                        const threadId = thread.getAttribute('id');
                        const threadTitle = thread.querySelector('subject')?.textContent || 'Untitled';
                        const authorName = thread.querySelector('author')?.textContent || 'Unknown';
                        const postDate = thread.getAttribute('postdate');
                        const numarticles = parseInt(thread.getAttribute('numarticles') || 0);

                        // Find which forum this belongs to
                        const threadInfo = threadBatch.find(t => t.forumId === threadId);
                        if (threadInfo && gameForums[threadInfo.gameId]) {
                            const forum = gameForums[threadInfo.gameId].forums.find(f => f.id === threadId);
                            if (forum) {
                                forum.recentThreads = forum.recentThreads || [];
                                forum.recentThreads.push({
                                    id: threadId,
                                    title: threadTitle,
                                    author: authorName,
                                    postdate: postDate,
                                    articles: numarticles
                                });
                            }
                        }
                    });

                    threadsFetched += threadBatch.length;
                    console.log(`📊 Thread batch processed: ${threadsFetched}/${threadsToFetch.length}`);

                } catch (error) {
                    console.error(`❌ Error fetching thread batch:`, error);
                }

                await new Promise(resolve => setTimeout(resolve, 300));
            }

            console.log(`✅ Thread details complete`);
        }

        // Render games
        function renderGames() {
            const searchTerm = searchInput.value.toLowerCase();
            
            // If no games loaded yet, show loading state
            if (Object.keys(gameForums).length === 0 && allGames.length > 0) {
                gamesList.innerHTML = '<div class="no-data">📦 Loading forum data...</div>';
                return;
            }

            const games = Object.entries(gameForums)
                .filter(([gameId, game]) => {
                    if (!game.name.toLowerCase().includes(searchTerm)) return false;
                    return true;
                })
                .sort((a, b) => {
                    const countA = a[1].totalThreads;
                    const countB = b[1].totalThreads;
                    
                    if (currentSort === 'nameAsc') return a[1].name.localeCompare(b[1].name);
                    if (currentSort === 'nameDesc') return b[1].name.localeCompare(a[1].name);
                    if (currentSort === 'countAsc') return countA - countB;
                    if (currentSort === 'countDesc') return countB - countA;
                    return 0;
                });

            if (games.length === 0) {
                gamesList.innerHTML = '<div class="no-data">No games found</div>';
                return;
            }

            gamesList.innerHTML = games.map(([gameId, game]) => {
                return `
                    <div class="game-card" data-game-id="${gameId}">
                        <div class="game-card-main">
                            <div class="game-thumbnail">
                                ${game.image ? `<img src="/api/image-proxy?url=${encodeURIComponent(game.image)}" alt="" onerror="this.style.display='none';">` : '<div style="width: 100%; height: 100%; background: #f0f0f0; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #999;">💬</div>'}
                            </div>
                            <div class="game-info">
                                <div class="game-header">${escapeHtml(game.name)}</div>
                                <span class="game-count">💬 ${game.totalThreads} threads</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Add click handlers to show details modal
            document.querySelectorAll('.game-card').forEach(card => {
                card.addEventListener('click', function(e) {
                    const gameId = this.dataset.gameId;
                    const game = gameForums[gameId];
                    if (!game) return;
                    showDetailsModal(gameId, game);
                });
            });
        }

        // Show details modal with forum info
        function showDetailsModal(gameId, game) {
            const modal = document.getElementById('detailsModal');
            const modalHeader = document.getElementById('detailsHeader');
            const modalBody = document.getElementById('detailsBody');
            const detailsCloseBtn = document.getElementById('detailsCloseBtn');

            modalHeader.innerHTML = `
                💬 ${escapeHtml(game.name)}
                <button class="modal-close" id="detailsCloseBtn">✕</button>
            `;

            const forumDetails = game.forums.map(f => {
                let forumHtml = `
                    <div style="margin-bottom: 1rem; padding: 1rem; background: #f9f9f9; border-radius: 6px;">
                        <div style="font-weight: 600; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center;">
                            <span>${escapeHtml(f.title)}</span>
                            <span style="font-size: 0.8rem; background: #dbeafe; color: #1e40af; padding: 0.2rem 0.5rem; border-radius: 10px;">${f.numthreads} threads</span>
                        </div>
                        <div style="font-size: 0.9rem; color: #666; margin-bottom: 0.75rem;">
                            📝 ${f.numposts} posts
                            ${f.lastpostdate ? `<br>🕒 Last post: ${new Date(f.lastpostdate).toLocaleDateString()}` : ''}
                        </div>
                `;

                // Show recent threads if available
                if (f.recentThreads && f.recentThreads.length > 0) {
                    forumHtml += `
                        <div style="margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid #ddd; font-size: 0.85rem;">
                            <div style="font-weight: 600; margin-bottom: 0.5rem; color: #333;">Recent Threads:</div>
                            <div style="max-height: 150px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem;">
                                ${f.recentThreads.slice(0, 5).map(t => `
                                    <div style="background: white; padding: 0.5rem; border-radius: 4px; border-left: 3px solid #6366f1;">
                                        <div style="font-weight: 500; color: #333;">${escapeHtml(t.title)}</div>
                                        <div style="color: #666; font-size: 0.75rem;">👤 ${escapeHtml(t.author)}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }

                forumHtml += `
                    <a href="https://boardgamegeek.com/boardgame/${gameId}/${encodeURIComponent(game.name)}/forums/${f.id}" target="_blank" style="display: inline-block; background: #6366f1; color: white; padding: 0.5rem 1rem; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 0.9rem; width: 100%; text-align: center; margin-top: 0.75rem;">
                        View Forum ↗️
                    </a>
                    </div>
                `;
                return forumHtml;
            }).join('');

            modalBody.innerHTML = `
                <div style="margin-bottom: 1rem;">
                    <div style="font-weight: 600; margin-bottom: 0.75rem;">Forums (${game.forums.length})</div>
                    <div style="max-height: 500px; overflow-y: auto;">
                        ${forumDetails}
                    </div>
                </div>
            `;

            modal.classList.remove('hidden');
            document.getElementById('detailsCloseBtn').addEventListener('click', closeDetailsModal);
        }

        // Close details modal
        function closeDetailsModal() {
            document.getElementById('detailsModal').classList.add('hidden');
        }

        // Update cache info
        function updateCacheInfo() {
            cacheInfo.textContent = `👤 Username: ${currentUsername} | 📦 Collection: ${allGames.length} games`;
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize
        window.addEventListener('load', () => {
            const savedUsername = localStorage.getItem('bgg_forums_username');
            if (savedUsername) {
                usernameInput.value = savedUsername;
            }
            updateCacheInfo();
            console.log('💬 Forums app loaded');
            showModal();
        });
    </script>
    <!-- Vercel Web Analytics -->
    <script type="module" src="analytics-init.js"></script>

</body>
