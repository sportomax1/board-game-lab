<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Forums | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>💬</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
            height: 100vh;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-dark {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in { animation: fadeIn 0.4s ease-out forwards; }

        .progress-fill {
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sort-btn {
            @apply flex-1 py-2 px-3 rounded-xl border border-white/10 text-[9px] font-black uppercase tracking-widest transition-all bg-white/5 text-slate-500;
        }
        .sort-btn.active {
            @apply bg-indigo-500 border-indigo-500 text-white shadow-lg shadow-indigo-500/20;
        }

        .game-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .game-card:active { transform: scale(0.98); }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
    </style>
</head>
<body class="selection:bg-indigo-500/30">
    <!-- Background Decor -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-indigo-900/20 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[10%] right-[0%] w-[50%] h-[50%] bg-emerald-900/10 blur-[120px] rounded-full"></div>
    </div>

    <div class="relative z-10 flex flex-col h-full pt-safe">
        <!-- Header -->
        <header class="p-6 flex flex-col md:flex-row md:items-center justify-between gap-6 border-b border-white/5">
            <div class="flex flex-col">
                <h1 class="text-2xl font-black italic uppercase tracking-tighter leading-tight text-white">Game <span class="text-indigo-400">Forums</span></h1>
                <div class="flex gap-4 mt-2">
                    <div class="text-[9px] font-bold text-slate-500 uppercase tracking-widest"><span class="text-indigo-400" id="gamesLoadedMetric">0</span> Games</div>
                    <div class="text-[9px] font-bold text-slate-500 uppercase tracking-widest"><span class="text-indigo-400" id="apiCallsMetric">0</span> Calls</div>
                    <div class="text-[9px] font-bold text-slate-500 uppercase tracking-widest"><span class="text-indigo-400" id="elapsedMetric">0s</span> Elapsed</div>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="showModal()" class="glass px-6 py-2 rounded-2xl border border-white/10 text-[10px] font-black uppercase tracking-widest hover:bg-white/10 transition-all">Settings</button>
                <a href="index.html" class="glass px-6 py-2 rounded-2xl border border-white/10 hover:bg-white/10 transition-all text-[10px] font-black uppercase tracking-widest flex items-center gap-2">Back</a>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-h-0">
            <!-- Progress Bar -->
            <div class="px-6 py-2 bg-black/20 border-b border-white/5">
                <div class="h-1.5 w-full bg-white/5 rounded-full overflow-hidden">
                    <div id="progressFill" class="progress-fill h-full bg-indigo-500 shadow-[0_0_10px_rgba(99,102,241,0.5)]" style="width: 0%;"></div>
                </div>
                <div class="flex justify-between mt-1">
                    <span id="statusMetric" class="text-[8px] font-bold text-slate-500 uppercase tracking-widest">Ready</span>
                    <span id="progressText" class="text-[8px] font-black text-indigo-400 uppercase tracking-widest">0%</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="p-6 space-y-4">
                <div class="glass rounded-2xl p-2 border border-white/10 flex items-center gap-3 px-4 focus-within:ring-2 focus-within:ring-indigo-500/50 transition-all">
                    <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    <input type="text" id="searchInput" class="flex-1 bg-transparent border-none text-sm text-white focus:outline-none py-2 font-medium" placeholder="Search games in your collection...">
                </div>

                <div class="flex flex-wrap gap-2">
                    <button class="sort-btn active" id="sortNameAsc">A-Z</button>
                    <button class="sort-btn" id="sortNameDesc">Z-A</button>
                    <button class="sort-btn" id="sortCountAsc">Threads Low</button>
                    <button class="sort-btn" id="sortCountDesc">Threads High</button>
                </div>
            </div>

            <!-- List -->
            <div id="gamesList" class="flex-1 overflow-y-auto custom-scrollbar px-6 pb-20 space-y-3">
                <div class="flex flex-col items-center justify-center py-20 text-slate-600">
                    <svg class="w-12 h-12 mb-4 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z"/></svg>
                    <p class="text-xs font-bold uppercase tracking-widest">No Forum Data Loaded</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="settingsModal" class="modal-overlay hidden">
        <div class="glass relative max-w-sm w-full rounded-[2.5rem] p-8 shadow-2xl border-t border-white/20">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-indigo-500/20 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-indigo-500/30">
                    <span class="text-3xl">⚙️</span>
                </div>
                <h2 class="text-2xl font-black italic uppercase tracking-tighter text-white">Forum <span class="text-indigo-400">Settings</span></h2>
            </div>

            <div class="space-y-6">
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Username</label>
                    <input type="text" id="usernameInput" value="sportomax" class="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all font-medium text-sm">
                </div>

                <div class="space-y-3">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Collection Filters</label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="flex items-center gap-2 glass p-3 rounded-xl border border-white/5 cursor-pointer">
                            <input type="checkbox" name="status" value="own" checked class="w-4 h-4 accent-indigo-500">
                            <span class="text-[10px] font-black uppercase text-slate-300">Own</span>
                        </label>
                        <label class="flex items-center gap-2 glass p-3 rounded-xl border border-white/5 cursor-pointer">
                            <input type="checkbox" name="status" value="wanttoplay" class="w-4 h-4 accent-indigo-500">
                            <span class="text-[10px] font-black uppercase text-slate-300">Want Play</span>
                        </label>
                    </div>
                </div>

                <div class="flex gap-2">
                    <button id="loadBtn" class="flex-1 bg-indigo-500 text-white py-4 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-indigo-400 transition-all shadow-xl shadow-indigo-500/20">Load</button>
                    <button id="clearBtn" class="bg-white/5 text-slate-500 px-6 rounded-2xl border border-white/10 hover:text-white transition-all">🗑️</button>
                </div>
                <button onclick="hideModal()" class="w-full text-[10px] font-bold text-slate-500 uppercase tracking-widest">Cancel</button>
            </div>
        </div>
    </div>

    <div id="detailsModal" class="modal-overlay hidden">
        <div class="glass relative max-w-lg w-full rounded-[2.5rem] p-8 shadow-2xl border-t border-white/20 flex flex-col max-h-[85vh]">
            <header class="flex items-center gap-4 mb-6 shrink-0">
                <div id="detailsIcon" class="w-16 h-16 rounded-2xl bg-black/40 border border-white/5 p-1">
                    <img id="detailsImg" src="" class="w-full h-full object-contain rounded-xl">
                </div>
                <div class="flex-1 min-w-0">
                    <h2 id="detailsHeader" class="text-xl font-black italic uppercase tracking-tighter text-white truncate"></h2>
                    <p id="detailsCount" class="text-[9px] font-bold text-indigo-400 uppercase tracking-widest"></p>
                </div>
                <button onclick="closeDetailsModal()" class="w-10 h-10 glass rounded-xl flex items-center justify-center text-slate-500 hover:text-white transition-all">✕</button>
            </header>
            <div id="detailsBody" class="flex-1 overflow-y-auto custom-scrollbar space-y-4 pr-2"></div>
        </div>
    </div>

    <script>
        const STORAGE_KEY_COLLECTION = 'bgg_forums_collection';
        const STORAGE_KEY_TIMESTAMP = 'bgg_forums_timestamp';

        let allGames = [];
        let gameForums = {};
        let totalApiCalls = 0;
        let startTime = null;
        let currentSort = 'nameAsc';

        const usernameInput = document.getElementById('usernameInput');
        const loadBtn = document.getElementById('loadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const gamesList = document.getElementById('gamesList');
        const searchInput = document.getElementById('searchInput');
        const settingsModal = document.getElementById('settingsModal');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const gamesLoadedMetric = document.getElementById('gamesLoadedMetric');
        const apiCallsMetric = document.getElementById('apiCallsMetric');
        const elapsedMetric = document.getElementById('elapsedMetric');
        const statusMetric = document.getElementById('statusMetric');

        function showModal() { settingsModal.classList.remove('hidden'); }
        function hideModal() { settingsModal.classList.add('hidden'); }

        function updateMetrics() {
            if (startTime) {
                const elapsed = Math.round((Date.now() - startTime) / 1000);
                elapsedMetric.textContent = elapsed + 's';
            }
            gamesLoadedMetric.textContent = Object.keys(gameForums).length;
            apiCallsMetric.textContent = totalApiCalls;
        }

        function updateProgress(current, total) {
            if (total === 0) return;
            const percent = Math.round((current / total) * 100);
            progressFill.style.width = percent + '%';
            progressText.textContent = percent + '%';
        }

        loadBtn.addEventListener('click', () => { hideModal(); loadCollection(); });

        document.getElementById('sortNameAsc').addEventListener('click', (e) => { currentSort = 'nameAsc'; updateSortUI(e.target); renderGames(); });
        document.getElementById('sortNameDesc').addEventListener('click', (e) => { currentSort = 'nameDesc'; updateSortUI(e.target); renderGames(); });
        document.getElementById('sortCountAsc').addEventListener('click', (e) => { currentSort = 'countAsc'; updateSortUI(e.target); renderGames(); });
        document.getElementById('sortCountDesc').addEventListener('click', (e) => { currentSort = 'countDesc'; updateSortUI(e.target); renderGames(); });

        function updateSortUI(btn) {
            document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        clearBtn.addEventListener('click', () => {
            localStorage.removeItem(STORAGE_KEY_COLLECTION);
            localStorage.removeItem(STORAGE_KEY_TIMESTAMP);
            allGames = []; gameForums = {};
            gamesList.innerHTML = '';
            alert('Cache Cleared');
        });

        searchInput.addEventListener('input', renderGames);

        async function fetchWithRetry(url, maxRetries = 3) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    totalApiCalls++; updateMetrics();
                    const response = await fetch(url);
                    if (response.status === 202) { await new Promise(r => setTimeout(r, 2000 * (i + 1))); continue; }
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response;
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    await new Promise(r => setTimeout(r, 1000 * (i + 1)));
                }
            }
        }

        async function loadCollection() {
            const user = usernameInput.value.trim();
            if (!user) return alert('Enter username');
            const checkboxes = document.querySelectorAll('input[name="status"]:checked');
            const statuses = Array.from(checkboxes).map(cb => cb.value);
            if (statuses.length === 0) return alert('Select status');

            startTime = Date.now(); totalApiCalls = 0;
            statusMetric.textContent = 'Init...';
            updateMetrics(); updateProgress(0, 100);

            try {
                const cached = localStorage.getItem(STORAGE_KEY_COLLECTION);
                if (cached) {
                    allGames = JSON.parse(cached);
                    await processGameBatches();
                } else {
                    const params = statuses.map(s => `&${s}=1`).join('');
                    const url = `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(user)}${params}&stats=1`;
                    const res = await fetchWithRetry(url);
                    const xml = new DOMParser().parseFromString(await res.text(), 'text/xml');
                    allGames = Array.from(xml.querySelectorAll('item')).map(item => ({
                        id: item.getAttribute('objectid'),
                        name: item.querySelector('name')?.textContent || 'Unknown',
                        image: item.querySelector('image')?.textContent || ''
                    })).filter(g => g.id);
                    localStorage.setItem(STORAGE_KEY_COLLECTION, JSON.stringify(allGames));
                    await processGameBatches();
                }
            } catch (e) { statusMetric.textContent = 'Error'; }
        }

        async function processGameBatches() {
            const batchSize = 20; const parallelBatches = 50;
            let processed = 0; gameForums = {};
            const batches = [];
            for (let i = 0; i < allGames.length; i += batchSize) batches.push(allGames.slice(i, i + batchSize));

            for (let i = 0; i < batches.length; i += parallelBatches) {
                const group = batches.slice(i, i + parallelBatches);
                statusMetric.textContent = `Batch ${i+1}/${batches.length}`;
                await Promise.all(group.map(async batch => {
                    await Promise.all(batch.map(async game => {
                        try {
                            const res = await fetchWithRetry(`/api/bgg-helper?endpoint=forumlist&type=thing&id=${game.id}`);
                            const xml = new DOMParser().parseFromString(await res.text(), 'text/xml');
                            const forums = Array.from(xml.querySelectorAll('forum')).map(f => ({
                                id: f.getAttribute('id'), title: f.getAttribute('title'),
                                threads: parseInt(f.getAttribute('numthreads') || 0), posts: parseInt(f.getAttribute('numposts') || 0),
                                last: f.getAttribute('lastpostdate'), desc: f.getAttribute('description') || ''
                            }));
                            if (forums.length > 0) {
                                gameForums[game.id] = { name: game.name, image: game.image, forums, 
                                    totalThreads: forums.reduce((s, f) => s + f.threads, 0),
                                    totalPosts: forums.reduce((s, f) => s + f.posts, 0)
                                };
                            }
                        } catch (e) {}
                    }));
                }));
                processed += group.reduce((s, b) => s + b.length, 0);
                updateProgress(processed, allGames.length); updateMetrics(); renderGames();
                await new Promise(r => setTimeout(r, 300));
            }
            statusMetric.textContent = 'Finishing...';
            await fetchThreadDetails();
            statusMetric.textContent = 'Complete';
            renderGames();
        }

        async function fetchThreadDetails() {
            const list = [];
            Object.entries(gameForums).forEach(([gid, g]) => g.forums.forEach(f => { if(f.threads > 0) list.push({gid, fid: f.id}); }));
            if (list.length === 0) return;
            const bSize = 20;
            for (let i = 0; i < list.length; i += bSize) {
                const batch = list.slice(i, i + bSize);
                const ids = batch.map(t => t.fid).join(',');
                try {
                    const res = await fetchWithRetry(`/api/bgg-helper?endpoint=thread&id=${ids}`);
                    const xml = new DOMParser().parseFromString(await res.text(), 'text/xml');
                    Array.from(xml.querySelectorAll('thread')).forEach(t => {
                        const id = t.getAttribute('id');
                        const info = batch.find(x => x.fid === id);
                        if (info && gameForums[info.gid]) {
                            const forum = gameForums[info.gid].forums.find(f => f.id === id);
                            if (forum) {
                                forum.recent = forum.recent || [];
                                forum.recent.push({
                                    id, title: t.querySelector('subject')?.textContent || 'Untitled',
                                    author: t.querySelector('author')?.textContent || 'Unknown',
                                    date: t.getAttribute('postdate')
                                });
                            }
                        }
                    });
                } catch (e) {}
                await new Promise(r => setTimeout(r, 200));
            }
        }

        function renderGames() {
            const query = searchInput.value.toLowerCase();
            const entries = Object.entries(gameForums).filter(([_, g]) => g.name.toLowerCase().includes(query))
                .sort((a, b) => {
                    if (currentSort === 'nameAsc') return a[1].name.localeCompare(b[1].name);
                    if (currentSort === 'nameDesc') return b[1].name.localeCompare(a[1].name);
                    if (currentSort === 'countAsc') return a[1].totalThreads - b[1].totalThreads;
                    return b[1].totalThreads - a[1].totalThreads;
                });

            if (entries.length === 0) {
                gamesList.innerHTML = '<div class="text-center py-20 text-slate-600 text-xs font-bold uppercase tracking-widest">No Matches Found</div>';
                return;
            }

            gamesList.innerHTML = entries.map(([id, g]) => `
                <div class="game-card glass rounded-2xl p-3 border border-white/5 flex items-center gap-4 cursor-pointer animate-in" onclick="showDetails('${id}')">
                    <div class="w-12 h-12 rounded-xl bg-black/40 border border-white/5 p-1 flex-shrink-0">
                        <img src="${g.image ? `/api/image-proxy?url=${encodeURIComponent(g.image)}` : ''}" class="w-full h-full object-contain rounded-lg" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%231e293b%22 width=%22100%22 height=%22100%22/><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2240%22>💬</text></svg>'">
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="text-xs font-black text-white italic uppercase tracking-tighter truncate leading-tight">${g.name}</div>
                        <div class="text-[8px] font-bold text-indigo-400 uppercase tracking-widest mt-1">${g.totalThreads} Threads • ${g.totalPosts} Posts</div>
                    </div>
                    <svg class="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"/></svg>
                </div>
            `).join('');
        }

        function showDetails(id) {
            const g = gameForums[id];
            document.getElementById('detailsImg').src = g.image ? `/api/image-proxy?url=${encodeURIComponent(g.image)}` : '';
            document.getElementById('detailsHeader').textContent = g.name;
            document.getElementById('detailsCount').textContent = `${g.forums.length} Forums`;
            
            document.getElementById('detailsBody').innerHTML = g.forums.map(f => `
                <div class="glass-dark rounded-2xl p-4 border border-white/5 space-y-3">
                    <div class="flex justify-between items-start gap-2">
                        <div class="text-xs font-black text-white uppercase italic tracking-tighter">${f.title}</div>
                        <span class="text-[8px] font-black bg-indigo-500/20 text-indigo-400 px-2 py-0.5 rounded-full">${f.threads}</span>
                    </div>
                    <p class="text-[9px] text-slate-500 leading-relaxed">${f.desc}</p>
                    ${f.recent ? `
                        <div class="space-y-1 mt-2">
                            ${f.recent.slice(0, 3).map(t => `
                                <div class="text-[8px] text-slate-400 truncate bg-white/5 p-1 rounded">👤 ${t.author}: ${t.title}</div>
                            `).join('')}
                        </div>
                    ` : ''}
                    <a href="https://boardgamegeek.com/boardgame/${id}/_/forums/${f.id}" target="_blank" class="block w-full text-center py-2 rounded-xl bg-white/5 text-[8px] font-black uppercase tracking-widest text-indigo-400 border border-indigo-500/20">Open Forum ↗️</a>
                </div>
            `).join('');
            document.getElementById('detailsModal').classList.remove('hidden');
        }

        function closeDetailsModal() { document.getElementById('detailsModal').classList.add('hidden'); }

        window.onload = () => { showModal(); };
    </script>
    <script type="module" src="analytics-init.js"></script>
</body>
</html>
