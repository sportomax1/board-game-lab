<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>BGG Board Game Share</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
    }

    .thumb-preview-grid {
      display: grid;
      gap: 12px;
    }

    .tile-item {
      position: relative;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.2s;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .tile-item:hover {
      transform: translateY(-2px);
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #e2e8f0;
      border-radius: 20px;
    }

    .step-active { border-color: var(--primary); color: var(--primary); }

    /* Drag and Drop visual */
    .dragging { opacity: 0.5; transform: scale(0.95); }
  </style>
</head>
<body class="pb-24">

  <!-- Header -->
  <header class="sticky top-0 z-30 w-full glass-card border-b px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="bg-indigo-600 text-white p-2 rounded-lg">
        <i class="fa-solid fa-layer-group"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-tight">BGG Canvas</h1>
        <p class="text-xs text-slate-500 font-medium">Create & Share Game Lists</p>
      </div>
    </div>
    <div id="progressStatus" class="text-sm font-semibold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full hidden">
      <i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Loading...
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 md:p-6 space-y-8">
    
    <!-- Step 1: User & Input -->
    <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
      <div class="flex items-center gap-2 mb-6">
        <span class="bg-slate-100 text-slate-600 w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold">1</span>
        <h2 class="text-lg font-bold">Source Data</h2>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="space-y-2">
          <label class="block text-sm font-semibold text-slate-700">BGG Username</label>
          <div class="relative">
            <i class="fa-solid fa-user absolute left-3 top-3.5 text-slate-400"></i>
            <input id="username" type="text" value="sportomax" class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all" placeholder="Enter BGG username">
          </div>
          <p class="text-[10px] text-slate-400">Used to match games from your collection first.</p>
        </div>

        <div class="space-y-2">
          <label class="block text-sm font-semibold text-slate-700">Import File (CSV)</label>
          <div class="flex gap-2">
            <input id="fileInput" type="file" accept=".csv" class="hidden">
            <label for="fileInput" class="flex-1 flex items-center justify-center gap-2 px-4 py-3 bg-slate-50 border-2 border-dashed border-slate-200 rounded-xl cursor-pointer hover:bg-slate-100 transition-colors">
              <i class="fa-solid fa-file-import text-slate-400"></i>
              <span class="text-sm text-slate-600 font-medium">Choose CSV</span>
            </label>
            <button onclick="loadFromFile()" class="bg-slate-800 text-white px-4 py-3 rounded-xl text-sm font-bold hover:bg-slate-900">Load</button>
          </div>
        </div>
      </div>

      <div class="mt-6 space-y-2">
        <label class="block text-sm font-semibold text-slate-700">Game List (Rank, Name)</label>
        <textarea id="csvInput" rows="5" class="w-full p-4 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none font-mono text-sm" placeholder="1, Wingspan&#10;2, Terraforming Mars..."></textarea>
      </div>

      <button onclick="parseAndFetch()" class="mt-6 w-full bg-indigo-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-indigo-700 shadow-lg shadow-indigo-200 transition-all flex items-center justify-center gap-2">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        Build Thumbnail Grid
      </button>
    </section>

    <!-- Step 2: Editor -->
    <section id="editorSection" class="hidden space-y-6">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="bg-slate-100 text-slate-600 w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold">2</span>
          <h2 class="text-lg font-bold">Refine & Sort</h2>
        </div>
        <div class="flex gap-2 items-center bg-slate-100 p-1 rounded-lg">
          <select id="layoutSelect" onchange="renderThumbs()" class="bg-transparent text-sm font-bold px-3 py-1.5 outline-none cursor-pointer">
            <option value="grid9">Top 9 (3x3)</option>
            <option value="row10">Top 10 (Row)</option>
            <option value="grid25">Top 25 (5x5)</option>
            <option value="grid50">Top 50 (10x5)</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <!-- Reorder List -->
        <div class="lg:col-span-5 bg-white rounded-2xl p-4 shadow-sm border border-slate-100 h-[600px] flex flex-direction-column">
          <div class="mb-4 text-xs font-bold text-slate-400 uppercase tracking-wider px-2">List Order (Drag to reorder)</div>
          <div id="parsedListContainer" class="flex-1 overflow-y-auto custom-scrollbar space-y-2 px-2">
            <!-- Rows go here -->
          </div>
        </div>

        <!-- Preview Grid -->
        <div class="lg:col-span-7 bg-slate-900 rounded-2xl p-6 shadow-xl overflow-hidden flex flex-col items-center justify-center min-h-[400px]">
           <div id="thumbs" class="w-full"></div>
           <p class="text-slate-500 text-[10px] mt-4 uppercase font-bold tracking-widest">Live Canvas Preview</p>
        </div>
      </div>

      <!-- Footer Action -->
      <div class="fixed bottom-0 left-0 right-0 p-4 glass-card border-t flex justify-center z-40">
        <button onclick="composeAndDownload()" class="w-full max-w-md bg-emerald-600 text-white py-4 rounded-2xl font-bold text-lg hover:bg-emerald-700 shadow-xl shadow-emerald-100 transition-all flex items-center justify-center gap-3">
          <i class="fa-solid fa-download"></i>
          Export Combined Image
        </button>
      </div>
    </section>

  </main>

<script>
// --- CORE LOGIC (Preserving APIs exactly as requested) ---
const API_TOKEN = '';
const DEFAULT_USER = 'sportomax';
let parsedList = []; 
let thumbsMap = {}; 

function parseCSV(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const out=[];
  for(const ln of lines){
    const parts = ln.split(/,|\t/).map(p=>p.trim()).filter((v,i)=>v!=='' || i>0);
    if(parts.length===0) continue;
    if(parts.length===1){ out.push({name: parts[0]}); }
    else {
      const maybeNum = parseInt(parts[0].replace(/[^0-9-]/g,''),10);
      if(!Number.isNaN(maybeNum)) out.push({rank: maybeNum, name: parts.slice(1).join(',')});
      else out.push({name: parts.join(' ')});
    }
  }
  return out;
}

function loadFromFile(){
  const f = document.getElementById('fileInput').files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = e=>{ document.getElementById('csvInput').value = e.target.result; };
  r.readAsText(f);
}

const showLoading = (show) => {
  document.getElementById('progressStatus').classList.toggle('hidden', !show);
};

async function parseAndFetch(){
  const txt = document.getElementById('csvInput').value.trim();
  if(!txt) return;
  parsedList = parseCSV(txt);
  renderParsedList();
  if(parsedList.length===0) return;
  
  showLoading(true);
  thumbsMap = {};
  const user = (document.getElementById('username').value||DEFAULT_USER).trim();
  
  try{
    const collXml = await fetchAPI('collection','',`&username=${encodeURIComponent(user)}&stats=1`);
    const doc = new DOMParser().parseFromString(collXml,'text/xml');
    const items = Array.from(doc.querySelectorAll('item'));
    const collMap = {};
    items.forEach(it=>{
      const name = it.querySelector('name')?.textContent?.trim();
      const thumb = it.querySelector('thumbnail')?.textContent || it.querySelector('image')?.textContent || '';
      const id = it.getAttribute('objectid');
      if(name) collMap[name.toLowerCase()] = {thumb,id};
    });

    const needSearch = [];
    parsedList.forEach(p=>{
      const n = p.name.trim();
      const key = n.toLowerCase();
      if(collMap[key]) thumbsMap[n]= {thumb: collMap[key].thumb, id: collMap[key].id};
      else {
        const found = Object.keys(collMap).find(k=>k.includes(key) || key.includes(k));
        if(found) thumbsMap[n] = {thumb: collMap[found].thumb, id: collMap[found].id};
        else needSearch.push(n);
      }
    });

    if(needSearch.length>0){
      const searchIds = [];
      for(const name of needSearch){
        try{
          const sTxt = await fetchAPI('search','',`&query=${encodeURIComponent(name)}`);
          const sDoc = new DOMParser().parseFromString(sTxt,'text/xml');
          const first = sDoc.querySelector('item');
          if(first){ const id = first.getAttribute('id'); if(id) searchIds.push({name,id}); }
        }catch(e){ console.warn('search fail', name, e); }
      }
      const ids = searchIds.map(s=>s.id);
      const idToName = {};
      searchIds.forEach(s=>idToName[s.id]=s.name);
      const chunkSize = 20;
      for(let i=0;i<ids.length;i+=chunkSize){
        const chunk = ids.slice(i,i+chunkSize).join(',');
        try{
          const tTxt = await fetchAPI('thing','',`&id=${chunk}&stats=1`);
          const tDoc = new DOMParser().parseFromString(tTxt,'text/xml');
          tDoc.querySelectorAll('item').forEach(it=>{
            const id = it.getAttribute('id');
            const thumb = it.querySelector('thumbnail')?.textContent || it.querySelector('image')?.textContent || '';
            const name = idToName[id] || it.querySelector('name')?.textContent || '';
            if(name) thumbsMap[name] = {thumb,id};
          });
        }catch(e){ console.warn('thing fail', e); }
      }
    }

    document.getElementById('editorSection').classList.remove('hidden');
    renderThumbs();
    showLoading(false);
    // Smooth scroll to editor
    document.getElementById('editorSection').scrollIntoView({ behavior: 'smooth' });
  }catch(e){
    console.error(e);
    showLoading(false);
  }
}

// --- NEW MODERN RENDERING ---

function renderThumbs(){
  const container = document.getElementById('thumbs');
  container.innerHTML = '';
  const layout = document.getElementById('layoutSelect').value;
  let limit = 50;
  if(layout==='grid9') limit=9; else if(layout==='row10') limit=10; else if(layout==='grid25') limit=25; else if(layout==='grid50') limit=50;
  
  const list = parsedList.slice(0,limit);
  const grid = document.createElement('div');
  grid.className='thumb-preview-grid';
  
  if(layout==='grid9') grid.style.gridTemplateColumns='repeat(3,1fr)';
  else if(layout==='grid25') grid.style.gridTemplateColumns='repeat(5,1fr)';
  else if(layout==='grid50') grid.style.gridTemplateColumns='repeat(10,1fr)';
  else if(layout==='row10') grid.style.gridTemplateColumns=`repeat(${list.length},1fr)`;

  list.forEach((p,idx)=>{
    const name = p.name;
    const item = document.createElement('div');
    item.className='tile-item bg-slate-800 border border-slate-700';
    item.style.aspectRatio = '1 / 1';
    
    const img = document.createElement('img');
    const orig = thumbsMap[name] && thumbsMap[name].thumb ? thumbsMap[name].thumb : 'https://via.placeholder.com/300?text=No+Image';
    const proxied = `/api/image-proxy?url=${encodeURIComponent(orig)}`;
    img.src = proxied;
    img.alt = name;
    img.className = "w-full h-full object-cover opacity-90 hover:opacity-100 transition-opacity";

    const badge = document.createElement('div');
    badge.className = "absolute top-1 left-1 bg-black/60 text-white text-[8px] px-1.5 py-0.5 rounded font-bold backdrop-blur-sm";
    badge.innerText = p.rank || (idx + 1);

    item.appendChild(img);
    item.appendChild(badge);
    grid.appendChild(item);
  });
  container.appendChild(grid);
}

function renderParsedList(){
  const container = document.getElementById('parsedListContainer');
  container.innerHTML = '';
  if(parsedList.length===0) return;
  
  parsedList.forEach((p, idx)=>{
    const row = document.createElement('div'); 
    row.className='flex items-center gap-3 p-3 bg-slate-50 border border-slate-200 rounded-xl cursor-grab active:cursor-grabbing hover:bg-slate-100 transition-colors group';
    row.draggable = true;
    row.dataset.index = idx;

    row.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', idx); row.classList.add('dragging'); });
    row.addEventListener('dragend', e=>{ row.classList.remove('dragging'); });
    row.addEventListener('dragover', e=> e.preventDefault());
    row.addEventListener('drop', e=>{
      e.preventDefault(); 
      const from = parseInt(e.dataTransfer.getData('text/plain'),10); 
      const to = parseInt(row.dataset.index,10);
      if(!isNaN(from) && !isNaN(to) && from!==to){
        const item = parsedList.splice(from,1)[0]; 
        parsedList.splice(to,0,item); 
        renderParsedList(); 
        renderThumbs();
      }
    });

    const handle = document.createElement('div'); 
    handle.innerHTML = '<i class="fa-solid fa-grip-vertical text-slate-300 group-hover:text-slate-500"></i>';
    
    const content = document.createElement('div');
    content.className = "flex-1 min-w-0";
    content.innerHTML = `
      <div class="text-xs font-bold text-indigo-500 mb-0.5">${p.rank ? '#'+p.rank : 'Item '+(idx+1)}</div>
      <div class="text-sm font-semibold truncate text-slate-700">${p.name}</div>
    `;

    const actions = document.createElement('div');
    actions.className = "flex gap-1";
    
    const createBtn = (icon, color, fn) => {
      const b = document.createElement('button');
      b.className = `w-8 h-8 flex items-center justify-center rounded-lg text-xs ${color} hover:bg-white hover:shadow-sm transition-all`;
      b.innerHTML = `<i class="fa-solid ${icon}"></i>`;
      b.onclick = fn;
      return b;
    };

    actions.appendChild(createBtn('fa-chevron-up', 'text-slate-400', () => {
       if(idx > 0) { const it=parsedList.splice(idx,1)[0]; parsedList.splice(idx-1,0,it); renderParsedList(); renderThumbs(); }
    }));
    actions.appendChild(createBtn('fa-xmark', 'text-rose-400 hover:text-rose-600', () => {
       parsedList.splice(idx,1); renderParsedList(); renderThumbs();
    }));

    row.appendChild(handle);
    row.appendChild(content);
    row.appendChild(actions);
    container.appendChild(row);
  });
}

async function composeAndDownload(){
  const layout = document.getElementById('layoutSelect').value;
  const limit = layout==='grid9'?9:layout==='row10'?10:layout==='grid25'?25:50;
  const list = parsedList.slice(0,limit);
  if(list.length===0) return;

  let cols=1, tile=400, rows=1;
  if(layout==='grid9'){ cols=3; tile=400; rows=3; }
  else if(layout==='row10'){ cols=list.length; tile=300; rows=1; }
  else if(layout==='grid25'){ cols=5; tile=300; rows=5; }
  else if(layout==='grid50'){ cols=10; tile=200; rows=Math.ceil(list.length/cols); }
  
  const canvas = document.createElement('canvas');
  canvas.width = cols * tile;
  canvas.height = rows * tile;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#1e293b'; 
  ctx.fillRect(0,0,canvas.width,canvas.height);

  const promises = list.map(p=>{
    const orig = (thumbsMap[p.name] && thumbsMap[p.name].thumb) ? thumbsMap[p.name].thumb : 'https://via.placeholder.com/300?text=No+Image';
    const proxied = `/api/image-proxy?url=${encodeURIComponent(orig)}`;
    return loadImage(proxied).then(img=>({img,p})).catch(e=>({img:null,p}));
  });
  
  const results = await Promise.all(promises);
  results.forEach((res,i)=>{
    const c = i % cols; const r = Math.floor(i/cols);
    const x = c * tile; const y = r * tile;
    
    if(res.img){
      const iw = res.img.width, ih = res.img.height;
      const scale = Math.max(tile/iw, tile/ih);
      const drawW = iw * scale;
      const drawH = ih * scale;
      const dx = x + (tile - drawW)/2;
      const dy = y + (tile - drawH)/2;
      
      ctx.save();
      ctx.beginPath();
      ctx.rect(x, y, tile, tile);
      ctx.clip();
      ctx.drawImage(res.img, dx, dy, drawW, drawH);
      ctx.restore();
    }

    // Modern Caption
    ctx.fillStyle='rgba(0,0,0,0.7)'; 
    ctx.fillRect(x, y + tile - (tile*0.15), tile, tile*0.15);
    
    ctx.fillStyle='#ffffff'; 
    ctx.font = `bold ${Math.round(tile * 0.05)}px "Plus Jakarta Sans", sans-serif`;
    const label = (list[i].rank ? list[i].rank + '. ' : (i+1)+'. ') + list[i].name;
    ctx.fillText(truncate(label, 25), x + (tile*0.05), y + tile - (tile*0.05));
  });

  const url = canvas.toDataURL('image/png');
  const a = document.createElement('a'); 
  a.href = url; 
  a.download = `bgg_collection_${Date.now()}.png`; 
  document.body.appendChild(a); 
  a.click(); 
  a.remove();
}

function truncate(s,n){ return s.length>n? s.slice(0,n-1)+'…':s; }

function loadImage(src){
  return new Promise(async (resolve,reject)=>{
    try{
      const res = await fetch(src);
      if(!res.ok) return reject(new Error('Fail'));
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const img = new Image(); 
      img.crossOrigin = "anonymous";
      img.onload = ()=>{ URL.revokeObjectURL(url); resolve(img); };
      img.onerror = (e)=>{ URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    }catch(err){ reject(err); }
  });
}

async function fetchAPI(endpoint,user,queryParams=''){ 
  let url = `/api/bgg-helper?endpoint=${endpoint}${queryParams}`;
  const headers = {};
  if(API_TOKEN) headers['Authorization'] = `Bearer ${API_TOKEN}`;
  const maxAttempts = 6;
  for(let attempt=0; attempt<maxAttempts; attempt++){
    let res;
    try{ res = await fetch(url,{headers}); }catch(e){ await wait(1000*Math.pow(2,attempt)); continue; }
    if(res.status===202){ await wait(2000); continue; }
    if(res.ok) return await res.text();
    if(res.status===429){
      let waitMs = 1000*Math.pow(2,attempt);
      await wait(waitMs); continue;
    }
    throw new Error(`API Error: ${res.status}`);
  }
  throw new Error('Timeout');
}

function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

document.getElementById('csvInput').addEventListener('paste', async (ev)=>{
  try {
    const text = (ev.clipboardData || window.clipboardData).getData('text');
    if(text){ 
      // Small delay to allow value to update
      setTimeout(() => {
        parsedList = parseCSV(document.getElementById('csvInput').value); 
        renderParsedList(); 
      }, 0);
    }
  }catch(e){ console.warn(e); }
});
</script>
</body>
</html>
