<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>BGG Canvas Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    
    :root {
      --primary: #6366f1;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .dragging { opacity: 0.3; transform: scale(0.9); }
    .drop-target { border: 2px dashed var(--primary) !important; }
    .no-select { user-select: none; }
    
    .img-zoom { object-fit: cover; }
    .img-contain { object-fit: contain; }

    /* Shelfie View Styles */
    .shelf-container {
      perspective: 1000px;
    }
    .shelf-item {
      transform: rotateY(-15deg) rotateX(5deg);
      box-shadow: -5px 5px 15px rgba(0,0,0,0.5);
      transition: transform 0.3s ease;
    }
    .shelf-item:hover {
      transform: rotateY(0deg) rotateX(0deg) scale(1.05);
    }
    .wood-floor {
      background: linear-gradient(to bottom, #4a2c2a 0%, #2a1817 100%);
      border-bottom: 12px solid #1a0f0e;
    }
  </style>
</head>
<body class="pb-32">

  <header class="sticky top-0 z-30 w-full glass-card border-b px-6 py-4 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-3">
      <div class="bg-indigo-600 text-white p-2 rounded-lg">
        <i class="fa-solid fa-dice"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-tight">BGG Canvas</h1>
        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Professional Share Suite</p>
      </div>
    </div>
    <div id="progressStatus" class="flex items-center gap-2 hidden">
      <span id="matchStats" class="text-[10px] font-bold px-2 py-1 rounded bg-slate-100 text-slate-600 uppercase"></span>
      <div class="text-sm font-semibold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">
        <i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Fetching...
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">
    
    <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        <div class="space-y-2">
          <label class="text-xs font-bold text-slate-500 uppercase">BGG Username</label>
          <input id="username" type="text" value="sportomax" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
        </div>
        <div class="space-y-2">
          <label class="text-xs font-bold text-slate-500 uppercase">Import</label>
          <div class="flex gap-2">
            <input id="fileInput" type="file" accept=".csv" class="hidden" onchange="loadFromFile()">
            <label for="fileInput" class="flex-1 flex items-center justify-center gap-2 px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-100">
              <i class="fa-solid fa-file-csv text-slate-400"></i>
              <span class="text-sm font-medium">Select CSV</span>
            </label>
          </div>
        </div>
      </div>

      <div class="space-y-2">
        <label class="text-xs font-bold text-slate-500 uppercase">Game List</label>
        <textarea id="csvInput" rows="4" class="w-full p-4 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none font-mono text-sm" placeholder="1, Wingspan&#10;2, Terraforming Mars"></textarea>
      </div>

      <button onclick="parseAndFetch()" class="mt-6 w-full bg-indigo-600 text-white py-4 rounded-xl font-bold hover:bg-indigo-700 shadow-lg shadow-indigo-100 flex items-center justify-center gap-2">
        <i class="fa-solid fa-bolt"></i> Build Canvas
      </button>
    </section>

    <!-- Match Audit Alert -->
    <div id="auditAlert" class="hidden bg-amber-50 border border-amber-100 rounded-xl p-4 flex items-start gap-3">
        <i class="fa-solid fa-circle-exclamation text-amber-500 mt-1"></i>
        <div>
            <h4 class="text-sm font-bold text-amber-900">Inexact Matches Detected</h4>
            <p id="auditText" class="text-xs text-amber-700 leading-relaxed mt-1"></p>
        </div>
    </div>

    <section id="editorSection" class="hidden space-y-6">
      <div class="flex flex-wrap items-center justify-between gap-4 bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
        <div class="flex items-center gap-6">
          <div class="flex flex-col">
            <label class="text-[10px] font-bold text-slate-400 uppercase">Layout</label>
            <select id="layoutSelect" onchange="renderThumbs()" class="text-sm font-bold outline-none bg-transparent py-1">
              <option value="grid9">Grid 3x3 (Top 9)</option>
              <option value="grid25">Grid 5x5 (Top 25)</option>
              <option value="shelfie">Shelfie View (Top 10)</option>
              <option value="list10">List Mode (Top 10)</option>
              <option value="list50">List Mode (Top 50)</option>
              <option value="list100">List Mode (Top 100)</option>
            </select>
          </div>
          <div class="flex flex-col">
            <label class="text-[10px] font-bold text-slate-400 uppercase">Canvas Color</label>
            <div class="flex gap-2 mt-1">
                <input type="color" id="bgColor" value="#0f172a" onchange="renderThumbs()" class="w-6 h-6 rounded border-none cursor-pointer">
                <input type="color" id="accentColor" value="#6366f1" onchange="renderThumbs()" class="w-6 h-6 rounded border-none cursor-pointer">
            </div>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-x-6 gap-y-2">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="showNames" checked onchange="renderThumbs()" class="w-4 h-4 rounded text-indigo-600">
            <span class="text-xs font-bold text-slate-600">Names</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="showRanks" checked onchange="renderThumbs()" class="w-4 h-4 rounded text-indigo-600">
            <span class="text-xs font-bold text-slate-600">Ranks</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="zoomImages" onchange="renderThumbs()" class="w-4 h-4 rounded text-indigo-600">
            <span class="text-xs font-bold text-slate-600">Zoom</span>
          </label>
          <button onclick="exportCSV()" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-lg hover:bg-indigo-100 transition-colors">
            <i class="fa-solid fa-download mr-1"></i> CSV
          </button>
        </div>
      </div>

      <div id="previewCanvas" class="rounded-3xl p-6 md:p-10 shadow-2xl relative min-h-[400px] transition-colors overflow-hidden">
        <div id="thumbs" class="no-select mx-auto"></div>
        <div class="mt-8 flex justify-center">
            <span class="text-[10px] text-slate-400 font-bold tracking-widest uppercase">Drag items to reorder directly in the grid</span>
        </div>
      </div>
    </section>
  </main>

  <div id="footerAction" class="fixed bottom-8 left-1/2 -translate-x-1/2 w-full max-w-lg px-4 hidden flex gap-3">
    <button onclick="composeAndDownload()" class="flex-1 bg-emerald-500 text-white py-4 rounded-2xl font-bold shadow-xl shadow-emerald-200 hover:bg-emerald-600 flex items-center justify-center gap-3">
      <i class="fa-solid fa-camera"></i> Save
    </button>
    <button id="copyBtn" onclick="composeAndCopy()" class="flex-1 bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-xl shadow-indigo-200 hover:bg-indigo-700 flex items-center justify-center gap-3">
      <i class="fa-solid fa-copy"></i> Copy
    </button>
  </div>

<script>
let parsedList = []; 
let thumbsMap = {}; 
let draggedIndex = null;
let auditLogs = { exact: 0, fuzzy: [], missed: [] };

// Normalize string for broad matching (remove all non-alpha-numeric and lowercase)
function normalize(str) {
  return str.toLowerCase().replace(/[^a-z0-9]/g, '');
}

function parseCSV(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const out=[];
  const headerKeywords = ['rank', 'name', 'id', 'title', 'game', 'thumbnail'];
  for(const ln of lines){
    const parts = ln.split(/,|\t/).map(p=>p.trim()).filter((v,i)=>v!=='' || i>0);
    if(parts.length===0) continue;
    if (headerKeywords.includes(parts[0].toLowerCase())) continue;
    let rank = null; let name = '';
    const firstVal = parts[0].replace(/[^0-9]/g,'');
    const maybeNum = parseInt(firstVal, 10);
    if(!Number.isNaN(maybeNum) && firstVal !== ''){
      rank = maybeNum;
      name = parts.slice(1).join(',').trim();
    } else { name = parts.join(' ').trim(); }
    if(name) out.push({rank, name});
  }
  return out;
}

function loadFromFile(){
  const f = document.getElementById('fileInput').files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = e=>{ document.getElementById('csvInput').value = e.target.result; parseAndFetch(); };
  r.readAsText(f);
}

function exportCSV() {
    let csv = "Rank,Name,MatchStatus,ThumbnailURL\n";
    parsedList.forEach((p, idx) => {
        const data = thumbsMap[p.name] || {};
        const status = data.isExact ? 'Exact' : (data.thumb ? 'Fuzzy' : 'Missed');
        csv += `${idx + 1},"${p.name.replace(/"/g, '""')}","${status}","${data.thumb || ''}"\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `bgg_export_${Date.now()}.csv`;
    a.click();
}

async function parseAndFetch(){
  const txt = document.getElementById('csvInput').value.trim();
  if(!txt) return;
  parsedList = parseCSV(txt);
  if(parsedList.length===0) return;
  
  auditLogs = { exact: 0, fuzzy: [], missed: [] };
  document.getElementById('progressStatus').classList.remove('hidden');
  const user = (document.getElementById('username').value||'sportomax').trim();
  
  try{
    const collXml = await fetchAPI('collection','',`&username=${encodeURIComponent(user)}&stats=1`);
    const doc = new DOMParser().parseFromString(collXml,'text/xml');
    const items = Array.from(doc.querySelectorAll('item'));
    
    const collMap = {}; // Stores raw names
    const normalizedCollMap = {}; // Stores alpha-numeric versions
    
    items.forEach(it=>{
      const name = it.querySelector('name')?.textContent?.trim();
      const thumb = it.querySelector('thumbnail')?.textContent || it.querySelector('image')?.textContent || '';
      if(name) {
        const entry = {thumb, original: name};
        collMap[name.toLowerCase()] = entry;
        normalizedCollMap[normalize(name)] = entry;
      }
    });

    for(const p of parsedList){
      const n = p.name.trim();
      const key = n.toLowerCase();
      const normKey = normalize(n);
      
      // 1. Exact Match
      if(collMap[key]) {
        thumbsMap[n]= {thumb: collMap[key].thumb, isExact: true};
        auditLogs.exact++;
      }
      // 2. Alphanumeric / Character-agnostic match
      else if(normalizedCollMap[normKey]) {
        thumbsMap[n] = {thumb: normalizedCollMap[normKey].thumb, isExact: false, matchedTo: normalizedCollMap[normKey].original};
        auditLogs.fuzzy.push({input: n, matched: normalizedCollMap[normKey].original, reason: 'normalized'});
      }
      // 3. Substring / Includes match
      else {
        const foundKey = Object.keys(collMap).find(k=>k.includes(key) || key.includes(k));
        if(foundKey) {
          thumbsMap[n] = {thumb: collMap[foundKey].thumb, isExact: false, matchedTo: collMap[foundKey].original};
          auditLogs.fuzzy.push({input: n, matched: collMap[foundKey].original, reason: 'substring'});
        } else {
          thumbsMap[n] = {thumb: '', isExact: false};
          auditLogs.missed.push(n);
        }
      }
    }

    displayAudit();
    document.getElementById('editorSection').classList.remove('hidden');
    document.getElementById('footerAction').classList.remove('hidden');
    renderThumbs();
    document.getElementById('progressStatus').classList.add('hidden');
  } catch(e) { 
    console.error(e);
    document.getElementById('progressStatus').classList.add('hidden'); 
  }
}

function displayAudit() {
    const alertEl = document.getElementById('auditAlert');
    const textEl = document.getElementById('auditText');
    const statsEl = document.getElementById('matchStats');
    
    statsEl.innerText = `${auditLogs.exact} Perfect | ${auditLogs.fuzzy.length} Fuzzy | ${auditLogs.missed.length} Missing`;
    
    if (auditLogs.fuzzy.length > 0 || auditLogs.missed.length > 0) {
        alertEl.classList.remove('hidden');
        let html = "";
        if(auditLogs.missed.length > 0) html += `<strong>Missing:</strong> ${auditLogs.missed.join(', ')}. `;
        if(auditLogs.fuzzy.length > 0) {
            html += `<strong>Fuzzy Matches:</strong> ${auditLogs.fuzzy.map(f => {
                const badge = f.reason === 'normalized' ? ' (Char Agnostic)' : ' (Partial)';
                return `<span class="italic">"${f.input}"</span> → <span class="font-bold">"${f.matched}"</span>${badge}`;
            }).join('; ')}.`;
        }
        textEl.innerHTML = html;
    } else {
        alertEl.classList.add('hidden');
    }
}

function renderThumbs(){
  const container = document.getElementById('thumbs');
  const previewCanvas = document.getElementById('previewCanvas');
  const bgColor = document.getElementById('bgColor').value;
  const accentColor = document.getElementById('accentColor').value;
  
  previewCanvas.style.backgroundColor = bgColor;
  container.innerHTML = '';
  
  const layout = document.getElementById('layoutSelect').value;
  const showNames = document.getElementById('showNames').checked;
  const showRanks = document.getElementById('showRanks').checked;
  const zoom = document.getElementById('zoomImages').checked;
  
  let limit = 25; let gridCols = 'repeat(5, 1fr)'; let isList = false; let isShelf = (layout === 'shelfie');

  if(layout==='grid9'){ limit=9; gridCols='repeat(3, 1fr)'; container.style.maxWidth = '600px'; }
  else if(layout==='grid25'){ limit=25; gridCols='repeat(5, 1fr)'; container.style.maxWidth = '800px'; }
  else if(isShelf){ limit=10; container.style.maxWidth = '900px'; }
  else if(layout.startsWith('list')){ limit = parseInt(layout.replace('list','')); isList=true; container.style.maxWidth = '600px'; }

  const list = parsedList.slice(0, limit);
  const grid = document.createElement('div');
  
  if(isShelf) {
    grid.className = 'flex flex-wrap justify-center gap-x-2 gap-y-12 shelf-container py-12';
  } else {
    grid.className = isList ? 'flex flex-col gap-3' : 'grid gap-3';
    if(!isList) grid.style.gridTemplateColumns = gridCols;
  }

  const imgClass = zoom ? 'img-zoom' : 'img-contain';

  list.forEach((p, idx)=>{
    const wrapper = document.createElement('div');
    wrapper.draggable = true;
    wrapper.dataset.index = idx;
    setupDragEvents(wrapper, idx);

    const isFuzzy = thumbsMap[p.name] && !thumbsMap[p.name].isExact && thumbsMap[p.name].thumb;
    const isMissed = thumbsMap[p.name] && !thumbsMap[p.name].thumb;

    if(isShelf) {
        wrapper.className = `shelf-item relative w-32 h-44 bg-slate-800 rounded-sm overflow-hidden border-r-4 border-black/20 ${isFuzzy ? 'ring-2 ring-amber-400' : ''}`;
        const img = createImg(p.name, `w-full h-full object-cover`);
        wrapper.appendChild(img);
        if(showRanks) {
            const rb = document.createElement('div');
            rb.className = "absolute top-0 right-0 p-1 bg-black/40 text-[10px] text-white font-bold";
            rb.innerText = idx + 1;
            wrapper.appendChild(rb);
        }
        const base = document.createElement('div');
        base.className = "absolute -bottom-8 left-0 right-0 h-8 wood-floor -z-10 opacity-50";
        wrapper.appendChild(base);
    } else if(isList) {
        wrapper.className = `flex items-center bg-white/5 rounded-xl p-2 border border-white/5 group transition-all hover:bg-white/10 ${isFuzzy ? 'border-amber-400/50' : ''}`;
        const img = createImg(p.name, `w-16 h-16 rounded-lg ${imgClass} bg-slate-800 shadow-inner`);
        const info = document.createElement('div');
        info.className = "ml-4 flex-1";
        info.innerHTML = `<div class="flex items-center gap-2">
            ${showRanks ? `<span style="color:${accentColor}" class="font-bold text-sm">#${idx+1}</span>` : ''}
            <span class="text-white font-bold text-base truncate">${showNames ? p.name : ''}</span>
            ${isFuzzy ? '<i class="fa-solid fa-wand-sparkles text-amber-400 text-[10px]" title="Fuzzy Match"></i>' : ''}
        </div>`;
        wrapper.appendChild(img);
        wrapper.appendChild(info);
    } else {
        wrapper.className = `relative aspect-square bg-slate-800 rounded-xl border border-white/10 overflow-hidden group shadow-md ${isFuzzy ? 'ring-2 ring-inset ring-amber-400' : ''}`;
        const img = createImg(p.name, `w-full h-full ${imgClass}`);
        wrapper.appendChild(img);
        if(showRanks){
            const rb = document.createElement('div');
            rb.className = "absolute top-1 left-1 bg-black/70 text-white text-[9px] font-bold px-1.5 py-0.5 rounded backdrop-blur-md";
            rb.innerText = idx + 1;
            wrapper.appendChild(rb);
        }
        if(showNames){
            const nb = document.createElement('div');
            nb.className = "absolute bottom-0 left-0 right-0 bg-black/60 text-white text-[8px] p-1.5 font-medium truncate text-center backdrop-blur-sm opacity-0 group-hover:opacity-100 transition-opacity";
            nb.innerText = p.name;
            wrapper.appendChild(nb);
        }
    }
    grid.appendChild(wrapper);
  });
  container.appendChild(grid);
}

function setupDragEvents(wrapper, idx) {
    wrapper.addEventListener('dragstart', (e) => { draggedIndex = idx; e.currentTarget.classList.add('dragging'); });
    wrapper.addEventListener('dragend', (e) => { e.currentTarget.classList.remove('dragging'); document.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target')); });
    wrapper.addEventListener('dragover', (e) => { e.preventDefault(); wrapper.classList.add('drop-target'); });
    wrapper.addEventListener('dragleave', () => wrapper.classList.remove('drop-target'));
    wrapper.addEventListener('drop', (e) => {
        e.preventDefault(); if (draggedIndex === null || draggedIndex === idx) return;
        const item = parsedList.splice(draggedIndex, 1)[0];
        parsedList.splice(idx, 0, item);
        renderThumbs();
    });
}

function createImg(name, className) {
    const img = document.createElement('img');
    const orig = (thumbsMap[name] && thumbsMap[name].thumb) ? thumbsMap[name].thumb : 'https://via.placeholder.com/300?text=?';
    img.src = `/api/image-proxy?url=${encodeURIComponent(orig)}`;
    img.className = className;
    return img;
}

async function getComposedCanvas() {
  const layout = document.getElementById('layoutSelect').value;
  const showNames = document.getElementById('showNames').checked;
  const showRanks = document.getElementById('showRanks').checked;
  const zoom = document.getElementById('zoomImages').checked;
  const bgColor = document.getElementById('bgColor').value;
  
  let limit = 25;
  if(layout==='grid9') limit=9;
  else if(layout==='shelfie') limit=10;
  else if(layout.startsWith('list')) limit = parseInt(layout.replace('list',''));
  
  const list = parsedList.slice(0,limit);
  let cols=1, rows=1, tile=400;
  let isList = layout.startsWith('list');
  let isShelf = (layout === 'shelfie');

  if(layout==='grid9'){ cols=3; rows=3; }
  else if(layout==='grid25'){ cols=5; rows=5; }
  else if(isShelf){ cols=5; rows=2; tile=350; }
  else if(isList){ cols=1; rows=list.length; tile=160; }

  const canvas = document.createElement('canvas');
  canvas.width = isList ? 1200 : cols * tile;
  canvas.height = rows * tile;
  
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = bgColor;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  const images = await Promise.all(list.map(p=>{
    const orig = (thumbsMap[p.name] && thumbsMap[p.name].thumb) ? thumbsMap[p.name].thumb : 'https://via.placeholder.com/300?text=?';
    return loadImage(`/api/image-proxy?url=${encodeURIComponent(orig)}`);
  }));
  
  images.forEach((img, i)=>{
    const c = i % cols; const r = Math.floor(i/cols);
    const x = c * tile; const y = r * tile;
    
    if(img){
        if(isShelf) {
            ctx.fillStyle = '#1a0f0e';
            ctx.fillRect(x, y + tile - 20, tile, 20);
            ctx.save();
            ctx.shadowBlur = 20; ctx.shadowColor = 'black';
            const boxW = tile * 0.7; const boxH = tile * 0.85;
            const bx = x + (tile-boxW)/2; const by = y + (tile-boxH) - 20;
            ctx.drawImage(img, bx, by, boxW, boxH);
            ctx.restore();
            if(showRanks) {
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.font = '24px sans-serif';
                ctx.fillText(i+1, bx+5, by+25);
            }
        } else if(isList) {
            const size = tile - 30;
            const aspect = img.width / img.height;
            let dw = size, dh = size;
            if(zoom) {
                const scale = Math.max(size/img.width, size/img.height);
                dw = img.width * scale; dh = img.height * scale;
                ctx.save();
                ctx.beginPath(); ctx.roundRect(15, y+15, size, size, 20); ctx.clip();
                ctx.drawImage(img, 15 + (size-dw)/2, y + 15 + (size-dh)/2, dw, dh);
                ctx.restore();
            } else {
                if(aspect > 1) dh = size / aspect; else dw = size * aspect;
                ctx.drawImage(img, 15 + (size-dw)/2, y + 15 + (size-dh)/2, dw, dh);
            }
            ctx.fillStyle = '#ffffff'; ctx.font = `bold 42px sans-serif`; ctx.textAlign = 'left';
            let txt = ""; if(showRanks) txt += `#${i+1} `; if(showNames) txt += list[i].name;
            ctx.fillText(txt, tile + 30, y + (tile/2) + 15);
        } else {
            const aspect = img.width / img.height;
            let dw = tile, dh = tile;
            if(zoom) {
                const scale = Math.max(tile/img.width, tile/img.height);
                dw = img.width * scale; dh = img.height * scale;
                ctx.drawImage(img, x + (tile-dw)/2, y + (tile-dh)/2, dw, dh);
            } else {
                if(aspect > 1) dh = tile / aspect; else dw = tile * aspect;
                ctx.drawImage(img, x + (tile-dw)/2, y + (tile-dh)/2, dw, dh);
            }
            if(showRanks){ ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(x + 10, y + 10, 60, 60); ctx.fillStyle = 'white'; ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(i+1, x + 40, y + 50); }
            if(showNames){ ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x, y + tile - 50, tile, 50); ctx.fillStyle = 'white'; ctx.font = '20px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(list[i].name, x + tile/2, y + tile - 18); }
        }
    }
  });
  return canvas;
}

async function composeAndDownload(){
  const canvas = await getComposedCanvas();
  const a = document.createElement('a'); a.href = canvas.toDataURL('image/png'); a.download = `bgg_list_${Date.now()}.png`; a.click();
}

async function composeAndCopy(){
    const btn = document.getElementById('copyBtn');
    const originalText = btn.innerHTML;
    try {
        const canvas = await getComposedCanvas();
        canvas.toBlob(async (blob) => {
            const item = new ClipboardItem({ "image/png": blob });
            await navigator.clipboard.write([item]);
            btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
            setTimeout(() => btn.innerHTML = originalText, 2000);
        });
    } catch (err) { btn.innerHTML = '<i class="fa-solid fa-xmark"></i> Fail'; setTimeout(() => btn.innerHTML = originalText, 2000); }
}

function loadImage(src){ return new Promise(async (resolve)=>{ try{ const res = await fetch(src); const blob = await res.blob(); const url = URL.createObjectURL(blob); const img = new Image(); img.onload = ()=>{ URL.revokeObjectURL(url); resolve(img); }; img.onerror = ()=>resolve(null); img.src = url; }catch(e){ resolve(null); } }); }

async function fetchAPI(endpoint,user,queryParams=''){ 
  let url = `/api/bgg-helper?endpoint=${endpoint}${queryParams}`;
  for(let attempt=0; attempt<5; attempt++){
    let res; try{ res = await fetch(url); }catch(e){ await wait(1000*Math.pow(2,attempt)); continue; }
    if(res.status===202){ await wait(2000); continue; }
    if(res.ok) return await res.text();
    await wait(1500);
  }
}
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }
