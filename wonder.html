<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Wonder Walk - Thumbnails</title>
    <style>
        :root{--bg:#0f172a;--card:#0b1220;--accent:#7c3aed}
        html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,#071034 0%,#08132a 100%);color:#e6eef8}
        .wrap{max-width:1100px;margin:0 auto;padding:18px}
        header{display:flex;align-items:center;gap:16px;margin-bottom:14px}
        h1{margin:0;font-size:20px}
        .controls{display:flex;gap:12px;flex-wrap:wrap;background:rgba(255,255,255,0.03);padding:12px;border-radius:12px}
        input[type=text]{padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:inherit}
        label{font-size:13px;color:#cfe3ff}
        .btn{background:linear-gradient(90deg,var(--accent),#4f46e5);border:none;padding:10px 14px;border-radius:10px;color:white;font-weight:700;cursor:pointer}
        .btn-secondary{background:transparent;border:1px solid rgba(255,255,255,0.06);color:#cfe3ff}
        .settings{display:flex;align-items:center;gap:10px}
        .canvas-wrap{margin-top:16px;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));padding:14px;border-radius:12px;min-height:420px}
        .grid{position:relative;margin:0 auto;background:transparent;display:block}
        .cell-img{position:absolute;width:64px;height:64px;border-radius:6px;object-fit:cover;box-shadow:0 6px 18px rgba(2,6,23,0.6);transition:transform .08s linear}
        .stacked{transform:translateZ(0) scale(.98)}
        .status{margin-top:10px;color:#9fb7ff;font-size:13px}
        .options{display:flex;gap:12px;align-items:center}
        .small{font-size:13px;color:#9fb7ff}
        @media(max-width:640px){.cell-img{width:52px;height:52px}}
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <h1>Wonder Walk — Random thumbnail path</h1>
            <div style="flex:1"></div>
        </header>

        <div class="controls">
            <div>
                <label for="username">BGG Username</label><br>
                <input id="username" type="text" value="sportomax">
            </div>
            <div>
                <label for="stacking">Allow stacking (if path crosses)</label><br>
                <input id="stacking" type="checkbox"> <span class="small">(disabled by default)</span>
            </div>
            <div>
                <label for="filters">Collection Filters</label><br>
                <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">
                    <label style="font-size:13px"><input type="checkbox" id="f-own" checked> Own</label>
                    <label style="font-size:13px"><input type="checkbox" id="f-want"> Want</label>
                    <label style="font-size:13px"><input type="checkbox" id="f-wanttoplay"> WantToPlay</label>
                    <label style="font-size:13px"><input type="checkbox" id="f-fortrade"> ForTrade</label>
                    <label style="font-size:13px"><input type="checkbox" id="f-preordered"> Preordered</label>
                </div>
            </div>
            <div>
                <label for="delay">Delay per placement (ms)</label><br>
                <input id="delay" type="text" value="60" style="width:80px">
            </div>
            <div>
                <label for="gridLimit">Grid limit (max cols/rows)</label><br>
                <input id="gridLimit" type="text" value="25" style="width:80px"> <span class="small">(e.g. 25)</span>
            </div>
            <div>
                <label for="centerToggle">Center final layout</label><br>
                <input id="centerToggle" type="checkbox" checked>
            </div>
            <div>
                <label for="canvasMode">Use canvas renderer</label><br>
                <input id="canvasMode" type="checkbox">
            </div>
            <div style="margin-left:auto" class="settings">
                <button id="runBtn" class="btn">▶️ Run</button>
                <button id="stopBtn" class="btn-secondary">Stop</button>
                <button id="exportBtn" class="btn-secondary" style="margin-left:8px">Export Image</button>
            </div>
        </div>

        <div class="canvas-wrap">
            <progress id="progressBar" value="0" max="100" style="width:100%;height:10px;border-radius:6px;margin-bottom:8px"></progress>
            <div id="grid" class="grid"></div>
            <div id="status" class="status">Idle — press Run to load collection and begin.</div>
        </div>
    </div>

    <script>
    // Wonder Walk: random-walk placement of collection thumbnails
    (function(){
        const runBtn = document.getElementById('runBtn');
        const stopBtn = document.getElementById('stopBtn');
        const exportBtn = document.getElementById('exportBtn');
        const usernameEl = document.getElementById('username');
        const stackingEl = document.getElementById('stacking');
        const delayEl = document.getElementById('delay');
        const statusEl = document.getElementById('status');
        const gridEl = document.getElementById('grid');
        const gridLimitEl = document.getElementById('gridLimit');
        const centerEl = document.getElementById('centerToggle');
        const canvasModeEl = document.getElementById('canvasMode');
        const filterOwn = document.getElementById('f-own');
        const filterWant = document.getElementById('f-want');
        const filterWantToPlay = document.getElementById('f-wanttoplay');
        const filterForTrade = document.getElementById('f-fortrade');
        const filterPreordered = document.getElementById('f-preordered');

        let aborted = false;
        let lastPlacedList = null; // store last placed list for export
        let useCanvas = false;
        const imgCache = {}; // thumb url -> Image object (preloaded)

        function setStatus(s){ statusEl.textContent = s }

        function parseCollectionXml(xmlText){
            const parser = new DOMParser();
            const doc = parser.parseFromString(xmlText,'text/xml');
            const items = Array.from(doc.querySelectorAll('item')).map(it=>{
                const name = it.querySelector('name')?.textContent || '';
                const id = it.getAttribute('objectid') || it.getAttribute('id') || '';
                const thumb = it.querySelector('thumbnail')?.textContent || it.querySelector('image')?.textContent || '';
                const statusEl = it.querySelector('status');
                const status = {
                    own: statusEl ? statusEl.getAttribute('own')==='1' : false,
                    fortrade: statusEl ? statusEl.getAttribute('fortrade')==='1' : false,
                    want: statusEl ? statusEl.getAttribute('want')==='1' : false,
                    wanttoplay: statusEl ? statusEl.getAttribute('wanttoplay')==='1' : false,
                    preordered: statusEl ? statusEl.getAttribute('preordered')==='1' : false,
                };
                return {id,name,thumb,status};
            }).filter(i=>i.thumb);
            return items;
        }

        function shuffle(arr){ for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr }

        function key(x,y){return x+','+y}

        async function run(){
            aborted=false;
            gridEl.innerHTML='';
            setStatus('Loading collection...');
            const username = (usernameEl.value || 'sportomax').trim();
            try{
                const res = await fetch('/api/bgg-helper?endpoint=collection&username='+encodeURIComponent(username)+'&own=1&stats=1');
                const text = await res.text();
                const items = parseCollectionXml(text);
                // apply filters
                const filters = {
                    own: filterOwn.checked,
                    want: filterWant.checked,
                    wanttoplay: filterWantToPlay.checked,
                    fortrade: filterForTrade.checked,
                    preordered: filterPreordered.checked
                };
                const filtered = items.filter(it=>{
                    // if any filter is true, only keep items matching at least one true filter
                    if(Object.values(filters).every(v=>!v)) return true; // no filter set -> keep all
                    return (filters.own && it.status.own) || (filters.want && it.status.want) || (filters.wanttoplay && it.status.wanttoplay) || (filters.fortrade && it.status.fortrade) || (filters.preordered && it.status.preordered);
                });
                if(!filtered.length){ setStatus('No thumbnails found with selected filters.'); return }
                setStatus('Collection loaded: '+items.length+' images. Preparing walk...');
                await startWalk(filtered);
            }catch(e){ setStatus('Error loading collection: '+(e.message||e)); console.error(e) }
        }

        function ensureSize(cells){
            // compute bounds
            const xs = cells.map(c=>c.x); const ys = cells.map(c=>c.y);
            const minX = Math.min(...xs); const maxX = Math.max(...xs);
            const minY = Math.min(...ys); const maxY = Math.max(...ys);
            const cellW = getCellSize();
            const width = (maxX - minX +1)*cellW; const height = (maxY - minY +1)*cellW*1.4;
            gridEl.style.width = width + 'px'; gridEl.style.height = height + 'px';
            gridEl.dataset.minx = minX; gridEl.dataset.miny = minY; gridEl.dataset.cell = cellW;
            gridEl.style.margin = '0 auto';
            return {minX,maxX,minY,maxY,cellW}
        }

        function getCellSize(){ return window.innerWidth < 640 ? 52 : 64 }

        function renderPlaced(placed){
            // placed is array of {x,y,imgs: [item,...]}
            gridEl.innerHTML='';
            // compute bounds from placed in case dataset is missing
            const xs = placed.map(c=>c.x); const ys = placed.map(c=>c.y);
            const minX = Math.min(...xs); const maxX = Math.max(...xs);
            const minY = Math.min(...ys); const maxY = Math.max(...ys);
            const cellW = parseInt(gridEl.dataset.cell || getCellSize());

            // no zoom: compute centering based on raw size
            const parentWidth = gridEl.parentElement.clientWidth;
            const rawWidth = (maxX - minX + 1) * cellW;
            if(centerEl.checked){
                const ml = Math.max(0, Math.floor((parentWidth - rawWidth) / 2));
                gridEl.style.marginLeft = ml + 'px';
            } else {
                gridEl.style.marginLeft = '0px';
            }

            // render images
            placed.forEach(cell=>{
                const fx = (cell.x - minX) * cellW;
                const fy = (cell.y - minY) * cellW * 1.15;
                // show stacked images: topmost last
                cell.imgs.forEach((it,idx)=>{
                    const img = document.createElement('img');
                    img.src = it.thumb;
                    img.className = 'cell-img';
                    img.style.left = (fx + (idx*4)) + 'px';
                    img.style.top = (fy - (idx*6)) + 'px';
                    img.style.zIndex = 100 + idx;
                    if(idx>0) img.classList.add('stacked');
                    gridEl.appendChild(img);
                });
            });

            // store last placed layout for export (deep clone)
            try{ lastPlacedList = JSON.parse(JSON.stringify(placed)); }catch(e){ lastPlacedList = placed.slice(); }
        }

        async function startWalk(items){
            const allowStack = stackingEl.checked;
            const delay = Math.max(0, parseInt(delayEl.value) || 60);
            const imgs = shuffle(items.slice());
            const gridLimit = Math.max(1, parseInt(gridLimitEl.value||25));
            const progressBar = document.getElementById('progressBar');

            const totalItems = imgs.length + 1; // include first placed

            // preload unique thumbnails into imgCache for canvas rendering
            const uniqueUrls = Array.from(new Set(items.map(i=>i.thumb)));
            try{
                await Promise.all(uniqueUrls.map(u=>loadImage(u).then(im=>{ imgCache[u]=im }).catch(e=>{ /* ignore individual failures */ })));
            }catch(e){ console.warn('preload warning',e) }

            const placedMap = new Map(); // key-> array of imgs
            const placedList = [];
            let cx = 0, cy = 0;
            function mkPlacedItem(it){ return {thumb: it.thumb, id: it.id, name: it.name, placedAt: Date.now()} }
            const firstRaw = imgs.shift();
            const first = mkPlacedItem(firstRaw);
            placedMap.set(key(cx,cy), [first]);
            placedList.push({x:cx,y:cy,imgs:[first]});
            let currentX = cx, currentY = cy;
            setStatus('Placing 1 / '+(placedList.length + imgs.length));
            try{ if(progressBar) progressBar.value = 0 }catch(e){}

            // track bounds for layout calculation
            const cells = [{x:cx,y:cy}];

            // As we proceed, attempt random walk; if blocked, teleport to random placed cell
            for(let i=0;i<imgs.length;i++){
                if(aborted) { setStatus('Stopped by user.'); return }
                const it = imgs[i];
                // try up to 8 random direction attempts
                const dirs = shuffle([[1,0],[-1,0],[0,1],[0,-1]]);
                let placed=false;
                for(let attempt=0;attempt<dirs.length;attempt++){
                    const [dx,dy] = dirs[attempt];
                    const nx = currentX + dx, ny = currentY + dy;
                    // check grid limit if placing at nx,ny would expand bounds beyond limit
                    const minX = Math.min(...cells.map(c=>c.x), nx); const maxX = Math.max(...cells.map(c=>c.x), nx);
                    const minY = Math.min(...cells.map(c=>c.y), ny); const maxY = Math.max(...cells.map(c=>c.y), ny);
                    if((maxX - minX + 1) > gridLimit || (maxY - minY + 1) > gridLimit) { continue; }
                    const k = key(nx,ny);
                    if(placedMap.has(k)){
                        if(allowStack){ // stacking allowed -> push
                            const arr = placedMap.get(k);
                            const p = mkPlacedItem(it);
                            arr.push(p);
                            // update list entry
                            const idx = placedList.findIndex(c=>c.x===nx && c.y===ny);
                            if(idx>=0) placedList[idx].imgs.push(p); else placedList.push({x:nx,y:ny,imgs:[...arr]});
                            currentX = nx; currentY = ny; placed=true; break;
                        } else {
                            // cannot place here, continue trying other directions
                            continue;
                        }
                    } else {
                        // place new
                        const p = mkPlacedItem(it);
                        placedMap.set(k,[p]);
                        placedList.push({x:nx,y:ny,imgs:[p]});
                        currentX = nx; currentY = ny; placed=true; cells.push({x:nx,y:ny}); break;
                    }
                }

                if(!placed){
                    // blocked: try additional random attempts (choose random direction multiple times)
                    let extraPlaced=false;
                    for(let t=0;t<12;t++){
                        const rnd = Math.floor(Math.random()*4); const [dx,dy]=[[1,0],[-1,0],[0,1],[0,-1]][rnd];
                        const nx = currentX + dx, ny = currentY + dy; const k=key(nx,ny);
                        // check grid limit when attempting random adjacent
                        const minX2 = Math.min(...cells.map(c=>c.x), nx); const maxX2 = Math.max(...cells.map(c=>c.x), nx);
                        const minY2 = Math.min(...cells.map(c=>c.y), ny); const maxY2 = Math.max(...cells.map(c=>c.y), ny);
                        if((maxX2 - minX2 + 1) > gridLimit || (maxY2 - minY2 + 1) > gridLimit) continue;
                        if(placedMap.has(k) && !allowStack) continue;
                        if(placedMap.has(k) && allowStack){ const p = mkPlacedItem(it); placedMap.get(k).push(p); const idx=placedList.findIndex(c=>c.x===nx&&c.y===ny); if(idx>=0) placedList[idx].imgs.push(p); currentX=nx; currentY=ny; extraPlaced=true; break }
                        if(!placedMap.has(k)){ const p = mkPlacedItem(it); placedMap.set(k,[p]); placedList.push({x:nx,y:ny,imgs:[p]}); currentX=nx; currentY=ny; cells.push({x:nx,y:ny}); extraPlaced=true; break }
                    }
                    if(!extraPlaced){
                        // no adjacent placement found within grid/attempts
                        if(allowStack){
                            // stack onto a random placed cell
                            const randIdx = Math.floor(Math.random()*placedList.length);
                            const nx = placedList[randIdx].x; const ny = placedList[randIdx].y;
                            const p = mkPlacedItem(it);
                            placedMap.get(key(nx,ny)).push(p);
                            const idx = placedList.findIndex(c=>c.x===nx&&c.y===ny);
                            if(idx>=0) placedList[idx].imgs.push(p);
                            currentX = nx; currentY = ny;
                        } else {
                            // skip this item (can't place within grid limit and stacking disabled)
                            // do nothing and continue to next image
                        }
                    }
                }

                // update bounds and render (choose canvas or DOM) and update progress
                ensureSize(cells);
                if(canvasModeEl.checked){
                    renderCanvas(placedList);
                } else {
                    renderPlaced(placedList);
                }
                // update progress bar
                try{ if(progressBar){ const pct = Math.round((placedList.length / totalItems) * 100); progressBar.value = Math.min(100,pct); } }catch(e){}
                setStatus('Placed '+ (placedList.length) +' / '+ (totalItems));
                await new Promise(r=>setTimeout(r, delay));
            }

            setStatus('Done — placed '+(placedList.length)+' positions.');
            try{ if(progressBar) progressBar.value = 100 }catch(e){}
        }

        runBtn.addEventListener('click', ()=>{ if(!aborted) run(); });
        stopBtn.addEventListener('click', ()=>{ aborted=true; setStatus('Stopping...') });

        // helper: load image into an Image object (promise)
        function loadImage(url){
            return new Promise((resolve,reject)=>{
                const im = new Image(); im.crossOrigin = 'anonymous';
                im.onload = ()=>resolve(im); im.onerror = (e)=>reject(e); im.src = url;
            });
        }

        // Canvas renderer: create/get canvas element and size it
        function ensureCanvas(minX,maxX,minY,maxY,cellW){
            let cv = document.getElementById('cv');
            const cols = (maxX - minX + 1);
            const rows = (maxY - minY + 1);
            const scale = 1; // no zoom
            const rawW = cols * cellW;
            const rawH = Math.round(rows * cellW * 1.15);
            const outW = Math.max(1, Math.round(rawW * scale));
            const outH = Math.max(1, Math.round(rawH * scale));

            if(!cv){
                cv = document.createElement('canvas');
                cv.id = 'cv';
                cv.style.display = 'block';
                cv.style.margin = '0 auto';
                gridEl.parentElement.insertBefore(cv, gridEl);
            }

            cv.width = outW; cv.height = outH;
            cv.style.width = outW + 'px'; cv.style.height = outH + 'px';

            // hide the DOM grid when using canvas
            gridEl.style.display = canvasModeEl.checked ? 'none' : 'block';
            cv.style.display = canvasModeEl.checked ? 'block' : 'none';

            return cv;
        }

        // Draw placed layout to canvas (live renderer)
        function renderCanvas(placed){
            // compute bounds
            const xs = placed.map(c=>c.x); const ys = placed.map(c=>c.y);
            const minX = Math.min(...xs); const maxX = Math.max(...xs);
            const minY = Math.min(...ys); const maxY = Math.max(...ys);
            const cellW = parseInt(gridEl.dataset.cell || getCellSize());
            const scale = 1;

            const cv = ensureCanvas(minX,maxX,minY,maxY,cellW);
            const ctx = cv.getContext('2d');
            // clear and draw background
            ctx.fillStyle = '#071034'; ctx.fillRect(0,0,cv.width,cv.height);
            ctx.imageSmoothingEnabled = true;

            const imgW = cellW; const imgH = Math.round(cellW * 1); // square thumbs

            // draw each cell
            const now = Date.now();
            const animMs = 600; // animation duration
            placed.forEach(cell=>{
                const fx = Math.round((cell.x - minX) * cellW * scale);
                const fy = Math.round((cell.y - minY) * cellW * 1.15 * scale);
                cell.imgs.forEach((it,idx)=>{
                    const im = imgCache[it.thumb];
                    const placedAt = it.placedAt || 0;
                    const elapsed = Math.max(0, now - placedAt);
                    const t = Math.min(1, elapsed / animMs);
                    // ease-out
                    const ease = 1 - Math.pow(1 - t, 2);
                    const alpha = ease;
                    const scaleAnim = 0.7 + 0.3 * ease; // start slightly smaller

                    const dw = Math.round(imgW * scale * scaleAnim);
                    const dh = Math.round(imgH * scale * scaleAnim);
                    const dx = Math.round(fx + (idx*4*scale) - (dw - imgW*scale)/2);
                    const dy = Math.round(fy - (idx*6*scale) - (dh - imgH*scale)/2);

                    if(im){
                        ctx.save();
                        ctx.globalAlpha = alpha;
                        ctx.drawImage(im, dx, dy, dw, dh);
                        ctx.restore();
                    } else {
                        ctx.save();
                        ctx.globalAlpha = alpha;
                        ctx.fillStyle = '#22314a';
                        ctx.fillRect(dx, dy, dw, dh);
                        ctx.restore();
                    }
                });
            });

            // keep lastPlacedList for export
            try{ lastPlacedList = JSON.parse(JSON.stringify(placed)); }catch(e){ lastPlacedList = placed.slice(); }
        }

        // Export current layout (lastPlacedList) to PNG using canvas
        async function exportImage(){
            const placed = lastPlacedList;
            if(!placed || !placed.length){ setStatus('Nothing to export — run first.'); return }

            // compute bounds
            const xs = placed.map(c=>c.x); const ys = placed.map(c=>c.y);
            const minX = Math.min(...xs); const maxX = Math.max(...xs);
            const minY = Math.min(...ys); const maxY = Math.max(...ys);
            const cellW = parseInt(gridEl.dataset.cell || getCellSize());
            const imgW = cellW; const imgH = Math.round(cellW * (88/64));

            const scale = 1;
            const outW = Math.max(1, Math.round((maxX - minX + 1) * cellW * scale));
            const outH = Math.max(1, Math.round((maxY - minY + 1) * cellW * 1.15 * scale));

            setStatus('Preparing export...');

            // If we have an on-screen canvas (canvas mode), use it directly for export
            const cv = document.getElementById('cv');
            if(cv && canvasModeEl.checked){
                cv.toBlob(function(blob){
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'wonder-export.png';
                    document.body.appendChild(a); a.click(); a.remove();
                    setStatus('Export ready.');
                });
                return;
            }

            // build image map using cache if available, else load missing
            const urls = Array.from(new Set(placed.flatMap(c=>c.imgs.map(i=>i.thumb))));
            const imgMap = {};
            const missing = [];
            urls.forEach(u=>{ if(imgCache[u]) imgMap[u]=imgCache[u]; else missing.push(u) });
            try{
                const loads = await Promise.all(missing.map(u=>loadImage(u).then(im=>{ imgMap[u]=im }).catch(e=>{ console.warn('export load fail',u); })))
            }catch(e){ console.error(e) }

            // draw onto offscreen canvas
            const canvas = document.createElement('canvas');
            canvas.width = outW; canvas.height = outH;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#071034'; ctx.fillRect(0,0,outW,outH);
            ctx.imageSmoothingEnabled = true;
            // draw each cell and stacked items
            placed.forEach(cell=>{
                const fx = Math.round((cell.x - minX) * cellW * scale);
                const fy = Math.round((cell.y - minY) * cellW * 1.15 * scale);
                cell.imgs.forEach((it,idx)=>{
                    const im = imgMap[it.thumb];
                    if(!im) return;
                    const dx = Math.round(fx + (idx*4*scale));
                    const dy = Math.round(fy - (idx*6*scale));
                    const dw = Math.round(imgW * scale);
                    const dh = Math.round(imgH * scale);
                    ctx.drawImage(im, dx, dy, dw, dh);
                });
            });

            // download
            canvas.toBlob(function(blob){
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'wonder-export.png';
                document.body.appendChild(a); a.click(); a.remove();
                setStatus('Export ready.');
            });
        }

        exportBtn.addEventListener('click', ()=>{ exportImage().catch(e=>{ setStatus('Export failed'); console.error(e) }) });
    })();
    </script>
</body>
</html>
