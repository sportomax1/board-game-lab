<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Wonder Walk | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🌀</text></svg>">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html { height: 100%; }
        body {
            height: 100%; height: 100dvh; height: -webkit-fill-available;
            overflow: hidden; margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0b0f1a;
            color: #f8fafc;
        }

        /* ── Glass surfaces ── */
        .glass {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .glass-dark {
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        /* ── Form controls ── */
        .ctrl {
            appearance: none; -webkit-appearance: none;
            background: #0f172a;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 0.75rem;
            color: #f1f5f9;
            font-family: inherit; font-size: 14px; font-weight: 600;
            padding: 0.65rem 0.9rem; width: 100%; outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        .ctrl:focus { border-color: #8b5cf6; box-shadow: 0 0 0 2px rgba(139,92,246,.2); }
        .ctrl::placeholder { color: #334155; }

        /* ── Tab nav ── */
        .tab-btn {
            flex: 1; padding: 0.55rem 0.5rem;
            border: none; background: transparent;
            color: #64748b; font-weight: 800; font-size: 10px;
            text-transform: uppercase; letter-spacing: .07em;
            border-radius: 0.75rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 5px;
            transition: all .2s ease;
        }
        .tab-btn.active { background: rgba(139,92,246,.18); color: #a78bfa; }

        /* ── Views ── */
        .view {
            position: absolute; inset: 0;
            opacity: 0; pointer-events: none;
            transition: opacity .28s ease, transform .28s ease;
            transform: translateY(6px);
            overflow-y: auto; overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }
        .view.active {
            opacity: 1; pointer-events: auto;
            transform: translateY(0);
        }
        .view::-webkit-scrollbar { width: 3px; }
        .view::-webkit-scrollbar-track { background: transparent; }
        .view::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 10px; }

        /* ── Settings form ── */
        .settings-section { margin-bottom: 1rem; }
        .section-label {
            font-size: 9px; font-weight: 800; text-transform: uppercase;
            letter-spacing: .1em; color: #475569; margin-bottom: 0.5rem;
        }
        .settings-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 1.25rem; padding: 1rem; space-y: 0.75rem;
        }

        /* checkbox pill */
        .cpill {
            display: flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 0.75rem; padding: 0.55rem 0.75rem;
            cursor: pointer; font-size: 12px; font-weight: 700; color: #94a3b8;
            transition: background .15s, border-color .15s;
        }
        .cpill:has(input:checked) { background: rgba(139,92,246,.12); border-color: rgba(139,92,246,.3); color: #c4b5fd; }
        .cpill input { accent-color: #8b5cf6; width: 14px; height: 14px; }

        /* ── Walk canvas ── */
        #viewPage {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, #1e1b4b 0%, #0b0f1a 75%);
            padding: 1rem 1rem 5rem;
            min-height: 100%;
        }

        #grid {
            position: relative;
            transform-origin: center;
            transition: transform .3s ease;
        }

        .cell-img {
            position: absolute;
            width: 54px; height: 54px;
            border-radius: 8px; object-fit: cover;
            box-shadow: 0 4px 14px rgba(0,0,0,.55);
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform .2s cubic-bezier(0.175,0.885,0.32,1.275);
        }

        /* ── Progress bar ── */
        #progressBar {
            position: fixed; top: 0; left: 0;
            width: 0%; height: 2px;
            background: #8b5cf6;
            box-shadow: 0 0 8px rgba(139,92,246,.6);
            transition: width .3s;
            z-index: 1000;
        }

        /* ── FABs ── */
        .fab-row {
            position: fixed;
            bottom: max(1.25rem, env(safe-area-inset-bottom));
            left: 50%; transform: translateX(-50%);
            display: flex; gap: 0.75rem; z-index: 200;
            transition: opacity .2s, transform .2s;
        }
        .fab-row.hidden { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(12px); }

        .fab {
            height: 50px; padding: 0 1.25rem;
            border-radius: 25px; border: none;
            font-weight: 800; font-size: 12px; letter-spacing: .03em;
            display: flex; align-items: center; gap: 6px;
            cursor: pointer; transition: transform .1s;
            box-shadow: 0 8px 24px rgba(0,0,0,.4);
        }
        .fab:active { transform: scale(.95); }
        .fab-primary { background: linear-gradient(135deg,#8b5cf6,#6366f1); color: white; }
        .fab-ghost   { background: rgba(255,255,255,.1); backdrop-filter: blur(12px); color: white; }

        /* ── Tooltip ── */
        #stackTooltip {
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,.88); color: #f1f5f9;
            padding: 8px 16px; border-radius: 20px; font-size: 11px; font-weight: 600;
            pointer-events: none; z-index: 300; white-space: nowrap;
            border: 1px solid rgba(255,255,255,.1);
        }

        /* ── Animations ── */
        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin .9s linear infinite; }
        @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
        .anim { animation: fadeUp .3s ease-out both; }

        @media (min-width: 768px) {
            #settingsPage { max-width: 520px; margin: 0 auto; }
        }
    </style>
</head>
<body>

<!-- Progress bar -->
<div id="progressBar"></div>

<!-- Background glow -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
    <div class="absolute -top-20 -left-20 w-[50%] h-[50%] bg-violet-900/20 blur-[120px] rounded-full"></div>
    <div class="absolute bottom-0 right-0 w-[45%] h-[40%] bg-indigo-900/15 blur-[120px] rounded-full"></div>
</div>

<!-- App shell -->
<div class="relative z-10 flex flex-col" style="height:100dvh;height:-webkit-fill-available;">

    <!-- ── Header ── -->
    <header class="shrink-0 border-b border-white/5 bg-black/40 backdrop-blur-md"
            style="padding: max(10px,env(safe-area-inset-top)) max(1rem,env(safe-area-inset-right)) 10px max(1rem,env(safe-area-inset-left));">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-violet-500/20 rounded-xl flex items-center justify-center border border-violet-500/30 shrink-0">
                <i data-lucide="wind" class="w-4 h-4 text-violet-400"></i>
            </div>
            <div class="flex-1 min-w-0">
                <h1 class="text-[17px] font-black italic uppercase tracking-tighter leading-none text-white">Wonder <span class="text-violet-400">Walk</span></h1>
                <p id="statusEl" class="text-[8.5px] font-bold text-slate-500 uppercase tracking-widest mt-0.5 truncate">Random walk through your collection</p>
            </div>
            <button id="exportBtn" class="glass p-2.5 rounded-xl text-slate-400 hover:text-white transition-colors shrink-0" title="Share / Save PNG">
                <i data-lucide="share-2" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <!-- ── Tab nav ── -->
    <div class="shrink-0 border-b border-white/5 px-3 py-1.5">
        <div class="glass rounded-2xl flex p-1 gap-1 max-w-xs mx-auto">
            <button id="nav-settings" class="tab-btn active" onclick="switchTab('settings')">
                <i data-lucide="settings" class="w-3 h-3"></i> Settings
            </button>
            <button id="nav-view" class="tab-btn" onclick="switchTab('view')">
                <i data-lucide="layout-grid" class="w-3 h-3"></i> View
            </button>
        </div>
    </div>

    <!-- ── Content ── -->
    <div class="flex-1 relative overflow-hidden min-h-0">

        <!-- Settings page -->
        <div id="settingsPage" class="view active px-4 py-3">
            <div class="settings-section anim">
                <div class="section-label">BGG Profile</div>
                <div class="settings-card">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1.5">Username</label>
                    <input id="username" type="text" class="ctrl" value="sportomax" placeholder="BGG Username"
                        autocorrect="off" autocapitalize="none" spellcheck="false">
                </div>
            </div>

            <div class="settings-section">
                <div class="section-label">Collection Filters</div>
                <div class="settings-card">
                    <div class="grid grid-cols-2 gap-2">
                        <label class="cpill"><input type="checkbox" id="f-own" checked> Own</label>
                        <label class="cpill"><input type="checkbox" id="f-want"> Want</label>
                        <label class="cpill"><input type="checkbox" id="f-wanttoplay"> Want to Play</label>
                        <label class="cpill"><input type="checkbox" id="f-fortrade"> For Trade</label>
                        <label class="cpill"><input type="checkbox" id="f-preordered"> Preordered</label>
                    </div>
                </div>
            </div>

            <div class="settings-section">
                <div class="section-label">Walk Parameters</div>
                <div class="settings-card space-y-3">
                    <div class="grid grid-cols-2 gap-2">
                        <label class="cpill"><input type="checkbox" id="stacking"> Allow Stacking</label>
                        <label class="cpill"><input type="checkbox" id="centerToggle" checked> Center Grid</label>
                        <label class="cpill"><input type="checkbox" id="enableGridLimit"> Limit Grid Size</label>
                    </div>
                    <div class="grid grid-cols-2 gap-2 pt-1">
                        <div>
                            <label class="text-[9px] font-black text-slate-500 uppercase tracking-widest block mb-1">Grid Limit</label>
                            <input id="gridLimit" type="number" class="ctrl" value="5" min="2" max="50">
                        </div>
                        <div>
                            <label class="text-[9px] font-black text-slate-500 uppercase tracking-widest block mb-1">Delay (ms)</label>
                            <input id="delay" type="number" class="ctrl" value="60" min="0" max="2000">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Run button inside settings -->
            <button onclick="run()"
                class="w-full py-4 rounded-2xl font-black text-sm italic uppercase tracking-tighter text-white active:scale-95 transition-transform flex items-center justify-center gap-2 mb-4"
                style="background:linear-gradient(135deg,#8b5cf6,#6366f1);box-shadow:0 6px 20px rgba(139,92,246,.35);">
                <i data-lucide="play" class="w-4 h-4"></i>
                Run Walk
            </button>
        </div>

        <!-- View page -->
        <div id="viewPage" class="view">
            <div id="grid" class="grid"></div>
        </div>

    </div><!-- /content -->

</div><!-- /app shell -->

<!-- FABs (view tab only) -->
<div class="fab-row hidden" id="fabRow">
    <button id="runBtn" class="fab fab-primary">
        <i data-lucide="play" class="w-4 h-4"></i> Run Walk
    </button>
    <button id="stopBtn" class="fab fab-ghost">
        <i data-lucide="square" class="w-4 h-4"></i>
    </button>
</div>

<!-- Stack tooltip -->
<div id="stackTooltip" style="display:none"></div>

<script>
lucide.createIcons();

// ── Tab navigation ──────────────────────────────────────────────────────
function switchTab(tab) {
    ['settings','view'].forEach(t => {
        document.getElementById(t + 'Page').classList.remove('active');
        document.getElementById('nav-' + t).classList.remove('active');
    });
    document.getElementById(tab + 'Page').classList.add('active');
    document.getElementById('nav-' + tab).classList.add('active');

    const fabs = document.getElementById('fabRow');
    if (tab === 'view') fabs.classList.remove('hidden');
    else fabs.classList.add('hidden');
}

// ── Core walk logic (unchanged) ─────────────────────────────────────────
(function(){
    const runBtn     = document.getElementById('runBtn');
    const stopBtn    = document.getElementById('stopBtn');
    const exportBtn  = document.getElementById('exportBtn');
    const usernameEl = document.getElementById('username');
    const stackingEl = document.getElementById('stacking');
    const delayEl    = document.getElementById('delay');
    const gridEl     = document.getElementById('grid');
    const gridLimitEl       = document.getElementById('gridLimit');
    const enableGridLimitEl = document.getElementById('enableGridLimit');
    const progressBar       = document.getElementById('progressBar');
    const filters = ['f-own','f-want','f-wanttoplay','f-fortrade','f-preordered'];

    let aborted = false;
    let lastPlacedList = null;

    function setStatus(s) { document.getElementById('statusEl').textContent = s; }

    function parseCollectionXml(xmlText) {
        const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
        return Array.from(doc.querySelectorAll('item')).map(it => {
            const thumb = it.querySelector('thumbnail')?.textContent || it.querySelector('image')?.textContent || '';
            const st = it.querySelector('status');
            return {
                name:  it.querySelector('name')?.textContent || 'Game',
                thumb,
                status: {
                    own:        st?.getAttribute('own')        === '1',
                    fortrade:   st?.getAttribute('fortrade')   === '1',
                    want:       st?.getAttribute('want')        === '1',
                    wanttoplay: st?.getAttribute('wanttoplay') === '1',
                    preordered: st?.getAttribute('preordered') === '1',
                }
            };
        }).filter(i => i.thumb);
    }

    async function fetchWithRetries(url, retries = 4) {
        for (let i = 0; i <= retries; i++) {
            try {
                const res = await fetch(url);
                if (res.status === 202 || res.status === 429) {
                    await new Promise(r => setTimeout(r, 2500 * (i+1)));
                    continue;
                }
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return await res.text();
            } catch (err) {
                if (i === retries) return null;
                await new Promise(r => setTimeout(r, 600 * Math.pow(2, i)));
            }
        }
    }

    async function run() {
        switchTab('view');
        aborted = false;
        gridEl.innerHTML = '';
        progressBar.style.width = '0%';
        setStatus('Connecting to BGG…');

        const username = (usernameEl.value || 'sportomax').trim();
        try {
            const text = await fetchWithRetries(
                '/api/bgg-helper?endpoint=collection&username=' + encodeURIComponent(username) + '&own=1&stats=1'
            );
            if (!text) throw new Error('API timeout');

            const items = parseCollectionXml(text);
            const activeFilters = filters.reduce((acc, f) => {
                acc[f.replace('f-','')] = document.getElementById(f).checked;
                return acc;
            }, {});

            const filtered = items.filter(it => {
                if (Object.values(activeFilters).every(v => !v)) return true;
                return (activeFilters.own && it.status.own) ||
                       (activeFilters.want && it.status.want) ||
                       (activeFilters.wanttoplay && it.status.wanttoplay) ||
                       (activeFilters.fortrade && it.status.fortrade) ||
                       (activeFilters.preordered && it.status.preordered);
            });

            if (!filtered.length) { setStatus('No games found'); return; }
            setStatus('Walking…');
            await startWalk(filtered);
        } catch(e) { setStatus('Error: ' + e.message); }
    }

    function renderPlaced(placed) {
        gridEl.innerHTML = '';
        const xs = placed.map(c => c.x), ys = placed.map(c => c.y);
        const minX = Math.min(...xs), minY = Math.min(...ys);
        const maxX = Math.max(...xs), maxY = Math.max(...ys);
        const cellW = 54, gap = 4;

        placed.forEach(cell => {
            const fx = (cell.x - minX) * (cellW + gap);
            const fy = (cell.y - minY) * (cellW + gap);
            const wrapper = document.createElement('div');
            wrapper.style.cssText = `position:absolute;left:${fx}px;top:${fy}px;width:${cellW}px;height:${cellW}px`;

            cell.imgs.forEach((it, idx) => {
                const img = document.createElement('img');
                img.src = it.thumb;
                img.className = 'cell-img';
                img.style.left = (idx * 3) + 'px';
                img.style.top  = (-(idx * 4)) + 'px';
                img.style.zIndex = 10 + idx;
                wrapper.appendChild(img);
            });

            if (cell.imgs.length > 1) {
                wrapper.onclick = () => {
                    const tip = document.getElementById('stackTooltip');
                    tip.textContent = cell.imgs.map(i => i.name).join(', ');
                    tip.style.display = 'block';
                    clearTimeout(tip._t);
                    tip._t = setTimeout(() => { tip.style.display = 'none'; }, 2500);
                };
            }
            gridEl.appendChild(wrapper);
        });

        const gw = (maxX - minX + 1) * (cellW + gap);
        const gh = (maxY - minY + 1) * (cellW + gap);
        gridEl.style.width  = gw + 'px';
        gridEl.style.height = gh + 'px';
        lastPlacedList = JSON.parse(JSON.stringify(placed));
    }

    async function startWalk(items) {
        const shuffle = a => a.sort(() => Math.random() - 0.5);
        const imgs = shuffle(items.slice());
        const delayMs   = Math.max(0, parseInt(delayEl.value) || 60);
        const gridLimit = parseInt(gridLimitEl.value) || 5;

        const placedMap  = new Map();
        const placedList = [];
        let currentX = 0, currentY = 0;
        const cells = [{x:0, y:0}];

        const first = imgs.shift();
        placedMap.set('0,0', [{thumb: first.thumb, name: first.name}]);
        placedList.push({x:0, y:0, imgs:[{thumb: first.thumb, name: first.name}]});

        for (let i = 0; i < imgs.length; i++) {
            if (aborted) break;
            const it = imgs[i];
            const dirs = shuffle([[1,0],[-1,0],[0,1],[0,-1]]);
            let placed = false;

            for (const d of dirs) {
                const nx = currentX + d[0], ny = currentY + d[1];
                const k = nx + ',' + ny;
                if (enableGridLimitEl.checked) {
                    const txs = cells.map(c=>c.x).concat(nx);
                    const tys = cells.map(c=>c.y).concat(ny);
                    if (Math.max(...txs)-Math.min(...txs)+1 > gridLimit ||
                        Math.max(...tys)-Math.min(...tys)+1 > gridLimit) continue;
                }
                if (!placedMap.has(k)) {
                    const p = {thumb: it.thumb, name: it.name};
                    placedMap.set(k, [p]);
                    placedList.push({x:nx, y:ny, imgs:[p]});
                    cells.push({x:nx, y:ny});
                    currentX = nx; currentY = ny;
                    placed = true;
                    break;
                }
            }

            if (!placed && stackingEl.checked) {
                const rand = placedList[Math.floor(Math.random() * placedList.length)];
                rand.imgs.push({thumb: it.thumb, name: it.name});
                currentX = rand.x; currentY = rand.y;
            }

            renderPlaced(placedList);
            progressBar.style.width = ((i / imgs.length) * 100) + '%';
            setStatus(`Placed ${placedList.length} spots · ${imgs.length - i} left`);
            await new Promise(r => setTimeout(r, delayMs));
        }
        setStatus('Done · ' + placedList.length + ' spots placed');
        progressBar.style.width = '100%';
    }

    async function exportImage() {
        if (!lastPlacedList) { setStatus('Run a walk first'); return; }
        setStatus('Generating PNG…');
        const cellW = 54, gap = 4;
        const xs = lastPlacedList.map(c=>c.x), ys = lastPlacedList.map(c=>c.y);
        const minX = Math.min(...xs), minY = Math.min(...ys);
        const maxX = Math.max(...xs), maxY = Math.max(...ys);

        const canvas  = document.createElement('canvas');
        canvas.width  = (maxX - minX + 1) * (cellW + gap);
        canvas.height = (maxY - minY + 1) * (cellW + gap);
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#0b0f1a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (const cell of lastPlacedList) {
            const x = (cell.x - minX) * (cellW + gap);
            const y = (cell.y - minY) * (cellW + gap);
            for (const it of cell.imgs) {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.src = '/api/image-proxy?url=' + encodeURIComponent(it.thumb);
                await new Promise(r => { img.onload = r; img.onerror = r; });
                if (img.complete) ctx.drawImage(img, x, y, cellW, cellW);
            }
        }

        // Try Web Share API with file first (iOS Safari, Android Chrome, etc.)
        if (navigator.canShare) {
            try {
                const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
                const file = new File([blob], 'wonderwalk.png', { type: 'image/png' });
                if (navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        title: 'Wonder Walk',
                        text: 'My BGG collection random walk',
                        files: [file]
                    });
                    setStatus('Shared ✓');
                    return;
                }
            } catch (e) {
                if (e.name === 'AbortError') { setStatus('Cancelled'); return; }
                // Share failed for another reason — fall through to download
            }
        }

        // Fallback: direct download
        const link = document.createElement('a');
        link.download = 'wonderwalk.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        setStatus('Saved ✓');
    }

    runBtn.addEventListener('click', run);
    stopBtn.addEventListener('click', () => { aborted = true; setStatus('Stopped'); progressBar.style.width = '0%'; });
    exportBtn.addEventListener('click', exportImage);

    lucide.createIcons();

    // expose run globally for the settings button
    window.run = run;
})();
</script>
</body>
</html>
