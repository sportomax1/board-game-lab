<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>BGG User Profile</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>👤</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { padding: max(env(safe-area-inset-top), 0) max(env(safe-area-inset-right), 0) max(env(safe-area-inset-bottom), 0) max(env(safe-area-inset-left), 0); }
        input, select, button { font-size: 16px; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <div id="settingsModal" class="fixed inset-0 bg-gradient-to-br from-blue-900 to-cyan-900 z-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-3xl shadow-2xl p-6 md:p-8 max-w-md w-full my-4">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-2 text-center">👤 User Profile</h1>
            <p class="text-gray-500 text-center text-base mb-6">View BGG user details</p>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">BGG Username</label>
                    <input type="text" id="username" class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 focus:border-blue-500 outline-none" value="sportomax">
                </div>
                <button onclick="loadUser()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-blue-700 transition shadow-lg">Load Profile</button>
            </div>
        </div>
    </div>
    <div id="infoModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-6 max-w-md w-full">
            <h2 class="text-2xl font-bold text-gray-900 mb-4">ℹ️ About</h2>
            <p class="text-gray-700">Displays comprehensive BoardGameGeek user information including stats, location, and account details.</p>
            <button onclick="closeInfo()" class="w-full mt-6 bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700">Got it!</button>
        </div>
    </div>
    <div id="app" class="hidden flex-1 flex flex-col">
        <header class="bg-white shadow-sm sticky top-0 z-30 px-4 py-3">
            <div class="max-w-4xl mx-auto flex items-center justify-between">
                <h1 class="font-bold text-xl text-gray-900">👤 User Profile</h1>
                <div class="flex gap-2">
                    <button onclick="showInfo()" class="p-2 text-blue-500 hover:bg-blue-50 rounded-lg">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"/><path stroke-linecap="round" d="M12 16v-4m0-4h.01"/></svg>
                    </button>
                    <button onclick="showSettings()" class="p-2 text-gray-500 hover:bg-gray-100 rounded-lg">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    </button>
                </div>
            </div>
        </header>
        <main class="flex-1 p-4 max-w-4xl mx-auto w-full" id="userContent">
        </main>
    </div>
    <script>
        async function loadUser() {
            const username = document.getElementById('username').value.trim() || 'sportomax';
            document.getElementById('settingsModal').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            try {
                // Load user profile with all parameters
                const res = await fetch(`/api/bgg-helper?endpoint=user&name=${encodeURIComponent(username)}&buddies=1&guilds=1&hot=1&top=1&domain=boardgame`);
                const xml = await res.text();
                const parser = new DOMParser().parseFromString(xml, 'text/xml');
                const user = parser.querySelector('user');
                
                const userData = {
                    id: user.getAttribute('id'),
                    name: user.getAttribute('name'),
                    firstName: user.querySelector('firstname')?.getAttribute('value') || 'N/A',
                    lastName: user.querySelector('lastname')?.getAttribute('value') || 'N/A',
                    avatarLink: user.querySelector('avatarlink')?.getAttribute('value') || '',
                    yearRegistered: user.querySelector('yearregistered')?.getAttribute('value') || 'N/A',
                    lastLogin: user.querySelector('lastlogin')?.getAttribute('value') || 'N/A',
                    stateOrProvince: user.querySelector('stateorprovince')?.getAttribute('value') || 'N/A',
                    country: user.querySelector('country')?.getAttribute('value') || 'N/A',
                    webAddress: user.querySelector('webaddress')?.getAttribute('value') || '',
                    xboxAccount: user.querySelector('xboxaccount')?.getAttribute('value') || '',
                    wiiiAccount: user.querySelector('wiiiAccount')?.getAttribute('value') || '',
                    psnAccount: user.querySelector('psnaccount')?.getAttribute('value') || '',
                    battleNetAccount: user.querySelector('battlenetaccount')?.getAttribute('value') || '',
                    steamAccount: user.querySelector('steamaccount')?.getAttribute('value') || '',
                    tradeRating: user.querySelector('traderating')?.getAttribute('value') || '0',
                    buddies: Array.from(user.querySelectorAll('buddy')).map(b => ({
                        id: b.getAttribute('id'),
                        name: b.getAttribute('name')
                    })),
                    guilds: Array.from(user.querySelectorAll('guild')).map(g => ({
                        id: g.getAttribute('id'),
                        name: g.getAttribute('name')
                    })),
                    topGames: Array.from(user.querySelectorAll('top item')).map(item => ({
                        id: item.getAttribute('id'),
                        name: item.getAttribute('name'),
                        rank: item.getAttribute('rank')
                    })),
                    hotGames: Array.from(user.querySelectorAll('hot item')).map(item => ({
                        id: item.getAttribute('id'),
                        name: item.getAttribute('name'),
                        rank: item.getAttribute('rank')
                    }))
                };
                
                displayUser(userData);
            } catch (error) {
                console.error('User load error:', error);
                alert('Error: ' + error.message);
                location.reload();
            }
        }

        function displayUser(user) {
            const html = `
                <div class="space-y-4">
                    ${user.avatarLink ? `<div class="bg-white rounded-xl shadow-sm p-6 text-center">
                        <img src="${user.avatarLink}" class="w-32 h-32 rounded-full mx-auto mb-4 border-4 border-blue-500">
                        <h2 class="text-2xl font-bold text-gray-900">${user.name}</h2>
                        <p class="text-gray-600">${user.firstName} ${user.lastName}</p>
                    </div>` : ''}
                    
                    <div class="bg-white rounded-xl shadow-sm p-6">
                        <h3 class="font-bold text-lg mb-4 text-gray-900">Account Info</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <div class="p-3 bg-gray-50 rounded-lg">
                                <p class="text-xs text-gray-600">User ID</p>
                                <p class="font-bold text-gray-900">${user.id}</p>
                            </div>
                            <div class="p-3 bg-gray-50 rounded-lg">
                                <p class="text-xs text-gray-600">Username</p>
                                <p class="font-bold text-gray-900">${user.name}</p>
                            </div>
                            <div class="p-3 bg-gray-50 rounded-lg">
                                <p class="text-xs text-gray-600">Year Registered</p>
                                <p class="font-bold text-gray-900">${user.yearRegistered}</p>
                            </div>
                            <div class="p-3 bg-gray-50 rounded-lg">
                                <p class="text-xs text-gray-600">Last Login</p>
                                <p class="font-bold text-gray-900">${user.lastLogin}</p>
                            </div>
                            <div class="p-3 bg-gray-50 rounded-lg">
                                <p class="text-xs text-gray-600">Trade Rating</p>
                                <p class="font-bold text-gray-900">${user.tradeRating}</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="bg-white rounded-xl shadow-sm p-6">
                        <h3 class="font-bold text-lg mb-4 text-gray-900">Location</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <div class="p-3 bg-gray-50 rounded-lg">
                                <p class="text-xs text-gray-600">State/Province</p>
                                <p class="font-bold text-gray-900">${user.stateOrProvince}</p>
                            </div>
                            <div class="p-3 bg-gray-50 rounded-lg">
                                <p class="text-xs text-gray-600">Country</p>
                                <p class="font-bold text-gray-900">${user.country}</p>
                            </div>
                        </div>
                    </div>
                    
                    ${user.webAddress || user.steamAccount || user.xboxAccount ? `
                    <div class="bg-white rounded-xl shadow-sm p-6">
                        <h3 class="font-bold text-lg mb-4 text-gray-900">Gaming Accounts</h3>
                        <div class="space-y-2">
                            ${user.webAddress ? `<div class="p-3 bg-gray-50 rounded-lg"><p class="text-xs text-gray-600">Website</p><a href="${user.webAddress}" target="_blank" class="font-medium text-blue-600 hover:underline break-all">${user.webAddress}</a></div>` : ''}
                            ${user.steamAccount ? `<div class="p-3 bg-gray-50 rounded-lg"><p class="text-xs text-gray-600">Steam</p><p class="font-bold text-gray-900">${user.steamAccount}</p></div>` : ''}
                            ${user.xboxAccount ? `<div class="p-3 bg-gray-50 rounded-lg"><p class="text-xs text-gray-600">Xbox</p><p class="font-bold text-gray-900">${user.xboxAccount}</p></div>` : ''}
                            ${user.psnAccount ? `<div class="p-3 bg-gray-50 rounded-lg"><p class="text-xs text-gray-600">PSN</p><p class="font-bold text-gray-900">${user.psnAccount}</p></div>` : ''}
                            ${user.battleNetAccount ? `<div class="p-3 bg-gray-50 rounded-lg"><p class="text-xs text-gray-600">Battle.net</p><p class="font-bold text-gray-900">${user.battleNetAccount}</p></div>` : ''}
                        </div>
                    </div>
                    ` : ''}
                    
                    ${user.buddies && user.buddies.length > 0 ? `
                    <div class="bg-white rounded-xl shadow-sm p-6">
                        <h3 class="font-bold text-lg mb-4 text-gray-900">Buddies (${user.buddies.length})</h3>
                        <div class="flex flex-wrap gap-2">
                            ${user.buddies.map(b => `<button onclick="loadBuddy('${b.name}')" class="px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-sm hover:bg-blue-200 cursor-pointer transition font-medium">${b.name}</button>`).join('')}
                        </div>
                    </div>
                    ` : ''}
                    
                    ${user.guilds && user.guilds.length > 0 ? `
                    <div class="bg-white rounded-xl shadow-sm p-6">
                        <h3 class="font-bold text-lg mb-4 text-gray-900">Guilds (${user.guilds.length})</h3>
                        <div class="flex flex-wrap gap-2">
                            ${user.guilds.map(g => `<a href="https://boardgamegeek.com/guild/${g.id}" target="_blank" class="px-3 py-1 bg-purple-100 text-purple-800 rounded-full text-sm hover:bg-purple-200">${g.name}</a>`).join('')}
                        </div>
                    </div>
                    ` : ''}
                    
                    ${user.topGames && user.topGames.length > 0 ? `
                    <div class="bg-white rounded-xl shadow-sm p-6">
                        <h3 class="font-bold text-lg mb-4 text-gray-900">Top 10 Games</h3>
                        <div class="space-y-2">
                            ${user.topGames.map(g => `
                                <a href="https://boardgamegeek.com/boardgame/${g.id}" target="_blank" class="flex items-center gap-3 p-3 bg-gray-50 rounded-lg hover:bg-gray-100">
                                    <span class="font-bold text-gray-900 w-6">${g.rank}.</span>
                                    <span class="flex-1 text-gray-900">${g.name}</span>
                                </a>
                            `).join('')}
                        </div>
                    </div>
                    ` : ''}
                    
                    ${user.hotGames && user.hotGames.length > 0 ? `
                    <div class="bg-white rounded-xl shadow-sm p-6">
                        <h3 class="font-bold text-lg mb-4 text-gray-900">🔥 Hot 10 Games</h3>
                        <div class="space-y-2">
                            ${user.hotGames.map(g => `
                                <a href="https://boardgamegeek.com/boardgame/${g.id}" target="_blank" class="flex items-center gap-3 p-3 bg-orange-50 rounded-lg hover:bg-orange-100">
                                    <span class="font-bold text-orange-600 w-6">${g.rank}.</span>
                                    <span class="flex-1 text-gray-900">${g.name}</span>
                                </a>
                            `).join('')}
                        </div>
                    </div>
                    ` : ''}
                </div>
            `;
            document.getElementById('userContent').innerHTML = html;
        }

        function showSettings() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function showInfo() { document.getElementById('infoModal').classList.remove('hidden'); }
        function closeInfo() { document.getElementById('infoModal').classList.add('hidden'); }
        
        function loadBuddy(buddyName) {
            document.getElementById('username').value = buddyName;
            loadUser();
        }
    </script>
</body>
</html>
