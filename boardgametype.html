<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>BGG Game Types</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
    }

    .tab-button {
      transition: all 0.2s ease;
      position: relative;
    }

    .tab-button.active {
      color: #6366f1;
      font-weight: 700;
    }

    .tab-button.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 3px;
      background: #6366f1;
      border-radius: 3px 3px 0 0;
    }

    .type-card {
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .type-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
    }

    .type-card:active {
      transform: scale(0.98);
    }

    .skeleton {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    .modal-content {
      background: white;
      border-radius: 1rem;
      width: 90%;
      max-width: 56rem;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0,0,0,0.15);
    }

    .modal-header {
      border-bottom: 1px solid #e2e8f0;
      padding: 1rem;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .modal-games-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      space-y: 1rem;
    }
  </style>
</head>
<body class="pb-20">

  <header class="sticky top-0 z-30 w-full bg-white/80 backdrop-blur-md border-b px-4 py-4 shadow-sm">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 text-white p-2 rounded-lg">
          <i class="fa-solid fa-dice-d20"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">Game Types</h1>
          <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Categories & More</p>
        </div>
      </div>
      <div id="statsBox" class="text-right hidden">
        <div class="text-2xl font-bold text-indigo-600" id="gameCount">0</div>
        <div class="text-[10px] text-slate-500 uppercase font-bold">Games</div>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6">
    
    <!-- Fetch Section -->
    <div id="fetchSection" class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
      <h2 class="text-xl font-bold mb-4">Load Collection</h2>
      <div class="space-y-4">
        <div>
          <label class="text-xs font-bold text-slate-500 uppercase mb-2 block">BGG Username</label>
          <input 
            id="username" 
            type="text" 
            value="sportomax" 
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all"
          >
        </div>
        <button 
          onclick="fetchCollection()" 
          id="fetchBtn"
          class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold hover:bg-indigo-700 shadow-lg shadow-indigo-100 flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-download"></i> Load Games
        </button>
      </div>
    </div>

    <!-- Loading Section -->
    <div id="loadingSection" class="hidden">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
        <div class="flex items-center justify-center gap-3 mb-4">
          <i class="fa-solid fa-circle-notch fa-spin text-indigo-600 text-2xl"></i>
          <span class="font-bold text-slate-700">Loading collection...</span>
        </div>
        <div class="text-sm text-slate-500 text-center" id="loadingStatus">Fetching games...</div>
        <div class="mt-4 bg-slate-100 rounded-full h-2 overflow-hidden">
          <div id="progressBar" class="bg-indigo-600 h-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- Tabs Section -->
    <div id="tabsSection" class="hidden bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="flex overflow-x-auto border-b border-slate-100 px-2">
        <button class="tab-button active px-4 py-3 text-sm font-medium whitespace-nowrap" data-tab="category">
          Categories
        </button>
        <button class="tab-button px-4 py-3 text-sm font-medium text-slate-600 whitespace-nowrap" data-tab="mechanic">
          Mechanics
        </button>
        <button class="tab-button px-4 py-3 text-sm font-medium text-slate-600 whitespace-nowrap" data-tab="family">
          Families
        </button>
        <button class="tab-button px-4 py-3 text-sm font-medium text-slate-600 whitespace-nowrap" data-tab="designer">
          Designers
        </button>
        <button class="tab-button px-4 py-3 text-sm font-medium text-slate-600 whitespace-nowrap" data-tab="artist">
          Artists
        </button>
        <button class="tab-button px-4 py-3 text-sm font-medium text-slate-600 whitespace-nowrap" data-tab="publisher">
          Publishers
        </button>
      </div>

      <!-- Search Filter -->
      <div class="p-4 border-b border-slate-100">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search..." 
          oninput="filterTypes()"
          class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all"
        >
      </div>

      <!-- Tab Content -->
      <div class="p-4">
        <div id="category-content" class="tab-content">
          <div id="category-list" class="space-y-2"></div>
        </div>
        <div id="mechanic-content" class="tab-content hidden">
          <div id="mechanic-list" class="space-y-2"></div>
        </div>
        <div id="family-content" class="tab-content hidden">
          <div id="family-list" class="space-y-2"></div>
        </div>
        <div id="designer-content" class="tab-content hidden">
          <div id="designer-list" class="space-y-2"></div>
        </div>
        <div id="artist-content" class="tab-content hidden">
          <div id="artist-list" class="space-y-2"></div>
        </div>
        <div id="publisher-content" class="tab-content hidden">
          <div id="publisher-list" class="space-y-2"></div>
        </div>
      </div>
    </div>

  </main>

  <!-- Modal -->
  <div id="modalOverlay" class="modal-overlay hidden" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="flex-1 min-w-0">
          <h3 class="font-bold text-lg" id="modalTitle"></h3>
        </div>
        <select 
          id="modalSortSelect" 
          onchange="sortModalGames(this.value)" 
          class="px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none bg-white font-medium text-sm flex-shrink-0"
        >
          <option value="bayaverage-desc">Bayesian Rating ↓</option>
          <option value="bayaverage-asc">Bayesian Rating ↑</option>
          <option value="average-desc">Avg Rating ↓</option>
          <option value="average-asc">Avg Rating ↑</option>
          <option value="rank-asc">Rank (Best-Worst)</option>
          <option value="rank-desc">Rank (Worst-Best)</option>
          <option value="weight-desc">Weight ↓</option>
          <option value="weight-asc">Weight ↑</option>
          <option value="year-desc">Year ↓</option>
          <option value="year-asc">Year ↑</option>
          <option value="playtime-desc">Play Time ↓</option>
          <option value="playtime-asc">Play Time ↑</option>
          <option value="players-desc">Players ↓</option>
          <option value="players-asc">Players ↑</option>
          <option value="alpha">A-Z</option>
        </select>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 flex-shrink-0">
          <i class="fa-solid fa-times text-xl"></i>
        </button>
      </div>
      <div class="modal-games-container space-y-3" id="modalContent"></div>
    </div>
  </div>

<script>
const TYPE_MAP = {
  'category': 'boardgamecategory',
  'mechanic': 'boardgamemechanic',
  'family': 'boardgamefamily',
  'designer': 'boardgamedesigner',
  'artist': 'boardgameartist',
  'publisher': 'boardgamepublisher'
};

let allGames = [];
let typeData = {};
let currentTab = 'category';
let isLoading = false;

// Initialize type data
Object.keys(TYPE_MAP).forEach(key => {
  typeData[key] = {};
});

async function fetchCollection() {
  const username = document.getElementById('username').value.trim() || 'sportomax';
  const fetchBtn = document.getElementById('fetchBtn');
  const fetchSection = document.getElementById('fetchSection');
  const loadingSection = document.getElementById('loadingSection');
  const tabsSection = document.getElementById('tabsSection');
  const statsBox = document.getElementById('statsBox');
  
  fetchBtn.disabled = true;
  loadingSection.classList.remove('hidden');
  
  try {
    isLoading = true;
    
    // Reset data
    allGames = [];
    Object.keys(TYPE_MAP).forEach(key => {
      typeData[key] = {};
    });
    
    // Fetch collection
    updateLoadingStatus('Fetching collection...');
    const collXml = await fetchAPI('collection', username, '&stats=1&own=1');
    const doc = new DOMParser().parseFromString(collXml, 'text/xml');
    const items = Array.from(doc.querySelectorAll('item'));
    
    allGames = items.map(item => {
      const objectid = item.getAttribute('objectid');
      const name = item.querySelector('name')?.textContent?.trim() || '';
      const thumb = item.querySelector('thumbnail')?.textContent || '';
      const image = item.querySelector('image')?.textContent || '';
      
      return { 
        objectid, 
        name, 
        thumb, 
        image, 
        rating: 0,
        bayaverage: 0,
        weight: 0,
        rank: 999999,
        year: 0,
        playingtime: 0,
        minPlayers: 1,
        maxPlayers: 1,
        playersDisplay: '1',
        loaded: false 
      };
    }).filter(game => game.name);
    
    updateLoadingStatus(`Found ${allGames.length} games. Loading types...`);
    
    // Show UI
    fetchSection.classList.add('hidden');
    tabsSection.classList.remove('hidden');
    statsBox.classList.remove('hidden');
    document.getElementById('gameCount').textContent = allGames.length;
    
    // Fetch thing API in batches with 100x parallel processing
    const batchSize = 20;
    const parallelBatches = 100;
    const batches = [];
    for (let i = 0; i < allGames.length; i += batchSize) {
      batches.push(allGames.slice(i, i + batchSize));
    }
    
    // Process batches in parallel groups
    for (let i = 0; i < batches.length; i += parallelBatches) {
      const batchGroup = batches.slice(i, i + parallelBatches);
      updateLoadingStatus(`Loading types ${Math.min(i + parallelBatches, batches.length)}/${batches.length}...`);
      updateProgress((Math.min(i + parallelBatches, batches.length) / batches.length) * 100);
      
      await Promise.all(batchGroup.map(async (batch) => {
        const ids = batch.map(g => g.objectid).join(',');
        
        try {
          const thingXml = await fetchAPI('thing', ids, '&type=boardgame');
          const thingDoc = new DOMParser().parseFromString(thingXml, 'text/xml');
          const thingItems = Array.from(thingDoc.querySelectorAll('item'));
          
          thingItems.forEach(thingItem => {
            const id = thingItem.getAttribute('id');
            const game = allGames.find(g => g.objectid === id);
            if (!game) return;
            
            // Extract all stats from statistics > ratings
            const stats = thingItem.querySelector('statistics ratings');
            if (stats) {
              // Average rating (actual user average)
              game.rating = parseFloat(stats.querySelector('average')?.getAttribute('value') || '0');
              // Bayesian average (Bayesian rated - for weighted scoring)
              game.bayaverage = parseFloat(stats.querySelector('bayesaverage')?.getAttribute('value') || '0');
              // Weight (complexity)
              game.weight = parseFloat(stats.querySelector('averageweight')?.getAttribute('value') || '0');
              // Rank
              const rankElem = stats.querySelector('rank[name="boardgame"]');
              if (rankElem) {
                game.rank = parseInt(rankElem.getAttribute('value'));
              }
            }
            game.year = parseInt(thingItem.querySelector('yearpublished')?.getAttribute('value') || '0');
            
            // Extract playing time
            const playtimeElem = thingItem.querySelector('playingtime');
            if (playtimeElem) {
              game.playingtime = parseInt(playtimeElem.textContent || '0');
            }
            
            // Extract min/max players
            const minPlayersElem = thingItem.querySelector('minplayers');
            const maxPlayersElem = thingItem.querySelector('maxplayers');
            if (minPlayersElem && maxPlayersElem) {
              const minPlayers = parseInt(minPlayersElem.textContent || '1');
              const maxPlayers = parseInt(maxPlayersElem.textContent || '1');
              game.minPlayers = minPlayers;
              game.maxPlayers = maxPlayers;
              game.playersDisplay = minPlayers === maxPlayers ? `${minPlayers}` : `${minPlayers}-${maxPlayers}`;
            }
            
            game.loaded = true;
            
            // Extract all link types
            Object.entries(TYPE_MAP).forEach(([key, type]) => {
              const links = thingItem.querySelectorAll(`link[type="${type}"]`);
              Array.from(links).forEach(link => {
                const linkId = link.getAttribute('id');
                const linkName = link.getAttribute('value');
                if (!typeData[key][linkId]) {
                  typeData[key][linkId] = { name: linkName, games: [] };
                }
                typeData[key][linkId].games.push(game);
              });
            });
          });
          
        } catch (e) {
          console.error('Batch error:', e);
        }
      }));
      
      // Update display after each parallel group
      renderCurrentTab();
      
      await wait(500);
    }
    
    updateLoadingStatus('Complete!');
    updateProgress(100);
    isLoading = false;
    
    // Hide loading indicator
    setTimeout(() => {
      loadingSection.classList.add('hidden');
    }, 500);
    
  } catch (e) {
    console.error(e);
    alert('Failed to fetch collection. Please try again.');
    fetchBtn.disabled = false;
    loadingSection.classList.add('hidden');
  }
}

function updateLoadingStatus(msg) {
  document.getElementById('loadingStatus').textContent = msg;
}

function updateProgress(percent) {
  document.getElementById('progressBar').style.width = percent + '%';
}

function switchTab(tab) {
  currentTab = tab;
  
  // Update tab buttons
  document.querySelectorAll('.tab-button').forEach(btn => {
    if (btn.dataset.tab === tab) {
      btn.classList.add('active', 'text-indigo-600', 'font-bold');
      btn.classList.remove('text-slate-600');
    } else {
      btn.classList.remove('active', 'text-indigo-600', 'font-bold');
      btn.classList.add('text-slate-600');
    }
  });
  
  // Update tab content
  document.querySelectorAll('.tab-content').forEach(content => {
    content.classList.add('hidden');
  });
  document.getElementById(`${tab}-content`).classList.remove('hidden');
  
  // Clear search
  document.getElementById('searchInput').value = '';
  
  // Render tab
  renderCurrentTab();
}

function renderCurrentTab() {
  const data = typeData[currentTab] || {};
  const container = document.getElementById(`${currentTab}-list`);
  
  // Sort by game count (descending)
  const sorted = Object.entries(data)
    .sort((a, b) => b[1].games.length - a[1].games.length);
  
  container.innerHTML = '';
  
  if (sorted.length === 0) {
    container.innerHTML = '<div class="text-center text-slate-400 py-8">No data yet...</div>';
    return;
  }
  
  sorted.forEach(([id, item]) => {
    const card = document.createElement('div');
    card.className = 'type-card bg-slate-50 rounded-lg p-3 border border-slate-200 flex items-center justify-between';
    card.onclick = () => showGames(item.name, item.games);
    
    card.innerHTML = `
      <span class="font-semibold text-slate-900">${item.name}</span>
      <span class="bg-indigo-600 text-white px-3 py-1 rounded-full text-sm font-bold">${item.games.length}</span>
    `;
    
    container.appendChild(card);
  });
}

function filterTypes() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const data = typeData[currentTab] || {};
  const container = document.getElementById(`${currentTab}-list`);
  
  // Sort by game count (descending)
  const sorted = Object.entries(data)
    .filter(([id, item]) => item.name.toLowerCase().includes(search))
    .sort((a, b) => b[1].games.length - a[1].games.length);
  
  container.innerHTML = '';
  
  if (sorted.length === 0) {
    container.innerHTML = '<div class="text-center text-slate-400 py-8">No results found</div>';
    return;
  }
  
  sorted.forEach(([id, item]) => {
    const card = document.createElement('div');
    card.className = 'type-card bg-slate-50 rounded-lg p-3 border border-slate-200 flex items-center justify-between';
    card.onclick = () => showGames(item.name, item.games);
    
    card.innerHTML = `
      <span class="font-semibold text-slate-900">${item.name}</span>
      <span class="bg-indigo-600 text-white px-3 py-1 rounded-full text-sm font-bold">${item.games.length}</span>
    `;
    
    container.appendChild(card);
  });
}

function showGames(title, games) {
  const modal = document.getElementById('modalOverlay');
  const modalTitle = document.getElementById('modalTitle');
  const sortSelect = document.getElementById('modalSortSelect');
  
  // Ensure all games have stats loaded - rebuild from allGames to guarantee data integrity
  currentModalGames = games.map(game => {
    const fullGameData = allGames.find(g => g.objectid === game.objectid);
    if (fullGameData && fullGameData.loaded) {
      // Return the full game data object with all stats
      return fullGameData;
    }
    // Fallback to original game if not found (shouldn't happen)
    return {
      ...game,
      rating: game.rating || 0,
      bayaverage: game.bayaverage || 0,
      weight: game.weight || 0,
      rank: game.rank || 999999,
      year: game.year || 0,
      playingtime: game.playingtime || 0,
      minPlayers: game.minPlayers || 1,
      maxPlayers: game.maxPlayers || 1,
      playersDisplay: game.playersDisplay || '1'
    };
  });
  
  modalTitle.textContent = `${title} (${games.length})`;
  sortSelect.value = 'bayaverage-desc';
  
  sortModalGames('bayaverage-desc');
  modal.classList.remove('hidden');
}

let currentModalGames = [];

function sortModalGames(sortBy) {
  let sorted = [...currentModalGames];
  
  if (sortBy === 'bayaverage-desc') {
    sorted.sort((a, b) => (b.bayaverage || 0) - (a.bayaverage || 0));
  } else if (sortBy === 'bayaverage-asc') {
    sorted.sort((a, b) => (a.bayaverage || 0) - (b.bayaverage || 0));
  } else if (sortBy === 'average-desc') {
    sorted.sort((a, b) => (b.rating || 0) - (a.rating || 0));
  } else if (sortBy === 'average-asc') {
    sorted.sort((a, b) => (a.rating || 0) - (b.rating || 0));
  } else if (sortBy === 'rank-asc') {
    sorted.sort((a, b) => (a.rank || 999999) - (b.rank || 999999));
  } else if (sortBy === 'rank-desc') {
    sorted.sort((a, b) => (b.rank || 0) - (a.rank || 0));
  } else if (sortBy === 'weight-desc') {
    sorted.sort((a, b) => (b.weight || 0) - (a.weight || 0));
  } else if (sortBy === 'weight-asc') {
    sorted.sort((a, b) => (a.weight || 0) - (b.weight || 0));
  } else if (sortBy === 'year-desc') {
    sorted.sort((a, b) => (b.year || 0) - (a.year || 0));
  } else if (sortBy === 'year-asc') {
    sorted.sort((a, b) => (a.year || 0) - (b.year || 0));
  } else if (sortBy === 'playtime-desc') {
    sorted.sort((a, b) => (b.playingtime || 0) - (a.playingtime || 0));
  } else if (sortBy === 'playtime-asc') {
    sorted.sort((a, b) => (a.playingtime || 0) - (b.playingtime || 0));
  } else if (sortBy === 'players-desc') {
    sorted.sort((a, b) => (b.maxPlayers || 0) - (a.maxPlayers || 0));
  } else if (sortBy === 'players-asc') {
    sorted.sort((a, b) => (a.minPlayers || 0) - (b.minPlayers || 0));
  } else if (sortBy === 'alpha') {
    sorted.sort((a, b) => a.name.localeCompare(b.name));
  }
  
  renderModalGames(sorted);
}

function renderModalGames(games) {
  const modalContent = document.getElementById('modalContent');
  modalContent.innerHTML = games.map(game => `
    <div class="bg-white rounded-lg shadow-sm border border-slate-100 p-4 overflow-hidden cursor-pointer hover:shadow-md transition-shadow" onclick="window.open('https://boardgamegeek.com/boardgame/${game.objectid}', '_blank')">
      <!-- Header Row: Images + Title -->
      <div class="flex gap-4 pb-3">
        <div class="flex gap-2 flex-shrink-0">
          ${game.thumb ? `
            <img src="${game.thumb}" alt="${game.name}" class="w-20 h-28 rounded-lg object-cover shadow-sm">
          ` : `
            <div class="w-20 h-28 rounded-lg bg-slate-100 flex items-center justify-center flex-shrink-0">
              <i class="fa-solid fa-image text-slate-300"></i>
            </div>
          `}
          ${game.imageUrl && game.imageUrl !== game.thumb ? `
            <img src="${game.imageUrl}" alt="${game.name}" class="w-20 h-28 rounded-lg object-cover shadow-sm">
          ` : ''}
        </div>
        <div class="flex-1 min-w-0">
          <h3 class="text-lg font-bold text-slate-900 line-clamp-2 mb-1">${game.name}</h3>
          <div class="text-sm text-slate-500 mb-2">${game.year || 'Unknown'} • ID: ${game.objectid}</div>
          
          <!-- All Names -->
          ${game.allNames && game.allNames.length > 1 ? `
            <div class="text-xs text-slate-600 mb-1">
              <strong>Names:</strong> ${game.allNames.map(n => n.value).join(', ')}
            </div>
          ` : ''}
          
          <!-- Quick Stats -->
          <div class="grid grid-cols-4 gap-1 text-xs mt-2">
            ${game.bggRating > 0 ? `<div class="bg-amber-50 p-1 rounded"><span class="font-bold text-amber-700">⭐ ${game.bggRating.toFixed(2)}</span></div>` : ''}
            ${game.bayesAverage > 0 ? `<div class="bg-amber-50 p-1 rounded"><span class="font-bold text-amber-700">Ⓑ ${game.bayesAverage.toFixed(2)}</span></div>` : ''}
            ${game.weight > 0 ? `<div class="bg-purple-50 p-1 rounded"><span class="font-bold text-purple-700">⚙️ ${game.weight.toFixed(2)}</span></div>` : ''}
            ${game.median > 0 ? `<div class="bg-slate-100 p-1 rounded"><span class="font-bold text-slate-700">Ⓜ ${game.median.toFixed(2)}</span></div>` : ''}
          </div>
        </div>
      </div>

      <!-- Full Description -->
      ${game.fullDescription ? `
        <div class="pt-2 pb-1">
          <div class="bg-slate-50 p-2 rounded-lg border border-slate-200">
            <p class="text-xs text-slate-700 leading-relaxed line-clamp-2">${game.fullDescription}</p>
          </div>
        </div>
      ` : ''}

      <!-- Expandable Content -->
      <div class="pt-3 space-y-2 border-t text-xs">
        
        <!-- Gameplay Stats -->
        <div>
          <div class="font-bold text-slate-700 mb-1">🎲 Gameplay</div>
          <div class="grid grid-cols-4 gap-1">
            <div class="bg-slate-50 p-1 rounded">
              <div class="text-slate-500 text-[0.65rem]">Players</div>
              <div class="font-bold text-slate-700 text-[0.7rem]">${game.minplayers || '?'}-${game.maxplayers || '?'}</div>
            </div>
            <div class="bg-slate-50 p-1 rounded">
              <div class="text-slate-500 text-[0.65rem]">Time</div>
              <div class="font-bold text-slate-700 text-[0.7rem]">${game.minPlaytime && game.minPlaytime !== 'N/A' ? game.minPlaytime : '?'}-${game.maxPlaytime && game.maxPlaytime !== 'N/A' ? game.maxPlaytime : '?'}m</div>
            </div>
            <div class="bg-slate-50 p-1 rounded">
              <div class="text-slate-500 text-[0.65rem]">Age</div>
              <div class="font-bold text-slate-700 text-[0.7rem]">${game.minAge !== 'N/A' ? game.minAge + '+' : 'N/A'}</div>
            </div>
            <div class="bg-slate-50 p-1 rounded">
              <div class="text-slate-500 text-[0.65rem]">Best</div>
              <div class="font-bold text-slate-700 text-[0.7rem]">${game.bestWith ? game.bestWith.replace('Best with ', '') : 'N/A'}</div>
            </div>
          </div>
        </div>

        <!-- Ratings Details -->
        <div>
          <div class="font-bold text-slate-700 mb-1">⭐ Ratings & Stats</div>
          <div class="grid grid-cols-5 gap-1">
            <div class="bg-slate-50 p-1 rounded">
              <div class="text-slate-500 text-[0.65rem]">Rating</div>
              <div class="font-bold text-slate-700 text-[0.7rem]">${game.bggRating > 0 ? game.bggRating.toFixed(2) : 'N/A'}</div>
            </div>
            <div class="bg-slate-50 p-1 rounded">
              <div class="text-slate-500 text-[0.65rem]">Bayes</div>
              <div class="font-bold text-slate-700 text-[0.7rem]">${game.bayesAverage > 0 ? game.bayesAverage.toFixed(2) : 'N/A'}</div>
            </div>
            <div class="bg-slate-50 p-1 rounded">
              <div class="text-slate-500 text-[0.65rem]">Median</div>
              <div class="font-bold text-slate-700 text-[0.7rem]">${game.median > 0 ? game.median.toFixed(2) : 'N/A'}</div>
            </div>
            <div class="bg-slate-50 p-1 rounded">
              <div class="text-slate-500 text-[0.65rem]">Weight</div>
              <div class="font-bold text-slate-700 text-[0.7rem]">${game.weight ? game.weight.toFixed(2) : 'N/A'}</div>
            </div>
            <div class="bg-slate-50 p-1 rounded">
              <div class="text-slate-500 text-[0.65rem]">Votes</div>
              <div class="font-bold text-slate-700 text-[0.7rem]">${game.numRatings ? (game.numRatings / 1000).toFixed(1) + 'k' : '0'}</div>
            </div>
          </div>
        </div>

        <!-- Ownership & Ranks -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <div class="font-bold text-slate-700 mb-0.5 text-[0.7rem]">👥 Ownership</div>
            <div class="grid grid-cols-2 gap-0.5 text-[0.6rem]">
              <div class="bg-slate-50 px-1 py-0.5 rounded"><span class="text-slate-500">Owned:</span> <span class="font-bold text-slate-700">${game.owned ? (game.owned / 1000).toFixed(1) + 'k' : '0'}</span></div>
              <div class="bg-slate-50 px-1 py-0.5 rounded"><span class="text-slate-500">Want:</span> <span class="font-bold text-slate-700">${game.wanting ? (game.wanting / 1000).toFixed(1) + 'k' : '0'}</span></div>
              <div class="bg-slate-50 px-1 py-0.5 rounded"><span class="text-slate-500">Wish:</span> <span class="font-bold text-slate-700">${game.wishing ? (game.wishing / 1000).toFixed(1) + 'k' : '0'}</span></div>
              <div class="bg-slate-50 px-1 py-0.5 rounded"><span class="text-slate-500">Trade:</span> <span class="font-bold text-slate-700">${game.trading ? (game.trading / 1000).toFixed(1) + 'k' : '0'}</span></div>
            </div>
          </div>
          ${game.ranks && game.ranks.length > 0 ? `
            <div>
              <div class="font-bold text-slate-700 mb-0.5 text-[0.7rem]">🏆 Top Rank</div>
              <div class="bg-gradient-to-r from-green-50 to-slate-50 px-1 py-0.5 rounded text-[0.6rem] border border-green-100">
                <span class="font-bold text-green-700">#${game.ranks[0].value}</span>
                <span class="text-slate-600">${game.ranks[0].friendlyName || game.ranks[0].name}</span>
              </div>
            </div>
          ` : ''}
        </div>

        <!-- Mechanics & Categories -->
        ${game.mechanics && game.mechanics.length > 0 ? `
          <div>
            <div class="font-bold text-slate-700 mb-0.5 text-[0.7rem]">🎮 Mechanics (${game.mechanics.length})</div>
            <div class="flex flex-wrap gap-0.5">
              ${game.mechanics.slice(0, 8).map(m => `<span class="bg-blue-100 text-blue-700 px-1 py-0.5 rounded text-[0.6rem] font-semibold">${m}</span>`).join('')}
              ${game.mechanics.length > 8 ? `<span class="bg-slate-200 text-slate-700 px-1 py-0.5 rounded text-[0.6rem] font-semibold">+${game.mechanics.length - 8}</span>` : ''}
            </div>
          </div>
        ` : ''}

        ${game.categories && game.categories.length > 0 ? `
          <div>
            <div class="font-bold text-slate-700 mb-0.5 text-[0.7rem]">🏷️ Categories (${game.categories.length})</div>
            <div class="flex flex-wrap gap-0.5">
              ${game.categories.slice(0, 8).map(c => `<span class="bg-green-100 text-green-700 px-1 py-0.5 rounded text-[0.6rem] font-semibold">${c}</span>`).join('')}
              ${game.categories.length > 8 ? `<span class="bg-slate-200 text-slate-700 px-1 py-0.5 rounded text-[0.6rem] font-semibold">+${game.categories.length - 8}</span>` : ''}
            </div>
          </div>
        ` : ''}

        <!-- Designers & Artists -->
        <div class="grid grid-cols-2 gap-2">
          ${game.designers && game.designers.length > 0 ? `
            <div>
              <div class="font-bold text-slate-700 mb-0.5 text-[0.7rem]">👨‍🎨 Designers (${game.designers.length})</div>
              <div class="flex flex-wrap gap-0.5">
                ${game.designers.slice(0, 4).map(d => `<span class="bg-purple-100 text-purple-700 px-1 py-0.5 rounded text-[0.6rem] font-semibold">${d}</span>`).join('')}
                ${game.designers.length > 4 ? `<span class="bg-slate-200 text-slate-700 px-1 py-0.5 rounded text-[0.6rem] font-semibold">+${game.designers.length - 4}</span>` : ''}
              </div>
            </div>
          ` : ''}
          ${game.artists && game.artists.length > 0 ? `
            <div>
              <div class="font-bold text-slate-700 mb-0.5 text-[0.7rem]">🎨 Artists (${game.artists.length})</div>
              <div class="flex flex-wrap gap-0.5">
                ${game.artists.slice(0, 4).map(a => `<span class="bg-indigo-100 text-indigo-700 px-1 py-0.5 rounded text-[0.6rem] font-semibold">${a}</span>`).join('')}
                ${game.artists.length > 4 ? `<span class="bg-slate-200 text-slate-700 px-1 py-0.5 rounded text-[0.6rem] font-semibold">+${game.artists.length - 4}</span>` : ''}
              </div>
            </div>
          ` : ''}
        </div>

        <!-- Publishers & Families -->
        <div class="grid grid-cols-2 gap-2">
          ${game.publishers && game.publishers.length > 0 ? `
            <div>
              <div class="font-bold text-slate-700 mb-0.5 text-[0.7rem]">🏢 Publishers (${game.publishers.length})</div>
              <div class="flex flex-wrap gap-0.5">
                ${game.publishers.slice(0, 4).map(p => `<span class="bg-orange-100 text-orange-700 px-1 py-0.5 rounded text-[0.6rem] font-semibold">${p}</span>`).join('')}
                ${game.publishers.length > 4 ? `<span class="bg-slate-200 text-slate-700 px-1 py-0.5 rounded text-[0.6rem] font-semibold">+${game.publishers.length - 4}</span>` : ''}
              </div>
            </div>
          ` : ''}
          ${game.families && game.families.length > 0 ? `
            <div>
              <div class="font-bold text-slate-700 mb-0.5 text-[0.7rem]">👨‍👩‍👧 Families (${game.families.length})</div>
              <div class="flex flex-wrap gap-0.5">
                ${game.families.slice(0, 4).map(f => `<span class="bg-pink-100 text-pink-700 px-1 py-0.5 rounded text-[0.6rem] font-semibold">${f}</span>`).join('')}
                ${game.families.length > 4 ? `<span class="bg-slate-200 text-slate-700 px-1 py-0.5 rounded text-[0.6rem] font-semibold">+${game.families.length - 4}</span>` : ''}
              </div>
            </div>
          ` : ''}
        </div>

        <!-- Player Count Poll (compact) -->
        ${game.playerCountDetails && game.playerCountDetails.length > 0 ? `
          <div class="border-t pt-1">
            <div class="font-bold text-slate-700 mb-0.5 text-[0.7rem]">🎯 Player Poll</div>
            <div class="space-y-0.5">
              ${game.playerCountDetails.slice(0, 4).map(pc => `
                <div class="bg-slate-50 px-1 py-0.5 rounded text-[0.6rem] border border-slate-200">
                  <span class="font-semibold text-slate-700">${pc.numplayers}p:</span>
                  ${pc.votes.Best ? `<span class="bg-green-100 text-green-700 px-0.5 rounded text-[0.55rem]">✓${pc.votes.Best}</span>` : ''}
                  ${pc.votes.Recommended ? `<span class="bg-blue-100 text-blue-700 px-0.5 rounded text-[0.55rem]">→${pc.votes.Recommended}</span>` : ''}
                  ${pc.votes['Not Recommended'] ? `<span class="bg-red-100 text-red-700 px-0.5 rounded text-[0.55rem]">✗${pc.votes['Not Recommended']}</span>` : ''}
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}

        <!-- Related Content (compact) -->
        ${(game.expansions && game.expansions.length > 0) || (game.accessories && game.accessories.length > 0) ? `
          <div>
            <div class="font-bold text-slate-700 mb-0.5 text-[0.7rem]">📦 Related</div>
            <div class="text-[0.6rem] text-slate-700 space-y-0.5">
              ${game.expansions && game.expansions.length > 0 ? `<div><strong>Exp (${game.expansions.length}):</strong> ${game.expansions.slice(0, 3).map(e => e.value).join(', ')}${game.expansions.length > 3 ? '...' : ''}</div>` : ''}
              ${game.accessories && game.accessories.length > 0 ? `<div><strong>Acc (${game.accessories.length}):</strong> ${game.accessories.slice(0, 2).map(a => a.value).join(', ')}${game.accessories.length > 2 ? '...' : ''}</div>` : ''}
            </div>
          </div>
        ` : ''}
      </div>
    </div>
  `).join('');
}

function closeModal(event) {
  if (!event || event.target.id === 'modalOverlay') {
    document.getElementById('modalOverlay').classList.add('hidden');
  }
}

async function fetchAPI(endpoint, user, queryParams = '') {
  if (endpoint === 'thing') {
    let url = `/api/bgg-helper?endpoint=${endpoint}&id=${encodeURIComponent(user)}${queryParams}`;
    for (let attempt = 0; attempt < 5; attempt++) {
      let res;
      try {
        res = await fetch(url);
      } catch (e) {
        await wait(1500 * Math.pow(2, attempt));
        continue;
      }
      if (res.status === 202) {
        await wait(3000);
        continue;
      }
      if (res.ok) {
        return await res.text();
      }
      await wait(2000);
    }
    throw new Error('Failed to fetch from BGG API');
  } else {
    if (!user || user.trim() === '') {
      throw new Error('Username is required');
    }
    let url = `/api/bgg-helper?endpoint=${endpoint}&username=${encodeURIComponent(user)}${queryParams}`;
    for (let attempt = 0; attempt < 5; attempt++) {
      let res;
      try {
        res = await fetch(url);
      } catch (e) {
        await wait(1000 * Math.pow(2, attempt));
        continue;
      }
      if (res.status === 202) {
        await wait(2000);
        continue;
      }
      if (res.ok) return await res.text();
      await wait(1500);
    }
    throw new Error('Failed to fetch from BGG API');
  }
}

function wait(ms) {
  return new Promise(r => setTimeout(r, ms));
}

// Tab switching
document.querySelectorAll('.tab-button').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});
</script>
