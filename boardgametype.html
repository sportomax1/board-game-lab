<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>BGG Game Types</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
    }

    .tab-button {
      transition: all 0.2s ease;
      position: relative;
    }

    .tab-button.active {
      color: #6366f1;
      font-weight: 700;
    }

    .tab-button.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 3px;
      background: #6366f1;
      border-radius: 3px 3px 0 0;
    }

    .type-card {
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .type-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
    }

    .type-card:active {
      transform: scale(0.98);
    }

    .skeleton {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    .modal-content {
      background: white;
      border-radius: 1rem;
      width: 90%;
      max-width: 56rem;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0,0,0,0.15);
    }

    .modal-header {
      border-bottom: 1px solid #e2e8f0;
      padding: 1rem;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .modal-games-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      space-y: 1rem;
    }

    .game-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 0.75rem;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .game-card-header {
      display: flex;
      gap: 1rem;
      padding: 1rem;
      background: #f8fafc;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .game-card-header:hover {
      background: #f1f5f9;
    }

    .game-card-header.expanded {
      background: #f1f5f9;
      border-bottom: 1px solid #e2e8f0;
    }

    .game-card-thumb {
      width: 60px;
      height: 80px;
      flex-shrink: 0;
      border-radius: 0.5rem;
      object-fit: cover;
      background: #e2e8f0;
    }

    .game-card-title-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    .game-card-title {
      font-weight: 700;
      font-size: 1rem;
      color: #1e293b;
      margin-bottom: 0.25rem;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .game-card-meta {
      font-size: 0.75rem;
      color: #64748b;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .game-card-meta-item {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .game-card-details {
      padding: 0.75rem 1rem;
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
      font-size: 0.875rem;
      color: #475569;
      display: none;
      max-height: 400px;
      overflow-y: auto;
    }

    .game-card-details.show {
      display: block;
    }

    .game-card-detail-section {
      margin-bottom: 0.75rem;
    }

    .game-card-detail-section:last-child {
      margin-bottom: 0;
    }

    .game-card-detail-title {
      font-weight: 600;
      font-size: 0.75rem;
      color: #334155;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }

    .game-card-detail-content {
      font-size: 0.75rem;
      color: #64748b;
      line-height: 1.4;
    }

    .game-card-icons {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .game-card-tag {
      display: inline-block;
      background: #e0e7ff;
      color: #4f46e5;
      padding: 0.125rem 0.375rem;
      border-radius: 0.25rem;
      font-size: 0.65rem;
      font-weight: 600;
    }

    .game-card-expand-btn {
      align-self: center;
      padding: 0.5rem;
      background: transparent;
      border: none;
      color: #6366f1;
      cursor: pointer;
      font-size: 1.25rem;
      transition: transform 0.2s ease;
    }

    .game-card-expand-btn.expanded {
      transform: rotate(180deg);
    }
  </style>
</head>
<body class="pb-20">

  <header class="sticky top-0 z-30 w-full bg-white/80 backdrop-blur-md border-b px-4 py-4 shadow-sm">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 text-white p-2 rounded-lg">
          <i class="fa-solid fa-dice-d20"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">Game Types</h1>
          <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Categories & More</p>
        </div>
      </div>
      <div id="statsBox" class="text-right hidden">
        <div class="text-2xl font-bold text-indigo-600" id="gameCount">0</div>
        <div class="text-[10px] text-slate-500 uppercase font-bold">Games</div>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6">
    
    <!-- Fetch Section -->
    <div id="fetchSection" class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
      <h2 class="text-xl font-bold mb-4">Load Collection</h2>
      <div class="space-y-4">
        <div>
          <label class="text-xs font-bold text-slate-500 uppercase mb-2 block">BGG Username</label>
          <input 
            id="username" 
            type="text" 
            value="sportomax" 
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all"
          >
        </div>
        <div>
          <label class="text-xs font-bold text-slate-500 uppercase mb-3 block">Status Filters (load full collection, filter after)</label>
          <div class="grid grid-cols-2 gap-2 text-sm">
            <div>
              <label class="text-xs text-slate-600 block mb-1">Own</label>
              <select id="filter-own" class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-white">
                <option value="any">Any</option>
                <option value="1" selected>Yes (1)</option>
                <option value="0">No (0)</option>
              </select>
            </div>
            <div>
              <label class="text-xs text-slate-600 block mb-1">Played</label>
              <select id="filter-played" class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-white">
                <option value="any" selected>Any</option>
                <option value="1">Yes (1)</option>
                <option value="0">No (0)</option>
              </select>
            </div>
            <div>
              <label class="text-xs text-slate-600 block mb-1">Want to Play</label>
              <select id="filter-wanttoplay" class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-white">
                <option value="any" selected>Any</option>
                <option value="1">Yes (1)</option>
                <option value="0">No (0)</option>
              </select>
            </div>
            <div>
              <label class="text-xs text-slate-600 block mb-1">Want to Buy</label>
              <select id="filter-wantingtobuy" class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-white">
                <option value="any" selected>Any</option>
                <option value="1">Yes (1)</option>
                <option value="0">No (0)</option>
              </select>
            </div>
            <div>
              <label class="text-xs text-slate-600 block mb-1">Want to Trade</label>
              <select id="filter-wantingtrade" class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-white">
                <option value="any" selected>Any</option>
                <option value="1">Yes (1)</option>
                <option value="0">No (0)</option>
              </select>
            </div>
            <div>
              <label class="text-xs text-slate-600 block mb-1">Previously Owned</label>
              <select id="filter-prevowned" class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-white">
                <option value="any" selected>Any</option>
                <option value="1">Yes (1)</option>
                <option value="0">No (0)</option>
              </select>
            </div>
          </div>
        </div>
        <button 
          onclick="fetchCollection()" 
          id="fetchBtn"
          class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold hover:bg-indigo-700 shadow-lg shadow-indigo-100 flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-download"></i> Load Games
        </button>
      </div>
    </div>

    <!-- Loading Section -->
    <div id="loadingSection" class="hidden">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
        <div class="flex items-center justify-center gap-3 mb-4">
          <i class="fa-solid fa-circle-notch fa-spin text-indigo-600 text-2xl"></i>
          <span class="font-bold text-slate-700">Loading collection...</span>
        </div>
        <div class="text-sm text-slate-500 text-center" id="loadingStatus">Fetching games...</div>
        <div class="mt-4 bg-slate-100 rounded-full h-2 overflow-hidden">
          <div id="progressBar" class="bg-indigo-600 h-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- Tabs Section -->
    <div id="tabsSection" class="hidden bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="flex overflow-x-auto border-b border-slate-100 px-2">
        <button class="tab-button active px-4 py-3 text-sm font-medium whitespace-nowrap" data-tab="category">
          Categories
        </button>
        <button class="tab-button px-4 py-3 text-sm font-medium text-slate-600 whitespace-nowrap" data-tab="mechanic">
          Mechanics
        </button>
        <button class="tab-button px-4 py-3 text-sm font-medium text-slate-600 whitespace-nowrap" data-tab="family">
          Families
        </button>
        <button class="tab-button px-4 py-3 text-sm font-medium text-slate-600 whitespace-nowrap" data-tab="designer">
          Designers
        </button>
        <button class="tab-button px-4 py-3 text-sm font-medium text-slate-600 whitespace-nowrap" data-tab="artist">
          Artists
        </button>
        <button class="tab-button px-4 py-3 text-sm font-medium text-slate-600 whitespace-nowrap" data-tab="publisher">
          Publishers
        </button>
      </div>

      <!-- Search Filter -->
      <div class="p-4 border-b border-slate-100">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search..." 
          oninput="filterTypes()"
          class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all"
        >
      </div>

      <!-- Tab Content -->
      <div class="p-4">
        <div id="category-content" class="tab-content">
          <div id="category-list" class="space-y-2"></div>
        </div>
        <div id="mechanic-content" class="tab-content hidden">
          <div id="mechanic-list" class="space-y-2"></div>
        </div>
        <div id="family-content" class="tab-content hidden">
          <div id="family-list" class="space-y-2"></div>
        </div>
        <div id="designer-content" class="tab-content hidden">
          <div id="designer-list" class="space-y-2"></div>
        </div>
        <div id="artist-content" class="tab-content hidden">
          <div id="artist-list" class="space-y-2"></div>
        </div>
        <div id="publisher-content" class="tab-content hidden">
          <div id="publisher-list" class="space-y-2"></div>
        </div>
      </div>
    </div>

  </main>

  <!-- Modal -->
  <div id="modalOverlay" class="modal-overlay hidden" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="flex-1 min-w-0">
          <h3 class="font-bold text-lg" id="modalTitle"></h3>
        </div>
        <select 
          id="modalSortSelect" 
          onchange="sortModalGames(this.value)" 
          class="px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none bg-white font-medium text-sm flex-shrink-0"
        >
          <option value="bayaverage-desc">Bayesian Rating ↓</option>
          <option value="bayaverage-asc">Bayesian Rating ↑</option>
          <option value="average-desc">Avg Rating ↓</option>
          <option value="average-asc">Avg Rating ↑</option>
          <option value="rank-asc">Rank (Best-Worst)</option>
          <option value="rank-desc">Rank (Worst-Best)</option>
          <option value="weight-desc">Weight ↓</option>
          <option value="weight-asc">Weight ↑</option>
          <option value="year-desc">Year ↓</option>
          <option value="year-asc">Year ↑</option>
          <option value="playtime-desc">Play Time ↓</option>
          <option value="playtime-asc">Play Time ↑</option>
          <option value="players-desc">Players ↓</option>
          <option value="players-asc">Players ↑</option>
          <option value="alpha">A-Z</option>
        </select>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 flex-shrink-0">
          <i class="fa-solid fa-times text-xl"></i>
        </button>
      </div>
      <div class="modal-games-container space-y-3" id="modalContent"></div>
    </div>
  </div>

<script>
const TYPE_MAP = {
  'category': 'boardgamecategory',
  'mechanic': 'boardgamemechanic',
  'family': 'boardgamefamily',
  'designer': 'boardgamedesigner',
  'artist': 'boardgameartist',
  'publisher': 'boardgamepublisher'
};

let allGames = [];
let typeData = {};
let currentTab = 'category';
let isLoading = false;

// Initialize type data
Object.keys(TYPE_MAP).forEach(key => {
  typeData[key] = {};
});

async function fetchCollection() {
  const username = document.getElementById('username').value.trim() || 'sportomax';
  const fetchBtn = document.getElementById('fetchBtn');
  const fetchSection = document.getElementById('fetchSection');
  const loadingSection = document.getElementById('loadingSection');
  const tabsSection = document.getElementById('tabsSection');
  const statsBox = document.getElementById('statsBox');
  
  fetchBtn.disabled = true;
  loadingSection.classList.remove('hidden');
  
  try {
    isLoading = true;
    
    // Reset data
    allGames = [];
    Object.keys(TYPE_MAP).forEach(key => {
      typeData[key] = {};
    });
    
    // Always fetch FULL collection - no status filters in API call
    updateLoadingStatus('Fetching collection...');
    const collXml = await fetchAPI('collection', username, '&stats=1');
    const doc = new DOMParser().parseFromString(collXml, 'text/xml');
    const items = Array.from(doc.querySelectorAll('item'));
    
    allGames = items.map(item => {
      const objectid = item.getAttribute('objectid');
      const name = item.querySelector('name')?.textContent?.trim() || '';
      const thumb = item.querySelector('thumbnail')?.textContent || '';
      const image = item.querySelector('image')?.textContent || '';
      
      // Extract status flags from the status element
      const statusEl = item.querySelector('status');
      const status = {
        own: statusEl?.getAttribute('own') === '1',
        prevowned: statusEl?.getAttribute('prevowned') === '1',
        fortrade: statusEl?.getAttribute('fortrade') === '1',
        wantingtrade: statusEl?.getAttribute('wantingtrade') === '1',
        wantingtobuy: statusEl?.getAttribute('wantingtobuy') === '1',
        wanttoplay: statusEl?.getAttribute('wanttoplay') === '1',
        preordered: statusEl?.getAttribute('preordered') === '1',
        played: statusEl?.getAttribute('played') === '1'
      };
      
      return { 
        objectid, 
        name, 
        thumb, 
        image, 
        status,
        bggRating: 0,
        bayesAverage: 0,
        weight: 0,
        rank: 999999,
        year: 0,
        minPlaytime: 0,
        maxPlaytime: 0,
        minAge: 0,
        minPlayers: 1,
        maxPlayers: 1,
        playersDisplay: '1',
        numRatings: 0,
        owned: 0,
        wanting: 0,
        wishing: 0,
        trading: 0,
        median: 0,
        stddev: 0,
        ranks: [],
        mechanics: [],
        categories: [],
        designers: [],
        artists: [],
        publishers: [],
        families: [],
        description: '',
        playerPoll: [],
        agePoll: [],
        languageDependence: 'Unknown',
        loaded: false 
      };
    }).filter(game => game.name);
    
    updateLoadingStatus(`Found ${allGames.length} games. Loading types...`);
    
    // Show UI
    fetchSection.classList.add('hidden');
    tabsSection.classList.remove('hidden');
    statsBox.classList.remove('hidden');
    document.getElementById('gameCount').textContent = allGames.length;
    
    // Fetch thing API in batches with 100x parallel processing
    const batchSize = 20;
    const parallelBatches = 100;
    const batches = [];
    for (let i = 0; i < allGames.length; i += batchSize) {
      batches.push(allGames.slice(i, i + batchSize));
    }
    
    // Process batches in parallel groups
    for (let i = 0; i < batches.length; i += parallelBatches) {
      const batchGroup = batches.slice(i, i + parallelBatches);
      updateLoadingStatus(`Loading types ${Math.min(i + parallelBatches, batches.length)}/${batches.length}...`);
      updateProgress((Math.min(i + parallelBatches, batches.length) / batches.length) * 100);
      
      await Promise.all(batchGroup.map(async (batch) => {
        const ids = batch.map(g => g.objectid).join(',');
        
        try {
          const thingXml = await fetchAPI('thing', ids, '&type=boardgame');
          const thingDoc = new DOMParser().parseFromString(thingXml, 'text/xml');
          const thingItems = Array.from(thingDoc.querySelectorAll('item'));
          
          thingItems.forEach(thingItem => {
            const id = thingItem.getAttribute('id');
            const game = allGames.find(g => g.objectid === id);
            if (!game) return;
            
            // Extract all stats from statistics > ratings
            const stats = thingItem.querySelector('statistics ratings');
            if (stats) {
              // Ratings
              game.bggRating = parseFloat(stats.querySelector('average')?.getAttribute('value') || '0');
              game.bayesAverage = parseFloat(stats.querySelector('bayesaverage')?.getAttribute('value') || '0');
              game.median = parseFloat(stats.querySelector('median')?.getAttribute('value') || '0');
              game.stddev = parseFloat(stats.querySelector('stddev')?.getAttribute('value') || '0');
              game.numRatings = parseInt(stats.querySelector('usersrated')?.getAttribute('value') || '0');
              
              // Ownership stats
              game.owned = parseInt(stats.querySelector('owned')?.getAttribute('value') || '0');
              game.wanting = parseInt(stats.querySelector('wanting')?.getAttribute('value') || '0');
              game.wishing = parseInt(stats.querySelector('wishing')?.getAttribute('value') || '0');
              game.trading = parseInt(stats.querySelector('trading')?.getAttribute('value') || '0');
              
              // Weight (complexity)
              game.weight = parseFloat(stats.querySelector('averageweight')?.getAttribute('value') || '0');
              
                          // All ranks
                          const ranksNode = stats.querySelector('ranks');
                          if (ranksNode) {
                            const boardgameRank = ranksNode.querySelector('rank[name="boardgame"]');
                            if (boardgameRank) {
                              const rankVal = boardgameRank.getAttribute('value');
                              game.rank = (rankVal && rankVal !== 'Not Ranked') ? parseInt(rankVal) : 999999;
                            }
                            
                            game.ranks = Array.from(ranksNode.querySelectorAll('rank')).map(r => ({
                              name: r.getAttribute('name'),
                              friendlyName: r.getAttribute('friendlyname'),
                              type: r.getAttribute('type'),
                              value: r.getAttribute('value')
                            })).filter(r => r.value);
                          }
                        }            
            game.year = parseInt(thingItem.querySelector('yearpublished')?.getAttribute('value') || '0');
            
            // Extract description
            game.description = thingItem.querySelector('description')?.textContent?.substring(0, 300) || '';
            
            // Extract playing times
            const minPlaytimeElem = thingItem.querySelector('minplaytime');
            const maxPlaytimeElem = thingItem.querySelector('maxplaytime');
            const minAgeElem = thingItem.querySelector('minage');
            if (minPlaytimeElem) {
              game.minPlaytime = parseInt(minPlaytimeElem.getAttribute('value') || '0');
            }
            if (maxPlaytimeElem) {
              game.maxPlaytime = parseInt(maxPlaytimeElem.getAttribute('value') || '0');
            }
            if (minAgeElem) {
              game.minAge = parseInt(minAgeElem.getAttribute('value') || '0');
            }
            
            // Extract player count poll
            const playerPoll = thingItem.querySelector('poll[name="suggested_numplayers"]');
            if (playerPoll) {
              game.playerPoll = Array.from(playerPoll.querySelectorAll('results')).map(result => {
                const numplayers = result.getAttribute('numplayers');
                const best = parseInt(result.querySelector('result[value="Best"]')?.getAttribute('numvotes') || '0');
                const recommended = parseInt(result.querySelector('result[value="Recommended"]')?.getAttribute('numvotes') || '0');
                const notRec = parseInt(result.querySelector('result[value="Not Recommended"]')?.getAttribute('numvotes') || '0');
                return { numplayers, best, recommended, notRec, total: best + recommended + notRec };
              });
            }
            
            // Extract age poll
            const agePoll = thingItem.querySelector('poll[name="suggested_playerage"]');
            if (agePoll) {
              const ageResults = Array.from(agePoll.querySelectorAll('result')).map(r => ({
                age: r.getAttribute('value'),
                votes: parseInt(r.getAttribute('numvotes') || '0')
              })).filter(r => r.votes > 0);
              game.agePoll = ageResults.sort((a, b) => b.votes - a.votes);
            }
            
            // Extract language dependence
            const langPoll = thingItem.querySelector('poll[name="language_dependence"]');
            if (langPoll) {
              const langResults = Array.from(langPoll.querySelectorAll('result')).map(r => ({
                level: r.getAttribute('level'),
                text: r.getAttribute('value'),
                votes: parseInt(r.getAttribute('numvotes') || '0')
              })).sort((a, b) => b.votes - a.votes);
              if (langResults.length > 0) {
                game.languageDependence = `${langResults[0].text} (${langResults[0].votes} votes)`;
              }
            }
            
            // Extract min/max players
            const minPlayersElem = thingItem.querySelector('minplayers');
            const maxPlayersElem = thingItem.querySelector('maxplayers');
            if (minPlayersElem && maxPlayersElem) {
              const minPlayers = parseInt(minPlayersElem.getAttribute('value') || '1');
              const maxPlayers = parseInt(maxPlayersElem.getAttribute('value') || '1');
              game.minPlayers = minPlayers;
              game.maxPlayers = maxPlayers;
              game.playersDisplay = minPlayers === maxPlayers ? `${minPlayers}` : `${minPlayers}-${maxPlayers}`;
            }
            
            game.loaded = true;
            
            // Extract all link types
            Object.entries(TYPE_MAP).forEach(([key, type]) => {
              const links = thingItem.querySelectorAll(`link[type="${type}"]`);
              Array.from(links).forEach(link => {
                const linkId = link.getAttribute('id');
                const linkName = link.getAttribute('value');
                if (!typeData[key][linkId]) {
                  typeData[key][linkId] = { name: linkName, games: [] };
                }
                typeData[key][linkId].games.push(game);
              });
              // Also store in game object for modal display
              if (key === 'mechanic') {
                game.mechanics = Array.from(links).map(l => l.getAttribute('value'));
              } else if (key === 'category') {
                game.categories = Array.from(links).map(l => l.getAttribute('value'));
              } else if (key === 'designer') {
                game.designers = Array.from(links).map(l => l.getAttribute('value'));
              } else if (key === 'artist') {
                game.artists = Array.from(links).map(l => l.getAttribute('value'));
              } else if (key === 'publisher') {
                game.publishers = Array.from(links).map(l => l.getAttribute('value'));
              } else if (key === 'family') {
                game.families = Array.from(links).map(l => l.getAttribute('value'));
              }
            });
          });
          
        } catch (e) {
          console.error('Batch error:', e);
        }
      }));
      
      // Update display after each parallel group
      renderCurrentTab();
      
      await wait(500);
    }
    
    // Apply status filters based on dropdown selections
    const filteredGames = applyStatusFilters(allGames);
    
    // Rebuild typeData with filtered games
    Object.keys(TYPE_MAP).forEach(key => {
      typeData[key] = {};
    });
    filteredGames.forEach(game => {
      Object.entries(TYPE_MAP).forEach(([key, type]) => {
        if (key === 'mechanic' && game.mechanics) {
          game.mechanics.forEach(m => {
            // Need to find the mechanic id from original typeData or just use names
            if (!typeData[key][m]) {
              typeData[key][m] = { name: m, games: [] };
            }
            typeData[key][m].games.push(game);
          });
        } else if (key === 'category' && game.categories) {
          game.categories.forEach(c => {
            if (!typeData[key][c]) {
              typeData[key][c] = { name: c, games: [] };
            }
            typeData[key][c].games.push(game);
          });
        } else if (key === 'designer' && game.designers) {
          game.designers.forEach(d => {
            if (!typeData[key][d]) {
              typeData[key][d] = { name: d, games: [] };
            }
            typeData[key][d].games.push(game);
          });
        } else if (key === 'artist' && game.artists) {
          game.artists.forEach(a => {
            if (!typeData[key][a]) {
              typeData[key][a] = { name: a, games: [] };
            }
            typeData[key][a].games.push(game);
          });
        } else if (key === 'publisher' && game.publishers) {
          game.publishers.forEach(p => {
            if (!typeData[key][p]) {
              typeData[key][p] = { name: p, games: [] };
            }
            typeData[key][p].games.push(game);
          });
        } else if (key === 'family' && game.families) {
          game.families.forEach(f => {
            if (!typeData[key][f]) {
              typeData[key][f] = { name: f, games: [] };
            }
            typeData[key][f].games.push(game);
          });
        }
      });
    });
    
    // Update game count with filtered amount
    document.getElementById('gameCount').textContent = filteredGames.length;
    renderCurrentTab();
    
    updateLoadingStatus('Complete!');
    updateProgress(100);
    isLoading = false;
    
    // Hide loading indicator
    setTimeout(() => {
      loadingSection.classList.add('hidden');
    }, 500);
    
  } catch (e) {
    console.error(e);
    alert('Failed to fetch collection. Please try again.');
    fetchBtn.disabled = false;
    loadingSection.classList.add('hidden');
  }
}

function applyStatusFilters(games) {
  const own = document.getElementById('filter-own').value;
  const played = document.getElementById('filter-played').value;
  const wanttoplay = document.getElementById('filter-wanttoplay').value;
  const wantingtobuy = document.getElementById('filter-wantingtobuy').value;
  const wantingtrade = document.getElementById('filter-wantingtrade').value;
  const prevowned = document.getElementById('filter-prevowned').value;
  
  return games.filter(game => {
    // Check each filter - if "any", skip the filter; if "1", require true; if "0", require false
    if (own !== 'any' && game.status.own !== (own === '1')) return false;
    if (played !== 'any' && game.status.played !== (played === '1')) return false;
    if (wanttoplay !== 'any' && game.status.wanttoplay !== (wanttoplay === '1')) return false;
    if (wantingtobuy !== 'any' && game.status.wantingtobuy !== (wantingtobuy === '1')) return false;
    if (wantingtrade !== 'any' && game.status.wantingtrade !== (wantingtrade === '1')) return false;
    if (prevowned !== 'any' && game.status.prevowned !== (prevowned === '1')) return false;
    return true;
  });
}

function updateLoadingStatus(msg) {
  document.getElementById('loadingStatus').textContent = msg;
}

function updateProgress(percent) {
  document.getElementById('progressBar').style.width = percent + '%';
}

function switchTab(tab) {
  currentTab = tab;
  
  // Update tab buttons
  document.querySelectorAll('.tab-button').forEach(btn => {
    if (btn.dataset.tab === tab) {
      btn.classList.add('active', 'text-indigo-600', 'font-bold');
      btn.classList.remove('text-slate-600');
    } else {
      btn.classList.remove('active', 'text-indigo-600', 'font-bold');
      btn.classList.add('text-slate-600');
    }
  });
  
  // Update tab content
  document.querySelectorAll('.tab-content').forEach(content => {
    content.classList.add('hidden');
  });
  document.getElementById(`${tab}-content`).classList.remove('hidden');
  
  // Clear search
  document.getElementById('searchInput').value = '';
  
  // Render tab
  renderCurrentTab();
}

function renderCurrentTab() {
  const data = typeData[currentTab] || {};
  const container = document.getElementById(`${currentTab}-list`);
  
  // Sort by game count (descending)
  const sorted = Object.entries(data)
    .sort((a, b) => b[1].games.length - a[1].games.length);
  
  container.innerHTML = '';
  
  if (sorted.length === 0) {
    container.innerHTML = '<div class="text-center text-slate-400 py-8">No data yet...</div>';
    return;
  }
  
  sorted.forEach(([id, item]) => {
    const card = document.createElement('div');
    card.className = 'type-card bg-slate-50 rounded-lg p-3 border border-slate-200 flex items-center justify-between';
    card.onclick = () => showGames(item.name, item.games);
    
    card.innerHTML = `
      <span class="font-semibold text-slate-900">${item.name}</span>
      <span class="bg-indigo-600 text-white px-3 py-1 rounded-full text-sm font-bold">${item.games.length}</span>
    `;
    
    container.appendChild(card);
  });
}

function filterTypes() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const data = typeData[currentTab] || {};
  const container = document.getElementById(`${currentTab}-list`);
  
  // Sort by game count (descending)
  const sorted = Object.entries(data)
    .filter(([id, item]) => item.name.toLowerCase().includes(search))
    .sort((a, b) => b[1].games.length - a[1].games.length);
  
  container.innerHTML = '';
  
  if (sorted.length === 0) {
    container.innerHTML = '<div class="text-center text-slate-400 py-8">No results found</div>';
    return;
  }
  
  sorted.forEach(([id, item]) => {
    const card = document.createElement('div');
    card.className = 'type-card bg-slate-50 rounded-lg p-3 border border-slate-200 flex items-center justify-between';
    card.onclick = () => showGames(item.name, item.games);
    
    card.innerHTML = `
      <span class="font-semibold text-slate-900">${item.name}</span>
      <span class="bg-indigo-600 text-white px-3 py-1 rounded-full text-sm font-bold">${item.games.length}</span>
    `;
    
    container.appendChild(card);
  });
}

function showGames(title, games) {
  const modal = document.getElementById('modalOverlay');
  const modalTitle = document.getElementById('modalTitle');
  const sortSelect = document.getElementById('modalSortSelect');
  
  // Ensure all games have stats loaded - rebuild from allGames to guarantee data integrity
  currentModalGames = games.map(game => {
    const fullGameData = allGames.find(g => g.objectid === game.objectid);
    if (fullGameData && fullGameData.loaded) {
      // Return the full game data object with all stats
      return fullGameData;
    }
    // Fallback to original game if not found (shouldn't happen)
    return {
      ...game,
      bggRating: game.bggRating || 0,
      bayesAverage: game.bayesAverage || 0,
      weight: game.weight || 0,
      rank: game.rank || 999999,
      year: game.year || 0,
      minPlaytime: game.minPlaytime || 0,
      maxPlaytime: game.maxPlaytime || 0,
      minAge: game.minAge || 0,
      minPlayers: game.minPlayers || 1,
      maxPlayers: game.maxPlayers || 1,
      playersDisplay: game.playersDisplay || '1'
    };
  });
  
  modalTitle.textContent = `${title} (${games.length})`;
  sortSelect.value = 'bayaverage-desc';
  
  sortModalGames('bayaverage-desc');
  modal.classList.remove('hidden');
}

let currentModalGames = [];

function sortModalGames(sortBy) {
  let sorted = [...currentModalGames];
  
  if (sortBy === 'bayaverage-desc') {
    sorted.sort((a, b) => (b.bayesAverage || 0) - (a.bayesAverage || 0));
  } else if (sortBy === 'bayaverage-asc') {
    sorted.sort((a, b) => (a.bayesAverage || 0) - (b.bayesAverage || 0));
  } else if (sortBy === 'average-desc') {
    sorted.sort((a, b) => (b.bggRating || 0) - (a.bggRating || 0));
  } else if (sortBy === 'average-asc') {
    sorted.sort((a, b) => (a.bggRating || 0) - (b.bggRating || 0));
  } else if (sortBy === 'rank-asc') {
    sorted.sort((a, b) => (a.rank || 999999) - (b.rank || 999999));
  } else if (sortBy === 'rank-desc') {
    sorted.sort((a, b) => {
      const rankA = (a.rank === 999999) ? -1 : a.rank;
      const rankB = (b.rank === 999999) ? -1 : b.rank;
      return rankB - rankA;
    });
  } else if (sortBy === 'weight-desc') {
    sorted.sort((a, b) => (b.weight || 0) - (a.weight || 0));
  } else if (sortBy === 'weight-asc') {
    sorted.sort((a, b) => (a.weight || 0) - (b.weight || 0));
  } else if (sortBy === 'year-desc') {
    sorted.sort((a, b) => (b.year || 0) - (a.year || 0));
  } else if (sortBy === 'year-asc') {
    sorted.sort((a, b) => (a.year || 0) - (b.year || 0));
  } else if (sortBy === 'playtime-desc') {
    sorted.sort((a, b) => (b.maxPlaytime || 0) - (a.maxPlaytime || 0));
  } else if (sortBy === 'playtime-asc') {
    sorted.sort((a, b) => (a.maxPlaytime || 0) - (b.maxPlaytime || 0));
  } else if (sortBy === 'players-desc') {
    sorted.sort((a, b) => (b.maxPlayers || 0) - (a.maxPlayers || 0));
  } else if (sortBy === 'players-asc') {
    sorted.sort((a, b) => (a.minPlayers || 0) - (b.minPlayers || 0));
  } else if (sortBy === 'alpha') {
    sorted.sort((a, b) => a.name.localeCompare(b.name));
  }
  
  renderModalGames(sorted);
}

async function fetchAPI(endpoint, user, queryParams = '') {
  if (endpoint === 'thing') {
    let url = `/api/bgg-helper?endpoint=${endpoint}&id=${encodeURIComponent(user)}${queryParams}`;
    for (let attempt = 0; attempt < 5; attempt++) {
      let res;
      try {
        res = await fetch(url);
      } catch (e) {
        await wait(1500 * Math.pow(2, attempt));
        continue;
      }
      if (res.status === 202) {
        await wait(3000);
        continue;
      }
      if (res.ok) {
        return await res.text();
      }
      await wait(2000);
    }
    throw new Error('Failed to fetch from BGG API');
  } else {
    if (!user || user.trim() === '') {
      throw new Error('Username is required');
    }
    let url = `/api/bgg-helper?endpoint=${endpoint}&username=${encodeURIComponent(user)}${queryParams}`;
    for (let attempt = 0; attempt < 5; attempt++) {
      let res;
      try {
        res = await fetch(url);
      } catch (e) {
        await wait(1000 * Math.pow(2, attempt));
        continue;
      }
      if (res.status === 202) {
        await wait(2000);
        continue;
      }
      if (res.ok) return await res.text();
      await wait(1500);
    }
    throw new Error('Failed to fetch from BGG API');
  }
}

function wait(ms) {
  return new Promise(r => setTimeout(r, ms));
}

// Tab switching
document.querySelectorAll('.tab-button').forEach(btn => {
