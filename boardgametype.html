<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>BGG Game Types | Sportomax</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #060b14;
      --surface: rgba(255,255,255,0.025);
      --surface-raised: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.07);
      --border-accent: rgba(99,102,241,0.25);
      --text: #e2e8f0;
      --text-muted: #475569;
      --text-dim: #64748b;
      --accent: #818cf8;
      --accent-bg: rgba(99,102,241,0.12);
      --accent-glow: rgba(99,102,241,0.15);
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 5rem;
    }

    /* ── Layout ── */
    .page-wrap { max-width: 56rem; margin: 0 auto; padding: 1.5rem; }
    .space-y { display: flex; flex-direction: column; gap: 1.5rem; }

    /* ── Header ── */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(6,11,20,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .site-header-inner {
      max-width: 56rem;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-brand { display: flex; align-items: center; gap: 0.875rem; }
    .header-icon {
      width: 2.75rem;
      height: 2.75rem;
      background: rgba(99,102,241,0.15);
      border: 1px solid rgba(99,102,241,0.25);
      border-radius: 0.875rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 1.125rem;
    }
    .header-title {
      font-size: 1.375rem;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--text);
    }
    .header-title .accent { color: var(--accent); }
    .header-sub {
      font-size: 0.5625rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }
    .header-stat { text-align: right; }
    .header-stat-num {
      font-size: 1.5rem;
      font-weight: 900;
      font-style: italic;
      color: var(--accent);
      line-height: 1;
    }
    .header-stat-label {
      font-size: 0.5rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    /* ── Cards / Surfaces ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 1.75rem;
    }
    .card-title {
      font-size: 1.125rem;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      margin-bottom: 1.25rem;
    }
    .card-title .accent { color: var(--accent); }

    /* ── Labels ── */
    .label {
      display: block;
      font-size: 0.5625rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    /* ── Inputs ── */
    input, select {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.625rem 0.875rem;
      color: var(--text);
      font-size: 0.875rem;
      font-weight: 500;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    input:focus, select:focus {
      border-color: rgba(99,102,241,0.45);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
    }
    select option { background: #0c1324; }

    /* ── Primary Button ── */
    .btn-primary {
      width: 100%;
      padding: 0.875rem 1.5rem;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 0.875rem;
      font-family: inherit;
      font-size: 0.6875rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(79,70,229,0.3);
    }
    .btn-primary:hover { background: #6366f1; box-shadow: 0 6px 28px rgba(99,102,241,0.4); }
    .btn-primary:active { transform: scale(0.97); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ── Fetch Section grid ── */
    .fetch-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
    @media (min-width: 640px) { .fetch-grid { grid-template-columns: 1fr 1fr; } }
    .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

    /* ── Loading Section ── */
    .loading-card { text-align: center; padding: 3rem 2rem; }
    .spinner-wrap { position: relative; width: 3rem; height: 3rem; margin: 0 auto 1.5rem; }
    .spinner-track {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid rgba(99,102,241,0.12);
    }
    .spinner-head {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #6366f1;
      animation: spin 0.75s linear infinite;
    }
    .loading-label {
      font-size: 1rem;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      margin-bottom: 0.875rem;
    }
    .progress-track {
      max-width: 16rem;
      margin: 0 auto;
      height: 3px;
      background: rgba(255,255,255,0.06);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4f46e5, #818cf8);
      border-radius: 99px;
      transition: width 0.3s ease;
      box-shadow: 0 0 8px rgba(99,102,241,0.6);
    }

    /* ── Tab Bar ── */
    .tab-nav {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 0.875rem;
      padding: 0.25rem;
      display: flex;
      gap: 0.2rem;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tab-nav::-webkit-scrollbar { display: none; }
    .tab-button {
      flex: 1;
      min-width: max-content;
      padding: 0.5rem 0.75rem;
      border-radius: 0.625rem;
      font-size: 0.5625rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--text-dim);
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      white-space: nowrap;
    }
    .tab-button:hover { color: #94a3b8; background: rgba(255,255,255,0.03); }
    .tab-button.active {
      color: var(--accent);
      background: var(--accent-bg);
      border-color: var(--border-accent);
    }

    /* ── Search Input Wrapper ── */
    .search-wrap { position: relative; }
    .search-wrap i {
      position: absolute;
      left: 0.875rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 0.75rem;
      pointer-events: none;
    }
    .search-wrap input { padding-left: 2.25rem; }

    /* ── Type Cards ── */
    .type-grid { display: grid; grid-template-columns: 1fr; gap: 0.5rem; }
    @media (min-width: 640px) { .type-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 900px) { .type-grid { grid-template-columns: repeat(3, 1fr); } }

    .type-card {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      padding: 0.75rem 0.875rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 2px solid transparent;
      border-radius: 0.75rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, border-left-color 0.2s, transform 0.2s;
      text-align: left;
      width: 100%;
      font-family: inherit;
    }
    .type-card:hover {
      background: rgba(99,102,241,0.06);
      border-color: rgba(99,102,241,0.18);
      border-left-color: rgba(99,102,241,0.55);
      transform: translateX(3px);
    }
    .type-card-rank {
      font-size: 0.5625rem;
      font-weight: 900;
      color: rgba(255,255,255,0.1);
      width: 1rem;
      text-align: right;
      flex-shrink: 0;
      font-style: normal;
    }
    .type-card-name {
      flex: 1;
      font-size: 0.75rem;
      font-weight: 700;
      color: #cbd5e1;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .type-card-count {
      background: var(--accent-bg);
      color: var(--accent);
      border: 1px solid rgba(99,102,241,0.18);
      border-radius: 0.375rem;
      padding: 0.2rem 0.5rem;
      font-size: 0.5625rem;
      font-weight: 900;
      flex-shrink: 0;
    }
    .type-empty {
      grid-column: 1 / -1;
      padding: 4rem 1rem;
      text-align: center;
      font-size: 0.625rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.08);
    }

    /* ── Modal Overlay ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2,6,23,0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-overlay.hidden { display: none; }
    .modal-overlay.show { opacity: 1; pointer-events: auto; }

    /* ── Modal Panel ── */
    .modal-panel {
      background: #0b1120;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 1.75rem;
      width: 100%;
      max-width: 52rem;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 30px 90px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.05);
      transform: scale(0.95) translateY(16px);
      opacity: 0;
      transition: transform 0.38s cubic-bezier(0.34,1.56,0.64,1), opacity 0.25s ease;
    }
    .modal-overlay.show .modal-panel { transform: scale(1) translateY(0); opacity: 1; }

    .modal-header {
      padding: 1.25rem 1.5rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(0,0,0,0.25);
      flex-shrink: 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
    }
    .modal-header-left {}
    .modal-title {
      font-size: 1.125rem;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.1;
    }
    .modal-meta {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      margin-top: 0.5rem;
    }
    .modal-count {
      font-size: 0.5625rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
    }
    .modal-sort-wrap { display: flex; align-items: center; gap: 0.5rem; }
    .modal-sort-label {
      font-size: 0.5rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }
    #modalSortSelect {
      width: auto;
      padding: 0.375rem 0.625rem;
      font-size: 0.625rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      border-radius: 0.5rem;
      cursor: pointer;
    }
    .modal-header-right { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
    .modal-close {
      width: 2.25rem;
      height: 2.25rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 0.625rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      font-size: 0.8125rem;
      font-family: inherit;
    }
    .modal-close:hover { background: rgba(255,255,255,0.09); color: var(--text); border-color: rgba(255,255,255,0.15); }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
    }

    /* ── Game Cards (modal) ── */
    .game-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 0.875rem;
      overflow: hidden;
      margin-bottom: 0.5rem;
      transition: border-color 0.2s;
    }
    .game-card:hover { border-color: rgba(255,255,255,0.1); }
    .game-card-header {
      display: flex;
      align-items: center;
      gap: 0.875rem;
      padding: 0.875rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .game-card-header:hover { background: rgba(255,255,255,0.03); }
    .game-card-thumb {
      width: 3.25rem;
      height: 3.25rem;
      border-radius: 0.625rem;
      object-fit: contain;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.07);
      flex-shrink: 0;
      padding: 3px;
    }
    .game-card-info { flex: 1; min-width: 0; }
    .game-card-name {
      font-size: 0.8125rem;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }
    .game-card-pills { display: flex; flex-wrap: wrap; gap: 0.375rem; margin-top: 0.5rem; }
    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 0.375rem;
      padding: 0.2rem 0.5rem;
      font-size: 0.5625rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
    }
    .stat-pill.accent { color: var(--accent); border-color: rgba(99,102,241,0.18); background: var(--accent-bg); }
    .stat-pill i { opacity: 0.6; }
    .game-card-chevron {
      color: rgba(255,255,255,0.2);
      font-size: 0.6875rem;
      padding: 0.375rem;
      transition: transform 0.3s ease;
      flex-shrink: 0;
    }

    /* Smooth expand */
    .game-card-details {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.42s cubic-bezier(0.4,0,0.2,1);
    }
    .game-card-details.show { max-height: 750px; }
    .game-card-details-inner {
      padding: 1rem 1rem 1.25rem;
      border-top: 1px solid rgba(255,255,255,0.05);
      background: rgba(0,0,0,0.2);
    }

    /* Detail sections */
    .detail-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
    @media (min-width: 540px) { .detail-grid { grid-template-columns: 1fr 1fr; } }
    .detail-desc {
      font-size: 0.6875rem;
      color: #64748b;
      line-height: 1.6;
      font-style: italic;
      border-left: 2px solid rgba(99,102,241,0.25);
      padding-left: 0.75rem;
      margin-bottom: 0.875rem;
    }
    .metric-box {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 0.625rem;
      padding: 0.625rem 0.75rem;
    }
    .metric-label {
      font-size: 0.5rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      display: block;
      margin-bottom: 0.25rem;
    }
    .metric-value { font-size: 0.8125rem; font-weight: 700; color: var(--text); }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    .community-box {
      background: rgba(99,102,241,0.05);
      border: 1px solid rgba(99,102,241,0.1);
      border-radius: 0.75rem;
      padding: 0.875rem;
    }
    .community-box-title {
      font-size: 0.5625rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }
    .community-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.625rem; }
    .community-stat-label {
      font-size: 0.5rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }
    .community-stat-val { font-size: 0.875rem; font-weight: 700; color: var(--text); }
    .btn-bgg {
      display: block;
      width: 100%;
      margin-top: 0.875rem;
      padding: 0.75rem;
      background: rgba(79,70,229,0.15);
      border: 1px solid rgba(99,102,241,0.25);
      border-radius: 0.625rem;
      color: var(--accent);
      font-family: inherit;
      font-size: 0.5625rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      text-align: center;
    }
    .btn-bgg:hover { background: rgba(99,102,241,0.22); border-color: rgba(99,102,241,0.4); }
    .btn-bgg:active { transform: scale(0.98); }

    /* Scrollbar */
    .scrollbar::-webkit-scrollbar { width: 4px; }
    .scrollbar::-webkit-scrollbar-track { background: transparent; }
    .scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 10px; }
    .scrollbar { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.08) transparent; }

    /* Animations */
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.35s ease-out forwards; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="site-header-inner">
      <div class="header-brand">
        <div class="header-icon"><i class="fa-solid fa-dice-d20"></i></div>
        <div>
          <div class="header-title">Game <span class="accent">Types</span></div>
          <div class="header-sub">Deep Collection Analysis</div>
        </div>
      </div>
      <div id="statsBox" class="header-stat hidden">
        <div class="header-stat-num" id="gameCount">0</div>
        <div class="header-stat-label">Games</div>
      </div>
    </div>
  </header>

  <main class="page-wrap">
    <div class="space-y">

      <!-- Fetch Section -->
      <div id="fetchSection" class="card">
        <div class="card-title">Connect <span class="accent">Collection</span></div>
        <div class="fetch-grid">

          <div style="display:flex;flex-direction:column;gap:1rem;">
            <div>
              <label class="label" for="username">BGG Username</label>
              <input id="username" type="text" value="sportomax" placeholder="Enter username…">
            </div>
            <button onclick="fetchCollection()" id="fetchBtn" class="btn-primary">
              <i class="fa-solid fa-bolt" style="margin-right:0.4rem;opacity:0.8"></i> Load Data Engine
            </button>
          </div>

          <div>
            <span class="label" style="margin-bottom:0.75rem;display:block">Status Filters</span>
            <div class="filter-grid">
              <div>
                <label class="label" style="font-size:0.5rem" for="filter-own">Own</label>
                <select id="filter-own">
                  <option value="any">Any</option>
                  <option value="1" selected>Yes</option>
                  <option value="0">No</option>
                </select>
              </div>
              <div>
                <label class="label" style="font-size:0.5rem" for="filter-played">Played</label>
                <select id="filter-played">
                  <option value="any" selected>Any</option>
                  <option value="1">Yes</option>
                  <option value="0">No</option>
                </select>
              </div>
              <div>
                <label class="label" style="font-size:0.5rem" for="filter-wanttoplay">Want Play</label>
                <select id="filter-wanttoplay">
                  <option value="any" selected>Any</option>
                  <option value="1">Yes</option>
                  <option value="0">No</option>
                </select>
              </div>
              <div>
                <label class="label" style="font-size:0.5rem" for="filter-prevowned">Prev Owned</label>
                <select id="filter-prevowned">
                  <option value="any" selected>Any</option>
                  <option value="1">Yes</option>
                  <option value="0">No</option>
                </select>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- Loading Section -->
      <div id="loadingSection" class="card loading-card hidden">
        <div class="spinner-wrap">
          <div class="spinner-track"></div>
          <div class="spinner-head"></div>
        </div>
        <div class="loading-label" id="loadingStatus">Scanning Library…</div>
        <div class="progress-track">
          <div id="progressBar" class="progress-fill" style="width:0%"></div>
        </div>
      </div>

      <!-- Tabs Section -->
      <div id="tabsSection" class="hidden" style="display:none">
        <div class="space-y fade-up">

          <nav class="tab-nav" role="tablist">
            <button class="tab-button active" data-tab="category">Categories</button>
            <button class="tab-button" data-tab="mechanic">Mechanics</button>
            <button class="tab-button" data-tab="family">Families</button>
            <button class="tab-button" data-tab="designer">Designers</button>
            <button class="tab-button" data-tab="artist">Artists</button>
            <button class="tab-button" data-tab="publisher">Publishers</button>
          </nav>

          <div class="search-wrap">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Filter current list…" oninput="filterTypes()">
          </div>

          <div id="category-content"  class="type-grid tab-content"></div>
          <div id="mechanic-content"  class="type-grid tab-content" style="display:none"></div>
          <div id="family-content"    class="type-grid tab-content" style="display:none"></div>
          <div id="designer-content"  class="type-grid tab-content" style="display:none"></div>
          <div id="artist-content"    class="type-grid tab-content" style="display:none"></div>
          <div id="publisher-content" class="type-grid tab-content" style="display:none"></div>

        </div>
      </div>

    </div>
  </main>

  <!-- Modal -->
  <div id="modalOverlay" class="modal-overlay hidden" onclick="closeModalOnBackdrop(event)">
    <div class="modal-panel" onclick="event.stopPropagation()">

      <div class="modal-header">
        <div class="modal-header-left">
          <div class="modal-title" id="modalTitle"></div>
          <div class="modal-meta">
            <span class="modal-count" id="modalSubtitle"></span>
            <span style="color:rgba(255,255,255,0.12);font-size:0.5rem">·</span>
            <span class="modal-sort-label">Sort</span>
            <select id="modalSortSelect" onchange="sortModalGames(this.value)">
              <optgroup label="Popularity">
                <option value="rank-asc">BGG Rank (Best)</option>
                <option value="numratings-desc">Most Ratings</option>
                <option value="owned-desc">Most Owned</option>
              </optgroup>
              <optgroup label="Ratings">
                <option value="bayaverage-desc" selected>Bayes Average</option>
                <option value="average-desc">Raw Average</option>
                <option value="weight-desc">Complexity</option>
              </optgroup>
              <optgroup label="Metadata">
                <option value="year-desc">Newest First</option>
                <option value="playtime-desc">Play Time</option>
                <option value="alpha">A – Z</option>
              </optgroup>
            </select>
          </div>
        </div>
        <div class="modal-header-right">
          <button class="modal-close" onclick="closeModal()">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>

      <div class="modal-body scrollbar" id="modalContent"></div>

    </div>
  </div>

<script>
const TYPE_MAP = {
  'category':  'boardgamecategory',
  'mechanic':  'boardgamemechanic',
  'family':    'boardgamefamily',
  'designer':  'boardgamedesigner',
  'artist':    'boardgameartist',
  'publisher': 'boardgamepublisher'
};

let allGames = [];
let typeData = {};
let currentTab = 'category';
let currentSort = 'bayaverage-desc';
let currentModalGames = [];
const IMAGE_PROXY = '/api/image-proxy?url=';

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function initTypeData() {
  Object.keys(TYPE_MAP).forEach(key => typeData[key] = {});
}

async function fetchAPI(endpoint, id, params = '', retries = 5) {
  const url = `/api/bgg-helper?endpoint=${endpoint}&${endpoint === 'thing' ? 'id' : 'username'}=${encodeURIComponent(id)}${params}`;
  for (let i = 0; i < retries; i++) {
    try {
      const res = await fetch(url);
      if (res.status === 202) { await wait(2000 * (i + 1)); continue; }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.text();
    } catch (e) {
      if (i === retries - 1) throw e;
      await wait(1000 * (i + 1));
    }
  }
}

async function fetchCollection() {
  const username = document.getElementById('username').value.trim() || 'sportomax';
  const fetchBtn = document.getElementById('fetchBtn');
  const setupBox = document.getElementById('fetchSection');
  const loadBox  = document.getElementById('loadingSection');
  const tabsBox  = document.getElementById('tabsSection');

  fetchBtn.disabled = true;
  loadBox.style.display = '';
  loadBox.classList.remove('hidden');
  initTypeData();

  try {
    const xml = await fetchAPI('collection', username, '&stats=1');
    const doc  = new DOMParser().parseFromString(xml, 'text/xml');
    const items = Array.from(doc.querySelectorAll('item'));

    allGames = items.map(item => {
      const statusEl = item.querySelector('status');
      return {
        objectid: item.getAttribute('objectid'),
        name:  item.querySelector('name')?.textContent?.trim() || 'Unknown',
        thumb: item.querySelector('thumbnail')?.textContent || '',
        status: {
          own:         statusEl?.getAttribute('own')         === '1',
          played:      statusEl?.getAttribute('played')      === '1',
          wanttoplay:  statusEl?.getAttribute('wanttoplay')  === '1',
          prevowned:   statusEl?.getAttribute('prevowned')   === '1'
        },
        loaded: false
      };
    });

    setupBox.classList.add('hidden');
    document.getElementById('statsBox').classList.remove('hidden');

    // Batch fetch 20 games at a time, up to 100 parallel batches
    const batchSize = 20, parallelLimit = 100;
    const batches = [];
    for (let i = 0; i < allGames.length; i += batchSize) batches.push(allGames.slice(i, i + batchSize));

    for (let i = 0; i < batches.length; i += parallelLimit) {
      const group = batches.slice(i, i + parallelLimit);
      const progress = Math.round((i / batches.length) * 100);
      document.getElementById('progressBar').style.width = `${progress}%`;
      document.getElementById('loadingStatus').textContent = `Crunching Data (${progress}%)`;

      await Promise.all(group.map(async batch => {
        const ids = batch.map(g => g.objectid).join(',');
        const thingXml = await fetchAPI('thing', ids, '&stats=1');
        const thingDoc = new DOMParser().parseFromString(thingXml, 'text/xml');

        thingDoc.querySelectorAll('item').forEach(item => {
          const id = item.getAttribute('id');
          const game = allGames.find(g => g.objectid === id);
          if (!game) return;

          const stats = item.querySelector('statistics ratings');
          if (stats) {
            game.bggRating   = parseFloat(stats.querySelector('average')?.getAttribute('value')       || '0');
            game.bayesAverage= parseFloat(stats.querySelector('bayesaverage')?.getAttribute('value')  || '0');
            game.weight      = parseFloat(stats.querySelector('averageweight')?.getAttribute('value') || '0');
            game.numRatings  = parseInt(stats.querySelector('usersrated')?.getAttribute('value')      || '0');
            game.owned       = parseInt(stats.querySelector('owned')?.getAttribute('value')           || '0');
            game.wishing     = parseInt(stats.querySelector('wishing')?.getAttribute('value')         || '0');
            game.median      = parseFloat(stats.querySelector('median')?.getAttribute('value')        || '0');
            game.stddev      = parseFloat(stats.querySelector('stddev')?.getAttribute('value')        || '0');
            const bgrRank    = stats.querySelector('rank[name="boardgame"]');
            const rankVal    = bgrRank?.getAttribute('value');
            game.rank        = (rankVal && rankVal !== 'Not Ranked') ? parseInt(rankVal) : 999999;
          }

          game.year       = parseInt(item.querySelector('yearpublished')?.getAttribute('value') || '0');
          game.minPlayers = parseInt(item.querySelector('minplayers')?.getAttribute('value')    || '1');
          game.maxPlayers = parseInt(item.querySelector('maxplayers')?.getAttribute('value')    || '1');
          game.minPlaytime= parseInt(item.querySelector('minplaytime')?.getAttribute('value')   || '0');
          game.maxPlaytime= parseInt(item.querySelector('maxplaytime')?.getAttribute('value')   || '0');
          game.minAge     = parseInt(item.querySelector('minage')?.getAttribute('value')        || '0');
          game.description= item.querySelector('description')?.textContent?.substring(0, 400)  || '';

          Object.keys(TYPE_MAP).forEach(key => {
            const links = Array.from(item.querySelectorAll(`link[type="${TYPE_MAP[key]}"]`));
            game[key + 's'] = links.map(l => l.getAttribute('value'));
            links.forEach(l => {
              const name = l.getAttribute('value');
              if (!typeData[key][name]) typeData[key][name] = { name, games: [] };
              typeData[key][name].games.push(game);
            });
          });
          game.loaded = true;
        });
      }));
    }

    applyFilters();
    loadBox.classList.add('hidden');
    tabsBox.style.display = '';
    tabsBox.classList.remove('hidden');
  } catch (e) { alert(e.message); location.reload(); }
}

function applyFilters() {
  const own    = document.getElementById('filter-own').value;
  const played = document.getElementById('filter-played').value;
  const want   = document.getElementById('filter-wanttoplay').value;
  const prev   = document.getElementById('filter-prevowned').value;

  const filtered = allGames.filter(g => {
    if (own    !== 'any' && g.status.own        !== (own    === '1')) return false;
    if (played !== 'any' && g.status.played     !== (played === '1')) return false;
    if (want   !== 'any' && g.status.wanttoplay !== (want   === '1')) return false;
    if (prev   !== 'any' && g.status.prevowned  !== (prev   === '1')) return false;
    return true;
  });

  initTypeData();
  filtered.forEach(g => {
    Object.keys(TYPE_MAP).forEach(key => {
      if (g[key + 's']) {
        g[key + 's'].forEach(name => {
          if (!typeData[key][name]) typeData[key][name] = { name, games: [] };
          typeData[key][name].games.push(g);
        });
      }
    });
  });

  document.getElementById('gameCount').textContent = filtered.length;
  renderCurrentTab();
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
  document.getElementById(`${tab}-content`).style.display = '';
  renderCurrentTab();
}

function renderCurrentTab() {
  const container = document.getElementById(`${currentTab}-content`);
  const query = (document.getElementById('searchInput')?.value || '').toLowerCase();

  const entries = Object.values(typeData[currentTab])
    .filter(e => e.name.toLowerCase().includes(query))
    .sort((a, b) => b.games.length - a.games.length);

  if (!entries.length) {
    container.innerHTML = '<div class="type-empty">No matches found</div>';
    return;
  }

  container.innerHTML = entries.map((e, i) => `
    <button class="type-card" data-name="${escHtml(e.name)}" onclick="openModal(this.dataset.name)">
      <span class="type-card-rank">${i + 1}</span>
      <span class="type-card-name">${escHtml(e.name)}</span>
      <span class="type-card-count">${e.games.length}</span>
    </button>
  `).join('');
}

function filterTypes() { renderCurrentTab(); }

function openModal(typeName) {
  const data = typeData[currentTab][typeName];
  if (!data) return;
  currentModalGames = [...data.games];
  document.getElementById('modalTitle').textContent = typeName;
  document.getElementById('modalSubtitle').textContent = `${currentModalGames.length} titles`;
  sortModalGames(currentSort);
  const overlay = document.getElementById('modalOverlay');
  overlay.style.display = '';
  overlay.classList.remove('hidden');
  requestAnimationFrame(() => requestAnimationFrame(() => overlay.classList.add('show')));
}

function closeModal() {
  const overlay = document.getElementById('modalOverlay');
  overlay.classList.remove('show');
  setTimeout(() => { overlay.classList.add('hidden'); overlay.style.display = 'none'; }, 320);
}

function closeModalOnBackdrop(e) {
  if (e.target === e.currentTarget) closeModal();
}

function sortModalGames(sortBy) {
  currentSort = sortBy;
  const sorters = {
    'bayaverage-desc':  (a,b) => b.bayesAverage - a.bayesAverage,
    'average-desc':     (a,b) => b.bggRating    - a.bggRating,
    'rank-asc':         (a,b) => a.rank          - b.rank,
    'weight-desc':      (a,b) => b.weight        - a.weight,
    'year-desc':        (a,b) => b.year          - a.year,
    'numratings-desc':  (a,b) => b.numRatings    - a.numRatings,
    'owned-desc':       (a,b) => b.owned         - a.owned,
    'wishing-desc':     (a,b) => b.wishing       - a.wishing,
    'playtime-desc':    (a,b) => b.maxPlaytime   - a.maxPlaytime,
    'alpha':            (a,b) => a.name.localeCompare(b.name)
  };
  const sorted = [...currentModalGames].sort(sorters[sortBy] || sorters.alpha);
  renderModalGames(sorted);
}

function renderModalGames(games) {
  const container = document.getElementById('modalContent');

  // Build top stat pill based on current sort
  function topStatPill(g) {
    if (currentSort.startsWith('rank'))
      return `<span class="stat-pill accent"><i class="fa-solid fa-trophy"></i> #${g.rank < 999999 ? g.rank.toLocaleString() : 'NR'}</span>`;
    if (currentSort.startsWith('weight'))
      return `<span class="stat-pill accent"><i class="fa-solid fa-weight-scale"></i> ${g.weight.toFixed(1)}</span>`;
    if (currentSort.startsWith('numratings'))
      return `<span class="stat-pill accent"><i class="fa-solid fa-users"></i> ${(g.numRatings/1000).toFixed(1)}k</span>`;
    return `<span class="stat-pill accent"><i class="fa-solid fa-star"></i> ${g.bayesAverage.toFixed(2)}</span>`;
  }

  container.innerHTML = games.map((g, i) => {
    const delay = Math.min(i * 0.04, 0.5);
    return `
      <div class="game-card fade-up" style="animation-delay:${delay}s">
        <div class="game-card-header" onclick="toggleDetails(${i})">
          <img src="${IMAGE_PROXY}${encodeURIComponent(g.thumb)}"
               class="game-card-thumb"
               onerror="this.src='https://placehold.co/80x80/0b1120/334155?text=?'">
          <div class="game-card-info">
            <div class="game-card-name">${escHtml(g.name)}</div>
            <div class="game-card-pills">
              ${topStatPill(g)}
              <span class="stat-pill"><i class="fa-regular fa-calendar"></i> ${g.year || '—'}</span>
              <span class="stat-pill"><i class="fa-solid fa-users"></i> ${g.minPlayers}–${g.maxPlayers}</span>
            </div>
          </div>
          <i class="fa-solid fa-chevron-down game-card-chevron" id="chevron-${i}"></i>
        </div>
        <div class="game-card-details" id="details-${i}">
          <div class="game-card-details-inner">
            <div class="detail-grid">
              <div>
                <p class="detail-desc">${escHtml(g.description)}…</p>
                <div class="two-col">
                  <div class="metric-box">
                    <span class="metric-label">Raw Avg</span>
                    <span class="metric-value">${g.bggRating.toFixed(2)}</span>
                  </div>
                  <div class="metric-box">
                    <span class="metric-label">Std Dev</span>
                    <span class="metric-value">${g.stddev.toFixed(2)}</span>
                  </div>
                </div>
              </div>
              <div>
                <div class="community-box">
                  <div class="community-box-title">Community Metrics</div>
                  <div class="community-grid">
                    <div>
                      <div class="community-stat-label">Owned</div>
                      <div class="community-stat-val">${(g.owned/1000).toFixed(1)}k</div>
                    </div>
                    <div>
                      <div class="community-stat-label">Wishing</div>
                      <div class="community-stat-val">${g.wishing.toLocaleString()}</div>
                    </div>
                    <div>
                      <div class="community-stat-label">Median</div>
                      <div class="community-stat-val">${g.median}</div>
                    </div>
                    <div>
                      <div class="community-stat-label">Weight</div>
                      <div class="community-stat-val">${g.weight.toFixed(2)}/5</div>
                    </div>
                  </div>
                </div>
                <button class="btn-bgg" onclick="window.open('https://boardgamegeek.com/boardgame/${g.objectid}','_blank')">
                  <i class="fa-solid fa-arrow-up-right-from-square" style="margin-right:0.35rem"></i>BGG Profile
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function toggleDetails(i) {
  const details = document.getElementById(`details-${i}`);
  const chevron = document.getElementById(`chevron-${i}`);
  const isOpen  = details.classList.toggle('show');
  chevron.style.transform = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

document.querySelectorAll('.tab-button').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});
</script>
</body>
</html>
