<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Board Game Types</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🎲</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            min-height: 100%;
            /* allow the page to scroll vertically when content exceeds the viewport */
            overflow-y: auto;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            padding-top: env(safe-area-inset-top, 0);
            padding-bottom: env(safe-area-inset-bottom, 0);
            padding-left: env(safe-area-inset-left, 0);
            padding-right: env(safe-area-inset-right, 0);
        }

        .header {
            flex-shrink: 0;
            padding: 1rem;
            border-bottom: 1px solid #eee;
            background: white;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            color: #333;
        }

        .setup-section {
            flex-shrink: 0;
            padding: 1rem;
            background: white;
            border-bottom: 1px solid #eee;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .setup-input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            -webkit-appearance: none;
            appearance: none;
        }

        .setup-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn {
            padding: 0.75rem 1rem;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            font-size: 1rem;
            min-width: 50px;
        }

        .btn:active {
            opacity: 0.9;
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #333;
        }

        .btn-secondary:active {
            background: #d1d5db;
        }

        .status {
            font-size: 0.85rem;
            color: #666;
            padding: 0.5rem;
            background: #f9f9f9;
            border-radius: 4px;
            text-align: center;
        }

        .status.active {
            color: #6366f1;
            font-weight: 600;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 1px solid #eee;
            background: white;
            flex-shrink: 0;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            padding: 1rem 0.75rem;
            text-align: center;
            border: none;
            background: white;
            color: #999;
            cursor: pointer;
            font-weight: 600;
            -webkit-appearance: none;
            appearance: none;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            font-size: 0.85rem;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .tab.active {
            color: #6366f1;
            border-bottom-color: #6366f1;
        }

        .tab:active {
            background: #f5f5f5;
        }

        .tab-content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 1rem;
            display: none;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .items-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .item-card {
            padding: 1rem;
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-card:active {
            background: #e7f3ff;
            border-color: #6366f1;
            transform: scale(0.98);
        }

        .item-name {
            font-weight: 600;
            color: #333;
            flex: 1;
            min-width: 0;
            word-break: break-word;
        }

        .item-count {
            background: #6366f1;
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            flex-shrink: 0;
            margin-left: 0.5rem;
        }

        .no-data {
            text-align: center;
            padding: 2rem 1rem;
            color: #999;
        }

        /* Spider Web Styles */
        .spider-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 1rem;
        }

        .spider-controls {
            background: white;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .spider-controls h3 {
            margin: 0 0 0.75rem 0;
            font-size: 1rem;
            color: #333;
        }

        .spider-select-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .spider-select {
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .spider-canvas-container {
            background: white;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
        }

        #spiderCanvas {
            max-width: 100%;
            height: auto;
        }

        .spider-legend {
            background: white;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #eee;
            max-height: 200px;
            overflow-y: auto;
        }

        .spider-legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
        }

        .spider-legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .overlap-results {
            background: white;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .overlap-results h3 {
            margin: 0 0 0.75rem 0;
            font-size: 1rem;
            color: #333;
        }

        .overlap-games {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 0.5rem;
        }

        .overlap-game {
            text-align: center;
        }

        .overlap-game img {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 0.25rem;
        }

        .overlap-game-name {
            font-size: 0.7rem;
            color: #666;
            line-height: 1.2;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: white;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            padding: 1.5rem 1rem 1rem;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.2rem;
            flex: 1;
            word-break: break-word;
        }

        .modal-close {
            background: #e5e7eb;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            font-size: 1.2rem;
            cursor: pointer;
            flex-shrink: 0;
        }

        .modal-close:active {
            background: #d1d5db;
        }

        .modal-content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 1rem;
        }

        .game-item {
            padding: 0.75rem;
            background: white;
            border: 1px solid #eee;
            border-radius: 6px;
            margin-bottom: 0.5rem;
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .game-thumbnail {
            width: 50px;
            height: 65px;
            background: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .game-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-name {
            font-weight: 500;
            font-size: 0.9rem;
            color: #333;
            flex: 1;
            min-width: 0;
            word-break: break-word;
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎲 Board Game Types</h1>
        </div>

        <div class="setup-section">
            <div class="input-group">
                <input type="text" id="usernameInput" class="setup-input" placeholder="BGG Username" value="sportomax">
                <button class="btn" id="loadBtn">📦 Load</button>
                <button class="btn btn-secondary" id="clearBtn" title="Clear cache">🗑️</button>
            </div>
            <div class="status" id="processingStatus"></div>
        </div>

        <div class="main-content">
            <div class="tabs" id="tabsContainer">
                <button class="tab active" data-tab="category">Categories</button>
                <button class="tab" data-tab="mechanic">Mechanics</button>
                <button class="tab" data-tab="compare">🕸️ Compare</button>
                <button class="tab" data-tab="family">Families</button>
                <button class="tab" data-tab="expansion">Expansions</button>
                <button class="tab" data-tab="accessory">Accessories</button>
                <button class="tab" data-tab="compilation">Compilations</button>
                <button class="tab" data-tab="designer">Designers</button>
                <button class="tab" data-tab="artist">Artists</button>
                <button class="tab" data-tab="publisher">Publishers</button>
            </div>

            <div id="tabsContent">
                <div class="tab-content active" id="category-tab">
                    <div class="items-list" id="category-list"></div>
                </div>
                <div class="tab-content" id="mechanic-tab">
                    <div class="items-list" id="mechanic-list"></div>
                </div>
                <div class="tab-content" id="compare-tab">
                    <div class="spider-container">
                        <div class="spider-controls">
                            <h3>Select items to compare</h3>
                            <div class="spider-select-group">
                                <select class="spider-select" id="compareType">
                                    <option value="category">Categories</option>
                                    <option value="mechanic">Mechanics</option>
                                </select>
                            </div>
                            <div id="compareItemsContainer"></div>
                        </div>
                        <div class="spider-canvas-container">
                            <canvas id="spiderCanvas" width="500" height="500"></canvas>
                        </div>
                        <div class="spider-legend" id="spiderLegend"></div>
                        <div class="overlap-results" id="overlapResults" style="display: none;">
                            <h3>Games in common: <span id="overlapCount">0</span></h3>
                            <div class="overlap-games" id="overlapGames"></div>
                        </div>
                    </div>
                </div>
                <div class="tab-content" id="family-tab">
                    <div class="items-list" id="family-list"></div>
                </div>
                <div class="tab-content" id="expansion-tab">
                    <div class="items-list" id="expansion-list"></div>
                </div>
                <div class="tab-content" id="accessory-tab">
                    <div class="items-list" id="accessory-list"></div>
                </div>
                <div class="tab-content" id="compilation-tab">
                    <div class="items-list" id="compilation-list"></div>
                </div>
                <div class="tab-content" id="designer-tab">
                    <div class="items-list" id="designer-list"></div>
                </div>
                <div class="tab-content" id="artist-tab">
                    <div class="items-list" id="artist-list"></div>
                </div>
                <div class="tab-content" id="publisher-tab">
                    <div class="items-list" id="publisher-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for showing games -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle"></h2>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-content" id="modalContent"></div>
        </div>
    </div>

    <script>
        const TYPE_MAP = {
            'category': 'boardgamecategory',
            'mechanic': 'boardgamemechanic',
            'family': 'boardgamefamily',
            'expansion': 'boardgameexpansion',
            'accessory': 'boardgameaccessory',
            'compilation': 'boardgamecompilation',
            'designer': 'boardgamedesigner',
            'artist': 'boardgameartist',
            'publisher': 'boardgamepublisher'
        };

        const STORAGE_KEY_COLLECTION = 'bgg_types_collection';
        const STORAGE_KEY_TIMESTAMP = 'bgg_types_timestamp';

        let allGames = [];
        let typeData = {};
        let currentUsername = 'sportomax';

        const usernameInput = document.getElementById('usernameInput');
        const loadBtn = document.getElementById('loadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const processingStatus = document.getElementById('processingStatus');
        const tabs = document.querySelectorAll('.tab');
        const tabContents = document.querySelectorAll('.tab-content');
        const modalOverlay = document.getElementById('modalOverlay');

        // Initialize type data
        Object.keys(TYPE_MAP).forEach(key => {
            typeData[key] = {};
        });

        // Tab switching
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tabContents.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab + '-tab').classList.add('active');
            });
        });

        // Load button
        loadBtn.addEventListener('click', loadCollection);

        // Clear cache
        clearBtn.addEventListener('click', () => {
            localStorage.removeItem(STORAGE_KEY_COLLECTION);
            localStorage.removeItem(STORAGE_KEY_TIMESTAMP);
            processingStatus.textContent = 'Cache cleared';
            allGames = [];
            Object.keys(typeData).forEach(key => { typeData[key] = {}; });
            Object.values(document.querySelectorAll('.items-list')).forEach(el => el.innerHTML = '');
            setTimeout(() => { processingStatus.textContent = ''; }, 2000);
        });

        // Helper functions
        async function fetchWithRetry(url, maxRetries = 3) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url);
                    if (response.status === 202) {
                        await new Promise(resolve => setTimeout(resolve, 2000 * (i + 1)));
                        continue;
                    }
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response;
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    await new Promise(resolve => setTimeout(resolve, 1000 * (i + 1)));
                }
            }
        }

        // Load collection
        async function loadCollection() {
            const username = usernameInput.value.trim();
            if (!username) {
                processingStatus.textContent = '❌ Please enter a username';
                processingStatus.classList.add('active');
                return;
            }

            currentUsername = username;
            localStorage.setItem('bgg_types_username', username);

            // Reset
            allGames = [];
            Object.keys(typeData).forEach(key => { typeData[key] = {}; });
            Object.values(document.querySelectorAll('.items-list')).forEach(el => el.innerHTML = '');

            processingStatus.classList.add('active');
            processingStatus.textContent = '📦 Loading collection...';

            try {
                // Check cache
                const cached = localStorage.getItem(STORAGE_KEY_COLLECTION);
                if (cached) {
                    allGames = JSON.parse(cached);
                    processingStatus.textContent = `✅ Loaded ${allGames.length} games from cache`;
                } else {
                    const response = await fetchWithRetry(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1`);
                    const xml = new DOMParser().parseFromString(await response.text(), 'text/xml');
                    const items = xml.querySelectorAll('item');

                    allGames = Array.from(items).map(item => ({
                        id: item.getAttribute('objectid'),
                        name: item.querySelector('name')?.textContent || 'Unknown',
                        image: item.querySelector('image')?.textContent || ''
                    })).filter(g => g.id);

                    localStorage.setItem(STORAGE_KEY_COLLECTION, JSON.stringify(allGames));
                    localStorage.setItem(STORAGE_KEY_TIMESTAMP, new Date().toISOString());
                    processingStatus.textContent = `✅ Loaded ${allGames.length} games`;
                }

                // Process games in batches
                await processGameBatches();

            } catch (error) {
                processingStatus.textContent = `❌ Error: ${error.message}`;
                console.error('Error:', error);
            }
        }

        // Process games in batches
        async function processGameBatches() {
            const batchSize = 20;
            let processed = 0;

            for (let i = 0; i < allGames.length; i += batchSize) {
                const batch = allGames.slice(i, i + batchSize);
                const ids = batch.map(g => g.id).join(',');

                try {
                    processingStatus.textContent = `🔗 Processing ${processed + batch.length}/${allGames.length} games...`;

                    const response = await fetchWithRetry(`/api/bgg-helper?endpoint=thing&id=${ids}&type=boardgame`);
                    const xml = new DOMParser().parseFromString(await response.text(), 'text/xml');
                    const items = xml.querySelectorAll('item');

                    Array.from(items).forEach(item => {
                        const gameId = item.getAttribute('id');
                        const game = allGames.find(g => g.id === gameId);
                        if (!game) return;

                        // Extract all link types
                        Object.entries(TYPE_MAP).forEach(([key, type]) => {
                            const links = item.querySelectorAll(`link[type="${type}"]`);
                            Array.from(links).forEach(link => {
                                const id = link.getAttribute('id');
                                const name = link.getAttribute('value');
                                if (!typeData[key][id]) {
                                    typeData[key][id] = { name, games: [] };
                                }
                                typeData[key][id].games.push(game);
                            });
                        });
                    });

                    processed += batch.length;

                    // Update all tabs with current data (sorted by count desc)
                    updateAllTabs();

                } catch (error) {
                    console.error(`Error processing batch at ${i}:`, error);
                }

                await new Promise(resolve => setTimeout(resolve, 200));
            }

            processingStatus.textContent = `✅ Done! Found ${Object.values(typeData).reduce((sum, t) => sum + Object.keys(t).length, 0)} items`;
            setTimeout(() => { processingStatus.classList.remove('active'); }, 3000);
        }

        // Update all tabs
        function updateAllTabs() {
            Object.keys(TYPE_MAP).forEach(key => {
                renderTab(key);
            });
        }

        // Render tab
        function renderTab(tabKey) {
            const listEl = document.getElementById(`${tabKey}-list`);
            const data = typeData[tabKey];

            // Sort by game count descending
            const sorted = Object.values(data)
                .sort((a, b) => b.games.length - a.games.length);

            if (sorted.length === 0) {
                listEl.innerHTML = '<div class="no-data">No data loaded</div>';
                return;
            }

            listEl.innerHTML = sorted.map(item => `
                <div class="item-card" onclick="showModal('${escapeHtml(item.name)}', ${JSON.stringify(item.games).replace(/"/g, '&quot;')})">
                    <div class="item-name">${escapeHtml(item.name)}</div>
                    <div class="item-count">${item.games.length}</div>
                </div>
            `).join('');
        }

        // Show modal with games
        function showModal(itemName, games) {
            document.getElementById('modalTitle').textContent = itemName;
            const content = document.getElementById('modalContent');
            
            if (games.length === 0) {
                content.innerHTML = '<div class="no-data">No games found</div>';
            } else {
                content.innerHTML = games.map(game => `
                    <div class="game-item">
                        ${game.image ? `<div class="game-thumbnail"><img src="/api/image-proxy?url=${encodeURIComponent(game.image)}" alt="${escapeHtml(game.name)}" onerror="this.style.display='none';"></div>` : ''}
                        <div class="game-name">${escapeHtml(game.name)}</div>
                    </div>
                `).join('');
            }

            modalOverlay.classList.add('active');
        }

        // Close modal
        function closeModal() {
            modalOverlay.classList.remove('active');
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Close modal on overlay click
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        // Spider Web Comparison
        let selectedCompareItems = [];
        const compareTypeSelect = document.getElementById('compareType');
        const spiderCanvas = document.getElementById('spiderCanvas');
        const spiderCtx = spiderCanvas.getContext('2d');
        const colors = ['#6366f1', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316'];

        compareTypeSelect.addEventListener('change', updateCompareItemsList);

        function updateCompareItemsList() {
            const type = compareTypeSelect.value;
            const data = typeData[type];
            const container = document.getElementById('compareItemsContainer');
            
            // Get top 8 items by game count
            const sorted = Object.entries(data)
                .map(([id, item]) => ({ id, ...item }))
                .sort((a, b) => b.games.length - a.games.length)
                .slice(0, 8);

            if (sorted.length === 0) {
                container.innerHTML = '<p style="color: #999; font-size: 0.85rem;">Load data first</p>';
                return;
            }

            container.innerHTML = sorted.map((item, idx) => `
                <label style="display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; cursor: pointer; border-radius: 4px; transition: background 0.2s;" onmouseover="this.style.background='#f5f5f5'" onmouseout="this.style.background='white'">
                    <input type="checkbox" value="${item.id}" onchange="toggleCompareItem('${escapeHtml(item.name)}', ${item.games.length}, '${colors[idx]}')" style="cursor: pointer;">
                    <div style="width: 16px; height: 16px; background: ${colors[idx]}; border-radius: 3px; flex-shrink: 0;"></div>
                    <span style="flex: 1; font-size: 0.85rem;">${escapeHtml(item.name)}</span>
                    <span style="background: #eee; padding: 0.125rem 0.5rem; border-radius: 12px; font-size: 0.75rem; font-weight: 600;">${item.games.length}</span>
                </label>
            `).join('');

            // Reset selected items
            selectedCompareItems = [];
            drawSpiderWeb();
        }

        function toggleCompareItem(name, count, color) {
            const idx = selectedCompareItems.findIndex(item => item.name === name);
            if (idx > -1) {
                selectedCompareItems.splice(idx, 1);
            } else {
                if (selectedCompareItems.length < 8) {
                    selectedCompareItems.push({ name, count, color });
                } else {
                    // Uncheck the checkbox if limit reached
                    event.target.checked = false;
                    return;
                }
            }
            drawSpiderWeb();
            updateOverlapResults();
        }

        function drawSpiderWeb() {
            const canvas = spiderCanvas;
            const ctx = spiderCtx;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(centerX, centerY) - 60;

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (selectedCompareItems.length === 0) {
                ctx.fillStyle = '#999';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Select items to compare', centerX, centerY);
                document.getElementById('spiderLegend').innerHTML = '';
                return;
            }

            const angleStep = (Math.PI * 2) / selectedCompareItems.length;

            // Draw web circles
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;
            for (let i = 1; i <= 5; i++) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, (radius / 5) * i, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Draw axes
            selectedCompareItems.forEach((item, i) => {
                const angle = angleStep * i - Math.PI / 2;
                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(x, y);
                ctx.strokeStyle = '#e0e0e0';
                ctx.stroke();

                // Draw labels
                const labelRadius = radius + 20;
                const labelX = centerX + Math.cos(angle) * labelRadius;
                const labelY = centerY + Math.sin(angle) * labelRadius;

                ctx.fillStyle = item.color;
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // Wrap text if too long
                const maxWidth = 80;
                const words = item.name.split(' ');
                let line = '';
                let lines = [];
                words.forEach(word => {
                    const testLine = line + (line ? ' ' : '') + word;
                    const metrics = ctx.measureText(testLine);
                    if (metrics.width > maxWidth && line) {
                        lines.push(line);
                        line = word;
                    } else {
                        line = testLine;
                    }
                });
                lines.push(line);

                lines.forEach((textLine, idx) => {
                    ctx.fillText(textLine, labelX, labelY + (idx - lines.length / 2 + 0.5) * 12);
                });
            });

            // Draw data polygon
            const maxCount = Math.max(...selectedCompareItems.map(item => item.count));
            
            ctx.beginPath();
            selectedCompareItems.forEach((item, i) => {
                const angle = angleStep * i - Math.PI / 2;
                const distance = (item.count / maxCount) * radius;
                const x = centerX + Math.cos(angle) * distance;
                const y = centerY + Math.sin(angle) * distance;

                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            });
            ctx.closePath();
            ctx.fillStyle = 'rgba(99, 102, 241, 0.1)';
            ctx.fill();
            ctx.strokeStyle = '#6366f1';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Draw data points
            selectedCompareItems.forEach((item, i) => {
                const angle = angleStep * i - Math.PI / 2;
                const distance = (item.count / maxCount) * radius;
                const x = centerX + Math.cos(angle) * distance;
                const y = centerY + Math.sin(angle) * distance;

                ctx.beginPath();
                ctx.arc(x, y, 5, 0, Math.PI * 2);
                ctx.fillStyle = item.color;
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            // Update legend
            const legendHTML = selectedCompareItems.map(item => `
                <div class="spider-legend-item">
                    <div class="spider-legend-color" style="background: ${item.color};"></div>
                    <span>${escapeHtml(item.name)} (${item.count} games)</span>
                </div>
            `).join('');
            document.getElementById('spiderLegend').innerHTML = legendHTML || '<p style="color: #999; font-size: 0.85rem;">No items selected</p>';
        }

        function updateOverlapResults() {
            if (selectedCompareItems.length < 2) {
                document.getElementById('overlapResults').style.display = 'none';
                return;
            }

            const type = compareTypeSelect.value;
            const data = typeData[type];
            
            // Find games that have all selected items
            const selectedIds = selectedCompareItems.map(item => {
                const entry = Object.entries(data).find(([id, d]) => d.name === item.name);
                return entry ? entry[0] : null;
            }).filter(Boolean);

            if (selectedIds.length === 0) {
                document.getElementById('overlapResults').style.display = 'none';
                return;
            }

            // Get games from first selected item
            let overlapGames = data[selectedIds[0]]?.games || [];

            // Filter to only games that appear in all selected items
            selectedIds.slice(1).forEach(id => {
                const itemGames = data[id]?.games || [];
                overlapGames = overlapGames.filter(game => 
                    itemGames.some(g => g.id === game.id)
                );
            });

            document.getElementById('overlapCount').textContent = overlapGames.length;
            
            if (overlapGames.length > 0) {
                document.getElementById('overlapGames').innerHTML = overlapGames.slice(0, 20).map(game => `
                    <div class="overlap-game">
                        ${game.image ? `<img src="/api/image-proxy?url=${encodeURIComponent(game.image)}" alt="${escapeHtml(game.name)}" onerror="this.style.display='none';">` : '<div style="width: 100%; height: 80px; background: #f0f0f0; border-radius: 4px; margin-bottom: 0.25rem;"></div>'}
                        <div class="overlap-game-name">${escapeHtml(game.name)}</div>
                    </div>
                `).join('');
                document.getElementById('overlapResults').style.display = 'block';
            } else {
                document.getElementById('overlapResults').style.display = 'none';
            }
        }

        // Initialize
        window.addEventListener('load', () => {
            const savedUsername = localStorage.getItem('bgg_types_username');
            if (savedUsername) {
                usernameInput.value = savedUsername;
            }
        });
    </script>
    <!-- Vercel Web Analytics -->
    <script type="module" src="analytics-init.js"></script>
