<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>BGG Game Types | Sportomax</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }

    .glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .glass-dark {
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tab-button {
      transition: all 0.2s ease;
      position: relative;
      @apply text-slate-500 font-bold uppercase tracking-widest text-[10px];
    }

    .tab-button.active {
      @apply text-indigo-400;
    }

    .tab-button.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 1rem;
      right: 1rem;
      height: 2px;
      background: #818cf8;
      border-radius: 2px;
    }

    .type-card {
      @apply glass rounded-xl p-4 border border-white/5 flex items-center justify-between transition-all cursor-pointer;
    }

    .type-card:hover {
      @apply bg-white/5 -translate-y-1 border-white/10;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }

    .modal-content {
      @apply glass rounded-[2.5rem] w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden border-t border-white/20 shadow-2xl;
    }

    .game-card {
      @apply glass-dark rounded-2xl border border-white/5 overflow-hidden transition-all;
    }

    .game-card-header {
      @apply flex gap-4 p-4 cursor-pointer hover:bg-white/5 transition-colors;
    }

    .game-card-thumb {
      @apply w-16 h-16 rounded-xl object-contain bg-black/40 p-1 border border-white/5 shrink-0;
    }

    .game-card-details {
      @apply hidden p-6 border-t border-white/5 bg-black/20 overflow-y-auto max-h-[500px] custom-scrollbar;
    }
    .game-card-details.show { @apply block; }

    .stat-pill {
      @apply glass-dark px-3 py-1 rounded-lg text-[9px] font-black uppercase tracking-widest border border-white/5 flex items-center gap-1.5;
    }

    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }

    input, select {
      @apply bg-white/5 border border-white/10 rounded-xl px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all font-medium text-sm;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-in { animation: fadeIn 0.4s ease-out forwards; }
  </style>
</head>
<body class="pb-20 pt-safe">

  <header class="sticky top-0 z-30 w-full glass-dark border-b border-white/5 px-6 py-4">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 bg-indigo-500/20 rounded-2xl flex items-center justify-center border border-indigo-500/30">
          <i class="fa-solid fa-dice-d20 text-indigo-400 text-xl"></i>
        </div>
        <div>
          <h1 class="text-2xl font-black italic uppercase tracking-tighter leading-none">Game <span class="text-indigo-400">Types</span></h1>
          <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-1">Deep Collection Analysis</p>
        </div>
      </div>
      <div id="statsBox" class="hidden text-right">
        <div class="text-2xl font-black text-indigo-400 italic leading-none" id="gameCount">0</div>
        <div class="text-[8px] text-slate-500 uppercase font-black tracking-widest mt-1">Games</div>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-6 space-y-8">
    
    <!-- Fetch Section -->
    <div id="fetchSection" class="glass rounded-[2.5rem] p-8 border-t border-white/20 shadow-2xl">
      <h2 class="text-xl font-black italic uppercase tracking-tight mb-6">Connect <span class="text-indigo-400">Collection</span></h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="space-y-4">
          <div class="space-y-2">
            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">BGG Username</label>
            <input id="username" type="text" value="sportomax" class="w-full">
          </div>
          <button onclick="fetchCollection()" id="fetchBtn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black text-sm uppercase tracking-widest hover:bg-indigo-500 shadow-xl shadow-indigo-500/20 transition-all active:scale-95">
            Load Data Engine
          </button>
        </div>

        <div class="space-y-4">
          <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Status Filters</label>
          <div class="grid grid-cols-2 gap-3">
            <div class="space-y-1">
              <label class="text-[8px] text-slate-600 font-black uppercase ml-1">Own</label>
              <select id="filter-own" class="w-full">
                <option value="any">Any</option>
                <option value="1" selected>Yes</option>
                <option value="0">No</option>
              </select>
            </div>
            <div class="space-y-1">
              <label class="text-[8px] text-slate-600 font-black uppercase ml-1">Played</label>
              <select id="filter-played" class="w-full">
                <option value="any" selected>Any</option>
                <option value="1">Yes</option>
                <option value="0">No</option>
              </select>
            </div>
            <div class="space-y-1">
              <label class="text-[8px] text-slate-600 font-black uppercase ml-1">Want Play</label>
              <select id="filter-wanttoplay" class="w-full">
                <option value="any" selected>Any</option>
                <option value="1">Yes</option>
                <option value="0">No</option>
              </select>
            </div>
            <div class="space-y-1">
              <label class="text-[8px] text-slate-600 font-black uppercase ml-1">Prev Owned</label>
              <select id="filter-prevowned" class="w-full">
                <option value="any" selected>Any</option>
                <option value="1">Yes</option>
                <option value="0">No</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Loading Section -->
    <div id="loadingSection" class="hidden glass rounded-[2.5rem] p-10 border border-white/10 text-center space-y-6">
      <div class="relative w-20 h-20 mx-auto">
        <div class="absolute inset-0 border-4 border-indigo-500/20 rounded-full"></div>
        <div class="absolute inset-0 border-4 border-t-indigo-500 rounded-full animate-spin"></div>
      </div>
      <div class="space-y-2">
        <h3 class="text-lg font-black italic uppercase tracking-tighter" id="loadingStatus">Scanning Library...</h3>
        <div class="max-w-xs mx-auto bg-white/5 rounded-full h-1.5 overflow-hidden">
          <div id="progressBar" class="bg-indigo-500 h-full transition-all duration-300 shadow-[0_0_10px_rgba(99,102,241,0.5)]" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- Tabs Section -->
    <div id="tabsSection" class="hidden space-y-6 animate-in">
      <div class="glass-dark rounded-2xl border border-white/5 p-2 flex overflow-x-auto custom-scrollbar gap-2">
        <button class="tab-button active flex-1 py-3" data-tab="category">Categories</button>
        <button class="tab-button flex-1 py-3" data-tab="mechanic">Mechanics</button>
        <button class="tab-button flex-1 py-3" data-tab="family">Families</button>
        <button class="tab-button flex-1 py-3" data-tab="designer">Designers</button>
        <button class="tab-button flex-1 py-3" data-tab="artist">Artists</button>
        <button class="tab-button flex-1 py-3" data-tab="publisher">Publishers</button>
      </div>

      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
        <input type="text" id="searchInput" placeholder="Filter current list..." oninput="filterTypes()" class="w-full pl-10 py-3 rounded-2xl">
      </div>

      <div id="category-content" class="tab-content grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>
      <div id="mechanic-content" class="tab-content hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>
      <div id="family-content" class="tab-content hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>
      <div id="designer-content" class="tab-content hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>
      <div id="artist-content" class="tab-content hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>
      <div id="publisher-content" class="tab-content hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>
    </div>

  </main>

  <!-- Modal -->
  <div id="modalOverlay" class="modal-overlay hidden" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <header class="p-6 border-b border-white/5 bg-slate-950/50 flex flex-col md:flex-row md:items-center justify-between gap-4 shrink-0">
        <div class="flex flex-col">
          <h3 class="text-xl font-black italic uppercase tracking-tighter text-white" id="modalTitle"></h3>
          <p class="text-[8px] font-bold text-slate-500 uppercase tracking-widest mt-1" id="modalSubtitle"></p>
        </div>
        <div class="flex items-center gap-3">
          <select id="modalSortSelect" onchange="sortModalGames(this.value)" class="text-[10px] font-black uppercase tracking-widest text-indigo-400">
            <optgroup label="Popularity">
              <option value="rank-asc">BGG Rank (Best) ↑</option>
              <option value="numratings-desc">Ratings Count ↓</option>
              <option value="owned-desc">Owned by Community ↓</option>
            </optgroup>
            <optgroup label="Ratings">
              <option value="bayaverage-desc" selected>Bayes Average ↓</option>
              <option value="average-desc">Raw Average ↓</option>
              <option value="weight-desc">Complexity ↓</option>
            </optgroup>
            <optgroup label="Metadata">
              <option value="year-desc">Year (Newest) ↓</option>
              <option value="playtime-desc">Play Time ↓</option>
              <option value="alpha">A-Z</option>
            </optgroup>
          </select>
          <button onclick="closeModal()" class="w-10 h-10 glass rounded-xl flex items-center justify-center text-slate-500 hover:text-white transition-all">
            <i class="fa-solid fa-times"></i>
          </button>
        </div>
      </header>
      <div class="flex-1 overflow-y-auto custom-scrollbar p-6 space-y-4" id="modalContent"></div>
    </div>
  </div>

<script>
const TYPE_MAP = {
  'category': 'boardgamecategory',
  'mechanic': 'boardgamemechanic',
  'family': 'boardgamefamily',
  'designer': 'boardgamedesigner',
  'artist': 'boardgameartist',
  'publisher': 'boardgamepublisher'
};

let allGames = [];
let typeData = {};
let currentTab = 'category';
let currentSort = 'bayaverage-desc';
let currentModalGames = [];
const IMAGE_PROXY = '/api/image-proxy?url=';

function initTypeData() {
  Object.keys(TYPE_MAP).forEach(key => typeData[key] = {});
}

async function fetchAPI(endpoint, id, params = '', retries = 5) {
  const url = `/api/bgg-helper?endpoint=${endpoint}&${endpoint === 'thing' ? 'id' : 'username'}=${encodeURIComponent(id)}${params}`;
  for (let i = 0; i < retries; i++) {
    try {
      const res = await fetch(url);
      if (res.status === 202) { await wait(2000 * (i + 1)); continue; }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.text();
    } catch (e) {
      if (i === retries - 1) throw e;
      await wait(1000 * (i + 1));
    }
  }
}

async function fetchCollection() {
  const username = document.getElementById('username').value.trim() || 'sportomax';
  const fetchBtn = document.getElementById('fetchBtn');
  const setupBox = document.getElementById('fetchSection');
  const loadBox = document.getElementById('loadingSection');
  const tabsBox = document.getElementById('tabsSection');
  
  fetchBtn.disabled = true;
  loadBox.classList.remove('hidden');
  initTypeData();

  try {
    const xml = await fetchAPI('collection', username, '&stats=1');
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    const items = Array.from(doc.querySelectorAll('item'));

    allGames = items.map(item => {
      const statusEl = item.querySelector('status');
      return {
        objectid: item.getAttribute('objectid'),
        name: item.querySelector('name')?.textContent?.trim() || 'Unknown',
        thumb: item.querySelector('thumbnail')?.textContent || '',
        status: {
          own: statusEl?.getAttribute('own') === '1',
          played: statusEl?.getAttribute('played') === '1',
          wanttoplay: statusEl?.getAttribute('wanttoplay') === '1',
          prevowned: statusEl?.getAttribute('prevowned') === '1'
        },
        loaded: false
      };
    });

    setupBox.classList.add('hidden');
    document.getElementById('statsBox').classList.remove('hidden');
    
    // Batch Fetch 100x Parallel
    const batchSize = 20;
    const parallelLimit = 100;
    const batches = [];
    for (let i = 0; i < allGames.length; i += batchSize) batches.push(allGames.slice(i, i + batchSize));

    for (let i = 0; i < batches.length; i += parallelLimit) {
      const group = batches.slice(i, i + parallelLimit);
      const progress = Math.round((i / batches.length) * 100);
      document.getElementById('progressBar').style.width = `${progress}%`;
      document.getElementById('loadingStatus').textContent = `Crunching Data (${progress}%)`;

      await Promise.all(group.map(async batch => {
        const ids = batch.map(g => g.objectid).join(',');
        const thingXml = await fetchAPI('thing', ids, '&stats=1');
        const thingDoc = new DOMParser().parseFromString(thingXml, 'text/xml');
        
        thingDoc.querySelectorAll('item').forEach(item => {
          const id = item.getAttribute('id');
          const game = allGames.find(g => g.objectid === id);
          if (!game) return;

          const stats = item.querySelector('statistics ratings');
          if (stats) {
            game.bggRating = parseFloat(stats.querySelector('average')?.getAttribute('value') || '0');
            game.bayesAverage = parseFloat(stats.querySelector('bayesaverage')?.getAttribute('value') || '0');
            game.weight = parseFloat(stats.querySelector('averageweight')?.getAttribute('value') || '0');
            game.numRatings = parseInt(stats.querySelector('usersrated')?.getAttribute('value') || '0');
            game.owned = parseInt(stats.querySelector('owned')?.getAttribute('value') || '0');
            game.wishing = parseInt(stats.querySelector('wishing')?.getAttribute('value') || '0');
            game.median = parseFloat(stats.querySelector('median')?.getAttribute('value') || '0');
            game.stddev = parseFloat(stats.querySelector('stddev')?.getAttribute('value') || '0');
            
            const boardgameRank = stats.querySelector('rank[name="boardgame"]');
            const rankVal = boardgameRank?.getAttribute('value');
            game.rank = (rankVal && rankVal !== 'Not Ranked') ? parseInt(rankVal) : 999999;
          }

          game.year = parseInt(item.querySelector('yearpublished')?.getAttribute('value') || '0');
          game.minPlayers = parseInt(item.querySelector('minplayers')?.getAttribute('value') || '1');
          game.maxPlayers = parseInt(item.querySelector('maxplayers')?.getAttribute('value') || '1');
          game.minPlaytime = parseInt(item.querySelector('minplaytime')?.getAttribute('value') || '0');
          game.maxPlaytime = parseInt(item.querySelector('maxplaytime')?.getAttribute('value') || '0');
          game.minAge = parseInt(item.querySelector('minage')?.getAttribute('value') || '0');
          game.description = item.querySelector('description')?.textContent?.substring(0, 400) || '';
          
          Object.keys(TYPE_MAP).forEach(key => {
            const links = Array.from(item.querySelectorAll(`link[type="${TYPE_MAP[key]}"]`));
            game[key + 's'] = links.map(l => l.getAttribute('value'));
            links.forEach(l => {
              const name = l.getAttribute('value');
              if (!typeData[key][name]) typeData[key][name] = { name, games: [] };
              typeData[key][name].games.push(game);
            });
          });
          game.loaded = true;
        });
      }));
    }

    applyFilters();
    loadBox.classList.add('hidden');
    tabsBox.classList.remove('hidden');
  } catch (e) { alert(e.message); location.reload(); }
}

function applyFilters() {
  const own = document.getElementById('filter-own').value;
  const played = document.getElementById('filter-played').value;
  const want = document.getElementById('filter-wanttoplay').value;
  const prev = document.getElementById('filter-prevowned').value;

  const filtered = allGames.filter(g => {
    if (own !== 'any' && g.status.own !== (own === '1')) return false;
    if (played !== 'any' && g.status.played !== (played === '1')) return false;
    if (want !== 'any' && g.status.wanttoplay !== (want === '1')) return false;
    if (prev !== 'any' && g.status.prevowned !== (prev === '1')) return false;
    return true;
  });

  initTypeData();
  filtered.forEach(g => {
    Object.keys(TYPE_MAP).forEach(key => {
      if (g[key + 's']) {
        g[key + 's'].forEach(name => {
          if (!typeData[key][name]) typeData[key][name] = { name, games: [] };
          typeData[key][name].games.push(g);
        });
      }
    });
  });

  document.getElementById('gameCount').textContent = filtered.length;
  renderCurrentTab();
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
  document.getElementById(`${tab}-content`).classList.remove('hidden');
  renderCurrentTab();
}

function renderCurrentTab() {
  const container = document.getElementById(`${currentTab}-content`);
  const query = document.getElementById('searchInput').value.toLowerCase();
  
  const entries = Object.values(typeData[currentTab])
    .filter(e => e.name.toLowerCase().includes(query))
    .sort((a, b) => b.games.length - a.games.length);

  container.innerHTML = entries.map(e => `
    <div class="type-card" onclick="openModal('${e.name.replace(/'/g, "\\'")}')">
      <span class="text-sm font-bold text-slate-200 uppercase italic truncate pr-4">${e.name}</span>
      <span class="bg-indigo-500/20 text-indigo-400 px-3 py-1 rounded-lg text-[10px] font-black border border-indigo-500/20">${e.games.length}</span>
    </div>
  `).join('') || '<div class="col-span-full py-20 text-center text-slate-600 font-bold uppercase tracking-widest">No matches found</div>';
}

function filterTypes() { renderCurrentTab(); }

function openModal(typeName) {
  const data = typeData[currentTab][typeName];
  currentModalGames = [...data.games];
  document.getElementById('modalTitle').textContent = typeName;
  document.getElementById('modalSubtitle').textContent = `${currentModalGames.length} Unique Titles`;
  sortModalGames(currentSort);
  document.getElementById('modalOverlay').classList.remove('hidden');
}

function closeModal(e) { 
  if(!e || e.target.id === 'modalOverlay') document.getElementById('modalOverlay').classList.add('hidden'); 
}

function sortModalGames(sortBy) {
  currentSort = sortBy;
  let sorted = [...currentModalGames];
  
  const sorters = {
    'bayaverage-desc': (a,b) => b.bayesAverage - a.bayesAverage,
    'average-desc': (a,b) => b.bggRating - a.bggRating,
    'rank-asc': (a,b) => a.rank - b.rank,
    'weight-desc': (a,b) => b.weight - a.weight,
    'year-desc': (a,b) => b.year - a.year,
    'numratings-desc': (a,b) => b.numRatings - a.numRatings,
    'owned-desc': (a,b) => b.owned - a.owned,
    'wishing-desc': (a,b) => b.wishing - a.wishing,
    'playtime-desc': (a,b) => b.maxPlaytime - a.maxPlaytime,
    'alpha': (a,b) => a.name.localeCompare(b.name)
  };

  sorted.sort(sorters[sortBy] || sorters.alpha);
  renderModalGames(sorted);
}

function renderModalGames(games) {
  const container = document.getElementById('modalContent');
  container.innerHTML = games.map((g, i) => {
    let topStat = `⭐ ${g.bayesAverage.toFixed(2)}`;
    if(currentSort.startsWith('rank')) topStat = `🏆 #${g.rank < 999999 ? g.rank : 'NR'}`;
    if(currentSort.startsWith('weight')) topStat = `⚖️ ${g.weight.toFixed(1)}`;
    if(currentSort.startsWith('numratings')) topStat = `👥 ${(g.numRatings/1000).toFixed(1)}k`;
    
    return `
      <div class="game-card animate-in" style="animation-delay: ${i*0.05}s">
        <div class="game-card-header" onclick="toggleDetails(${i})">
          <img src="${IMAGE_PROXY}${encodeURIComponent(g.thumb)}" class="game-card-thumb">
          <div class="flex-1 min-w-0">
            <h4 class="text-sm font-black text-white uppercase italic tracking-tighter truncate leading-tight">${g.name}</h4>
            <div class="flex flex-wrap gap-2 mt-2">
              <span class="stat-pill text-blue-400">${topStat}</span>
              <span class="stat-pill text-slate-500">📅 ${g.year}</span>
              <span class="stat-pill text-slate-500">👥 ${g.minPlayers}-${g.maxPlayers}</span>
            </div>
          </div>
          <i class="fa-solid fa-chevron-down text-slate-600 self-center transition-transform" id="chevron-${i}"></i>
        </div>
        <div class="game-card-details" id="details-${i}">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-4">
              <p class="text-[10px] text-slate-400 leading-relaxed italic">${g.description}...</p>
              <div class="grid grid-cols-2 gap-2">
                <div class="glass-dark p-3 rounded-xl border border-white/5">
                  <span class="text-[7px] font-black uppercase text-slate-600 block mb-1">Raw Average</span>
                  <span class="text-xs font-bold text-white">${g.bggRating.toFixed(2)}</span>
                </div>
                <div class="glass-dark p-3 rounded-xl border border-white/5">
                  <span class="text-[7px] font-black uppercase text-slate-600 block mb-1">Standard Dev</span>
                  <span class="text-xs font-bold text-white">${g.stddev.toFixed(2)}</span>
                </div>
              </div>
            </div>
            <div class="space-y-4">
              <div class="bg-black/20 p-4 rounded-2xl border border-white/5 space-y-2">
                <span class="text-[8px] font-black uppercase tracking-widest text-indigo-400">Community Metrics</span>
                <div class="grid grid-cols-2 gap-y-2 text-[10px]">
                  <div class="text-slate-500">Owned: <span class="text-white font-mono">${(g.owned/1000).toFixed(1)}k</span></div>
                  <div class="text-slate-500">Wishing: <span class="text-white font-mono">${g.wishing}</span></div>
                  <div class="text-slate-500">Median: <span class="text-white font-mono">${g.median}</span></div>
                  <div class="text-slate-500">Complexity: <span class="text-white font-mono">${g.weight.toFixed(2)}/5</span></div>
                </div>
              </div>
              <button onclick="window.open('https://boardgamegeek.com/boardgame/${g.objectid}', '_blank')" class="w-full py-3 rounded-xl bg-indigo-500 text-white font-black uppercase text-[10px] tracking-widest hover:bg-indigo-400 transition-colors">BGG Profile ↗️</button>
            </div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function toggleDetails(i) {
  const details = document.getElementById(`details-${i}`);
  const chevron = document.getElementById(`chevron-${i}`);
  details.classList.toggle('show');
  chevron.style.transform = details.classList.contains('show') ? 'rotate(180deg)' : 'rotate(0deg)';
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

document.querySelectorAll('.tab-button').forEach(btn => btn.onclick = () => switchTab(btn.dataset.tab));
</script>
</body>
</html>
