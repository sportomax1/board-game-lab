<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>BGG Game Types</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
    }

    .tab-button {
      transition: all 0.2s ease;
      position: relative;
    }

    .tab-button.active {
      color: #6366f1;
      font-weight: 700;
    }

    .tab-button.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 3px;
      background: #6366f1;
      border-radius: 3px 3px 0 0;
    }

    .type-card {
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .type-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
    }

    .type-card:active {
      transform: scale(0.98);
    }

    .skeleton {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    .modal-content {
      background: white;
      border-radius: 1rem;
      width: 90%;
      max-width: 56rem;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0,0,0,0.15);
    }

    .modal-header {
      border-bottom: 1px solid #e2e8f0;
      padding: 1rem;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .modal-games-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      space-y: 1rem;
    }
  </style>
</head>
<body class="pb-20">

  <header class="sticky top-0 z-30 w-full bg-white/80 backdrop-blur-md border-b px-4 py-4 shadow-sm">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 text-white p-2 rounded-lg">
          <i class="fa-solid fa-dice-d20"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">Game Types</h1>
          <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Categories & More</p>
        </div>
      </div>
      <div id="statsBox" class="text-right hidden">
        <div class="text-2xl font-bold text-indigo-600" id="gameCount">0</div>
        <div class="text-[10px] text-slate-500 uppercase font-bold">Games</div>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6">
    
    <!-- Fetch Section -->
    <div id="fetchSection" class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
      <h2 class="text-xl font-bold mb-4">Load Collection</h2>
      <div class="space-y-4">
        <div>
          <label class="text-xs font-bold text-slate-500 uppercase mb-2 block">BGG Username</label>
          <input 
            id="username" 
            type="text" 
            value="sportomax" 
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all"
          >
        </div>
        <button 
          onclick="fetchCollection()" 
          id="fetchBtn"
          class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold hover:bg-indigo-700 shadow-lg shadow-indigo-100 flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-download"></i> Load Games
        </button>
      </div>
    </div>

    <!-- Loading Section -->
    <div id="loadingSection" class="hidden">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
        <div class="flex items-center justify-center gap-3 mb-4">
          <i class="fa-solid fa-circle-notch fa-spin text-indigo-600 text-2xl"></i>
          <span class="font-bold text-slate-700">Loading collection...</span>
        </div>
        <div class="text-sm text-slate-500 text-center" id="loadingStatus">Fetching games...</div>
        <div class="mt-4 bg-slate-100 rounded-full h-2 overflow-hidden">
          <div id="progressBar" class="bg-indigo-600 h-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- Tabs Section -->
    <div id="tabsSection" class="hidden bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="flex overflow-x-auto border-b border-slate-100 px-2">
        <button class="tab-button active px-4 py-3 text-sm font-medium whitespace-nowrap" data-tab="category">
          Categories
        </button>
        <button class="tab-button px-4 py-3 text-sm font-medium text-slate-600 whitespace-nowrap" data-tab="mechanic">
          Mechanics
        </button>
        <button class="tab-button px-4 py-3 text-sm font-medium text-slate-600 whitespace-nowrap" data-tab="family">
          Families
        </button>
        <button class="tab-button px-4 py-3 text-sm font-medium text-slate-600 whitespace-nowrap" data-tab="designer">
          Designers
        </button>
        <button class="tab-button px-4 py-3 text-sm font-medium text-slate-600 whitespace-nowrap" data-tab="artist">
          Artists
        </button>
        <button class="tab-button px-4 py-3 text-sm font-medium text-slate-600 whitespace-nowrap" data-tab="publisher">
          Publishers
        </button>
      </div>

      <!-- Search Filter -->
      <div class="p-4 border-b border-slate-100">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search..." 
          oninput="filterTypes()"
          class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all"
        >
      </div>

      <!-- Tab Content -->
      <div class="p-4">
        <div id="category-content" class="tab-content">
          <div id="category-list" class="space-y-2"></div>
        </div>
        <div id="mechanic-content" class="tab-content hidden">
          <div id="mechanic-list" class="space-y-2"></div>
        </div>
        <div id="family-content" class="tab-content hidden">
          <div id="family-list" class="space-y-2"></div>
        </div>
        <div id="designer-content" class="tab-content hidden">
          <div id="designer-list" class="space-y-2"></div>
        </div>
        <div id="artist-content" class="tab-content hidden">
          <div id="artist-list" class="space-y-2"></div>
        </div>
        <div id="publisher-content" class="tab-content hidden">
          <div id="publisher-list" class="space-y-2"></div>
        </div>
      </div>
    </div>

  </main>

  <!-- Modal -->
  <div id="modalOverlay" class="modal-overlay hidden" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="flex-1 min-w-0">
          <h3 class="font-bold text-lg" id="modalTitle"></h3>
        </div>
        <select 
          id="modalSortSelect" 
          onchange="sortModalGames(this.value)" 
          class="px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none bg-white font-medium text-sm flex-shrink-0"
        >
          <option value="bayaverage-desc">Bayesian Rating ↓</option>
          <option value="bayaverage-asc">Bayesian Rating ↑</option>
          <option value="average-desc">Avg Rating ↓</option>
          <option value="average-asc">Avg Rating ↑</option>
          <option value="rank-asc">Rank (Best-Worst)</option>
          <option value="rank-desc">Rank (Worst-Best)</option>
          <option value="weight-desc">Weight ↓</option>
          <option value="weight-asc">Weight ↑</option>
          <option value="year-desc">Year ↓</option>
          <option value="year-asc">Year ↑</option>
          <option value="playtime-desc">Play Time ↓</option>
          <option value="playtime-asc">Play Time ↑</option>
          <option value="players-desc">Players ↓</option>
          <option value="players-asc">Players ↑</option>
          <option value="alpha">A-Z</option>
        </select>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 flex-shrink-0">
          <i class="fa-solid fa-times text-xl"></i>
        </button>
      </div>
      <div class="modal-games-container space-y-3" id="modalContent"></div>
    </div>
  </div>

<script>
const TYPE_MAP = {
  'category': 'boardgamecategory',
  'mechanic': 'boardgamemechanic',
  'family': 'boardgamefamily',
  'designer': 'boardgamedesigner',
  'artist': 'boardgameartist',
  'publisher': 'boardgamepublisher'
};

let allGames = [];
let typeData = {};
let currentTab = 'category';
let isLoading = false;

// Initialize type data
Object.keys(TYPE_MAP).forEach(key => {
  typeData[key] = {};
});

async function fetchCollection() {
  const username = document.getElementById('username').value.trim() || 'sportomax';
  const fetchBtn = document.getElementById('fetchBtn');
  const fetchSection = document.getElementById('fetchSection');
  const loadingSection = document.getElementById('loadingSection');
  const tabsSection = document.getElementById('tabsSection');
  const statsBox = document.getElementById('statsBox');
  
  fetchBtn.disabled = true;
  loadingSection.classList.remove('hidden');
  
  try {
    isLoading = true;
    
    // Reset data
    allGames = [];
    Object.keys(TYPE_MAP).forEach(key => {
      typeData[key] = {};
    });
    
    // Fetch collection
    updateLoadingStatus('Fetching collection...');
    const collXml = await fetchAPI('collection', username, '&stats=1&own=1');
    const doc = new DOMParser().parseFromString(collXml, 'text/xml');
    const items = Array.from(doc.querySelectorAll('item'));
    
    allGames = items.map(item => {
      const objectid = item.getAttribute('objectid');
      const name = item.querySelector('name')?.textContent?.trim() || '';
      const thumb = item.querySelector('thumbnail')?.textContent || '';
      const image = item.querySelector('image')?.textContent || '';
      
      return { objectid, name, thumb, image, loaded: false };
    }).filter(game => game.name);
    
    updateLoadingStatus(`Found ${allGames.length} games. Loading types...`);
    
    // Show UI
    fetchSection.classList.add('hidden');
    tabsSection.classList.remove('hidden');
    statsBox.classList.remove('hidden');
    document.getElementById('gameCount').textContent = allGames.length;
    
    // Fetch thing API in batches with 10x parallel processing
    const batchSize = 20;
    const parallelBatches = 10;
    const batches = [];
    for (let i = 0; i < allGames.length; i += batchSize) {
      batches.push(allGames.slice(i, i + batchSize));
    }
    
    // Process batches in parallel groups
    for (let i = 0; i < batches.length; i += parallelBatches) {
      const batchGroup = batches.slice(i, i + parallelBatches);
      updateLoadingStatus(`Loading types ${Math.min(i + parallelBatches, batches.length)}/${batches.length}...`);
      updateProgress((Math.min(i + parallelBatches, batches.length) / batches.length) * 100);
      
      await Promise.all(batchGroup.map(async (batch) => {
        const ids = batch.map(g => g.objectid).join(',');
        
        try {
          const thingXml = await fetchAPI('thing', ids, '&type=boardgame');
          const thingDoc = new DOMParser().parseFromString(thingXml, 'text/xml');
          const thingItems = Array.from(thingDoc.querySelectorAll('item'));
          
          thingItems.forEach(thingItem => {
            const id = thingItem.getAttribute('id');
            const game = allGames.find(g => g.objectid === id);
            if (!game) return;
            
            // Extract all stats from statistics > ratings
            const stats = thingItem.querySelector('statistics ratings');
            if (stats) {
              // Average rating (actual user average)
              game.rating = parseFloat(stats.querySelector('average')?.getAttribute('value') || '0');
              // Bayesian average (Bayesian rated - for weighted scoring)
              game.bayaverage = parseFloat(stats.querySelector('bayesaverage')?.getAttribute('value') || '0');
              // Weight (complexity)
              game.weight = parseFloat(stats.querySelector('averageweight')?.getAttribute('value') || '0');
              // Rank
              const rankElem = stats.querySelector('rank[name="boardgame"]');
              if (rankElem) {
                game.rank = parseInt(rankElem.getAttribute('value'));
              }
            }
            game.year = parseInt(thingItem.querySelector('yearpublished')?.getAttribute('value') || '0');
            
            // Extract playing time
            const playtimeElem = thingItem.querySelector('playingtime');
            if (playtimeElem) {
              game.playingtime = parseInt(playtimeElem.textContent || '0');
            }
            
            // Extract min/max players
            const minPlayersElem = thingItem.querySelector('minplayers');
            const maxPlayersElem = thingItem.querySelector('maxplayers');
            if (minPlayersElem && maxPlayersElem) {
              const minPlayers = parseInt(minPlayersElem.textContent || '1');
              const maxPlayers = parseInt(maxPlayersElem.textContent || '1');
              game.minPlayers = minPlayers;
              game.maxPlayers = maxPlayers;
              game.playersDisplay = minPlayers === maxPlayers ? `${minPlayers}` : `${minPlayers}-${maxPlayers}`;
            }
            
            // Extract all link types
            Object.entries(TYPE_MAP).forEach(([key, type]) => {
              const links = thingItem.querySelectorAll(`link[type="${type}"]`);
              Array.from(links).forEach(link => {
                const linkId = link.getAttribute('id');
                const linkName = link.getAttribute('value');
                if (!typeData[key][linkId]) {
                  typeData[key][linkId] = { name: linkName, games: [] };
                }
                typeData[key][linkId].games.push(game);
              });
            });
            
            game.loaded = true;
          });
          
        } catch (e) {
          console.error('Batch error:', e);
        }
      }));
      
      // Update display after each parallel group
      renderCurrentTab();
      
      await wait(500);
    }
    
    updateLoadingStatus('Complete!');
    updateProgress(100);
    isLoading = false;
    
    // Hide loading indicator
    setTimeout(() => {
      loadingSection.classList.add('hidden');
    }, 500);
    
  } catch (e) {
    console.error(e);
    alert('Failed to fetch collection. Please try again.');
    fetchBtn.disabled = false;
    loadingSection.classList.add('hidden');
  }
}

function updateLoadingStatus(msg) {
  document.getElementById('loadingStatus').textContent = msg;
}

function updateProgress(percent) {
  document.getElementById('progressBar').style.width = percent + '%';
}

function switchTab(tab) {
  currentTab = tab;
  
  // Update tab buttons
  document.querySelectorAll('.tab-button').forEach(btn => {
    if (btn.dataset.tab === tab) {
      btn.classList.add('active', 'text-indigo-600', 'font-bold');
      btn.classList.remove('text-slate-600');
    } else {
      btn.classList.remove('active', 'text-indigo-600', 'font-bold');
      btn.classList.add('text-slate-600');
    }
  });
  
  // Update tab content
  document.querySelectorAll('.tab-content').forEach(content => {
    content.classList.add('hidden');
  });
  document.getElementById(`${tab}-content`).classList.remove('hidden');
  
  // Clear search
  document.getElementById('searchInput').value = '';
  
  // Render tab
  renderCurrentTab();
}

function renderCurrentTab() {
  const data = typeData[currentTab] || {};
  const container = document.getElementById(`${currentTab}-list`);
  
  // Sort by game count (descending)
  const sorted = Object.entries(data)
    .sort((a, b) => b[1].games.length - a[1].games.length);
  
  container.innerHTML = '';
  
  if (sorted.length === 0) {
    container.innerHTML = '<div class="text-center text-slate-400 py-8">No data yet...</div>';
    return;
  }
  
  sorted.forEach(([id, item]) => {
    const card = document.createElement('div');
    card.className = 'type-card bg-slate-50 rounded-lg p-3 border border-slate-200 flex items-center justify-between';
    card.onclick = () => showGames(item.name, item.games);
    
    card.innerHTML = `
      <span class="font-semibold text-slate-900">${item.name}</span>
      <span class="bg-indigo-600 text-white px-3 py-1 rounded-full text-sm font-bold">${item.games.length}</span>
    `;
    
    container.appendChild(card);
  });
}

function filterTypes() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const data = typeData[currentTab] || {};
  const container = document.getElementById(`${currentTab}-list`);
  
  // Sort by game count (descending)
  const sorted = Object.entries(data)
    .filter(([id, item]) => item.name.toLowerCase().includes(search))
    .sort((a, b) => b[1].games.length - a[1].games.length);
  
  container.innerHTML = '';
  
  if (sorted.length === 0) {
    container.innerHTML = '<div class="text-center text-slate-400 py-8">No results found</div>';
    return;
  }
  
  sorted.forEach(([id, item]) => {
    const card = document.createElement('div');
    card.className = 'type-card bg-slate-50 rounded-lg p-3 border border-slate-200 flex items-center justify-between';
    card.onclick = () => showGames(item.name, item.games);
    
    card.innerHTML = `
      <span class="font-semibold text-slate-900">${item.name}</span>
      <span class="bg-indigo-600 text-white px-3 py-1 rounded-full text-sm font-bold">${item.games.length}</span>
    `;
    
    container.appendChild(card);
  });
}

function showGames(title, games) {
  const modal = document.getElementById('modalOverlay');
  const modalTitle = document.getElementById('modalTitle');
  const sortSelect = document.getElementById('modalSortSelect');
  
  // Store games and extract all stats from game data
  currentModalGames = games.map(game => {
    const gameData = allGames.find(g => g.objectid === game.objectid) || {};
    return {
      ...game,
      rating: gameData.rating || 0,
      bayaverage: gameData.bayaverage || 0,
      weight: gameData.weight || 0,
      rank: gameData.rank || 999999,
      year: gameData.year || 0,
      playingtime: gameData.playingtime || 0,
      minPlayers: gameData.minPlayers || 1,
      maxPlayers: gameData.maxPlayers || 1,
      playersDisplay: gameData.playersDisplay || '1'
    };
  });
  
  modalTitle.textContent = `${title} (${games.length})`;
  sortSelect.value = 'bayaverage-desc';
  
  sortModalGames('bayaverage-desc');
  modal.classList.remove('hidden');
}

let currentModalGames = [];

function sortModalGames(sortBy) {
  let sorted = [...currentModalGames];
  
  if (sortBy === 'bayaverage-desc') {
    sorted.sort((a, b) => (b.bayaverage || 0) - (a.bayaverage || 0));
  } else if (sortBy === 'bayaverage-asc') {
    sorted.sort((a, b) => (a.bayaverage || 0) - (b.bayaverage || 0));
  } else if (sortBy === 'average-desc') {
    sorted.sort((a, b) => (b.rating || 0) - (a.rating || 0));
  } else if (sortBy === 'average-asc') {
    sorted.sort((a, b) => (a.rating || 0) - (b.rating || 0));
  } else if (sortBy === 'rank-asc') {
    sorted.sort((a, b) => (a.rank || 999999) - (b.rank || 999999));
  } else if (sortBy === 'rank-desc') {
    sorted.sort((a, b) => (b.rank || 0) - (a.rank || 0));
  } else if (sortBy === 'weight-desc') {
    sorted.sort((a, b) => (b.weight || 0) - (a.weight || 0));
  } else if (sortBy === 'weight-asc') {
    sorted.sort((a, b) => (a.weight || 0) - (b.weight || 0));
  } else if (sortBy === 'year-desc') {
    sorted.sort((a, b) => (b.year || 0) - (a.year || 0));
  } else if (sortBy === 'year-asc') {
    sorted.sort((a, b) => (a.year || 0) - (b.year || 0));
  } else if (sortBy === 'playtime-desc') {
    sorted.sort((a, b) => (b.playingtime || 0) - (a.playingtime || 0));
  } else if (sortBy === 'playtime-asc') {
    sorted.sort((a, b) => (a.playingtime || 0) - (b.playingtime || 0));
  } else if (sortBy === 'players-desc') {
    sorted.sort((a, b) => (b.maxPlayers || 0) - (a.maxPlayers || 0));
  } else if (sortBy === 'players-asc') {
    sorted.sort((a, b) => (a.minPlayers || 0) - (b.minPlayers || 0));
  } else if (sortBy === 'alpha') {
    sorted.sort((a, b) => a.name.localeCompare(b.name));
  }
  
  renderModalGames(sorted);
}

function renderModalGames(games) {
  const modalContent = document.getElementById('modalContent');
  modalContent.innerHTML = '';
  
  games.forEach(game => {
    const gameCard = document.createElement('div');
    gameCard.className = 'flex gap-4 p-4 bg-slate-50 rounded-lg border border-slate-200 cursor-pointer hover:shadow-md hover:bg-slate-100 transition-all';
    gameCard.onclick = () => window.open(`https://boardgamegeek.com/boardgame/${game.objectid}`, '_blank');
    
    gameCard.innerHTML = `
      ${game.thumb ? `
        <img 
          src="/api/image-proxy?url=${encodeURIComponent(game.thumb)}" 
          alt="${game.name}"
          class="w-20 h-20 rounded object-cover bg-slate-300 flex-shrink-0"
          onerror="this.style.display='none'"
        >
      ` : ''}
      <div class="flex-1 min-w-0">
        <div class="font-semibold text-slate-900 mb-2">${game.name}</div>
        <div class="flex flex-wrap gap-2 text-xs">
          ${game.rank && game.rank !== 999999 ? `<div class="bg-green-100 text-green-700 px-2 py-1 rounded font-bold">#${game.rank}</div>` : ''}
          ${game.bayaverage ? `<div class="bg-amber-100 text-amber-700 px-2 py-1 rounded font-bold">⭐ ${game.bayaverage.toFixed(2)}</div>` : game.rating ? `<div class="bg-amber-100 text-amber-700 px-2 py-1 rounded font-bold">⭐ ${game.rating.toFixed(2)}</div>` : ''}
          ${game.weight ? `<div class="bg-purple-100 text-purple-700 px-2 py-1 rounded font-bold">⚙️ ${game.weight.toFixed(2)}</div>` : ''}
          ${game.year ? `<div class="bg-blue-100 text-blue-700 px-2 py-1 rounded font-bold">📅 ${game.year}</div>` : ''}
          ${game.playingtime ? `<div class="bg-rose-100 text-rose-700 px-2 py-1 rounded font-bold"><i class="fa-regular fa-clock"></i> ${game.playingtime}m</div>` : ''}
          ${game.playersDisplay ? `<div class="bg-teal-100 text-teal-700 px-2 py-1 rounded font-bold"><i class="fa-solid fa-users"></i> ${game.playersDisplay}</div>` : ''}
        </div>
      </div>
    `;
    
    modalContent.appendChild(gameCard);
  });
}

function closeModal(event) {
  if (!event || event.target.id === 'modalOverlay') {
    document.getElementById('modalOverlay').classList.add('hidden');
  }
}

async function fetchAPI(endpoint, user, queryParams = '') {
  if (endpoint === 'thing') {
    let url = `/api/bgg-helper?endpoint=${endpoint}&id=${encodeURIComponent(user)}${queryParams}`;
    for (let attempt = 0; attempt < 5; attempt++) {
      let res;
      try {
        res = await fetch(url);
      } catch (e) {
        await wait(1500 * Math.pow(2, attempt));
        continue;
      }
      if (res.status === 202) {
        await wait(3000);
        continue;
      }
      if (res.ok) {
        return await res.text();
      }
      await wait(2000);
    }
    throw new Error('Failed to fetch from BGG API');
  } else {
    if (!user || user.trim() === '') {
      throw new Error('Username is required');
    }
    let url = `/api/bgg-helper?endpoint=${endpoint}&username=${encodeURIComponent(user)}${queryParams}`;
    for (let attempt = 0; attempt < 5; attempt++) {
      let res;
      try {
        res = await fetch(url);
      } catch (e) {
        await wait(1000 * Math.pow(2, attempt));
        continue;
      }
      if (res.status === 202) {
        await wait(2000);
        continue;
      }
      if (res.ok) return await res.text();
      await wait(1500);
    }
    throw new Error('Failed to fetch from BGG API');
  }
}

function wait(ms) {
  return new Promise(r => setTimeout(r, ms));
}

// Tab switching
document.querySelectorAll('.tab-button').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});
</script>
