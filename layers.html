<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Game Layers | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🧩</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        :root {
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            min-height: 100dvh;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-dark {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .game-cell {
            width: 80px;
            height: 80px;
            @apply glass rounded-xl overflow-hidden relative cursor-pointer transition-all;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @media (min-width: 768px) {
            .game-cell {
                width: 100px;
                height: 100px;
            }
        }

        .game-cell:hover {
            transform: scale(1.1);
            z-index: 10;
            border-color: #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }

        .game-cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #000;
        }

        .rating-badge {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background-color: rgba(0,0,0,0.8);
            @apply text-[8px] font-black px-1.5 py-0.5 rounded-lg text-blue-400 border border-white/10;
            pointer-events: none;
        }

        .pyramid-row {
            display: flex;
            justify-content: center;
            gap: 4px;
        }

        #pyramid-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 2rem;
            min-height: 200px;
        }

        .input-dark {
            @apply bg-white/5 border border-white/10 rounded-2xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all font-medium text-sm;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.4s ease-out forwards; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    </style>
</head>
<body class="selection:bg-blue-500/30">
    <!-- Background Decor -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-blue-900/20 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[10%] right-[0%] w-[50%] h-[50%] bg-indigo-900/10 blur-[120px] rounded-full"></div>
    </div>

    <div class="relative z-10 flex flex-col min-h-screen pt-safe">
        <!-- Header -->
        <header class="p-6 flex items-center justify-between border-b border-white/5 bg-slate-900/50 backdrop-blur-md">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-blue-500/20 rounded-2xl flex items-center justify-center border border-blue-500/30 shadow-lg shadow-blue-500/20">
                    <i data-lucide="layers" class="text-blue-400 w-6 h-6"></i>
                </div>
                <div class="flex flex-col">
                    <h1 class="text-2xl font-black italic uppercase tracking-tighter leading-none text-white">Game <span class="text-blue-400">Layers</span></h1>
                    <p id="status" class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-1 italic">Personalized Collection Shapes</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="location.reload()" class="glass px-4 py-2 rounded-xl border border-white/10 text-[10px] font-black uppercase tracking-widest text-slate-400 hover:text-white transition-all">Reset</button>
                <a href="index.html" class="glass px-4 py-2 rounded-xl border border-white/10 text-[10px] font-black uppercase tracking-widest text-slate-400 hover:text-white transition-all">Back</a>
            </div>
        </header>

        <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full space-y-8">
            <!-- Controls -->
            <div class="glass rounded-[2.5rem] p-8 border border-white/10 shadow-2xl relative overflow-hidden">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Username</label>
                        <input type="text" id="username-input" value="sportomax" class="input-dark w-full" placeholder="BGG User">
                    </div>

                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Shape & Size</label>
                        <div class="flex gap-2">
                            <select id="shape-type" class="input-dark flex-1">
                                <option value="pyramid">Pyramid</option>
                                <option value="square">Square</option>
                                <option value="diamond">Diamond</option>
                                <option value="circle">Circle</option>
                            </select>
                            <input type="number" id="base-size" value="5" min="2" max="20" class="input-dark w-20">
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Sort Strategy</label>
                        <select id="sort-strategy" class="input-dark w-full">
                            <option value="average">BGG Average</option>
                            <option value="rating">My Rating</option>
                            <option value="rank">BGG Rank</option>
                            <option value="random">Random</option>
                        </select>
                    </div>

                    <div class="flex items-end gap-3">
                        <div class="flex-1 flex items-center justify-between bg-white/5 p-3 rounded-2xl border border-white/10">
                            <span class="text-[10px] font-black text-slate-400 uppercase tracking-tight">Expansions</span>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="filter-expansions" class="sr-only peer" checked>
                                <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-500"></div>
                            </label>
                        </div>
                        <div class="w-20 text-center">
                            <label class="text-[8px] font-black text-slate-600 uppercase tracking-widest block mb-1">Items</label>
                            <span id="total-games-display" class="text-xl font-black text-blue-400 italic">15</span>
                        </div>
                    </div>
                </div>

                <button id="submit-btn" class="w-full btn-primary text-white py-4 rounded-2xl font-black text-sm uppercase tracking-widest transition-all hover:scale-[1.01] active:scale-95 shadow-xl mt-8">Generate Layout</button>
            </div>

            <!-- Pyramid Stage -->
            <div class="glass rounded-[3rem] p-4 md:p-8 border border-white/10 shadow-2xl overflow-x-auto custom-scrollbar">
                <div id="pyramid-container" class="animate-in"></div>
            </div>

            <div class="flex justify-center gap-4">
                <button id="generate-btn" class="hidden glass px-8 py-4 rounded-2xl border border-white/10 text-xs font-black uppercase tracking-widest text-slate-400 hover:text-white transition-all">Download PNG</button>
            </div>
            <div id="download-area" class="flex justify-center"></div>
        </main>
    </div>

    <!-- Game Stats Modal -->
    <div id="gameStatsModal" class="modal-overlay hidden" onclick="if(event.target===this) this.classList.add('hidden')">
        <div class="glass relative max-w-sm w-full rounded-[2.5rem] p-8 border-t border-white/20 shadow-2xl flex flex-col items-center text-center gap-6">
            <button onclick="document.getElementById('gameStatsModal').classList.add('hidden')" class="absolute top-6 right-6 text-slate-500 hover:text-white transition-colors">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            
            <div class="w-40 h-40 rounded-2xl overflow-hidden bg-black/40 border-4 border-white/10 shadow-2xl p-2">
                <img id="gameImage" class="w-full h-full object-contain rounded-xl">
            </div>
            
            <div class="space-y-2">
                <h2 id="gameName" class="text-xl font-black text-white italic uppercase tracking-tighter"></h2>
                <div id="statsGrid" class="grid grid-cols-2 gap-3 w-full mt-4"></div>
            </div>

            <a id="bggLink" target="_blank" class="w-full py-3 rounded-xl bg-white/5 border border-white/10 text-[10px] font-black uppercase tracking-widest text-blue-400 hover:bg-white/10 transition-all">View on BGG ↗️</a>
        </div>
    </div>

    <script>
        lucide.createIcons();

        document.addEventListener('DOMContentLoaded', () => {
            const usernameInput = document.getElementById('username-input');
            const shapeType = document.getElementById('shape-type');
            const baseSizeInput = document.getElementById('base-size');
            const totalGamesDisplay = document.getElementById('total-games-display');
            const sortStrategy = document.getElementById('sort-strategy');
            const submitBtn = document.getElementById('submit-btn');
            const pyramidContainer = document.getElementById('pyramid-container');
            const status = document.getElementById('status');
            const generateBtn = document.getElementById('generate-btn');
            const downloadArea = document.getElementById('download-area');
            const filterExpansions = document.getElementById('filter-expansions');

            const IMAGE_PROXY = '/api/image-proxy?url=';

            function updateTotalGames() {
                const n = parseInt(baseSizeInput.value) || 0;
                const shape = shapeType.value;
                let total = 0;
                if (shape === 'pyramid') total = (n * (n + 1)) / 2;
                else if (shape === 'square' || shape === 'diamond' || shape === 'circle') total = n * n;
                totalGamesDisplay.textContent = total;
            }

            baseSizeInput.addEventListener('input', updateTotalGames);
            shapeType.addEventListener('change', updateTotalGames);

            async function fetchBGG(endpoint, params = {}, retries = 5) {
                const queryParams = new URLSearchParams(params).toString();
                const response = await fetch(`/api/bgg-helper?endpoint=${endpoint}&${queryParams}`);
                if (response.status === 202 && retries > 0) {
                    status.textContent = `BGG Processing... (${retries})`;
                    await new Promise(r => setTimeout(r, 2000));
                    return fetchBGG(endpoint, params, retries - 1);
                }
                if (!response.ok) throw new Error(`API Error ${response.status}`);
                return await response.text();
            }

            async function handleBuild() {
                const user = usernameInput.value.trim() || 'sportomax';
                const n = parseInt(baseSizeInput.value);
                const shape = shapeType.value;
                const strategy = sortStrategy.value;
                const totalNeeded = parseInt(totalGamesDisplay.textContent);

                submitBtn.disabled = true;
                generateBtn.classList.add('hidden');
                downloadArea.innerHTML = '';
                pyramidContainer.innerHTML = '';
                status.textContent = "Connecting to BGG...";

                try {
                    const xmlText = await fetchBGG('collection', { username: user, own: '1', stats: '1' });
                    const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
                    
                    if (doc.querySelector('errors error')) throw new Error('Collection not found');

                    let items = Array.from(doc.querySelectorAll('item'));
                    if (!filterExpansions.checked) items = items.filter(i => i.getAttribute('subtype') !== 'boardgameexpansion');
                    
                    if (items.length === 0) throw new Error('No games found');

                    let games = items.map(item => {
                        const stats = item.querySelector('stats');
                        const ratingNode = stats?.querySelector('rating');
                        const average = parseFloat(ratingNode?.querySelector('average')?.getAttribute('value')) || 0;
                        const rating = parseFloat(ratingNode?.getAttribute('value')) || 0;
                        const rank = parseInt(ratingNode?.querySelector('rank[name="boardgame"]')?.getAttribute('value')) || 999999;

                        return {
                            id: item.getAttribute('objectid'),
                            name: item.querySelector('name').textContent,
                            imageUrl: item.querySelector('image')?.textContent || item.querySelector('thumbnail')?.textContent,
                            average, rating, rank
                        };
                    });

                    // Initial Shuffle
                    games.sort(() => Math.random() - 0.5);
                    const selected = games.slice(0, Math.min(totalNeeded, games.length));

                    // Strategy Sort
                    selected.sort((a, b) => {
                        if (strategy === 'average') return b.average - a.average;
                        if (strategy === 'rating') return b.rating - a.rating;
                        if (strategy === 'rank') return a.rank - b.rank; // Lower is better
                        return 0; // random already done
                    });

                    renderLayout(selected, n, shape, strategy);
                    status.textContent = `${shape.toUpperCase()} Ready!`;
                    generateBtn.classList.remove('hidden');
                } catch (err) {
                    status.textContent = `Error: ${err.message}`;
                } finally {
                    submitBtn.disabled = false;
                }
            }

            function renderLayout(games, layers, shape, strategy) {
                if (shape === 'pyramid') renderPyramid(games, layers, strategy);
                else if (shape === 'square') renderSquare(games, layers, strategy);
                else if (shape === 'diamond') renderDiamond(games, layers, strategy);
                else if (shape === 'circle') renderCircle(games, layers, strategy);
            }

            function createGameCell(game, strategy) {
                const cell = document.createElement('div');
                cell.className = 'game-cell animate-in';
                
                let displayVal = game.average.toFixed(1);
                if (strategy === 'rating') displayVal = game.rating > 0 ? game.rating.toFixed(1) : '-';
                if (strategy === 'rank') displayVal = game.rank < 999999 ? `#${game.rank}` : '-';

                cell.innerHTML = `
                    <img src="${IMAGE_PROXY}${encodeURIComponent(game.imageUrl)}" crossorigin="anonymous">
                    <div class="rating-badge">${displayVal}</div>
                `;
                
                cell.onclick = () => showStats(game);
                return cell;
            }

            function renderPyramid(games, layers, strategy) {
                let idx = 0;
                for (let r = 1; r <= layers; r++) {
                    const row = document.createElement('div');
                    row.className = 'pyramid-row';
                    for (let c = 0; c < r; c++) {
                        if (idx >= games.length) break;
                        row.appendChild(createGameCell(games[idx++], strategy));
                    }
                    pyramidContainer.appendChild(row);
                }
            }

            function renderSquare(games, size, strategy) {
                let idx = 0;
                for (let r = 0; r < size; r++) {
                    const row = document.createElement('div');
                    row.className = 'pyramid-row';
                    for (let c = 0; c < size; c++) {
                        if (idx >= games.length) break;
                        row.appendChild(createGameCell(games[idx++], strategy));
                    }
                    pyramidContainer.appendChild(row);
                }
            }

            function renderDiamond(games, base, strategy) {
                let idx = 0;
                // Expanding
                for (let r = 0; r < base; r++) {
                    const row = document.createElement('div');
                    row.className = 'pyramid-row';
                    for (let i = 0; i <= r; i++) {
                        if (idx >= games.length) break;
                        row.appendChild(createGameCell(games[idx++], strategy));
                    }
                    pyramidContainer.appendChild(row);
                }
                // Contracting
                for (let r = base - 2; r >= 0; r--) {
                    const row = document.createElement('div');
                    row.className = 'pyramid-row';
                    for (let i = 0; i <= r; i++) {
                        if (idx >= games.length) break;
                        row.appendChild(createGameCell(games[idx++], strategy));
                    }
                    pyramidContainer.appendChild(row);
                }
            }

            function renderCircle(games, layers, strategy) {
                const wrap = document.createElement('div');
                wrap.style.position = 'relative';
                wrap.style.width = `${layers * 104}px`;
                wrap.style.height = `${layers * 104}px`;
                wrap.style.margin = '2rem auto';
                
                const gridSize = 2 * Math.ceil((Math.sqrt(games.length)+1)/2) - 1;
                const center = Math.floor(gridSize/2);
                let x = center, y = center, idx = 0;
                const dirs = [[1,0],[0,1],[-1,0],[0,-1]];
                let steps = 1, stepCount = 0, dirIdx = 0;

                const grid = Array(gridSize).fill(null).map(()=>Array(gridSize).fill(null));
                grid[y][x] = games[idx++];

                while(idx < games.length) {
                    for(let i=0; i<steps && idx<games.length; i++) {
                        x += dirs[dirIdx][0]; y += dirs[dirIdx][1];
                        if(x>=0 && x<gridSize && y>=0 && y<gridSize) grid[y][x] = games[idx++];
                    }
                    dirIdx = (dirIdx+1)%4;
                    stepCount++;
                    if(stepCount%2 === 0) steps++;
                }

                for(let r=0; r<gridSize; r++) {
                    const row = document.createElement('div');
                    row.className = 'pyramid-row';
                    for(let c=0; c<gridSize; c++) {
                        if(grid[r][c]) row.appendChild(createGameCell(grid[r][c], strategy));
                        else {
                            const spacer = document.createElement('div');
                            spacer.style.width = '100px'; spacer.style.height = '100px';
                            row.appendChild(spacer);
                        }
                    }
                    pyramidContainer.appendChild(row);
                }
            }

            function showStats(game) {
                const modal = document.getElementById('gameStatsModal');
                document.getElementById('gameImage').src = IMAGE_PROXY + encodeURIComponent(game.imageUrl);
                document.getElementById('gameName').textContent = game.name;
                document.getElementById('bggLink').href = `https://boardgamegeek.com/boardgame/${game.id}`;
                
                const grid = document.getElementById('statsGrid');
                const createStat = (l, v) => `<div class="glass-dark p-3 rounded-xl border border-white/5"><span class="text-[8px] font-black uppercase text-slate-500 mb-1 block">${l}</span><span class="text-xs font-bold text-white">${v}</span></div>`;
                
                grid.innerHTML = createStat('BGG Rank', game.rank < 999999 ? `#${game.rank}` : 'Unranked') +
                                 createStat('Average', game.average.toFixed(2)) +
                                 createStat('My Rating', game.rating > 0 ? game.rating.toFixed(1) : 'Unrated') +
                                 createStat('Game ID', game.id);

                modal.classList.remove('hidden');
            }

            async function generateImage() {
                status.textContent = 'Rendering Canvas...';
                const rows = Array.from(pyramidContainer.querySelectorAll('.pyramid-row'));
                const cellSize = 200, gap = 10;
                const canvas = document.createElement('canvas');
                canvas.width = 1600;
                canvas.height = (rows.length * (cellSize + gap)) + 100;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const promises = [];
                rows.forEach((row, rIdx) => {
                    const cells = Array.from(row.querySelectorAll('.game-cell'));
                    const startX = (canvas.width - (cells.length * (cellSize + gap))) / 2;
                    cells.forEach((cell, cIdx) => {
                        const p = new Promise(res => {
                            const img = new Image();
                            img.crossOrigin = "anonymous";
                            img.onload = () => {
                                const x = startX + (cIdx * (cellSize + gap));
                                const y = 50 + (rIdx * (cellSize + gap));
                                ctx.drawImage(img, x, y, cellSize, cellSize);
                                res();
                            };
                            img.onerror = res;
                            img.src = cell.querySelector('img').src;
                        });
                        promises.push(p);
                    });
                });

                await Promise.all(promises);
                const link = document.createElement('a');
                link.download = `layers-${usernameInput.value}.png`;
                link.href = canvas.toDataURL('image/png');
                link.className = 'btn-primary px-8 py-4 rounded-2xl text-white font-black uppercase text-xs mt-8';
                link.textContent = 'Save Gallery Image';
                downloadArea.innerHTML = '';
                downloadArea.appendChild(link);
                status.textContent = 'Image Ready';
            }

            submitBtn.onclick = handleBuild;
            generateBtn.onclick = generateImage;
            updateTotalGames();
        });
    </script>
    <script type="module" src="analytics-init.js"></script>
</body>
</html>
