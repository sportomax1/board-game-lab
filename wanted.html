<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Wanted Hub</title>
<style>
  :root {
    --primary: #007aff;
    --success: #34c759;
    --danger: #ff3b30;
    --bg: #f2f2f7;
    --card-bg: #ffffff;
    --text: #000000;
    --text-muted: #8e8e93;
    --border: #e5e5ea;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
  }

  /* Header & Controls */
  header {
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid var(--border);
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top));
  }

  h1 { font-size: 24px; font-weight: 800; margin: 0 0 4px 0; letter-spacing: -0.5px; }
  .subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; line-height: 1.4; }

  .input-group {
    display: flex;
    gap: 8px;
    align-items: center;
    background: #e9e9eb;
    padding: 4px;
    border-radius: 12px;
    margin-bottom: 12px;
  }

  input, select {
    appearance: none;
    background: transparent;
    border: none;
    padding: 10px 12px;
    font-size: 15px;
    width: 100%;
    color: var(--text);
    outline: none;
  }

  button#start {
    background: var(--primary);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    white-space: nowrap;
  }

  /* Tabs Section */
  .tab-container {
    overflow-x: auto;
    white-space: nowrap;
    display: flex;
    gap: 8px;
    padding: 4px 0 12px 0;
    scrollbar-width: none;
  }
  .tab-container::-webkit-scrollbar { display: none; }

  .tab {
    background: #e9e9eb;
    border: none;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab.active { background: var(--text); color: white; }

  /* Filtering & Stats */
  .meta-info {
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 16px;
  }
  .status-label { font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); }
  
  .wp-badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .wp-badge {
    padding: 6px 12px;
    border-radius: 8px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .wp-badge.active { background: var(--primary); color: white; border-color: var(--primary); }
  .wp-badge.clear { color: var(--danger); border-color: transparent; padding-left: 4px; }

  /* Grid Layout */
  .grid {
    padding: 16px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  @media (min-width: 768px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  }

  .card-item {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 12px;
    display: flex;
    gap: 16px;
    align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    transition: transform 0.1s;
    cursor: pointer;
  }
  .card-item:active { transform: scale(0.98); background: #f9f9f9; }

  .thumb {
    width: 80px;
    height: 80px;
    border-radius: 12px;
    overflow: hidden;
    flex-shrink: 0;
    background: #f2f2f7;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }

  .game-info { flex: 1; min-width: 0; }
  .game-name {
    font-weight: 700;
    font-size: 17px;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .game-stats { display: flex; gap: 12px; align-items: center; }
  .stat { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
  .stat strong { color: var(--text); font-weight: 600; }
  
  .rating-stars { color: #ffcc00; letter-spacing: -1px; font-size: 12px; }
  .wp-indicator {
    background: #f2f2f7;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    color: var(--text);
  }

  #status-toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    color: white;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 14px;
    z-index: 1000;
    display: none;
  }
</style>
</head>
<body>

<header>
  <h1>Wanted Hub</h1>
  <div class="subtitle">Quick access to your prioritized BGG collection items.</div>
  
  <div class="input-group">
    <input id="username" value="sportomax" placeholder="BGG Username" spellcheck="false" />
    <button id="start">Load</button>
  </div>

  <div style="display: flex; gap: 8px;">
    <div class="input-group" style="flex: 1; margin-bottom: 0;">
      <select id="sortSel">
        <option value="avg">Sort: Avg Rating</option>
        <option value="rating">Sort: User Rating</option>
        <option value="wishlist">Sort: Wishlist Priority</option>
      </select>
    </div>
  </div>

  <div id="tabs" class="tab-container"></div>
</header>

<div class="meta-info">
  <div id="count" class="status-label">Ready</div>
  <div id="wpCounts" class="wp-badges"></div>
</div>

<div id="grid" class="grid"></div>

<div id="status-toast">Idle</div>

<script>
let currentFlags = [];
let currentWpFilter = null;

function showStatus(msg) {
  const toast = document.getElementById('status-toast');
  toast.textContent = msg;
  toast.style.display = 'block';
  if (msg === 'Idle' || msg.includes('Loaded')) {
    setTimeout(() => toast.style.display = 'none', 3000);
  }
}

function generateStars(rating) {
  const fullStars = Math.floor(rating);
  const halfStar = rating % 1 >= 0.5;
  let stars = '';
  for (let i = 0; i < fullStars; i++) stars += '★';
  if (halfStar) stars += '☆';
  const remaining = 10 - stars.length;
  for (let i = 0; i < remaining; i++) stars += '☆';
  return stars;
}

async function fetchCollection(username){
  const url = `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&stats=1`;
  const r = await fetch(url);
  const txt = await r.text();
  return new DOMParser().parseFromString(txt,'text/xml');
}

function parseCollection(doc){
  const items = Array.from(doc.querySelectorAll('item'));
  return items.map(it=>{
    const id = it.getAttribute('objectid')||it.getAttribute('id');
    const name = it.querySelector('name')?.textContent||'Unknown';
    const thumb = it.querySelector('thumbnail')?.textContent||'';
    const st = it.querySelector('status');
    const status = {
      own: st?st.getAttribute('own')==='1':false,
      want: st?st.getAttribute('want')==='1':false,
      wanttoplay: st?st.getAttribute('wanttoplay')==='1':false,
      wanttobuy: st?st.getAttribute('wanttobuy')==='1':false,
      fortrade: st?st.getAttribute('fortrade')==='1':false,
      prevowned: st?st.getAttribute('prevowned')==='1':false,
      wishlist: st?st.getAttribute('wishlist')==='1':false,
      wishlistpriority: (st && st.getAttribute('wishlist')==='1') ? (parseInt(st.getAttribute('wishlistpriority'))||0) : 0
    };
    status.preordered = st?st.getAttribute('preordered')==='1':false;
    let ratingVal = 0;
    let avg = 0;
    const ratingEl = it.querySelector('rating');
    if(ratingEl){
      ratingVal = parseInt(ratingEl.getAttribute('value')) || 0;
      const avgEl = ratingEl.querySelector('average') || it.querySelector('average');
      if(avgEl) avg = parseFloat(avgEl.getAttribute('value')||avgEl.textContent||0) || 0;
    } else {
      const avgEl = it.querySelector('average');
      if(avgEl) avg = parseFloat(avgEl.getAttribute('value')||avgEl.textContent||0) || 0;
    }
    return { id,name,thumb,status,avg, rating: ratingVal, wishlistpriority: status.wishlistpriority || 0, preordered: status.preordered || false };
  });
}

function buildTabs(flags){
  const tabs = document.getElementById('tabs'); tabs.innerHTML='';
  currentFlags = flags;
  flags.forEach((f,i)=>{
    const b = document.createElement('button'); 
    b.className='tab'; 
    b.textContent = `${f.label} (${f.items.length})`;
    b.addEventListener('click', ()=>{ 
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); 
      b.classList.add('active'); 
      renderGrid(f.items); 
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    tabs.appendChild(b);
    if(i===0) b.classList.add('active');
  });

  const sortSel = document.getElementById('sortSel');
  if(sortSel){ sortSel.onchange = ()=>{
    const active = document.querySelector('.tab.active');
    const idx = active ? Array.from(document.querySelectorAll('.tab')).indexOf(active) : 0;
    const f = currentFlags[idx] || currentFlags[0];
    if(f) renderGrid(f.items);
  }; }
}

function renderGrid(items){
  const grid = document.getElementById('grid'); grid.innerHTML='';
  document.getElementById('count').textContent = `${items.length} Games Found`;
  
  const wpCountsEl = document.getElementById('wpCounts');
  if(wpCountsEl){
    const counts = {};
    (items||[]).forEach(g=>{ const k = (g.wishlistpriority||0); counts[k] = (counts[k]||0) + 1; });
    const keys = Object.keys(counts).map(Number).sort((a,b)=>a-b);
    wpCountsEl.innerHTML = '';
    if(keys.length > 0 && !(keys.length === 1 && keys[0] === 0)){
      keys.forEach(k=>{
        if(k === 0) return;
        const btn = document.createElement('button');
        btn.className = 'wp-badge';
        btn.textContent = `WP ${k} (${counts[k]})`;
        if(String(currentWpFilter) === String(k)) btn.classList.add('active');
        btn.onclick = ()=>{ currentWpFilter = (String(currentWpFilter)===String(k)) ? null : String(k); renderGrid(items); };
        wpCountsEl.appendChild(btn);
      });
      const clear = document.createElement('button'); clear.className='wp-badge clear'; clear.textContent='✕ Clear';
      clear.onclick = ()=>{ currentWpFilter = null; renderGrid(items); };
      wpCountsEl.appendChild(clear);
    }
  }

  const sortSel = document.getElementById('sortSel');
  const sortMode = sortSel?sortSel.value:'avg';
  const sorted = (items||[]).slice().sort((a,b)=>{
    if(sortMode === 'wishlist'){
      const paRaw = a.wishlistpriority || 0; const pbRaw = b.wishlistpriority || 0;
      const map = v => (v === 0 ? 999 : v);
      const pa = map(paRaw), pb = map(pbRaw);
      if(pa === pb) return (b.avg||0) - (a.avg||0);
      return pa - pb;
    }
    return (b.avg||0) - (a.avg||0);
  });

  const display = (currentWpFilter===null) ? sorted : sorted.filter(g=> String((g.wishlistpriority||0)) === String(currentWpFilter));
  
  display.forEach(g=>{
    const el = document.createElement('div'); el.className='card-item';
    const wp = g.wishlistpriority || 0;
    const avgStr = g.avg ? g.avg.toFixed(1) : '—';
    const ratingStr = g.rating > 0 ? String(g.rating) : '—';
    
    el.innerHTML = `
      <div class="thumb"><img src="${g.thumb||'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22%3E%3Crect width=80 height=80 fill=%23e5e7eb/%3E%3C/svg%3E'}" loading="lazy"/></div>
      <div class="game-info">
        <div class="game-name">${g.name}</div>
        <div class="game-stats">
          <div class="stat"><strong>${avgStr}</strong><span class="rating-stars">★</span></div>
          ${g.rating > 0 ? `<div class="stat">Mine: <strong>${ratingStr}</strong></div>` : ''}
          ${wp > 0 ? `<div class="wp-indicator">WP ${wp}</div>` : ''}
        </div>
      </div>
    `;
    el.onclick = () => window.open(`https://boardgamegeek.com/boardgame/${g.id}`,'_blank');
    grid.appendChild(el);
  });
}

function collectFlags(games){
  const flagNames = [
    {key:'own',label:'Own'},
    {key:'wishlist',label:'Wishlist'},
    {key:'want',label:'Want'},
    {key:'wanttoplay',label:'To Play'},
    {key:'wanttobuy',label:'To Buy'},
    {key:'fortrade',label:'Trade'},
    {key:'prevowned',label:'Prev'}
  ];
  const out = [];
  flagNames.forEach(f=>{
    const items = games.filter(g=>g.status[f.key]);
    if(items.length) out.push({key:f.key,label:f.label,items:items.slice()});
  });
  return out;
}

document.getElementById('start').onclick = async ()=>{
  const u = document.getElementById('username').value.trim()||'sportomax';
  showStatus('Connecting to BGG...');
  try{
    const doc = await fetchCollection(u);
    const games = parseCollection(doc);
    const flags = collectFlags(games);
    if(flags.length===0){ showStatus('No flagged items found'); return; }
    buildTabs(flags);
    renderGrid(flags[0].items);
    showStatus(`Loaded ${games.length} games`);
  } catch(e){ showStatus('Error: '+e.message); }
};
</script>
</body>
</html>
