<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Wanted Hub | Sportomax</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #f8fafc;
  --surface: #ffffff;
  --border:  #e2e8f0;
  --text:    #0f172a;
  --muted:   #64748b;
  --accent:  #2563eb;
  --radius:  14px;
}

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* ── Header ─────────────────────────────────────────────────── */
header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(255,255,255,.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
}

.header-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }

.brand { display: flex; align-items: center; gap: 10px; }
.brand-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg,#2563eb,#1d4ed8);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; line-height:1; flex-shrink:0;
  box-shadow: 0 2px 8px rgba(37,99,235,.25);
}
.brand h1 { font-size: 17px; font-weight: 800; letter-spacing: -.4px; color: var(--text); }
.brand h1 span { color: #2563eb; }

.header-controls { display: flex; gap: 8px; align-items: center; }
.input-wrap {
  display: flex; gap: 0; align-items: center;
  background: #f1f5f9;
  border: 1px solid var(--border);
  border-radius: 10px; overflow: hidden;
}
.input-wrap input {
  background: transparent; border: none; outline: none;
  padding: 8px 12px; font-size: 13px; font-weight: 500;
  font-family: inherit; color: var(--text); width: 130px;
}
.input-wrap input::placeholder { color: #94a3b8; }
.btn-load {
  background: #2563eb; color: #fff; border: none;
  padding: 8px 14px; font-size: 12px; font-weight: 700;
  font-family: inherit; cursor: pointer; white-space: nowrap;
  transition: background .15s;
}
.btn-load:hover { background: #1d4ed8; }

/* Sort row */
.sort-row {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.sort-select {
  background: #f1f5f9; border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px;
  font-size: 11px; font-weight: 600; font-family: inherit;
  color: var(--muted); outline: none; cursor: pointer;
  appearance: none; -webkit-appearance: none;
}
.sort-select:focus { border-color: #93c5fd; }

/* Tabs */
.tabs {
  display: flex; gap: 4px; overflow-x: auto;
  scrollbar-width: none; margin-top: 10px;
  padding-bottom: 2px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0; background: transparent; border: 1px solid var(--border);
  padding: 6px 14px; border-radius: 20px;
  font-size: 12px; font-weight: 600; font-family: inherit;
  color: var(--muted); cursor: pointer; transition: all .15s;
  white-space: nowrap;
}
.tab:hover { border-color: #93c5fd; color: #2563eb; }
.tab.active { background: #2563eb; color: #fff; border-color: #2563eb; }
.tab .cnt { opacity: .7; font-size: 11px; margin-left: 4px; }

/* ── Meta bar ────────────────────────────────────────────────── */
.meta-bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 10px 16px 6px;
}
.meta-count {
  font-size: 11px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: .04em;
}
.wp-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.wp-chip {
  padding: 3px 10px; border-radius: 20px; border: 1.5px solid;
  font-size: 10px; font-weight: 800; cursor: pointer;
  transition: all .12s; white-space: nowrap;
}
.wp-chip.active { opacity: 1; }
.wp-chip:not(.active) { opacity: .55; }
.wp-chip:hover { opacity: 1; }

/* WP priority colours */
.wp-1 { color:#dc2626; border-color:#fca5a5; background:#fff1f2; }
.wp-1.active { background:#dc2626; color:#fff; border-color:#dc2626; }
.wp-2 { color:#ea580c; border-color:#fdba74; background:#fff7ed; }
.wp-2.active { background:#ea580c; color:#fff; border-color:#ea580c; }
.wp-3 { color:#ca8a04; border-color:#fde047; background:#fefce8; }
.wp-3.active { background:#ca8a04; color:#fff; border-color:#ca8a04; }
.wp-4 { color:#16a34a; border-color:#86efac; background:#f0fdf4; }
.wp-4.active { background:#16a34a; color:#fff; border-color:#16a34a; }
.wp-5 { color:#2563eb; border-color:#93c5fd; background:#eff6ff; }
.wp-5.active { background:#2563eb; color:#fff; border-color:#2563eb; }

.clear-chip {
  padding: 3px 10px; border-radius: 20px; border: 1.5px solid var(--border);
  font-size: 10px; font-weight: 800; cursor: pointer; color: #ef4444;
  background: #fff; transition: all .12s;
}
.clear-chip:hover { background: #fef2f2; border-color: #fca5a5; }

/* ── Grid ────────────────────────────────────────────────────── */
.grid-wrap {
  padding: 12px 16px 40px;
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}
@media (min-width: 600px)  { .grid-wrap { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 900px)  { .grid-wrap { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 1200px) { .grid-wrap { grid-template-columns: repeat(4, 1fr); } }

/* ── Card ────────────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex; gap: 14px;
  padding: 12px;
  cursor: pointer;
  transition: box-shadow .18s, transform .12s, border-color .18s;
  text-decoration: none; color: inherit;
  align-items: flex-start;
}
.card:hover {
  box-shadow: 0 4px 20px rgba(0,0,0,.08);
  transform: translateY(-1px);
  border-color: #bfdbfe;
}
.card:active { transform: scale(.985); }

.thumb {
  width: 76px; height: 76px; border-radius: 10px;
  overflow: hidden; flex-shrink: 0;
  background: #f1f5f9;
  border: 1px solid var(--border);
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb-empty {
  width: 100%; height: 100%; display: flex;
  align-items: center; justify-content: center;
  font-size: 26px;
}

.card-body { flex: 1; min-width: 0; }
.card-name {
  font-size: 14px; font-weight: 700; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 6px; line-height: 1.25;
}
.card-stats { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.stat-pill {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 8px; border-radius: 6px;
  font-size: 11px; font-weight: 600; border: 1px solid;
}
.pill-avg    { background:#eff6ff; color:#1d4ed8; border-color:#bfdbfe; }
.pill-rating { background:#f0fdf4; color:#15803d; border-color:#bbf7d0; }
.pill-plays  { background:#f8fafc; color:#475569; border-color:#e2e8f0; }
.pill-wp1  { background:#fff1f2; color:#dc2626; border-color:#fca5a5; }
.pill-wp2  { background:#fff7ed; color:#ea580c; border-color:#fdba74; }
.pill-wp3  { background:#fefce8; color:#ca8a04; border-color:#fde047; }
.pill-wp4  { background:#f0fdf4; color:#16a34a; border-color:#86efac; }
.pill-wp5  { background:#eff6ff; color:#2563eb; border-color:#93c5fd; }

.wp-labels { 'Must Have':'Must Have', '2':'Love to Have', '3':'Nice to Have', '4':'Maybe', '5':'Someday' }

/* ── Toast ───────────────────────────────────────────────────── */
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(60px);
  background: #0f172a; color: #f8fafc; padding: 8px 18px;
  border-radius: 20px; font-size: 12px; font-weight: 600;
  z-index: 200; transition: transform .25s;
  pointer-events: none; white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ── Empty / loading states ─────────────────────────────────── */
.empty-state {
  grid-column: 1/-1; padding: 60px 20px;
  text-align: center; color: var(--muted);
  font-size: 13px; font-weight: 500;
}

/* ── UI/UX presentation refactor ────────────────────────────── */

/* ── Layout v2: mobile-first + dark-mode friendly ───────────── */
:root {
  --bg: #eef2f7;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --surface-3: #f1f5f9;
  --border: #d8e0ea;
  --border-strong: #c8d2df;
  --text: #0f172a;
  --muted: #64748b;
  --muted-strong: #475569;
  --accent: #2563eb;
  --accent-soft: #eaf2ff;
  --accent-border: #bfd4ff;
  --shadow: 0 10px 30px rgba(15,23,42,.07);
  --shadow-soft: 0 2px 10px rgba(15,23,42,.045);
}

body {
  background: var(--bg);
  color: var(--text);
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 60;
  padding: 0;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.topbar-inner,
.page-shell {
  width: min(1440px, 100%);
  margin: 0 auto;
}

.topbar-inner {
  min-height: 72px;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.brand-icon {
  width: 42px;
  height: 42px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg,#3b82f6,#1d4ed8);
  box-shadow: 0 7px 18px rgba(37,99,235,.24);
  font-size: 20px;
}

.brand-copy {
  min-width: 0;
}

.brand h1 {
  font-size: 18px;
  line-height: 1.1;
  letter-spacing: -.5px;
}

.brand-subtitle {
  margin-top: 4px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .01em;
}

.header-controls {
  flex: 0 0 auto;
}

.input-wrap {
  min-width: 290px;
  display: grid;
  grid-template-columns: 1fr auto;
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  background: var(--surface-2);
  box-shadow: none;
}

.input-wrap:focus-within {
  border-color: var(--accent-border);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent);
}

.input-wrap input {
  width: 100%;
  min-width: 0;
  min-height: 42px;
  padding: 0 13px;
  color: var(--text);
  background: transparent;
}

.btn-load {
  min-height: 42px;
  padding: 0 18px;
  background: var(--accent);
  color: #fff;
}

.page-shell {
  padding: 18px 20px 48px;
}

.control-panel {
  position: sticky;
  top: 88px;
  z-index: 30;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: color-mix(in srgb, var(--surface) 95%, transparent);
  box-shadow: var(--shadow-soft);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  margin-bottom: 14px;
}

.panel-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.panel-row + .panel-row {
  margin-top: 11px;
}

.panel-row-primary {
  align-items: flex-start;
}

.panel-label,
.control-label {
  color: var(--muted);
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .075em;
}

.panel-label {
  flex: 0 0 72px;
  padding-top: 8px;
}

.tabs {
  flex: 1;
  display: flex;
  gap: 7px;
  overflow-x: auto;
  margin: 0;
  padding: 0 0 2px;
  scrollbar-width: none;
}

.tab {
  flex: 0 0 auto;
  padding: 8px 12px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--muted-strong);
  font-size: 11px;
  font-weight: 700;
  box-shadow: none;
}

.tab:hover {
  border-color: var(--accent-border);
  color: var(--accent);
  background: var(--accent-soft);
}

.tab.active {
  color: var(--accent);
  background: var(--accent-soft);
  border-color: var(--accent-border);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 7%, transparent);
}

.panel-row-secondary {
  justify-content: space-between;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}

.sort-block {
  display: flex;
  align-items: center;
  gap: 8px;
}

.sort-select {
  min-height: 34px;
  padding: 0 30px 0 10px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background-color: var(--surface-2);
  color: var(--text);
  font-size: 11px;
  font-weight: 700;
}

.meta-count {
  color: var(--muted);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .07em;
}

.filter-strip {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}

.wp-chip,
.clear-chip {
  min-height: 30px;
  padding: 5px 10px;
  border-radius: 8px;
  font-size: 10px;
  font-weight: 800;
}

.grid-wrap {
  width: 100%;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0,1fr));
  gap: 12px;
}

.card {
  position: relative;
  min-height: 126px;
  display: grid;
  grid-template-columns: 96px minmax(0,1fr);
  align-items: stretch;
  gap: 0;
  padding: 0;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--surface);
  box-shadow: var(--shadow-soft);
}

.card:hover {
  transform: translateY(-2px);
  border-color: var(--accent-border);
  box-shadow: var(--shadow);
}

.thumb {
  width: 96px;
  height: 100%;
  min-height: 126px;
  border: 0;
  border-right: 1px solid var(--border);
  border-radius: 0;
  background: var(--surface-3);
}

.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card-body {
  min-height: 0;
  padding: 14px 14px 13px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.card-name {
  margin: 0 0 10px;
  font-size: 14px;
  line-height: 1.35;
  font-weight: 800;
  letter-spacing: -.2px;
  white-space: normal;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-stats {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}

.stat-pill {
  min-height: 24px;
  padding: 4px 7px;
  border-radius: 7px;
  font-size: 10px;
  font-weight: 750;
}

.empty-state {
  min-height: 260px;
  margin: 0;
  display: grid;
  place-items: center;
  padding: 36px;
  border: 1px dashed var(--border-strong);
  border-radius: 16px;
  background: var(--surface);
  color: var(--muted);
}

@media (max-width: 1050px) {
  .grid-wrap {
    grid-template-columns: repeat(2, minmax(0,1fr));
  }
}

@media (max-width: 720px) {
  .topbar {
    position: static;
  }

  .topbar-inner {
    min-height: 0;
    padding: 12px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 11px;
  }

  .brand-icon {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    font-size: 18px;
  }

  .brand h1 {
    font-size: 17px;
  }

  .brand-subtitle {
    font-size: 10px;
  }

  .header-controls,
  .input-wrap {
    width: 100%;
    min-width: 0;
  }

  .page-shell {
    padding: 10px 10px 34px;
  }

  .control-panel {
    top: 8px;
    padding: 11px;
    border-radius: 14px;
    margin-bottom: 10px;
  }

  .panel-row-primary {
    display: block;
  }

  .panel-label {
    display: block;
    padding: 0 0 7px;
  }

  .tabs {
    width: calc(100vw - 44px);
    margin-right: -11px;
    padding-right: 11px;
  }

  .panel-row-secondary {
    gap: 10px;
  }

  .sort-block {
    min-width: 0;
    flex: 1;
  }

  .sort-select {
    flex: 1;
    min-width: 0;
    max-width: 190px;
  }

  .filter-strip {
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
    margin-right: -11px;
    padding-right: 11px;
  }

  .filter-strip::-webkit-scrollbar {
    display: none;
  }

  .grid-wrap {
    grid-template-columns: 1fr;
    gap: 9px;
  }

  .card {
    grid-template-columns: 88px minmax(0,1fr);
    min-height: 106px;
    border-radius: 14px;
  }

  .thumb {
    width: 88px;
    min-height: 106px;
  }

  .card-body {
    padding: 12px;
  }

  .card-name {
    font-size: 13px;
    margin-bottom: 8px;
  }

  .stat-pill {
    font-size: 9px;
    min-height: 22px;
  }
}

@media (max-width: 390px) {
  .panel-row-secondary {
    align-items: flex-start;
    flex-direction: column;
  }

  .sort-block,
  .sort-select {
    width: 100%;
    max-width: none;
  }

  .meta-count {
    align-self: flex-end;
  }
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1220;
    --surface: #101827;
    --surface-2: #151f31;
    --surface-3: #1a2538;
    --border: #263449;
    --border-strong: #35465f;
    --text: #edf4ff;
    --muted: #8fa1b8;
    --muted-strong: #b4c1d2;
    --accent: #60a5fa;
    --accent-soft: #142846;
    --accent-border: #2d5d97;
    --shadow: 0 12px 34px rgba(0,0,0,.34);
    --shadow-soft: 0 3px 14px rgba(0,0,0,.2);
  }

  body {
    background:
      radial-gradient(circle at 15% 0%, rgba(37,99,235,.12), transparent 30rem),
      var(--bg);
  }

  .topbar,
  .control-panel {
    background: color-mix(in srgb, var(--surface) 92%, transparent);
  }

  .brand h1,
  .card-name,
  .input-wrap input,
  .sort-select {
    color: var(--text);
  }

  .input-wrap input::placeholder {
    color: #71829a;
  }

  .pill-avg {
    background:#142846; color:#93c5fd; border-color:#2d5d97;
  }
  .pill-rating {
    background:#10291f; color:#86efac; border-color:#256548;
  }
  .pill-plays {
    background:#182233; color:#cbd5e1; border-color:#334155;
  }
  .pill-wp1 {
    background:#31151a; color:#fda4af; border-color:#7f1d1d;
  }
  .pill-wp2 {
    background:#321b0d; color:#fdba74; border-color:#7c2d12;
  }
  .pill-wp3 {
    background:#30280a; color:#fde047; border-color:#713f12;
  }
  .pill-wp4 {
    background:#10291f; color:#86efac; border-color:#166534;
  }
  .pill-wp5 {
    background:#142846; color:#93c5fd; border-color:#1d4ed8;
  }

  .wp-1 { background:#31151a; color:#fda4af; border-color:#7f1d1d; }
  .wp-2 { background:#321b0d; color:#fdba74; border-color:#7c2d12; }
  .wp-3 { background:#30280a; color:#fde047; border-color:#713f12; }
  .wp-4 { background:#10291f; color:#86efac; border-color:#166534; }
  .wp-5 { background:#142846; color:#93c5fd; border-color:#1d4ed8; }

  .clear-chip {
    background: var(--surface-2);
    color: #fca5a5;
    border-color: var(--border);
  }

  .toast {
    background: #e2e8f0;
    color: #0f172a;
  }
}

</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-icon">🎯</div>
      <div class="brand-copy">
        <h1>Wanted <span>Hub</span></h1>
        <div class="brand-subtitle">Board game collection views</div>
      </div>
    </div>

    <div class="header-controls">
      <div class="input-wrap">
        <input id="username" value="sportomax" placeholder="BGG username" spellcheck="false"/>
        <button class="btn-load" id="start">Load</button>
      </div>
    </div>
  </div>
</header>

<main class="page-shell">
  <section class="control-panel">
    <div class="panel-row panel-row-primary">
      <div class="panel-label">Collection</div>
      <div id="tabs" class="tabs"></div>
    </div>

    <div class="panel-row panel-row-secondary">
      <div class="sort-block">
        <span class="control-label">Sort</span>
        <select class="sort-select" id="sortSel">
          <option value="avg">BGG Rating</option>
          <option value="rating">My Rating</option>
          <option value="wishlist">Wishlist Priority</option>
          <option value="name">Name A–Z</option>
        </select>
      </div>
      <span id="metaCount" class="meta-count">—</span>
    </div>

    <div id="wpChips" class="wp-chips filter-strip"></div>
  </section>

  <div id="grid" class="grid-wrap"></div>
</main>

<div id="toast" class="toast"></div>

<script>
let currentFlags  = [];
let currentWpFilter = null;
const WP_LABELS = { 1:'Must Have', 2:'Love to Have', 3:'Nice to Have', 4:'Maybe', 5:'Someday' };

// ── Toast ─────────────────────────────────────────────────────
function toast(msg, dur = 2800) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}

// ── Fetch ─────────────────────────────────────────────────────
async function fetchCollection(username) {
  const r = await fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&stats=1`);
  const txt = await r.text();
  return new DOMParser().parseFromString(txt, 'text/xml');
}

// ── Parse ─────────────────────────────────────────────────────
function parseCollection(doc) {
  return Array.from(doc.querySelectorAll('item')).map(it => {
    const st = it.querySelector('status');
    const attr = k => st?.getAttribute(k) === '1';
    const status = {
      own: attr('own'), want: attr('want'), wanttoplay: attr('wanttoplay'),
      wanttobuy: attr('wanttobuy'), fortrade: attr('fortrade'),
      prevowned: attr('prevowned'), wishlist: attr('wishlist'),
      preordered: attr('preordered'),
      wishlistpriority: attr('wishlist') ? (parseInt(st.getAttribute('wishlistpriority')) || 0) : 0
    };
    const ratingEl = it.querySelector('rating');
    let ratingVal = parseInt(ratingEl?.getAttribute('value')) || 0;
    if (ratingVal > 10) ratingVal = 0; // sentinel N/A values
    const avgEl = ratingEl?.querySelector('average') || it.querySelector('average');
    const avg = parseFloat(avgEl?.getAttribute('value') || avgEl?.textContent || '0') || 0;
    return {
      id:               it.getAttribute('objectid') || it.getAttribute('id'),
      name:             it.querySelector('name')?.textContent || 'Unknown',
      thumb:            it.querySelector('thumbnail')?.textContent || '',
      status, avg,
      rating:           ratingVal,
      wishlistpriority: status.wishlistpriority,
      numplays:         parseInt(it.querySelector('numplays')?.textContent || '0')
    };
  });
}

// ── Tabs ──────────────────────────────────────────────────────
const FLAG_DEFS = [
  { key:'wishlist',   label:'Wishlist' },
  { key:'wanttoplay', label:'To Play'  },
  { key:'wanttobuy',  label:'To Buy'   },
  { key:'want',       label:'Want'     },
  { key:'fortrade',   label:'For Trade'},
  { key:'own',        label:'Owned'    },
  { key:'prevowned',  label:'Prev Owned'},
];

function buildTabs(flags) {
  currentFlags = flags;
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  flags.forEach((f, i) => {
    const b = document.createElement('button');
    b.className = 'tab' + (i === 0 ? ' active' : '');
    b.innerHTML = `${f.label} <span class="cnt">(${f.items.length})</span>`;
    b.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      b.classList.add('active');
      currentWpFilter = null;
      renderGrid(f.items);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    tabsEl.appendChild(b);
  });
  document.getElementById('sortSel').onchange = () => {
    const active = document.querySelector('.tab.active');
    const idx = active ? [...document.querySelectorAll('.tab')].indexOf(active) : 0;
    renderGrid((currentFlags[idx] || currentFlags[0])?.items || []);
  };
}

// ── WP Chips ──────────────────────────────────────────────────
function buildWpChips(items) {
  const chipsEl = document.getElementById('wpChips');
  chipsEl.innerHTML = '';
  const counts = {};
  items.forEach(g => { const k = g.wishlistpriority || 0; if (k > 0) counts[k] = (counts[k]||0)+1; });
  const keys = Object.keys(counts).map(Number).sort((a,b)=>a-b);
  if (!keys.length) return;

  keys.forEach(k => {
    const btn = document.createElement('button');
    btn.className = `wp-chip wp-${k} ${String(currentWpFilter) === String(k) ? 'active' : ''}`;
    btn.textContent = `${WP_LABELS[k] || 'WP '+k} (${counts[k]})`;
    btn.onclick = () => {
      currentWpFilter = (String(currentWpFilter) === String(k)) ? null : String(k);
      renderGrid(items);
    };
    chipsEl.appendChild(btn);
  });

  const clr = document.createElement('button');
  clr.className = 'clear-chip';
  clr.textContent = '✕ Clear';
  clr.onclick = () => { currentWpFilter = null; renderGrid(items); };
  chipsEl.appendChild(clr);
}

// ── Render ────────────────────────────────────────────────────
function renderGrid(items) {
  const sortMode = document.getElementById('sortSel').value;
  const sorted = [...items].sort((a, b) => {
    if (sortMode === 'wishlist') {
      const pa = a.wishlistpriority || 999, pb = b.wishlistpriority || 999;
      return pa !== pb ? pa - pb : (b.avg||0) - (a.avg||0);
    }
    if (sortMode === 'rating') return (b.rating||0) - (a.rating||0) || (b.avg||0) - (a.avg||0);
    if (sortMode === 'name')   return a.name.localeCompare(b.name);
    return (b.avg||0) - (a.avg||0);
  });
  const display = currentWpFilter === null ? sorted : sorted.filter(g => String(g.wishlistpriority||0) === String(currentWpFilter));

  buildWpChips(items);
  document.getElementById('metaCount').textContent = `${display.length} game${display.length !== 1 ? 's' : ''}`;

  const grid = document.getElementById('grid');
  if (!display.length) {
    grid.innerHTML = '<div class="empty-state">No games match the current filter.</div>';
    return;
  }

  grid.innerHTML = display.map(g => {
    const avgStr    = g.avg > 0 ? g.avg.toFixed(1) : null;
    const ratingStr = g.rating > 0 ? g.rating : null;
    const wp        = g.wishlistpriority || 0;
    const wpLabel   = WP_LABELS[wp];

    const pills = [
      avgStr    ? `<span class="stat-pill pill-avg">★ ${avgStr}</span>` : '',
      ratingStr ? `<span class="stat-pill pill-rating">Mine ${ratingStr}</span>` : '',
      g.numplays > 0 ? `<span class="stat-pill pill-plays">${g.numplays} play${g.numplays !== 1 ? 's':''}</span>` : '',
      wp > 0    ? `<span class="stat-pill pill-wp${wp}">WP${wp} · ${wpLabel}</span>` : '',
    ].filter(Boolean).join('');

    const thumbHtml = g.thumb
      ? `<img src="${escAttr(g.thumb)}" loading="lazy" alt="${escAttr(g.name)}">`
      : `<div class="thumb-empty">🎲</div>`;

    return `
      <a class="card" href="https://boardgamegeek.com/boardgame/${g.id}" target="_blank" rel="noopener">
        <div class="thumb">${thumbHtml}</div>
        <div class="card-body">
          <div class="card-name">${escHtml(g.name)}</div>
          <div class="card-stats">${pills}</div>
        </div>
      </a>`;
  }).join('');
}

function collectFlags(games) {
  return FLAG_DEFS.map(f => ({
    key: f.key, label: f.label,
    items: games.filter(g => g.status[f.key])
  })).filter(f => f.items.length > 0);
}

// ── Load ──────────────────────────────────────────────────────
document.getElementById('start').onclick = async () => {
  const u = document.getElementById('username').value.trim() || 'sportomax';
  document.getElementById('metaCount').textContent = 'Loading…';
  document.getElementById('grid').innerHTML = '<div class="empty-state">Connecting to BGG…</div>';
  toast('Connecting to BGG…', 60000);
  try {
    const doc   = await fetchCollection(u);
    const games = parseCollection(doc);
    const flags = collectFlags(games);
    if (!flags.length) { toast('No flagged items found'); document.getElementById('metaCount').textContent = '0 games'; return; }
    buildTabs(flags);
    currentWpFilter = null;
    renderGrid(flags[0].items);
    toast(`Loaded ${games.length} items`);
  } catch (e) { toast('Error: ' + e.message); document.getElementById('metaCount').textContent = 'Error'; }
};

document.getElementById('username').addEventListener('keypress', e => { if (e.key === 'Enter') document.getElementById('start').click(); });

function escHtml(s) { return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
function escAttr(s) { return String(s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
</script>
</body>
</html>
