<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Wanted Hub</title>
<style>
 body{font-family:system-ui,-apple-system,Segoe UI,Roboto;background:#f7fafc;color:#111;padding:18px}
 .card{background:white;padding:12px;border-radius:10px;box-shadow:0 8px 24px rgba(11,22,39,0.06);max-width:980px;margin:8px auto}
 .tabs{display:flex;gap:8px;flex-wrap:wrap}
 .tab{padding:8px 10px;border-radius:8px;border:1px solid #e5e7eb;cursor:pointer;background:#fff}
 .tab.active{background:#2563eb;color:white;border-color:#2563eb}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:12px}
 .card-item{background:#fff;border-radius:8px;padding:8px;display:flex;gap:8px;align-items:center}
 .thumb{width:60px;height:60px;border-radius:6px;background:#eee;overflow:hidden}
 .thumb img{width:100%;height:100%;object-fit:cover}
 .muted{color:#6b7280;font-size:13px}
 .controls{display:flex;gap:8px;align-items:center;margin-bottom:8px}
</style>
</head>
<body>
<div class="card">
  <h1>Wanted Hub</h1>
  <div class="muted">Shows items from your collection whose status flags are set (Want, WantToPlay, ForTrade, WantToBuy, PrevOwned, Wishlist).</div>
  <div class="controls">
    <label>Username</label>
    <input id="username" value="sportomax" style="padding:6px;border-radius:6px;border:1px solid #ddd;margin-left:6px" />
    <button id="start" style="padding:6px 8px;border-radius:6px;background:#10b981;color:white;border:none;margin-left:6px">Start</button>
    <label style="margin-left:12px">Sort</label>
    <select id="sortSel" style="margin-left:6px;padding:6px;border-radius:6px;border:1px solid #ddd">
      <option value="avg">Average (desc)</option>
      <option value="rating">Rating (desc)</option>
      <option value="wishlist">Wishlist Priority (asc)</option>
    </select>
    <div style="margin-left:auto" class="muted" id="status">Idle</div>
  </div>

  <div id="tabs" class="tabs"></div>
  <div id="count" style="margin-top:8px" class="muted"></div>
  <div id="grid" class="grid"></div>
</div>

<script>
let currentFlags = [];
async function fetchCollection(username){
  // Do not restrict to owned items here — tabs are meant to surface all status flags
  const url = `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&stats=1`;
  const r = await fetch(url);
  const txt = await r.text();
  return new DOMParser().parseFromString(txt,'text/xml');
}

function parseCollection(doc){
  const items = Array.from(doc.querySelectorAll('item'));
  return items.map(it=>{
    const id = it.getAttribute('objectid')||it.getAttribute('id');
    const name = it.querySelector('name')?.textContent||'Unknown';
    const thumb = it.querySelector('thumbnail')?.textContent||'';
    const st = it.querySelector('status');
    const status = {
      own: st?st.getAttribute('own')==='1':false,
      want: st?st.getAttribute('want')==='1':false,
      wanttoplay: st?st.getAttribute('wanttoplay')==='1':false,
      wanttobuy: st?st.getAttribute('wanttobuy')==='1':false,
      fortrade: st?st.getAttribute('fortrade')==='1':false,
      prevowned: st?st.getAttribute('prevowned')==='1':false,
      wishlist: st?st.getAttribute('wishlist')==='1':false,
      // ensure wishlistpriority is 0 unless wishlist flag is true
      wishlistpriority: (st && st.getAttribute('wishlist')==='1') ? (parseInt(st.getAttribute('wishlistpriority'))||0) : 0
    };
    // parse preordered flag if present
    status.preordered = st?st.getAttribute('preordered')==='1':false;
    // average rating if present
    let avg = 0;
    const avNode = it.querySelector('rating') || it.querySelector('rating average') || it.querySelector('stats ratings average');
    if(avNode){ avg = parseFloat(avNode.getAttribute('value')||avNode.textContent||0) || 0; }
    // expose wishlistpriority and preordered at top-level for sorting/display
    return { id,name,thumb,status,avg, rating: avg, wishlistpriority: status.wishlistpriority || 0, preordered: status.preordered || false };
  });
}

function buildTabs(flags){
  const tabs = document.getElementById('tabs'); tabs.innerHTML='';
  currentFlags = flags;
  flags.forEach((f,i)=>{
    // compute additional per-tab counts: Want and WantToPlay (WP)
    const wantCount = (f.items||[]).filter(g=>g.status && g.status.want).length;
    const wpCount = (f.items||[]).filter(g=>g.status && g.status.wanttoplay).length;
    const b = document.createElement('button'); b.className='tab';
    b.textContent = `${f.label} (${f.items.length})` + ` — Want: ${wantCount} · WP: ${wpCount}`;
    b.title = `${f.label}: ${f.items.length} items — Want: ${wantCount}, WantToPlay: ${wpCount}`;
    b.addEventListener('click', ()=>{ document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); b.classList.add('active'); renderGrid(f.items); });
    tabs.appendChild(b);
    if(i===0) b.classList.add('active');
  });
  // wire sort selector to re-render active tab in real-time
  const sortSel = document.getElementById('sortSel');
  if(sortSel){ sortSel.addEventListener('change', ()=>{
    const active = document.querySelector('.tab.active');
    const idx = active ? Array.from(document.querySelectorAll('.tab')).indexOf(active) : 0;
    const f = currentFlags[idx] || currentFlags[0];
    if(f) renderGrid(f.items);
  }); }
}

function renderGrid(items){
  const grid = document.getElementById('grid'); grid.innerHTML='';
  document.getElementById('count').textContent = `Showing ${items.length} items`;
  // sort according to UI selection
  const sortSel = document.getElementById('sortSel');
  const sortMode = sortSel?sortSel.value:'avg';
  const sorted = (items||[]).slice().sort((a,b)=>{
    if(sortMode === 'wishlist'){
      // Ascending by wishlistpriority: 1 is highest and 0 means 'none' and should appear after 5.
      const paRaw = a.wishlistpriority || 0; const pbRaw = b.wishlistpriority || 0;
      const map = v => (v === 0 ? 999 : v); // map 0 to a large value so it sorts last
      const pa = map(paRaw), pb = map(pbRaw);
      if(pa === pb) return (b.avg||0) - (a.avg||0);
      return pa - pb;
    }
    if(sortMode === 'rating'){
      return (b.avg||0) - (a.avg||0);
    }
    // default: average desc
    return (b.avg||0) - (a.avg||0);
  });
  sorted.forEach(g=>{
    const el = document.createElement('div'); el.className='card-item';
    const wp = g.wishlistpriority || 0;
    const avg = (typeof g.avg === 'number') ? g.avg.toFixed(2) : (g.avg || '0.00');
    const rating = (typeof g.rating === 'number') ? g.rating.toFixed(2) : (g.rating || avg);
    el.innerHTML = `<div class="thumb"><img src="${g.thumb||'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22%3E%3Crect width=60 height=60 fill=%23e5e7eb/%3E%3C/svg%3E'}"/></div><div style="flex:1"><div style="font-weight:700">${g.name}</div><div class="muted">Avg: ${avg} &nbsp; | &nbsp; Rating: ${rating} &nbsp; | &nbsp; WP: ${wp}</div></div>`;
    el.addEventListener('click', ()=> window.open(`https://boardgamegeek.com/boardgame/${g.id}`,'_blank'));
    grid.appendChild(el);
  });
}

function collectFlags(games){
  // Own first, then other flags; preserve ordering so tabs are predictable
  const flagNames = [
    {key:'own',label:'Own'},
    {key:'want',label:'Want'},
    {key:'wanttoplay',label:'Want To Play'},
    {key:'wanttobuy',label:'Want To Buy'},
    {key:'fortrade',label:'For Trade'},
    {key:'prevowned',label:'Previously Owned'},
    {key:'wishlist',label:'Wishlist'}
  ];
  const out = [];
  flagNames.forEach(f=>{
    const items = games.filter(g=>g.status[f.key]);
    if(items.length) out.push({key:f.key,label:f.label,items:items.slice()});
  });
  return out;
}

document.getElementById('start').addEventListener('click', async ()=>{
  const u = document.getElementById('username').value.trim()||'sportomax';
  document.getElementById('status').textContent = 'Fetching collection...';
  try{
    const doc = await fetchCollection(u);
    const games = parseCollection(doc);
    const flags = collectFlags(games);
    if(flags.length===0){ document.getElementById('status').textContent='No status flags found'; return; }
    buildTabs(flags);
    // activate first tab
    renderGrid(flags[0].items);
    document.getElementById('status').textContent = `Loaded ${games.length} games`;
  }catch(e){ document.getElementById('status').textContent = 'Error: '+e.message; }
});
</script>
</body>
</html>
