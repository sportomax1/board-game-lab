<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Game Versions</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>📦</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            height: 100%;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            max-width: none;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            padding-top: env(safe-area-inset-top, 0);
            padding-bottom: env(safe-area-inset-bottom, 0);
            padding-left: env(safe-area-inset-left, 0);
            padding-right: env(safe-area-inset-right, 0);
        }

        .header {
            flex-shrink: 0;
            padding: 1rem;
            border-bottom: 1px solid #eee;
            background: white;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            color: #333;
        }

        .setup-section {
            flex-shrink: 0;
            padding: 1rem;
            background: white;
            border-bottom: 1px solid #eee;
            max-height: 50vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .setup-input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            -webkit-appearance: none;
            appearance: none;
        }

        .setup-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn {
            padding: 0.75rem 1rem;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            font-size: 1rem;
            min-width: 50px;
        }

        .btn:active {
            opacity: 0.9;
            transform: scale(0.98);
        }

        .settings-btn {
            background: none;
            border: 1px solid #ddd;
            padding: 0.5rem 0.75rem;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .settings-btn:active {
            background: #f0f0f0;
            border-color: #999;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #333;
        }

        .btn-secondary:active {
            background: #d1d5db;
        }

        .status {
            font-size: 0.85rem;
            color: #666;
            padding: 0.5rem;
            background: #f9f9f9;
            border-radius: 4px;
            text-align: center;
        }

        .status.active {
            color: #6366f1;
            font-weight: 600;
        }

        .cache-info {
            font-size: 0.75rem;
            color: #999;
            margin-top: 0.5rem;
            padding: 0.5rem;
            background: #f9f9f9;
            border-radius: 4px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .search-bar {
            flex-shrink: 0;
            padding: 0.75rem 1rem;
            background: white;
            border-bottom: 1px solid #eee;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            -webkit-appearance: none;
            appearance: none;
        }

        .search-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .games-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-height: 400px;
        }

        .game-card {
            background: white;
            border: 1px solid #eee;
            border-radius: 6px;
            padding: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .game-card:active {
            background: #e7f3ff;
            border-color: #6366f1;
            transform: scale(0.98);
        }

        .game-card-main {
            display: contents;
        }

        .game-thumbnail {
            width: 50px;
            height: 50px;
            flex-shrink: 0;
            background: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        .game-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-info {
            flex: 1;
            min-width: 0;
        }

        .game-header {
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
            margin: 0;
            word-break: break-word;
            display: -webkit-box;
            line-clamp: 1;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .game-count {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 0.5rem;
        }

        .game-stats {
            padding: 0.75rem 1rem;
            background: white;
            border-bottom: 1px solid #eee;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .stat-box {
            padding: 0.5rem;
            background: #f0f9ff;
            border: 1px solid #bfdbfe;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .stat-label {
            font-weight: 600;
            color: #1e40af;
            font-size: 0.75rem;
            margin-bottom: 0.25rem;
        }

        .stat-value {
            font-size: 0.9rem;
            color: #333;
            font-weight: 600;
        }

        .versions-list {
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .version-item {
            padding: 0.75rem;
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 6px;
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.75rem;
        }

        .version-thumbnail {
            width: 50px;
            height: 65px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .version-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .version-details {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex: 1;
            min-width: 0;
        }

        .version-name {
            font-weight: 600;
            font-size: 0.9rem;
            color: #333;
            word-break: break-word;
        }

        .version-year {
            font-size: 0.8rem;
            color: #666;
        }

        .version-dimensions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            font-size: 0.75rem;
        }

        .dimension {
            background: white;
            padding: 0.4rem;
            border-radius: 4px;
            border: 1px solid #eee;
        }

        .dimension-label {
            font-weight: 600;
            color: #666;
            font-size: 0.7rem;
        }

        .dimension-value {
            color: #333;
            font-weight: 600;
        }

        .no-data {
            text-align: center;
            padding: 2rem 1rem;
            color: #999;
        }

        .settings-toggle {
            flex-shrink: 0;
            padding: 0.75rem 1rem;
            background: white;
            border-bottom: 1px solid #eee;
            text-align: center;
        }

        .settings-toggle button {
            padding: 0.5rem 1rem;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .settings-toggle button:active {
            background: #e0e0e0;
        }

        .filter-section {
            margin-bottom: 0.75rem;
        }

        .filter-title {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            color: #333;
        }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .filter-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            flex: 0 1 calc(50% - 0.25rem);
        }

        .filter-checkbox:active {
            background: #e0e0e0;
        }

        .filter-checkbox input {
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #ddd;
            border-radius: 4px;
            background: white;
            margin: 0;
        }

        .filter-checkbox input:checked {
            background: #6366f1;
            border-color: #6366f1;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-overlay.hidden {
            display: none;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 430px;
            width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid #eee;
            font-size: 1.3rem;
            font-weight: 700;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #999;
            cursor: pointer;
            padding: 0;
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .modal-close:active {
            background: #f0f0f0;
            color: #333;
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 1rem;
        }

        .modal-footer {
            padding: 1rem;
            border-top: 1px solid #eee;
            display: flex;
            gap: 0.5rem;
            background: #f9f9f9;
        }

        .modal-footer button {
            flex: 1;
        }

        .metrics-bar {
            padding: 0.75rem 1rem;
            background: #f0f9ff;
            border-bottom: 1px solid #bfdbfe;
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            flex-wrap: wrap;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .metric-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
            padding: 0.5rem 0.75rem;
            background: white;
            border-radius: 6px;
            border: 1px solid #dbeafe;
        }

        .metric-label {
            font-weight: 600;
            color: #1e40af;
            font-size: 0.8rem;
        }

        .metric-value {
            font-weight: 700;
            color: #333;
            font-size: 0.95rem;
        }

        .progress-bar {
            flex: 1;
            min-width: 150px;
            height: 20px;
            background: white;
            border: 1px solid #dbeafe;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: 700;
            color: white;
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header" style="display: flex; justify-content: space-between; align-items: center;">
            <h1 style="margin: 0;">📦 Game Versions</h1>
            <button class="settings-btn" id="settingsBtn" title="Settings">⚙️</button>
        </div>

        <div class="main-content">
            <div class="metrics-bar" id="metricsBar">
                <div class="metric-item">
                    <span class="metric-label">📊 Progress:</span>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width: 0%;">0%</div>
                    </div>
                </div>
                <div class="metric-item">
                    <span class="metric-label">🎮 Loaded:</span>
                    <span class="metric-value" id="gamesLoadedMetric">0</span>
                </div>
                <div class="metric-item">
                    <span class="metric-label">📡 API Calls:</span>
                    <span class="metric-value" id="apiCallsMetric">0</span>
                </div>
                <div class="metric-item">
                    <span class="metric-label">⏱️ Elapsed:</span>
                    <span class="metric-value" id="elapsedMetric">0s</span>
                </div>
                <div class="metric-item">
                    <span class="metric-label">🔄 Status:</span>
                    <span class="metric-value" id="statusMetric">Ready</span>
                </div>
            </div>

            <div class="search-bar" style="display: flex; gap: 0.5rem; align-items: center; padding: 1rem; border-bottom: 1px solid #eee;">
                <input type="text" id="searchInput" class="search-input" placeholder="Search games..." style="flex: 1;">
                <select id="sortSelect" style="padding: 0.5rem 0.75rem; border: 1px solid #ddd; border-radius: 8px; font-size: 0.9rem; background: white; cursor: pointer;">
                    <option value="name">Sort: Name ↑</option>
                    <option value="name-desc">Sort: Name ↓</option>
                    <option value="volume">Sort: Volume ↑</option>
                    <option value="volume-desc">Sort: Volume ↓</option>
                </select>
            </div>

            <div class="games-list" id="gamesList"></div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                ⚙️ Settings
                <button class="modal-close" id="modalCloseBtn">✕</button>
            </div>
            <div class="modal-body">
                <div style="margin-bottom: 1rem;">
                    <div class="filter-title">👤 Username</div>
                    <input type="text" id="usernameInput" class="setup-input" placeholder="Enter BGG username" value="sportomax">
                </div>

                <div class="filter-section">
                    <div class="filter-title">📦 Collection Status</div>
                    <div class="filter-group">
                        <label class="filter-checkbox">
                            <input type="checkbox" name="status" value="own" checked>
                            Own
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" name="status" value="wanttoplay">
                            Want to Play
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" name="status" value="wanttobuy">
                            Want to Buy
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" name="status" value="prevowned">
                            Prev. Owned
                        </label>
                    </div>
                </div>

                <div class="status" id="processingStatus" style="margin-top: 1rem;"></div>
                <div class="cache-info" id="cacheInfo"></div>
            </div>
            <div class="modal-footer">
                <button class="btn" id="loadBtn">📦 Load</button>
                <button class="btn btn-secondary" id="clearBtn">🗑️ Clear</button>
            </div>
        </div>
    </div>

    <!-- Details Modal -->
    <div class="modal-overlay hidden" id="detailsModal">
        <div class="modal-content">
            <div class="modal-header" id="detailsHeader">
                Game Details
                <button class="modal-close" id="detailsCloseBtn">✕</button>
            </div>
            <div class="modal-body" id="detailsBody"></div>
            <div class="modal-footer">
                <button class="btn" onclick="closeDetailsModal()">Close</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY_COLLECTION = 'bgg_versions_collection';
        const STORAGE_KEY_TIMESTAMP = 'bgg_versions_timestamp';

        let allGames = [];
        let gameVersions = {};
        let currentUsername = 'sportomax';
        let originalSettingsHTML = null;
        let totalApiCalls = 0;
        let startTime = null;

        const usernameInput = document.getElementById('usernameInput');
        const loadBtn = document.getElementById('loadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        const processingStatus = document.getElementById('processingStatus');
        const cacheInfo = document.getElementById('cacheInfo');
        const gamesList = document.getElementById('gamesList');
        const searchInput = document.getElementById('searchInput');
        const settingsModal = document.getElementById('settingsModal');
        const settingsBtn = document.getElementById('settingsBtn');
        const sortSelect = document.getElementById('sortSelect');
        const progressFill = document.getElementById('progressFill');
        const gamesLoadedMetric = document.getElementById('gamesLoadedMetric');
        const apiCallsMetric = document.getElementById('apiCallsMetric');
        const elapsedMetric = document.getElementById('elapsedMetric');
        const statusMetric = document.getElementById('statusMetric');
        let currentSortOrder = 'name';

        // Show modal on load
        function showModal() {
            if (!originalSettingsHTML) {
                originalSettingsHTML = document.querySelector('.modal-body').innerHTML;
            }
            settingsModal.classList.remove('hidden');
        }

        // Settings button click handler
        settingsBtn.addEventListener('click', showModal);

        // Update metrics display
        function updateMetrics() {
            if (startTime) {
                const elapsed = Math.round((Date.now() - startTime) / 1000);
                elapsedMetric.textContent = elapsed + 's';
            }
            gamesLoadedMetric.textContent = Object.keys(gameVersions).length;
            apiCallsMetric.textContent = totalApiCalls;
        }

        // Update progress bar
        function updateProgress(current, total) {
            if (total === 0) return;
            const percent = Math.round((current / total) * 100);
            progressFill.style.width = percent + '%';
            progressFill.textContent = percent + '%';
        }

        // Hide modal
        function hideModal() {
            settingsModal.classList.add('hidden');
        }

        // Load button
        loadBtn.addEventListener('click', loadCollection);

        // Close modal button
        modalCloseBtn.addEventListener('click', hideModal);

        // Clear cache
        clearBtn.addEventListener('click', () => {
            localStorage.removeItem(STORAGE_KEY_COLLECTION);
            localStorage.removeItem(STORAGE_KEY_TIMESTAMP);
            processingStatus.textContent = '✅ Cache cleared';
            processingStatus.classList.add('active');
            allGames = [];
            gameVersions = {};
            gamesList.innerHTML = '';
            cacheInfo.textContent = '';
            totalApiCalls = 0;
            statusMetric.textContent = 'Ready';
            updateProgress(0, 100);
            updateMetrics();
            setTimeout(() => { processingStatus.classList.remove('active'); }, 2000);
        });

        // Search
        searchInput.addEventListener('input', renderGames);

        // Sort change
        sortSelect.addEventListener('change', (e) => {
            currentSortOrder = e.target.value;
            renderGames();
        });

        // Helper functions
        async function fetchWithRetry(url, maxRetries = 3) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    totalApiCalls++;
                    updateMetrics();
                    console.log(`📡 [API Call ${i + 1}] GET ${url}`);
                    const response = await fetch(url);
                    if (response.status === 202) {
                        console.log(`⏳ [API] Status 202 - retrying after ${2000 * (i + 1)}ms`);
                        await new Promise(resolve => setTimeout(resolve, 2000 * (i + 1)));
                        continue;
                    }
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    console.log(`✅ [API] Response received`);
                    return response;
                } catch (error) {
                    console.error(`❌ [API] Error on attempt ${i + 1}:`, error.message);
                    if (i === maxRetries - 1) throw error;
                    await new Promise(resolve => setTimeout(resolve, 1000 * (i + 1)));
                }
            }
        }

        // Load collection
        async function loadCollection() {
            const username = usernameInput.value.trim();
            if (!username) {
                processingStatus.textContent = '❌ Please enter a username';
                processingStatus.classList.add('active');
                return;
            }

            // Reset metrics
            startTime = Date.now();
            totalApiCalls = 0;
            statusMetric.textContent = 'Loading...';
            updateMetrics();
            updateProgress(0, 100);

            currentUsername = username;
            localStorage.setItem('bgg_versions_username', username);

            processingStatus.classList.add('active');
            processingStatus.textContent = '📦 Loading collection...';
            console.log('🔍 Fetching collection for:', username);

            try {
                // Check cache
                const cached = localStorage.getItem(STORAGE_KEY_COLLECTION);
                if (cached) {
                    allGames = JSON.parse(cached);
                    processingStatus.textContent = `✅ Loaded ${allGames.length} games. Fetching version data...`;
                    console.log('✅ Loaded collection:', allGames.length, 'games');
                    updateCacheInfo();
                    // Still fetch version data fresh
                    await processGameBatches();
                    hideModal();
                    // Fetch collection
                    const url = `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1`;
                    console.log('🔗 API URL:', url);
                    
                    const response = await fetchWithRetry(url);
                    const xml = new DOMParser().parseFromString(await response.text(), 'text/xml');
                    const items = xml.querySelectorAll('item');

                    allGames = Array.from(items).map(item => ({
                        id: item.getAttribute('objectid'),
                        name: item.querySelector('name')?.textContent || 'Unknown',
                        image: item.querySelector('image')?.textContent || ''
                    })).filter(g => g.id);

                    console.log('📦 Collection fetched:', allGames.length, 'games');
                    localStorage.setItem(STORAGE_KEY_COLLECTION, JSON.stringify(allGames));
                    processingStatus.textContent = `✅ Loaded ${allGames.length} games`;
                    updateCacheInfo();

                    // Process games in batches
                    await processGameBatches();
                    setTimeout(() => hideModal(), 500);
                }

            } catch (error) {
                processingStatus.textContent = `❌ Error: ${error.message}`;
                console.error('❌ Error:', error);
            }
        }

        // Process games in batches
        async function processGameBatches() {
            const batchSize = 20;
            let processed = 0;
            gameVersions = {};

            for (let i = 0; i < allGames.length; i += batchSize) {
                const batch = allGames.slice(i, i + batchSize);
                const ids = batch.map(g => g.id).join(',');

                try {
                    processingStatus.textContent = `📐 Processing ${Math.min(processed + batch.length, allGames.length)}/${allGames.length} games...`;
                    console.log(`\n🔄 Batch ${Math.ceil((i + 1) / batchSize)}/${Math.ceil(allGames.length / batchSize)}: Fetching ${batch.length} games (IDs: ${ids})`);

                    const url = `/api/bgg-helper?endpoint=thing&id=${ids}&type=boardgame&versions=1`;
                    const response = await fetchWithRetry(url);
                    const xml = new DOMParser().parseFromString(await response.text(), 'text/xml');
                    const items = xml.querySelectorAll('item[type="boardgameversion"]');

                    const versionsByGame = {};
                    Array.from(items).forEach(item => {
                        const gameLink = item.querySelector('link[type="boardgameversion"][inbound="true"]');
                        if (!gameLink) return;

                        const gameId = gameLink.getAttribute('id');
                        const game = allGames.find(g => g.id === gameId);
                        if (!game) return;

                        if (!versionsByGame[gameId]) {
                            versionsByGame[gameId] = [];
                        }

                        const width = parseFloat(item.querySelector('width')?.getAttribute('value') || 0);
                        const length = parseFloat(item.querySelector('length')?.getAttribute('value') || 0);
                        const depth = parseFloat(item.querySelector('depth')?.getAttribute('value') || 0);
                        const weight = parseFloat(item.querySelector('weight')?.getAttribute('value') || 0);
                        
                        // Extract language
                        const languages = Array.from(item.querySelectorAll('link[type="language"]'))
                            .map(l => l.getAttribute('value'));
                        const language = languages.length > 0 ? languages.join(', ') : 'Unknown';

                        versionsByGame[gameId].push({
                            id: item.getAttribute('id'),
                            name: item.querySelector('name[type="primary"]')?.getAttribute('value') || 'Unknown',
                            // year: item.querySelector('yearpublished')?.getAttribute('value') || '', // Save space
                            // thumbnail: item.querySelector('thumbnail')?.textContent || '', // Save space
                            width: width,
                            length: length,
                            depth: depth,
                            weight: weight,
                            language: language
                        });
                    });

                    // Calculate stats for each game
                    let batchVersions = 0;
                    Object.entries(versionsByGame).forEach(([gameId, versions]) => {
                        const game = allGames.find(g => g.id === gameId);
                        if (!game) return;

                        const widths = versions.map(v => v.width).filter(w => w > 0);
                        const lengths = versions.map(v => v.length).filter(l => l > 0);
                        const depths = versions.map(v => v.depth).filter(d => d > 0);
                        const weights = versions.map(v => v.weight).filter(w => w > 0);

                        gameVersions[gameId] = {
                            name: game.name,
                            image: game.image,
                            versions: versions,
                            stats: {
                                versionCount: versions.length,
                                width: calculateStats(widths),
                                length: calculateStats(lengths),
                                depth: calculateStats(depths),
                                weight: calculateStats(weights),
                                avgVolume: widths.length > 0 && lengths.length > 0 && depths.length > 0 ? 
                                    (widths.reduce((a,b)=>a+b,0)/widths.length) * (lengths.reduce((a,b)=>a+b,0)/lengths.length) * (depths.reduce((a,b)=>a+b,0)/depths.length) : 0
                            }
                        };
                        batchVersions++;
                        console.log(`  ✅ ${game.name}: ${versions.length} versions`);
                    });

                    console.log(`📊 Batch result: ${batchVersions}/${batch.length} games had versions\n`);
                    processed += batch.length;
                    updateProgress(processed, allGames.length);
                    statusMetric.textContent = `Batch ${Math.ceil(processed / 20)}/${Math.ceil(allGames.length / 20)}`;
                    updateMetrics();
                    renderGames();

                } catch (error) {
                    console.error(`❌ Error processing batch at ${i}:`, error);
                    processingStatus.textContent = `⚠️ Error in batch: ${error.message}`;
                }

                await new Promise(resolve => setTimeout(resolve, 200));
            }

            try {
                localStorage.setItem(STORAGE_KEY_TIMESTAMP, new Date().toISOString());
                localStorage.setItem('bgg_game_versions', JSON.stringify(gameVersions));
                console.log('💾 Saved version data to localStorage');
            } catch (e) {
                console.error('❌ Failed to save to localStorage:', e);
                if (e.name === 'QuotaExceededError') {
                    processingStatus.textContent = '⚠️ Storage full! Some data may not be saved.';
                    alert('Storage full! Your collection is too large to save all version data locally.');
                }
            }

            const resultText = `✅ Done! Found ${Object.keys(gameVersions).length} games with versions`;
            processingStatus.textContent = resultText;
            statusMetric.textContent = 'Complete';
            updateProgress(100, 100);
            updateMetrics();
            console.log(resultText);
            hideModal();
            setTimeout(() => { processingStatus.classList.remove('active'); }, 3000);
        }

        // Calculate stats (min, max, avg)
        function calculateStats(values) {
            if (values.length === 0) return null;
            const min = Math.min(...values);
            const max = Math.max(...values);
            const avg = (values.reduce((a, b) => a + b, 0) / values.length).toFixed(2);
            return { min: min.toFixed(2), max: max.toFixed(2), avg: avg, count: values.length };
        }

        // Render games
        function renderGames() {
            const searchTerm = searchInput.value.toLowerCase();
            
            // If no games loaded yet, show loading state
            if (Object.keys(gameVersions).length === 0) {
                console.log('⏳ No games loaded yet, skipping render');
                gamesList.innerHTML = '<div class="no-data">📦 Loading... Click "Load" to fetch version data</div>';
                return;
            }

            let games = Object.entries(gameVersions)
                .filter(([gameId, game]) => game.name.toLowerCase().includes(searchTerm));
            
            // Apply sorting based on currentSortOrder
            games.sort((a, b) => {
                const gameA = a[1];
                const gameB = b[1];
                switch(currentSortOrder) {
                    case 'name':
                        return gameA.name.localeCompare(gameB.name);
                    case 'name-desc':
                        return gameB.name.localeCompare(gameA.name);
                    case 'volume':
                        return (gameA.stats.avgVolume || 0) - (gameB.stats.avgVolume || 0);
                    case 'volume-desc':
                        return (gameB.stats.avgVolume || 0) - (gameA.stats.avgVolume || 0);
                    default:
                        return gameA.name.localeCompare(gameB.name);
                }
            });

            if (games.length === 0) {
                gamesList.innerHTML = '<div class="no-data">No games with versions found</div>';
                return;
            }

            gamesList.innerHTML = games.map(([gameId, game]) => {
                const stats = game.stats;
                const avgSizes = getAverageSizes(game.versions);
                const mostCommon = getMostCommonSize(game.versions);
                const cubicMetric = Math.round(stats.avgVolume * 100) / 100;
                return `
                    <div class="game-card" data-game-id="${gameId}">
                        <div class="game-card-main">
                            <div class="game-thumbnail">
                                ${game.image ? `<img src="/api/image-proxy?url=${encodeURIComponent(game.image)}" alt="" onerror="this.style.display='none';">` : '<div style="width: 100%; height: 100%; background: #f0f0f0; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #999;">📦</div>'}
                            </div>
                            <div class="game-info">
                                <div class="game-header">${escapeHtml(game.name)}</div>
                                <div style="font-size: 0.8rem; color: #666; margin-top: 0.25rem;">
                                    <div>📏 Avg: ${avgSizes.width}" × ${avgSizes.length}" × ${avgSizes.depth}" = <strong>${cubicMetric}"³</strong></div>
                                    <div style="margin-top: 0.15rem;">🔁 Common: ${mostCommon.width}" × ${mostCommon.length}" × ${mostCommon.depth}"</div>
                                </div>
                                <span class="game-count" style="margin-top: 0.25rem;">📦 ${stats.versionCount} versions</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Add click handlers to show details modal
            document.querySelectorAll('.game-card').forEach(card => {
                card.addEventListener('click', function(e) {
                    const gameId = this.dataset.gameId;
                    const game = gameVersions[gameId];
                    if (!game) return;
                    showDetailsModal(gameId, game);
                });
            });
        }

        // Show details modal with version info
        function showDetailsModal(gameId, game) {
            const modal = document.getElementById('detailsModal');
            const modalHeader = document.getElementById('detailsHeader');
            const modalBody = document.getElementById('detailsBody');
            const detailsCloseBtn = document.getElementById('detailsCloseBtn');

            modalHeader.innerHTML = `
                📦 ${escapeHtml(game.name)}
                <button class="modal-close" id="detailsCloseBtn">✕</button>
            `;

            const versionDetails = game.versions.map(v => `
                <div style="margin-bottom: 1rem; padding: 1rem; background: #f9f9f9; border-radius: 6px;">
                    <div style="font-weight: 600; margin-bottom: 0.5rem;">${escapeHtml(v.name)}</div>
                    <div style="font-size: 0.9rem; color: #666; margin-bottom: 0.5rem;">📅 ${v.year || 'Unknown year'}</div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 0.5rem; font-size: 0.85rem;">
                        <div><strong>W:</strong> ${v.width > 0 ? v.width.toFixed(2) + '"' : '—'}</div>
                        <div><strong>L:</strong> ${v.length > 0 ? v.length.toFixed(2) + '"' : '—'}</div>
                        <div><strong>D:</strong> ${v.depth > 0 ? v.depth.toFixed(2) + '"' : '—'}</div>
                        <div><strong>Wt:</strong> ${v.weight > 0 ? v.weight.toFixed(2) + 'lb' : '—'}</div>
                    </div>
                </div>
            `).join('');

            modalBody.innerHTML = `
                <div style="margin-bottom: 1rem;">
                    <div style="font-weight: 600; margin-bottom: 0.5rem;">📊 Statistics</div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                        <div style="padding: 0.75rem; background: #f0f9ff; border: 1px solid #bfdbfe; border-radius: 6px;">
                            <div style="font-size: 0.75rem; font-weight: 600; color: #1e40af;">Total Versions</div>
                            <div style="font-size: 1.3rem; font-weight: 700; color: #333;">${game.stats.versionCount}</div>
                        </div>
                        <div style="padding: 0.75rem; background: #f0f9ff; border: 1px solid #bfdbfe; border-radius: 6px;">
                            <div style="font-size: 0.75rem; font-weight: 600; color: #1e40af;">Width Range</div>
                            <div style="font-size: 1rem; font-weight: 700; color: #333;">${game.stats.width ? `${game.stats.width.min}–${game.stats.width.max}"` : 'N/A'}</div>
                        </div>
                        <div style="padding: 0.75rem; background: #f0f9ff; border: 1px solid #bfdbfe; border-radius: 6px;">
                            <div style="font-size: 0.75rem; font-weight: 600; color: #1e40af;">Length Range</div>
                            <div style="font-size: 1rem; font-weight: 700; color: #333;">${game.stats.length ? `${game.stats.length.min}–${game.stats.length.max}"` : 'N/A'}</div>
                        </div>
                        <div style="padding: 0.75rem; background: #f0f9ff; border: 1px solid #bfdbfe; border-radius: 6px;">
                            <div style="font-size: 0.75rem; font-weight: 600; color: #1e40af;">Weight Range</div>
                            <div style="font-size: 1rem; font-weight: 700; color: #333;">${game.stats.weight ? `${game.stats.weight.min}–${game.stats.weight.max}lb` : 'N/A'}</div>
                        </div>
                    </div>
                </div>
                <div style="font-weight: 600; margin-bottom: 0.5rem;">📦 Versions</div>
                <div style="max-height: 400px; overflow-y: auto;">
                    ${versionDetails}
                </div>
            `;

            modal.classList.remove('hidden');
            document.getElementById('detailsCloseBtn').addEventListener('click', closeDetailsModal);
        }

        // Close details modal
        function closeDetailsModal() {
            document.getElementById('detailsModal').classList.add('hidden');
        }

        // Calculate average sizes from versions (excluding blanks, preferring ENG)
        function getAverageSizes(versions) {
            const englishVersions = versions.filter(v => !v.language || v.language.includes('ENG') || v.language.includes('English'));
            const vToUse = englishVersions.length > 0 ? englishVersions : versions;
            
            const validVersions = vToUse.filter(v => v.width > 0 && v.length > 0 && v.depth > 0);
            if (validVersions.length === 0) {
                return { width: '—', length: '—', depth: '—', volume: 0 };
            }
            
            const avgWidth = validVersions.reduce((sum, v) => sum + v.width, 0) / validVersions.length;
            const avgLength = validVersions.reduce((sum, v) => sum + v.length, 0) / validVersions.length;
            const avgDepth = validVersions.reduce((sum, v) => sum + v.depth, 0) / validVersions.length;
            const volume = avgWidth * avgLength * avgDepth;
            
            return {
                width: avgWidth.toFixed(1),
                length: avgLength.toFixed(1),
                depth: avgDepth.toFixed(1),
                volume
            };
        }

        // Get most common size dimensions from versions (excluding blanks, preferring ENG)
        function getMostCommonSize(versions) {
            const englishVersions = versions.filter(v => !v.language || v.language.includes('ENG') || v.language.includes('English'));
            const vToUse = englishVersions.length > 0 ? englishVersions : versions;
            
            const validVersions = vToUse.filter(v => v.width > 0 && v.length > 0 && v.depth > 0);
            if (validVersions.length === 0) {
                return { width: '—', length: '—', depth: '—' };
            }
            
            // Group by dimension signatures
            const dimensionSigs = {};
            validVersions.forEach(v => {
                const sig = `${v.width.toFixed(1)},${v.length.toFixed(1)},${v.depth.toFixed(1)}`;
                dimensionSigs[sig] = (dimensionSigs[sig] || 0) + 1;
            });
            
            // Find most common
            let mostCommonSig = Object.entries(dimensionSigs).sort((a, b) => b[1] - a[1])[0][0];
            const dims = mostCommonSig.split(',');
            return {
                width: dims[0],
                length: dims[1],
                depth: dims[2]
            };
        }

        // Update cache info
        function updateCacheInfo() {
            // Only show username, not cache info
            cacheInfo.textContent = `👤 Username: ${currentUsername} | 📦 Collection: ${allGames.length} games | 📊 Versions: ${Object.keys(gameVersions).length}`;
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize metrics on page load
        window.addEventListener('load', () => {
            statusMetric.textContent = 'Ready';
            updateMetrics();
        });

        // Initialize
        window.addEventListener('load', () => {
            const savedUsername = localStorage.getItem('bgg_versions_username');
            if (savedUsername) {
                usernameInput.value = savedUsername;
            }
            
            // Load cached gameVersions data
            try {
                const cachedVersions = localStorage.getItem('bgg_game_versions');
                if (cachedVersions) {
                    gameVersions = JSON.parse(cachedVersions);
                    console.log(`✅ Loaded ${Object.keys(gameVersions).length} games from cache`);
                }
            } catch (err) {
                console.error('Error loading cached versions:', err);
            }
            
            updateCacheInfo();
            console.log('📐 Versions app loaded');
            showModal();
        });
    </script>
</body>
