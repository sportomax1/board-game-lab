<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Game Versions</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>📦</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            height: 100%;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            padding-top: env(safe-area-inset-top, 0);
            padding-bottom: env(safe-area-inset-bottom, 0);
            padding-left: env(safe-area-inset-left, 0);
            padding-right: env(safe-area-inset-right, 0);
        }

        .header {
            flex-shrink: 0;
            padding: 1rem;
            border-bottom: 1px solid #eee;
            background: white;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            color: #333;
        }

        .setup-section {
            flex-shrink: 0;
            padding: 1rem;
            background: white;
            border-bottom: 1px solid #eee;
            max-height: 50vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .setup-input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            -webkit-appearance: none;
            appearance: none;
        }

        .setup-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn {
            padding: 0.75rem 1rem;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            font-size: 1rem;
            min-width: 50px;
        }

        .btn:active {
            opacity: 0.9;
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #333;
        }

        .btn-secondary:active {
            background: #d1d5db;
        }

        .status {
            font-size: 0.85rem;
            color: #666;
            padding: 0.5rem;
            background: #f9f9f9;
            border-radius: 4px;
            text-align: center;
        }

        .status.active {
            color: #6366f1;
            font-weight: 600;
        }

        .cache-info {
            font-size: 0.75rem;
            color: #999;
            margin-top: 0.5rem;
            padding: 0.5rem;
            background: #f9f9f9;
            border-radius: 4px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .search-bar {
            flex-shrink: 0;
            padding: 0.75rem 1rem;
            background: white;
            border-bottom: 1px solid #eee;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            -webkit-appearance: none;
            appearance: none;
        }

        .search-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .games-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .game-card {
            background: white;
            border: 1px solid #eee;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s;
        }

        .game-card:active {
            background: #e7f3ff;
            border-color: #6366f1;
            transform: scale(0.98);
        }

        .game-header {
            padding: 1rem;
            background: #f9f9f9;
            border-bottom: 1px solid #eee;
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
        }

        .game-stats {
            padding: 0.75rem 1rem;
            background: white;
            border-bottom: 1px solid #eee;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .stat-box {
            padding: 0.5rem;
            background: #f0f9ff;
            border: 1px solid #bfdbfe;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .stat-label {
            font-weight: 600;
            color: #1e40af;
            font-size: 0.75rem;
            margin-bottom: 0.25rem;
        }

        .stat-value {
            font-size: 0.9rem;
            color: #333;
            font-weight: 600;
        }

        .versions-list {
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .version-item {
            padding: 0.75rem;
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 6px;
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.75rem;
        }

        .version-thumbnail {
            width: 50px;
            height: 65px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .version-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .version-details {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex: 1;
            min-width: 0;
        }

        .version-name {
            font-weight: 600;
            font-size: 0.9rem;
            color: #333;
            word-break: break-word;
        }

        .version-year {
            font-size: 0.8rem;
            color: #666;
        }

        .version-dimensions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            font-size: 0.75rem;
        }

        .dimension {
            background: white;
            padding: 0.4rem;
            border-radius: 4px;
            border: 1px solid #eee;
        }

        .dimension-label {
            font-weight: 600;
            color: #666;
            font-size: 0.7rem;
        }

        .dimension-value {
            color: #333;
            font-weight: 600;
        }

        .no-data {
            text-align: center;
            padding: 2rem 1rem;
            color: #999;
        }

        .settings-toggle {
            flex-shrink: 0;
            padding: 0.75rem 1rem;
            background: white;
            border-bottom: 1px solid #eee;
            text-align: center;
        }

        .settings-toggle button {
            padding: 0.5rem 1rem;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .settings-toggle button:active {
            background: #e0e0e0;
        }

        .filter-section {
            margin-bottom: 0.75rem;
        }

        .filter-title {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            color: #333;
        }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .filter-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            flex: 0 1 calc(50% - 0.25rem);
        }

        .filter-checkbox:active {
            background: #e0e0e0;
        }

        .filter-checkbox input {
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #ddd;
            border-radius: 4px;
            background: white;
            margin: 0;
        }

        .filter-checkbox input:checked {
            background: #6366f1;
            border-color: #6366f1;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-overlay.hidden {
            display: none;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 430px;
            width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid #eee;
            font-size: 1.3rem;
            font-weight: 700;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #999;
            cursor: pointer;
            padding: 0;
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .modal-close:active {
            background: #f0f0f0;
            color: #333;
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 1rem;
        }

        .modal-footer {
            padding: 1rem;
            border-top: 1px solid #eee;
            display: flex;
            gap: 0.5rem;
            background: #f9f9f9;
        }

        .modal-footer button {
            flex: 1;
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Game Versions</h1>
        </div>

        <div class="main-content">
            <div class="search-bar">
                <input type="text" id="searchInput" class="search-input" placeholder="Search games...">
            </div>

            <div class="games-list" id="gamesList"></div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                ⚙️ Settings
                <button class="modal-close" id="modalCloseBtn">✕</button>
            </div>
            <div class="modal-body">
                <div style="margin-bottom: 1rem;">
                    <div class="filter-title">👤 Username</div>
                    <input type="text" id="usernameInput" class="setup-input" placeholder="Enter BGG username" value="sportomax">
                </div>

                <div class="filter-section">
                    <div class="filter-title">📦 Collection Status</div>
                    <div class="filter-group">
                        <label class="filter-checkbox">
                            <input type="checkbox" name="status" value="own" checked>
                            Own
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" name="status" value="wanttoplay">
                            Want to Play
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" name="status" value="wanttobuy">
                            Want to Buy
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" name="status" value="prevowned">
                            Prev. Owned
                        </label>
                    </div>
                </div>

                <div class="status" id="processingStatus" style="margin-top: 1rem;"></div>
                <div class="cache-info" id="cacheInfo"></div>
            </div>
            <div class="modal-footer">
                <button class="btn" id="loadBtn">📦 Load</button>
                <button class="btn btn-secondary" id="clearBtn">🗑️ Clear</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY_COLLECTION = 'bgg_versions_collection';
        const STORAGE_KEY_TIMESTAMP = 'bgg_versions_timestamp';

        let allGames = [];
        let gameVersions = {};
        let currentUsername = 'sportomax';

        const usernameInput = document.getElementById('usernameInput');
        const loadBtn = document.getElementById('loadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        const processingStatus = document.getElementById('processingStatus');
        const cacheInfo = document.getElementById('cacheInfo');
        const gamesList = document.getElementById('gamesList');
        const searchInput = document.getElementById('searchInput');
        const settingsModal = document.getElementById('settingsModal');

        // Show modal on load
        function showModal() {
            settingsModal.classList.remove('hidden');
        }

        // Hide modal
        function hideModal() {
            settingsModal.classList.add('hidden');
        }

        // Load button
        loadBtn.addEventListener('click', loadCollection);

        // Close modal button
        modalCloseBtn.addEventListener('click', hideModal);

        // Clear cache
        clearBtn.addEventListener('click', () => {
            localStorage.removeItem(STORAGE_KEY_COLLECTION);
            localStorage.removeItem(STORAGE_KEY_TIMESTAMP);
            processingStatus.textContent = '✅ Cache cleared';
            processingStatus.classList.add('active');
            allGames = [];
            gameVersions = {};
            gamesList.innerHTML = '';
            cacheInfo.textContent = '';
            setTimeout(() => { processingStatus.classList.remove('active'); }, 2000);
        });

        // Search
        searchInput.addEventListener('input', renderGames);

        // Helper functions
        async function fetchWithRetry(url, maxRetries = 3) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    console.log(`📡 [API Call ${i + 1}] GET ${url}`);
                    const response = await fetch(url);
                    if (response.status === 202) {
                        console.log(`⏳ [API] Status 202 - retrying after ${2000 * (i + 1)}ms`);
                        await new Promise(resolve => setTimeout(resolve, 2000 * (i + 1)));
                        continue;
                    }
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    console.log(`✅ [API] Response received`);
                    return response;
                } catch (error) {
                    console.error(`❌ [API] Error on attempt ${i + 1}:`, error.message);
                    if (i === maxRetries - 1) throw error;
                    await new Promise(resolve => setTimeout(resolve, 1000 * (i + 1)));
                }
            }
        }

        // Load collection
        async function loadCollection() {
            const username = usernameInput.value.trim();
            if (!username) {
                processingStatus.textContent = '❌ Please enter a username';
                processingStatus.classList.add('active');
                return;
            }

            currentUsername = username;
            localStorage.setItem('bgg_versions_username', username);

            processingStatus.classList.add('active');
            processingStatus.textContent = '📦 Loading collection...';
            console.log('🔍 Fetching collection for:', username);

            try {
                // Check cache
                const cached = localStorage.getItem(STORAGE_KEY_COLLECTION);
                if (cached) {
                    allGames = JSON.parse(cached);
                    processingStatus.textContent = `✅ Loaded ${allGames.length} games. Fetching version data...`;
                    console.log('✅ Loaded collection:', allGames.length, 'games');
                    updateCacheInfo();
                    // Still fetch version data fresh
                    await processGameBatches();
                    hideModal();
                    // Fetch collection
                    const url = `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1`;
                    console.log('🔗 API URL:', url);
                    
                    const response = await fetchWithRetry(url);
                    const xml = new DOMParser().parseFromString(await response.text(), 'text/xml');
                    const items = xml.querySelectorAll('item');

                    allGames = Array.from(items).map(item => ({
                        id: item.getAttribute('objectid'),
                        name: item.querySelector('name')?.textContent || 'Unknown',
                        image: item.querySelector('image')?.textContent || ''
                    })).filter(g => g.id);

                    console.log('📦 Collection fetched:', allGames.length, 'games');
                    localStorage.setItem(STORAGE_KEY_COLLECTION, JSON.stringify(allGames));
                    processingStatus.textContent = `✅ Loaded ${allGames.length} games`;
                    updateCacheInfo();

                    // Process games in batches
                    await processGameBatches();
                    hideModal();
                }

            } catch (error) {
                processingStatus.textContent = `❌ Error: ${error.message}`;
                console.error('❌ Error:', error);
            }
        }

        // Process games in batches
        async function processGameBatches() {
            const batchSize = 20;
            let processed = 0;
            gameVersions = {};

            for (let i = 0; i < allGames.length; i += batchSize) {
                const batch = allGames.slice(i, i + batchSize);
                const ids = batch.map(g => g.id).join(',');

                try {
                    processingStatus.textContent = `📐 Processing ${Math.min(processed + batch.length, allGames.length)}/${allGames.length} games...`;
                    console.log(`\n🔄 Batch ${Math.ceil((i + 1) / batchSize)}/${Math.ceil(allGames.length / batchSize)}: Fetching ${batch.length} games (IDs: ${ids})`);

                    const url = `/api/bgg-helper?endpoint=thing&id=${ids}&type=boardgame&versions=1`;
                    const response = await fetchWithRetry(url);
                    const xml = new DOMParser().parseFromString(await response.text(), 'text/xml');
                    const items = xml.querySelectorAll('item[type="boardgameversion"]');

                    const versionsByGame = {};
                    Array.from(items).forEach(item => {
                        const gameLink = item.querySelector('link[type="boardgameversion"][inbound="true"]');
                        if (!gameLink) return;

                        const gameId = gameLink.getAttribute('id');
                        const game = allGames.find(g => g.id === gameId);
                        if (!game) return;

                        if (!versionsByGame[gameId]) {
                            versionsByGame[gameId] = [];
                        }

                        const width = parseFloat(item.querySelector('width')?.getAttribute('value') || 0);
                        const length = parseFloat(item.querySelector('length')?.getAttribute('value') || 0);
                        const depth = parseFloat(item.querySelector('depth')?.getAttribute('value') || 0);
                        const weight = parseFloat(item.querySelector('weight')?.getAttribute('value') || 0);

                        versionsByGame[gameId].push({
                            id: item.getAttribute('id'),
                            name: item.querySelector('name[type="primary"]')?.getAttribute('value') || 'Unknown',
                            year: item.querySelector('yearpublished')?.getAttribute('value') || '',
                            thumbnail: item.querySelector('thumbnail')?.textContent || '',
                            width: width,
                            length: length,
                            depth: depth,
                            weight: weight
                        });
                    });

                    // Calculate stats for each game
                    let batchVersions = 0;
                    Object.entries(versionsByGame).forEach(([gameId, versions]) => {
                        const game = allGames.find(g => g.id === gameId);
                        if (!game) return;

                        const widths = versions.map(v => v.width).filter(w => w > 0);
                        const lengths = versions.map(v => v.length).filter(l => l > 0);
                        const depths = versions.map(v => v.depth).filter(d => d > 0);
                        const weights = versions.map(v => v.weight).filter(w => w > 0);

                        gameVersions[gameId] = {
                            name: game.name,
                            image: game.image,
                            versions: versions,
                            stats: {
                                versionCount: versions.length,
                                width: calculateStats(widths),
                                length: calculateStats(lengths),
                                depth: calculateStats(depths),
                                weight: calculateStats(weights)
                            }
                        };
                        batchVersions++;
                        console.log(`  ✅ ${game.name}: ${versions.length} versions`);
                    });

                    console.log(`📊 Batch result: ${batchVersions}/${batch.length} games had versions\n`);
                    processed += batch.length;
                    renderGames();

                } catch (error) {
                    console.error(`❌ Error processing batch at ${i}:`, error);
                    processingStatus.textContent = `⚠️ Error in batch: ${error.message}`;
                }

                await new Promise(resolve => setTimeout(resolve, 200));
            }

            localStorage.setItem(STORAGE_KEY_TIMESTAMP, new Date().toISOString());

            const resultText = `✅ Done! Found ${Object.keys(gameVersions).length} games with versions`;
            processingStatus.textContent = resultText;
            console.log(resultText);
            hideModal();
            setTimeout(() => { processingStatus.classList.remove('active'); }, 3000);
        }

        // Calculate stats (min, max, avg)
        function calculateStats(values) {
            if (values.length === 0) return null;
            const min = Math.min(...values);
            const max = Math.max(...values);
            const avg = (values.reduce((a, b) => a + b, 0) / values.length).toFixed(2);
            return { min: min.toFixed(2), max: max.toFixed(2), avg: avg, count: values.length };
        }

        // Render games
        function renderGames() {
            const searchTerm = searchInput.value.toLowerCase();

            const games = Object.entries(gameVersions)
                .filter(([gameId, game]) => game.name.toLowerCase().includes(searchTerm))
                .sort((a, b) => a[1].name.localeCompare(b[1].name));

            if (games.length === 0) {
                gamesList.innerHTML = '<div class="no-data">No games with versions found</div>';
                return;
            }

            gamesList.innerHTML = games.map(([gameId, game]) => {
                const stats = game.stats;
                return `
                    <div class="game-card">
                        <div class="game-header">${escapeHtml(game.name)}</div>
                        <div class="game-stats">
                            <div class="stat-box">
                                <div class="stat-label">📦 Versions</div>
                                <div class="stat-value">${stats.versionCount}</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-label">📏 Width (in)</div>
                                <div class="stat-value">${stats.width ? `${stats.width.min}–${stats.width.max}` : 'N/A'}</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-label">📏 Length (in)</div>
                                <div class="stat-value">${stats.length ? `${stats.length.min}–${stats.length.max}` : 'N/A'}</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-label">⚖️ Weight (lb)</div>
                                <div class="stat-value">${stats.weight ? `${stats.weight.min}–${stats.weight.max}` : 'N/A'}</div>
                            </div>
                        </div>
                        <div class="versions-list">
                            ${game.versions.map(v => `
                                <div class="version-item">
                                    ${v.thumbnail ? `<div class="version-thumbnail"><img src="/api/image-proxy?url=${encodeURIComponent(v.thumbnail)}" alt="" onerror="this.style.display='none';"></div>` : ''}
                                    <div class="version-details">
                                        <div class="version-name">${escapeHtml(v.name)}</div>
                                        <div class="version-year">📅 ${v.year || 'Unknown year'}</div>
                                        <div class="version-dimensions">
                                            <div class="dimension">
                                                <div class="dimension-label">W</div>
                                                <div class="dimension-value">${v.width > 0 ? v.width.toFixed(2) + '"' : '—'}</div>
                                            </div>
                                            <div class="dimension">
                                                <div class="dimension-label">L</div>
                                                <div class="dimension-value">${v.length > 0 ? v.length.toFixed(2) + '"' : '—'}</div>
                                            </div>
                                            <div class="dimension">
                                                <div class="dimension-label">D</div>
                                                <div class="dimension-value">${v.depth > 0 ? v.depth.toFixed(2) + '"' : '—'}</div>
                                            </div>
                                            <div class="dimension">
                                                <div class="dimension-label">Wt</div>
                                                <div class="dimension-value">${v.weight > 0 ? v.weight.toFixed(2) + 'lb' : '—'}</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Update cache info
        function updateCacheInfo() {
            // Only show username, not cache info
            cacheInfo.textContent = `👤 Username: ${currentUsername} | 📦 Collection: ${allGames.length} games`;
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize
        window.addEventListener('load', () => {
            const savedUsername = localStorage.getItem('bgg_versions_username');
            if (savedUsername) {
                usernameInput.value = savedUsername;
            }
            updateCacheInfo();
            console.log('📐 Versions app loaded');
            showModal();
        });
    </script>
</body>
</html>
