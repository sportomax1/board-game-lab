<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Priority | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🎯</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        :root {
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
            height: 100dvh;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-dark {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .review-card {
            @apply glass rounded-[3rem] p-8 border-t border-white/20 shadow-2xl relative overflow-hidden flex flex-col items-center max-w-sm w-full;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-rate {
            @apply flex items-center justify-center bg-white/5 border border-white/10 rounded-2xl h-16 text-xl font-black italic transition-all active:scale-90;
        }
        .btn-rate:hover { @apply bg-white/10 border-white/20; }
        .btn-rate.active { @apply bg-blue-500 border-blue-500 text-white shadow-lg shadow-blue-500/20; }

        .flash-success { background-color: #10b981 !important; }
        .flash-warning { background-color: #f59e0b !important; }
        .flash-danger { background-color: #ef4444 !important; }

        .progress-bar {
            height: 4px;
            @apply bg-blue-500/30 rounded-full overflow-hidden;
        }
        .progress-fill {
            height: 100%;
            @apply bg-blue-500 transition-all duration-500;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        .view { display: none; height: 100%; flex-direction: column; }
        .view.active { display: flex; }

        table { border-collapse: separate; border-spacing: 0; }
        th { @apply sticky top-0 bg-slate-900/90 backdrop-blur z-20 text-[8px] font-black uppercase tracking-widest text-slate-500 p-3 border-b border-white/10; }
        td { @apply p-3 border-b border-white/5 text-[10px] text-slate-300; }
        tr:hover td { @apply bg-white/5; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="selection:bg-blue-500/30">
    <!-- Background Decor -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-blue-900/20 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[10%] right-[0%] w-[50%] h-[50%] bg-indigo-900/10 blur-[120px] rounded-full"></div>
    </div>

    <div class="relative z-10 flex flex-col min-h-screen pt-safe">
        <!-- Header -->
        <header class="p-6 flex items-center justify-between border-b border-white/5 bg-slate-900/50 backdrop-blur-md shrink-0">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-blue-500/20 rounded-xl flex items-center justify-center border border-blue-500/30">
                    <i data-lucide="target" class="text-blue-400 w-5 h-5"></i>
                </div>
                <div class="flex flex-col">
                    <h1 class="text-xl font-black italic uppercase tracking-tighter leading-none text-white">Priority <span class="text-blue-400">Evaluator</span></h1>
                    <p id="status-bar" class="text-[8px] font-bold text-slate-500 uppercase tracking-widest mt-1">Want-to-Play Refinement</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="view-list-btn" onclick="showSummary()" class="hidden glass px-4 py-2 rounded-xl border border-white/10 text-[9px] font-black uppercase tracking-widest text-slate-400 hover:text-white transition-all">Report</button>
                <button onclick="location.reload()" class="glass px-4 py-2 rounded-xl border border-white/10 text-[9px] font-black uppercase tracking-widest text-slate-400 hover:text-white transition-all">Reset</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-h-0">
            <!-- Setup View -->
            <div id="view-setup" class="view active items-center justify-center p-6">
                <div class="glass max-w-sm w-full rounded-[2.5rem] p-8 shadow-2xl border-t border-white/20 space-y-8">
                    <div class="text-center space-y-2">
                        <h2 class="text-2xl font-black text-white italic uppercase tracking-tight">Personalize <span class="text-blue-400">Picks</span></h2>
                        <p class="text-slate-400 text-xs font-medium">Refine your BGG 'Want to Play' list</p>
                    </div>

                    <div class="space-y-4">
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">BGG Username</label>
                            <input type="text" id="username" value="sportomax" class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 text-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all font-bold text-sm text-center">
                        </div>
                        
                        <button onclick="start()" class="w-full bg-blue-600 text-white py-5 rounded-3xl font-black text-lg italic uppercase tracking-tighter hover:scale-[1.02] active:scale-95 transition-all shadow-xl shadow-blue-500/20">
                            Start Evaluation
                        </button>
                    </div>
                    
                    <p id="setupStatus" class="text-center text-[10px] font-bold text-slate-500 uppercase tracking-widest h-4"></p>
                </div>
            </div>

            <!-- Loading View -->
            <div id="view-loading" class="view items-center justify-center p-6">
                <div class="flex flex-col items-center gap-6">
                    <div class="relative w-20 h-20">
                        <div class="absolute inset-0 border-4 border-blue-500/20 rounded-full"></div>
                        <div class="absolute inset-0 border-4 border-t-blue-500 rounded-full animate-spin"></div>
                    </div>
                    <div class="text-center">
                        <h2 class="text-xl font-black italic text-white uppercase tracking-widest">Scanning BGG</h2>
                        <p id="loading-text" class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-2">Connecting...</p>
                    </div>
                </div>
            </div>

            <!-- Eval View -->
            <div id="view-eval" class="view items-center justify-center p-4">
                <div id="card" class="review-card">
                    <div class="absolute top-4 left-1/2 -translate-x-1/2 text-[8px] font-black uppercase tracking-[0.3em] text-slate-600 italic" id="progress-label">0 / 0</div>
                    
                    <div class="w-full aspect-square max-w-[200px] rounded-3xl overflow-hidden bg-black/40 border border-white/10 p-2 mb-6 shadow-2xl">
                        <img id="game-img" src="" class="w-full h-full object-contain rounded-2xl">
                    </div>

                    <div class="text-center space-y-1 mb-8">
                        <h2 id="game-name" class="text-xl font-black text-white italic uppercase tracking-tighter leading-tight line-clamp-2"></h2>
                        <p id="game-meta" class="text-[9px] font-bold text-blue-400 uppercase tracking-widest"></p>
                    </div>

                    <div class="grid grid-cols-3 gap-3 w-full">
                        <button class="btn-rate" onclick="rate(5)">5</button>
                        <button class="btn-rate" onclick="rate(6)">6</button>
                        <button class="btn-rate" onclick="rate(7)">7</button>
                        <button class="btn-rate" onclick="rate(8)">8</button>
                        <button class="btn-rate" onclick="rate(9)">9</button>
                        <button class="btn-rate" onclick="rate(10)">10</button>
                    </div>

                    <div class="w-full mt-10 space-y-2">
                        <div class="progress-bar w-full">
                            <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
                        </div>
                        <div id="wish-progress-bar" class="h-1 bg-amber-500/20 rounded-full overflow-hidden w-full">
                            <div id="wish-progress-fill" class="h-full bg-amber-500 transition-all duration-500" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Summary View -->
            <div id="view-summary" class="view p-4 overflow-hidden">
                <div class="glass-dark rounded-[2.5rem] border border-white/10 flex flex-col h-full overflow-hidden">
                    <header class="p-6 border-b border-white/5 flex items-center justify-between shrink-0">
                        <div class="flex flex-col">
                            <h2 class="text-lg font-black italic uppercase text-white tracking-tighter leading-none">Evaluation <span class="text-blue-400">Report</span></h2>
                            <p id="report-meta" class="text-[8px] font-bold text-slate-500 uppercase tracking-widest mt-1"></p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="exportCSV()" class="glass px-4 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest text-slate-400 hover:text-white">Export CSV</button>
                            <button id="resume-btn" onclick="resumeReview()" class="btn-primary px-4 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest text-white">Continue</button>
                        </div>
                    </header>
                    
                    <div class="flex-1 overflow-auto custom-scrollbar">
                        <table class="w-full text-left">
                            <thead>
                                <tr>
                                    <th>Thumb</th>
                                    <th>Game</th>
                                    <th class="text-center">W-Pri</th>
                                    <th class="text-center">Sugg</th>
                                    <th class="text-center">Rate</th>
                                    <th class="text-right">Diff</th>
                                </tr>
                            </thead>
                            <tbody id="summary-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        let games = [];
        let currentIndex = 0;
        let reviewed = [];
        let sortState = { key: 'name', asc: true };
        const IMAGE_PROXY = '/api/image-proxy?url=';

        async function fetchWithRetry(url, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                const response = await fetch(url);
                if (response.status === 202) {
                    await new Promise(r => setTimeout(r, 2000 * (i + 1)));
                    continue;
                }
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.text();
            }
            throw new Error('Exceeded fetch attempts');
        }

        async function start() {
            const u = document.getElementById('username').value.trim() || 'sportomax';
            switchView('loading');
            document.getElementById('loading-text').innerText = `Fetching list for ${u}...`;

            try {
                const xmlText = await fetchWithRetry(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(u)}&stats=1`);
                const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
                const items = Array.from(doc.querySelectorAll('item'));
                
                games = items.filter(it => it.querySelector('status')?.getAttribute('wanttoplay') === '1').map(it => {
                    const st = it.querySelector('status');
                    return {
                        name: it.querySelector('name')?.textContent || 'Unknown',
                        thumbnail: it.querySelector('thumbnail')?.textContent || it.querySelector('image')?.textContent || '',
                        wishlist: st?.getAttribute('wishlist') === '1',
                        wishlistPriority: parseInt(st?.getAttribute('wishlistpriority')) || 0,
                        numplays: parseInt(it.querySelector('numplays')?.textContent) || 0
                    };
                });

                if (games.length === 0) throw new Error("No 'Want to Play' games found");

                // Sort: wishlist first, then shuffle groups
                const wish = games.filter(g => g.wishlist).sort(() => Math.random() - 0.5);
                const others = games.filter(g => !g.wishlist).sort(() => Math.random() - 0.5);
                games = [...wish, ...others];

                currentIndex = 0; reviewed = [];
                document.getElementById('view-list-btn').classList.remove('hidden');
                switchView('eval');
                renderCard();
            } catch (e) {
                switchView('setup');
                document.getElementById('setupStatus').innerText = e.message;
            }
        }

        function renderCard() {
            if (currentIndex >= games.length) return showSummary();
            const g = games[currentIndex];
            
            document.getElementById('game-img').src = `${IMAGE_PROXY}${encodeURIComponent(g.thumbnail)}`;
            document.getElementById('game-name').innerText = g.name;
            document.getElementById('game-meta').innerText = `Priority: ${g.wishlistPriority || 'None'} • Plays: ${g.numplays}`;
            
            const p = Math.round(((currentIndex + 1) / games.length) * 100);
            document.getElementById('progress-fill').style.width = `${p}%`;
            document.getElementById('progress-label').innerText = `GAME ${currentIndex + 1} / ${games.length}`;

            // Wishlist progress
            const wishTotal = games.filter(g => g.wishlist).length;
            const wishDone = reviewed.filter(r => r.wishlist === 'Active').length;
            document.getElementById('wish-progress-fill').style.width = wishTotal ? `${Math.round((wishDone / wishTotal) * 100)}%` : '0%';
        }

        function rate(val) {
            const g = games[currentIndex];
            const suggested = getSuggested(g.wishlistPriority);
            
            reviewed.push({
                ...g,
                wishlist: g.wishlist ? "Active" : "None",
                internalRating: val,
                suggestedRating: suggested,
                diff: val - suggested
            });

            const card = document.getElementById('card');
            const diff = Math.abs(val - suggested);
            const flashClass = diff === 0 ? 'flash-success' : (diff === 1 ? 'flash-warning' : 'flash-danger');
            
            card.classList.add(flashClass);
            setTimeout(() => {
                card.classList.remove('flash-success', 'flash-warning', 'flash-danger');
                currentIndex++;
                renderCard();
            }, 400);
        }

        function getSuggested(wp) {
            if (!wp || wp === 0) return 5;
            const map = {5:6, 4:7, 3:8, 2:9, 1:10};
            return map[wp] || 5;
        }

        function showSummary() {
            switchView('summary');
            document.getElementById('resume-btn').classList.toggle('hidden', currentIndex >= games.length);
            document.getElementById('report-meta').innerText = `${reviewed.length} Reviewed • ${games.length - reviewed.length} Pending`;
            
            const body = document.getElementById('summary-body');
            body.innerHTML = reviewed.map(r => {
                const diffSign = r.diff > 0 ? '+' : '';
                return `
                    <tr class="${r.internalRating >= 8 && r.priority === 0 ? 'bg-amber-500/5' : ''}">
                        <td class="w-12"><img src="${IMAGE_PROXY}${encodeURIComponent(r.thumbnail)}" class="w-10 h-10 object-cover rounded-lg border border-white/5"></td>
                        <td><div class="font-black italic uppercase text-[10px] truncate max-w-[120px]">${r.name}</div></td>
                        <td class="text-center font-mono">${r.wishlistPriority || '—'}</td>
                        <td class="text-center font-mono opacity-50">${r.suggestedRating}</td>
                        <td class="text-center font-black text-blue-400">${r.internalRating}</td>
                        <td class="text-right font-mono ${r.diff > 0 ? 'text-emerald-400' : (r.diff < 0 ? 'text-rose-400' : 'text-slate-600')}">${diffSign}${r.diff}</td>
                    </tr>
                `;
            }).join('');
        }

        function switchView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(`view-${id}`).classList.add('active');
        }

        function resumeReview() { switchView('eval'); }

        function exportCSV() {
            if (reviewed.length === 0) return;
            const headers = ['Name', 'Thumbnail', 'Priority', 'Wishlist', 'Plays', 'Suggested', 'Actual', 'Diff'];
            const rows = reviewed.map(r => [
                r.name, r.thumbnail, r.wishlistPriority, r.wishlist, r.numplays, r.suggestedRating, r.internalRating, r.diff
            ].map(v => `"${String(v).replace(/"/g, '""')}"`).join(','));
            
            const csv = [headers.join(','), ...rows].join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `priority_report_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }
    </script>
    <script type="module" src="analytics-init.js"></script>
</body>
</html>
