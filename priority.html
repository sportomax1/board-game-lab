<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>BGG Priority Evaluator</title>
<style>
  :root {
    --primary: #007aff;
    --bg: #f2f2f7;
    --card-bg: #ffffff;
    --text: #1c1c1e;
    --text-muted: #8e8e93;
    --success: #34c759;
    --warning: #ff9500;
  }

  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* Progress Bar */
  .progress-container {
    height: 6px;
    background: #e5e5ea;
    width: 100%;
    position: fixed;
    top: 0;
    z-index: 1000;
  }
  #progress-bar {
    height: 100%;
    background: var(--primary);
    width: 0%;
    transition: width 0.3s ease;
  }

  header {
    padding: 16px;
    background: var(--card-bg);
    border-bottom: 1px solid #d1d1d6;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }

  h1 { font-size: 18px; margin: 0; }

  /* Screens */
  .screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-y: auto;
  }

  /* Review Card */
  .review-card {
    background: var(--card-bg);
    border-radius: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 400px;
    padding: 24px;
    text-align: center;
    position: relative;
    transition: transform 0.2s, background-color 0.2s;
  }

  .flash-success { background-color: var(--success) !important; color: white !important; transform: scale(1.05); }
  .flash-warning { background-color: #ffcc00 !important; color: #222 !important; transform: scale(1.03); }
  .flash-danger { background-color: #ff3b30 !important; color: white !important; transform: scale(1.03); }

  .review-card { max-height: calc(100vh - 220px); overflow: auto; }

  .game-thumb {
    width: 200px;
    height: 200px;
    object-fit: contain;
    margin-bottom: 16px;
    border-radius: 12px;
    background: #f8f8f8;
  }

  .game-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .wishlist-info { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; }

  /* Rating Buttons */
  .rating-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    width: 100%;
  }

  .btn-rate {
    background: #e9e9eb;
    border: none;
    padding: 18px;
    border-radius: 16px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.1s;
  }

  .btn-rate:active { background: var(--primary); color: white; }

  /* Table View */
  .report-container { width: 100%; max-width: 800px; margin: 0 auto; }
  table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; margin-top: 10px; font-size: 14px; }
  th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
  th { background: #f8f8f8; color: var(--text-muted); text-transform: uppercase; font-size: 11px; }

  .status-pill { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
  .priority-1 { background: #ff3b30; color: white; }
  .no-wish { background: #8e8e93; color: white; }

  .hidden { display: none !important; }

  .loader {
    border: 4px solid #f3f3f3;
    border-top: 4px solid var(--primary);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
  }

  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  .action-bar { margin-top: 20px; display: flex; gap: 10px; }
  .btn-action { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>

<div class="progress-container">
  <div id="wish-progress-bar" style="height:3px;background:#ffcc00;width:0%"></div>
  <div id="progress-bar"></div>
</div>

<header id="main-header">
  <div style="display:flex;gap:12px;align-items:center;width:100%;justify-content:space-between">
    <div style="display:flex;gap:12px;align-items:center">
      <h1 id="header-title">Priority Evaluator</h1>
      <input id="username" placeholder="BGG username" style="padding:8px;border-radius:8px;border:1px solid #ddd;width:160px" value="sportomax" />
      <button id="start-btn" class="btn-action" onclick="start()">Start</button>
    </div>
    <button id="view-list-btn" class="btn-action hidden" onclick="showSummary()">View Review List</button>
  </div>
</header>

<!-- Floating summary button shown during review when header is hidden -->
<button id="floating-summary-btn" class="btn-action hidden" style="position:fixed;right:16px;top:16px;z-index:1200;padding:8px 12px;">View Review List</button>

<!-- Loading Screen (hidden until Start) -->
<div id="loading-screen" class="screen hidden">
  <div class="loader"></div>
  <p id="status-text">Fetching Want-to-Play games...</p>
</div>

<!-- Evaluation Screen -->
<div id="eval-screen" class="screen hidden">
  <div id="card" class="review-card">
    <img id="game-img" class="game-thumb" src="" alt="Game Image">
    <div id="game-name" class="game-title">Game Title</div>
    <div id="game-meta" class="wishlist-info">Wishlist: No | Priority: 0</div>
    <div style="display:flex;gap:8px;align-items:center;justify-content:center;margin-top:8px">
      <div id="progress-label" class="wishlist-info">0 / 0</div>
      <button id="pause-btn" class="btn-action" style="padding:6px 10px;font-size:13px" onclick="pauseReview()">Pause</button>
      <button id="resume-global-btn" class="btn-action hidden" style="padding:6px 10px;font-size:13px" onclick="resumeReview()">Resume</button>
    </div>
    
    <div class="rating-grid">
      <button class="btn-rate" onclick="rate(5)">5</button>
      <button class="btn-rate" onclick="rate(6)">6</button>
      <button class="btn-rate" onclick="rate(7)">7</button>
      <button class="btn-rate" onclick="rate(8)">8</button>
      <button class="btn-rate" onclick="rate(9)">9</button>
      <button class="btn-rate" onclick="rate(10)">10</button>
    </div>
  </div>
</div>

<!-- Summary/Table Screen -->
<div id="summary-screen" class="screen hidden">
  <div class="report-container">
    <div style="display:flex; justify-content: space-between; align-items: center;">
      <h3>Review Summary</h3>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn-action" onclick="resumeReview()" id="resume-btn">Continue Rating</button>
        <button class="btn-action" onclick="exportCSV()">Export CSV</button>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th style="width:60px">Thumb</th>
          <th onclick="setSort('name')" style="cursor:pointer">Game</th>
          <th onclick="setSort('priority')" style="cursor:pointer">W-Priority</th>
          <th onclick="setSort('wishlist')" style="cursor:pointer">W-Status</th>
          <th onclick="setSort('suggestedRating')" style="cursor:pointer">Suggested</th>
          <th onclick="setSort('internalRating')" style="cursor:pointer">Internal Rate</th>
          <th onclick="setSort('diff')" style="cursor:pointer">Diff</th>
        </tr>
      </thead>
      <tbody id="summary-body"></tbody>
    </table>
  </div>
</div>

<script>
  let games = [];
  let currentIndex = 0;
  let reviewed = [];
  let sortState = { key: 'name', asc: true };

  // Start triggered by UI button; reads username input and loads collection
  async function start(){
    const u = (document.getElementById('username').value || '').trim();
    if(!u){ document.getElementById('status-text').innerText = 'Please enter a username'; return; }
    document.getElementById('status-text').innerText = `Fetching Want-to-Play games for ${u}...`;
    document.getElementById('loading-screen').classList.remove('hidden');
    document.getElementById('eval-screen').classList.add('hidden');
    try{
      const doc = await fetchCollection(u);
      // Only return games with wanttoplay=1 from parsing
      const allGames = parseCollection(doc, true);
      games = allGames; // already filtered to want-to-play items
      // Put wishlist items first, then non-wishlist; shuffle within each group
      const wish = games.filter(g => g.wishlist);
      const noWish = games.filter(g => !g.wishlist);
      shuffleArray(wish);
      shuffleArray(noWish);
      games = [...wish, ...noWish];
      if (games.length === 0) {
        document.getElementById('status-text').innerText = "No 'Want to Play' games found for this user.";
        return;
      }
      // Hide the top header (only used at start) and show floating summary button
      document.getElementById('main-header').style.display = 'none';
      document.getElementById('floating-summary-btn').classList.remove('hidden');
      document.getElementById('loading-screen').classList.add('hidden');
      document.getElementById('eval-screen').classList.remove('hidden');
      document.getElementById('view-list-btn').classList.remove('hidden');
      currentIndex = 0; reviewed = [];
      renderCard();
    }catch(e){
      document.getElementById('status-text').innerText = 'Error loading collection. '+(e.message||'');
    }
  }

  // Fetch collection using local api helper (returns XML) with retry logic
  async function fetchCollection(username){
    if(!username) throw new Error('No username provided');
    const url = `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&stats=1`;
    
    // Retry logic with exponential backoff
    let processing202Count = 0;
    for (let attempt = 0; attempt < 5; attempt++) {
      try {
        const r = await fetch(url);
        
        // Handle 202 (accepted, processing) - use consistent exponential backoff
        if (r.status === 202) {
          processing202Count++;
          await wait(1000 * Math.pow(2, attempt)); // Same exponential backoff as errors
          continue;
        }
        
        if (!r.ok) throw new Error('BGG helper error: ' + r.status);
        
        const txt = await r.text();
        return new DOMParser().parseFromString(txt, 'text/xml');
      } catch (e) {
        if (attempt === 4) {
          // Provide more accurate error message - check if all attempts returned 202
          if (processing202Count >= 5) {
            throw new Error('Collection still processing after multiple attempts. Please try again in a moment.');
          }
          throw e; // Last attempt, throw error
        }
        await wait(1000 * Math.pow(2, attempt)); // Exponential backoff
      }
    }
    
    throw new Error('Failed to fetch collection after 5 attempts');
  }
  
  // Helper function to wait
  function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  // Parse BGG collection XML into a lightweight JS object array
  function parseCollection(doc, wantOnly = false){
    const items = Array.from(doc.querySelectorAll('item'));
    const out = [];
    for(const it of items){
      const st = it.querySelector('status');
      const wanttoplay = st ? (st.getAttribute('wanttoplay') === '1') : false;
      if(wantOnly && !wanttoplay) continue;
      const name = it.querySelector('name')?.textContent || 'Unknown';
      const thumb = it.querySelector('thumbnail')?.textContent || it.querySelector('image')?.textContent || '';
      const wishlist = st ? (st.getAttribute('wishlist') === '1') : false;
      const wishlistpriority = (st && st.getAttribute('wishlist')==='1') ? (parseInt(st.getAttribute('wishlistpriority'))||0) : 0;
      const numplays = parseInt(it.querySelector('numplays')?.textContent || '0') || 0;
      out.push({ name, thumbnail: thumb, wanttoplay, wishlist, wishlistPriority: wishlistpriority, numplays });
    }
    return out;
  }

  // Summary rendering with sorting
  function setSort(key){
    if(sortState.key === key) sortState.asc = !sortState.asc; else { sortState.key = key; sortState.asc = true; }
    renderSummaryTable();
  }

  function renderSummaryTable(){
    const body = document.getElementById('summary-body');
    const list = [...reviewed];
    const k = sortState.key;
    list.sort((a,b)=>{
      let va = a[k], vb = b[k];
      if(typeof va === 'string') va = va.toLowerCase();
      if(typeof vb === 'string') vb = vb.toLowerCase();
      if(va < vb) return sortState.asc ? -1 : 1;
      if(va > vb) return sortState.asc ? 1 : -1;
      return 0;
    });
    body.innerHTML = list.map(r => {
      const isMismatch = (r.internalRating >= 8 && r.priority === 0);
      const diffSign = (r.diff > 0) ? '+' : '';
      return `
        <tr style="${isMismatch ? 'background: #fffbe6;' : ''}">
          <td><img src="${r.thumbnail||'https://via.placeholder.com/48'}" style="width:48px;height:48px;object-fit:cover;border-radius:6px"/></td>
          <td><strong>${r.name}</strong> ${isMismatch ? '⚠️' : ''}</td>
          <td><span class="status-pill ${r.priority === 1 ? 'priority-1' : 'no-wish'}">${r.priority || 'None'}</span></td>
          <td>${r.wishlist}</td>
          <td style="text-align:center">${r.suggestedRating}</td>
          <td style="font-weight:bold; color:var(--primary); text-align:center">${r.internalRating}</td>
          <td style="text-align:center">${diffSign}${r.diff}</td>
        </tr>
      `;
    }).join('');
  }

  // Fisher-Yates shuffle
  function shuffleArray(arr){
    for(let i = arr.length -1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  // Map wishlist priority to suggested internal rating
  function wishlistToSuggestedRating(wp){
    // none(0) => 5, 5=>6,4=>7,3=>8,2=>9,1=>10
    if(!wp || wp === 0) return 5;
    const map = {5:6,4:7,3:8,2:9,1:10};
    return map[wp] || 5;
  }

  function renderCard() {
    if (currentIndex >= games.length) {
      showSummary();
      return;
    }

    const g = games[currentIndex];
    document.getElementById('game-img').src = g.thumbnail || 'https://via.placeholder.com/200';
    document.getElementById('game-name').innerText = g.name;
    
    // wishlistPriority logic: 0 if missing or false
    const wp = g.wishlistPriority || 0;
    const isW = g.wishlist ? "Yes" : "No";
    document.getElementById('game-meta').innerText = `Wishlist: ${isW} | BGG Priority: ${wp}`;
    // Update progress bar and label
    const percent = games.length ? (((currentIndex+1) / games.length) * 100) : 0;
    document.getElementById('progress-bar').style.width = percent + "%";
    document.getElementById('progress-label').innerText = `${currentIndex+1} / ${games.length} (Suggested: ${wishlistToSuggestedRating(wp)})`;
    // Wishlist progress
    const wishTotal = games.filter(g=>g.wishlist).length;
    const wishDone = reviewed.filter(r=>r.wishlist === 'Active').length;
    const wishPercent = wishTotal ? Math.round((wishDone / wishTotal) * 100) : 0;
    document.getElementById('wish-progress-bar').style.width = wishPercent + "%";
    // update small text indicator for wishlist progress
    const wishText = wishTotal ? `Wishlist: ${wishDone} / ${wishTotal}` : `Wishlist: 0 / 0`;
    document.getElementById('progress-label').setAttribute('data-wish', wishText);
  }

  function rate(val) {
    const g = games[currentIndex];
    const card = document.getElementById('card');
    
    // Record review
    const suggested = wishlistToSuggestedRating(g.wishlistPriority || 0);
    reviewed.push({
      name: g.name,
      thumbnail: g.thumbnail,
      priority: g.wishlistPriority || 0,
      wishlist: g.wishlist ? "Active" : "None",
      numplays: g.numplays || 0,
      internalRating: val,
      suggestedRating: suggested,
      diff: val - suggested
    });

    // Flash effect based on diff
    const d = Math.abs(val - suggested);
    if (d === 0) {
      card.classList.add('flash-success');
    } else if (d === 1) {
      card.classList.add('flash-warning');
    } else {
      card.classList.add('flash-danger');
    }

    setTimeout(() => {
      card.classList.remove('flash-success');
      card.classList.remove('flash-warning');
      card.classList.remove('flash-danger');
      currentIndex++;
      renderCard();
    }, 450);
  }

  function pauseReview(){
    document.getElementById('eval-screen').classList.add('hidden');
    document.getElementById('loading-screen').classList.remove('hidden');
    document.getElementById('status-text').innerText = 'Review paused — click Resume to continue';
    document.getElementById('resume-global-btn').classList.remove('hidden');
  }

  function showSummary() {
    document.getElementById('eval-screen').classList.add('hidden');
    document.getElementById('summary-screen').classList.remove('hidden');
    document.getElementById('resume-btn').classList.toggle('hidden', currentIndex >= games.length);
    renderSummaryTable();
    // hide global resume button when viewing summary
    document.getElementById('resume-global-btn')?.classList.add('hidden');
  }

  function resumeReview() {
    document.getElementById('summary-screen').classList.add('hidden');
    document.getElementById('loading-screen').classList.add('hidden');
    document.getElementById('eval-screen').classList.remove('hidden');
    // hide resume button once resumed
    document.getElementById('resume-global-btn')?.classList.add('hidden');
  }
  
  // Floating summary button handler
  document.getElementById('floating-summary-btn').addEventListener('click', ()=>{
    showSummary();
  });

  // Export reviewed results as CSV
  function exportCSV(){
    if(reviewed.length === 0){ alert('No reviewed items to export'); return; }
    const headers = ['name','thumbnail','priority','wishlist','numplays','suggestedRating','internalRating','diff'];
    const rows = reviewed.map(r => headers.map(h => {
      const v = r[h] !== undefined ? r[h] : '';
      return `"${String(v).replace(/"/g,'""')}"`;
    }).join(','));
    const csv = [headers.join(','), ...rows].join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `priority_review_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }
  // Do not auto-load on window load; user must press Start
</script>

</body>
</html>
