<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleeve Manager</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🧦</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Setup Screen -->
    <div id="setupScreen" class="fixed inset-0 bg-gradient-to-br from-purple-600 to-indigo-700 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-2xl p-8 max-w-md w-full">
            <h1 class="text-3xl font-bold text-gray-900 mb-2 text-center">🃏 Sleeve Manager</h1>
            <p class="text-gray-500 text-center mb-6">Track sleeve requirements for your collection</p>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">BGG Username</label>
                <input type="text" id="usernameInput" class="w-full border rounded-lg px-4 py-3 text-lg focus:ring-2 focus:ring-purple-500 outline-none" placeholder="BGG Username" value="sportomax">
            </div>
            
            <button onclick="loadCollection()" class="w-full bg-purple-600 text-white py-3 rounded-lg font-bold text-lg hover:bg-purple-700 transition shadow-lg">
                Load Collection
            </button>
        </div>
    </div>

    <!-- Loading Screen -->
    <div id="loadingScreen" class="fixed inset-0 bg-white z-40 flex flex-col items-center justify-center hidden">
        <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-purple-600 mb-4"></div>
        <h2 class="text-xl font-bold text-gray-800">Loading Collection...</h2>
    </div>

    <!-- Main App -->
    <div id="app" class="hidden">
        <header class="bg-white shadow-sm sticky top-0 z-30">
            <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
                <h1 class="font-bold text-xl text-gray-900">🃏 Sleeve Manager</h1>
                <div class="text-sm text-gray-500" id="statsDisplay"></div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-6">
            <div class="mb-6 flex gap-2">
                <input type="text" id="searchInput" placeholder="Search games..." class="flex-1 border rounded-lg px-4 py-3 focus:ring-2 focus:ring-purple-500 outline-none" onkeyup="filterGames()">
                <select id="filterSelect" onchange="filterGames()" class="border rounded-lg px-4 py-3 focus:ring-2 focus:ring-purple-500 outline-none bg-white">
                    <option value="all">All Games</option>
                    <option value="missing">Missing Info</option>
                    <option value="tracked">Tracked</option>
                </select>
            </div>

            <div id="gameList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Games inserted here -->
            </div>
        </main>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-6">
            <h2 id="modalTitle" class="text-xl font-bold text-gray-900 mb-4">Edit Sleeves</h2>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Sleeve Notes</label>
                <textarea id="sleeveNotes" rows="4" class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-purple-500 outline-none" placeholder="e.g. 100 Standard (63.5x88), 20 Mini Euro"></textarea>
                <p class="text-xs text-gray-500 mt-1">Enter sizes and counts manually.</p>
            </div>

            <div class="flex gap-3">
                <button onclick="closeModal()" class="flex-1 py-2 text-gray-600 font-bold hover:bg-gray-100 rounded-lg">Cancel</button>
                <button onclick="saveSleeveInfo()" class="flex-1 py-2 bg-purple-600 text-white font-bold rounded-lg hover:bg-purple-700">Save</button>
            </div>
        </div>
    </div>

    <script>
        let allGames = [];
        let sleeveData = {};
        let activeGameId = null;

        // Load saved sleeve data
        const saved = localStorage.getItem('sleeve_manager_data');
        if (saved) sleeveData = JSON.parse(saved);

        async function loadCollection() {
            const username = document.getElementById('usernameInput').value;
            if (!username) return;

            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('loadingScreen').classList.remove('hidden');

            try {
                const response = await fetch(`/api/bgg-helper?endpoint=collection&username=${username}&own=1`);
                const text = await response.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, 'text/xml');
                
                allGames = Array.from(xml.querySelectorAll('item')).map(item => ({
                    id: item.getAttribute('objectid'),
                    name: item.querySelector('name').textContent,
                    image: item.querySelector('thumbnail')?.textContent || '',
                    year: item.querySelector('yearpublished')?.textContent || ''
                }));

                allGames.sort((a, b) => a.name.localeCompare(b.name));
                
                renderGames();
                document.getElementById('loadingScreen').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');

            } catch (error) {
                alert('Error: ' + error.message);
                location.reload();
            }
        }

        function renderGames() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filter = document.getElementById('filterSelect').value;
            
            const filtered = allGames.filter(g => {
                const matchesSearch = g.name.toLowerCase().includes(term);
                const hasInfo = !!sleeveData[g.id];
                
                if (filter === 'missing' && hasInfo) return false;
                if (filter === 'tracked' && !hasInfo) return false;
                
                return matchesSearch;
            });

            const container = document.getElementById('gameList');
            container.innerHTML = filtered.map(game => {
                const info = sleeveData[game.id];
                return `
                <div class="bg-white p-4 rounded-lg shadow border border-gray-200 flex gap-4">
                    <div class="w-16 h-16 bg-gray-100 rounded flex-shrink-0 overflow-hidden">
                        ${game.image ? `<img src="${game.image}" class="w-full h-full object-cover">` : ''}
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-gray-900 truncate pr-2">${game.name}</h3>
                            <button onclick="editSleeves('${game.id}')" class="text-purple-600 hover:text-purple-800 text-sm font-medium">Edit</button>
                        </div>
                        <div class="mt-1 text-sm ${info ? 'text-gray-700' : 'text-red-400 italic'}">
                            ${info || 'No sleeve info recorded'}
                        </div>
                    </div>
                </div>
            `}).join('');

            // Update stats
            const trackedCount = Object.keys(sleeveData).filter(id => allGames.some(g => g.id === id)).length;
            document.getElementById('statsDisplay').textContent = `${trackedCount} / ${allGames.length} Tracked`;
        }

        function filterGames() {
            renderGames();
        }

        function editSleeves(id) {
            activeGameId = id;
            const game = allGames.find(g => g.id === id);
            document.getElementById('modalTitle').textContent = game.name;
            document.getElementById('sleeveNotes').value = sleeveData[id] || '';
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('editModal').classList.add('hidden');
            activeGameId = null;
        }

        function saveSleeveInfo() {
            if (!activeGameId) return;
            const notes = document.getElementById('sleeveNotes').value.trim();
            
            if (notes) {
                sleeveData[activeGameId] = notes;
            } else {
                delete sleeveData[activeGameId];
            }
            
            localStorage.setItem('sleeve_manager_data', JSON.stringify(sleeveData));
            renderGames();
            closeModal();
        }
    </script>
    <!-- Vercel Web Analytics -->
    <script type="module" src="analytics-init.js"></script>

</body>
</html>
