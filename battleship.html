<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>BGG Battleship</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🚢</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0c2461 0%, #1e3799 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow-x: hidden;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 700px;
        }

        .screen.active {
            display: block;
        }

        .setup-card, .game-card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2rem;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #1e3799;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #0c2461 0%, #1e3799 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(12, 36, 97, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(12, 36, 97, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .game-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .status {
            font-size: 1.1rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .ships-remaining {
            font-size: 0.9rem;
            color: #7f8c8d;
        }

        .board-container {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 6px;
            max-width: 560px;
            width: 100%;
            aspect-ratio: 1;
        }

        .cell {
            aspect-ratio: 1;
            background: #e3f2fd;
            border: 2px solid #90caf9;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .cell:hover:not(.hit):not(.miss):not(.ship-visible) {
            background: #bbdefb;
        }

        .cell.ship-visible {
            background: #ffd54f;
            border-color: #ffb300;
        }

        .cell.ship-visible img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 2px;
        }

        .cell.hit {
            background: #e74c3c;
            border-color: #c0392b;
            cursor: default;
        }

        .cell.hit::after {
            content: '💥';
            font-size: 1.5rem;
        }

        .cell.miss {
            background: #95a5a6;
            border-color: #7f8c8d;
            cursor: default;
        }

        .cell.miss::after {
            content: '○';
            font-size: 1rem;
            color: white;
        }

        .ships-display {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .ship-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .ship-item.sunk {
            opacity: 0.5;
            text-decoration: line-through;
        }

        .ship-thumbnail {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            object-fit: cover;
        }

        .game-controls {
            display: flex;
            gap: 0.5rem;
        }

        .game-controls button {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .game-controls button:active {
            transform: scale(0.95);
        }

        .new-game-btn {
            background: #2ecc71;
            color: white;
        }

        .settings-btn {
            background: #95a5a6;
            color: white;
        }

        .winner-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .winner-modal.active {
            display: flex;
        }

        .winner-content {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            max-width: 400px;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .winner-title {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #2c3e50;
        }

        .stats {
            margin: 1rem 0;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <!-- Setup Screen -->
    <div id="setupScreen" class="screen active">
        <div class="setup-card">
            <h1>🚢 Battleship</h1>
            <p class="subtitle">Hunt ships using BGG collection thumbnails!</p>
            
            <div class="form-group">
                <label for="gameMode">Game Mode</label>
                <select id="gameMode" onchange="updateGameModeFields()">
                    <option value="solo">Solo (vs Computer)</option>
                    <option value="passplay">Pass & Play (2 Players)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="username">BGG Username</label>
                <input type="text" id="username" value="sportomax" placeholder="Enter username">
            </div>

            <div class="form-group" id="username2Group" style="display:none;">
                <label for="username2">Player 2 BGG Username</label>
                <input type="text" id="username2" value="sportomax" placeholder="Enter username">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="includeExpansions">
                <label for="includeExpansions" style="margin: 0;">Include expansions</label>
            </div>

            <div style="margin-top: 1.5rem;">
                <button class="btn" onclick="startGame()">Start Game</button>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="screen">
        <div class="game-card">
            <div class="game-header">
                <h1>🚢 Battleship</h1>
                <div class="status" id="status">Click a cell to attack!</div>
                <div class="ships-remaining" id="shipsRemaining">Ships remaining: 5</div>
            </div>

            <div class="ships-display" id="shipsDisplay"></div>

            <div class="board-container">
                <div class="board" id="board"></div>
            </div>

            <div class="game-controls">
                <button class="new-game-btn" onclick="newGame()">New Game</button>
                <button class="settings-btn" onclick="backToSettings()">Settings</button>
            </div>
        </div>
    </div>

    <!-- Pass and Play Turn Screen -->
    <div id="turnScreen" class="screen">
        <div class="setup-card" style="text-align: center;">
            <h1 id="turnTitle">🚢 Pass Device</h1>
            <p class="subtitle" id="turnSubtitle" style="font-size: 1.2rem; margin-bottom: 2rem;">Get ready, Player 1!</p>
            <div style="margin-top: 2rem;">
                <button class="btn" onclick="continueTurn()">I'm Ready!</button>
            </div>
        </div>
    </div>

    <!-- Winner Modal -->
    <div id="winnerModal" class="winner-modal">
        <div class="winner-content">
            <div class="winner-title" id="winnerText">🎉 Victory!</div>
            <div class="stats" id="statsText"></div>
            <div style="margin-top: 1.5rem;">
                <button class="btn" onclick="newGame()">Play Again</button>
            </div>
        </div>
    </div>

    <script>
        const BOARD_SIZE = 10;
        const SHIPS = [
            { name: 'Carrier', size: 5 },
            { name: 'Battleship', size: 4 },
            { name: 'Cruiser', size: 3 },
            { name: 'Submarine', size: 3 },
            { name: 'Destroyer', size: 2 }
        ];

        let gameMode = 'solo';
        let currentPlayer = 1;
        let player1Games = [];
        let player2Games = [];
        let player1Board = [];
        let player2Board = [];
        let player1Ships = [];
        let player2Ships = [];
        let player1Hits = 0;
        let player1Misses = 0;
        let player2Hits = 0;
        let player2Misses = 0;
        let player1ShipsRemaining = SHIPS.length;
        let player2ShipsRemaining = SHIPS.length;
        
        // Legacy variables for solo mode
        let games = [];
        let board = [];
        let ships = [];
        let hits = 0;
        let misses = 0;
        let shipsRemaining = SHIPS.length;
        let gameActive = false;

        function updateGameModeFields() {
            const mode = document.getElementById('gameMode').value;
            const username2Group = document.getElementById('username2Group');
            if (mode === 'passplay') {
                username2Group.style.display = 'block';
            } else {
                username2Group.style.display = 'none';
            }
        }

        async function startGame() {
            gameMode = document.getElementById('gameMode').value;
            const username = document.getElementById('username').value.trim() || 'sportomax';
            const includeExpansions = document.getElementById('includeExpansions').checked;

            try {
                const subtype = includeExpansions ? '' : '&subtype=boardgame';
                
                if (gameMode === 'passplay') {
                    const username2 = document.getElementById('username2').value.trim() || 'sportomax';
                    
                    const [res1, res2] = await Promise.all([
                        fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1${subtype}&stats=1`),
                        fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username2)}&own=1${subtype}&stats=1`)
                    ]);
                    
                    const [xml1, xml2] = await Promise.all([res1.text(), res2.text()]);
                    const parser = new DOMParser();
                    
                    const doc1 = parser.parseFromString(xml1, 'text/xml');
                    player1Games = Array.from(doc1.querySelectorAll('item')).map(item => ({
                        name: item.querySelector('name').textContent,
                        thumbnail: item.querySelector('thumbnail')?.textContent || ''
                    })).filter(g => g.thumbnail);
                    
                    const doc2 = parser.parseFromString(xml2, 'text/xml');
                    player2Games = Array.from(doc2.querySelectorAll('item')).map(item => ({
                        name: item.querySelector('name').textContent,
                        thumbnail: item.querySelector('thumbnail')?.textContent || ''
                    })).filter(g => g.thumbnail);
                    
                    if (player1Games.length < SHIPS.length || player2Games.length < SHIPS.length) {
                        alert('Not enough games with thumbnails. Please check usernames.');
                        return;
                    }
                    
                    currentPlayer = 1;
                    document.getElementById('setupScreen').classList.remove('active');
                    document.getElementById('turnScreen').classList.add('active');
                    document.getElementById('turnSubtitle').textContent = `Get ready, ${username}!`;
                    newGame();
                } else {
                    const res = await fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1${subtype}&stats=1`);
                    const xml = await res.text();

                    const parser = new DOMParser();
                    const doc = parser.parseFromString(xml, 'text/xml');

                    games = Array.from(doc.querySelectorAll('item')).map(item => ({
                        name: item.querySelector('name').textContent,
                        thumbnail: item.querySelector('thumbnail')?.textContent || ''
                    })).filter(g => g.thumbnail);

                    if (games.length < SHIPS.length) {
                        alert('Not enough games with thumbnails. Please check username.');
                        return;
                    }

                    // Show game screen
                    document.getElementById('setupScreen').classList.remove('active');
                    document.getElementById('gameScreen').classList.add('active');

                    newGame();
                }
            } catch (error) {
                alert('Error loading collection: ' + error.message);
            }
        }

        function continueTurn() {
            document.getElementById('turnScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.add('active');
        }

        function newGame() {
            if (gameMode === 'passplay') {
                // Initialize both player boards
                player1Board = Array(BOARD_SIZE).fill(null).map(() => 
                    Array(BOARD_SIZE).fill(null).map(() => ({ ship: null, hit: false }))
                );
                player2Board = Array(BOARD_SIZE).fill(null).map(() => 
                    Array(BOARD_SIZE).fill(null).map(() => ({ ship: null, hit: false }))
                );
                
                player1Ships = [];
                player2Ships = [];
                player1Hits = 0;
                player1Misses = 0;
                player2Hits = 0;
                player2Misses = 0;
                player1ShipsRemaining = SHIPS.length;
                player2ShipsRemaining = SHIPS.length;
                currentPlayer = 1;
                gameActive = true;
                
                // Place ships for player 1
                const selectedGames1 = [...player1Games].sort(() => Math.random() - 0.5).slice(0, SHIPS.length);
                SHIPS.forEach((shipTemplate, index) => {
                    const game = selectedGames1[index];
                    const ship = {
                        ...shipTemplate,
                        game: game,
                        positions: [],
                        hits: 0,
                        sunk: false
                    };
                    
                    let placed = false;
                    let attempts = 0;
                    while (!placed && attempts < 100) {
                        const horizontal = Math.random() > 0.5;
                        const row = Math.floor(Math.random() * BOARD_SIZE);
                        const col = Math.floor(Math.random() * BOARD_SIZE);
                        
                        if (canPlaceShipOnBoard(player1Board, row, col, ship.size, horizontal)) {
                            placeShipOnBoard(player1Board, row, col, ship.size, horizontal, player1Ships.length);
                            ship.positions = getShipPositions(row, col, ship.size, horizontal);
                            placed = true;
                        }
                        attempts++;
                    }
                    
                    player1Ships.push(ship);
                });
                
                // Place ships for player 2
                const selectedGames2 = [...player2Games].sort(() => Math.random() - 0.5).slice(0, SHIPS.length);
                SHIPS.forEach((shipTemplate, index) => {
                    const game = selectedGames2[index];
                    const ship = {
                        ...shipTemplate,
                        game: game,
                        positions: [],
                        hits: 0,
                        sunk: false
                    };
                    
                    let placed = false;
                    let attempts = 0;
                    while (!placed && attempts < 100) {
                        const horizontal = Math.random() > 0.5;
                        const row = Math.floor(Math.random() * BOARD_SIZE);
                        const col = Math.floor(Math.random() * BOARD_SIZE);
                        
                        if (canPlaceShipOnBoard(player2Board, row, col, ship.size, horizontal)) {
                            placeShipOnBoard(player2Board, row, col, ship.size, horizontal, player2Ships.length);
                            ship.positions = getShipPositions(row, col, ship.size, horizontal);
                            placed = true;
                        }
                        attempts++;
                    }
                    
                    player2Ships.push(ship);
                });
                
                renderBoard();
                renderShipsDisplay();
                updateStatus();
                document.getElementById('winnerModal').classList.remove('active');
            } else {
                // Initialize board
                board = Array(BOARD_SIZE).fill(null).map(() => 
                    Array(BOARD_SIZE).fill(null).map(() => ({ ship: null, hit: false }))
                );

                ships = [];
                hits = 0;
                misses = 0;
                shipsRemaining = SHIPS.length;
                gameActive = true;

                // Select random games for ships
                const selectedGames = [...games].sort(() => Math.random() - 0.5).slice(0, SHIPS.length);

                // Place ships
                SHIPS.forEach((shipTemplate, index) => {
                    const game = selectedGames[index];
                    const ship = {
                        ...shipTemplate,
                        game: game,
                        positions: [],
                        hits: 0,
                        sunk: false
                    };

                    let placed = false;
                    let attempts = 0;
                    while (!placed && attempts < 100) {
                        const horizontal = Math.random() > 0.5;
                        const row = Math.floor(Math.random() * BOARD_SIZE);
                        const col = Math.floor(Math.random() * BOARD_SIZE);

                        if (canPlaceShip(row, col, ship.size, horizontal)) {
                            placeShip(row, col, ship.size, horizontal, ships.length);
                            ship.positions = getShipPositions(row, col, ship.size, horizontal);
                            placed = true;
                        }
                        attempts++;
                    }

                    ships.push(ship);
                });

            // Render board
            renderBoard();
            renderShipsDisplay();
            updateStatus();
            document.getElementById('winnerModal').classList.remove('active');
        }

        function canPlaceShip(row, col, size, horizontal) {
            return canPlaceShipOnBoard(board, row, col, size, horizontal);
        }

        function canPlaceShipOnBoard(boardToCheck, row, col, size, horizontal) {
            if (horizontal) {
                if (col + size > BOARD_SIZE) return false;
                for (let c = col; c < col + size; c++) {
                    if (boardToCheck[row][c].ship !== null) return false;
                }
            } else {
                if (row + size > BOARD_SIZE) return false;
                for (let r = row; r < row + size; r++) {
                    if (boardToCheck[r][col].ship !== null) return false;
                }
            }
            return true;
        }

        function placeShip(row, col, size, horizontal, shipIndex) {
            placeShipOnBoard(board, row, col, size, horizontal, shipIndex);
        }

        function placeShipOnBoard(boardToPlace, row, col, size, horizontal, shipIndex) {
            if (horizontal) {
                for (let c = col; c < col + size; c++) {
                    boardToPlace[row][c].ship = shipIndex;
                }
            } else {
                for (let r = row; r < row + size; r++) {
                    boardToPlace[r][col].ship = shipIndex;
                }
            }
        }

        function getShipPositions(row, col, size, horizontal) {
            const positions = [];
            if (horizontal) {
                for (let c = col; c < col + size; c++) {
                    positions.push({ row, col: c });
                }
            } else {
                for (let r = row; r < row + size; r++) {
                    positions.push({ row: r, col });
                }
            }
            return positions;
        }

        function renderBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            
            const activeBoard = (gameMode === 'passplay') 
                ? (currentPlayer === 1 ? player2Board : player1Board) 
                : board;

            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    
                    // In pass-and-play, show hit/miss status
                    if (gameMode === 'passplay' && activeBoard[row][col].hit) {
                        if (activeBoard[row][col].ship !== null) {
                            cell.classList.add('hit');
                            const targetShips = currentPlayer === 1 ? player2Ships : player1Ships;
                            const ship = targetShips[activeBoard[row][col].ship];
                            const img = document.createElement('img');
                            img.src = ship.game.thumbnail;
                            cell.appendChild(img);
                        } else {
                            cell.classList.add('miss');
                        }
                    }
                    
                    cell.onclick = () => attackCell(row, col);
                    boardElement.appendChild(cell);
                }
            }
        }

        function renderShipsDisplay() {
            const display = document.getElementById('shipsDisplay');
            if (gameMode === 'passplay') {
                const targetShips = currentPlayer === 1 ? player2Ships : player1Ships;
                display.innerHTML = targetShips.map((ship, index) => `
                    <div class="ship-item" id="ship-${index}">
                        <img src="${ship.game.thumbnail}" class="ship-thumbnail" alt="${ship.game.name}">
                        <span>${ship.name}</span>
                    </div>
                `).join('');
            } else {
                display.innerHTML = ships.map((ship, index) => `
                    <div class="ship-item" id="ship-${index}">
                        <img src="${ship.game.thumbnail}" class="ship-thumbnail" alt="${ship.game.name}">
                        <span>${ship.name}</span>
                    </div>
                `).join('');
            }
        }

        function attackCell(row, col) {
            if (!gameActive) return;

            if (gameMode === 'passplay') {
                const targetBoard = currentPlayer === 1 ? player2Board : player1Board;
                const targetShips = currentPlayer === 1 ? player2Ships : player1Ships;
                
                const cell = targetBoard[row][col];
                if (cell.hit) return;

                cell.hit = true;
                const cellElement = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);

                if (cell.ship !== null) {
                    // Hit!
                    if (currentPlayer === 1) player1Hits++;
                    else player2Hits++;
                    
                    const ship = targetShips[cell.ship];
                    ship.hits++;
                    
                    cellElement.classList.add('hit');
                    
                    // Show ship thumbnail on hit
                    const img = document.createElement('img');
                    img.src = ship.game.thumbnail;
                    cellElement.appendChild(img);

                    if (ship.hits === ship.size) {
                        // Ship sunk!
                        ship.sunk = true;
                        if (currentPlayer === 1) player2ShipsRemaining--;
                        else player1ShipsRemaining--;
                        document.getElementById(`ship-${cell.ship}`).classList.add('sunk');
                        
                        // Reveal entire ship
                        ship.positions.forEach(pos => {
                            const posCell = document.querySelector(`[data-row="${pos.row}"][data-col="${pos.col}"]`);
                            posCell.classList.add('ship-visible');
                            if (!posCell.querySelector('img')) {
                                const img = document.createElement('img');
                                img.src = ship.game.thumbnail;
                                posCell.appendChild(img);
                            }
                        });

                        setTimeout(() => {
                            alert(`You sank the ${ship.name}! (${ship.game.name})`);
                            const opponentShipsRemaining = currentPlayer === 1 ? player2ShipsRemaining : player1ShipsRemaining;
                            if (opponentShipsRemaining === 0) {
                                endGame();
                            }
                        }, 300);
                    }
                } else {
                    // Miss
                    if (currentPlayer === 1) player1Misses++;
                    else player2Misses++;
                    cellElement.classList.add('miss');
                }

                updateStatus();
                
                // Switch turns in pass-and-play
                setTimeout(() => {
                    currentPlayer = currentPlayer === 1 ? 2 : 1;
                    document.getElementById('gameScreen').classList.remove('active');
                    document.getElementById('turnScreen').classList.add('active');
                    const username = currentPlayer === 1 
                        ? document.getElementById('username').value.trim() || 'Player 1'
                        : document.getElementById('username2').value.trim() || 'Player 2';
                    document.getElementById('turnSubtitle').textContent = `Get ready, ${username}!`;
                    renderBoard();
                    renderShipsDisplay();
                    updateStatus();
                }, 500);
            } else {
                const cell = board[row][col];
                if (cell.hit) return;

                cell.hit = true;
                const cellElement = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);

                if (cell.ship !== null) {
                    // Hit!
                    hits++;
                    const ship = ships[cell.ship];
                    ship.hits++;
                    
                    cellElement.classList.add('hit');
                    
                    // Show ship thumbnail on hit
                    const img = document.createElement('img');
                    img.src = ship.game.thumbnail;
                    cellElement.appendChild(img);

                    if (ship.hits === ship.size) {
                        // Ship sunk!
                        ship.sunk = true;
                        shipsRemaining--;
                        document.getElementById(`ship-${cell.ship}`).classList.add('sunk');
                        
                        // Reveal entire ship
                        ship.positions.forEach(pos => {
                            const posCell = document.querySelector(`[data-row="${pos.row}"][data-col="${pos.col}"]`);
                            posCell.classList.add('ship-visible');
                            if (!posCell.querySelector('img')) {
                                const img = document.createElement('img');
                                img.src = ship.game.thumbnail;
                                posCell.appendChild(img);
                            }
                        });

                        setTimeout(() => {
                            alert(`You sank the ${ship.name}! (${ship.game.name})`);
                            if (shipsRemaining === 0) {
                                endGame();
                            }
                        }, 300);
                    }
                } else {
                    // Miss
                    misses++;
                    cellElement.classList.add('miss');
                }

                updateStatus();
            }
        }

                    });

                    setTimeout(() => {
                        alert(`You sank the ${ship.name}! (${ship.game.name})`);
                        if (shipsRemaining === 0) {
                            endGame();
                        }
                    }, 300);
                }
            } else {
                // Miss
                misses++;
                cellElement.classList.add('miss');
            }

            updateStatus();
        }

        function updateStatus() {
            if (gameMode === 'passplay') {
                const playerHits = currentPlayer === 1 ? player1Hits : player2Hits;
                const playerMisses = currentPlayer === 1 ? player1Misses : player2Misses;
                const opponentShipsRemaining = currentPlayer === 1 ? player2ShipsRemaining : player1ShipsRemaining;
                const playerName = currentPlayer === 1 
                    ? (document.getElementById('username').value.trim() || 'Player 1')
                    : (document.getElementById('username2').value.trim() || 'Player 2');
                
                document.getElementById('status').textContent = 
                    `${playerName} - Hits: ${playerHits} | Misses: ${playerMisses}`;
                document.getElementById('shipsRemaining').textContent = 
                    `Opponent ships remaining: ${opponentShipsRemaining}`;
            } else {
                document.getElementById('status').textContent = 
                    `Hits: ${hits} | Misses: ${misses}`;
                document.getElementById('shipsRemaining').textContent = 
                    `Ships remaining: ${shipsRemaining}`;
            }
        }

        function endGame() {
            gameActive = false;
            
            if (gameMode === 'passplay') {
                const winner = currentPlayer;
                const winnerName = winner === 1 
                    ? (document.getElementById('username').value.trim() || 'Player 1')
                    : (document.getElementById('username2').value.trim() || 'Player 2');
                const winnerHits = winner === 1 ? player1Hits : player2Hits;
                const winnerMisses = winner === 1 ? player1Misses : player2Misses;
                const totalShots = winnerHits + winnerMisses;
                const accuracy = totalShots > 0 ? ((winnerHits / totalShots) * 100).toFixed(1) : 0;
                
                document.getElementById('winnerText').textContent = `🎉 ${winnerName} Wins!`;
                document.getElementById('statsText').innerHTML = `
                    Total Shots: ${totalShots}<br>
                    Hits: ${winnerHits}<br>
                    Accuracy: ${accuracy}%
                `;
            } else {
                const totalShots = hits + misses;
                const accuracy = ((hits / totalShots) * 100).toFixed(1);
                
                document.getElementById('winnerText').textContent = '🎉 All Ships Destroyed!';
                document.getElementById('statsText').innerHTML = `
                    Total Shots: ${totalShots}<br>
                    Hits: ${hits}<br>
                    Accuracy: ${accuracy}%
                `;
            }
            document.getElementById('winnerModal').classList.add('active');
        }

        function backToSettings() {
            if (confirm('Are you sure you want to go back to settings? Current game will be lost.')) {
                document.getElementById('gameScreen').classList.remove('active');
                document.getElementById('turnScreen').classList.remove('active');
                document.getElementById('setupScreen').classList.add('active');
            }
        }
    </script>
