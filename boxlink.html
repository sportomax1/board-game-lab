<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>BoxLink | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🕵️</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden !important;
        }

        html, body {
            overflow-x: hidden !important;
            max-width: 100vw;
            width: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 50%, #3498db 50%, #2980b9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow-x: hidden !important;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden !important;
        }

        @media (min-width: 800px) {
            .screen {
                max-width: 800px;
            }
        }

        .screen.active {
            display: block;
        }

        .setup-card, .game-card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 2rem;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        input[type="text"], select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #3498db;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }

        .btn-secondary {
            background: #ecf0f1;
            color: #2c3e50;
        }

        .btn-secondary:hover {
            background: #bdc3c7;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .team-info {
            display: flex;
            gap: 1rem;
            flex: 1;
            min-width: 200px;
        }

        .team-score {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            flex: 1;
            text-align: center;
        }

        .team-red {
            background: #e74c3c;
            color: white;
        }

        .team-blue {
            background: #3498db;
            color: white;
        }

        .team-score.active {
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            transform: scale(1.05);
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        @media (max-width: 600px) {
            .game-grid {
                gap: 0.375rem;
            }
        }

        .card {
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: none;
            background: #ecf0f1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: none !important;
            transition: none !important;
        }

        .card.revealed::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            pointer-events: none;
        }

        .card.revealed.red {
            border: 4px solid #e74c3c;
        }

        .card.revealed.blue {
            border: 4px solid #3498db;
        }

        .card.revealed.neutral {
            border: 4px solid #95a5a6;
            opacity: 0.6;
        }

        .card.revealed.assassin {
            border: 4px solid #000;
            opacity: 0.3;
        }

        .spymaster-view {
            margin-top: 1rem;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .spymaster-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.25rem;
            margin-top: 0.5rem;
        }

        .spymaster-card {
            aspect-ratio: 1;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .spymaster-card.red {
            background: #e74c3c;
        }

        .spymaster-card.blue {
            background: #3498db;
        }

        .spymaster-card.neutral {
            background: #95a5a6;
        }

        .spymaster-card.assassin {
            background: #000;
        }

        .game-over {
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .game-over h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .controls {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .controls .btn {
            flex: 1;
            min-width: 120px;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #7f8c8d;
        }

        .error-message {
            background: #e74c3c;
            color: white;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .mode-toggle {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .mode-toggle button {
            flex: 1;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .mode-toggle button.active {
            background: #3498db;
            color: white;
            border-color: #3498db;
        }

        /* Small cheat toggle and turn banner */
        .small-toggle { display:flex; align-items:center; gap:0.5rem; font-weight:600; }
        .small-toggle input[type=checkbox] { width:18px; height:18px; transform:scale(1); }
        .turn-banner { width:100%; border-radius:8px; padding:0.6rem 0.8rem; text-align:center; font-weight:800; color:white; margin-bottom:0.8rem; display:none; }
        .turn-banner.red { background: linear-gradient(90deg,#e74c3c,#c0392b); }
        .turn-banner.blue { background: linear-gradient(90deg,#3498db,#1f78d1); }

        /* Feedback toast */
        #feedbackRoot { position: fixed; left: 50%; transform: translateX(-50%); top: 14%; z-index: 4000; pointer-events:none; }
        .feedback { display:inline-block; padding:10px 14px; border-radius:8px; color:white; font-weight:700; box-shadow:0 8px 24px rgba(0,0,0,0.18); opacity:0; transform:translateY(-8px); transition:all 260ms ease; }
        .feedback.show { opacity:1; transform:translateY(0); }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.5rem;
            }

            .setup-card, .game-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Setup Screen -->
    <div id="setupScreen" class="screen active">
        <div class="setup-card">
            <h1>🕵️ BGG Codenames</h1>
            <p class="subtitle">Find your team's agents using board game thumbnails</p>

            <div class="form-group">
                <label for="usernameInput">BGG Username</label>
                <input type="text" id="usernameInput" placeholder="Enter your BGG username" autocomplete="off">
            </div>

            <div class="form-group">
                <label>Game Mode</label>
                <div class="mode-toggle">
                    <button type="button" class="mode-btn active" data-mode="spymaster">Spymaster Mode</button>
                    <button type="button" class="mode-btn" data-mode="player">Player Mode</button>
                </div>
                <p style="font-size: 0.85rem; color: #7f8c8d; margin-top: 0.5rem;">
                    Spymaster: See the key. Player: Guess based on clues.
                </p>
            </div>

            <button class="btn btn-primary" onclick="startGame()">Start Game</button>
            <button class="btn btn-secondary" onclick="window.location.href='home.html'">Back to Home</button>

            <div id="errorMessage" class="error-message" style="display: none;"></div>
            <div id="loadingMessage" class="loading" style="display: none;">
                Loading your collection...
            </div>
        </div>
    </div>

    <!-- Confirm Games Screen -->
    <div id="confirmScreen" class="screen">
        <div class="setup-card">
            <h1>🕵️ Confirm Games</h1>
            <p class="subtitle">These games will be used in your Codenames session</p>
            
            <div style="max-height: 400px; overflow-y: auto; margin-bottom: 1rem;">
                <div id="gamesList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 0.5rem;">
                    <!-- Game thumbnails will be inserted here -->
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" onclick="confirmGames()">Confirm & Play</button>
                <button class="btn btn-secondary" onclick="changeGames()">Change Games</button>
                <button class="btn btn-secondary" onclick="replaceAllGames()">Replace All</button>
                <button class="btn btn-secondary" onclick="backToSetup()">Back to Setup</button>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="screen">
        <div class="game-card">
            <h1>🕵️ Codenames</h1>
            
            <div id="gameOverMessage" style="display: none;"></div>

            <div id="currentTurnBanner" class="turn-banner red">🔴 Red Team — Turn</div>

            <div class="game-info">
                <div class="team-info">
                    <div class="team-score team-red" id="redScore">
                        <div>🔴 Red Team</div>
                        <div id="redCount">9</div>
                    </div>
                    <div class="team-score team-blue" id="blueScore">
                        <div>🔵 Blue Team</div>
                        <div id="blueCount">8</div>
                    </div>
                </div>
                <div style="min-width:160px; display:flex;align-items:center;justify-content:flex-end;gap:0.5rem">
                    <label class="small-toggle" title="Show/hide spymaster key">
                        <input id="cheatToggle" type="checkbox" onchange="toggleSpymasterView(this.checked)">
                        <span style="font-size:0.9rem;color:#2c3e50">Show Key</span>
                    </label>
                </div>
            </div>

            <div class="game-grid" id="gameGrid">
                <!-- Cards will be inserted here -->
            </div>

            <div id="spymasterView" class="spymaster-view" style="display: none;">
                <div style="text-align: center; font-weight: 600; margin-bottom: 0.5rem;">
                    🔑 Spymaster Key
                </div>
                <div class="spymaster-grid" id="spymasterGrid">
                    <!-- Key will be inserted here -->
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-secondary" onclick="endTurn()">End Turn</button>
                <button class="btn btn-secondary" onclick="newGame()">New Game</button>
                <button class="btn btn-secondary" onclick="backToSetup()">Setup</button>
            </div>

            <div id="feedbackRoot"></div>
        </div>
    </div>

    <script>
        const IMAGE_PROXY = 'https://images.weserv.nl/?url=';
        let collection = [];
        let gameCards = [];
        let currentTeam = 'red'; // red starts
        let redRemaining = 9;
        let blueRemaining = 8;
        let gameMode = 'spymaster';
        let gameOver = false;
        let selectedGamesForConfirm = [];
        // Turn management and feedback
        let teamTurnCounts = { red: 1, blue: 1 };
        let turnLocked = false; // prevents rapid double actions while feedback animates

        // Mode selection
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                gameMode = this.dataset.mode;
            });
        });

        // BGG API helper with retry logic
        async function fetchBGG(endpoint, params = {}, retries = 5) {
            const queryParams = new URLSearchParams(params).toString();
            const fullUrl = `/api/bgg-helper?endpoint=${endpoint}&${queryParams}`;
            
            try {
                const response = await fetch(fullUrl);

                if (response.status === 202 && retries > 0) {
                    const loadingEl = document.getElementById('loadingMessage');
                    if (loadingEl) {
                        loadingEl.textContent = `BGG is processing... Retrying (${retries} attempts left)`;
                    }
                    await new Promise(resolve => setTimeout(resolve, 3000));
                    return fetchBGG(endpoint, params, retries - 1);
                }

                if (!response.ok) {
                    throw new Error(`BGG API fetch failed: Status ${response.status}`);
                }

                return await response.text();
            } catch (error) {
                throw new Error(`Network/API error: ${error.message}`);
            }
        }

        function parseXML(xmlText) {
            return new DOMParser().parseFromString(xmlText, 'text/xml');
        }

        async function startGame() {
            const username = document.getElementById('usernameInput').value.trim();
            const errorEl = document.getElementById('errorMessage');
            const loadingEl = document.getElementById('loadingMessage');

            errorEl.style.display = 'none';
            
            if (!username) {
                errorEl.textContent = 'Please enter a BGG username';
                errorEl.style.display = 'block';
                return;
            }

            loadingEl.style.display = 'block';
            loadingEl.textContent = 'Loading your collection...';

            try {
                const collectionXMLText = await fetchBGG('collection', { username: username, own: '1' });
                const xml = parseXML(collectionXMLText);

                if (xml.querySelector('errors error')) {
                    throw new Error(xml.querySelector('errors error').textContent);
                }

                const items = xml.querySelectorAll('item');
                
                if (items.length === 0) {
                    throw new Error('No games found in collection');
                }

                collection = Array.from(items).map(item => {
                    const name = item.querySelector('name');
                    const thumbnail = item.querySelector('thumbnail');
                    const objectid = item.getAttribute('objectid');
                    
                    return {
                        id: objectid,
                        name: name ? name.textContent : 'Unknown',
                        thumbnail: thumbnail ? thumbnail.textContent : null,
                    };
                }).filter(game => game.thumbnail);

                if (collection.length < 25) {
                    throw new Error('Need at least 25 games with thumbnails in your collection');
                }

                loadingEl.style.display = 'none';
                localStorage.setItem('codenames_username', username);
                showConfirmScreen();
            } catch (error) {
                loadingEl.style.display = 'none';
                errorEl.textContent = `Error loading collection: ${error.message}`;
                errorEl.style.display = 'block';
            }
        }

        function setCurrentTeam(team) {
            currentTeam = team;
            teamTurnCounts[team] = teamTurnCounts[team] || 1;
            updateScores();
            updateTurnBanner();
        }

        function updateTurnBanner() {
            const banner = document.getElementById('currentTurnBanner');
            if (!banner) return;
            banner.style.display = 'block';
            banner.classList.remove('red','blue');
            banner.classList.add(currentTeam === 'red' ? 'red' : 'blue');
            banner.textContent = `${currentTeam === 'red' ? '🔴 Red' : '🔵 Blue'} Team — Turn ${teamTurnCounts[currentTeam]}`;
        }

        function showConfirmScreen() {
            // Select 25 random games for confirmation
            const shuffled = [...collection].sort(() => Math.random() - 0.5);
            selectedGamesForConfirm = shuffled.slice(0, 25);
            // Display games via render helper
            renderConfirmList();

            // Switch to confirm screen
            document.getElementById('setupScreen').classList.remove('active');
            document.getElementById('confirmScreen').classList.add('active');
        }

        function confirmGames() {
            initializeGame();
            document.getElementById('confirmScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.add('active');
        }

        function changeGames() {
            // Shuffle and select new games
            showConfirmScreen();
        }

        function initializeGame() {
            // Reset game state
            gameOver = false;
            currentTeam = 'red';
            redRemaining = 9;
            blueRemaining = 8;

            // Use the confirmed games
            const selected = selectedGamesForConfirm;

            // Assign roles: 9 red, 8 blue, 7 neutral, 1 assassin
            const roles = [
                ...Array(9).fill('red'),
                ...Array(8).fill('blue'),
                ...Array(7).fill('neutral'),
                'assassin'
            ].sort(() => Math.random() - 0.5);

            gameCards = selected.map((game, idx) => ({
                ...game,
                role: roles[idx],
                revealed: false
            }));

            renderGame();
            updateScores();

            // Show/hide spymaster view based on mode
            if (gameMode === 'spymaster') {
                document.getElementById('spymasterView').style.display = 'block';
            } else {
                document.getElementById('spymasterView').style.display = 'none';
            }
        }

        function renderGame() {
            const gameGrid = document.getElementById('gameGrid');
            const spymasterGrid = document.getElementById('spymasterGrid');

            gameGrid.innerHTML = gameCards.map((card, idx) => `
                <div class="card ${card.revealed ? 'revealed ' + card.role : ''}" onclick="revealCard(${idx})">
                    <img src="${IMAGE_PROXY}${card.thumbnail}" alt="${card.name}" 
                         onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23ecf0f1%22/><text x=%2250%22 y=%2250%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2240%22>🎲</text></svg>'">
                </div>
            `).join('');

            spymasterGrid.innerHTML = gameCards.map(card => {
                const emoji = {
                    'red': '🔴',
                    'blue': '🔵',
                    'neutral': '⚪',
                    'assassin': '💀'
                }[card.role];
                return `<div class="spymaster-card ${card.role}">${emoji}</div>`;
            }).join('');
        }

        function revealCard(index) {
            if (gameOver || gameCards[index].revealed) return;
            if (turnLocked) return;
            turnLocked = true;
            const card = gameCards[index];
            card.revealed = true;

            // correct guess
            if (card.role === currentTeam) {
                if (currentTeam === 'red') redRemaining--; else blueRemaining--;
                renderGame();
                updateScores();
                showFeedback('Correct! Keep guessing', 'green');
                // allow next click after short delay
                setTimeout(()=> { turnLocked = false; }, 450);
            } else if (card.role === 'assassin') {
                // assassin: immediate loss
                renderGame();
                gameOver = true;
                const winner = currentTeam === 'red' ? 'Blue' : 'Red';
                showFeedback('Assassin! Game Over', 'black');
                setTimeout(()=> showGameOver(`${winner} Team Wins! Assassin revealed! 💀`), 600);
            } else {
                // wrong team or neutral
                if (card.role === 'red') redRemaining--; else if (card.role === 'blue') blueRemaining--;
                renderGame();
                updateScores();
                showFeedback('Incorrect — turn passes', 'crimson');
                // after a short delay, switch teams
                setTimeout(()=>{
                    teamTurnCounts[currentTeam] = (teamTurnCounts[currentTeam] || 1) + 1;
                    endTurn();
                    turnLocked = false;
                }, 700);
            }

            // Check for win
            if (!gameOver) {
                if (redRemaining === 0) { gameOver = true; showGameOver('🔴 Red Team Wins! 🎉'); }
                else if (blueRemaining === 0) { gameOver = true; showGameOver('🔵 Blue Team Wins! 🎉'); }
            }
        }

        function updateScores() {
            document.getElementById('redCount').textContent = redRemaining;
            document.getElementById('blueCount').textContent = blueRemaining;

            const redScore = document.getElementById('redScore');
            const blueScore = document.getElementById('blueScore');
            
            redScore.classList.toggle('active', currentTeam === 'red');
            blueScore.classList.toggle('active', currentTeam === 'blue');
            updateTurnBanner();
        }

        function endTurn() {
            if (gameOver) return;
            currentTeam = currentTeam === 'red' ? 'blue' : 'red';
            teamTurnCounts[currentTeam] = (teamTurnCounts[currentTeam] || 1);
            updateScores();
            showFeedback(`${currentTeam === 'red' ? '🔴 Red' : '🔵 Blue'} Team's turn`, currentTeam === 'red' ? '#c0392b' : '#1f78d1');
        }

        function showGameOver(message) {
            const gameOverEl = document.getElementById('gameOverMessage');
            gameOverEl.innerHTML = `
                <div class="game-over">
                    <h2>${message}</h2>
                </div>
            `;
            gameOverEl.style.display = 'block';
        }

        function toggleSpymasterView() {
            const view = document.getElementById('spymasterView');
            // support optional param: if called with boolean, set accordingly
            const arg = arguments[0];
            if (typeof arg === 'boolean') {
                view.style.display = arg ? 'block' : 'none';
                // sync checkbox
                const cb = document.getElementById('cheatToggle'); if (cb) cb.checked = arg;
            } else {
                view.style.display = view.style.display === 'none' ? 'block' : 'none';
                const cb = document.getElementById('cheatToggle'); if (cb) cb.checked = view.style.display !== 'none';
            }
        }

        function showFeedback(text, color) {
            try {
                const root = document.getElementById('feedbackRoot');
                if (!root) return;
                const el = document.createElement('div');
                el.className = 'feedback';
                el.style.background = color || 'rgba(0,0,0,0.8)';
                el.textContent = text;
                root.appendChild(el);
                requestAnimationFrame(()=> el.classList.add('show'));
                setTimeout(()=> { el.classList.remove('show'); setTimeout(()=> el.remove(), 260); }, 900);
            } catch(e){ /* ignore */ }
        }

        function newGame() {
            if (collection.length > 0) {
                initializeGame();
                document.getElementById('gameOverMessage').style.display = 'none';
            }
        }

        function backToSetup() {
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('confirmScreen').classList.remove('active');
            document.getElementById('setupScreen').classList.add('active');
        }

        // Load saved username or default to sportomax
        window.addEventListener('DOMContentLoaded', () => {
            const savedUsername = localStorage.getItem('codenames_username') || 'sportomax';
            document.getElementById('usernameInput').value = savedUsername;
        });

        // Render the confirm list from selectedGamesForConfirm
        function renderConfirmList() {
            const gamesList = document.getElementById('gamesList');
            gamesList.innerHTML = selectedGamesForConfirm.map((game, idx) => `
                <div style="text-align: center; position: relative;">
                    <img src="${IMAGE_PROXY}${game.thumbnail}" 
                         style="width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; border: 2px solid #e0e0e0;"
                         alt="${game.name}"
                         title="${game.name}">
                    <button onclick="replaceGame(${idx})" style="position:absolute; left:6px; top:6px; padding:6px 8px; font-size:12px; border-radius:6px; background:#ffffffcc; border:1px solid #ddd; cursor:pointer;">Replace</button>
                </div>
            `).join('');
        }

        // Replace a single confirmed game at index with another random collection item
        function replaceGame(index) {
            if (!collection || collection.length === 0) return;
            const currentIds = new Set(selectedGamesForConfirm.map(g => g.id));
            // Try to find a replacement that's not currently selected
            const pool = collection.filter(g => !currentIds.has(g.id));
            if (pool.length === 0) {
                // If none available, just pick random from collection
                selectedGamesForConfirm[index] = collection[Math.floor(Math.random() * collection.length)];
            } else {
                selectedGamesForConfirm[index] = pool[Math.floor(Math.random() * pool.length)];
            }
            renderConfirmList();
        }

        // Replace all confirmed games with a fresh random selection
        function replaceAllGames() {
            const shuffled = [...collection].sort(() => Math.random() - 0.5);
            selectedGamesForConfirm = shuffled.slice(0, 25);
            renderConfirmList();
        }
    </script>
    <!-- Vercel Web Analytics -->
    <script type="module" src="analytics-init.js"></script>
</body>
</html>
