<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Lane Rush — Arcade</title>
    <style>
        html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto}
        body{background:linear-gradient(#11998e,#38ef7d);display:flex;align-items:center;justify-content:center}
        .wrap{width:100%;max-width:600px;height:700px;background:#042a2b;border-radius:12px;position:relative;overflow:hidden}
        canvas{width:100%;height:100%;display:block}
        .hud{position:absolute;left:12px;top:12px;color:#fff}
        .home{position:absolute;right:12px;top:12px;color:#fff}
    </style>
</head>
<body>
    <div class="wrap">
        <canvas id="c" width="600" height="700"></canvas>
        <div class="hud"><strong id="score">0</strong></div>
        <a class="home" href="home.html">Home</a>
    </div>
    <script>
        const canvas = document.getElementById('c'); const ctx = canvas.getContext('2d');
        const lanes = [120, 260, 400];
        const player = { lane:1, x:50, y:0, w:64, h:64 };
        const items = [];
        let score = 0;

        function spawn(){
            const lane = Math.floor(Math.random()*3);
            const kind = Math.random()<0.7? 'thumb' : 'bad';
            items.push({ lane, y:-80, speed: 2 + Math.random()*2, kind, hit:false });
        }

        setInterval(()=>{ if (Math.random()<0.9) spawn(); }, 700);

        window.addEventListener('keydown', e=>{
            if (e.key==='ArrowLeft'){ player.lane = Math.max(0, player.lane-1);} else if (e.key==='ArrowRight'){ player.lane = Math.min(2, player.lane+1); }
        });

        let touchStartX = null;
        canvas.addEventListener('touchstart', e=>{ touchStartX = e.touches[0].clientX; }, {passive:true});
        canvas.addEventListener('touchend', e=>{ const dx = (e.changedTouches[0].clientX - touchStartX); if (dx>30) player.lane = Math.min(2, player.lane+1); if (dx<-30) player.lane = Math.max(0, player.lane-1); }, {passive:true});

        function update(){
            // update items
            for (const it of items){ it.y += it.speed; }
            // check collisions
            for (const it of items){
                if (it.hit) continue;
                if (it.y > 520 && it.lane === player.lane){
                    it.hit = true;
                    if (it.kind === 'thumb') { score += 10; } else { score = Math.max(0, score - 15); }
                    document.getElementById('score').textContent = score;
                }
            }
            // cull
            while (items.length && items[0].y > 900) items.shift();
        }

        function draw(){
            ctx.clearRect(0,0,canvas.width,canvas.height);
            // lanes
            for (let i=0;i<3;i++){ ctx.fillStyle = i===player.lane? '#0f3' : '#064'; ctx.fillRect(0, lanes[i]-40, canvas.width, 120); }
            // items
            for (const it of items){
                const x = 120 + it.lane * 140;
                ctx.fillStyle = it.kind==='thumb'? '#ffd54f' : '#ef5350';
                ctx.fillRect(x, it.y, 64,64);
                ctx.fillStyle = '#000'; ctx.font='28px serif'; ctx.fillText(it.kind==='thumb'? '🎴':'💥', x+10, it.y+42);
            }
            // player
            const px = 120 + player.lane * 140;
            ctx.fillStyle = '#fff'; ctx.fillRect(px, 580, 64,64);
            ctx.fillStyle = '#000'; ctx.font='28px serif'; ctx.fillText('🧑', px+12, 612);
        }

        function loop(){ update(); draw(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
