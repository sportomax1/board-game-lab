<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>BGG Checkers</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>⚫</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --board-dark: #334155;
            --board-light: #f1f5f9;
            --player-red: #ef4444;
            --player-black: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            color: #1e293b;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .board-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            perspective: 1000px;
        }

        .board {
            aspect-ratio: 1;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 8px solid var(--board-dark);
            background: var(--board-dark);
        }

        .cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: background 0.2s;
        }

        .cell.light { background: var(--board-light); }
        .cell.dark { background: var(--board-dark); }
        
        .cell.selected { background: #fde047 !important; }
        .cell.valid-move::after {
            content: '';
            width: 30%;
            height: 30%;
            background: #22c55e;
            border-radius: 50%;
            opacity: 0.6;
        }
        .cell.valid-jump::after {
            background: #ef4444;
            opacity: 0.4;
        }

        .piece {
            width: 88%;
            height: 88%;
            border-radius: 50%;
            position: relative;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .piece.red { background: var(--player-red); }
        .piece.black { background: var(--player-black); }

        .piece img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            opacity: 0.85;
        }

        .piece.king::before {
            content: '\f521';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fbbf24;
            font-size: 1.2rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            z-index: 20;
        }

        .piece.red.king { border-color: #fbbf24; }
        .piece.black.king { border-color: #fbbf24; }

        .turn-indicator {
            transition: all 0.3s ease;
        }

        .player-card {
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .player-card.active {
            transform: scale(1.05);
            border-color: var(--primary);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.2);
        }

        .btn-primary {
            @apply bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl transition-all shadow-lg shadow-indigo-200 active:scale-95;
        }

        .input-modern {
            @apply w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition-all;
        }

        /* Mobile specific adjustments */
        @media (max-width: 640px) {
            .board-container { max-width: 100%; }
            .screen { padding: 1rem; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center">

    <!-- Setup Screen -->
    <div id="setupScreen" class="screen active min-h-screen justify-center">
        <div class="glass-card rounded-3xl p-8 sm:p-12 w-full max-w-md space-y-8">
            <div class="text-center space-y-2">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl mb-4">
                    <i class="fa-solid fa-chess-board text-3xl"></i>
                </div>
                <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">BGG Checkers</h1>
                <p class="text-slate-500 text-sm">Challenge your friends with your collection!</p>
            </div>
            
            <div class="space-y-6">
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">Player 1 (Red)</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                            <i class="fa-solid fa-user text-sm"></i>
                        </span>
                        <input type="text" id="username1" value="sportomax" class="input-modern pl-10" placeholder="Username">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">Player 2 (Black)</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                            <i class="fa-solid fa-user text-sm"></i>
                        </span>
                        <input type="text" id="username2" value="sportomax" class="input-modern pl-10" placeholder="Username">
                    </div>
                </div>

                <label class="flex items-center gap-3 p-4 rounded-2xl bg-slate-50 border border-slate-100 cursor-pointer hover:bg-slate-100 transition-all">
                    <input type="checkbox" id="includeExpansions" class="w-5 h-5 text-indigo-600 rounded-lg focus:ring-indigo-500 border-slate-300">
                    <span class="text-sm font-semibold text-slate-700">Include expansions</span>
                </label>

                <button class="btn-primary w-full flex items-center justify-center gap-2" onclick="startGame()">
                    <i class="fa-solid fa-play"></i> Start Match
                </button>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="screen">
        <!-- Game Header -->
        <div class="grid grid-cols-2 gap-4 mb-8">
            <div id="redCard" class="glass-card player-card p-4 rounded-2xl flex items-center gap-4">
                <div class="w-12 h-12 bg-red-500 rounded-xl flex items-center justify-center text-white shadow-lg shadow-red-100">
                    <i class="fa-solid fa-circle text-xl"></i>
                </div>
                <div class="flex-1">
                    <div id="redPlayerName" class="text-xs font-bold text-slate-500 truncate uppercase tracking-wider">Red</div>
                    <div id="redCount" class="text-2xl font-black text-slate-900">12</div>
                </div>
            </div>

            <div id="blackCard" class="glass-card player-card p-4 rounded-2xl flex items-center gap-4">
                <div class="w-12 h-12 bg-slate-800 rounded-xl flex items-center justify-center text-white shadow-lg shadow-slate-200">
                    <i class="fa-solid fa-circle text-xl"></i>
                </div>
                <div class="flex-1">
                    <div id="blackPlayerName" class="text-xs font-bold text-slate-500 truncate uppercase tracking-wider">Black</div>
                    <div id="blackCount" class="text-2xl font-black text-slate-900">12</div>
                </div>
            </div>
        </div>

        <!-- Center Status -->
        <div class="text-center mb-8">
            <div id="turnIndicator" class="inline-flex items-center gap-2 px-6 py-2 bg-white border border-slate-100 rounded-full shadow-sm text-sm font-bold text-slate-700">
                <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                Red's Turn
            </div>
        </div>

        <!-- The Board -->
        <div class="board-container mb-8">
            <div class="board" id="board"></div>
        </div>

        <!-- Controls -->
        <div class="flex gap-3">
            <button class="flex-1 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 font-bold py-3 rounded-xl transition-all shadow-sm flex items-center justify-center gap-2" onclick="newGame()">
                <i class="fa-solid fa-rotate-right"></i> Reset
            </button>
            <button class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-xl transition-all flex items-center justify-center gap-2" onclick="backToSettings()">
                <i class="fa-solid fa-gear"></i> Settings
            </button>
        </div>
    </div>

    <!-- Winner Modal -->
    <div id="winnerModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-6">
        <div class="glass-card rounded-3xl p-10 max-w-sm w-full text-center space-y-6 animate-bounce">
            <div class="w-20 h-20 bg-yellow-100 text-yellow-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-crown text-4xl"></i>
            </div>
            <h2 id="winnerText" class="text-3xl font-black text-slate-900">🎉 Winner!</h2>
            <button class="btn-primary w-full" onclick="newGame()">Play Again</button>
        </div>
    </div>

    <script>
        const BOARD_SIZE = 8;
        let board = [];
        let currentPlayer = 'red';
        let selectedPiece = null;
        let validMoves = [];
        let redGames = [];
        let blackGames = [];
        let gameActive = false;

        async function startGame() {
            const btn = document.querySelector('button[onclick="startGame()"]');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Loading...';

            const username1 = document.getElementById('username1').value.trim() || 'sportomax';
            const username2 = document.getElementById('username2').value.trim() || 'sportomax';
            const includeExpansions = document.getElementById('includeExpansions').checked;

            try {
                const subtype = includeExpansions ? '' : '&subtype=boardgame';
                
                const [res1, res2] = await Promise.all([
                    fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username1)}&own=1${subtype}&stats=1`),
                    fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username2)}&own=1${subtype}&stats=1`)
                ]);

                const [xml1, xml2] = await Promise.all([res1.text(), res2.text()]);

                const parser = new DOMParser();
                const doc1 = parser.parseFromString(xml1, 'text/xml');
                const doc2 = parser.parseFromString(xml2, 'text/xml');

                redGames = Array.from(doc1.querySelectorAll('item')).map(item => ({
                    name: item.querySelector('name').textContent,
                    thumbnail: item.querySelector('thumbnail')?.textContent || ''
                })).filter(g => g.thumbnail);

                blackGames = Array.from(doc2.querySelectorAll('item')).map(item => ({
                    name: item.querySelector('name').textContent,
                    thumbnail: item.querySelector('thumbnail')?.textContent || ''
                })).filter(g => g.thumbnail);

                if (redGames.length < 12 || blackGames.length < 12) {
                    alert('Not enough games with thumbnails. Need at least 12 per player.');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-play"></i> Start Match';
                    return;
                }

                document.getElementById('redPlayerName').textContent = username1;
                document.getElementById('blackPlayerName').textContent = username2;

                document.getElementById('setupScreen').classList.remove('active');
                document.getElementById('gameScreen').classList.add('active');

                newGame();
            } catch (error) {
                alert('Error loading collections: ' + error.message);
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-play"></i> Start Match';
            }
        }

        function newGame() {
            currentPlayer = 'red';
            selectedPiece = null;
            validMoves = [];
            gameActive = true;
            document.getElementById('winnerModal').classList.add('hidden');

            board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));

            const selectedRed = [...redGames].sort(() => Math.random() - 0.5).slice(0, 12);
            let redIndex = 0;
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    if ((row + col) % 2 === 1) {
                        board[row][col] = { color: 'red', king: false, game: selectedRed[redIndex++] };
                    }
                }
            }

            const selectedBlack = [...blackGames].sort(() => Math.random() - 0.5).slice(0, 12);
            let blackIndex = 0;
            for (let row = 5; row < 8; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    if ((row + col) % 2 === 1) {
                        board[row][col] = { color: 'black', king: false, game: selectedBlack[blackIndex++] };
                    }
                }
            }

            renderBoard();
            updateStatus();
        }

        function renderBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';

            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    const cell = document.createElement('div');
                    cell.className = `cell ${(row + col) % 2 === 0 ? 'light' : 'dark'}`;
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    
                    const piece = board[row][col];
                    if (piece) {
                        const pieceDiv = document.createElement('div');
                        pieceDiv.className = `piece ${piece.color} ${piece.king ? 'king' : ''}`;
                        
                        const img = document.createElement('img');
                        img.src = piece.game.thumbnail;
                        pieceDiv.appendChild(img);
                        
                        cell.appendChild(pieceDiv);
                    }

                    // Highlights
                    if (selectedPiece && selectedPiece.row === row && selectedPiece.col === col) {
                        cell.classList.add('selected');
                    }
                    const validMove = validMoves.find(m => m.row === row && m.col === col);
                    if (validMove) {
                        cell.classList.add('valid-move');
                        if (validMove.jump) cell.classList.add('valid-jump');
                    }

                    cell.onclick = () => handleCellClick(row, col);
                    boardElement.appendChild(cell);
                }
            }
        }

        function handleCellClick(row, col) {
            if (!gameActive) return;

            const piece = board[row][col];
            const move = validMoves.find(m => m.row === row && m.col === col);

            if (move) {
                movePiece(selectedPiece, move);
                return;
            }

            if (piece && piece.color === currentPlayer) {
                selectedPiece = { row, col };
                validMoves = getValidMoves(row, col);
                renderBoard();
            } else {
                selectedPiece = null;
                validMoves = [];
                renderBoard();
            }
        }

        function getValidMoves(row, col) {
            const piece = board[row][col];
            if (!piece) return [];

            const moves = [];
            const directions = piece.king 
                ? [[-1, -1], [-1, 1], [1, -1], [1, 1]]
                : piece.color === 'red' ? [[1, -1], [1, 1]] : [[-1, -1], [-1, 1]];

            directions.forEach(([dr, dc]) => {
                const newRow = row + dr;
                const newCol = col + dc;
                if (isValidPosition(newRow, newCol) && !board[newRow][newCol]) {
                    moves.push({ row: newRow, col: newCol, jump: false });
                }

                const jumpRow = row + dr * 2;
                const jumpCol = col + dc * 2;
                if (isValidPosition(jumpRow, jumpCol) && !board[jumpRow][jumpCol]) {
                    const middlePiece = board[newRow][newCol];
                    if (middlePiece && middlePiece.color !== piece.color) {
                        moves.push({ row: jumpRow, col: jumpCol, jump: true, jumpedRow: newRow, jumpedCol: newCol });
                    }
                }
            });

            return moves;
        }

        function isValidPosition(row, col) {
            return row >= 0 && row < BOARD_SIZE && col >= 0 && col < BOARD_SIZE;
        }

        function movePiece(from, to) {
            const piece = board[from.row][from.col];
            board[to.row][to.col] = piece;
            board[from.row][from.col] = null;

            if (to.jump) {
                board[to.jumpedRow][to.jumpedCol] = null;
            }

            if (piece.color === 'red' && to.row === BOARD_SIZE - 1) piece.king = true;
            else if (piece.color === 'black' && to.row === 0) piece.king = true;

            selectedPiece = null;
            validMoves = [];
            currentPlayer = currentPlayer === 'red' ? 'black' : 'red';

            renderBoard();
            updateStatus();
            checkWinner();
        }

        function updateStatus() {
            let redCount = 0;
            let blackCount = 0;

            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const p = board[r][c];
                    if (p) {
                        if (p.color === 'red') redCount++;
                        else blackCount++;
                    }
                }
            }

            document.getElementById('redCount').textContent = redCount;
            document.getElementById('blackCount').textContent = blackCount;

            const name = currentPlayer === 'red' ? document.getElementById('redPlayerName').textContent : document.getElementById('blackPlayerName').textContent;
            const indicator = document.getElementById('turnIndicator');
            indicator.innerHTML = `<span class="w-2 h-2 rounded-full ${currentPlayer === 'red' ? 'bg-red-500' : 'bg-slate-800'} animate-pulse"></span> ${name}'s Turn`;

            document.getElementById('redCard').classList.toggle('active', currentPlayer === 'red');
            document.getElementById('blackCard').classList.toggle('active', currentPlayer === 'black');
        }

        function checkWinner() {
            let red = 0, black = 0;
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const p = board[r][c];
                    if (p) { p.color === 'red' ? red++ : black++; }
                }
            }
            if (red === 0) showWinner('black');
            else if (black === 0) showWinner('red');
        }

        function showWinner(winner) {
            const name = winner === 'red' ? document.getElementById('redPlayerName').textContent : document.getElementById('blackPlayerName').textContent;
            document.getElementById('winnerText').textContent = `🎉 ${name} Wins!`;
            document.getElementById('winnerModal').classList.remove('hidden');
            gameActive = false;
        }

        function backToSettings() {
            if (confirm('Go back to settings? Current progress will be lost.')) {
                document.getElementById('gameScreen').classList.remove('active');
                document.getElementById('setupScreen').classList.add('active');
            }
        }
    </script>
</body>
</html>
