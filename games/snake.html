<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>BGG Snake</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🐍</text></svg>">
    <style>
        *, *::before, *::after {
            margin: 0; padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bg:     #0d1117;
            --bg2:    #161b22;
            --bg3:    #21262d;
            --border: rgba(255,255,255,0.08);
            --accent: #3ddc84;
            --glow:   rgba(61,220,132,0.45);
            --text:   #e6edf3;
            --muted:  #8b949e;
            --danger: #f85149;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 1rem;
            overflow-x: hidden;
            color: var(--text);
        }
        .screen { display: none; width: 100%; }
        .screen.active { display: block; }

        /* ── SETUP ──────────────────────────────── */
        .setup-wrapper { max-width: 440px; margin: 0 auto; padding-top: 1rem; }
        .setup-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 24px 64px rgba(0,0,0,0.6);
        }
        .app-logo { text-align: center; margin-bottom: 1.25rem; }
        .app-logo .icon { font-size: 3.5rem; filter: drop-shadow(0 0 18px var(--accent)); }
        h1 {
            font-size: 1.75rem; font-weight: 700;
            letter-spacing: -0.5px; text-align: center; margin-bottom: 0.25rem;
        }
        .subtitle { text-align: center; color: var(--muted); font-size: 0.875rem; margin-bottom: 1.75rem; }
        .form-group { margin-bottom: 1.125rem; }
        label {
            display: block; font-size: 0.75rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.6px;
            color: var(--muted); margin-bottom: 0.375rem;
        }
        input[type="text"], input[type="number"], select {
            width: 100%; padding: 0.75rem 1rem;
            background: var(--bg3); border: 1px solid var(--border);
            border-radius: 10px; font-size: 0.9375rem; color: var(--text);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus, select:focus {
            outline: none; border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(61,220,132,0.15);
        }
        select option { background: var(--bg3); }
        .checkbox-row {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.75rem 1rem;
            background: var(--bg3); border: 1px solid var(--border);
            border-radius: 10px; cursor: pointer;
        }
        .checkbox-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
        .checkbox-row label { margin: 0; text-transform: none; letter-spacing: 0; font-size: 0.9375rem; font-weight: 400; color: var(--text); cursor: pointer; }
        #status { text-align: center; color: var(--danger); font-size: 0.875rem; min-height: 1.25rem; margin-top: 0.5rem; }

        /* ── BUTTONS ────────────────────────────── */
        .btn {
            width: 100%; padding: 0.875rem 1rem;
            border: none; border-radius: 10px;
            font-size: 0.9375rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
        }
        .btn + .btn { margin-top: 0.5rem; }
        .btn-primary { background: var(--accent); color: #0d1117; }
        .btn-primary:hover { background: #56e89a; box-shadow: 0 0 24px var(--glow); transform: translateY(-1px); }
        .btn-primary:active { transform: translateY(0); }
        .btn-secondary { background: var(--bg3); color: var(--muted); border: 1px solid var(--border); }
        .btn-secondary:hover { color: var(--text); background: var(--bg2); }

        /* ── GAME HEADER ────────────────────────── */
        .game-wrapper { max-width: 860px; margin: 0 auto; width: 100%; }
        .game-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 0.875rem; gap: 1rem; flex-wrap: wrap;
        }
        .game-title { font-size: 1.25rem; font-weight: 700; white-space: nowrap; }
        .game-title .accent { color: var(--accent); }
        .stats { display: flex; gap: 0.5rem; }
        .stat-card {
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: 10px; padding: 0.5rem 0.875rem;
            text-align: center; min-width: 60px;
        }
        .stat-value { font-size: 1.2rem; font-weight: 700; color: var(--accent); line-height: 1; }
        .stat-label { font-size: 0.625rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 0.2rem; }

        /* ── GAME LAYOUT ────────────────────────── */
        .game-layout {
            display: grid;
            grid-template-columns: 1fr 210px;
            gap: 0.875rem;
            align-items: start;
        }
        @media (max-width: 640px) {
            .game-layout { grid-template-columns: 1fr; }
            .sidebar { order: -1; }
        }

        /* ── CANVAS ─────────────────────────────── */
        .canvas-col { display: flex; flex-direction: column; gap: 0.875rem; }
        .canvas-wrapper {
            position: relative;
            background: var(--bg2);
            border-radius: 14px; overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        #gameCanvas { width: 100%; aspect-ratio: 1 / 1; display: block; }

        /* ── GAME OVER ──────────────────────────── */
        .game-over-overlay {
            display: none; position: absolute; inset: 0;
            background: rgba(0,0,0,0.82);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            z-index: 10; align-items: center; justify-content: center;
        }
        .game-over-overlay.active { display: flex; }
        .game-over-box {
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: 18px; padding: 2rem; text-align: center;
            width: 88%; max-width: 280px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .game-over-box h2 { font-size: 1.5rem; color: var(--danger); margin-bottom: 1rem; }
        .go-stats { background: var(--bg3); border-radius: 10px; padding: 0.875rem 1rem; margin-bottom: 1.25rem; }
        .go-stats p { color: var(--muted); font-size: 0.9rem; margin: 0.2rem 0; }
        .go-stats strong { color: var(--accent); }

        /* ── CONTROLS ───────────────────────────── */
        .controls-col { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
        .control-hint { font-size: 0.75rem; color: var(--muted); }
        .control-pad {
            display: inline-grid;
            grid-template-columns: repeat(3, 72px);
            grid-template-rows: repeat(3, 72px);
            gap: 6px;
        }
        @media (max-width: 400px) {
            .control-pad { grid-template-columns: repeat(3, 62px); grid-template-rows: repeat(3, 62px); }
        }
        .ctrl-btn {
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: 12px; color: var(--text); font-size: 1.4rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.12s; touch-action: manipulation; user-select: none;
        }
        .ctrl-btn:active, .ctrl-btn.pressed {
            background: var(--accent); color: #0d1117;
            border-color: var(--accent); transform: scale(0.91);
            box-shadow: 0 0 14px var(--glow);
        }
        .ctrl-btn.blank { opacity: 0; pointer-events: none; }

        /* ── SIDEBAR ────────────────────────────── */
        .sidebar { display: flex; flex-direction: column; gap: 0.875rem; }
        @media (max-width: 640px) {
            .sidebar { flex-direction: row; align-items: stretch; }
            .collecting-card {
                flex: 1; display: flex !important;
                flex-direction: row !important;
                align-items: center; gap: 0.875rem;
                padding: 0.75rem !important;
            }
            .food-thumb-wrap { width: 64px !important; height: 64px !important; flex-shrink: 0; aspect-ratio: unset !important; }
            .food-meta { text-align: left; }
            .sidebar-new-game { display: none; }
        }
        .sidebar-card {
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: 14px; padding: 1rem; text-align: center;
        }
        .collecting-card { display: flex; flex-direction: column; }
        .card-label {
            font-size: 0.7rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.7px;
            color: var(--muted); margin-bottom: 0.75rem;
        }
        .food-thumb-wrap {
            aspect-ratio: 1; border-radius: 10px; overflow: hidden;
            background: var(--bg3);
            border: 2px solid var(--accent);
            margin-bottom: 0.75rem;
            animation: pulse-glow 2.2s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%,100% { box-shadow: 0 0 10px var(--glow); }
            50%      { box-shadow: 0 0 28px var(--glow), 0 0 48px rgba(61,220,132,0.2); }
        }
        .food-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .food-name {
            font-size: 0.8125rem; font-weight: 600; color: var(--text); line-height: 1.35;
            overflow: hidden; display: -webkit-box;
            -webkit-line-clamp: 3; -webkit-box-orient: vertical;
        }
        .sidebar-new-game .btn { margin-top: 0; }
    </style>
</head>
<body>

<!-- ═══ SETUP SCREEN ═══ -->
<div id="setupScreen" class="screen active">
    <div class="setup-wrapper">
        <div class="setup-card">
            <div class="app-logo"><span class="icon">🐍</span></div>
            <h1>BGG Snake</h1>
            <p class="subtitle">Collect board games from your BGG collection!</p>

            <div class="form-group">
                <label for="usernameInput">BGG Username</label>
                <input type="text" id="usernameInput" placeholder="Enter BGG username"
                    value="sportomax" autocomplete="off" autocapitalize="none" spellcheck="false">
            </div>
            <div class="form-group">
                <label for="difficultySelect">Difficulty</label>
                <select id="difficultySelect">
                    <option value="easy">Easy — Slow</option>
                    <option value="medium" selected>Medium</option>
                    <option value="hard">Hard — Fast</option>
                </select>
            </div>
            <div class="form-group">
                <label for="gridSizeSelect">Grid Size</label>
                <select id="gridSizeSelect">
                    <option value="15">Small (15×15)</option>
                    <option value="20" selected>Medium (20×20)</option>
                    <option value="25">Large (25×25)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="thumbnailModeSelect">Thumbnail Mode</label>
                <select id="thumbnailModeSelect">
                    <option value="per-block" selected>Different per segment</option>
                    <option value="same">Same for all segments</option>
                </select>
            </div>
            <div class="form-group">
                <div class="checkbox-row">
                    <input type="checkbox" id="excludeExpansions" checked>
                    <label for="excludeExpansions">Exclude Expansions</label>
                </div>
            </div>

            <div id="status"></div>
            <button class="btn btn-primary" onclick="startGame()">🎮 Start Game</button>
            <button class="btn btn-secondary" onclick="window.location.href='../home.html'">← Home</button>
        </div>
    </div>
</div>

<!-- ═══ GAME SCREEN ═══ -->
<div id="gameScreen" class="screen">
    <div class="game-wrapper">

        <div class="game-header">
            <div class="game-title">🐍 <span class="accent">BGG Snake</span></div>
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="scoreDisplay">0</div>
                    <div class="stat-label">Score</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="lengthDisplay">3</div>
                    <div class="stat-label">Length</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="gamesDisplay">0</div>
                    <div class="stat-label">Collected</div>
                </div>
            </div>
        </div>

        <div class="game-layout">

            <!-- Canvas + controls -->
            <div class="canvas-col">
                <div class="canvas-wrapper">
                    <canvas id="gameCanvas"></canvas>
                    <div class="game-over-overlay" id="gameOverOverlay">
                        <div class="game-over-box">
                            <h2>Game Over!</h2>
                            <div class="go-stats">
                                <p>Score: <strong id="finalScore">0</strong></p>
                                <p>Games Collected: <strong id="finalGames">0</strong></p>
                            </div>
                            <button class="btn btn-primary" onclick="location.reload()">Play Again</button>
                            <button class="btn btn-secondary" onclick="window.location.href='../home.html'">Home</button>
                        </div>
                    </div>
                </div>

                <div class="controls-col">
                    <p class="control-hint">Arrow keys · WASD · swipe to play</p>
                    <div class="control-pad">
                        <div class="ctrl-btn blank"></div>
                        <button class="ctrl-btn" ontouchstart="handleCtrl('UP',this);return false;" onclick="changeDirection('UP')">▲</button>
                        <div class="ctrl-btn blank"></div>
                        <button class="ctrl-btn" ontouchstart="handleCtrl('LEFT',this);return false;" onclick="changeDirection('LEFT')">◀</button>
                        <div class="ctrl-btn blank"></div>
                        <button class="ctrl-btn" ontouchstart="handleCtrl('RIGHT',this);return false;" onclick="changeDirection('RIGHT')">▶</button>
                        <div class="ctrl-btn blank"></div>
                        <button class="ctrl-btn" ontouchstart="handleCtrl('DOWN',this);return false;" onclick="changeDirection('DOWN')">▼</button>
                        <div class="ctrl-btn blank"></div>
                    </div>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="sidebar">
                <div class="sidebar-card collecting-card">
                    <div class="card-label">Now Collecting</div>
                    <div class="food-thumb-wrap">
                        <img id="foodPreviewImg" src="" alt="Game thumbnail">
                    </div>
                    <div class="food-meta">
                        <div class="food-name" id="foodGameName">Loading…</div>
                    </div>
                </div>
                <div class="sidebar-card sidebar-new-game">
                    <button class="btn btn-secondary" onclick="location.reload()">New Game</button>
                </div>
            </div>

        </div><!-- .game-layout -->
    </div><!-- .game-wrapper -->
</div><!-- #gameScreen -->

<script>
    // ── State ──────────────────────────────────────────────────────────────────
    let canvas, ctx;
    let gridSize   = 20;
    let cellSize   = 20;
    let snake      = [];
    let direction  = 'RIGHT';
    let nextDir    = 'RIGHT';
    let food       = null;
    let score      = 0;
    let collected  = 0;
    let gameLoop   = null;
    let rafId      = null;
    let frameCount = 0;
    let speed      = 155;
    let collection = [];
    let gameIdx    = 0;
    let foodImg    = new Image();
    let thumbnailMode  = 'per-block';
    let sharedThumbImg = null;

    const PROXY = 'https://images.weserv.nl/?url=';

    // ── BGG API ────────────────────────────────────────────────────────────────
    async function fetchBGG(endpoint, params = {}, retries = 5) {
        const qs  = new URLSearchParams(params).toString();
        const res = await fetch(`/api/bgg-helper?endpoint=${endpoint}&${qs}`);
        if (res.status === 202 && retries > 0) {
            await new Promise(r => setTimeout(r, 3000));
            return fetchBGG(endpoint, params, retries - 1);
        }
        if (!res.ok) throw new Error(`BGG API error: ${res.status}`);
        return res.text();
    }
    function parseXML(txt) { return new DOMParser().parseFromString(txt, 'text/xml'); }

    // ── Setup ──────────────────────────────────────────────────────────────────
    async function startGame() {
        const username = document.getElementById('usernameInput').value.trim();
        if (!username) { document.getElementById('status').textContent = 'Please enter a username'; return; }

        const statusEl  = document.getElementById('status');
        const cacheKey  = `bgg_collection_${username}`;
        const cached    = localStorage.getItem(cacheKey);
        const cachedTs  = localStorage.getItem(`${cacheKey}_timestamp`);
        const TTL       = 24 * 60 * 60 * 1000;

        if (cached && cachedTs && (Date.now() - parseInt(cachedTs)) < TTL) {
            statusEl.textContent = 'Loading from cache…';
            try {
                let col = JSON.parse(cached);
                if (document.getElementById('excludeExpansions').checked)
                    col = col.filter(g => g.subtype !== 'boardgameexpansion');
                if (col.length >= 5) {
                    collection = col.sort(() => Math.random() - 0.5);
                    statusEl.textContent = 'Loading images…';
                    await preloadImages(5);
                    initGame(); return;
                }
            } catch(e) { console.error('Cache error:', e); }
        }

        statusEl.textContent = 'Loading collection…';
        try {
            const xml = await fetchBGG('collection', { username, own: '1' });
            const doc = parseXML(xml);
            if (doc.querySelector('errors error'))
                throw new Error(doc.querySelector('errors error').textContent);

            const full = Array.from(doc.querySelectorAll('item[objectid]'))
                .map(item => ({
                    id:        item.getAttribute('objectid'),
                    name:      item.querySelector('name')?.textContent ?? 'Unknown',
                    thumbnail: item.querySelector('thumbnail')?.textContent ?? null,
                    subtype:   item.getAttribute('subtype')
                }))
                .filter(g => g.thumbnail);

            localStorage.setItem(cacheKey, JSON.stringify(full));
            localStorage.setItem(`${cacheKey}_timestamp`, Date.now().toString());

            const excl = document.getElementById('excludeExpansions').checked;
            collection = (excl ? full.filter(g => g.subtype !== 'boardgameexpansion') : full)
                .sort(() => Math.random() - 0.5);

            if (collection.length === 0) throw new Error('No games found in collection');
            if (collection.length < 5)  throw new Error('Need at least 5 games with images');

            statusEl.textContent = 'Loading images…';
            await preloadImages(5);
            initGame();
        } catch(err) { statusEl.textContent = `Error: ${err.message}`; console.error(err); }
    }

    async function preloadImages(count) {
        const ps = [];
        for (let i = 0; i < Math.min(count, collection.length); i++) {
            const img = new Image(); img.crossOrigin = 'Anonymous';
            ps.push(new Promise(r => { img.onload = img.onerror = r; }));
            img.src = PROXY + collection[i].thumbnail;
        }
        await Promise.all(ps);
    }

    // ── Init ───────────────────────────────────────────────────────────────────
    function initGame() {
        gridSize = parseInt(document.getElementById('gridSizeSelect').value);
        const diff = document.getElementById('difficultySelect').value;
        speed = diff === 'easy' ? 210 : diff === 'medium' ? 155 : 100;

        const modeEl = document.getElementById('thumbnailModeSelect');
        const saved  = localStorage.getItem('snake_thumbnailMode');
        if (saved) modeEl.value = saved;
        thumbnailMode = modeEl.value;
        modeEl.addEventListener('change', () => {
            thumbnailMode = modeEl.value;
            localStorage.setItem('snake_thumbnailMode', thumbnailMode);
        });

        canvas = document.getElementById('gameCanvas');
        ctx    = canvas.getContext('2d');
        resizeCanvas();

        if (thumbnailMode === 'same' && collection[0]?.thumbnail) {
            sharedThumbImg = new Image(); sharedThumbImg.crossOrigin = 'Anonymous';
            sharedThumbImg.src = PROXY + collection[0].thumbnail;
        }

        const mid = Math.floor(gridSize / 2);
        snake = [];
        for (let i = 0; i < 3; i++) {
            if (thumbnailMode === 'same' && sharedThumbImg) {
                snake.push({ x: mid - i, y: mid, img: sharedThumbImg });
            } else {
                const img = new Image(); img.crossOrigin = 'Anonymous';
                img.src = PROXY + collection[i % collection.length].thumbnail;
                snake.push({ x: mid - i, y: mid, img });
            }
        }

        direction = 'RIGHT'; nextDir = 'RIGHT';
        score = collected = gameIdx = frameCount = 0;
        placeFood();

        document.getElementById('setupScreen').classList.remove('active');
        document.getElementById('gameScreen').classList.add('active');

        document.addEventListener('keydown', handleKey);
        window.addEventListener('resize', onResize);
        setupSwipe();

        gameLoop = setInterval(update, speed);
        startRaf();
    }

    // ── Canvas resize ──────────────────────────────────────────────────────────
    function resizeCanvas() {
        const size = canvas.parentElement.clientWidth;
        canvas.width = size; canvas.height = size;
        cellSize = size / gridSize;
    }
    function onResize() { resizeCanvas(); draw(); }

    // ── RAF render loop ────────────────────────────────────────────────────────
    function startRaf() {
        function tick() { frameCount++; draw(); rafId = requestAnimationFrame(tick); }
        rafId = requestAnimationFrame(tick);
    }
    function stopRaf() { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }

    // ── Input ──────────────────────────────────────────────────────────────────
    function handleKey(e) {
        const map = {
            ArrowUp:'UP', ArrowDown:'DOWN', ArrowLeft:'LEFT', ArrowRight:'RIGHT',
            w:'UP', s:'DOWN', a:'LEFT', d:'RIGHT',
            W:'UP', S:'DOWN', A:'LEFT', D:'RIGHT'
        };
        const dir = map[e.key];
        if (dir) { changeDirection(dir); e.preventDefault(); }
    }
    function changeDirection(d) {
        const opp = { UP:'DOWN', DOWN:'UP', LEFT:'RIGHT', RIGHT:'LEFT' };
        if (d !== opp[direction]) nextDir = d;
    }
    function handleCtrl(dir, btn) {
        changeDirection(dir);
        btn.classList.add('pressed');
        setTimeout(() => btn.classList.remove('pressed'), 160);
    }
    function setupSwipe() {
        let sx, sy;
        canvas.addEventListener('touchstart', e => {
            sx = e.touches[0].clientX; sy = e.touches[0].clientY; e.preventDefault();
        }, { passive: false });
        canvas.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].clientX - sx;
            const dy = e.changedTouches[0].clientY - sy;
            const MIN = 24;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx >  MIN) changeDirection('RIGHT');
                if (dx < -MIN) changeDirection('LEFT');
            } else {
                if (dy >  MIN) changeDirection('DOWN');
                if (dy < -MIN) changeDirection('UP');
            }
            e.preventDefault();
        }, { passive: false });
    }

    // ── Food ───────────────────────────────────────────────────────────────────
    function placeFood() {
        let pos;
        do {
            pos = { x: Math.floor(Math.random() * gridSize), y: Math.floor(Math.random() * gridSize) };
        } while (snake.some(s => s.x === pos.x && s.y === pos.y));

        const game = collection[gameIdx % collection.length];
        foodImg = new Image(); foodImg.crossOrigin = 'Anonymous';
        foodImg.src = PROXY + game.thumbnail;
        food = { ...pos, thumbUrl: game.thumbnail, gameName: game.name };

        document.getElementById('foodPreviewImg').src = PROXY + game.thumbnail;
        document.getElementById('foodGameName').textContent = game.name;
    }

    // ── Update ─────────────────────────────────────────────────────────────────
    function update() {
        direction = nextDir;
        const head = { ...snake[0] };
        if (direction === 'UP')    head.y--;
        if (direction === 'DOWN')  head.y++;
        if (direction === 'LEFT')  head.x--;
        if (direction === 'RIGHT') head.x++;

        if (head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize) { gameOver(); return; }
        if (snake.some(s => s.x === head.x && s.y === head.y))                     { gameOver(); return; }

        snake.unshift({ x: head.x, y: head.y, img: thumbnailMode === 'same' ? (sharedThumbImg ?? snake[0]?.img) : snake[0]?.img });

        if (head.x === food.x && head.y === food.y) {
            score += 10; collected++;
            const tail = snake[snake.length - 1];
            if (thumbnailMode === 'same') {
                if (sharedThumbImg && tail) tail.img = sharedThumbImg;
            } else if (food.thumbUrl && tail) {
                const img = new Image(); img.crossOrigin = 'Anonymous';
                img.src = PROXY + food.thumbUrl; tail.img = img;
            }
            gameIdx++;
            updateStats();
            placeFood();
        } else {
            snake.pop();
        }
    }

    // ── Draw ───────────────────────────────────────────────────────────────────
    function draw() {
        if (!ctx) return;
        const W = canvas.width, H = canvas.height;
        const r = Math.max(2, cellSize * 0.15);

        // Background
        ctx.fillStyle = '#0d1117';
        ctx.fillRect(0, 0, W, H);

        // Subtle grid
        ctx.strokeStyle = 'rgba(255,255,255,0.03)';
        ctx.lineWidth = 0.5;
        for (let i = 0; i <= gridSize; i++) {
            ctx.beginPath(); ctx.moveTo(i * cellSize, 0);   ctx.lineTo(i * cellSize, H);   ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i * cellSize);   ctx.lineTo(W, i * cellSize);   ctx.stroke();
        }

        // Snake — draw tail→head so head renders on top
        for (let i = snake.length - 1; i >= 0; i--) {
            const seg    = snake[i];
            const isHead = i === 0;
            const px = seg.x * cellSize, py = seg.y * cellSize;
            const pad = 1.5, sw = cellSize - pad * 2, sh = cellSize - pad * 2;

            if (seg.img?.complete && seg.img.naturalHeight !== 0) {
                ctx.save();
                rrPath(px + pad, py + pad, sw, sh, r); ctx.clip();
                try { ctx.drawImage(seg.img, px + pad, py + pad, sw, sh); } catch(_) {}
                ctx.restore();
            } else {
                ctx.fillStyle = isHead ? '#39d353' : '#1d4a2a';
                rrPath(px + pad, py + pad, sw, sh, r); ctx.fill();
            }

            // Colored border
            ctx.save();
            if (isHead) {
                ctx.shadowColor = '#39d353'; ctx.shadowBlur = 10;
                ctx.strokeStyle = '#39d353'; ctx.lineWidth = 2;
            } else {
                ctx.strokeStyle = 'rgba(61,220,132,0.35)'; ctx.lineWidth = 1.5;
            }
            rrPath(px + pad, py + pad, sw, sh, r); ctx.stroke();
            ctx.restore();
        }

        // Food with pulsing glow
        if (food) {
            const pulse = 0.5 + 0.5 * Math.sin(frameCount * 0.07);
            const fx = food.x * cellSize, fy = food.y * cellSize;
            const pad = 1.5, fw = cellSize - pad * 2, fh = cellSize - pad * 2;

            if (foodImg?.complete && foodImg.naturalHeight !== 0) {
                ctx.save();
                rrPath(fx + pad, fy + pad, fw, fh, r); ctx.clip();
                try { ctx.drawImage(foodImg, fx + pad, fy + pad, fw, fh); } catch(_) {}
                ctx.restore();
            } else {
                ctx.save();
                ctx.fillStyle = `rgba(0,255,136,${0.35 + pulse * 0.65})`;
                rrPath(fx + pad, fy + pad, fw, fh, r); ctx.fill();
                ctx.restore();
            }

            // Pulsing neon border
            ctx.save();
            ctx.shadowColor = '#00ff88';
            ctx.shadowBlur  = 8 + pulse * 22;
            ctx.strokeStyle = `rgba(0,255,136,${0.6 + pulse * 0.4})`;
            ctx.lineWidth   = 2.5;
            rrPath(fx + pad, fy + pad, fw, fh, r); ctx.stroke();
            ctx.restore();
        }
    }

    // Rounded-rect path helper — caller must call fill/stroke/clip after
    function rrPath(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);    ctx.quadraticCurveTo(x + w, y,     x + w, y + r);
        ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);    ctx.quadraticCurveTo(x,     y + h, x,     y + h - r);
        ctx.lineTo(x, y + r);        ctx.quadraticCurveTo(x,     y,     x + r, y);
        ctx.closePath();
    }

    // ── Stats & Game Over ──────────────────────────────────────────────────────
    function updateStats() {
        document.getElementById('scoreDisplay').textContent  = score;
        document.getElementById('lengthDisplay').textContent = snake.length;
        document.getElementById('gamesDisplay').textContent  = collected;
    }

    function gameOver() {
        clearInterval(gameLoop);
        stopRaf();
        document.removeEventListener('keydown', handleKey);
        window.removeEventListener('resize', onResize);
        document.getElementById('finalScore').textContent = score;
        document.getElementById('finalGames').textContent = collected;
        document.getElementById('gameOverOverlay').classList.add('active');
    }
</script>
