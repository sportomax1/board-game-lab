<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Box Jumper</title>
<style>
:root{color-scheme:dark;--ink:#f8fafc;--muted:#94a3b8;--panel:rgba(15,23,42,.88);--line:rgba(255,255,255,.12);--accent:#22c55e;--accent2:#38bdf8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 50% -10%,#164e63 0,#07111f 42%,#020617 100%);color:var(--ink);overflow:hidden}
body{display:grid;place-items:center;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}
.app{width:min(100%,760px);display:grid;gap:10px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(16px);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#22c55e,#0ea5e9);font-size:23px;box-shadow:0 8px 24px rgba(14,165,233,.28)}h1{font-size:18px;line-height:1;margin:0}.subtitle{font-size:11px;color:var(--muted);margin-top:4px}.actions{display:flex;gap:7px}.iconbtn{height:38px;min-width:38px;padding:0 11px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.07);color:white;font-weight:800;cursor:pointer}.iconbtn:active{transform:scale(.96)}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{padding:8px 6px;text-align:center;border:1px solid var(--line);background:var(--panel);border-radius:13px}.stat b{display:block;font-size:18px}.stat span{font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted)}
.stage{position:relative;aspect-ratio:1/1;max-height:calc(100vh - 190px);margin:auto;width:auto;max-width:100%;overflow:hidden;border-radius:20px;border:1px solid rgba(255,255,255,.16);box-shadow:0 28px 80px rgba(0,0,0,.5);touch-action:none;background:#10231d}canvas{display:block;width:100%;height:100%}
.banner{position:absolute;left:50%;top:14%;transform:translate(-50%,-15px);padding:9px 17px;border-radius:999px;background:rgba(2,6,23,.82);border:1px solid rgba(255,255,255,.18);font-weight:900;letter-spacing:.04em;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}.banner.show{opacity:1;transform:translate(-50%,0)}
.overlay{position:absolute;inset:0;display:none;place-items:center;background:rgba(2,6,23,.74);backdrop-filter:blur(6px);padding:24px}.overlay.show{display:grid}.card{width:min(100%,390px);padding:22px;border-radius:22px;background:linear-gradient(180deg,rgba(30,41,59,.98),rgba(15,23,42,.98));border:1px solid rgba(255,255,255,.15);text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5)}.card h2{font-size:30px;margin:0 0 8px}.card p{color:#cbd5e1;line-height:1.45;margin:0 0 18px}.primary{width:100%;padding:13px;border:0;border-radius:13px;background:linear-gradient(135deg,#22c55e,#0ea5e9);color:white;font-size:15px;font-weight:900;cursor:pointer}.help{font-size:12px;color:var(--muted);text-align:center}.touch{display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,48px);justify-content:center;gap:6px}.touch button{border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.09);color:white;font-size:20px;font-weight:900}.touch .up{grid-column:2}.touch .left{grid-column:1}.touch .down{grid-column:2}.touch .right{grid-column:3}
@media(max-width:640px){.app{gap:7px}.topbar{padding:8px 10px}.hud{gap:5px}.stat{padding:6px 3px}.stage{max-height:calc(100vh - 245px)}.touch{display:grid}.help{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><div class="logo">📦</div><div><h1>Box Jumper</h1><div class="subtitle">Cross the warehouse without getting boxed in</div></div></div><div class="actions"><button class="iconbtn" id="pauseBtn" aria-label="Pause">Ⅱ</button><button class="iconbtn" onclick="location.href='../home.html'">⌂</button></div></header>
<section class="hud"><div class="stat"><b id="score">0</b><span>Score</span></div><div class="stat"><b id="round">1</b><span>Round</span></div><div class="stat"><b id="lives">♥♥♥</b><span>Lives</span></div><div class="stat"><b id="best">0</b><span>Best</span></div></section>
<div class="stage" id="stage"><canvas id="game" width="720" height="720"></canvas><div class="banner" id="banner"></div><div class="overlay show" id="overlay"><div class="card"><h2 id="overlayTitle">Box Jumper</h2><p id="overlayText">Move one tile at a time. Reach every loading bay at the top. Boxes are the traffic, and every round gets faster.</p><button class="primary" id="overlayBtn">Start Crossing</button></div></div></div>
<div class="touch"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div>
<div class="help">Arrow keys / WASD · Swipe or tap controls · P pauses</div>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage');
const ui={score:document.getElementById('score'),round:document.getElementById('round'),lives:document.getElementById('lives'),best:document.getElementById('best'),overlay:document.getElementById('overlay'),title:document.getElementById('overlayTitle'),text:document.getElementById('overlayText'),btn:document.getElementById('overlayBtn'),banner:document.getElementById('banner'),pause:document.getElementById('pauseBtn')};
const SIZE=720,COLS=9,ROWS=9,TILE=SIZE/COLS,SAFE_ROWS=new Set([0,4,8]),GOALS=[0,2,4,6,8];
let running=false,paused=false,last=0,score=0,round=1,lives=3,best=Number(localStorage.boxJumperBest||0),goalHits=new Set(),cars=[],particles=[],flash=0,combo=0;
let player={col:4,row:8,x:4*TILE,y:8*TILE,inv:0};
const palettes=[['#fb7185','#f43f5e'],['#38bdf8','#0284c7'],['#fbbf24','#f59e0b'],['#a78bfa','#7c3aed'],['#34d399','#059669']];
function laneDirection(row){return row%2?1:-1}function laneSpeed(row){return (42+row*7+round*8)*laneDirection(row)}
function makeCar(row,index,count){const dir=laneDirection(row),gap=SIZE/count,width=TILE*(.72+(index%2)*.2),x=dir>0?index*gap-width:(index+1)*gap;return{x,y:row*TILE+TILE*.19,w:width,h:TILE*.62,v:laneSpeed(row),palette:palettes[(row+index)%palettes.length],label:['GAME','BOX','PLAY','K2'][index%4]}}
function buildTraffic(){cars=[];for(let row=1;row<=7;row++){if(SAFE_ROWS.has(row))continue;const count=3+(row+round)%2;for(let i=0;i<count;i++)cars.push(makeCar(row,i,count))}}
function resetPlayer(){player.col=4;player.row=8;player.x=player.col*TILE;player.y=player.row*TILE;player.inv=1.15}
function startGame(){score=0;round=1;lives=3;goalHits.clear();combo=0;buildTraffic();resetPlayer();running=true;paused=false;hideOverlay();updateHud();last=performance.now();requestAnimationFrame(loop)}
function nextRound(){round++;score+=500+combo*75;combo++;goalHits.clear();buildTraffic();resetPlayer();showBanner(`ROUND ${round} · SPEED UP!`);updateHud()}
function move(dx,dy){if(!running||paused)return;const nc=Math.max(0,Math.min(COLS-1,player.col+dx)),nr=Math.max(0,Math.min(ROWS-1,player.row+dy));if(nc===player.col&&nr===player.row)return;player.col=nc;player.row=nr;player.x=nc*TILE;player.y=nr*TILE;if(dy<0)score+=10;if(nr===0)reachGoal(nc);updateHud()}
function reachGoal(col){let goal=GOALS.reduce((a,b)=>Math.abs(b-col)<Math.abs(a-col)?b:a);if(Math.abs(goal-col)>0){player.row=1;player.y=TILE;return}if(goalHits.has(goal)){showBanner('That bay is already filled!');player.row=1;player.y=TILE;return}goalHits.add(goal);score+=200+round*25;burst((goal+.5)*TILE,TILE*.5,'#fbbf24');showBanner(`${goalHits.size}/5 LOADING BAYS FILLED`);if(goalHits.size===GOALS.length){setTimeout(nextRound,450)}else resetPlayer()}
function hit(){if(player.inv>0)return;lives--;combo=0;flash=.35;burst(player.x+TILE/2,player.y+TILE/2,'#fb7185');updateHud();if(lives<=0){running=false;best=Math.max(best,score);localStorage.boxJumperBest=best;updateHud();showOverlay('Shift Over!',`You scored ${score.toLocaleString()} and reached round ${round}.`, 'Cross Again',startGame)}else{showBanner('CRUNCHED!');resetPlayer()}}
function overlaps(a,b){return a.x+12<b.x+b.w&&a.x+TILE-12>b.x&&a.y+12<b.y+b.h&&a.y+TILE-12>b.y}
function update(dt){if(player.inv>0)player.inv-=dt;if(flash>0)flash-=dt;for(const c of cars){c.x+=c.v*dt;if(c.v>0&&c.x>SIZE+20)c.x=-c.w-20;if(c.v<0&&c.x+c.w<-20)c.x=SIZE+20;if(player.row>0&&!SAFE_ROWS.has(player.row)&&overlaps(player,c))hit()}particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=220*dt;p.life-=dt});particles=particles.filter(p=>p.life>0)}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function draw(){ctx.clearRect(0,0,SIZE,SIZE);for(let r=0;r<ROWS;r++){const y=r*TILE;if(r===0){ctx.fillStyle='#14532d';ctx.fillRect(0,y,SIZE,TILE)}else if(SAFE_ROWS.has(r)){ctx.fillStyle=r===8?'#17354a':'#164e3f';ctx.fillRect(0,y,SIZE,TILE)}else{ctx.fillStyle=r%2?'#202936':'#252f3c';ctx.fillRect(0,y,SIZE,TILE);ctx.strokeStyle='rgba(255,255,255,.17)';ctx.lineWidth=3;ctx.setLineDash([20,18]);ctx.beginPath();ctx.moveTo(0,y+TILE/2);ctx.lineTo(SIZE,y+TILE/2);ctx.stroke();ctx.setLineDash([])}}
for(const g of GOALS){ctx.fillStyle=goalHits.has(g)?'#22c55e':'rgba(255,255,255,.13)';roundRect(g*TILE+8,8,TILE-16,TILE-16,16);ctx.fill();ctx.fillStyle=goalHits.has(g)?'#052e16':'#cbd5e1';ctx.font='bold 22px system-ui';ctx.textAlign='center';ctx.fillText(goalHits.has(g)?'✓':'BAY',(g+.5)*TILE,49)}
for(const c of cars){ctx.save();ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=12;const grad=ctx.createLinearGradient(c.x,c.y,c.x,c.y+c.h);grad.addColorStop(0,c.palette[0]);grad.addColorStop(1,c.palette[1]);ctx.fillStyle=grad;roundRect(c.x,c.y,c.w,c.h,12);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,.22)';ctx.fillRect(c.x+8,c.y+8,c.w-16,8);ctx.fillStyle='#fff';ctx.font='900 15px system-ui';ctx.textAlign='center';ctx.fillText(c.label,c.x+c.w/2,c.y+c.h/2+7);ctx.fillStyle='#020617';for(const wx of [c.x+15,c.x+c.w-15]){ctx.beginPath();ctx.arc(wx,c.y+c.h+3,8,0,Math.PI*2);ctx.fill()}ctx.restore()}
ctx.save();ctx.globalAlpha=player.inv>0&&Math.floor(player.inv*10)%2?0.35:1;ctx.translate(player.x+TILE/2,player.y+TILE/2);ctx.shadowColor='#38bdf8';ctx.shadowBlur=18;ctx.fillStyle='#f8fafc';roundRect(-TILE*.31,-TILE*.31,TILE*.62,TILE*.62,15);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#0f172a';ctx.font='34px system-ui';ctx.textAlign='center';ctx.fillText('🧍',0,13);ctx.restore();for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.s,p.s)}ctx.globalAlpha=1;if(flash>0){ctx.fillStyle=`rgba(244,63,94,${flash})`;ctx.fillRect(0,0,SIZE,SIZE)}}
function burst(x,y,color){for(let i=0;i<20;i++)particles.push({x,y,vx:(Math.random()-.5)*260,vy:(Math.random()-.8)*260,life:.7+Math.random()*.5,s:4+Math.random()*6,color})}
function loop(t){if(!running)return;const dt=Math.min(.033,(t-last)/1000||0);last=t;if(!paused)update(dt);draw();requestAnimationFrame(loop)}
function updateHud(){ui.score.textContent=score.toLocaleString();ui.round.textContent=round;ui.lives.textContent='♥'.repeat(lives)||'—';ui.best.textContent=best.toLocaleString()}
function showBanner(text){ui.banner.textContent=text;ui.banner.classList.add('show');clearTimeout(showBanner.t);showBanner.t=setTimeout(()=>ui.banner.classList.remove('show'),1300)}
function showOverlay(title,text,button,action){ui.title.textContent=title;ui.text.textContent=text;ui.btn.textContent=button;ui.btn.onclick=action;ui.overlay.classList.add('show')}function hideOverlay(){ui.overlay.classList.remove('show')}
function togglePause(){if(!running)return;paused=!paused;ui.pause.textContent=paused?'▶':'Ⅱ';if(paused)showOverlay('Paused','Take a breath. The warehouse will wait.','Resume',()=>{paused=false;ui.pause.textContent='Ⅱ';hideOverlay();last=performance.now()})else hideOverlay()}
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d','p'].includes(k))e.preventDefault();if(k==='p')return togglePause();if(k==='arrowup'||k==='w')move(0,-1);if(k==='arrowdown'||k==='s')move(0,1);if(k==='arrowleft'||k==='a')move(-1,0);if(k==='arrowright'||k==='d')move(1,0)});
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',()=>({up:()=>move(0,-1),down:()=>move(0,1),left:()=>move(-1,0),right:()=>move(1,0)})[b.dataset.dir]()));let sx=0,sy=0;stage.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});stage.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;if(Math.abs(dx)>Math.abs(dy))move(Math.sign(dx),0);else move(0,Math.sign(dy))});ui.pause.onclick=togglePause;ui.btn.onclick=startGame;updateHud();draw();
</script>
</body>
</html>
