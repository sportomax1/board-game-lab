<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Memory Match | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🔍</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .game-tile {
            cursor: pointer;
            perspective: 1000px;
            user-select: none;
            -webkit-user-select: none;
        }
        
        .tile-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        
        .game-tile.flipped .tile-inner {
            transform: rotateY(180deg);
        }
        
        .tile-front, .tile-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.75rem;
            overflow: hidden;
        }
        
        .tile-front {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.1);
            font-size: 1.5rem;
            font-weight: 900;
        }
        
        .tile-back {
            transform: rotateY(180deg);
            background: #ffffff;
            padding: 4px;
        }
        
        .tile-back img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .matched .tile-inner {
            transform: rotateY(180deg) scale(0.92);
            opacity: 0.3;
        }

        .matched .tile-back {
            background: #1e293b;
            filter: grayscale(1);
        }

        @keyframes confetti {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) rotate(360deg); opacity: 0; }
        }
        
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
            animation: confetti 0.8s ease-out forwards;
            z-index: 100;
        }

        .player-card {
            transition: all 0.3s ease;
            opacity: 0.4;
            transform: scale(0.9);
        }

        .player-card.active {
            opacity: 1;
            transform: scale(1);
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
        }

        @keyframes pulse-player {
            0%, 100% { box-shadow: 0 0 0 0px rgba(16, 185, 129, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
        }

        .player-card.active.current {
            animation: pulse-player 2s infinite;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-emerald-500/30">
    <!-- Background Decor -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-emerald-900/20 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[10%] right-[0%] w-[50%] h-[50%] bg-blue-900/10 blur-[120px] rounded-full"></div>
    </div>

    <!-- Setup Screen -->
    <div id="setupScreen" class="fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/80 backdrop-blur-md"></div>
        <div class="glass relative max-w-sm w-full rounded-[2.5rem] p-8 shadow-2xl border-t border-white/20">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-emerald-500/20 rounded-3xl flex items-center justify-center mx-auto mb-4 border border-emerald-500/30">
                    <span class="text-4xl">🔍</span>
                </div>
                <h1 class="text-3xl font-black tracking-tight text-white mb-2 italic uppercase">Memory <span class="text-emerald-400">Match</span></h1>
                <p class="text-slate-400 text-sm font-medium">Test your brain with BGG games</p>
            </div>

            <div class="space-y-5">
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">BGG Username</label>
                    <input type="text" id="usernameInput" value="sportomax" class="w-full bg-slate-900/50 border border-white/10 rounded-2xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500/50 transition-all font-medium">
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Difficulty (Pairs)</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="setGameCount(8, this)" class="diff-btn py-2 rounded-xl border border-white/10 text-xs font-bold transition-all bg-white/5">8</button>
                        <button onclick="setGameCount(12, this)" class="diff-btn py-2 rounded-xl border border-emerald-500 bg-emerald-500 text-white font-bold">12</button>
                        <button onclick="setGameCount(18, this)" class="diff-btn py-2 rounded-xl border border-white/10 text-xs font-bold transition-all bg-white/5">18</button>
                    </div>
                    <input type="hidden" id="gameCountInput" value="12">
                </div>

                <div class="space-y-3">
                    <div class="flex items-center justify-between bg-white/5 p-3 rounded-2xl border border-white/10">
                        <span class="text-xs font-bold text-white uppercase tracking-tighter">Two Player Mode</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="twoPlayerMode" class="sr-only peer" checked>
                            <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
                        </label>
                    </div>
                    <div class="flex items-center justify-between bg-white/5 p-3 rounded-2xl border border-white/10">
                        <span class="text-xs font-bold text-white uppercase tracking-tighter">Exclude Expansions</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="excludeExpansions" class="sr-only peer" checked>
                            <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
                        </label>
                    </div>
                </div>

                <button id="startBtn" onclick="startGame()" class="w-full bg-emerald-500 text-white py-4 rounded-2xl font-black text-lg uppercase tracking-tight hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2 mt-4 shadow-xl shadow-emerald-500/20">
                    <span id="btnText">Start Game</span>
                    <div id="btnSpinner" class="hidden w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                </button>
            </div>
            <p id="setupStatus" class="mt-4 text-center text-[10px] font-bold text-slate-500 uppercase tracking-widest hidden"></p>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="hidden relative z-10 flex-1 flex flex-col pb-safe max-w-5xl mx-auto w-full">
        <!-- Header -->
        <header class="p-6 flex flex-col md:flex-row md:items-center justify-between gap-6 border-b border-white/5">
            <div class="flex flex-col">
                <h1 class="text-2xl font-black italic uppercase tracking-tighter leading-none text-white">Memory <span class="text-emerald-400">Match</span></h1>
                <div class="flex gap-4 mt-2">
                    <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest"><span class="text-emerald-400" id="matchesDisplay">0</span> / <span id="totalMatchesDisplay">0</span> Pairs</div>
                    <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest"><span class="text-emerald-400" id="flipsDisplay">0</span> Flips</div>
                    <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest"><span class="text-emerald-400" id="timeDisplay">0s</span> Time</div>
                </div>
            </div>

            <!-- Two Player Stats -->
            <div id="twoPlayerStats" class="hidden flex gap-3">
                <div id="player1Card" class="player-card glass px-6 py-2 rounded-2xl border border-blue-500/30 flex flex-col items-center">
                    <span class="text-[8px] font-black uppercase tracking-widest text-blue-400 mb-1">P1</span>
                    <span id="player1Score" class="text-xl font-black text-white">0</span>
                </div>
                <div id="player2Card" class="player-card glass px-6 py-2 rounded-2xl border border-rose-500/30 flex flex-col items-center">
                    <span class="text-[8px] font-black uppercase tracking-widest text-rose-400 mb-1">P2</span>
                    <span id="player2Score" class="text-xl font-black text-white">0</span>
                </div>
            </div>

            <button onclick="location.reload()" class="glass px-6 py-2 rounded-2xl border border-white/10 text-[10px] font-black uppercase tracking-widest hover:bg-white/10 transition-all">Restart</button>
        </header>

        <!-- Grid Container -->
        <div class="flex-1 p-4 md:p-6 overflow-y-auto custom-scrollbar flex items-center justify-center">
            <div id="gameGrid" class="grid gap-3 md:gap-4 w-full h-fit py-10"></div>
        </div>
    </div>

    <!-- Win Modal -->
    <div id="winModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-xl"></div>
        <div class="glass relative max-w-sm w-full rounded-[2.5rem] p-8 shadow-2xl border-t border-white/20 text-center">
            <div class="text-5xl mb-6">🏆</div>
            <h2 id="winTitle" class="text-3xl font-black italic uppercase tracking-tighter mb-2 text-white">Great <span class="text-emerald-400">Memory</span></h2>
            <p id="winSub" class="text-slate-400 text-sm font-medium mb-8">You found all pairs in <span id="finalTime" class="text-white font-bold">0</span>s!</p>
            
            <div class="grid grid-cols-2 gap-3 mb-6">
                <div class="bg-white/5 rounded-2xl p-3 border border-white/5">
                    <div id="finalFlips" class="text-xl font-black text-white">0</div>
                    <div class="text-[8px] font-bold text-slate-500 uppercase tracking-widest">Total Flips</div>
                </div>
                <div class="bg-white/5 rounded-2xl p-3 border border-white/5">
                    <div id="finalScore" class="text-xl font-black text-white">0</div>
                    <div class="text-[8px] font-bold text-slate-500 uppercase tracking-widest">Pairs Found</div>
                </div>
            </div>

            <div class="space-y-3">
                <button onclick="location.reload()" class="w-full bg-emerald-500 text-white py-4 rounded-2xl font-black text-sm uppercase tracking-widest hover:bg-emerald-400 transition-colors">Play Again</button>
                <button onclick="window.location.href='index.html'" class="w-full bg-white/5 text-slate-400 py-3 rounded-2xl font-black text-[10px] uppercase tracking-widest hover:bg-white/10 transition-all">Exit to Apps</button>
            </div>
        </div>
    </div>

    <script>
        let collection = [];
        let gameCount = 12;
        let gamePairs = [];
        let flipped = [];
        let matched = [];
        let flips = 0;
        let matches = 0;
        let gameStartTime = 0;
        let timerInterval = null;
        let currentPlayer = 1;
        let player1Score = 0;
        let player2Score = 0;
        let twoPlayerMode = true;
        const IMAGE_PROXY = '/api/image-proxy?url=';

        function setGameCount(count, btn) {
            gameCount = count;
            document.getElementById('gameCountInput').value = count;
            document.querySelectorAll('.diff-btn').forEach(b => {
                b.classList.remove('bg-emerald-500', 'border-emerald-500', 'text-white', 'font-bold');
                b.classList.add('bg-white/5', 'text-slate-400');
            });
            btn.classList.add('bg-emerald-500', 'border-emerald-500', 'text-white', 'font-bold');
            btn.classList.remove('bg-white/5', 'text-slate-400');
        }

        function createConfetti(x, y) {
            const colors = ['#10b981', '#3b82f6', '#f59e0b', '#ef4444', '#8b5cf6'];
            for (let i = 0; i < 12; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = x + 'px';
                confetti.style.top = y + 'px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
                confetti.style.setProperty('--ty', (Math.random() - 0.5) * 200 - 100 + 'px');
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 800);
            }
        }

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        async function fetchWithRetry(url, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                const response = await fetch(url);
                if (response.status === 202) {
                    await new Promise(r => setTimeout(r, 2000 * (i + 1)));
                    continue;
                }
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.text();
            }
            throw new Error('Exceeded fetch attempts');
        }

        async function startGame() {
            const username = document.getElementById('usernameInput').value.trim();
            if (!username) return alert('Enter a BGG username');

            const startBtn = document.getElementById('startBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const statusEl = document.getElementById('setupStatus');

            startBtn.disabled = true;
            btnText.textContent = "Loading...";
            btnSpinner.classList.remove('hidden');
            statusEl.textContent = "Scanning collection...";
            statusEl.classList.remove('hidden');

            try {
                const xmlText = await fetchWithRetry(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1`);
                const parser = new DOMParser();
                const xml = parser.parseFromString(xmlText, 'text/xml');
                
                if (xml.querySelector('errors error')) throw new Error('User not found or private collection');

                let items = Array.from(xml.querySelectorAll('item'));
                if (document.getElementById('excludeExpansions').checked) {
                    items = items.filter(item => item.getAttribute('subtype') !== 'boardgameexpansion');
                }

                let validGames = items
                    .filter(item => item.querySelector('thumbnail')?.textContent)
                    .map(item => ({
                        id: item.getAttribute('objectid'),
                        name: item.querySelector('name').textContent,
                        thumbnail: item.querySelector('thumbnail').textContent
                    }));

                if (validGames.length < 2) throw new Error('Need at least 2 games with images');

                validGames = shuffleArray(validGames).slice(0, gameCount);
                gameCount = validGames.length; // adjust if fewer games found

                gamePairs = [];
                validGames.forEach((game, idx) => {
                    gamePairs.push({ ...game, pairId: idx });
                    gamePairs.push({ ...game, pairId: idx });
                });

                gamePairs = shuffleArray(gamePairs);
                flipped = new Array(gamePairs.length).fill(false);
                matched = new Array(gamePairs.length).fill(false);
                
                twoPlayerMode = document.getElementById('twoPlayerMode').checked;
                if (twoPlayerMode) {
                    document.getElementById('twoPlayerStats').classList.remove('hidden');
                    updatePlayerIndicator();
                }

                document.getElementById('setupScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.remove('hidden');
                document.getElementById('totalMatchesDisplay').textContent = gameCount;

                renderGameBoard();
                gameStartTime = Date.now();
                startTimer();
            } catch (error) {
                alert('Error: ' + error.message);
                startBtn.disabled = false;
                btnText.textContent = "Start Game";
                btnSpinner.classList.add('hidden');
                statusEl.classList.add('hidden');
            }
        }

        function renderGameBoard() {
            const grid = document.getElementById('gameGrid');
            const total = gamePairs.length;
            
            // Intelligent column count based on total tiles
            let cols = 4;
            if (total >= 36) cols = 6;
            else if (total >= 24) cols = 5;
            
            grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
            grid.className = `grid gap-2 md:gap-3 w-full max-w-[500px] mx-auto`;
            
            grid.innerHTML = gamePairs.map((game, idx) => `
                <div class="game-tile w-full aspect-square" id="tile-${idx}" onclick="flipTile(${idx})">
                    <div class="tile-inner">
                        <div class="tile-front">🔍</div>
                        <div class="tile-back">
                            <img src="${IMAGE_PROXY}${encodeURIComponent(game.thumbnail)}" alt="${game.name}" loading="lazy" onerror="this.src='https://placehold.co/100x100?text=No+Img'">
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function flipTile(idx) {
            if (flipped[idx] || matched[idx]) return;
            
            const flippedIndices = flipped.map((f, i) => f ? i : -1).filter(i => i !== -1);
            if (flippedIndices.length >= 2) return;

            flipped[idx] = true;
            flips++;
            document.getElementById('flipsDisplay').textContent = flips;
            document.getElementById(`tile-${idx}`).classList.add('flipped');

            const currentFlipped = flipped.map((f, i) => f ? i : -1).filter(i => i !== -1);

            if (currentFlipped.length === 2) {
                const [idx1, idx2] = currentFlipped;
                if (gamePairs[idx1].pairId === gamePairs[idx2].pairId) {
                    matched[idx1] = true;
                    matched[idx2] = true;
                    matches++;
                    document.getElementById('matchesDisplay').textContent = matches;
                    
                    const t1 = document.getElementById(`tile-${idx1}`);
                    const t2 = document.getElementById(`tile-${idx2}`);
                    t1.classList.add('matched');
                    t2.classList.add('matched');
                    
                    const r1 = t1.getBoundingClientRect();
                    const r2 = t2.getBoundingClientRect();
                    createConfetti(r1.left + r1.width/2, r1.top + r1.height/2);
                    createConfetti(r2.left + r2.width/2, r2.top + r2.height/2);

                    if (twoPlayerMode) {
                        if (currentPlayer === 1) {
                            player1Score++;
                            document.getElementById('player1Score').textContent = player1Score;
                        } else {
                            player2Score++;
                            document.getElementById('player2Score').textContent = player2Score;
                        }
                    }

                    flipped[idx1] = false;
                    flipped[idx2] = false;

                    if (matches === gameCount) setTimeout(endGame, 800);
                } else {
                    setTimeout(() => {
                        document.getElementById(`tile-${idx1}`).classList.remove('flipped');
                        document.getElementById(`tile-${idx2}`).classList.remove('flipped');
                        flipped[idx1] = false;
                        flipped[idx2] = false;
                        if (twoPlayerMode) {
                            currentPlayer = currentPlayer === 1 ? 2 : 1;
                            updatePlayerIndicator();
                        }
                    }, 1000);
                }
            }
        }

        function updatePlayerIndicator() {
            document.getElementById('player1Card').className = `player-card glass px-6 py-2 rounded-2xl border flex flex-col items-center ${currentPlayer === 1 ? 'active current border-blue-500' : 'border-blue-500/10'}`;
            document.getElementById('player2Card').className = `player-card glass px-6 py-2 rounded-2xl border flex flex-col items-center ${currentPlayer === 2 ? 'active current border-rose-500' : 'border-rose-500/10'}`;
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - gameStartTime) / 1000);
                document.getElementById('timeDisplay').textContent = elapsed + 's';
            }, 1000);
        }

        function endGame() {
            clearInterval(timerInterval);
            const elapsed = Math.floor((Date.now() - gameStartTime) / 1000);
            document.getElementById('finalTime').textContent = elapsed;
            document.getElementById('finalFlips').textContent = flips;
            document.getElementById('finalScore').textContent = matches;

            if (twoPlayerMode) {
                let winText = '';
                if (player1Score > player2Score) winText = 'Player 1 <span class="text-blue-400">Wins!</span>';
                else if (player2Score > player1Score) winText = 'Player 2 <span class="text-rose-400">Wins!</span>';
                else winText = 'It\'s a <span class="text-slate-400">Tie!</span>';
                document.getElementById('winTitle').innerHTML = winText;
            }

            document.getElementById('winModal').classList.remove('hidden');
        }
    </script>
    <script type="module" src="../analytics-init.js"></script>
</body>
</html>
