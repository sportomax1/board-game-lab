<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🎰 Pro Board Game Slots</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23ff6b9d' width='100' height='100'/><text x='50' y='70' font-size='60' fill='white' text-anchor='middle' font-family='sans-serif' font-weight='bold'>🎰</text></svg>">
    <style>
        :root {
            --primary: #8a2be2;
            --accent: #00f2fe;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            height: 100vh;
            color: white;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* App Container */
        #app {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding-top: var(--safe-top);
            padding-bottom: calc(var(--safe-bottom) + 80px);
        }

        /* Navigation Tabs */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding-bottom: var(--safe-bottom);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }

        .tab-btn {
            flex: 1;
            border: none;
            background: none;
            color: #94a3b8;
            padding: 12px 0;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: color 0.3s;
        }

        .tab-btn.active {
            color: var(--accent);
        }

        .tab-btn svg {
            width: 24px;
            height: 24px;
        }

        /* View Management */
        .view {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .view.active {
            display: flex;
            flex-direction: column;
        }

        /* Header Area */
        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Main Game Area */
        .game-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        .slots-machine {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .reels-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            background: #000;
            border-radius: 20px;
            padding: 12px;
            overflow: hidden;
            border: 2px solid #334155;
        }

        .reel-slot {
            aspect-ratio: 1/1.4;
            background: #1e293b;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .reel-slot img {
            width: 85%;
            height: 85%;
            object-fit: contain;
            border-radius: 8px;
            transition: transform 0.1s;
        }

        .reel-slot span {
            font-size: 40px;
        }

        /* Dynamic Status Bar */
        #statusBar {
            background: rgba(0, 242, 254, 0.1);
            color: var(--accent);
            text-align: center;
            padding: 12px;
            border-radius: 16px;
            margin-top: 20px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid rgba(0, 242, 254, 0.2);
        }

        /* Controls */
        .main-controls {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .spin-btn {
            background: linear-gradient(135deg, var(--primary), #4f46e5);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 20px;
            font-size: 20px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 20px -5px rgba(138, 43, 226, 0.5);
            transition: transform 0.1s, opacity 0.3s;
        }

        .spin-btn:active { transform: scale(0.96); }
        .spin-btn:disabled { opacity: 0.5; filter: grayscale(1); }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 16px;
            text-align: center;
        }

        .stat-card span {
            display: block;
            font-size: 10px;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .stat-card b {
            font-size: 18px;
            color: white;
        }

        /* Settings UI */
        .settings-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 16px;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 8px;
            padding-left: 4px;
        }

        input[type="text"] {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        .difficulty-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .diff-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            padding: 12px 5px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            transition: 0.3s;
        }

        .diff-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .load-btn {
            width: 100%;
            background: white;
            color: black;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-weight: 700;
            margin-top: 10px;
        }

        /* Animations */
        @keyframes blurSpin {
            0% { filter: blur(0px); transform: translateY(0); }
            50% { filter: blur(8px); transform: translateY(10px); }
            100% { filter: blur(0px); transform: translateY(0); }
        }

        .spinning {
            animation: blurSpin 0.15s infinite linear;
        }

        .jackpot-anim {
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            from { box-shadow: 0 0 10px var(--accent); }
            to { box-shadow: 0 0 30px var(--accent); }
        }

        /* Modal / Results Overlay */
        #results {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            color: black;
            padding: 30px;
            border-radius: 30px;
            z-index: 2000;
            width: 80%;
            text-align: center;
            box-shadow: 0 0 100px rgba(0,0,0,1);
        }

        #results h2 { margin-bottom: 10px; }
        #results p { font-size: 18px; margin-bottom: 20px; }
        .close-results {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: bold;
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1999;
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- Play View -->
        <section id="playView" class="view active">
            <div class="header">
                <h1>Game Slots</h1>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <span>Total Spins</span>
                    <b id="totalSpins">0</b>
                </div>
                <div class="stat-card">
                    <span>Jackpots</span>
                    <b id="totalJackpots">0</b>
                </div>
            </div>

            <div class="game-wrapper">
                <div class="slots-machine" id="machine">
                    <div class="reels-container" id="reels">
                        <div class="reel-slot" id="slot-0"><span>?</span></div>
                        <div class="reel-slot" id="slot-1"><span>?</span></div>
                        <div class="reel-slot" id="slot-2"><span>?</span></div>
                    </div>
                </div>

                <div id="statusBar">Ready to play</div>

                <div class="main-controls">
                    <button id="spinBtn" class="spin-btn">Spin</button>
                </div>
            </div>
        </section>

        <!-- Settings View -->
        <section id="settingsView" class="view">
            <div class="header">
                <h1>Settings</h1>
            </div>

            <div class="settings-card">
                <div class="input-group">
                    <label>BGG Username</label>
                    <input type="text" id="usernameInput" placeholder="Enter BGG Username" spellcheck="false">
                    <button id="loadBtn" class="load-btn">Load Collection</button>
                </div>

                <div class="input-group">
                    <label>Difficulty</label>
                    <div class="difficulty-grid">
                        <button class="diff-btn" onclick="setDifficulty(0)">EASY</button>
                        <button class="diff-btn active" onclick="setDifficulty(1)">MED</button>
                        <button class="diff-btn" onclick="setDifficulty(2)">HARD</button>
                    </div>
                </div>
                
                <button id="resetBtn" style="width:100%; background:transparent; border:1px solid #ef4444; color:#ef4444; padding:14px; border-radius:12px; font-weight:600;">Reset Game Data</button>
            </div>
            
            <p style="text-align: center; color: #64748b; font-size: 12px;">Data provided by BoardGameGeek API</p>
        </section>
    </div>

    <!-- Navigation Bar -->
    <nav class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('play')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M12 12h.01"/></svg>
            Play
        </button>
        <button class="tab-btn" onclick="switchTab('settings')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.1a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
            Settings
        </button>
    </nav>

    <!-- Results Modal -->
    <div class="overlay" id="overlay"></div>
    <div id="results">
        <h2 id="resultsTitle">✨ JACKPOT ✨</h2>
        <p id="resultsGame">Game Name Here</p>
        <button class="close-results" onclick="closeResults()">Awesome!</button>
    </div>

    <script>
        // --- State Management ---
        let boardGames = [];
        let spinCount = 0;
        let matchCount = 0;
        let currentSlots = [null, null, null];
        let currentDifficulty = 1; 

        // --- DOM Elements ---
        const spinBtn = document.getElementById('spinBtn');
        const resetBtn = document.getElementById('resetBtn');
        const loadBtn = document.getElementById('loadBtn');
        const usernameInput = document.getElementById('usernameInput');
        const statusBar = document.getElementById('statusBar');
        const totalSpinsEl = document.getElementById('totalSpins');
        const totalJackpotsEl = document.getElementById('totalJackpots');
        const machineEl = document.getElementById('machine');

        // --- View Logic ---
        function switchTab(tab) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            if(tab === 'play') {
                document.getElementById('playView').classList.add('active');
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
            } else {
                document.getElementById('settingsView').classList.add('active');
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
            }
        }

        // --- Core API Logic (Preserved exactly) ---
        async function loadCollection(username) {
            if (!username) return;
            loadBtn.disabled = true;
            loadBtn.textContent = 'Fetching...';
            statusBar.textContent = `🔍 Contacting BGG for ${username}...`;
            
            try {
                const response = await fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1`);
                if (!response.ok) throw new Error('Network error');
                const text = await response.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, 'text/xml');
                
                const message = xml.querySelector('message');
                if (message) {
                    statusBar.textContent = '⏳ BGG is generating your list, wait a few seconds and try again...';
                    loadBtn.disabled = false;
                    loadBtn.textContent = 'Retry Loading';
                    return;
                }

                const items = xml.querySelectorAll('item');
                boardGames = Array.from(items).map(item => ({
                    id: item.getAttribute('objectid'),
                    name: item.querySelector('name').textContent,
                    image: item.querySelector('image') ? item.querySelector('image').textContent : null,
                    thumbnail: item.querySelector('thumbnail') ? item.querySelector('thumbnail').textContent : null
                }));

                if (boardGames.length < 3) {
                    statusBar.textContent = '❌ Need at least 3 games in collection!';
                } else {
                    statusBar.textContent = `🎮 Loaded ${boardGames.length} games. Good luck!`;
                    spinBtn.disabled = false;
                    switchTab('play');
                }
            } catch (err) {
                statusBar.textContent = '❌ Error loading collection. Check username.';
            } finally {
                loadBtn.disabled = false;
                loadBtn.textContent = 'Load Collection';
            }
        }

        function renderSlots(games, isSpinning = false) {
            const slots = [0, 1, 2];
            slots.forEach(i => {
                const slot = document.getElementById(`slot-${i}`);
                slot.innerHTML = '';
                
                if (isSpinning) {
                    slot.classList.add('spinning');
                    slot.innerHTML = '<span>🎲</span>';
                } else {
                    slot.classList.remove('spinning');
                    const game = games[i];
                    if (game && (game.image || game.thumbnail)) {
                        const img = document.createElement('img');
                        img.src = game.thumbnail || game.image;
                        slot.appendChild(img);
                    } else {
                        slot.innerHTML = '<span>❓</span>';
                    }
                }
            });
        }

        function spin() {
            if (boardGames.length === 0) return;
            
            machineEl.classList.remove('jackpot-anim');
            spinBtn.disabled = true;
            renderSlots([], true);
            statusBar.textContent = '🎰 Spinning...';

            setTimeout(() => {
                const results = [];
                const pool = [...boardGames];
                
                // Difficulty Logic (Preserved)
                if (currentDifficulty === 0) { 
                    if (Math.random() < 0.15) {
                        const win = pool[Math.floor(Math.random() * pool.length)];
                        results.push(win, win, win);
                    }
                }

                if (results.length === 0) {
                    for (let i = 0; i < 3; i++) {
                        results.push(pool[Math.floor(Math.random() * pool.length)]);
                    }
                }

                currentSlots = results;
                renderSlots(results);
                checkWin();
                spinBtn.disabled = false;
            }, 800);
        }

        function checkWin() {
            spinCount++;
            const isMatch = currentSlots[0].id === currentSlots[1].id && currentSlots[1].id === currentSlots[2].id;
            
            if (isMatch) {
                matchCount++;
                machineEl.classList.add('jackpot-anim');
                showWinModal(currentSlots[0].name);
                statusBar.textContent = '✨ JACKPOT! ✨';
            } else {
                statusBar.textContent = '🎲 Try again!';
            }
            
            totalSpinsEl.textContent = spinCount;
            totalJackpotsEl.textContent = matchCount;
        }

        function showWinModal(name) {
            document.getElementById('resultsGame').textContent = name;
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('results').style.display = 'block';
        }

        function closeResults() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('results').style.display = 'none';
        }

        function setDifficulty(level) {
            currentDifficulty = level;
            document.querySelectorAll('.diff-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === level);
            });
        }

        function reset() {
            spinCount = 0;
            matchCount = 0;
            totalSpinsEl.textContent = 0;
            totalJackpotsEl.textContent = 0;
            renderSlots([null, null, null]);
            statusBar.textContent = 'Ready to play';
        }

        // --- Init ---
        spinBtn.addEventListener('click', spin);
        resetBtn.addEventListener('click', reset);
        loadBtn.addEventListener('click', () => loadCollection(usernameInput.value));
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loadCollection(usernameInput.value);
        });

        // Default username
        usernameInput.value = 'sportomax';
        spinBtn.disabled = true;
    </script>
</body>
</html>
