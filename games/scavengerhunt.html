<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Board Game Hunt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; -webkit-user-select: none; user-select: none; }
        .safe-area-inset { padding-top: max(1rem, env(safe-area-inset-top)); }
    </style>
</head>
<body class="bg-black min-h-screen">

    <!-- ==================== SETUP SCREEN ==================== -->
    <div id="setupScreen" class="fixed inset-0 bg-gradient-to-br from-green-500 to-emerald-600 z-50 flex items-end sm:items-center justify-center p-4">
        <div class="bg-white rounded-t-3xl sm:rounded-lg shadow-2xl p-6 sm:p-8 max-w-md w-full sm:max-h-screen overflow-y-auto">
            <h1 class="text-3xl font-bold text-gray-900 mb-1 text-center">🔍 Hunt</h1>
            <p class="text-gray-500 text-center mb-6 text-sm">Find games in your collection</p>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">BGG Username</label>
                <input type="text" id="bggUsernameInput" class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-green-500 outline-none text-base" placeholder="BGG Username" value="sportomax">
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2"><span id="sliderLabel">⏳ Max Time (seconds):</span> <span id="timeDisplayLabel">60</span><span id="sliderUnit">s</span></label>
                <input type="range" id="roundTimeSlider" min="30" max="900" step="30" value="60" class="w-full h-2 bg-gray-300 rounded-lg appearance-none cursor-pointer accent-green-600">
                <div class="text-xs text-gray-500 mt-1 flex justify-between">
                    <span id="sliderMin">30s</span>
                    <span id="sliderMax">900s</span>
                </div>
            </div>

            <div class="bg-gray-50 rounded-lg p-4 mb-6 space-y-3">
                <div class="flex items-center gap-3">
                    <input type="radio" id="modeSolo" name="mode" value="solo" checked class="w-4 h-4">
                    <label for="modeSolo" class="text-sm font-medium text-gray-700">Solo</label>
                </div>
                <div class="flex items-center gap-3">
                    <input type="radio" id="modeCompete" name="mode" value="compete" class="w-4 h-4">
                    <label for="modeCompete" class="text-sm font-medium text-gray-700">Competition</label>
                </div>
            </div>

            <!-- Time Tracking Mode -->
            <div id="timeTrackingMode" class="hidden bg-purple-50 rounded-lg p-4 mb-6 space-y-2 border border-purple-200">
                <label class="block text-sm font-medium text-gray-700 mb-2">Time Tracking</label>
                <div class="flex items-center gap-3">
                    <input type="radio" id="timePerItem" name="timeTracking" value="per-item" checked class="w-4 h-4">
                    <label for="timePerItem" class="text-sm text-gray-700">Per Game (reset each round)</label>
                </div>
                <div class="flex items-center gap-3">
                    <input type="radio" id="timeSession" name="timeTracking" value="session" class="w-4 h-4">
                    <label for="timeSession" class="text-sm text-gray-700">Session (running total)</label>
                </div>
            </div>

            <!-- Timer Mode -->
            <div class="bg-orange-50 rounded-lg p-4 mb-6 space-y-2 border border-orange-200">
                <label class="block text-sm font-medium text-gray-700 mb-2">⏱️ Timer Mode</label>
                <div class="flex items-center gap-3">
                    <input type="radio" id="timerCountdown" name="timerMode" value="countdown" checked class="w-4 h-4">
                    <label for="timerCountdown" class="text-sm text-gray-700">⏳ Countdown (pressure!)</label>
                </div>
                <div class="flex items-center gap-3">
                    <input type="radio" id="timerStopwatch" name="timerMode" value="stopwatch" class="w-4 h-4">
                    <label for="timerStopwatch" class="text-sm text-gray-700">⏱️ Stopwatch (challenge yourself)</label>
                </div>
            </div>

            <!-- Competition Options (shown when compete mode selected) -->
            <div id="competitionOptions" class="hidden bg-blue-50 rounded-lg p-4 mb-6 space-y-3 border border-blue-200">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Number of Players</label>
                    <select id="playerCount" class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="2">2 Players</option>
                        <option value="3">3 Players</option>
                        <option value="4">4 Players</option>
                    </select>
                </div>

                <div id="playerNamesContainer">
                    <!-- Dynamically populated -->
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Play Style</label>
                    <select id="playStyle" class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="alternating">Alternating Rounds</option>
                        <option value="side-by-side">Side by Side (2P)</option>
                        <option value="session">Full Session (All Games)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Games to Play</label>
                    <input type="number" id="gamesToPlay" class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none" value="10" min="1" max="100">
                </div>
            </div>
            
            <button onclick="startHunt()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold text-lg hover:bg-green-700 transition shadow-lg">
                Start Hunt
            </button>
        </div>
    </div>

    <!-- ==================== LOADING SCREEN ==================== -->
    <div id="loadingScreen" class="fixed inset-0 bg-white z-40 flex flex-col items-center justify-center hidden">
        <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-green-600 mb-4"></div>
        <h2 class="text-xl font-bold text-gray-800">Loading your collection...</h2>
        <p id="loadingStatus" class="text-gray-500 mt-2">Finding games to hunt</p>
    </div>

    <!-- ==================== HUNT GAME (SOLO/2P SIDE-BY-SIDE) ==================== -->
    <div id="gameScreen" class="hidden fixed inset-0 bg-black z-30 flex flex-col overflow-hidden">
        <!-- Header Bar -->
        <div class="bg-gray-900 text-white px-4 py-3 flex justify-between items-center border-b border-gray-700 text-sm">
            <div id="headerInfo">Hunt</div>
            <div class="flex gap-2">
                <button id="pauseButton" onclick="togglePause()" class="px-3 py-1 bg-yellow-600 hover:bg-yellow-700 rounded font-bold text-xs">⏸️ Pause</button>
                <button onclick="endGame()" class="px-3 py-1 bg-red-600 hover:bg-red-700 rounded font-bold text-xs">Exit</button>
            </div>
        </div>

        <!-- For Solo / Alternating -->
        <div id="soloGameArea" class="flex-1 flex flex-col items-center justify-center px-4 overflow-hidden">
            <!-- Game Image (Full height) -->
            <div id="gameImage" class="w-full h-1/2 bg-gray-800 flex items-center justify-center rounded-lg mb-3 overflow-hidden">
                <div class="text-gray-500">Loading...</div>
            </div>

            <!-- Game Name -->
            <h2 id="gameName" class="text-2xl sm:text-3xl font-bold text-white text-center mb-4 line-clamp-2">Searching...</h2>

            <!-- Timer (Large) -->
            <div class="bg-yellow-500 rounded-full w-32 h-32 flex items-center justify-center mb-4 shadow-2xl border-4 border-yellow-600">
                <div class="text-6xl font-bold text-white font-mono" id="timerDisplay">00</div>
            </div>

            <!-- Buttons -->
            <div class="flex gap-3 w-full">
                <button onclick="skipGame()" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white py-4 rounded-lg font-bold text-xl transition active:scale-95">
                    Skip
                </button>
                <button onclick="foundGame()" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-4 rounded-lg font-bold text-xl transition active:scale-95">
                    Found!
                </button>
            </div>

            <!-- Current Player (Alternating) -->
            <div id="currentPlayerDisplay" class="mt-4 text-white text-center text-sm hidden">
                <div id="currentPlayerName" class="text-lg font-bold"></div>
                <div class="text-xs text-gray-400">Tap found or skip</div>
            </div>
        </div>

        <!-- For 2P Side-by-Side -->
        <div id="sideBySideArea" class="hidden flex-1 grid grid-cols-2 gap-2 p-2 overflow-hidden">
            <!-- Player 1 -->
            <div class="flex flex-col bg-gray-900 rounded-lg p-3 border-2 border-blue-500">
                <div class="text-blue-300 text-xs font-bold mb-2" id="p1Name">Player 1</div>
                <div id="p1Image" class="flex-1 bg-gray-800 rounded mb-2 flex items-center justify-center text-gray-600 overflow-hidden">
                    <img id="p1GameImage" src="" alt="" class="w-full h-full object-contain">
                </div>
                <div id="p1GameName" class="text-white text-sm font-bold text-center line-clamp-2 mb-2">Game</div>
                <div id="p1Timer" class="text-3xl font-bold text-yellow-400 text-center font-mono mb-2">00</div>
                <div class="flex gap-2">
                    <button onclick="skipGameP1()" class="flex-1 bg-gray-600 text-white py-2 rounded text-xs font-bold active:scale-95">Skip</button>
                    <button onclick="foundGameP1()" class="flex-1 bg-green-600 text-white py-2 rounded text-xs font-bold active:scale-95">✓</button>
                </div>
            </div>

            <!-- Player 2 -->
            <div class="flex flex-col bg-gray-900 rounded-lg p-3 border-2 border-pink-500">
                <div class="text-pink-300 text-xs font-bold mb-2" id="p2Name">Player 2</div>
                <div id="p2Image" class="flex-1 bg-gray-800 rounded mb-2 flex items-center justify-center text-gray-600 overflow-hidden">
                    <img id="p2GameImage" src="" alt="" class="w-full h-full object-contain">
                </div>
                <div id="p2GameName" class="text-white text-sm font-bold text-center line-clamp-2 mb-2">Game</div>
                <div id="p2Timer" class="text-3xl font-bold text-yellow-400 text-center font-mono mb-2">00</div>
                <div class="flex gap-2">
                    <button onclick="skipGameP2()" class="flex-1 bg-gray-600 text-white py-2 rounded text-xs font-bold active:scale-95">Skip</button>
                    <button onclick="foundGameP2()" class="flex-1 bg-green-600 text-white py-2 rounded text-xs font-bold active:scale-95">✓</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== PAUSE SCREEN ==================== -->
    <div id="pauseScreen" class="hidden fixed inset-0 bg-black/80 z-40 flex items-center justify-center p-4">
        <div class="bg-gray-900 rounded-2xl p-8 max-w-sm w-full border-2 border-yellow-500">
            <h2 class="text-4xl font-bold text-white text-center mb-6">⏸️ PAUSED</h2>
            <div class="text-center mb-6">
                <div id="pausedTimeDisplay" class="text-2xl font-bold text-yellow-400 mb-2">00:00</div>
                <div class="text-gray-400 text-sm">Session paused</div>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="togglePause()" class="px-4 py-3 bg-green-600 hover:bg-green-700 text-white rounded-lg font-bold">
                    ▶️ Resume
                </button>
                <button onclick="endGame()" class="px-4 py-3 bg-red-600 hover:bg-red-700 text-white rounded-lg font-bold">
                    Exit Hunt
                </button>
            </div>
        </div>
    </div>

    <!-- ==================== RESULTS SCREEN ==================== -->
    <div id="resultsScreen" class="hidden fixed inset-0 bg-white z-40 overflow-y-auto">
        <div class="max-w-2xl mx-auto p-4 py-6 sm:py-8">
            <h1 class="text-4xl font-bold text-center mb-2 text-gray-900">🎉 Hunt Complete!</h1>
            <p class="text-center text-gray-600 mb-6">Here's your performance</p>

            <!-- Stats -->
            <div id="statsDisplay" class="bg-gradient-to-r from-green-100 to-emerald-100 rounded-lg p-6 mb-6">
                <!-- Populated by JS -->
            </div>

            <!-- Results by Player (Competition) -->
            <div id="playerResultsContainer" class="hidden mb-8">
                <h2 class="text-2xl font-bold mb-4 text-gray-900">🏆 Final Standings</h2>
                <div id="playerResultsList" class="space-y-3">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- Found Games -->
            <div class="mb-6">
                <h2 class="text-xl font-bold mb-3 text-gray-900">✅ Games Found</h2>
                <div id="foundGamesList" class="space-y-2 text-sm">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- Buttons -->
            <div class="flex gap-3">
                <button onclick="playAgain()" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-3 rounded-lg font-bold">
                    Play Again
                </button>
                <button onclick="goToSetup()" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white py-3 rounded-lg font-bold">
                    Back
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==================== STATE ====================
        let allGames = [];
        let gameMode = 'solo';
        let playStyle = 'alternating';
        let roundTime = 60; // seconds
        let timeRemaining = 60;
        let timerInterval = null;
        let currentGameIndex = 0;
        let gamesToPlayTotal = 10;

        // Solo tracking
        let foundGames = [];
        let skippedGames = [];
        let scores = {};

        // Competition tracking
        let players = [];
        let currentPlayerIndex = 0;
        let playerScores = {};
        let playerGameTimes = {};

        // 2P side-by-side tracking
        let currentP1Game = null;
        let currentP2Game = null;
        let p1Timer = null;
        let p2Timer = null;
        let p1TimerInterval = null;
        let p2TimerInterval = null;

        // Time tracking mode
        let timeTrackingMode = 'per-item';
        let timerMode = 'countdown'; // 'countdown' or 'stopwatch'
        let sessionTimeElapsed = 0;
        let sessionTimerInterval = null;

        // Pause state
        let gamePaused = false;
        let pausedTimeRemaining = 0;
        let pausedSessionTime = 0;

        // ==================== SETUP ====================
        document.getElementById('modeCompete').addEventListener('change', () => {
            document.getElementById('competitionOptions').classList.remove('hidden');
            document.getElementById('timeTrackingMode').classList.remove('hidden');
            updatePlayerNames();
        });

        document.getElementById('modeSolo').addEventListener('change', () => {
            document.getElementById('competitionOptions').classList.add('hidden');
            document.getElementById('timeTrackingMode').classList.remove('hidden');
        });

        document.getElementById('playerCount').addEventListener('change', updatePlayerNames);

        document.getElementById('roundTimeSlider').addEventListener('input', (e) => {
            const timerMode = document.querySelector('input[name="timerMode"]:checked').value;
            if (timerMode === 'countdown') {
                document.getElementById('timeDisplayLabel').textContent = e.target.value;
            } else {
                document.getElementById('timeDisplayLabel').textContent = e.target.value;
            }
        });

        // Timer mode selection - swap slider meanings
        document.getElementById('timerCountdown').addEventListener('change', () => {
            document.getElementById('sliderLabel').textContent = '⏳ Max Time (seconds):';
            document.getElementById('sliderUnit').textContent = 's';
            document.getElementById('roundTimeSlider').min = '30';
            document.getElementById('roundTimeSlider').max = '900';
            document.getElementById('roundTimeSlider').step = '30';
            document.getElementById('roundTimeSlider').value = '60';
            document.getElementById('sliderMin').textContent = '30s';
            document.getElementById('sliderMax').textContent = '900s';
            document.getElementById('timeDisplayLabel').textContent = '60';
        });

        document.getElementById('timerStopwatch').addEventListener('change', () => {
            document.getElementById('sliderLabel').textContent = '🎯 Games to Complete:';
            document.getElementById('sliderUnit').textContent = '';
            document.getElementById('roundTimeSlider').min = '1';
            document.getElementById('roundTimeSlider').max = '100';
            document.getElementById('roundTimeSlider').step = '1';
            document.getElementById('roundTimeSlider').value = '5';
            document.getElementById('sliderMin').textContent = '1';
            document.getElementById('sliderMax').textContent = '100';
            document.getElementById('timeDisplayLabel').textContent = '5';
        });

        // Time tracking mode selection
        document.getElementById('timePerItem').addEventListener('change', () => {
            timeTrackingMode = 'per-item';
        });
        document.getElementById('timeSession').addEventListener('change', () => {
            timeTrackingMode = 'session';
        });

        function updatePlayerNames() {
            const count = parseInt(document.getElementById('playerCount').value);
            const container = document.getElementById('playerNamesContainer');
            container.innerHTML = '';
            for (let i = 1; i <= count; i++) {
                container.innerHTML += `
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Player ${i} Name</label>
                        <input type="text" id="playerName${i}" class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="Player ${i}" value="Player ${i}">
                    </div>
                `;
            }
        }

        // ==================== START HUNT ====================
        async function startHunt() {
            const username = document.getElementById('bggUsernameInput').value.trim();
            if (!username) {
                alert('Please enter a BGG username');
                return;
            }

            gameMode = document.querySelector('input[name="mode"]:checked').value;
            timeTrackingMode = document.querySelector('input[name="timeTracking"]:checked').value;
            timerMode = document.querySelector('input[name="timerMode"]:checked').value;
            sessionTimeElapsed = 0;
            
            // Handle slider value based on timer mode
            const sliderValue = parseInt(document.getElementById('roundTimeSlider').value);
            if (timerMode === 'countdown') {
                // Countdown: slider is max time in seconds
                roundTime = sliderValue;
                timeRemaining = roundTime;
            } else {
                // Stopwatch: slider is number of games to complete
                gamesToPlayTotal = sliderValue;
                roundTime = 0; // Not used in stopwatch mode
                timeRemaining = 0; // Not used in stopwatch mode
            }

            if (gameMode === 'compete') {
                playStyle = document.getElementById('playStyle').value;
                const count = parseInt(document.getElementById('playerCount').value);
                
                // For competition, use games to play total for stopwatch
                if (timerMode === 'stopwatch') {
                    gamesToPlayTotal = sliderValue;
                } else {
                    gamesToPlayTotal = parseInt(document.getElementById('gamesToPlay').value);
                }
                
                players = [];
                for (let i = 1; i <= count; i++) {
                    const name = document.getElementById(`playerName${i}`).value || `Player ${i}`;
                    players.push(name);
                    playerScores[name] = 0;
                    playerGameTimes[name] = [];
                }
                currentPlayerIndex = 0;
            } else {
                foundGames = [];
                skippedGames = [];
                scores = {};
                gamesToPlayTotal = 10;
            }

            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('loadingScreen').classList.remove('hidden');

            try {
                const response = await fetch(`/api/bgg-helper?endpoint=collection&username=${username}&own=1&stats=1`);
                if (!response.ok) throw new Error('Failed to fetch collection');

                const text = await response.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, 'text/xml');

                allGames = Array.from(xml.querySelectorAll('item')).map(item => {
                    const name = item.querySelector('name')?.textContent || 'Unknown';
                    const image = item.querySelector('image')?.textContent || '';
                    return { name, image };
                }).filter(g => g.image);

                if (allGames.length === 0) throw new Error('No games found');

                currentGameIndex = 0;
                document.getElementById('loadingScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.remove('hidden');

                if (gameMode === 'compete' && playStyle === 'side-by-side') {
                    startSideBySide();
                } else {
                    nextGame();
                }
            } catch (error) {
                alert('Error: ' + error.message);
                document.getElementById('loadingScreen').classList.add('hidden');
                document.getElementById('setupScreen').classList.remove('hidden');
            }
        }

        // ==================== GAME LOGIC ====================
        function nextGame() {
            if (currentGameIndex >= gamesToPlayTotal || allGames.length === 0) {
                endGame();
                return;
            }

            const randomIndex = Math.floor(Math.random() * allGames.length);
            const game = allGames[randomIndex];
            
            // Reset per-item timer only if not in session mode
            if (timeTrackingMode === 'per-item') {
                timeRemaining = roundTime;
            }

            document.getElementById('gameName').textContent = game.name;
            if (game.image) {
                document.getElementById('gameImage').innerHTML = `<img src="${game.image}" alt="${game.name}" class="w-full h-full object-contain">`;
            }

            if (gameMode === 'compete' && playStyle === 'alternating') {
                const currentPlayer = players[currentPlayerIndex];
                document.getElementById('currentPlayerName').textContent = currentPlayer;
                document.getElementById('currentPlayerDisplay').classList.remove('hidden');
            }

            clearInterval(timerInterval);
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                if (timerMode === 'stopwatch') {
                    // Stopwatch mode: count up
                    timeRemaining++;
                } else {
                    // Countdown mode: count down
                    timeRemaining--;
                }
                if (timeTrackingMode === 'session') {
                    sessionTimeElapsed++;
                }
                updateTimerDisplay();
                // Auto-skip only in countdown mode when time runs out
                if (timerMode === 'countdown' && timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    skipGame();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timeRemaining / 60);
            const secs = timeRemaining % 60;
            const display = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            document.getElementById('timerDisplay').textContent = display;

            const timerContainer = document.getElementById('timerDisplay').parentElement.parentElement;
            
            if (timerMode === 'countdown') {
                // Countdown: red warning when low
                if (timeRemaining <= 5) {
                    timerContainer.classList.add('ring-4', 'ring-red-500');
                } else {
                    timerContainer.classList.remove('ring-4', 'ring-red-500');
                }
            } else {
                // Stopwatch: green glow as time increases (optional)
                if (timeRemaining > roundTime / 2) {
                    timerContainer.classList.add('ring-4', 'ring-green-500');
                } else {
                    timerContainer.classList.remove('ring-4', 'ring-green-500');
                }
            }
        }

        function foundGame() {
            clearInterval(timerInterval);
            const timeItTook = timerMode === 'stopwatch' ? timeRemaining : (roundTime - timeRemaining);
            currentGameIndex++;

            if (gameMode === 'compete' && playStyle === 'alternating') {
                const currentPlayer = players[currentPlayerIndex];
                playerScores[currentPlayer] = (playerScores[currentPlayer] || 0) + (10 + timeRemaining);
                playerGameTimes[currentPlayer].push({ time: timeRemaining, found: true, gameName: document.getElementById('gameName').textContent, timeTook: timeItTook });
                currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
            } else {
                foundGames.push({
                    name: document.getElementById('gameName').textContent, 
                    timeLeft: timeRemaining,
                    timeTook: timeItTook
                });
                scores['You'] = (scores['You'] || 0) + (10 + timeRemaining);
            }

            nextGame();
        }

        function skipGame() {
            clearInterval(timerInterval);
            currentGameIndex++;

            if (gameMode === 'compete' && playStyle === 'alternating') {
                const currentPlayer = players[currentPlayerIndex];
                playerGameTimes[currentPlayer].push({ time: 0, found: false });
                currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
            } else {
                skippedGames.push(document.getElementById('gameName').textContent);
            }

            nextGame();
        }

        // ==================== SIDE-BY-SIDE MODE ====================
        function startSideBySide() {
            document.getElementById('soloGameArea').classList.add('hidden');
            document.getElementById('sideBySideArea').classList.remove('hidden');
            document.getElementById('p1Name').textContent = players[0];
            document.getElementById('p2Name').textContent = players[1];

            getNextP1Game();
            getNextP2Game();
        }

        function getNextP1Game() {
            if (currentGameIndex >= gamesToPlayTotal) {
                endGame();
                return;
            }
            const randomIndex = Math.floor(Math.random() * allGames.length);
            currentP1Game = allGames[randomIndex];
            document.getElementById('p1GameName').textContent = currentP1Game.name;
            document.getElementById('p1GameImage').src = currentP1Game.image;
            
            p1Timer = timerMode === 'stopwatch' ? 0 : roundTime;
            startP1Timer();
        }

        function getNextP2Game() {
            if (currentGameIndex >= gamesToPlayTotal) {
                endGame();
                return;
            }
            const randomIndex = Math.floor(Math.random() * allGames.length);
            currentP2Game = allGames[randomIndex];
            document.getElementById('p2GameName').textContent = currentP2Game.name;
            document.getElementById('p2GameImage').src = currentP2Game.image;
            
            p2Timer = timerMode === 'stopwatch' ? 0 : roundTime;
            startP2Timer();
        }

        function startP1Timer() {
            clearInterval(p1TimerInterval);
            p1TimerInterval = setInterval(() => {
                if (timerMode === 'stopwatch') {
                    p1Timer++;
                } else {
                    p1Timer--;
                }
                const m = Math.floor(p1Timer / 60);
                const s = p1Timer % 60;
                document.getElementById('p1Timer').textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
                if (timerMode === 'countdown' && p1Timer <= 0) {
                    clearInterval(p1TimerInterval);
                    skipGameP1();
                }
            }, 1000);
        }

        function startP2Timer() {
            clearInterval(p2TimerInterval);
            p2TimerInterval = setInterval(() => {
                if (timerMode === 'stopwatch') {
                    p2Timer++;
                } else {
                    p2Timer--;
                }
                const m = Math.floor(p2Timer / 60);
                const s = p2Timer % 60;
                document.getElementById('p2Timer').textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
                if (timerMode === 'countdown' && p2Timer <= 0) {
                    clearInterval(p2TimerInterval);
                    skipGameP2();
                }
            }, 1000);
        }

        function foundGameP1() {
            playerScores[players[0]] = (playerScores[players[0]] || 0) + (10 + p1Timer);
            playerGameTimes[players[0]].push({ time: p1Timer, found: true });
            currentGameIndex++;
            getNextP1Game();
        }

        function skipGameP1() {
            playerGameTimes[players[0]].push({ time: 0, found: false });
            currentGameIndex++;
            getNextP1Game();
        }

        function foundGameP2() {
            playerScores[players[1]] = (playerScores[players[1]] || 0) + (10 + p2Timer);
            playerGameTimes[players[1]].push({ time: p2Timer, found: true });
            currentGameIndex++;
            getNextP2Game();
        }

        function skipGameP2() {
            playerGameTimes[players[1]].push({ time: 0, found: false });
            currentGameIndex++;
            getNextP2Game();
        }

        // ==================== PAUSE LOGIC ====================
        function togglePause() {
            gamePaused = !gamePaused;
            
            if (gamePaused) {
                // PAUSE: Save state and show pause screen
                pausedTimeRemaining = timeRemaining;
                pausedSessionTime = sessionTimeElapsed;
                
                clearInterval(timerInterval);
                clearInterval(p1TimerInterval);
                clearInterval(p2TimerInterval);
                
                document.getElementById('gameScreen').classList.add('hidden');
                document.getElementById('pauseScreen').classList.remove('hidden');
                updatePausedTimeDisplay();
            } else {
                // RESUME: Restore state and hide pause screen
                document.getElementById('pauseScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.remove('hidden');
                
                timeRemaining = pausedTimeRemaining;
                sessionTimeElapsed = pausedSessionTime;
                
                // Restart timer
                if (gameMode === 'compete' && playStyle === 'side-by-side') {
                    p1TimerInterval = setInterval(() => {
                        p1Timer--;
                        if (timeTrackingMode === 'session') {
                            sessionTimeElapsed++;
                        }
                        updateTimerDisplay();
                        if (p1Timer <= 0) {
                            clearInterval(p1TimerInterval);
                            skipGameP1();
                        }
                    }, 1000);
                    
                    p2TimerInterval = setInterval(() => {
                        p2Timer--;
                        if (timeTrackingMode === 'session') {
                            sessionTimeElapsed++;
                        }
                        if (p2Timer <= 0) {
                            clearInterval(p2TimerInterval);
                            skipGameP2();
                        }
                    }, 1000);
                } else {
                    timerInterval = setInterval(() => {
                        timeRemaining--;
                        if (timeTrackingMode === 'session') {
                            sessionTimeElapsed++;
                        }
                        updateTimerDisplay();
                        if (timeRemaining <= 0) {
                            clearInterval(timerInterval);
                            skipGame();
                        }
                    }, 1000);
                }
            }
        }

        function updatePausedTimeDisplay() {
            const mins = Math.floor(pausedSessionTime / 60);
            const secs = pausedSessionTime % 60;
            const display = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            document.getElementById('pausedTimeDisplay').textContent = display;
        }

        // ==================== END GAME ====================
        function endGame() {
            clearInterval(timerInterval);
            clearInterval(p1TimerInterval);
            clearInterval(p2TimerInterval);
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('resultsScreen').classList.remove('hidden');

            if (gameMode === 'solo') {
                const timeDisplay = timeTrackingMode === 'session' 
                    ? `Session: ${Math.floor(sessionTimeElapsed / 60)}m ${sessionTimeElapsed % 60}s`
                    : 'Per-Game';
                document.getElementById('statsDisplay').innerHTML = `
                    <div class="grid grid-cols-3 gap-4 text-center">
                        <div>
                            <div class="text-4xl font-bold text-green-600">${foundGames.length}</div>
                            <div class="text-sm text-gray-600">Found</div>
                        </div>
                        <div>
                            <div class="text-4xl font-bold text-blue-600">${skippedGames.length}</div>
                            <div class="text-sm text-gray-600">Skipped</div>
                        </div>
                        <div>
                            <div class="text-4xl font-bold text-purple-600">${scores['You'] || 0}</div>
                            <div class="text-sm text-gray-600">Score</div>
                        </div>
                    </div>
                    <div class="mt-4 text-center text-sm text-gray-600">
                        Time Mode: ${timeDisplay}
                    </div>
                `;
                document.getElementById('playerResultsContainer').classList.add('hidden');
                document.getElementById('foundGamesList').innerHTML = foundGames.map(g => {
                    const timeStr = g.timeTook ? `${g.timeTook}s` : 'N/A';
                    return `<div class="bg-green-50 p-3 rounded flex justify-between items-center"><span>✓ ${g.name}</span><span class="text-xs text-gray-600 font-semibold">${timeStr}</span></div>`;
                }).join('');
            } else {
                const sorted = Object.entries(playerScores).sort((a, b) => b[1] - a[1]);
                document.getElementById('statsDisplay').innerHTML = `
                    <div class="grid grid-cols-1 gap-4">
                        <div class="text-center">
                            <div class="text-3xl font-bold text-yellow-600">🏆 ${sorted[0][0]}</div>
                            <div class="text-xl text-gray-700">${sorted[0][1]} points</div>
                        </div>
                    </div>
                `;
                document.getElementById('playerResultsContainer').classList.remove('hidden');
                const colors = ['yellow', 'gray', 'orange'];
                document.getElementById('playerResultsList').innerHTML = sorted.map((p, i) => {
                    const times = playerGameTimes[p[0]] || [];
                    const totalTime = times.reduce((sum, t) => sum + t.time, 0);
                    const found = times.filter(t => t.found).length;
                    const timeStr = timeTrackingMode === 'session'
                        ? `${Math.floor(totalTime / 60)}m ${totalTime % 60}s`
                        : `${totalTime}s`;
                    return `
                        <div class="bg-${colors[i]}-50 rounded p-3 border-l-4 border-${colors[i]}-600">
                            <div class="font-bold text-lg text-gray-900">${i + 1}. ${p[0]}</div>
                            <div class="text-sm text-gray-600">Score: ${p[1]} | Found: ${found} | Time: ${timeStr}</div>
                        </div>
                    `;
                }).join('');
            }
        }

        function playAgain() {
            document.getElementById('resultsScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('soloGameArea').classList.remove('hidden');
            document.getElementById('sideBySideArea').classList.add('hidden');
            document.getElementById('setupScreen').classList.remove('hidden');
            currentGameIndex = 0;
            foundGames = [];
            skippedGames = [];
            scores = {};
            playerScores = {};
            playerGameTimes = {};
            sessionTimeElapsed = 0;
        }

        function goToSetup() { playAgain(); }

        function resumeGame() {
            togglePause();
        }

        function exitFromPause() {
            gamePaused = false;
            clearInterval(timerInterval);
            clearInterval(p1TimerInterval);
            clearInterval(p2TimerInterval);
            document.getElementById('pauseScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.add('hidden');
            endGame();
        }

        // Init
        updatePlayerNames();
    </script>
    <!-- Vercel Web Analytics -->
    <script type="module" src="../analytics-init.js"></script>

</body>
</html>
