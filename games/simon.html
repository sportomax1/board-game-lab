<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Simon Says | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🎮</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .game-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            user-select: none;
        }

        .game-card.active {
            transform: scale(1.15);
            border-color: #f59e0b;
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.6);
            z-index: 50;
        }

        .game-card.correct {
            border-color: #10b981;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.4);
        }

        .game-card.wrong {
            border-color: #ef4444;
            animation: shake 0.4s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .paused-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.9);
            z-index: 100;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .paused-overlay.active { display: flex; }

        .stat-badge {
            @apply flex flex-col items-center glass px-6 py-2 rounded-2xl border border-white/5;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    
    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/80 backdrop-blur-md"></div>
        <div class="glass relative max-w-sm w-full rounded-[2.5rem] p-8 shadow-2xl border-t border-white/20">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-purple-500/20 rounded-3xl flex items-center justify-center mx-auto mb-4 border border-purple-500/30">
                    <span class="text-4xl">🎮</span>
                </div>
                <h1 class="text-3xl font-black tracking-tight text-white mb-2 italic uppercase">Simon <span class="text-purple-400">Says</span></h1>
                <p class="text-slate-400 text-sm font-medium">Memory test with game covers</p>
            </div>

            <div class="space-y-5">
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Grid Size</label>
                    <select id="numGames" class="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-purple-500/50 transition-all font-medium text-sm">
                        <option value="4" selected>4 games (2x2)</option>
                        <option value="6">6 games (2x3)</option>
                        <option value="9">9 games (3x3)</option>
                        <option value="12">12 games (3x4)</option>
                        <option value="16">16 games (4x4)</option>
                    </select>
                </div>
                
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Speed</label>
                    <select id="gameSpeed" class="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-purple-500/50 transition-all font-medium text-sm">
                        <option value="slow">Slow</option>
                        <option value="normal" selected>Normal</option>
                        <option value="fast">Fast</option>
                    </select>
                </div>

                <button onclick="startGame()" class="w-full bg-purple-600 text-white py-4 rounded-2xl font-black text-lg uppercase tracking-tight hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2 mt-4 shadow-xl shadow-purple-500/20">
                    Play Now
                </button>
            </div>
        </div>
    </div>

    <!-- Main Game -->
    <div id="app" class="hidden min-h-screen flex flex-col pb-safe">
        <header class="p-6 border-b border-white/5 flex items-center justify-between">
            <h1 class="text-xl font-black italic uppercase tracking-tighter text-white leading-none">Simon <span class="text-purple-400">Says</span></h1>
            <div class="flex gap-2">
                <button onclick="togglePause()" class="glass w-10 h-10 rounded-xl flex items-center justify-center text-slate-400 hover:text-white transition-all">⏸</button>
                <button onclick="showSettings()" class="glass w-10 h-10 rounded-xl flex items-center justify-center text-slate-400 hover:text-white transition-all">⚙️</button>
            </div>
        </header>

        <div class="p-4 flex flex-col items-center gap-6 flex-1 justify-center">
            <!-- Stats -->
            <div class="flex gap-3 w-full max-w-sm">
                <div class="stat-badge flex-1">
                    <span class="text-[8px] font-black uppercase tracking-widest text-slate-500 mb-1">Score</span>
                    <span id="score" class="text-xl font-black text-white">0</span>
                </div>
                <div class="stat-badge flex-1">
                    <span class="text-[8px] font-black uppercase tracking-widest text-slate-500 mb-1">Best</span>
                    <span id="highScore" class="text-xl font-black text-purple-400">0</span>
                </div>
            </div>

            <p id="statusText" class="text-sm font-black uppercase tracking-[0.2em] text-amber-400 h-6">Loading...</p>

            <!-- Grid -->
            <div id="gameGrid" class="grid gap-3 w-fit"></div>

            <button onclick="resetGame()" class="mt-4 px-8 py-3 rounded-2xl glass border-white/10 text-[10px] font-black uppercase tracking-widest text-slate-400 hover:text-white transition-all">Reset Game</button>
        </div>
    </div>

    <!-- Paused Overlay -->
    <div id="pausedOverlay" class="paused-overlay">
        <div class="glass max-w-sm w-full rounded-[2.5rem] p-8 text-center border-t border-white/20">
            <h2 class="text-3xl font-black italic uppercase tracking-tighter mb-6">Paused</h2>
            <button onclick="resumeGame()" class="w-full bg-emerald-500 text-white py-4 rounded-2xl font-black text-sm uppercase tracking-widest hover:bg-emerald-400 transition-colors">Resume Game</button>
        </div>
    </div>

    <script>
        let collection = [];
        let currentGames = [];
        let sequence = [];
        let playerSequence = [];
        let score = 0;
        let round = 1;
        let highScore = 0;
        let isPlaying = false;
        let isPlayerTurn = false;
        let isPaused = false;
        let resumeResolve = null;
        let speedMap = { slow: 1200, normal: 800, fast: 400 };

        async function fetchWithRetry(url, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                const response = await fetch(url);
                if (response.status === 202) { await new Promise(r => setTimeout(r, 3000)); continue; }
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response;
            }
            throw new Error('Timeout');
        }

        async function loadCollection() {
            try {
                const res = await fetchWithRetry(`/api/bgg-helper?endpoint=collection&username=sportomax&own=1&stats=1`);
                const xml = await res.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(xml, 'text/xml');
                collection = Array.from(doc.querySelectorAll('item')).map(item => ({
                    id: item.getAttribute('objectid'),
                    name: item.querySelector('name').textContent,
                    image: item.querySelector('thumbnail')?.textContent || ''
                })).filter(g => g.image);
                
                highScore = parseInt(localStorage.getItem('simonHighScore') || '0');
                document.getElementById('highScore').textContent = highScore;
            } catch (error) { alert('Load failed: ' + error.message); }
        }

        async function startGame() {
            const numGames = parseInt(document.getElementById('numGames').value);
            if (collection.length === 0) await loadCollection();
            
            const shuffled = [...collection].sort(() => Math.random() - 0.5);
            currentGames = shuffled.slice(0, numGames);
            
            document.getElementById('settingsModal').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            initializeGame();
        }

        function initializeGame() {
            sequence = [];
            playerSequence = [];
            score = 0;
            round = 1;
            updateStats();
            renderGameGrid();
            setStatus('Tap any game to start');
        }

        function renderGameGrid() {
            const grid = document.getElementById('gameGrid');
            const num = currentGames.length;
            const cols = num <= 4 ? 2 : num <= 9 ? 3 : 4;
            const sizePx = num > 9 ? 64 : num > 4 ? 84 : 100;

            grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            grid.innerHTML = currentGames.map((game, idx) => `
                <div class="game-card glass rounded-2xl overflow-hidden border border-white/10 flex items-center justify-center p-1.5" 
                     style="width: ${sizePx}px; height: ${sizePx}px;"
                     data-idx="${idx}" onclick="handleGameClick(${idx})">
                    <img src="${game.image}" class="w-full h-full object-contain pointer-events-none">
                </div>
            `).join('');
        }

        async function startRound() {
            isPlaying = true;
            isPlayerTurn = false;
            sequence.push(Math.floor(Math.random() * currentGames.length));
            playerSequence = [];
            setStatus('Watch...');
            await wait(800);
            
            for (let idx of sequence) {
                if (isPaused) await new Promise(r => resumeResolve = r);
                await highlightGame(idx);
                await wait(speedMap[document.getElementById('gameSpeed').value] / 2);
            }
            
            isPlayerTurn = true;
            setStatus('Your Turn');
        }

        async function highlightGame(idx) {
            const card = document.querySelector(`[data-idx="${idx}"]`);
            if (!card) return;
            card.classList.add('active');
            await wait(speedMap[document.getElementById('gameSpeed').value] * 0.6);
            card.classList.remove('active');
        }

        function handleGameClick(idx) {
            if (!isPlaying) return startRound();
            if (!isPlayerTurn || isPaused) return;
            
            playerSequence.push(idx);
            highlightGame(idx);
            
            const step = playerSequence.length - 1;
            if (playerSequence[step] !== sequence[step]) return gameOver();
            if (playerSequence.length === sequence.length) roundComplete();
        }

        async function roundComplete() {
            isPlayerTurn = false;
            score++;
            updateStats();
            document.querySelectorAll('.game-card').forEach(c => c.classList.add('correct'));
            setStatus('Correct!');
            await wait(1000);
            document.querySelectorAll('.game-card').forEach(c => c.classList.remove('correct'));
            startRound();
        }

        function gameOver() {
            isPlaying = false;
            isPlayerTurn = false;
            document.querySelectorAll('.game-card').forEach(c => c.classList.add('wrong'));
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('simonHighScore', highScore);
                setStatus('🏆 New High Score!');
            } else setStatus('Game Over');
            updateStats();
        }

        function resetGame() { initializeGame(); }
        function setStatus(t) { document.getElementById('statusText').textContent = t; }
        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('highScore').textContent = highScore;
        }
        function togglePause() { isPaused ? resumeGame() : pauseGame(); }
        function pauseGame() { isPaused = true; document.getElementById('pausedOverlay').classList.add('active'); }
        function resumeGame() { isPaused = false; document.getElementById('pausedOverlay').classList.remove('active'); if (resumeResolve) resumeResolve(); }
        function showSettings() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

        loadCollection();
    </script>
</body>
</html>
