<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Crossword">
    <title>Board Game Crossword</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🔤</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .crossword-grid {
            display: inline-block;
            border: 3px solid #333;
            background: white;
        }
        
        .crossword-row {
            display: flex;
            gap: 0px;
        }
        
        .crossword-cell {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #999;
            font-weight: bold;
            font-size: 14px;
            background: white;
            position: relative;
            -webkit-touch-callout: none;
            user-select: none;
            -webkit-user-select: none;
        }
        
        .crossword-cell.black {
            background: #333;
            border: none;
        }
        
        .crossword-cell input {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            text-transform: uppercase;
            background: transparent;
        }
        
        .crossword-cell input:focus {
            background: #ffeb3b;
        }
        
        .crossword-cell input.correct {
            background: #c8e6c9;
            color: #2e7d32;
        }
        
        .cell-number {
            position: absolute;
            top: 1px;
            left: 2px;
            font-size: 10px;
            font-weight: bold;
            color: #333;
            line-height: 1;
        }
        
        .clues-container {
            columns: 2;
            column-gap: 2rem;
        }
        
        .clue-item {
            break-inside: avoid;
            margin-bottom: 1rem;
            padding: 0.75rem;
            background: #f5f5f5;
            border-radius: 4px;
            border-left: 4px solid #1976d2;
        }
        
        .clue-number {
            font-weight: bold;
            color: #1976d2;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Setup Screen -->
    <div id="setupScreen" class="fixed inset-0 bg-gradient-to-br from-purple-900 to-indigo-900 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
            <h1 class="text-3xl font-bold text-gray-900 mb-2 text-center">✏️ Crossword</h1>
            <p class="text-gray-600 text-center text-sm mb-6">Solve a crossword with board game names!</p>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">BGG Username</label>
                    <input type="text" id="usernameInput" class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 focus:border-purple-500 outline-none transition text-base" placeholder="Enter username" value="sportomax">
                </div>
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Difficulty (Word Count)</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="setWordCount(6)" class="px-3 py-2 bg-gray-100 text-gray-700 rounded-lg font-semibold hover:bg-gray-200 transition">Easy (6)</button>
                        <button onclick="setWordCount(10)" class="px-3 py-2 bg-gray-100 text-gray-700 rounded-lg font-semibold hover:bg-gray-200 transition">Medium (10)</button>
                        <button onclick="setWordCount(14)" class="px-3 py-2 bg-gray-100 text-gray-700 rounded-lg font-semibold hover:bg-gray-200 transition">Hard (14)</button>
                    </div>
                    <div id="selectedWordCount" class="text-center text-purple-600 font-bold mt-2">Selected: 6 words</div>
                </div>

                <div class="space-y-2">
                    <label class="flex items-center gap-2">
                        <input type="checkbox" id="excludeExpansions" class="w-4 h-4 rounded" checked>
                        <span class="text-sm text-gray-700">Exclude Expansions</span>
                    </label>
                </div>
                
                <button onclick="startGame()" class="w-full bg-purple-600 text-white py-3 rounded-lg font-bold text-lg hover:bg-purple-700 transition shadow-lg">
                    🎯 Start Crossword
                </button>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="hidden flex flex-col min-h-screen p-4 md:p-6">
        <!-- Header -->
        <div class="max-w-6xl mx-auto w-full mb-6">
            <div class="flex items-center justify-between mb-4">
                <h1 class="text-3xl md:text-4xl font-bold text-gray-900">✏️ Crossword</h1>
                <button onclick="location.reload()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg font-semibold hover:bg-gray-300 transition">
                    ↻ New Game
                </button>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-3 gap-3 md:gap-4 mb-4">
                <div class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-lg p-4 text-center">
                    <div class="text-2xl md:text-3xl font-black" id="correctCount">0</div>
                    <div class="text-xs md:text-sm font-semibold">Correct</div>
                </div>
                <div class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-lg p-4 text-center">
                    <div class="text-2xl md:text-3xl font-black" id="totalCount">0</div>
                    <div class="text-xs md:text-sm font-semibold">Total Words</div>
                </div>
                <div class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-lg p-4 text-center">
                    <div class="text-2xl md:text-3xl font-black" id="timeDisplay">0s</div>
                    <div class="text-xs md:text-sm font-semibold">Time</div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex gap-6 max-w-6xl mx-auto w-full">
            <!-- Crossword Grid -->
            <div class="flex justify-center items-start">
                <div id="gridContainer" class="crossword-grid">
                    <!-- Grid will be inserted here -->
                </div>
            </div>

            <!-- Clues -->
            <div class="flex-1 bg-white rounded-lg shadow-lg p-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <h2 class="text-lg font-bold text-gray-900 mb-4">📍 Across</h2>
                        <div id="acrossClues" class="clues-container">
                            <!-- Clues will be inserted here -->
                        </div>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-gray-900 mb-4">⬇️ Down</h2>
                        <div id="downClues" class="clues-container">
                            <!-- Clues will be inserted here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Win Modal -->
        <div id="winModal" class="hidden fixed inset-0 bg-black bg-opacity-70 z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full text-center">
                <div class="text-5xl mb-4">🎉</div>
                <h2 class="text-3xl font-bold text-gray-900 mb-2">You Won!</h2>
                <p class="text-gray-600 mb-4">
                    Solved in <span id="finalTime" class="font-bold">0</span> seconds!
                </p>
                <div class="space-y-2">
                    <button onclick="location.reload()" class="w-full bg-purple-600 text-white py-3 rounded-lg font-bold hover:bg-purple-700 transition">
                        🎮 Play Again
                    </button>
                    <button onclick="goHome()" class="w-full bg-gray-200 text-gray-700 py-3 rounded-lg font-bold hover:bg-gray-300 transition">
                        🏠 Home
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let collection = [];
        let wordCount = 6;
        let words = [];
        let grid = [];
        let cellMap = {};
        let acrossClues = {};
        let downClues = {};
        let cellWords = {};
        let gameStartTime = 0;
        let timerInterval = null;
        let cellNumber = 1;

        function setWordCount(count) {
            wordCount = count;
            document.getElementById('selectedWordCount').textContent = `Selected: ${wordCount} words`;
        }

        function cleanName(name) {
            return name.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
        }

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        async function startGame() {
            const username = document.getElementById('usernameInput').value.trim();
            if (!username) {
                alert('Please enter a username');
                return;
            }

            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');

            try {
                let queryParams = `endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1`;
                if (!document.getElementById('excludeExpansions').checked) {
                    queryParams += '&includeexpansions=1';
                }

                const res = await fetch(`/api/bgg-helper?${queryParams}`);
                const xml = await res.text();
                const parser = new DOMParser().parseFromString(xml, 'text/xml');
                const items = Array.from(parser.querySelectorAll('item'));

                collection = items
                    .filter(item => {
                        if (document.getElementById('excludeExpansions').checked) {
                            const type = item.getAttribute('subtype');
                            if (type === 'boardgameexpansion') return false;
                        }
                        return true;
                    })
                    .map(item => ({
                            id: item.getAttribute('objectid'),
                            name: item.querySelector('name').textContent,
                        }))
                        .slice(0, wordCount * 3);

                    collection = shuffleArray(collection).slice(0, wordCount);

                    // fetch descriptions for the selected games to use as hints
                    await fetchDescriptionsForCollection(collection);

                    words = collection.map(g => cleanName(g.name)).filter(w => w.length > 3);

                if (words.length < wordCount) {
                    alert(`Only found ${words.length} valid words. Using those instead.`);
                }

                generateCrossword();
                renderGrid();
                renderClues();
                
                gameStartTime = Date.now();
                document.getElementById('totalCount').textContent = words.length;
                startTimer();
            } catch (error) {
                console.error('Error:', error);
                alert('Error loading collection: ' + error.message);
                location.reload();
            }
        }

        function generateCrossword() {
            const gridSize = Math.max(15, Math.ceil(Math.sqrt(words.join('').length)));
            grid = Array(gridSize).fill(null).map(() => Array(gridSize).fill(null));
            cellMap = {};
            acrossClues = {};
            downClues = {};
            cellWords = {};
            cellNumber = 1;

            // Place first word horizontally
            const firstWord = words[0];
            const startRow = Math.floor(gridSize / 2);
            const startCol = Math.floor((gridSize - firstWord.length) / 2);

            for (let i = 0; i < firstWord.length; i++) {
                grid[startRow][startCol + i] = firstWord[i];
                cellMap[`${startRow},${startCol + i}`] = firstWord;
            }
            acrossClues[cellNumber] = `${cellNumber}. ${collection[0].name}`;
            cellNumber++;

            // Place remaining words vertically or horizontally
            for (let w = 1; w < words.length; w++) {
                const word = words[w];
                let placed = false;
                let attempts = 0;

                while (!placed && attempts < 50) {
                    for (let r = 0; r < gridSize && !placed; r++) {
                        for (let c = 0; c < gridSize && !placed; c++) {
                            // Try horizontal
                            if (canPlaceHorizontal(word, r, c, gridSize)) {
                                placeHorizontal(word, r, c, w);
                                placed = true;
                            }
                            // Try vertical
                            else if (canPlaceVertical(word, r, c, gridSize)) {
                                placeVertical(word, r, c, w);
                                placed = true;
                            }
                        }
                    }
                    attempts++;
                }
            }
        }

        function canPlaceHorizontal(word, row, col, size) {
            if (col + word.length > size) return false;
            let crosses = 0;
            for (let i = 0; i < word.length; i++) {
                const cell = grid[row][col + i];
                if (cell && cell !== word[i]) return false;
                if (cell === word[i]) crosses++;
            }
            return crosses > 0 || cellMap[`${row},${col}`] === undefined;
        }

        function canPlaceVertical(word, row, col, size) {
            if (row + word.length > size) return false;
            let crosses = 0;
            for (let i = 0; i < word.length; i++) {
                const cell = grid[row + i][col];
                if (cell && cell !== word[i]) return false;
                if (cell === word[i]) crosses++;
            }
            return crosses > 0 || cellMap[`${row},${col}`] === undefined;
        }

        function placeHorizontal(word, row, col, wordIdx) {
            for (let i = 0; i < word.length; i++) {
                grid[row][col + i] = word[i];
                cellMap[`${row},${col + i}`] = word;
            }
            const hint = collection[wordIdx]?.description || collection[wordIdx]?.name || '';
            acrossClues[cellNumber] = `${cellNumber}. ${hint}`;
            cellNumber++;
        }

        function placeVertical(word, row, col, wordIdx) {
            for (let i = 0; i < word.length; i++) {
                grid[row + i][col] = word[i];
                cellMap[`${row + i},${col}`] = word;
            }
            const hint = collection[wordIdx]?.description || collection[wordIdx]?.name || '';
            downClues[cellNumber] = `${cellNumber}. ${hint}`;
            cellNumber++;
        }

        function renderGrid() {
            const container = document.getElementById('gridContainer');
            container.innerHTML = '';
            let cellNum = 1;
            const cellNumbers = {};

            grid.forEach((row, rowIdx) => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'crossword-row';
                
                row.forEach((letter, colIdx) => {
                    const cell = document.createElement('div');
                    
                    if (letter === null) {
                        cell.className = 'crossword-cell black';
                    } else {
                        cell.className = 'crossword-cell';
                        
                        // Check if this is a numbered cell
                        const key = `${rowIdx},${colIdx}`;
                        let isStart = false;
                        
                        // Check if starts an across or down word
                        if ((colIdx === 0 || grid[rowIdx][colIdx - 1] === null) && (colIdx === grid[0].length - 1 || grid[rowIdx][colIdx + 1] !== null)) {
                            isStart = true;
                        }
                        if ((rowIdx === 0 || grid[rowIdx - 1][colIdx] === null) && (rowIdx === grid.length - 1 || grid[rowIdx + 1][colIdx] !== null)) {
                            isStart = true;
                        }
                        
                        if (isStart) {
                            const num = document.createElement('div');
                            num.className = 'cell-number';
                            num.textContent = cellNum;
                            cell.appendChild(num);
                            cellNumbers[key] = cellNum;
                            cellNum++;
                        }
                        
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.maxLength = '1';
                        input.dataset.row = rowIdx;
                        input.dataset.col = colIdx;
                        input.dataset.answer = letter;
                        input.addEventListener('input', (e) => {
                            e.target.value = e.target.value.toUpperCase();
                            if (e.target.value && e.target.value === letter) {
                                e.target.classList.add('correct');
                                checkAllAnswers();
                            }
                        });
                        input.addEventListener('keydown', (e) => {
                            if (e.key === 'ArrowRight' || e.key === 'Tab') {
                                e.preventDefault();
                                const nextCol = colIdx + 1;
                                if (nextCol < grid[0].length && grid[rowIdx][nextCol] !== null) {
                                    document.querySelector(`input[data-row="${rowIdx}"][data-col="${nextCol}"]`)?.focus();
                                }
                            }
                            if (e.key === 'ArrowDown') {
                                e.preventDefault();
                                const nextRow = rowIdx + 1;
                                if (nextRow < grid.length && grid[nextRow][colIdx] !== null) {
                                    document.querySelector(`input[data-row="${nextRow}"][data-col="${colIdx}"]`)?.focus();
                                }
                            }
                        });
                        cell.appendChild(input);
                    }
                    
                    rowDiv.appendChild(cell);
                });
                
                container.appendChild(rowDiv);
            });
        }

        function renderClues() {
            const acrossContainer = document.getElementById('acrossClues');
            const downContainer = document.getElementById('downClues');
            acrossContainer.innerHTML = '';
            downContainer.innerHTML = '';

            Object.entries(acrossClues).forEach(([num, clue]) => {
                const div = document.createElement('div');
                div.className = 'clue-item';
                // clue already contains numbering and description; render full text after the number
                const text = clue.replace(/^\d+\.\s*/, '');
                div.innerHTML = `<span class="clue-number">${num}.</span> ${text}`;
                acrossContainer.appendChild(div);
            });

            Object.entries(downClues).forEach(([num, clue]) => {
                const div = document.createElement('div');
                div.className = 'clue-item';
                const text = clue.replace(/^\d+\.\s*/, '');
                div.innerHTML = `<span class="clue-number">${num}.</span> ${text}`;
                downContainer.appendChild(div);
            });
        }

        function checkAllAnswers() {
            const inputs = document.querySelectorAll('.crossword-cell input');
            let correct = 0;
            let total = inputs.length;

            inputs.forEach(input => {
                if (input.value && input.value === input.dataset.answer) {
                    correct++;
                }
            });

            document.getElementById('correctCount').textContent = correct;

            if (correct === total && total > 0) {
                endGame();
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - gameStartTime) / 1000);
                document.getElementById('timeDisplay').textContent = elapsed + 's';
            }, 100);
        }

        function endGame() {
            clearInterval(timerInterval);
            const elapsed = Math.floor((Date.now() - gameStartTime) / 1000);
            document.getElementById('finalTime').textContent = elapsed;
            document.getElementById('winModal').classList.remove('hidden');
        }

        async function fetchDescriptionsForCollection(arr) {
            // fetch short descriptions for items in arr (array of {id,name})
            const concurrency = 4;
            const queue = [...arr];
            async function worker() {
                while (queue.length) {
                    const it = queue.shift();
                    try {
                        if (!it.id) continue;
                        const res = await fetch('/api/bgg-thing?id=' + encodeURIComponent(it.id));
                        const text = await res.text();
                        const doc = new DOMParser().parseFromString(text, 'text/xml');
                        const desc = doc.querySelector('description')?.textContent || '';
                        // strip tags and long whitespace, shorten
                        const clean = desc.replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
                        it.description = clean.length > 200 ? clean.slice(0, 197) + '...' : clean;
                    } catch (e) {
                        console.warn('desc fetch failed for', it.id, e);
                        it.description = it.name;
                    }
                }
            }
            const workers = [];
            for (let i=0;i<concurrency;i++) workers.push(worker());
            await Promise.all(workers);
        }

        function goHome() {
            window.location.href = '/index.html';
        }

        // Initialize
        document.getElementById('selectedWordCount').textContent = `Selected: ${wordCount} words`;
    </script>
    <!-- Vercel Web Analytics -->
    <script type="module" src="../analytics-init.js"></script>

</body>
</html>
