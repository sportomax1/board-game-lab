<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>BGG Overboxed Game</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>📦</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #e67e22 0%, #d35400 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow: hidden;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 600px;
        }

        .screen.active {
            display: block;
        }

        .setup-card, .game-card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 2rem;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        input[type="text"], select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #e67e22;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e67e22, #d35400);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(230, 126, 34, 0.4);
        }

        .btn-secondary {
            background: #ecf0f1;
            color: #2c3e50;
        }

        .btn-secondary:hover {
            background: #bdc3c7;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border-radius: 8px;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .timer {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .score {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .orders-container {
            margin-bottom: 1.5rem;
        }

        .order-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
            border: 3px solid transparent;
            transition: all 0.3s;
        }

        .order-card.active {
            border-color: #e67e22;
            box-shadow: 0 4px 12px rgba(230, 126, 34, 0.3);
        }

        .order-card.completed {
            opacity: 0.5;
            background: #d5f4e6;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .customer-name {
            font-weight: 700;
            color: #2c3e50;
            font-size: 1.1rem;
        }

        .order-timer {
            background: #e74c3c;
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .order-timer.warning {
            animation: pulse 1s infinite;
        }

        .order-items {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .order-item {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            border: 2px solid #e0e0e0;
        }

        .order-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .order-item.collected::after {
            content: '✓';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(46, 204, 113, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            font-weight: bold;
        }

        .stage-progress {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 6px;
            background: rgba(0,0,0,0.12);
            border-radius: 6px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.18s ease;
        }

        .stage-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg,#27ae60,#2ecc71);
        }


        .shelf-container {
            margin-bottom: 1.5rem;
        }

        .shelf-label {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.75rem;
            text-align: center;
        }

        .shelf-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 0.5rem;
            max-height: 320px;
            overflow-y: auto;
            padding: 4px;
        }

        @media (max-width: 600px) {
            .shelf-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .shelf-item {
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: transform 0.3s;
            border: 3px solid #e0e0e0;
        }

        .shelf-item:hover {
            transform: scale(1.05);
            border-color: #e67e22;
        }

        .shelf-item.selected {
            border-color: #2ecc71;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.5);
        }

        .shelf-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .action-buttons .btn {
            flex: 1;
        }

        .game-over-screen {
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .game-over-screen h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .final-score {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .stat-label {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #7f8c8d;
        }

        .error-message {
            background: #e74c3c;
            color: white;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .controls {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .controls .btn {
            flex: 1;
            min-width: 120px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.5rem;
            }

            .setup-card, .game-card {
                padding: 1.5rem;
            }

            .order-item {
                width: 50px;
                height: 50px;
            }
        }
        .bin-highlight { box-shadow: 0 8px 20px rgba(46,204,113,0.14); border-color: rgba(46,204,113,0.45) !important; transform: translateY(-2px); transition: all 160ms ease; }
        .bin-accept { animation: binAccept 520ms cubic-bezier(.2,.9,.2,1); }
        @keyframes binAccept { 0% { transform: scale(0.96); opacity: 0.9; } 60% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        /* Toasts */
        .toasts { position: fixed; right: 16px; top: 80px; z-index: 2200; display:flex;flex-direction:column;gap:8px; }
        .toast { background: rgba(0,0,0,0.8); color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,0.45); opacity: 0; transform: translateY(-6px); transition: all 260ms ease; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { background: linear-gradient(90deg,#27ae60,#2ecc71); }
        .toast.error { background: linear-gradient(90deg,#e74c3c,#c0392b); }
        .staged-ready { box-shadow: 0 6px 18px rgba(46,204,113,0.18); border-color: rgba(46,204,113,0.45) !important; }
    </style>
</head>
<body>
    <!-- Setup Screen -->
    <div id="setupScreen" class="screen active">
        <div class="setup-card">
            <h1>📦 BGG Overboxed</h1>
            <p class="subtitle">Frantically fulfill board game orders before time runs out!</p>

            <div class="form-group">
                <label for="usernameInput">BGG Username</label>
                <input type="text" id="usernameInput" placeholder="Enter your BGG username" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="difficultySelect">Difficulty</label>
                <select id="difficultySelect">
                    <option value="easy">Easy - 90s per order, 3 items</option>
                    <option value="medium" selected>Medium - 60s per order, 4 items</option>
                    <option value="hard">Hard - 45s per order, 5 items</option>
                </select>
            </div>

            <button class="btn btn-primary" onclick="startGame()">Start Game</button>
            <button class="btn btn-secondary" onclick="window.location.href='../home.html'">Back to Home</button>

            <div id="errorMessage" class="error-message" style="display: none;"></div>
            <div id="loadingMessage" class="loading" style="display: none;">
                Loading your collection...
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="screen">
        <div class="game-card">
            <h1>📦 Overboxed</h1>
            
            <div id="gameOverScreen" style="display: none;"></div>

            <div class="game-header">
                <div>
                    <div style="font-size: 0.85rem; opacity: 0.9;">Time</div>
                    <div class="timer" id="gameTimer">60</div>
                </div>
                <div>
                    <div style="font-size: 0.85rem; opacity: 0.9;">Score</div>
                    <div class="score" id="gameScore">0</div>
                </div>
                <div>
                    <div style="font-size: 0.85rem; opacity: 0.9;">Orders</div>
                    <div class="score" id="ordersComplete">0</div>
                </div>
            </div>

            <div id="toasts" class="toasts" aria-live="polite"></div>

            <div class="orders-container" id="ordersContainer">
                <!-- Orders will be inserted here -->
            </div>

            <!-- Action buttons removed — use drag & drop bins only -->

            <div style="display:flex;gap:8px;margin-bottom:12px;">
                <div id="gatherBin" ondragover="event.preventDefault()" ondrop="onBinDrop(event,'gather')" ondragenter="onBinDragEnter(event,'gather')" ondragleave="onBinDragLeave(event,'gather')" style="flex:1;padding:10px;border-radius:8px;border:2px dashed rgba(0,0,0,0.12);background:rgba(255,255,255,0.03);text-align:center;min-height:66px;">
                    <div style="font-weight:700;margin-bottom:6px">📦 Gather</div>
                    <div class="bin-contents" id="gatherContents" style="display:flex;gap:6px;overflow:auto;padding:4px"></div>
                </div>
                <div id="packBin" ondragover="event.preventDefault()" ondrop="onBinDrop(event,'pack')" ondragenter="onBinDragEnter(event,'pack')" ondragleave="onBinDragLeave(event,'pack')" style="flex:1;padding:10px;border-radius:8px;border:2px dashed rgba(0,0,0,0.12);background:rgba(255,255,255,0.03);text-align:center;min-height:66px;">
                    <div style="font-weight:700;margin-bottom:6px">📦 Pack</div>
                    <div class="bin-contents" id="packContents" style="display:flex;gap:6px;overflow:auto;padding:4px"></div>
                </div>
                <div id="deliverBin" ondragover="event.preventDefault()" ondrop="onBinDrop(event,'deliver')" ondragenter="onBinDragEnter(event,'deliver')" ondragleave="onBinDragLeave(event,'deliver')" style="flex:1;padding:10px;border-radius:8px;border:2px dashed rgba(0,0,0,0.12);background:rgba(255,255,255,0.03);text-align:center;min-height:66px;">
                    <div style="font-weight:700;margin-bottom:6px">🚚 Deliver</div>
                    <div class="bin-contents" id="deliverContents" style="display:flex;gap:6px;overflow:auto;padding:4px"></div>
                </div>
                <div id="stickerBin" ondragover="event.preventDefault()" ondrop="onBinDrop(event,'sticker')" ondragenter="onBinDragEnter(event,'sticker')" ondragleave="onBinDragLeave(event,'sticker')" style="flex:1;padding:10px;border-radius:8px;border:2px dashed rgba(0,0,0,0.12);background:rgba(255,255,255,0.03);text-align:center;min-height:66px;">
                    <div style="font-weight:700;margin-bottom:6px">🏷️ Sticker</div>
                    <div class="bin-contents" id="stickerContents" style="display:flex;gap:6px;overflow:auto;padding:4px"></div>
                </div>
                <div id="autographBin" ondragover="event.preventDefault()" ondrop="onBinDrop(event,'autograph')" ondragenter="onBinDragEnter(event,'autograph')" ondragleave="onBinDragLeave(event,'autograph')" style="flex:1;padding:10px;border-radius:8px;border:2px dashed rgba(0,0,0,0.12);background:rgba(255,255,255,0.03);text-align:center;min-height:66px;">
                    <div style="font-weight:700;margin-bottom:6px">✍️ Autograph</div>
                    <div class="bin-contents" id="autographContents" style="display:flex;gap:6px;overflow:auto;padding:4px"></div>
                </div>
            </div>

            <div class="shelf-container">
                <div class="shelf-label">📚 Your Collection - Tap to Select</div>
                <div style="display:flex;gap:8px;align-items:flex-start;">
                    <div style="flex:1;">
                        <input id="shelfSearch" placeholder="Search games or type letter..." style="width:100%;padding:8px;border-radius:8px;border:1px solid #ddd;margin-bottom:6px;" oninput="filterShelf()">
                        <div class="shelf-grid" id="shelfGrid">
                            <!-- Shelf items will be inserted here -->
                        </div>
                    </div>
                    <div id="alphaBar" style="width:28px;display:flex;flex-direction:column;gap:4px;align-items:center;padding-top:4px;font-size:12px;opacity:0.9">
                        <!-- letters inserted here -->
                    </div>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-secondary" id="pauseBtn" onclick="pauseGame(this)">Pause</button>
                <button class="btn btn-secondary" onclick="backToSetup()">Exit</button>
            </div>
        </div>
    </div>

    <script>
        const IMAGE_PROXY = 'https://images.weserv.nl/?url=';
        let collection = [];
        let difficulty = 'medium';
        let gameActive = false;
        let gamePaused = false;
        let score = 0;
        let ordersCompleted = 0;
        let currentOrders = [];
        let selectedItems = [];
        let gameTimer = null;
        let orderTimers = {};
        // Action durations (ms) and in-progress tracking
        const ACTION_DURATIONS = { gather: 1400, pack: 2000, deliver: 1200, sticker: 800, autograph: 1000 };
        const inProgress = {};
        // staged items in bins: dynamically include new stations
        const stagedBins = { gather: [], pack: [], deliver: [], sticker: [], autograph: [] };
        function makeUid() { return 's' + Math.random().toString(36).slice(2,9); }
        
        const DIFFICULTY_SETTINGS = {
            easy: { orderTime: 90, itemsPerOrder: 3, maxOrders: 3 },
            medium: { orderTime: 60, itemsPerOrder: 4, maxOrders: 4 },
            hard: { orderTime: 45, itemsPerOrder: 5, maxOrders: 5 }
        };

        const CUSTOMER_NAMES = [
            'Alice', 'Bob', 'Charlie', 'Diana', 'Eve', 'Frank', 'Grace', 'Henry',
            'Ivy', 'Jack', 'Kate', 'Leo', 'Mia', 'Nick', 'Olivia', 'Paul'
        ];
        // BGG API helper with retry logic
        async function fetchBGG(endpoint, params = {}, retries = 5) {
            const queryParams = new URLSearchParams(params).toString();
            const fullUrl = `/api/bgg-helper?endpoint=${endpoint}&${queryParams}`;
            
            try {
                const response = await fetch(fullUrl);

                if (response.status === 202 && retries > 0) {
                    const loadingEl = document.getElementById('loadingMessage');
                    if (loadingEl) {
                        loadingEl.textContent = `BGG is processing... Retrying (${retries} attempts left)`;
                    }
                    await new Promise(resolve => setTimeout(resolve, 3000));
                    return fetchBGG(endpoint, params, retries - 1);
                }

                if (!response.ok) {
                    throw new Error(`BGG API fetch failed: Status ${response.status}`);
                }

                return await response.text();
            } catch (error) {
                throw new Error(`Network/API error: ${error.message}`);
            }
        }

        function parseXML(xmlText) {
            return new DOMParser().parseFromString(xmlText, 'text/xml');
        }

        async function startGame() {
            let username = document.getElementById('usernameInput').value.trim();
            // default to sportomax when empty per request
            if (!username) username = 'sportomax';
            const errorEl = document.getElementById('errorMessage');
            const loadingEl = document.getElementById('loadingMessage');

            errorEl.style.display = 'none';
            
            if (!username) {
                errorEl.textContent = 'Please enter a BGG username';
                errorEl.style.display = 'block';
                return;
            }

            difficulty = document.getElementById('difficultySelect').value;
            loadingEl.style.display = 'block';
            loadingEl.textContent = 'Loading your collection...';

            try {
                // Use collection v2 with stats to get thumbnails and ratings
                const collectionXMLText = await fetchBGG('collection', { username: username, own: '1', stats: '1' });
                const xml = parseXML(collectionXMLText);

                if (xml.querySelector('errors error')) {
                    throw new Error(xml.querySelector('errors error').textContent);
                }

                const items = xml.querySelectorAll('item');
                
                if (items.length === 0) {
                    throw new Error('No games found in collection');
                }

                collection = Array.from(items).map(item => {
                    const name = item.querySelector('name');
                    const thumbnail = item.querySelector('thumbnail');
                    const objectid = item.getAttribute('objectid');
                    // try to find bayesaverage under stats if present
                    let bayes = 0;
                    const stats = item.querySelector('stats') || item.querySelector('statistics');
                    if (stats) {
                        const bay = stats.querySelector('bayesaverage') || stats.querySelector('rating > bayesaverage');
                        if (bay) bayes = parseFloat(bay.getAttribute('value') || bay.textContent) || 0;
                    }
                    return {
                        id: objectid,
                        name: name ? name.textContent : 'Unknown',
                        thumbnail: thumbnail ? thumbnail.textContent : null,
                        bayes: bayes
                    };
                }).filter(game => game.thumbnail);

                const minGames = DIFFICULTY_SETTINGS[difficulty].itemsPerOrder * DIFFICULTY_SETTINGS[difficulty].maxOrders + 10;
                if (collection.length < minGames) {
                    throw new Error(`Need at least ${minGames} games with thumbnails for ${difficulty} mode`);
                }

                loadingEl.style.display = 'none';
                localStorage.setItem('overboxed_username', username);
                initializeGame();
            } catch (error) {
                loadingEl.style.display = 'none';
                errorEl.textContent = `Error loading collection: ${error.message}`;
                errorEl.style.display = 'block';
            }
        }

        function initializeGame() {
            score = 0;
            ordersCompleted = 0;
            currentOrders = [];
            selectedItems = [];
            gameActive = true;
            gamePaused = false;

            // Shuffle collection for shelf
            collection = collection.sort(() => Math.random() - 0.5);

            renderShelf();
            renderBins();
            generateOrder();
            updateUI();
            // periodic order generator: ensure new customers every 30s when under cap
            if (window._overboxedOrderInterval) clearInterval(window._overboxedOrderInterval);
            window._overboxedOrderInterval = setInterval(()=>{
                const settings = DIFFICULTY_SETTINGS[difficulty];
                if (!gameActive) return;
                if (currentOrders.length === 0 || currentOrders.length < settings.maxOrders) {
                    generateOrder();
                }
            }, 30000);
            
            // Switch to game screen
            document.getElementById('setupScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.add('active');
            document.getElementById('gameOverScreen').style.display = 'none';
        }

        function renderShelf() {
            const shelfGrid = document.getElementById('shelfGrid');
            // show full shelf but sorted alphabetically; support filtering
            const q = (document.getElementById('shelfSearch') && document.getElementById('shelfSearch').value.toLowerCase()) || '';
            const shelfList = collection.slice().sort((a, b) => (a.name || '').localeCompare(b.name || ''))
                .filter(g => !q || (g.name || '').toLowerCase().includes(q));
            shelfGrid.innerHTML = shelfList.map((game) => `
                <div id="shelf-${game.id}" class="shelf-item" draggable="true" ondragstart="onDragStart(event,'shelf:${game.id}')" onclick="selectShelfItem('${game.id}')" data-game-id="${game.id}">
                    <img src="${IMAGE_PROXY}${game.thumbnail}" alt="${game.name}"
                         onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23ecf0f1%22/><text x=%2250%22 y=%2250%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2240%22>🎲</text></svg>'">
                </div>
            `).join('');
            buildAlphaBar();
        }

        function renderBins() {
            Object.keys(stagedBins).forEach(bin=>{
                const el = document.getElementById(bin + 'Contents');
                if (!el) return;
                el.innerHTML = stagedBins[bin].map(s=>{
                    const pct = s._pct || 0;
                    const readyClass = s.ready ? 'staged-ready' : '';
                    const check = s.ready ? '<div style="position:absolute;right:4px;top:4px;background:rgba(46,204,113,0.95);color:#fff;padding:2px 6px;border-radius:6px;font-size:11px">✓</div>' : '';
                    return `
                        <div draggable="true" ondragstart="onDragStart(event,'staged:${s.uid}')" data-uid="${s.uid}" data-game-id="${s.id}" class="${readyClass}" style="width:48px;height:48px;border-radius:6px;overflow:hidden;border:2px solid rgba(255,255,255,0.04);cursor:grab;position:relative">
                            <img src='${IMAGE_PROXY}${s.thumbnail}' style='width:100%;height:100%;object-fit:cover' alt='${s.name}'>
                            <div class="stage-progress" id="stagedprog-${s.uid}" style="opacity:${pct>0 && !s.ready? '1':'0'}"><div class="stage-bar" style="width:${pct}%"></div></div>
                            ${check}
                        </div>`;
                }).join('');
            });
        }

        function buildAlphaBar() {
            const alpha = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
            const container = document.getElementById('alphaBar');
            if (!container) return;
            container.innerHTML = alpha.map(letter => `<div style="cursor:pointer;width:100%;text-align:center;user-select:none;" onclick="alphaJump('${letter}')">${letter}</div>`).join('');
        }

        function alphaJump(letter) {
            const shelfGrid = document.getElementById('shelfGrid');
            if (!shelfGrid) return;
            const items = shelfGrid.querySelectorAll('.shelf-item');
            for (const it of items) {
                const img = it.querySelector('img');
                const alt = (img && img.alt) ? img.alt.trim() : '';
                if (!alt) continue;
                if (alt[0].toUpperCase() === letter) {
                    it.scrollIntoView({ block: 'center', behavior: 'smooth' });
                    it.classList.add('selected');
                    setTimeout(()=> it.classList.remove('selected'), 600);
                    return;
                }
            }
        }

        function filterShelf() {
            renderShelf();
        }

        let generatedOrderCount = 0;
        function generateOrder() {
            if (!gameActive) return;

            const settings = DIFFICULTY_SETTINGS[difficulty];
            if (currentOrders.length >= settings.maxOrders) return;

            generatedOrderCount++;
            // Each order item now has multi-stage requirements using thematic steps (gather -> pack -> deliver)
            const STAGE_SETS = [
                ['deliver'],
                ['gather','deliver'],
                ['gather','pack','deliver'],
                ['pack','deliver']
            ];

            const orderItems = [];
            const availableGames = [...collection];
            // First order asks for 1, second for 2, up to settings.itemsPerOrder
            const itemCount = Math.min(settings.itemsPerOrder, generatedOrderCount);
            for (let i = 0; i < itemCount && availableGames.length > 0; i++) {
                const randomIndex = Math.floor(Math.random() * availableGames.length);
                const base = availableGames[randomIndex];
                const stages = STAGE_SETS[Math.floor(Math.random() * STAGE_SETS.length)].slice();
                // randomly decide station requirements: none, sticker, autograph, or both
                const stationChoices = [[], ['sticker'], ['autograph'], ['sticker','autograph']];
                const chosen = stationChoices[Math.floor(Math.random() * stationChoices.length)];
                if (chosen.length > 0) {
                    // Ensure sticker/autograph steps (if present) occur right before deliver
                    const orderStations = ['sticker','autograph'].filter(s=>chosen.includes(s));
                    const deliverIdx = stages.indexOf('deliver');
                    if (deliverIdx >= 0) {
                        stages.splice(deliverIdx, 0, ...orderStations);
                    } else {
                        stages.push(...orderStations);
                    }
                }
                orderItems.push({ ...base, collected: false, stages: stages, progress: 0 });
                availableGames.splice(randomIndex, 1);
            }

            const order = {
                id: Date.now(),
                customer: CUSTOMER_NAMES[Math.floor(Math.random() * CUSTOMER_NAMES.length)],
                customerEmoji: ['🙂','😄','🧑‍🍳','😎','🤠','🫡','🤗','🧑‍🚀'][Math.floor(Math.random()*8)],
                items: orderItems,
                timeLeft: settings.orderTime,
                completed: false
            };

            currentOrders.push(order);
            showToast(`New customer ${order.customer} arrived (${order.items.length} item${order.items.length>1?'s':''})`,`info`);
            startOrderTimer(order.id);
            renderOrders();
        }

        function startOrderTimer(orderId) {
            orderTimers[orderId] = setInterval(() => {
                if (gamePaused || !gameActive) return;

                const order = currentOrders.find(o => o.id === orderId);
                if (!order || order.completed) {
                    clearInterval(orderTimers[orderId]);
                    return;
                }

                order.timeLeft--;

                if (order.timeLeft <= 0) {
                    clearInterval(orderTimers[orderId]);
                    failOrder(orderId);
                }

                renderOrders();
            }, 1000);
        }

        function renderOrders() {
            const container = document.getElementById('ordersContainer');
            
            container.innerHTML = currentOrders.map(order => {
                const allCollected = order.items.every(item => item.collected);
                const isWarning = order.timeLeft <= 10;
                
                // compute starting stations for this order (unique first-stage values)
                const starting = Array.from(new Set(order.items.map(it => (it.stages && it.stages.length>0) ? it.stages[0] : 'deliver')));
                const stationIcons = {
                    gather: '📦', pack: '📦', deliver: '🚚', sticker: '🏷️', autograph: '✍️'
                };
                return `
                    <div class="order-card ${allCollected ? 'active' : ''} ${order.completed ? 'completed' : ''}">
                                <div class="order-header">
                                    <div style="display:flex;align-items:center;gap:8px">
                                        <div class="customer-name">${order.customerEmoji} ${order.customer}</div>
                                        <div style="display:flex;gap:6px;align-items:center">${starting.map(s => `<div title="${s}" style="font-size:14px">${stationIcons[s] || s}</div>`).join('')}</div>
                                    </div>
                                    <div class="order-timer ${isWarning ? 'warning' : ''}">${order.timeLeft}s</div>
                                </div>
                        <div class="order-items">
                            ${order.items.map(item => {
                                const nextStage = (item.stages && item.stages[item.progress]) || null;
                                const ready = nextStage && stagedBins[nextStage] && stagedBins[nextStage].some(s=>s.id === item.id && s.ready);
                                const badges = item.stages.map((s,si)=>{
                                    const done = si < (item.progress||0);
                                    const label = s === 'sticker' ? '🏷️' : (s === 'autograph' ? '✍️' : s);
                                    return `<div style="padding:2px 6px;border-radius:6px;background:${done? 'rgba(46,204,113,0.9)':'rgba(0,0,0,0.4)'};color:white;font-size:10px;font-weight:700">${label}</div>`;
                                }).join('');
                                return `
                                    <div draggable="true" ondragstart="onDragStart(event,'order:${order.id}:${item.id}')" class="order-item ${item.collected ? 'collected' : ''} ${inProgress[order.id + '-' + item.id] ? 'in-progress' : ''}" data-order-id="${order.id}" data-item-id="${item.id}" ondragover="event.preventDefault()" ondrop="handleDrop(event, ${order.id}, '${item.id}')">
                                        <img src="${IMAGE_PROXY}${item.thumbnail}" alt="${item.name}">
                                        <div class="stage-progress" id="prog-${order.id}-${item.id}"><div class="stage-bar"></div></div>
                                        <div style="position:absolute;left:6px;bottom:10px;display:flex;gap:4px;">${badges}</div>
                                        <div style="position:absolute;right:6px;top:6px;">
                                            <div style="width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;background:${ready? 'rgba(46,204,113,0.95)':'rgba(255,255,255,0.06)'};color:white;font-size:12px">${ready? '✓' : (nextStage? (stationIcons[nextStage]||'?') : '')}</div>
                                        </div>
                                    </div>`;
                            }).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectShelfItem(id) {
            if (!gameActive || gamePaused) return;

            const game = collection.find(g => g.id === id);
            if (!game) return;

            const item = document.querySelector(`.shelf-item[data-game-id="${id}"]`);

            // Check if already selected
            const existingIndex = selectedItems.findIndex(s => s.id === id);
            if (existingIndex >= 0) {
                selectedItems.splice(existingIndex, 1);
                if (item) item.classList.remove('selected');
            } else {
                // store id and ref to base game
                selectedItems.push({ id: id, game });
                if (item) item.classList.add('selected');
            }

            updateSubmitButton();
        }

        // Drag handlers
        function onDragStart(evt, id) {
            try { evt.dataTransfer.setData('text/plain', id); } catch (e) { /* some browsers */ evt.dataTransfer.setData('text', id); }
        }

        // Handle dropping a shelf game onto an order item
        function handleDrop(evt, orderId, itemId) {
            evt.preventDefault();
            const dropped = evt.dataTransfer.getData('text/plain') || evt.dataTransfer.getData('text') || '';
            if (!dropped) return;
            // if dropped id doesn't match the order item id, show a quick flash
            // allow staged:<uid> to be dropped onto order item to perform action if ready
            if (dropped.startsWith('staged:')) {
                const uid = dropped.split(':')[1];
                let found = null; let binName = null;
                for (const b of Object.keys(stagedBins)) {
                    const idx = stagedBins[b].findIndex(s=>s.uid === uid);
                    if (idx >= 0) { found = stagedBins[b][idx]; binName = b; break; }
                }
                if (found) {
                    // check it matches this order item; allow immediate use for deliver bin
                    if (found.id === itemId && (found.ready || binName === 'deliver')) {
                        const order = currentOrders.find(o => o.id === orderId);
                        if (!order) return;
                        const item = order.items.find(i => i.id === itemId);
                        if (!item || item.collected) return;
                        const nextAction = (item.stages && item.stages[item.progress]) || 'deliver';
                        if (nextAction === binName) {
                            // start performing action (performActionOn will consume staged item when complete)
                            performActionOn(orderId, itemId, nextAction);
                            return;
                        }
                    } else {
                        // not a matching staged item — flash
                        const el = evt.currentTarget;
                        if (el) { el.style.transform = 'translateX(-6px)'; setTimeout(()=> el.style.transform = '', 120); }
                        return;
                    }
                }
            }
            if (dropped !== itemId) {
                const el = evt.currentTarget;
                if (el) {
                    el.style.transform = 'translateX(-6px)';
                    setTimeout(()=> el.style.transform = '', 120);
                }
                return;
            }
            // Find the order and item, determine next required action
            const order = currentOrders.find(o => o.id === orderId);
            if (!order) return;
            const item = order.items.find(i => i.id === itemId);
            if (!item || item.collected) return;
            const nextAction = (item.stages && item.stages[item.progress]) || 'deliver';
            // Directly perform the action on this order/item
            performActionOn(orderId, itemId, nextAction);
        }

        // Perform action on a specific order/item (same behavior as performAction but targeted)
        function performActionOn(orderId, itemId, action) {
            if (!gameActive || gamePaused) return;
            const order = currentOrders.find(o => o.id === orderId);
            if (!order) return;
            const it = order.items.find(i => i.id === itemId && !i.collected && (i.stages && i.stages[i.progress] === action));
            if (!it) return;

            const key = `${order.id}-${it.id}`;
            if (inProgress[key]) return;
            const duration = ACTION_DURATIONS[action] || 1500;
            inProgress[key] = true;
            renderOrders();

            // animate progress bar
            requestAnimationFrame(() => {
                const progEl = document.getElementById(`prog-${order.id}-${it.id}`);
                if (progEl) {
                    const bar = progEl.querySelector('.stage-bar');
                    progEl.style.opacity = '1';
                    if (bar) {
                        bar.style.transition = `width ${duration}ms linear`;
                        bar.style.width = '0%';
                        void bar.offsetWidth;
                        bar.style.width = '100%';
                    }
                }
            });

            setTimeout(() => {
                const freshOrder = currentOrders.find(o => o.id === order.id);
                if (!freshOrder) { delete inProgress[key]; return; }
                const freshItem = freshOrder.items.find(i => i.id === it.id);
                if (freshItem) {
                    freshItem.progress = (freshItem.progress || 0) + 1;
                    if (freshItem.progress >= (freshItem.stages ? freshItem.stages.length : 1)) {
                        freshItem.collected = true;
                    }
                }
                const progEl2 = document.getElementById(`prog-${order.id}-${it.id}`);
                if (progEl2) {
                    const bar2 = progEl2.querySelector('.stage-bar');
                    if (bar2) { bar2.style.transition = 'width 200ms linear'; bar2.style.width = '0%'; }
                    progEl2.style.opacity = '0';
                }
                delete inProgress[key];
                // when performed via staged item, try to consume a staged thumbnail matching this game from any bin
                const binsRemoved = [];
                Object.keys(stagedBins).forEach(b=>{
                    const si = stagedBins[b].findIndex(s=>s.id === it.id);
                    if (si >= 0) {
                        stagedBins[b].splice(si,1);
                        binsRemoved.push(b);
                    }
                });
                renderBins();
                // animate acceptance for any bins that had an item removed
                binsRemoved.forEach(b => animateBinAccept(b + 'Contents'));
                renderOrders();
                // if order complete
                const maybeOrder = currentOrders.find(o => o.id === order.id);
                if (maybeOrder && maybeOrder.items.every(i => i.collected)) completeOrder(order.id);
            }, duration);
        }

        // Handle dropping onto a bin (gather/pack/deliver)
        function onBinDrop(evt, binAction) {
            evt.preventDefault();
            const data = evt.dataTransfer.getData('text/plain') || evt.dataTransfer.getData('text') || '';
            if (!data) return;

            // if dragging an order item: payload order:<orderId>:<itemId>
            if (data.startsWith('order:')) {
                const parts = data.split(':');
                const orderId = parseInt(parts[1], 10);
                const itemId = parts[2];
                // moving an order item into a bin should not auto-complete — treat as staging the item into the bin
                const order = currentOrders.find(o => o.id === orderId);
                if (!order) return;
                const it = order.items.find(i => i.id === itemId);
                if (!it) return;
                // create staged copy
                const uid = makeUid();
                stagedBins[binAction].push({ uid, id: it.id, thumbnail: it.thumbnail, name: it.name, createdAt: Date.now(), startedAt: Date.now(), requiredDuration: ACTION_DURATIONS[binAction] || 1500, ready: false, _pct: 0, _notified: false });
                renderBins();
                return;
            }

            // shelf:payload indicates a shelf item being dropped into a bin (create staged item)
            if (data.startsWith('shelf:')) {
                const shelfId = data.split(':')[1];
                const game = collection.find(g => g.id === shelfId);
                if (!game) return;
                const uid = makeUid();
                stagedBins[binAction].push({ uid, id: game.id, thumbnail: game.thumbnail, name: game.name, createdAt: Date.now(), startedAt: Date.now(), requiredDuration: ACTION_DURATIONS[binAction] || 1500, ready: false, _pct: 0, _notified: false });
                renderBins();
                animateBinAccept(binAction + 'Contents');
                showToast(`${game.name} staged to ${binAction}`, 'info');
                return;
            }

            // staged:<uid> moves a staged item between bins
            if (data.startsWith('staged:')) {
                const uid = data.split(':')[1];
                // find where it currently is
                for (const b of Object.keys(stagedBins)) {
                    const idx = stagedBins[b].findIndex(s => s.uid === uid);
                        if (idx >= 0) {
                            const item = stagedBins[b].splice(idx,1)[0];
                            // reset timing when moving bins
                            item.startedAt = Date.now();
                            item.requiredDuration = ACTION_DURATIONS[binAction] || 1500;
                            item.ready = false;
                            item._pct = 0;
                            item._notified = false;
                            stagedBins[binAction].push(item);
                            renderBins();
                            animateBinAccept(binAction + 'Contents');
                            showToast(`${item.name} moved to ${binAction}`, 'info');
                            return;
                        }
                }
            }

            // fallback: flash bin to indicate invalid drop
            const el = evt.currentTarget;
            if (el) {
                const orig = el.style.boxShadow;
                el.style.boxShadow = '0 0 0 3px rgba(255,0,0,0.22)';
                setTimeout(()=> el.style.boxShadow = orig, 350);
            }
        }

        // highlight bin on drag enter/leave
        function onBinDragEnter(evt, bin) {
            const root = document.getElementById(bin + 'Bin');
            if (root) root.classList.add('bin-highlight');
        }
        function onBinDragLeave(evt, bin) {
            const root = document.getElementById(bin + 'Bin');
            if (root) root.classList.remove('bin-highlight');
        }

        // animate accept on bin contents container id (e.g. 'gatherContents')
        function animateBinAccept(contentsId) {
            const container = document.getElementById(contentsId);
            if (!container) return;
            // briefly add class to container to show acceptance
            container.classList.add('bin-accept');
            setTimeout(()=> container.classList.remove('bin-accept'), 520);
        }

        function updateSubmitButton() {
            // update action buttons availability
            const hasSelection = selectedItems.length > 0;
            document.getElementById('gatherBtn').disabled = !hasSelection;
            document.getElementById('packBtn').disabled = !hasSelection;
            document.getElementById('deliverBtn').disabled = !hasSelection;
            // station buttons removed — drag/drop bins only
        }

        function clearSelection() {
            selectedItems = [];
            document.querySelectorAll('.shelf-item').forEach(item => {
                item.classList.remove('selected');
            });
            updateSubmitButton();
        }

        function submitOrder() {
            if (selectedItems.length === 0) return;
            // Legacy submitOrder is replaced by stage-based performAction
            // For compatibility, treat submit as 'deliver' action
            performAction('deliver');
        }

        function completeOrder(orderId) {
            const order = currentOrders.find(o => o.id === orderId);
            if (!order) return;

            order.completed = true;
            clearInterval(orderTimers[orderId]);

            // Calculate score based on time left
            const timeBonus = Math.floor(order.timeLeft * 10);
            score += 100 + timeBonus;
            ordersCompleted++;

            // Remove completed order after delay
            setTimeout(() => {
                currentOrders = currentOrders.filter(o => o.id !== orderId);
                renderOrders();
                
                // Generate new order
                if (gameActive) {
                    generateOrder();
                }
            }, 1000);

            // show confetti for completed order
            showConfettiForOrder(orderId);
            showToast('Customer happy! Order complete 🎉', 'success');

            updateUI();
        }

        // performAction: apply an action (chop/cook/plate) to selected shelf items
        function performAction(action) {
            if (!gameActive || gamePaused) return;
            if (selectedItems.length === 0) return;

            // For each current order, try to start an async action (with visual progress) for matching items
            for (const order of currentOrders) {
                if (order.completed) continue;

                for (const sel of [...selectedItems]) {
                    const targetIndex = order.items.findIndex(it => !it.collected && it.id === sel.id && (it.stages && it.stages[it.progress] === action));
                    if (targetIndex >= 0) {
                        const it = order.items[targetIndex];
                        const key = `${order.id}-${it.id}`;
                        if (inProgress[key]) continue; // already working on this item

                        const duration = ACTION_DURATIONS[action] || 1500;
                        inProgress[key] = true;
                        renderOrders(); // show in-progress styling and progress element

                        // kick off visual progress
                        requestAnimationFrame(() => {
                            const progEl = document.getElementById(`prog-${order.id}-${it.id}`);
                            if (progEl) {
                                const bar = progEl.querySelector('.stage-bar');
                                progEl.style.opacity = '1';
                                if (bar) {
                                    bar.style.transition = `width ${duration}ms linear`;
                                    // ensure starting at 0
                                    bar.style.width = '0%';
                                    // force reflow then animate
                                    void bar.offsetWidth;
                                    bar.style.width = '100%';
                                }
                            }
                        });

                        // completion handler
                        setTimeout(() => {
                            // find the order/item again (DOM may have changed)
                            const freshOrder = currentOrders.find(o => o.id === order.id);
                            if (!freshOrder) {
                                delete inProgress[key];
                                return;
                            }
                            const freshItem = freshOrder.items.find(i => i.id === it.id);
                            if (freshItem) {
                                freshItem.progress = (freshItem.progress || 0) + 1;
                                if (freshItem.progress >= (freshItem.stages ? freshItem.stages.length : 1)) {
                                    freshItem.collected = true;
                                }
                            }

                            // clear visuals
                            const progEl2 = document.getElementById(`prog-${order.id}-${it.id}`);
                            if (progEl2) {
                                const bar2 = progEl2.querySelector('.stage-bar');
                                if (bar2) {
                                    bar2.style.transition = 'width 200ms linear';
                                    bar2.style.width = '0%';
                                }
                                progEl2.style.opacity = '0';
                            }

                            delete inProgress[key];

                            // remove selection (consumed)
                            const selIdx = selectedItems.findIndex(s => s.id === sel.id);
                            if (selIdx >= 0) {
                                const removed = selectedItems.splice(selIdx, 1)[0];
                                // unselect shelf UI
                                document.querySelectorAll('.shelf-item').forEach(si => {
                                    if (si.getAttribute('data-game-id') === removed.id) si.classList.remove('selected');
                                });
                            }

                            renderOrders();
                            updateSubmitButton();

                            // if order complete, handle
                            const maybeOrder = currentOrders.find(o => o.id === order.id);
                            if (maybeOrder && maybeOrder.items.every(i => i.collected)) {
                                completeOrder(order.id);
                            }
                        }, duration);
                    }
                }
            }
        }

        function failOrder(orderId) {
            const order = currentOrders.find(o => o.id === orderId);
            if (!order) return;

            // apply penalty for unhappy customer
            const penaltyPerItem = 50;
            const penalty = penaltyPerItem * (order.items ? order.items.length : 1);
            score = Math.max(0, (score || 0) - penalty);
            updateUI();

            // Remove failed order
            currentOrders = currentOrders.filter(o => o.id !== orderId);
            renderOrders();
            showToast('Customer unhappy — order failed', 'error');

            // Game over if no orders left
            if (currentOrders.length === 0) {
                endGame();
            } else {
                // Generate new order
                generateOrder();
            }
        }

        function updateUI() {
            document.getElementById('gameScore').textContent = score;
            document.getElementById('ordersComplete').textContent = ordersCompleted;
        }

        function pauseGame(btn) {
            gamePaused = !gamePaused;
            btn.textContent = gamePaused ? 'Resume' : 'Pause';
        }

        function endGame() {
            gameActive = false;
            
            // Clear all timers
            Object.values(orderTimers).forEach(timer => clearInterval(timer));
            if (window._overboxedOrderInterval) { clearInterval(window._overboxedOrderInterval); window._overboxedOrderInterval = null; }

            const gameOverEl = document.getElementById('gameOverScreen');
            gameOverEl.innerHTML = `
                <div class="game-over-screen">
                    <h2>Game Over! 📦</h2>
                    <div class="final-score">${score}</div>
                    <div style="font-size: 1.1rem; margin-bottom: 1rem;">Final Score</div>
                    <div class="stats">
                        <div class="stat-item">
                            <div class="stat-value">${ordersCompleted}</div>
                            <div class="stat-label">Orders Completed</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${difficulty.toUpperCase()}</div>
                            <div class="stat-label">Difficulty</div>
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="initializeGame()" style="margin-top: 1rem;">
                        Play Again
                    </button>
                </div>
            `;
            gameOverEl.style.display = 'block';
        }

        function backToSetup() {
            gameActive = false;
            Object.values(orderTimers).forEach(timer => clearInterval(timer));
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('setupScreen').classList.add('active');
        }

        // Load saved username
        window.addEventListener('DOMContentLoaded', () => {
            const savedUsername = localStorage.getItem('overboxed_username');
            if (savedUsername) {
                document.getElementById('usernameInput').value = savedUsername;
            }
        });

        // Confetti helper (simple DOM particles, no audio)
        function showConfettiForOrder(orderId) {
            let container = document.body;
            try {
                const itemEl = document.querySelector(`.order-item[data-order-id="${orderId}"]`);
                const orderCard = itemEl ? itemEl.closest('.order-card') : null;
                container = orderCard || document.querySelector('.order-card') || document.body;
            } catch (e) {
                container = document.body;
            }
            const confRoot = document.createElement('div');
            confRoot.style.position = 'absolute';
            confRoot.style.left = '0';
            confRoot.style.top = '0';
            confRoot.style.width = '100%';
            confRoot.style.height = '100%';
            confRoot.style.pointerEvents = 'none';
            container.style.position = container.style.position || 'relative';
            container.appendChild(confRoot);

            const colors = ['#f1c40f','#e74c3c','#2ecc71','#3498db','#9b59b6'];
            for (let i=0;i<30;i++) {
                const p = document.createElement('div');
                p.style.position = 'absolute';
                p.style.width = '8px';
                p.style.height = '12px';
                p.style.background = colors[Math.floor(Math.random()*colors.length)];
                p.style.left = (50 + (Math.random()-0.5)*60) + '%';
                p.style.top = (30 + Math.random()*10) + '%';
                p.style.opacity = '0.95';
                p.style.transform = `translateY(0) rotate(${Math.random()*360}deg)`;
                p.style.borderRadius = '2px';
                p.style.transition = `transform ${800+Math.random()*800}ms cubic-bezier(.2,.7,.2,1), opacity 900ms ease-out`;
                confRoot.appendChild(p);
                // animate
                requestAnimationFrame(()=>{
                    p.style.transform = `translateY(${120 + Math.random()*180}px) translateX(${(Math.random()-0.5)*160}px) rotate(${Math.random()*720}deg)`;
                    p.style.opacity = '0';
                });
            }

            setTimeout(()=> confRoot.remove(), 1700);
        }

        // Toast helper
        function showToast(message, type = 'info', duration = 3200) {
            try {
                const root = document.getElementById('toasts');
                if (!root) return;
                const t = document.createElement('div');
                t.className = 'toast ' + (type || '');
                t.textContent = message;
                root.appendChild(t);
                // force reflow then show
                requestAnimationFrame(()=> t.classList.add('show'));
                setTimeout(()=> { t.classList.remove('show'); setTimeout(()=> t.remove(), 260); }, duration);
            } catch(e) { console.warn('toast error', e); }
        }

        // Staged items progress updater
        if (window._stagedProgressInterval) clearInterval(window._stagedProgressInterval);
        window._stagedProgressInterval = setInterval(()=>{
            let changed = false;
            const now = Date.now();
            Object.keys(stagedBins).forEach(bin => {
                stagedBins[bin].forEach(s => {
                    if (s.ready) return;
                    const dur = s.requiredDuration || ACTION_DURATIONS[bin] || 1500;
                    const started = s.startedAt || s.createdAt || now;
                    const elapsed = now - started;
                    const pct = Math.min(100, Math.floor((elapsed / dur) * 100));
                    if (s._pct !== pct) { s._pct = pct; changed = true; }
                    if (pct >= 100 && !s.ready) {
                        s.ready = true;
                        changed = true;
                        if (!s._notified) {
                            showToast(`${s.name} ready in ${bin}`, 'info');
                            s._notified = true;
                        }
                    }
                });
            });
            if (changed) renderBins();
        }, 300);

        // expose a quick cleanup when unloading
        window.addEventListener('beforeunload', ()=>{
            if (window._overboxedOrderInterval) clearInterval(window._overboxedOrderInterval);
        });
    </script>
    <!-- Vercel Web Analytics removed for standalone page stability -->
</body>
</html>
