<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Lane Rush — Arcade</title>
    <style>
        html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto}
        body{background:linear-gradient(#11998e,#38ef7d);display:flex;align-items:center;justify-content:center}
        .wrap{width:100%;max-width:600px;height:700px;background:#042a2b;border-radius:12px;position:relative;overflow:hidden}
        canvas{width:100%;height:100%;display:block}
        .hud{position:absolute;left:12px;top:12px;color:#fff}
        .home{position:absolute;right:12px;top:12px;color:#fff}
    </style>
</head>
<body>
    <div class="wrap">
        <canvas id="c" width="600" height="700"></canvas>
        <div class="hud"><strong id="score">0</strong></div>
        <a class="home" href="../home.html">Home</a>
    </div>
    <script>
        const canvas = document.getElementById('c'); const ctx = canvas.getContext('2d');
        const lanes = [120, 260, 400];
        const player = { lane:1, x:50, y:0, w:64, h:64 };
        const items = [];
        let score = 0;
        const thumbs = [];
        let thumbPool = [];
        let thumbIndex = 0;
        async function loadCollection(username='sportomax'){
            try {
                const res = await fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1`);
                if (!res.ok) throw new Error('collection fetch failed');
                const text = await res.text();
                const xml = new DOMParser().parseFromString(text, 'text/xml');
                const found = Array.from(xml.querySelectorAll('item')).map(it=>({
                    thumbnail: (it.querySelector('thumbnail')||{textContent:''}).textContent
                })).filter(x=>x.thumbnail).slice(0,60);
                for (const f of found){ const img = new Image(); img.crossOrigin='anonymous'; img.src = 'https://images.weserv.nl/?url=' + encodeURIComponent(f.thumbnail); thumbs.push(img); }
                // initialize thumb pool (shuffle)
                thumbPool = thumbs.slice();
                shuffleArray(thumbPool);
                thumbIndex = 0;
            } catch(e){ console.warn('loadCollection failed', e); }
        }

        function spawn(){
            const lane = Math.floor(Math.random()*3);
            const kind = Math.random()<0.7? 'thumb' : 'bad';
            let thumb = null;
            if (kind === 'thumb' && thumbPool.length) {
                thumb = thumbPool[thumbIndex++];
                if (thumbIndex >= thumbPool.length) { thumbIndex = 0; shuffleArray(thumbPool); }
            }
            items.push({ lane, y:-80, speed: 2 + Math.random()*2, kind, hit:false, thumb });
        }

        setInterval(()=>{ if (Math.random()<0.9) spawn(); }, 700);

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        window.addEventListener('keydown', e=>{
            if (e.key==='ArrowLeft'){ player.lane = Math.max(0, player.lane-1);} else if (e.key==='ArrowRight'){ player.lane = Math.min(2, player.lane+1); }
        });

        let touchStartX = null;
        canvas.addEventListener('touchstart', e=>{ touchStartX = e.touches[0].clientX; }, {passive:true});
        canvas.addEventListener('touchend', e=>{ const dx = (e.changedTouches[0].clientX - touchStartX); if (dx>30) player.lane = Math.min(2, player.lane+1); if (dx<-30) player.lane = Math.max(0, player.lane-1); }, {passive:true});

        let flashTimer = 0;
        function update(){
            // update items
            for (const it of items){ it.y += it.speed; }
            // check collisions
            for (const it of items){
                if (it.hit) continue;
                if (it.y > 520 && it.lane === player.lane){
                    it.hit = true;
                    // thumbs are collectibles — do NOT punish for switching into them; award points instead
                    if (it.kind === 'thumb') {
                        score += 15; // collect reward
                    } else {
                        // bad items punish
                        const loss = 20;
                        score = Math.max(0, score - loss);
                        flashTimer = 12; // frames of red flash
                    }
                    document.getElementById('score').textContent = score;
                }
            }

            // award points for items that pass the player without hitting
            for (const it of items){
                if (it._processed) continue;
                if (it.y > 580){
                    it._processed = true;
                    // if it wasn't collected/hit and player wasn't in lane, award dodge points
                    if (!it.hit){
                        score += (it.kind === 'thumb' ? 5 : 3);
                        document.getElementById('score').textContent = score;
                    }
                }
            }
            // cull
            while (items.length && items[0].y > 900) items.shift();
            if(flashTimer>0) flashTimer--;
        }

        function draw(){
            ctx.clearRect(0,0,canvas.width,canvas.height);
            // vertical highway-style lanes
            for (let i=0;i<3;i++){
                const laneX = 120 + i*140;
                // asphalt
                ctx.fillStyle = '#2b2b2b';
                ctx.fillRect(laneX-40, 0, 120, canvas.height);
                // side solid lines
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.setLineDash([]);
                ctx.beginPath(); ctx.moveTo(laneX-36, 0); ctx.lineTo(laneX-36, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(laneX+82, 0); ctx.lineTo(laneX+82, canvas.height); ctx.stroke();
                // center dashed line
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.setLineDash([18,12]);
                ctx.beginPath(); ctx.moveTo(laneX+22, 0); ctx.lineTo(laneX+22, canvas.height); ctx.stroke();
                ctx.setLineDash([]);
            }
            // items
            for (const it of items){
                const x = 120 + it.lane * 140;
                if (it.thumb && it.thumb.complete) {
                    ctx.drawImage(it.thumb, x, it.y, 64, 64);
                } else {
                    ctx.fillStyle = it.kind==='thumb'? '#ffd54f' : '#ef5350';
                    ctx.fillRect(x, it.y, 64,64);
                    ctx.fillStyle = '#000'; ctx.font='28px serif'; ctx.fillText(it.kind==='thumb'? '🎴':'💥', x+10, it.y+42);
                }
            }
            // player (draw on bottom)
            const px = 120 + player.lane * 140;
            ctx.fillStyle = '#fff'; ctx.fillRect(px, 580, 64,64);
            ctx.fillStyle = '#000'; ctx.font='28px serif'; ctx.fillText('🧑', px+12, 612);
            // flash overlay when hit
            if(flashTimer>0){ ctx.fillStyle='rgba(255,40,40,'+(flashTimer/18)+')'; ctx.fillRect(0,0,canvas.width,canvas.height); }
        }

        // load thumbnails then run
        loadCollection('sportomax').then(()=>{ function loop(){ update(); draw(); requestAnimationFrame(loop); } loop(); });
    </script>
</body>
</html>
