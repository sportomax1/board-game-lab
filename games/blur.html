<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Blur Guess Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), transparent),
                              radial-gradient(circle at bottom left, rgba(236, 72, 153, 0.1), transparent);
            color: #f8fafc;
            overscroll-behavior: none;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .blur-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            max-width: 420px;
            margin: 0 auto;
            border-radius: 2rem;
            overflow: hidden;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: rgba(15, 23, 42, 0.8);
        }

        .blur-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(99, 102, 241, 0.1), transparent);
            z-index: 1;
        }

        .blur-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: blur(var(--blur-amount, 40px));
            transition: filter 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease;
            opacity: 0;
            padding: 12px;
            z-index: 2;
        }

        .blur-image.loaded {
            opacity: 1;
        }

        .blur-image.hidden-mode {
            filter: none;
            clip-path: inset(var(--reveal-top, 45%) var(--reveal-right, 45%) var(--reveal-bottom, 45%) var(--reveal-left, 45%));
            transition: clip-path 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Transition state for "blurring area" between games */
        .blur-container.transitioning .blur-image {
            opacity: 0;
            filter: blur(60px);
        }

        .btn-action {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 1rem;
            padding-bottom: 1rem;
            border-radius: 1rem;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.2s;
            min-height: 54px;
        }
        .btn-action:active { transform: scale(0.95); }

        .btn-honor {
            flex: 1;
            padding-top: 1rem;
            padding-bottom: 1rem;
            border-radius: 1rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: all 0.2s;
        }
        .btn-honor:active { transform: scale(0.95); }

        /* Optimization for iPhone vertical space */
        @media (max-height: 700px) {
            .blur-container { max-width: 320px; }
            h1 { font-size: 1.5rem !important; }
            .settings-card { padding: 1.5rem !important; }
        }

        .feedback-badge {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .feedback-badge.active {
            opacity: 1;
        }

        .feedback-content {
            padding: 1.5rem 3rem;
            border-radius: 2rem;
            font-size: 2rem;
            font-weight: 800;
            transform: scale(0.5);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .feedback-badge.active .feedback-content {
            transform: scale(1);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transition: all 0.2s;
        }

        .btn-primary:active {
            transform: scale(0.95);
        }

        .progress-bar-container {
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            width: 0%;
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
        }

        .settings-card {
            max-height: 85vh;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .floating {
            animation: float 4s ease-in-out infinite;
        }

        /* Mobile Adjustments */
        @media (max-width: 640px) {
            .blur-container {
                aspect-ratio: 1/1;
                border-radius: 1.5rem;
            }
            .feedback-content {
                padding: 1rem 2rem;
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Screen 1: Settings -->
    <div id="settingsScreen" class="w-full max-w-lg z-10">
        <div class="glass settings-card p-6 md:p-8 rounded-[2.5rem] shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <div class="inline-block p-3 bg-indigo-500/20 rounded-2xl mb-2 floating">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                </div>
                <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-pink-400">BLUR GUESS</h1>
                <p class="text-slate-400 font-medium">Test your visual recognition</p>
            </div>

            <div class="space-y-4">
                <div class="space-y-2">
                    <label class="text-sm font-bold text-slate-300 uppercase tracking-wider ml-1">BGG Username</label>
                    <div class="relative">
                        <input type="text" id="bggUsername" placeholder="sportomax" value="sportomax" 
                            class="w-full bg-slate-800/50 border border-slate-700 p-4 rounded-2xl text-white placeholder-slate-500 focus:border-indigo-500 transition-all">
                        <div class="absolute right-4 top-4 text-indigo-400">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">Game Mode</label>
                        <select id="gameMode" class="w-full bg-slate-800/50 border border-slate-700 p-3 rounded-xl text-white appearance-none focus:border-indigo-500 transition-all">
                            <option value="normal">Timed Blur</option>
                            <option value="hidden">Mystery Reveal</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">Hint Style</label>
                        <select id="hintType" class="w-full bg-slate-800/50 border border-slate-700 p-3 rounded-xl text-white appearance-none focus:border-indigo-500 transition-all">
                            <option value="none">No Hint</option>
                            <option value="letters">First 3 Letters</option>
                            <option value="length">Word Length</option>
                            <option value="both">Both</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-4 bg-slate-900/40 p-4 rounded-3xl border border-slate-800">
                    <div class="flex flex-wrap gap-4">
                        <label class="flex items-center space-x-2 cursor-pointer group">
                            <input type="checkbox" id="filterOwn" checked class="w-5 h-5 rounded border-slate-700 text-indigo-600 bg-slate-800 focus:ring-0">
                            <span class="text-sm text-slate-300 group-hover:text-white transition-colors">Own</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer group">
                            <input type="checkbox" id="filterPrevOwned" class="w-5 h-5 rounded border-slate-700 text-indigo-600 bg-slate-800 focus:ring-0">
                            <span class="text-sm text-slate-300 group-hover:text-white transition-colors">Prev</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer group">
                            <input type="checkbox" id="filterWantToPlay" class="w-5 h-5 rounded border-slate-700 text-indigo-600 bg-slate-800 focus:ring-0">
                            <span class="text-sm text-slate-300 group-hover:text-white transition-colors">Want Play</span>
                        </label>
                    </div>
                </div>

                <div class="space-y-2">
                    <div class="flex justify-between px-1">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-widest">Initial Blur</label>
                        <span id="blurVal" class="text-xs font-bold text-indigo-400">30px</span>
                    </div>
                    <input type="range" id="blurSlider" min="5" max="60" value="30" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                </div>

                <button id="startButton" class="btn-primary w-full py-5 rounded-2xl text-lg font-extrabold uppercase tracking-widest transition-all">
                    Start Challenge
                </button>
            </div>
        </div>
    </div>

    <!-- Screen 2: Game Area -->
    <div id="gameScreen" class="hidden w-full max-w-2xl flex flex-col gap-6">
        <!-- Header Info -->
        <div class="glass p-4 rounded-3xl flex items-center justify-between px-6">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-500/20 rounded-xl flex items-center justify-center text-indigo-400 font-bold" id="progressIndicator">
                    1
                </div>
                <div class="flex flex-col">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">Progress</span>
                    <span class="text-sm font-bold text-white" id="progressText">Game 1 of 10</span>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex flex-col items-end">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">Current Score</span>
                    <span class="text-xl font-black text-indigo-400" id="scoreValue">0</span>
                </div>
            </div>
        </div>

        <div class="progress-bar-container">
            <div id="progressBar" class="progress-bar-fill"></div>
        </div>

        <!-- Main Image Container -->
        <div class="blur-container glass">
            <img id="blurImage" src="" alt="Guess the game" class="blur-image">
            <div id="feedbackBadge" class="feedback-badge">
                <div class="feedback-content glass shadow-2xl"></div>
            </div>
            <div id="hintLabel" class="absolute bottom-4 left-1/2 -translate-x-1/2 glass px-4 py-2 rounded-xl text-xs font-bold text-yellow-400 shadow-xl hidden">
                HINT: <span></span>
            </div>
        </div>

        <!-- Inputs and Controls -->
        <div class="space-y-4">
            <div class="flex gap-3">
                <input type="text" id="guessInput" placeholder="Guess the game name..." 
                    class="flex-1 bg-slate-800 border border-slate-700 p-5 rounded-2xl text-white font-semibold shadow-xl">
                <button id="submitBtn" class="btn-primary px-8 rounded-2xl font-bold uppercase tracking-wider text-sm shadow-xl">
                    Guess
                </button>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                <button id="revealBtn" class="glass py-4 rounded-2xl text-xs font-bold uppercase tracking-widest text-slate-300 hover:text-white transition-all">
                    Reveal
                </button>
                <button id="skipBtn" class="glass py-4 rounded-2xl text-xs font-bold uppercase tracking-widest text-slate-300 hover:text-white transition-all">
                    Skip
                </button>
                <button id="mysteryBtn" class="glass py-4 rounded-2xl text-xs font-bold uppercase tracking-widest text-indigo-400 hover:text-indigo-300 transition-all hidden">
                    Show More
                </button>
                <button id="exitBtn" class="glass py-4 rounded-2xl text-xs font-bold uppercase tracking-widest text-red-400/70 hover:text-red-400 transition-all">
                    Exit
                </button>
            </div>
            
            <div id="answerRow" class="hidden glass p-4 rounded-2xl text-center border-indigo-500/30 space-y-3">
                <div>
                    <span class="text-xs font-bold text-slate-400 uppercase block mb-1">The answer was:</span>
                    <span id="correctAnswer" class="text-lg font-black text-indigo-400"></span>
                </div>
                <div class="flex gap-2 justify-center">
                    <button id="honorRightBtn" class="bg-green-500/20 hover:bg-green-500/40 text-green-400 text-[10px] font-bold uppercase px-4 py-2 rounded-lg border border-green-500/30 transition-all">
                        I Got it Right
                    </button>
                    <button id="honorWrongBtn" class="bg-red-500/20 hover:bg-red-500/40 text-red-400 text-[10px] font-bold uppercase px-4 py-2 rounded-lg border border-red-500/30 transition-all">
                        I was Wrong
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Screen 3: Results -->
    <div id="resultsScreen" class="hidden w-full max-w-lg space-y-6">
        <div class="glass p-8 rounded-[2.5rem] shadow-2xl text-center space-y-6">
            <h2 class="text-4xl font-black bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-pink-400">FINISH LINE!</h2>
            
            <div class="flex justify-center gap-8 py-4">
                <div class="flex flex-col">
                    <span class="text-4xl font-black text-white" id="finalScore">0</span>
                    <span class="text-xs font-bold text-slate-500 uppercase">Correct</span>
                </div>
                <div class="w-[1px] bg-slate-700"></div>
                <div class="flex flex-col">
                    <span class="text-4xl font-black text-white" id="finalAccuracy">0%</span>
                    <span class="text-xs font-bold text-slate-500 uppercase">Accuracy</span>
                </div>
            </div>

            <div id="resultsList" class="space-y-3 max-h-[300px] overflow-y-auto pr-2 custom-scrollbar text-left">
                <!-- Result items -->
            </div>

            <button onclick="location.reload()" class="btn-primary w-full py-5 rounded-2xl text-lg font-extrabold uppercase tracking-widest shadow-2xl">
                Play Again
            </button>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loader" class="fixed inset-0 bg-slate-950/90 z-50 hidden flex flex-col items-center justify-center p-8 text-center space-y-4">
        <div class="w-16 h-16 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
        <div class="space-y-1">
            <p class="text-xl font-bold text-white">Fetching Collection</p>
            <p class="text-sm text-slate-400 font-medium">Preparing your custom challenge...</p>
        </div>
    </div>

    <script>
        // Game State
        const state = {
            gameData: [],
            currentIndex: 0,
            score: 0,
            totalGames: 10,
            gameMode: 'normal',
            hintType: 'none',
            revealPercentage: 10,
            isRevealed: false,
            results: []
        };

        // DOM Elements
        const screens = {
            settings: document.getElementById('settingsScreen'),
            game: document.getElementById('gameScreen'),
            results: document.getElementById('resultsScreen')
        };

        const elements = {
            bggUsername: document.getElementById('bggUsername'),
            blurSlider: document.getElementById('blurSlider'),
            blurVal: document.getElementById('blurVal'),
            startBtn: document.getElementById('startButton'),
            loader: document.getElementById('loader'),
            blurImage: document.getElementById('blurImage'),
            progressBar: document.getElementById('progressBar'),
            progressIndicator: document.getElementById('progressIndicator'),
            progressText: document.getElementById('progressText'),
            scoreValue: document.getElementById('scoreValue'),
            guessInput: document.getElementById('guessInput'),
            submitBtn: document.getElementById('submitBtn'),
            revealBtn: document.getElementById('revealBtn'),
            skipBtn: document.getElementById('skipBtn'),
            mysteryBtn: document.getElementById('mysteryBtn'),
            exitBtn: document.getElementById('exitBtn'),
            hintLabel: document.getElementById('hintLabel'),
            feedbackBadge: document.getElementById('feedbackBadge'),
            answerRow: document.getElementById('answerRow'),
            correctAnswer: document.getElementById('correctAnswer'),
            honorRightBtn: document.getElementById('honorRightBtn'),
            honorWrongBtn: document.getElementById('honorWrongBtn'),
            finalScore: document.getElementById('finalScore'),
            finalAccuracy: document.getElementById('finalAccuracy'),
            resultsList: document.getElementById('resultsList')
        };

        // UI Event Listeners
        elements.blurSlider.addEventListener('input', (e) => {
            elements.blurVal.textContent = `${e.target.value}px`;
            if (!state.isRevealed) {
                document.documentElement.style.setProperty('--blur-amount', `${e.target.value}px`);
            }
        });

        elements.honorRightBtn.addEventListener('click', () => {
            state.score++;
            state.results.push({ name: state.gameData[state.currentIndex].name, correct: true });
            showFeedback(true);
            setTimeout(nextGame, 800);
        });

        elements.honorWrongBtn.addEventListener('click', () => {
            state.results.push({ name: state.gameData[state.currentIndex].name, correct: false });
            showFeedback(false);
            setTimeout(nextGame, 800);
        });

        elements.startBtn.addEventListener('click', async () => {
            const username = elements.bggUsername.value.trim() || 'sportomax';
            state.gameMode = document.getElementById('gameMode').value;
            state.hintType = document.getElementById('hintType').value;
            
            showLoader(true);
            try {
                const games = await fetchBGGCollection(username);
                if (games.length < 5) throw new Error('Not enough games in collection');
                
                state.gameData = games.sort(() => Math.random() - 0.5).slice(0, 10);
                state.totalGames = state.gameData.length;
                
                showScreen('game');
                startGame();
            } catch (err) {
                alert('Error loading games: ' + err.message);
            } finally {
                showLoader(false);
            }
        });

        elements.submitBtn.addEventListener('click', checkGuess);
        elements.guessInput.addEventListener('keypress', (e) => e.key === 'Enter' && checkGuess());
        elements.revealBtn.addEventListener('click', () => revealAnswer());
        elements.skipBtn.addEventListener('click', nextGame);
        elements.mysteryBtn.addEventListener('click', () => {
            state.revealPercentage = Math.min(100, state.revealPercentage + 10);
            updateRevealStyle();
        });
        elements.exitBtn.addEventListener('click', () => location.reload());

        // Core Functions
        async function fetchBGGCollection(username) {
            let filters = [];
            if (document.getElementById('filterOwn').checked) filters.push('own=1');
            if (document.getElementById('filterPrevOwned').checked) filters.push('prevowned=1');
            if (document.getElementById('filterWantToPlay').checked) filters.push('wanttoplay=1');
            
            const filterStr = filters.length > 0 ? '&' + filters.join('&') : '&own=1';
            const url = `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}${filterStr}&stats=1`;
            
            const res = await fetch(url);
            if (!res.ok) throw new Error('BGG unreachable');
            
            const text = await res.text();
            const parser = new DOMParser();
            const xml = parser.parseFromString(text, 'text/xml');
            
            return Array.from(xml.querySelectorAll('item')).map(item => ({
                id: item.getAttribute('objectid'),
                name: item.querySelector('name')?.textContent || 'Unknown',
                image: item.querySelector('image')?.textContent || ''
            })).filter(g => g.image);
        }

        function startGame() {
            state.currentIndex = 0;
            state.score = 0;
            state.results = [];
            loadGame();
        }

        function loadGame() {
            const game = state.gameData[state.currentIndex];
            state.isRevealed = false;
            state.revealPercentage = 10;
            
            // Reset UI
            elements.guessInput.value = '';
            elements.guessInput.disabled = false;
            elements.submitBtn.disabled = false;
            elements.answerRow.classList.add('hidden');
            elements.revealBtn.disabled = false;
            elements.hintLabel.classList.add('hidden');
            
            // Mode visibility
            elements.mysteryBtn.classList.toggle('hidden', state.gameMode !== 'hidden');
            
            // Image Setup - IMMEDIATELY set blur before opacity
            elements.blurImage.classList.remove('loaded', 'hidden-mode');
            if (state.gameMode === 'hidden') {
                elements.blurImage.classList.add('hidden-mode');
                updateRevealStyle();
            } else {
                document.documentElement.style.setProperty('--blur-amount', `${elements.blurSlider.value}px`);
                elements.blurImage.style.filter = `blur(${elements.blurSlider.value}px)`;
            }
            
            elements.blurImage.onload = () => elements.blurImage.classList.add('loaded');
            elements.blurImage.src = game.image;
            
            // Update Stats
            elements.progressIndicator.textContent = state.currentIndex + 1;
            elements.progressText.textContent = `Game ${state.currentIndex + 1} of ${state.totalGames}`;
            elements.scoreValue.textContent = state.score;
            elements.progressBar.style.width = `${(state.currentIndex / state.totalGames) * 100}%`;
            
            // Hint
            if (state.hintType !== 'none') {
                const hintText = getHintText(game.name);
                elements.hintLabel.querySelector('span').textContent = hintText;
                elements.hintLabel.classList.remove('hidden');
            }

            elements.guessInput.focus();
        }

        function checkGuess() {
            if (state.isRevealed) return;
            
            const guess = elements.guessInput.value.trim().toLowerCase();
            const actual = state.gameData[state.currentIndex].name.toLowerCase();
            const normalizedActual = actual.split(':')[0].trim();
            
            if (guess === actual || guess === normalizedActual) {
                showFeedback(true);
                state.score++;
                state.results.push({ name: state.gameData[state.currentIndex].name, correct: true });
                setTimeout(nextGame, 1200);
            } else {
                if (state.gameMode === 'hidden') {
                    state.revealPercentage = Math.min(100, state.revealPercentage + 15);
                    updateRevealStyle();
                    elements.guessInput.value = '';
                    elements.guessInput.animate([
                        { transform: 'translateX(0)' },
                        { transform: 'translateX(-5px)' },
                        { transform: 'translateX(5px)' },
                        { transform: 'translateX(0)' }
                    ], { duration: 200 });
                } else {
                    revealAnswer();
                }
            }
        }

        function revealAnswer() {
            state.isRevealed = true;
            elements.blurImage.style.filter = 'none';
            elements.blurImage.style.clipPath = 'none';
            elements.answerRow.classList.remove('hidden');
            elements.correctAnswer.textContent = state.gameData[state.currentIndex].name;
            elements.guessInput.disabled = true;
            elements.submitBtn.disabled = true;
            elements.revealBtn.disabled = true;
            elements.mysteryBtn.classList.add('hidden');
        }

        function nextGame() {
            // Apply transition state to blur the whole area
            const container = document.querySelector('.blur-container');
            container.classList.add('transitioning');
            
            setTimeout(() => {
                state.currentIndex++;
                if (state.currentIndex < state.totalGames) {
                    loadGame();
                    // Remove transition state after short delay
                    setTimeout(() => {
                        container.classList.remove('transitioning');
                    }, 300);
                } else {
                    showResults();
                }
            }, 400); // Wait for blur out
        }

        // Apply btn-action class to existing buttons in HTML
        window.addEventListener('load', () => {
            const btns = ['revealBtn', 'skipBtn', 'mysteryBtn', 'exitBtn'];
            btns.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.add('btn-action');
            });
            
            const honorBtns = ['honorRightBtn', 'honorWrongBtn'];
            honorBtns.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.add('btn-honor');
            });
        });

        function showResults() {
            showScreen('results');
            elements.finalScore.textContent = state.score;
            elements.finalAccuracy.textContent = `${Math.round((state.score / state.totalGames) * 100)}%`;
            
            elements.resultsList.innerHTML = state.results.map(r => `
                <div class="glass p-3 rounded-2xl flex items-center justify-between border-l-4 ${r.correct ? 'border-green-500' : 'border-red-500'}">
                    <span class="text-sm font-bold truncate pr-4 text-slate-200">${r.name}</span>
                    <span class="text-[10px] font-black uppercase px-2 py-1 rounded-lg ${r.correct ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}">
                        ${r.correct ? 'Correct' : 'Missed'}
                    </span>
                </div>
            `).join('');
        }

        // Helpers
        function showScreen(key) {
            Object.keys(screens).forEach(k => screens[k].classList.toggle('hidden', k !== key));
        }

        function showLoader(show) {
            elements.loader.classList.toggle('hidden', !show);
        }

        function updateRevealStyle() {
            const inset = (100 - state.revealPercentage) / 2;
            elements.blurImage.style.setProperty('--reveal-top', `${inset}%`);
            elements.blurImage.style.setProperty('--reveal-right', `${inset}%`);
            elements.blurImage.style.setProperty('--reveal-bottom', `${inset}%`);
            elements.blurImage.style.setProperty('--reveal-left', `${inset}%`);
        }

        function showFeedback(correct) {
            const badge = elements.feedbackBadge;
            const content = badge.querySelector('.feedback-content');
            
            content.textContent = correct ? 'CORRECT' : 'WRONG';
            content.style.color = correct ? '#4ade80' : '#f87171';
            content.style.background = correct ? 'rgba(34, 197, 94, 0.1)' : 'rgba(239, 68, 68, 0.1)';
            content.style.border = `2px solid ${correct ? '#22c55e' : '#ef4444'}`;
            
            badge.classList.add('active');
            setTimeout(() => badge.classList.remove('active'), 1000);
        }

        function getHintText(name) {
            if (state.hintType === 'letters') return name.substring(0, 3).toUpperCase() + '...';
            if (state.hintType === 'length') return `${name.length} letters`;
            if (state.hintType === 'both') return `${name.substring(0, 2).toUpperCase()}... (${name.length} chars)`;
            return '';
        }

        function getHintText(name) {
            const parts = name.split(':')[0].trim();
            if (state.hintType === 'letters') return parts.substring(0, 3).toUpperCase() + '...';
            if (state.hintType === 'length') return `${parts.length} letters`;
            if (state.hintType === 'both') return `${parts.substring(0, 2).toUpperCase()}... (${parts.length} chars)`;
            return '';
        }

    </script>
</body>
</html>
