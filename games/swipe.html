<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>BGG Card Swiper - Desktop Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ec4899;
            --primary-dark: #db2777;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top right, rgba(236, 72, 153, 0.1), transparent),
                              radial-gradient(circle at bottom left, rgba(99, 102, 241, 0.1), transparent);
            color: #f8fafc;
            overflow: hidden; /* Prevent body scroll */
            -webkit-user-select: none;
            user-select: none;
        }

        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-container {
            perspective: 1000px;
            height: 400px;
            width: 320px;
            position: relative;
        }

        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 1.5rem;
            cursor: grab;
            transition: transform 0.1s ease-out, opacity 0.1s ease-out;
            transform-origin: 50% 100%;
            touch-action: none;
        }

        .card.dragging {
            transition: none;
            cursor: grabbing;
        }

        .card.swiped-right {
            animation: swipeRight 0.5s ease-out forwards;
        }

        .card.swiped-left {
            animation: swipeLeft 0.5s ease-out forwards;
        }

        @keyframes swipeRight {
            to { transform: translateX(200%) rotate(30deg); opacity: 0; }
        }

        @keyframes swipeLeft {
            to { transform: translateX(-200%) rotate(-30deg); opacity: 0; }
        }

        .feedback-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .btn-swipe {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .btn-swipe:hover { transform: scale(1.1); }
        .btn-swipe:active { transform: scale(0.9); }

        .thumb-strip {
            height: 80px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px;
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }

        .thumb-item {
            width: 50px;
            height: 60px;
            flex-shrink: 0;
            border-radius: 8px;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid transparent;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateX(20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .keyboard-hint {
            font-size: 10px;
            font-weight: 800;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            color: #94a3b8;
        }

        /* Responsive scaling */
        @media (min-height: 800px) {
            .card-container { height: 500px; width: 380px; }
        }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center p-4">

    <!-- ==================== SETUP SCREEN ==================== -->
    <div id="setupScreen" class="w-full max-w-lg z-20 animate-fade">
        <div class="glass p-8 rounded-[2.5rem] shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <div class="inline-block p-4 bg-pink-500/20 rounded-2xl mb-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-pink-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                    </svg>
                </div>
                <h1 class="text-4xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-pink-400 to-indigo-400 uppercase">CARD SWIPER</h1>
                <p class="text-slate-400 font-medium">Build your board game wishlist</p>
            </div>

            <div class="space-y-4">
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-widest ml-1">BGG Username</label>
                    <input type="text" id="bggUsernameInput" value="sportomax" 
                        class="w-full bg-slate-900/50 border border-slate-700 p-4 rounded-2xl text-white placeholder-slate-500 focus:border-pink-500 transition-all outline-none">
                </div>

                <div class="bg-slate-900/40 p-4 rounded-3xl border border-slate-800 grid grid-cols-2 gap-2">
                    <label class="flex items-center space-x-2 cursor-pointer group">
                        <input type="checkbox" id="filterOwn" checked class="w-4 h-4 rounded border-slate-700 text-pink-600 bg-slate-800">
                        <span class="text-xs text-slate-300">Own</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer group">
                        <input type="checkbox" id="filterPrevOwned" class="w-4 h-4 rounded border-slate-700 text-pink-600 bg-slate-800">
                        <span class="text-xs text-slate-300">Prev Owned</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer group">
                        <input type="checkbox" id="filterWantToPlay" class="w-4 h-4 rounded border-slate-700 text-pink-600 bg-slate-800">
                        <span class="text-xs text-slate-300">Want Play</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer group">
                        <input type="checkbox" id="filterWantToBuy" class="w-4 h-4 rounded border-slate-700 text-pink-600 bg-slate-800">
                        <span class="text-xs text-slate-300">Want Buy</span>
                    </label>
                </div>

                <div class="space-y-2">
                    <div class="flex justify-between px-1">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">Session Size</label>
                        <span id="sessionLengthValue" class="text-xs font-bold text-pink-400">20</span>
                    </div>
                    <input type="range" id="sessionLengthSlider" min="5" max="100" step="5" value="20" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-pink-500">
                </div>

                <button onclick="startSwipe()" class="w-full bg-gradient-to-r from-pink-600 to-indigo-600 hover:from-pink-500 hover:to-indigo-500 text-white py-5 rounded-2xl text-lg font-black uppercase tracking-widest shadow-xl transition-all active:scale-95">
                    Start Session
                </button>
            </div>
        </div>
    </div>

    <!-- ==================== SWIPE SCREEN ==================== -->
    <div id="swipeScreen" class="hidden w-full max-w-4xl h-full flex flex-col items-center justify-between py-8">
        
        <!-- Top Nav -->
        <div class="w-full flex items-center justify-between px-8">
            <div class="flex items-center gap-4">
                <div class="glass w-12 h-12 rounded-xl flex items-center justify-center text-pink-400 font-black" id="cardNumber">1</div>
                <div>
                    <div class="text-[10px] font-black text-slate-500 uppercase tracking-tighter">Progress</div>
                    <div class="text-sm font-bold text-white">of <span id="totalCards">20</span></div>
                </div>
            </div>
            
            <div class="flex-1 max-w-xs mx-8">
                <div class="h-1.5 bg-slate-800 rounded-full overflow-hidden">
                    <div id="progressFill" class="h-full bg-gradient-to-r from-pink-500 to-indigo-500 transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <div class="flex items-center gap-4 text-right">
                <div>
                    <div class="text-[10px] font-black text-slate-500 uppercase tracking-tighter">Saved</div>
                    <div class="text-sm font-black text-pink-400" id="savedCount">0</div>
                </div>
                <button onclick="exitSession()" class="glass p-3 rounded-xl hover:bg-red-500/20 text-red-400 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Main Swipe Area -->
        <div class="flex-1 flex items-center justify-center gap-12 w-full">
            <!-- Left Btn -->
            <div class="hidden lg:flex flex-col items-center gap-4">
                <button onclick="handleSwipe('left')" class="btn-swipe bg-slate-800 hover:bg-red-500/20 text-red-400 border border-slate-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
                <div class="keyboard-hint">← LEFT</div>
            </div>

            <div class="card-container">
                <div id="cardRoot"></div>
                <div id="feedbackIcon" class="feedback-overlay"></div>
            </div>

            <!-- Right Btn -->
            <div class="hidden lg:flex flex-col items-center gap-4">
                <button onclick="handleSwipe('right')" class="btn-swipe bg-slate-800 hover:bg-pink-500/20 text-pink-400 border border-slate-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                </button>
                <div class="keyboard-hint">RIGHT →</div>
            </div>
        </div>

        <!-- Bottom Controls & Thumbnails -->
        <div class="w-full max-w-2xl px-4 space-y-4">
            <div id="recentThumbs" class="thumb-strip justify-center">
                <!-- Swiped thumbs go here -->
            </div>
            
            <div class="flex justify-center gap-4">
                <button id="undoBtn" onclick="undoAction()" class="glass px-6 py-2 rounded-full text-[10px] font-black uppercase tracking-widest text-slate-400 hover:text-white transition-all disabled:opacity-30 disabled:cursor-not-allowed">
                    ↶ UNDO
                </button>
                <div class="lg:hidden flex gap-4">
                    <button onclick="handleSwipe('left')" class="px-8 py-3 bg-red-500/20 text-red-400 rounded-2xl font-black uppercase tracking-widest text-xs border border-red-500/30">PASS</button>
                    <button onclick="handleSwipe('right')" class="px-8 py-3 bg-pink-500/20 text-pink-400 rounded-2xl font-black uppercase tracking-widest text-xs border border-pink-500/30">SAVE</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== RESULTS SCREEN ==================== -->
    <div id="resultsScreen" class="hidden w-full max-w-4xl animate-fade">
        <div class="glass p-8 rounded-[2.5rem] shadow-2xl text-center space-y-8">
            <div class="space-y-2">
                <h2 class="text-4xl font-black bg-clip-text text-transparent bg-gradient-to-r from-pink-400 to-indigo-400">SESSION REVIEW</h2>
                <p class="text-slate-500 font-bold uppercase tracking-widest text-xs">Complete History</p>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div onclick="filterResults('right')" class="cursor-pointer bg-emerald-500/10 border border-emerald-500/20 p-6 rounded-3xl hover:bg-emerald-500/20 transition-all">
                    <div class="text-3xl font-black text-emerald-400" id="finalSaved">0</div>
                    <div class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Saved (Yes)</div>
                </div>
                <div onclick="filterResults('left')" class="cursor-pointer bg-red-500/10 border border-red-500/20 p-6 rounded-3xl hover:bg-red-500/20 transition-all">
                    <div class="text-3xl font-black text-red-400" id="finalPassed">0</div>
                    <div class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Passed (No)</div>
                </div>
            </div>

            <div class="flex justify-center gap-4">
                <button onclick="filterResults('all')" class="text-[10px] font-black uppercase tracking-widest px-4 py-2 rounded-lg bg-slate-800 text-slate-400 hover:text-white transition-all">Show All</button>
            </div>

            <div id="wishlistContainer" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-3 max-h-[40vh] overflow-y-auto pr-2 custom-scrollbar">
                <!-- Swiped items -->
            </div>

            <div class="flex gap-3">
                <button onclick="location.reload()" class="flex-1 glass py-5 rounded-2xl text-sm font-black uppercase tracking-widest hover:bg-slate-800 transition-all">New Session</button>
                <button onclick="copyWishlist()" class="flex-[2] bg-indigo-600 hover:bg-indigo-500 py-5 rounded-2xl text-sm font-black uppercase tracking-widest transition-all">Copy Yes List</button>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loader" class="fixed inset-0 bg-slate-950/90 z-50 hidden flex flex-col items-center justify-center p-8 text-center space-y-4">
        <div class="w-16 h-16 border-4 border-pink-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-xl font-bold text-white uppercase tracking-widest">Fetching BGG Collection</p>
    </div>

    <script>
        // State
        let allGames = [];
        let sessionGames = [];
        let currentIndex = 0;
        let savedCount = 0;
        let cardHistory = [];
        let sessionLength = 20;

        // DOM
        const screens = {
            setup: document.getElementById('setupScreen'),
            swipe: document.getElementById('swipeScreen'),
            results: document.getElementById('resultsScreen')
        };

        const els = {
            cardRoot: document.getElementById('cardRoot'),
            recentThumbs: document.getElementById('recentThumbs'),
            progressFill: document.getElementById('progressFill'),
            cardNumber: document.getElementById('cardNumber'),
            totalCards: document.getElementById('totalCards'),
            savedCount: document.getElementById('savedCount'),
            undoBtn: document.getElementById('undoBtn'),
            wishlistContainer: document.getElementById('wishlistContainer'),
            loader: document.getElementById('loader')
        };

        // Init
        document.getElementById('sessionLengthSlider').addEventListener('input', (e) => {
            document.getElementById('sessionLengthValue').textContent = e.target.value;
        });

        window.addEventListener('keydown', (e) => {
            if (screens.swipe.classList.contains('hidden')) return;
            if (e.key === 'ArrowLeft') handleSwipe('left');
            if (e.key === 'ArrowRight') handleSwipe('right');
            if (e.key === 'z' && (e.metaKey || e.ctrlKey)) undoAction();
        });

        // Core Functions
        async function startSwipe() {
            const username = document.getElementById('bggUsernameInput').value.trim() || 'sportomax';
            sessionLength = parseInt(document.getElementById('sessionLengthSlider').value);
            
            showLoader(true);
            try {
                const filters = [];
                if (document.getElementById('filterOwn').checked) filters.push('own=1');
                if (document.getElementById('filterPrevOwned').checked) filters.push('prevowned=1');
                if (document.getElementById('filterWantToPlay').checked) filters.push('wanttoplay=1');
                if (document.getElementById('filterWantToBuy').checked) filters.push('wanttobuy=1');
                
                const filterStr = filters.length > 0 ? '&' + filters.join('&') : '&own=1';
                const url = `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}${filterStr}&stats=1`;
                
                const res = await fetch(url);
                if (!res.ok) throw new Error('BGG fetch failed');
                
                const text = await res.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, 'text/xml');
                
                allGames = Array.from(xml.querySelectorAll('item')).map(it => ({
                    name: it.querySelector('name')?.textContent || 'Unknown',
                    image: it.querySelector('image')?.textContent || '',
                    thumbnail: it.querySelector('thumbnail')?.textContent || '',
                    rating: parseFloat(it.querySelector('stats average')?.getAttribute('value') || '0').toFixed(1)
                })).filter(g => g.image);

                if (allGames.length === 0) throw new Error('No games found');

                sessionGames = allGames.sort(() => Math.random() - 0.5).slice(0, sessionLength);
                els.totalCards.textContent = sessionGames.length;
                
                showScreen('swipe');
                renderActiveCard();
            } catch (err) {
                alert(err.message);
            } finally {
                showLoader(false);
            }
        }

        function renderActiveCard() {
            if (currentIndex >= sessionGames.length) {
                showResults();
                return;
            }

            const game = sessionGames[currentIndex];
            els.cardRoot.innerHTML = '';
            
            const card = document.createElement('div');
            card.className = 'card glass shadow-2xl overflow-hidden flex flex-col animate-fade';
            card.innerHTML = `
                <div class="h-2/3 bg-slate-950/50 p-6 flex items-center justify-center relative">
                    <img src="${game.image}" class="max-w-full max-h-full object-contain drop-shadow-2xl">
                    <div class="absolute top-4 right-4 glass px-3 py-1 rounded-full text-[10px] font-black text-pink-400">⭐ ${game.rating}</div>
                </div>
                <div class="flex-1 p-6 flex flex-col justify-center text-center">
                    <h2 class="text-lg font-black text-white leading-tight">${game.name}</h2>
                </div>
            `;

            // Touch/Drag Logic
            let startX, startY, currentX, currentY;
            
            const onStart = (e) => {
                startX = e.clientX || e.touches[0].clientX;
                startY = e.clientY || e.touches[0].clientY;
                card.classList.add('dragging');
            };

            const onMove = (e) => {
                if (!startX) return;
                currentX = e.clientX || e.touches[0].clientX;
                currentY = e.clientY || e.touches[0].clientY;
                const dx = currentX - startX;
                const dy = currentY - startY;
                const rot = dx * 0.1;
                card.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg)`;
                
                const opacity = Math.min(Math.abs(dx) / 100, 1);
                const feedback = document.getElementById('feedbackIcon');
                feedback.style.opacity = opacity;
                feedback.innerHTML = dx > 0 ? '❤️' : '✕';
                feedback.style.color = dx > 0 ? '#ec4899' : '#ef4444';
            };

            const onEnd = () => {
                const dx = currentX - startX;
                card.classList.remove('dragging');
                document.getElementById('feedbackIcon').style.opacity = 0;

                if (Math.abs(dx) > 100) {
                    handleSwipe(dx > 0 ? 'right' : 'left');
                } else {
                    card.style.transform = '';
                }
                startX = null;
            };

            card.addEventListener('mousedown', onStart);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);
            card.addEventListener('touchstart', onStart, {passive: true});
            window.addEventListener('touchmove', onMove, {passive: true});
            window.addEventListener('touchend', onEnd);

            els.cardRoot.appendChild(card);
            updateUI();
        }

        function handleSwipe(direction) {
            if (currentIndex >= sessionGames.length) return;
            
            const game = sessionGames[currentIndex];
            const card = els.cardRoot.querySelector('.card');
            if (card) {
                card.classList.add(direction === 'right' ? 'swiped-right' : 'swiped-left');
            }

            cardHistory.push({ index: currentIndex, direction, game });
            if (direction === 'right') savedCount++;
            
            // Add thumbnail to strip
            const thumb = document.createElement('img');
            thumb.src = game.thumbnail;
            thumb.className = `thumb-item ${direction === 'right' ? 'border-pink-500/50' : 'border-slate-700'}`;
            els.recentThumbs.prepend(thumb);
            if (els.recentThumbs.children.length > 15) els.recentThumbs.lastChild.remove();

            currentIndex++;
            setTimeout(renderActiveCard, 300);
        }

        function undoAction() {
            if (cardHistory.length === 0) return;
            const last = cardHistory.pop();
            currentIndex = last.index;
            if (last.direction === 'right') savedCount--;
            
            if (els.recentThumbs.firstChild) els.recentThumbs.firstChild.remove();
            renderActiveCard();
        }

        function updateUI() {
            els.cardNumber.textContent = currentIndex + 1;
            els.savedCount.textContent = savedCount;
            const prog = (currentIndex / sessionGames.length) * 100;
            els.progressFill.style.width = `${prog}%`;
            els.undoBtn.disabled = cardHistory.length === 0;
        }

        function showResults() {
            showScreen('results');
            document.getElementById('finalSaved').textContent = savedCount;
            document.getElementById('finalPassed').textContent = sessionGames.length - savedCount;
            filterResults('all');
        }

        function filterResults(direction) {
            let filtered = cardHistory;
            if (direction !== 'all') {
                filtered = cardHistory.filter(h => h.direction === direction);
            }

            els.wishlistContainer.innerHTML = filtered.map(h => `
                <div class="glass p-3 rounded-2xl flex flex-col items-center gap-2 border-b-4 ${h.direction === 'right' ? 'border-emerald-500/50' : 'border-red-500/50'}">
                    <img src="${h.game.thumbnail}" class="w-16 h-20 object-contain">
                    <div class="text-[9px] font-black uppercase text-center truncate w-full text-slate-300">${h.game.name}</div>
                    <div class="text-[8px] font-bold ${h.direction === 'right' ? 'text-emerald-400' : 'text-red-400'}">
                        ${h.direction === 'right' ? 'SAVED' : 'PASSED'}
                    </div>
                </div>
            `).join('');
        }

        function exitSession() {
            if (cardHistory.length > 0 && confirm('End session and see results?')) {
                showResults();
            } else {
                location.reload();
            }
        }

        function copyWishlist() {
            const list = cardHistory
                .filter(h => h.direction === 'right')
                .map((h, i) => `${i+1}. ${h.game.name}`)
                .join('\n');
            navigator.clipboard.writeText(list).then(() => alert('Copied to clipboard!'));
        }

        function showScreen(key) {
            Object.values(screens).forEach(s => s.classList.add('hidden'));
            screens[key].classList.remove('hidden');
        }

        function showLoader(show) {
            els.loader.classList.toggle('hidden', !show);
        }

    </script>
</body>
</html>
