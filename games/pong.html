<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Pong | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🏓</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
            touch-action: none;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #gameCanvas {
            width: 100%;
            height: auto;
            max-width: 800px;
            background: #020617;
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.05);
        }

        .paddle { fill: #38bdf8; }
        .score-num { font-size: 4rem; font-weight: 900; opacity: 0.2; }

        .btn-pill {
            @apply px-4 py-2 rounded-xl border border-white/10 text-[10px] font-black uppercase tracking-widest transition-all bg-white/5 text-slate-500;
        }
        .btn-pill.active {
            @apply bg-sky-500 border-sky-500 text-white shadow-lg shadow-sky-500/20;
        }

        .thumb-select-item {
            @apply aspect-square rounded-xl border-2 border-transparent overflow-hidden transition-all cursor-pointer bg-black/40 p-1;
        }
        .thumb-select-item.selected {
            @apply border-sky-500 shadow-lg shadow-sky-500/20;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    
    <!-- Background Decor -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-sky-900/20 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[10%] right-[0%] w-[50%] h-[50%] bg-blue-900/10 blur-[120px] rounded-full"></div>
    </div>

    <!-- Setup Screen -->
    <div id="setupScreen" class="fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/80 backdrop-blur-md"></div>
        <div class="glass relative max-w-md w-full rounded-[2.5rem] p-8 shadow-2xl border-t border-white/20 max-h-[90vh] overflow-y-auto">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-sky-500/20 rounded-3xl flex items-center justify-center mx-auto mb-4 border border-sky-500/30">
                    <span class="text-4xl">🏓</span>
                </div>
                <h1 class="text-3xl font-black tracking-tight text-white mb-2 italic uppercase">BGG <span class="text-sky-400">Pong</span></h1>
                <p class="text-slate-400 text-sm font-medium">Use your games as the ball</p>
            </div>

            <div class="space-y-6">
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">BGG Username</label>
                    <input type="text" id="username" value="sportomax" class="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-sky-500/50 transition-all font-medium">
                </div>

                <div class="space-y-3">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Thumbnail Logic</label>
                    <div class="flex gap-2">
                        <button onclick="setThumbMode('random', this)" class="btn-pill active">Random</button>
                        <button onclick="setThumbMode('chosen', this)" class="btn-pill">Specific</button>
                    </div>
                </div>

                <div id="thumbSelection" class="hidden space-y-3">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Choose Game</label>
                    <div id="thumbGrid" class="grid grid-cols-4 gap-2 max-h-40 overflow-y-auto pr-2 custom-scrollbar">
                        <!-- Populated after load -->
                    </div>
                </div>

                <div class="space-y-3">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Change Frequency</label>
                    <div class="flex gap-2">
                        <button onclick="setFreq('goal', this)" class="btn-pill active">Per Goal</button>
                        <button onclick="setFreq('game', this)" class="btn-pill">Per Game</button>
                    </div>
                </div>

                <button onclick="loadAndStart()" class="w-full bg-sky-500 text-white py-4 rounded-2xl font-black text-lg uppercase tracking-tight hover:scale-[1.02] active:scale-95 transition-all shadow-xl shadow-sky-500/20">
                    Play Ball
                </button>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="hidden relative z-10 w-full max-w-3xl">
        <div class="flex items-center justify-between mb-6 px-4">
            <div class="flex flex-col">
                <h2 class="text-xl font-black italic uppercase tracking-tighter text-white">BGG <span class="text-sky-400">Pong</span></h2>
                <span id="gameInfo" class="text-[10px] font-bold text-slate-500 uppercase tracking-widest"></span>
            </div>
            <button onclick="showSettings()" class="glass px-4 py-2 rounded-xl border border-white/10 text-[10px] font-black uppercase tracking-widest text-slate-400 hover:text-white transition-all">Settings</button>
        </div>

        <canvas id="gameCanvas" width="800" height="500"></canvas>

        <div class="mt-8 grid grid-cols-2 gap-4">
            <div class="glass p-6 rounded-[2rem] border border-white/5 flex flex-col items-center">
                <span class="text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Player</span>
                <span id="playerScore" class="text-4xl font-black text-white italic">0</span>
            </div>
            <div class="glass p-6 rounded-[2rem] border border-white/5 flex flex-col items-center">
                <span class="text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Computer</span>
                <span id="computerScore" class="text-4xl font-black text-white italic">0</span>
            </div>
        </div>

        <div class="mt-6 flex justify-center gap-4">
            <button id="upBtn" class="w-20 h-20 glass rounded-3xl flex items-center justify-center text-3xl active:scale-90 transition-all">🔼</button>
            <button id="downBtn" class="w-20 h-20 glass rounded-3xl flex items-center justify-center text-3xl active:scale-90 transition-all">🔽</button>
        </div>
    </div>

    <script>
        let canvas, ctx;
        let games = [];
        let ballImage = new Image();
        let selectedGameId = null;
        let thumbMode = 'random'; // 'random' or 'chosen'
        let changeFreq = 'goal'; // 'goal' or 'game'
        let gameRunning = false;
        let animationId = null;

        const paddle1 = { x: 20, y: 200, w: 12, h: 90, dy: 0 };
        const paddle2 = { x: 768, y: 200, w: 12, h: 90, dy: 0 };
        const ball = { x: 400, y: 250, r: 24, dx: 5, dy: 5 };
        let pScore = 0, cScore = 0;

        async function fetchWithRetry(url, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                const res = await fetch(url);
                if (res.status === 202) { await new Promise(r => setTimeout(r, 3000)); continue; }
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res;
            }
            throw new Error('Timeout');
        }

        function setThumbMode(mode, btn) {
            thumbMode = mode;
            document.querySelectorAll('[onclick^="setThumbMode"]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('thumbSelection').classList.toggle('hidden', mode !== 'chosen');
            if (mode === 'chosen' && games.length === 0) fetchOnly();
        }

        function setFreq(freq, btn) {
            changeFreq = freq;
            document.querySelectorAll('[onclick^="setFreq"]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        async function fetchOnly() {
            const user = document.getElementById('username').value.trim() || 'sportomax';
            const res = await fetchWithRetry(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(user)}&own=1&stats=1`);
            const xml = await res.text();
            const doc = new DOMParser().parseFromString(xml, 'text/xml');
            games = Array.from(doc.querySelectorAll('item')).map(item => ({
                id: item.getAttribute('objectid'),
                name: item.querySelector('name').textContent,
                thumb: item.querySelector('thumbnail')?.textContent || ''
            })).filter(g => g.thumb);

            const grid = document.getElementById('thumbGrid');
            grid.innerHTML = games.map(g => `
                <div class="thumb-select-item" onclick="selectGame('${g.id}', this)">
                    <img src="${g.thumb}" class="w-full h-full object-contain">
                </div>
            `).join('');
        }

        function selectGame(id, el) {
            selectedGameId = id;
            document.querySelectorAll('.thumb-select-item').forEach(i => i.classList.remove('selected'));
            el.classList.add('selected');
        }

        async function loadAndStart() {
            if (games.length === 0) await fetchOnly();
            if (thumbMode === 'chosen' && !selectedGameId) return alert('Select a game first');

            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            
            pScore = 0; cScore = 0;
            updateUI();
            updateBallImage();
            
            setupControls();
            gameRunning = true;
            loop();
        }

        function updateBallImage() {
            let g;
            if (thumbMode === 'chosen' && changeFreq === 'game') {
                g = games.find(x => x.id === selectedGameId);
            } else {
                g = games[Math.floor(Math.random() * games.length)];
            }
            ballImage.src = g.thumb;
            document.getElementById('gameInfo').textContent = `Now Playing: ${g.name}`;
        }

        function setupControls() {
            const moveUp = () => paddle1.dy = -8;
            const moveDown = () => paddle1.dy = 8;
            const stopMove = () => paddle1.dy = 0;

            const upBtn = document.getElementById('upBtn');
            const downBtn = document.getElementById('downBtn');

            upBtn.onmousedown = upBtn.ontouchstart = (e) => { e.preventDefault(); moveUp(); };
            upBtn.onmouseup = upBtn.ontouchend = stopMove;
            downBtn.onmousedown = downBtn.ontouchstart = (e) => { e.preventDefault(); moveDown(); };
            downBtn.onmouseup = downBtn.ontouchend = stopMove;

            window.onkeydown = (e) => {
                if (e.key === 'ArrowUp' || e.key === 'w') moveUp();
                if (e.key === 'ArrowDown' || e.key === 's') moveDown();
            };
            window.onkeyup = stopMove;
        }

        function loop() {
            if (!gameRunning) return;
            
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Center line
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.setLineDash([10, 10]);
            ctx.beginPath(); ctx.moveTo(400, 0); ctx.lineTo(400, 500); ctx.stroke();

            // Paddles
            paddle1.y = Math.max(0, Math.min(500 - paddle1.h, paddle1.y + paddle1.dy));
            paddle2.y += (ball.y - (paddle2.y + paddle2.h/2)) * 0.1;
            paddle2.y = Math.max(0, Math.min(500 - paddle2.h, paddle2.y));

            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.roundRect(paddle1.x, paddle1.y, paddle1.w, paddle1.h, 6);
            ctx.fill();
            
            ctx.beginPath();
            ctx.roundRect(paddle2.x, paddle2.y, paddle2.w, paddle2.h, 6);
            ctx.fill();

            // Ball
            ball.x += ball.dx; ball.y += ball.dy;
            if (ball.y < ball.r || ball.y > 500 - ball.r) ball.dy *= -1;

            if (ball.x < paddle1.x + paddle1.w + ball.r && ball.y > paddle1.y && ball.y < paddle1.y + paddle1.h) {
                ball.dx = Math.abs(ball.dx) * 1.05;
                ball.dy += (ball.y - (paddle1.y + paddle1.h/2)) * 0.2;
            }
            if (ball.x > paddle2.x - ball.r && ball.y > paddle2.y && ball.y < paddle2.y + paddle2.h) {
                ball.dx = -Math.abs(ball.dx) * 1.05;
                ball.dy += (ball.y - (paddle2.y + paddle2.h/2)) * 0.2;
            }

            if (ball.x < 0) { cScore++; scoreReset(); }
            if (ball.x > 800) { pScore++; scoreReset(); }

            if (ballImage.complete) {
                ctx.save();
                ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.clip();
                ctx.drawImage(ballImage, ball.x - ball.r, ball.y - ball.r, ball.r*2, ball.r*2);
                ctx.restore();
            }

            animationId = requestAnimationFrame(loop);
        }

        function scoreReset() {
            updateUI();
            if (changeFreq === 'goal') updateBallImage();
            ball.x = 400; ball.y = 250;
            ball.dx = ball.dx > 0 ? -5 : 5;
            ball.dy = (Math.random() - 0.5) * 10;
        }

        function updateUI() {
            document.getElementById('playerScore').textContent = pScore;
            document.getElementById('computerScore').textContent = cScore;
        }

        function showSettings() {
            gameRunning = false;
            cancelAnimationFrame(animationId);
            document.getElementById('setupScreen').classList.remove('hidden');
            document.getElementById('gameScreen').classList.add('hidden');
        }
    </script>
</body>
</html>
