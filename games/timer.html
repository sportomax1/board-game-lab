<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Game Timer">
    <title>Game Timer - Turn Tracker</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>⏱️</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { padding: max(env(safe-area-inset-top), 0) max(env(safe-area-inset-right), 0) max(env(safe-area-inset-bottom), 0) max(env(safe-area-inset-left), 0); }
        input, select, button { font-size: 16px; } /* Prevent iOS zoom on input focus */
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <!-- Setup Screen -->
    <div id="setupScreen" class="fixed inset-0 bg-gradient-to-br from-indigo-900 to-purple-900 z-50 flex items-center justify-center p-3 md:p-8 overflow-y-auto">
        <div class="bg-white rounded-3xl shadow-2xl p-6 md:p-8 max-w-2xl w-full my-4 md:my-0">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-1 text-center">⏱️ Game Timer</h1>
            <p class="text-gray-500 text-center text-base md:text-lg mb-6">Track player turn times and analyze game pacing</p>
            
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-3">Players in Game</label>
                    <div id="playersContainer" class="space-y-3">
                        <div class="player-setup-group flex gap-2 items-end">
                            <div class="flex-1">
                                <input type="text" placeholder="Player name" class="player-name w-full border-2 border-gray-300 rounded-lg px-4 py-3 focus:border-purple-500 outline-none transition text-base" value="Player 1">
                            </div>
                            <select class="player-emoji w-20 border-2 border-gray-300 rounded-lg px-3 py-3 focus:border-purple-500 outline-none text-lg">
                                <option>🔴</option>
                                <option>🔵</option>
                                <option>🟢</option>
                                <option>🟡</option>
                                <option>🟣</option>
                                <option>🟠</option>
                                <option>⚫</option>
                                <option>⚪</option>
                                <option>👑</option>
                                <option>⭐</option>
                                <option>🎮</option>
                                <option>🎯</option>
                            </select>
                            <button onclick="removePlayer(this)" class="px-4 py-3 bg-red-100 text-red-600 rounded-lg font-bold hover:bg-red-200 transition hidden text-sm">Remove</button>
                        </div>
                        <div class="player-setup-group flex gap-2 items-end">
                            <div class="flex-1">
                                <input type="text" placeholder="Player name" class="player-name w-full border-2 border-gray-300 rounded-lg px-4 py-3 focus:border-purple-500 outline-none transition text-base" value="Player 2">
                            </div>
                            <select class="player-emoji w-20 border-2 border-gray-300 rounded-lg px-3 py-3 focus:border-purple-500 outline-none text-lg">
                                <option>🔴</option>
                                <option selected>🔵</option>
                                <option>🟢</option>
                                <option>🟡</option>
                                <option>🟣</option>
                                <option>🟠</option>
                                <option>⚫</option>
                                <option>⚪</option>
                                <option>👑</option>
                                <option>⭐</option>
                                <option>🎮</option>
                                <option>🎯</option>
                            </select>
                            <button onclick="removePlayer(this)" class="px-4 py-3 bg-red-100 text-red-600 rounded-lg font-bold hover:bg-red-200 transition hidden text-sm">Remove</button>
                        </div>
                    </div>
                    <button onclick="addPlayer()" class="mt-4 w-full px-4 py-3 bg-purple-100 text-purple-700 rounded-lg font-bold hover:bg-purple-200 transition text-base">+ Add Player</button>
                </div>
                
                <button onclick="startGame()" class="w-full bg-purple-600 text-white py-4 md:py-5 rounded-xl font-bold text-lg md:text-xl hover:bg-purple-700 transition shadow-lg transform hover:scale-[1.02] mt-2">
                    Start Game
                </button>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" class="hidden flex-1 flex flex-col w-full bg-gray-50">
        <!-- Header -->
        <header class="bg-white shadow-sm sticky top-0 z-30 px-3 md:px-4 py-3 md:py-4">
            <div class="max-w-7xl mx-auto flex items-center justify-between">
                <div>
                    <h1 class="font-bold text-xl md:text-2xl text-gray-900">⏱️ Game Timer</h1>
                    <p class="text-xs md:text-sm text-gray-500 mt-1" id="gameTitle">Tracking turn times</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="shareResults()" class="p-2 md:p-3 text-blue-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition" title="Share results as text">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C9.589 12.438 10.991 12 12.5 12c1.509 0 2.911.438 3.816 1.342m2.526-2.526a9 9 0 10-12.684 0m12.684 0l2.121-2.121"></path></svg>
                    </button>
                    <button onclick="location.reload()" class="p-2 md:p-3 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
            </div>
        </header>

        <div class="flex-1 flex flex-col lg:flex-row gap-3 md:gap-4 p-3 md:p-4 max-w-7xl mx-auto w-full overflow-hidden">
            <!-- Main Timer Section -->
            <div class="flex-1 flex flex-col gap-4">
                <!-- Current Player Display -->
                <div id="currentPlayerCard" class="bg-white rounded-2xl shadow-sm border-4 border-gray-200 p-5 md:p-6 text-center">
                    <p class="text-base md:text-lg text-gray-600 mb-3 font-semibold">Current Player</p>
                    <div id="currentPlayerName" class="text-5xl md:text-6xl font-bold mb-3 leading-none">🔴 Player 1</div>
                    <p class="text-sm md:text-base text-gray-600 font-bold">Turn #<span id="turnNumber">1</span></p>
                </div>

                <!-- Big Stopwatch Display -->
                <div class="bg-gradient-to-br from-purple-50 to-blue-50 rounded-2xl shadow-sm border-2 border-purple-200 p-6 md:p-8">
                    <div class="text-7xl md:text-8xl font-bold text-center text-purple-600 font-mono mb-6 leading-none" id="timerDisplay">00:00.0</div>
                    
                    <!-- Control Buttons -->
                    <div class="grid grid-cols-2 gap-3 md:flex md:flex-wrap md:gap-3 md:justify-center">
                        <button id="startBtn" onclick="toggleTimer()" class="px-4 md:px-8 py-3 md:py-4 bg-green-500 text-white rounded-lg font-bold text-base md:text-lg hover:bg-green-600 transition active:scale-95 touch-none">
                            ▶ Start
                        </button>
                        <button id="pauseBtn" onclick="toggleTimer()" class="px-4 md:px-8 py-3 md:py-4 bg-yellow-500 text-white rounded-lg font-bold text-base md:text-lg hover:bg-yellow-600 transition active:scale-95 touch-none hidden">
                            ⏸ Pause
                        </button>
                        <button onclick="resetTimer()" class="px-4 md:px-8 py-3 md:py-4 bg-gray-500 text-white rounded-lg font-bold text-base md:text-lg hover:bg-gray-600 transition active:scale-95 touch-none">
                            🔄 Reset
                        </button>
                        <button onclick="nextPlayer()" class="px-4 md:px-8 py-3 md:py-4 bg-blue-500 text-white rounded-lg font-bold text-base md:text-lg hover:bg-blue-600 transition active:scale-95 touch-none">
                            ➡ Next
                        </button>
                    </div>
                </div>

                <!-- Player Buttons -->
                <div id="playerButtonsContainer" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-2 gap-3">
                    <!-- Populated by JavaScript -->
                </div>
            </div>

            <!-- Stats Dashboard -->
            <div class="w-full lg:w-80 flex flex-col gap-4">
                <!-- Summary Stats -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 md:p-5 space-y-4">
                    <h2 class="font-bold text-lg text-gray-900">📊 Game Stats</h2>
                    
                    <div class="space-y-3">
                        <div class="text-center p-3 bg-purple-50 rounded-lg">
                            <div class="text-2xl md:text-3xl font-bold text-purple-600" id="totalGameTime">00:00</div>
                            <div class="text-xs md:text-sm text-gray-600">Total Game Time</div>
                        </div>
                        
                        <div class="text-center p-3 bg-blue-50 rounded-lg">
                            <div class="text-2xl md:text-3xl font-bold text-blue-600" id="turnCount">0</div>
                            <div class="text-xs md:text-sm text-gray-600">Total Turns</div>
                        </div>
                        
                        <div class="text-center p-3 bg-green-50 rounded-lg">
                            <div class="text-2xl md:text-3xl font-bold text-green-600" id="avgTurnTime">00:00</div>
                            <div class="text-xs md:text-sm text-gray-600">Avg Turn Time</div>
                        </div>
                    </div>
                </div>

                <!-- Player Statistics -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 md:p-5 flex-1 overflow-y-auto">
                    <h2 class="font-bold text-lg text-gray-900 mb-4 sticky top-0 bg-white">👥 Player Times</h2>
                    <div id="playerStatsContainer" class="space-y-3">
                        <!-- Populated by JavaScript -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Turn History -->
        <div class="bg-white border-t border-gray-200 px-3 md:px-4 py-3 md:py-4">
            <div class="max-w-7xl mx-auto">
                <h2 class="font-bold text-lg text-gray-900 mb-3">📝 Turn History</h2>
                <div id="turnHistoryContainer" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2 max-h-28 md:max-h-32 overflow-y-auto">
                    <!-- Populated by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let players = [];
        let currentPlayerIdx = 0;
        let timerRunning = false;
        let currentTurnTime = 0;
        let totalGameTime = 0;
        let timerInterval = null;
        let turnHistory = [];

        function addPlayer() {
            const container = document.getElementById('playersContainer');
            const newGroup = document.createElement('div');
            newGroup.className = 'player-setup-group flex gap-2 items-end';
            const playerNum = container.querySelectorAll('.player-setup-group').length + 1;
            const emojis = ['🔴', '🔵', '🟢', '🟡', '🟣', '🟠', '⚫', '⚪', '👑', '⭐', '🎮', '🎯'];
            const selectedEmoji = emojis[playerNum % emojis.length];
            
            newGroup.innerHTML = `
                <div class="flex-1">
                    <input type="text" placeholder="Player name" class="player-name w-full border-2 border-gray-300 rounded-lg px-4 py-2 focus:border-purple-500 outline-none transition text-sm md:text-base" value="Player ${playerNum}">
                </div>
                <select class="player-emoji w-16 border-2 border-gray-300 rounded-lg px-2 py-2 focus:border-purple-500 outline-none">
                    ${emojis.map(e => `<option ${e === selectedEmoji ? 'selected' : ''}>${e}</option>`).join('')}
                </select>
                <button onclick="removePlayer(this)" class="px-3 py-2 bg-red-100 text-red-600 rounded-lg font-medium hover:bg-red-200 transition">Remove</button>
            `;
            container.appendChild(newGroup);
        }

        function removePlayer(btn) {
            const group = btn.closest('.player-setup-group');
            if (document.querySelectorAll('.player-setup-group').length > 1) {
                group.remove();
            } else {
                alert('You need at least 1 player');
            }
        }

        function startGame() {
            const groups = document.querySelectorAll('.player-setup-group');
            players = Array.from(groups).map(group => ({
                name: group.querySelector('.player-name').value,
                emoji: group.querySelector('.player-emoji').value,
                turns: [],
                totalTime: 0
            }));

            if (players.length === 0) {
                alert('Please add at least one player');
                return;
            }

            console.log('🎮 Starting game with players:', players);
            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            
            renderPlayerButtons();
            updateStats();
        }

        function renderPlayerButtons() {
            const container = document.getElementById('playerButtonsContainer');
            container.innerHTML = players.map((player, idx) => `
                <button onclick="switchPlayer(${idx})" class="player-btn p-4 md:p-5 rounded-xl font-bold text-base md:text-lg transition border-2 active:scale-95 touch-none ${idx === currentPlayerIdx ? 'border-purple-500 bg-purple-100 text-gray-900' : 'border-gray-200 bg-white text-gray-700 hover:border-purple-300'} " id="playerBtn${idx}">
                    <span class="text-3xl md:text-4xl block mb-2">${player.emoji}</span>
                    <div class="text-sm md:text-base font-bold">${player.name}</div>
                    <div class="text-xs md:text-sm text-gray-600 mt-1 font-mono">${formatTime(player.totalTime)}</div>
                </button>
            `).join('');
        }

        function switchPlayer(idx) {
            if (timerRunning) {
                // Save current turn
                saveCurrentTurn();
            }
            currentPlayerIdx = idx;
            currentTurnTime = 0;
            updateDisplay();
            renderPlayerButtons();
            console.log(`👤 Switched to player ${idx}: ${players[idx].name}`);
        }

        function toggleTimer() {
            timerRunning = !timerRunning;
            document.getElementById('startBtn').classList.toggle('hidden', timerRunning);
            document.getElementById('pauseBtn').classList.toggle('hidden', !timerRunning);
            
            if (timerRunning) {
                timerInterval = setInterval(() => {
                    currentTurnTime += 10; // Update every 10ms
                    totalGameTime += 10;
                    updateDisplay();
                }, 10);
                console.log(`▶️ Timer started`);
            } else {
                clearInterval(timerInterval);
                console.log(`⏸️ Timer paused`);
            }
        }

        function resetTimer() {
            if (timerRunning) toggleTimer();
            currentTurnTime = 0;
            updateDisplay();
            console.log('🔄 Timer reset');
        }

        function nextPlayer() {
            if (currentTurnTime > 0) {
                saveCurrentTurn();
            }
            currentPlayerIdx = (currentPlayerIdx + 1) % players.length;
            currentTurnTime = 0;
            updateDisplay();
            renderPlayerButtons();
            console.log(`➡️ Moved to next player: ${players[currentPlayerIdx].name}`);
        }

        function saveCurrentTurn() {
            if (currentTurnTime === 0) return;
            
            const turn = {
                playerIdx: currentPlayerIdx,
                playerName: players[currentPlayerIdx].name,
                emoji: players[currentPlayerIdx].emoji,
                time: currentTurnTime
            };
            
            players[currentPlayerIdx].turns.push(turn);
            players[currentPlayerIdx].totalTime += currentTurnTime;
            turnHistory.push(turn);
            
            console.log(`✅ Saved turn for ${turn.playerName}: ${formatTime(turn.time)}`);
            updateStats();
            updateTurnHistory();
        }

        function updateDisplay() {
            document.getElementById('timerDisplay').textContent = formatTime(currentTurnTime);
            document.getElementById('currentPlayerName').textContent = `${players[currentPlayerIdx].emoji} ${players[currentPlayerIdx].name}`;
            document.getElementById('turnNumber').textContent = (players[currentPlayerIdx].turns.length + 1);
            
            // Update player card border color
            const card = document.getElementById('currentPlayerCard');
            const colors = ['border-red-400', 'border-blue-400', 'border-green-400', 'border-yellow-400', 'border-purple-400', 'border-orange-400'];
            card.className = `bg-white rounded-xl shadow-sm border-4 ${colors[currentPlayerIdx % colors.length]} p-4 md:p-6 text-center`;
        }

        function updateStats() {
            document.getElementById('totalGameTime').textContent = formatTime(totalGameTime);
            
            const totalTurns = turnHistory.length;
            document.getElementById('turnCount').textContent = totalTurns;
            
            const avgTime = totalTurns > 0 ? totalGameTime / totalTurns : 0;
            document.getElementById('avgTurnTime').textContent = formatTime(avgTime);

            // Update player stats
            const statsContainer = document.getElementById('playerStatsContainer');
            statsContainer.innerHTML = players.map((player, idx) => {
                const avgPlayerTime = player.turns.length > 0 ? player.totalTime / player.turns.length : 0;
                return `
                    <div class="p-3 bg-gray-50 rounded-lg border border-gray-200">
                        <div class="flex items-center justify-between mb-2">
                            <span class="font-bold text-base">${player.emoji} ${player.name}</span>
                            <span class="text-xs bg-purple-100 text-purple-700 px-2 py-1 rounded font-bold">${player.turns.length} turns</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <div>
                                <div class="text-gray-600">Total</div>
                                <div class="font-bold text-base">${formatTime(player.totalTime)}</div>
                            </div>
                            <div>
                                <div class="text-gray-600">Avg/Turn</div>
                                <div class="font-bold text-base">${formatTime(avgPlayerTime)}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateTurnHistory() {
            const container = document.getElementById('turnHistoryContainer');
            container.innerHTML = turnHistory.slice(-12).reverse().map((turn, idx) => `
                <div class="p-2 bg-gray-50 rounded border border-gray-200 text-center text-xs">
                    <span class="text-lg">${turn.emoji}</span> <span class="font-bold">${turn.playerName}</span>
                    <div class="text-gray-600 font-mono">${formatTime(turn.time)}</div>
                </div>
            `).join('');
        }

        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const tenths = Math.floor((ms % 1000) / 100);
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${tenths}`;
        }

        function shareResults() {
            const totalGameTime = players.reduce((sum, p) => sum + p.totalTime, 0);
            const totalTurns = players.reduce((sum, p) => sum + p.turns.length, 0);
            const avgTime = totalTurns > 0 ? totalGameTime / totalTurns : 0;
            const now = new Date();
            const timestamp = now.toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });

            let text = `🎮 GAME TIMER RESULTS\n`;
            text += `${timestamp}\n\n`;
            text += `📊 GAME SUMMARY\n`;
            text += `${'='.repeat(40)}\n`;
            text += `Total Game Time: ${formatTime(totalGameTime)}\n`;
            text += `Total Turns: ${totalTurns}\n`;
            text += `Avg Turn Time: ${formatTime(avgTime)}\n\n`;

            text += `👥 PLAYER STATISTICS\n`;
            text += `${'='.repeat(40)}\n`;
            players.forEach(player => {
                const avgPlayerTime = player.turns.length > 0 ? player.totalTime / player.turns.length : 0;
                text += `\n${player.emoji} ${player.name}\n`;
                text += `  Turns: ${player.turns.length}\n`;
                text += `  Total Time: ${formatTime(player.totalTime)}\n`;
                text += `  Avg/Turn: ${formatTime(avgPlayerTime)}\n`;
            });

            text += `\n📋 TURN HISTORY (Last 12)\n`;
            text += `${'='.repeat(40)}\n`;
            turnHistory.slice(-12).reverse().forEach((turn, idx) => {
                text += `${idx + 1}. ${turn.emoji} ${turn.playerName}: ${formatTime(turn.time)}\n`;
            });

            // Copy to clipboard
            navigator.clipboard.writeText(text).then(() => {
                const shareBtn = event.target.closest('button');
                const originalContent = shareBtn.innerHTML;
                shareBtn.innerHTML = '✓ Copied!';
                shareBtn.classList.add('bg-green-50', 'text-green-600');
                setTimeout(() => {
                    shareBtn.innerHTML = originalContent;
                    shareBtn.classList.remove('bg-green-50', 'text-green-600');
                }, 2000);
            }).catch(() => {
                alert('Results:\n\n' + text);
            });
        }

        // Initialize display
        updateDisplay();
    </script>
    <!-- Vercel Web Analytics -->
    <script type="module" src="../analytics-init.js"></script>

</body>
</html>
