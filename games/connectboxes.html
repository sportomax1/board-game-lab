<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Connect Boxes</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>📦</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow: hidden;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 600px;
        }

        .screen.active {
            display: block;
        }

        .setup-card, .game-card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 2rem;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .credit-line {
            text-align: center;
            font-size: 0.8rem;
            color: #95a5a6;
            margin-top: 1rem;
            border-top: 1px solid #ecf0f1;
            padding-top: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #3498db;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .player-info {
            text-align: center;
        }

        .player-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .player-thumbnail {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid transparent;
        }

        .player1 .player-thumbnail {
            border-color: #e74c3c;
        }

        .player2 .player-thumbnail {
            border-color: #f39c12;
        }

        .current-turn {
            padding: 0.5rem 1rem;
            background: #ecf0f1;
            border-radius: 8px;
            font-weight: 700;
            color: #2c3e50;
        }

        .board {
            background: #3498db;
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .board-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.5rem;
        }

        .cell {
            aspect-ratio: 1;
            background: white;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .cell:hover {
            transform: scale(1.1);
        }

        .cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .cell.empty {
            background: rgba(255, 255, 255, 0.3);
        }

        .game-controls {
            display: flex;
            gap: 0.5rem;
        }

        .game-controls button {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .game-controls button:active {
            transform: scale(0.95);
        }

        .new-game-btn {
            background: #2ecc71;
            color: white;
        }

        .settings-btn {
            background: #95a5a6;
            color: white;
        }

        .winner-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .winner-modal.active {
            display: flex;
        }

        .winner-content {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            max-width: 400px;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .winner-title {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .winner-thumbnail {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin: 1rem auto;
            border: 5px solid #f39c12;
        }

        .loading {
            text-align: center;
            color: #7f8c8d;
            padding: 1rem;
        }
    </style>
</head>
<body>
    <!-- Setup Screen -->
    <div id="setupScreen" class="screen active">
        <div class="setup-card">
            <h1>📦 Connect Boxes</h1>
            <p class="subtitle">Play with your BGG collection thumbnails!</p>
            
            <div class="form-group">
                <label for="username1">Player 1 BGG Username</label>
                <input type="text" id="username1" value="sportomax" placeholder="Enter username">
            </div>

            <div class="form-group">
                <label for="username2">Player 2 BGG Username</label>
                <input type="text" id="username2" value="sportomax" placeholder="Enter username">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="includeExpansions">
                <label for="includeExpansions" style="margin: 0;">Include expansions</label>
            </div>

            <div style="margin-top: 1.5rem;">
                <button class="btn" onclick="startGame()">Start Game</button>
            </div>

            <div class="credit-line">
                Based on the classic Connect Four game concept
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="screen">
        <div class="game-card">
            <div class="game-header">
                <div class="player-info player1">
                    <img id="player1Thumb" class="player-thumbnail" src="" alt="Player 1">
                    <div class="player-name" id="player1Name">Player 1</div>
                </div>
                <div class="current-turn" id="turnIndicator">Player 1's Turn</div>
                <div class="player-info player2">
                    <img id="player2Thumb" class="player-thumbnail" src="" alt="Player 2">
                    <div class="player-name" id="player2Name">Player 2</div>
                </div>
            </div>

            <div class="board">
                <div class="board-grid" id="board"></div>
            </div>

            <div class="game-controls">
                <button class="new-game-btn" onclick="newGame()">New Game</button>
                <button class="settings-btn" onclick="backToSettings()">Settings</button>
            </div>
        </div>
    </div>

    <!-- Winner Modal -->
    <div id="winnerModal" class="winner-modal">
        <div class="winner-content">
            <div class="winner-title" id="winnerText">🎉 Winner!</div>
            <img id="winnerThumb" class="winner-thumbnail" src="" alt="Winner">
            <div style="margin-top: 1.5rem;">
                <button class="btn" onclick="newGame()">Play Again</button>
            </div>
        </div>
    </div>

    <script>
        const ROWS = 6;
        const COLS = 7;
        let board = [];
        let currentPlayer = 1;
        let player1Games = [];
        let player2Games = [];
        let gameActive = false;

        async function startGame() {
            const username1 = document.getElementById('username1').value.trim() || 'sportomax';
            const username2 = document.getElementById('username2').value.trim() || 'sportomax';
            const includeExpansions = document.getElementById('includeExpansions').checked;

            try {
                // Load both collections
                const subtype = includeExpansions ? '' : '&subtype=boardgame';
                
                const [res1, res2] = await Promise.all([
                    fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username1)}&own=1${subtype}&stats=1`),
                    fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username2)}&own=1${subtype}&stats=1`)
                ]);

                const [xml1, xml2] = await Promise.all([res1.text(), res2.text()]);

                const parser = new DOMParser();
                const doc1 = parser.parseFromString(xml1, 'text/xml');
                const doc2 = parser.parseFromString(xml2, 'text/xml');

                player1Games = Array.from(doc1.querySelectorAll('item')).map(item => ({
                    name: item.querySelector('name').textContent,
                    thumbnail: item.querySelector('thumbnail')?.textContent || ''
                })).filter(g => g.thumbnail);

                player2Games = Array.from(doc2.querySelectorAll('item')).map(item => ({
                    name: item.querySelector('name').textContent,
                    thumbnail: item.querySelector('thumbnail')?.textContent || ''
                })).filter(g => g.thumbnail);

                if (player1Games.length === 0 || player2Games.length === 0) {
                    alert('Could not load enough games with thumbnails. Please check usernames.');
                    return;
                }

                // Set player names
                document.getElementById('player1Name').textContent = username1;
                document.getElementById('player2Name').textContent = username2;

                // Initialize board
                initBoard();

                // Show game screen
                document.getElementById('setupScreen').classList.remove('active');
                document.getElementById('gameScreen').classList.add('active');

                newGame();
            } catch (error) {
                alert('Error loading collections: ' + error.message);
            }
        }

        function initBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            board = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));

            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell empty';
                    cell.dataset.col = col;
                    cell.onclick = () => dropPiece(col);
                    boardElement.appendChild(cell);
                }
            }
        }

        function newGame() {
            currentPlayer = 1;
            gameActive = true;
            document.getElementById('winnerModal').classList.remove('active');
            
            // Clear board
            board = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
            
            // Clear visual board
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                cell.className = 'cell empty';
                cell.innerHTML = '';
            });

            // Pick random thumbnails for players
            const p1Game = player1Games[Math.floor(Math.random() * player1Games.length)];
            const p2Game = player2Games[Math.floor(Math.random() * player2Games.length)];
            
            document.getElementById('player1Thumb').src = p1Game.thumbnail;
            document.getElementById('player2Thumb').src = p2Game.thumbnail;
            
            updateTurnIndicator();
        }

        function dropPiece(col) {
            if (!gameActive) return;

            // Find the lowest empty row in this column
            let row = -1;
            for (let r = ROWS - 1; r >= 0; r--) {
                if (!board[r][col]) {
                    row = r;
                    break;
                }
            }

            if (row === -1) return; // Column is full

            // Place piece
            board[row][col] = currentPlayer;
            
            // Update visual
            const cellIndex = row * COLS + col;
            const cell = document.querySelectorAll('.cell')[cellIndex];
            cell.classList.remove('empty');
            
            const img = document.createElement('img');
            const thumbnail = currentPlayer === 1 
                ? document.getElementById('player1Thumb').src 
                : document.getElementById('player2Thumb').src;
            img.src = thumbnail;
            cell.appendChild(img);

            // Check for winner
            if (checkWinner(row, col)) {
                gameActive = false;
                setTimeout(() => showWinner(), 500);
                return;
            }

            // Check for draw
            if (board.every(row => row.every(cell => cell !== null))) {
                gameActive = false;
                setTimeout(() => {
                    alert('Game is a draw!');
                    newGame();
                }, 500);
                return;
            }

            // Switch player
            currentPlayer = currentPlayer === 1 ? 2 : 1;
            updateTurnIndicator();
        }

        function checkWinner(row, col) {
            const player = board[row][col];
            
            // Check horizontal
            let count = 1;
            for (let c = col - 1; c >= 0 && board[row][c] === player; c--) count++;
            for (let c = col + 1; c < COLS && board[row][c] === player; c++) count++;
            if (count >= 4) return true;

            // Check vertical
            count = 1;
            for (let r = row - 1; r >= 0 && board[r][col] === player; r--) count++;
            for (let r = row + 1; r < ROWS && board[r][col] === player; r++) count++;
            if (count >= 4) return true;

            // Check diagonal (top-left to bottom-right)
            count = 1;
            for (let r = row - 1, c = col - 1; r >= 0 && c >= 0 && board[r][c] === player; r--, c--) count++;
            for (let r = row + 1, c = col + 1; r < ROWS && c < COLS && board[r][c] === player; r++, c++) count++;
            if (count >= 4) return true;

            // Check diagonal (top-right to bottom-left)
            count = 1;
            for (let r = row - 1, c = col + 1; r >= 0 && c < COLS && board[r][c] === player; r--, c++) count++;
            for (let r = row + 1, c = col - 1; r < ROWS && c >= 0 && board[r][c] === player; r++, c--) count++;
            if (count >= 4) return true;

            return false;
        }

        function updateTurnIndicator() {
            const indicator = document.getElementById('turnIndicator');
            const playerName = currentPlayer === 1 
                ? document.getElementById('player1Name').textContent 
                : document.getElementById('player2Name').textContent;
            indicator.textContent = `${playerName}'s Turn`;
            indicator.style.background = currentPlayer === 1 ? '#fee' : '#ffeaa7';
        }

        function showWinner() {
            const playerName = currentPlayer === 1 
                ? document.getElementById('player1Name').textContent 
                : document.getElementById('player2Name').textContent;
            const thumbnail = currentPlayer === 1
                ? document.getElementById('player1Thumb').src
                : document.getElementById('player2Thumb').src;

            document.getElementById('winnerText').textContent = `🎉 ${playerName} Wins!`;
            document.getElementById('winnerThumb').src = thumbnail;
            document.getElementById('winnerModal').classList.add('active');
        }

        function backToSettings() {
            if (confirm('Are you sure you want to go back to settings? Current game will be lost.')) {
                document.getElementById('gameScreen').classList.remove('active');
                document.getElementById('setupScreen').classList.add('active');
            }
        }
    </script>
    <!-- Vercel Web Analytics -->
    <script type="module" src="../analytics-init.js"></script>
</body>
</html>
