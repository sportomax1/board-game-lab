<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Helmet Shuffle | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🎪</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        :root {
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
            height: 100dvh;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .shell-container {
            perspective: 1000px;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            touch-action: none;
            position: absolute;
            width: 100px;
            height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }
        
        .shell {
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 20;
            pointer-events: none;
        }
        
        .shell.lift {
            transform: translateY(-80px) rotateX(-20deg);
        }
        
        .game-ball {
            position: absolute;
            bottom: 10px;
            width: 50px;
            height: 50px;
            object-fit: contain;
            border-radius: 50%;
            border: 2px solid #f59e0b;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
            background: #000;
            padding: 2px;
            z-index: 10;
            transition: opacity 0.3s ease;
        }
        
        .shell-icon {
            font-size: 5rem;
            display: block;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
            transition: color 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .wrong-shake { animation: shake 0.4s ease-in-out; }

        @keyframes success-pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .success-pulse { animation: success-pulse 0.5s ease-in-out; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    </style>
</head>
<body class="selection:bg-indigo-500/30">
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-indigo-900/20 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[10%] right-[0%] w-[50%] h-[50%] bg-blue-900/10 blur-[120px] rounded-full"></div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/80 backdrop-blur-md"></div>
        <div class="glass relative max-w-sm w-full rounded-[2.5rem] p-8 shadow-2xl border-t border-white/20 max-h-[90vh] overflow-y-auto custom-scrollbar">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-indigo-500/20 rounded-3xl flex items-center justify-center mx-auto mb-4 border border-indigo-500/30">
                    <span class="text-4xl">🎪</span>
                </div>
                <h1 class="text-3xl font-black tracking-tight text-white mb-2 italic uppercase text-indigo-400">Helmet Shuffle</h1>
                <p class="text-slate-400 text-sm font-medium">Watch carefully, find the game!</p>
            </div>

            <div class="space-y-5">
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">BGG Username</label>
                    <input type="text" id="username" value="sportomax" class="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all font-medium">
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Speed</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="setSpeed('slow', this)" class="speed-btn py-2 rounded-xl border border-white/10 text-[10px] font-black uppercase tracking-widest transition-all bg-white/5">Slow</button>
                        <button onclick="setSpeed('medium', this)" class="speed-btn py-2 rounded-xl border border-indigo-500 text-[10px] font-black uppercase tracking-widest transition-all bg-indigo-500">Normal</button>
                        <button onclick="setSpeed('fast', this)" class="speed-btn py-2 rounded-xl border border-white/10 text-[10px] font-black uppercase tracking-widest transition-all bg-white/5">Pro</button>
                    </div>
                    <input type="hidden" id="shuffleSpeed" value="medium">
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Hiding Object</label>
                    <div class="grid grid-cols-4 gap-2">
                        <button onclick="setObject('door', this)" class="object-btn p-3 rounded-xl border border-indigo-500 bg-indigo-500/20 text-2xl transition-all" data-object="door">🚪</button>
                        <button onclick="setObject('hat', this)" class="object-btn p-3 rounded-xl border border-white/10 bg-white/5 text-2xl transition-all" data-object="hat">🎩</button>
                        <button onclick="setObject('pot', this)" class="object-btn p-3 rounded-xl border border-white/10 bg-white/5 text-2xl transition-all" data-object="pot">🏺</button>
                        <button onclick="setObject('bucket', this)" class="object-btn p-3 rounded-xl border border-white/10 bg-white/5 text-2xl transition-all" data-object="bucket">🪣</button>
                    </div>
                    <input type="hidden" id="hidingObject" value="door">
                </div>

                <div class="flex items-center justify-between bg-white/5 p-4 rounded-2xl border border-white/10">
                    <span class="text-xs font-black text-white uppercase italic tracking-tight">Exclude Expansions</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="excludeExpansions" class="sr-only peer" checked>
                        <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-500"></div>
                    </label>
                </div>

                <button onclick="startGame()" class="w-full btn-primary text-white py-4 rounded-2xl font-black text-lg uppercase tracking-tight hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2 mt-4 shadow-xl">
                    Start Game
                </button>
            </div>
        </div>
    </div>

    <!-- Main Game App -->
    <div id="app" class="hidden relative z-10 flex flex-col min-h-screen pt-safe">
        <header class="p-6 flex items-center justify-between border-b border-white/5 bg-slate-900/50 backdrop-blur-md">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-indigo-500/20 rounded-xl flex items-center justify-center border border-indigo-500/30">
                    <i data-lucide="play" class="text-indigo-400 w-5 h-5 fill-current"></i>
                </div>
                <h1 class="text-xl font-black italic uppercase tracking-tighter text-white leading-none">Helmet <span class="text-indigo-400">Shuffle</span></h1>
            </div>
            <button onclick="showSettings()" class="glass w-10 h-10 rounded-xl flex items-center justify-center text-slate-400 hover:text-white transition-all">
                <i data-lucide="settings" class="w-5 h-5"></i>
            </button>
        </header>

        <main class="flex-1 p-4 md:p-8 max-w-5xl mx-auto w-full flex flex-col gap-12 justify-center">
            <!-- Scoreboard -->
            <div class="grid grid-cols-3 gap-3 w-full max-w-sm mx-auto">
                <div class="glass p-4 rounded-2xl border border-white/5 flex flex-col items-center">
                    <span class="text-[8px] font-black uppercase tracking-widest text-emerald-500 mb-1">Wins</span>
                    <span id="correctScore" class="text-2xl font-black text-white italic leading-none">0</span>
                </div>
                <div class="glass p-4 rounded-2xl border border-white/5 flex flex-col items-center">
                    <span class="text-[8px] font-black uppercase tracking-widest text-rose-500 mb-1">Losses</span>
                    <span id="incorrectScore" class="text-2xl font-black text-white italic leading-none">0</span>
                </div>
                <div class="glass p-4 rounded-2xl border border-white/5 flex flex-col items-center">
                    <span id="streakLabel" class="text-[8px] font-black uppercase tracking-widest text-indigo-500 mb-1">Streak</span>
                    <span id="streakScore" class="text-2xl font-black text-white italic leading-none">0</span>
                </div>
            </div>

            <!-- Game Stage -->
            <div id="gameStage" class="glass rounded-[3rem] p-8 md:p-12 border border-white/10 shadow-2xl relative overflow-visible flex flex-col items-center justify-center min-h-[450px]">
                <div class="absolute inset-0 bg-indigo-500/5 pointer-events-none rounded-[3rem]"></div>
                
                <!-- Initial Show -->
                <div id="initialShow" class="text-center space-y-6 animate-in">
                    <p class="text-[10px] font-black uppercase tracking-[0.3em] text-indigo-400">Remember This Game</p>
                    <div class="relative group">
                        <div class="absolute -inset-4 bg-indigo-500/20 blur-xl rounded-full opacity-50"></div>
                        <img id="initialGameImage" src="" class="relative w-32 h-32 md:w-40 md:h-40 object-contain rounded-2xl border-4 border-indigo-500/30 bg-black/40 p-2 shadow-2xl">
                    </div>
                    <h2 id="initialGameName" class="text-xl font-black text-white italic uppercase tracking-tighter"></h2>
                </div>

                <!-- Arena -->
                <div id="arena" class="hidden w-full flex flex-col items-center relative">
                    <p id="gameInstruction" class="text-[10px] font-black uppercase tracking-[0.3em] text-amber-400 mb-16 h-4">WATCH CAREFULLY</p>
                    
                    <div id="shellsArea" class="w-full max-w-md h-40 relative">
                        <!-- Shells and Balls will be here -->
                    </div>

                    <div class="mt-16 h-12 flex items-center justify-center">
                        <button id="readyBtn" onclick="startShuffleSequence()" class="hidden btn-primary text-white px-10 py-4 rounded-2xl font-black text-sm uppercase tracking-widest transition-all hover:scale-105 active:scale-95 shadow-xl">
                            Ready?
                        </button>
                        <button id="nextBtn" onclick="newGame()" class="hidden glass border-white/10 text-white px-10 py-4 rounded-2xl font-black text-sm uppercase tracking-widest transition-all hover:bg-white/10 active:scale-95 shadow-xl">
                            Next Round
                        </button>
                    </div>
                </div>

                <!-- Result -->
                <div id="resultMessage" class="hidden text-center mt-8 space-y-2 pointer-events-none">
                    <p id="resultText" class="text-4xl font-black italic uppercase tracking-tighter"></p>
                    <p id="resultGame" class="text-[10px] font-bold text-slate-500 uppercase tracking-widest"></p>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        let collection = [];
        let currentGame = null;
        let correctSlot = 0; // 0, 1, or 2
        let correctScore = 0;
        let incorrectScore = 0;
        let currentStreak = 0;
        let isShuffling = false;
        let canClick = false;
        let speedSettings = { slow: 1000, medium: 600, fast: 300 };
        const IMAGE_PROXY = '/api/image-proxy?url=';

        const objects = {
            door: '🚪', hat: '🎩', pot: '🏺', bucket: '🪣'
        };

        function setSpeed(val, btn) {
            document.getElementById('shuffleSpeed').value = val;
            document.querySelectorAll('.speed-btn').forEach(b => b.className = 'speed-btn py-2 rounded-xl border border-white/10 text-[10px] font-black uppercase tracking-widest transition-all bg-white/5');
            btn.className = 'speed-btn py-2 rounded-xl border border-indigo-500 text-[10px] font-black uppercase tracking-widest transition-all bg-indigo-500';
        }

        function setObject(val, btn) {
            document.getElementById('hidingObject').value = val;
            document.querySelectorAll('.object-btn').forEach(b => b.className = 'object-btn p-3 rounded-xl border border-white/10 bg-white/5 text-2xl transition-all');
            btn.className = 'object-btn p-3 rounded-xl border border-indigo-500 bg-indigo-500/20 text-2xl transition-all';
        }

        async function startGame() {
            const username = document.getElementById('username').value.trim() || 'sportomax';
            const exclude = document.getElementById('excludeExpansions').checked;
            
            document.getElementById('settingsModal').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            
            try {
                const res = await fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1${exclude ? '&subtype=boardgame' : ''}`);
                const doc = new DOMParser().parseFromString(await res.text(), 'text/xml');
                collection = Array.from(doc.querySelectorAll('item')).map(item => ({
                    id: item.getAttribute('objectid'),
                    name: item.querySelector('name').textContent,
                    thumbnail: item.querySelector('thumbnail')?.textContent || ''
                })).filter(g => g.thumbnail);
                
                if (collection.length === 0) throw new Error('No games found');
                newGame();
            } catch (e) { alert(e.message); showSettings(); }
        }

        function newGame() {
            if (collection.length === 0) return;
            isShuffling = false; canClick = false;
            document.getElementById('resultMessage').classList.add('hidden');
            document.getElementById('arena').classList.add('hidden');
            document.getElementById('initialShow').classList.remove('hidden');
            document.getElementById('nextBtn').classList.add('hidden');
            document.getElementById('gameStage').classList.remove('wrong-shake', 'success-pulse');
            
            currentGame = collection[Math.floor(Math.random() * collection.length)];
            document.getElementById('initialGameImage').src = `${IMAGE_PROXY}${encodeURIComponent(currentGame.thumbnail)}`;
            document.getElementById('initialGameName').textContent = currentGame.name;
            
            setTimeout(() => {
                document.getElementById('initialShow').classList.add('hidden');
                setupArena();
            }, 3000);
        }

        function setupArena() {
            const icon = objects[document.getElementById('hidingObject').value];
            const area = document.getElementById('shellsArea');
            area.innerHTML = '';
            
            correctSlot = Math.floor(Math.random() * 3);
            
            for (let i = 0; i < 3; i++) {
                const container = document.createElement('div');
                container.className = 'shell-container';
                container.style.left = `${i * 33}%`;
                container.id = `container-${i}`;
                container.onclick = () => handlePick(i);
                
                container.innerHTML = `
                    <img id="ball-${i}" src="${i === correctSlot ? IMAGE_PROXY + encodeURIComponent(currentGame.thumbnail) : ''}" 
                         class="game-ball" style="opacity: ${i === correctSlot ? 1 : 0}">
                    <div class="shell" id="shell-${i}">
                        <span class="shell-icon">${icon}</span>
                    </div>
                `;
                area.appendChild(container);
            }
            
            document.getElementById('arena').classList.remove('hidden');
            document.getElementById('gameInstruction').textContent = 'REMEMBER THE SPOT';
            
            setTimeout(() => {
                document.getElementById(`shell-${correctSlot}`).classList.add('lift');
                setTimeout(() => {
                    document.getElementById(`shell-${correctSlot}`).classList.remove('lift');
                    setTimeout(() => {
                        document.getElementById('readyBtn').classList.remove('hidden');
                    }, 600);
                }, 1500);
            }, 500);
        }

        async function startShuffleSequence() {
            document.getElementById('readyBtn').classList.add('hidden');
            document.getElementById('gameInstruction').textContent = 'WATCHING...';
            isShuffling = true;
            
            // Hide the ball
            document.getElementById(`ball-${correctSlot}`).style.opacity = 0;
            await wait(300);

            const speed = document.getElementById('shuffleSpeed').value;
            const duration = speedSettings[speed];
            const numSwaps = speed === 'fast' ? 15 : speed === 'medium' ? 10 : 7;
            
            let slots = [0, 1, 2]; // tracking which container is in which slot

            for (let i = 0; i < numSwaps; i++) {
                const s1 = Math.floor(Math.random() * 3);
                let s2 = Math.floor(Math.random() * 3);
                while (s2 === s1) s2 = Math.floor(Math.random() * 3);
                
                await swap(slots, s1, s2, duration);
            }

            isShuffling = false;
            canClick = true;
            document.getElementById('gameInstruction').textContent = 'CHOOSE!';
        }

        function swap(slots, pos1, pos2, duration) {
            return new Promise(resolve => {
                const c1 = document.getElementById(`container-${slots[pos1]}`);
                const c2 = document.getElementById(`container-${slots[pos2]}`);
                
                c1.style.transition = `left ${duration}ms cubic-bezier(0.45, 0, 0.55, 1)`;
                c2.style.transition = `left ${duration}ms cubic-bezier(0.45, 0, 0.55, 1)`;
                
                const left1 = c1.style.left;
                const left2 = c2.style.left;
                
                c1.style.left = left2;
                c2.style.left = left1;
                
                [slots[pos1], slots[pos2]] = [slots[pos2], slots[pos1]];
                
                setTimeout(resolve, duration + 50);
            });
        }

        function handlePick(containerIdx) {
            if (!canClick || isShuffling) return;
            canClick = false;
            
            const isCorrect = containerIdx === correctSlot;
            
            // Lift all
            document.querySelectorAll('.shell').forEach(s => s.classList.add('lift'));
            document.getElementById(`ball-${correctSlot}`).style.opacity = 1;
            
            const resText = document.getElementById('resultText');
            if (isCorrect) {
                correctScore++; currentStreak++;
                resText.textContent = 'WINNER! 🎉';
                resText.className = 'text-4xl font-black italic uppercase tracking-tighter text-emerald-400';
                document.getElementById('gameStage').classList.add('success-pulse');
            } else {
                incorrectScore++; currentStreak = 0;
                resText.textContent = 'MISSED! ✕';
                resText.className = 'text-4xl font-black italic uppercase tracking-tighter text-rose-500';
                document.getElementById('gameStage').classList.add('wrong-shake');
            }
            
            document.getElementById('correctScore').textContent = correctScore;
            document.getElementById('incorrectScore').textContent = incorrectScore;
            document.getElementById('streakScore').textContent = currentStreak;
            document.getElementById('resultGame').textContent = `The game was ${currentGame.name}`;
            document.getElementById('resultMessage').classList.remove('hidden');
            document.getElementById('gameInstruction').textContent = '';
            document.getElementById('nextBtn').classList.remove('hidden');
        }

        function showSettings() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
    </script>
    <script type="module" src="../analytics-init.js"></script>
</body>
</html>
