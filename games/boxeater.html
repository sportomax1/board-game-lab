<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Box Eater</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at top,#164e63,#0f172a 45%,#020617);color:#fff;overflow:hidden}body{display:grid;place-items:center;padding:10px}.app{width:min(100%,760px);display:grid;gap:9px}.top,.hud{background:rgba(15,23,42,.87);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(15px)}.top{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;border-radius:18px}.brand{display:flex;align-items:center;gap:10px}.logo{width:43px;height:43px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#facc15,#f97316);font-size:24px}h1{margin:0;font-size:20px}.sub{font-size:11px;color:#94a3b8;margin-top:3px}.btn{border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.08);color:white;border-radius:11px;padding:10px 12px;font-weight:900}.hud{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:7px;border-radius:15px}.stat{text-align:center}.stat b{display:block;font-size:17px}.stat span{font-size:8px;letter-spacing:.1em;color:#94a3b8;text-transform:uppercase}.stage{position:relative;width:min(100%,650px);margin:auto;aspect-ratio:19/21;border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.14);box-shadow:0 28px 80px rgba(0,0,0,.5);touch-action:none}canvas{display:block;width:100%;height:100%;background:#030712}.controls{display:none;grid-template-columns:repeat(3,55px);grid-template-rows:repeat(2,50px);gap:6px;justify-content:center}.controls button{border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.09);color:white;border-radius:12px;font-size:20px;font-weight:900}.controls .up{grid-column:2}.controls .left{grid-column:1}.controls .down{grid-column:2}.controls .right{grid-column:3}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:rgba(2,6,23,.8);backdrop-filter:blur(7px)}.overlay.hidden{display:none}.card{width:min(100%,400px);padding:23px;border-radius:22px;background:linear-gradient(180deg,#1e293b,#0f172a);border:1px solid rgba(255,255,255,.14);text-align:center}.card p{color:#cbd5e1;line-height:1.5}.card input{width:100%;padding:12px;border-radius:11px;border:1px solid #334155;background:#020617;color:white;margin:7px 0}.primary{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,#facc15,#f97316);color:#111827;font-weight:950}.status{font-size:12px;color:#fbbf24;min-height:18px}.tip{text-align:center;color:#94a3b8;font-size:12px}@media(max-width:650px){.stage{max-height:calc(100vh - 240px);width:auto}.controls{display:grid}.tip{display:none}.sub{display:none}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">🟡</div><div><h1>Box Eater</h1><div class="sub">Gobble your game shelf before the collectors catch you</div></div></div><div><button class="btn" id="pause">Ⅱ</button> <button class="btn" onclick="location.href='../home.html'">⌂</button></div></header><section class="hud"><div class="stat"><b id="score">0</b><span>Score</span></div><div class="stat"><b id="level">1</b><span>Level</span></div><div class="stat"><b id="lives">♥♥♥</b><span>Lives</span></div><div class="stat"><b id="left">0</b><span>Left</span></div><div class="stat"><b id="best">0</b><span>Best</span></div></section><div class="stage" id="stage"><canvas id="game" width="570" height="630"></canvas><div class="overlay" id="setup"><div class="card"><h1>🟡 Box Eater</h1><p>Eat every game token, grab cover art for temporary power, and chase down the rival collectors while they are scared.</p><input id="user" value="sportomax" placeholder="BGG username"><div class="status" id="status"></div><button class="primary" id="start">Load Collection & Play</button></div></div><div class="overlay hidden" id="end"><div class="card"><h1 id="endTitle">Game Over</h1><p id="endText"></p><button class="primary" id="endBtn">Play Again</button></div></div></div><div class="controls"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div><div class="tip">Arrow keys / WASD · Swipe on the maze · P pauses</div></div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),CELL=30,COLS=19,ROWS=21;const raw=["1111111111111111111","1222222221222222221","1311211121211121131","1211211121211121121","1222222222222222221","1211212111112121121","1222212221222122221","1111211010112121111","0001210000002121000","1111210114112121111","0000200100012020000","1111210111112121111","0001210000002121000","1111210111112121111","1222222221222222221","1211211121211121121","1321222222222221231","1121212111112121211","1222212221222122221","1211111121211111121","1111111111111111111"];
let grid=[],player,ghosts=[],score=0,level=1,lives=3,best=Number(localStorage.boxEaterBest||0),remaining=0,power=0,running=false,paused=false,last=0,acc=0,step=.12,images=[];
async function loadCollection(){status.textContent='Loading collection…';try{let r=await fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(user.value||'sportomax')}&own=1&stats=1`),x=new DOMParser().parseFromString(await r.text(),'text/xml');images=Array.from(x.querySelectorAll('item')).map(i=>i.querySelector('thumbnail')?.textContent).filter(Boolean).slice(0,40).map(src=>{let im=new Image();im.crossOrigin='anonymous';im.src='https://images.weserv.nl/?url='+encodeURIComponent(src);return im});status.textContent=''}catch(e){status.textContent='Collection unavailable. Using power tokens.'}}
function initLevel(){grid=raw.map(r=>[...r].map(Number));remaining=0;grid.forEach(row=>row.forEach(v=>{if(v===2||v===3)remaining++}));player={x:9,y:15,dx:0,dy:0,nx:0,ny:0,mouth:0};ghosts=[{x:9,y:9,dx:-1,dy:0,c:'#ef4444'},{x:8,y:9,dx:1,dy:0,c:'#f472b6'},{x:10,y:9,dx:-1,dy:0,c:'#22d3ee'},{x:9,y:10,dx:0,dy:-1,c:'#fb923c'}];power=0;step=Math.max(.065,.13-level*.006);updateHud()}
function newGame(){score=0;level=1;lives=3;initLevel();setup.classList.add('hidden');end.classList.add('hidden');running=true;paused=false;last=performance.now();requestAnimationFrame(loop)}function walkable(x,y){if(x<0)x=COLS-1;if(x>=COLS)x=0;return y>=0&&y<ROWS&&grid[y][x]!==1}function wrap(o){if(o.x<0)o.x=COLS-1;if(o.x>=COLS)o.x=0}
function setDir(dx,dy){player.nx=dx;player.ny=dy}function movePlayer(){if(walkable(player.x+player.nx,player.y+player.ny)){player.dx=player.nx;player.dy=player.ny}if(walkable(player.x+player.dx,player.y+player.dy)){player.x+=player.dx;player.y+=player.dy;wrap(player)}let v=grid[player.y][player.x];if(v===2){grid[player.y][player.x]=0;score+=10;remaining--}if(v===3){grid[player.y][player.x]=0;score+=75;remaining--;power=7;ghosts.forEach(g=>g.scared=true)}player.mouth=(player.mouth+1)%2;if(remaining<=0){score+=500;level++;initLevel()}updateHud()}
function choices(g){return [[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy])=>walkable(g.x+dx,g.y+dy)&&!(dx===-g.dx&&dy===-g.dy))}function moveGhost(g){let opts=choices(g);if(!opts.length)opts=[[-g.dx,-g.dy]];let target=power>0?{x:COLS-1-player.x,y:ROWS-1-player.y}:player;opts.sort((a,b)=>{let da=Math.abs(g.x+a[0]-target.x)+Math.abs(g.y+a[1]-target.y),db=Math.abs(g.x+b[0]-target.x)+Math.abs(g.y+b[1]-target.y);return(power>0?db-da:da-db)+(Math.random()-.5)*2});[g.dx,g.dy]=opts[0];g.x+=g.dx;g.y+=g.dy;wrap(g)}
function collision(){for(const g of ghosts)if(g.x===player.x&&g.y===player.y){if(power>0){score+=200;g.x=9;g.y=9;g.scared=false}else loseLife()}}function loseLife(){lives--;updateHud();if(lives<=0){running=false;best=Math.max(best,score);localStorage.boxEaterBest=best;updateHud();endTitle.textContent='Shelf Raided!';endText.textContent=`Score ${score.toLocaleString()} · Level ${level}`;endBtn.onclick=newGame;end.classList.remove('hidden')}else{player.x=9;player.y=15;player.dx=player.dy=0;ghosts.forEach((g,i)=>{g.x=8+i%3;g.y=9+(i===3);});power=0}}
function update(dt){acc+=dt;if(power>0){power-=dt;if(power<=0)ghosts.forEach(g=>g.scared=false)}while(acc>step){movePlayer();ghosts.forEach(moveGhost);collision();acc-=step}}
function draw(){ctx.fillStyle='#030712';ctx.fillRect(0,0,c.width,c.height);for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){let v=grid[y][x],px=x*CELL,py=y*CELL;if(v===1){let grad=ctx.createLinearGradient(px,py,px+CELL,py+CELL);grad.addColorStop(0,'#312e81');grad.addColorStop(1,'#1d4ed8');ctx.fillStyle=grad;ctx.fillRect(px+2,py+2,CELL-4,CELL-4);ctx.strokeStyle='rgba(147,197,253,.55)';ctx.strokeRect(px+4,py+4,CELL-8,CELL-8)}else if(v===2){ctx.fillStyle='#fde047';ctx.beginPath();ctx.arc(px+15,py+15,3,0,Math.PI*2);ctx.fill()}else if(v===3){ctx.save();ctx.beginPath();ctx.arc(px+15,py+15,12,0,Math.PI*2);ctx.clip();let im=images[(x+y)%Math.max(1,images.length)];if(im?.complete)try{ctx.drawImage(im,px+3,py+3,24,24)}catch{ctx.fillStyle='#fff';ctx.fill()}else{ctx.fillStyle='#f8fafc';ctx.fillRect(px+3,py+3,24,24)}ctx.restore();ctx.strokeStyle='#facc15';ctx.lineWidth=2;ctx.strokeRect(px+3,py+3,24,24)}}
let cx=player.x*CELL+15,cy=player.y*CELL+15,angle=Math.atan2(player.dy,player.dx)||0,mouth=player.mouth?.3:.08;ctx.fillStyle='#facc15';ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,12,angle+mouth,angle+Math.PI*2-mouth);ctx.closePath();ctx.fill();for(const g of ghosts){let gx=g.x*CELL+15,gy=g.y*CELL+16;ctx.fillStyle=power>0?'#6366f1':g.c;ctx.beginPath();ctx.arc(gx,gy-3,11,Math.PI,0);ctx.lineTo(gx+11,gy+10);ctx.lineTo(gx+5,gy+5);ctx.lineTo(gx,gy+10);ctx.lineTo(gx-5,gy+5);ctx.lineTo(gx-11,gy+10);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(gx-4,gy-3,3,0,Math.PI*2);ctx.arc(gx+4,gy-3,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#0f172a';ctx.beginPath();ctx.arc(gx-4+g.dx,gy-3+g.dy,1.5,0,Math.PI*2);ctx.arc(gx+4+g.dx,gy-3+g.dy,1.5,0,Math.PI*2);ctx.fill()}if(paused){ctx.fillStyle='rgba(2,6,23,.65)';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.font='900 34px system-ui';ctx.textAlign='center';ctx.fillText('PAUSED',c.width/2,c.height/2)}}
function loop(t){if(!running)return;let dt=Math.min(.05,(t-last)/1000||0);last=t;if(!paused)update(dt);draw();requestAnimationFrame(loop)}function updateHud(){scoreEl.textContent=score.toLocaleString();levelEl.textContent=level;livesEl.textContent='♥'.repeat(lives)||'—';leftEl.textContent=remaining;bestEl.textContent=best.toLocaleString()}const scoreEl=document.getElementById('score'),levelEl=document.getElementById('level'),livesEl=document.getElementById('lives'),leftEl=document.getElementById('left'),bestEl=document.getElementById('best');let sx=0,sy=0;stage.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});stage.addEventListener('pointerup',e=>{let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;Math.abs(dx)>Math.abs(dy)?setDir(Math.sign(dx),0):setDir(0,Math.sign(dy))});document.querySelectorAll('[data-dir]').forEach(b=>b.onpointerdown=()=>({up:()=>setDir(0,-1),down:()=>setDir(0,1),left:()=>setDir(-1,0),right:()=>setDir(1,0)})[b.dataset.dir]());addEventListener('keydown',e=>{let k=e.key.toLowerCase(),m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};if(m[k]){e.preventDefault();setDir(...m[k])}if(k==='p')paused=!paused});pause.onclick=()=>paused=!paused;start.onclick=async()=>{await loadCollection();newGame()};updateHud();initLevel();draw();
</script></body></html>
