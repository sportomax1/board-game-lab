<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Spelling | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🔤</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .letter-shape {
            display: inline-grid;
            gap: 2px;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            transition: all 0.3s ease;
        }

        .shape-label {
            position: absolute;
            top: 0.5rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            font-weight: 900;
            color: #10b981;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0.5;
        }

        .thumb-mini {
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .thumb-mini:hover {
            transform: scale(1.5);
            z-index: 50;
            border-color: #10b981;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
        }

        .thumb-mini.used {
            opacity: 0.2;
            filter: grayscale(1);
            cursor: default;
        }

        .mode-btn {
            @apply flex-1 py-3 px-4 rounded-2xl border border-white/10 text-[10px] font-black uppercase tracking-widest transition-all;
        }

        .mode-btn.active {
            @apply bg-emerald-500 border-emerald-500 text-white shadow-lg shadow-emerald-500/20;
        }

        .mode-btn:not(.active) {
            @apply bg-white/5 text-slate-500 hover:bg-white/10;
        }

        @keyframes pulse-emerald {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .word-complete {
            animation: pulse-emerald 0.5s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen pb-safe">
    <!-- Setup Screen -->
    <div id="setupScreen" class="fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/80 backdrop-blur-md"></div>
        <div class="glass relative max-w-sm w-full rounded-[2.5rem] p-8 shadow-2xl border-t border-white/20">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-emerald-500/20 rounded-3xl flex items-center justify-center mx-auto mb-4 border border-emerald-500/30">
                    <span class="text-4xl">🔤</span>
                </div>
                <h1 class="text-3xl font-black tracking-tight text-white mb-2 italic uppercase">Spell <span class="text-emerald-400">Board</span></h1>
                <p class="text-slate-400 text-sm font-medium">Spell names with collection icons</p>
            </div>

            <div class="space-y-5">
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">BGG Username</label>
                    <input type="text" id="username" value="sportomax" class="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500/50 transition-all font-medium">
                </div>

                <button onclick="loadCollection()" class="w-full bg-emerald-500 text-white py-4 rounded-2xl font-black text-lg uppercase tracking-tight hover:scale-[1.02] active:scale-95 transition-all shadow-xl shadow-emerald-500/20 mt-4">
                    Get Spelling
                </button>
            </div>
        </div>
    </div>

    <!-- Main Game -->
    <div id="app" class="hidden min-h-screen flex flex-col">
        <header class="p-6 border-b border-white/5 flex flex-col md:flex-row md:items-center justify-between gap-6">
            <div class="flex flex-col">
                <h1 class="text-2xl font-black italic uppercase tracking-tighter leading-tight text-white">Spell <span class="text-emerald-400">Board</span></h1>
                <p id="headerInfo" class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-1 italic"></p>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="showSettings()" class="glass px-6 py-2 rounded-2xl border border-white/10 text-[10px] font-black uppercase tracking-widest hover:bg-white/10 transition-all">Settings</button>
            </div>
        </header>

        <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full space-y-8">
            <!-- Mode & Size Selectors -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="glass rounded-[2rem] p-6 border border-white/10">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-4 block">Game Mode</label>
                    <div class="flex gap-2">
                        <button onclick="setGameMode('gameName', this)" class="mode-btn active">Multi Game</button>
                        <button onclick="setGameMode('gameNameSingle', this)" class="mode-btn">One Game</button>
                        <button onclick="setGameMode('username', this)" class="mode-btn">Username</button>
                    </div>
                </div>
                <div class="glass rounded-[2rem] p-6 border border-white/10">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-4 block">Thumbnail Size</label>
                    <div class="flex gap-2">
                        <button onclick="setThumbSize('small', this)" class="mode-btn">Small</button>
                        <button onclick="setThumbSize('medium', this)" class="mode-btn active">Medium</button>
                        <button onclick="setThumbSize('large', this)" class="mode-btn">Large</button>
                    </div>
                </div>
            </div>

            <!-- Play Zone -->
            <div class="glass rounded-[3rem] p-8 border border-white/10 shadow-2xl relative overflow-hidden">
                <div class="absolute inset-0 bg-emerald-500/5 pointer-events-none"></div>
                
                <div class="relative z-10">
                    <div class="text-center mb-12">
                        <p class="text-[10px] font-black uppercase tracking-[0.3em] text-emerald-500 mb-2">Spell This Word</p>
                        <h2 id="targetWord" class="text-4xl md:text-6xl font-black text-white italic uppercase tracking-tighter"></h2>
                    </div>

                    <div id="letterGrid" class="flex flex-wrap gap-6 justify-center"></div>

                    <div class="mt-12 flex flex-col items-center gap-6">
                        <div id="currentProgress" class="flex items-center gap-2">
                            <span id="currentSpelling" class="text-2xl font-black text-emerald-400 tracking-[0.2em] italic">_</span>
                        </div>

                        <div class="flex gap-3">
                            <button onclick="resetCurrentWord()" class="px-8 py-3 rounded-2xl bg-white/5 border border-white/10 text-xs font-black uppercase tracking-widest text-slate-400 hover:text-white transition-all">Reset</button>
                            <button id="nextBtn" onclick="nextWord()" class="hidden px-8 py-3 rounded-2xl bg-emerald-500 text-white text-xs font-black uppercase tracking-widest shadow-lg shadow-emerald-500/20 hover:bg-emerald-400 transition-all">Next Word ➡️</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let allGames = [];
        let gameMode = 'gameName';
        let thumbSize = 'medium';
        let currentWord = '';
        let currentGame = null;
        let currentProgress = [];
        let letterToGameMap = {};
        let usedGameIds = new Set();
        let username = 'sportomax';

        const LETTER_SHAPES = {
            'A': [[0,2],[1,1],[2,0],[1,2],[0,4],[1,4],[2,4]],
            'B': [[0,0],[0,1],[0,2],[1,2],[2,2],[0,3],[0,4],[1,4],[2,4],[2,0],[2,1]],
            'C': [[2,0],[1,0],[0,0],[0,1],[0,2],[0,3],[0,4],[1,4],[2,4]],
            'D': [[0,0],[0,1],[0,2],[0,3],[0,4],[1,4],[2,3],[2,2],[2,1],[1,0],[2,0]],
            'E': [[2,0],[1,0],[0,0],[0,1],[0,2],[1,2],[2,2],[0,3],[0,4],[1,4],[2,4]],
            'F': [[0,0],[1,0],[2,0],[0,1],[0,2],[1,2],[2,2],[0,3],[0,4]],
            'G': [[2,0],[1,0],[0,0],[0,1],[0,2],[1,2],[2,2],[2,3],[0,3],[0,4],[1,4],[2,4]],
            'H': [[0,0],[0,1],[0,2],[1,2],[2,2],[2,1],[2,0],[2,3],[2,4],[0,3],[0,4]],
            'I': [[0,0],[1,0],[2,0],[1,1],[1,2],[1,3],[0,4],[1,4],[2,4]],
            'J': [[2,0],[1,0],[0,0],[0,1],[0,2],[0,3],[0,4],[1,4],[2,4]],
            'K': [[0,0],[0,1],[0,2],[1,2],[2,1],[0,3],[0,4],[1,3],[2,4]],
            'L': [[0,0],[0,1],[0,2],[0,3],[0,4],[1,4],[2,4]],
            'M': [[0,0],[1,1],[2,0],[0,1],[2,1],[0,2],[2,2],[0,3],[2,3],[0,4],[2,4]],
            'N': [[0,0],[0,1],[0,2],[0,3],[0,4],[1,2],[2,0],[2,1],[2,2],[2,3],[2,4]],
            'O': [[1,0],[0,1],[2,1],[0,2],[2,2],[0,3],[2,3],[1,4]],
            'P': [[0,0],[1,0],[2,0],[2,1],[0,2],[1,2],[0,3],[0,4]],
            'Q': [[1,0],[0,1],[2,1],[0,2],[2,2],[0,3],[2,3],[1,4],[2,4]],
            'R': [[0,0],[1,0],[2,0],[2,1],[0,2],[1,2],[2,2],[0,3],[1,3],[2,4],[0,4]],
            'S': [[2,0],[1,0],[0,0],[0,1],[1,1],[2,2],[1,3],[0,3],[2,4],[1,4],[0,4]],
            'T': [[0,0],[1,0],[2,0],[1,1],[1,2],[1,3],[1,4]],
            'U': [[0,0],[0,1],[0,2],[0,3],[2,0],[2,1],[2,2],[2,3],[1,4],[0,4],[2,4]],
            'V': [[0,0],[0,1],[1,2],[2,1],[2,0],[0,3],[1,4],[2,3]],
            'W': [[0,0],[0,1],[0,2],[0,3],[0,4],[1,2],[2,0],[2,1],[2,2],[2,3],[2,4]],
            'X': [[0,0],[2,0],[1,1],[1,2],[0,4],[2,4],[0,3],[2,3],[0,1],[2,1]],
            'Y': [[0,0],[2,0],[1,1],[1,2],[1,3],[1,4],[0,1],[2,1]],
            'Z': [[0,0],[1,0],[2,0],[2,1],[1,2],[0,3],[0,4],[1,4],[2,4]]
        };

        async function fetchWithRetry(url, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                const response = await fetch(url);
                if (response.status === 202) {
                    await new Promise(r => setTimeout(r, 3000));
                    continue;
                }
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response;
            }
            throw new Error('Timeout');
        }

        async function loadCollection() {
            username = document.getElementById('username').value.trim() || 'sportomax';
            document.getElementById('setupScreen').classList.add('hidden');
            
            try {
                const response = await fetchWithRetry(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1`);
                const xmlText = await response.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(xmlText, 'text/xml');
                
                allGames = Array.from(xml.querySelectorAll('item')).map(item => ({
                    id: item.getAttribute('objectid'),
                    name: item.querySelector('name')?.textContent || 'Unknown',
                    thumbnail: item.querySelector('thumbnail')?.textContent || ''
                })).filter(g => g.thumbnail);

                if (allGames.length < 10) throw new Error('Need at least 10 games with thumbnails');

                assignLettersToGames();
                document.getElementById('app').classList.remove('hidden');
                document.getElementById('headerInfo').textContent = `${allGames.length} games from ${username}`;
                startNewWord();
            } catch (error) {
                alert(error.message);
                document.getElementById('setupScreen').classList.remove('hidden');
            }
        }

        function assignLettersToGames() {
            letterToGameMap = {};
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
            const shuffled = [...allGames].sort(() => Math.random() - 0.5);
            alphabet.forEach(l => letterToGameMap[l] = []);
            shuffled.forEach((g, i) => letterToGameMap[alphabet[i % alphabet.length]].push(g));
        }

        function setGameMode(mode, btn) {
            gameMode = mode;
            document.querySelectorAll('[onclick^="setGameMode"]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            startNewWord();
        }

        function setThumbSize(size, btn) {
            thumbSize = size;
            document.querySelectorAll('[onclick^="setThumbSize"]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderLetterShapes();
        }

        function startNewWord() {
            usedGameIds.clear();
            currentProgress = [];
            document.getElementById('nextBtn').classList.add('hidden');

            if (gameMode === 'username') {
                currentWord = username.toUpperCase().replace(/[^A-Z]/g, '');
                document.getElementById('targetWord').textContent = username;
            } else {
                const randomGame = allGames[Math.floor(Math.random() * allGames.length)];
                if (gameMode === 'gameNameSingle') currentGame = randomGame;
                currentWord = randomGame.name.toUpperCase().replace(/[^A-Z]/g, '');
                document.getElementById('targetWord').textContent = randomGame.name;
            }

            renderLetterShapes();
            updateProgress();
        }

        function renderLetterShapes() {
            const container = document.getElementById('letterGrid');
            container.innerHTML = '';
            const sizePx = thumbSize === 'small' ? 24 : thumbSize === 'large' ? 48 : 36;

            for (const char of currentWord) {
                const shape = LETTER_SHAPES[char] || [];
                const letterDiv = document.createElement('div');
                letterDiv.className = 'letter-shape';
                letterDiv.innerHTML = `<span class="shape-label">${char}</span>`;
                
                const maxRow = Math.max(...shape.map(s => s[1])) + 1;
                const maxCol = Math.max(...shape.map(s => s[0])) + 1;
                letterDiv.style.gridTemplateColumns = `repeat(${maxCol}, ${sizePx}px)`;

                let games = gameMode === 'gameNameSingle' ? [currentGame] : (letterToGameMap[char] || []);
                let gIdx = 0;

                // Simplified grid creation
                for (let r = 0; r < maxRow; r++) {
                    for (let c = 0; c < maxCol; c++) {
                        const isPart = shape.some(s => s[0] === c && s[1] === r);
                        if (isPart) {
                            const game = games[gIdx % games.length];
                            gIdx++;
                            const img = document.createElement('img');
                            img.src = game.thumbnail;
                            img.className = 'thumb-mini';
                            img.style.width = `${sizePx}px`;
                            img.style.height = `${sizePx}px`;
                            img.onclick = (e) => handleThumbClick(game, e);
                            letterDiv.appendChild(img);
                        } else {
                            const spacer = document.createElement('div');
                            letterDiv.appendChild(spacer);
                        }
                    }
                }
                container.appendChild(letterDiv);
            }
        }

        function handleThumbClick(game, e) {
            if (e.target.classList.contains('used')) return;
            const nextIdx = currentProgress.length;
            if (nextIdx >= currentWord.length) return;

            const targetChar = currentWord[nextIdx];
            const gameLetters = [];
            for (const [l, gs] of Object.entries(letterToGameMap)) {
                if (gs.some(g => g.id === game.id)) gameLetters.push(l);
            }

            if (gameMode !== 'gameNameSingle' && !gameLetters.includes(targetChar)) return;

            e.target.classList.add('used');
            currentProgress.push(targetChar);
            updateProgress();

            if (currentProgress.length === currentWord.length) {
                document.getElementById('nextBtn').classList.remove('hidden');
                document.getElementById('targetWord').classList.add('word-complete');
            }
        }

        function updateProgress() {
            document.getElementById('currentSpelling').textContent = currentProgress.join('') || '_';
        }

        function resetCurrentWord() {
            currentProgress = [];
            document.querySelectorAll('.thumb-mini').forEach(t => t.classList.remove('used'));
            document.getElementById('targetWord').classList.remove('word-complete');
            updateProgress();
        }

        function nextWord() {
            startNewWord();
        }

        function showSettings() {
            document.getElementById('app').classList.add('hidden');
            document.getElementById('setupScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
