<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Spot It | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🔍</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
            height: 100dvh;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-dark {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .spot-card {
            aspect-ratio: 1;
            background: white;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            border: 8px solid #6366f1;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .spot-card.card1 { border-color: #ec4899; }
        .spot-card.card2 { border-color: #06b6d4; }

        .symbol {
            position: absolute;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid #f1f5f9;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            background: white;
        }

        .symbol:active { transform: scale(0.9); }

        .symbol.matched {
            border-color: #10b981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
            z-index: 50;
            animation: match-pulse 0.5s infinite;
        }

        @keyframes match-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .player-chip {
            @apply flex flex-col items-center glass px-4 py-2 rounded-2xl border border-white/5 transition-all;
        }
        .player-chip.active { @apply border-indigo-500 bg-indigo-500/10 scale-105; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .symbol.wrong { animation: shake 0.3s; border-color: #ef4444; }

        .view { display: none; height: 100%; flex-direction: column; }
        .view.active { display: flex; }
    </style>
</head>
<body class="selection:bg-indigo-500/30">
    <!-- Background Decor -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-indigo-900/20 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[10%] right-[0%] w-[50%] h-[50%] bg-pink-900/10 blur-[120px] rounded-full"></div>
    </div>

    <!-- Setup Screen -->
    <div id="setupScreen" class="view active relative z-10 items-center justify-center p-4">
        <div class="glass max-w-sm w-full rounded-[2.5rem] p-8 shadow-2xl border-t border-white/20">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-indigo-500/20 rounded-3xl flex items-center justify-center mx-auto mb-4 border border-indigo-500/30">
                    <span class="text-4xl">🔍</span>
                </div>
                <h1 class="text-3xl font-black tracking-tight text-white mb-2 italic uppercase">Spot <span class="text-indigo-400">It</span></h1>
                <p class="text-slate-400 text-sm font-medium">BGG Collection Edition</p>
            </div>

            <div class="space-y-5">
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">BGG Username</label>
                    <input type="text" id="usernameInput" value="sportomax" class="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all font-medium">
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Difficulty</label>
                    <select id="symbolsPerCard" class="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all font-medium text-sm">
                        <option value="6">6 Symbols (Easy)</option>
                        <option value="7" selected>7 Symbols (Medium)</option>
                        <option value="8">8 Symbols (Hard)</option>
                    </select>
                </div>

                <button onclick="loadGames()" class="w-full bg-indigo-500 text-white py-4 rounded-2xl font-black text-lg uppercase tracking-tight hover:scale-[1.02] active:scale-95 transition-all shadow-xl shadow-indigo-500/20 mt-4">
                    Find the Match
                </button>
            </div>
            <div id="status" class="mt-6 text-center text-xs font-bold text-slate-500 uppercase tracking-widest">Ready to scan...</div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="view relative z-10 pb-safe">
        <header class="p-6 flex items-center justify-between border-b border-white/5">
            <div class="flex flex-col">
                <h1 class="text-xl font-black italic uppercase tracking-tighter text-white leading-none">Spot <span class="text-indigo-400">It</span></h1>
                <div class="flex gap-3 mt-1">
                    <span id="timer" class="text-[10px] font-bold text-amber-400 uppercase tracking-widest">--</span>
                    <span id="score" class="text-[10px] font-bold text-emerald-400 uppercase tracking-widest">Score: 0</span>
                </div>
            </div>
            <button onclick="location.reload()" class="glass px-4 py-2 rounded-xl border border-white/10 text-[10px] font-black uppercase tracking-widest text-slate-400 hover:text-white transition-all">Reset</button>
        </header>

        <main class="flex-1 flex flex-col items-center justify-center p-4 gap-8">
            <!-- Cards Container -->
            <div id="cardsContainer" class="flex flex-col md:flex-row items-center justify-center gap-8 md:gap-12 w-full max-w-4xl">
                <div class="spot-card card1 w-[280px] md:w-[320px]" id="card1"></div>
                <div class="spot-card card2 w-[280px] md:w-[320px]" id="card2"></div>
            </div>

            <!-- Player Scores -->
            <div id="playersPanel" class="flex flex-wrap justify-center gap-3 w-full">
                <div class="player-chip" id="player1">
                    <span class="text-[8px] font-black uppercase tracking-widest text-slate-500">P1</span>
                    <span class="text-lg font-black text-white" id="p1score">0</span>
                    <button onclick="awardPoints(0, 1)" class="mt-1 bg-white/5 px-3 py-0.5 rounded-lg text-[10px] font-bold">+</button>
                </div>
                <div class="player-chip" id="player2">
                    <span class="text-[8px] font-black uppercase tracking-widest text-slate-500">P2</span>
                    <span class="text-lg font-black text-white" id="p2score">0</span>
                    <button onclick="awardPoints(1, 1)" class="mt-1 bg-white/5 px-3 py-0.5 rounded-lg text-[10px] font-bold">+</button>
                </div>
                <div class="player-chip" id="player3">
                    <span class="text-[8px] font-black uppercase tracking-widest text-slate-500">P3</span>
                    <span class="text-lg font-black text-white" id="p3score">0</span>
                    <button onclick="awardPoints(2, 1)" class="mt-1 bg-white/5 px-3 py-0.5 rounded-lg text-[10px] font-bold">+</button>
                </div>
                <div class="player-chip" id="player4">
                    <span class="text-[8px] font-black uppercase tracking-widest text-slate-500">P4</span>
                    <span class="text-lg font-black text-white" id="p4score">0</span>
                    <button onclick="awardPoints(3, 1)" class="mt-1 bg-white/5 px-3 py-0.5 rounded-lg text-[10px] font-bold">+</button>
                </div>
            </div>
        </main>

        <div id="gameOverBanner" class="hidden fixed inset-0 z-[100] bg-black/90 flex flex-col items-center justify-center p-8 backdrop-blur-xl">
            <span class="text-6xl mb-6">🏆</span>
            <h2 class="text-4xl font-black italic uppercase tracking-tighter text-white mb-2">Game <span class="text-indigo-400">Over</span></h2>
            <p id="finalStats" class="text-slate-400 font-bold uppercase tracking-widest mb-8 text-center"></p>
            <button onclick="location.reload()" class="bg-indigo-500 text-white px-12 py-4 rounded-2xl font-black uppercase tracking-widest shadow-xl shadow-indigo-500/20">Play Again</button>
        </div>
    </div>

    <script>
        let allGames = [];
        let symbolsPerCard = 7;
        let score = 0;
        let timeLeft = 60;
        let timerInterval = null;
        let currentMatch = null;
        const IMAGE_PROXY = 'https://images.weserv.nl/?url=';

        async function loadGames() {
            const user = document.getElementById('usernameInput').value.trim() || 'sportomax';
            symbolsPerCard = parseInt(document.getElementById('symbolsPerCard').value);
            const status = document.getElementById('status');
            status.textContent = 'Scanning Collection...';

            try {
                const res = await fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(user)}&own=1&stats=1`);
                if (res.status === 202) { await new Promise(r => setTimeout(r, 2000)); return loadGames(); }
                const xml = await res.text();
                const doc = new DOMParser().parseFromString(xml, 'text/xml');
                
                allGames = Array.from(doc.querySelectorAll('item')).map(item => ({
                    id: item.getAttribute('objectid'),
                    name: item.querySelector('name')?.textContent || 'Unknown',
                    thumb: item.querySelector('thumbnail')?.textContent || ''
                })).filter(g => g.thumb);

                if (allGames.length < symbolsPerCard * 2) throw new Error('Not enough games');

                document.getElementById('setupScreen').classList.remove('active');
                document.getElementById('gameScreen').classList.add('active');
                initGame();
            } catch (e) { status.textContent = 'Error: ' + e.message; }
        }

        function initGame() {
            score = 0; timeLeft = 60;
            updateScore();
            startTimer();
            generateRound();
        }

        function generateRound() {
            const container1 = document.getElementById('card1');
            const container2 = document.getElementById('card2');
            container1.innerHTML = ''; container2.innerHTML = '';

            const shuffled = [...allGames].sort(() => Math.random() - 0.5);
            const match = shuffled[0];
            currentMatch = match.id;

            const c1 = [match, ...shuffled.slice(1, symbolsPerCard)].sort(() => Math.random() - 0.5);
            const c2 = [match, ...shuffled.slice(symbolsPerCard, symbolsPerCard * 2 - 1)].sort(() => Math.random() - 0.5);

            placeSymbols(container1, c1);
            placeSymbols(container2, c2);
        }

        function placeSymbols(card, games) {
            const size = card.offsetWidth;
            const center = size / 2;
            const radius = (size / 2) - 45;

            games.forEach((g, i) => {
                const angle = (i * 2 * Math.PI) / games.length;
                const x = center + radius * Math.cos(angle);
                const y = center + radius * Math.sin(angle);
                const sSize = [45, 50, 55, 60][i % 4];

                const sym = document.createElement('div');
                sym.className = 'symbol';
                sym.style.left = `${x - sSize/2}px`;
                sym.style.top = `${y - sSize/2}px`;
                sym.style.width = `${sSize}px`;
                sym.style.height = `${sSize}px`;
                sym.innerHTML = `<img src="${IMAGE_PROXY}${encodeURIComponent(g.thumb)}" class="w-full h-full object-cover">`;
                sym.onclick = () => handlePick(g.id, sym);
                card.appendChild(sym);
            });
        }

        function handlePick(id, el) {
            if (id === currentMatch) {
                score += 100;
                document.querySelectorAll(`.symbol img[src*="${encodeURIComponent(allGames.find(x=>x.id===id).thumb)}"]`).forEach(i => i.parentElement.classList.add('matched'));
                updateScore();
                setTimeout(generateRound, 800);
            } else {
                el.classList.add('wrong');
                setTimeout(() => el.classList.remove('wrong'), 300);
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = `${timeLeft}s`;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function endGame() {
            clearInterval(timerInterval);
            document.getElementById('finalStats').textContent = `Score: ${score}`;
            document.getElementById('gameOverBanner').classList.remove('hidden');
        }

        function updateScore() { document.getElementById('score').textContent = `Score: ${score}`; }

        const pScores = [0,0,0,0];
        function awardPoints(idx, pts) {
            pScores[idx] += pts;
            document.getElementById(`p${idx+1}score`).textContent = pScores[idx];
        }
    </script>
    <script type="module" src="../analytics-init.js"></script>
</body>
</html>
