<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convention Library Stats (DT2)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --font-sans: 'Titillium Web', sans-serif; }
        body { font-family: var(--font-sans); }
        .pc-cell { font-weight: 400; text-align: center; border: 1px solid #e2e8f0; font-size: 10px; padding: 4px 1px; min-width: 30px; }
        .game-thumb { width: 32px; height: 32px; object-fit: cover; border-radius: 4px; }
        .table-wrap { overflow: auto; height: calc(100vh - 160px); }
        table { border-collapse: separate; border-spacing: 0; width: 100%; table-layout: fixed; }
        thead th { position: sticky; top: 0; z-index: 30; background: #f8fafc; border-bottom: 2px solid #e2e8f0; transition: background 0.2s; font-weight: 400; }
        thead th:hover { background: #f1f5f9; }
        .sticky-idx { position: sticky; left: 0; z-index: 40; background: #f8fafc; width: 30px; }
        .sticky-name { position: sticky; left: 30px; z-index: 35; background: white; border-right: 2px solid #e2e8f0; width: 160px; }
        th.sticky-name { background: #f8fafc; }
        .game-title { font-size: 11px; font-weight: 400; color: #0f172a; letter-spacing: -0.02em; line-height: 1.1; }
        .score-cell { transition: opacity 0.2s; }
        .score-cell:hover { opacity: 0.8; }
        .stat-col { width: 38px; text-align: center; font-size: 10px; font-weight: 400; border-right: 1px solid #f1f5f9; }
        .loc-col { width: 65px; text-align: center; font-size: 9px; font-weight: 400; color: #94a3b8; }
        .small-col { width: 32px; text-align: center; font-size: 9px; font-weight: 400; color: #64748b; }
        
        /* Gradient Helpers */
        .g-100 { background-color: #10b981; color: white; } 
        .g-80  { background-color: #34d399; color: #064e3b; } 
        .g-60  { background-color: #a7f3d0; color: #064e3b; } 
        .g-40  { background-color: #fecaca; color: #7f1d1d; } 
        .g-20  { background-color: #f87171; color: white; } 
        .g-0   { background-color: #ef4444; color: white; } 
        
        .heart-container { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; }
        .heart-icon { font-size: 24px; line-height: 1; }
        .heart-text { position: absolute; font-size: 9px; font-weight: 900; color: white; margin-top: -1px; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .bg-clip-text { -webkit-background-clip: text; background-clip: text; }

        .filter-bar { background: white; border-bottom: 1px solid #e2e8f0; padding: 4px 12px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .desire-btn { border: 1px solid #e2e8f0; border-radius: 6px; padding: 2px 6px; font-size: 10px; font-weight: 400; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
        .desire-btn:hover { background: #f8fafc; border-color: #cbd5e1; }
        .desire-btn.active { background: #4f46e5; color: white !important; border-color: #4f46e5; }
        .desire-btn.active .text-slate-400 { color: white !important; opacity: 0.8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 overflow-hidden">

<header class="bg-white border-b border-slate-200 px-3 py-2 sticky top-0 z-50 shadow-sm h-[56px] flex items-center">
    <div class="w-full max-w-7xl mx-auto flex items-center gap-3">
        <div class="flex items-center gap-2 shrink-0">
            <div class="bg-indigo-600 text-white p-1 rounded-md">
                <i class="fa-solid fa-table-list text-xs"></i>
            </div>
            <div class="flex flex-col">
                <h1 class="text-sm font-normal tracking-tighter uppercase leading-none">DT2 Stats</h1>
                <a href="https://library.cardboardevents.com/dicetowerwest" target="_blank" class="text-[8px] text-slate-400 hover:text-indigo-600 transition-colors uppercase font-normal">Source Data <i class="fa-solid fa-external-link text-[6px]"></i></a>
            </div>
        </div>
        
        <div class="flex-1 flex gap-1 items-center max-w-sm">
            <select id="csv-source" class="bg-slate-100 border-none rounded-md px-1.5 py-1.5 text-[10px] font-normal focus:ring-2 focus:ring-indigo-500 outline-none appearance-none cursor-pointer">
                <option value="dte.csv">DTE</option>
                <option value="dtw.csv">DTW</option>
            </select>
            <input type="text" id="username" placeholder="BGG User" class="w-full bg-slate-100 border-none rounded-md px-2 py-1.5 text-xs font-normal focus:ring-2 focus:ring-indigo-500 outline-none">
            <button onclick="loadData()" class="bg-indigo-600 text-white font-normal py-1.5 px-3 rounded-md text-xs hover:bg-indigo-700 transition-colors uppercase">GO</button>
        </div>

        <div class="flex items-center gap-3 ml-auto">
            <button onclick="copyAsText()" title="Copy as Text" class="text-slate-400 hover:text-indigo-600 text-xs transition-colors action-btn"><i class="fa-solid fa-copy"></i></button>
            <button onclick="downloadCSV()" title="Download CSV" class="text-slate-400 hover:text-indigo-600 text-xs transition-colors action-btn"><i class="fa-solid fa-file-csv"></i></button>
            
            <div class="flex flex-col items-end gap-0.5 min-w-[120px]">
                <div id="status" class="text-[9px] font-normal text-slate-400 uppercase truncate text-right">Ready</div>
                <div id="prog-wrap" class="w-24 h-1 bg-slate-100 rounded-full overflow-hidden hidden">
                    <div id="prog-bar" class="h-full bg-indigo-600 transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>
</header>

<div id="filter-section" class="hidden flex flex-col sticky top-[56px] z-40 bg-white border-b border-slate-200 shadow-sm">
    <!-- Row 1: Desire -->
    <div class="filter-bar border-none pb-0">
        <div class="flex items-center gap-2">
            <span class="text-[9px] font-normal text-slate-400 uppercase">Min Desire:</span>
            <select id="min-desire-select" onchange="setMinDesire(this.value)" class="bg-slate-100 border-none rounded px-2 py-1 text-[10px] outline-none focus:ring-1 focus:ring-indigo-500">
                <option value="0">All</option>
            </select>
        </div>
        <div id="desire-counts" class="flex items-center gap-1.5 border-l border-slate-200 pl-4"></div>
    </div>
    <!-- Row 2: Player Counts -->
    <div class="filter-bar border-none py-1 gap-x-4">
        <div class="flex items-center gap-1.5">
            <span class="text-[9px] font-normal text-slate-400 uppercase">Best With:</span>
            <div id="best-counts" class="flex gap-1"></div>
        </div>
        <div class="flex items-center gap-1.5 border-l border-slate-200 pl-4">
            <span class="text-[9px] font-normal text-slate-400 uppercase">Rec With:</span>
            <div id="rec-counts" class="flex gap-1"></div>
        </div>
    </div>
    <!-- Row 3: Time & Weight -->
    <div class="filter-bar pt-0 pb-2 gap-x-4">
        <div class="flex items-center gap-1.5">
            <span class="text-[9px] font-normal text-slate-400 uppercase">Time:</span>
            <div id="time-counts" class="flex gap-1 flex-wrap"></div>
        </div>
        <div class="flex items-center gap-1.5 border-l border-slate-200 pl-4">
            <span class="text-[9px] font-normal text-slate-400 uppercase">Weight:</span>
            <div id="weight-counts" class="flex gap-1 flex-wrap"></div>
        </div>
    </div>
</div>

<main>
    <div id="loading" class="hidden flex flex-col items-center justify-center p-20 gap-4">
        <i class="fa-solid fa-circle-notch fa-spin text-indigo-600 text-3xl"></i>
        <div id="loading-text" class="text-slate-500 font-normal text-sm">Fetching...</div>
    </div>

    <div id="table-container" class="hidden">
        <div class="table-wrap border-t border-slate-200">
            <table id="stats-table" style="width: 1050px;">
                <thead>
                    <tr>
                        <th class="sticky-idx p-2 text-[9px] font-normal text-slate-400">#</th>
                        <th class="sticky-name p-2 text-left text-[9px] font-normal text-slate-500 cursor-pointer" onclick="toggleSort('name')">GAME</th>
                        <th class="p-2 text-center text-[9px] font-normal text-slate-500 w-8 cursor-pointer" onclick="toggleSort('desire')">DES</th>
                        <th class="loc-col p-2 text-[9px] font-normal text-slate-500 cursor-pointer" onclick="toggleSort('locations')">LOC</th>
                        <th class="stat-col p-2 text-[9px] font-normal text-slate-400 w-14 cursor-pointer" onclick="toggleSort('rank')">RANK</th>
                        <th class="stat-col p-2 text-[9px] font-normal text-slate-400 w-10 cursor-pointer" onclick="toggleSort('year')">YEAR</th>
                        <th class="stat-col p-2 text-[9px] font-normal text-slate-400 cursor-pointer" onclick="toggleSort('time')">TIME</th>
                        <th class="stat-col p-2 text-[9px] font-normal text-slate-400 cursor-pointer" onclick="toggleSort('average')">AVG</th>
                        <th class="stat-col p-2 text-[9px] font-normal text-slate-400 cursor-pointer" onclick="toggleSort('weight')">WGT</th>
                        <th class="small-col p-2 text-[9px] font-normal text-slate-400 cursor-pointer" onclick="toggleSort('bestWith')">BEST</th>
                        <th class="small-col p-2 text-[9px] font-normal text-slate-400 cursor-pointer" onclick="toggleSort('recWith')">REC</th>
                        <th class="p-2 text-center text-[9px] font-normal text-slate-500 w-7 cursor-pointer" onclick="toggleSort('p1')">1</th>
                        <th class="p-2 text-center text-[9px] font-normal text-slate-500 w-7 cursor-pointer" onclick="toggleSort('p2')">2</th>
                        <th class="p-2 text-center text-[9px] font-normal text-slate-500 w-7 cursor-pointer" onclick="toggleSort('p3')">3</th>
                        <th class="p-2 text-center text-[9px] font-normal text-slate-500 w-7 cursor-pointer" onclick="toggleSort('p4')">4</th>
                        <th class="p-2 text-center text-[9px] font-normal text-slate-500 w-7 cursor-pointer" onclick="toggleSort('p5')">5</th>
                        <th class="p-2 text-center text-[9px] font-normal text-slate-500 w-7 cursor-pointer" onclick="toggleSort('p6')">6</th>
                        <th class="p-2 text-center text-[9px] font-normal text-slate-500 w-7 cursor-pointer" onclick="toggleSort('p7')">7</th>
                        <th class="p-2 text-center text-[9px] font-normal text-slate-500 w-8 cursor-pointer" onclick="toggleSort('p8')">8+</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Rows injected here -->
                </tbody>
            </table>
        </div>
    </div>
</main>

<script>
    const API_BASE = '/api/bgg-helper';
    const BATCH_SIZE = 20;
    const PARALLEL_LIMIT = 100;

    let allGames = [];
    let sortCol = 'desire';
    let sortAsc = false;
    let activeCalls = 0;
    let totalCalls = 0;
    let gamesLoaded = 0;
    let filterMinDesire = 0;
    let filterExactDesire = null;
    let filterBest = null;
    let filterRec = null;
    let filterTime = null;
    let filterWeight = null;

    const TIME_BUCKETS = [
        { label: '0-10', min: 0, max: 10 },
        { label: '11-20', min: 11, max: 20 },
        { label: '21-30', min: 21, max: 30 },
        { label: '31-40', min: 31, max: 40 },
        { label: '41-50', min: 41, max: 50 },
        { label: '51-60', min: 51, max: 60 },
        { label: '61-90', min: 61, max: 90 },
        { label: '91-120', min: 91, max: 120 },
        { label: '121+', min: 121, max: 9999 }
    ];

    const WEIGHT_BUCKETS = [
        { label: '0-1', min: 0, max: 1 },
        { label: '1-2', min: 1.001, max: 2 },
        { label: '2-3', min: 2.001, max: 3 },
        { label: '3-4', min: 3.001, max: 4 },
        { label: '4-5', min: 4.001, max: 5 }
    ];

    function updateStatus(msg) {
        const status = document.getElementById('status');
        const activeStr = activeCalls > 0 ? ` [${activeCalls} Active / ${totalCalls} Total]` : ` [${totalCalls} Total]`;
        status.textContent = (msg || '') + activeStr;
    }

    async function loadData() {
        const usernameInput = document.getElementById('username');
        const username = usernameInput.value.trim();
        const csvSource = document.getElementById('csv-source').value;
        if (!username) return alert('Enter BGG username');
        localStorage.setItem('bgg_username', username);
        localStorage.setItem('dt_csv_source', csvSource);

        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('table-container').classList.add('hidden');
        document.getElementById('filter-section').classList.add('hidden');
        const loadingText = document.getElementById('loading-text');
        const progWrap = document.getElementById('prog-wrap');
        const progBar = document.getElementById('prog-bar');

        try {
            totalCalls = 0;
            updateStatus('CSV...');
            const csvRes = await fetch(csvSource);
            const csvText = await csvRes.text();
            const csvRows = parseCSV(csvText);

            updateStatus('BGG...');
            loadingText.textContent = 'Loading BGG Collection...';
            const collXml = await fetchWithRetry(`${API_BASE}?endpoint=collection&username=${encodeURIComponent(username)}&stats=1&excludesubtype=boardgameexpansion`);
            const collDoc = new DOMParser().parseFromString(collXml, 'text/xml');
            
            const bggGames = Array.from(collDoc.querySelectorAll('item')).map(parseCollectionItem);
            const normMap = new Map();
            bggGames.forEach(g => {
                const nb = normalize(g.name);
                if (!normMap.has(nb)) normMap.set(nb, g);
            });

            let matchedGames = [];
            let seenIds = new Set();
            csvRows.forEach(row => {
                const nb = normalize(row.name);
                let game = normMap.get(nb);
                if (!game) {
                    for (const [n, g] of normMap) {
                        if (nb.includes(n) || n.includes(nb)) { game = g; break; }
                    }
                }
                if (game) {
                    if (seenIds.has(game.id)) {
                        const existing = matchedGames.find(m => m.id === game.id);
                        if (existing && !existing.locations.includes(row.shelf)) existing.locations.push(row.shelf);
                    } else {
                        matchedGames.push({ ...game, locations: [row.shelf] });
                        seenIds.add(game.id);
                    }
                }
            });

            allGames = matchedGames;
            applySort();
            gamesLoaded = 0;

            progWrap.classList.remove('hidden');
            document.querySelectorAll('.action-btn').forEach(btn => btn.classList.remove('hidden'));
            
            const ids = allGames.map(g => g.id);
            const batches = [];
            for (let i = 0; i < ids.length; i += BATCH_SIZE) {
                batches.push(ids.slice(i, i + BATCH_SIZE));
            }

            let index = 0;
            async function worker() {
                while (index < batches.length) {
                    const i = index++;
                    const batch = batches[i];
                    try {
                        const thingXml = await fetchWithRetry(`${API_BASE}?endpoint=thing&id=${batch.join(',')}&stats=1`);
                        const thingDoc = new DOMParser().parseFromString(thingXml, 'text/xml');
                        
                        Array.from(thingDoc.querySelectorAll('item')).forEach(item => {
                            const id = item.getAttribute('id');
                            const game = allGames.find(g => g.id === id);
                            if (game) {
                                const poll = parsePlayerPoll(item);
                                game.playerPoll = poll;
                                game.thumb = item.querySelector('thumbnail')?.textContent || '';
                                const stats = item.querySelector('statistics ratings');
                                const rN = stats?.querySelector('rank[type="subtype"]');
                                const rV = rN?rN.getAttribute('value'):null;
                                game.rank = (rV&&rV!=='Not Ranked')?parseInt(rV):null;
                                game.weight = parseFloat(stats?.querySelector('averageweight')?.getAttribute('value') || '0');
                                game.min = parseInt(item.querySelector('minplayers')?.getAttribute('value') || '0');
                                game.max = parseInt(item.querySelector('maxplayers')?.getAttribute('value') || '0');
                                game.time = parseInt(item.querySelector('playingtime')?.getAttribute('value') || '0');
                                game.year = parseInt(item.querySelector('yearpublished')?.getAttribute('value') || '0');
                                
                                // Calculate Best and Recommended
                                let bestCount = -1, bestP = [];
                                let recs = [];
                                Object.entries(poll).forEach(([num, data]) => {
                                    if (data.bestVotes > bestCount) { bestCount = data.bestVotes; bestP = [num]; }
                                    else if (data.bestVotes === bestCount && bestCount >= 0) { bestP.push(num); }
                                    if ((data.bestVotes + data.recVotes) > data.notVotes) { recs.push(num); }
                                });
                                game.bestWith = bestP.join(',');
                                game.recWith = recs.join(',');
                            }
                        });
                        
                        gamesLoaded += batch.length;
                        const pct = Math.min(100, Math.round((gamesLoaded / ids.length) * 100));
                        updateStatus(`${pct}%`);
                        progBar.style.width = `${pct}%`;
                        
                        renderTable();
                        document.getElementById('loading').classList.add('hidden');
                        document.getElementById('table-container').classList.remove('hidden');
                        document.getElementById('filter-section').classList.remove('hidden');
                        document.getElementById('filter-section').classList.add('flex');
                    } catch (e) {
                        console.error('Batch failed', batch, e);
                    }
                }
            }

            const workers = Array(Math.min(batches.length, PARALLEL_LIMIT)).fill(0).map(worker);
            await Promise.all(workers);

            updateStatus(`DONE (${allGames.length})`);
            progWrap.classList.add('hidden');

        } catch (err) {
            updateStatus('ERROR');
            alert(err.message);
        }
    }

    function setMinDesire(val) {
        filterMinDesire = parseInt(val);
        filterExactDesire = null;
        renderTable();
    }

    function setExactDesire(val) {
        if (filterExactDesire === val) filterExactDesire = null;
        else {
            filterExactDesire = val;
            filterMinDesire = 0;
            document.getElementById('min-desire-select').value = "0";
        }
        renderTable();
    }

    function toggleBest(num) {
        filterBest = (filterBest === num) ? null : num;
        renderTable();
    }

    function toggleRec(num) {
        filterRec = (filterRec === num) ? null : num;
        renderTable();
    }

    function toggleTime(label) {
        filterTime = (filterTime === label) ? null : label;
        renderTable();
    }

    function toggleWeight(label) {
        filterWeight = (filterWeight === label) ? null : label;
        renderTable();
    }

    function updateFilterCounts() {
        const counts = Array(11).fill(0);
        const bestMap = {};
        const recMap = {};
        const timeMap = {};
        const weightMap = {};

        allGames.forEach(g => {
            if (g.desire >= 0 && g.desire <= 10) counts[g.desire]++;
            if (g.bestWith) {
                g.bestWith.split(',').forEach(n => {
                    const num = parseInt(n);
                    if (num >= 1 && num <= 8) bestMap[num] = (bestMap[num] || 0) + 1;
                });
            }
            if (g.recWith) {
                g.recWith.split(',').forEach(n => {
                    const num = parseInt(n);
                    if (num >= 1 && num <= 8) recMap[num] = (recMap[num] || 0) + 1;
                });
            }
            if (g.time > 0) {
                const b = TIME_BUCKETS.find(bucket => g.time >= bucket.min && g.time <= bucket.max);
                if (b) timeMap[b.label] = (timeMap[b.label] || 0) + 1;
            }
            if (g.weight > 0) {
                const b = WEIGHT_BUCKETS.find(bucket => g.weight >= bucket.min && g.weight <= bucket.max);
                if (b) weightMap[b.label] = (weightMap[b.label] || 0) + 1;
            }
        });
        
        // Update "Exact" buttons
        const container = document.getElementById('desire-counts');
        container.innerHTML = counts.map((count, d) => {
            if (count === 0 && d > 0) return '';
            const activeClass = filterExactDesire === d ? 'active' : '';
            return `<div onclick="setExactDesire(${d})" class="desire-btn ${activeClass}">
                <i class="fa-solid fa-heart text-[8px] ${d > 0 ? 'text-red-500' : 'text-slate-300'}"></i>
                <span>${d}</span>
                <span class="text-slate-400 font-normal">(${count})</span>
            </div>`;
        }).reverse().join('');

        // Update "Min Desire" dropdown
        const select = document.getElementById('min-desire-select');
        const currentVal = select.value;
        let cumulative = 0;
        const options = ['<option value="0">All</option>'];
        for (let d = 10; d >= 1; d--) {
            cumulative += counts[d];
            if (cumulative > 0) options.push(`<option value="${d}">${d}+ (${cumulative})</option>`);
        }
        select.innerHTML = options.reverse().join('');
        select.value = currentVal;

        // Update Best Counts
        const bestCont = document.getElementById('best-counts');
        bestCont.innerHTML = [1,2,3,4,5,6,7,8].map(n => {
            const count = bestMap[n] || 0;
            if (count === 0) return '';
            const active = filterBest === n.toString() ? 'active' : '';
            return `<div onclick="toggleBest('${n}')" class="desire-btn ${active}">${n} <span class="text-slate-400 font-normal">(${count})</span></div>`;
        }).join('');

        // Update Rec Counts
        const recCont = document.getElementById('rec-counts');
        recCont.innerHTML = [1,2,3,4,5,6,7,8].map(n => {
            const count = recMap[n] || 0;
            if (count === 0) return '';
            const active = filterRec === n.toString() ? 'active' : '';
            return `<div onclick="toggleRec('${n}')" class="desire-btn ${active}">${n} <span class="text-slate-400 font-normal">(${count})</span></div>`;
        }).join('');

        // Update Time Counts
        const timeCont = document.getElementById('time-counts');
        timeCont.innerHTML = TIME_BUCKETS.map(b => {
            const count = timeMap[b.label] || 0;
            if (count === 0) return '';
            const active = filterTime === b.label ? 'active' : '';
            return `<div onclick="toggleTime('${b.label}')" class="desire-btn ${active}">${b.label} <span class="text-slate-400 font-normal">(${count})</span></div>`;
        }).join('');

        // Update Weight Counts
        const weightCont = document.getElementById('weight-counts');
        weightCont.innerHTML = WEIGHT_BUCKETS.map(b => {
            const count = weightMap[b.label] || 0;
            if (count === 0) return '';
            const active = filterWeight === b.label ? 'active' : '';
            return `<div onclick="toggleWeight('${b.label}')" class="desire-btn ${active}">${b.label} <span class="text-slate-400 font-normal">(${count})</span></div>`;
        }).join('');
    }

    function parseCollectionItem(item) {
        const id = item.getAttribute('objectid');
        const name = item.querySelector('name')?.textContent || 'Unknown';
        const stats = item.querySelector('stats');
        const average = parseFloat(stats?.querySelector('rating average')?.getAttribute('value') || '0');
        const min = parseInt(stats?.getAttribute('minplayers') || '0');
        const max = parseInt(stats?.getAttribute('maxplayers') || '0');
        const time = parseInt(stats?.getAttribute('playingtime') || '0');
        const year = parseInt(item.querySelector('yearpublished')?.textContent || '0');

        let desire = 0;
        const statusNode = item.querySelector('status');
        if (statusNode) {
            if (statusNode.getAttribute('wanttoplay') === '1') desire += 5;
            const wishlist = statusNode.getAttribute('wishlist') === '1';
            const priority = parseInt(statusNode.getAttribute('wishlistpriority')) || 0;
            if (wishlist && priority > 0) desire += (6 - priority);
        }
        return { id, name, average, desire, locations: [], min, max, time, weight: 0, year, rank: null, bestWith: '', recWith: '' };
    }

    function parsePlayerPoll(item) {
        const poll = item.querySelector('poll[name="suggested_numplayers"]');
        if (!poll) return {};
        const results = {};
        Array.from(poll.querySelectorAll('results')).forEach(res => {
            const num = res.getAttribute('numplayers');
            const best = parseInt(res.querySelector('result[value="Best"]')?.getAttribute('numvotes') || '0');
            const rec = parseInt(res.querySelector('result[value="Recommended"]')?.getAttribute('numvotes') || '0');
            const not = parseInt(res.querySelector('result[value="Not Recommended"]')?.getAttribute('numvotes') || '0');
            const score = (best * 2) + (rec * 1) + (not * -1);
            const total = best + rec + not;
            results[num] = { score, total, bestVotes: best, recVotes: rec, notVotes: not };
        });
        return results;
    }

    function getColorForScore(score, total) {
        if (total === 0) return 'bg-slate-50 text-slate-300';
        const norm = score / total;
        if (norm > 1.2) return 'bg-emerald-600 text-white';
        if (norm > 0.6) return 'bg-emerald-200 text-emerald-900';
        if (norm > 0) return 'bg-green-100 text-green-800';
        if (norm > -0.4) return 'bg-red-100 text-red-800';
        return 'bg-red-600 text-white';
    }

    function getHeartGradient(d) {
        if (d >= 10) return 'from-emerald-500 to-emerald-700';
        if (d >= 8)  return 'from-green-400 to-green-600';
        if (d >= 6)  return 'from-lime-400 to-lime-600';
        if (d >= 4)  return 'from-yellow-400 to-yellow-600';
        if (d >= 2)  return 'from-orange-400 to-orange-600';
        if (d >= 1)  return 'from-red-400 to-red-600';
        return 'from-slate-300 to-slate-400';
    }

    function getRankColor(val, sortedList, reverse = false) {
        if (val === null || val === 0 || !sortedList.length) return '';
        const idx = sortedList.indexOf(val);
        let p = idx / (sortedList.length - 1);
        if (reverse) p = 1 - p;
        
        if (p >= 0.85) return 'g-100';
        if (p >= 0.7)  return 'g-80';
        if (p >= 0.5)  return 'g-60';
        if (p >= 0.3)  return 'g-40';
        if (p >= 0.15) return 'g-20';
        return 'g-0';
    }

    function toggleSort(col) {
        if (sortCol === col) sortAsc = !sortAsc;
        else { sortCol = col; sortAsc = false; }
        applySort();
        renderTable();
    }

    function applySort() {
        allGames.sort((a, b) => {
            let vA, vB;
            if (sortCol.startsWith('p')) {
                const n = sortCol.slice(1) === '8' ? '8+' : sortCol.slice(1);
                vA = a.playerPoll?.[n]?.score || -999;
                vB = b.playerPoll?.[n]?.score || -999;
            } else if (sortCol === 'locations') {
                vA = a.locations[0] || '';
                vB = b.locations[0] || '';
            } else if (sortCol === 'rank') {
                vA = a.rank || 999999;
                vB = b.rank || 999999;
            } else {
                vA = a[sortCol];
                vB = b[sortCol];
            }

            let res = 0;
            if (typeof vA === 'string') res = sortAsc ? vA.localeCompare(vB) : vB.localeCompare(vA);
            else res = sortAsc ? vA - vB : vB - vA;

            if (res === 0) return b.average - a.average;
            return res;
        });
    }

    function renderTable() {
        const body = document.getElementById('table-body');
        
        let filtered = allGames.filter(g => {
            if (filterExactDesire !== null && g.desire !== filterExactDesire) return false;
            if (filterMinDesire > 0 && g.desire < filterMinDesire) return false;
            if (filterBest && (!g.bestWith || !g.bestWith.split(',').includes(filterBest))) return false;
            if (filterRec && (!g.recWith || !g.recWith.split(',').includes(filterRec))) return false;
            
            if (filterTime) {
                const b = TIME_BUCKETS.find(bucket => bucket.label === filterTime);
                if (!b || g.time < b.min || g.time > b.max) return false;
            }
            if (filterWeight) {
                const b = WEIGHT_BUCKETS.find(bucket => bucket.label === filterWeight);
                if (!b || g.weight < b.min || g.weight > b.max) return false;
            }
            
            return true;
        });

        const ranks = filtered.map(g => g.rank).filter(r => r !== null).sort((a,b) => a - b);
        const years = filtered.map(g => g.year).filter(y => y > 1900).sort((a,b) => a - b);
        const times = filtered.map(g => g.time).filter(t => t > 0).sort((a,b) => a - b);
        const avgs  = filtered.map(g => g.average).filter(a => a > 0).sort((a,b) => a - b);
        const wgts  = filtered.map(g => g.weight).filter(w => w > 0).sort((a,b) => a - b);

        updateFilterCounts();

        body.innerHTML = filtered.map((g, idx) => {
            const p = g.playerPoll || {};
            const scores = [1,2,3,4,5,6,7,8].map(n => {
                const isOutOfRange = (n < g.min || (n > g.max && g.max > 0));
                let d = p[n.toString()];
                if (n === 8 && !d) d = p['8+'];
                if (!d) d = { score: 0, total: 0 };
                const cls = getColorForScore(d.score, d.total);
                const content = isOutOfRange ? '<span class="text-slate-200 font-normal">X</span>' : (d.total > 0 ? d.score : '-');
                return `<td class="pc-cell ${cls} score-cell">${content}</td>`;
            }).join('');

            const locDisplay = g.locations.length > 1 ? `${g.locations[0]}...` : g.locations[0];
            const locFull = g.locations.join('\n');
            const heartGrad = getHeartGradient(g.desire);

            return `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="sticky-idx text-center text-[9px] font-normal text-slate-300 border-b border-slate-100">${idx + 1}</td>
                    <td class="sticky-name p-1 flex items-center gap-1.5 border-b border-slate-100">
                        <img src="${g.thumb || 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1 1%22 fill=%22%23cbd5e1%22><rect width=%221%22 height=%221%22/></svg>'}" class="game-thumb shrink-0">
                        <div class="truncate leading-tight">
                            <a href="https://boardgamegeek.com/boardgame/${g.id}" target="_blank" class="game-title no-underline hover:text-indigo-600 transition-colors">${g.name}</a>
                        </div>
                    </td>
                    <td class="text-center border-b border-slate-100 bg-slate-50/30 p-0">
                        <div class="heart-container">
                            <i class="fa-solid fa-heart heart-icon text-transparent bg-clip-text bg-gradient-to-br ${heartGrad}"></i>
                            <span class="heart-text">${g.desire || '0'}</span>
                        </div>
                    </td>
                    <td class="loc-col border-b border-slate-100 truncate px-1 cursor-help" title="${locFull}" onclick="if('${g.locations.length}' > 1) alert('Full Locations:\\n${locFull}')">${locDisplay}</td>
                    <td class="stat-col border-b border-slate-100 ${getRankColor(g.rank, ranks, true)}">${g.rank || '-'}</td>
                    <td class="stat-col border-b border-slate-100 ${getRankColor(g.year, years, false)}">${g.year || '-'}</td>
                    <td class="stat-col border-b border-slate-100 ${getRankColor(g.time, times, true)}">${g.time || '-'}</td>
                    <td class="stat-col border-b border-slate-100 ${getRankColor(g.average, avgs, false)}">${g.average?.toFixed(1) || '-'}</td>
                    <td class="stat-col border-b border-slate-100 ${getRankColor(g.weight, wgts, true)}">${g.weight?.toFixed(1) || '-'}</td>
                    <td class="small-col border-b border-slate-100 text-[8px]">${g.bestWith || '-'}</td>
                    <td class="small-col border-b border-slate-100 text-[8px]">${g.recWith || '-'}</td>
                    ${scores}
                </tr>
            `;
        }).join('');
    }

    function copyAsText() {
        const headers = ["#", "Game", "Desire", "Location", "Rank", "Year", "Time", "Avg", "Wgt", "Best", "Rec", "1P", "2P", "3P", "4P", "5P", "6P", "7P", "8P+"];
        const rows = allGames.map((g, i) => {
            const p = g.playerPoll || {};
            const scores = [1,2,3,4,5,6,7,8].map(n => {
                const key = n === 8 ? '8+' : n.toString();
                return p[key]?.total > 0 ? p[key].score : '-';
            });
            return [i+1, g.name, g.desire, g.locations.join(', '), g.rank || '-', g.year, g.time, g.average.toFixed(1), g.weight.toFixed(1), g.bestWith, g.recWith, ...scores].join('\t');
        });
        const text = [headers.join('\t'), ...rows].join('\n');
        navigator.clipboard.writeText(text).then(() => alert("Copied to clipboard (Tab-separated)"));
    }

    function downloadCSV() {
        const headers = ["Rank", "Name", "Desire", "Location", "BGG Rank", "Year", "Time", "Average", "Weight", "Best With", "Recommended With", "1P", "2P", "3P", "4P", "5P", "6P", "7P", "8P+"];
        const rows = allGames.map((g, i) => {
            const p = g.playerPoll || {};
            const scores = [1,2,3,4,5,6,7,8].map(n => {
                const key = n === 8 ? '8+' : n.toString();
                return p[key]?.total > 0 ? p[key].score : '-';
            });
            return [i+1, `"${g.name.replace(/"/g, '""')}"`, g.desire, `"${g.locations.join(', ')}"`, g.rank || '-', g.year, g.time, g.average.toFixed(1), g.weight.toFixed(1), `"${g.bestWith}"`, `"${g.recWith}"`, ...scores].join(',');
        });
        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows].join('\n');
        const link = document.createElement("a");
        link.setAttribute("href", encodeURI(csvContent));
        link.setAttribute("download", "library_stats.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function normalize(s) { return s.toLowerCase().replace(/[^a-z0-9]/g, ''); }

    function parseCSV(text) {
        const lines = text.split(/\r?\n/).filter(l => l.trim());
        const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim().toLowerCase());
        const nameIdx = Math.max(0, headers.indexOf('game name'));
        const shelfIdx = Math.max(1, headers.indexOf('shelf location'));
        return lines.slice(1).map(l => {
            const p = l.split(',').map(s => s.replace(/"/g, '').trim());
            return { name: p[nameIdx], shelf: p[shelfIdx] };
        });
    }

    async function fetchWithRetry(url, retries = 5) {
        activeCalls++;
        totalCalls++;
        updateStatus();
        try {
            for (let i = 0; i < retries; i++) {
                try {
                    const res = await fetch(url);
                    if (res.status === 202) { await new Promise(r => setTimeout(r, 2000)); continue; }
                    if (res.ok) return await res.text();
                    await new Promise(r => setTimeout(r, 1000));
                } catch (e) { await new Promise(r => setTimeout(r, 1000)); }
            }
            throw new Error('Failed to fetch');
        } finally {
            activeCalls--;
            updateStatus();
        }
    }

    window.onload = () => {
        const savedUser = localStorage.getItem('bgg_username');
        if (savedUser) document.getElementById('username').value = savedUser;
        const savedCSV = localStorage.getItem('dt_csv_source');
        if (savedCSV) document.getElementById('csv-source').value = savedCSV;
    };
</script>
</body>
