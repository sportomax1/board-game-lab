<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Board Game Connections | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🎲</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }

        /* Glass surfaces */
        .glass {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.09);
        }
        .glass-dark {
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        /* Gradient buttons */
        .btn-blue  { background: linear-gradient(135deg,#3b82f6,#2563eb); box-shadow: 0 4px 15px rgba(37,99,235,.35); }
        .btn-green { background: linear-gradient(135deg,#10b981,#059669); box-shadow: 0 4px 15px rgba(16,185,129,.3); }
        .btn-amber { background: linear-gradient(135deg,#f59e0b,#d97706); box-shadow: 0 4px 10px rgba(245,158,11,.25); }
        .btn-rose  { background: linear-gradient(135deg,#f43f5e,#e11d48); box-shadow: 0 4px 10px rgba(244,63,94,.25); }

        /* Tab nav */
        .tab-btn { color: #64748b; transition: all .2s ease; }
        .tab-btn.active { background: rgba(59,130,246,.18); color: #60a5fa; }

        /* Type buttons */
        .type-btn { transition: all .2s ease; color: #64748b; border: 1px solid rgba(255,255,255,.1); }
        .type-btn.selected { background: linear-gradient(135deg,#3b82f6,#2563eb); color: #fff; box-shadow: 0 4px 12px rgba(37,99,235,.35); border-color: transparent; }

        /* View containers */
        .view { display: none; height: 100%; }
        .view.active { display: flex; flex-direction: column; }
        #view-setup.active { display: flex; }

        /* Game cards */
        .gcard {
            border: 1.5px solid rgba(255,255,255,.08);
            background: rgba(255,255,255,.03);
            transition: all .22s ease;
            cursor: pointer;
        }
        .gcard:hover { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); }
        .gcard.selected {
            border-color: #3b82f6;
            background: rgba(59,130,246,.12);
            box-shadow: 0 0 20px rgba(59,130,246,.2), 0 4px 12px rgba(37,99,235,.3);
            transform: scale(1.02);
        }
        .gcard.found { opacity: 0.4; cursor: default; pointer-events: none; }

        /* Stat pills */
        .spill {
            display: flex; align-items: center; gap: 4px;
            padding: 4px 10px; border-radius: 999px;
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.07);
        }
        .spill-val  { font-size: 11px; font-weight: 900; color: #f1f5f9; }
        .spill-lbl  { font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #475569; }

        /* Found groups */
        .fgroup {
            border-radius: 16px;
            border: 1px solid;
            padding: 12px 16px;
            animation: slideUp .3s ease-out both;
        }
        .fgroup.cat { background: rgba(245,158,11,.08); border-color: rgba(245,158,11,.3); }
        .fgroup.mec { background: rgba(59,130,246,.08); border-color: rgba(59,130,246,.3); }
        .fgroup.des { background: rgba(16,185,129,.08); border-color: rgba(16,185,129,.3); }

        /* Animations */
        @keyframes fadeUp   { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        @keyframes slideIn  { from{opacity:0;transform:translateX(-16px)} to{opacity:1;transform:translateX(0)} }
        @keyframes slideUp  { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
        @keyframes spin { to{transform:rotate(360deg)} }

        .anim-up  { animation: fadeUp .35s ease-out both; }
        .anim-in  { animation: slideIn .3s ease-out both; }
        .spin     { animation: spin 1s linear infinite; }

        /* Scrollbar */
        .scrollbar::-webkit-scrollbar { width: 3px; }
        .scrollbar::-webkit-scrollbar-track { background: transparent; }
        .scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 10px; }

        /* Message */
        .msg {
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            animation: slideUp .3s ease-out both;
        }
        .msg.ok { background: rgba(16,185,129,.12); border: 1px solid rgba(16,185,129,.3); color: #86efac; }
        .msg.err { background: rgba(244,63,94,.12); border: 1px solid rgba(244,63,94,.3); color: #ff9999; }

        /* Hint info */
        .hint-box {
            background: rgba(245,158,11,.1);
            border: 1px solid rgba(245,158,11,.3);
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 11px;
            color: #fcd34d;
            animation: slideUp .25s ease-out both;
            display: none;
        }
        .hint-box.show { display: block; }

        /* Background glow */
        .bg-glow {
            position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
        }
        .bg-glow::before {
            content: '';
            position: absolute;
            top: -20%; left: -20%;
            width: 96px; height: 96px;
            background: rgba(59,130,246,.15);
            filter: blur(130px);
            border-radius: 50%;
        }
        .bg-glow::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            width: 60%; height: 50%;
            background: rgba(16,185,129,.08);
            filter: blur(130px);
            border-radius: 50%;
        }

        /* Card image styling */
        .gcard-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            user-select: none;
            -webkit-user-select: none;
            pointer-events: none;
        }

        .gcard-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,.85);
            color: #f1f5f9;
            padding: 6px 4px;
            font-size: 9px;
            font-weight: 600;
            text-align: center;
            line-height: 1.2;
            word-break: break-word;
            max-height: 50%;
            overflow: hidden;
        }
    </style>
</head>
<body>

<!-- Background glow -->
<div class="bg-glow"></div>

<!-- App Shell -->
<div class="relative z-10 flex flex-col" style="height:100dvh;">

    <!-- ── Header ── -->
    <header class="shrink-0 px-4 py-2.5 flex items-center justify-between border-b border-white/5 bg-slate-900/60 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-blue-500/20 rounded-xl flex items-center justify-center border border-blue-500/30 shadow-md shadow-blue-500/10">
                <i data-lucide="dices" class="w-4 h-4 text-blue-400"></i>
            </div>
            <div>
                <h1 class="text-[17px] font-black italic uppercase tracking-tighter leading-none text-white">Connections</h1>
                <p id="status-bar" class="text-[9px] font-bold text-slate-500 uppercase tracking-widest leading-tight mt-0.5">Find Common Patterns</p>
            </div>
        </div>
        <button onclick="newGameSession()" class="glass px-3 py-1.5 rounded-lg text-[9px] font-black uppercase tracking-widest text-slate-400 hover:text-white transition-colors">Reset</button>
    </header>

    <!-- ── Content ── -->
    <div class="flex-1 overflow-hidden relative">

        <!-- ════ SETUP VIEW ════ -->
        <div id="view-setup" class="view active scrollbar flex-col">
            <div class="max-w-sm mx-auto p-4 space-y-5 pb-6 anim-up">

                <!-- Brand -->
                <div class="text-center pt-1">
                    <div class="w-14 h-14 bg-blue-600 rounded-[18px] mx-auto flex items-center justify-center shadow-xl shadow-blue-500/30 border-t border-white/20 text-2xl">
                        🎲
                    </div>
                    <h2 class="text-2xl font-black text-white italic uppercase tracking-tighter mt-3">Settings</h2>
                    <p class="text-[9px] text-slate-500 font-bold uppercase tracking-widest mt-0.5">Configure your game</p>
                </div>

                <!-- Config card -->
                <div class="glass rounded-2xl p-5 space-y-5">
                    <div class="space-y-2">
                        <label class="text-[9px] font-black text-slate-500 uppercase tracking-widest block">BGG Username</label>
                        <input type="text" id="usernameInput"
                            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500/40 transition-all font-bold text-sm"
                            placeholder="sportomax"
                            oninput="handleUsernameInput()">
                    </div>

                    <div class="space-y-2">
                        <label class="text-[9px] font-black text-slate-500 uppercase tracking-widest block">Game Type</label>
                        <div id="typeSelector" class="grid grid-cols-3 gap-2">
                            <button class="type-btn glass py-2.5 rounded-xl font-black text-xs border" data-type="category">Categories</button>
                            <button class="type-btn glass py-2.5 rounded-xl font-black text-xs border" data-type="mechanic">Mechanics</button>
                            <button class="type-btn glass py-2.5 rounded-xl font-black text-xs border" data-type="designer">Designers</button>
                        </div>
                    </div>
                </div>

                <!-- Load button -->
                <button id="loadBtn" onclick="loadCollection()"
                    class="w-full btn-green text-white py-4 rounded-2xl font-black text-sm italic uppercase tracking-tighter active:scale-95 transition-transform flex items-center justify-center gap-2">
                    <i data-lucide="package" class="w-4 h-4"></i>
                    <span>Load Collection</span>
                </button>

                <!-- Start button -->
                <button id="startGameBtn" onclick="startGame()"
                    class="w-full hidden btn-blue text-white py-4 rounded-2xl font-black text-sm italic uppercase tracking-tighter active:scale-95 transition-transform flex items-center justify-center gap-2">
                    <i data-lucide="play" class="w-4 h-4"></i>
                    <span>Start Game</span>
                </button>

                <!-- Status -->
                <div id="processingStatus" class="text-center text-[10px] text-slate-500 font-bold uppercase tracking-widest"></div>

                <!-- How it works -->
                <div class="glass rounded-2xl p-4 space-y-3">
                    <p class="text-[9px] font-black text-slate-500 uppercase tracking-widest">How It Works</p>
                    <div class="space-y-3 text-[10px]">
                        <div class="flex gap-2">
                            <span class="text-amber-400 font-black">→</span>
                            <p>Find 4 games that share a common connection</p>
                        </div>
                        <div class="flex gap-2">
                            <span class="text-blue-400 font-black">→</span>
                            <p>Tap cards to select, then submit your guess</p>
                        </div>
                        <div class="flex gap-2">
                            <span class="text-emerald-400 font-black">→</span>
                            <p>Find all 4 groups correctly to win!</p>
                        </div>
                    </div>
                </div>
            </div>
        </div><!-- /setup -->

        <!-- ════ GAME VIEW ════ -->
        <div id="view-game" class="view flex-col">

            <!-- Stat pills -->
            <div class="shrink-0 flex items-center gap-1.5 px-3 py-2.5 border-b border-white/5">
                <div class="spill">
                    <span class="spill-val" id="s-found">0/4</span>
                    <span class="spill-lbl">Found</span>
                </div>
                <div class="spill">
                    <span class="spill-val" id="s-mistakes">4</span>
                    <span class="spill-lbl">Mistakes</span>
                </div>
                <div class="flex-1"></div>
                <button id="hintBtn" onclick="showHint()" class="spill hover:bg-amber-500/20 cursor-pointer transition-all">
                    <i data-lucide="lightbulb" class="w-3 h-3 text-amber-400"></i>
                    <span class="spill-lbl text-amber-400">Hint</span>
                </button>
            </div>

            <!-- Game area -->
            <div class="flex-1 overflow-y-auto scrollbar p-3 min-h-0 space-y-3 flex flex-col">
                <div id="messageArea"></div>
                <div id="foundGroups" class="space-y-2"></div>
                <div id="gameGrid" class="grid grid-cols-4 gap-2 flex-1 auto-rows-max"></div>
            </div>

            <!-- Controls -->
            <div class="shrink-0 space-y-2 p-3 border-t border-white/5">
                <div id="hintInfo" class="hint-box"></div>
                <div class="flex gap-2">
                    <button id="deselectBtn" onclick="deselectAll()"
                        class="flex-1 glass border border-white/8 rounded-xl py-2.5 font-black text-[10px] uppercase tracking-widest text-slate-400 active:scale-95 transition-transform">
                        Clear
                    </button>
                    <button id="submitBtn" onclick="submitGuess()" disabled
                        class="flex-1 btn-blue text-white rounded-xl py-2.5 font-black text-[10px] uppercase tracking-widest active:scale-95 transition-transform disabled:opacity-50">
                        Check
                    </button>
                    <button id="shuffleBtn" onclick="shuffleCards()"
                        class="flex-1 glass border border-white/8 rounded-xl py-2.5 font-black text-[10px] uppercase tracking-widest text-slate-400 active:scale-95 transition-transform">
                        Shuffle
                    </button>
                </div>
                <button id="newGameBtn" onclick="newGameSession()"
                    class="w-full glass border border-white/8 rounded-xl py-2.5 font-black text-[10px] uppercase tracking-widest text-slate-400 hover:text-white transition-colors">
                    New Game
                </button>
            </div>
        </div><!-- /game -->

    </div><!-- /content -->

    <!-- ── Nav ── -->
    <nav class="shrink-0 glass-dark px-4 py-2" style="padding-bottom:max(8px,env(safe-area-inset-bottom))">
        <div class="glass rounded-2xl flex p-1 gap-1 max-w-xs mx-auto">
            <button id="nav-setup" class="tab-btn active flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest" onclick="switchTab('setup')">
                <i data-lucide="settings" class="w-3.5 h-3.5"></i>
                Setup
            </button>
            <button id="nav-game" class="tab-btn flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest" onclick="switchTab('game')">
                <i data-lucide="play" class="w-3.5 h-3.5"></i>
                Play
            </button>
        </div>
    </nav>

</div><!-- /app shell -->

<script>
    const TYPE_MAP = {
        'category': 'boardgamecategory',
        'mechanic': 'boardgamemechanic',
        'designer': 'boardgamedesigner'
    };

    let allGames = [];
    let typeData = { category: {}, mechanic: {}, designer: {} };
    let selectedTypes = new Set();
    let gameState = {
        puzzle: [],
        selected: new Set(),
        found: [],
        mistakes: 0,
        maxMistakes: 4
    };

    // Tab switching
    function switchTab(tab) {
        document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        if (tab === 'setup') {
            document.getElementById('view-setup').classList.add('active');
            document.getElementById('nav-setup').classList.add('active');
        } else {
            document.getElementById('view-game').classList.add('active');
            document.getElementById('nav-game').classList.add('active');
        }
    }

    // Type selection
    document.querySelectorAll('#typeSelector .type-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            btn.classList.toggle('selected');
            selectedTypes.clear();
            document.querySelectorAll('#typeSelector .type-btn.selected').forEach(el => {
                selectedTypes.add(el.dataset.type);
            });
            document.getElementById('startGameBtn').style.display = selectedTypes.size > 0 ? 'flex' : 'none';
        });
    });

    async function handleUsernameInput() {
        // Real-time validation
    }

    async function loadCollection() {
        const username = document.getElementById('usernameInput').value.trim();
        if (!username) {
            showMessage('❌ Please enter a username', 'err');
            return;
        }

        const statusEl = document.getElementById('processingStatus');
        statusEl.textContent = '📦 Loading...';
        
        try {
            // Fetch and process collection (same as before)
            const response = await fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1`);
            const xml = new DOMParser().parseFromString(await response.text(), 'text/xml');
            const items = xml.querySelectorAll('item');

            allGames = Array.from(items).map(item => ({
                id: item.getAttribute('objectid'),
                name: item.querySelector('name')?.textContent || 'Unknown',
                image: item.querySelector('thumbnail')?.textContent || ''
            })).filter(g => g.id);

            statusEl.textContent = `✅ Loaded ${allGames.length} games`;
            document.getElementById('startGameBtn').style.display = selectedTypes.size > 0 ? 'flex' : 'none';
        } catch (error) {
            statusEl.textContent = `❌ Error: ${error.message}`;
        }
    }

    function startGame() {
        if (selectedTypes.size === 0) {
            showMessage('Select at least one type', 'err');
            return;
        }
        generatePuzzle();
        switchTab('game');
    }

    function generatePuzzle() {
        gameState = {
            puzzle: [],
            selected: new Set(),
            found: [],
            mistakes: 0,
            maxMistakes: 4
        };

        const types = Array.from(selectedTypes);
        const groups = [];
        const usedGames = new Set();

        function findGroupForType(type, excludeNames = []) {
            const excludeSet = new Set(excludeNames);
            const candidates = Object.values(typeData[type])
                .filter(item => item.games.length >= 4)
                .filter(item => !excludeSet.has(item.name))
                .sort((a, b) => b.games.length - a.games.length);

            for (const candidate of candidates) {
                const availableGames = candidate.games.filter(g => !usedGames.has(g.id) && g.image);
                if (availableGames.length >= 4) {
                    const selectedGames = availableGames.slice(0, 4);
                    selectedGames.forEach(g => usedGames.add(g.id));
                    return {
                        type: type,
                        name: candidate.name,
                        games: selectedGames
                    };
                }
            }
            return null;
        }

        for (const type of types) {
            const group = findGroupForType(type);
            if (group) groups.push(group);
            if (groups.length >= 4) break;
        }

        if (groups.length < 4) {
            showMessage('Not enough unique groups found', 'err');
            switchTab('setup');
            return;
        }

        gameState.puzzle = groups.slice(0, 4);
        renderGame();
    }

    function renderGame() {
        const remainingGroups = gameState.puzzle.filter(
            group => !gameState.found.some(found => found.name === group.name)
        );

        const allGames = remainingGroups.flatMap(group => 
            group.games.map(game => ({ ...game, group: group.name, type: group.type }))
        );

        // Shuffle
        for (let i = allGames.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [allGames[i], allGames[j]] = [allGames[j], allGames[i]];
        }

        const gameGrid = document.getElementById('gameGrid');
        gameGrid.innerHTML = allGames.map((game, index) => `
            <div class="gcard aspect-[3/4] rounded-[14px] overflow-hidden relative group" 
                 data-index="${index}" onclick="toggleCard(${index})">
                <img src="/api/image-proxy?url=${encodeURIComponent(game.image)}" alt="${game.name}" class="gcard-img">
                <div class="gcard-name">${game.name}</div>
            </div>
        `).join('');

        gameGrid.dataset.games = JSON.stringify(allGames);
        updateUI();
        renderFoundGroups();
    }

    function toggleCard(index) {
        const allGames = JSON.parse(document.getElementById('gameGrid').dataset.games);
        if (gameState.selected.has(index)) {
            gameState.selected.delete(index);
        } else if (gameState.selected.size < 4) {
            gameState.selected.add(index);
        }
        updateUI();
    }

    function updateUI() {
        const cards = document.querySelectorAll('.gcard');
        cards.forEach((card, i) => {
            card.classList.toggle('selected', gameState.selected.has(i));
        });
        document.getElementById('submitBtn').disabled = gameState.selected.size !== 4;
        document.getElementById('s-found').textContent = `${gameState.found.length}/4`;
        document.getElementById('s-mistakes').textContent = gameState.maxMistakes - gameState.mistakes;
    }

    function deselectAll() {
        gameState.selected.clear();
        updateUI();
    }

    function shuffleCards() {
        deselectAll();
        renderGame();
    }

    function submitGuess() {
        const allGames = JSON.parse(document.getElementById('gameGrid').dataset.games);
        const selectedGames = Array.from(gameState.selected).map(i => allGames[i]);
        const groups = selectedGames.map(g => g.group);
        const uniqueGroups = new Set(groups);

        if (uniqueGroups.size === 1) {
            const groupName = groups[0];
            const groupType = selectedGames[0].type;
            gameState.found.push({ name: groupName, type: groupType, games: selectedGames });
            gameState.selected.clear();
            showMessage('🎉 Correct!', 'ok');

            if (gameState.found.length === 4) {
                showMessage('🏆 You won!', 'ok');
                setTimeout(() => newGameSession(), 2000);
            } else {
                renderGame();
            }
        } else {
            gameState.mistakes++;
            gameState.selected.clear();
            
            if (gameState.mistakes >= gameState.maxMistakes) {
                showMessage('Game Over!', 'err');
                renderFoundGroups();
            } else {
                showMessage(`Not a match. ${gameState.maxMistakes - gameState.mistakes} left`, 'err');
                renderGame();
            }
        }
    }

    function renderFoundGroups() {
        const html = gameState.found.map(group => {
            const typeClass = group.type === 'category' ? 'cat' : group.type === 'mechanic' ? 'mec' : 'des';
            return `
                <div class="fgroup ${typeClass}">
                    <div class="font-bold text-[11px] text-white mb-1">${group.name}</div>
                    <div class="text-[9px] text-slate-400">${group.games.map(g => g.name).join(', ')}</div>
                </div>
            `;
        }).join('');
        document.getElementById('foundGroups').innerHTML = html;
    }

    function showMessage(text, type) {
        const msg = document.createElement('div');
        msg.className = `msg ${type}`;
        msg.textContent = text;
        document.getElementById('messageArea').innerHTML = '';
        document.getElementById('messageArea').appendChild(msg);
        setTimeout(() => msg.remove(), 2500);
    }

    function showHint() {
        if (!gameState.puzzle || gameState.puzzle.length === 0) return;
        
        const remainingGroups = gameState.puzzle.filter(
            group => !gameState.found.some(found => found.name === group.name)
        );
        
        if (remainingGroups.length === 0) return;

        const randomGroup = remainingGroups[Math.floor(Math.random() * remainingGroups.length)];
        const typeLabel = { category: '📎 Category', mechanic: '⚙️ Mechanic', designer: '👤 Designer' }[randomGroup.type];
        const hintText = `<strong>${typeLabel}:</strong> "${randomGroup.name}"`;
        
        const hintBox = document.getElementById('hintInfo');
        hintBox.innerHTML = hintText;
        hintBox.classList.add('show');
        document.getElementById('hintBtn').disabled = true;
        
        setTimeout(() => {
            hintBox.classList.remove('show');
            document.getElementById('hintBtn').disabled = false;
        }, 3000);
    }

    function newGameSession() {
        gameState = { puzzle: [], selected: new Set(), found: [], mistakes: 0, maxMistakes: 4 };
        switchTab('setup');
        document.getElementById('messageArea').innerHTML = '';
        document.getElementById('foundGroups').innerHTML = '';
    }

    // Initialize icons
    window.addEventListener('load', () => lucide.createIcons());
</script>
