<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark"><title>BGG Network Explorer</title>
<style>
:root{--bg:#07111f;--p:#0d1929;--p2:#111f31;--line:#24364e;--text:#f5f7fb;--muted:#91a1b7;--a:#7c5cff;--a2:#a78bfa;--good:#57e59a;--warn:#ffc766;--bad:#ff8494;--r:14px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 75% -15%,#263b70 0,transparent 32%),var(--bg);color:var(--text);font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1800px;margin:auto;padding:14px}.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.brand{margin-right:auto;display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),#4f31b5);font-weight:900}.brand h1{font-size:23px;margin:0;letter-spacing:-.03em}.brand small,.muted{color:var(--muted)}.controls{display:flex;gap:7px;flex-wrap:wrap}.field{position:relative}.field label{position:absolute;left:9px;top:3px;font-size:8px;font-weight:800;color:#8090a7}.ctl{height:42px;border:1px solid var(--line);border-radius:9px;background:#0a1625;color:var(--text);padding:13px 10px 2px;outline:none}.ctl:focus{border-color:var(--a)}#username{width:145px}.primary,.ghost{height:42px;border-radius:9px;padding:0 14px;font-weight:800;color:white}.primary{border:0;background:linear-gradient(135deg,var(--a),#6336df)}.ghost{border:1px solid var(--line);background:#111e2e}.primary:disabled{opacity:.5}.status{margin:9px 0;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:11px;color:var(--muted)}.bar{grid-column:1/-1;height:3px;background:#17253a;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--a2));transition:.2s}.tabs{display:flex;gap:5px;overflow:auto;margin-bottom:8px}.tab{height:38px;padding:0 13px;border:1px solid var(--line);border-radius:9px;background:#111e2e;color:var(--text);font-weight:800;white-space:nowrap}.tab.active{background:#30275d;border-color:#7458e8}.metrics{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px}.metric,.panel{background:linear-gradient(180deg,#111f31f5,#0b1827f5);border:1px solid var(--line);border-radius:var(--r)}.metric{padding:9px 11px}.metric span{display:block;font-size:9px;color:var(--muted);text-transform:uppercase}.metric b{font-size:21px}.panel{overflow:hidden}.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) repeat(4,minmax(120px,180px));gap:6px;padding:9px;border-bottom:1px solid var(--line)}.toolbar .ctl{width:100%;height:36px;padding:0 9px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:7px;padding:8px}.card{background:#0d1a2a;border:1px solid #203149;border-radius:11px;padding:9px;min-width:0}.cardTop{display:flex;gap:9px;align-items:center}.thumb{width:54px;height:70px;object-fit:cover;border-radius:6px;background:#17263a}.personIcon{width:54px;height:54px;border-radius:10px;background:#1d2b43;display:grid;place-items:center;font-size:19px;font-weight:900}.title{font-weight:850;overflow:hidden;text-overflow:ellipsis}.sub{font-size:10px;color:var(--muted)}.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}.badge{padding:2px 6px;border-radius:999px;background:#1a2a40;color:#b8c5d6;font-size:9px;font-weight:750}.badge.good{background:#153a2b;color:#7cf0ad}.badge.purple{background:#30275d;color:#c9bcff}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px}.mini div{background:#0a1522;border-radius:6px;padding:5px}.mini span{display:block;font-size:8px;color:var(--muted)}.mini b{font-size:12px}.covers{display:flex;gap:4px;margin-top:8px;overflow:hidden}.covers img{width:31px;height:41px;object-fit:cover;border-radius:4px}.tableWrap{overflow:auto;max-height:72vh}.table{border-collapse:separate;border-spacing:0;width:100%;min-width:950px}.table th,.table td{padding:8px 9px;border-bottom:1px solid #1d2d43;text-align:left;font-size:11px}.table th{position:sticky;top:0;background:#132238;z-index:2}.gameCell{display:flex;gap:8px;align-items:center}.gameCell img{width:38px;height:48px;object-fit:cover;border-radius:5px}.empty{padding:60px 20px;text-align:center;color:var(--muted)}.dash{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.dash .panel{padding:13px}.dash h2{font-size:15px;margin:0 0 10px}.rankRow{display:grid;grid-template-columns:minmax(120px,1fr) 3fr 55px;gap:8px;align-items:center;margin:8px 0;font-size:11px}.track{height:7px;background:#1b2b40;border-radius:99px;overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--a2))}.log{font:11px/1.5 ui-monospace,monospace;white-space:pre-wrap;max-height:65vh;overflow:auto;padding:12px}.hidden{display:none!important}.link{color:#cbbfff;text-decoration:none}.link:hover{text-decoration:underline}
@media(max-width:1000px){.metrics{grid-template-columns:repeat(4,1fr)}.toolbar{grid-template-columns:1fr 1fr 1fr}.toolbar input{grid-column:1/-1}.dash{grid-template-columns:1fr}}
@media(max-width:620px){.app{padding:8px}.controls{width:100%}.field{flex:1}.ctl,#username{width:100%}.metrics{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}
</style></head>
<body><main class="app">
<header class="top"><div class="brand"><div class="logo">N</div><div><h1>BGG Network Explorer</h1><small>Collection → designers & publishers → complete credited catalogs</small></div></div>
<div class="controls"><div class="field"><label>BGG USER</label><input id="username" class="ctl" value="sportomax"></div><div class="field"><label>COLLECTION SCOPE</label><select id="scope" class="ctl"><option value="all">All statuses</option><option value="own">Owned only</option></select></div><div class="field"><label>WORKERS · ALL QUEUES</label><select id="workers" class="ctl"><option>6</option><option>12</option><option>24</option><option>50</option><option selected>100</option></select></div><button id="run" class="primary">Build Network</button><button id="clear" class="ghost">Clear Cache</button></div></header>
<section class="panel" style="margin:9px 0;padding:9px"><div style="display:flex;gap:7px;align-items:end;flex-wrap:wrap"><div class="field"><label>MANUAL API TEST</label><select id="testKind" class="ctl"><option value="designer">Designer</option><option value="publisher">Publisher</option></select></div><div class="field" style="flex:1;min-width:180px"><label>BGG ID</label><input id="testId" class="ctl" style="width:100%" placeholder="Enter designer/publisher ID"></div><button id="testApi" class="ghost">Test API</button><span id="testSummary" class="muted"></span></div><pre id="testOutput" class="log hidden" style="margin:8px 0 0;background:#07111f;border:1px solid #24364e;border-radius:9px;max-height:260px"></pre></section>
<div class="status"><span id="status">Checking IndexedDB…</span><span id="cache">—</span><div class="bar"><i id="progress"></i></div><div id="steps" style="grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);gap:5px"></div></div>
<nav class="tabs"><button class="tab active" data-view="dashboard">Dashboard</button><button class="tab" data-view="designers">Designers</button><button class="tab" data-view="publishers">Publishers</button><button class="tab" data-view="games">Games</button><button class="tab" data-view="api">API Activity</button></nav>
<section class="metrics" id="metrics"></section>
<section class="panel" id="main"><div class="empty">Load the network to discover games connected to your collection.</div></section>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), API='/api/bgg-helper', DB='bgg-network-explorer', DBV=1, DETAIL_TTL=30*864e5, CATALOG_TTL=30*864e5, COLLECTION_TTL=12*3600e3, BATCH=20;
let S={collection:[],things:new Map(),designers:new Map(),publishers:new Map(),catalogs:new Map(),view:'dashboard',running:false,log:[],calls:0,hits:0,errors:0};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), fmt=new Intl.NumberFormat();
function log(s){S.log.push(new Date().toLocaleTimeString()+'  '+s);if(S.log.length>1000)S.log.shift();if(S.view==='api')render()}
function prog(n){$('progress').style.width=Math.max(0,Math.min(100,n))+'%'}
const STEP_NAMES=['Collection','Collection thing hydration','Designer + publisher catalogs','Network thing hydration','Complete'];
function stepbar(active,detail=''){ $('steps').innerHTML=STEP_NAMES.map((x,i)=>'<div style="padding:5px 7px;border:1px solid '+(i<active?'#2e7655':i===active?'#7458e8':'#24364e')+';border-radius:7px;background:'+(i<active?'#153a2b':i===active?'#30275d':'#0a1625')+'"><b style="font-size:9px">'+(i+1)+'. '+x+'</b><div style="font-size:8px;color:#91a1b7">'+(i===active?esc(detail):i<active?'Done':'Waiting')+'</div></div>').join('') }
function stage(active,detail,pct){stepbar(active,detail);$('status').textContent=detail;prog(pct)}
function xml(t){const d=new DOMParser().parseFromString(t,'text/xml');if(d.querySelector('parsererror'))throw Error('Invalid XML response');return d}
function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,DBV);r.onupgradeneeded=()=>{const d=r.result;['kv','things','catalogs'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n)});};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function idbGet(store,key){const d=await openDB();return new Promise((ok,no)=>{const r=d.transaction(store).objectStore(store).get(key);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function idbPut(store,key,val){const d=await openDB();return new Promise((ok,no)=>{const tx=d.transaction(store,'readwrite');tx.objectStore(store).put(val,key);tx.oncomplete=()=>ok();tx.onerror=()=>no(tx.error)})}
async function idbClear(){const d=await openDB();await Promise.all(['kv','things','catalogs'].map(store=>new Promise((ok,no)=>{const tx=d.transaction(store,'readwrite');tx.objectStore(store).clear();tx.oncomplete=ok;tx.onerror=()=>no(tx.error)})))}
async function api(endpoint,params={},tries=5){S.calls++;const q=new URLSearchParams({endpoint,...params});for(let a=0;a<tries;a++){try{const r=await fetch(API+'?'+q);if(r.status===202||r.status===429||r.status>=500){if(a<tries-1){await sleep(800*Math.pow(2,a)+Math.random()*500);continue}}if(!r.ok)throw Error('API '+r.status);const t=await r.text();if(t.trim().startsWith('{')){const j=JSON.parse(t);throw Error(j.message||'API error')}return t}catch(e){if(a===tries-1){S.errors++;throw e}await sleep(700*Math.pow(2,a))}}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function parseCollection(t){return [...xml(t).querySelectorAll('item')].map(n=>({id:+n.getAttribute('objectid'),name:n.querySelector('name')?.textContent||'',own:n.querySelector('status')?.getAttribute('own')==='1',status:Object.fromEntries([...n.querySelector('status')?.attributes||[]].map(a=>[a.name,a.value==='1']))}))}
function parseThings(t){return [...xml(t).querySelectorAll('item')].map(n=>{const links=[...n.querySelectorAll('link')], stat=n.querySelector('statistics ratings');const rank=[...n.querySelectorAll('rank')].find(x=>x.getAttribute('name')==='boardgame');return{id:+n.getAttribute('id'),name:n.querySelector('name[type="primary"]')?.getAttribute('value')||'',year:+(n.querySelector('yearpublished')?.getAttribute('value')||0),thumb:n.querySelector('thumbnail')?.textContent||'',image:n.querySelector('image')?.textContent||'',rating:+(stat?.querySelector('average')?.getAttribute('value')||0),bayes:+(stat?.querySelector('bayesaverage')?.getAttribute('value')||0),rank:rank&&rank.getAttribute('value')!=='Not Ranked'?+rank.getAttribute('value'):0,designers:links.filter(x=>x.getAttribute('type')==='boardgamedesigner').map(x=>({id:+x.getAttribute('id'),name:x.getAttribute('value')})),publishers:links.filter(x=>x.getAttribute('type')==='boardgamepublisher').map(x=>({id:+x.getAttribute('id'),name:x.getAttribute('value')}))}})}
function parseCatalog(t){const d=xml(t),out=[];for(const n of d.querySelectorAll('boardgame')){const id=+(n.getAttribute('objectid')||n.getAttribute('id'));if(!id)continue;out.push({id,name:n.querySelector('name[primary="true"]')?.textContent||n.querySelector('name')?.textContent||'',year:+(n.querySelector('yearpublished')?.textContent||0)})}return out}
async function cachedThingBatch(ids){const missing=[],got=[];for(const id of ids){if(S.things.has(id)){got.push(S.things.get(id));continue}const c=await idbGet('things',String(id));if(c&&Date.now()-c.at<DETAIL_TTL){S.hits++;S.things.set(id,c.data);got.push(c.data)}else missing.push(id)}if(missing.length){const arr=parseThings(await api('thing',{id:missing.join(','),stats:1}));for(const g of arr){S.things.set(g.id,g);await idbPut('things',String(g.id),{at:Date.now(),data:g})}got.push(...arr)}return got}
async function hydrate(ids,workers=100,onProgress=()=>{}){const unique=[...new Set(ids)].filter(Boolean),chunks=[];for(let i=0;i<unique.length;i+=BATCH)chunks.push(unique.slice(i,i+BATCH));let done=0;await pool(chunks,workers,async c=>{await cachedThingBatch(c);done++;onProgress(done,chunks.length,c.length)})}
async function pool(items,limit,fn){let i=0;const work=async()=>{while(true){const x=i++;if(x>=items.length)return;await fn(items[x],x)}};await Promise.all(Array.from({length:Math.min(limit,items.length||1)},work))}
function collectCredits(){S.designers.clear();S.publishers.clear();for(const c of S.collection){const g=S.things.get(c.id);if(!g)continue;for(const p of g.designers)S.designers.set(p.id,{...p,collectionGames:(S.designers.get(p.id)?.collectionGames||new Set()).add(g.id)});for(const p of g.publishers)S.publishers.set(p.id,{...p,collectionGames:(S.publishers.get(p.id)?.collectionGames||new Set()).add(g.id)})}}
async function catalog(kind,p){const key=kind+':'+p.id,c=await idbGet('catalogs',key);if(c&&Date.now()-c.at<CATALOG_TTL){S.hits++;S.catalogs.set(key,c.data);return c.data}const path=kind==='designer'?'boardgamedesigner':'boardgamepublisher';const url='https://boardgamegeek.com/xmlapi/'+path+'/'+p.id;const data=parseCatalog(await api('page',{url}));S.catalogs.set(key,data);await idbPut('catalogs',key,{at:Date.now(),data});return data}
async function build(){if(S.running)return;S.running=true;$('run').disabled=true;S.calls=S.hits=S.errors=0;S.log=[];prog(1);try{const user=$('username').value.trim(),scope=$('scope').value,workers=+$('workers').value;if(!user)throw Error('Enter a BGG username.');
stage(0,'Loading collection…',1);const ck='collection:'+user.toLowerCase()+':'+scope;let c=await idbGet('kv',ck);if(c&&Date.now()-c.at<COLLECTION_TTL){S.collection=c.data;S.hits++;log('Collection cache hit: '+S.collection.length)}else{const params={username:user,stats:1,excludesubtype:'boardgameaccessory'};if(scope==='own')params.own=1;S.collection=parseCollection(await api('collection',params));await idbPut('kv',ck,{at:Date.now(),data:S.collection});log('Collection fetched: '+S.collection.length)}
stage(1,'Collection thing hydration · preparing 20-ID chunks · 100-worker ceiling',8);await hydrate(S.collection.map(x=>x.id),workers,(d,n)=>{const msg='Collection thing hydration · chunk '+d+' / '+n+' · '+Math.min(workers,n)+' active worker ceiling';stage(1,msg,8+18*d/n);if(d===1||d===n||d%10===0)log(msg)});collectCredits();log('Unique designers: '+S.designers.size+' · publishers: '+S.publishers.size);
const jobs=[...[...S.designers.values()].map(p=>({kind:'designer',p})),...[...S.publishers.values()].map(p=>({kind:'publisher',p}))];let done=0;stage(2,'Catalog discovery · 0 / '+jobs.length+' · '+Math.min(workers,jobs.length)+' worker ceiling',27);await pool(jobs,workers,async j=>{try{await catalog(j.kind,j.p)}catch(e){log('Catalog failed '+j.kind+' '+j.p.name+': '+e.message)}done++;const msg='Catalog discovery · '+done+' / '+jobs.length+' · '+Math.min(workers,jobs.length)+' worker ceiling';stage(2,msg,27+38*done/jobs.length);if(done===1||done===jobs.length||done%10===0)log(msg)});
const ids=new Set(S.collection.map(x=>x.id));for(const arr of S.catalogs.values())for(const g of arr)ids.add(g.id);stage(3,'Network thing hydration · '+fmt.format(ids.size)+' games · 20-ID chunks · 100-worker ceiling',65);await hydrate([...ids],workers,(d,n)=>{const msg='Network thing hydration · chunk '+d+' / '+n+' · '+fmt.format(Math.min(d*BATCH,ids.size))+' / '+fmt.format(ids.size)+' games · '+Math.min(workers,n)+' worker ceiling';stage(3,msg,65+34*d/n);if(d===1||d===n||d%10===0)log(msg)});
stage(4,'Network ready: '+fmt.format(ids.size)+' games · '+fmt.format(S.designers.size)+' designers · '+fmt.format(S.publishers.size)+' publishers',100);$('cache').textContent=S.hits+' cache hits · '+S.calls+' API calls';render()}catch(e){$('status').textContent='Error: '+e.message;log('ERROR '+e.stack)}finally{S.running=false;$('run').disabled=false}}
function gameConnections(id){let d=0,p=0;for(const x of S.designers.values())if((S.catalogs.get('designer:'+x.id)||[]).some(g=>g.id===id))d++;for(const x of S.publishers.values())if((S.catalogs.get('publisher:'+x.id)||[]).some(g=>g.id===id))p++;return{d,p}}
function allGames(){const ids=new Set(S.collection.map(x=>x.id));for(const a of S.catalogs.values())for(const g of a)ids.add(g.id);const coll=new Map(S.collection.map(x=>[x.id,x]));return [...ids].map(id=>({...S.things.get(id),id,inCollection:coll.has(id),owned:coll.get(id)?.own||false})).filter(x=>x.name)}
function metrics(){const games=allGames(),missing=games.filter(g=>!g.inCollection);$('metrics').innerHTML=[['Collection',S.collection.length],['Designers',S.designers.size],['Publishers',S.publishers.size],['Network games',games.length],['Outside collection',missing.length],['BGG API calls',S.calls],['Cache hits',S.hits]].map(x=>'<div class="metric"><span>'+x[0]+'</span><b>'+fmt.format(x[1])+'</b></div>').join('')}
function toolbar(type){return '<div class="toolbar"><input class="ctl" id="q" placeholder="Search '+type+'…"><select class="ctl" id="filter"><option value="all">All</option>'+(type==='games'?'<option value="missing">Not in collection</option><option value="collection">In collection</option><option value="owned">Owned</option>':'<option value="missing">Has missing games</option>')+'</select><select class="ctl" id="sort"><option value="catalog">Largest catalog</option><option value="missing">Most missing</option><option value="collection">Most in collection</option><option value="rating">Highest rating</option><option value="rank">Best BGG rank</option><option value="name">Name A–Z</option></select><select class="ctl" id="pageSize"><option>50</option><option selected>100</option><option>250</option><option>500</option></select><select class="ctl" id="layout"><option value="cards">Cards</option><option value="table">Table</option></select></div><div id="results"></div>'}
function peopleRows(kind){const src=kind==='designer'?S.designers:S.publishers;return [...src.values()].map(p=>{const cat=S.catalogs.get(kind+':'+p.id)||[],ids=new Set(S.collection.map(x=>x.id)),full=cat.map(x=>S.things.get(x.id)).filter(Boolean),missing=cat.filter(x=>!ids.has(x.id));return{...p,catalog:cat.length,missing:missing.length,avg:full.length?full.reduce((a,g)=>a+g.rating,0)/full.length:0,games:full}})}
function wireList(kind){const q=$('q'),f=$('filter'),s=$('sort'),ps=$('pageSize'),lay=$('layout');const go=()=>{let rows=kind==='games'?allGames():peopleRows(kind);const term=q.value.toLowerCase();if(term)rows=rows.filter(x=>x.name.toLowerCase().includes(term));if(kind==='games'){if(f.value==='missing')rows=rows.filter(x=>!x.inCollection);if(f.value==='collection')rows=rows.filter(x=>x.inCollection);if(f.value==='owned')rows=rows.filter(x=>x.owned);rows.forEach(x=>Object.assign(x,gameConnections(x.id)));rows.sort(s.value==='rating'?(a,b)=>b.rating-a.rating:s.value==='rank'?(a,b)=>(a.rank||1e9)-(b.rank||1e9):s.value==='name'?(a,b)=>a.name.localeCompare(b.name):(a,b)=>(b.d+b.p)-(a.d+a.p))}else{if(f.value==='missing')rows=rows.filter(x=>x.missing);rows.sort(s.value==='missing'?(a,b)=>b.missing-a.missing:s.value==='collection'?(a,b)=>b.collectionGames.size-a.collectionGames.size:s.value==='rating'?(a,b)=>b.avg-a.avg:s.value==='name'?(a,b)=>a.name.localeCompare(b.name):(a,b)=>b.catalog-a.catalog)}rows=rows.slice(0,+ps.value);$('results').innerHTML=lay.value==='table'?table(rows,kind):cards(rows,kind)};[q,f,s,ps,lay].forEach(x=>x.addEventListener(x===q?'input':'change',go));go()}
function cards(rows,kind){if(!rows.length)return '<div class="empty">No matches.</div>';return '<div class="grid">'+rows.map(x=>kind==='games'?'<article class="card"><div class="cardTop">'+(x.thumb?'<img class="thumb" loading="lazy" src="'+esc(x.thumb)+'">':'<div class="thumb"></div>')+'<div><a class="title link" target="_blank" href="https://boardgamegeek.com/boardgame/'+x.id+'">'+esc(x.name)+'</a><div class="sub">'+(x.year||'Year ?')+' · '+(x.rank?'#'+x.rank:'Unranked')+' · '+x.rating.toFixed(2)+'</div></div></div><div class="badges">'+(x.inCollection?'<span class="badge good">In collection</span>':'<span class="badge purple">Discovered</span>')+(x.owned?'<span class="badge good">Owned</span>':'')+'<span class="badge">'+x.d+' designer links</span><span class="badge">'+x.p+' publisher links</span></div></article>':'<article class="card"><div class="cardTop"><div class="personIcon">'+esc(x.name.slice(0,1))+'</div><div><div class="title">'+esc(x.name)+'</div><div class="sub">BGG ID '+x.id+'</div></div></div><div class="mini"><div><span>CATALOG</span><b>'+x.catalog+'</b></div><div><span>IN COLLECTION</span><b>'+x.collectionGames.size+'</b></div><div><span>MISSING</span><b>'+x.missing+'</b></div></div><div class="covers">'+x.games.slice(0,7).map(g=>g.thumb?'<img loading="lazy" src="'+esc(g.thumb)+'" title="'+esc(g.name)+'">':'').join('')+'</div></article>').join('')+'</div>'}
function table(rows,kind){return '<div class="tableWrap"><table class="table"><thead><tr>'+(kind==='games'?'<th>Game</th><th>Year</th><th>Rank</th><th>Rating</th><th>Status</th><th>Designer links</th><th>Publisher links</th>':'<th>Name</th><th>Catalog</th><th>Collection</th><th>Missing</th><th>Avg rating</th>')+'</tr></thead><tbody>'+rows.map(x=>kind==='games'?'<tr><td><div class="gameCell">'+(x.thumb?'<img loading="lazy" src="'+esc(x.thumb)+'">':'')+'<a class="link" target="_blank" href="https://boardgamegeek.com/boardgame/'+x.id+'">'+esc(x.name)+'</a></div></td><td>'+x.year+'</td><td>'+(x.rank||'—')+'</td><td>'+x.rating.toFixed(2)+'</td><td>'+(x.inCollection?'Collection':'Discovered')+'</td><td>'+x.d+'</td><td>'+x.p+'</td></tr>':'<tr><td>'+esc(x.name)+'</td><td>'+x.catalog+'</td><td>'+x.collectionGames.size+'</td><td>'+x.missing+'</td><td>'+x.avg.toFixed(2)+'</td></tr>').join('')+'</tbody></table></div>'}
function dashboard(){const games=allGames(),missing=games.filter(x=>!x.inCollection),ds=peopleRows('designer').sort((a,b)=>b.missing-a.missing).slice(0,12),ps=peopleRows('publisher').sort((a,b)=>b.missing-a.missing).slice(0,12),max=Math.max(1,...ds.map(x=>x.missing),...ps.map(x=>x.missing));const block=(title,rows)=>'<section class="panel"><h2>'+title+'</h2>'+rows.map(x=>'<div class="rankRow"><span>'+esc(x.name)+'</span><div class="track"><i style="width:'+(x.missing/max*100)+'%"></i></div><b>'+x.missing+'</b></div>').join('')+'</section>';return '<div class="dash">'+block('Designers · most games outside collection',ds)+block('Publishers · most games outside collection',ps)+'<section class="panel"><h2>Discovery summary</h2><p><b>'+fmt.format(missing.length)+'</b> games were found outside the selected collection through credited designer/publisher catalogs.</p><p class="muted">Game detail requests are deduplicated and hydrated in BGG-supported batches of 20. IndexedDB stores game metadata and individual credit catalogs so later runs only fetch stale/missing data.</p></section><section class="panel"><h2>API efficiency</h2><p><b>'+S.calls+'</b> network calls this run · <b>'+S.hits+'</b> IndexedDB cache hits · <b>'+S.errors+'</b> terminal errors.</p><p class="muted">Catalog fan-out uses the selected worker ceiling. Thing hydration and designer/publisher catalog discovery both use the selected worker ceiling (100 by default). Thing requests remain batched at 20 game IDs per request.</p></section></div>'}
function render(){metrics();if(!S.collection.length){$('main').innerHTML='<div class="empty">No network loaded yet.</div>';return}if(S.view==='dashboard')$('main').innerHTML=dashboard();else if(S.view==='api')$('main').innerHTML='<div class="log">'+esc(S.log.join('\n')||'No API activity yet.')+'</div>';else{$('main').innerHTML=toolbar(S.view);wireList(S.view==='designers'?'designer':S.view==='publishers'?'publisher':'games')}}
async function manualTest(){const b=$('testApi'),kind=$('testKind').value,id=$('testId').value.trim(),out=$('testOutput'),sum=$('testSummary');out.classList.remove('hidden');out.textContent='TEST BUTTON CLICKED\nKind: '+kind+'\nBGG ID: '+(id||'(blank)');sum.textContent='Test started…';if(!/^\d+$/.test(id)){sum.textContent='Enter a numeric BGG ID.';out.textContent+='\n\nSTOPPED: Enter a numeric BGG ID.';console.warn('[BGG API TEST] Invalid ID:',id);return}const path=kind==='designer'?'boardgamedesigner':'boardgamepublisher',target='https://boardgamegeek.com/xmlapi/'+path+'/'+id,proxy=location.origin+API+'?'+new URLSearchParams({endpoint:'page',url:target}).toString();b.disabled=true;sum.textContent='Calling…';out.textContent='ACTUAL BROWSER FETCH URL:\n'+proxy+'\n\nTARGET BGG URL:\n'+target+'\n\nWaiting for response…';console.group('[BGG API TEST] '+kind+' '+id);console.log('ACTUAL BROWSER FETCH URL:',proxy);console.log('TARGET BGG URL:',target);console.log('FETCH STARTING NOW');try{const started=performance.now(),t=await api('page',{url:target}),ms=Math.round(performance.now()-started);let parsed=[],parseErr='';try{parsed=parseCatalog(t)}catch(e){parseErr=e.message}console.log('FETCH COMPLETED:',ms+' ms');console.log('RAW RESPONSE LENGTH:',t.length);console.log('PARSED GAMES:',parsed.length);console.log('RAW RESPONSE PREVIEW:',t.slice(0,2000));sum.textContent=(parsed.length?parsed.length+' game result'+(parsed.length===1?'':'s'):'0 parsed games')+' · '+ms+' ms';out.textContent='ACTUAL BROWSER FETCH URL:\n'+proxy+'\n\nTARGET BGG URL:\n'+target+'\n\nHTTP/proxy: SUCCESS · '+ms+' ms\nParsed <boardgame> results: '+parsed.length+(parseErr?'\nParser error: '+parseErr:'')+'\n\nRAW RESPONSE\n────────────────────────────────────────\n'+t.slice(0,50000);log('Manual '+kind+' API test '+id+': '+parsed.length+' parsed games · '+ms+'ms')}catch(e){sum.textContent='FAILED · '+e.message;console.error('FETCH FAILED:',e);out.textContent+='\n\nFAILED\n'+e.stack;log('Manual '+kind+' API test '+id+' FAILED: '+e.message)}finally{console.groupEnd();b.disabled=false}}
$('testApi').onclick=manualTest;$('testId').addEventListener('keydown',e=>{if(e.key==='Enter')manualTest()});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.view=b.dataset.view;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});
$('run').onclick=build;$('clear').onclick=async()=>{await idbClear();S={...S,collection:[],things:new Map(),designers:new Map(),publishers:new Map(),catalogs:new Map(),calls:0,hits:0,errors:0};$('status').textContent='IndexedDB cache cleared.';$('cache').textContent='—';prog(0);stepbar(0,'Ready');render()};
(async()=>{try{await openDB();$('status').textContent='Ready. IndexedDB cache available.';$('cache').textContent='Persistent local cache'}catch(e){$('status').textContent='IndexedDB unavailable: '+e.message}stepbar(0,'Ready');render()})();
})();
</script></body></html>
