<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BGG People Analyzer</title><style>:root{--bg:#07111f;--p:#0d1929;--l:#203149;--t:#f4f7fb;--m:#91a0b5;--a:#7c5cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.shell{max-width:1400px;margin:auto;padding:20px}.top,.row,.head{display:flex;align-items:center;justify-content:space-between;gap:10px}.panel{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:10px}.ctl{width:100%;min-height:42px;background:#091523;color:var(--t);border:1px solid #2b3d55;border-radius:9px;padding:8px 11px}.btn{min-height:40px;border:1px solid var(--l);border-radius:9px;background:#111e2e;color:var(--t);padding:0 13px;font-weight:700;cursor:pointer}.primary{background:var(--a);border:0}.tabs{display:flex;gap:6px;overflow:auto;margin:12px 0}.tab.active{background:#30275d}.filters{display:flex;gap:6px;flex-wrap:wrap}.filters label{background:#111e2e;border:1px solid var(--l);padding:7px 9px;border-radius:8px}.filters input{margin-right:5px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;padding:0;overflow:hidden}.metric{background:#101e30;padding:13px}.metric b{display:block;font-size:23px}.muted,.sub{color:var(--m);font-size:11px}.person{border-bottom:1px solid var(--l)}.personMain{display:grid;grid-template-columns:40px minmax(180px,1fr) 70px minmax(150px,1fr) 25px;gap:10px;align-items:center;padding:12px;cursor:pointer}.rank{background:#18283d;border-radius:8px;padding:8px;text-align:center}.covers{display:flex;gap:5px}.cover{width:34px;height:45px;object-fit:cover;border-radius:4px}.expanded{display:none;padding:0 12px 12px 62px;gap:6px;flex-wrap:wrap}.person.open .expanded{display:flex}.gamePill{display:flex;align-items:center;gap:6px;background:#132238;border:1px solid var(--l);border-radius:8px;padding:5px 7px}.gameTitle{border:0;background:none;color:var(--t);padding:0;cursor:pointer;text-align:left;font-weight:650}.gameTitle:hover{color:#c9bcff}.thumb{border:0;background:none;padding:0;cursor:pointer}.thumb img{width:25px;height:34px;object-fit:cover;border-radius:3px}.drawerBg,.login{position:fixed;inset:0;background:#020814e8;z-index:50}.drawerBg{display:none;justify-content:flex-end}.drawerBg.open{display:flex}.drawer{width:min(620px,96vw);height:100%;overflow:auto;background:#0b1726;border-left:1px solid var(--l);padding:18px}.credit,.contact,.gameCard{border:1px solid var(--l);background:#101e30;border-radius:10px;padding:10px;margin:7px 0}.credit{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px}.badge{font-size:10px;text-transform:uppercase;background:#1b2c44;padding:3px 6px;border-radius:5px}.id{font:11px ui-monospace,monospace;color:#a9b6c9}.contactGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.full{grid-column:1/-1}.login{display:grid;place-items:center}.login.hidden,.hidden{display:none!important}.loginBox{width:min(380px,94vw);background:var(--p);border:1px solid var(--l);border-radius:18px;padding:20px}.good{color:#7ee2a8}.danger{color:#ff9bac}.error{color:#ff9bac}.gameHero{display:flex;gap:12px;align-items:center}.gameHero img{width:72px;height:96px;object-fit:cover;border-radius:7px}.gameCard{display:grid;grid-template-columns:52px 1fr;gap:9px;align-items:center}.gameCard img{width:52px;height:70px;object-fit:cover;border-radius:5px}@media(max-width:700px){.shell{padding:8px}.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.personMain{grid-template-columns:30px 1fr 50px 18px}.covers{display:none}.expanded{padding-left:48px}.contactGrid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div id="login" class="login"><div class="loginBox"><h2>People Analyzer</h2><p class="muted">Same access key as Checkout.</p><input id="pw" class="ctl" type="password" placeholder="Access key"><button id="unlock" class="btn primary" style="width:100%;margin-top:8px">Unlock</button><div id="loginMsg" class="muted"></div></div></div><main class="shell"><header class="top"><div><h1>People Analyzer</h1><div class="muted">Analyze BGG credits and save outreach contacts.</div></div></header><section class="panel"><div class="grid"><input id="username" class="ctl" value="sportomax"><select id="domain" class="ctl"><option value="publishers">Publisher</option><option value="designers">Designer</option><option value="artists">Artist</option><option value="designers+publishers">Designer + Publisher</option><option value="artists+publishers">Artist + Publisher</option><option value="designers+artists">Designer + Artist</option><option value="designers+artists+publishers">Designer + Artist + Publisher</option></select><select id="scope" class="ctl"><option value="all">All listed</option><option value="first">First listed only</option></select><button id="run" class="btn primary">Load / Refresh BGG Data</button></div><div id="status" class="muted" style="margin-top:8px">Ready.</div></section><section class="panel"><div class="head"><b>Filters</b></div><div class="filters" id="filters"><label><input type="checkbox" value="own">Owned</label><label><input type="checkbox" value="prevowned">Previously owned</label><label><input type="checkbox" value="fortrade">For trade</label><label><input type="checkbox" value="want">Want</label><label><input type="checkbox" value="wanttoplay">Want to play</label><label><input type="checkbox" value="wanttobuy">Want to buy</label><label><input type="checkbox" value="wishlist">Wishlist</label><label><input type="checkbox" value="preordered">Preordered</label></div></section><section id="summary" class="panel summary" hidden></section><div id="workspace" hidden><nav class="tabs"><button class="btn tab active" data-view="ranking">Ranking</button><button class="btn tab" data-view="insights">Visual Insights</button><button class="btn tab" data-view="matrix">Cross-Analysis Matrix</button><button class="btn tab" data-view="contacts">Saved Contacts <span id="contactCount"></span></button></nav><div id="rankingView"><div class="row"><input id="search" class="ctl" placeholder="Search people…"><select id="minGames" class="ctl" style="max-width:120px"><option value="1">1+ games</option><option value="2">2+ games</option><option value="3">3+ games</option><option value="5">5+ games</option></select></div><section class="panel" style="padding:0"><div id="rows"></div></section></div><div id="insightsView" class="hidden"></div><div id="matrixView" class="hidden"></div><div id="contactsView" class="hidden"><section class="panel"><div class="head"><h2>Saved Contacts</h2><button id="refreshContacts" class="btn">Refresh</button></div><input id="contactSearch" class="ctl" placeholder="Search saved contacts…"><div id="contacts"></div></section></div></div></main><div id="drawerBg" class="drawerBg"><aside class="drawer"><div class="head"><span class="muted">DETAIL</span><button id="closeDrawer" class="btn">Close</button></div><div id="drawerContent"></div></aside></div><script>
const API='/api/bgg-helper',U='https://jadyqyrpgcmaixroizov.supabase.co',K='sb_publishable_1aiH7EnJyY7XtXYVbSWvjg_NIBK0kYz',DB='bggPeopleCache',STORE='datasets';let games=[],rows=[],saved=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=v=>Number(v)||0,wait=ms=>new Promise(r=>setTimeout(r,ms));
async function unlock(){let p=$('pw').value,c=await fetch('/api/get-password').then(r=>r.text()).catch(()=>null);if(!c||p!==c){$('loginMsg').textContent='Invalid access key';return}localStorage.setItem('app_password_hint',p);$('login').classList.add('hidden');await loadContacts();await loadCache()}$('unlock').onclick=unlock;$('pw').onkeydown=e=>e.key==='Enter'&&unlock();$('pw').value=localStorage.getItem('app_password_hint')||'';
async function api(endpoint,params={},tries=6){let r=await fetch(API+'?endpoint='+encodeURIComponent(endpoint)+'&'+new URLSearchParams(params));if(r.status===202&&tries){await wait(1800);return api(endpoint,params,tries-1)}let t=await r.text();if(!r.ok)throw Error(t);return t}async function sb(path,opt={}){let r=await fetch(`${U}/rest/v1/${path}`,{...opt,headers:{apikey:K,Authorization:`Bearer ${K}`,'Content-Type':'application/json',...(opt.headers||{})}});let t=await r.text();if(!r.ok)throw Error(t||`Supabase ${r.status}`);return t?JSON.parse(t):[]}
function db(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function cacheSet(k,v){let d=await db();return new Promise((ok,no)=>{let t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})}async function cacheGet(k){let d=await db();return new Promise((ok,no)=>{let r=d.transaction(STORE).objectStore(STORE).get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function credits(it,type){return [...it.querySelectorAll(`link[type="${type}"]`)].map(x=>({type,id:x.getAttribute('id'),name:x.getAttribute('value')}))}function parseCollection(xml){let d=new DOMParser().parseFromString(xml,'text/xml');return [...d.querySelectorAll('item')].map(i=>{let s=i.querySelector('status'),f=n=>num(s?.getAttribute(n));return{id:i.getAttribute('objectid'),title:i.querySelector('name')?.textContent||'',image:i.querySelector('thumbnail')?.textContent||'',status:{own:f('own'),prevowned:f('prevowned'),fortrade:f('fortrade'),want:f('want'),wanttoplay:f('wanttoplay'),wanttobuy:f('wanttobuy'),wishlist:f('wishlist'),preordered:f('preordered')}}})}function parseThings(xml,map){let d=new DOMParser().parseFromString(xml,'text/xml');return [...d.querySelectorAll('item')].map(i=>{let id=i.getAttribute('id'),b=map.get(id)||{},r=i.querySelector('statistics ratings');return{id,title:i.querySelector('name[type="primary"]')?.getAttribute('value')||b.title,image:i.querySelector('thumbnail')?.textContent||b.image,status:b.status||{},rating:num(r?.querySelector('average')?.getAttribute('value')),weight:num(r?.querySelector('averageweight')?.getAttribute('value')),designers:credits(i,'boardgamedesigner'),artists:credits(i,'boardgameartist'),publishers:credits(i,'boardgamepublisher')}})}
function parts(){return $('domain').value.split('+')}function label(p){return p==='designers'?'Designer':p==='artists'?'Artist':'Publisher'}function filtered(){let s=[...document.querySelectorAll('#filters input:checked')].map(x=>x.value);return games.filter(g=>!s.length||s.some(x=>g.status[x]))}function combos(g){let ps=parts(),lists=ps.map(p=>$('scope').value==='first'?g[p].slice(0,1):g[p]);if(lists.some(x=>!x.length))return[];let a=[[]];for(let l of lists)a=a.flatMap(pre=>l.map(x=>[...pre,x]));return a.map(x=>({id:x.map(p=>p.type+':'+p.id).join('|'),name:x.map(p=>p.name).join(' + '),people:x}))}function build(gs){let m=new Map;for(let g of gs)for(let p of combos(g)){if(!m.has(p.id))m.set(p.id,{...p,games:[]});m.get(p.id).games.push(g)}return [...m.values()]}
function render(){let gs=filtered();rows=build(gs);$('summary').hidden=false;$('workspace').hidden=false;$('summary').innerHTML=`<div class="metric"><span class="muted">Games shown</span><b>${gs.length}</b></div><div class="metric"><span class="muted">Groups</span><b>${rows.length}</b></div><div class="metric"><span class="muted">Matches</span><b>${rows.reduce((n,r)=>n+r.games.length,0)}</b></div><div class="metric"><span class="muted">Repeat credits</span><b>${rows.filter(r=>r.games.length>1).length}</b></div>`;renderRanking();renderInsights(gs);renderMatrix(gs)}function renderRanking(){let q=$('search').value.toLowerCase(),min=num($('minGames').value);let a=rows.filter(r=>(!q||r.name.toLowerCase().includes(q))&&r.games.length>=min).sort((a,b)=>b.games.length-a.games.length);$('rows').innerHTML=a.map((r,i)=>`<article class="person" data-rid="${esc(r.id)}"><div class="personMain"><div class="rank">${i+1}</div><div><b>${esc(r.name)}</b><div class="sub">${r.people.map(p=>`${p.type.replace('boardgame','')} ID ${p.id}`).join(' · ')}</div></div><div><b>${r.games.length}</b><div class="sub">games</div></div><div class="covers">${r.games.slice(0,5).map(g=>g.image?`<button class="thumb" data-bgg="${g.id}" title="Open on BGG"><img class="cover" src="${esc(g.image)}"></button>`:'').join('')}</div><div>⌄</div></div><div class="expanded">${r.games.map(g=>`<div class="gamePill">${g.image?`<button class="thumb" data-bgg="${g.id}"><img src="${esc(g.image)}"></button>`:''}<button class="gameTitle" data-game="${g.id}">${esc(g.title)}</button></div>`).join('')}</div></article>`).join('')||'<div class="panel">No matches.</div>';document.querySelectorAll('.personMain').forEach(x=>x.onclick=e=>{if(e.target.closest('[data-bgg]'))return;let p=x.closest('.person');p.classList.toggle('open');openPerson(p.dataset.rid)});bindGameActions()}
function bindGameActions(){document.querySelectorAll('[data-bgg]').forEach(b=>b.onclick=e=>{e.stopPropagation();window.open(`https://boardgamegeek.com/boardgame/${b.dataset.bgg}`,'_blank')});document.querySelectorAll('[data-game]').forEach(b=>b.onclick=e=>{e.stopPropagation();openGame(b.dataset.game)})}
function creditHtml(p,g){let key=p.type+':'+p.id,yes=saved.some(c=>c.bgg_type===p.type&&String(c.bgg_id)===String(p.id));return `<div class="credit"><div><b>${esc(p.name)}</b><div><span class="badge">${p.type.replace('boardgame','')}</span> <span class="id">BGG ID ${p.id}</span></div></div><button class="btn ${yes?'good':''}" data-add="${esc(key)}" data-source="${g?.id||''}">${yes?'Saved ✓':'Add to Contacts'}</button></div>`}function bindAdds(){document.querySelectorAll('[data-add]').forEach(b=>b.onclick=async()=>{b.disabled=true;let [type,id]=b.dataset.add.split(':'),p=null,g=games.find(x=>String(x.id)===String(b.dataset.source));for(let x of games){p=[...x.designers,...x.artists,...x.publishers].find(y=>y.type===type&&String(y.id)===id);if(p)break}if(!p){b.textContent='Not found';b.disabled=false;return}try{await addContact(p,g);b.textContent='Saved ✓';b.classList.add('good')}catch(e){b.textContent='Save failed';alert('Could not save contact: '+e.message)}finally{b.disabled=false}})}
function openPerson(id){let r=rows.find(x=>x.id===id);if(!r)return;$('drawerContent').innerHTML=`<h2>${esc(r.name)}</h2><h3>Contacts</h3>${r.people.map(p=>creditHtml(p,r.games[0])).join('')}<h3>Games</h3>${r.games.map(g=>`<div class="gameCard">${g.image?`<button class="thumb" data-bgg="${g.id}"><img src="${esc(g.image)}"></button>`:'<div></div>'}<div><button class="gameTitle" data-game="${g.id}">${esc(g.title)}</button><div class="sub">Click title for all designers, artists & publishers</div></div></div>`).join('')}`;$('drawerBg').classList.add('open');bindAdds();bindGameActions()}
function openGame(id){let g=games.find(x=>String(x.id)===String(id));if(!g)return;$('drawerContent').innerHTML=`<div class="gameHero">${g.image?`<button class="thumb" data-bgg="${g.id}"><img src="${esc(g.image)}"></button>`:''}<div><h2>${esc(g.title)}</h2><div class="sub">BGG game #${g.id} · thumbnail opens BGG</div></div></div><h3>Designers</h3>${g.designers.map(p=>creditHtml(p,g)).join('')||'<div class="muted">None listed</div>'}<h3>Artists</h3>${g.artists.map(p=>creditHtml(p,g)).join('')||'<div class="muted">None listed</div>'}<h3>Publishers</h3>${g.publishers.map(p=>creditHtml(p,g)).join('')||'<div class="muted">None listed</div>'}`;$('drawerBg').classList.add('open');bindAdds();bindGameActions()}
async function addContact(p,g){await sb('bg_contact?on_conflict=bgg_type,bgg_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify({bgg_type:p.type,bgg_id:Number(p.id),name:p.name,source_game_id:g?Number(g.id):null,source_game_name:g?.title||null})});await loadContacts()}async function loadContacts(){saved=await sb('bg_contact?select=*&order=updated_at.desc');$('contactCount').textContent=`(${saved.length})`;renderContacts()}function renderContacts(){let q=($('contactSearch').value||'').toLowerCase(),a=saved.filter(c=>!q||[c.name,c.email,c.bgg_username,c.bgg_type,c.bgg_id].some(v=>String(v||'').toLowerCase().includes(q)));$('contacts').innerHTML=a.map(c=>`<div class="contact" data-cid="${c.id}"><div class="head"><div><b>${esc(c.name)}</b><div><span class="badge">${esc(c.bgg_type.replace('boardgame',''))}</span> <span class="id">BGG ID ${c.bgg_id}</span></div></div><button class="btn danger" data-del="${c.id}">Delete</button></div><div class="contactGrid"><input class="ctl" data-f="email" value="${esc(c.email||'')}" placeholder="Email"><input class="ctl" data-f="bgg_username" value="${esc(c.bgg_username||'')}" placeholder="BGG username"><textarea class="ctl full" data-f="notes" placeholder="Notes">${esc(c.notes||'')}</textarea><button class="btn primary full" data-save="${c.id}">Save changes</button></div></div>`).join('')||'<div class="muted" style="padding:20px">No saved contacts.</div>';document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{let e=document.querySelector(`[data-cid="${b.dataset.save}"]`),body={};e.querySelectorAll('[data-f]').forEach(x=>body[x.dataset.f]=x.value.trim()||null);await sb(`bg_contact?id=eq.${b.dataset.save}`,{method:'PATCH',body:JSON.stringify(body)});await loadContacts()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Delete contact?')){await sb(`bg_contact?id=eq.${b.dataset.del}`,{method:'DELETE'});await loadContacts()}})}
function renderInsights(gs){let a=[...rows].sort((x,y)=>y.games.length-x.games.length).slice(0,15);$('insightsView').innerHTML=`<section class="panel"><h2>Top credits</h2>${a.map(x=>`<div class="row" style="padding:7px 0;border-bottom:1px solid var(--l)"><span>${esc(x.name)}</span><b>${x.games.length}</b></div>`).join('')}</section>`}function renderMatrix(gs){if(parts().length<2){$('matrixView').innerHTML='<section class="panel muted">Choose a combined Analyze By mode for cross-analysis.</section>';return}$('matrixView').innerHTML=`<section class="panel"><h2>Cross-Analysis</h2><div class="muted">${rows.length} current combinations. Select a ranking row for game and contact detail.</div></section>`}
async function analyze(){let user=$('username').value.trim();if(!user)return;$('run').disabled=true;$('status').textContent='Loading collection…';try{let coll=parseCollection(await api('collection',{username:user,stats:1,excludesubtype:'boardgameaccessory'})),map=new Map(coll.map(x=>[x.id,x])),out=[];for(let i=0;i<coll.length;i+=20){$('status').textContent=`Loading game details ${Math.min(i+20,coll.length)} / ${coll.length}`;out.push(...parseThings(await api('thing',{id:coll.slice(i,i+20).map(x=>x.id).join(','),stats:1}),map))}games=out;await cacheSet(user.toLowerCase(),{at:Date.now(),games});render();$('status').textContent=`Loaded ${games.length} games.`}catch(e){$('status').innerHTML=`<span class="error">${esc(e.message)}</span>`}finally{$('run').disabled=false}}async function loadCache(){try{let c=await cacheGet($('username').value.trim().toLowerCase());if(c?.games?.length){games=c.games;render();$('status').textContent=`Loaded ${games.length} cached games.`}}catch{}}
$('run').onclick=analyze;$('search').oninput=renderRanking;$('minGames').onchange=renderRanking;$('domain').onchange=render;$('scope').onchange=render;document.querySelectorAll('#filters input').forEach(x=>x.onchange=render);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));['ranking','insights','matrix','contacts'].forEach(v=>$(v+'View').classList.toggle('hidden',v!==b.dataset.view));if(b.dataset.view==='contacts')loadContacts()});$('contactSearch').oninput=renderContacts;$('refreshContacts').onclick=loadContacts;$('closeDrawer').onclick=()=>$('drawerBg').classList.remove('open');$('drawerBg').onclick=e=>{if(e.target===$('drawerBg'))$('drawerBg').classList.remove('open')};
</script></body></html>
