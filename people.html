<body>
<main class="shell">
<header class="top"><div class="brand"><div class="mark">P</div><div><h1>People Analyzer</h1><small>BGG collection credit intelligence</small></div></div><div class="command"><div class="field"><label>BGG USERNAME</label><input class="control" id="username" value="sportomax" autocomplete="off"></div><div class="field"><label>ANALYZE BY</label><select class="control" id="domain"><option value="publishers">Publisher</option><option value="designers">Designer</option><option value="artists">Artist</option><option value="designers+publishers">Designer + Publisher</option><option value="artists+publishers">Artist + Publisher</option><option value="designers+artists">Designer + Artist</option><option value="designers+artists+publishers">Designer + Artist + Publisher</option></select></div><div class="field"><label>EVALUATION MODE</label><select class="control" id="scope"><option value="all">All listed credits</option><option value="first">First listed only</option></select></div><div class="runWrap"><button class="primary" id="run">Load / Refresh BGG</button></div></div><button class="ghost" id="logBtn">View Log</button></header>
<div class="statusRow"><span id="status">Checking IndexedDB cache…</span><span id="cacheState">Not loaded</span><button class="tiny ghost" id="clearCache">Clear cache</button><div class="progress"><i id="progress"></i></div></div>
<section class="panel filtersPanel" id="filterPanel"><div class="sectionHead"><h2>Filters</h2><div class="filterTools"><span class="badge" id="filterBadge"></span><button class="tiny" id="filterCollapse">Hide filters</button></div></div><div class="filterBody" id="filterBody"><div class="filters" id="filters"><label class="chip"><input type="checkbox" value="own"><span>Owned</span></label><label class="chip"><input type="checkbox" value="prevowned"><span>Previously owned</span></label><label class="chip"><input type="checkbox" value="fortrade"><span>For trade</span></label><label class="chip"><input type="checkbox" value="want"><span>Want</span></label><label class="chip"><input type="checkbox" value="wanttoplay"><span>Want to play</span></label><label class="chip"><input type="checkbox" value="wanttobuy"><span>Want to buy</span></label><label class="chip"><input type="checkbox" value="wishlist"><span>Wishlist</span></label><label class="chip"><input type="checkbox" value="preordered"><span>Preordered</span></label></div><div class="advanced"><div class="field"><label>YEAR FROM</label><input class="control af" id="yearMin" type="number" placeholder="Any"></div><div class="field"><label>YEAR TO</label><input class="control af" id="yearMax" type="number" placeholder="Any"></div><div class="field"><label>MIN BGG RATING</label><input class="control af" id="ratingMin" type="number" min="0" max="10" step=".1" placeholder="Any"></div><div class="field"><label>MAX WEIGHT</label><input class="control af" id="weightMax" type="number" min="0" max="5" step=".1" placeholder="Any"></div><div class="field"><label>MIN PLAYERS</label><input class="control af" id="playersMin" type="number" min="1" placeholder="Any"></div><div class="field"><label>MAX PLAYERS</label><input class="control af" id="playersMax" type="number" min="1" placeholder="Any"></div></div></div></section>
<div class="resultsStrip hidden" id="resultsStrip"><section class="summary" id="summary"></section><nav class="tabs"><button class="tab active" data-view="ranking">Ranking</button><button class="tab" data-view="insights">Insights</button><button class="tab" data-view="matrix">Matrix</button></nav></div>
<div class="workspaceGrid hidden" id="workspaceGrid"><div><section class="panel ranking" id="rankingView"><div class="rankHeader"><div class="rankTitleWrap"><h2 id="rankTitle">Ranking</h2><div class="sub" id="resultCount"></div><div class="headerActions"><button class="tiny" id="densityBtn">Compact</button><button class="tiny" id="railBtn">Hide insights</button></div></div><div class="toolbar"><input class="control search" id="search" placeholder="Search people or games…"><input class="control" id="minGames" type="number" min="1" value="1" title="Minimum games"><select class="control" id="sort"><option value="count">Most games</option><option value="name">Name A–Z</option><option value="rating">Best avg rating</option></select></div></div><div id="rows"></div></section><div class="hidden" id="insightsView"></div><div class="hidden" id="matrixView"></div></div><aside class="rail" id="rail"><section class="panel railCard"><h3>Credit concentration</h3><div class="conTop"><span>Top 10 share</span><b id="top10Pct">—</b></div><div class="stacked"><i id="top10Bar"></i></div><div class="conLegend"><div><small>Top 10</small><b id="top10Count">—</b></div><div><small>Everyone else</small><b id="otherCount">—</b></div></div></section><section class="panel railCard"><h3>Highlights</h3><div class="highlights" id="highlights"><div class="highlight"><small>Load a collection to see analytics.</small></div></div></section></aside></div>
</main>
<div class="modal" id="logModal"><div class="modalBox"><div class="modalTop"><div><b>People Analyzer Log</b><div class="sub">BGG/API/cache diagnostics</div></div><button class="ghost" id="closeLog">Close</button></div><pre class="console" id="console"></pre></div></div>
<div class="drawerBackdrop" id="drawerBackdrop"><aside class="drawer"><div class="drawerTop"><div><b>Details</b></div><button class="ghost" id="closeDrawer">Close</button></div><div id="drawerContent"></div></aside></div>
<script>
(()=>{'use strict';const API='/api/bgg-helper',BATCH=20,MAX_PARALLEL=10,DB='bggPeopleCache',STORE='datasets';let loadedGames=[],allRows=[],currentView='ranking';const $=id=>document.getElementById(id),wait=ms=>new Promise(r=>setTimeout(r,ms)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=v=>{const n=Number(v);return Number.isFinite(n)?n:0},fmt=new Intl.NumberFormat('en-US');
function log(m){const line='['+new Date().toLocaleTimeString()+'] '+m;$('console').textContent+=($('console').textContent?'\n':'')+line;$('console').scrollTop=$('console').scrollHeight}function prog(n){$('progress').style.width=Math.max(0,Math.min(100,n))+'%'}function bggLink(g){return'https://boardgamegeek.com/boardgame/'+encodeURIComponent(g.id)}function gameAnchor(g,body,cls='gameLink'){return'<a class="'+cls+'" href="'+bggLink(g)+'" target="_blank" rel="noopener" data-game-link="1" title="Open '+esc(g.title)+' on BoardGameGeek">'+body+'</a>'}function avg(items,key){const vals=items.map(x=>num(x[key])).filter(v=>v>0);return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0}function median(values){const a=[...values].filter(Number.isFinite).sort((x,y)=>x-y);if(!a.length)return 0;const m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2}
function openDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}async function cacheSet(key,value){const db=await openDb();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(value,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}async function cacheGet(key){const db=await openDb();return new Promise((resolve,reject)=>{const req=db.transaction(STORE).objectStore(STORE).get(key);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}async function cacheDelete(key){const db=await openDb();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function api(endpoint,params={},retries=5){const qs=new URLSearchParams({endpoint,...params}),url=API+'?'+qs.toString();log('GET '+endpoint+(params.id?' ['+String(params.id).split(',').length+' ids]':''));const res=await fetch(url,{cache:'no-store'}),text=await res.text();if(res.status===202&&retries>0){log('BGG queued request; retrying.');await wait(2000);return api(endpoint,params,retries-1)}if(!res.ok)throw new Error('API '+res.status+': '+text.slice(0,240));return text}
function parseCollection(xml){const doc=new DOMParser().parseFromString(xml,'text/xml');if(doc.querySelector('parsererror'))throw new Error('Could not parse BGG collection response.');return[...doc.querySelectorAll('item')].map(it=>{const status=it.querySelector('status'),flag=name=>num(status?.getAttribute(name));return{id:it.getAttribute('objectid')||it.getAttribute('id'),title:it.querySelector('name')?.textContent||'',image:it.querySelector('thumbnail')?.textContent||'',personalRating:num(it.querySelector('stats rating')?.getAttribute('value')),numPlays:num(it.querySelector('numplays')?.textContent),status:{own:flag('own'),prevowned:flag('prevowned'),fortrade:flag('fortrade'),want:flag('want'),wanttoplay:flag('wanttoplay'),wanttobuy:flag('wanttobuy'),wishlist:flag('wishlist'),preordered:flag('preordered')}}}).filter(x=>x.id)}function credits(item,type){return[...item.querySelectorAll('link[type="'+type+'"]')].map(link=>({id:link.getAttribute('id'),name:link.getAttribute('value')})).filter(x=>x.id&&x.name)}function parseThings(xml,collectionMap){const doc=new DOMParser().parseFromString(xml,'text/xml');if(doc.querySelector('parsererror'))throw new Error('Could not parse BGG thing response.');return[...doc.querySelectorAll('item')].map(it=>{const id=it.getAttribute('id'),base=collectionMap.get(id)||{},ratings=it.querySelector('statistics ratings');return{id,title:it.querySelector('name[type="primary"]')?.getAttribute('value')||base.title||'Unknown',image:it.querySelector('thumbnail')?.textContent||it.querySelector('image')?.textContent||base.image||'',status:base.status||{},personalRating:base.personalRating||0,numPlays:base.numPlays||0,year:num(it.querySelector('yearpublished')?.getAttribute('value')),minPlayers:num(it.querySelector('minplayers')?.getAttribute('value')),maxPlayers:num(it.querySelector('maxplayers')?.getAttribute('value')),rating:num(ratings?.querySelector('average')?.getAttribute('value')),weight:num(ratings?.querySelector('averageweight')?.getAttribute('value')),publishers:credits(it,'boardgamepublisher'),designers:credits(it,'boardgamedesigner'),artists:credits(it,'boardgameartist')}})}async function pool(chunks,worker){let next=0,done=0;const out=new Array(chunks.length);async function runner(){while(true){const i=next++;if(i>=chunks.length)return;try{out[i]=await worker(chunks[i])}catch(error){out[i]=[];log('Batch '+(i+1)+' failed: '+error.message)}done++;prog(15+80*done/Math.max(1,chunks.length));$('status').textContent='Loading game details '+done+' / '+chunks.length}}await Promise.all(Array.from({length:Math.min(MAX_PARALLEL,chunks.length||1)},runner));return out.flat()}
function activeStatuses(){return[...document.querySelectorAll('#filters input:checked')].map(x=>x.value)}function parts(){return $('domain').value.split('+')}function singular(d){return d==='designers'?'Designer':d==='artists'?'Artist':'Publisher'}function domainLabel(){return parts().map(singular).join(' + ')}function filteredGames(){const statuses=activeStatuses(),y0=num($('yearMin').value),y1=num($('yearMax').value),r0=num($('ratingMin').value),w1=num($('weightMax').value),p0=num($('playersMin').value),p1=num($('playersMax').value);return loadedGames.filter(g=>(!statuses.length||statuses.some(s=>g.status?.[s]))&&(!y0||g.year>=y0)&&(!y1||g.year<=y1)&&(!r0||g.rating>=r0)&&(!w1||g.weight<=w1)&&(!p0||g.maxPlayers>=p0)&&(!p1||g.minPlayers<=p1))}function combos(game){const ps=parts(),first=$('scope').value==='first',lists=ps.map(p=>first?(game[p]||[]).slice(0,1):(game[p]||[]));if(lists.some(list=>!list.length))return[];let result=[[]];for(const list of lists)result=result.flatMap(pre=>list.map(person=>[...pre,person]));return result.map(group=>({id:group.map((person,i)=>ps[i]+':'+person.id).join('|'),name:group.map(person=>person.name).join(' + '),people:group}))}function buildRows(games){const map=new Map();for(const game of games)for(const group of combos(game)){if(!map.has(group.id))map.set(group.id,{...group,games:[]});const row=map.get(group.id);if(!row.games.some(x=>x.id===game.id))row.games.push(game)}return[...map.values()]}
function filterCount(){let n=activeStatuses().length;['yearMin','yearMax','ratingMin','weightMax','playersMin','playersMax'].forEach(id=>{if($(id).value!=='')n++});$('filterBadge').textContent=n||'';$('filterBadge').classList.toggle('show',n>0)}function render(){if(!loadedGames.length){$('resultsStrip').classList.add('hidden');$('workspaceGrid').classList.add('hidden');return}const games=filteredGames();allRows=buildRows(games);const matches=allRows.reduce((sum,row)=>sum+row.games.length,0),repeats=allRows.filter(row=>row.games.length>1).length;$('summary').innerHTML='<div class="metric"><small>Games shown</small><b>'+fmt.format(games.length)+'</b></div><div class="metric"><small>'+esc(domainLabel())+' groups</small><b>'+fmt.format(allRows.length)+'</b></div><div class="metric"><small>Matches counted</small><b>'+fmt.format(matches)+'</b></div><div class="metric"><small>Repeat credits</small><b>'+fmt.format(repeats)+'</b></div>';$('resultsStrip').classList.remove('hidden');$('workspaceGrid').classList.remove('hidden');renderRanking();renderInsights(games);renderMatrix(games);renderRail(games,matches,repeats);$('status').textContent=fmt.format(games.length)+' games in current view.';filterCount()}
function rankingRows(){let rows=[...allRows];const q=$('search').value.trim().toLowerCase(),min=Math.max(1,num($('minGames').value)||1);if(q)rows=rows.filter(row=>row.name.toLowerCase().includes(q)||row.games.some(g=>g.title.toLowerCase().includes(q)));rows=rows.filter(row=>row.games.length>=min);const sort=$('sort').value;if(sort==='name')rows.sort((a,b)=>a.name.localeCompare(b.name));else if(sort==='rating')rows.sort((a,b)=>avg(b.games,'rating')-avg(a.games,'rating')||b.games.length-a.games.length);else rows.sort((a,b)=>b.games.length-a.games.length||a.name.localeCompare(b.name));return rows}function renderRanking(){const rows=rankingRows(),max=rows[0]?.games.length||1;$('rankTitle').textContent='Ranking — '+domainLabel();$('resultCount').textContent=fmt.format(rows.length)+' results';$('rows').innerHTML=rows.length?rows.map((row,i)=>{const covers=row.games.slice(0,5).map(g=>g.image?gameAnchor(g,'<img class="cover" src="'+esc(g.image)+'" loading="lazy" decoding="async">'):'').join('');return'<article class="person" data-id="'+esc(row.id)+'"><div class="personMain" role="button" tabindex="0" aria-label="Open details for '+esc(row.name)+'"><div class="rank '+(i<3?'top':'')+'">'+(i+1)+'</div><div><div class="personName">'+esc(row.name)+'</div><div class="bar"><i style="width:'+Math.max(2,row.games.length/max*100)+'%"></i></div></div><div class="gameCount"><b>'+fmt.format(row.games.length)+'</b><small>games</small></div><div class="covers">'+covers+'</div><div aria-hidden="true">›</div></div></article>'}).join(''):'<div class="empty">No results match the current filters.</div>';document.querySelectorAll('.personMain').forEach(el=>{const activate=e=>{if(e.target.closest('[data-game-link]'))return;if(e.type==='keydown'&&!['Enter',' '].includes(e.key))return;if(e.type==='keydown')e.preventDefault();openDrawer(el.closest('.person').dataset.id)};el.onclick=activate;el.onkeydown=activate})}
function renderInsights(games){const rows=[...allRows].sort((a,b)=>b.games.length-a.games.length),top=rows.slice(0,10),max=top[0]?.games.length||1,years=games.map(g=>g.year).filter(Boolean),owned=games.filter(g=>g.status?.own).length,played=games.filter(g=>g.numPlays>0).length,personal=games.map(g=>g.personalRating).filter(v=>v>0);$('insightsView').innerHTML='<div class="insights"><section class="panel section"><h2>Top 10 — '+esc(domainLabel())+'</h2>'+(top.length?top.map(row=>'<div class="chartRow"><span title="'+esc(row.name)+'">'+esc(row.name)+'</span><span class="chartBar"><i style="width:'+(row.games.length/max*100)+'%"></i></span><b>'+fmt.format(row.games.length)+'</b></div>').join(''):'<div class="empty">No credits in this view.</div>')+'</section><section class="panel section"><h2>Collection intelligence</h2><div class="insightStats"><div class="insightStat"><span>Avg BGG rating</span><b>'+avg(games,'rating').toFixed(2)+'</b></div><div class="insightStat"><span>Avg complexity</span><b>'+avg(games,'weight').toFixed(2)+'</b></div><div class="insightStat"><span>Played ≥1</span><b>'+fmt.format(played)+'</b></div><div class="insightStat"><span>Owned</span><b>'+fmt.format(owned)+'</b></div><div class="insightStat"><span>Median year</span><b>'+(years.length?Math.round(median(years)):'—')+'</b></div><div class="insightStat"><span>Avg my rating</span><b>'+(personal.length?(personal.reduce((a,b)=>a+b,0)/personal.length).toFixed(2):'—')+'</b></div></div></section></div>'}
function renderMatrix(games){const ps=parts();if(ps.length<2){$('matrixView').innerHTML='<section class="panel empty">Choose a combined Analyze By mode to create a cross-analysis matrix.</section>';return}const a=ps[0],b=ps[1],aMap=new Map(),bMap=new Map(),cells=new Map(),first=$('scope').value==='first';for(const game of games){let aa=game[a]||[],bb=game[b]||[];if(first){aa=aa.slice(0,1);bb=bb.slice(0,1)}for(const x of aa)aMap.set(x.id,{...x,n:(aMap.get(x.id)?.n||0)+1});for(const y of bb)bMap.set(y.id,{...y,n:(bMap.get(y.id)?.n||0)+1});for(const x of aa)for(const y of bb)cells.set(x.id+'|'+y.id,(cells.get(x.id+'|'+y.id)||0)+1)}const A=[...aMap.values()].sort((x,y)=>y.n-x.n).slice(0,20),B=[...bMap.values()].sort((x,y)=>y.n-x.n).slice(0,15),mx=Math.max(1,...cells.values()),note=ps.length>2?'<div class="sub" style="margin-bottom:8px">Three-role ranking is active; matrix displays the first two dimensions.</div>':'';$('matrixView').innerHTML='<section class="panel section"><h2>'+singular(a)+' × '+singular(b)+'</h2>'+note+'<div class="matrixWrap"><table class="matrix"><thead><tr><th>'+singular(a)+'</th>'+B.map(y=>'<th>'+esc(y.name)+'</th>').join('')+'</tr></thead><tbody>'+A.map(x=>'<tr><td>'+esc(x.name)+'</td>'+B.map(y=>{const v=cells.get(x.id+'|'+y.id)||0;return'<td class="heat" style="--v:'+(v/mx)+'">'+(v||'')+'</td>'}).join('')+'</tr>').join('')+'</tbody></table></div></section>'}
function renderRail(games,matches,repeats){const rows=[...allRows].sort((a,b)=>b.games.length-a.games.length);if(!rows.length){$('top10Pct').textContent='—';$('top10Bar').style.width='0%';$('top10Count').textContent='—';$('otherCount').textContent='—';$('highlights').innerHTML='<div class="highlight"><small>No credits in the current view.</small></div>';return}const top10=rows.slice(0,10).reduce((sum,row)=>sum+row.games.length,0),denominator=matches||rows.reduce((sum,row)=>sum+row.games.length,0)||1,pct=Math.min(100,top10/denominator*100),other=Math.max(0,denominator-top10),leader=rows[0],runner=rows[1],singles=rows.filter(row=>row.games.length===1).length,med=median(rows.map(row=>row.games.length)),repeatRate=games.length?repeats/games.length*100:0;$('top10Pct').textContent=pct.toFixed(1)+'%';$('top10Bar').style.width=pct+'%';$('top10Count').textContent=fmt.format(top10)+' credits';$('otherCount').textContent=fmt.format(other)+' credits';const leadBy=runner?Math.max(0,leader.games.length-runner.games.length):0;$('highlights').innerHTML='<div class="highlight"><b>'+esc(leader.name)+' leads'+(runner?' by '+fmt.format(leadBy):'')+'</b><small>'+fmt.format(leader.games.length)+' counted credits</small></div><div class="highlight"><b>Top 10 = '+pct.toFixed(1)+'%</b><small>'+fmt.format(top10)+' of '+fmt.format(denominator)+' counted credits</small></div><div class="highlight"><b>Median = '+(Number.isInteger(med)?fmt.format(med):med.toFixed(1))+' games</b><small>'+fmt.format(singles)+' singletons · repeat-credit rate '+repeatRate.toFixed(1)+'%</small></div>'}
function openDrawer(id){const row=allRows.find(x=>x.id===id);if(!row)return;const games=[...row.games].sort((a,b)=>b.rating-a.rating||a.title.localeCompare(b.title));$('drawerContent').innerHTML='<h2 style="margin-bottom:2px">'+esc(row.name)+'</h2><div class="sub">'+esc(domainLabel())+' • '+fmt.format(games.length)+' games</div><div class="drawerStats"><div class="drawerStat"><span>Games</span><b>'+fmt.format(games.length)+'</b></div><div class="drawerStat"><span>Avg rating</span><b>'+avg(games,'rating').toFixed(2)+'</b></div><div class="drawerStat"><span>Avg weight</span><b>'+avg(games,'weight').toFixed(2)+'</b></div><div class="drawerStat"><span>Played</span><b>'+fmt.format(games.filter(g=>g.numPlays>0).length)+'</b></div></div><h3>Games</h3><div class="drawerGames">'+games.map(g=>gameAnchor(g,(g.image?'<img src="'+esc(g.image)+'" loading="lazy">':'')+'<div><b>'+esc(g.title)+'</b><small>'+(g.year||'Year ?')+' • '+(g.rating?g.rating.toFixed(1)+' BGG':'No rating')+' • '+(g.weight?g.weight.toFixed(1)+' weight':'No weight')+'</small></div>','drawerGame')).join('')+'</div>';$('drawerBackdrop').classList.add('open')}
async function analyze(){const user=$('username').value.trim();if(!user)return;$('run').disabled=true;prog(2);try{$('status').textContent='Loading full collection…';log('Loading collection for '+user);const coll=parseCollection(await api('collection',{username:user,stats:1,excludesubtype:'boardgameaccessory'}));if(!coll.length)throw new Error('No collection items returned for '+user+'.');log('Collection returned '+coll.length+' items.');prog(15);const map=new Map(coll.map(x=>[x.id,x])),chunks=[];for(let i=0;i<coll.length;i+=BATCH)chunks.push(coll.slice(i,i+BATCH).map(x=>x.id));loadedGames=await pool(chunks,async ids=>parseThings(await api('thing',{id:ids.join(','),stats:1}),map));if(!loadedGames.length)throw new Error('BGG returned no game details.');const saved={at:Date.now(),games:loadedGames};await cacheSet(user.toLowerCase(),saved);prog(100);$('cacheState').innerHTML='<span class="cache">IndexedDB • '+new Date(saved.at).toLocaleString()+'</span>';log('Cached '+loadedGames.length+' enriched games.');render()}catch(error){$('status').innerHTML='<span class="error">'+esc(error.message)+'</span>';log('ERROR: '+error.message);$('logModal').classList.add('open')}finally{$('run').disabled=false}}
async function loadCache(){const user=$('username').value.trim().toLowerCase();if(!user)return;try{const cached=await cacheGet(user);if(cached?.games?.length){loadedGames=cached.games;$('cacheState').innerHTML='<span class="cache">IndexedDB • '+new Date(cached.at).toLocaleString()+'</span>';$('status').textContent='Loaded '+fmt.format(loadedGames.length)+' cached games. Refresh when you want fresh BGG data.';prog(100);log('Loaded '+loadedGames.length+' games from IndexedDB.');render()}else{loadedGames=[];$('cacheState').textContent='Not loaded';$('status').textContent='Ready. Load BGG data once; filters are local after that.';prog(0);render()}}catch(error){$('status').textContent='Ready.';log('Cache unavailable: '+error.message)}}
let searchTimer;$('run').onclick=analyze;$('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(renderRanking,90)});['minGames','sort'].forEach(id=>$(id).addEventListener('change',renderRanking));['domain','scope'].forEach(id=>$(id).addEventListener('change',render));document.querySelectorAll('#filters input,.af').forEach(el=>el.addEventListener('change',render));$('filterCollapse').onclick=()=>{const hidden=$('filterBody').classList.toggle('hidden');$('filterCollapse').textContent=hidden?'Show filters':'Hide filters'};$('logBtn').onclick=()=>$('logModal').classList.add('open');$('closeLog').onclick=()=>$('logModal').classList.remove('open');$('logModal').onclick=e=>{if(e.target===$('logModal'))$('logModal').classList.remove('open')};$('closeDrawer').onclick=()=>$('drawerBackdrop').classList.remove('open');$('drawerBackdrop').onclick=e=>{if(e.target===$('drawerBackdrop'))$('drawerBackdrop').classList.remove('open')};document.querySelectorAll('.tab').forEach(btn=>btn.onclick=()=>{currentView=btn.dataset.view;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===btn));['ranking','insights','matrix'].forEach(v=>$(v+'View').classList.toggle('hidden',v!==currentView))});const comfortable=localStorage.getItem('peopleDensity')==='comfortable';document.documentElement.classList.toggle('comfortable',comfortable);$('densityBtn').textContent=comfortable?'Comfortable':'Compact';$('densityBtn').onclick=()=>{const next=!document.documentElement.classList.contains('comfortable');document.documentElement.classList.toggle('comfortable',next);$('densityBtn').textContent=next?'Comfortable':'Compact';localStorage.setItem('peopleDensity',next?'comfortable':'compact')};const style=document.createElement('style');style.textContent='.comfortable .personMain{padding-top:13px!important;padding-bottom:13px!important}.comfortable .cover{width:34px!important;height:45px!important}';document.head.append(style);const railHidden=localStorage.getItem('peopleInsightsRail')==='hidden';$('workspaceGrid').classList.toggle('railHidden',railHidden);$('railBtn').textContent=railHidden?'Show insights':'Hide insights';$('railBtn').onclick=()=>{const hidden=!$('workspaceGrid').classList.contains('railHidden');$('workspaceGrid').classList.toggle('railHidden',hidden);$('railBtn').textContent=hidden?'Show insights':'Hide insights';localStorage.setItem('peopleInsightsRail',hidden?'hidden':'shown')};$('clearCache').onclick=async()=>{const user=$('username').value.trim().toLowerCase();if(!user)return;await cacheDelete(user);loadedGames=[];$('cacheState').textContent='Not loaded';$('status').textContent='Cache cleared. Load BGG data to rebuild.';prog(0);render();log('Cleared IndexedDB cache for '+user)};$('username').addEventListener('change',()=>{loadedGames=[];$('resultsStrip').classList.add('hidden');$('workspaceGrid').classList.add('hidden');prog(0);loadCache()});loadCache()})();
