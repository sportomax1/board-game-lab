<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BGG Contact Finder</title><style>:root{--bg:#07111f;--panel:#0d1929;--line:#203149;--text:#f4f7fb;--muted:#91a0b5;--accent:#7c5cff;--good:#42d392}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,textarea{font:inherit}.hidden{display:none!important}.shell{max-width:900px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{margin:0;font-size:25px}.muted{color:var(--muted)}.panel{background:#0d1929;border:1px solid var(--line);border-radius:15px;padding:13px;margin:12px 0}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}.tab,.btn{border:1px solid var(--line);border-radius:10px;background:#111e2e;color:var(--text);min-height:42px;padding:0 14px;font-weight:750}.tab.active,.btn.primary{background:linear-gradient(135deg,var(--accent),#6336df);border-color:transparent}.btn.small{min-height:34px;padding:0 10px;font-size:12px}.btn.good{background:#123326;border-color:#245d47;color:#8af0bd}.btn.danger{background:#321722;border-color:#633040;color:#ff9bac}.searchrow{display:grid;grid-template-columns:1fr auto;gap:8px}.input{width:100%;height:44px;background:#081523;color:var(--text);border:1px solid #2b3d55;border-radius:10px;padding:0 12px;outline:none}textarea.input{height:80px;padding:10px}.game{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #1b2b40}.gameName,.personName{font-weight:800}.person{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:12px;background:#101e30;margin:7px 0}.badge{display:inline-block;font-size:10px;text-transform:uppercase;padding:3px 6px;border-radius:6px;background:#1b2c44;color:#b8c5d7;margin-right:6px}.id{font:11px ui-monospace,monospace;color:#a9b6c9}.contact{padding:12px;border:1px solid var(--line);border-radius:12px;background:#101e30;margin:8px 0}.contactHead{display:flex;justify-content:space-between;gap:8px}.contactGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.full{grid-column:1/-1}.status{font-size:12px;margin-top:8px}.login{position:fixed;inset:0;background:#050b14;z-index:50;display:grid;place-items:center;padding:20px}.loginbox{width:min(390px,100%);background:#0d1929;border:1px solid var(--line);border-radius:22px;padding:24px}.selected{display:flex;gap:12px;align-items:center}.selected img{width:70px;height:92px;object-fit:cover;border-radius:8px}.selected h2{margin:0}.thumbLink{text-decoration:none;color:inherit}.empty{text-align:center;color:var(--muted);padding:25px 8px}@media(max-width:560px){.shell{padding:9px}.panel{padding:10px}.contactGrid,.searchrow{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div id="login" class="login"><div class="loginbox"><h2>BGG Contact Finder</h2><p class="muted">Same access key as Checkout.</p><input id="pw" class="input" type="password" placeholder="Access key"><button id="unlock" class="btn primary" style="width:100%;margin-top:10px">Unlock</button><div id="loginStatus" class="status muted"></div></div></div><main class="shell"><header class="top"><div><h1>BGG Contact Finder</h1><div class="muted">Search games → find people → save contacts</div></div><button id="refresh" class="btn small">Refresh</button></header><div class="tabs"><button class="tab active" data-tab="finder">Find Contacts</button><button class="tab" data-tab="contacts">Saved Contacts <span id="count"></span></button></div><section id="finderTab"><div class="panel"><div class="searchrow"><input id="gameSearch" class="input" placeholder="Search BGG games…"><button id="searchBtn" class="btn primary">Search</button></div><div id="searchStatus" class="status muted"></div><div id="results"></div></div><div id="detail" class="panel hidden"></div></section><section id="contactsTab" class="hidden"><div class="panel"><div class="searchrow"><input id="contactSearch" class="input" placeholder="Search saved contacts…"><button id="manual" class="btn">+ Manual</button></div><div id="contacts"></div></div></section></main><script>const U='https://jadyqyrpgcmaixroizov.supabase.co',K='sb_publishable_1aiH7EnJyY7XtXYVbSWvjg_NIBK0kYz';let saved=[];const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function bgg(e,p={}){let q=new URLSearchParams(p),r=await fetch(`/api/bgg-helper?endpoint=${e}&${q}`);if(r.status===202){await new Promise(x=>setTimeout(x,1800));return bgg(e,p)}if(!r.ok)throw Error(`BGG HTTP ${r.status}`);return r.text()}async function sb(p,o={}){let r=await fetch(`${U}/rest/v1/${p}`,{...o,headers:{apikey:K,Authorization:`Bearer ${K}`,'Content-Type':'application/json',Prefer:'return=representation',...(o.headers||{})}});if(!r.ok)throw Error(await r.text());let t=await r.text();return t?JSON.parse(t):[]}async function unlock(){let p=$('#pw').value;$('#loginStatus').textContent='Checking…';let c=await fetch('/api/get-password').then(r=>r.text()).catch(()=>null);if(!c||p!==c){$('#loginStatus').textContent='Invalid access key';return}localStorage.setItem('app_password_hint',p);$('#login').classList.add('hidden');loadContacts()}$('#unlock').onclick=unlock;$('#pw').onkeydown=e=>e.key==='Enter'&&unlock();$('#pw').value=localStorage.getItem('app_password_hint')||'';function tab(n){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===n));$('#finderTab').classList.toggle('hidden',n!=='finder');$('#contactsTab').classList.toggle('hidden',n!=='contacts');if(n==='contacts')renderContacts()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>tab(b.dataset.tab));async function searchGames(){let q=$('#gameSearch').value.trim();if(!q)return;$('#searchStatus').textContent='Searching BGG…';try{let x=new DOMParser().parseFromString(await bgg('search',{query:q,type:'boardgame'}),'text/xml'),a=[...x.querySelectorAll('item')].slice(0,20).map(i=>({id:i.getAttribute('id'),name:i.querySelector('name')?.getAttribute('value')||'Untitled',year:i.querySelector('yearpublished')?.getAttribute('value')||''}));$('#searchStatus').textContent=`${a.length} results`;$('#results').innerHTML=a.map(g=>`<div class="game"><div><div class="gameName">${E(g.name)}</div><div class="muted">${E(g.year)} · BGG #${g.id}</div></div><button class="btn small" onclick="loadGame('${g.id}')">View</button></div>`).join('')||'<div class="empty">No games found.</div>'}catch(e){$('#searchStatus').textContent=e.message}}$('#searchBtn').onclick=searchGames;$('#gameSearch').onkeydown=e=>e.key==='Enter'&&searchGames();async function loadGame(id){$('#detail').classList.remove('hidden');$('#detail').innerHTML='<div class="empty">Loading…</div>';try{let x=new DOMParser().parseFromString(await bgg('thing',{id,stats:1}),'text/xml'),i=x.querySelector('item');if(!i)throw Error('Game not found');let n=i.querySelector('name[type="primary"]')?.getAttribute('value')||i.querySelector('name')?.getAttribute('value')||'Game',th=i.querySelector('thumbnail')?.textContent||'',ls=[...i.querySelectorAll('link')].filter(x=>['boardgamedesigner','boardgameartist','boardgamepublisher'].includes(x.getAttribute('type'))).map(x=>({type:x.getAttribute('type'),id:x.getAttribute('id'),name:x.getAttribute('value')})),lab={boardgamedesigner:'Designer',boardgameartist:'Artist',boardgamepublisher:'Publisher'};$('#detail').innerHTML=`<div class="selected">${th?`<a class="thumbLink" href="https://boardgamegeek.com/boardgame/${id}" target="_blank"><img src="${E(th)}"></a>`:''}<div><h2>${E(n)}</h2><div class="muted">BGG game #${id}</div><div class="muted">Only thumbnail links to BGG.</div></div></div><h3>Contacts</h3>${ls.map(p=>{let ex=saved.some(c=>c.bgg_type===p.type&&String(c.bgg_id)===String(p.id));return `<div class="person"><div><div class="personName">${E(p.name)}</div><span class="badge">${lab[p.type]}</span><span class="id">ID ${p.id}</span></div><button class="btn small ${ex?'good':''}" onclick='add(${JSON.stringify(JSON.stringify({...p,source_game_id:+id,source_game_name:n}))})'>${ex?'Saved ✓':'Add'}</button></div>`}).join('')||'<div class="empty">No linked contacts.</div>'}`;$('#detail').scrollIntoView({behavior:'smooth'})}catch(e){$('#detail').innerHTML=`<div class="empty">${E(e.message)}</div>`}}window.loadGame=loadGame;async function add(j){let p=JSON.parse(j);await sb('bg_contact?on_conflict=bgg_type,bgg_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify({bgg_type:p.type,bgg_id:+p.id,name:p.name,source_game_id:p.source_game_id||null,source_game_name:p.source_game_name||null})});await loadContacts();if(p.source_game_id)loadGame(String(p.source_game_id))}window.add=add;async function loadContacts(){try{saved=await sb('bg_contact?select=*&order=updated_at.desc');$('#count').textContent=`(${saved.length})`;renderContacts()}catch(e){$('#contacts').innerHTML=`<div class="empty">${E(e.message)}</div>`}}$('#refresh').onclick=loadContacts;function renderContacts(){let q=$('#contactSearch').value.toLowerCase().trim(),a=saved.filter(c=>!q||[c.name,c.email,c.bgg_username,c.bgg_type,c.bgg_id].some(v=>String(v||'').toLowerCase().includes(q)));$('#contacts').innerHTML=a.map(c=>`<div class="contact" data-id="${c.id}"><div class="contactHead"><div><div class="personName">${E(c.name)}</div><span class="badge">${E(c.bgg_type.replace('boardgame',''))}</span><span class="id">ID ${c.bgg_id}</span></div><button class="btn small danger" onclick="del(${c.id})">Delete</button></div><div class="contactGrid"><input class="input" data-f="email" value="${E(c.email||'')}" placeholder="Email"><input class="input" data-f="bgg_username" value="${E(c.bgg_username||'')}" placeholder="BGG username"><textarea class="input full" data-f="notes" placeholder="Notes">${E(c.notes||'')}</textarea><button class="btn primary full" onclick="save(${c.id})">Save changes</button></div>${c.source_game_name?`<div class="status muted">Found via ${E(c.source_game_name)} · #${c.source_game_id}</div>`:''}</div>`).join('')||'<div class="empty">No saved contacts.</div>'}$('#contactSearch').oninput=renderContacts;async function save(id){let e=document.querySelector(`.contact[data-id="${id}"]`),b={};e.querySelectorAll('[data-f]').forEach(x=>b[x.dataset.f]=x.value.trim()||null);await sb(`bg_contact?id=eq.${id}`,{method:'PATCH',body:JSON.stringify(b)});loadContacts()}window.save=save;async function del(id){if(confirm('Delete this contact?')){await sb(`bg_contact?id=eq.${id}`,{method:'DELETE'});loadContacts()}}window.del=del;$('#manual').onclick=async()=>{let name=prompt('Contact name');if(!name)return;let t=prompt('Type: designer, artist, or publisher','designer'),m={designer:'boardgamedesigner',artist:'boardgameartist',publisher:'boardgamepublisher'},id=prompt('BGG ID');if(!m[t]||!/^\d+$/.test(id||''))return alert('Invalid type or ID');await add(JSON.stringify({name,type:m[t],id:+id}));tab('contacts')};</script></body></html>
