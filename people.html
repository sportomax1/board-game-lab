<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes">
<title>BGG People Analyzer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#182033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:white;border:1px solid #e4e7ee;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 3px 14px #16213a0c}h1{margin:0 0 5px;font-size:26px}p{color:#667085}.controls{display:grid;grid-template-columns:1.2fr .8fr .9fr auto;gap:10px}input,select,button{min-height:44px;border-radius:11px;border:1px solid #d7dce5;padding:10px 12px;font-size:15px;background:white}button{background:#4f46e5;color:white;border:0;font-weight:700;cursor:pointer}.secondary{background:#eef0f5;color:#344054}.status{font-size:14px;color:#667085}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#f8f9fc;border-radius:12px;padding:12px}.metric b{display:block;font-size:22px}.person{display:grid;grid-template-columns:1fr auto;gap:10px;border-top:1px solid #edf0f5;padding:13px 0}.person:first-child{border-top:0}.name{font-weight:800}.small{font-size:12px;color:#7b8496}.bar{height:7px;background:#e9ecf2;border-radius:8px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:#4f46e5}.games{margin-top:5px;font-size:13px;color:#5d6678}.pill{display:inline-block;background:#eef2ff;color:#4338ca;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700;margin:2px}.error{color:#b42318}@media(max-width:760px){.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}.summary{grid-template-columns:1fr 1fr}.wrap{padding:12px}}@media(max-width:480px){.controls{grid-template-columns:1fr}.controls input{grid-column:auto}.person{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}}
</style>
</head><body><div class="wrap">
<div class="card"><h1>BGG People Analyzer</h1><p>Enter a BGG username, choose a domain, then compare the first credited entity on each game or every credited entity.</p>
<div class="controls"><input id="username" value="sportomax" placeholder="BGG username"><select id="domain"><option value="boardgamedesigner">Designer</option><option value="boardgameartist">Artist</option><option value="boardgamepublisher">Publisher</option></select><select id="scope"><option value="all">Evaluate all listed</option><option value="first">First listed only</option></select><button id="run" onclick="analyze()">Analyze</button></div><div id="status" class="status" style="margin-top:12px">Ready.</div></div>
<div id="summary" class="card" style="display:none"></div><div id="results" class="card" style="display:none"></div>
</div><script>
const API='/api/bgg-helper';const wait=ms=>new Promise(r=>setTimeout(r,ms));
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function get(endpoint,params,retries=5){const u=API+'?endpoint='+endpoint+'&'+new URLSearchParams(params);const r=await fetch(u);if(r.status===202&&retries){await wait(2500);return get(endpoint,params,retries-1)}if(!r.ok)throw new Error('API '+r.status);return r.text()}
async function analyze(){const btn=document.getElementById('run'),user=document.getElementById('username').value.trim(),domain=document.getElementById('domain').value,scope=document.getElementById('scope').value,status=document.getElementById('status');if(!user)return;btn.disabled=true;document.getElementById('summary').style.display='none';document.getElementById('results').style.display='none';try{
status.textContent='Loading collection…';const cx=await get('collection',{username:user,own:1,excludesubtype:'boardgameaccessory'});const cd=new DOMParser().parseFromString(cx,'text/xml');const ids=[...cd.querySelectorAll('item')].map(x=>x.getAttribute('objectid')).filter(Boolean);if(!ids.length)throw new Error('No owned games found.');
const map=new Map(),games=[];for(let i=0;i<ids.length;i+=20){status.textContent=`Loading game credits ${Math.min(i+20,ids.length)} / ${ids.length}…`;const tx=await get('thing',{id:ids.slice(i,i+20).join(','),stats:1});const td=new DOMParser().parseFromString(tx,'text/xml');for(const item of td.querySelectorAll('item')){const title=item.querySelector('name[type="primary"]')?.getAttribute('value')||'Unknown';let links=[...item.querySelectorAll(`link[type="${domain}"]`)];if(scope==='first')links=links.slice(0,1);const seen=new Set();for(const l of links){const id=l.getAttribute('id'),name=l.getAttribute('value');if(!id||seen.has(id))continue;seen.add(id);if(!map.has(id))map.set(id,{id,name,count:0,games:[]});const p=map.get(id);p.count++;p.games.push(title)}games.push(title)}if(i+20<ids.length)await wait(350)}
const people=[...map.values()].sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name));render(people,ids.length,domain,scope);status.textContent=`Done — evaluated ${people.length} unique ${label(domain).toLowerCase()}${people.length===1?'':'s'} across ${ids.length} games.`
}catch(e){status.innerHTML='<span class="error">'+esc(e.message)+'</span>'}finally{btn.disabled=false}}
function label(d){return d==='boardgamedesigner'?'Designer':d==='boardgameartist'?'Artist':'Publisher'}
function render(rows,total,domain,scope){const s=document.getElementById('summary'),r=document.getElementById('results'),max=rows[0]?.count||1,credits=rows.reduce((a,x)=>a+x.count,0),multi=rows.filter(x=>x.count>1).length;s.style.display='block';s.innerHTML=`<div class="summary"><div class="metric"><span class="small">Games scanned</span><b>${total}</b></div><div class="metric"><span class="small">Unique ${label(domain)}s</span><b>${rows.length}</b></div><div class="metric"><span class="small">Game credits counted</span><b>${credits}</b></div><div class="metric"><span class="small">On 2+ games</span><b>${multi}</b></div></div><p class="small" style="margin-bottom:0">Mode: ${scope==='all'?'all credited entities per game':'first credited entity per game'}.</p>`;r.style.display='block';r.innerHTML='<h2 style="margin-top:0">Ranking</h2>'+rows.map((x,i)=>`<div class="person"><div><div class="name">${i+1}. ${esc(x.name)}</div><div class="bar"><i style="width:${Math.max(3,x.count/max*100)}%"></i></div><div class="games">${x.games.slice(0,12).map(g=>`<span class="pill">${esc(g)}</span>`).join('')}${x.games.length>12?` <span class="small">+${x.games.length-12} more</span>`:''}</div></div><div><b>${x.count}</b> <span class="small">game${x.count===1?'':'s'}</span></div></div>`).join('')}
console.log('[people.html] rendered',rows.length,'entities')}
</script></body></html>
