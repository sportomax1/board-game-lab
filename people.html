<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BGG People Analyzer</title>
<style>
html,body{margin:0;min-height:100%;background:#07111f;color:#f4f7fb;font:14px/1.5 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot{min-height:100vh;display:grid;place-items:center}.bootCard{padding:18px 22px;border:1px solid #203149;border-radius:14px;background:#0d1929;color:#91a0b5}.bootCard b{display:block;color:#f4f7fb;margin-bottom:4px}
</style>
</head>
<body>
<div class="boot" id="boot"><div class="bootCard"><b>People Analyzer</b>Loading cached analyzer…</div></div>
<script>
(async()=>{
  try{
    const response=await fetch('./assets/people-core.txt',{cache:'no-cache'});
    if(!response.ok)throw new Error(`Could not load analyzer core (${response.status})`);
    let html=await response.text();
    const compact=`<style>
/* people-compact-v2 */
@media(min-width:1001px){
  .shell{max-width:1600px;padding:14px 22px}
  .top{margin-bottom:8px;align-items:center}
  .title h1{font-size:32px;margin:0 0 2px}
  .title p{font-size:12px}
  .top .ghost{min-height:34px;padding:0 11px}
  .panel{margin-bottom:8px;border-radius:13px}
  .setup,.section{padding:10px 12px}
  .grid{grid-template-columns:minmax(220px,1.05fr) minmax(200px,.9fr) minmax(200px,.9fr) auto;gap:8px}
  .field label{margin-bottom:3px;font-size:9px}
  .control{height:36px}
  .ghost,.primary{min-height:36px}
  .primary{padding:0 15px}
  .progressRow{margin-top:6px;font-size:10px}
  .progress{height:3px;margin-top:3px}
  .sectionHead h2{font-size:17px;margin:0}
  #filterBody{display:grid;grid-template-columns:minmax(500px,1fr) minmax(620px,1.2fr);gap:10px;align-items:end}
  .filters{margin-top:0;gap:4px}
  .chip span{padding:4px 7px;font-size:10px;border-radius:7px}
  .advanced{margin-top:0;gap:6px;grid-template-columns:repeat(6,minmax(85px,1fr))}
  .advanced .control{height:32px;padding:0 8px}
  .advanced .field label{font-size:8px}
  .summary{grid-template-columns:repeat(4,1fr)}
  .metric{padding:7px 11px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .metric small{font-size:10px}
  .metric b{font-size:19px;margin:0}
  .tabs{margin:7px 0 6px;gap:4px}
  .tab{min-height:32px;padding:0 10px;font-size:11px}
  .toolbar{margin-bottom:6px;gap:6px}
  .toolbar .control{height:34px}
  .toolbar .ghost{min-height:34px}
  .rankHeader{padding:8px 12px}
  .rankHeader h2{margin:0;font-size:18px}
}
@media(min-width:1001px) and (max-width:1250px){
  #filterBody{grid-template-columns:1fr}
  .advanced{grid-template-columns:repeat(6,minmax(85px,1fr))}
}
</style>`;
    html=html.replace('</head>',compact+'</head>');
    html=html.replace('Checking local cache…','Checking IndexedDB cache…');
    html=html.replaceAll('Cached ${new Date','IndexedDB • Cached ${new Date');
    html=html.replace('Ready. Load BGG data once; filters are then local.','Ready. Load BGG data once; results are stored in IndexedDB and filters run locally.');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.getElementById('boot').innerHTML=`<div class="bootCard"><b>People Analyzer failed to load</b>${String(error.message||error)}</div>`;
  }
})();
</script>
</body>
</html>
