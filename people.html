<script>
const API='/api/bgg-helper',BATCH=20,MAX_PARALLEL=100,DB='bggPeopleCache',STORE='datasets',U='https://jadyqyrpgcmaixroizov.supabase.co',K='sb_publishable_1aiH7EnJyY7XtXYVbSWvjg_NIBK0kYz';let loadedGames=[],allRows=[],saved=[];const $=id=>document.getElementById(id),wait=ms=>new Promise(r=>setTimeout(r,ms));function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function bgg(g){return `https://boardgamegeek.com/boardgame/${encodeURIComponent(g.id)}`}function log(m){$('console').textContent+=`\n[${new Date().toLocaleTimeString()}] ${m}`}function prog(n){$('progress').style.width=Math.max(0,Math.min(100,n))+'%'}
async function unlock(){const p=$('pw').value,c=await fetch('/api/get-password').then(r=>r.text()).catch(()=>null);if(!c||p!==c){$('loginStatus').textContent='Invalid access key';return}localStorage.setItem('app_password_hint',p);$('login').classList.add('hidden');loadContacts();loadCache()}$('unlock').onclick=unlock;$('pw').onkeydown=e=>e.key==='Enter'&&unlock();$('pw').value=localStorage.getItem('app_password_hint')||'';
async function sb(p,o={}){let r=await fetch(`${U}/rest/v1/${p}`,{...o,headers:{apikey:K,Authorization:`Bearer ${K}`,'Content-Type':'application/json',Prefer:'return=representation',...(o.headers||{})}});if(!r.ok)throw Error(await r.text());let t=await r.text();return t?JSON.parse(t):[]}async function loadContacts(){try{saved=await sb('bg_contact?select=*&order=updated_at.desc');$('contactCount').textContent=`(${saved.length})`;renderContacts()}catch(e){log('Contacts: '+e.message)}}function isSaved(type,id){return saved.some(c=>c.bgg_type===type&&String(c.bgg_id)===String(id))}async function addContact(p,g){await sb('bg_contact?on_conflict=bgg_type,bgg_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify({bgg_type:p.type,bgg_id:+p.id,name:p.name,source_game_id:g?+g.id:null,source_game_name:g?.title||null})});await loadContacts();openDrawer(allRows.find(r=>r.games.some(x=>x.id===g?.id)&&r.people.some(x=>x.id===p.id))?.id||allRows[0]?.id)}window.addContact=addContact;function renderContacts(){let q=($('contactSearch')?.value||'').toLowerCase(),a=saved.filter(c=>!q||[c.name,c.email,c.bgg_username,c.bgg_type,c.bgg_id].some(v=>String(v||'').toLowerCase().includes(q)));$('contacts').innerHTML=a.map(c=>`<div class="contact" data-cid="${c.id}"><div class="contactHead"><div><b>${esc(c.name)}</b><div><span class="badge">${esc(c.bgg_type.replace('boardgame',''))}</span><span class="id">BGG ID ${c.bgg_id}</span></div></div><button class="tiny danger" onclick="deleteContact(${c.id})">Delete</button></div><div class="contactGrid"><input class="control" data-f="email" value="${esc(c.email||'')}" placeholder="Email address"><input class="control" data-f="bgg_username" value="${esc(c.bgg_username||'')}" placeholder="BGG username"><textarea class="control full" data-f="notes" placeholder="Notes">${esc(c.notes||'')}</textarea><button class="primary full" onclick="saveContact(${c.id})">Save changes</button></div>${c.source_game_name?`<div class="sub">Found via ${esc(c.source_game_name)} · game #${c.source_game_id}</div>`:''}</div>`).join('')||'<div class="empty">No saved contacts yet.</div>'}async function saveContact(id){let e=document.querySelector(`[data-cid="${id}"]`),b={};e.querySelectorAll('[data-f]').forEach(x=>b[x.dataset.f]=x.value.trim()||null);await sb(`bg_contact?id=eq.${id}`,{method:'PATCH',body:JSON.stringify(b)});loadContacts()}async function deleteContact(id){if(confirm('Delete this contact?')){await sb(`bg_contact?id=eq.${id}`,{method:'DELETE'});loadContacts()}}window.saveContact=saveContact;window.deleteContact=deleteContact;
function db(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function cacheSet(k,v){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}async function cacheGet(k){const d=await db();return new Promise((res,rej)=>{const r=d.transaction(STORE).objectStore(STORE).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function api(endpoint,params={},retries=6){const url=API+'?endpoint='+encodeURIComponent(endpoint)+'&'+new URLSearchParams(params);let r=await fetch(url);if(r.status===202&&retries){await wait(2000);return api(endpoint,params,retries-1)}const text=await r.text();if(!r.ok)throw new Error(`API ${r.status}: ${text.slice(0,220)}`);return text}function num(v){const n=Number(v);return Number.isFinite(n)?n:0}
function parseCollection(xml){const d=new DOMParser().parseFromString(xml,'text/xml');return [...d.querySelectorAll('item')].map(it=>{const st=it.querySelector('status'),f=n=>num(st?.getAttribute(n));return{id:it.getAttribute('objectid')||it.getAttribute('id'),title:it.querySelector('name')?.textContent||'',image:it.querySelector('thumbnail')?.textContent||'',personalRating:num(it.querySelector('stats rating')?.getAttribute('value')),numPlays:num(it.querySelector('numplays')?.textContent),status:{own:f('own'),prevowned:f('prevowned'),fortrade:f('fortrade'),want:f('want'),wanttoplay:f('wanttoplay'),wanttobuy:f('wanttobuy'),wishlist:f('wishlist'),preordered:f('preordered')}}}).filter(x=>x.id)}function credits(it,type){return [...it.querySelectorAll(`link[type="${type}"]`)].map(l=>({id:l.getAttribute('id'),name:l.getAttribute('value'),type})).filter(x=>x.id&&x.name)}function parseThings(xml,cmap){const d=new DOMParser().parseFromString(xml,'text/xml');return [...d.querySelectorAll('item')].map(it=>{const id=it.getAttribute('id'),b=cmap.get(id)||{},stats=it.querySelector('statistics ratings');return{id,title:it.querySelector('name[type="primary"]')?.getAttribute('value')||b.title||'Unknown',image:it.querySelector('thumbnail')?.textContent||it.querySelector('image')?.textContent||b.image||'',status:b.status||{},personalRating:b.personalRating||0,numPlays:b.numPlays||0,year:num(it.querySelector('yearpublished')?.getAttribute('value')),minPlayers:num(it.querySelector('minplayers')?.getAttribute('value')),maxPlayers:num(it.querySelector('maxplayers')?.getAttribute('value')),rating:num(stats?.querySelector('average')?.getAttribute('value')),weight:num(stats?.querySelector('averageweight')?.getAttribute('value')),publishers:credits(it,'boardgamepublisher'),designers:credits(it,'boardgamedesigner'),artists:credits(it,'boardgameartist')}})}async function pool(chunks,worker){let next=0,done=0,out=new Array(chunks.length);async function run(){while(1){const i=next++;if(i>=chunks.length)return;try{out[i]=await worker(chunks[i])}catch{out[i]=[]}done++;prog(15+80*done/chunks.length);$('status').textContent=`Loading game details ${done} / ${chunks.length}`}}await Promise.all(Array.from({length:Math.min(MAX_PARALLEL,chunks.length)},run));return out.flat()}
function activeStatuses(){return [...document.querySelectorAll('#filters input:checked')].map(x=>x.value)}function filteredGames(){const st=activeStatuses(),y0=num($('yearMin').value),y1=num($('yearMax').value),r0=num($('ratingMin').value),w1=num($('weightMax').value),p0=num($('playersMin').value),p1=num($('playersMax').value);return loadedGames.filter(g=>(!st.length||st.some(s=>g.status?.[s]))&&(!y0||g.year>=y0)&&(!y1||g.year<=y1)&&(!r0||g.rating>=r0)&&(!w1||g.weight<=w1)&&(!p0||g.maxPlayers>=p0)&&(!p1||g.minPlayers<=p1))}function parts(){return $('domain').value.split('+')}function singular(d){return d==='designers'?'Designer':d==='artists'?'Artist':'Publisher'}function domainLabel(){return parts().map(singular).join(' + ')}function combos(g){const ps=parts(),scope=$('scope').value,lists=ps.map(p=>scope==='first'?(g[p]||[]).slice(0,1):(g[p]||[]));if(lists.some(x=>!x.length))return[];let c=[[]];for(const list of lists)c=c.flatMap(pre=>list.map(p=>[...pre,p]));return c.map(x=>({id:x.map((p,i)=>ps[i]+':'+p.id).join('|'),name:x.map(p=>p.name).join(' + '),people:x}))}function buildRows(games){const map=new Map;for(const g of games)for(const p of combos(g)){if(!map.has(p.id))map.set(p.id,{...p,games:[]});if(!map.get(p.id).games.some(x=>x.id===g.id))map.get(p.id).games.push(g)}return [...map.values()]}
function render(){if(!loadedGames.length)return;const games=filteredGames();allRows=buildRows(games);const matches=allRows.reduce((n,r)=>n+r.games.length,0);$('summary').hidden=false;$('workspace').hidden=false;$('summary').innerHTML=`<div class="metric"><small>Games shown</small><b>${games.length}</b></div><div class="metric"><small>${esc(domainLabel())} groups</small><b>${allRows.length}</b></div><div class="metric"><small>Matches counted</small><b>${matches}</b></div><div class="metric"><small>Repeat credits</small><b>${allRows.filter(x=>x.games.length>1).length}</b></div>`;renderRanking();renderInsights(games);renderMatrix(games);$('status').textContent=`${games.length} games in current view.`}
function thumb(g,cls='cover'){return g.image?`<a class="thumbLink" href="${bgg(g)}" target="_blank" rel="noopener" data-game-link="1" title="Open ${esc(g.title)} on BoardGameGeek"><img class="${cls}" src="${esc(g.image)}" loading="lazy"></a>`:''}function renderRanking(){let rows=[...allRows],q=$('search').value.trim().toLowerCase(),min=num($('minGames').value)||1;if(q)rows=rows.filter(x=>x.name.toLowerCase().includes(q));rows=rows.filter(x=>x.games.length>=min);rows.sort($('sort').value==='name'?(a,b)=>a.name.localeCompare(b.name):(a,b)=>b.games.length-a.games.length||a.name.localeCompare(b.name));const max=rows[0]?.games.length||1;$('rankTitle').textContent=`Ranking — ${domainLabel()}`;$('resultCount').textContent=`${rows.length} results`;$('rows').innerHTML=rows.length?rows.map((x,i)=>`<article class="person" data-id="${esc(x.id)}"><div class="personMain"><div class="rank ${i<3?'top':''}">${i+1}</div><div><div class="personName">${esc(x.name)}</div><div class="sub">${x.people.map((p,j)=>`${singular(parts()[j])} ID ${p.id}`).join(' · ')}</div><div class="bar"><i style="width:${Math.max(2,x.games.length/max*100)}%"></i></div></div><div class="gameCount"><b>${x.games.length}</b><small>games</small></div><div class="covers">${x.games.slice(0,5).map(g=>thumb(g)).join('')}</div><div>⌄</div></div><div class="expandedGames">${x.games.map(g=>`<div class="gamePill">${thumb(g,'')}${esc(g.title)}</div>`).join('')}</div></article>`).join(''):`<div class="empty">No results match the current filters.</div>`;document.querySelectorAll('.personMain').forEach(el=>el.onclick=e=>{if(e.target.closest('[data-game-link]'))return;const p=el.closest('.person');p.classList.toggle('open');openDrawer(p.dataset.id)})}
function avg(a,k){const x=a.map(v=>v[k]).filter(Boolean);return x.length?x.reduce((s,v)=>s+v,0)/x.length:0}function renderInsights(games){const rows=[...allRows].sort((a,b)=>b.games.length-a.games.length),top=rows.slice(0,10),max=top[0]?.games.length||1;$('insightsView').innerHTML=`<div class="insights"><section class="panel section"><h2>Top 10 — ${esc(domainLabel())}</h2>${top.map(x=>`<div class="chartRow"><span>${esc(x.name)}</span><span class="chartBar"><i style="width:${x.games.length/max*100}%"></i></span><b>${x.games.length}</b></div>`).join('')}</section><section class="panel section"><h2>Collection intelligence</h2><div class="insightStat">Average BGG rating <b>${avg(games,'rating').toFixed(2)}</b></div><div class="insightStat">Average complexity <b>${avg(games,'weight').toFixed(2)} / 5</b></div><div class="insightStat">Played at least once <b>${games.filter(g=>g.numPlays>0).length}</b></div></section></div>`}function renderMatrix(games){const ps=parts();if(ps.length<2){$('matrixView').innerHTML='<section class="panel empty">Choose a hybrid Analyze By mode to create a cross-analysis matrix.</section>';return}const a=ps[0],b=ps[1],am=new Map,bm=new Map,cells=new Map;for(const g of games){let aa=g[a]||[],bb=g[b]||[];if($('scope').value==='first'){aa=aa.slice(0,1);bb=bb.slice(0,1)}for(const x of aa)am.set(x.id,{...x,n:(am.get(x.id)?.n||0)+1});for(const y of bb)bm.set(y.id,{...y,n:(bm.get(y.id)?.n||0)+1});for(const x of aa)for(const y of bb)cells.set(x.id+'|'+y.id,(cells.get(x.id+'|'+y.id)||0)+1)}const A=[...am.values()].sort((x,y)=>y.n-x.n).slice(0,20),B=[...bm.values()].sort((x,y)=>y.n-x.n).slice(0,15),mx=Math.max(1,...cells.values());$('matrixView').innerHTML=`<section class="panel section"><h2>${singular(a)} × ${singular(b)}</h2><div class="matrixWrap"><table class="matrix"><thead><tr><th>${singular(a)}</th>${B.map(y=>`<th>${esc(y.name)}</th>`).join('')}</tr></thead><tbody>${A.map(x=>`<tr><td>${esc(x.name)}</td>${B.map(y=>{const v=cells.get(x.id+'|'+y.id)||0;return `<td class="heat">${v||''}</td>`}).join('')}</tr>`).join('')}</tbody></table></div></section>`}
function openDrawer(id){const r=allRows.find(x=>x.id===id);if(!r)return;const gs=[...r.games].sort((a,b)=>b.rating-a.rating),labels=parts();$('drawerContent').innerHTML=`<h2>${esc(r.name)}</h2><div class="sub">${esc(domainLabel())} • ${gs.length} games</div><h3>BGG Contacts</h3>${r.people.map((p,i)=>`<div class="credit"><div><b>${esc(p.name)}</b><div><span class="badge">${singular(labels[i])}</span><span class="id">BGG ID ${p.id}</span></div></div><button class="tiny ${isSaved(p.type,p.id)?'good':''}" onclick='addContact(${JSON.stringify(p)},${JSON.stringify(gs[0]||null)})'>${isSaved(p.type,p.id)?'Saved ✓':'Add to Contacts'}</button></div>`).join('')}<div class="drawerStats"><div class="drawerStat">Games <b>${gs.length}</b></div><div class="drawerStat">Avg rating <b>${avg(gs,'rating').toFixed(2)}</b></div><div class="drawerStat">Avg weight <b>${avg(gs,'weight').toFixed(2)}</b></div></div><h3>Games</h3><div class="drawerGames">${gs.map(g=>`<div class="drawerGame">${thumb(g,'')}<div><b>${esc(g.title)}</b><small>${g.year||'Year ?'} • ${g.rating?g.rating.toFixed(1)+' BGG':'No rating'} • ${g.weight?g.weight.toFixed(1)+' weight':'No weight'}</small></div></div>`).join('')}</div>`;$('drawerBackdrop').classList.add('open')}
async function analyze(){const user=$('username').value.trim();if(!user)return;$('run').disabled=true;prog(2);try{$('status').textContent='Loading full collection…';const coll=parseCollection(await api('collection',{username:user,stats:1,excludesubtype:'boardgameaccessory'}));if(!coll.length)throw Error('No collection items returned.');prog(15);const cmap=new Map(coll.map(x=>[x.id,x])),chunks=[];for(let i=0;i<coll.length;i+=BATCH)chunks.push(coll.slice(i,i+BATCH).map(x=>x.id));loadedGames=await pool(chunks,async ids=>parseThings(await api('thing',{id:ids.join(','),stats:1}),cmap));const data={at:Date.now(),games:loadedGames};await cacheSet(user.toLowerCase(),data);prog(100);$('cacheState').innerHTML=`<span class="cache">Cached ${new Date(data.at).toLocaleString()}</span>`;render()}catch(e){$('status').innerHTML=`<span class="error">${esc(e.message)}</span>`;log(e.message)}finally{$('run').disabled=false}}async function loadCache(){try{const c=await cacheGet($('username').value.trim().toLowerCase());if(c?.games?.length){loadedGames=c.games;$('cacheState').innerHTML=`<span class="cache">Cached ${new Date(c.at).toLocaleString()}</span>`;prog(100);render()}else $('status').textContent='Ready. Load BGG data once; filters are then local.'}catch{$('status').textContent='Ready.'}}
$('run').onclick=analyze;document.querySelectorAll('#filters input,.af').forEach(x=>x.addEventListener('change',render));['domain','scope'].forEach(id=>$(id).onchange=render);['search','minGames','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',renderRanking));$('filterCollapse').onclick=()=>{const h=$('filterBody').classList.toggle('hidden');$('filterCollapse').textContent=h?'Show filters':'Hide filters'};$('collapseAll').onclick=()=>document.querySelectorAll('.person').forEach(x=>x.classList.toggle('open'));document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));['ranking','insights','matrix','contacts'].forEach(v=>$(v+'View').classList.toggle('hidden',v!==b.dataset.view));if(b.dataset.view==='contacts')loadContacts()});$('contactSearch').oninput=renderContacts;$('refreshContacts').onclick=loadContacts;$('logBtn').onclick=()=>$('logModal').classList.add('open');$('closeLog').onclick=()=>$('logModal').classList.remove('open');$('closeDrawer').onclick=()=>$('drawerBackdrop').classList.remove('open');$('drawerBackdrop').onclick=e=>{if(e.target===$('drawerBackdrop'))$('drawerBackdrop').classList.remove('open')};$('username').addEventListener('change',()=>{loadedGames=[];$('workspace').hidden=true;$('summary').hidden=true;prog(0);loadCache()});
</script></body></html>
