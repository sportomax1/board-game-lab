<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BGG People Analyzer</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#182033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1200px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e4e7ee;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 3px 14px #16213a0c}h1,h2{margin:0 0 8px}p{color:#667085}.controls{display:grid;grid-template-columns:1.2fr 1fr .9fr auto;gap:10px}input,select,button{min-height:44px;border-radius:11px;border:1px solid #d7dce5;padding:10px 12px;font-size:15px;background:#fff}button{background:#4f46e5;color:#fff;border:0;font-weight:750;cursor:pointer}button:disabled{opacity:.55}.secondary{background:#eef2f6;color:#344054}.status{font-size:14px;color:#667085;margin-top:12px}.progress{height:10px;background:#edf0f5;border-radius:999px;overflow:hidden;margin-top:12px}.progress>div{height:100%;width:0;background:#4f46e5;transition:width .2s}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.filters label{background:#f8f9fc;border:1px solid #e4e7ec;border-radius:999px;padding:7px 10px;font-size:12px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#f8f9fc;border-radius:12px;padding:12px}.metric b{display:block;font-size:22px}.person{border-top:1px solid #edf0f5;padding:13px 0}.personHead{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center}.name{font-weight:800}.small{font-size:12px;color:#7b8496}.bar{height:7px;background:#e9ecf2;border-radius:8px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:#4f46e5}.games{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.game{display:flex;align-items:center;gap:5px;background:#eef2ff;border-radius:8px;padding:4px 7px;font-size:11px}.game img{width:24px;height:32px;object-fit:cover;border-radius:3px}.collapseBtn{min-height:30px;padding:4px 9px;font-size:11px;background:#eef2f6;color:#475467}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:10px}.modal{position:fixed;inset:0;background:#10182899;display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.open{display:flex}.modalBox{width:min(900px,100%);max-height:85vh;background:white;border-radius:18px;padding:16px;display:flex;flex-direction:column}.console{background:#101828;color:#d0d5dd;border-radius:12px;padding:12px;overflow:auto;min-height:300px;white-space:pre-wrap;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.error{color:#fda29b}.hidden{display:none!important}@media(max-width:760px){.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}.summary{grid-template-columns:1fr 1fr}.wrap{padding:10px}}@media(max-width:480px){.controls{grid-template-columns:1fr}.controls input{grid-column:auto}.personHead{grid-template-columns:1fr auto}.personHead .collapseBtn{grid-column:1/-1;width:max-content}}</style></head>
<body><div class="wrap"><div class="card"><div class="sectionHead"><div><h1>BGG People Analyzer</h1><p>Load once, then explore publishers, designers, artists, and hybrid combinations locally.</p></div><button id="logBtn" class="secondary" type="button">View Log</button></div>
<div class="controls"><input id="username" value="sportomax" placeholder="BGG username"><select id="domain"><option value="publishers">Publisher</option><option value="designers">Designer</option><option value="artists">Artist</option><option value="designers+publishers">Designer + Publisher</option><option value="artists+publishers">Artist + Publisher</option><option value="designers+artists">Designer + Artist</option><option value="designers+artists+publishers">Designer + Artist + Publisher</option></select><select id="scope"><option value="all">Evaluate all listed</option><option value="first">First listed only</option></select><button id="run">Analyze</button></div>
<div class="sectionHead" style="margin-top:14px"><b>Collection Status</b><button id="filterCollapse" class="collapseBtn" type="button">Hide Filters</button></div><div class="filters" id="filters"><label><input type="checkbox" value="own"> Owned</label><label><input type="checkbox" value="prevowned"> Prev owned</label><label><input type="checkbox" value="fortrade"> For trade</label><label><input type="checkbox" value="want"> Want</label><label><input type="checkbox" value="wanttoplay"> Want to play</label><label><input type="checkbox" value="wanttobuy"> Want to buy</label><label><input type="checkbox" value="wishlist"> Wishlist</label><label><input type="checkbox" value="preordered"> Preordered</label></div>
<div id="status" class="status">Ready. No status filters = all collection items.</div><div class="progress"><div id="progress"></div></div></div><div id="summary" class="card" hidden></div><div id="results" class="card" hidden></div></div>
<div id="logModal" class="modal" role="dialog" aria-modal="true"><div class="modalBox"><div class="sectionHead"><h2>API / Debug Log</h2><button id="closeLog" class="secondary" type="button">Close</button></div><div id="console" class="console">Ready.</div></div></div>
<script>
const API='/api/bgg-helper',BATCH=20,MAX_PARALLEL=100;let loadedGames=[];const $=id=>document.getElementById(id),wait=ms=>new Promise(r=>setTimeout(r,ms));
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function log(m){const t=new Date().toLocaleTimeString();$('console').textContent+=`\n[${t}] ${m}`;$('console').scrollTop=$('console').scrollHeight;console.log('[people]',m)}function prog(n){$('progress').style.width=Math.max(0,Math.min(100,n))+'%'}
async function api(endpoint,params={},retries=6){const url=API+'?endpoint='+encodeURIComponent(endpoint)+'&'+new URLSearchParams(params);log('GET '+endpoint+(endpoint==='thing'?` (${String(params.id).split(',').length} IDs)`:''));let r;try{r=await fetch(url)}catch(e){throw new Error('Network error: '+e.message)}if(r.status===202&&retries>0){log('BGG queued request (202); retrying…');await wait(2000);return api(endpoint,params,retries-1)}const text=await r.text();if(!r.ok){let detail=text.slice(0,250);try{detail=JSON.parse(text).message||detail}catch{}throw new Error(`API ${r.status}: ${detail}`)}return text}
function parseCollection(xml){const d=new DOMParser().parseFromString(xml,'text/xml');if(d.querySelector('parsererror'))throw new Error('Collection response was not valid XML.');return [...d.querySelectorAll('item')].map(it=>{const st=it.querySelector('status'),f=n=>Number(st?.getAttribute(n)||0);return{id:it.getAttribute('objectid')||it.getAttribute('id'),title:it.querySelector('name')?.textContent||'',image:it.querySelector('thumbnail')?.textContent||it.querySelector('image')?.textContent||'',status:{own:f('own'),prevowned:f('prevowned'),fortrade:f('fortrade'),want:f('want'),wanttoplay:f('wanttoplay'),wanttobuy:f('wanttobuy'),wishlist:f('wishlist'),preordered:f('preordered')}}}).filter(x=>x.id)}
function credits(it,type){return [...it.querySelectorAll(`link[type="${type}"]`)].map(l=>({id:l.getAttribute('id'),name:l.getAttribute('value')})).filter(x=>x.id&&x.name)}function parseThings(xml,cmap){const d=new DOMParser().parseFromString(xml,'text/xml');if(d.querySelector('parsererror'))throw new Error('Thing response was not valid XML.');return [...d.querySelectorAll('item')].map(it=>{const id=it.getAttribute('id'),base=cmap.get(id)||{};return{id,title:it.querySelector('name[type="primary"]')?.getAttribute('value')||base.title||'Unknown',image:it.querySelector('thumbnail')?.textContent||it.querySelector('image')?.textContent||base.image||'',status:base.status||{},publishers:credits(it,'boardgamepublisher'),designers:credits(it,'boardgamedesigner'),artists:credits(it,'boardgameartist')}})}
async function pool(chunks,worker,limit){let next=0,done=0;const out=new Array(chunks.length);async function run(){while(true){const i=next++;if(i>=chunks.length)return;try{out[i]=await worker(chunks[i])}catch(e){log(`Batch ${i+1} failed: ${e.message}`);out[i]=[]}done++;prog(15+80*(done/chunks.length));$('status').textContent=`Game detail batches: ${done} / ${chunks.length} complete`;}}await Promise.all(Array.from({length:Math.min(limit,chunks.length)},run));return out.flat()}
function activeStatuses(){return [...document.querySelectorAll('#filters input:checked')].map(x=>x.value)}function filtered(){const a=activeStatuses();return a.length?loadedGames.filter(g=>a.some(s=>g.status?.[s])):loadedGames}function domainParts(){return $('domain').value.split('+')}function singular(d){return d==='designers'?'Designer':d==='artists'?'Artist':'Publisher'}function domainLabel(){return domainParts().map(singular).join(' + ')}
function combosForGame(g){const parts=domainParts(),scope=$('scope').value;const lists=parts.map(p=>{const a=g[p]||[];return scope==='first'?a.slice(0,1):a});if(lists.some(x=>!x.length))return[];let combos=[[]];for(const list of lists){const next=[];for(const prefix of combos)for(const p of list)next.push([...prefix,p]);combos=next}return combos.map(c=>({id:c.map((p,i)=>parts[i]+':'+p.id).join('|'),name:c.map(p=>p.name).join(' + ')}))}
function render(){const games=filtered(),map=new Map();for(const g of games){const seen=new Set();for(const p of combosForGame(g)){if(seen.has(p.id))continue;seen.add(p.id);if(!map.has(p.id))map.set(p.id,{...p,games:[]});map.get(p.id).games.push(g)}}const rows=[...map.values()].sort((a,b)=>b.games.length-a.games.length||a.name.localeCompare(b.name)),max=rows[0]?.games.length||1,creditsCount=rows.reduce((n,x)=>n+x.games.length,0);$('summary').hidden=false;$('results').hidden=false;$('summary').innerHTML=`<div class="summary"><div class="metric"><span class="small">Games shown</span><b>${games.length}</b></div><div class="metric"><span class="small">Unique ${esc(domainLabel())} groups</span><b>${rows.length}</b></div><div class="metric"><span class="small">Matches counted</span><b>${creditsCount}</b></div><div class="metric"><span class="small">On 2+ games</span><b>${rows.filter(x=>x.games.length>1).length}</b></div></div>`;$('results').innerHTML=`<div class="sectionHead"><h2>Ranking — ${esc(domainLabel())}</h2><button id="allRowsBtn" class="collapseBtn" type="button">Collapse All Games</button></div>`+rows.map((x,i)=>`<div class="person"><div class="personHead"><div><div class="name">${i+1}. ${esc(x.name)}</div><div class="bar"><i style="width:${Math.max(2,x.games.length/max*100)}%"></i></div></div><div><b>${x.games.length}</b> <span class="small">game${x.games.length===1?'':'s'}</span></div><button class="collapseBtn rowToggle" type="button">Hide Games</button></div><div class="games">${x.games.map(g=>`<span class="game">${g.image?`<img loading="lazy" src="${esc(g.image)}">`:''}${esc(g.title)}</span>`).join('')}</div></div>`).join('');bindRowCollapses();$('status').textContent=`Showing ${games.length} games • ${rows.length} ${domainLabel().toLowerCase()} groups • cached locally (no API call).`}
function bindRowCollapses(){document.querySelectorAll('.rowToggle').forEach(b=>b.addEventListener('click',()=>{const games=b.closest('.person').querySelector('.games'),hide=!games.classList.contains('hidden');games.classList.toggle('hidden',hide);b.textContent=hide?'Show Games':'Hide Games'}));$('allRowsBtn')?.addEventListener('click',()=>{const anyVisible=[...document.querySelectorAll('.person .games')].some(x=>!x.classList.contains('hidden'));document.querySelectorAll('.person .games').forEach(x=>x.classList.toggle('hidden',anyVisible));document.querySelectorAll('.rowToggle').forEach(x=>x.textContent=anyVisible?'Show Games':'Hide Games');$('allRowsBtn').textContent=anyVisible?'Expand All Games':'Collapse All Games'})}
async function analyze(){const btn=$('run'),user=$('username').value.trim();if(!user)return;btn.disabled=true;loadedGames=[];$('console').textContent='';$('summary').hidden=true;$('results').hidden=true;prog(2);try{log(`Starting full analysis for ${user}. No collection-status filters are sent to BGG.`);$('status').textContent='Loading full collection…';const cx=await api('collection',{username:user,excludesubtype:'boardgameaccessory'}),coll=parseCollection(cx);if(!coll.length)throw new Error('No collection items returned. Check the BGG username or BGG queue status.');log(`Collection returned ${coll.length} items.`);prog(15);const cmap=new Map(coll.map(x=>[x.id,x])),chunks=[];for(let i=0;i<coll.length;i+=BATCH)chunks.push(coll.slice(i,i+BATCH).map(x=>x.id));log(`Fetching all publisher, designer, and artist credits in ${chunks.length} batches.`);loadedGames=await pool(chunks,async ids=>parseThings(await api('thing',{id:ids.join(',')}),cmap),MAX_PARALLEL);prog(100);log(`Finished. Cached ${loadedGames.length} games. All single/hybrid modes and filters are now local.`);render()}catch(e){$('status').innerHTML='<span class="error">'+esc(e.message)+'</span>';log('ERROR: '+e.message);$('logModal').classList.add('open');console.error(e)}finally{btn.disabled=false}}
$('run').addEventListener('click',analyze);document.querySelectorAll('#filters input').forEach(x=>x.addEventListener('change',()=>loadedGames.length&&render()));$('domain').addEventListener('change',()=>loadedGames.length&&render());$('scope').addEventListener('change',()=>loadedGames.length&&render());$('filterCollapse').addEventListener('click',()=>{const hide=!$('filters').classList.contains('hidden');$('filters').classList.toggle('hidden',hide);$('filterCollapse').textContent=hide?'Show Filters':'Hide Filters'});$('logBtn').addEventListener('click',()=>$('logModal').classList.add('open'));$('closeLog').addEventListener('click',()=>$('logModal').classList.remove('open'));$('logModal').addEventListener('click',e=>{if(e.target===$('logModal'))$('logModal').classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('logModal').classList.remove('open')});
</script></body></html>
