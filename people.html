<script>

    const uxCss=`<style>

  .summary{display:grid!important;grid-template-columns:repeat(4,minmax(110px,1fr))!important;gap:1px!important}
  .metric{padding:5px 9px!important;display:flex!important;align-items:center!important;justify-content:space-between!important;gap:8px}

  .tabs{gap:4px!important;overflow:visible!important}

  .rankHeader>.sectionHead{min-width:220px}

  .rankHeader>.toolbar{display:grid!important;grid-template-columns:minmax(250px,1fr) 105px 120px auto;gap:5px!important;align-items:center}

@media(max-width:600px){

  .summary{grid-template-columns:1fr 1fr!important}
  .metric{padding:5px 7px!important}

  .rankHeader>.toolbar{grid-template-columns:1fr 1fr!important;gap:4px!important}

</style>`;

    const uxJs=`<script>
(function(){
  const byId=id=>document.getElementById(id);
  const top=document.querySelector('.top');
  const setup=document.querySelector('.setup');
  const filterPanel=setup?.nextElementSibling;
  const summary=byId('summary');
  const workspace=byId('workspace');
  const tabs=workspace?.querySelector('.tabs');
  const rankingView=byId('rankingView');
  const toolbar=rankingView?.querySelector('.toolbar');
  const rankHeader=rankingView?.querySelector('.rankHeader');
  const setupGrid=setup?.querySelector('.grid');
  const logBtn=byId('logBtn');

  if(filterPanel)filterPanel.id='filterPanel';

  const desktopMQ=window.matchMedia('(min-width:1181px)');
  const syncCommandBar=()=>{
    const desktop=desktopMQ.matches;
    if(setup)setup.classList.toggle('statusBar',desktop);
    if(top && setup && setupGrid){
      if(desktop){
        if(setupGrid.parentElement!==top)top.insertBefore(setupGrid,logBtn);
      }else if(setupGrid.parentElement!==setup){
        setup.insertBefore(setupGrid,setup.firstChild);
      }
    }
  };
  syncCommandBar();
  if(desktopMQ.addEventListener)desktopMQ.addEventListener('change',syncCommandBar);

  if(summary && tabs){
    const strip=document.createElement('div');
    strip.className='resultsStrip';
    summary.parentNode.insertBefore(strip,summary);
    strip.append(summary,tabs);
  }

  if(rankHeader && toolbar)rankHeader.appendChild(toolbar);

  const filterBody=byId('filterBody');
  const filterToggle=byId('filterCollapse');
  if(filterBody && filterToggle && !filterBody.classList.contains('hidden')){
    filterBody.classList.add('hidden');
    filterToggle.textContent='Show filters';
  }

  if(filterToggle){
    const badge=document.createElement('span');
    badge.className='filterActiveBadge';
    filterToggle.insertAdjacentElement('beforebegin',badge);
    const updateBadge=()=>{
      const checked=document.querySelectorAll('#filters input:checked').length;
      const advanced=[...document.querySelectorAll('.af')].filter(x=>String(x.value||'').trim()).length;
      const count=checked+advanced;
      badge.textContent=count?String(count):'';
      badge.title=count?(String(count)+' active filter'+(count===1?'':'s')):'';
    };
    document.querySelectorAll('#filters input,.af').forEach(x=>x.addEventListener('change',updateBadge));
    document.querySelectorAll('.af').forEach(x=>x.addEventListener('input',updateBadge));
    updateBadge();
  }

  if(logBtn){logBtn.textContent='Log';logBtn.title='View API / debug log'}
  const collapse=byId('collapseAll');
  if(collapse)collapse.textContent='Expand games';

  document.documentElement.classList.add('peopleUxV3');
})();
<\/script>`;

    html=html.replace('</head>',uxCss+'</head>');
    html=html.replace('</body>',uxJs+'</body>');
    html=html.replace('Checking local cache…','Checking IndexedDB cache…');
    html=html.replaceAll('Cached ${new Date','IndexedDB • Cached ${new Date');
    html=html.replace('Ready. Load BGG data once; filters are then local.','Ready. Load once; IndexedDB keeps the dataset local for instant filtering.');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.getElementById('boot').innerHTML=`<div class="bootCard"><b>People Analyzer failed to load</b>${String(error.message||error)}</div>`;
  }
})();
</script>
</body>
</html>
