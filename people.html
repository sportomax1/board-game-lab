<div class="boot" id="boot"><div class="bootCard"><b>People Analyzer</b>Loading cached analyzer…</div></div>
<script>
(async()=>{
  try{
    const CORE='./assets/people-core.txt?v=20260903-v4';
    const response=await fetch(CORE,{cache:'default'});
    if(!response.ok)throw new Error(`Could not load analyzer core (${response.status})`);
    let html=await response.text();

    const optimizedRanking=String.raw`function renderRanking(){
let rows=[...allRows],q=$('search').value.trim().toLowerCase(),min=num($('minGames').value)||1;
if(q)rows=rows.filter(x=>x.name.toLowerCase().includes(q)||x.games.some(g=>g.title.toLowerCase().includes(q)));
rows=rows.filter(x=>x.games.length>=min);
rows.sort($('sort').value==='name'?(a,b)=>a.name.localeCompare(b.name):(a,b)=>b.games.length-a.games.length||a.name.localeCompare(b.name));
const max=rows[0]?.games.length||1;
$('rankTitle').textContent='Ranking — '+domainLabel();
$('resultCount').textContent=rows.length+' results';
$('rows').innerHTML=rows.length?rows.map((x,i)=>{
 const covers=x.games.slice(0,5).map(g=>g.image?gameAnchor(g,'<img class="cover" src="'+esc(g.image)+'" loading="lazy" decoding="async">'):'').join('');
 return '<article class="person" data-id="'+esc(x.id)+'"><div class="personMain" role="button" tabindex="0" aria-label="Open details for '+esc(x.name)+'"><div class="rank '+(i<3?'top':'')+'">'+(i+1)+'</div><div><div class="personName">'+esc(x.name)+'</div><div class="bar"><i style="width:'+Math.max(2,x.games.length/max*100)+'%"></i></div></div><div class="gameCount"><b>'+x.games.length+'</b><small>games</small></div><div class="covers">'+covers+'</div><div aria-hidden="true">›</div></div></article>';
}).join(''):'<div class="empty">No results match the current filters.</div>';
document.querySelectorAll('.personMain').forEach(el=>{
 const activate=e=>{
  if(e.target.closest('[data-game-link]'))return;
  if(e.type==='keydown'&&e.key!=='Enter'&&e.key!==' ')return;
  if(e.type==='keydown')e.preventDefault();
  openDrawer(el.closest('.person').dataset.id);
 };
 el.onclick=activate;
 el.onkeydown=activate;
});
}`;
    html=html.replace(/function renderRanking\(\)\{[\s\S]*?\}\nfunction avg/,optimizedRanking+'\nfunction avg');
    html=html.replace("['search','minGames','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',renderRanking));","let rankSearchTimer;$('search').addEventListener('input',()=>{clearTimeout(rankSearchTimer);rankSearchTimer=setTimeout(renderRanking,90)});['minGames','sort'].forEach(id=>$(id).addEventListener('change',renderRanking));");
    html=html.replace('Search people or combinations…','Search people or games…');

    const uxCss=`<style>

  .rankHeader>.sectionHead{min-width:220px}
  .rankHeader h2{font-size:16px!important;margin:0!important;white-space:nowrap}
  .rankHeader .sub{font-size:10px!important;white-space:nowrap}
  .rankHeader>.toolbar{display:grid!important;grid-template-columns:minmax(250px,1fr) 105px 120px;gap:5px!important;align-items:center}
  .rankHeader>.toolbar .control{height:31px!important;font-size:11px!important;border-radius:8px!important}
  .personMain{grid-template-columns:36px minmax(190px,1fr) 72px minmax(140px,260px) 20px!important;gap:9px!important;padding:8px 11px!important;cursor:pointer}
  .personMain:hover{background:#13223999}
  .rank{width:29px!important;height:29px!important;border-radius:7px!important;font-size:11px}
  .personName{font-size:12px}
  .sub{font-size:10px!important}
  .bar{height:3px!important;margin-top:4px!important}
  .gameCount b{font-size:16px!important}
  .gameCount small{font-size:9px}
  .cover{width:27px!important;height:36px!important}
  .covers{gap:4px!important}
}

@media(min-width:1001px) and (max-width:1180px){
  .shell{padding:10px 14px!important}
  .top{margin-bottom:5px!important}
  .title h1{font-size:27px!important;margin-bottom:2px!important}
  .title p{font-size:11px!important}
  .setup{padding:8px 10px!important}
  .setup>.grid{grid-template-columns:1fr 1fr 1fr auto!important;gap:6px!important}
  .setup .control,.setup .primary{height:36px!important;min-height:36px!important}
  #filterBody{grid-template-columns:1fr!important}
  .advanced{grid-template-columns:repeat(6,minmax(85px,1fr))!important}
  .resultsStrip{grid-template-columns:1fr}
  .resultsStrip .tabs{min-height:34px}
  .rankHeader{padding:7px 10px!important}
  .rankHeader>.toolbar{display:grid!important;grid-template-columns:minmax(220px,1fr) 100px 115px;gap:5px!important;margin-top:6px!important}
}

  .setup.mobileDataCollapsed>.grid{display:none!important}
  .setup.mobileDataCollapsed .progressRow{margin-top:0!important;display:flex!important;justify-content:flex-end!important;align-items:center!important;gap:6px!important;font-size:9px!important;min-width:0}

  .setup.mobileDataCollapsed .progress{display:none!important}

    const uxJs=`<script>
(function(){
  const byId=id=>document.getElementById(id);
  const top=document.querySelector('.top');
  const setup=document.querySelector('.setup');
  const filterPanel=setup?.nextElementSibling;
  const summary=byId('summary');
  const workspace=byId('workspace');
  const tabs=workspace?.querySelector('.tabs');
  const rankingView=byId('rankingView');
  const toolbar=rankingView?.querySelector('.toolbar');
  const rankHeader=rankingView?.querySelector('.rankHeader');
  const setupGrid=setup?.querySelector('.grid');
  const logBtn=byId('logBtn');
  const progress=byId('progress');

  if(filterPanel)filterPanel.id='filterPanel';

  const desktopMQ=window.matchMedia('(min-width:1181px)');
  const syncCommandBar=()=>{
    const desktop=desktopMQ.matches;
    if(setup)setup.classList.toggle('statusBar',desktop);
    if(top&&setup&&setupGrid){
      if(desktop){
        if(setupGrid.parentElement!==top)top.insertBefore(setupGrid,logBtn);
      }else if(setupGrid.parentElement!==setup){
        setup.insertBefore(setupGrid,setup.firstChild);
      }
    }
  };
  syncCommandBar();
  if(desktopMQ.addEventListener)desktopMQ.addEventListener('change',syncCommandBar);

  let strip=null;
  if(summary&&tabs){
    strip=document.createElement('div');
    strip.className='resultsStrip';
    summary.parentNode.insertBefore(strip,summary);
    strip.append(summary,tabs);
    const syncStrip=()=>{strip.hidden=!!summary.hidden&&!!workspace.hidden};
    new MutationObserver(syncStrip).observe(summary,{attributes:true,attributeFilter:['hidden']});
    new MutationObserver(syncStrip).observe(workspace,{attributes:true,attributeFilter:['hidden']});
    syncStrip();
  }

  if(rankHeader&&toolbar)rankHeader.appendChild(toolbar);

  const filterBody=byId('filterBody');
  const filterToggle=byId('filterCollapse');
  const filterHead=filterPanel?.querySelector('.sectionHead');
  const statusTools=document.createElement('span');
  statusTools.className='statusTools';
  setup?.querySelector('.progressRow')?.appendChild(statusTools);
  let filterBadge=null;
  let updateFilterBadge=()=>{};
  if(filterBody&&filterToggle&&!filterBody.classList.contains('hidden')){
    filterBody.classList.add('hidden');
    filterToggle.textContent='Show filters';
  }
  if(filterToggle){
    filterBadge=document.createElement('span');
    filterBadge.className='filterActiveBadge';
    filterToggle.insertAdjacentElement('beforebegin',filterBadge);
    updateFilterBadge=()=>{
      const checked=document.querySelectorAll('#filters input:checked').length;
      const advanced=[...document.querySelectorAll('.af')].filter(x=>String(x.value||'').trim()).length;
      const count=checked+advanced;
      filterBadge.textContent=count?String(count):'';
      filterBadge.title=count?(String(count)+' active filter'+(count===1?'':'s')):'';
    };
    document.querySelectorAll('#filters input,.af').forEach(x=>x.addEventListener('change',updateFilterBadge));
    document.querySelectorAll('.af').forEach(x=>x.addEventListener('input',updateFilterBadge));
  }
  const syncFilterPanel=()=>{
    const closed=!!filterBody?.classList.contains('hidden');
    filterPanel?.classList.toggle('filterClosed',closed);
    if(closed&&filterToggle){
      if(filterBadge)statusTools.appendChild(filterBadge);
      statusTools.appendChild(filterToggle);
    }else if(filterHead&&filterToggle){
      if(filterBadge)filterHead.appendChild(filterBadge);
      filterHead.appendChild(filterToggle);
    }
  };
  if(filterBody)new MutationObserver(syncFilterPanel).observe(filterBody,{attributes:true,attributeFilter:['class']});
  syncFilterPanel();
  updateFilterBadge();

  if(progress&&setup){
    const syncProgress=()=>setup.classList.toggle('settled',progress.style.width==='100%');
    new MutationObserver(syncProgress).observe(progress,{attributes:true,attributeFilter:['style']});
    syncProgress();
  }

  if(logBtn){logBtn.textContent='Log';logBtn.title='View API / debug log'}
  const mobileDataToggle=document.createElement('button');
  mobileDataToggle.className='ghost mobileDataToggle';
  mobileDataToggle.type='button';
  mobileDataToggle.textContent='Data';
  mobileDataToggle.title='Show or hide BGG data controls';
  if(top&&logBtn)top.insertBefore(mobileDataToggle,logBtn);
  const mobileMQ=window.matchMedia('(max-width:1000px)');
  let mobileDataManual=false;
  const syncMobileData=()=>{
    if(!setup)return;
    if(!mobileMQ.matches||workspace?.hidden){
      setup.classList.remove('mobileDataCollapsed');
      if(workspace?.hidden)mobileDataManual=false;
    }else if(!mobileDataManual){
      setup.classList.add('mobileDataCollapsed');
    }
    mobileDataToggle.textContent=setup.classList.contains('mobileDataCollapsed')?'Data':'Hide data';
  };
  mobileDataToggle.onclick=()=>{
    mobileDataManual=true;
    setup?.classList.toggle('mobileDataCollapsed');
    syncMobileData();
  };
  if(workspace)new MutationObserver(syncMobileData).observe(workspace,{attributes:true,attributeFilter:['hidden']});
  if(mobileMQ.addEventListener)mobileMQ.addEventListener('change',syncMobileData);
  syncMobileData();

  const collapse=byId('collapseAll');
  if(collapse)collapse.setAttribute('aria-hidden','true');
  const search=byId('search');
  if(search)search.setAttribute('aria-label','Search people or games');

  const PREF='bggPeopleUiV2';
  const readPrefs=()=>{try{return JSON.parse(localStorage.getItem(PREF)||'{}')}catch{return {}}};
  const prefs=readPrefs();
  ['domain','scope','minGames','sort'].forEach(id=>{const el=byId(id);if(el&&prefs[id]!=null)el.value=prefs[id]});
  if(prefs.statuses&&Array.isArray(prefs.statuses))document.querySelectorAll('#filters input').forEach(x=>x.checked=prefs.statuses.includes(x.value));
  ['yearMin','yearMax','ratingMin','weightMax','playersMin','playersMax'].forEach(id=>{const el=byId(id);if(el&&prefs[id]!=null)el.value=prefs[id]});
  updateFilterBadge();
  const savePrefs=()=>{try{
    const data={};
    ['domain','scope','minGames','sort','yearMin','yearMax','ratingMin','weightMax','playersMin','playersMax'].forEach(id=>{const el=byId(id);if(el)data[id]=el.value});
    data.statuses=[...document.querySelectorAll('#filters input:checked')].map(x=>x.value);
    localStorage.setItem(PREF,JSON.stringify(data));
  }catch{}};
  document.querySelectorAll('#filters input,.af,#domain,#scope,#minGames,#sort').forEach(x=>x.addEventListener('change',savePrefs));

  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      byId('drawerBackdrop')?.classList.remove('open');
      byId('logModal')?.classList.remove('open');
    }
    if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')){
      e.preventDefault();search?.focus();
    }
  });

  document.documentElement.classList.add('peopleUxV6');
})();
<\/script>`;

    html=html.replace('</head>',uxCss+'<link rel="stylesheet" href="./assets/people-v9.css?v=20260903-v9-r2"><link rel="stylesheet" href="./assets/people-v10.css?v=20260903-v10-r1">'+'</head>');
    html=html.replace('</body>',uxJs+'<scr'+'ipt src="./assets/people-v9.js?v=20260903-v9-r2"></scr'+'ipt><scr'+'ipt src="./assets/people-v10.js?v=20260903-v10-r1"></scr'+'ipt>'+'</body>');
    html=html.replace('Checking local cache…','Checking IndexedDB cache…');
    html=html.replaceAll('Cached ${new Date','IndexedDB • Cached ${new Date');
    html=html.replace('Ready. Load BGG data once; filters are then local.','Ready. Load once; IndexedDB keeps the dataset local for instant filtering.');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.getElementById('boot').innerHTML=`<div class="bootCard"><b>People Analyzer failed to load</b>${String(error.message||error)}</div>`;
  }
})();
</script>
