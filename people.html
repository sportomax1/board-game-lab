<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BGG People Analyzer</title><style>
:root{--bg:#07111f;--panel:#0d1929;--panel2:#101e30;--line:#203149;--text:#f4f7fb;--muted:#91a0b5;--accent:#7c5cff;--accent2:#9b7cff;--green:#35d07f;--shadow:0 18px 50px rgba(0,0,0,.28);--r:16px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% -10%,#18264a 0,transparent 32%),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,select{font:inherit}.shell{max-width:1440px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.title h1{font-size:clamp(30px,4vw,46px);letter-spacing:-.045em;line-height:1;margin:0 0 10px}.title p{margin:0;color:var(--muted);font-size:16px}.ghost,.primary,.tiny{border:1px solid var(--line);border-radius:11px;min-height:42px;padding:0 15px;color:var(--text);background:#111e2e;cursor:pointer;font-weight:700;transition:.18s}.ghost:hover,.tiny:hover{border-color:#405574;background:#17263a}.primary{border:0;background:linear-gradient(135deg,var(--accent),#6336df);box-shadow:0 8px 24px #6d46ef44;padding:0 22px}.primary:hover{transform:translateY(-1px);filter:brightness(1.08)}.primary:disabled{opacity:.5;transform:none}.panel{background:linear-gradient(180deg,rgba(17,31,49,.96),rgba(11,24,39,.96));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px}.setup{padding:22px}.grid{display:grid;grid-template-columns:1.15fr 1fr 1fr auto;gap:14px;align-items:end}.field label{display:block;color:#b8c3d2;font-size:12px;font-weight:700;margin:0 0 7px}.control{width:100%;height:44px;background:#0a1625;color:var(--text);border:1px solid #2b3d55;border-radius:10px;padding:0 12px;outline:none}.control:focus{border-color:var(--accent);box-shadow:0 0 0 3px #7c5cff22}.progressRow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;color:var(--muted);font-size:12px}.progress{height:7px;background:#1a2940;border-radius:99px;overflow:hidden;margin-top:8px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s}.section{padding:18px 20px}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:12px}.sectionHead h2{font-size:15px;margin:0;letter-spacing:-.01em}.tiny{min-height:32px;padding:0 10px;font-size:11px}.filters{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.chip{position:relative}.chip input{position:absolute;opacity:0;pointer-events:none}.chip span{display:flex;align-items:center;gap:7px;border:1px solid #2a3b52;background:#0b1726;color:#aeb9c8;border-radius:10px;padding:8px 11px;cursor:pointer;font-size:12px;font-weight:650;transition:.16s}.chip input:checked+span{color:#fff;border-color:#7458e8;background:#30275d;box-shadow:inset 0 0 0 1px #7458e855}.chip input:checked+span:before{content:'✓';color:#57e59a}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);overflow:hidden}.metric{background:#0d1929;padding:20px}.metric small{display:block;color:var(--muted);font-weight:650}.metric b{display:block;font-size:28px;letter-spacing:-.04em;margin-top:4px}.toolbar{display:flex;gap:10px;align-items:center;margin:16px 0}.search{flex:1;min-width:180px}.ranking{overflow:hidden}.rankHeader{padding:17px 20px;border-bottom:1px solid var(--line)}.rankHeader .sectionHead{margin-bottom:12px}.count{color:var(--muted);font-size:12px}.person{border-bottom:1px solid #1d2d43}.person:last-child{border:0}.personMain{display:grid;grid-template-columns:48px minmax(180px,1fr) 90px minmax(180px,1.2fr) 34px;align-items:center;gap:14px;padding:15px 20px;transition:.15s}.personMain:hover{background:#ffffff04}.rank{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#18283d;color:#cbd5e1;font-weight:800}.rank.top{background:linear-gradient(135deg,#7256dc,#47329b);color:white}.personName{font-weight:780;font-size:14px}.bar{height:5px;background:#24344a;border-radius:99px;overflow:hidden;margin-top:7px;max-width:340px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}.gameCount b{font-size:20px;color:#a98cff}.gameCount small{display:block;color:var(--muted)}.games{display:flex;gap:7px;align-items:center;overflow:hidden}.game{width:38px;height:50px;border-radius:6px;overflow:hidden;background:#1b2a3e;flex:0 0 auto;border:1px solid #33455d}.game img{width:100%;height:100%;object-fit:cover}.gameText{font-size:11px;color:#b8c3d2;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.expand{border:0;background:transparent;color:#91a0b5;cursor:pointer;font-size:18px}.expandedGames{display:none;padding:0 20px 16px 82px;gap:7px;flex-wrap:wrap}.person.open .expandedGames{display:flex}.gamePill{display:flex;align-items:center;gap:7px;background:#132238;border:1px solid #263951;border-radius:8px;padding:5px 8px;font-size:11px;color:#c4cfdd}.gamePill img{width:25px;height:34px;object-fit:cover;border-radius:3px}.empty{padding:60px 20px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#020814cc;backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px;z-index:99}.modal.open{display:flex}.modalBox{width:min(900px,100%);max-height:82vh;background:#0b1726;border:1px solid #2b3d55;border-radius:16px;padding:18px;box-shadow:0 30px 80px #0008}.console{margin-top:14px;background:#050b13;color:#aebbd0;border:1px solid #1d2a3b;border-radius:10px;padding:14px;height:50vh;overflow:auto;white-space:pre-wrap;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}.hidden{display:none!important}.error{color:#ff8f9d}.cache{display:inline-flex;align-items:center;gap:6px;color:#7ee2a8}.cache:before{content:'';width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px #35d07f18}@media(max-width:900px){.shell{padding:20px}.grid{grid-template-columns:1fr 1fr}.grid .runWrap{grid-column:1/-1}.primary{width:100%}.personMain{grid-template-columns:42px 1fr 70px 28px}.games{display:none}.summary{grid-template-columns:1fr 1fr}.expandedGames{padding-left:76px}}@media(max-width:600px){.shell{padding:14px}.top{align-items:center}.title h1{font-size:30px}.title p{font-size:13px}.grid{grid-template-columns:1fr}.grid .runWrap{grid-column:auto}.setup{padding:16px}.section{padding:15px}.summary{grid-template-columns:1fr 1fr}.metric{padding:15px}.metric b{font-size:23px}.personMain{padding:13px 14px;grid-template-columns:36px minmax(0,1fr) 54px 26px;gap:9px}.rank{width:30px;height:30px}.personName{white-space:normal}.gameCount b{font-size:17px}.expandedGames{padding:0 14px 14px 59px}.toolbar{flex-wrap:wrap}.search{flex-basis:100%}.ghost{padding:0 11px}.filters{gap:7px}.chip span{padding:7px 9px}.top .ghost{font-size:12px;min-height:38px}}
</style></head><body><main class="shell"><header class="top"><div class="title"><h1>People Analyzer</h1><p>Discover the designers, artists and publishers behind your BGG collection.</p></div><button class="ghost" id="logBtn">View Log</button></header>
<section class="panel setup"><div class="grid"><div class="field"><label>BGG USERNAME</label><input class="control" id="username" value="sportomax" autocomplete="off"></div><div class="field"><label>ANALYZE BY</label><select class="control" id="domain"><option value="publishers">Publisher</option><option value="designers">Designer</option><option value="artists">Artist</option><option value="designers+publishers">Designer + Publisher</option><option value="artists+publishers">Artist + Publisher</option><option value="designers+artists">Designer + Artist</option><option value="designers+artists+publishers">Designer + Artist + Publisher</option></select></div><div class="field"><label>EVALUATION MODE</label><select class="control" id="scope"><option value="all">All listed</option><option value="first">First listed only</option></select></div><div class="runWrap"><button class="primary" id="run">Analyze Collection</button></div></div><div class="progressRow"><span id="status">Ready. One API run loads all credit data.</span><span id="cacheState">Not loaded</span></div><div class="progress"><div id="progress"></div></div></section>
<section class="panel section"><div class="sectionHead"><h2>Collection status filters</h2><button class="tiny" id="filterCollapse">Hide filters</button></div><div class="filters" id="filters"><label class="chip"><input type="checkbox" value="own"><span>Owned</span></label><label class="chip"><input type="checkbox" value="prevowned"><span>Previously owned</span></label><label class="chip"><input type="checkbox" value="fortrade"><span>For trade</span></label><label class="chip"><input type="checkbox" value="want"><span>Want</span></label><label class="chip"><input type="checkbox" value="wanttoplay"><span>Want to play</span></label><label class="chip"><input type="checkbox" value="wanttobuy"><span>Want to buy</span></label><label class="chip"><input type="checkbox" value="wishlist"><span>Wishlist</span></label><label class="chip"><input type="checkbox" value="preordered"><span>Preordered</span></label></div></section>
<section id="summary" class="panel summary" hidden></section><div id="results" hidden><div class="toolbar"><input id="search" class="control search" placeholder="Search people or combinations…"><select id="minGames" class="control" style="width:auto"><option value="1">1+ games</option><option value="2">2+ games</option><option value="3">3+ games</option><option value="5">5+ games</option><option value="10">10+ games</option></select><select id="sort" class="control" style="width:auto"><option value="count">Game count</option><option value="name">Name</option></select><button class="ghost" id="collapseAll">Collapse games</button></div><section class="panel ranking"><div class="rankHeader"><div class="sectionHead"><h2 id="rankTitle">Ranking</h2><span class="count" id="resultCount"></span></div></div><div id="rows"></div></section></div></main>
<div id="logModal" class="modal"><div class="modalBox"><div class="sectionHead"><h2 style="margin:0">API / Debug Log</h2><button class="ghost" id="closeLog">Close</button></div><div id="console" class="console">Ready.</div></div></div>
<script>
const API='/api/bgg-helper',BATCH=20,MAX_PARALLEL=100;let loadedGames=[],allRows=[];const $=id=>document.getElementById(id),wait=ms=>new Promise(r=>setTimeout(r,ms));
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function log(m){const t=new Date().toLocaleTimeString();$('console').textContent+=`\n[${t}] ${m}`;$('console').scrollTop=$('console').scrollHeight;console.log('[people]',m)}function prog(n){$('progress').style.width=Math.max(0,Math.min(100,n))+'%'}
async function api(endpoint,params={},retries=6){const url=API+'?endpoint='+encodeURIComponent(endpoint)+'&'+new URLSearchParams(params);log('GET '+endpoint+(endpoint==='thing'?` (${String(params.id).split(',').length} IDs)`:''));let r;try{r=await fetch(url)}catch(e){throw new Error('Network error: '+e.message)}if(r.status===202&&retries>0){log('BGG queued request (202); retrying…');await wait(2000);return api(endpoint,params,retries-1)}const text=await r.text();if(!r.ok){let detail=text.slice(0,250);try{detail=JSON.parse(text).message||detail}catch{}throw new Error(`API ${r.status}: ${detail}`)}return text}
function parseCollection(xml){const d=new DOMParser().parseFromString(xml,'text/xml');if(d.querySelector('parsererror'))throw new Error('Collection response was not valid XML.');return [...d.querySelectorAll('item')].map(it=>{const st=it.querySelector('status'),f=n=>Number(st?.getAttribute(n)||0);return{id:it.getAttribute('objectid')||it.getAttribute('id'),title:it.querySelector('name')?.textContent||'',image:it.querySelector('thumbnail')?.textContent||it.querySelector('image')?.textContent||'',status:{own:f('own'),prevowned:f('prevowned'),fortrade:f('fortrade'),want:f('want'),wanttoplay:f('wanttoplay'),wanttobuy:f('wanttobuy'),wishlist:f('wishlist'),preordered:f('preordered')}}}).filter(x=>x.id)}function credits(it,type){return [...it.querySelectorAll(`link[type="${type}"]`)].map(l=>({id:l.getAttribute('id'),name:l.getAttribute('value')})).filter(x=>x.id&&x.name)}function parseThings(xml,cmap){const d=new DOMParser().parseFromString(xml,'text/xml');if(d.querySelector('parsererror'))throw new Error('Thing response was not valid XML.');return [...d.querySelectorAll('item')].map(it=>{const id=it.getAttribute('id'),base=cmap.get(id)||{};return{id,title:it.querySelector('name[type="primary"]')?.getAttribute('value')||base.title||'Unknown',image:it.querySelector('thumbnail')?.textContent||it.querySelector('image')?.textContent||base.image||'',status:base.status||{},publishers:credits(it,'boardgamepublisher'),designers:credits(it,'boardgamedesigner'),artists:credits(it,'boardgameartist')}})}
async function pool(chunks,worker,limit){let next=0,done=0;const out=new Array(chunks.length);async function run(){while(1){const i=next++;if(i>=chunks.length)return;try{out[i]=await worker(chunks[i])}catch(e){log(`Batch ${i+1} failed: ${e.message}`);out[i]=[]}done++;prog(15+80*(done/chunks.length));$('status').textContent=`Loading game details · ${done} of ${chunks.length} batches`;}}await Promise.all(Array.from({length:Math.min(limit,chunks.length)},run));return out.flat()}
function activeStatuses(){return [...document.querySelectorAll('#filters input:checked')].map(x=>x.value)}function filteredGames(){const a=activeStatuses();return a.length?loadedGames.filter(g=>a.some(s=>g.status?.[s])):loadedGames}function parts(){return $('domain').value.split('+')}function singular(d){return d==='designers'?'Designer':d==='artists'?'Artist':'Publisher'}function domainLabel(){return parts().map(singular).join(' + ')}function combos(g){const ps=parts(),scope=$('scope').value,lists=ps.map(p=>scope==='first'?(g[p]||[]).slice(0,1):(g[p]||[]));if(lists.some(a=>!a.length))return[];let c=[[]];for(const list of lists){const n=[];for(const pre of c)for(const p of list)n.push([...pre,p]);c=n}return c.map(x=>({id:x.map((p,i)=>ps[i]+':'+p.id).join('|'),name:x.map(p=>p.name).join(' + ')}))}
function buildRows(){const games=filteredGames(),map=new Map();for(const g of games){const seen=new Set();for(const p of combos(g)){if(seen.has(p.id))continue;seen.add(p.id);if(!map.has(p.id))map.set(p.id,{...p,games:[]});map.get(p.id).games.push(g)}}allRows=[...map.values()];$('summary').hidden=false;$('results').hidden=false;$('summary').innerHTML=`<div class="metric"><small>GAMES SHOWN</small><b>${games.length}</b></div><div class="metric"><small>UNIQUE GROUPS</small><b>${allRows.length}</b></div><div class="metric"><small>MATCHES</small><b>${allRows.reduce((n,x)=>n+x.games.length,0)}</b></div><div class="metric"><small>REPEAT CREDITS</small><b>${allRows.filter(x=>x.games.length>1).length}</b></div>`;$('rankTitle').textContent=domainLabel()+' ranking';renderRows();$('status').textContent=`Showing ${games.length} games · filters update instantly without API calls`;}
function renderRows(){const q=$('search').value.trim().toLowerCase(),min=+$('minGames').value,sort=$('sort').value;let rows=allRows.filter(x=>x.games.length>=min&&(!q||x.name.toLowerCase().includes(q)||x.games.some(g=>g.title.toLowerCase().includes(q))));rows.sort(sort==='name'?(a,b)=>a.name.localeCompare(b.name):(a,b)=>b.games.length-a.games.length||a.name.localeCompare(b.name));const max=rows[0]?.games.length||1;$('resultCount').textContent=`${rows.length} result${rows.length===1?'':'s'}`;$('rows').innerHTML=rows.length?rows.map((x,i)=>{const previews=x.games.slice(0,4);return `<article class="person"><div class="personMain"><div class="rank ${i<3?'top':''}">${i+1}</div><div><div class="personName">${esc(x.name)}</div><div class="bar"><i style="width:${Math.max(2,x.games.length/max*100)}%"></i></div></div><div class="gameCount"><b>${x.games.length}</b><small>games</small></div><div class="games">${previews.map(g=>g.image?`<span class="game" title="${esc(g.title)}"><img loading="lazy" src="${esc(g.image)}" alt=""></span>`:`<span class="gameText">${esc(g.title)}</span>`).join('')}${x.games.length>4?`<span class="gameText">+${x.games.length-4}</span>`:''}</div><button class="expand" aria-label="Toggle games">⌄</button></div><div class="expandedGames">${x.games.map(g=>`<span class="gamePill">${g.image?`<img loading="lazy" src="${esc(g.image)}" alt="">`:''}${esc(g.title)}</span>`).join('')}</div></article>`}).join(''):'<div class="empty">No results match these filters.</div>';document.querySelectorAll('.person .expand').forEach(b=>b.onclick=()=>b.closest('.person').classList.toggle('open'))}
async function analyze(){const btn=$('run'),user=$('username').value.trim();if(!user)return;btn.disabled=true;loadedGames=[];$('console').textContent='';$('summary').hidden=true;$('results').hidden=true;$('cacheState').textContent='Loading…';$('cacheState').className='';prog(2);try{log(`Starting full analysis for ${user}; no status filters sent to BGG.`);$('status').textContent='Loading full collection…';const cx=await api('collection',{username:user,excludesubtype:'boardgameaccessory'}),coll=parseCollection(cx);if(!coll.length)throw new Error('No collection items returned. Check the BGG username or BGG queue status.');log(`Collection returned ${coll.length} items.`);prog(15);const cmap=new Map(coll.map(x=>[x.id,x])),chunks=[];for(let i=0;i<coll.length;i+=BATCH)chunks.push(coll.slice(i,i+BATCH).map(x=>x.id));loadedGames=await pool(chunks,async ids=>parseThings(await api('thing',{id:ids.join(',')}),cmap),MAX_PARALLEL);prog(100);$('cacheState').textContent='Data cached locally';$('cacheState').className='cache';log(`Finished. Cached ${loadedGames.length} games with publisher, designer and artist credits.`);buildRows()}catch(e){$('status').innerHTML='<span class="error">'+esc(e.message)+'</span>';$('cacheState').textContent='Load failed';log('ERROR: '+e.message);$('logModal').classList.add('open')}finally{btn.disabled=false}}
$('run').onclick=analyze;document.querySelectorAll('#filters input').forEach(x=>x.onchange=()=>loadedGames.length&&buildRows());$('domain').onchange=$('scope').onchange=()=>loadedGames.length&&buildRows();$('search').oninput=$('minGames').onchange=$('sort').onchange=renderRows;$('filterCollapse').onclick=()=>{const f=$('filters'),hide=!f.classList.contains('hidden');f.classList.toggle('hidden',hide);$('filterCollapse').textContent=hide?'Show filters':'Hide filters'};$('logBtn').onclick=()=>$('logModal').classList.add('open');$('closeLog').onclick=()=>$('logModal').classList.remove('open');$('logModal').onclick=e=>{if(e.target===$('logModal'))$('logModal').classList.remove('open')};$('collapseAll').onclick=()=>{const people=[...document.querySelectorAll('.person')],open=people.some(x=>x.classList.contains('open'));people.forEach(x=>x.classList.toggle('open',!open));$('collapseAll').textContent=open?'Expand games':'Collapse games'};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('logModal').classList.remove('open')});
</script></body></html>
