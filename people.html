nt(90deg,var(--accent),var(--accent2))}.gameCount b{font-size:20px;color:#a98cff}.gameCount small{display:block;color:var(--muted)}.covers{display:flex;gap:6px;overflow:hidden}.cover{width:36px;height:48px;object-fit:cover;border-radius:5px;background:#1b2a3e;border:1px solid #33455d}.expand{color:var(--muted);font-size:18px}.expandedGames{display:none;padding:0 20px 16px 82px;gap:7px;flex-wrap:wrap}.person.open .expandedGames{display:flex}.gamePill{display:flex;align-items:center;gap:7px;background:#132238;border:1px solid #263951;border-radius:8px;padding:5px 8px;font-size:11px}.gamePill img{width:25px;height:34px;object-fit:cover;border-radius:3px}.insights{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.chartRow{display:grid;grid-template-columns:minmax(120px,220px) 1fr 48px;gap:10px;align-items:center;margin:10px 0}.chartLabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chartBar{height:9px;background:#203149;border-radius:99px;overflow:hidden}.chartBar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}.insightStat{padding:14px 0;border-bottom:1px solid var(--line)}.insightStat:last-child{border:0}.insightStat b{font-size:22px;display:block}.matrixWrap{overflow:auto;max-height:650px}.matrix{border-collapse:separate;border-spacing:0;width:100%;min-width:700px}.matrix th,.matrix td{padding:9px 10px;border-right:1px solid #1c2d43;border-bottom:1px solid #1c2d43;text-align:center;font-size:12px}.matrix th{position:sticky;top:0;background:#122136;z-index:2;color:#b9c5d5}.matrix th:first-child{left:0;z-index:3;text-align:left}.matrix td:first-child{position:sticky;left:0;background:#0d1929;text-align:left;font-weight:700;z-index:1}.heat{background:color-mix(in srgb,var(--accent) calc(var(--v)*12%),transparent);font-weight:800}.empty{padding:55px 20px;text-align:center;color:var(--muted)}.modal,.drawerBackdrop{position:fixed;inset:0;background:#020814bb;backdrop-filter:blur(7px);display:none;z-index:99}.modal.open,.drawerBackdrop.open{display:flex}.modal{align-items:center;justify-content:center;padding:20px}.modalBox{width:min(900px,100%);max-height:82vh;background:#0b1726;border:1px solid #2b3d55;border-radius:16px;padding:18px}.console{margin-top:14px;background:#050b13;color:#aebbd0;border:1px solid #1d2a3b;border-radius:10px;padding:14px;height:50vh;overflow:auto;white-space:pre-wrap;font:12px/1.6 ui-monospace,monospace}.drawerBackdrop{justify-content:flex-end}.drawer{width:min(540px,94vw);height:100%;overflow:auto;background:#0b1726;border-left:1px solid #2b3d55;box-shadow:-20px 0 60px #0008;padding:24px}.drawer h2{font-size:25px;line-height:1.15;margin:8px 0}.drawerStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.drawerStat{background:#111f31;border:1px solid var(--line);border-radius:10px;padding:11px}.drawerStat b{display:block;font-size:18px}.drawerGames{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.drawerGame{display:flex;gap:9px;align-items:center;background:#101e30;border:1px solid var(--line);border-radius:10px;padding:8px}.drawerGame img{width:42px;height:56px;object-fit:cover;border-radius:5px}.drawerGame b{font-size:12px}.drawerGame small{display:block;color:var(--muted)}.hidden{display:none!important}.error{color:#ff8f9d}

</style></head><body><main class="shell"><header class="top"><div class="title"><h1>People Analyzer</h1><p>Explore the designers, artists and publishers behind your BGG collection.</p></div><button class="ghost" id="logBtn">View Log</button></header>
<section class="panel setup"><div class="grid"><div class="field"><label>BGG USERNAME</label><input class="control" id="username" value="sportomax"></div><div class="field"><label>ANALYZE BY</label><select class="control" id="domain"><option value="publishers">Publisher</option><option value="designers">Designer</option><option value="artists">Artist</option><option value="designers+publishers">Designer + Publisher</option><option value="artists+publishers">Artist + Publisher</option><option value="designers+artists">Designer + Artist</option><option value="designers+artists+publishers">Designer + Artist + Publisher</option></select></div><div class="field"><label>EVALUATION MODE</label><select class="control" id="scope"><option value="all">All listed</option><option value="first">First listed only</option></select></div><div class="runWrap"><button class="primary" id="run">Load / Refresh BGG Data</button></div></div><div class="progressRow"><span id="status">Checking local cache…</span><span id="cacheState">Not loaded</span></div><div class="progress"><div id="progress"></div></div></section>
<section class="panel section"><div class="sectionHead"><h2>Filters</h2><button class="tiny" id="filterCollapse">Hide filters</button></div><div id="filterBody"><div class="filters" id="filters"><label class="chip"><input type="checkbox" value="own"><span>Owned</span></label><label class="chip"><input type="checkbox" value="prevowned"><span>Previously owned</span></label><label class="chip"><input type="checkbox" value="fortrade"><span>For trade</span></label><label class="chip"><input type="checkbox" value="want"><span>Want</span></label><label class="chip"><input type="checkbox" value="wanttoplay"><span>Want to play</span></label><label class="chip"><input type="checkbox" value="wanttobuy"><span>Want to buy</span></label><label class="chip"><input type="checkbox" value="wishlist"><span>Wishlist</span></label><label class="chip"><input type="checkbox" value="preordered"><span>Preordered</span></label></div><div class="advanced"><div class="field"><label>YEAR FROM</label><input class="control af" id="yearMin" type="number" placeholder="Any"></div><div class="field"><label>YEAR TO</label><input class="control af" id="yearMax" type="number" placeholder="Any"></div><div class="field"><label>MIN BGG RATING</label><input class="control af" id="ratingMin" type="number" min="0" max="10" step=".1" placeholder="Any"></div><div class="field"><label>MAX WEIGHT</label><input class="control af" id="weightMax" type="number" min="0" max="5" step=".1" placeholder="Any"></div><div class="field"><label>MIN PLAYERS</label><input class="control af" id="playersMin" type="number" min="1" placeholder="Any"></div><div class="field"><label>MAX PLAYERS</label><input class="control af" id="playersMax" type="number" min="1" placeholder="Any"></div></div></div></section>
<section id="summary" class="panel summary" hidden></section><div id="workspace" hidden><nav class="tabs"><button class="ghost tab active" data-view="ranking">Ranking</button><button class="ghost tab" data-view="insights">Visual Insights</button><button class="ghost tab" data-view="matrix">Cross-Analysis Matrix</button></nav><div id="rankingView"><div class="toolbar"><input id="search" class="control search" placeholder="Search people or combinations…"><select id="minGames" class="control" style="width:auto"><option value="1">1+ games</option><option value="2">2+ games</option><option value="3">3+ games</option><option value="5">5+ games</option><option value="10">10+ games</option></select><select id="sort" class="control" style="width:auto"><option value="count">Game count</option><option value="name">Name</option></select><button class="ghost" id="collapseAll">Collapse games</button></div><section class="panel ranking"><div class="rankHeader"><div class="sectionHead"><h2 id="rankTitle">Ranking</h2><span id="resultCount" class="sub"></span></div></div><div id="rows"></div></section></div><div id="insightsView" class="hidden"></div><div id="matrixView" class="hidden"></div></div></main>
<div id="logModal" class="modal"><div class="modalBox"><div class="sectionHead"><h2>API / Debug Log</h2><button class="ghost" id="closeLog">Close</button></div><div id="console" class="console">Ready.</div></div></div><div id="drawerBackdrop" class="drawerBackdrop"><aside class="drawer"><div class="sectionHead"><span class="sub">DETAIL</span><button class="ghost" id="closeDrawer">Close</button></div><div id="drawerContent"></div></aside></div>
<script>
const API='/api/bgg-helper',BATCH=20,MAX_PARALLEL=100,DB='bggPeopleCache',STORE='datasets';let loadedGames=[],allRows=[],currentView='ranking';const $=id=>document.getElementById(id),wait=ms=>new Promise(r=>setTimeout(r,ms));
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function log(m){$('console').textContent+=`\n[${new Date().toLocaleTimeString()}] ${m}`;$('console').scrollTop=$('console').scrollHeight;console.log('[people]',m)}function prog(n){$('progress').style.width=Math.max(0,Math.min(100,n))+'%'}
function db(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function cacheSet(k,v){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}async function cacheGet(k){const d=await db();return new Promise((res,rej)=>{const r=d.transaction(STORE).objectStore(STORE).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function api(endpoint,params={},retries=6){const url=API+'?endpoint='+encodeURIComponent(endpoint)+'&'+new URLSearchParams(params);log(`GET ${endpoint}${endpoint==='thing'?` (${String(params.id).split(',').length} IDs)`:''}`);let r=await fetch(url);if(r.status===202&&retries){await wait(2000);return api(endpoint,params,retries-1)}const text=await r.text();if(!r.ok)throw new Error(`API ${r.status}: ${text.slice(0,220)}`);return text}
function num(v){const n=Number(v);return Number.isFinite(n)?n:0}function parseCollection(xml){const d=new DOMParser().parseFromString(xml,'text/xml');if(d.querySelector('parsererror'))throw Error('Invalid collection XML');return [...d.querySelectorAll('item')].map(it=>{const st=it.querySelector('status'),f=n=>num(st?.getAttribute(n));return{id:it.getAttribute('objectid')||it.getAttribute('id'),title:it.querySelector('name')?.textContent||'',image:it.querySelector('thumbnail')?.textContent||'',personalRating:num(it.querySelector('stats rating')?.getAttribute('value')),numPlays:num(it.querySelector('numplays')?.textContent),status:{own:f('own'),prevowned:f('prevowned'),fortrade:f('fortrade'),want:f('want'),wanttoplay:f('wanttoplay'),wanttobuy:f('wanttobuy'),wishlist:f('wishlist'),preordered:f('preordered')}}}).filter(x=>x.id)}function credits(it,type){return [...it.querySelectorAll(`link[type="${type}"]`)].map(l=>({id:l.getAttribute('id'),name:l.getAttribute('value')})).filter(x=>x.id&&x.name)}function parseThings(xml,cmap){const d=new DOMParser().parseFromString(xml,'text/xml');if(d.querySelector('parsererror'))throw Error('Invalid thing XML');return [...d.querySelectorAll('item')].map(it=>{const id=it.getAttribute('id'),b=cmap.get(id)||{},stats=it.querySelector('statistics ratings');return{id,title:it.querySelector('name[type="primary"]')?.getAttribute('value')||b.title||'Unknown',image:it.querySelector('thumbnail')?.textContent||it.querySelector('image')?.textContent||b.image||'',status:b.status||{},personalRating:b.personalRating||0,numPlays:b.numPlays||0,year:num(it.querySelector('yearpublished')?.getAttribute('value')),minPlayers:num(it.querySelector('minplayers')?.getAttribute('value')),maxPlayers:num(it.querySelector('maxplayers')?.getAttribute('value')),rating:num(stats?.querySelector('average')?.getAttribute('value')),weight:num(stats?.querySelector('averageweight')?.getAttribute('value')),publishers:credits(it,'boardgamepublisher'),designers:credits(it,'boardgamedesigner'),artists:credits(it,'boardgameartist')}})}async function pool(chunks,worker){let next=0,done=0;const out=new Array(chunks.length);async function run(){while(1){const i=next++;if(i>=chunks.length)return;try{out[i]=await worker(chunks[i])}catch(e){log(`Batch ${i+1} failed: ${e.message}`);out[i]=[]}done++;prog(15+80*done/chunks.length);$('status').textContent=`Loading game details ${done} / ${chunks.length}`}}await Promise.all(Array.from({length:Math.min(MAX_PARALLEL,chunks.length)},run));return out.flat()}
function activeStatuses(){return [...document.querySelectorAll('#filters input:checked')].map(x=>x.value)}function filteredGames(){const st=activeStatuses(),y0=num($('yearMin').value),y1=num($('yearMax').value),r0=num($('ratingMin').value),w1=num($('weightMax').value),p0=num($('playersMin').value),p1=num($('playersMax').value);return loadedGames.filter(g=>(!st.length||st.some(s=>g.status?.[s]))&&(!y0||g.year>=y0)&&(!y1||g.year<=y1)&&(!r0||g.rating>=r0)&&(!w1||g.weight<=w1)&&(!p0||g.maxPlayers>=p0)&&(!p1||g.minPlayers<=p1))}function parts(){return $('domain').value.split('+')}function singular(d){return d==='designers'?'Designer':d==='artists'?'Artist':'Publisher'}function domainLabel(){return parts().map(singular).join(' + ')}function combos(g,forcedParts=parts()){const scope=$('scope').value,lists=forcedParts.map(p=>{const a=g[p]||[];return scope==='first'?a.slice(0,1):a});if(lists.some(x=>!x.length))return[];let c=[[]];for(const list of lists)c=c.flatMap(pre=>list.map(p=>[...pre,p]));return c.map(x=>({id:x.map((p,i)=>forcedParts[i]+':'+p.id).join('|'),name:x.map(p=>p.name).join(' + '),people:x}))}
function buildRows(games){const map=new Map;for(const g of games){const seen=new Set;for(const p of combos(g)){if(seen.has(p.id))continue;seen.add(p.id);if(!map.has(p.id))map.set(p.id,{...p,games:[]});map.get(p.id).games.push(g)}}return [...map.values()]}
function render(){if(!loadedGames.length)return;const games=filteredGames();allRows=buildRows(games);const matches=allRows.reduce((n,r)=>n+r.games.length,0);$('summary').hidden=false;$('workspace').hidden=false;$('summary').innerHTML=`<div class="metric"><small>Games shown</small><b>${games.length}</b></div><div class="metric"><small>${esc(domainLabel())} groups</small><b>${allRows.length}</b></div><div class="metric"><small>Matches counted</small><b>${matches}</b></div><div class="metric"><small>Repeat credits</small><b>${allRows.filter(x=>x.games.length>1).length}</b></div>`;renderRanking();renderInsights(games);renderMatrix(games);$('status').textContent=`${games.length} games in current view. All controls use cached data; no API call.`}
function renderRanking(){let rows=[...allRows],q=$('search').value.trim().toLowerCase(),min=num($('minGames').value)||1;if(q)rows=rows.filter(x=>x.name.toLowerCase().includes(q));rows=rows.filter(x=>x.games.length>=min);rows.sort($('sort').value==='name'?(a,b)=>a.name.localeCompare(b.name):(a,b)=>b.games.length-a.games.length||a.name.localeCompare(b.name));const max=rows[0]?.games.length||1;$('rankTitle').textContent=`Ranking — ${domainLabel()}`;$('resultCount').textContent=`${rows.length} results`;$('rows').innerHTML=rows.length?rows.map((x,i)=>`<article class="person" data-id="${esc(x.id)}"><div class="personMain"><div class="rank ${i<3?'top':''}">${i+1}</div><div><div class="personName">${esc(x.name)}</div><div class="bar"><i style="width:${Math.max(2,x.games.length/max*100)}%"></i></div></div><div class="gameCount"><b>${x.games.length}</b><small>games</small></div><div class="covers">${x.games.slice(0,5).map(g=>g.image?`<img class="cover" src="${esc(g.image)}" loading="lazy" title="${esc(g.title)}">`:'').join('')}</div><div class="expand">⌄</div></div><div class="expandedGames">${x.games.map(g=>`<span class="gamePill">${g.image?`<img src="${esc(g.image)}" loading="lazy">`:''}${esc(g.title)}</span>`).join('')}</div></article>`).join(''):`<div class="empty">No results match the current filters.</div>`;document.querySelectorAll('.person').forEach(el=>el.querySelector('.personMain').onclick=()=>{el.classList.toggle('open');openDrawer(el.dataset.id)})}
function avg(arr,key){const a=arr.map(x=>x[key]).filter(Boolean);return a.length?a.reduce((s,x)=>s+x,0)/a.length:0}function renderInsights(games){const rows=[...allRows].sort((a,b)=>b.games.length-a.games.length),top=rows.slice(0,10),top5=rows.slice(0,5).reduce((n,x)=>n+x.games.length,0),total=rows.reduce((n,x)=>n+x.games.length,0)||1,max=top[0]?.games.length||1;$('insightsView').innerHTML=`<div class="insights"><section class="panel section"><div class="sectionHead"><h2>Top 10 — ${esc(domainLabel())}</h2><span class="sub">Current filters</span></div>${top.map(x=>`<div class="chartRow"><span class="chartLabel" title="${esc(x.name)}">${esc(x.name)}</span><span class="chartBar"><i style="width:${x.games.length/max*100}%"></i></span><b>${x.games.length}</b></div>`).join('')||'<div class="empty">No data</div>'}</section><section class="panel section"><h2>Collection intelligence</h2><div class="insightStat"><span class="sub">Top 5 concentration</span><b>${(top5/total*100).toFixed(1)}%</b></div><div class="insightStat"><span class="sub">Average BGG rating</span><b>${avg(games,'rating').toFixed(2)}</b></div><div class="insightStat"><span class="sub">Average complexity</span><b>${avg(games,'weight').toFixed(2)} / 5</b></div><div class="insightStat"><span class="sub">Games played at least once</span><b>${games.filter(g=>g.numPlays>0).length}</b></div></section></div>`}
function renderMatrix(games){const ps=parts();if(ps.length<2){$('matrixView').innerHTML=`<section class="panel empty">Choose a hybrid Analyze By mode to create a cross-analysis matrix.</section>`;return}const a=ps[0],b=ps[1],am=new Map,bm=new Map,cells=new Map;for(const g of games){let aa=g[a]||[],bb=g[b]||[];if($('scope').value==='first'){aa=aa.slice(0,1);bb=bb.slice(0,1)}for(const x of aa)am.set(x.id,{...x,n:(am.get(x.id)?.n||0)+1});for(const y of bb)bm.set(y.id,{...y,n:(bm.get(y.id)?.n||0)+1});for(const x of aa)for(const y of bb)cells.set(x.id+'|'+y.id,(cells.get(x.id+'|'+y.id)||0)+1)}const A=[...am.values()].sort((x,y)=>y.n-x.n).slice(0,20),B=[...bm.values()].sort((x,y)=>y.n-x.n).slice(0,15),mx=Math.max(1,...cells.values());$('matrixView').innerHTML=`<section class="panel section"><div class="sectionHead"><div><h2>${singular(a)} × ${singular(b)}</h2><div class="sub">Top 20 rows × top 15 columns. Counts are shared games.</div></div></div><div class="matrixWrap"><table class="matrix"><thead><tr><th>${singular(a)}</th>${B.map(y=>`<th title="${esc(y.name)}">${esc(y.name)}</th>`).join('')}</tr></thead><tbody>${A.map(x=>`<tr><td>${esc(x.name)}</td>${B.map(y=>{const v=cells.get(x.id+'|'+y.id)||0;return `<td class="heat" style="--v:${v/mx}" title="${v} shared games">${v||''}</td>`}).join('')}</tr>`).join('')}</tbody></table></div></section>`}
function openDrawer(id){const r=allRows.find(x=>x.id===id);if(!r)return;const gs=r.games;$('drawerContent').innerHTML=`<h2>${esc(r.name)}</h2><div class="sub">${esc(domainLabel())} • ${gs.length} games in current filtered collection</div><div class="drawerStats"><div class="drawerStat"><span class="sub">Games</span><b>${gs.length}</b></div><div class="drawerStat"><span class="sub">Avg rating</span><b>${avg(gs,'rating').toFixed(2)}</b></div><div class="drawerStat"><span class="sub">Avg weight</span><b>${avg(gs,'weight').toFixed(2)}</b></div></div><h3>Games</h3><div class="drawerGames">${gs.sort((a,b)=>b.rating-a.rating).map(g=>`<div class="drawerGame">${g.image?`<img src="${esc(g.image)}" loading="lazy">`:''}<div><b>${esc(g.title)}</b><small>${g.year||'Year ?'} • ${g.rating?g.rating.toFixed(1)+' BGG':'No rating'} • ${g.weight?g.weight.toFixed(1)+' weight':'No weight'}</small></div></div>`).join('')}</div>`;$('drawerBackdrop').classList.add('open')}
async function analyze(){const user=$('username').value.trim();if(!user)return;$('run').disabled=true;$('console').textContent='';prog(2);try{log(`Refreshing complete dataset for ${user}`);$('status').textContent='Loading full collection…';const cx=await api('collection',{username:user,stats:1,excludesubtype:'boardgameaccessory'}),coll=parseCollection(cx);if(!coll.length)throw Error('No collection items returned.');prog(15);const cmap=new Map(coll.map(x=>[x.id,x])),chunks=[];for(let i=0;i<coll.length;i+=BATCH)chunks.push(coll.slice(i,i+BATCH).map(x=>x.id));loadedGames=await pool(chunks,async ids=>parseThings(await api('thing',{id:ids.join(','),stats:1}),cmap));const saved={at:Date.now(),games:loadedGames};await cacheSet(user.toLowerCase(),saved);prog(100);$('cacheState').innerHTML=`<span class="cache">Cached ${new Date(saved.at).toLocaleString()}</span>`;log(`Cached ${loadedGames.length} games with credits + statistics.`);render()}catch(e){$('status').innerHTML=`<span class="error">${esc(e.message)}</span>`;log('ERROR: '+e.message);$('logModal').classList.add('open')}finally{$('run').disabled=false}}
async function loadCache(){try{const user=$('username').value.trim().toLowerCase(),c=await cacheGet(user);if(c?.games?.length){loadedGames=c.games;$('cacheState').innerHTML=`<span class="cache">Cached ${new Date(c.at).toLocaleString()}</span>`;prog(100);$('status').textContent=`Loaded ${loadedGames.length} games from local cache. Refresh only when you want newer BGG data.`;render()}else $('status').textContent='Ready. Load BGG data once; filters and analysis are then local.'}catch{$('status').textContent='Ready.'}}
$('run').onclick=analyze;document.querySelectorAll('#filters input,.af').forEach(x=>x.addEventListener('change',render));['domain','scope'].forEach(id=>$(id).onchange=render);['search','minGames','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',renderRanking));$('filterCollapse').onclick=()=>{const h=$('filterBody').classList.toggle('hidden');$('filterCollapse').textContent=h?'Show filters':'Hide filters'};$('collapseAll').onclick=()=>{const els=[...document.querySelectorAll('.person')],open=els.some(x=>x.classList.contains('open'));els.forEach(x=>x.classList.toggle('open',!open));$('collapseAll').textContent=open?'Expand games':'Collapse games'};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{currentView=b.dataset.view;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));['ranking','insights','matrix'].forEach(v=>$(v+'View').classList.toggle('hidden',v!==currentView))});$('logBtn').onclick=()=>$('logModal').classList.add('open');$('closeLog').onclick=()=>$('logModal').classList.remove('open');$('closeDrawer').onclick=()=>$('drawerBackdrop').classList.remove('open');$('drawerBackdrop').onclick=e=>{if(e.target===$('drawerBackdrop'))$('drawerBackdrop').classList.remove('open')};$('logModal').onclick=e=>{if(e.target===$('logModal'))$('logModal').classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('logModal').classList.remove('open');$('drawerBackdrop').classList.remove('open')}});$('username').addEventListener('change',()=>{loadedGames=[];$('workspace').hidden=true;$('summary').hidden=true;prog(0);loadCache()});loadCache();
</script></body></html>
