<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BGG People Analyzer</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#182033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1200px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e4e7ee;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 3px 14px #16213a0c}h1,h2{margin:0 0 8px}p{color:#667085}.controls{display:grid;grid-template-columns:1.2fr .8fr .9fr auto;gap:10px}input,select,button{min-height:44px;border-radius:11px;border:1px solid #d7dce5;padding:10px 12px;font-size:15px;background:#fff}button{background:#4f46e5;color:#fff;border:0;font-weight:750;cursor:pointer}button:disabled{opacity:.55}.status{font-size:14px;color:#667085;margin-top:12px}.progress{height:10px;background:#edf0f5;border-radius:999px;overflow:hidden;margin-top:12px}.progress>div{height:100%;width:0;background:#4f46e5;transition:width .2s}.console{background:#101828;color:#d0d5dd;border-radius:12px;padding:12px;margin-top:12px;height:150px;overflow:auto;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.filters label{background:#f8f9fc;border:1px solid #e4e7ec;border-radius:999px;padding:7px 10px;font-size:12px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#f8f9fc;border-radius:12px;padding:12px}.metric b{display:block;font-size:22px}.person{display:grid;grid-template-columns:1fr auto;gap:10px;border-top:1px solid #edf0f5;padding:13px 0}.name{font-weight:800}.small{font-size:12px;color:#7b8496}.bar{height:7px;background:#e9ecf2;border-radius:8px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:#4f46e5}.games{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.game{display:flex;align-items:center;gap:5px;background:#eef2ff;border-radius:8px;padding:4px 7px;font-size:11px}.game img{width:24px;height:32px;object-fit:cover;border-radius:3px}.error{color:#fda29b}@media(max-width:760px){.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}.summary{grid-template-columns:1fr 1fr}.wrap{padding:10px}}@media(max-width:480px){.controls{grid-template-columns:1fr}.controls input{grid-column:auto}.person{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><div class="card"><h1>BGG People Analyzer</h1><p>Analyze designers, artists, or publishers across a BGG collection. The collection loads unfiltered; status filters are applied locally after the API run.</p>
<div class="controls"><input id="username" value="Borromax" placeholder="BGG username"><select id="domain"><option value="boardgamepublisher">Publisher</option><option value="boardgamedesigner">Designer</option><option value="boardgameartist">Artist</option></select><select id="scope"><option value="all">Evaluate all listed</option><option value="first">First listed only</option></select><button id="run">Analyze</button></div>
<div class="filters" id="filters"><label><input type="checkbox" value="own"> Owned</label><label><input type="checkbox" value="prevowned"> Prev owned</label><label><input type="checkbox" value="fortrade"> For trade</label><label><input type="checkbox" value="want"> Want</label><label><input type="checkbox" value="wanttoplay"> Want to play</label><label><input type="checkbox" value="wanttobuy"> Want to buy</label><label><input type="checkbox" value="wishlist"> Wishlist</label><label><input type="checkbox" value="preordered"> Preordered</label></div>
<div id="status" class="status">Ready. No status filters = all collection items.</div><div class="progress"><div id="progress"></div></div><div id="console" class="console">Ready.</div></div><div id="summary" class="card" hidden></div><div id="results" class="card" hidden></div></div>
<script>
const API='/api/bgg-helper', BATCH=20, MAX_PARALLEL=100;let loadedGames=[];const $=id=>document.getElementById(id),wait=ms=>new Promise(r=>setTimeout(r,ms));
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function log(m){const t=new Date().toLocaleTimeString();$('console').textContent+=`\n[${t}] ${m}`;$('console').scrollTop=$('console').scrollHeight;console.log('[people]',m)}function prog(n){$('progress').style.width=Math.max(0,Math.min(100,n))+'%'}
async function api(endpoint,params={},retries=6){const url=API+'?endpoint='+encodeURIComponent(endpoint)+'&'+new URLSearchParams(params);log('GET '+endpoint+(endpoint==='thing'?` (${String(params.id).split(',').length} IDs)`:''));let r;try{r=await fetch(url)}catch(e){throw new Error('Network error: '+e.message)}if(r.status===202&&retries>0){log('BGG queued request (202); retrying…');await wait(2000);return api(endpoint,params,retries-1)}const text=await r.text();if(!r.ok){let detail=text.slice(0,250);try{detail=JSON.parse(text).message||detail}catch{}throw new Error(`API ${r.status}: ${detail}`)}if(text.trim().startsWith('{')){let j;try{j=JSON.parse(text)}catch{}if(j?.error)throw new Error(j.message||j.error)}return text}
function parseCollection(xml){const d=new DOMParser().parseFromString(xml,'text/xml');if(d.querySelector('parsererror'))throw new Error('Collection response was not valid XML.');return [...d.querySelectorAll('item')].map(it=>{const st=it.querySelector('status');const f=n=>Number(st?.getAttribute(n)||it.getAttribute(n)||0);return{id:it.getAttribute('objectid')||it.getAttribute('id'),title:it.querySelector('name')?.textContent||'',image:it.querySelector('thumbnail')?.textContent||it.querySelector('image')?.textContent||'',status:{own:f('own'),prevowned:f('prevowned'),fortrade:f('fortrade'),want:f('want'),wanttoplay:f('wanttoplay'),wanttobuy:f('wanttobuy'),wishlist:f('wishlist'),preordered:f('preordered')}}}).filter(x=>x.id)}
function parseThings(xml,domain,scope,collectionMap){const d=new DOMParser().parseFromString(xml,'text/xml');if(d.querySelector('parsererror'))throw new Error('Thing response was not valid XML.');return [...d.querySelectorAll('item')].map(it=>{const id=it.getAttribute('id'),base=collectionMap.get(id)||{};const title=it.querySelector('name[type="primary"]')?.getAttribute('value')||base.title||'Unknown';const image=it.querySelector('thumbnail')?.textContent||it.querySelector('image')?.textContent||base.image||'';let links=[...it.querySelectorAll(`link[type="${domain}"]`)].map(l=>({id:l.getAttribute('id'),name:l.getAttribute('value')})).filter(x=>x.id&&x.name);if(scope==='first')links=links.slice(0,1);return{id,title,image,status:base.status||{},people:links}})}
async function pool(chunks,worker,limit){let next=0,done=0;const out=new Array(chunks.length);async function run(){while(true){const i=next++;if(i>=chunks.length)return;try{out[i]=await worker(chunks[i],i)}catch(e){log(`Batch ${i+1} failed: ${e.message}`);out[i]=[]}done++;prog(15+80*(done/chunks.length));$('status').textContent=`Game detail batches: ${done} / ${chunks.length} complete`;}}await Promise.all(Array.from({length:Math.min(limit,chunks.length)},run));return out.flat()}
function activeStatuses(){return [...document.querySelectorAll('#filters input:checked')].map(x=>x.value)}function filtered(){const a=activeStatuses();return a.length?loadedGames.filter(g=>a.some(s=>g.status?.[s])):loadedGames}
function render(){const games=filtered(),domain=$('domain').value,scope=$('scope').value,map=new Map();for(const g of games){const seen=new Set();for(const p of g.people){if(seen.has(p.id))continue;seen.add(p.id);if(!map.has(p.id))map.set(p.id,{...p,games:[]});map.get(p.id).games.push(g)}}const rows=[...map.values()].sort((a,b)=>b.games.length-a.games.length||a.name.localeCompare(b.name)),max=rows[0]?.games.length||1,credits=rows.reduce((n,x)=>n+x.games.length,0);$('summary').hidden=false;$('results').hidden=false;$('summary').innerHTML=`<div class="summary"><div class="metric"><span class="small">Games shown</span><b>${games.length}</b></div><div class="metric"><span class="small">Unique ${label(domain)}s</span><b>${rows.length}</b></div><div class="metric"><span class="small">Credits counted</span><b>${credits}</b></div><div class="metric"><span class="small">On 2+ games</span><b>${rows.filter(x=>x.games.length>1).length}</b></div></div>`;$('results').innerHTML='<h2>Ranking</h2>'+rows.map((x,i)=>`<div class="person"><div><div class="name">${i+1}. ${esc(x.name)}</div><div class="bar"><i style="width:${Math.max(2,x.games.length/max*100)}%"></i></div><div class="games">${x.games.map(g=>`<span class="game">${g.image?`<img loading="lazy" src="${esc(g.image)}">`:''}${esc(g.title)}</span>`).join('')}</div></div><div><b>${x.games.length}</b> <span class="small">game${x.games.length===1?'':'s'}</span></div></div>`).join('');$('status').textContent=`Showing ${games.length} games • ${rows.length} unique ${label(domain).toLowerCase()}s • ${scope==='all'?'all listed':'first listed only'}.`}
function label(d){return d==='boardgamedesigner'?'Designer':d==='boardgameartist'?'Artist':'Publisher'}
async function analyze(){const btn=$('run'),user=$('username').value.trim();if(!user)return;btn.disabled=true;$('console').textContent='';$('summary').hidden=true;$('results').hidden=true;prog(2);try{log(`Starting analysis for ${user}. Collection request has NO status filters.`);$('status').textContent='Loading full collection…';const cx=await api('collection',{username:user,excludesubtype:'boardgameaccessory'});const coll=parseCollection(cx);if(!coll.length)throw new Error('No collection items returned. Check the BGG username or BGG queue status.');log(`Collection returned ${coll.length} items.`);prog(15);const cmap=new Map(coll.map(x=>[x.id,x])),chunks=[];for(let i=0;i<coll.length;i+=BATCH)chunks.push(coll.slice(i,i+BATCH).map(x=>x.id));log(`Created ${chunks.length} batches of up to ${BATCH} IDs; concurrency cap ${MAX_PARALLEL}.`);const domain=$('domain').value,scope=$('scope').value;loadedGames=await pool(chunks,async ids=>{const tx=await api('thing',{id:ids.join(',')});return parseThings(tx,domain,scope,cmap)},MAX_PARALLEL);prog(100);log(`Finished. Loaded details for ${loadedGames.length} games.`);render()}catch(e){$('status').innerHTML='<span class="error">'+esc(e.message)+'</span>';log('ERROR: '+e.message);console.error(e)}finally{btn.disabled=false}}
$('run').addEventListener('click',analyze);document.querySelectorAll('#filters input').forEach(x=>x.addEventListener('change',()=>loadedGames.length&&render()));
</script></body></html>
