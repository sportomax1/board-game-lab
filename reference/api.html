<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <title>BGG API Tester</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #222; 
            min-height: 100vh;
        }
        
        .container { 
            max-width: 430px;
            margin: 0 auto; 
            padding: 1rem;
            box-sizing: border-box;
            background: white;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        
        h1 { 
            color: #333; 
            text-align: center; 
            margin: 1em 0 1.5em 0;
            font-size: 1.8em;
            text-shadow: none;
        }
        
        .cards-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .api-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            padding: 1.5em;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }
        
        .api-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }
        
        .api-card h3 {
            margin: 0 0 0.5em 0;
            color: #1976d2;
            font-size: 1.1em;
        }
        
        .api-card p {
            margin: 0 0 1em 0;
            color: #666;
            font-size: 1rem;
            flex-grow: 1;
        }
        
        .api-card .endpoint-url {
            background: #f0f0f0;
            padding: 0.8rem;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #1976d2;
            margin-bottom: 1em;
            word-break: break-all;
            line-height: 1.4;
        }
        
        .button-group {
            display: flex;
            gap: 0.5em;
            flex-wrap: wrap;
        }
        
        .btn {
            flex: 1;
            min-width: 80px;
            padding: 0.7em 1em;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4em;
        }
        
        .btn-quick { background: #4caf50; color: white; }
        .btn-quick:hover { background: #45a049; }
        
        .btn-advanced { background: #ff9800; color: white; }
        .btn-advanced:hover { background: #e68900; }
        
        .btn-info { background: #2196f3; color: white; flex-basis: auto; min-width: 45px; }
        .btn-info:hover { background: #0b7dda; }
        
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 40px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 95%;
            max-height: 85vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5em;
            border-radius: 12px 12px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-header h2 {
            margin: 0;
            font-size: 1.4em;
        }
        
        .modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 1.8em;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-body {
            padding: 1.5em;
            flex-grow: 1;
            overflow-y: auto;
        }
        
        .form-group {
            margin-bottom: 1em;
        }
        
        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5em;
            color: #333;
            font-size: 1rem;
        }
        
        .required {
            color: #dc3545;
        }
        
        .form-input, .form-select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            background: white;
        }
        
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #1976d2;
            box-shadow: 0 0 0 2px rgba(25, 118, 210, 0.2);
        }
        
        .form-help {
            font-size: 0.8em;
            color: #666;
            margin-top: 0.3em;
            font-style: italic;
        }
        
        .param-section {
            margin-bottom: 1.5em;
            padding-bottom: 1em;
            border-bottom: 1px solid #eee;
        }
        
        .param-section:last-child {
            border-bottom: none;
        }
        
        .param-section h4 {
            margin: 0 0 0.8em 0;
            color: #1976d2;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.6em;
        }
        
        .checkbox-item {
            display: flex;
            align-items: center;
        }
        
        .checkbox-item input[type="checkbox"] {
            margin-right: 0.5em;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .checkbox-item label {
            cursor: pointer;
            font-size: 0.9em;
            flex: 1;
        }
        
        .modal-footer {
            padding: 1em 1.5em;
            background: #f8f9fa;
            border-top: 1px solid #eee;
            display: flex;
            gap: 0.8em;
            justify-content: flex-end;
        }
        
        .btn-modal {
            padding: 0.8em 1.5em;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95em;
        }
        
        .btn-submit {
            background: #4caf50;
            color: white;
        }
        
        .btn-submit:hover {
            background: #45a049;
        }
        
        .btn-cancel {
            background: #ccc;
            color: #333;
        }
        
        .btn-cancel:hover {
            background: #bbb;
        }
        
        /* Info Modal */
        .info-content {
            font-size: 0.95em;
            line-height: 1.6;
        }
        
        .info-content strong {
            color: #1976d2;
        }
        
        .info-section {
            margin-bottom: 1em;
        }
        
        /* Response Display */
        .response-container {
            margin-top: 2em;
            padding: 1.5em;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: none;
        }
        
        .response-container.active {
            display: block;
        }
        
        .response-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1em;
            padding-bottom: 1em;
            border-bottom: 2px solid #1976d2;
        }
        
        .response-header h3 {
            margin: 0;
            color: #1976d2;
        }
        
        .response-status {
            font-weight: 600;
            padding: 0.4em 0.8em;
            border-radius: 6px;
        }
        
        .status-success {
            background: #d4edda;
            color: #155724;
        }
        
        .status-error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .response-content {
            background: #1e1e1e;
            color: #d4d4d4;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
        }

        .response-url {
            background: #e3f2fd;
            border: 1px solid #90caf9;
            border-radius: 6px;
            padding: 1rem;
            margin-bottom: 1em;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            color: #1565c0;
            word-break: break-word;
            line-height: 1.5;
        }

        .response-url-label {
            font-weight: 600;
            color: #0d47a1;
            display: block;
            margin-bottom: 0.3em;
            font-size: 0.85em;
        }

        .response-actions {
            display: flex;
            gap: 0.5em;
            margin-top: 1em;
            flex-wrap: wrap;
        }

        .btn-expand-response {
            flex: 1;
            min-width: 120px;
            padding: 0.6em 1em;
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
        }

        .btn-expand-response:hover {
            background: #1976d2;
        }

        .btn-copy-url {
            flex: 1;
            min-width: 120px;
            padding: 0.6em 1em;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
        }

        .btn-copy-url:hover {
            background: #45a049;
        }

        /* Full Response Modal */
        .full-response-modal {
            display: none;
            position: fixed;
            z-index: 1001;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            animation: fadeIn 0.3s;
        }

        .full-response-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .full-response-content {
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 40px rgba(0,0,0,0.3);
            max-width: 90vw;
            width: 95%;
            max-height: 90vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .full-response-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5em;
            border-radius: 12px 12px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .full-response-header h3 {
            margin: 0;
            font-size: 1.2em;
        }

        .full-response-body {
            padding: 1.5em;
            flex-grow: 1;
            overflow-y: auto;
            background: #f5f5f5;
        }

        .full-response-data {
            background: #1e1e1e;
            color: #d4d4d4;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 1.5rem;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.6;
        }

        .loading {
            text-align: center;
            color: #666;
            padding: 2em;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1976d2;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto 0.5em;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .response-url {
                font-size: 0.7em;
            }
            .response-content {
                font-size: 0.7em;
            }
            .response-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 BGG API Tester</h1>
        
        <div class="cards-grid" id="cardsGrid"></div>
    </div>

    <!-- Response Modal -->
    <div class="modal" id="responseModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="responseTitle">📄 API Response</h2>
                <button class="modal-close" onclick="closeResponseModal()">✕</button>
            </div>
            <div class="modal-body" id="responseModalBody">
                <div class="response-url">
                    <span class="response-url-label">Full API URL:</span>
                    <div id="responseURL"></div>
                </div>
                <div>
                    <strong>Status:</strong> <span class="response-status" id="responseStatus"></span>
                </div>
                <div class="response-content" id="responseContent"></div>
                <div class="response-actions">
                    <button class="btn-expand-response" onclick="openFullResponseModal()">🔍 View Full Response</button>
                    <button class="btn-copy-url" onclick="copyURLToClipboard()">📋 Copy URL</button>
                    <button class="btn-expand-response" onclick="resubmitCall()" style="background: #ff9800;">🔄 Resubmit</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Full Response Modal -->
    <div class="full-response-modal" id="fullResponseModal">
        <div class="full-response-content">
            <div class="full-response-header">
                <h3>📄 Full API Response</h3>
                <button class="modal-close" onclick="closeFullResponseModal()">✕</button>
            </div>
            <div class="full-response-body">
                <div class="full-response-data" id="fullResponseData"></div>
            </div>
        </div>
    </div>

    <!-- Advanced Modal -->
    <div class="modal" id="advancedModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="advancedTitle">Advanced Options</h2>
                <button class="modal-close" onclick="closeAdvancedModal()">✕</button>
            </div>
            <div class="modal-body" id="advancedBody"></div>
            <div class="modal-footer">
                <button class="btn-modal btn-cancel" onclick="closeAdvancedModal()">Cancel</button>
                <button class="btn-modal btn-submit" onclick="executeAdvancedCall()">Execute</button>
            </div>
        </div>
    </div>

    <!-- Info Modal -->
    <div class="modal" id="infoModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="infoTitle">API Information</h2>
                <button class="modal-close" onclick="closeInfoModal()">✕</button>
            </div>
            <div class="modal-body info-content" id="infoBody"></div>
            <div class="modal-footer">
                <button class="btn-modal btn-cancel" onclick="closeInfoModal()" style="margin-left: auto;">Close</button>
            </div>
        </div>
    </div>

    <script>
        // API Endpoint Definitions
        const endpoints = {
            v2: [
                {
                    key: 'thing',
                    name: '🎯 Thing (Game Details)',
                    desc: 'Get detailed information about games, expansions, accessories',
                    url: 'https://boardgamegeek.com/xmlapi2/thing',
                    required: [
                        { name: 'id', type: 'text', label: 'Game IDs (comma separated)', example: '174430,167791', help: 'One or more game IDs' }
                    ],
                    optional: [
                        { name: 'type', type: 'select', label: 'Item type', options: ['boardgame', 'boardgameexpansion', 'boardgameaccessory'], default: 'boardgame' },
                        { name: 'stats', type: 'checkbox', label: 'Include statistics' },
                        { name: 'versions', type: 'checkbox', label: 'Include version information' },
                        { name: 'videos', type: 'checkbox', label: 'Include video information' },
                        { name: 'comments', type: 'checkbox', label: 'Include user comments' },
                        { name: 'ratingcomments', type: 'checkbox', label: 'Include rating comments' },
                        { name: 'page', type: 'number', label: 'Page number for comments' },
                        { name: 'pagesize', type: 'number', label: 'Comments per page (max 100)' }
                    ],
                    info: 'Retrieve comprehensive game information including stats, ratings, rankings, and player recommendations. Great for getting game details by ID.'
                },
                {
                    key: 'collection',
                    name: '📦 Collection',
                    desc: 'Get a user\'s game collection with filtering options',
                    url: 'https://boardgamegeek.com/xmlapi2/collection',
                    required: [
                        { name: 'username', type: 'text', label: 'BGG Username', example: 'sportomax', help: 'The user whose collection to fetch' }
                    ],
                    optional: [
                        { name: 'own', type: 'checkbox', label: 'Include owned games' },
                        { name: 'stats', type: 'checkbox', label: 'Include statistics' },
                        { name: 'subtype', type: 'select', label: 'Subtype filter', options: ['boardgame', 'boardgameexpansion'] },
                        { name: 'minrating', type: 'number', label: 'Minimum user rating (1-10)' },
                        { name: 'maxplays', type: 'number', label: 'Maximum play count' }
                    ],
                    info: 'Fetch a user\'s board game collection. Supports extensive filtering by ownership status, ratings, play counts, and more. Great for analyzing collections.'
                },
                {
                    key: 'search',
                    name: '🔍 Search',
                    desc: 'Search for games, expansions, and accessories by name',
                    url: 'https://boardgamegeek.com/xmlapi2/search',
                    required: [
                        { name: 'query', type: 'text', label: 'Search query', example: 'Catan', help: 'Game name to search for' }
                    ],
                    optional: [
                        { name: 'type', type: 'select', label: 'Search type', options: ['boardgame', 'boardgameexpansion', 'boardgameaccessory', 'videogame', 'rpgitem', 'rpgissue'], default: 'boardgame' },
                        { name: 'exact', type: 'checkbox', label: 'Exact name match only' }
                    ],
                    info: 'Search the BGG database for games by name. Returns matching items with IDs that can be used with other endpoints.'
                },
                {
                    key: 'user',
                    name: '👤 User Info',
                    desc: 'Get user profile information and optional data',
                    url: 'https://boardgamegeek.com/xmlapi2/user',
                    required: [
                        { name: 'name', type: 'text', label: 'BGG Username', example: 'sportomax', help: 'The user to fetch info for' }
                    ],
                    optional: [
                        { name: 'buddies', type: 'checkbox', label: 'Include buddy list' },
                        { name: 'guilds', type: 'checkbox', label: 'Include guild memberships' },
                        { name: 'hot', type: 'checkbox', label: 'Include user\'s hot list' },
                        { name: 'top', type: 'checkbox', label: 'Include user\'s top list' }
                    ],
                    info: 'Get user profile information including buddies, guilds, and personal lists. Useful for social networking features.'
                },
                {
                    key: 'hot',
                    name: '🔥 Hot Items',
                    desc: 'Get currently hot/trending items by type',
                    url: 'https://boardgamegeek.com/xmlapi2/hot',
                    required: [],
                    optional: [
                        { name: 'type', type: 'select', label: 'Hot list type', options: ['boardgame', 'rpg', 'videogame', 'boardgameperson', 'rpgperson', 'boardgamecompany', 'rpgcompany', 'videogamecompany'], default: 'boardgame' }
                    ],
                    info: 'Get trending/hot items currently popular on BoardGameGeek. No parameters required - defaults to board games.'
                },
                {
                    key: 'plays',
                    name: '📊 Plays',
                    desc: 'Get play data for a user with date and game filtering',
                    url: 'https://boardgamegeek.com/xmlapi2/plays',
                    required: [
                        { name: 'username', type: 'text', label: 'BGG Username', example: 'sportomax', help: 'User whose plays to fetch' }
                    ],
                    optional: [
                        { name: 'id', type: 'text', label: 'Game ID to filter plays', example: '174430' },
                        { name: 'mindate', type: 'date', label: 'Start date (YYYY-MM-DD)' },
                        { name: 'maxdate', type: 'date', label: 'End date (YYYY-MM-DD)' },
                        { name: 'page', type: 'number', label: 'Page number (100 plays per page)' }
                    ],
                    info: 'Fetch a user\'s recorded plays. Supports filtering by date range and specific games.'
                }
            ],
            v1: [
                {
                    key: 'boardgame_v1',
                    name: '🎲 Game Info (Legacy)',
                    desc: 'Get detailed game information by ID (legacy format)',
                    url: 'https://boardgamegeek.com/xmlapi/boardgame',
                    required: [
                        { name: 'id', type: 'text', label: 'Game IDs (comma separated)', example: '174430,167791', help: 'One or more game IDs' }
                    ],
                    optional: [
                        { name: 'stats', type: 'checkbox', label: 'Include statistics' }
                    ],
                    info: 'BGG XML API v1 (Legacy) - Get game information in legacy format. Specify game IDs as parameters.'
                },
                {
                    key: 'search_v1',
                    name: '🔍 Search Games (Legacy)',
                    desc: 'Search for games by name (legacy format)',
                    url: 'https://boardgamegeek.com/xmlapi/search',
                    required: [
                        { name: 'search', type: 'text', label: 'Search query', example: 'Catan', help: 'Game name to search for' }
                    ],
                    optional: [],
                    info: 'BGG XML API v1 (Legacy) - Search for games by name in legacy format.'
                },
                {
                    key: 'collection_v1',
                    name: '📚 Collection (Legacy)',
                    desc: 'Get user collection (legacy format)',
                    url: 'https://boardgamegeek.com/xmlapi/collection',
                    required: [
                        { name: 'username', type: 'text', label: 'BGG Username', example: 'sportomax', help: 'The user whose collection to fetch' }
                    ],
                    optional: [
                        { name: 'own', type: 'checkbox', label: 'Include owned games' },
                        { name: 'rated', type: 'checkbox', label: 'Include rated games' },
                        { name: 'played', type: 'checkbox', label: 'Include played games' }
                    ],
                    info: 'BGG XML API v1 (Legacy) - Get user collection in legacy format.'
                },
                {
                    key: 'geeklist_v1',
                    name: '📋 GeekList (Legacy)',
                    desc: 'Get GeekList contents and metadata',
                    url: 'https://boardgamegeek.com/xmlapi/geeklist',
                    required: [
                        { name: 'id', type: 'text', label: 'GeekList ID', example: '12345', help: 'The GeekList ID to fetch' }
                    ],
                    optional: [
                        { name: 'comments', type: 'checkbox', label: 'Include comments' }
                    ],
                    info: 'BGG XML API v1 (Legacy) - Get GeekList contents and metadata.'
                },
                {
                    key: 'boardgamefamily_v1',
                    name: '👨‍👩‍👧‍👦 Game Family (Legacy)',
                    desc: 'Get games in a family/series',
                    url: 'https://boardgamegeek.com/xmlapi/boardgamefamily',
                    required: [
                        { name: 'id', type: 'text', label: 'Family IDs (comma separated)', example: '12345', help: 'One or more game family IDs' }
                    ],
                    optional: [],
                    info: 'BGG XML API v1 (Legacy) - Get games in a family/series.'
                },
                {
                    key: 'boardgamepublisher_v1',
                    name: '🏭 Publisher (Legacy)',
                    desc: 'Get publisher information and games',
                    url: 'https://boardgamegeek.com/xmlapi/boardgamepublisher',
                    required: [
                        { name: 'id', type: 'text', label: 'Publisher IDs (comma separated)', example: '12345', help: 'One or more publisher IDs' }
                    ],
                    optional: [],
                    info: 'BGG XML API v1 (Legacy) - Get publisher information and games.'
                }
            ]
        };

        let currentEndpoint = null;
        let currentAdvancedParams = {};
        let lastFullResponse = '';
        let lastRequestUrl = '';
        let lastCallParams = null;

        // Initialize
        function init() {
            renderCards();
        }

        // Render API cards
        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            // Render v2 endpoints
            let sectionHTML = '<div style="grid-column: 1/-1; margin-top: 1em;"><h2 style="color: white; text-align: center; font-size: 1.5em; margin-bottom: 1em;">📡 BGG XML API v2</h2></div>';
            
            endpoints.v2.forEach(endpoint => {
                const card = document.createElement('div');
                card.className = 'api-card';
                card.innerHTML = createCardHTML(endpoint);
                if (sectionHTML) {
                    grid.innerHTML += sectionHTML;
                    sectionHTML = '';
                }
                grid.appendChild(card);
            });

            // Add v1 section
            grid.innerHTML += '<div style="grid-column: 1/-1; margin-top: 2em;"><h2 style="color: white; text-align: center; font-size: 1.5em; margin-bottom: 1em;">🗂️ BGG XML API v1 (Legacy)</h2></div>';

            endpoints.v1.forEach(endpoint => {
                const card = document.createElement('div');
                card.className = 'api-card';
                card.innerHTML = createCardHTML(endpoint);
                grid.appendChild(card);
            });
        }

        function createCardHTML(endpoint) {
            return `
                <h3>${endpoint.name}</h3>
                <p>${endpoint.desc}</p>
                <div class="endpoint-url">${endpoint.url}</div>
                <div class="button-group">
                    <button class="btn btn-quick" onclick="executeQuickCall('${endpoint.key}')">▶️ Quick</button>
                    <button class="btn btn-advanced" onclick="openAdvancedModal('${endpoint.key}')">⚙️ Advanced</button>
                    <button class="btn btn-info" onclick="showInfo('${endpoint.key}')" title="More info">ⓘ</button>
                </div>
            `;
        }

        // Get endpoint by key
        function getEndpoint(key) {
            for (const version in endpoints) {
                const found = endpoints[version].find(e => e.key === key);
                if (found) return found;
            }
            return null;
        }

        // Execute quick call
        async function executeQuickCall(key) {
            const endpoint = getEndpoint(key);
            if (!endpoint) return;

            // For quick calls, use defaults or prompt for required fields
            const params = {};
            let missingRequired = false;

            for (const field of endpoint.required) {
                // Get recommended value from example
                const recommendedValue = field.example || '';
                const promptMessage = `Enter ${field.label}:${field.example ? ` (e.g., ${field.example})` : ''}`;
                let value = prompt(promptMessage, recommendedValue);
                // User clicked cancel or entered empty value
                if (!value || value.trim() === '') {
                    missingRequired = true;
                    break;
                }
                params[field.name] = value;
            }

            if (missingRequired) return;

            await executeCall(endpoint, params, 'quick');
        }

        // Open advanced modal
        function openAdvancedModal(key) {
            currentEndpoint = getEndpoint(key);
            currentAdvancedParams = {};

            document.getElementById('advancedTitle').textContent = `${currentEndpoint.name} - Advanced Options`;

            let html = '';

            // Required fields
            if (currentEndpoint.required.length > 0) {
                html += '<div class="param-section"><h4>Required Parameters</h4>';
                currentEndpoint.required.forEach(field => {
                    html += renderFormField(field, 'required');
                });
                html += '</div>';
            }

            // Optional fields
            if (currentEndpoint.optional.length > 0) {
                html += '<div class="param-section"><h4>Optional Parameters</h4>';
                const checkboxFields = currentEndpoint.optional.filter(f => f.type === 'checkbox');
                const otherFields = currentEndpoint.optional.filter(f => f.type !== 'checkbox');

                otherFields.forEach(field => {
                    html += renderFormField(field, 'optional');
                });

                if (checkboxFields.length > 0) {
                    html += '<div style="margin-top: 1em;"><strong>Flags:</strong></div><div class="checkbox-group">';
                    checkboxFields.forEach(field => {
                        html += `
                            <div class="checkbox-item">
                                <input type="checkbox" id="${field.name}" data-param="${field.name}">
                                <label for="${field.name}">${field.label}</label>
                            </div>
                        `;
                    });
                    html += '</div>';
                }

                html += '</div>';
            }

            document.getElementById('advancedBody').innerHTML = html;
            document.getElementById('advancedModal').classList.add('active');
        }

        // Render form field
        function renderFormField(field, type) {
            let html = `<div class="form-group">`;
            html += `<label class="form-label">${field.label}${type === 'required' ? '<span class="required">*</span>' : ''}</label>`;

            if (field.type === 'text') {
                html += `<input type="text" id="${field.name}" class="form-input" placeholder="${field.example || ''}" data-param="${field.name}">`;
            } else if (field.type === 'number') {
                html += `<input type="number" id="${field.name}" class="form-input" data-param="${field.name}">`;
            } else if (field.type === 'date') {
                html += `<input type="date" id="${field.name}" class="form-input" data-param="${field.name}">`;
            } else if (field.type === 'select') {
                html += `<select id="${field.name}" class="form-select" data-param="${field.name}">
                    <option value="">-- Select --</option>`;
                field.options.forEach(opt => {
                    html += `<option value="${opt}">${opt}</option>`;
                });
                html += `</select>`;
            }

            if (field.help) {
                html += `<div class="form-help">${field.help}</div>`;
            }

            html += '</div>';
            return html;
        }

        // Execute advanced call
        async function executeAdvancedCall() {
            const params = {};

            // Collect required params
            for (const field of currentEndpoint.required) {
                const value = document.getElementById(field.name).value.trim();
                if (!value) {
                    alert(`${field.label} is required`);
                    return;
                }
                params[field.name] = value;
            }

            // Collect optional params
            for (const field of currentEndpoint.optional) {
                const el = document.getElementById(field.name);
                if (!el) continue;

                if (field.type === 'checkbox') {
                    if (el.checked) params[field.name] = '1';
                } else {
                    const value = el.value.trim();
                    if (value) params[field.name] = value;
                }
            }

            closeAdvancedModal();
            await executeCall(currentEndpoint, params, 'advanced');
        }

        // Execute API call
        async function executeCall(endpoint, params, callType) {
            const responseModal = document.getElementById('responseModal');
            const responseStatus = document.getElementById('responseStatus');
            const responseContent = document.getElementById('responseContent');
            const responseURL = document.getElementById('responseURL');

            // Store for resubmit functionality
            lastCallParams = { endpoint, params, callType };

            responseModal.classList.add('active');
            responseStatus.textContent = 'Loading...';
            responseStatus.className = 'response-status';
            responseContent.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';

            try {
                let fullUrl;
                
                if (endpoint.key.includes('_v1')) {
                    // Handle v1 legacy endpoints - ID goes after forward slash
                    const baseUrl = endpoint.url;
                    const idParam = params.id;
                    const searchParam = params.search;
                    const usernameParam = params.username;
                    
                    // Build URL based on which parameter exists
                    if (idParam) {
                        // For endpoints that use ID (boardgame, geeklist, boardgamefamily, boardgamepublisher)
                        fullUrl = `${baseUrl}/${idParam}`;
                        // Add other params if any (excluding id)
                        const otherParams = { ...params };
                        delete otherParams.id;
                        const queryString = new URLSearchParams(otherParams).toString();
                        if (queryString) fullUrl += `?${queryString}`;
                    } else if (searchParam) {
                        // For search endpoint
                        fullUrl = `${baseUrl}?search=${encodeURIComponent(searchParam)}`;
                    } else if (usernameParam) {
                        // For collection endpoint
                        fullUrl = `${baseUrl}/${usernameParam}`;
                        // Add other params if any (excluding username)
                        const otherParams = { ...params };
                        delete otherParams.username;
                        const queryString = new URLSearchParams(otherParams).toString();
                        if (queryString) fullUrl += `?${queryString}`;
                    } else {
                        // Fallback to query string format
                        const queryString = new URLSearchParams(params).toString();
                        fullUrl = `${baseUrl}?${queryString}`;
                    }
                } else {
                    // For v2 endpoints, use the proxy
                    const queryString = new URLSearchParams(params).toString();
                    fullUrl = `/api/bgg-helper?endpoint=${endpoint.key}&${queryString}`;
                }

                lastRequestUrl = fullUrl;
                responseURL.textContent = fullUrl;

                const response = await fetch(fullUrl);
                const text = await response.text();

                lastFullResponse = text;

                if (response.ok) {
                    responseStatus.textContent = `✅ ${response.status} OK`;
                    responseStatus.className = 'response-status status-success';
                } else {
                    responseStatus.textContent = `❌ ${response.status} ${response.statusText}`;
                    responseStatus.className = 'response-status status-error';
                }

                const preview = text.length > 2500 ? text.substring(0, 2500) + '\n\n... [Response truncated - click "View Full Response" to see all]' : text;
                
                // Pretty format XML with indentation
                const prettyText = prettifyXML(preview);
                responseContent.textContent = prettyText;

            } catch (error) {
                responseStatus.textContent = `❌ Error`;
                responseStatus.className = 'response-status status-error';
                responseContent.textContent = `Error: ${error.message}`;
                lastFullResponse = `Error: ${error.message}`;
            }
        }

        // Pretty format XML with proper indentation
        function prettifyXML(xml) {
            if (!xml || xml.length === 0) return xml;
            
            const tab = '  ';
            let formatted = '';
            let indent = 0;
            const maxIndent = 50; // Prevent infinite loops
            
            // Split by > and reassemble with proper formatting
            const parts = xml.split('>');
            
            for (let i = 0; i < parts.length; i++) {
                let part = parts[i].trim();
                if (!part) continue;
                
                // Check if this is a closing tag
                const isClosing = part.includes('</');
                const isSelfClosing = part.endsWith('/') || part.includes('/>');
                
                // Decrease indent for closing tags
                if (isClosing && indent > 0) {
                    indent--;
                }
                
                // Prevent runaway indentation
                if (indent > maxIndent) {
                    indent = maxIndent;
                }
                
                formatted += tab.repeat(indent) + part + '>\n';
                
                // Increase indent for opening tags (not closing, not self-closing)
                if (!isClosing && !isSelfClosing && !part.startsWith('?') && !part.startsWith('!')) {
                    indent++;
                }
            }
            
            return formatted;
        }

        // Show info modal
        function showInfo(key) {
            const endpoint = getEndpoint(key);
            document.getElementById('infoTitle').textContent = endpoint.name;

            let html = `
                <div class="info-section">
                    <strong>Description:</strong><br>
                    ${endpoint.desc}
                </div>
                <div class="info-section">
                    <strong>Endpoint URL:</strong><br>
                    <code style="word-break: break-all; background: #f0f0f0; padding: 0.5em; display: block; border-radius: 4px;">${endpoint.url}</code>
                </div>
                <div class="info-section">
                    <strong>Details:</strong><br>
                    ${endpoint.info}
                </div>
            `;

            document.getElementById('infoBody').innerHTML = html;
            document.getElementById('infoModal').classList.add('active');
        }

        // Close modals
        function closeAdvancedModal() {
            document.getElementById('advancedModal').classList.remove('active');
        }

        function closeInfoModal() {
            document.getElementById('infoModal').classList.remove('active');
        }

        function closeResponseModal() {
            document.getElementById('responseModal').classList.remove('active');
        }

        function closeFullResponseModal() {
            document.getElementById('fullResponseModal').classList.remove('active');
        }

        function openFullResponseModal() {
            const prettyText = prettifyXML(lastFullResponse);
            document.getElementById('fullResponseData').textContent = prettyText;
            document.getElementById('fullResponseModal').classList.add('active');
        }

        function copyURLToClipboard() {
            navigator.clipboard.writeText(lastRequestUrl).then(() => {
                alert('API URL copied to clipboard!');
            }).catch(err => {
                alert('Failed to copy: ' + err);
            });
        }

        // Resubmit the last API call
        function resubmitCall() {
            if (!lastCallParams) {
                alert('No previous call to resubmit');
                return;
            }
            // Close current modal and re-execute
            closeResponseModal();
            executeCall(lastCallParams.endpoint, lastCallParams.params, lastCallParams.callType);
        }

        // Close modals on background click
        document.getElementById('advancedModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('advancedModal')) closeAdvancedModal();
        });

        document.getElementById('infoModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('infoModal')) closeInfoModal();
        });

        document.getElementById('responseModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('responseModal')) closeResponseModal();
        });

        document.getElementById('fullResponseModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('fullResponseModal')) closeFullResponseModal();
        });

        // Initialize on load
        window.addEventListener('load', init);
    </script>
</body>
</html>
