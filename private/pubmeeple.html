<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Pub Meeple Rankings</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1e90ff 0%, #0056b3 100%);
            color: #1c1e21;
            overflow-x: hidden;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        /* Header Section */
        .header {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            padding: 20px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin: 0 0 16px 0;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #1e90ff 0%, #0056b3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Stats Summary */
        .stats-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: linear-gradient(135deg, #1e90ff 0%, #0056b3 100%);
            color: white;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(30, 144, 255, 0.3);
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            display: block;
        }

        .stat-label {
            font-size: 11px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        /* Filters */
        .filters {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .filter-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .filter-row::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            flex: 0 0 auto;
            padding: 10px 18px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            color: #333;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #1e90ff 0%, #0056b3 100%);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(30, 144, 255, 0.4);
        }

        .filter-btn:active {
            transform: scale(0.95);
        }

        /* Search Bar */
        .search-container {
            margin-top: 10px;
        }

        .search-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            background: white;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: #1e90ff;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: white;
            font-size: 18px;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Game List */
        .game-list {
            padding: 16px;
            display: grid;
            gap: 12px;
        }

        .game-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            padding: 12px;
            gap: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .game-card:active {
            transform: scale(0.98);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .game-thumbnail {
            width: 80px;
            height: 80px;
            flex-shrink: 0;
            border-radius: 8px;
            overflow: hidden;
            background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-thumbnail.loading {
            font-size: 10px;
            color: #999;
            text-align: center;
            padding: 4px;
        }

        .game-info {
            flex: 1;
            min-width: 0;
        }

        .game-name {
            font-size: 16px;
            font-weight: 600;
            color: #1c1e21;
            margin: 0 0 6px 0;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .game-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 12px;
            color: #65676b;
        }

        .meta-tag {
            background: #f0f2f5;
            padding: 3px 8px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .game-rank {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 12px;
            border-radius: 12px;
            min-width: 60px;
            flex-shrink: 0;
            transition: background 0.3s ease;
        }

        .rank-number {
            font-size: 24px;
            font-weight: 700;
            color: white;
            line-height: 1;
        }

        .rank-percentage {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 4px;
            text-align: center;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.6;
        }

        .empty-state-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .empty-state-subtext {
            font-size: 14px;
            opacity: 0.8;
        }

        /* Error State */
        .error-message {
            background: #ff4444;
            color: white;
            padding: 16px;
            margin: 16px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }

        .modal-overlay.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { 
                opacity: 0;
                transform: translateY(30px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #1c1e21;
            flex: 1;
            line-height: 1.3;
        }

        .modal-close {
            background: #f0f2f5;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 24px;
            color: #65676b;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .modal-close:active {
            background: #e4e6eb;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .ranking-item {
            background: #f0f2f5;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ranking-info {
            flex: 1;
        }

        .ranking-title {
            font-size: 14px;
            font-weight: 600;
            color: #1c1e21;
            margin-bottom: 4px;
        }

        .ranking-details {
            font-size: 12px;
            color: #65676b;
        }

        .ranking-badge {
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
            min-width: 50px;
            text-align: center;
            transition: background 0.3s ease;
        }

        .ranking-percentile {
            font-size: 10px;
            opacity: 0.9;
            margin-top: 2px;
        }

        .modal-summary {
            background: linear-gradient(135deg, #1e90ff 0%, #0056b3 100%);
            color: white;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            text-align: center;
        }

        .summary-value {
            font-size: 28px;
            font-weight: 700;
            display: block;
        }

        .summary-label {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header with Filters and Stats -->
        <div class="header">
            <h1>🎲 Pub Meeple Rankings</h1>
            
            <!-- Stats Summary -->
            <div class="stats-summary">
                <div class="stat-card">
                    <span class="stat-value" id="total-games">-</span>
                    <span class="stat-label">Games</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="avg-rank">-</span>
                    <span class="stat-label">Avg Rank</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="avg-percentile">-</span>
                    <span class="stat-label">Avg %ile</span>
                </div>
            </div>

            <!-- View Mode Toggle -->
            <div class="view-toggle" style="margin-bottom: 12px; display: flex; gap: 8px;">
                <button class="filter-btn active" id="view-all-btn" onclick="setViewMode('all')">All Rankings</button>
                <button class="filter-btn" id="view-distinct-btn" onclick="setViewMode('distinct')">Distinct Games</button>
            </div>

            <!-- Filters -->
            <div class="filters">
                <div class="filter-row" id="person-filters">
                    <button class="filter-btn active" data-filter-type="person" data-filter-value="all">All</button>
                </div>
                <div class="filter-row" id="year-filters">
                    <button class="filter-btn active" data-filter-type="year" data-filter-value="all">All Years</button>
                </div>
                <div class="filter-row" id="category-filters">
                    <button class="filter-btn active" data-filter-type="category" data-filter-value="all">All Events</button>
                </div>
            </div>

            <!-- Search -->
            <div class="search-container">
                <input type="text" class="search-input" id="search-input" placeholder="Search games...">
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <div>Loading games...</div>
        </div>

        <!-- Error State -->
        <div id="error" class="error-message" style="display: none;"></div>

        <!-- Game List -->
        <div class="game-list" id="game-list"></div>

        <!-- Empty State -->
        <div id="empty-state" class="empty-state" style="display: none;">
            <div class="empty-state-icon">🔍</div>
            <div class="empty-state-text">No games found</div>
            <div class="empty-state-subtext">Try adjusting your filters or search</div>
        </div>
    </div>

    <!-- Modal for Game Rankings Details -->
    <div class="modal-overlay" id="rankings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-game-name">Game Name</h2>
                <button class="modal-close" onclick="closeRankingsModal()">×</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Content populated by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        // Global State
        let allGames = [];
        let filteredGames = [];
        let currentFilters = {
            person: 'all',
            year: 'all',
            category: 'all',
            search: ''
        };
        let viewMode = 'all'; // 'all' or 'distinct'
        let gameImageCache = {};
        let batchFetchQueue = [];

        // BGG API Helper (using proxy from random9)
        const IMAGE_PROXY = 'https://images.weserv.nl/?url=';
        
        async function fetchBGG(endpoint, params = {}, retries = 5) {
            const queryParams = new URLSearchParams(params).toString();
            const fullUrl = `/api/bgg-helper?endpoint=${endpoint}&${queryParams}`;
            
            try {
                const response = await fetch(fullUrl);
                
                if (response.status === 202 && retries > 0) {
                    await new Promise(resolve => setTimeout(resolve, 3000));
                    return fetchBGG(endpoint, params, retries - 1);
                }
                
                if (!response.ok) {
                    throw new Error(`BGG API fetch failed: ${response.status}`);
                }
                
                return await response.text();
            } catch (error) {
                console.error('BGG API Error:', error);
                return null;
            }
        }

        // Parse CSV
        function parseCSV(text) {
            const lines = text.trim().split('\n');
            const headers = lines[0].split(',');
            const games = [];
            
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i];
                if (!line.trim()) continue;
                
                // Parse CSV with quoted values
                const values = [];
                let current = '';
                let inQuotes = false;
                
                for (let j = 0; j < line.length; j++) {
                    const char = line[j];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        values.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                values.push(current.trim());
                
                if (values.length >= 5) {
                    games.push({
                        year: parseInt(values[0]),
                        rank: parseInt(values[1]),
                        name: values[2].replace(/^"|"$/g, ''),
                        category: values[3].replace(/^"|"$/g, ''),
                        person: values[4].replace(/^"|"$/g, '')
                    });
                }
            }
            
            return games;
        }

        // Load CSV Data
        async function loadCSVData() {
            try {
                const response = await fetch('pubmeeple.csv');
                if (!response.ok) throw new Error('Failed to load CSV');
                
                const text = await response.text();
                allGames = parseCSV(text);
                
                initializeFilters();
                applyFilters();
                
            } catch (error) {
                console.error('Error loading CSV:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').textContent = 'Failed to load game data. Please refresh the page.';
                document.getElementById('error').style.display = 'block';
            }
        }

        // Initialize Filter Buttons
        function initializeFilters() {
            const people = [...new Set(allGames.map(g => g.person))].sort();
            const years = [...new Set(allGames.map(g => g.year))].sort((a, b) => b - a);
            const categories = [...new Set(allGames.map(g => g.category))].sort();
            
            // Person filters
            const personContainer = document.getElementById('person-filters');
            people.forEach(person => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.textContent = person;
                btn.dataset.filterType = 'person';
                btn.dataset.filterValue = person;
                personContainer.appendChild(btn);
            });
            
            // Year filters
            const yearContainer = document.getElementById('year-filters');
            years.forEach(year => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.textContent = year;
                btn.dataset.filterType = 'year';
                btn.dataset.filterValue = year;
                yearContainer.appendChild(btn);
            });
            
            // Category filters
            const categoryContainer = document.getElementById('category-filters');
            categories.forEach(category => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.textContent = category;
                btn.dataset.filterType = 'category';
                btn.dataset.filterValue = category;
                categoryContainer.appendChild(btn);
            });
            
            // Add filter button click handlers
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', handleFilterClick);
            });
            
            // Search handler
            document.getElementById('search-input').addEventListener('input', (e) => {
                currentFilters.search = e.target.value.toLowerCase();
                applyFilters();
            });
        }

        // Handle Filter Click
        function handleFilterClick(e) {
            const btn = e.target;
            const filterType = btn.dataset.filterType;
            const filterValue = btn.dataset.filterValue;
            
            // Remove active from siblings
            btn.parentElement.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.remove('active');
            });
            
            // Add active to clicked button
            btn.classList.add('active');
            
            // Update filter
            currentFilters[filterType] = filterValue;
            applyFilters();
        }

        // Set View Mode
        function setViewMode(mode) {
            viewMode = mode;
            document.getElementById('view-all-btn').classList.toggle('active', mode === 'all');
            document.getElementById('view-distinct-btn').classList.toggle('active', mode === 'distinct');
            applyFilters();
        }

        // Apply Filters
        function applyFilters() {
            let filtered = allGames.filter(game => {
                // Person filter
                if (currentFilters.person !== 'all' && game.person !== currentFilters.person) {
                    return false;
                }
                
                // Year filter
                if (currentFilters.year !== 'all' && game.year !== parseInt(currentFilters.year)) {
                    return false;
                }
                
                // Category filter
                if (currentFilters.category !== 'all' && game.category !== currentFilters.category) {
                    return false;
                }
                
                // Search filter
                if (currentFilters.search && !game.name.toLowerCase().includes(currentFilters.search)) {
                    return false;
                }
                
                return true;
            });
            
            // If distinct mode, aggregate by game name
            if (viewMode === 'distinct') {
                const gameMap = new Map();
                
                filtered.forEach(game => {
                    if (!gameMap.has(game.name)) {
                        gameMap.set(game.name, {
                            name: game.name,
                            appearances: [],
                            avgRank: 0,
                            avgPercentile: 0
                        });
                    }
                    
                    const entry = gameMap.get(game.name);
                    entry.appearances.push(game);
                });
                
                // Calculate averages for each distinct game
                filteredGames = Array.from(gameMap.values()).map(entry => {
                    const avgRank = entry.appearances.reduce((sum, g) => sum + g.rank, 0) / entry.appearances.length;
                    
                    const avgPercentile = entry.appearances.reduce((sum, game) => {
                        const maxRank = getMaxRankForGame(game);
                        const percentile = ((maxRank - game.rank) / maxRank * 100);
                        return sum + percentile;
                    }, 0) / entry.appearances.length;
                    
                    return {
                        name: entry.name,
                        rank: Math.round(avgRank),
                        avgPercentile: Math.round(avgPercentile),
                        appearances: entry.appearances,
                        year: '-',
                        category: `${entry.appearances.length} list${entry.appearances.length > 1 ? 's' : ''}`,
                        person: entry.appearances.map(g => g.person).filter((v, i, a) => a.indexOf(v) === i).join(', ')
                    };
                });
                
                // Sort by average rank
                filteredGames.sort((a, b) => a.rank - b.rank);
            } else {
                filteredGames = filtered;
            }
            
            updateStats();
            renderGameList();
        }

        // Update Stats
        function updateStats() {
            const totalGames = filteredGames.length;
            
            if (totalGames === 0) {
                document.getElementById('total-games').textContent = '0';
                document.getElementById('avg-rank').textContent = '-';
                document.getElementById('avg-percentile').textContent = '-';
                return;
            }
            
            // Calculate averages
            const avgRank = Math.round(
                filteredGames.reduce((sum, g) => sum + g.rank, 0) / totalGames
            );
            
            // Calculate average percentile (rank percentage)
            const avgPercentile = Math.round(
                filteredGames.reduce((sum, game) => {
                    const maxRank = getMaxRankForGame(game);
                    const percentile = ((maxRank - game.rank) / maxRank * 100);
                    return sum + percentile;
                }, 0) / totalGames
            );
            
            document.getElementById('total-games').textContent = totalGames;
            document.getElementById('avg-rank').textContent = avgRank;
            document.getElementById('avg-percentile').textContent = avgPercentile + '%';
        }

        // Get max rank for a game's context
        function getMaxRankForGame(game) {
            const sameContext = allGames.filter(g => 
                g.person === game.person && 
                g.year === game.year && 
                g.category === game.category
            );
            return Math.max(...sameContext.map(g => g.rank));
        }

        // Render Game List
        function renderGameList() {
            const container = document.getElementById('game-list');
            const loading = document.getElementById('loading');
            const emptyState = document.getElementById('empty-state');
            
            loading.style.display = 'none';
            
            if (filteredGames.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';
            container.innerHTML = '';
            
            filteredGames.forEach(game => {
                const card = createGameCard(game);
                container.appendChild(card);
            });
            
            // Start fetching images in batches
            fetchGameImagesBatch();
        }

        // Get gradient color based on percentile (0-100)
        // 0% = red, 50% = yellow, 100% = green
        function getPercentileGradient(percentile) {
            // Clamp percentile between 0 and 100
            const p = Math.max(0, Math.min(100, percentile));
            
            let r, g, b;
            
            if (p < 50) {
                // Red (220, 38, 38) to Yellow (255, 193, 7)
                const ratio = p / 50;
                r = Math.round(220 + (255 - 220) * ratio);
                g = Math.round(38 + (193 - 38) * ratio);
                b = Math.round(38 + (7 - 38) * ratio);
            } else {
                // Yellow (255, 193, 7) to Green (76, 175, 80)
                const ratio = (p - 50) / 50;
                r = Math.round(255 + (76 - 255) * ratio);
                g = Math.round(193 + (175 - 193) * ratio);
                b = Math.round(7 + (80 - 7) * ratio);
            }
            
            // Create gradient from slightly darker to lighter version
            const darkerR = Math.max(0, r - 30);
            const darkerG = Math.max(0, g - 30);
            const darkerB = Math.max(0, b - 30);
            
            return `linear-gradient(135deg, rgb(${darkerR}, ${darkerG}, ${darkerB}) 0%, rgb(${r}, ${g}, ${b}) 100%)`;
        }

        // Create Game Card
        function createGameCard(game) {
            const card = document.createElement('div');
            card.className = 'game-card';
            
            let percentile;
            if (viewMode === 'distinct') {
                percentile = game.avgPercentile;
            } else {
                const maxRank = getMaxRankForGame(game);
                percentile = Math.round((maxRank - game.rank) / maxRank * 100);
            }
            
            const rankLabel = viewMode === 'distinct' ? 'Avg' : '';
            const gradientColor = getPercentileGradient(percentile);
            
            card.innerHTML = `
                <div class="game-thumbnail loading" data-game-name="${game.name}">
                    Loading...
                </div>
                <div class="game-info">
                    <h3 class="game-name">${game.name}</h3>
                    <div class="game-meta">
                        <span class="meta-tag">${game.year}</span>
                        <span class="meta-tag">${game.person}</span>
                        <span class="meta-tag">${game.category}</span>
                    </div>
                </div>
                <div class="game-rank" style="background: ${gradientColor};">
                    <span class="rank-number">${game.rank}</span>
                    <span class="rank-percentage">${rankLabel} Top ${percentile}%</span>
                </div>
            `;
            
            // Add click handler for distinct mode to show all rankings
            if (viewMode === 'distinct') {
                card.style.cursor = 'pointer';
                card.addEventListener('click', () => showRankingsModal(game));
            }
            
            return card;
        }

        // Show Rankings Modal
        function showRankingsModal(game) {
            const modal = document.getElementById('rankings-modal');
            const modalTitle = document.getElementById('modal-game-name');
            const modalBody = document.getElementById('modal-body');
            
            modalTitle.textContent = game.name;
            
            // Build modal content
            let content = `
                <div class="modal-summary">
                    <span class="summary-value">${game.rank}</span>
                    <span class="summary-label">Average Rank across ${game.appearances.length} list${game.appearances.length > 1 ? 's' : ''}</span>
                </div>
            `;
            
            // Sort appearances by rank
            const sortedAppearances = [...game.appearances].sort((a, b) => a.rank - b.rank);
            
            sortedAppearances.forEach(appearance => {
                const maxRank = getMaxRankForGame(appearance);
                const percentile = Math.round((maxRank - appearance.rank) / maxRank * 100);
                const gradientColor = getPercentileGradient(percentile);
                
                content += `
                    <div class="ranking-item">
                        <div class="ranking-info">
                            <div class="ranking-title">${appearance.year} - ${appearance.category}</div>
                            <div class="ranking-details">${appearance.person} • ${appearance.rank} of ${maxRank}</div>
                        </div>
                        <div class="ranking-badge" style="background: ${gradientColor};">
                            ${appearance.rank}
                            <div class="ranking-percentile">Top ${percentile}%</div>
                        </div>
                    </div>
                `;
            });
            
            modalBody.innerHTML = content;
            modal.classList.add('active');
            
            // Prevent body scroll when modal is open
            document.body.style.overflow = 'hidden';
        }

        // Close Rankings Modal
        function closeRankingsModal() {
            const modal = document.getElementById('rankings-modal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Close modal when clicking outside
        document.addEventListener('click', (e) => {
            const modal = document.getElementById('rankings-modal');
            if (e.target === modal) {
                closeRankingsModal();
            }
        });

        // Fetch Game Images in Batches
        async function fetchGameImagesBatch() {
            const thumbnails = document.querySelectorAll('.game-thumbnail.loading');
            const gameNamesAndIds = [];
            const gameNameToThumb = new Map();
            
            // Collect unique game names that need images
            thumbnails.forEach(thumb => {
                const gameName = thumb.dataset.gameName;
                if (!gameImageCache[gameName] && !gameNameToThumb.has(gameName)) {
                    gameNameToThumb.set(gameName, thumb);
                    gameNamesAndIds.push({ name: gameName, id: null });
                }
            });
            
            if (gameNamesAndIds.length === 0) return;
            
            // First pass: search for game IDs in batches of 20
            const searchBatchSize = 20;
            for (let i = 0; i < gameNamesAndIds.length; i += searchBatchSize) {
                const batch = gameNamesAndIds.slice(i, i + searchBatchSize);
                await Promise.all(batch.map(item => searchGameId(item)));
                
                // Small delay between batches
                if (i + searchBatchSize < gameNamesAndIds.length) {
                    await new Promise(resolve => setTimeout(resolve, 300));
                }
            }
            
            // Second pass: fetch game details in batches of 20 IDs
            const idsToFetch = gameNamesAndIds
                .filter(item => item.id !== null)
                .map(item => item.id);
            
            if (idsToFetch.length === 0) {
                // No games found, mark them as not available
                gameNamesAndIds.forEach(item => {
                    if (item.id === null) {
                        gameImageCache[item.name] = null;
                        updateThumbnail(item.name, null);
                    }
                });
                return;
            }
            
            const idBatchSize = 20;
            for (let i = 0; i < idsToFetch.length; i += idBatchSize) {
                const batch = idsToFetch.slice(i, i + idBatchSize);
                const batchIds = batch.join(',');
                
                await fetchGameImagesBatch_Things(batchIds, gameNamesAndIds);
                
                // Small delay between batches
                if (i + idBatchSize < idsToFetch.length) {
                    await new Promise(resolve => setTimeout(resolve, 300));
                }
            }
        }

        // Search for game ID
        async function searchGameId(gameItem) {
            try {
                const searchXML = await fetchBGG('search', {
                    query: gameItem.name,
                    type: 'boardgame',
                    exact: '1'
                });
                
                if (searchXML) {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(searchXML, 'text/xml');
                    const firstItem = doc.querySelector('item');
                    
                    if (firstItem) {
                        gameItem.id = firstItem.getAttribute('id');
                    }
                }
            } catch (error) {
                console.error(`Error searching for ${gameItem.name}:`, error);
            }
        }

        // Fetch game details for a batch of IDs via proxy
        async function fetchGameImagesBatch_Things(batchIds, gameNamesAndIds) {
            try {
                const thingXML = await fetchBGG('thing', {
                    id: batchIds
                });
                
                if (!thingXML) return;
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(thingXML, 'text/xml');
                const items = doc.querySelectorAll('item');
                
                items.forEach(item => {
                    const itemId = item.getAttribute('id');
                    const thumbnailEl = item.querySelector('thumbnail');
                    
                    if (thumbnailEl && thumbnailEl.textContent) {
                        const imageUrl = `${IMAGE_PROXY}${thumbnailEl.textContent}`;
                        
                        // Find the game name(s) associated with this ID
                        gameNamesAndIds.forEach(gameItem => {
                            if (gameItem.id === itemId) {
                                gameImageCache[gameItem.name] = imageUrl;
                                updateThumbnail(gameItem.name, imageUrl);
                            }
                        });
                    }
                });
                
                // Mark games without images as fetched
                gameNamesAndIds.forEach(gameItem => {
                    if (!gameImageCache[gameItem.name] && gameItem.id !== null) {
                        gameImageCache[gameItem.name] = null;
                        updateThumbnail(gameItem.name, null);
                    }
                });
                
            } catch (error) {
                console.error('Error fetching batch of game images:', error);
            }
        }

        // Update Thumbnail in DOM
        function updateThumbnail(gameName, imageUrl) {
            const thumbnails = document.querySelectorAll(`.game-thumbnail[data-game-name="${gameName}"]`);
            
            thumbnails.forEach(thumb => {
                thumb.classList.remove('loading');
                
                if (imageUrl) {
                    const img = document.createElement('img');
                    img.src = imageUrl;
                    img.alt = gameName;
                    img.crossOrigin = 'Anonymous';
                    thumb.innerHTML = '';
                    thumb.appendChild(img);
                } else {
                    thumb.innerHTML = '🎲';
                    thumb.style.fontSize = '32px';
                    thumb.style.color = '#999';
                }
            });
        }

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            loadCSVData();
        });
    </script>

</body>
