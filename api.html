<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <title>BGG API Tester</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #222; 
            min-height: 100vh;
        }
        
        .container { 
            max-width: 900px; 
            margin: 0 auto; 
            padding: 1.5em; 
            box-sizing: border-box; 
        }
        
        h1 { 
            color: white; 
            text-align: center; 
            margin: 0 0 2em 0;
            font-size: 2.2em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5em;
            margin-bottom: 2em;
        }
        
        .api-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            padding: 1.5em;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }
        
        .api-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }
        
        .api-card h3 {
            margin: 0 0 0.5em 0;
            color: #1976d2;
            font-size: 1.3em;
        }
        
        .api-card p {
            margin: 0 0 1em 0;
            color: #666;
            font-size: 0.95em;
            flex-grow: 1;
        }
        
        .api-card .endpoint-url {
            background: #f0f0f0;
            padding: 0.6em;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.8em;
            color: #1976d2;
            margin-bottom: 1em;
            word-break: break-all;
        }
        
        .button-group {
            display: flex;
            gap: 0.5em;
            flex-wrap: wrap;
        }
        
        .btn {
            flex: 1;
            min-width: 80px;
            padding: 0.7em 1em;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4em;
        }
        
        .btn-quick { background: #4caf50; color: white; }
        .btn-quick:hover { background: #45a049; }
        
        .btn-advanced { background: #ff9800; color: white; }
        .btn-advanced:hover { background: #e68900; }
        
        .btn-info { background: #2196f3; color: white; flex-basis: auto; min-width: 45px; }
        .btn-info:hover { background: #0b7dda; }
        
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 40px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 95%;
            max-height: 85vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5em;
            border-radius: 12px 12px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-header h2 {
            margin: 0;
            font-size: 1.4em;
        }
        
        .modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 1.8em;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-body {
            padding: 1.5em;
            flex-grow: 1;
            overflow-y: auto;
        }
        
        .form-group {
            margin-bottom: 1em;
        }
        
        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.4em;
            color: #333;
            font-size: 0.95em;
        }
        
        .required {
            color: #dc3545;
        }
        
        .form-input, .form-select {
            width: 100%;
            padding: 0.6em;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.95em;
            background: white;
        }
        
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #1976d2;
            box-shadow: 0 0 0 2px rgba(25, 118, 210, 0.2);
        }
        
        .form-help {
            font-size: 0.8em;
            color: #666;
            margin-top: 0.3em;
            font-style: italic;
        }
        
        .param-section {
            margin-bottom: 1.5em;
            padding-bottom: 1em;
            border-bottom: 1px solid #eee;
        }
        
        .param-section:last-child {
            border-bottom: none;
        }
        
        .param-section h4 {
            margin: 0 0 0.8em 0;
            color: #1976d2;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.6em;
        }
        
        .checkbox-item {
            display: flex;
            align-items: center;
        }
        
        .checkbox-item input[type="checkbox"] {
            margin-right: 0.5em;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .checkbox-item label {
            cursor: pointer;
            font-size: 0.9em;
            flex: 1;
        }
        
        .modal-footer {
            padding: 1em 1.5em;
            background: #f8f9fa;
            border-top: 1px solid #eee;
            display: flex;
            gap: 0.8em;
            justify-content: flex-end;
        }
        
        .btn-modal {
            padding: 0.8em 1.5em;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95em;
        }
        
        .btn-submit {
            background: #4caf50;
            color: white;
        }
        
        .btn-submit:hover {
            background: #45a049;
        }
        
        .btn-cancel {
            background: #ccc;
            color: #333;
        }
        
        .btn-cancel:hover {
            background: #bbb;
        }
        
        /* Info Modal */
        .info-content {
            font-size: 0.95em;
            line-height: 1.6;
        }
        
        .info-content strong {
            color: #1976d2;
        }
        
        .info-section {
            margin-bottom: 1em;
        }
        
        /* Response Display */
        .response-container {
            margin-top: 2em;
            padding: 1.5em;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: none;
        }
        
        .response-container.active {
            display: block;
        }
        
        .response-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1em;
            padding-bottom: 1em;
            border-bottom: 2px solid #1976d2;
        }
        
        .response-header h3 {
            margin: 0;
            color: #1976d2;
        }
        
        .response-status {
            font-weight: 600;
            padding: 0.4em 0.8em;
            border-radius: 6px;
        }
        
        .status-success {
            background: #d4edda;
            color: #155724;
        }
        
        .status-error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .response-content {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 1em;
            font-family: 'Courier New', monospace;
            font-size: 0.8em;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.4;
        }
        
        .loading {
            text-align: center;
            color: #666;
            padding: 2em;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1976d2;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto 0.5em;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 BGG API Tester</h1>
        
        <div class="cards-grid" id="cardsGrid"></div>
        
        <div class="response-container" id="responseContainer">
            <div class="response-header">
                <h3>📄 Response</h3>
                <span class="response-status" id="responseStatus"></span>
            </div>
            <div class="response-content" id="responseContent"></div>
        </div>
    </div>

    <!-- Advanced Modal -->
    <div class="modal" id="advancedModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="advancedTitle">Advanced Options</h2>
                <button class="modal-close" onclick="closeAdvancedModal()">✕</button>
            </div>
            <div class="modal-body" id="advancedBody"></div>
            <div class="modal-footer">
                <button class="btn-modal btn-cancel" onclick="closeAdvancedModal()">Cancel</button>
                <button class="btn-modal btn-submit" onclick="executeAdvancedCall()">Execute</button>
            </div>
        </div>
    </div>

    <!-- Info Modal -->
    <div class="modal" id="infoModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="infoTitle">API Information</h2>
                <button class="modal-close" onclick="closeInfoModal()">✕</button>
            </div>
            <div class="modal-body info-content" id="infoBody"></div>
            <div class="modal-footer">
                <button class="btn-modal btn-cancel" onclick="closeInfoModal()" style="margin-left: auto;">Close</button>
            </div>
        </div>
    </div>

    <script>
        // API Endpoint Definitions
        const endpoints = {
            v2: [
                {
                    key: 'thing',
                    name: '🎯 Thing (Game Details)',
                    desc: 'Get detailed information about games, expansions, accessories',
                    url: 'https://boardgamegeek.com/xmlapi2/thing',
                    required: [
                        { name: 'id', type: 'text', label: 'Game IDs (comma separated)', example: '174430,167791', help: 'One or more game IDs' }
                    ],
                    optional: [
                        { name: 'type', type: 'select', label: 'Item type', options: ['boardgame', 'boardgameexpansion', 'boardgameaccessory'], default: 'boardgame' },
                        { name: 'stats', type: 'checkbox', label: 'Include statistics' },
                        { name: 'versions', type: 'checkbox', label: 'Include version information' },
                        { name: 'videos', type: 'checkbox', label: 'Include video information' },
                        { name: 'comments', type: 'checkbox', label: 'Include user comments' },
                        { name: 'ratingcomments', type: 'checkbox', label: 'Include rating comments' },
                        { name: 'page', type: 'number', label: 'Page number for comments' },
                        { name: 'pagesize', type: 'number', label: 'Comments per page (max 100)' }
                    ],
                    info: 'Retrieve comprehensive game information including stats, ratings, rankings, and player recommendations. Great for getting game details by ID.'
                },
                {
                    key: 'collection',
                    name: '📦 Collection',
                    desc: 'Get a user\'s game collection with filtering options',
                    url: 'https://boardgamegeek.com/xmlapi2/collection',
                    required: [
                        { name: 'username', type: 'text', label: 'BGG Username', example: 'sportomax', help: 'The user whose collection to fetch' }
                    ],
                    optional: [
                        { name: 'own', type: 'checkbox', label: 'Include owned games' },
                        { name: 'stats', type: 'checkbox', label: 'Include statistics' },
                        { name: 'subtype', type: 'select', label: 'Subtype filter', options: ['boardgame', 'boardgameexpansion'] },
                        { name: 'minrating', type: 'number', label: 'Minimum user rating (1-10)' },
                        { name: 'maxplays', type: 'number', label: 'Maximum play count' }
                    ],
                    info: 'Fetch a user\'s board game collection. Supports extensive filtering by ownership status, ratings, play counts, and more. Great for analyzing collections.'
                },
                {
                    key: 'search',
                    name: '🔍 Search',
                    desc: 'Search for games, expansions, and accessories by name',
                    url: 'https://boardgamegeek.com/xmlapi2/search',
                    required: [
                        { name: 'query', type: 'text', label: 'Search query', example: 'Catan', help: 'Game name to search for' }
                    ],
                    optional: [
                        { name: 'type', type: 'select', label: 'Search type', options: ['boardgame', 'boardgameexpansion', 'boardgameaccessory', 'videogame', 'rpgitem', 'rpgissue'], default: 'boardgame' },
                        { name: 'exact', type: 'checkbox', label: 'Exact name match only' }
                    ],
                    info: 'Search the BGG database for games by name. Returns matching items with IDs that can be used with other endpoints.'
                },
                {
                    key: 'user',
                    name: '👤 User Info',
                    desc: 'Get user profile information and optional data',
                    url: 'https://boardgamegeek.com/xmlapi2/user',
                    required: [
                        { name: 'name', type: 'text', label: 'BGG Username', example: 'sportomax', help: 'The user to fetch info for' }
                    ],
                    optional: [
                        { name: 'buddies', type: 'checkbox', label: 'Include buddy list' },
                        { name: 'guilds', type: 'checkbox', label: 'Include guild memberships' },
                        { name: 'hot', type: 'checkbox', label: 'Include user\'s hot list' },
                        { name: 'top', type: 'checkbox', label: 'Include user\'s top list' }
                    ],
                    info: 'Get user profile information including buddies, guilds, and personal lists. Useful for social networking features.'
                },
                {
                    key: 'hot',
                    name: '🔥 Hot Items',
                    desc: 'Get currently hot/trending items by type',
                    url: 'https://boardgamegeek.com/xmlapi2/hot',
                    required: [],
                    optional: [
                        { name: 'type', type: 'select', label: 'Hot list type', options: ['boardgame', 'rpg', 'videogame', 'boardgameperson', 'rpgperson', 'boardgamecompany', 'rpgcompany', 'videogamecompany'], default: 'boardgame' }
                    ],
                    info: 'Get trending/hot items currently popular on BoardGameGeek. No parameters required - defaults to board games.'
                },
                {
                    key: 'plays',
                    name: '📊 Plays',
                    desc: 'Get play data for a user with date and game filtering',
                    url: 'https://boardgamegeek.com/xmlapi2/plays',
                    required: [
                        { name: 'username', type: 'text', label: 'BGG Username', example: 'sportomax', help: 'User whose plays to fetch' }
                    ],
                    optional: [
                        { name: 'id', type: 'text', label: 'Game ID to filter plays', example: '174430' },
                        { name: 'mindate', type: 'date', label: 'Start date (YYYY-MM-DD)' },
                        { name: 'maxdate', type: 'date', label: 'End date (YYYY-MM-DD)' },
                        { name: 'page', type: 'number', label: 'Page number (100 plays per page)' }
                    ],
                    info: 'Fetch a user\'s recorded plays. Supports filtering by date range and specific games.'
                }
            ]
        };

        let currentEndpoint = null;
        let currentAdvancedParams = {};

        // Initialize
        function init() {
            renderCards();
        }

        // Render API cards
        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            endpoints.v2.forEach(endpoint => {
                const card = document.createElement('div');
                card.className = 'api-card';
                card.innerHTML = `
                    <h3>${endpoint.name}</h3>
                    <p>${endpoint.desc}</p>
                    <div class="endpoint-url">${endpoint.url}</div>
                    <div class="button-group">
                        <button class="btn btn-quick" onclick="executeQuickCall('${endpoint.key}')">▶️ Quick</button>
                        <button class="btn btn-advanced" onclick="openAdvancedModal('${endpoint.key}')">⚙️ Advanced</button>
                        <button class="btn btn-info" onclick="showInfo('${endpoint.key}')" title="More info">ⓘ</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Get endpoint by key
        function getEndpoint(key) {
            return endpoints.v2.find(e => e.key === key);
        }

        // Execute quick call
        async function executeQuickCall(key) {
            const endpoint = getEndpoint(key);
            if (!endpoint) return;

            // For quick calls, use defaults or prompt for required fields
            const params = {};
            let missingRequired = false;

            for (const field of endpoint.required) {
                let value = prompt(`Enter ${field.label}:${field.example ? ` (e.g., ${field.example})` : ''}`);
                if (!value) {
                    missingRequired = true;
                    break;
                }
                params[field.name] = value;
            }

            if (missingRequired) return;

            await executeCall(endpoint, params);
        }

        // Open advanced modal
        function openAdvancedModal(key) {
            currentEndpoint = getEndpoint(key);
            currentAdvancedParams = {};

            document.getElementById('advancedTitle').textContent = `${currentEndpoint.name} - Advanced Options`;

            let html = '';

            // Required fields
            if (currentEndpoint.required.length > 0) {
                html += '<div class="param-section"><h4>Required Parameters</h4>';
                currentEndpoint.required.forEach(field => {
                    html += renderFormField(field, 'required');
                });
                html += '</div>';
            }

            // Optional fields
            if (currentEndpoint.optional.length > 0) {
                html += '<div class="param-section"><h4>Optional Parameters</h4>';
                const checkboxFields = currentEndpoint.optional.filter(f => f.type === 'checkbox');
                const otherFields = currentEndpoint.optional.filter(f => f.type !== 'checkbox');

                otherFields.forEach(field => {
                    html += renderFormField(field, 'optional');
                });

                if (checkboxFields.length > 0) {
                    html += '<div style="margin-top: 1em;"><strong>Flags:</strong></div><div class="checkbox-group">';
                    checkboxFields.forEach(field => {
                        html += `
                            <div class="checkbox-item">
                                <input type="checkbox" id="${field.name}" data-param="${field.name}">
                                <label for="${field.name}">${field.label}</label>
                            </div>
                        `;
                    });
                    html += '</div>';
                }

                html += '</div>';
            }

            document.getElementById('advancedBody').innerHTML = html;
            document.getElementById('advancedModal').classList.add('active');
        }

        // Render form field
        function renderFormField(field, type) {
            let html = `<div class="form-group">`;
            html += `<label class="form-label">${field.label}${type === 'required' ? '<span class="required">*</span>' : ''}</label>`;

            if (field.type === 'text') {
                html += `<input type="text" id="${field.name}" class="form-input" placeholder="${field.example || ''}" data-param="${field.name}">`;
            } else if (field.type === 'number') {
                html += `<input type="number" id="${field.name}" class="form-input" data-param="${field.name}">`;
            } else if (field.type === 'date') {
                html += `<input type="date" id="${field.name}" class="form-input" data-param="${field.name}">`;
            } else if (field.type === 'select') {
                html += `<select id="${field.name}" class="form-select" data-param="${field.name}">
                    <option value="">-- Select --</option>`;
                field.options.forEach(opt => {
                    html += `<option value="${opt}">${opt}</option>`;
                });
                html += `</select>`;
            }

            if (field.help) {
                html += `<div class="form-help">${field.help}</div>`;
            }

            html += '</div>';
            return html;
        }

        // Execute advanced call
        async function executeAdvancedCall() {
            const params = {};

            // Collect required params
            for (const field of currentEndpoint.required) {
                const value = document.getElementById(field.name).value.trim();
                if (!value) {
                    alert(`${field.label} is required`);
                    return;
                }
                params[field.name] = value;
            }

            // Collect optional params
            for (const field of currentEndpoint.optional) {
                const el = document.getElementById(field.name);
                if (!el) continue;

                if (field.type === 'checkbox') {
                    if (el.checked) params[field.name] = '1';
                } else {
                    const value = el.value.trim();
                    if (value) params[field.name] = value;
                }
            }

            closeAdvancedModal();
            await executeCall(currentEndpoint, params);
        }

        // Execute API call
        async function executeCall(endpoint, params) {
            const responseContainer = document.getElementById('responseContainer');
            const responseStatus = document.getElementById('responseStatus');
            const responseContent = document.getElementById('responseContent');

            responseContainer.classList.add('active');
            responseStatus.textContent = 'Loading...';
            responseStatus.className = 'response-status';
            responseContent.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';

            try {
                const queryString = new URLSearchParams(params).toString();
                const url = `/api/bgg-helper?endpoint=${endpoint.key}&${queryString}`;

                const response = await fetch(url);
                const text = await response.text();

                if (response.ok) {
                    responseStatus.textContent = `✅ ${response.status} OK`;
                    responseStatus.className = 'response-status status-success';
                } else {
                    responseStatus.textContent = `❌ ${response.status} ${response.statusText}`;
                    responseStatus.className = 'response-status status-error';
                }

                const preview = text.length > 2000 ? text.substring(0, 2000) + '\n\n... [Truncated]' : text;
                responseContent.textContent = preview;

            } catch (error) {
                responseStatus.textContent = `❌ Error`;
                responseStatus.className = 'response-status status-error';
                responseContent.textContent = `Error: ${error.message}`;
            }
        }

        // Show info modal
        function showInfo(key) {
            const endpoint = getEndpoint(key);
            document.getElementById('infoTitle').textContent = endpoint.name;

            let html = `
                <div class="info-section">
                    <strong>Description:</strong><br>
                    ${endpoint.desc}
                </div>
                <div class="info-section">
                    <strong>Endpoint URL:</strong><br>
                    <code>${endpoint.url}</code>
                </div>
                <div class="info-section">
                    <strong>Details:</strong><br>
                    ${endpoint.info}
                </div>
            `;

            document.getElementById('infoBody').innerHTML = html;
            document.getElementById('infoModal').classList.add('active');
        }

        // Close modals
        function closeAdvancedModal() {
            document.getElementById('advancedModal').classList.remove('active');
        }

        function closeInfoModal() {
            document.getElementById('infoModal').classList.remove('active');
        }

        // Close modals on background click
        document.getElementById('advancedModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('advancedModal')) closeAdvancedModal();
        });

        document.getElementById('infoModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('infoModal')) closeInfoModal();
        });

        // Initialize on load
        window.addEventListener('load', init);
    </script>
</body>
</html>
