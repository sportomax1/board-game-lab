<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expansion Explorer</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect fill=%2216a34a%22 width=%22100%22 height=%22100%22/%3E%3Ctext x=%2250%22 y=%2270%22 font-size=%2260%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22%3E🌳%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Setup Screen -->
    <div id="setupScreen" class="fixed inset-0 bg-gradient-to-br from-green-500 to-teal-600 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-2xl p-8 max-w-md w-full">
            <h1 class="text-3xl font-bold text-gray-900 mb-2 text-center">🌳 Expansion Explorer</h1>
            <p class="text-gray-500 text-center mb-6">Find missing expansions for your games</p>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">BGG Username</label>
                <input type="text" id="usernameInput" class="w-full border rounded-lg px-4 py-3 text-lg focus:ring-2 focus:ring-green-500 outline-none" placeholder="BGG Username" value="sportomax">
            </div>
            
            <button onclick="loadCollection()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold text-lg hover:bg-green-700 transition shadow-lg">
                Load Collection
            </button>
        </div>
    </div>

    <!-- Loading Screen -->
    <div id="loadingScreen" class="fixed inset-0 bg-white z-40 flex flex-col items-center justify-center hidden">
        <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-green-600 mb-4"></div>
        <h2 class="text-xl font-bold text-gray-800">Loading Collection...</h2>
        <p id="loadingStatus" class="text-gray-500 mt-2">Fetching games...</p>
    </div>

    <!-- Main App -->
    <div id="app" class="hidden">
        <header class="bg-white shadow-sm sticky top-0 z-30">
            <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
                <h1 class="font-bold text-xl text-gray-900">🌳 Expansion Explorer</h1>
                <button onclick="location.reload()" class="text-sm text-gray-600 hover:text-gray-900">Change User</button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-6">
            <div class="mb-6 flex flex-col gap-4">
                <input type="text" id="searchInput" placeholder="Search your games..." class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-green-500 outline-none" onkeyup="filterGames()">
                <div class="flex gap-2 flex-wrap">
                    <span class="text-sm font-medium text-gray-700 self-center">Sort by:</span>
                    <button onclick="sortGames('alpha')" class="px-4 py-2 rounded-lg border text-sm font-medium transition" id="sortAlpha">📝 Alphabetical</button>
                    <button onclick="sortGames('totalDesc')" class="px-4 py-2 rounded-lg border text-sm font-medium transition" id="sortTotal">📊 Total Expansions</button>
                    <button onclick="sortGames('ownedDesc')" class="px-4 py-2 rounded-lg border text-sm font-medium transition" id="sortOwned">✅ Owned Expansions</button>
                </div>
            </div>

            <div id="gameList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Games will be inserted here -->
            </div>
        </main>
    </div>

    <!-- Expansion Modal -->
    <div id="expansionModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] flex flex-col">
            <div class="p-4 border-b flex justify-between items-center">
                <h2 id="modalTitle" class="text-xl font-bold text-gray-900">Game Title</h2>
                <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
            </div>
            <div class="p-4 overflow-y-auto flex-1">
                <div id="modalLoading" class="flex justify-center py-8">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-green-600"></div>
                </div>
                <div id="modalContent" class="hidden space-y-6">
                    <div class="grid grid-cols-2 gap-3 p-3 bg-gray-50 rounded-lg border border-gray-200">
                        <div class="text-center">
                            <div id="ownedCount" class="text-2xl font-bold text-green-600">0</div>
                            <div class="text-xs text-gray-600">Owned Expansions</div>
                        </div>
                        <div class="text-center">
                            <div id="missingCount" class="text-2xl font-bold text-red-600">0</div>
                            <div class="text-xs text-gray-600">Missing Expansions</div>
                        </div>
                    </div>
                    <div>
                        <h3 class="font-bold text-green-600 mb-3 flex items-center gap-2">
                            <span>✅</span> Owned Expansions
                        </h3>
                        <div id="ownedExpansions" class="grid grid-cols-1 gap-2 text-sm"></div>
                    </div>
                    <div>
                        <h3 class="font-bold text-red-500 mb-3 flex items-center gap-2">
                            <span>❌</span> Missing Expansions
                        </h3>
                        <div id="missingExpansions" class="grid grid-cols-1 gap-2 text-sm"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ownedGameIds = new Set();
        let allGames = [];
        let currentSort = 'alpha';

        async function loadCollection() {
            const username = document.getElementById('usernameInput').value;
            if (!username) return;

            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('loadingScreen').classList.remove('hidden');

            try {
                // Fetch owned games including expansions to build the "Owned" set
                const response = await fetch(`/api/bgg-helper?endpoint=collection&username=${username}&own=1&stats=1`);
                const text = await response.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, 'text/xml');
                
                const items = Array.from(xml.querySelectorAll('item'));
                
                items.forEach(item => {
                    const id = item.getAttribute('objectid');
                    ownedGameIds.add(id);
                    
                    allGames.push({
                        id: id,
                        name: item.querySelector('name').textContent,
                        image: item.querySelector('thumbnail')?.textContent || '',
                        year: item.querySelector('yearpublished')?.textContent || '',
                        ownedExpansions: 0,
                        totalExpansions: 0
                    });
                });

                // Don't fetch expansion counts upfront - just sort and display
                // Expansion counts will be fetched on-demand when user interacts
                allGames.sort((a, b) => a.name.localeCompare(b.name));
                
                renderGames(allGames);
                document.getElementById('loadingScreen').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');

            } catch (error) {
                alert('Error loading collection: ' + error.message);
                location.reload();
            }
        }

        function sortGames(sortType) {
            currentSort = sortType;
            
            if (sortType === 'alpha') {
                allGames.sort((a, b) => a.name.localeCompare(b.name));
            } else if (sortType === 'totalDesc') {
                allGames.sort((a, b) => b.totalExpansions - a.totalExpansions || a.name.localeCompare(b.name));
            } else if (sortType === 'ownedDesc') {
                allGames.sort((a, b) => b.ownedExpansions - a.ownedExpansions || a.name.localeCompare(b.name));
            }
            
            // Update button styling
            const updateButtonStyle = (btnId, isActive) => {
                const btn = document.getElementById(btnId);
                if (isActive) {
                    btn.classList.remove('bg-white', 'border-gray-300', 'text-gray-700');
                    btn.classList.add('bg-green-100', 'border-green-500', 'text-green-700');
                } else {
                    btn.classList.remove('bg-green-100', 'border-green-500', 'text-green-700');
                    btn.classList.add('bg-white', 'border-gray-300', 'text-gray-700');
                }
            };
            
            updateButtonStyle('sortAlpha', sortType === 'alpha');
            updateButtonStyle('sortTotal', sortType === 'totalDesc');
            updateButtonStyle('sortOwned', sortType === 'ownedDesc');
            
            filterGames();
        }

        function renderGames(games) {
            const container = document.getElementById('gameList');
            container.innerHTML = games.map(game => `
                <div data-game-id="${game.id}" class="game-card bg-white p-4 rounded-lg shadow hover:shadow-md transition cursor-pointer flex flex-col gap-3 border border-gray-200" onclick="checkExpansions('${game.id}', '${game.name.replace(/'/g, "\\'")}')" >
                    <div class="flex items-center gap-4">
                        <div class="w-16 h-16 bg-gray-100 rounded flex-shrink-0 overflow-hidden">
                            ${game.image ? `<img src="${game.image}" class="w-full h-full object-contain">` : ''}
                        </div>
                        <div class="flex-1">
                            <h3 class="font-bold text-gray-900">${game.name}</h3>
                            <p class="text-sm text-gray-500">${game.year}</p>
                        </div>
                    </div>
                    <div class="flex gap-3 text-xs font-medium">
                        <div class="flex-1 bg-green-50 p-2 rounded border border-green-200">
                            <div class="text-green-700 expansion-counts-${game.id}">✅ -</div>
                            <div class="text-green-600 text-xs">owned</div>
                        </div>
                        <div class="flex-1 bg-blue-50 p-2 rounded border border-blue-200">
                            <div class="text-blue-700 expansion-counts-${game.id}">📊 -</div>
                            <div class="text-blue-600 text-xs">total</div>
                        </div>
                    </div>
                </div>
            `).join('');
            
            // Lazy load expansion counts for visible cards
            loadExpansionCountsLazy(games);
        }
        
        let expansionCountsCache = {};
        
        async function loadExpansionCountsLazy(games) {
            // Load in batches with parallel processing (100x faster like weight.html)
            const batchSize = 3;
            const parallelBatches = 100; // Process 100 batches in parallel for faster loading
            const delay = 800; // 800ms between parallel groups
            
            // Create batches
            const batches = [];
            for (let i = 0; i < games.length; i += batchSize) {
                batches.push(games.slice(i, i + batchSize));
            }
            
            // Process batches in parallel groups
            for (let i = 0; i < batches.length; i += parallelBatches) {
                const batchGroup = batches.slice(i, i + parallelBatches);
                
                await Promise.all(batchGroup.map(async (batch) => {
                    await Promise.all(batch.map(async game => {
                        // Skip if already cached
                        if (expansionCountsCache[game.id]) {
                            updateExpansionCountDisplay(game.id, expansionCountsCache[game.id]);
                            return;
                        }
                        
                        try {
                            const response = await fetch(`/api/bgg-helper?endpoint=thing&id=${game.id}`);
                            if (!response.ok) throw new Error(`API error: ${response.status}`);
                            
                            const text = await response.text();
                            const parser = new DOMParser();
                            const xml = parser.parseFromString(text, 'text/xml');
                            
                            if (xml.documentElement.tagName === 'parsererror') throw new Error('Parse error');
                            
                            const expansions = Array.from(xml.querySelectorAll('link[type="boardgameexpansion"]'));
                            let ownedCount = 0;
                            let totalCount = 0;
                            
                            expansions.forEach(link => {
                                const isInbound = link.getAttribute('inbound') === 'true';
                                if (!isInbound) {
                                    totalCount++;
                                    const expId = link.getAttribute('id');
                                    if (ownedGameIds.has(expId)) {
                                        ownedCount++;
                                    }
                                }
                            });
                            
                            const counts = { ownedCount, totalCount };
                            expansionCountsCache[game.id] = counts;
                            updateExpansionCountDisplay(game.id, counts);
                        } catch (e) {
                            console.error('Error loading expansions for ' + game.name, e);
                            updateExpansionCountDisplay(game.id, { ownedCount: 0, totalCount: 0 });
                        }
                    }));
                }));
                
                // Delay between parallel groups
                if (i + parallelBatches < batches.length) {
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
        }
        
        function updateExpansionCountDisplay(gameId, counts) {
            const elements = document.querySelectorAll(`.expansion-counts-${gameId}`);
            elements.forEach((el, idx) => {
                if (idx === 0) {
                    el.textContent = `✅ ${counts.ownedCount}`;
                } else {
                    el.textContent = `📊 ${counts.totalCount}`;
                }
            });
        }

        function filterGames() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allGames.filter(g => g.name.toLowerCase().includes(term));
            renderGames(filtered);
        }

        async function checkExpansions(gameId, gameName) {
            document.getElementById('modalTitle').textContent = gameName;
            document.getElementById('expansionModal').classList.remove('hidden');
            document.getElementById('modalLoading').classList.remove('hidden');
            document.getElementById('modalContent').classList.add('hidden');

            try {
                const response = await fetch(`/api/bgg-helper?endpoint=thing&id=${gameId}`);
                const text = await response.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, 'text/xml');
                
                const links = Array.from(xml.querySelectorAll('link[type="boardgameexpansion"]'));
                
                const owned = [];
                const missing = [];
                const expansionData = {};

                links.forEach(link => {
                    const id = link.getAttribute('id');
                    const name = link.getAttribute('value');
                    const isInbound = link.getAttribute('inbound') === 'true';
                    
                    if (!isInbound) { // Only look at children (expansions of this game)
                        if (ownedGameIds.has(id)) {
                            owned.push({ id, name });
                        } else {
                            missing.push({ id, name });
                        }
                    }
                });

                // Fetch data for all expansions in batches (max 20 per batch to avoid 502 errors)
                const allExpansions = [...owned, ...missing];
                const batchSize = 20;
                const delayBetweenBatches = 1000; // 1 second delay between batches
                
                for (let i = 0; i < allExpansions.length; i += batchSize) {
                    const batch = allExpansions.slice(i, i + batchSize);
                    const batchIds = batch.map(e => e.id).join(',');
                    
                    try {
                        const batchResponse = await fetch(`/api/bgg-helper?endpoint=thing&id=${batchIds}&stats=1`);
                        const batchText = await batchResponse.text();
                        
                        if (!batchResponse.ok) {
                            throw new Error(`API error: ${batchResponse.status}`);
                        }
                        
                        const batchXml = parser.parseFromString(batchText, 'text/xml');
                        
                        // Check for XML parsing errors
                        if (batchXml.documentElement.tagName === 'parsererror') {
                            throw new Error('Failed to parse XML response');
                        }
                        
                        const items = Array.from(batchXml.querySelectorAll('item'));
                        items.forEach(item => {
                            const itemId = item.getAttribute('id');
                            if (!itemId) return;
                            
                            const imageEl = item.querySelector('image');
                            const yearEl = item.querySelector('yearpublished');
                            const statsEl = item.querySelector('statistics');
                            const ratingEl = statsEl ? statsEl.querySelector('average') : null;
                            const weightEl = statsEl ? statsEl.querySelector('averageweight') : null;
                            
                            expansionData[itemId] = {
                                thumbnail: imageEl ? imageEl.textContent : null,
                                year: yearEl ? (yearEl.getAttribute('value') || yearEl.textContent || 'N/A') : 'N/A',
                                rating: ratingEl ? parseFloat(ratingEl.getAttribute('value') || ratingEl.textContent || 0).toFixed(1) : 'N/A',
                                weight: weightEl ? parseFloat(weightEl.getAttribute('value') || weightEl.textContent || 0).toFixed(1) : 'N/A'
                            };
                        });
                    } catch (e) {
                        console.error('Error fetching batch data:', e);
                        // Set default data for items in this batch
                        batch.forEach(exp => {
                            if (!expansionData[exp.id]) {
                                expansionData[exp.id] = {
                                    thumbnail: null,
                                    year: 'N/A',
                                    rating: 'N/A',
                                    weight: 'N/A'
                                };
                            }
                        });
                    }
                    
                    // Add delay between batches to avoid rate limiting
                    if (i + batchSize < allExpansions.length) {
                        await new Promise(resolve => setTimeout(resolve, delayBetweenBatches));
                    }
                }

                const renderList = (items, emptyMsg) => {
                    if (items.length === 0) return `<div class="text-gray-400 italic">${emptyMsg}</div>`;
                    return items.map(i => {
                        const data = expansionData[i.id] || {};
                        return `
                        <div class="flex items-center gap-3 bg-gray-50 p-3 rounded border border-gray-200 hover:border-gray-300 transition">
                            <div class="w-12 h-12 bg-gray-200 rounded flex-shrink-0 overflow-hidden">
                                ${data.thumbnail ? `<img src="${data.thumbnail}" alt="${i.name}" class="w-full h-full object-contain">` : '<div class="w-full h-full flex items-center justify-center text-gray-400 text-xs">No img</div>'}
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center justify-between gap-2 mb-1">
                                    <p class="font-medium text-gray-900 text-sm truncate">${i.name}</p>
                                    <span class="text-xs text-gray-500 flex-shrink-0">${data.year}</span>
                                </div>
                                <div class="flex items-center gap-2 text-xs mb-1">
                                    <span class="px-1.5 py-0.5 bg-yellow-100 text-yellow-800 rounded">⭐ ${data.rating}</span>
                                    <span class="px-1.5 py-0.5 bg-purple-100 text-purple-800 rounded">⚙️ ${data.weight}</span>
                                </div>
                                <a href="https://boardgamegeek.com/boardgame/${i.id}" target="_blank" class="text-blue-500 hover:underline text-xs">View on BGG →</a>
                            </div>
                        </div>
                    `}).join('');
                };

                document.getElementById('ownedCount').textContent = owned.length;
                document.getElementById('missingCount').textContent = missing.length;
                document.getElementById('ownedExpansions').innerHTML = renderList(owned, "No owned expansions found");
                document.getElementById('missingExpansions').innerHTML = renderList(missing, "No missing expansions found (or none exist)");

                document.getElementById('modalLoading').classList.add('hidden');
                document.getElementById('modalContent').classList.remove('hidden');

            } catch (error) {
                console.error(error);
                document.getElementById('ownedExpansions').innerHTML = '<div class="text-red-500">Error loading data</div>';
                document.getElementById('modalLoading').classList.add('hidden');
                document.getElementById('modalContent').classList.remove('hidden');
            }
        }

        function closeModal() {
            document.getElementById('expansionModal').classList.add('hidden');
        }
    </script>
    <!-- Vercel Web Analytics -->
    <script type="module" src="analytics-init.js"></script>

</body>
</html>
