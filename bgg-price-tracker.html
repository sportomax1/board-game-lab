<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BGG Price Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='75' font-size='70'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">
<style>
body{font-family:Arial,sans-serif;margin:0;background:#0f172a;color:#f8fafc}main{padding:18px;max-width:1500px;margin:auto}.card{background:#111827;border:1px solid #334155;border-radius:14px;padding:12px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input{background:#020617;color:#fff;border:1px solid #334155;border-radius:8px;padding:8px}button{background:#6366f1;color:white;border:0;border-radius:8px;padding:9px 12px;font-weight:bold}label{color:#cbd5e1;font-size:13px}.checks label{margin-right:10px}table{width:100%;border-collapse:collapse;background:#111827;font-size:13px}th,td{border-bottom:1px solid #334155;padding:8px;white-space:nowrap;text-align:left}th{position:sticky;top:0;background:#1e293b;cursor:pointer}a{color:#fff;font-weight:bold;text-decoration:none}.muted{color:#94a3b8;font-size:12px}.good{color:#86efac;font-weight:bold}.wrap{overflow:auto;border:1px solid #334155;border-radius:14px}.game{display:flex;gap:8px;align-items:center}.game img{width:40px;height:40px;object-fit:cover;border-radius:7px}
</style>
</head>
<body>
<main>
<h1>🎲 BGG Price Tracker</h1>
<p class="muted">Collection from BGG, prices from Amazon, store vendors, eBay, and GeekMarket. Default user: <b>sportomax</b>.</p>
<section class="card">
<div class="row">
<label>User <input id="user" value="sportomax"></label>
<label>Search <input id="q"></label>
<label>Max best $ <input id="max"></label>
<button id="load">Load Collection</button>
<button id="price">Price Visible</button>
<button id="clear">Clear Prices</button>
<span id="status" class="good"></span>
</div>
<div class="checks" style="margin-top:10px">
<label><input type="checkbox" value="own" checked>Own</label>
<label><input type="checkbox" value="wishlist">Wishlist</label>
<label><input type="checkbox" value="want">Want</label>
<label><input type="checkbox" value="wanttoplay">Want to Play</label>
<label><input type="checkbox" value="wanttobuy">Want to Buy</label>
<label><input type="checkbox" value="preordered">Preordered</label>
<label><input type="checkbox" value="fortrade">For Trade</label>
<label><input type="checkbox" value="prevowned">Previously Owned</label>
</div>
</section>
<p id="count" class="muted">No collection loaded.</p>
<div class="wrap"><table><thead><tr><th data-s="name">Game</th><th data-s="average">Avg</th><th data-s="plays">Plays</th><th data-s="best">Best</th><th data-s="amazon">Amazon</th><th data-s="vendors">Vendors</th><th data-s="ebay">eBay</th><th data-s="geekmarket">GeekMarket</th><th>Action</th></tr></thead><tbody id="body"></tbody></table></div>
</main>
<script src="bgg-price-tracker.js"></script>
</body>
</html>
