<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App Index</title>
    <meta name="theme-color" content="#0f172a">
    <style>
        :root{--bg-body:#f8fafc;--bg-card:#fff;--text-main:#1e293b;--text-muted:#64748b;--primary:#4f46e5;--primary-light:#e0e7ff;--border:#e2e8f0;--font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
        @media(prefers-color-scheme:dark){:root{--bg-body:#0f172a;--bg-card:#1e293b;--text-main:#f1f5f9;--text-muted:#94a3b8;--primary:#818cf8;--primary-light:#312e81;--border:#334155}}
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{font-family:var(--font-sans);margin:0;background:var(--bg-body);color:var(--text-main);line-height:1.5;padding-bottom:40px}.container{max-width:800px;margin:0 auto;padding:20px}header{margin-bottom:24px;display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;font-weight:800;margin:0;background:linear-gradient(135deg,var(--primary),#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.meta-info{font-size:13px;color:var(--text-muted);font-weight:500}.controls-area{position:sticky;top:10px;z-index:100;background:rgba(255,255,255,.8);backdrop-filter:blur(12px);padding:12px;border-radius:16px;margin-bottom:24px;border:1px solid rgba(255,255,255,.1);box-shadow:0 4px 12px #0001}@media(prefers-color-scheme:dark){.controls-area{background:rgba(30,41,59,.8);border:1px solid rgba(255,255,255,.05)}}.search-wrapper{position:relative;margin-bottom:12px}.search-input{width:100%;padding:12px 16px 12px 44px;background:var(--bg-body);border:1px solid var(--border);border-radius:12px;font-size:16px;color:var(--text-main);outline:none}.search-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none}.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter-btn{padding:8px 16px;font-size:14px;font-weight:600;border-radius:20px;background:var(--bg-body);border:1px solid var(--border);color:var(--text-muted);white-space:nowrap;cursor:pointer}.filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}.app-list{display:grid;gap:4px;grid-template-columns:1fr}@media(min-width:600px){.app-list{grid-template-columns:repeat(2,1fr)}}.app-card{background:var(--bg-card);border-radius:8px;text-decoration:none;color:inherit;display:flex;align-items:center;gap:7px;padding:6px 8px;transition:background-color .15s,border-color .15s;border:1px solid var(--border);min-width:0}.app-card:hover{background:var(--primary-light);border-color:var(--primary)}.card-header{display:flex;align-items:center;flex-shrink:0}.file-type{font-size:9px;font-weight:700;text-transform:uppercase;padding:2px 5px;border-radius:4px;background:var(--bg-body);color:var(--text-muted);flex-shrink:0}.badge-html{color:#e34c26;background:#fff0eb}.badge-py{color:#3776ab;background:#e0f2ff}.badge-js{color:#d4b830;background:#fffbe0}@media(prefers-color-scheme:dark){.badge-html{background:#2a1b18}.badge-py{background:#182633}.badge-js{background:#2a2718}}.app-name{font-size:12px;font-weight:500;color:var(--text-main);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}.app-path{display:none}.card-footer{margin-left:auto;flex-shrink:0;font-size:11px;color:var(--text-muted)}.time-badge{display:flex;align-items:center;gap:3px}.arrow-icon{display:none}.hidden{display:none!important}.fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(79,70,229,.4);border:0;cursor:pointer;z-index:200;font-size:24px}
    </style>
</head>
<body>
<div class="container">
<header><div><h1>App Index</h1><div class="meta-info">Updated: Jun 09, 17:10</div></div><div id="fileCount" class="meta-info" style="background:var(--bg-card);padding:4px 8px;border-radius:8px;border:1px solid var(--border);">Loading...</div></header>
<div class="controls-area"><div class="search-wrapper"><svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg><input type="text" id="searchInput" class="search-input" placeholder="Search apps..."></div><div class="filters"><button class="filter-btn active" data-filter="all">All</button><button class="filter-btn" data-filter=".html">Apps</button><button class="filter-btn" data-filter=".py">Scripts</button><button class="filter-btn" data-filter=".json">Data</button><button class="filter-btn" data-filter="recent">Recent</button></div></div>
<div id="appList" class="app-list">
<a href="bgg-complexity-dashboard.html" class="app-card" data-name="bgg-complexity-dashboard.html" data-ext=".html" data-recent="true"><div class="card-header"><span class="file-type badge-html">HTML</span></div><div class="app-name">bgg-complexity-dashboard.html</div><span class="app-path">bgg-complexity-dashboard.html</span><div class="card-footer"><div class="time-badge">New</div></div></a>
<a href="collectionhub.html" class="app-card" data-name="collectionhub.html" data-ext=".html" data-recent="false"><div class="card-header"><span class="file-type badge-html">HTML</span></div><div class="app-name">collectionhub.html</div><span class="app-path">collectionhub.html</span><div class="card-footer"><div class="time-badge">11d ago</div></div></a>
<a href="index-db.html" class="app-card" data-name="index-db.html" data-ext=".html" data-recent="false"><div class="card-header"><span class="file-type badge-html">HTML</span></div><div class="app-name">index-db.html</div><span class="app-path">index-db.html</span><div class="card-footer"><div class="time-badge">11d ago</div></div></a>
<a href="rankstore.html" class="app-card" data-name="rankstore.html" data-ext=".html" data-recent="false"><div class="card-header"><span class="file-type badge-html">HTML</span></div><div class="app-name">rankstore.html</div><span class="app-path">rankstore.html</span><div class="card-footer"><div class="time-badge">13d ago</div></div></a>
<a href="plays.html" class="app-card" data-name="plays.html" data-ext=".html" data-recent="false"><div class="card-header"><span class="file-type badge-html">HTML</span></div><div class="app-name">plays.html</div><span class="app-path">plays.html</span><div class="card-footer"><div class="time-badge">43d ago</div></div></a>
</div>
</div>
<button class="fab" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
<script>
const cards=[...document.querySelectorAll('.app-card')],searchInput=document.getElementById('searchInput'),filterBtns=[...document.querySelectorAll('.filter-btn')],fileCount=document.getElementById('fileCount');let currentFilter='all';function updateList(){const q=searchInput.value.toLowerCase();let visible=0;cards.forEach(c=>{const name=c.dataset.name.toLowerCase(),path=c.querySelector('.app-path')?.textContent.toLowerCase()||'',ext=c.dataset.ext,recent=c.dataset.recent==='true';const matchSearch=name.includes(q)||path.includes(q);const matchFilter=currentFilter==='all'||currentFilter===ext||(currentFilter==='recent'&&recent);const show=matchSearch&&matchFilter;c.classList.toggle('hidden',!show);if(show)visible++});fileCount.textContent=`${visible} Apps`}searchInput.addEventListener('input',updateList);filterBtns.forEach(b=>b.addEventListener('click',()=>{filterBtns.forEach(x=>x.classList.remove('active'));b.classList.add('active');currentFilter=b.dataset.filter;updateList}));updateList();
</script>
</body>
</html>
