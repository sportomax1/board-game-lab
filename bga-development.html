<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1120"><title>BGA Development Tracker</title>
<style>
:root{--bg:#0b1120;--p:#111827;--p2:#182235;--line:#26334a;--text:#f1f5f9;--muted:#94a3b8;--a:#818cf8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.hidden{display:none!important}.shell{max-width:1100px;margin:auto;padding:12px 12px 80px}.login{max-width:380px;margin:20vh auto;padding:22px;background:var(--p);border:1px solid var(--line);border-radius:18px}.login input{width:100%;margin:12px 0}.top,.toolbar,.tabs,.actions,.checks{display:flex;gap:8px;align-items:center}header{position:sticky;top:0;z-index:5;background:#0b1120ee;padding:8px 0}.top h1{font-size:18px;margin:0;flex:1}.btn,input,select,textarea{background:var(--p2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px}.btn{font-weight:700;cursor:pointer}.primary{background:var(--a);color:#0b1120}.danger{color:#fecdd3}.search{flex:1;min-width:0}.toolbar,.tabs{margin-top:8px}.tabs{overflow:auto}.tab{white-space:nowrap}.tab.active{background:#312e81;color:white}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.stat,.card,.contact,.lane{background:var(--p);border:1px solid var(--line);border-radius:14px}.stat{padding:10px}.stat b{display:block;font-size:18px}.stat span,.meta{font-size:11px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card{padding:11px;display:grid;grid-template-columns:58px 1fr;gap:10px;cursor:pointer}.thumb{width:58px;height:58px;border-radius:10px;object-fit:cover;background:var(--p2)}.name{font-weight:800}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.chip{font-size:9px;text-transform:uppercase;padding:4px 7px;border-radius:99px;background:#1e293b}.pipeline{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:8px;overflow:auto}.lane{padding:8px}.lane h3{font-size:11px;color:var(--muted)}.lane .card{grid-template-columns:42px 1fr;margin-bottom:7px}.lane .thumb{width:42px;height:42px}.contact{padding:11px;margin-bottom:8px}.empty{text-align:center;color:var(--muted);padding:45px}dialog{border:0;background:transparent;color:var(--text);width:min(680px,calc(100% - 16px))}dialog::backdrop{background:#000b}.modal{background:var(--p);border:1px solid var(--line);border-radius:18px;overflow:hidden}.head,.body,.actions{padding:13px}.head{display:flex;border-bottom:1px solid var(--line)}.head h2{margin:0;font-size:16px;flex:1}.body{max-height:72vh;overflow:auto}.actions{justify-content:flex-end;border-top:1px solid var(--line)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:flex;flex-direction:column;gap:4px}.field.full{grid-column:1/-1}.field label{font-size:10px;color:var(--muted);text-transform:uppercase}.field input,.field select,.field textarea{width:100%}.field textarea{min-height:75px}.bgg div{padding:8px;border:1px solid var(--line);border-radius:9px;margin-top:5px;cursor:pointer}@media(max-width:700px){.cards{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head><body>
<div id="passwordScreen" class="login"><h2>🎲 BGA Development</h2><div class="meta">Use the same Board Game Lab access key.</div><input id="appPassword" type="password" placeholder="Access Key" autocomplete="current-password"><button id="unlockBtn" class="btn primary">Unlock Dashboard</button><div id="passwordError" class="meta" style="margin-top:10px;color:#fb7185"></div></div>
<div id="app" class="shell hidden"><header><div class="top"><h1>🎲 BGA Development</h1><button id="addContact" class="btn">+ Contact</button><button id="addBtn" class="btn primary">+ Game</button></div><div class="toolbar"><input id="search" class="search" placeholder="Search games, contacts, notes…"><button id="refresh" class="btn">↻</button></div><div class="tabs"><button class="btn tab active" data-view="games">Games</button><button class="btn tab" data-view="pipeline">Pipeline</button><button class="btn tab" data-view="contacts">Contacts</button><button class="btn tab" data-view="followups">Follow-ups</button></div></header><div id="stats" class="stats"></div><main id="content"></main></div>
<dialog id="projectDialog"><div class="modal"><div class="head"><h2 id="projectTitle">Add BGA Project</h2><button class="btn" onclick="projectDialog.close()">✕</button></div><div class="body"><div class="field full"><label>Search BGG</label><div style="display:flex;gap:6px"><input id="bggSearch" style="flex:1" placeholder="Game title"><button id="bggSearchBtn" class="btn">Search</button></div><div id="bggResults" class="bgg"></div></div><div class="grid" style="margin-top:10px"><div class="field"><label>Game</label><input id="pName"></div><div class="field"><label>BGG ID</label><input id="pBggId"></div><div class="field"><label>Outreach</label><select id="pOutreach"><option value="not_contacted">Not contacted</option><option value="contacted">Contacted</option><option value="interested">Interested</option><option value="approved">Approved</option><option value="declined">Declined</option><option value="on_hold">On hold</option></select></div><div class="field"><label>Development</label><select id="pStage"><option value="prospect">Prospect</option><option value="development">Development</option><option value="alpha">Alpha</option><option value="beta">Beta</option><option value="production">Production</option></select></div><div class="field"><label>Compensation</label><select id="pComp"><option value="tbd">TBD</option><option value="free">Free</option><option value="paid">Paid</option></select></div><div class="field"><label>Amount</label><input id="pAmount" type="number"></div><div class="field"><label>Follow-up</label><input id="pFollow" type="date"></div><div class="field"><label>BGA URL</label><input id="pBgaUrl"></div><div class="field full"><label>Next action</label><input id="pAction"></div><div class="field full"><label>Notes</label><textarea id="pNotes"></textarea></div><div class="field full checks"><label><input id="pPremium" type="checkbox"> Premium</label><label><input id="pApproved" type="checkbox"> Approved</label><label><input id="pAssets" type="checkbox"> Assets</label><label><input id="pActive" type="checkbox" checked> Active</label></div></div></div><div class="actions"><button id="deleteProject" class="btn danger hidden">Delete</button><button class="btn" onclick="projectDialog.close()">Cancel</button><button id="saveProject" class="btn primary">Save</button></div></div></dialog>
<dialog id="contactDialog"><div class="modal"><div class="head"><h2>Add Contact / Entity</h2><button class="btn" onclick="contactDialog.close()">✕</button></div><div class="body grid"><div class="field"><label>Type</label><select id="cType"><option>publisher</option><option>designer</option><option>artist</option><option>user</option><option>other</option></select></div><div class="field"><label>BGG ID</label><input id="cBggId"></div><div class="field full"><label>Name</label><input id="cName"></div><div class="field"><label>BGG username</label><input id="cUsername"></div><div class="field"><label>Image URL</label><input id="cImage"></div><div class="field full"><label>Notes</label><textarea id="cNotes"></textarea></div></div><div class="actions"><button class="btn" onclick="contactDialog.close()">Cancel</button><button id="saveContact" class="btn primary">Save</button></div></div></dialog>
<script>
const $=id=>document.getElementById(id);let projects=[],entities=[],links=[],interactions=[],view='games',editing=null,selectedBGG=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const pretty=s=>String(s||'').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());
async function api(action,table,opt={}){const body={action,table,...opt};const r=await fetch('/api/supabase',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok||!j.ok)throw new Error(typeof j.error==='string'?j.error:JSON.stringify(j.error));return j.rows||[]}
window.addEventListener('DOMContentLoaded',()=>{const saved=localStorage.getItem('app_password_hint');if(saved)$('appPassword').value=saved});
$('unlockBtn').onclick=async()=>{const password=$('appPassword').value,btn=$('unlockBtn');$('passwordError').textContent='';btn.disabled=true;btn.textContent='Checking Key…';const correctPassword=await fetch('/api/get-password').then(r=>r.text()).catch(()=>'');if(password!==correctPassword){$('passwordError').textContent='Invalid key';btn.disabled=false;btn.textContent='Unlock Dashboard';return}localStorage.setItem('app_password_hint',password);$('passwordScreen').classList.add('hidden');$('app').classList.remove('hidden');btn.disabled=false;btn.textContent='Unlock Dashboard';await loadAll()};
async function loadAll(){try{const [e,p,l,i]=await Promise.all([api('READ','bga_entities',{limit:1000}),api('READ','bga_projects',{limit:1000}),api('READ','bga_project_entities',{limit:2000}),api('READ','bga_interactions',{limit:2000})]);entities=e;projects=p.sort((a,b)=>String(b.updated_at).localeCompare(String(a.updated_at)));links=l;interactions=i.sort((a,b)=>String(b.interaction_date).localeCompare(String(a.interaction_date)));render()}catch(e){$('content').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
const gameFor=p=>entities.find(e=>e.id===p.game_entity_id)||{name:'Unknown'};const lastContact=p=>interactions.find(i=>i.project_id===p.id);const matches=(p,q)=>[gameFor(p).name,p.notes,p.next_action,p.outreach_status,p.development_stage].join(' ').toLowerCase().includes(q);
function render(){const active=projects.filter(p=>p.active),today=new Date().toISOString().slice(0,10);$('stats').innerHTML=`<div class="stat"><b>${active.length}</b><span>Active</span></div><div class="stat"><b>${active.filter(p=>p.development_stage==='alpha').length}</b><span>Alpha</span></div><div class="stat"><b>${active.filter(p=>p.development_stage==='beta').length}</b><span>Beta</span></div><div class="stat"><b>${active.filter(p=>p.development_stage==='production').length}</b><span>Production</span></div>`;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===view));const q=$('search').value.toLowerCase();if(view==='games'){$('content').innerHTML=projects.filter(p=>matches(p,q)).length?`<div class="cards">${projects.filter(p=>matches(p,q)).map(card).join('')}</div>`:'<div class="empty">No projects yet.</div>'}else if(view==='pipeline'){const stages=['prospect','development','alpha','beta','production'];$('content').innerHTML=`<div class="pipeline">${stages.map(s=>`<section class="lane"><h3>${pretty(s)} · ${projects.filter(p=>p.development_stage===s).length}</h3>${projects.filter(p=>p.development_stage===s&&matches(p,q)).map(card).join('')}</section>`).join('')}</div>`}else if(view==='contacts'){const a=entities.filter(e=>e.entity_type!=='game'&&[e.name,e.entity_type,e.bgg_username,e.notes].join(' ').toLowerCase().includes(q));$('content').innerHTML=a.length?a.map(e=>`<div class="contact"><div class="name">${esc(e.name)}</div><div class="meta">${pretty(e.entity_type)}${e.bgg_username?' · @'+esc(e.bgg_username):''}${e.bgg_id?' · BGG '+e.bgg_id:''}</div></div>`).join(''):'<div class="empty">No contacts yet.</div>'}else{const a=projects.filter(p=>p.next_follow_up&&matches(p,q)).sort((a,b)=>a.next_follow_up.localeCompare(b.next_follow_up));$('content').innerHTML=a.length?`<div class="cards">${a.map(p=>`<article class="card" onclick="editProject(${p.id})"><div class="thumb" style="display:grid;place-items:center">${p.next_follow_up<=today?'⚠️':'📅'}</div><div><div class="name">${esc(gameFor(p).name)}</div><div class="meta">${p.next_follow_up} · ${esc(p.next_action||'Follow up')}</div></div></article>`).join('')}</div>`:'<div class="empty">No follow-ups.</div>'}}
function card(p){const g=gameFor(p),lc=lastContact(p),img=g.thumbnail_url||g.image_url;return `<article class="card" onclick="editProject(${p.id})">${img?`<img class="thumb" src="${esc(img)}">`:'<div class="thumb" style="display:grid;place-items:center">🎲</div>'}<div><div class="name">${esc(g.name)}</div><div class="meta">${g.bgg_id?'BGG '+g.bgg_id+' · ':''}${lc?'Last contact '+new Date(lc.interaction_date).toLocaleDateString():esc(p.next_action||'No contact logged')}</div><div class="chips"><span class="chip">${pretty(p.outreach_status)}</span><span class="chip">${pretty(p.development_stage)}</span>${p.premium===true?'<span class="chip">Premium</span>':''}</div></div></article>`}
$('search').oninput=render;$('refresh').onclick=loadAll;document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{view=t.dataset.view;render()});
function resetProject(){['pName','pBggId','pAmount','pFollow','pBgaUrl','pAction','pNotes','bggSearch'].forEach(x=>$(x).value='');$('pOutreach').value='not_contacted';$('pStage').value='prospect';$('pComp').value='tbd';$('pPremium').checked=$('pApproved').checked=$('pAssets').checked=false;$('pActive').checked=true;$('bggResults').innerHTML=''}
$('addBtn').onclick=()=>{editing=null;selectedBGG=null;resetProject();$('projectTitle').textContent='Add BGA Project';$('deleteProject').classList.add('hidden');projectDialog.showModal()};$('addContact').onclick=()=>{['cBggId','cName','cUsername','cImage','cNotes'].forEach(x=>$(x).value='');contactDialog.showModal()};
window.editProject=id=>{const p=projects.find(x=>x.id===id),g=gameFor(p);editing=p;selectedBGG=g;$('projectTitle').textContent='Edit '+g.name;$('pName').value=g.name||'';$('pBggId').value=g.bgg_id||'';$('pOutreach').value=p.outreach_status;$('pStage').value=p.development_stage;$('pComp').value=p.compensation_status;$('pAmount').value=p.compensation_amount??'';$('pFollow').value=p.next_follow_up||'';$('pBgaUrl').value=p.bga_url||'';$('pAction').value=p.next_action||'';$('pNotes').value=p.notes||'';$('pPremium').checked=p.premium===true;$('pApproved').checked=p.approval_received;$('pAssets').checked=p.assets_received;$('pActive').checked=p.active;$('deleteProject').classList.remove('hidden');projectDialog.showModal()};
async function bggFetch(endpoint,params){const u=new URL('/api/bgg-helper',location.origin);u.searchParams.set('endpoint',endpoint);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));const r=await fetch(u);if(!r.ok)throw Error('BGG request failed');return r.text()}
$('bggSearchBtn').onclick=async()=>{const q=$('bggSearch').value.trim();if(!q)return;$('bggResults').innerHTML='<div>Searching…</div>';try{const xml=await bggFetch('search',{query:q,type:'boardgame'}),doc=new DOMParser().parseFromString(xml,'text/xml'),items=[...doc.querySelectorAll('item')].slice(0,12);$('bggResults').innerHTML=items.map((n,i)=>`<div data-i="${i}"><b>${esc(n.querySelector('name')?.getAttribute('value'))}</b><br><span class="meta">BGG ${n.getAttribute('id')} · ${n.querySelector('yearpublished')?.getAttribute('value')||'?'}</span></div>`).join('');[...$('bggResults').children].forEach((el,i)=>el.onclick=()=>selectBGG(items[i]))}catch(e){$('bggResults').innerHTML=`<div>${esc(e.message)}</div>`}};
async function selectBGG(n){const id=n.getAttribute('id');$('pBggId').value=id;$('pName').value=n.querySelector('name')?.getAttribute('value')||'';try{const xml=await bggFetch('thing',{id}),doc=new DOMParser().parseFromString(xml,'text/xml'),item=doc.querySelector('item');selectedBGG={bgg_id:+id,name:item.querySelector('name[type="primary"]')?.getAttribute('value')||$('pName').value,thumbnail_url:item.querySelector('thumbnail')?.textContent||'',image_url:item.querySelector('image')?.textContent||'',links:[...item.querySelectorAll('link')].filter(x=>['boardgamepublisher','boardgamedesigner','boardgameartist'].includes(x.getAttribute('type'))).map(x=>({bgg_id:+x.getAttribute('id'),name:x.getAttribute('value'),type:x.getAttribute('type').replace('boardgame','')}))};$('pName').value=selectedBGG.name;$('bggResults').innerHTML=`<div>✓ Loaded ${selectedBGG.links.length} related entities</div>`}catch{$('bggResults').innerHTML='<div>Selected; enrichment failed.</div>'}}
$('saveProject').onclick=async()=>{try{const name=$('pName').value.trim();if(!name)return alert('Game name required');let entity=editing?gameFor(editing):null;const ep={name,bgg_id:$('pBggId').value?+$('pBggId').value:null,entity_type:'game',thumbnail_url:selectedBGG?.thumbnail_url||entity?.thumbnail_url||null,image_url:selectedBGG?.image_url||entity?.image_url||null,updated_at:new Date().toISOString()};if(entity){entity=(await api('UPDATE','bga_entities',{id:entity.id,data:ep}))[0]}else entity=(await api('CREATE','bga_entities',{data:ep}))[0];const pp={game_entity_id:entity.id,outreach_status:$('pOutreach').value,development_stage:$('pStage').value,premium:$('pPremium').checked,active:$('pActive').checked,compensation_status:$('pComp').value,compensation_amount:$('pAmount').value?+$('pAmount').value:null,assets_received:$('pAssets').checked,approval_received:$('pApproved').checked,bga_url:$('pBgaUrl').value||null,next_action:$('pAction').value||null,next_follow_up:$('pFollow').value||null,notes:$('pNotes').value||null,updated_at:new Date().toISOString()};const project=editing?(await api('UPDATE','bga_projects',{id:editing.id,data:pp}))[0]:(await api('CREATE','bga_projects',{data:pp}))[0];if(selectedBGG?.links?.length&&!editing){for(const x of selectedBGG.links){let found=entities.find(e=>e.bgg_id===x.bgg_id&&e.entity_type===x.type);if(!found)found=(await api('CREATE','bga_entities',{data:{bgg_id:x.bgg_id,entity_type:x.type,name:x.name}}))[0];try{await api('CREATE','bga_project_entities',{data:{project_id:project.id,entity_id:found.id,relationship_type:x.type}})}catch{}}}projectDialog.close();await loadAll()}catch(e){alert(e.message)}};
$('deleteProject').onclick=async()=>{if(!editing||!confirm('Delete this BGA project and its game record?'))return;try{await api('DELETE','bga_entities',{id:gameFor(editing).id});projectDialog.close();loadAll()}catch(e){alert(e.message)}};
$('saveContact').onclick=async()=>{const name=$('cName').value.trim();if(!name)return alert('Name required');try{await api('CREATE','bga_entities',{data:{entity_type:$('cType').value,bgg_id:$('cBggId').value?+$('cBggId').value:null,name,bgg_username:$('cUsername').value||null,image_url:$('cImage').value||null,notes:$('cNotes').value||null}});contactDialog.close();loadAll()}catch(e){alert(e.message)}};
</script></body></html>
