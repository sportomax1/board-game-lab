<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101f"><title>BGA Tracker · Board Game Lab</title><style>:root{--bg:#07101f;--panel:#0d192b;--panel2:#111f34;--line:#21324a;--text:#f6f8fc;--muted:#8999b1;--violet:#8157f4;--blue:#4ea7ff;--green:#3de2aa;--gold:#f6bc55;--pink:#f16aa5;--r:18px;--shadow:0 18px 55px #0005}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--text);font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 85% -10%,#19234b 0,transparent 28%),radial-gradient(circle at -10% 45%,#132a46 0,transparent 24%),var(--bg);min-height:100vh}button,input,select,textarea{font:inherit}.hidden{display:none!important}.login{width:min(390px,calc(100% - 28px));margin:18vh auto;background:linear-gradient(180deg,#111e32,#0b1728);border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:var(--shadow)}.brandmark{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#9d62ff,#5531d5);display:grid;place-items:center;font-size:24px;box-shadow:0 10px 30px #7044e655}.login h1{font-size:26px;letter-spacing:-.04em;margin:18px 0 5px}.muted,.meta{color:var(--muted)}.meta{font-size:11px}.control,.btn{border:1px solid var(--line);background:#111e31;color:var(--text);border-radius:12px}.control{width:100%;padding:13px}.btn{padding:10px 13px;font-weight:750;cursor:pointer}.primary{border:0;background:linear-gradient(135deg,#9259fa,#6339dd);box-shadow:0 8px 25px #7044e644}.danger{color:#ff8fa5}.app{max-width:1420px;margin:auto;display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}.side{padding:24px 14px;position:sticky;top:0;height:100vh;border-right:1px solid #172840;background:#07101fdd;backdrop-filter:blur(16px)}.logo{display:flex;gap:11px;align-items:center;padding:0 8px 25px}.logo .brandmark{width:38px;height:38px; font-weight:800;font-size:14px}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.chip{font-size:9px;text-transform:uppercase;letter-spacing:.03em;padding:4px 7px;border-radius:99px;background:#1a2b43;color:#c9d5e5}.chip.prospect{background:#24314a}.chip.contacted{background:#15385b;color:#81c6ff}.chip.interested{background:#153d34;color:#63e3b5}.chip.approved,.chip.production{background:#493813;color:#ffd57c}.chip.alpha{background:#392567;color:#cdb2ff}.chip.beta{background:#4a1f4b;color:#ffb1e1}.pipeline{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));overflow:auto}.lane{min-height:420px;border-right:1px solid #1c2d44;padding:10px}.lane:last-child{border:0}.lane h3{font-size:10px;color:#b9c5d5;text-transform:uppercase;letter-spacing:.06em;margin:4px 4px 10px}.lane .game{grid-template-columns:44px 1fr;padding:9px;border:1px solid #21344e;border-radius:11px;margin-bottom:8px;background:#111f32}.lane .cover{width:44px;height:56px}.lane .game>button{display:none}.entity{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid #1b2b40;cursor:pointer}.avatar{width:48px;height:48px;border-radius:12px;object-fit:cover;background:#16253a;display:grid;place-items:center;font-size:22px}.exploreGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:12px}.exploreCard{background:#101e31;border:1px solid #22354e;border-radius:13px;padding:9px;display:grid;grid-template-columns:50px 1fr;gap:9px}.exploreCard img{width:50px;height:67px;object-fit:cover;border-radius:7px}.empty{padding:50px 20px;text-align:center;color:var(--muted)}dialog{border:0;background:transparent;color:var(--text);width:min(700px,calc(100% - 16px))}dialog::backdrop{background:#020711cc;backdrop-filter:blur(5px)}.modal{background:#0d1929;border:1px solid #293b55;border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}.modalHead,.modalBody,.actions{padding:15px}.modalHead{display:flex;border-bottom:1px solid var(--line)}.modalHead h2{margin:0;flex:1;font-size:17px}.modalBody{max-height:72vh;overflow:auto}.actions{display:flex;justify-content:flex-end;gap:7px;border-top:1px solid var(--line)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}.field label{font-size:10px;color:var(--muted);font-weight:750;text-transform:uppercase}.field input,.field select,.field textarea{width:100%;background:#111f33;border:1px solid #293b55;color:white;border-radius:10px;padding:10px}.field textarea{min-height:75px}.bgg div{padding:8px;border:1px solid var(--line);border-radius:9px;margin-top:5px;cursor:pointer}.mobileNav{display:none}.notice{padding:9px 12px;border:1px solid #2d4260;background:#102139;border-radius:11px;color:#aebbd0;font-size:11px;margin-bottom:12px}@media(max-width:900px){.app{display:block}.side{display:none}.main{padding:14px 11px 88px}.top{position:sticky;top:0;z-index:10;background:#07101fe8;padding:7px 0 10px;margin:0 0 12px;backdrop-filter:blur(12px)}.hero{align-items:center}.hero h1{font-size:24px}.hero p{font-size:11px}.stats{grid-template-columns:repeat(2,1fr);gap:7px}.stat{min-height:92px;padding:12px}.stat:last-child{grid-column:1/-1}.stat b{font-size:22px;margin-top:7px}.cards{grid-template-columns:1fr}.game:nth-child(odd){border-right:0}.game{grid-template-columns:55px minmax(0,1fr);padding:11px}.game .cover{width:55px;height:68px}.game>button{grid-column:1/-1}.pipeline{grid-template-columns:repeat(5,82vw)}.exploreGrid{grid-template-columns:1fr;padding:8px}.mobileNav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;background:#091425f5;border-top:1px solid #22334b;padding:6px max(7px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left));justify-content:space-around;backdrop-filter:blur(18px)}.mobileNav button{border:0;background:transparent;color:#8495ad;font-size:9px;min-width:54px;padding:5px 2px}.mobileNav button span{display:block;font-size:19px;margin-bottom:2px}.mobileNav button.active{color:#b997ff}.grid{grid-template-columns:1fr}.full{grid-column:auto}}@media(max-width:480px){.top .round{display:none}.hero .btn{font-size:11px;padding:9px}.stat i{font-size:16px}.stat small{font-size:10px}}</style></head><body><section id="passwordScreen" class="login"><div class="brandmark">⚗</div><h1>Board Game Lab</h1><div class="muted">BGA development tracker</div><input id="appPassword" class="control" type="password" placeholder="Access key" style="margin:18px 0 10px"><button id="unlockBtn" class="btn primary" style="width:100%">Open workspace</button><div id="passwordError" class="meta" style="color:#ff8fa5;margin-top:9px"></div></section><div id="app" class="app hidden"><aside class="side"><div class="logo"><div class="brandmark">⚗</div><div><b>Board Game Lab</b><small class="muted">BGA Tracker</small></div></div><nav id="desktopNav" class="nav"></nav></aside><main class="main"><div class="top"><input id="search" class="control search" placeholder="Search games, publishers, designers…"><button id="refresh" class="btn round">↻</button><button id="addGame" class="btn primary round">＋</button></div><section class="hero"><div><h1>Development workspace</h1><p>Track outreach, relationships and every BGA build from prospect to production.</p></div><button id="addEntity" class="btn">+ Contact</button></section><div id="notice"></div><section id="stats" class="stats"></section><section class="panel"><div class="panelHead"><h2 id="viewTitle">Games</h2><span id="viewCount" class="meta"></span></div><div id="content" class="content"></div></section></main><nav id="mobileNav" class="mobileNav"></nav></div><dialog id="entityDialog"><div class="modal"><div class="modalHead"><h2>Person / Publisher</h2><button class="btn" onclick="entityDialog.close()">✕</button></div><div class="modalBody grid"><div class="field"><label>Type</label><select id="eType"><option>publisher</option><option>designer</option><option>artist</option><option>user</option><option>other</option></select></div><div class="field"><label>Status</label><select id="eStatus"><option>prospect</option><option>contacted</option><option>interested</option><option>approved</option><option>declined</option><option>on_hold</option><option>active</option><option>inactive</option></select></div><div class="field full"><label>Name</label><input id="eName"></div><div class="field"><label>BGG ID</label><input id="eBgg"></div><div class="field"><label>BGG username</label><input id="eUser"></div><div class="field full"><label>Image URL</label><input id="eImage"></div><div class="field full"><label>Notes</label><textarea id="eNotes"></textarea></div></div><div class="actions"><button id="deleteEntity" class="btn danger hidden">Delete</button><button id="saveEntity" class="btn primary">Save</button></div></div></dialog><dialog id="gameDialog"><div class="modal"><div class="modalHead"><h2>BGA Game</h2><button class="btn" onclick="gameDialog.close()">✕</button></div><div class="modalBody"><div class="field"><label>BGG Search</label><div style="display:flex;gap:6px"><input id="bggSearch" style="flex:1" placeholder="Search title"><button id="bggSearchBtn" class="btn">Search</button></div><div id="bggResults" class="bgg"></div></div><div class="grid" style="margin-top:10px"><div class="field"><label>Game</label><input id="gName"></div><div class="field"><label>BGG ID</label><input id="gBgg"></div><div class="field"><label>Outreach</label><select id="gOut"><option value="not_contacted">Not contacted</option><option>contacted</option><option>interested</option><option>approved</option><option>declined</option><option value="on_hold">On hold</option></select></div><div class="field"><label>Development</label><select id="gStage"><option>prospect</option><option>development</option><option>alpha</option><option>beta</option><option>production</option></select></div><div class="field"><label>Follow-up</label><input id="gFollow" type="date"></div><div class="field"><label>BGA URL</label><input id="gUrl"></div><div class="field full"><label>Next action</label><input id="gAction"></div><div class="field full"><label>Notes</label><textarea id="gNotes"></textarea></div><div class="field full"><label><input id="gPremium" type="checkbox"> Premium</label> &nbsp; <label><input id="gApproved" type="checkbox"> Approval</label> &nbsp; <label><input id="gAssets" type="checkbox"> Assets</label></div></div></div><div class="actions"><button id="deleteGame" class="btn danger hidden">Delete</button><button id="saveGame" class="btn primary">Save</button></div></div></dialog><script>const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),pretty=s=>String(s||'').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());let entities=[],projects=[],view='games',editE=null,editG=null,selectedBGG=null,xe=null,xgames=[];const nav=[['games','🎮','Games'],['pipeline','⇄','Pipeline'],['entities','♙','People & Publishers'],['explore','⌕','Explore Catalog'],['followups','◷','Follow-ups']];async function api(action,table,opt={}){let r=await fetch('/api/supabase',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,table,...opt})}),j=await r.json();if(!r.ok||!j.ok)throw Error(typeof j.error==='string'?j.error:'Database request failed');return j.rows||[]}function makeNav(){let h=nav.map(n=>`<button data-view="${n[0]}"><span>${n[1]}</span>${n[2]}</button>`).join('');$('desktopNav').innerHTML=h;$('mobileNav').innerHTML=h;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()})}window.addEventListener('DOMContentLoaded',()=>{makeNav();let s=localStorage.getItem('app_password_hint');if(s)$('appPassword').value=s});$('unlockBtn').onclick=async()=>{let p=$('appPassword').value,b=$('unlockBtn');b.disabled=true;b.textContent='Opening…';let c=await fetch('/api/get-password?v=3').then(r=>r.text()).catch(()=>null);if(p!==c){$('passwordError').textContent='Invalid access key';b.disabled=false;b.textContent='Open workspace';return}localStorage.setItem('app_password_hint',p);$('passwordScreen').classList.add('hidden');$('app').classList.remove('hidden');b.disabled=false;b.textContent='Open workspace';await loadAll()};async function loadAll(){try{$('notice').innerHTML='<div class="notice">Syncing tracker data…</div>';[entities,projects]=await Promise.all([api('READ','bga_entities',{limit:2000}),api('READ','bga_projects',{limit:2000})]);$('notice').innerHTML='';render()}catch(e){$('notice').innerHTML=`<div class="notice" style="color:#ff9aaa">Data error: ${esc(e.message)}. The database may be pointed at a different Supabase project than this deployment.</div>`;$('content').innerHTML='<div class="empty">Could not load tracker data.</div>'}}const gf=p=>entities.find(e=>e.id===p.game_entity_id)||{name:'Unknown'};function stats(){let games=entities.filter(e=>e.entity_type==='game'),people=entities.filter(e=>e.entity_type!=='game');$('stats').innerHTML=`<div class="stat" style="--glow:#8a5cff"><i>🎮</i><b>${games.length}</b><small>Tracked games</small></div><div class="stat" style="--glow:#4ea7ff"><i>🏢</i><b>${people.filter(e=>e.entity_type==='publisher').length}</b><small>Publishers</small></div><div class="stat" style="--glow:#3de2aa"><i>♙</i><b>${people.filter(e=>e.entity_type==='designer').length}</b><small>Designers</small></div><div class="stat" style="--glow:#f6bc55"><i>✓</i><b>${projects.filter(p=>['development','alpha','beta','production'].includes(p.development_stage)).length}</b><small>In development</small></div><div class="stat" style="--glow:#f16aa5"><i>◷</i><b>${projects.filter(p=>p.next_follow_up).length}</b><small>Follow-ups</small></div>`}function render(){stats();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));let q=$('search').value.toLowerCase(),title=nav.find(n=>n[0]===view)?.[2]||'Tracker';$('viewTitle').textContent=title;if(view==='games'){let x=projects.filter(p=>[gf(p).name,p.notes,p.next_action,p.outreach_status,p.development_stage].join(' ').toLowerCase().includes(q));$('viewCount').textContent=x.length+' projects';$('content').innerHTML=x.length?`<div class="cards">${x.map(card).join('')}</div>`:'<div class="empty">No matching projects.</div>'}else if(view==='pipeline'){let ss=['prospect','development','alpha','beta','production'];$('viewCount').textContent=projects.length+' projects';$('content').innerHTML=`<div class="pipeline">${ss.map(s=>`<section class="lane"><h3>${pretty(s)} · ${projects.filter(p=>p.development_stage===s).length}</h3>${projects.filter(p=>p.development_stage===s).map(card).join('')}</section>`).join('')}</div>`}else if(view==='entities'){let x=entities.filter(e=>e.entity_type!=='game'&&[e.name,e.entity_type,e.status,e.notes].join(' ').toLowerCase().includes(q));$('viewCount').textContent=x.length+' contacts';$('content').innerHTML=x.length?x.map(erow).join(''):'<div class="empty">No matching people or publishers.</div>'}else if(view==='explore'){rx()}else{let x=projects.filter(p=>p.next_follow_up).sort((a,b)=>a.next_follow_up.localeCompare(b.next_follow_up));$('viewCount').textContent=x.length+' scheduled';$('content').innerHTML=x.length?`<div class="cards">${x.map(card).join('')}</div>`:'<div class="empty">No follow-ups scheduled yet.</div>'}}function chip(v){return `<span class="chip ${esc(v)}">${pretty(v)}</span>`}function card(p){let g=gf(p),im=g.thumbnail_url||g.image_url;return `<article class="game" onclick="openGame(${p.id})">${im?`<img class="cover" src="${esc(im)}" loading="lazy">`:'<div class="cover">🎲</div>'}<div><div class="name">${esc(g.name)}</div><div class="meta">${g.bgg_id?'BGG '+g.bgg_id+' · ':''}${esc(p.next_action||'No next action')}</div><div class="chips">${chip(p.outreach_status)}${chip(p.development_stage)}${p.premium?chip('premium'):''}</div></div></article>`}function erow(e){let im=e.thumbnail_url||e.image_url;return `<div class="entity" onclick="openEntity(${e.id})">${im?`<img class="avatar" src="${esc(im)}" loading="lazy">`:`<div class="avatar">${e.entity_type==='publisher'?'🏢':'♙'}</div>`}<div><div class="name">${esc(e.name)}</div><div class="meta">${pretty(e.entity_type)}${e.bgg_id?' · BGG '+e.bgg_id:''}</div><div class="chips">${chip(e.status||'prospect')}</div></div><button class="btn" onclick="event.stopPropagation();explore(${e.id})">Explore</button></div>`}async function explore(id){xe=entities.find(e=>e.id===id);view='explore';render();$('content').innerHTML='<div class="empty">Loading catalog…</div>';try{xgames=await api('SEARCH','bgg_collection',{query:{xml:xe.name},limit:250});rx()}catch(e){$('content').innerHTML='<div class="empty">Catalog lookup failed: '+esc(e.message)+'</div>'}}function rx(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('viewTitle').textContent='Explore Catalog';if(!xe){$('viewCount').textContent='';$('content').innerHTML='<div class="empty">Open People & Publishers, then tap <b>Explore</b> beside a publisher, designer or artist.</div>';return}$('viewCount').textContent=xgames.length+' matches';$('content').innerHTML=`<div style="padding:13px 15px;border-bottom:1px solid #1c2d44"><button class="btn" onclick="view='entities';render()">← Back</button> <b style="margin-left:8px">${esc(xe.name)}</b></div><div class="exploreGrid">${xgames.map(g=>{let t=entities.find(e=>e.entity_type==='game'&&+e.bgg_id===+g.bgg_id);return `<div class="exploreCard">${g.thumb?`<img src="${esc(g.thumb)}" loading="lazy">`:'<div class="avatar">🎲</div>'}<div><div class="name">${esc(g.name)}</div><div class="meta">${g.year||''}${g.bgg_rating?' · '+(+g.bgg_rating).toFixed(1):''}${g.avgweight?' · wt '+(+g.avgweight).toFixed(1):''}</div><div class="meta ${g.own?'owned':''}">${g.own?'✓ Owned · ':''}${g.numplays||0} plays</div>${t?`<div class="chips">${chip(t.status)}</div>`:`<button class="btn" style="padding:6px 8px;margin-top:5px;font-size:10px" onclick='prospect(${g.bgg_id},${JSON.stringify(g.name)},${JSON.stringify(g.thumb||"")})'>+ Prospect</button>`}</div></div>`}).join('')}</div>`}window.prospect=async(id,n,th)=>{await api('CREATE','bga_entities',{data:{bgg_id:+id,entity_type:'game',name:n,status:'prospect',thumbnail_url:th||null,metadata:{source:'collection_explorer'}}});await loadAll();explore(xe.id)};$('search').oninput=render;$('refresh').onclick=loadAll;$('addEntity').onclick=()=>{editE=null;['eName','eBgg','eUser','eImage','eNotes'].forEach(x=>$(x).value='');$('eType').value='publisher';$('eStatus').value='prospect';$('deleteEntity').classList.add('hidden');entityDialog.showModal()};window.openEntity=id=>{editE=entities.find(e=>e.id===id);$('eType').value=editE.entity_type;$('eStatus').value=editE.status||'prospect';$('eName').value=editE.name;$('eBgg').value=editE.bgg_id||'';$('eUser').value=editE.bgg_username||'';$('eImage').value=editE.image_url||editE.thumbnail_url||'';$('eNotes').value=editE.notes||'';$('deleteEntity').classList.remove('hidden');entityDialog.showModal()};$('saveEntity').onclick=async()=>{let d={entity_type:$('eType').value,status:$('eStatus').value,name:$('eName').value.trim(),bgg_id:$('eBgg').value?+$('eBgg').value:null,bgg_username:$('eUser').value||null,image_url:$('eImage').value||null,notes:$('eNotes').value||null,updated_at:new Date().toISOString()};if(!d.name)return alert('Name required');await api(editE?'UPDATE':'CREATE','bga_entities',editE?{id:editE.id,data:d}:{data:d});entityDialog.close();loadAll()};$('deleteEntity').onclick=async()=>{if(editE&&confirm('Delete '+editE.name+'?')){await api('DELETE','bga_entities',{id:editE.id});entityDialog.close();loadAll()}};$('addGame').onclick=()=>resetGame();function resetGame(){editG=null;selectedBGG=null;['gName','gBgg','gFollow','gUrl','gAction','gNotes','bggSearch'].forEach(x=>$(x).value='');$('gOut').value='not_contacted';$('gStage').value='prospect';$('gPremium').checked=$('gApproved').checked=$('gAssets').checked=false;$('bggResults').innerHTML='';$('deleteGame').classList.add('hidden');gameDialog.showModal()}window.openGame=id=>{editG=projects.find(p=>p.id===id);let g=gf(editG);$('gName').value=g.name;$('gBgg').value=g.bgg_id||'';$('gOut').value=editG.outreach_status;$('gStage').value=editG.development_stage;$('gFollow').value=editG.next_follow_up||'';$('gUrl').value=editG.bga_url||'';$('gAction').value=editG.next_action||'';$('gNotes').value=editG.notes||'';$('gPremium').checked=editG.premium===true;$('gApproved').checked=editG.approval_received;$('gAssets').checked=editG.assets_received;$('deleteGame').classList.remove('hidden');gameDialog.showModal()};$('bggSearchBtn').onclick=async()=>{let q=$('bggSearch').value.trim();if(!q)return;let xml=await fetch('/api/bgg-helper.js?action=search&query='+encodeURIComponent(q)+'&v=3').then(r=>r.text()),d=new DOMParser().parseFromString(xml,'text/xml'),it=[...d.querySelectorAll('item')].slice(0,20);$('bggResults').innerHTML=it.map(i=>`<div data-id="${i.getAttribute('id')}"><b>${esc(i.querySelector('name')?.getAttribute('value'))}</b> <span class="meta">${i.querySelector('yearpublished')?.getAttribute('value')||''} · #${i.getAttribute('id')}</span></div>`).join('');[...$('bggResults').children].forEach(x=>x.onclick=()=>pick(x.dataset.id))};async function pick(id){let xml=await fetch('/api/bgg-helper.js?action=thing&id='+id+'&v=3').then(r=>r.text()),d=new DOMParser().parseFromString(xml,'text/xml'),i=d.querySelector('item');selectedBGG={bgg_id:+id,name:i.querySelector('name[type="primary"]')?.getAttribute('value')||'',thumbnail_url:i.querySelector('thumbnail')?.textContent||null,image_url:i.querySelector('image')?.textContent||null};$('gName').value=selectedBGG.name;$('gBgg').value=id;$('bggResults').innerHTML='<div>✓ '+esc(selectedBGG.name)+'</div>'}async function ge(){let id=$('gBgg').value?+$('gBgg').value:null,n=$('gName').value.trim(),e=id?entities.find(x=>x.entity_type==='game'&&+x.bgg_id===id):entities.find(x=>x.entity_type==='game'&&x.name.toLowerCase()===n.toLowerCase());if(e)return e;return (await api('CREATE','bga_entities',{data:{bgg_id:id,entity_type:'game',name:n,status:'prospect',thumbnail_url:selectedBGG?.thumbnail_url||null,image_url:selectedBGG?.image_url||null,metadata:{source:'tracker'}}}))[0]}$('saveGame').onclick=async()=>{if(!$('gName').value.trim())return alert('Game required');let e=await ge(),d={game_entity_id:e.id,outreach_status:$('gOut').value,development_stage:$('gStage').value,premium:$('gPremium').checked,active:true,compensation_status:'tbd',assets_received:$('gAssets').checked,physical_copy_status:'none',approval_received:$('gApproved').checked,bga_url:$('gUrl').value||null,next_action:$('gAction').value||null,next_follow_up:$('gFollow').value||null,notes:$('gNotes').value||null,updated_at:new Date().toISOString()};await api(editG?'UPDATE':'CREATE','bga_projects',editG?{id:editG.id,data:d}:{data:d});await api('UPDATE','bga_entities',{id:e.id,data:{status:d.outreach_status==='not_contacted'?'prospect':d.outreach_status,updated_at:new Date().toISOString()}});gameDialog.close();loadAll()};$('deleteGame').onclick=async()=>{if(editG&&confirm('Delete this BGA project?')){await api('DELETE','bga_projects',{id:editG.id});gameDialog.close();loadAll()}};</script></body></html>
