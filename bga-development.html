<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1120"><title>BGA Development Tracker</title>
<style>:root{--bg:#0b1120;--p:#111827;--p2:#182235;--line:#26334a;--text:#f1f5f9;--muted:#94a3b8;--a:#818cf8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.hidden{display:none!important}.shell{max-width:1100px;margin:auto;padding:12px 12px 80px}header{position:sticky;top:0;z-index:5;background:#0b1120ee;padding:8px 0}.top,.toolbar,.tabs,.actions,.checks{display:flex;gap:8px;align-items:center}.top h1{font-size:18px;margin:0;flex:1}.btn{border:1px solid var(--line);background:var(--p2);color:var(--text);border-radius:11px;padding:10px 12px;font-weight:700}.primary{background:var(--a);color:#0b1120}.danger{color:#fecdd3}.search,input,select,textarea{background:var(--p2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px}.search{flex:1;min-width:0}.tabs{overflow:auto;margin-top:8px}.tab{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:8px 12px}.tab.active{background:#312e81;color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.stat,.card,.contact,.lane{background:var(--p);border:1px solid var(--line);border-radius:14px}.stat{padding:10px}.stat b{display:block;font-size:18px}.stat span,.meta{font-size:11px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card{padding:11px;display:grid;grid-template-columns:58px 1fr;gap:10px}.thumb{width:58px;height:58px;border-radius:10px;object-fit:cover;background:var(--p2)}.name{font-weight:800}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.chip{font-size:9px;text-transform:uppercase;padding:4px 7px;border-radius:99px;background:#1e293b}.pipeline{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:8px;overflow:auto}.lane{padding:8px}.lane h3{font-size:11px;color:var(--muted)}.lane .card{margin-bottom:7px;grid-template-columns:42px 1fr}.lane .thumb{width:42px;height:42px}.contact{padding:10px;margin-bottom:8px}.empty{text-align:center;color:var(--muted);padding:45px}.login{max-width:380px;margin:20vh auto;padding:20px;background:var(--p);border:1px solid var(--line);border-radius:18px}.login input{width:100%;margin:8px 0}dialog{border:0;background:transparent;color:var(--text);width:min(680px,calc(100% - 16px))}dialog::backdrop{background:#000b}.modal{background:var(--p);border:1px solid var(--line);border-radius:18px;overflow:hidden}.modal h2{font-size:16px;margin:0}.head,.body,.actions{padding:13px}.head{display:flex;border-bottom:1px solid var(--line)}.head h2{flex:1}.body{max-height:72vh;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:flex;flex-direction:column;gap:4px}.field.full{grid-column:1/-1}.field label{font-size:10px;color:var(--muted);text-transform:uppercase}.field input,.field select,.field textarea{width:100%}.actions{justify-content:flex-end;border-top:1px solid var(--line)}.bgg{margin-top:7px}.bgg div{padding:8px;border:1px solid var(--line);border-radius:9px;margin:5px 0}@media(max-width:700px){.cards{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}</style></head><body>
<div id="login" class="login"><h2>BGA Development</h2><div class="meta">Use the same Board Game Lab password.</div><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button id="loginBtn" class="btn primary">Unlock</button><div id="loginMsg" class="meta" style="margin-top:8px"></div></div>
<div id="app" class="shell hidden"><header><div class="top"><h1>🎲 BGA Development</h1><button id="logout" class="btn">Lock</button><button id="add" class="btn primary">＋ Add</button></div><div class="toolbar" style="margin-top:8px"><input id="search" class="search" placeholder="Search games, contacts, notes…"><button id="refresh" class="btn">↻</button></div><div class="tabs"><button class="tab active" data-v="games">Games</button><button class="tab" data-v="pipeline">Pipeline</button><button class="tab" data-v="contacts">Contacts</button><button class="tab" data-v="followups">Follow-ups</button></div></header><div id="stats" class="stats"></div><main id="content"></main></div>
<dialog id="dlg"><div class="modal"><div class="head"><h2 id="dlgTitle">Add Project</h2><button class="btn" onclick="dlg.close()">✕</button></div><div class="body"><div class="field"><label>BGG search</label><div class="toolbar"><input id="bggSearch" class="search" placeholder="Game title"><button id="bggBtn" class="btn">Search</button></div><div id="bggResults" class="bgg"></div></div><div class="grid" style="margin-top:10px"><div class="field"><label>Game</label><input id="name"></div><div class="field"><label>BGG ID</label><input id="bggid"></div><div class="field"><label>Outreach</label><select id="outreach"><option value="not_contacted">Not contacted</option><option value="contacted">Contacted</option><option value="interested">Interested</option><option value="approved">Approved</option><option value="declined">Declined</option><option value="on_hold">On hold</option></select></div><div class="field"><label>Development</label><select id="stage"><option value="prospect">Prospect</option><option value="development">Development</option><option value="alpha">Alpha</option><option value="beta">Beta</option><option value="production">Production</option></select></div><div class="field"><label>Compensation</label><select id="comp"><option value="tbd">TBD</option><option value="free">Free</option><option value="paid">Paid</option></select></div><div class="field"><label>Amount</label><input id="amount" type="number"></div><div class="field"><label>Follow-up</label><input id="follow" type="date"></div><div class="field"><label>BGA URL</label><input id="bgaurl"></div><div class="field full"><label>Next action</label><input id="action"></div><div class="field full"><label>Notes</label><textarea id="notes"></textarea></div><div class="field full checks"><label><input id="premium" type="checkbox"> Premium</label><label><input id="approved" type="checkbox"> Approved</label><label><input id="assets" type="checkbox"> Assets</label><label><input id="active" type="checkbox" checked> Active</label></div></div></div><div class="actions"><button id="del" class="btn danger hidden">Delete</button><button class="btn" onclick="dlg.close()">Cancel</button><button id="save" class="btn primary">Save</button></div></div></dialog>
<script>
const $=x=>document.getElementById(x), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])), pretty=s=>String(s||'').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());let password=sessionStorage.getItem('bgaPassword')||'',projects=[],entities=[],links=[],interactions=[],view='games',editing=null,selected=null;
async function api(action,table,data={},extra={}){const r=await fetch('/api/bga-tracker',{method:'POST',headers:{'Content-Type':'application/json','X-App-Password':password},body:JSON.stringify({action,table,data,...extra})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(typeof j.error==='string'?j.error:JSON.stringify(j.error));return j.rows||[]}
async function unlock(){password=$('pw').value||password;try{await api('AUTH','bga_entities');sessionStorage.setItem('bgaPassword',password);$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(e){$('loginMsg').textContent=e.message}}
$('loginBtn').onclick=unlock;$('pw').onkeydown=e=>{if(e.key==='Enter')unlock()};$('logout').onclick=()=>{sessionStorage.removeItem('bgaPassword');password='';location.reload()};
async function load(){try{[entities,projects,links,interactions]=await Promise.all([api('LIST','bga_entities',{}, {order:'name.asc'}),api('LIST','bga_projects',{}, {order:'updated_at.desc'}),api('LIST','bga_project_entities'),api('LIST','bga_interactions',{}, {order:'interaction_date.desc'})]);render()}catch(e){$('content').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
const game=p=>entities.find(e=>e.id===p.game_entity_id)||{name:'Unknown'}, match=(p,q)=>[game(p).name,p.notes,p.next_action,p.outreach_status,p.development_stage].join(' ').toLowerCase().includes(q);
function card(p){const g=game(p),img=g.thumbnail_url||g.image_url;return `<article class="card" onclick="edit(${p.id})">${img?`<img class="thumb" src="${esc(img)}">`:'<div class="thumb" style="display:grid;place-items:center">🎲</div>'}<div><div class="name">${esc(g.name)}</div><div class="meta">${g.bgg_id?'BGG '+g.bgg_id+' · ':''}${esc(p.next_action||'No next action')}</div><div class="chips"><span class="chip">${pretty(p.outreach_status)}</span><span class="chip">${pretty(p.development_stage)}</span>${p.premium?'<span class="chip">Premium</span>':''}</div></div></article>`}
function render(){const q=$('search').value.toLowerCase();document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.v===view));const a=projects.filter(p=>p.active),today=new Date().toISOString().slice(0,10);$('stats').innerHTML=`<div class="stat"><b>${a.length}</b><span>Active</span></div><div class="stat"><b>${a.filter(p=>p.development_stage==='beta').length}</b><span>Beta</span></div><div class="stat"><b>${a.filter(p=>p.development_stage==='production').length}</b><span>Production</span></div><div class="stat"><b>${a.filter(p=>p.next_follow_up&&p.next_follow_up<=today).length}</b><span>Follow-ups</span></div>`;if(view==='games')$('content').innerHTML=projects.filter(p=>match(p,q)).length?`<div class="cards">${projects.filter(p=>match(p,q)).map(card).join('')}</div>`:'<div class="empty">No projects yet.</div>';else if(view==='pipeline')$('content').innerHTML=`<div class="pipeline">${['prospect','development','alpha','beta','production'].map(s=>`<section class="lane"><h3>${pretty(s)} · ${projects.filter(p=>p.development_stage===s).length}</h3>${projects.filter(p=>p.development_stage===s&&match(p,q)).map(card).join('')}</section>`).join('')}</div>`;else if(view==='contacts'){const c=entities.filter(e=>e.entity_type!=='game'&&[e.name,e.entity_type,e.bgg_username,e.notes].join(' ').toLowerCase().includes(q));$('content').innerHTML=c.length?c.map(e=>`<div class="contact"><div class="name">${esc(e.name)}</div><div class="meta">${pretty(e.entity_type)}${e.bgg_id?' · BGG '+e.bgg_id:''}${e.bgg_username?' · @'+esc(e.bgg_username):''}</div></div>`).join(''):'<div class="empty">No contacts yet.</div>'}else{const f=projects.filter(p=>p.next_follow_up&&match(p,q)).sort((a,b)=>a.next_follow_up.localeCompare(b.next_follow_up));$('content').innerHTML=f.length?`<div class="cards">${f.map(card).join('')}</div>`:'<div class="empty">No follow-ups.</div>'}}
$('search').oninput=render;$('refresh').onclick=load;document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{view=t.dataset.v;render()});
function reset(){editing=null;selected=null;['name','bggid','amount','follow','bgaurl','action','notes','bggSearch'].forEach(x=>$(x).value='');$('outreach').value='not_contacted';$('stage').value='prospect';$('comp').value='tbd';$('premium').checked=$('approved').checked=$('assets').checked=false;$('active').checked=true;$('bggResults').innerHTML='';$('del').classList.add('hidden')}$('add').onclick=()=>{reset();$('dlgTitle').textContent='Add Project';dlg.showModal()};
window.edit=id=>{const p=projects.find(x=>x.id===id),g=game(p);editing=p;selected=g;$('dlgTitle').textContent='Edit '+g.name;$('name').value=g.name||'';$('bggid').value=g.bgg_id||'';$('outreach').value=p.outreach_status;$('stage').value=p.development_stage;$('comp').value=p.compensation_status;$('amount').value=p.compensation_amount??'';$('follow').value=p.next_follow_up||'';$('bgaurl').value=p.bga_url||'';$('action').value=p.next_action||'';$('notes').value=p.notes||'';$('premium').checked=p.premium===true;$('approved').checked=p.approval_received;$('assets').checked=p.assets_received;$('active').checked=p.active;$('del').classList.remove('hidden');dlg.showModal()};
async function bgg(endpoint,params){const u=new URL('/api/bgg-helper',location.origin);u.searchParams.set('endpoint',endpoint);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));const r=await fetch(u);if(!r.ok)throw Error('BGG request failed');return r.text()}
$('bggBtn').onclick=async()=>{const q=$('bggSearch').value.trim();if(!q)return;$('bggResults').innerHTML='Searching…';try{const d=new DOMParser().parseFromString(await bgg('search',{query:q,type:'boardgame'}),'text/xml'),it=[...d.querySelectorAll('item')].slice(0,10);$('bggResults').innerHTML=it.map((n,i)=>`<div data-i="${i}"><b>${esc(n.querySelector('name')?.getAttribute('value'))}</b><div class="meta">BGG ${n.id||n.getAttribute('id')}</div></div>`).join('');[...$('bggResults').children].forEach((el,i)=>el.onclick=()=>pick(it[i]))}catch(e){$('bggResults').textContent=e.message}};
async function pick(n){const id=n.getAttribute('id');$('bggid').value=id;$('name').value=n.querySelector('name')?.getAttribute('value')||'';try{const d=new DOMParser().parseFromString(await bgg('thing',{id}),'text/xml'),i=d.querySelector('item');selected={bgg_id:+id,name:i.querySelector('name[type="primary"]')?.getAttribute('value')||$('name').value,thumbnail_url:i.querySelector('thumbnail')?.textContent||'',image_url:i.querySelector('image')?.textContent||'',links:[...i.querySelectorAll('link')].filter(x=>['boardgamepublisher','boardgamedesigner','boardgameartist'].includes(x.getAttribute('type'))).map(x=>({bgg_id:+x.getAttribute('id'),name:x.getAttribute('value'),type:x.getAttribute('type').replace('boardgame','')}))};$('name').value=selected.name;$('bggResults').innerHTML=`<div>✓ Loaded image + ${selected.links.length} linked entities</div>`}catch{$('bggResults').innerHTML='<div>Game selected; enrichment failed.</div>'}}
$('save').onclick=async()=>{try{const name=$('name').value.trim();if(!name)return alert('Game name required');let ge=editing?game(editing):null,edata={name,bgg_id:$('bggid').value?+$('bggid').value:null,entity_type:'game',thumbnail_url:selected?.thumbnail_url||ge?.thumbnail_url||null,image_url:selected?.image_url||ge?.image_url||null,updated_at:new Date().toISOString()};const er=editing?await api('UPDATE','bga_entities',edata,{id:ge.id}):await api('CREATE','bga_entities',edata);ge=er[0];const pdata={game_entity_id:ge.id,outreach_status:$('outreach').value,development_stage:$('stage').value,premium:$('premium').checked,active:$('active').checked,compensation_status:$('comp').value,compensation_amount:$('amount').value?+$('amount').value:null,assets_received:$('assets').checked,approval_received:$('approved').checked,bga_url:$('bgaurl').value||null,next_action:$('action').value||null,next_follow_up:$('follow').value||null,notes:$('notes').value||null,updated_at:new Date().toISOString()};const pr=(editing?await api('UPDATE','bga_projects',pdata,{id:editing.id}):await api('CREATE','bga_projects',pdata))[0];if(selected?.links)for(const x of selected.links){let found=entities.find(e=>e.bgg_id===x.bgg_id&&e.entity_type===x.type);if(!found)found=(await api('CREATE','bga_entities',{bgg_id:x.bgg_id,entity_type:x.type,name:x.name}))[0];await api('UPSERT','bga_project_entities',{project_id:pr.id,entity_id:found.id,relationship_type:x.type})}dlg.close();await load()}catch(e){alert(e.message)}};
$('del').onclick=async()=>{if(!editing||!confirm('Delete this project?'))return;try{await api('DELETE','bga_entities',{}, {id:game(editing).id});dlg.close();load()}catch(e){alert(e.message)}};
if(password)unlock();
</script></body></html>
