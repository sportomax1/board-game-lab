<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BGA Development Tracker</title><style>:root{--b:#07111f;--p:#0d1929;--p2:#132238;--l:#263951;--t:#f4f7fb;--m:#91a0b5;--a:#8067f2}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.hidden{display:none!important}button,input,select,textarea{font:inherit}.shell{max-width:1200px;margin:auto;padding:10px 10px 80px}.login{max-width:380px;margin:20vh auto;padding:22px;background:var(--p);border:1px solid var(--l);border-radius:18px}.btn,input,select,textarea{background:var(--p2);border:1px solid var(--l);color:var(--t);border-radius:10px;padding:10px}.btn{font-weight:750;cursor:pointer}.primary{background:var(--a)}.danger{color:#ff9aaa}.top,.toolbar,.tabs,.actions,.chips{display:flex;gap:7px;align-items:center}.top h1{font-size:18px;margin:0;flex:1}header{position:sticky;top:0;z-index:5;background:#07111ff2;padding:7px 0}.toolbar,.tabs{margin-top:7px}.tabs{overflow:auto}.tab{white-space:nowrap}.tab.active{background:#30275d}.search{flex:1;min-width:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.stat,.card,.entity,.lane,.xcard{background:var(--p);border:1px solid var(--l);border-radius:13px}.stat{padding:9px}.stat b{font-size:18px;display:block}.meta{font-size:11px;color:var(--m)}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.card{padding:10px;display:grid;grid-template-columns:58px 1fr;gap:9px;cursor:pointer}.thumb{width:58px;height:58px;object-fit:cover;border-radius:9px;background:var(--p2)}.name{font-weight:800}.chips{flex-wrap:wrap;margin-top:6px}.chip{font-size:9px;text-transform:uppercase;background:#1c2d43;padding:4px 7px;border-radius:99px}.pipeline{display:grid;grid-template-columns:repeat(5,minmax(205px,1fr));gap:7px;overflow:auto}.lane{padding:7px}.lane h3{font-size:11px;color:var(--m)}.entity{padding:10px;margin-bottom:7px;display:grid;grid-template-columns:48px 1fr auto;gap:9px;align-items:center;cursor:pointer}.avatar{width:48px;height:48px;border-radius:9px;object-fit:cover;background:var(--p2);display:grid;place-items:center;font-size:22px}.empty{text-align:center;color:var(--m);padding:40px}.xhead{display:flex;gap:8px;margin-bottom:10px}.xgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.xcard{padding:8px;display:grid;grid-template-columns:48px 1fr;gap:8px}.xcard img{width:48px;height:64px;object-fit:cover;border-radius:6px}.tiny{padding:6px 8px;font-size:10px}.owned{color:#65e5a0}dialog{border:0;background:transparent;color:var(--t);width:min(700px,calc(100% - 12px))}dialog::backdrop{background:#000c}.modal{background:var(--p);border:1px solid var(--l);border-radius:17px;overflow:hidden}.head,.body,.actions{padding:12px}.head{display:flex;border-bottom:1px solid var(--l)}.head h2{margin:0;font-size:16px;flex:1}.body{max-height:76vh;overflow:auto}.actions{justify-content:flex-end;border-top:1px solid var(--l)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:flex;flex-direction:column;gap:4px}.full{grid-column:1/-1}.field label{font-size:10px;color:var(--m);text-transform:uppercase}.field input,.field select,.field textarea{width:100%}.field textarea{min-height:70px}.bgg div{padding:8px;border:1px solid var(--l);border-radius:8px;margin-top:5px;cursor:pointer}@media(max-width:700px){.cards,.xgrid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.full{grid-column:auto}.top .btn{padding:8px;font-size:11px}}</style></head><body><div id="passwordScreen" class="login"><h2>🎲 BGA Development</h2><div class="meta">Same Board Game Lab access key.</div><input id="appPassword" type="password" placeholder="Access Key" style="width:100%;margin:12px 0"><button id="unlockBtn" class="btn primary">Unlock</button><div id="passwordError" class="meta" style="color:#ff8f9d;margin-top:8px"></div></div><div id="app" class="shell hidden"><header><div class="top"><h1>🎲 BGA Development</h1><button id="addEntity" class="btn">+ Entity</button><button id="addGame" class="btn primary">+ Game</button></div><div class="toolbar"><input id="search" class="search" placeholder="Search…"><button id="refresh" class="btn">↻</button></div><div class="tabs"><button class="btn tab active" data-view="games">Games</button><button class="btn tab" data-view="pipeline">Pipeline</button><button class="btn tab" data-view="entities">People & Publishers</button><button class="btn tab" data-view="explore">Explore Catalog</button><button class="btn tab" data-view="followups">Follow-ups</button></div></header><div id="stats" class="stats"></div><main id="content"></main></div><dialog id="entityDialog"><div class="modal"><div class="head"><h2>Entity</h2><button class="btn" onclick="entityDialog.close()">✕</button></div><div class="body grid"><div class="field"><label>Type</label><select id="eType"><option>publisher</option><option>designer</option><option>artist</option><option>user</option><option>other</option></select></div><div class="field"><label>Status</label><select id="eStatus"><option>prospect</option><option>contacted</option><option>interested</option><option>approved</option><option>declined</option><option>on_hold</option><option>active</option><option>inactive</option></select></div><div class="field full"><label>Name</label><input id="eName"></div><div class="field"><label>BGG ID</label><input id="eBgg"></div><div class="field"><label>BGG username</label><input id="eUser"></div><div class="field full"><label>Image URL</label><input id="eImage"></div><div class="field full"><label>Notes</label><textarea id="eNotes"></textarea></div></div><div class="actions"><button id="deleteEntity" class="btn danger hidden">Delete</button><button id="saveEntity" class="btn primary">Save</button></div></div></dialog><dialog id="gameDialog"><div class="modal"><div class="head"><h2>BGA Game</h2><button class="btn" onclick="gameDialog.close()">✕</button></div><div class="body"><div class="field full"><label>BGG Search</label><div style="display:flex;gap:6px"><input id="bggSearch" style="flex:1" placeholder="Game title"><button id="bggSearchBtn" class="btn">Search</button></div><div id="bggResults" class="bgg"></div></div><div class="grid" style="margin-top:9px"><div class="field"><label>Game</label><input id="gName"></div><div class="field"><label>BGG ID</label><input id="gBgg"></div><div class="field"><label>Outreach</label><select id="gOut"><option value="not_contacted">Not contacted</option><option>contacted</option><option>interested</option><option>approved</option><option>declined</option><option value="on_hold">On hold</option></select></div><div class="field"><label>Development</label><select id="gStage"><option>prospect</option><option>development</option><option>alpha</option><option>beta</option><option>production</option></select></div><div class="field"><label>Follow-up</label><input id="gFollow" type="date"></div><div class="field"><label>BGA URL</label><input id="gUrl"></div><div class="field full"><label>Next action</label><input id="gAction"></div><div class="field full"><label>Notes</label><textarea id="gNotes"></textarea></div><div class="field full"><label><input id="gPremium" type="checkbox"> Premium</label> <label><input id="gApproved" type="checkbox"> Approved</label> <label><input id="gAssets" type="checkbox"> Assets</label></div></div></div><div class="actions"><button id="deleteGame" class="btn danger hidden">Delete</button><button id="saveGame" class="btn primary">Save</button></div></div></dialog><script>const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),pretty=s=>String(s||'').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());let entities=[],projects=[],view='games',editE=null,editG=null,selectedBGG=null,xe=null,xgames=[];async function api(action,table,opt={}){let r=await fetch('/api/supabase',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,table,...opt})}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'API error');return j.rows||[]}window.addEventListener('DOMContentLoaded',()=>{let s=localStorage.getItem('app_password_hint');if(s)$('appPassword').value=s});$('unlockBtn').onclick=async()=>{let p=$('appPassword').value,b=$('unlockBtn');b.disabled=true;let c=await fetch('/api/get-password').then(r=>r.text()).catch(()=>null);if(p!==c){$('passwordError').textContent='Invalid key';b.disabled=false;return}localStorage.setItem('app_password_hint',p);$('passwordScreen').classList.add('hidden');$('app').classList.remove('hidden');b.disabled=false;loadAll()};async function loadAll(){try{[entities,projects]=await Promise.all([api('READ','bga_entities',{limit:2000}),api('READ','bga_projects',{limit:2000})]);render()}catch(e){$('content').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}const gf=p=>entities.find(e=>e.id===p.game_entity_id)||{name:'Unknown'};function render(){let a=projects.filter(p=>p.active!==false);$('stats').innerHTML=`<div class="stat"><b>${a.length}</b><span class="meta">Active games</span></div><div class="stat"><b>${a.filter(p=>p.development_stage==='alpha').length}</b><span class="meta">Alpha</span></div><div class="stat"><b>${a.filter(p=>p.development_stage==='beta').length}</b><span class="meta">Beta</span></div><div class="stat"><b>${entities.filter(e=>e.entity_type!=='game').length}</b><span class="meta">People / publishers</span></div>`;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===view));let q=$('search').value.toLowerCase();if(view==='games'){let x=projects.filter(p=>[gf(p).name,p.notes,p.next_action,p.outreach_status,p.development_stage].join(' ').toLowerCase().includes(q));$('content').innerHTML=x.length?`<div class="cards">${x.map(card).join('')}</div>`:'<div class="empty">No BGA projects yet. Prospects can still exist as tracked game entities.</div>'}else if(view==='pipeline'){let ss=['prospect','development','alpha','beta','production'];$('content').innerHTML=`<div class="pipeline">${ss.map(s=>`<section class="lane"><h3>${pretty(s)} · ${projects.filter(p=>p.development_stage===s).length}</h3>${projects.filter(p=>p.development_stage===s).map(card).join('')}</section>`).join('')}</div>`}else if(view==='entities'){let x=entities.filter(e=>e.entity_type!=='game'&&[e.name,e.entity_type,e.status,e.notes].join(' ').toLowerCase().includes(q));$('content').innerHTML=x.length?x.map(erow).join(''):'<div class="empty">No people/publishers.</div>'}else if(view==='explore')rx();else{let x=projects.filter(p=>p.next_follow_up).sort((a,b)=>a.next_follow_up.localeCompare(b.next_follow_up));$('content').innerHTML=x.length?`<div class="cards">${x.map(card).join('')}</div>`:'<div class="empty">No follow-ups.</div>'}}function card(p){let g=gf(p),im=g.thumbnail_url||g.image_url;return `<article class="card" onclick="openGame(${p.id})">${im?`<img class="thumb" src="${esc(im)}">`:'<div class="thumb" style="display:grid;place-items:center">🎲</div>'}<div><div class="name">${esc(g.name)}</div><div class="meta">${g.bgg_id?'BGG '+g.bgg_id+' · ':''}${esc(p.next_action||'')}</div><div class="chips"><span class="chip">${pretty(p.outreach_status)}</span><span class="chip">${pretty(p.development_stage)}</span>${p.premium?'<span class="chip">Premium</span>':''}</div></div></article>`}function erow(e){let im=e.thumbnail_url||e.image_url;return `<div class="entity" onclick="openEntity(${e.id})">${im?`<img class="avatar" src="${esc(im)}">`:`<div class="avatar">${e.entity_type==='publisher'?'🏢':'👤'}</div>`}<div><div class="name">${esc(e.name)}</div><div class="meta">${pretty(e.entity_type)}${e.bgg_id?' · BGG '+e.bgg_id:''}</div><div class="chips"><span class="chip">${pretty(e.status||'prospect')}</span></div></div><button class="btn tiny" onclick="event.stopPropagation();explore(${e.id})">Explore</button></div>`}async function explore(id){xe=entities.find(e=>e.id===id);view='explore';$('content').innerHTML='<div class="empty">Loading cached BGG catalog…</div>';xgames=await api('SEARCH','bgg_collection',{query:{xml:xe.name},limit:250});rx()}function rx(){if(!xe){$('content').innerHTML='<div class="empty">Choose Explore beside a publisher, designer or artist. This searches your cached BGG collection metadata and shows covers, ownership and play data.</div>';return}$('content').innerHTML=`<div class="xhead"><button class="btn" onclick="view='entities';render()">←</button><div><div class="name">${esc(xe.name)}</div><div class="meta">${pretty(xe.entity_type)} · ${xgames.length} collection matches</div></div></div><div class="xgrid">${xgames.map(g=>{let t=entities.find(e=>e.entity_type==='game'&&+e.bgg_id===+g.bgg_id);return `<div class="xcard">${g.thumb?`<img src="${esc(g.thumb)}">`:'<div class="avatar">🎲</div>'}<div><div class="name">${esc(g.name)}</div><div class="meta">${g.year||''}${g.bgg_rating?' · '+(+g.bgg_rating).toFixed(1):''}${g.avgweight?' · wt '+(+g.avgweight).toFixed(1):''}</div><div class="meta ${g.own?'owned':''}">${g.own?'✓ Owned · ':''}${g.numplays||0} plays</div>${t?`<div class="chips"><span class="chip">${pretty(t.status)}</span></div>`:`<button class="btn tiny" onclick="prospect(${g.bgg_id},${JSON.stringify(g.name)},${JSON.stringify(g.thumb||'')})">+ Prospect</button>`}</div></div>`}).join('')}</div>`}window.prospect=async(id,n,th)=>{await api('CREATE','bga_entities',{data:{bgg_id:+id,entity_type:'game',name:n,status:'prospect',thumbnail_url:th||null,metadata:{source:'collection_explorer'}}});await loadAll();explore(xe.id)};$('search').oninput=render;$('refresh').onclick=loadAll;document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{view=t.dataset.view;render()});$('addEntity').onclick=()=>{editE=null;['eName','eBgg','eUser','eImage','eNotes'].forEach(x=>$(x).value='');$('eType').value='publisher';$('eStatus').value='prospect';$('deleteEntity').classList.add('hidden');entityDialog.showModal()};window.openEntity=id=>{editE=entities.find(e=>e.id===id);$('eType').value=editE.entity_type;$('eStatus').value=editE.status||'prospect';$('eName').value=editE.name;$('eBgg').value=editE.bgg_id||'';$('eUser').value=editE.bgg_username||'';$('eImage').value=editE.image_url||editE.thumbnail_url||'';$('eNotes').value=editE.notes||'';$('deleteEntity').classList.remove('hidden');entityDialog.showModal()};$('saveEntity').onclick=async()=>{let d={entity_type:$('eType').value,status:$('eStatus').value,name:$('eName').value.trim(),bgg_id:$('eBgg').value?+$('eBgg').value:null,bgg_username:$('eUser').value||null,image_url:$('eImage').value||null,notes:$('eNotes').value||null,updated_at:new Date().toISOString()};if(!d.name)return alert('Name required');await api(editE?'UPDATE':'CREATE','bga_entities',editE?{id:editE.id,data:d}:{data:d});entityDialog.close();loadAll()};$('deleteEntity').onclick=async()=>{if(editE&&confirm('Delete?')){await api('DELETE','bga_entities',{id:editE.id});entityDialog.close();loadAll()}};$('addGame').onclick=()=>{editG=null;selectedBGG=null;['gName','gBgg','gFollow','gUrl','gAction','gNotes','bggSearch'].forEach(x=>$(x).value='');$('gOut').value='not_contacted';$('gStage').value='prospect';$('gPremium').checked=$('gApproved').checked=$('gAssets').checked=false;$('bggResults').innerHTML='';$('deleteGame').classList.add('hidden');gameDialog.showModal()};window.openGame=id=>{editG=projects.find(p=>p.id===id);let g=gf(editG);$('gName').value=g.name;$('gBgg').value=g.bgg_id||'';$('gOut').value=editG.outreach_status;$('gStage').value=editG.development_stage;$('gFollow').value=editG.next_follow_up||'';$('gUrl').value=editG.bga_url||'';$('gAction').value=editG.next_action||'';$('gNotes').value=editG.notes||'';$('gPremium').checked=editG.premium===true;$('gApproved').checked=editG.approval_received;$('gAssets').checked=editG.assets_received;$('deleteGame').classList.remove('hidden');gameDialog.showModal()};$('bggSearchBtn').onclick=async()=>{let q=$('bggSearch').value.trim(),xml=await fetch('/api/bgg-helper.js?action=search&query='+encodeURIComponent(q)).then(r=>r.text()),d=new DOMParser().parseFromString(xml,'text/xml'),it=[...d.querySelectorAll('item')].slice(0,20);$('bggResults').innerHTML=it.map(i=>`<div data-id="${i.getAttribute('id')}"><b>${esc(i.querySelector('name')?.getAttribute('value'))}</b> <span class="meta">${i.querySelector('yearpublished')?.getAttribute('value')||''} · #${i.getAttribute('id')}</span></div>`).join('');[...$('bggResults').children].forEach(x=>x.onclick=()=>pick(x.dataset.id))};async function pick(id){let xml=await fetch('/api/bgg-helper.js?action=thing&id='+id).then(r=>r.text()),d=new DOMParser().parseFromString(xml,'text/xml'),i=d.querySelector('item');selectedBGG={bgg_id:+id,name:i.querySelector('name[type="primary"]')?.getAttribute('value')||'',thumbnail_url:i.querySelector('thumbnail')?.textContent||null,image_url:i.querySelector('image')?.textContent||null};$('gName').value=selectedBGG.name;$('gBgg').value=id;$('bggResults').innerHTML='<div>✓ '+esc(selectedBGG.name)+'</div>'}async function ge(){let id=$('gBgg').value?+$('gBgg').value:null,n=$('gName').value.trim(),e=id?entities.find(x=>x.entity_type==='game'&&+x.bgg_id===id):entities.find(x=>x.entity_type==='game'&&x.name.toLowerCase()===n.toLowerCase());if(e)return e;return (await api('CREATE','bga_entities',{data:{bgg_id:id,entity_type:'game',name:n,status:'prospect',thumbnail_url:selectedBGG?.thumbnail_url||null,image_url:selectedBGG?.image_url||null,metadata:{source:'tracker'}}}))[0]}$('saveGame').onclick=async()=>{if(!$('gName').value.trim())return alert('Game required');let e=await ge(),d={game_entity_id:e.id,outreach_status:$('gOut').value,development_stage:$('gStage').value,premium:$('gPremium').checked,active:true,compensation_status:'tbd',assets_received:$('gAssets').checked,physical_copy_status:'none',approval_received:$('gApproved').checked,bga_url:$('gUrl').value||null,next_action:$('gAction').value||null,next_follow_up:$('gFollow').value||null,notes:$('gNotes').value||null,updated_at:new Date().toISOString()};await api(editG?'UPDATE':'CREATE','bga_projects',editG?{id:editG.id,data:d}:{data:d});await api('UPDATE','bga_entities',{id:e.id,data:{status:d.outreach_status==='not_contacted'?'prospect':d.outreach_status,updated_at:new Date().toISOString()}});gameDialog.close();loadAll()};$('deleteGame').onclick=async()=>{if(editG&&confirm('Delete project?')){await api('DELETE','bga_projects',{id:editG.id});gameDialog.close();loadAll()}};</script></body></html>
