<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>VFM Refactored</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>💰</text></svg>">
    <style>
        :root {
            --color-primary: #007aff;
            --color-success: #34c759;
            --color-warning: #ff9500;
            --color-danger: #ff3b30;
            --color-bg: #f5f5f7;
            --color-card: #ffffff;
            --color-text: #1d1d1f;
            --color-text-secondary: #6e6e73;
            --color-border: #d1d1d6;
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 12px;
            --spacing-lg: 16px;
            --spacing-xl: 20px;
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --font-xs: 10px;
            --font-sm: 11px;
            --font-md: 12px;
            --font-lg: 14px;
            --font-xl: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--color-bg);
            padding: var(--spacing-lg);
            padding-bottom: 80px;
            font-size: var(--font-lg);
            color: var(--color-text);
            line-height: 1.5;
        }

        /* Header */
        .app-header {
            background: var(--color-card);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            margin-bottom: var(--spacing-lg);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .app-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: var(--spacing-sm);
        }

        .app-stats {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-xs);
            font-size: var(--font-md);
            color: var(--color-text-secondary);
        }

        /* Controls */
        .controls-panel {
            background: var(--color-card);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }

        .control-section {
            margin-bottom: var(--spacing-md);
        }

        .control-section:last-child {
            margin-bottom: 0;
        }

        .control-label {
            font-size: var(--font-sm);
            font-weight: 600;
            margin-bottom: var(--spacing-xs);
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
        }

        .btn-group {
            display: flex;
            gap: var(--spacing-xs);
            flex-wrap: wrap;
        }

        .btn {
            padding: 6px 12px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            background: var(--color-card);
            color: var(--color-text);
            font-size: var(--font-sm);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--color-bg);
        }

        .btn.active {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
        }

        .btn-sold {
            background: var(--color-success);
            color: white;
            border-color: var(--color-success);
        }

        .btn-available {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
        }

        /* Search */
        .search-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            font-size: var(--font-md);
            margin-top: var(--spacing-xs);
        }

        /* Cards Container */
        .cards-container {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        /* Card Styles */
        .card {
            background: var(--color-card);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .card-header {
            display: flex;
            gap: var(--spacing-md);
            padding: var(--spacing-md);
        }

        .card-thumbnail {
            width: 80px;
            height: 80px;
            object-fit: contain;
            background: var(--color-bg);
            border-radius: var(--radius-sm);
            flex-shrink: 0;
        }

        .card-info {
            flex: 1;
            min-width: 0;
        }

        .card-title {
            font-size: var(--font-lg);
            font-weight: 600;
            margin-bottom: var(--spacing-xs);
            line-height: 1.3;
        }

        .card-meta {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            font-size: var(--font-sm);
            color: var(--color-text-secondary);
            flex-wrap: wrap;
        }

        .card-price {
            font-size: var(--font-xl);
            font-weight: 700;
            color: var(--color-primary);
        }

        .badge {
            padding: 2px 8px;
            border-radius: var(--radius-sm);
            font-size: var(--font-xs);
            font-weight: 600;
        }

        .badge-sold {
            background: #fce8e6;
            color: var(--color-danger);
        }

        .badge-available {
            background: #e8f5e9;
            color: var(--color-success);
        }

        /* Transaction Display */
        .transaction {
            font-size: var(--font-sm);
            color: var(--color-text-secondary);
            margin-top: var(--spacing-xs);
        }

        .transaction .seller {
            cursor: pointer;
            color: var(--color-text);
        }

        .transaction .arrow {
            color: var(--color-success);
            font-weight: 700;
        }

        .transaction .buyer {
            cursor: pointer;
            color: var(--color-success);
            font-weight: 600;
        }

        /* Price Table */
        .price-table {
            width: 100%;
            border-collapse: collapse;
            margin: var(--spacing-md);
            margin-left: 0;
            margin-right: 0;
            font-size: var(--font-sm);
        }

        .price-table th {
            font-size: var(--font-xs);
            font-weight: 600;
            text-align: left;
            padding: var(--spacing-xs);
            color: var(--color-text-secondary);
        }

        .price-table td {
            padding: var(--spacing-xs);
        }

        .price-table tbody tr:nth-child(even) {
            background: var(--color-bg);
        }

        .row-label {
            font-size: var(--font-xs);
            color: var(--color-text-secondary);
        }

        .row-highlight {
            font-weight: 700;
        }

        /* Actions */
        .card-actions {
            padding: var(--spacing-md);
            border-top: 1px solid var(--color-border);
            display: flex;
            gap: var(--spacing-sm);
        }

        .btn-action {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: var(--font-md);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--color-primary);
            color: white;
        }

        .btn-secondary {
            background: var(--color-warning);
            color: white;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            padding: var(--spacing-lg);
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .modal-content {
            background: var(--color-card);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            max-width: 600px;
            width: 100%;
            margin: var(--spacing-xl) auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
        }

        .btn-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--color-text-secondary);
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: var(--spacing-xl);
            color: var(--color-text-secondary);
            font-size: var(--font-md);
        }

        .spinner {
            border: 3px solid var(--color-border);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto var(--spacing-md);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Load More */
        .load-more {
            text-align: center;
            padding: var(--spacing-lg);
        }

        .btn-load-more {
            padding: 12px 24px;
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: var(--font-lg);
            font-weight: 600;
            cursor: pointer;
        }

        /* Utilities */
        .hidden {
            display: none !important;
        }

        .text-center {
            text-align: center;
        }

        .clickable {
            cursor: pointer;
        }

        .clickable:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="app-header">
        <h1 class="app-title">💰 VFM Marketplace</h1>
        <div class="app-stats">
            <div id="loadStatus">Ready to load...</div>
            <div id="itemCount">0 items</div>
            <div id="creationStats"></div>
        </div>
    </div>

    <!-- Controls Panel -->
    <div class="controls-panel">
        <!-- View Toggle -->
        <div class="control-section">
            <div class="control-label">📱 View</div>
            <div class="btn-group">
                <button class="btn active" data-view="detailed" onclick="app.setView('detailed')">Detailed</button>
                <button class="btn" data-view="condensed" onclick="app.setView('condensed')">Condensed</button>
                <button class="btn" onclick="app.showDashboard()">📊 Dashboard</button>
            </div>
        </div>

        <!-- Sold Status Filter -->
        <div class="control-section">
            <div class="control-label">💰 Status</div>
            <div class="btn-group">
                <button class="btn active" data-filter="all" onclick="app.setSoldFilter('all')">All</button>
                <button class="btn" data-filter="sold" onclick="app.setSoldFilter('sold')">Sold</button>
                <button class="btn" data-filter="available" onclick="app.setSoldFilter('available')">Available</button>
            </div>
        </div>

        <!-- Game Search -->
        <div class="control-section">
            <div class="control-label">🎲 Game Search</div>
            <input type="text" class="search-input" id="gameSearch" placeholder="Search by game name...">
            <div class="btn-group" style="margin-top: 4px;">
                <button class="btn active" data-match="contains" onclick="app.setMatchType('contains')">Contains</button>
                <button class="btn" data-match="exact" onclick="app.setMatchType('exact')">Exact</button>
                <button class="btn" data-match="starts" onclick="app.setMatchType('starts')">Starts</button>
            </div>
        </div>

        <!-- User Search -->
        <div class="control-section">
            <div class="control-label">👤 User Search</div>
            <input type="text" class="search-input" id="userSearch" placeholder="Search by username...">
        </div>

        <!-- VFM Files -->
        <div class="control-section">
            <div class="control-label">📁 VFM Files</div>
            <div class="btn-group">
                <button class="btn active" onclick="app.filterVFM('all')">All</button>
                <button class="btn" onclick="app.filterVFM('2025')">2025</button>
                <button class="btn" onclick="app.filterVFM('2024')">2024</button>
                <button class="btn" onclick="app.filterVFM('bgg')">BGG</button>
                <button class="btn" onclick="app.filterVFM('spr')">SPR</button>
                <button class="btn" onclick="app.loadData()">🔄 Reload</button>
            </div>
        </div>

        <!-- Clear Filters -->
        <div class="control-section">
            <button class="btn" style="width: 100%;" onclick="app.clearFilters()">Clear All Filters</button>
        </div>
    </div>

    <!-- Cards Container -->
    <div id="cardsContainer" class="cards-container"></div>

    <!-- Loading Indicator -->
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <div>Loading VFM data...</div>
    </div>

    <!-- Load More Button -->
    <div id="loadMore" class="load-more hidden">
        <button class="btn-load-more" onclick="app.loadMore()">Load More Items</button>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal" onclick="if(event.target === this) app.closeModal()">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle"></h2>
                <button class="btn-close" onclick="app.closeModal()">×</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // VFM Refactored - Modern Class-Based Architecture
        class VFMApp {
            constructor() {
                // State
                this.state = {
                    allItems: [],
                    displayedItems: [],
                    filteredItems: [],
                    activeVFMFiles: new Set(['all']),
                    soldFilter: 'all',
                    gameFilter: '',
                    userFilter: '',
                    matchType: 'contains',
                    viewMode: 'detailed',
                    currentPage: 0,
                    itemsPerPage: 50
                };

                // Caches
                this.cache = {
                    thumbnails: {},
                    users: {},
                    privateData: {},
                    gameStats: {}
                };

                // Constants
                this.VFM_FILES = [
                    // 2025 entries - load first
                    { name: 'vfm25bgg.xml', year: '2025', category: 'bgg' },
                    { name: 'vfm25spr.xml', year: '2025', category: 'spr' },
                    { name: 'vfm25dte.xml', year: '2025', category: 'dte' },
                    { name: 'vfm25dtw.xml', year: '2025', category: 'dtw' },
                    // 2024 entries
                    { name: 'vfm24bgg.xml', year: '2024', category: 'bgg' },
                    { name: 'vfm24spr.xml', year: '2024', category: 'spr' },
                    { name: 'vfm24dte.xml', year: '2024', category: 'dte' },
                    { name: 'vfm24dtw.xml', year: '2024', category: 'dtw' },
                    { name: 'vfm24cascade.xml', year: '2024', category: 'cascade' },
                    { name: 'vfmdenverco.xml', year: '2024', category: 'colorado' },
                    // 2023 entries
                    { name: 'vfm23bgg.xml', year: '2023', category: 'bgg' },
                    { name: 'vfm23spr.xml', year: '2023', category: 'spr' },
                    { name: 'vfm23dte.xml', year: '2023', category: 'dte' },
                    { name: 'vfm23dtw.xml', year: '2023', category: 'dtw' },
                    // 2022 entries
                    { name: 'vfm22spr.xml', year: '2022', category: 'spr' },
                    { name: 'vfm22dte.xml', year: '2022', category: 'dte' },
                    { name: 'vfm22dtw.xml', year: '2022', category: 'dtw' },
                    { name: 'cascade_vfm/vfm_metalist.xml', year: '2022', category: 'cascade' },
                    { name: 'vfmdenverco.xml', year: '2022', category: 'colorado' }
                ];

                // Initialize
                this.init();
            }

            async init() {
                this.bindEvents();
                await this.loadData();
            }

            bindEvents() {
                // Search inputs with debounce
                let gameSearchTimeout, userSearchTimeout;
                
                document.getElementById('gameSearch').addEventListener('input', (e) => {
                    clearTimeout(gameSearchTimeout);
                    gameSearchTimeout = setTimeout(() => {
                        this.state.gameFilter = e.target.value;
                        this.applyFilters();
                    }, 300);
                });

                document.getElementById('userSearch').addEventListener('input', (e) => {
                    clearTimeout(userSearchTimeout);
                    userSearchTimeout = setTimeout(() => {
                        this.state.userFilter = e.target.value;
                        this.applyFilters();
                    }, 300);
                });
            }

            // Data Loading
            async loadData() {
                this.showLoading(true);
                this.state.allItems = [];
                let allLoadedItems = [];
                
                console.log('[VFM] Starting streaming load...');

                // Load files sequentially with streaming display
                for (let i = 0; i < this.VFM_FILES.length; i++) {
                    const fileInfo = this.VFM_FILES[i];
                    const fileName = fileInfo.name;
                    
                    try {
                        const items = await this.loadXMLFile(fileName);
                        
                        if (items.length > 0) {
                            console.log(`[VFM STREAM] 📦 File ${i+1}/${this.VFM_FILES.length}: ${fileName} loaded with ${items.length} items`);
                            
                            // Filter out specific objectid if needed (like original)
                            const filteredItems = items.filter(item => 
                                item.getAttribute('objectid') !== '340938'
                            );
                            allLoadedItems.push(...filteredItems);
                            
                            console.log(`[VFM STREAM] 📊 Total items so far: ${allLoadedItems.length}`);
                            
                            // Sort by date (newest first)
                            this.state.allItems = allLoadedItems.sort((a, b) => {
                                const dateA = new Date(a.getAttribute('postdate'));
                                const dateB = new Date(b.getAttribute('postdate'));
                                return dateB - dateA;
                            });
                            
                            // Recalculate stats with newly loaded items
                            this.calculateGlobalStats();
                            
                            console.log(`[VFM STREAM] 🎨 Displaying items NOW (before loading next file)...`);
                            
                            // Display immediately (streaming mode)
                            this.state.currentPage = 0;
                            this.state.displayedItems = [];
                            this.applyFilters();
                            
                            console.log(`[VFM STREAM] ✅ Display complete. Displayed items. Moving to next file...`);
                        }
                        
                        this.updateStatus(`Loaded ${i+1}/${this.VFM_FILES.length} files - ${allLoadedItems.length} items`);
                    } catch (error) {
                        console.error(`[VFM] ✗ Error loading ${fileName}:`, error.message);
                    }
                }

                // Final sort and stats calculation
                this.state.allItems = allLoadedItems.sort((a, b) => {
                    const dateA = new Date(a.getAttribute('postdate'));
                    const dateB = new Date(b.getAttribute('postdate'));
                    return dateB - dateA;
                });
                
                this.calculateGlobalStats();
                
                // Final display
                this.state.currentPage = 0;
                this.state.displayedItems = [];
                this.applyFilters();
                
                this.showLoading(false);
                this.updateStatus(`✅ All files loaded - ${this.state.allItems.length} total items`);
                
                if (allLoadedItems.length === 0) {
                    document.getElementById('cardsContainer').innerHTML = 
                        '<div style="text-align: center; padding: 40px; color: #ff3b30;">No items found in any geeklist.</div>';
                }
            }

            async loadXMLFile(fileName) {
                // Load local XML file from repo
                const url = `${fileName}?t=${Date.now()}`; // Cache bust
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const xmlText = await response.text();
                
                if (!xmlText || xmlText.trim().length === 0) {
                    throw new Error('Empty response');
                }
                
                const parser = new DOMParser();
                const xml = parser.parseFromString(xmlText, 'text/xml');
                
                const parserError = xml.querySelector('parsererror');
                if (parserError) {
                    throw new Error('XML parse error');
                }
                
                const items = Array.from(xml.querySelectorAll('item'));
                
                return items.map(item => {
                    // Enrich with metadata
                    item.setAttribute('source-file', fileName);
                    item.setAttribute('sold', this.detectSold(item) ? '1' : '0');
                    return item;
                });
            }

            // Sold Detection
            detectSold(item) {
                const body = item.querySelector('body')?.textContent || '';
                const comments = Array.from(item.querySelectorAll('comment'))
                    .map(c => c.textContent).join(' ');
                const text = (body + ' ' + comments).toLowerCase();
                
                if (text.includes('not sold') || text.includes('notsold')) {
                    return false;
                }
                
                return text.includes('sold');
            }

            // Filtering
            applyFilters() {
                let items = [...this.state.allItems];

                // Filter by VFM files
                if (!this.state.activeVFMFiles.has('all')) {
                    items = items.filter(item => 
                        this.state.activeVFMFiles.has(item.getAttribute('source-file'))
                    );
                }

                // Filter by sold status
                if (this.state.soldFilter !== 'all') {
                    const isSold = this.state.soldFilter === 'sold';
                    items = items.filter(item => 
                        (item.getAttribute('sold') === '1') === isSold
                    );
                }

                // Filter by game name
                if (this.state.gameFilter) {
                    items = items.filter(item => {
                        const name = item.getAttribute('objectname').toLowerCase();
                        const search = this.state.gameFilter.toLowerCase();
                        
                        if (this.state.matchType === 'exact') {
                            return name === search;
                        } else if (this.state.matchType === 'starts') {
                            return name.startsWith(search);
                        } else {
                            return name.includes(search);
                        }
                    });
                }

                // Filter by user
                if (this.state.userFilter) {
                    items = items.filter(item => {
                        const username = item.getAttribute('username').toLowerCase();
                        return username.includes(this.state.userFilter.toLowerCase());
                    });
                }

                this.state.filteredItems = items;
                this.state.currentPage = 0;
                this.render();
            }

            // Statistics
            calculateGlobalStats() {
                const stats = {};
                
                this.state.allItems.forEach(item => {
                    const objectId = item.getAttribute('objectid');
                    const price = this.extractPrice(item);
                    
                    if (!stats[objectId]) {
                        stats[objectId] = { prices: [], soldPrices: [], count: 0, soldCount: 0 };
                    }
                    
                    stats[objectId].count++;
                    if (price) stats[objectId].prices.push(price);
                    
                    if (item.getAttribute('sold') === '1') {
                        stats[objectId].soldCount++;
                        if (price) stats[objectId].soldPrices.push(price);
                    }
                });

                // Calculate averages
                Object.keys(stats).forEach(id => {
                    const s = stats[id];
                    s.avg = s.prices.length > 0 ? s.prices.reduce((a, b) => a + b) / s.prices.length : null;
                    s.soldAvg = s.soldPrices.length > 0 ? s.soldPrices.reduce((a, b) => a + b) / s.soldPrices.length : null;
                });

                this.cache.gameStats = stats;
            }

            extractPrice(item) {
                const priceAttr = item.getAttribute('price');
                if (priceAttr) return parseFloat(priceAttr);
                
                const body = item.querySelector('body')?.textContent || '';
                const match = body.match(/\$(\d+(?:\.\d{2})?)/);
                return match ? parseFloat(match[1]) : null;
            }

            // Rendering
            render() {
                const container = document.getElementById('cardsContainer');
                const start = 0;
                const end = (this.state.currentPage + 1) * this.state.itemsPerPage;
                const items = this.state.filteredItems.slice(start, end);

                container.innerHTML = items.map((item, index) => 
                    this.state.viewMode === 'detailed' 
                        ? this.renderDetailedCard(item, index)
                        : this.renderCondensedCard(item, index)
                ).join('');

                // Show/hide load more
                const loadMore = document.getElementById('loadMore');
                if (end < this.state.filteredItems.length) {
                    loadMore.classList.remove('hidden');
                } else {
                    loadMore.classList.add('hidden');
                }

                // Update count
                document.getElementById('itemCount').textContent = 
                    `${this.state.filteredItems.length} items (showing ${items.length})`;
            }

            renderDetailedCard(item, index) {
                const objectId = item.getAttribute('objectid');
                const objectName = item.getAttribute('objectname');
                const username = item.getAttribute('username');
                const itemId = item.getAttribute('id');
                const sold = item.getAttribute('sold') === '1';
                const price = this.extractPrice(item);
                const postDate = new Date(item.getAttribute('postdate'));

                // Get stats
                const stats = this.cache.gameStats[objectId] || {};
                const buyer = this.extractBuyer(item);

                // Build price table
                const priceTable = `
                    <table class="price-table">
                        <thead>
                            <tr>
                                <th></th>
                                <th>💵</th>
                                <th>#</th>
                                <th>🛒</th>
                                <th>🛒#</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="row-label">This Listing</td>
                                <td class="row-highlight">${price ? '$' + price.toFixed(2) : '-'}</td>
                                <td></td>
                                <td class="row-highlight">${sold && price ? '$' + price.toFixed(2) : ''}</td>
                                <td>${sold ? '1' : ''}</td>
                            </tr>
                            <tr>
                                <td class="row-label">All VFM</td>
                                <td>${stats.avg ? '$' + stats.avg.toFixed(2) : '-'}</td>
                                <td>${stats.count || 0}</td>
                                <td>${stats.soldAvg ? '$' + stats.soldAvg.toFixed(2) : ''}</td>
                                <td>${stats.soldCount || ''}</td>
                            </tr>
                        </tbody>
                    </table>
                `;

                return `
                    <div class="card">
                        <div class="card-header">
                            <img class="card-thumbnail" src="https://via.placeholder.com/80" alt="${objectName}">
                            <div class="card-info">
                                <div class="card-title">${objectName}</div>
                                <div class="card-meta">
                                    <span class="badge ${sold ? 'badge-sold' : 'badge-available'}">
                                        ${sold ? 'SOLD' : 'AVAILABLE'}
                                    </span>
                                    <span>${this.formatTimeAgo(postDate)}</span>
                                </div>
                                <div class="card-price">${price ? '$' + price.toFixed(2) : 'Price N/A'}</div>
                                ${buyer ? `
                                    <div class="transaction">
                                        <span class="seller clickable" onclick="app.quickFilter('user', '${username}')">@${username}</span>
                                        <span class="arrow"> > </span>
                                        <span class="buyer clickable" onclick="app.quickFilter('user', '${buyer}')">@${buyer}</span>
                                    </div>
                                ` : `
                                    <div class="transaction">
                                        <span class="seller clickable" onclick="app.quickFilter('user', '${username}')">@${username}</span>
                                    </div>
                                `}
                            </div>
                        </div>
                        ${priceTable}
                        <div class="card-actions">
                            <button class="btn-action btn-primary" onclick="app.showDetails('${itemId}')">Details</button>
                            <button class="btn-action btn-secondary" onclick="app.showComments('${itemId}')">Comments</button>
                        </div>
                    </div>
                `;
            }

            renderCondensedCard(item, index) {
                const objectName = item.getAttribute('objectname');
                const username = item.getAttribute('username');
                const itemId = item.getAttribute('id');
                const sold = item.getAttribute('sold') === '1';
                const price = this.extractPrice(item);
                const buyer = this.extractBuyer(item);

                return `
                    <div class="card">
                        <div class="card-header">
                            <div class="card-info" style="width: 100%;">
                                <div class="card-title">${objectName}</div>
                                <div class="card-meta">
                                    <span class="badge ${sold ? 'badge-sold' : 'badge-available'}">
                                        ${sold ? 'SOLD' : 'AVAILABLE'}
                                    </span>
                                    <span class="card-price" style="font-size: var(--font-lg);">
                                        ${price ? '$' + price.toFixed(2) : 'N/A'}
                                    </span>
                                </div>
                                ${buyer ? `
                                    <div class="transaction">
                                        <span class="seller clickable" onclick="app.quickFilter('user', '${username}')">@${username}</span>
                                        <span class="arrow"> > </span>
                                        <span class="buyer clickable" onclick="app.quickFilter('user', '${buyer}')">@${buyer}</span>
                                    </div>
                                ` : `
                                    <div class="transaction">
                                        <span class="seller clickable" onclick="app.quickFilter('user', '${username}')">@${username}</span>
                                    </div>
                                `}
                            </div>
                        </div>
                    </div>
                `;
            }

            extractBuyer(item) {
                const body = item.querySelector('body')?.textContent || '';
                const patterns = [
                    /sold to\s+@?([a-zA-Z0-9_-]+)/i,
                    /buyer:\s*@?([a-zA-Z0-9_-]+)/i,
                    /purchased by\s+@?([a-zA-Z0-9_-]+)/i
                ];

                for (const pattern of patterns) {
                    const match = body.match(pattern);
                    if (match) return match[1];
                }
                return null;
            }

            // UI Actions
            setView(mode) {
                this.state.viewMode = mode;
                document.querySelectorAll('[data-view]').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.view === mode);
                });
                this.render();
            }

            setSoldFilter(filter) {
                this.state.soldFilter = filter;
                document.querySelectorAll('[data-filter]').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.filter === filter);
                });
                this.applyFilters();
            }

            setMatchType(type) {
                this.state.matchType = type;
                document.querySelectorAll('[data-match]').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.match === type);
                });
                this.applyFilters();
            }

            filterVFM(type) {
                if (type === 'all') {
                    this.state.activeVFMFiles = new Set(['all']);
                } else if (type === '2025') {
                    this.state.activeVFMFiles = new Set(
                        this.VFM_FILES.filter(f => f.year === '2025').map(f => f.name)
                    );
                } else if (type === '2024') {
                    this.state.activeVFMFiles = new Set(
                        this.VFM_FILES.filter(f => f.year === '2024').map(f => f.name)
                    );
                } else {
                    this.state.activeVFMFiles = new Set(
                        this.VFM_FILES.filter(f => f.category === type).map(f => f.name)
                    );
                }
                this.applyFilters();
            }

            quickFilter(type, value) {
                if (type === 'user') {
                    document.getElementById('userSearch').value = value;
                    this.state.userFilter = value;
                } else if (type === 'game') {
                    document.getElementById('gameSearch').value = value;
                    this.state.gameFilter = value;
                }
                this.applyFilters();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            clearFilters() {
                this.state.gameFilter = '';
                this.state.userFilter = '';
                this.state.soldFilter = 'all';
                this.state.activeVFMFiles = new Set(['all']);
                
                document.getElementById('gameSearch').value = '';
                document.getElementById('userSearch').value = '';
                document.querySelectorAll('[data-filter]').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.filter === 'all');
                });
                
                this.applyFilters();
            }

            loadMore() {
                this.state.currentPage++;
                this.render();
            }

            showDetails(itemId) {
                const item = this.state.allItems.find(i => i.getAttribute('id') === itemId);
                if (!item) return;

                const body = item.querySelector('body')?.textContent || 'No details available';
                const objectName = item.getAttribute('objectname');

                document.getElementById('modalTitle').textContent = objectName;
                document.getElementById('modalBody').innerHTML = `
                    <div style="white-space: pre-wrap; font-size: var(--font-md); line-height: 1.6;">
                        ${this.escapeHtml(body)}
                    </div>
                `;
                document.getElementById('modal').classList.add('active');
            }

            showComments(itemId) {
                const item = this.state.allItems.find(i => i.getAttribute('id') === itemId);
                if (!item) return;

                const comments = Array.from(item.querySelectorAll('comment'));
                const objectName = item.getAttribute('objectname');

                document.getElementById('modalTitle').textContent = `Comments - ${objectName}`;
                
                if (comments.length === 0) {
                    document.getElementById('modalBody').innerHTML = '<p class="text-center" style="color: var(--color-text-secondary);">No comments yet.</p>';
                } else {
                    const html = comments.map(comment => `
                        <div style="padding: var(--spacing-md); border-bottom: 1px solid var(--color-border);">
                            <div style="display: flex; justify-content: space-between; margin-bottom: var(--spacing-xs);">
                                <strong>@${comment.getAttribute('username')}</strong>
                                <span style="color: var(--color-text-secondary); font-size: var(--font-sm);">
                                    ${new Date(comment.getAttribute('date')).toLocaleDateString()}
                                </span>
                            </div>
                            <div style="font-size: var(--font-md);">${this.escapeHtml(comment.textContent)}</div>
                        </div>
                    `).join('');
                    document.getElementById('modalBody').innerHTML = html;
                }

                document.getElementById('modal').classList.add('active');
            }

            showDashboard() {
                alert('Dashboard coming soon!');
            }

            closeModal() {
                document.getElementById('modal').classList.remove('active');
            }

            // Utilities
            showLoading(show) {
                document.getElementById('loading').classList.toggle('hidden', !show);
                document.getElementById('cardsContainer').style.opacity = show ? '0.5' : '1';
            }

            updateStatus(message) {
                document.getElementById('loadStatus').textContent = message;
            }

            formatTimeAgo(date) {
                const seconds = Math.floor((new Date() - date) / 1000);
                if (seconds < 60) return 'just now';
                if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
                if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
                if (seconds < 604800) return Math.floor(seconds / 86400) + 'd ago';
                return date.toLocaleDateString();
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // Initialize app
        const app = new VFMApp();
    </script>
</body>
</html>
