<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <title>BGG Player Count Menu</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='75' font-size='70'%3E🎲%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            --brand-primary: #4f46e5;
            --brand-secondary: #6366f1;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: #1e293b;
            -webkit-font-smoothing: antialiased;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        .game-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .game-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        .spinner {
            border: 3px solid rgba(0, 0, 0, 0.1);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border-left-color: var(--brand-primary);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Print styles specific to the menu generation */
        @page {
            size: letter;
            margin: 0.25in;
        }

        .hidden-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .flag-perfect { background: #4caf50; color: white; }
        .flag-best { background: #ff9800; color: white; }
        .flag-recommended { background: #2196f3; color: white; }
        .flag-supported { background: #9e9e9e; color: white; }

        .bayes-excellent { background: rgba(76, 175, 80, 0.9); color: white; }
        .bayes-very-good { background: rgba(139, 195, 74, 0.9); color: white; }
        .bayes-good { background: rgba(255, 235, 59, 0.9); color: black; }
        .bayes-fair { background: rgba(255, 152, 0, 0.9); color: white; }
        .bayes-poor { background: rgba(244, 67, 54, 0.9); color: white; }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row">

    <!-- Sidebar / Header -->
    <aside class="w-full md:w-80 bg-white border-b md:border-r border-slate-200 p-6 flex flex-col gap-8 shrink-0">
        <div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900 flex items-center gap-2">
                <span class="text-3xl">🎲</span> Game Menu
            </h1>
            <p class="text-slate-500 text-sm mt-1">Find games for your player count.</p>
        </div>

        <!-- BGG Search Section -->
        <div class="flex flex-col gap-4">
            <label class="text-xs font-bold uppercase tracking-wider text-slate-400">BGG Collection</label>
            <div class="flex flex-col gap-2">
                <input type="text" id="username" placeholder="BGG Username" value="sportomax"
                    class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                
                <label class="text-sm font-semibold text-slate-700">Player Count</label>
                <select id="playerCount" class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="2">2 Players</option>
                    <option value="3">3 Players</option>
                    <option value="4" selected>4 Players</option>
                    <option value="5">5 Players</option>
                    <option value="6">6 Players</option>
                    <option value="7">7 Players</option>
                    <option value="8">8 Players</option>
                </select>

                <button id="fetchBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg shadow-sm transition-colors flex items-center justify-center gap-2">
                    Find Games
                </button>
            </div>
        </div>

        <div class="mt-auto pt-6 border-t border-slate-100">
            <button id="printBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-100 transition-all flex items-center justify-center gap-2" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M5 4v3H4a2 2 0 00-2 2v3a2 2 0 002 2h1v2a2 2 0 002 2h6a2 2 0 002-2v-2h1a2 2 0 002-2V9a2 2 0 00-2-2h-1V4a2 2 0 00-2-2H7a2 2 0 00-2 2zm8 0H7v3h6V4zm0 8H7v4h6v-4z" clip-rule="evenodd" />
                </svg>
                Print Menu
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6 md:p-10 overflow-y-auto">
        
        <!-- Status & Progress -->
        <div id="status" class="hidden mb-6 p-4 rounded-xl bg-indigo-50 text-indigo-700 text-sm font-medium flex items-center gap-3">
            <div class="spinner"></div>
            <span id="statusText">Working...</span>
        </div>

        <div id="statsDiv" class="hidden mb-8 p-4 rounded-xl bg-emerald-50 border border-emerald-200">
            <div class="text-sm text-emerald-800">
                <strong id="statsText"></strong>
            </div>
        </div>

        <!-- Games Grid -->
        <div id="gamesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Initial State Message -->
            <div class="col-span-full py-20 flex flex-col items-center justify-center text-slate-400">
                <div class="text-6xl mb-4">📚</div>
                <h3 class="text-xl font-semibold text-slate-600">No games loaded</h3>
                <p>Enter your BGG username and click "Find Games" to get started.</p>
            </div>
        </div>
    </main>

    <script>
        // ===== API & Core Logic using BGG Proxy from menu.html =====
        let currentSortedGames = [];
        let currentGameDetails = {};

        function setStatus(text, showSpinner = true) {
            const statusDiv = document.getElementById('status');
            const statusText = document.getElementById('statusText');
            if (!text) {
                statusDiv.classList.add('hidden');
                return;
            }
            statusDiv.classList.remove('hidden');
            statusText.innerText = text;
        }

        function setStats(text) {
            const statsDiv = document.getElementById('statsDiv');
            const statsText = document.getElementById('statsText');
            if (!text) {
                statsDiv.classList.add('hidden');
                return;
            }
            statsDiv.classList.remove('hidden');
            statsText.innerHTML = text;
        }

        async function fetchBGGCollection(username) {
            setStatus(`Fetching collection from BGG for ${username}...`);
            const response = await fetch(`/api/bgg-helper?endpoint=collection&username=${username}&own=1&stats=1`);
            
            if (response.status === 202) {
                setStatus("BGG is preparing your data. Retrying in 3 seconds...");
                await new Promise(r => setTimeout(r, 3000));
                return fetchBGGCollection(username);
            }

            if (!response.ok) throw new Error("Failed to fetch collection.");
            
            const text = await response.text();
            const parser = new DOMParser();
            const xml = parser.parseFromString(text, "text/xml");
            const items = xml.querySelectorAll('item');
            
            let games = [];
            items.forEach(item => {
                const stats = item.querySelector('stats');
                const bayesElem = stats?.querySelector('rating bayesaverage');

                games.push({
                    objectId: item.getAttribute('objectid'),
                    name: item.querySelector('name')?.textContent || '',
                    year: item.querySelector('yearpublished')?.textContent || 'Unknown',
                    minPlayers: parseInt(stats?.getAttribute('minplayers') || '0'),
                    maxPlayers: parseInt(stats?.getAttribute('maxplayers') || '0'),
                    playingTime: stats?.getAttribute('playingtime') || '0',
                    thumbnail: item.querySelector('thumbnail')?.textContent || '',
                    bayesAverage: bayesElem ? parseFloat(bayesElem.getAttribute('value') || '0') : 0
                });
            });
            return games;
        }

        async function fetchGameDetails(gameIds) {
            if (gameIds.length === 0) return {};
            
            setStatus(`Fetching detailed player count data for ${gameIds.length} games...`);
            const batchSize = 20;
            let details = {};
            
            for (let i = 0; i < gameIds.length; i += batchSize) {
                const batch = gameIds.slice(i, i + batchSize);
                
                try {
                    const response = await fetch(`/api/bgg-helper?endpoint=thing&id=${batch.join(',')}&stats=1`);
                    if (!response.ok) continue;
                    
                    const text = await response.text();
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(text, "text/xml");
                    const items = xml.querySelectorAll('item');
                    
                    items.forEach(item => {
                        const id = item.getAttribute('id');
                        const poll = item.querySelector('poll[name="suggested_numplayers"]');
                        const players = {};
                        
                        if (poll) {
                            poll.querySelectorAll('results').forEach(res => {
                                const num = res.getAttribute('numplayers');
                                const best = parseInt(res.querySelector('result[value="Best"]')?.getAttribute('numvotes') || '0');
                                const rec = parseInt(res.querySelector('result[value="Recommended"]')?.getAttribute('numvotes') || '0');
                                const bad = parseInt(res.querySelector('result[value="Not Recommended"]')?.getAttribute('numvotes') || '0');
                                
                                if (best > rec && best > bad) players[num] = 'best';
                                else if (rec > bad) players[num] = 'rec';
                            });
                        }

                        details[id] = {
                            suggested: players,
                            bggRank: item.querySelector('rank')?.getAttribute('value') || ''
                        };
                    });
                } catch (err) {
                    console.error('Error fetching batch:', err);
                }
                
                const progress = Math.min(100, Math.round(((i + batch.length) / gameIds.length) * 100));
                setStatus(`Fetching details... ${progress}%`);
            }
            
            return details;
        }

        function getBayesStyle(rating) {
            if (rating >= 8.0) return 'bayes-excellent';
            if (rating >= 7.5) return 'bayes-very-good';
            if (rating >= 7.0) return 'bayes-good';
            if (rating >= 5.0) return 'bayes-fair';
            return 'bayes-poor';
        }

        function categorizeGame(game, details, playerCount) {
            const suggested = details?.suggested || {};
            const playerStr = playerCount.toString();
            
            if (game.minPlayers === game.maxPlayers) return 'perfect';
            if (suggested[playerStr] === 'best') return 'best';
            if (suggested[playerStr] === 'rec') return 'recommended';
            if (playerCount >= game.minPlayers && playerCount <= game.maxPlayers) return 'supported';
            return 'supported';
        }

        function renderGames(games, details, playerCount) {
            const grid = document.getElementById('gamesGrid');
            if (games.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-20 text-center text-slate-400">
                    <div class="text-6xl mb-4">😕</div>
                    <p>No games found for ${playerCount} players.</p>
                </div>`;
                return;
            }

            grid.innerHTML = games.map((game, idx) => {
                const detail = details[game.objectId] || { suggested: {} };
                const category = categorizeGame(game, detail, playerCount);
                const bayesClass = getBayesStyle(game.bayesAverage);
                const categoryLabel = {
                    'perfect': '🎯 Perfect',
                    'best': '⭐ Best',
                    'recommended': '👍 Rec',
                    'supported': '✓ OK'
                }[category];

                return `
                    <div class="game-card bg-white rounded-2xl p-4 flex flex-col gap-4 border border-slate-100 shadow-sm relative overflow-hidden group">
                        <div class="absolute top-3 left-3 flex items-center gap-2 z-10">
                            <span class="px-2 py-1 bg-slate-800 text-white text-xs font-bold rounded">#${idx + 1}</span>
                        </div>
                        <div class="absolute top-3 right-3 z-10">
                            <span class="px-2 py-1 text-xs font-bold rounded text-white flag-${category}">${categoryLabel}</span>
                        </div>
                        <div class="aspect-square rounded-xl overflow-hidden bg-slate-100 border border-slate-50">
                            <img src="${game.thumbnail}" alt="${game.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onerror="this.style.display='none'">
                        </div>
                        <div class="flex flex-col gap-2 flex-1">
                            <h4 class="font-bold text-slate-800 leading-tight line-clamp-2 min-h-[2.5rem]">${game.name}</h4>
                            <div class="text-xs text-slate-500 space-y-1">
                                <div><strong>Year:</strong> ${game.year}</div>
                                <div><strong>Players:</strong> ${game.minPlayers}${game.minPlayers !== game.maxPlayers ? '-' + game.maxPlayers : ''}</div>
                                <div><strong>Time:</strong> ${game.playingTime} min</div>
                            </div>
                            <div class="mt-auto pt-2 flex items-center justify-between">
                                <span class="text-xs font-semibold text-slate-400">BGG Rating</span>
                                <span class="px-2 py-0.5 rounded text-white text-xs font-bold ${bayesClass}">${game.bayesAverage.toFixed(1)}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function processCollection(username, playerCount) {
            try {
                const startTime = Date.now();
                
                // Fetch collection
                const games = await fetchBGGCollection(username);
                
                if (games.length === 0) {
                    setStatus(null);
                    document.getElementById('gamesGrid').innerHTML = `
                        <div class="col-span-full py-20 text-center text-red-400">
                            <div class="text-6xl mb-4">⚠️</div>
                            <p>No games found or collection is private.</p>
                        </div>`;
                    return;
                }

                // Filter games by player count
                const filteredGames = games.filter(game => 
                    playerCount >= game.minPlayers && playerCount <= game.maxPlayers
                ).sort((a, b) => b.bayesAverage - a.bayesAverage);

                // Fetch detailed player count data
                const objectIds = games.map(g => g.objectId);
                const details = await fetchGameDetails(objectIds);

                // Re-sort by category and rating
                const sortedGames = filteredGames.sort((a, b) => {
                    const categoryOrder = { 'perfect': 0, 'best': 1, 'recommended': 2, 'supported': 3 };
                    const catA = categorizeGame(a, details[a.objectId], playerCount);
                    const catB = categorizeGame(b, details[b.objectId], playerCount);
                    
                    if (categoryOrder[catA] !== categoryOrder[catB]) {
                        return categoryOrder[catA] - categoryOrder[catB];
                    }
                    return b.bayesAverage - a.bayesAverage;
                });

                // Store for print
                currentSortedGames = sortedGames;
                currentGameDetails = details;

                // Enable print button
                document.getElementById('printBtn').disabled = false;

                // Render games
                renderGames(sortedGames, details, playerCount);

                // Show stats
                const totalTime = ((Date.now() - startTime) / 1000).toFixed(1);
                setStats(`✅ Found ${sortedGames.length} games for ${playerCount} players (${totalTime}s) | Perfect: ${sortedGames.filter(g => categorizeGame(g, details[g.objectId], playerCount) === 'perfect').length} | Best: ${sortedGames.filter(g => categorizeGame(g, details[g.objectId], playerCount) === 'best').length}`);
                setStatus(null);

            } catch (error) {
                console.error('Error:', error);
                setStatus(null);
                document.getElementById('gamesGrid').innerHTML = `
                    <div class="col-span-full py-20 text-center text-red-400">
                        <div class="text-6xl mb-4">❌</div>
                        <p>Error: ${error.message}</p>
                    </div>`;
            }
        }

        // Event listeners
        document.getElementById('fetchBtn').addEventListener('click', () => {
            const username = document.getElementById('username').value.trim();
            const playerCount = parseInt(document.getElementById('playerCount').value);
            
            if (!username) {
                alert('Please enter a BGG username');
                return;
            }
            
            processCollection(username, playerCount);
        });

        document.getElementById('printBtn').addEventListener('click', () => {
            if (!currentSortedGames || currentSortedGames.length === 0) {
                alert('No games to print. Please search first.');
                return;
            }

            const username = document.getElementById('username').value;
            const playerCount = document.getElementById('playerCount').value;
            const games = currentSortedGames.slice(0, 120);

            const printWindow = window.open('', '_blank');
            
            const itemsHtml = games.map((game, idx) => {
                const category = categorizeGame(game, currentGameDetails[game.objectId], parseInt(playerCount));
                const categoryLabel = { 'perfect': '🎯', 'best': '⭐', 'recommended': '👍', 'supported': '✓' }[category];
                
                return `
                    <div style="break-inside: avoid; margin-bottom: 12px; border-bottom: 0.5pt solid #eee; padding-bottom: 8px;">
                        <div style="display: flex; justify-content: space-between; align-items: baseline;">
                            <strong style="font-size: 11pt; color: #111;">#${idx + 1} ${categoryLabel} ${game.name}</strong>
                            <div style="font-size: 9pt; color: #666;">${game.minPlayers}-${game.maxPlayers}p | ${game.playingTime}m</div>
                        </div>
                        <div style="font-size: 8.5pt; color: #555; margin-top: 2px;">
                            ${game.year} • BGG Rating: ${game.bayesAverage.toFixed(1)}
                        </div>
                    </div>
                `;
            }).join('');

            const html = `
                <html>
                <head>
                    <style>
                        body { font-family: 'Inter', -apple-system, sans-serif; padding: 120px 40px 40px 40px; margin: 0; }
                        h1 { font-size: 24pt; border-bottom: 2pt solid #000; margin-bottom: 20px; padding-bottom: 10px; text-align: center; }
                        .grid { column-count: 2; column-gap: 30px; }
                        @media print { body { padding-top: 120px; } }
                    </style>
                </head>
                <body>
                    <h1>Game Menu — ${playerCount} Players</h1>
                    <p style="text-align: center; color: #666; font-size: 10pt; margin-bottom: 20px;">${username}'s Collection • Top ${games.length} Games</p>
                    <div class="grid">${itemsHtml}</div>
                </body>
                </html>
            `;

            printWindow.document.write(html);
            printWindow.document.close();
            setTimeout(() => printWindow.print(), 500);
        });

        // Allow Enter key to trigger search
        document.getElementById('username').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('fetchBtn').click();
        });
    </script>
</body>
</html>
