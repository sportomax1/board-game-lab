<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Board Game Lab | Cover Gallery</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0c111a;color:#f1f5f9}*{box-sizing:border-box}body{margin:0}header{padding:20px 24px;background:#151e2b;position:sticky;top:0;z-index:10;border-bottom:1px solid #304057}h1{margin:0 0 12px;font-size:24px}.controls,nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}input,select,button{background:#233146;color:white;border:1px solid #44546c;border-radius:8px;padding:9px;font:inherit}button{cursor:pointer}button:hover,button.active{background:#426fa3}input[type=range]{width:105px}nav{padding:12px 24px;background:#111b29}#status{padding:10px 24px;color:#a8bfd5;font-size:13px}main{padding:16px 20px;min-height:70vh;overflow:hidden;--sz:110px}.cover{padding:0;border:0;background:#29364a;position:relative;overflow:hidden;aspect-ratio:1;min-width:0}.cover img{width:100%;height:100%;object-fit:contain;display:block}.cover:hover{outline:2px solid #89c5ff;z-index:2!important}.fallback{font-size:12px;padding:10px;display:grid;place-items:center;height:100%;text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--sz),1fr));gap:5px}.masonry{columns:var(--cols);column-gap:8px}.masonry .cover{display:block;width:100%;aspect-ratio:var(--ratio);margin-bottom:8px;break-inside:avoid}.pile{position:relative;margin:auto;max-width:1400px}.pile .cover{position:absolute;width:var(--sz);height:var(--sz);box-shadow:0 3px 15px #0009;border:3px solid #eee}.galaxy-wrap{height:72vh;position:relative;overflow:hidden;background:radial-gradient(circle,#27364a,#0c111a);touch-action:none;cursor:grab}.galaxy{position:absolute;transform-origin:0 0}.galaxy .cover{position:absolute;width:var(--sz);height:var(--sz)}.hint{position:absolute;bottom:12px;left:12px;background:#101a2bdb;padding:8px;border-radius:8px}.shelves section{margin-bottom:18px}.shelf-label{font-size:12px;color:#8fa6c1;margin-bottom:5px}.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--sz),1fr));gap:7px;padding:10px 8px 15px;border-bottom:12px solid #75533c;background:linear-gradient(#182536,#263343)}dialog{border:1px solid #53647c;border-radius:14px;background:#182435;color:white;max-width:90vw}dialog img{width:220px;max-width:65vw;max-height:60vh;object-fit:contain}dialog a{color:#9acfff}.detail{display:flex;flex-wrap:wrap;gap:18px}#close{float:right}.empty{text-align:center;padding:90px 12px;color:#a6b5c6}@media(max-width:600px){header{position:static;padding:12px}h1{font-size:20px}main{padding:8px}.controls input[type=text]{width:120px}}

/* Motion system and responsive controls */
:root{--ease:cubic-bezier(.22,1,.36,1)}body{overflow-x:hidden}header{backdrop-filter:blur(18px);background:#151e2bf0}button,input,select{min-height:38px}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #9acfff;outline-offset:2px}
nav{position:sticky;top:112px;z-index:9;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:thin}nav button{flex:0 0 auto;white-space:nowrap;transition:background .2s,transform .2s}nav button:active{transform:scale(.95)}
.cover{border-radius:7px;isolation:isolate;will-change:auto;transition:box-shadow .3s var(--ease),filter .3s var(--ease),outline-color .2s}.cover img{transition:transform .5s var(--ease),filter .35s}.grid .cover:hover img,.masonry .cover:hover img,.shelves .cover:hover img{transform:scale(1.09)}.cover:active img{transform:scale(.95)}.cover:hover{box-shadow:0 12px 32px #0008;filter:brightness(1.13)}
main.enter .cover:nth-child(-n+100){animation:cover-enter .62s var(--ease) both;animation-delay:calc((var(--i,0) % 16)*26ms)}@keyframes cover-enter{from{opacity:0;filter:blur(7px);scale:.86}to{opacity:1;filter:blur(0);scale:1}}
.pile .cover{transition:translate .45s var(--ease),box-shadow .35s}.pile .cover:hover{translate:0 -15px;box-shadow:0 18px 35px #000c}.pile .cover img{animation:gentle-sway 7s ease-in-out infinite alternate;animation-delay:calc(var(--i,0)*-130ms)}@keyframes gentle-sway{to{transform:translateY(-4px) rotate(1deg)}}
.galaxy{will-change:transform}.galaxy .cover img{animation:float-cover 6s ease-in-out infinite alternate;animation-delay:calc(var(--i,0)*-90ms)}@keyframes float-cover{to{transform:translateY(-7px)}}.shelves .shelf{box-shadow:0 12px 18px #0006}
dialog{animation:modal-in .28s var(--ease);max-height:90dvh;overflow:auto}dialog::backdrop{background:#020712bd;backdrop-filter:blur(6px)}@keyframes modal-in{from{opacity:0;transform:translateY(22px) scale(.95)}to{opacity:1;transform:none}}
#status{transition:opacity .2s}.controls label{display:flex;align-items:center;gap:5px}.motion-toggle{white-space:nowrap}.motion-off main.enter .cover,.motion-off .pile .cover img,.motion-off .galaxy .cover img,.motion-off dialog{animation:none!important}.motion-off .cover,.motion-off .cover img{transition:none!important}
@media(max-width:700px){header{position:relative;padding:12px 12px 10px}h1{font-size:19px;margin-bottom:10px}.controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px}.controls input,.controls select,.controls button{width:100%;min-width:0;font-size:13px}.controls label{grid-column:span 1;justify-content:space-between}.controls input[type=range]{width:65%}nav{top:0;padding:8px 10px;gap:6px;box-shadow:0 4px 14px #0005}nav button{font-size:12px;padding:9px 10px}#status{padding:9px 12px}main{padding:8px;min-height:65dvh}.grid{gap:4px}.pile{max-width:100%}.galaxy-wrap{height:65dvh}.hint{font-size:11px;bottom:8px;left:8px;right:8px;pointer-events:none}dialog{width:calc(100vw - 22px)}}
@media(min-width:701px) and (max-width:1100px){nav{top:150px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head><body><header><h1>🎲 Board Game Lab · Cover Gallery</h1><div class="controls"><input id="username" value="sportomax" aria-label="BGG username"><button id="load">Load Collection</button><input id="search" placeholder="Search covers" aria-label="Search games"><select id="scope"><option value="all">All collection entries</option><option value="owned">Owned only</option><option value="played">Played only</option></select><select id="sort"><option value="name">Name A–Z</option><option value="year">Newest year</option><option value="random">Shuffle</option></select><label>Size <input id="size" type="range" min="55" max="200" value="110"></label><button id="shuffle">↻ Shuffle</button><button id="motion" class="motion-toggle" aria-pressed="true" title="Toggle animations">✦ Motion On</button></div></header><nav id="tabs"><button data-mode="grid" class="active">▦ Compact Grid</button><button data-mode="masonry">▥ Masonry</button><button data-mode="pile">▧ Photo Pile</button><button data-mode="galaxy">✧ Cover Galaxy</button><button data-mode="shelves">▤ Game Shelves</button></nav><div id="status" role="status">Loading sportomax collection…</div><main id="stage"><div class="empty">Loading covers…</div></main><dialog id="modal"><button id="close">Close ✕</button><div id="detail"></div></dialog><script>
'use strict';const $=id=>document.getElementById(id),stage=$('stage');let games=[],mode='grid',seed=3,scale=1,panX=0,panY=0,motion=true,renderId=0;const BASE='/api/bgg-helper?endpoint=collection&';const sleep=ms=>new Promise(r=>setTimeout(r,ms));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const hash=n=>{let x=Math.sin((n+1)*127.1+seed*78.23)*43758.5;return x-Math.floor(x)};function status(s){$('status').textContent=s}async function requestXML(url){const r=await fetch(url,{signal:AbortSignal.timeout(55000),headers:{Accept:'application/xml,text/xml'}});if(r.status===202)return null;const body=await r.text();if(!r.ok){let message='HTTP '+r.status;try{const j=JSON.parse(body);message=j.message||j.error||message}catch{}throw Error(message)}const doc=new DOMParser().parseFromString(body,'application/xml');if(doc.querySelector('parsererror'))throw Error('BGG proxy returned invalid XML');return doc}
function parse(doc){return [...doc.querySelectorAll('item')].map((el,i)=>{const st=el.querySelector('status'),stat=el.querySelector('stats');return {id:el.getAttribute('objectid')||String(i),name:el.querySelector('name')?.textContent?.trim()||'Untitled',year:Number(el.querySelector('yearpublished')?.textContent)||0,image:el.querySelector('thumbnail')?.textContent?.trim()||el.querySelector('image')?.textContent?.trim()||'',owned:st?.getAttribute('own')==='1',played:st?.getAttribute('played')==='1',rating:stat?.querySelector('rating')?.getAttribute('value')||''}})}
async function load(){const username=$('username').value.trim();if(!username)return;const scope=$('scope').value;const params=new URLSearchParams({username,stats:'1'});if(scope==='owned')params.set('own','1');if(scope==='played')params.set('played','1');const url=BASE+params;games=[];render();for(let i=0;i<8;i++){status('Fetching '+username+' collection'+(i?' · BGG queue retry '+i+'/7':'')+'…');try{const doc=await requestXML(url);if(doc){const result=parse(doc);if(result.length){games=result;status(games.length.toLocaleString()+' thumbnails loaded · '+username);render();return}if(doc.querySelector('items')?.getAttribute('totalitems')==='0'){status('Collection returned zero entries.');return}}}catch(e){if(i===7){status('Could not load collection: '+e.message+'. Check BGG helper configuration or upstream availability.');return}}await sleep(3000+i*1500)}status('BGG is still preparing this collection. Select Load Collection to retry.')}
function filtered(){const q=$('search').value.toLowerCase().trim();const a=games.filter(g=>g.name.toLowerCase().includes(q));if($('sort').value==='year')a.sort((a,b)=>b.year-a.year||a.name.localeCompare(b.name));else if($('sort').value==='random')a.sort((a,b)=>hash(+a.id)-hash(+b.id));else a.sort((a,b)=>a.name.localeCompare(b.name));return a}
function cover(g){const b=document.createElement('button');b.className='cover';b.style.setProperty('--i',renderId++);b.title=g.name;b.setAttribute('aria-label',g.name);if(g.image){const im=document.createElement('img');im.src=g.image.replace(/^http:/,'https:');im.loading='lazy';im.decoding='async';im.alt=g.name;im.onerror=()=>{im.remove();b.textContent=g.name};b.append(im)}else b.textContent=g.name;b.onclick=()=>{$('detail').innerHTML='<div class="detail">'+(g.image?'<img src="'+esc(g.image.replace(/^http:/,'https:'))+'">':'')+'<div><h2>'+esc(g.name)+'</h2><p>'+esc(g.year||'Year unknown')+'</p><a target="_blank" rel="noopener" href="https://boardgamegeek.com/boardgame/'+encodeURIComponent(g.id)+'">View on BGG ↗</a></div></div>';$('modal').showModal()};return b}
function render(){const a=filtered(),size=+$('size').value;renderId=0;stage.classList.remove('enter');stage.replaceChildren();stage.style.setProperty('--sz',size+'px');if(!a.length){stage.innerHTML='<div class="empty">'+(games.length?'No matching covers.':'Waiting for BGG collection…')+'</div>';return}if(mode==='grid'){const el=document.createElement('div');el.className='grid';a.forEach(g=>el.append(cover(g)));stage.append(el)}else if(mode==='masonry'){const el=document.createElement('div');el.className='masonry';el.style.setProperty('--cols',Math.max(2,Math.floor(stage.clientWidth/(size+12))));a.forEach((g,i)=>{const b=cover(g);b.style.setProperty('--ratio',i%4===0?'.8':i%3===0?'1.2':'1');el.append(b)});stage.append(el)}else if(mode==='pile'){const el=document.createElement('div');el.className='pile';const count=Math.min(a.length,450),w=Math.max(250,stage.clientWidth-30),h=Math.max(560,Math.ceil(count/Math.max(3,Math.floor(w/(size*.6))))*size*.5);el.style.height=h+'px';a.slice(0,count).forEach((g,i)=>{const b=cover(g);b.style.left=hash(i*3)*(w-size)+'px';b.style.top=hash(i*3+1)*(h-size)+'px';b.style.transform='rotate('+((hash(i*3+2)-.5)*42)+'deg)';b.style.zIndex=i+1;el.append(b)});stage.append(el)}else if(mode==='galaxy'){const v=document.createElement('div');v.className='galaxy-wrap';const f=document.createElement('div');f.className='galaxy';const count=Math.min(a.length,850),r=Math.max(500,Math.sqrt(count)*size*.64),extent=2*r+size;f.style.width=extent+'px';f.style.height=extent+'px';a.slice(0,count).forEach((g,i)=>{const b=cover(g),t=i*2.399963,r2=Math.sqrt((i+.5)/count)*r;b.style.left=r+r2*Math.cos(t)+'px';b.style.top=r+r2*Math.sin(t)+'px';f.append(b)});v.append(f);const hint=document.createElement('div');hint.className='hint';hint.textContent='Drag to pan · Scroll to zoom · '+count+' covers';v.append(hint);stage.append(v);scale=Math.min(.9,v.clientWidth/extent,v.clientHeight/extent);panX=(v.clientWidth-extent*scale)/2;panY=(v.clientHeight-extent*scale)/2;const update=()=>f.style.transform='translate('+panX+'px,'+panY+'px) scale('+scale+')';update();let drag=null;v.onwheel=e=>{e.preventDefault();const box=v.getBoundingClientRect(),x=e.clientX-box.left,y=e.clientY-box.top,next=Math.max(.1,Math.min(4,scale*(e.deltaY<0?1.15:.87))),ratio=next/scale;panX=x-(x-panX)*ratio;panY=y-(y-panY)*ratio;scale=next;update()};v.onpointerdown=e=>{if(e.target.closest('.cover'))return;drag={x:e.clientX,y:e.clientY,px:panX,py:panY};v.setPointerCapture(e.pointerId)};v.onpointermove=e=>{if(!drag)return;panX=drag.px+e.clientX-drag.x;panY=drag.py+e.clientY-drag.y;update()};v.onpointerup=v.onpointercancel=()=>drag=null}else{const el=document.createElement('div');el.className='shelves';const per=Math.max(3,Math.floor((stage.clientWidth-30)/(size+8)));for(let i=0;i<a.length;i+=per){const sec=document.createElement('section'),label=document.createElement('div'),shelf=document.createElement('div');label.className='shelf-label';label.textContent='Shelf '+(Math.floor(i/per)+1);shelf.className='shelf';a.slice(i,i+per).forEach(g=>shelf.append(cover(g)));sec.append(label,shelf);el.append(sec)}stage.append(el)}if(motion){void stage.offsetWidth;stage.classList.add('enter')}}
$('motion').onclick=()=>{motion=!motion;document.body.classList.toggle('motion-off',!motion);$('motion').textContent=motion?'✦ Motion On':'○ Motion Off';$('motion').setAttribute('aria-pressed',String(motion));if(!motion)stage.classList.remove('enter')};$('load').onclick=load;$('scope').onchange=load;$('search').oninput=render;$('sort').onchange=render;$('size').oninput=render;$('shuffle').onclick=()=>{seed++;$('sort').value='random';render()};$('close').onclick=()=>$('modal').close();document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));render()});load();
</script></body></html>
