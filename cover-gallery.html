.plinko-shell{max-width:1050px;margin:auto}.plinko-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.plinko-toolbar select{max-width:150px}.plinko-board{position:relative;width:100%;height:clamp(420px,67vh,720px);overflow:hidden;border:2px solid #51627c;border-radius:16px;background:radial-gradient(ellipse at 50% 10%,#263b54,#101a29 75%);box-shadow:inset 0 0 65px #0007}.plinko-peg{position:absolute;width:7px;height:7px;border-radius:50%;background:#91b9d7;box-shadow:0 0 6px #8ab7db6b;pointer-events:none}.plinko-bucket{position:absolute;bottom:0;height:90px;border-left:2px solid #90a9bd;border-right:1px solid #90a9bd;border-top:1px solid #425a73;background:#15263d99;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:5px 2px;gap:4px;pointer-events:none}.plinko-bucket strong{font-size:13px}.plinko-bucket small{font-size:10px;color:#c4d4e3}.plinko-chip{position:absolute;top:0;left:0;width:var(--chip);height:var(--chip);padding:0;border:2px solid #e2ebf5;border-radius:8px;overflow:hidden;background:#314763;box-shadow:0 5px 12px #0009;z-index:3;will-change:transform}.plinko-chip img{width:100%;height:100%;object-fit:contain}.plinko-chip:focus-visible{outline:3px solid #fff}.plinko-summary{margin-top:10px;color:#b7c9dc;font-size:13px}.plinko-launcher{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:50px;height:12px;border-radius:12px;background:#c9a46d;box-shadow:0 0 18px #e8ba6c}.plinko-toolbar label{font-size:13px;color:#b7c9dc}@media(max-width:700px){.plinko-board{height:clamp(430px,68dvh,630px)}.plinko-toolbar button,.plinko-toolbar select{font-size:12px}.plinko-peg{width:5px;height:5px}.plinko-bucket{height:75px}.plinko-bucket small{font-size:9px}}
.plinko-divider{position:absolute;bottom:0;height:90px;width:4px;transform:translateX(-50%);background:linear-gradient(#c9e2f7,#7190ac);box-shadow:0 0 5px #0008;pointer-events:none}.plinko-chip{border-radius:50%;border-width:2px}.plinko-chip img{border-radius:50%}</style></head><body><header><h1>🎲 Board Game Lab · Cover Gallery</h1><div class="controls"><input id="username" value="sportomax" aria-label="BGG username"><button id="load">Load Collection</button><input id="search" placeholder="Search covers" aria-label="Search games"><select id="scope"><option value="all">All collection entries</option><option value="owned">Owned only</option><option value="played">Played only</option></select><select id="sort"><option value="name">Name A–Z</option><option value="year">Newest year</option><option value="random">Shuffle</option></select><label>Size <input id="size" type="range" min="55" max="200" value="110"></label><button id="shuffle">↻ Shuffle</button><button id="motion" class="motion-toggle" aria-pressed="true" title="Toggle animations">✦ Motion On</button></div></header><nav id="tabs"><button data-mode="grid" class="active">▦ Compact Grid</button><button data-mode="masonry">▥ Masonry</button><button data-mode="pile">▧ Photo Pile</button><button data-mode="galaxy">✧ Cover Galaxy</button><button data-mode="shelves">▤ Game Shelves</button><button data-mode="plinko">◉ Cover Plinko</button></nav><div id="status" role="status">Loading sportomax collection…</div><main id="stage"><div class="empty">Loading covers…</div></main><dialog id="modal"><button id="close">Close ✕</button><div id="detail"></div></dialog><script>
'use strict';const $=id=>document.getElementById(id),stage=$('stage');let games=[],mode='grid',seed=3,scale=1,panX=0,panY=0,motion=true,renderId=0,stopPlinko=null;const BASE='/api/bgg-helper?endpoint=collection&';const sleep=ms=>new Promise(r=>setTimeout(r,ms));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const hash=n=>{let x=Math.sin((n+1)*127.1+seed*78.23)*43758.5;return x-Math.floor(x)};function status(s){$('status').textContent=s}async function requestXML(url){const r=await fetch(url,{signal:AbortSignal.timeout(55000),headers:{Accept:'application/xml,text/xml'}});if(r.status===202)return null;const body=await r.text();if(!r.ok){let message='HTTP '+r.status;try{const j=JSON.parse(body);message=j.message||j.error||message}catch{}throw Error(message)}const doc=new DOMParser().parseFromString(body,'application/xml');if(doc.querySelector('parsererror'))throw Error('BGG proxy returned invalid XML');return doc}
function parse(doc){return [...doc.querySelectorAll('item')].map((el,i)=>{const st=el.querySelector('status'),stat=el.querySelector('stats');return {id:el.getAttribute('objectid')||String(i),name:el.querySelector('name')?.textContent?.trim()||'Untitled',year:Number(el.querySelector('yearpublished')?.textContent)||0,image:el.querySelector('thumbnail')?.textContent?.trim()||el.querySelector('image')?.textContent?.trim()||'',owned:st?.getAttribute('own')==='1',played:st?.getAttribute('played')==='1',rating:stat?.querySelector('rating')?.getAttribute('value')||''}})}
async function load(){const username=$('username').value.trim();if(!username)return;const scope=$('scope').value;const params=new URLSearchParams({username,stats:'1'});if(scope==='owned')params.set('own','1');if(scope==='played')params.set('played','1');const url=BASE+params;games=[];render();for(let i=0;i<8;i++){status('Fetching '+username+' collection'+(i?' · BGG queue retry '+i+'/7':'')+'…');try{const doc=await requestXML(url);if(doc){const result=parse(doc);if(result.length){games=result;status(games.length.toLocaleString()+' thumbnails loaded · '+username);render();return}if(doc.querySelector('items')?.getAttribute('totalitems')==='0'){status('Collection returned zero entries.');return}}}catch(e){if(i===7){status('Could not load collection: '+e.message+'. Check BGG helper configuration or upstream availability.');return}}await sleep(3000+i*1500)}status('BGG is still preparing this collection. Select Load Collection to retry.')}
function filtered(){const q=$('search').value.toLowerCase().trim();const a=games.filter(g=>g.name.toLowerCase().includes(q));if($('sort').value==='year')a.sort((a,b)=>b.year-a.year||a.name.localeCompare(b.name));else if($('sort').value==='random')a.sort((a,b)=>hash(+a.id)-hash(+b.id));else a.sort((a,b)=>a.name.localeCompare(b.name));return a}
function cover(g){const b=document.createElement('button');b.className='cover';b.style.setProperty('--i',renderId++);b.title=g.name;b.setAttribute('aria-label',g.name);if(g.image){const im=document.createElement('img');im.src=g.image.replace(/^http:/,'https:');im.loading='lazy';im.decoding='async';im.alt=g.name;im.onerror=()=>{im.remove();b.textContent=g.name};b.append(im)}else b.textContent=g.name;b.onclick=()=>{$('detail').innerHTML='<div class="detail">'+(g.image?'<img src="'+esc(g.image.replace(/^http:/,'https:'))+'">':'')+'<div><h2>'+esc(g.name)+'</h2><p>'+esc(g.year||'Year unknown')+'</p><a target="_blank" rel="noopener" href="https://boardgamegeek.com/boardgame/'+encodeURIComponent(g.id)+'">View on BGG ↗</a></div></div>';$('modal').showModal()};return b}

function renderPlinko(all){
 const shell=document.createElement('div');shell.className='plinko-shell';
 shell.innerHTML='<div class="plinko-toolbar"><button id="plinko-start">▶ Drop covers</button><button id="plinko-pause">Ⅱ Pause</button><button id="plinko-reset">↻ Reset</button><label>Drop count <select id="plinko-count"><option value="20">20</option><option value="50" selected>50</option><option value="100">100</option><option value="250">250</option></select></label><label>Buckets <select id="plinko-buckets"><option value="5">5</option><option value="7" selected>7</option><option value="9">9</option></select></label></div><div class="plinko-board" aria-label="Physics-based Plinko board with peg collisions and bucket dividers"><div class="plinko-launcher"></div></div><div class="plinko-summary" aria-live="polite">Press Drop covers. Buckets are determined by collisions, not selected in advance.</div>';
 stage.append(shell);
 const board=shell.querySelector('.plinko-board'),summary=shell.querySelector('.plinko-summary'),start=shell.querySelector('#plinko-start'),pause=shell.querySelector('#plinko-pause'),reset=shell.querySelector('#plinko-reset'),count=shell.querySelector('#plinko-count'),bucketSelect=shell.querySelector('#plinko-buckets');
 let raf=0,running=false,paused=false,launched=0,landed=0,items=[],counts=[],pegs=[],nextAt=0,previous=0,acc=0,round=0;
 const width=()=>board.clientWidth,height=()=>board.clientHeight;
 const radius=()=>Math.max(12,Math.min(20,width()/25));
 const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
 const STEP=1/120,GRAVITY=1050,RESTITUTION=.64,PEG_BOUNCE=.77;
 function position(item){item.el.style.transform='translate3d('+(item.x-item.r)+'px,'+(item.y-item.r)+'px,0) rotate('+item.angle+'rad)'}
 function drawBoard(){
  board.querySelectorAll('.plinko-peg,.plinko-bucket,.plinko-chip,.plinko-divider').forEach(x=>x.remove());
  items=[];pegs=[];counts=Array(+bucketSelect.value).fill(0);launched=0;landed=0;
  const w=width(),h=height(),n=counts.length,rows=9,spacing=w/(n+1);
  board.style.setProperty('--chip',radius()*2+'px');
  for(let row=0;row<rows;row++){
   const y=85+row*(h-240)/(rows-1);
   const stagger=row%2?.5:0;
   for(let j=1;j<=n;j++){
    const x=(j+stagger)*spacing;if(x>w-20)continue;
    pegs.push({x,y,r:5});
    const peg=document.createElement('span');peg.className='plinko-peg';peg.style.left=(x-3.5)+'px';peg.style.top=(y-3.5)+'px';board.append(peg);
   }
  }
  for(let i=0;i<n;i++){
   const bucket=document.createElement('div');bucket.className='plinko-bucket';bucket.style.left=i/n*100+'%';bucket.style.width=100/n+'%';
   bucket.innerHTML='<strong>0</strong><small>Bucket '+(i+1)+'</small>';board.append(bucket);
  }
  for(let i=1;i<n;i++){
   const divider=document.createElement('div');divider.className='plinko-divider';divider.style.left=i/n*100+'%';board.append(divider);
  }
  summary.textContent='Ready · '+all.length.toLocaleString()+' covers · physical peg and wall collisions';
 }
 function updateSummary(){summary.textContent=landed+' landed · '+launched+' dropped · '+Math.max(0,Math.min(+count.value,all.length)-launched)+' remaining'}
 function spawn(){
  if(launched>=Math.min(+count.value,all.length))return;
  const r=radius(),w=width(),g=all[(round*251+launched*13+Math.floor(Math.random()*all.length))%all.length];
  const el=cover(g);el.className='plinko-chip';el.style.width=r*2+'px';el.style.height=r*2+'px';board.append(el);
  const item={el,x:w/2+(Math.random()-.5)*Math.min(18,w*.04),y:r+8,vx:(Math.random()-.5)*28,vy:0,r,angle:0,spin:0,done:false,settle:0};
  items.push(item);position(item);launched++;
 }
 function collideCircle(item,peg){
  const dx=item.x-peg.x,dy=item.y-peg.y,min=item.r+peg.r;
  let d2=dx*dx+dy*dy;if(d2>=min*min)return;
  if(d2<.0001){item.x+=.01;d2=.0001}
  const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
  item.x+=nx*(min-d+.15);item.y+=ny*(min-d+.15);
  const vn=item.vx*nx+item.vy*ny;
  if(vn<0){item.vx-=(1+PEG_BOUNCE)*vn*nx;item.vy-=(1+PEG_BOUNCE)*vn*ny;item.vx+=(Math.random()-.5)*9;item.spin+=nx*2}
 }
 function collideDivider(item,x,top,bottom){
  const cx=clamp(item.x,x-2,x+2),cy=clamp(item.y,top,bottom),dx=item.x-cx,dy=item.y-cy;
  const d2=dx*dx+dy*dy;if(d2>=item.r*item.r)return;
  const d=Math.sqrt(Math.max(d2,.0001)),nx=d2<.0001?(item.x<x?-1:1):dx/d,ny=d2<.0001?0:dy/d;
  item.x+=nx*(item.r-d+.2);item.y+=ny*(item.r-d+.2);
  const vn=item.vx*nx+item.vy*ny;if(vn<0){item.vx-=(1+RESTITUTION)*vn*nx;item.vy-=(1+RESTITUTION)*vn*ny;item.spin+=nx*.7}
 }
 function step(dt){
  const w=width(),h=height(),n=counts.length,binTop=h-90,floor=h-19;
  for(const item of items){
   if(item.done)continue;
   item.vy+=GRAVITY*dt;item.vx*=.9993;
   item.x+=item.vx*dt;item.y+=item.vy*dt;
   if(item.x<item.r){item.x=item.r;item.vx=Math.abs(item.vx)*RESTITUTION}
   if(item.x>w-item.r){item.x=w-item.r;item.vx=-Math.abs(item.vx)*RESTITUTION}
   for(const peg of pegs)if(Math.abs(item.y-peg.y)<item.r+peg.r+2&&Math.abs(item.x-peg.x)<item.r+peg.r+2)collideCircle(item,peg);
   if(item.y+item.r>=binTop)for(let k=1;k<n;k++)collideDivider(item,k*w/n,binTop,floor);
   if(item.y+item.r>floor){item.y=floor-item.r;if(item.vy>0)item.vy=-item.vy*.24;item.vx*=.83;item.spin*=.7}
   item.spin*=.992;item.angle+=item.spin*dt;
   if(item.y+item.r>=floor-.5&&Math.abs(item.vy)<22&&Math.abs(item.vx)<24)item.settle+=dt;else item.settle=0;
   if(item.settle>.28){item.done=true;item.vx=0;item.vy=0;item.spin=0;const bucket=clamp(Math.floor(item.x/w*n),0,n-1);counts[bucket]++;board.querySelectorAll('.plinko-bucket strong')[bucket].textContent=counts[bucket];landed++;updateSummary()}
   position(item);
  }
 }
 function frame(now){
  if(!running||paused)return;
  const delta=Math.min(.05,(now-(previous||now))/1000);previous=now;acc=Math.min(.1,acc+delta);
  if(launched<Math.min(+count.value,all.length)&&now>=nextAt){spawn();nextAt=now+(motion?260:85)}
  let loops=0;while(acc>=STEP&&loops++<12){step(STEP);acc-=STEP}
  if(landed>=Math.min(+count.value,all.length)){running=false;start.textContent='▶ Drop again';return}
  raf=requestAnimationFrame(frame);
 }
 function begin(){drawBoard();round++;running=true;paused=false;previous=0;acc=0;nextAt=0;start.textContent='▶ Restart';pause.textContent='Ⅱ Pause';raf=requestAnimationFrame(frame)}
 start.onclick=()=>{cancelAnimationFrame(raf);begin()};
 pause.onclick=()=>{if(!running)return;paused=!paused;pause.textContent=paused?'▶ Resume':'Ⅱ Pause';if(paused)cancelAnimationFrame(raf);else{previous=0;raf=requestAnimationFrame(frame)}};
 reset.onclick=()=>{cancelAnimationFrame(raf);running=false;paused=false;drawBoard();start.textContent='▶ Drop covers';pause.textContent='Ⅱ Pause'};
 count.onchange=reset.onclick;bucketSelect.onchange=reset.onclick;
 const observer=new ResizeObserver(()=>{if(!running)drawBoard()});observer.observe(board);
 stopPlinko=()=>{cancelAnimationFrame(raf);observer.disconnect();running=false};
 drawBoard();
}

function render(){if(stopPlinko){stopPlinko();stopPlinko=null}const a=filtered(),size=+$('size').value;renderId=0;stage.classList.remove('enter');stage.replaceChildren();stage.style.setProperty('--sz',size+'px');if(!a.length){stage.innerHTML='<div class="empty">'+(games.length?'No matching covers.':'Waiting for BGG collection…')+'</div>';return}if(mode==='plinko'){renderPlinko(a);return}if(mode==='grid'){const el=document.createElement('div');el.className='grid';a.forEach(g=>el.append(cover(g)));stage.append(el)}else if(mode==='masonry'){const el=document.createElement('div');el.className='masonry';el.style.setProperty('--cols',Math.max(2,Math.floor(stage.clientWidth/(size+12))));a.forEach((g,i)=>{const b=cover(g);b.style.setProperty('--ratio',i%4===0?'.8':i%3===0?'1.2':'1');el.append(b)});stage.append(el)}else if(mode==='pile'){const el=document.createElement('div');el.className='pile';const count=Math.min(a.length,450),w=Math.max(250,stage.clientWidth-30),h=Math.max(560,Math.ceil(count/Math.max(3,Math.floor(w/(size*.6))))*size*.5);el.style.height=h+'px';a.slice(0,count).forEach((g,i)=>{const b=cover(g);b.style.left=hash(i*3)*(w-size)+'px';b.style.top=hash(i*3+1)*(h-size)+'px';b.style.transform='rotate('+((hash(i*3+2)-.5)*42)+'deg)';b.style.zIndex=i+1;el.append(b)});stage.append(el)}else if(mode==='galaxy'){const v=document.createElement('div');v.className='galaxy-wrap';const f=document.createElement('div');f.className='galaxy';const count=Math.min(a.length,850),r=Math.max(500,Math.sqrt(count)*size*.64),extent=2*r+size;f.style.width=extent+'px';f.style.height=extent+'px';a.slice(0,count).forEach((g,i)=>{const b=cover(g),t=i*2.399963,r2=Math.sqrt((i+.5)/count)*r;b.style.left=r+r2*Math.cos(t)+'px';b.style.top=r+r2*Math.sin(t)+'px';f.append(b)});v.append(f);const hint=document.createElement('div');hint.className='hint';hint.textContent='Drag to pan · Scroll to zoom · '+count+' covers';v.append(hint);stage.append(v);scale=Math.min(.9,v.clientWidth/extent,v.clientHeight/extent);panX=(v.clientWidth-extent*scale)/2;panY=(v.clientHeight-extent*scale)/2;const update=()=>f.style.transform='translate('+panX+'px,'+panY+'px) scale('+scale+')';update();let drag=null;v.onwheel=e=>{e.preventDefault();const box=v.getBoundingClientRect(),x=e.clientX-box.left,y=e.clientY-box.top,next=Math.max(.1,Math.min(4,scale*(e.deltaY<0?1.15:.87))),ratio=next/scale;panX=x-(x-panX)*ratio;panY=y-(y-panY)*ratio;scale=next;update()};v.onpointerdown=e=>{if(e.target.closest('.cover'))return;drag={x:e.clientX,y:e.clientY,px:panX,py:panY};v.setPointerCapture(e.pointerId)};v.onpointermove=e=>{if(!drag)return;panX=drag.px+e.clientX-drag.x;panY=drag.py+e.clientY-drag.y;update()};v.onpointerup=v.onpointercancel=()=>drag=null}else{const el=document.createElement('div');el.className='shelves';const per=Math.max(3,Math.floor((stage.clientWidth-30)/(size+8)));for(let i=0;i<a.length;i+=per){const sec=document.createElement('section'),label=document.createElement('div'),shelf=document.createElement('div');label.className='shelf-label';label.textContent='Shelf '+(Math.floor(i/per)+1);shelf.className='shelf';a.slice(i,i+per).forEach(g=>shelf.append(cover(g)));sec.append(label,shelf);el.append(sec)}stage.append(el)}if(motion){void stage.offsetWidth;stage.classList.add('enter')}}
$('motion').onclick=()=>{motion=!motion;document.body.classList.toggle('motion-off',!motion);$('motion').textContent=motion?'✦ Motion On':'○ Motion Off';$('motion').setAttribute('aria-pressed',String(motion));if(!motion)stage.classList.remove('enter')};$('load').onclick=load;$('scope').onchange=load;$('search').oninput=render;$('sort').onchange=render;$('size').oninput=render;$('shuffle').onclick=()=>{seed++;$('sort').value='random';render()};$('close').onclick=()=>$('modal').close();document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));render()});load();
</script></body></html>
