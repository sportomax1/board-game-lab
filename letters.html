<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Letter Cloud | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🔤</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .word-item {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            border-radius: 1rem;
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }
        
        .word-item:hover {
            transform: scale(1.1) rotate(3deg);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        input[type="radio"] {
            appearance: none;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        input[type="radio"]:checked {
            border-color: #10b981;
            background: #10b981;
        }

        .list-item {
            transition: all 0.2s;
        }

        .list-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-emerald-500/30">
    <!-- Background Decor -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-blue-900/20 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[10%] right-[0%] w-[50%] h-[50%] bg-emerald-900/10 blur-[120px] rounded-full"></div>
    </div>

    <div class="relative z-10 max-w-6xl mx-auto w-full px-4 py-8 md:py-12 flex flex-col min-h-screen">
        <!-- Header -->
        <header class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-12">
            <div class="space-y-2">
                <div class="flex items-center gap-3">
                    <span class="text-3xl md:text-4xl">🔤</span>
                    <h1 class="text-4xl md:text-5xl font-black italic uppercase tracking-tighter leading-none">
                        Letter <span class="text-emerald-400">Cloud</span>
                    </h1>
                </div>
                <p class="text-slate-400 font-medium max-w-md italic uppercase text-[10px] tracking-widest">Analyze character frequencies in your board game collection</p>
            </div>
            
            <div class="flex items-center gap-3">
                <a href="index.html" class="glass px-6 py-2 rounded-2xl border border-white/10 hover:bg-white/10 transition-all text-[10px] font-black uppercase tracking-widest flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                    Back
                </a>
            </div>
        </header>

        <!-- Controls -->
        <div class="glass rounded-[2.5rem] p-6 mb-8 border border-white/10 flex flex-wrap gap-8 items-center justify-between">
            <div class="flex flex-col gap-2">
                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">BGG Username</label>
                <input type="text" id="username" value="sportomax" class="bg-white/5 border border-white/10 rounded-2xl px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500/50 transition-all font-medium text-sm w-48">
            </div>

            <div class="flex flex-col gap-3">
                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Filter View</label>
                <div class="flex gap-4">
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input type="radio" name="filter" value="all" checked onchange="updateFilter()">
                        <span class="text-xs font-bold text-slate-400 group-hover:text-white transition-colors">All</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input type="radio" name="filter" value="alpha" onchange="updateFilter()">
                        <span class="text-xs font-bold text-slate-400 group-hover:text-white transition-colors">Letters</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input type="radio" name="filter" value="alphanumeric" onchange="updateFilter()">
                        <span class="text-xs font-bold text-slate-400 group-hover:text-white transition-colors">Alphanumeric</span>
                    </label>
                </div>
            </div>

            <button onclick="loadData()" class="bg-emerald-500 text-white px-8 py-3 rounded-2xl font-black text-sm uppercase tracking-widest hover:bg-emerald-400 transition-all shadow-xl shadow-emerald-500/20 active:scale-95">
                Run Analysis
            </button>
        </div>

        <!-- Stats Bar -->
        <div id="stats" class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-8"></div>

        <!-- Loading State -->
        <div id="loading" class="hidden flex flex-col items-center justify-center py-20 space-y-6">
            <div class="w-12 h-12 border-4 border-emerald-500/20 border-t-emerald-500 rounded-full animate-spin"></div>
            <p class="text-slate-500 font-black uppercase tracking-widest text-[10px]">Analyzing Collection</p>
        </div>

        <div id="errorContainer"></div>

        <!-- Content Area -->
        <div id="content" class="hidden flex-1 grid grid-cols-1 lg:grid-cols-2 gap-8 mb-12">
            <div class="glass rounded-[2.5rem] p-8 border border-white/10 flex flex-col">
                <div class="flex items-center justify-between mb-8">
                    <h2 class="text-lg font-black italic uppercase tracking-tighter italic">Character <span class="text-emerald-400">Cloud</span></h2>
                </div>
                <div id="wordCloud" class="flex flex-wrap gap-3 content-start"></div>
            </div>

            <div class="glass rounded-[2.5rem] p-8 border border-white/10 flex flex-col h-fit">
                <div class="flex items-center justify-between mb-8">
                    <h2 class="text-lg font-black italic uppercase tracking-tighter italic">Frequency <span class="text-emerald-400">List</span></h2>
                </div>
                <div id="sortedList" class="space-y-1 overflow-y-auto max-h-[600px] custom-scrollbar pr-2"></div>
            </div>
        </div>
    </div>

    <script>
        let currentFilter = 'all';
        let allCharacters = {};
        let originalCharacters = {};
        let isLoaded = false;

        function updateFilter() {
            if (!isLoaded) return;
            currentFilter = document.querySelector('input[name="filter"]:checked').value;
            filterAndRender();
        }

        function filterAndRender() {
            if (currentFilter === 'all') {
                allCharacters = { ...originalCharacters };
            } else if (currentFilter === 'alpha') {
                allCharacters = {};
                Object.keys(originalCharacters).forEach(char => {
                    if (/[a-zA-Z]/.test(char)) allCharacters[char] = originalCharacters[char];
                });
            } else if (currentFilter === 'alphanumeric') {
                allCharacters = {};
                Object.keys(originalCharacters).forEach(char => {
                    if (/[a-zA-Z0-9]/.test(char)) allCharacters[char] = originalCharacters[char];
                });
            }
            
            renderCloud();
            renderList();
            updateStats();
        }

        async function loadData() {
            const username = document.getElementById('username').value.trim() || 'sportomax';
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('content').classList.add('hidden');
            document.getElementById('errorContainer').innerHTML = '';
            
            try {
                const res = await fetch('/api/bgg-helper?endpoint=collection&username=' + encodeURIComponent(username) + '&own=1&stats=1');
                const xml = await res.text();
                
                if (res.status !== 200 || xml.includes('<!DOCTYPE html>')) throw new Error('Failed to fetch data');
                
                const parser = new DOMParser().parseFromString(xml, 'text/xml');
                const items = Array.from(parser.querySelectorAll('item'));
                
                if (items.length === 0) throw new Error('No games found');
                
                originalCharacters = {};
                items.forEach(item => {
                    const name = item.querySelector('name')?.textContent || '';
                    if (name) {
                        name.split('').forEach(char => {
                            const key = /[a-zA-Z]/.test(char) ? char.toUpperCase() : char;
                            originalCharacters[key] = (originalCharacters[key] || 0) + 1;
                        });
                    }
                });
                
                isLoaded = true;
                updateFilter();
                
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
                document.getElementById('content').classList.add('animate-in');
            } catch (err) {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('errorContainer').innerHTML = `
                    <div class="glass p-8 rounded-[2rem] border-rose-500/30 text-center text-rose-400 font-bold italic">
                        ⚠️ ${err.message}. Please check username and try again.
                    </div>
                `;
            }
        }

        function renderCloud() {
            const cloudDiv = document.getElementById('wordCloud');
            const sorted = Object.entries(allCharacters).sort((a, b) => b[1] - a[1]);
            
            if (sorted.length === 0) {
                cloudDiv.innerHTML = '<p class="text-slate-500 text-sm font-medium italic">No characters to display</p>';
                return;
            }
            
            const maxCount = sorted[0][1];
            const minCount = sorted[sorted.length - 1][1];
            
            cloudDiv.innerHTML = sorted.map(([char, count]) => {
                const size = 0.75 + (1.5 * (count - minCount) / (maxCount - minCount || 1));
                let colorClass = 'bg-emerald-500';
                if (/[0-9]/.test(char)) colorClass = 'bg-blue-500';
                else if (!/[a-zA-Z]/.test(char)) colorClass = 'bg-amber-500';
                
                return `
                    <div class="word-item ${colorClass} text-white shadow-lg shadow-${colorClass.split('-')[1]}-500/10" 
                         style="font-size: ${size}rem;" title="${char}: ${count}">
                        ${escapeHtml(char === ' ' ? '␣' : char)}
                    </div>
                `;
            }).join('');
        }

        function renderList() {
            const listDiv = document.getElementById('sortedList');
            const sorted = Object.entries(allCharacters).sort((a, b) => b[1] - a[1]);
            const total = sorted.reduce((sum, [_, count]) => sum + count, 0);
            
            listDiv.innerHTML = sorted.map(([char, count]) => {
                const percent = ((count / total) * 100).toFixed(1);
                const charType = /[a-zA-Z]/.test(char) ? '🔤' : /[0-9]/.test(char) ? '🔢' : '🔣';
                const charTypeColor = /[a-zA-Z]/.test(char) ? 'text-emerald-400' : /[0-9]/.test(char) ? 'text-blue-400' : 'text-amber-400';
                
                return `
                    <div class="list-item flex items-center justify-between p-3 rounded-2xl">
                        <div class="flex items-center gap-3">
                            <span class="text-[10px] ${charTypeColor}">${charType}</span>
                            <span class="text-lg font-black text-white italic">${escapeHtml(char === ' ' ? 'SPACE' : char)}</span>
                        </div>
                        <div class="flex items-center gap-4">
                            <span class="bg-white/5 px-3 py-1 rounded-full text-[10px] font-black text-emerald-400">${count}</span>
                            <span class="text-[10px] font-bold text-slate-500 w-10 text-right">${percent}%</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateStats() {
            const statsDiv = document.getElementById('stats');
            const total = Object.values(allCharacters).reduce((sum, count) => sum + count, 0);
            const unique = Object.keys(allCharacters).length;
            let letters = 0, numbers = 0, symbols = 0;
            
            Object.entries(allCharacters).forEach(([char, count]) => {
                if (/[a-zA-Z]/.test(char)) letters += count;
                else if (/[0-9]/.test(char)) numbers += count;
                else symbols += count;
            });
            
            const createStat = (label, value, color) => `
                <div class="glass p-4 rounded-3xl border border-white/5 flex flex-col items-center">
                    <span class="text-[8px] font-black uppercase tracking-widest text-slate-500 mb-1">${label}</span>
                    <span class="text-xl font-black ${color}">${value}</span>
                </div>
            `;
            
            statsDiv.innerHTML = `
                ${createStat('Total', total, 'text-white')}
                ${createStat('Unique', unique, 'text-emerald-400')}
                ${createStat('Letters', letters, 'text-emerald-400')}
                ${createStat('Numbers', numbers, 'text-blue-400')}
                ${createStat('Symbols', symbols, 'text-amber-400')}
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
    <script type="module" src="analytics-init.js"></script>
</body>
</html>
