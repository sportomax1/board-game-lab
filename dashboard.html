<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGG Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .dashboard-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1rem;
            position: relative;
            min-height: 0; /* Critical for flex child height constraint */
        }

        .grid-layout {
            display: grid;
            gap: 0.75rem;
            flex: 1;
            min-height: 0;
        }

        /* Desktop: 5x2 */
        @media (min-width: 1024px) {
            .grid-layout {
                grid-template-columns: repeat(5, 1fr);
                grid-template-rows: repeat(2, 1fr);
            }
        }

        /* Mobile: 2x5 */
        @media (max-width: 1023px) {
            .grid-layout {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(5, 1fr);
            }
        }

        .game-card {
            position: relative;
            border-radius: 0.75rem;
            overflow: hidden;
            background: #1e293b;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }

        .game-card img {
            max-width: 100%;
            max-height: 80%; /* Leave room for name */
            object-fit: contain;
            padding: 0.5rem;
        }

        .game-name-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(2px);
            padding: 0.25rem 0.5rem;
            text-align: center;
        }

        .game-name-text {
            color: #f8fafc;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.025em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-guide {
            position: absolute;
            inset: 0;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 40;
            transition: opacity 0.3s ease;
        }

        .guide-item {
            padding: 0.75rem 2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            font-size: 1.25rem;
        }

        .guide-item.active {
            color: #6366f1;
            transform: scale(1.2);
        }

        .guide-item.past {
            color: rgba(255, 255, 255, 0.1);
            font-size: 0.875rem;
        }

        .guide-item.next {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1rem;
        }

        .game-rank {
            position: absolute;
            top: 0.75rem;
            left: 0.75rem;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-weight: 800;
            font-size: 0.875rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .timer-bar-container {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 50;
        }

        #timer-bar {
            height: 100%;
            background: #6366f1;
            width: 0%;
        }

        .fade-enter {
            opacity: 0;
            transform: translateY(10px);
        }
        .fade-exit {
            opacity: 1;
            transform: translateY(0);
        }

        .status-badge {
            background: rgba(99, 102, 241, 0.1);
            color: #818cf8;
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.75rem;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .loading-overlay {
            position: absolute;
            inset: 0;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <div id="loading" class="loading-overlay">
        <div class="flex flex-col items-center gap-4">
            <div class="w-12 h-12 border-4 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin"></div>
            <p class="text-indigo-400 font-bold animate-pulse">Initializing Dashboards...</p>
        </div>
    </div>

    <div class="timer-bar-container">
        <div id="timer-bar"></div>
    </div>

    <header class="p-6 md:px-12 flex justify-between items-center border-b border-slate-800 bg-slate-900/50 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 p-2 rounded-lg">
                <i class="fa-solid fa-chart-line text-white"></i>
            </div>
            <div>
                <h1 id="dashboard-title" class="text-xl font-black tracking-tight">LOADING...</h1>
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Live BGG Feed</p>
            </div>
        </div>
        <div id="dashboard-status" class="status-badge flex items-center gap-2">
            <span class="w-2 h-2 bg-indigo-500 rounded-full animate-ping"></span>
            UPDATING
        </div>
    </header>

    <main class="dashboard-container">
        <div id="channel-guide" class="channel-guide hidden">
            <!-- Channel items will be injected here -->
        </div>
        <div id="game-grid" class="grid-layout">
            <!-- Game cards will be injected here -->
        </div>
    </main>

    <footer class="p-4 text-center text-[10px] text-slate-600 font-bold uppercase tracking-[0.2em] border-t border-slate-800">
        BoardGameGeek Dashboard &bull; sportomax1
    </footer>

    <script>
        const USERNAME = 'sportomax';
        const ROTATION_INTERVAL = 12000; // 12 seconds total (10s view + 2s guide)
        const GUIDE_DURATION = 2000;
        const DASHBOARDS = ['PLAYS', 'HOT', 'RANKED', 'TOP_RATED', 'MOST_PLAYED'];
        let currentIdx = 0;
        let timerStart = Date.now();
        let cache = {
            PLAYS: [],
            HOT: [],
            RANKED: [],
            TOP_RATED: [],
            MOST_PLAYED: []
        };

        const els = {
            title: document.getElementById('dashboard-title'),
            grid: document.getElementById('game-grid'),
            guide: document.getElementById('channel-guide'),
            timerBar: document.getElementById('timer-bar'),
            loading: document.getElementById('loading')
        };

        async function fetchAPI(endpoint, params = '') {
            const url = `/api/bgg-helper?endpoint=${endpoint}${params}`;
            try {
                const res = await fetch(url);
                if (res.status === 202) {
                    await new Promise(r => setTimeout(r, 2000));
                    return fetchAPI(endpoint, params);
                }
                return await res.text();
            } catch (e) {
                console.error(`Fetch error for ${endpoint}:`, e);
                return null;
            }
        }

        async function loadData() {
            console.log('Fetching all dashboard data...');
            
            // 1. Fetch Hot Games
            const hotXml = await fetchAPI('hot', '&type=boardgame');
            if (hotXml) {
                const doc = new DOMParser().parseFromString(hotXml, 'text/xml');
                cache.HOT = Array.from(doc.querySelectorAll('item')).slice(0, 10).map(item => ({
                    id: item.getAttribute('id'),
                    name: item.querySelector('name')?.getAttribute('value'),
                    thumb: item.querySelector('thumbnail')?.getAttribute('value'),
                    rank: item.getAttribute('rank')
                }));
            }

            // 2. Fetch Last 10 Plays
            const playsXml = await fetchAPI('plays', `&username=${USERNAME}`);
            if (playsXml) {
                const doc = new DOMParser().parseFromString(playsXml, 'text/xml');
                const playItems = Array.from(doc.querySelectorAll('play')).slice(0, 10);
                const playIds = playItems.map(p => p.querySelector('item').getAttribute('objectid'));
                
                const thingXml = await fetchAPI('thing', `&id=${playIds.join(',')}`);
                if (thingXml) {
                    const tDoc = new DOMParser().parseFromString(thingXml, 'text/xml');
                    cache.PLAYS = Array.from(tDoc.querySelectorAll('item')).map((item, idx) => ({
                        id: item.getAttribute('id'),
                        name: item.querySelector('name[type="primary"]')?.getAttribute('value'),
                        thumb: item.querySelector('thumbnail')?.textContent,
                        rank: idx + 1
                    }));
                }
            }

            // 3. Fetch Top 10 Ranked
            const browseHtml = await fetchAPI('browse', '&page=1');
            if (browseHtml) {
                const idRegex = /href="\/boardgame\/(\d+)\/[^"]*"/g;
                let match;
                const rankedIds = [];
                while ((match = idRegex.exec(browseHtml)) !== null && rankedIds.length < 10) {
                    if (!rankedIds.includes(match[1])) rankedIds.push(match[1]);
                }
                if (rankedIds.length > 0) {
                    const thingXml = await fetchAPI('thing', `&id=${rankedIds.join(',')}`);
                    if (thingXml) {
                        const tDoc = new DOMParser().parseFromString(thingXml, 'text/xml');
                        cache.RANKED = Array.from(tDoc.querySelectorAll('item')).map((item, idx) => ({
                            id: item.getAttribute('id'),
                            name: item.querySelector('name[type="primary"]')?.getAttribute('value'),
                            thumb: item.querySelector('thumbnail')?.textContent,
                            rank: idx + 1
                        }));
                    }
                }
            }

            // 4. Fetch Collection for TOP_RATED and MOST_PLAYED
            const collXml = await fetchAPI('collection', `&username=${USERNAME}&stats=1&own=1`);
            if (collXml) {
                const doc = new DOMParser().parseFromString(collXml, 'text/xml');
                const items = Array.from(doc.querySelectorAll('item'));
                
                // TOP_RATED
                cache.TOP_RATED = items
                    .filter(it => it.querySelector('stats')?.querySelector('rating')?.getAttribute('value') !== 'N/A')
                    .sort((a, b) => {
                        const ra = parseFloat(a.querySelector('stats')?.querySelector('rating')?.getAttribute('value') || 0);
                        const rb = parseFloat(b.querySelector('stats')?.querySelector('rating')?.getAttribute('value') || 0);
                        return rb - ra;
                    })
                    .slice(0, 10)
                    .map((item, idx) => ({
                        id: item.getAttribute('objectid'),
                        name: item.querySelector('name')?.textContent,
                        thumb: item.querySelector('thumbnail')?.textContent,
                        rank: idx + 1
                    }));

                // MOST_PLAYED
                cache.MOST_PLAYED = items
                    .sort((a, b) => {
                        const pa = parseInt(a.querySelector('numplays')?.textContent || 0);
                        const pb = parseInt(b.querySelector('numplays')?.textContent || 0);
                        return pb - pa;
                    })
                    .slice(0, 10)
                    .map((item, idx) => ({
                        id: item.getAttribute('objectid'),
                        name: item.querySelector('name')?.textContent,
                        thumb: item.querySelector('thumbnail')?.textContent,
                        rank: idx + 1
                    }));
            }

            els.loading.style.opacity = '0';
            setTimeout(() => els.loading.style.display = 'none', 500);
            
            rotate();
            setInterval(updateTimer, 50);
        }

        async function rotate() {
            // SHOW CHANNEL GUIDE
            const type = DASHBOARDS[currentIdx];
            els.guide.innerHTML = DASHBOARDS.map((d, i) => {
                let cls = 'guide-item';
                if (i === currentIdx) cls += ' active';
                else if (i === (currentIdx - 1 + DASHBOARDS.length) % DASHBOARDS.length) cls += ' past';
                else if (i === (currentIdx + 1) % DASHBOARDS.length) cls += ' next';
                return `<div class="${cls}">${getShortTitle(d)}</div>`;
            }).join('');
            
            els.guide.classList.remove('hidden');
            els.guide.style.opacity = '1';
            els.grid.style.opacity = '0.3';
            els.title.innerText = 'SELECTING CHANNEL...';
            
            timerStart = Date.now();
            await new Promise(r => setTimeout(r, GUIDE_DURATION));

            // SHOW DASHBOARD
            const data = cache[type] || [];
            els.guide.style.opacity = '0';
            setTimeout(() => els.guide.classList.add('hidden'), 300);
            els.grid.style.opacity = '1';
            
            els.title.innerText = getTitle(type);
            renderGrid(data);

            currentIdx = (currentIdx + 1) % DASHBOARDS.length;
            
            setTimeout(rotate, ROTATION_INTERVAL - GUIDE_DURATION);
        }

        function getShortTitle(type) {
            switch(type) {
                case 'PLAYS': return 'RECENT PLAYS';
                case 'HOT': return 'HOT GAMES';
                case 'RANKED': return 'TOP RANKED';
                case 'TOP_RATED': return 'YOUR TOP RATED';
                case 'MOST_PLAYED': return 'MOST PLAYED';
                default: return type;
            }
        }

        function getTitle(type) {
            switch(type) {
                case 'PLAYS': return `LAST 10 PLAYS: ${USERNAME.toUpperCase()}`;
                case 'HOT': return 'TOP 10 HOT GAMES';
                case 'RANKED': return 'TOP 10 RANKED GAMES';
                case 'TOP_RATED': return 'TOP 10 RATED BY YOU';
                case 'MOST_PLAYED': return 'TOP 10 MOST PLAYED';
                default: return 'BGG DASHBOARD';
            }
        }

        function renderGrid(data) {
            els.grid.innerHTML = '';
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'game-card animate-in fade-in zoom-in duration-500';
                
                const thumb = item.thumb || 'https://via.placeholder.com/300?text=No+Image';
                const proxiedThumb = `/api/image-proxy?url=${encodeURIComponent(thumb)}`;
                
                card.innerHTML = `
                    <img src="${proxiedThumb}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/300?text=Error'">
                    <div class="game-rank">#${item.rank}</div>
                    <div class="game-name-overlay">
                        <div class="game-name-text">${item.name}</div>
                    </div>
                `;
                els.grid.appendChild(card);
            });
        }

        function updateTimer() {
            const elapsed = Date.now() - timerStart;
            const percent = Math.min((elapsed / ROTATION_INTERVAL) * 100, 100);
            els.timerBar.style.width = `${percent}%`;
        }

        window.onload = loadData;
    </script>
</body>
</html>
