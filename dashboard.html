<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGG Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .dashboard-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0.5rem;
            position: relative;
            min-height: 0; /* Critical for flex child height constraint */
        }

        /* Even less padding on larger screens */
        @media (min-width: 1024px) {
            .dashboard-container {
                padding: 0.35rem;
            }
        }

        @media (min-width: 1920px) {
            .dashboard-container {
                padding: 0.25rem;
            }
        }

        .grid-layout {
            display: grid;
            gap: 0.4rem;
            flex: 1;
            min-height: 0;
        }

        /* Smaller gaps on larger screens */
        @media (min-width: 1024px) {
            .grid-layout {
                gap: 0.3rem;
            }
        }

        @media (min-width: 1920px) {
            .grid-layout {
                gap: 0.25rem;
            }
        }

        /* Desktop: 5x2 */
        @media (min-width: 1024px) {
            .grid-layout {
                grid-template-columns: repeat(5, 1fr);
                grid-template-rows: repeat(2, 1fr);
            }
        }

        /* Mobile: 2x5 */
        @media (max-width: 1023px) {
            .grid-layout {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(5, 1fr);
            }
        }

        .game-card {
            position: relative;
            border-radius: 0.5rem;
            overflow: hidden;
            background: #1e293b;
            box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }

        /* Minimal border radius on larger screens */
        @media (min-width: 1920px) {
            .game-card {
                border-radius: 0.35rem;
            }
        }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 0.25rem;
        }

        /* Maximize on larger screens (laptop/monitor) */
        @media (min-width: 1024px) {
            .game-card img {
                width: 100%;
                height: 100%;
                padding: 0.2rem;
            }
        }

        /* Maximum fill on TV/large monitors */
        @media (min-width: 1920px) {
            .game-card img {
                width: 100%;
                height: 100%;
                padding: 0.15rem;
            }
        }

        .game-name-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(2px);
            padding: 0.1rem 0.4rem;
            text-align: center;
        }

        @media (min-width: 1920px) {
            .game-name-overlay {
                padding: 0.15rem 0.5rem;
            }
        }

        .game-name-text {
            color: #f8fafc;
            font-size: 0.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1;
        }

        @media (min-width: 768px) {
            .game-name-text {
                font-size: 0.55rem;
            }
        }

        @media (min-width: 1024px) {
            .game-name-text {
                font-size: 0.6rem;
            }
        }

        @media (min-width: 1920px) {
            .game-name-text {
                font-size: 0.7rem;
                letter-spacing: 0.03em;
            }
        }

        .channel-guide {
            position: absolute;
            inset: 0;
            background: #0f172a;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.5rem;
            padding: 2rem;
            align-content: center;
            justify-items: center;
            z-index: 40;
            transition: opacity 0.3s ease;
            overflow-y: auto;
        }

        .guide-item {
            padding: 1rem 1.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
            font-size: 0.75rem;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            width: 100%;
            text-align: center;
            background: rgba(15, 23, 42, 0.5);
        }

        .guide-item.active {
            color: #6366f1;
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.15);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
        }

        .guide-item.next {
            color: rgba(255, 255, 255, 0.7);
            border-color: rgba(34, 197, 94, 0.5);
            background: rgba(34, 197, 94, 0.1);
            font-weight: 800;
        }

        .guide-item.next::before {
            content: '▶ NEXT: ';
            color: #22c55e;
            font-weight: 900;
        }

        .guide-item.previous {
            color: rgba(255, 255, 255, 0.5);
            border-color: rgba(251, 146, 60, 0.4);
            background: rgba(251, 146, 60, 0.08);
        }

        .guide-item.previous::before {
            content: '◀ LAST: ';
            color: #fb923c;
            font-weight: 900;
        }

        .guide-item:hover {
            color: white;
            cursor: pointer;
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .header-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .control-btn {
            color: #94a3b8;
            font-size: 1rem;
            transition: all 0.2s;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .control-btn:hover {
            color: #f8fafc;
            background: rgba(99, 102, 241, 0.2);
        }

        .username-input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .username-input {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            padding: 0.25rem 0.5rem;
            color: #f8fafc;
            font-size: 0.75rem;
            font-weight: 700;
            width: 120px;
            outline: none;
            transition: all 0.2s;
        }

        .username-input:focus {
            border-color: #6366f1;
            background: rgba(15, 23, 42, 0.8);
        }

        .game-rank {
            position: absolute;
            top: 0.75rem;
            left: 0.75rem;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-weight: 800;
            font-size: 0.875rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .timer-bar-container {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 50;
        }

        #timer-bar {
            height: 100%;
            background: #6366f1;
            width: 0%;
        }

        .fade-enter {
            opacity: 0;
            transform: translateY(10px);
        }
        .fade-exit {
            opacity: 1;
            transform: translateY(0);
        }

        .status-badge {
            background: rgba(99, 102, 241, 0.1);
            color: #818cf8;
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.75rem;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .loading-overlay {
            position: absolute;
            inset: 0;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <div id="loading" class="loading-overlay">
        <div class="flex flex-col items-center gap-4">
            <div class="w-12 h-12 border-4 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin"></div>
            <p class="text-indigo-400 font-bold animate-pulse">Initializing Dashboards...</p>
        </div>
    </div>

    <div class="timer-bar-container">
        <div id="timer-bar"></div>
    </div>

    <header class="p-6 md:px-12 flex justify-between items-center border-b border-slate-800 bg-slate-900/50 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <button onclick="toggleGuide()" class="bg-indigo-600 p-2 rounded-lg hover:bg-indigo-500 transition-colors">
                <i class="fa-solid fa-house text-white"></i>
            </button>
            <div>
                <h1 id="dashboard-title" class="text-xl font-black tracking-tight">LOADING...</h1>
                <div class="flex items-center gap-2">
                    <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Live BGG Feed for</p>
                    <div class="username-input-container">
                        <input type="text" id="username-field" class="username-input" value="sportomax" onchange="updateUsername(this.value)">
                    </div>
                </div>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="header-controls">
                <button class="control-btn" title="Previous Slide" onclick="prevSlide()"><i class="fa-solid fa-backward"></i></button>
                <button class="control-btn" id="play-pause-btn" title="Play/Pause" onclick="togglePause()"><i class="fa-solid fa-pause"></i></button>
                <button class="control-btn" title="Next Slide" onclick="nextSlide()"><i class="fa-solid fa-forward"></i></button>
            </div>
            <div id="dashboard-status" class="status-badge flex items-center gap-2">
                <span id="status-dot" class="w-2 h-2 bg-indigo-500 rounded-full animate-ping"></span>
                <span id="status-text">UPDATING</span>
            </div>
        </div>
    </header>

    <main class="dashboard-container">
        <div id="channel-guide" class="channel-guide hidden">
            <!-- Channel items will be injected here -->
        </div>
        <div id="game-grid" class="grid-layout">
            <!-- Game cards will be injected here -->
        </div>
    </main>

    <footer class="p-4 text-center text-[10px] text-slate-600 font-bold uppercase tracking-[0.2em] border-t border-slate-800">
        BoardGameGeek Dashboard &bull; sportomax1
    </footer>

    <script>
        let USERNAME = localStorage.getItem('bgg_dashboard_user') || 'sportomax';
        const ROTATION_INTERVAL = 12000; 
        const GUIDE_DURATION = 2000;
        let DASHBOARDS = ['PLAYS', 'HOT', 'RANKED', 'TOP_RATED', 'MOST_PLAYED', 'SHELF_OF_SHAME', 'HIDDEN_GEMS', 'ON_THE_RADAR', 'THE_HIT_LIST', 
            'QUICKEST_GAMES', 'LONGEST_GAMES', 'LIGHTEST_GAMES', 'HEAVIEST_GAMES', 'NEWEST_GAMES', 'OLDEST_GAMES', 'TOP_BGG_AVERAGE',
            'BEST_1P', 'BEST_2P', 'BEST_3P', 'BEST_4P', 'BEST_5P', 'BEST_6P', 'BEST_7P', 'BEST_8P', 'RANDOM_GAMES'];
        
        // Add Random Kevin slide if sportomax
        if (USERNAME.toLowerCase() === 'sportomax') {
            DASHBOARDS.push('RANDOM_KEVIN');
        }

        let currentIdx = 0;
        let timerStart = Date.now();
        let isPaused = false;
        let rotationTimeout = null;
        let remainingTime = ROTATION_INTERVAL;

        let cache = {
            PLAYS: [],
            HOT: [],
            RANKED: [],
            TOP_RATED: [],
            MOST_PLAYED: [],
            SHELF_OF_SHAME: [],
            HIDDEN_GEMS: [],
            ON_THE_RADAR: [],
            THE_HIT_LIST: [],
            QUICKEST_GAMES: [],
            LONGEST_GAMES: [],
            LIGHTEST_GAMES: [],
            HEAVIEST_GAMES: [],
            NEWEST_GAMES: [],
            OLDEST_GAMES: [],
            TOP_BGG_AVERAGE: [],
            BEST_1P: [],
            BEST_2P: [],
            BEST_3P: [],
            BEST_4P: [],
            BEST_5P: [],
            BEST_6P: [],
            BEST_7P: [],
            BEST_8P: [],
            RANDOM_GAMES: [],
            RANDOM_KEVIN: []
        };

        const collMap = {};
        const normMapBasic = {};
        const normMapStrict = {};

        const els = {
            title: document.getElementById('dashboard-title'),
            grid: document.getElementById('game-grid'),
            guide: document.getElementById('channel-guide'),
            timerBar: document.getElementById('timer-bar'),
            loading: document.getElementById('loading'),
            usernameField: document.getElementById('username-field'),
            playPauseBtn: document.getElementById('play-pause-btn'),
            statusText: document.getElementById('status-text'),
            statusDot: document.getElementById('status-dot')
        };

        els.usernameField.value = USERNAME;

        function updateUsername(newVal) {
            if (!newVal) return;
            USERNAME = newVal.trim();
            localStorage.setItem('bgg_dashboard_user', USERNAME);
            location.reload(); // Quickest way to refetch all user-specific data
        }

        function togglePause() {
            isPaused = !isPaused;
            if (isPaused) {
                clearTimeout(rotationTimeout);
                remainingTime -= (Date.now() - timerStart);
                els.playPauseBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
                els.statusText.innerText = 'PAUSED';
                els.statusDot.classList.remove('animate-ping');
            } else {
                timerStart = Date.now() - (ROTATION_INTERVAL - remainingTime);
                rotationTimeout = setTimeout(() => rotate(), Math.max(0, remainingTime));
                els.playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                els.statusText.innerText = 'UPDATING';
                els.statusDot.classList.add('animate-ping');
            }
        }

        function nextSlide() {
            clearTimeout(rotationTimeout);
            rotate(true);
        }

        function prevSlide() {
            clearTimeout(rotationTimeout);
            // Go back 2 steps because rotate() increments by 1
            currentIdx = (currentIdx - 2 + DASHBOARDS.length) % DASHBOARDS.length;
            rotate(true);
        }

        function toggleGuide() {
            if (!els.guide.classList.contains('hidden')) {
                els.guide.classList.add('hidden');
                els.guide.style.opacity = '0';
            } else {
                updateGuideUI();
                els.guide.classList.remove('hidden');
                els.guide.style.opacity = '1';
            }
        }

        function jumpToSlide(idx) {
            clearTimeout(rotationTimeout);
            currentIdx = idx;
            rotate(true);
        }

        function updateGuideUI() {
            els.guide.innerHTML = DASHBOARDS.map((d, i) => {
                let cls = 'guide-item';
                // Successor logic: rotate() increments currentIdx *after* setting the slide.
                // So if we are currently viewing index 0, currentIdx is 1.
                // We want the guide to show index 0 as active.
                const viewingIdx = (currentIdx - 1 + DASHBOARDS.length) % DASHBOARDS.length;
                const previousIdx = (currentIdx - 2 + DASHBOARDS.length) % DASHBOARDS.length;
                const nextIdx = currentIdx % DASHBOARDS.length;
                if (i === viewingIdx) cls += ' active';
                else if (i === previousIdx) cls += ' previous';
                else if (i === nextIdx) cls += ' next';
                return `<div class="${cls}" onclick="jumpToSlide(${i}); event.stopPropagation();">${getShortTitle(d)}</div>`;
            }).join('');
        }

        async function fetchAPI(endpoint, params = '') {
            const url = `/api/bgg-helper?endpoint=${endpoint}${params}`;
            try {
                const res = await fetch(url);
                if (res.status === 202) {
                    await new Promise(r => setTimeout(r, 2000));
                    return fetchAPI(endpoint, params);
                }
                return await res.text();
            } catch (e) {
                console.error(`Fetch error for ${endpoint}:`, e);
                return null;
            }
        }

        // Cache of id -> subtype (e.g., 'boardgame', 'boardgameexpansion')
        const subtypeCache = {};

        // Given an array of item objects (may include .id and/or .subtype), return a filtered array
        // with expansions removed. Will batch-query thing API for unknown ids to populate subtype info.
        async function filterOutExpansions(items) {
            if (!items || items.length === 0) return items;
            const toCheck = [];
            items.forEach(it => {
                if (!it) return;
                if (it.subtype) return; // already known
                if (it.id && !subtypeCache[it.id]) toCheck.push(it.id);
            });

            if (toCheck.length > 0) {
                // batch fetch (single call)
                try {
                    const xml = await fetchAPI('thing', `&id=${toCheck.join(',')}&stats=1`);
                    if (xml) {
                        const doc = new DOMParser().parseFromString(xml, 'text/xml');
                        Array.from(doc.querySelectorAll('item')).forEach(node => {
                            const id = node.getAttribute('id');
                            const subtype = node.getAttribute('subtype') || node.getAttribute('type') || '';
                            subtypeCache[id] = subtype;
                        });
                    }
                } catch (e) { console.warn('filterOutExpansions thing fetch failed', e); }
            }

            // annotate items from cache if possible
            const filtered = items.filter(it => {
                if (!it) return false;
                const st = it.subtype || (it.id ? subtypeCache[it.id] : null);
                // If known expansion, exclude
                if (st && st.toLowerCase() === 'boardgameexpansion') return false;
                // otherwise include (unknowns kept)
                return true;
            });
            return filtered;
        }

        async function loadData() {
            console.log('Fetching all dashboard data...');
            
            // 1. Fetch Hot Games
            const hotXml = await fetchAPI('hot', '&type=boardgame');
            if (hotXml) {
                const doc = new DOMParser().parseFromString(hotXml, 'text/xml');
                cache.HOT = Array.from(doc.querySelectorAll('item')).slice(0, 10).map(item => ({
                    id: item.getAttribute('id'),
                    name: item.querySelector('name')?.getAttribute('value'),
                    thumb: item.querySelector('image')?.getAttribute('value') || item.querySelector('thumbnail')?.getAttribute('value'),
                    rank: item.getAttribute('rank')
                }));
            }

            // 2. Fetch Last 10 Plays
            const playsXml = await fetchAPI('plays', `&username=${USERNAME}`);
            if (playsXml) {
                const doc = new DOMParser().parseFromString(playsXml, 'text/xml');
                const playItems = Array.from(doc.querySelectorAll('play')).slice(0, 10);
                const playIds = playItems.map(p => p.querySelector('item').getAttribute('objectid'));
                
                const thingXml = await fetchAPI('thing', `&id=${playIds.join(',')}`);
                if (thingXml) {
                    const tDoc = new DOMParser().parseFromString(thingXml, 'text/xml');
                    cache.PLAYS = Array.from(tDoc.querySelectorAll('item')).map((item, idx) => ({
                        id: item.getAttribute('id'),
                        name: item.querySelector('name[type="primary"]')?.getAttribute('value'),
                        thumb: item.querySelector('image')?.textContent || item.querySelector('thumbnail')?.textContent,
                        rank: idx + 1
                    }));
                }
            }

            // 3. Fetch Top 10 Ranked
            const browseHtml = await fetchAPI('browse', '&page=1');
            if (browseHtml) {
                const idRegex = /href="\/boardgame\/(\d+)\/[^"]*"/g;
                let match;
                const rankedIds = [];
                while ((match = idRegex.exec(browseHtml)) !== null && rankedIds.length < 10) {
                    if (!rankedIds.includes(match[1])) rankedIds.push(match[1]);
                }
                if (rankedIds.length > 0) {
                    const thingXml = await fetchAPI('thing', `&id=${rankedIds.join(',')}`);
                    if (thingXml) {
                        const tDoc = new DOMParser().parseFromString(thingXml, 'text/xml');
                        cache.RANKED = Array.from(tDoc.querySelectorAll('item')).map((item, idx) => ({
                            id: item.getAttribute('id'),
                            name: item.querySelector('name[type="primary"]')?.getAttribute('value'),
                            thumb: item.querySelector('image')?.textContent || item.querySelector('thumbnail')?.textContent,
                            rank: idx + 1
                        }));
                    }
                }
            }

            // 4. Fetch Collection for Collection-based Slides (with own=1)
            const collXml = await fetchAPI('collection', `&username=${USERNAME}&stats=1&own=1`);
            if (collXml) {
                const doc = new DOMParser().parseFromString(collXml, 'text/xml');
                const items = Array.from(doc.querySelectorAll('items > item'));
                
                // Build maps for fast lookups (same lookup logic as pubmeeple.html)
                items.forEach(it => {
                    const name = it.querySelector('name')?.textContent?.trim();
                    const thumb = it.querySelector('image')?.textContent || it.querySelector('thumbnail')?.textContent || '';
                    if (name) {
                        const entry = { thumb, original: name };
                        collMap[name.toLowerCase()] = entry;
                        normMapBasic[normalize(name, false)] = entry;
                        normMapStrict[normalize(name, true)] = entry;
                    }
                });

                // Helper to get personal rating
                const getPersonalRating = (it) => {
                    const val = it.querySelector('stats > rating')?.getAttribute('value');
                    return (val && val !== 'N/A') ? parseFloat(val) : 0;
                };

                // Helper to get BGG average rating
                const getBGGAverage = (it) => {
                    const val = it.querySelector('stats > rating > average')?.getAttribute('value');
                    return val ? parseFloat(val) : 0;
                };

                // Helper to get BGG bayesian average
                const getBGGBayes = (it) => {
                    const val = it.querySelector('stats > rating > bayesaverage')?.getAttribute('value');
                    return val ? parseFloat(val) : 0;
                };

                // TOP_RATED (Owned only, sorted by personal rating, fallback to BGG average, NO EXPANSIONS)
                cache.TOP_RATED = items
                    .filter(it => it.querySelector('status')?.getAttribute('own') === '1')
                    .filter(it => it.getAttribute('subtype') !== 'boardgameexpansion')
                    .map(it => ({
                        id: it.getAttribute('objectid'),
                        name: it.querySelector('name')?.textContent,
                        thumb: it.querySelector('image')?.textContent || it.querySelector('thumbnail')?.textContent,
                        rating: getPersonalRating(it),
                        bggRating: getBGGAverage(it)
                    }))
                    .sort((a, b) => b.rating - a.rating || b.bggRating - a.bggRating)
                    .slice(0, 10)
                    .map((it, idx) => ({ ...it, rank: idx + 1 }));

                // MOST_PLAYED (Owned only, NO EXPANSIONS)
                cache.MOST_PLAYED = items
                    .filter(it => it.querySelector('status')?.getAttribute('own') === '1')
                    .filter(it => it.getAttribute('subtype') !== 'boardgameexpansion')
                    .map(it => ({
                        id: it.getAttribute('objectid'),
                        name: it.querySelector('name')?.textContent,
                        thumb: it.querySelector('image')?.textContent || it.querySelector('thumbnail')?.textContent,
                        plays: parseInt(it.querySelector('numplays')?.textContent || 0)
                    }))
                    .sort((a, b) => b.plays - a.plays)
                    .slice(0, 10)
                    .map((it, idx) => ({ ...it, rank: idx + 1 }));

                // SHELF OF SHAME (Owned, Plays = 0, Sort by BGG Rating, NO EXPANSIONS)
                cache.SHELF_OF_SHAME = items
                    .filter(it => it.querySelector('status')?.getAttribute('own') === '1')
                    .filter(it => it.getAttribute('subtype') !== 'boardgameexpansion')
                    .filter(it => parseInt(it.querySelector('numplays')?.textContent || 0) === 0)
                    .map(it => ({
                        id: it.getAttribute('objectid'),
                        name: it.querySelector('name')?.textContent,
                        thumb: it.querySelector('image')?.textContent || it.querySelector('thumbnail')?.textContent,
                        bggRating: getBGGAverage(it)
                    }))
                    .sort((a, b) => b.bggRating - a.bggRating)
                    .slice(0, 10)
                    .map((it, idx) => ({ ...it, rank: idx + 1 }));

                // HIDDEN GEMS (Owned, Sort by Average minus Bayesian Average, NO EXPANSIONS)
                cache.HIDDEN_GEMS = items
                    .filter(it => it.querySelector('status')?.getAttribute('own') === '1')
                    .filter(it => it.getAttribute('subtype') !== 'boardgameexpansion')
                    .map(it => ({
                        id: it.getAttribute('objectid'),
                        name: it.querySelector('name')?.textContent,
                        thumb: it.querySelector('image')?.textContent || it.querySelector('thumbnail')?.textContent,
                        gemScore: getBGGAverage(it) - getBGGBayes(it)
                    }))
                    .sort((a, b) => b.gemScore - a.gemScore)
                    .slice(0, 10)
                    .map((it, idx) => ({ ...it, rank: idx + 1 }));

                // ON THE RADAR (Want to Play + Wishlist, NO EXPANSIONS)
                cache.ON_THE_RADAR = items
                    .filter(it => it.querySelector('status')?.getAttribute('wanttoplay') === '1' || it.querySelector('status')?.getAttribute('wishlist') === '1')
                    .filter(it => it.getAttribute('subtype') !== 'boardgameexpansion')
                    .sort((a, b) => {
                        const pa = parseInt(a.querySelector('status')?.getAttribute('wishlistpriority') || 5);
                        const pb = parseInt(b.querySelector('status')?.getAttribute('wishlistpriority') || 5);
                        return pa - pb;
                    })
                    .slice(0, 10)
                    .map((item, idx) => ({
                        id: item.getAttribute('objectid'),
                        name: item.querySelector('name')?.textContent,
                        thumb: item.querySelector('image')?.textContent || item.querySelector('thumbnail')?.textContent,
                        rank: idx + 1
                    }));

                // THE HIT LIST (Want to Buy, NO EXPANSIONS)
                cache.THE_HIT_LIST = items
                    .filter(it => it.querySelector('status')?.getAttribute('want') === '1' || it.querySelector('status')?.getAttribute('wanttobuy') === '1')
                    .filter(it => it.getAttribute('subtype') !== 'boardgameexpansion')
                    .sort((a, b) => {
                        const pa = parseInt(a.querySelector('status')?.getAttribute('wishlistpriority') || 5);
                        const pb = parseInt(b.querySelector('status')?.getAttribute('wishlistpriority') || 5);
                        return pa - pb;
                    })
                    .slice(0, 10)
                    .map((item, idx) => ({
                        id: item.getAttribute('objectid'),
                        name: item.querySelector('name')?.textContent,
                        thumb: item.querySelector('image')?.textContent || item.querySelector('thumbnail')?.textContent,
                        rank: idx + 1
                    }));

                // 5. Fetch detailed stats for new slides using Thing API with batches
                // Collect all owned game IDs (excluding expansions)
                const ownedItems = items.filter(it => {
                    const isOwned = it.querySelector('status')?.getAttribute('own') === '1';
                    const isExpansion = it.getAttribute('subtype') === 'boardgameexpansion';
                    return isOwned && !isExpansion;
                });
                const ownedIds = ownedItems.map(it => it.getAttribute('objectid'));
                
                // Fetch thing data in batches of 20 with parallel processing (up to 10 batches in parallel)
                const batchSize = 20;
                const parallelBatches = 10; // Reduced from 100 to avoid overwhelming BGG API
                const thingDataMap = {};
                const batches = [];
                
                for (let i = 0; i < ownedIds.length; i += batchSize) {
                    batches.push(ownedIds.slice(i, i + batchSize));
                }
                
                // Process batches in parallel groups
                for (let i = 0; i < batches.length; i += parallelBatches) {
                    const batchGroup = batches.slice(i, i + parallelBatches);
                    
                    await Promise.all(batchGroup.map(async (batch) => {
                        const ids = batch.join(',');
                        try {
                            const thingXml = await fetchAPI('thing', `&id=${ids}&stats=1`);
                            if (thingXml) {
                                const thingDoc = new DOMParser().parseFromString(thingXml, 'text/xml');
                                const thingItems = Array.from(thingDoc.querySelectorAll('item'));
                                
                                thingItems.forEach(thingItem => {
                                    const id = thingItem.getAttribute('id');
                                    const playingtime = parseInt(thingItem.querySelector('playingtime')?.getAttribute('value') || '0');
                                    const minplaytime = parseInt(thingItem.querySelector('minplaytime')?.getAttribute('value') || '0');
                                    const maxplaytime = parseInt(thingItem.querySelector('maxplaytime')?.getAttribute('value') || '0');
                                    const averageweight = parseFloat(thingItem.querySelector('statistics ratings averageweight')?.getAttribute('value') || '0');
                                    const average = parseFloat(thingItem.querySelector('statistics ratings average')?.getAttribute('value') || '0');
                                    const yearpublished = parseInt(thingItem.querySelector('yearpublished')?.getAttribute('value') || '0');
                                    
                                    // Parse player count recommendations
                                    const polls = Array.from(thingItem.querySelectorAll('poll'));
                                    const playerPoll = polls.find(p => p.getAttribute('name') === 'suggested_numplayers');
                                    const playerCounts = {};
                                    
                                    if (playerPoll) {
                                        const results = Array.from(playerPoll.querySelectorAll('results'));
                                        results.forEach(result => {
                                            const numplayers = result.getAttribute('numplayers');
                                            const voteElements = Array.from(result.querySelectorAll('result'));
                                            const votes = {};
                                            voteElements.forEach(v => {
                                                votes[v.getAttribute('value')] = parseInt(v.getAttribute('numvotes') || '0');
                                            });
                                            const best = votes['Best'] || 0;
                                            const recommended = votes['Recommended'] || 0;
                                            const notRecommended = votes['Not Recommended'] || 0;
                                            const total = best + recommended + notRecommended;
                                            // Use more inclusive threshold: best + recommended votes
                                            if (total >= 5 && ((best + recommended) / total) >= 0.5) {
                                                playerCounts[numplayers] = { best, recommended, notRecommended, total };
                                            }
                                        });
                                    }
                                    
                                    thingDataMap[id] = {
                                        playingtime,
                                        minplaytime,
                                        maxplaytime,
                                        averageweight,
                                        average,
                                        yearpublished,
                                        playerCounts
                                    };
                                });
                            }
                        } catch (e) {
                            console.error('Batch error:', e);
                        }
                    }));
                }
                
                // Now build the new slides using the thingDataMap
                const gamesWithDetails = ownedItems.map(it => {
                    const id = it.getAttribute('objectid');
                    const baseData = {
                        id: id,
                        name: it.querySelector('name')?.textContent,
                        thumb: it.querySelector('image')?.textContent || it.querySelector('thumbnail')?.textContent
                    };
                    // Safely merge thingData if it exists
                    if (thingDataMap[id]) {
                        return { ...baseData, ...thingDataMap[id] };
                    }
                    // Return base data with default values if thingData is missing
                    return {
                        ...baseData,
                        playingtime: 0,
                        minplaytime: 0,
                        maxplaytime: 0,
                        averageweight: 0,
                        average: 0,
                        yearpublished: 0,
                        playerCounts: {}
                    };
                }).filter(g => g.name); // Only filter out games without names
                
                // QUICKEST GAMES (shortest playing time, excluding 0, tiebreaker: BGG average)
                cache.QUICKEST_GAMES = gamesWithDetails
                    .filter(g => g.playingtime > 0)
                    .sort((a, b) => a.playingtime - b.playingtime || b.average - a.average)
                    .slice(0, 10)
                    .map((g, idx) => ({ ...g, rank: idx + 1 }));
                
                // LONGEST GAMES (longest playing time, tiebreaker: BGG average)
                cache.LONGEST_GAMES = gamesWithDetails
                    .filter(g => g.playingtime > 0)
                    .sort((a, b) => b.playingtime - a.playingtime || b.average - a.average)
                    .slice(0, 10)
                    .map((g, idx) => ({ ...g, rank: idx + 1 }));
                
                // LIGHTEST GAMES (lowest weight, excluding 0, tiebreaker: BGG average)
                cache.LIGHTEST_GAMES = gamesWithDetails
                    .filter(g => g.averageweight > 0)
                    .sort((a, b) => a.averageweight - b.averageweight || b.average - a.average)
                    .slice(0, 10)
                    .map((g, idx) => ({ ...g, rank: idx + 1 }));
                
                // HEAVIEST GAMES (highest weight, tiebreaker: BGG average)
                cache.HEAVIEST_GAMES = gamesWithDetails
                    .filter(g => g.averageweight > 0)
                    .sort((a, b) => b.averageweight - a.averageweight || b.average - a.average)
                    .slice(0, 10)
                    .map((g, idx) => ({ ...g, rank: idx + 1 }));
                
                // NEWEST GAMES (year published desc, tiebreaker: BGG ID desc for newer IDs)
                cache.NEWEST_GAMES = gamesWithDetails
                    .filter(g => g.yearpublished > 0)
                    .sort((a, b) => b.yearpublished - a.yearpublished || b.id - a.id)
                    .slice(0, 10)
                    .map((g, idx) => ({ ...g, rank: idx + 1 }));
                
                // OLDEST GAMES (year published asc, tiebreaker: BGG ID asc for older IDs)
                cache.OLDEST_GAMES = gamesWithDetails
                    .filter(g => g.yearpublished > 0)
                    .sort((a, b) => a.yearpublished - b.yearpublished || a.id - b.id)
                    .slice(0, 10)
                    .map((g, idx) => ({ ...g, rank: idx + 1 }));
                
                // TOP BGG AVERAGE (by BGG average rating)
                cache.TOP_BGG_AVERAGE = gamesWithDetails
                    .filter(g => g.average > 0)
                    .sort((a, b) => b.average - a.average)
                    .slice(0, 10)
                    .map((g, idx) => ({ ...g, rank: idx + 1 }));
                
                // RANDOM_GAMES (10 random owned games, then sorted by average rating high to low)
                const shuffled = [...gamesWithDetails].sort(() => Math.random() - 0.5).slice(0, 10);
                cache.RANDOM_GAMES = shuffled
                    .sort((a, b) => b.average - a.average)
                    .map((g, idx) => ({ ...g, rank: idx + 1 }));
                
                // BEST BY PLAYER COUNT (1-8)
                for (let pc = 1; pc <= 8; pc++) {
                    const pcKey = `BEST_${pc}P`;
                    cache[pcKey] = gamesWithDetails
                        .filter(g => g.playerCounts && g.playerCounts[pc.toString()])
                        .sort((a, b) => {
                            const aVotes = a.playerCounts[pc.toString()];
                            const bVotes = b.playerCounts[pc.toString()];
                            // Primary sort: ratio of (best + recommended) votes
                            const aRatio = (aVotes.best + aVotes.recommended) / aVotes.total;
                            const bRatio = (bVotes.best + bVotes.recommended) / bVotes.total;
                            if (Math.abs(aRatio - bRatio) > 0.01) {
                                return bRatio - aRatio;
                            }
                            // Secondary sort: total vote count (more votes = higher rank)
                            return bVotes.total - aVotes.total;
                        })
                        .slice(0, 10)
                        .map((g, idx) => ({ ...g, rank: idx + 1 }));
                }
            }

            // 6. Fetch Random Kevin (if sportomax)
            if (USERNAME.toLowerCase() === 'sportomax') {
                try {
                    const csvRes = await fetch('pubmeeple.csv');
                    const csvText = await csvRes.text();
                    const lines = csvText.split('\n').filter(l => l.trim());
                    const allLists = {};
                    
                    // Simple CSV parser
                    lines.forEach((line, i) => {
                        if (i === 0) return;
                        const parts = line.split(',');
                        if (parts.length < 4) return;
                        const listName = parts[0];
                        if (listName.toLowerCase().includes('kevin')) {
                            if (!allLists[listName]) allLists[listName] = [];
                            allLists[listName].push({
                                rank: parts[2],
                                item: parts[3]?.replace(/"/g, '')
                            });
                        }
                    });

                    const listNames = Object.keys(allLists);
                    if (listNames.length > 0) {
                        const randomListName = listNames[Math.floor(Math.random() * listNames.length)];
                        const top10 = allLists[randomListName].slice(0, 10);
                        
                        // Fetch thumbnails using pubmeeple lookup logic + BGG fallback (no own=1 filter)
                        cache.RANDOM_KEVIN_TITLE = randomListName.toUpperCase();
                        cache.RANDOM_KEVIN = await Promise.all(top10.map(async (row) => {
                            const n = row.item.trim();
                            const key = n.toLowerCase();
                            const normBasic = normalize(n, false);
                            const normStrict = normalize(n, true);
                            
                            let thumb = null;

                            // Skip collection lookup - go straight to BGG search for all games
                            const searchXml = await fetchAPI('search', '', `&query=${encodeURIComponent(n)}&type=boardgame&exact=1`);
                            if (searchXml) {
                                const sDoc = new DOMParser().parseFromString(searchXml, 'text/xml');
                                const firstItem = sDoc.querySelector('item');
                                if (firstItem) {
                                    const id = firstItem.getAttribute('id');
                                    const tXml = await fetchAPI('thing', `&id=${id}`);
                                    if (tXml) {
                                        const tDoc = new DOMParser().parseFromString(tXml, 'text/xml');
                                        thumb = tDoc.querySelector('image')?.textContent || tDoc.querySelector('thumbnail')?.textContent;
                                    }
                                }
                            }

                            return {
                                name: n,
                                thumb: thumb,
                                rank: row.rank
                            };
                        }));
                    }
                } catch (e) {
                    console.error('Error loading pubmeeple data:', e);
                }
            }

            els.loading.style.opacity = '0';
            setTimeout(() => els.loading.style.display = 'none', 500);
            
            rotate();
            setInterval(updateTimer, 50);
        }

        async function rotate(skipGuide = false) {
            if (isPaused) return;

            const type = DASHBOARDS[currentIdx];
            
            if (!skipGuide) {
                // SHOW CHANNEL GUIDE
                updateGuideUI();
                els.guide.classList.remove('hidden');
                els.guide.style.opacity = '1';
                els.grid.style.opacity = '0.3';
                els.title.innerText = 'SELECTING CHANNEL...';
                
                timerStart = Date.now();
                remainingTime = ROTATION_INTERVAL;

                await new Promise(r => rotationTimeout = setTimeout(r, GUIDE_DURATION));
            }

            // SHOW DASHBOARD
            const rawData = cache[type] || [];
            // filter out expansions before rendering (will fetch thing metadata for unknown ids as needed)
            const data = await filterOutExpansions(rawData);
            els.guide.style.opacity = '0';
            setTimeout(() => els.guide.classList.add('hidden'), 300);
            els.grid.style.opacity = '1';
            
            els.title.innerText = getTitle(type);
            renderGrid(data);

            currentIdx = (currentIdx + 1) % DASHBOARDS.length;
            
            timerStart = Date.now();
            remainingTime = ROTATION_INTERVAL;
            rotationTimeout = setTimeout(() => rotate(), ROTATION_INTERVAL);
        }

        function getShortTitle(type) {
            switch(type) {
                case 'PLAYS': return 'RECENT PLAYS';
                case 'HOT': return 'HOT GAMES';
                case 'RANKED': return 'TOP RANKED';
                case 'TOP_RATED': return 'YOUR TOP RATED';
                case 'MOST_PLAYED': return 'MOST PLAYED';
                case 'SHELF_OF_SHAME': return 'SHELF OF SHAME';
                case 'HIDDEN_GEMS': return 'HIDDEN GEMS';
                case 'ON_THE_RADAR': return 'ON THE RADAR';
                case 'THE_HIT_LIST': return 'THE HIT LIST';
                case 'QUICKEST_GAMES': return 'QUICKEST GAMES';
                case 'LONGEST_GAMES': return 'LONGEST GAMES';
                case 'LIGHTEST_GAMES': return 'LIGHTEST GAMES';
                case 'HEAVIEST_GAMES': return 'HEAVIEST GAMES';
                case 'NEWEST_GAMES': return 'NEWEST GAMES';
                case 'OLDEST_GAMES': return 'OLDEST GAMES';
                case 'TOP_BGG_AVERAGE': return 'TOP BGG AVERAGE';
                case 'BEST_1P': return 'BEST 1 PLAYER';
                case 'BEST_2P': return 'BEST 2 PLAYERS';
                case 'BEST_3P': return 'BEST 3 PLAYERS';
                case 'BEST_4P': return 'BEST 4 PLAYERS';
                case 'BEST_5P': return 'BEST 5 PLAYERS';
                case 'BEST_6P': return 'BEST 6 PLAYERS';
                case 'BEST_7P': return 'BEST 7 PLAYERS';
                case 'BEST_8P': return 'BEST 8 PLAYERS';
                case 'RANDOM_GAMES': return 'RANDOM 10';
                case 'RANDOM_KEVIN': return 'KEVIN LIST';
                default: return type.replace('_', ' ');
            }
        }

        function normalize(str, removeFillers = false) {
            let s = str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            s = s.toLowerCase().replace(/&/g, 'and'); 
            if (removeFillers) {
                const fillers = ['a', 'the', 'and', 'of', 'in', 'on', 'with', 'by', 'an'];
                const words = s.split(/[^a-z0-9]/).filter(w => w && !fillers.includes(w));
                return words.join('');
            }
            return s.replace(/[^a-z0-9]/g, '');
        }

        function getTitle(type) {
            switch(type) {
                case 'PLAYS': return `LAST 10 PLAYS: ${USERNAME.toUpperCase()}`;
                case 'HOT': return 'TOP 10 HOT GAMES';
                case 'RANKED': return 'TOP 10 RANKED GAMES';
                case 'TOP_RATED': return 'TOP 10 RATED BY YOU';
                case 'MOST_PLAYED': return 'TOP 10 MOST PLAYED';
                case 'SHELF_OF_SHAME': return 'SHELF OF SHAME (UNPLAYED)';
                case 'HIDDEN_GEMS': return 'HIDDEN GEMS (RATING VS RANK)';
                case 'ON_THE_RADAR': return 'ON THE RADAR (TO PLAY)';
                case 'THE_HIT_LIST': return 'THE HIT LIST (TO BUY)';
                case 'QUICKEST_GAMES': return 'TOP 10 QUICKEST GAMES (SHORTEST PLAYING TIME)';
                case 'LONGEST_GAMES': return 'TOP 10 LONGEST GAMES (LONGEST PLAYING TIME)';
                case 'LIGHTEST_GAMES': return 'TOP 10 LIGHTEST GAMES (BY WEIGHT)';
                case 'HEAVIEST_GAMES': return 'TOP 10 HEAVIEST GAMES (BY WEIGHT)';
                case 'NEWEST_GAMES': return 'TOP 10 NEWEST GAMES (BY YEAR)';
                case 'OLDEST_GAMES': return 'TOP 10 OLDEST GAMES (BY YEAR)';
                case 'TOP_BGG_AVERAGE': return 'TOP 10 BY BGG AVERAGE RATING';
                case 'BEST_1P': return 'TOP 10 BEST GAMES FOR 1 PLAYER';
                case 'BEST_2P': return 'TOP 10 BEST GAMES FOR 2 PLAYERS';
                case 'BEST_3P': return 'TOP 10 BEST GAMES FOR 3 PLAYERS';
                case 'BEST_4P': return 'TOP 10 BEST GAMES FOR 4 PLAYERS';
                case 'BEST_5P': return 'TOP 10 BEST GAMES FOR 5 PLAYERS';
                case 'BEST_6P': return 'TOP 10 BEST GAMES FOR 6 PLAYERS';
                case 'BEST_7P': return 'TOP 10 BEST GAMES FOR 7 PLAYERS';
                case 'BEST_8P': return 'TOP 10 BEST GAMES FOR 8 PLAYERS';
                case 'RANDOM_GAMES': return '10 RANDOM GAMES FROM YOUR COLLECTION';
                case 'RANDOM_KEVIN': return cache.RANDOM_KEVIN_TITLE || 'KEVIN\'S RANDOM LIST';
                default: return type.replace('_', ' ');
            }
        }

        function renderGrid(data) {
            els.grid.innerHTML = '';
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'game-card animate-in fade-in zoom-in duration-500';
                
                const thumb = item.thumb || 'https://via.placeholder.com/300?text=No+Image';
                const proxiedThumb = `/api/image-proxy?url=${encodeURIComponent(thumb)}`;
                
                card.innerHTML = `
                    <img src="${proxiedThumb}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/300?text=Error'">
                    <div class="game-rank">#${item.rank}</div>
                    <div class="game-name-overlay">
                        <div class="game-name-text">${item.name}</div>
                    </div>
                `;
                els.grid.appendChild(card);
            });
        }

        function updateTimer() {
            if (isPaused) return;
            const elapsed = Date.now() - timerStart;
            const percent = Math.min((elapsed / ROTATION_INTERVAL) * 100, 100);
            els.timerBar.style.width = `${percent}%`;
        }

        window.onload = loadData;
    </script>
</body>
