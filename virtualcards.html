<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Virtual Cards | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🎴</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        @page {
            size: letter;
            margin: 0.5in;
        }

        :root {
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
            height: 100dvh;
            width: 100vw;
            position: fixed;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-dark {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Card Stack Styles */
        .game-card {
            width: 90vw;
            max-width: 360px;
            height: 75vh;
            max-height: 600px;
            @apply glass-dark rounded-[2.5rem] border border-white/10 shadow-2xl;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem;
            position: absolute;
            cursor: grab;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
            transform-origin: center;
            user-select: none;
        }

        .game-card.dragging {
            cursor: grabbing;
            transition: none;
        }

        .game-card.swipe-left {
            transform: translateX(-100vw) rotate(-30deg) !important;
            opacity: 0 !important;
        }

        .game-card.swipe-right {
            transform: translateX(100vw) rotate(30deg) !important;
            opacity: 0 !important;
        }

        /* Elements inside the card */
        .player-number {
            @apply w-8 h-8 rounded-full flex items-center justify-center text-[10px] font-black border-2 border-white/10 text-slate-500 transition-all;
        }
        .player-number.best { @apply bg-emerald-500 border-emerald-400 text-white shadow-lg shadow-emerald-500/20; }
        .player-number.recommended { @apply bg-amber-500 border-amber-400 text-white shadow-lg shadow-amber-500/20; }
        .player-number.active { @apply border-white/30 text-white; }

        .stat-circle {
            @apply w-12 h-12 rounded-full flex flex-col items-center justify-center border-2 border-white/20 backdrop-blur-md shadow-xl;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-secondary {
            @apply glass border-white/10 text-slate-400 hover:text-white transition-all;
        }

        .input-dark {
            @apply bg-slate-900/50 border border-white/10 rounded-2xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all font-medium placeholder-slate-500;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        /* Print Styles */
        @media print {
            body { background: white !important; overflow: visible !important; position: static !important; height: auto !important; width: auto !important; }
            .no-print { display: none !important; }
            #printArea { display: block !important; }
            .print-container { display: grid !important; grid-template-columns: repeat(3, 2.5in) !important; gap: 0.1in !important; padding: 0.25in !important; }
            .print-card { 
                width: 2.5in !important; height: 3.5in !important; 
                border: 1px solid #000 !important; border-radius: 0.1in !important;
                padding: 0.15in !important; display: flex !important; flex-direction: column !important;
                align-items: center !important; text-align: center !important; page-break-inside: avoid !important;
                background: white !important; color: black !important;
            }
            .print-card img { max-width: 1.8in !important; max-height: 1.5in !important; object-fit: contain !important; margin: 0.1in 0 !important; }
            .print-card h2 { font-size: 12pt !important; margin: 0 !important; font-weight: bold !important; }
            .print-card .stats { font-size: 8pt !important; line-height: 1.2 !important; margin-top: auto !important; }
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    </style>
</head>
<body class="selection:bg-indigo-500/30">
    <!-- Background Decor -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0 no-print">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-indigo-900/20 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[10%] right-[0%] w-[50%] h-[50%] bg-blue-900/10 blur-[120px] rounded-full"></div>
    </div>

    <div class="relative z-10 flex flex-col h-full pt-safe no-print">
        <!-- SETUP SCREEN -->
        <div id="sortSelection" class="flex-1 flex flex-col items-center justify-center p-6">
            <div class="glass max-w-sm w-full rounded-[2.5rem] p-10 border-t border-white/20 shadow-2xl space-y-10 text-center relative overflow-hidden">
                <div class="absolute inset-0 bg-indigo-500/5 pointer-events-none"></div>
                
                <div class="relative space-y-2">
                    <div class="w-20 h-20 bg-indigo-500/20 rounded-3xl flex items-center justify-center mx-auto mb-6 border border-indigo-500/30">
                        <i data-lucide="layers" class="text-indigo-400 w-10 h-10"></i>
                    </div>
                    <h1 class="text-4xl font-black italic uppercase tracking-tighter text-white leading-none">Virtual <span class="text-indigo-400">Cards</span></h1>
                    <p class="text-xs font-bold text-slate-500 uppercase tracking-widest">Digital Shelf Explorer</p>
                </div>

                <div class="relative space-y-6">
                    <div class="space-y-2 text-left">
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Sort Deck By</label>
                        <select id="sortOrder" class="w-full input-dark">
                            <option value="random" selected>🎲 Random Shuffle</option>
                            <option value="rating">⭐ BGG Average</option>
                            <option value="rank">🏆 BGG Rank</option>
                            <option value="year">📅 Year Published</option>
                            <option value="alpha">🔤 Alphabetical</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="openSettings()" class="btn-secondary py-4 rounded-2xl font-black text-[10px] uppercase tracking-widest flex items-center justify-center gap-2">
                            <i data-lucide="settings" class="w-4 h-4"></i> Settings
                        </button>
                        <button onclick="loadAndViewCards()" class="btn-primary py-4 rounded-2xl font-black text-[10px] uppercase tracking-widest text-white flex items-center justify-center gap-2">
                            <i data-lucide="play" class="w-4 h-4 fill-current"></i> Load Deck
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- LOADING SCREEN -->
        <div id="loadingDiv" class="hidden flex-1 flex flex-col items-center justify-center p-6 text-center space-y-6">
            <div class="relative w-24 h-24">
                <div class="absolute inset-0 border-4 border-indigo-500/20 rounded-full"></div>
                <div class="absolute inset-0 border-4 border-t-indigo-500 rounded-full animate-spin"></div>
                <div class="absolute inset-0 flex items-center justify-center">
                    <i data-lucide="loader-2" class="text-indigo-400 w-8 h-8 animate-pulse"></i>
                </div>
            </div>
            <div class="space-y-2">
                <h2 class="text-2xl font-black italic uppercase tracking-tighter text-white">Shuffling Collection</h2>
                <p id="loadingStatusText" class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Contacting BGG Database...</p>
            </div>
        </div>

        <!-- ERROR SCREEN -->
        <div id="errorDiv" class="hidden flex-1 flex flex-col items-center justify-center p-6 text-center space-y-4">
            <div class="w-20 h-20 bg-rose-500/20 rounded-full flex items-center justify-center border border-rose-500/30">
                <i data-lucide="alert-circle" class="text-rose-400 w-10 h-10"></i>
            </div>
            <p id="errorText" class="text-rose-400 font-bold italic"></p>
            <button onclick="location.reload()" class="glass px-8 py-3 rounded-2xl border border-white/10 text-[10px] font-black uppercase tracking-widest">Try Again</button>
        </div>

        <!-- CARD VIEWER SCREEN -->
        <div id="cardViewer" class="hidden flex-1 flex flex-col relative overflow-hidden">
            <!-- HUD -->
            <div class="absolute top-0 left-0 right-0 p-6 flex items-center justify-between z-50">
                <button onclick="backToSort()" class="glass w-12 h-12 rounded-2xl flex items-center justify-center text-slate-400 hover:text-white transition-all">
                    <i data-lucide="chevron-left" class="w-6 h-6"></i>
                </button>
                <div class="flex gap-2">
                    <button onclick="showGameInfo()" class="glass w-12 h-12 rounded-2xl flex items-center justify-center text-slate-400 hover:text-white transition-all">
                        <i data-lucide="info" class="w-6 h-6"></i>
                    </button>
                    <button onclick="openSettings()" class="glass w-12 h-12 rounded-2xl flex items-center justify-center text-slate-400 hover:text-white transition-all">
                        <i data-lucide="settings" class="w-6 h-6"></i>
                    </button>
                </div>
            </div>

            <!-- Cards Stack -->
            <div id="cardsStack" class="flex-1 relative flex items-center justify-center">
                <!-- Cards injected here -->
            </div>

            <!-- Progress HUD -->
            <div class="absolute bottom-10 left-1/2 -translate-x-1/2 z-50">
                <div id="progressIndicator" class="glass px-6 py-2 rounded-full border border-white/10 text-[10px] font-black uppercase tracking-[0.2em] text-indigo-400 shadow-2xl">
                    0 / 0
                </div>
            </div>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settingsModal" class="modal-overlay hidden" onclick="if(event.target===this) closeSettingsModal()">
        <div class="glass relative max-w-lg w-full rounded-[2.5rem] p-8 border-t border-white/20 shadow-2xl flex flex-col max-h-[90vh]">
            <header class="flex items-center justify-between mb-8 shrink-0">
                <div class="flex items-center gap-3">
                    <i data-lucide="settings" class="text-indigo-400 w-6 h-6"></i>
                    <h2 class="text-2xl font-black italic uppercase tracking-tighter text-white">Deck <span class="text-indigo-400">Config</span></h2>
                </div>
                <button onclick="closeSettingsModal()" class="w-10 h-10 glass rounded-xl flex items-center justify-center text-slate-500 hover:text-white transition-all">✕</button>
            </header>

            <div class="flex-1 overflow-y-auto custom-scrollbar space-y-8 pr-2">
                <!-- Features -->
                <div class="space-y-4">
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Card Details to Display</label>
                    <div class="grid grid-cols-2 gap-2" id="featureCheckboxes">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- Print -->
                <div class="space-y-4">
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Physical Deck</label>
                    <div class="glass-dark p-6 rounded-3xl border border-white/5 space-y-4">
                        <p class="text-[10px] text-slate-400 leading-relaxed italic uppercase tracking-wider">Prints cards in standard poker size (2.5" × 3.5"). 12 cards per page.</p>
                        <button onclick="printCards()" class="w-full py-4 rounded-2xl bg-emerald-500 text-white font-black text-[10px] uppercase tracking-widest shadow-xl shadow-emerald-500/20 hover:bg-emerald-400 transition-all">🖨️ Print Full Deck</button>
                    </div>
                </div>
            </div>

            <div class="mt-8 pt-6 border-t border-white/5">
                <button onclick="closeSettingsModal()" class="w-full btn-primary py-4 rounded-2xl font-black text-[10px] uppercase tracking-widest text-white">Save Configuration</button>
            </div>
        </div>
    </div>

    <!-- INFO MODAL -->
    <div id="gameInfoModal" class="modal-overlay hidden" onclick="if(event.target===this) closeGameInfo()">
        <div class="glass relative max-w-lg w-full rounded-[2.5rem] p-8 border-t border-white/20 shadow-2xl flex flex-col max-h-[85vh]">
            <header class="flex items-center justify-between mb-6 shrink-0">
                <h2 id="modalGameTitle" class="text-2xl font-black italic uppercase tracking-tighter text-white truncate pr-8"></h2>
                <button onclick="closeGameInfo()" class="w-10 h-10 glass rounded-xl flex items-center justify-center text-slate-500 hover:text-white transition-all">✕</button>
            </header>
            <div id="modalGameContent" class="flex-1 overflow-y-auto custom-scrollbar space-y-6 pr-2"></div>
        </div>
    </div>

    <!-- PRINT AREA (Hidden) -->
    <div id="printArea" class="hidden"></div>

    <script>
        lucide.createIcons();

        let allGames = [];
        let currentCardIndex = 0;
        let selectedSortOrder = 'random';
        let isCardViewActive = false;
        let isDataLoaded = false;
        let totalGamesToLoad = 0;
        let gamesLoadedSoFar = 0;
        const IMAGE_PROXY = '/api/image-proxy?url=';
        
        let cardFeatures = {
            playerCount: true, rating: true, rank: true, year: true, 
            myRating: true, plays: true, usersRated: true, age: true, 
            playTime: true, complexity: true, designer: true, publisher: true
        };

        const featureLabels = {
            playerCount: "Player Count", rating: "BGG Rating", rank: "BGG Rank", year: "Year Published",
            myRating: "My Rating", plays: "Play Count", usersRated: "Users Rated", age: "Min Age",
            playTime: "Play Time", complexity: "Complexity", designer: "Designer", publisher: "Publisher"
        };

        // Initialize checkboxes
        const checkboxContainer = document.getElementById('featureCheckboxes');
        checkboxContainer.innerHTML = Object.entries(featureLabels).map(([key, label]) => `
            <label class="flex items-center gap-3 glass p-3 rounded-xl border border-white/5 cursor-pointer hover:bg-white/5 transition-all">
                <input type="checkbox" name="feature" value="${key}" ${cardFeatures[key] ? 'checked' : ''} onchange="updateCardFeatures()" class="w-4 h-4 accent-indigo-500">
                <span class="text-[10px] font-black uppercase text-slate-300">${label}</span>
            </label>
        `).join('');

        function openSettings() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function closeSettingsModal() { document.getElementById('settingsModal').classList.add('hidden'); }

        function updateCardFeatures() {
            const checkboxes = document.querySelectorAll('input[name="feature"]');
            checkboxes.forEach(cb => cardFeatures[cb.value] = cb.checked);
            if (isCardViewActive && allGames.length > 0) createCardStack();
        }

        async function loadAndViewCards() {
            selectedSortOrder = document.getElementById('sortOrder').value;
            if (!isDataLoaded) {
                allGames = [];
                await loadUserCollection();
            } else {
                startCardView();
            }
        }

        async function fetchWithRetry(url, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                const response = await fetch(url);
                if (response.status === 202) { await new Promise(r => setTimeout(r, 2000 * (i + 1))); continue; }
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.text();
            }
            throw new Error('Exceeded fetch attempts');
        }

        async function loadUserCollection() {
            const user = 'sportomax';
            const setup = document.getElementById('sortSelection');
            const loader = document.getElementById('loadingDiv');
            const errorDiv = document.getElementById('errorDiv');
            const statusText = document.getElementById('loadingStatusText');

            setup.classList.add('hidden');
            loader.classList.remove('hidden');
            errorDiv.classList.add('hidden');

            try {
                const collXml = await fetchWithRetry(`/api/bgg-helper?endpoint=collection&username=${user}&stats=1&own=1`);
                const doc = new DOMParser().parseFromString(collXml, 'text/xml');
                const items = Array.from(doc.querySelectorAll('item'));
                
                totalGamesToLoad = items.length;
                gamesLoadedSoFar = 0;
                
                const gameIds = items.map(item => item.getAttribute('objectid'));
                const batchSize = 20;
                const parallelLimit = 100;
                const batches = [];
                for (let i = 0; i < items.length; i += batchSize) {
                    batches.push({ items: items.slice(i, i + batchSize), ids: gameIds.slice(i, i + batchSize), index: i });
                }

                let isFirstBatch = true;
                for (let i = 0; i < batches.length; i += parallelLimit) {
                    const group = batches.slice(i, i + parallelLimit);
                    statusText.textContent = `Gathering data for ${Math.min((i + parallelLimit) * batchSize, totalGamesToLoad)} games...`;

                    await Promise.all(group.map(async (batchData) => {
                        const { items: batch, ids: batchIds, index: batchIndex } = batchData;
                        const thingXml = await fetchWithRetry(`/api/bgg-helper?endpoint=thing&id=${batchIds.join(',')}&stats=1`);
                        const thingDoc = new DOMParser().parseFromString(thingXml, 'text/xml');
                        
                        const batchGames = [];
                        thingDoc.querySelectorAll('item').forEach(item => {
                            const id = item.getAttribute('id');
                            const collItem = batch.find(it => it.getAttribute('objectid') === id);
                            const stats = item.querySelector('statistics ratings');
                            
                            // Map all data points
                            batchGames.push({
                                id,
                                name: item.querySelector('name[type="primary"]')?.getAttribute('value') || collItem.querySelector('name')?.textContent,
                                thumbnail: item.querySelector('thumbnail')?.textContent,
                                year: item.querySelector('yearpublished')?.getAttribute('value'),
                                rating: parseFloat(stats?.querySelector('average')?.getAttribute('value')) || 0,
                                usersrated: parseInt(stats?.querySelector('usersrated')?.getAttribute('value')) || 0,
                                rank: parseInt(stats?.querySelector('rank[name="boardgame"]')?.getAttribute('value')) || 999999,
                                minplayers: parseInt(item.querySelector('minplayers')?.getAttribute('value')) || 0,
                                maxplayers: parseInt(item.querySelector('maxplayers')?.getAttribute('value')) || 0,
                                myrating: parseFloat(collItem.querySelector('rating')?.getAttribute('value')) || 0,
                                numplays: parseInt(collItem.querySelector('numplays')?.textContent) || 0,
                                minage: parseInt(item.querySelector('minage')?.getAttribute('value')) || 0,
                                playingtime: parseInt(item.querySelector('playingtime')?.getAttribute('value')) || 0,
                                averageweight: parseFloat(stats?.querySelector('averageweight')?.getAttribute('value')) || 0,
                                designer: item.querySelector('link[type="boardgamedesigner"]')?.getAttribute('value'),
                                publisher: item.querySelector('link[type="boardgamepublisher"]')?.getAttribute('value'),
                                category: item.querySelector('link[type="boardgamecategory"]')?.getAttribute('value'),
                                mechanic: item.querySelector('link[type="boardgamemechanic"]')?.getAttribute('value'),
                                allDesigners: Array.from(item.querySelectorAll('link[type="boardgamedesigner"]')).map(l => l.getAttribute('value')),
                                allPublishers: Array.from(item.querySelectorAll('link[type="boardgamepublisher"]')).map(l => l.getAttribute('value')),
                                allCategories: Array.from(item.querySelectorAll('link[type="boardgamecategory"]')).map(l => l.getAttribute('value')),
                                allMechanics: Array.from(item.querySelectorAll('link[type="boardgamemechanic"]')).map(l => l.getAttribute('value')),
                                playerRecommendations: parsePoll(item.querySelector('poll[name="suggested_numplayers"]'))
                            });
                        });
                        
                        allGames.push(...batchGames);
                        gamesLoadedSoFar += batch.length;
                    }));

                    if (isFirstBatch && allGames.length > 0) {
                        isFirstBatch = false;
                        isDataLoaded = true;
                        loader.classList.add('hidden');
                        startCardView();
                    }
                    updateProgressIndicator();
                    await new Promise(r => setTimeout(r, 200));
                }
            } catch (error) {
                loader.classList.add('hidden');
                errorDiv.classList.remove('hidden');
                document.getElementById('errorText').textContent = error.message;
            }
        }

        function parsePoll(poll) {
            if(!poll) return {};
            const res = {};
            poll.querySelectorAll('results').forEach(r => {
                const num = r.getAttribute('numplayers');
                const best = parseInt(r.querySelector('result[value="Best"]')?.getAttribute('numvotes')) || 0;
                const rec = parseInt(r.querySelector('result[value="Recommended"]')?.getAttribute('numvotes')) || 0;
                const not = parseInt(r.querySelector('result[value="Not Recommended"]')?.getAttribute('numvotes')) || 0;
                if(best > rec && best > not) res[num] = 'best';
                else if(rec > not) res[num] = 'recommended';
            });
            return res;
        }

        function startCardView() {
            sortGames();
            currentCardIndex = 0;
            isCardViewActive = true;
            document.getElementById('cardViewer').classList.remove('hidden');
            createCardStack();
            updateProgressIndicator();
        }

        function backToSort() {
            isCardViewActive = false;
            document.getElementById('cardViewer').classList.add('hidden');
            document.getElementById('sortSelection').classList.remove('hidden');
        }

        function sortGames() {
            const order = selectedSortOrder;
            if(order === 'random') allGames.sort(() => Math.random() - 0.5);
            else if(order === 'rating') allGames.sort((a,b) => b.rating - a.rating);
            else if(order === 'rank') allGames.sort((a,b) => a.rank - b.rank);
            else if(order === 'year') allGames.sort((a,b) => b.year - a.year);
            else if(order === 'alpha') allGames.sort((a,b) => a.name.localeCompare(b.name));
        }

        function createCardStack() {
            const stack = document.getElementById('cardsStack');
            stack.innerHTML = '';
            if (currentCardIndex < allGames.length) {
                const current = createGameCard(allGames[currentCardIndex], 0);
                stack.appendChild(current);
                if (currentCardIndex + 1 < allGames.length) {
                    const next = createGameCard(allGames[currentCardIndex + 1], 1);
                    next.style.transform = 'scale(0.92) translateY(30px)';
                    next.style.zIndex = -1;
                    next.style.opacity = '0.5';
                    stack.appendChild(next);
                }
            }
        }

        function createGameCard(game, index) {
            const card = document.createElement('div');
            card.className = 'game-card animate-in';
            card.dataset.gameId = game.id;

            const ratingColor = (r) => r >= 8 ? '#10b981' : r >= 7 ? '#3b82f6' : r >= 6 ? '#f59e0b' : '#ef4444';
            const rankColor = (r) => r <= 500 ? '#10b981' : r <= 2000 ? '#3b82f6' : r <= 5000 ? '#f59e0b' : '#64748b';

            let playerCountHtml = '';
            if (cardFeatures.playerCount) {
                playerCountHtml = '<div class="flex gap-1.5 justify-center mb-4">';
                for (let i = 1; i <= 8; i++) {
                    const status = game.playerRecommendations[i] || (i >= game.minplayers && i <= game.maxplayers ? 'active' : '');
                    if (status) playerCountHtml += `<div class="player-number ${status}">${i}${i===8 && game.maxplayers > 8 ? '+' : ''}</div>`;
                }
                playerCountHtml += '</div>';
            }

            const infoRow = (lbl, val, icon) => `<div class="flex flex-col items-center glass p-2 rounded-xl border border-white/5"><i data-lucide="${icon}" class="w-3 h-3 text-blue-400/50 mb-1"></i><span class="text-[7px] font-black uppercase text-slate-500 mb-0.5">${lbl}</span><span class="text-[9px] font-bold text-white truncate w-full">${val}</span></div>`;

            let statsHtml = '<div class="grid grid-cols-3 gap-2 w-full mt-auto">';
            if(cardFeatures.year) statsHtml += infoRow('Built', game.year || '?', 'calendar');
            if(cardFeatures.playTime) statsHtml += infoRow('Time', game.playingtime + 'm', 'clock');
            if(cardFeatures.complexity) statsHtml += infoRow('Weight', game.averageweight.toFixed(1), 'gauge');
            if(cardFeatures.myRating && game.myrating > 0) statsHtml += infoRow('Mine', game.myrating, 'star');
            if(cardFeatures.plays) statsHtml += infoRow('Plays', game.numplays, 'play');
            if(cardFeatures.age) statsHtml += infoRow('Age', game.minage + '+', 'user');
            statsHtml += '</div>';

            card.innerHTML = `
                <div class="w-full flex flex-col items-center">
                    ${playerCountHtml}
                    <h2 class="text-xl font-black italic uppercase tracking-tighter text-white mb-6 line-clamp-2 leading-tight">${game.name}</h2>
                </div>

                <div class="relative w-full aspect-square max-w-[220px] mb-6">
                    <div class="w-full h-full rounded-3xl overflow-hidden bg-black/40 border border-white/10 p-2 shadow-2xl">
                        <img src="${IMAGE_PROXY}${encodeURIComponent(game.thumbnail)}" class="w-full h-full object-contain rounded-2xl">
                    </div>
                    ${cardFeatures.rating ? `<div class="stat-circle absolute -left-4 top-1/2 -translate-y-1/2 bg-black/60 border-indigo-500/50"><span class="text-[7px] font-black text-indigo-400 uppercase">BGG</span><span class="text-xs font-black text-white">${game.rating.toFixed(1)}</span></div>` : ''}
                    ${cardFeatures.rank ? `<div class="stat-circle absolute -right-4 top-1/2 -translate-y-1/2 bg-black/60 border-emerald-500/50"><span class="text-[7px] font-black text-emerald-400 uppercase">RANK</span><span class="text-[10px] font-black text-white">#${game.rank < 999999 ? (game.rank > 999 ? Math.round(game.rank/1000)+'k' : game.rank) : 'NR'}</span></div>` : ''}
                </div>

                ${statsHtml}
            `;

            if (index === 0) addSwipeListeners(card);
            lucide.createIcons();
            return card;
        }

        function addSwipeListeners(card) {
            let startX = 0, startY = 0, isDragging = false;
            const start = (e) => { isDragging = true; startX = e.clientX || e.touches[0].clientX; startY = e.clientY || e.touches[0].clientY; card.classList.add('dragging'); };
            const move = (e) => {
                if (!isDragging) return;
                const x = e.clientX || e.touches[0].clientX, y = e.clientY || e.touches[0].clientY;
                const dx = x - startX, dy = y - startY;
                card.style.transform = `translateX(${dx}px) translateY(${dy}px) rotate(${dx * 0.05}deg)`;
                card.style.opacity = Math.max(0.5, 1 - Math.abs(dx) / 500);
            };
            const end = (e) => {
                if (!isDragging) return;
                isDragging = false; card.classList.remove('dragging');
                const dx = (e.clientX || (e.changedTouches ? e.changedTouches[0].clientX : 0)) - startX;
                if (Math.abs(dx) > 100) {
                    card.classList.add(dx > 0 ? 'swipe-right' : 'swipe-left');
                    setTimeout(nextCard, 300);
                } else { card.style.transform = ''; card.style.opacity = ''; }
            };
            card.onmousedown = card.ontouchstart = start;
            document.onmousemove = document.ontouchmove = move;
            document.onmouseup = document.ontouchend = end;
        }

        function nextCard() {
            if (currentCardIndex < allGames.length - 1) {
                currentCardIndex++; createCardStack(); updateProgressIndicator();
            } else backToSort();
        }

        function updateProgressIndicator() {
            const el = document.getElementById('progressIndicator');
            el.textContent = `${currentCardIndex + 1} / ${allGames.length}`;
        }

        function showGameInfo() {
            const game = allGames[currentCardIndex];
            if (!game) return;
            const modal = document.getElementById('gameInfoModal');
            document.getElementById('modalGameTitle').textContent = game.name;
            
            const section = (title, items) => items && items.length > 0 ? `<div class="space-y-2"><h3 class="text-[10px] font-black uppercase text-indigo-400 tracking-widest">${title}</h3><div class="flex flex-wrap gap-2">${items.map(i => `<span class="glass px-3 py-1 rounded-lg text-[9px] font-bold text-slate-300 border border-white/5">${i}</span>`).join('')}</div></div>` : '';

            document.getElementById('modalGameContent').innerHTML = `
                <div class="glass-dark p-4 rounded-2xl border border-white/5 text-[11px] text-slate-400 leading-relaxed italic">${game.description}...</div>
                ${section('Designers', game.allDesigners)}
                ${section('Mechanics', game.allMechanics)}
                ${section('Categories', game.allCategories)}
                ${section('Publishers', game.allPublishers)}
            `;
            modal.classList.remove('hidden');
        }

        function closeGameInfo() { document.getElementById('gameInfoModal').classList.add('hidden'); }

        function printCards() {
            const area = document.getElementById('printArea');
            area.innerHTML = '<div class="print-container">' + allGames.map(g => `
                <div class="print-card">
                    <h2>${g.name}</h2>
                    <img src="${g.thumbnail}">
                    <div class="stats">
                        ${g.year} • ${g.minplayers}-${g.maxplayers}p • ${g.playingtime}m<br>
                        BGG: ${g.rating.toFixed(1)} • Rank: #${g.rank < 999999 ? g.rank : 'NR'}<br>
                        Weight: ${g.averageweight.toFixed(1)}/5
                    </div>
                </div>
            `).join('') + '</div>';
            window.print();
        }

        document.addEventListener('keydown', (e) => {
            if (!isCardViewActive) return;
            if (e.key === 'ArrowRight' || e.key === ' ') nextCard();
            if (e.key === 'Escape') backToSort();
        });
    </script>
    <script type="module" src="analytics-init.js"></script>
</body>
</html>
