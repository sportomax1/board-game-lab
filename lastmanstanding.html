<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Tournament | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🏆</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        :root {
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
            height: 100dvh;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-dark {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .view {
            display: none;
            flex-direction: column;
            height: 100%;
            overflow-y: auto;
            padding: calc(1rem + var(--safe-top)) 1rem calc(5rem + var(--safe-bottom));
        }
        .view.active { display: flex; }

        .game-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-item {
            transition: all 0.2s ease;
        }
        .nav-item.active {
            color: #10b981;
        }
        .nav-item.active i {
            transform: translateY(-2px);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in { animation: fadeIn 0.4s ease-out forwards; }

        .btn-primary {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .status-pill {
            @apply text-center p-3 rounded-2xl text-xs font-black uppercase tracking-widest mb-4;
            display: none;
        }
        .status-pill.loading { display: block; @apply bg-blue-500/20 text-blue-400 border border-blue-500/30; }
        .status-pill.success { display: block; @apply bg-emerald-500/20 text-emerald-400 border border-emerald-500/30; }
        .status-pill.error { display: block; @apply bg-rose-500/20 text-rose-400 border border-rose-500/30; }

        .toast {
            position: fixed;
            top: calc(var(--safe-top) + 1rem);
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            z-index: 2000;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body class="selection:bg-emerald-500/30">
    <!-- Background Decor -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-emerald-900/20 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[10%] right-[0%] w-[50%] h-[50%] bg-purple-900/10 blur-[120px] rounded-full"></div>
    </div>

    <div id="toastsRoot"></div>

    <!-- SETUP VIEW -->
    <div id="view-setup" class="view active relative z-10 custom-scrollbar">
        <div class="mb-8 mt-4">
            <div class="w-16 h-16 bg-emerald-500/20 rounded-2xl flex items-center justify-center mb-4 border border-emerald-500/30">
                <i data-lucide="trophy" class="text-emerald-400 w-8 h-8"></i>
            </div>
            <h1 class="text-4xl font-black italic uppercase tracking-tighter leading-none mb-2">Tournament <span class="text-emerald-400">Mode</span></h1>
            <p class="text-slate-400 text-sm font-medium">Battle your games to find the ultimate champion</p>
        </div>

        <div class="space-y-6">
            <div class="glass rounded-[2rem] p-6 border border-white/10 space-y-4">
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">BGG Username</label>
                    <input type="text" id="username" value="sportomax" class="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500/50 transition-all font-medium">
                </div>
            </div>

            <div class="glass rounded-[2rem] p-6 border border-white/10 space-y-4">
                <div class="flex items-center justify-between">
                    <div class="flex flex-col">
                        <span class="text-sm font-bold text-white uppercase tracking-tight">Exclude Expansions</span>
                        <span class="text-[10px] text-slate-500">Only include standalone games</span>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="excludeExpansionsLMS" class="sr-only peer" checked>
                        <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
                    </label>
                </div>

                <div class="h-px bg-white/5"></div>

                <div class="flex items-center justify-between">
                    <div class="flex flex-col">
                        <span class="text-sm font-bold text-white uppercase tracking-tight">Weighted Upsets</span>
                        <span class="text-[10px] text-slate-500">Allow lower rated games to occasionally win</span>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="weightedRandomMode" class="sr-only peer">
                        <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
                    </label>
                </div>
            </div>

            <div id="statusDiv" class="status-pill"></div>

            <button class="w-full btn-primary text-white py-4 rounded-2xl font-black text-lg uppercase tracking-tight hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2" id="loadBtn" onclick="runFullTournament()">
                Run Tournament
                <i data-lucide="swords" class="w-5 h-5"></i>
            </button>
        </div>
    </div>

    <!-- BATTLE VIEW -->
    <div id="view-tournament" class="view relative z-10 custom-scrollbar">
        <div id="tournamentStatus" class="status-pill"></div>
        <div id="roundInfo" class="text-center text-[10px] font-black uppercase tracking-[0.2em] text-slate-500 mb-6"></div>
        <div id="tournamentLayout" class="space-y-3">
            <div class="flex flex-col items-center justify-center py-20 text-slate-600">
                <i data-lucide="swords" class="w-12 h-12 mb-4 opacity-20"></i>
                <p class="text-xs font-bold uppercase tracking-widest">Awaiting Battle</p>
            </div>
        </div>
    </div>

    <!-- RESULTS VIEW -->
    <div id="view-results" class="view relative z-10 custom-scrollbar">
        <div class="space-y-8">
            <section>
                <h2 class="text-[10px] font-black uppercase tracking-[0.3em] text-emerald-500 mb-4 ml-2">Final Standings</h2>
                <div id="finalStandingsView" class="glass rounded-[2rem] border border-white/10 divide-y divide-white/5 overflow-hidden">
                    <div class="p-12 text-center text-slate-600">
                        <p class="text-xs font-bold uppercase tracking-widest">No Results Yet</p>
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-[10px] font-black uppercase tracking-[0.3em] text-blue-500 mb-4 ml-2">Tournament Crosswalk</h2>
                <div id="crosswalkView" class="glass rounded-[2rem] border border-white/10 overflow-x-auto custom-scrollbar">
                    <div id="crosswalkContent" class="p-4"></div>
                </div>
            </section>

            <section>
                <h2 class="text-[10px] font-black uppercase tracking-[0.3em] text-purple-500 mb-4 ml-2">Matchup Audit Log</h2>
                <div id="auditLog" class="glass rounded-[2rem] border border-white/10 p-6">
                    <div id="auditLogContent" class="space-y-4"></div>
                </div>
            </section>
        </div>
    </div>

    <!-- NAV BAR -->
    <nav class="fixed bottom-0 left-0 right-0 glass-dark border-t border-white/5 flex items-center justify-around px-6 z-50">
        <button class="nav-item active flex flex-col items-center gap-1 py-3" onclick="switchTab('setup', this)">
            <i data-lucide="settings" class="w-5 h-5"></i>
            <span class="text-[8px] font-black uppercase tracking-widest">Setup</span>
        </button>
        <button class="nav-item flex flex-col items-center gap-1 py-3" onclick="switchTab('tournament', this)">
            <i data-lucide="swords" class="w-5 h-5"></i>
            <span class="text-[8px] font-black uppercase tracking-widest">Battle</span>
        </button>
        <button class="nav-item flex flex-col items-center gap-1 py-3" onclick="switchTab('results', this)">
            <i data-lucide="list-ordered" class="w-5 h-5"></i>
            <span class="text-[8px] font-black uppercase tracking-widest">Results</span>
        </button>
    </nav>

    <script>
        lucide.createIcons();

        let allGames = [];
        let currentRound = [];
        let auditLog = [];
        let roundNumber = 0;
        let gameRoundHistory = {};

        function switchTab(id, el) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            const view = document.getElementById(`view-${id}`);
            if (view) view.classList.add('active');
            el.classList.add('active');
        }

        function showStatus(message, type) {
            const div = document.getElementById('statusDiv');
            const tDiv = document.getElementById('tournamentStatus');
            [div, tDiv].forEach(d => {
                if(d) {
                    d.textContent = message;
                    d.className = 'status-pill ' + type;
                }
            });
        }

        function showToast(message) {
            const root = document.getElementById('toastsRoot');
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = message;
            root.appendChild(t);
            setTimeout(() => t.classList.add('show'), 10);
            setTimeout(() => {
                t.classList.remove('show');
                setTimeout(() => t.remove(), 300);
            }, 2000);
        }

        async function fetchWithRetry(url, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url);
                    if (response.status === 202) {
                        const delay = 2000 * (i + 1);
                        showStatus(`BGG is processing...`, 'loading');
                        await new Promise(r => setTimeout(r, delay));
                        continue;
                    }
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return await response.text();
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    await new Promise(r => setTimeout(r, 1000 * (i + 1)));
                }
            }
        }

        async function initiateTournament() {
            const username = document.getElementById('username').value.trim() || 'sportomax';
            const loadBtn = document.getElementById('loadBtn');

            showStatus(`Fetching collection...`, 'loading');
            loadBtn.disabled = true;

            try {
                let collectionUrl = `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1`;
                if (document.getElementById('excludeExpansionsLMS').checked) {
                    collectionUrl += '&excludesubtype=boardgameexpansion';
                }
                const collectionText = await fetchWithRetry(collectionUrl);
                const parser = new DOMParser();
                const collectionXml = parser.parseFromString(collectionText, 'text/xml');
                const items = Array.from(collectionXml.querySelectorAll('item'));

                if (items.length === 0) throw new Error('No games found');

                allGames = items.map((item, idx) => {
                    const stats = item.querySelector('stats');
                    const ratingEl = stats ? stats.querySelector('rating > average') : null;
                    return {
                        id: item.getAttribute('objectid'),
                        name: item.querySelector('name')?.textContent?.trim() || 'Unknown',
                        avgRating: ratingEl ? parseFloat(ratingEl.getAttribute('value')) : 0,
                        thumbnail: item.querySelector('thumbnail')?.textContent?.trim(),
                        eliminated: false,
                        matchupResult: null
                    };
                });

                allGames.sort((a, b) => b.avgRating - a.avgRating);
                currentRound = [...allGames];
                roundNumber = 0;
                auditLog = [];
                gameRoundHistory = {};
                allGames.forEach(g => gameRoundHistory[g.id] = [1]);

                showStatus(`Ready! ${allGames.length} games loaded.`, 'success');
                displayRound();
                
                setTimeout(() => switchTab('tournament', document.querySelectorAll('.nav-item')[1]), 1000);

            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
            } finally {
                loadBtn.disabled = false;
            }
        }

        async function runFullTournament() {
            const btn = document.getElementById('loadBtn');
            btn.disabled = true;
            try {
                await initiateTournament();
                await new Promise(r => setTimeout(r, 500));
                if (allGames && allGames.length > 0) {
                    while (currentRound.length > 1) {
                        showStatus(`Battle Round ${roundNumber + 1}`, 'loading');
                        await nextRound();
                        await new Promise(r => setTimeout(r, 400));
                    }
                    showStatus(`🏆 ${currentRound[0].name}`, 'success');
                    renderFinalStandings();
                    displayCrosswalk();
                    setTimeout(() => switchTab('results', document.querySelectorAll('.nav-item')[2]), 1000);
                }
            } catch (e) {
                showStatus('Tournament failed.', 'error');
            } finally {
                btn.disabled = false;
            }
        }

        function displayRound() {
            const container = document.getElementById('tournamentLayout');
            container.innerHTML = '';

            const badge = document.createElement('div');
            badge.className = 'bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-4 py-2 rounded-2xl text-[10px] font-black uppercase tracking-widest mb-6 inline-block';
            badge.textContent = roundNumber === 0 ? 'Initial Seed' : `Round ${roundNumber + 1}`;
            container.appendChild(badge);

            currentRound.forEach(game => {
                const card = document.createElement('div');
                card.className = 'glass rounded-3xl p-4 border border-white/5 flex items-center gap-4 animate-in';
                card.innerHTML = `
                    <div class="w-14 h-14 rounded-2xl bg-black/40 border border-white/5 p-1 flex-shrink-0">
                        <img src="${game.thumbnail || ''}" class="w-full h-full object-contain rounded-xl">
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="text-sm font-black text-white italic uppercase tracking-tighter truncate">${game.name}</div>
                        <div class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mt-1">Rating: <span class="text-emerald-400">${game.avgRating.toFixed(2)}</span></div>
                        ${game.matchupResult ? `<div class="mt-2 text-[8px] font-black uppercase tracking-widest bg-white/5 p-2 rounded-xl border border-white/5">${game.matchupResult}</div>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('roundInfo').textContent = `${currentRound.length} Combatants Left`;
        }

        async function nextRound() {
            if (currentRound.length <= 1) return;
            roundNumber++;
            const winners = [];
            const matchups = [];
            const shuffled = [...currentRound].sort(() => Math.random() - 0.5);

            for (let i = 0; i < shuffled.length; i += 2) {
                const g1 = shuffled[i];
                const g2 = shuffled[i + 1];

                if (!g2) {
                    g1.matchupResult = '<span class="text-blue-400">BYE</span> Advanced';
                    winners.push(g1);
                    matchups.push({ winner: g1, loser: null, method: 'bye' });
                    continue;
                }

                let winner, loser, method;
                const weighted = document.getElementById('weightedRandomMode').checked;

                if (weighted) {
                    const sum = g1.avgRating + g2.avgRating;
                    const rnd = Math.random() * sum;
                    winner = rnd <= g1.avgRating ? g1 : g2;
                    loser = winner === g1 ? g2 : g1;
                    method = `Weighted Luck`;
                } else {
                    if (g1.avgRating > g2.avgRating) { winner = g1; loser = g2; }
                    else if (g2.avgRating > g1.avgRating) { winner = g2; loser = g1; }
                    else { winner = Math.random() > 0.5 ? g1 : g2; loser = winner === g1 ? g2 : g1; }
                    method = `Skill Rating`;
                }

                const isUpset = winner.avgRating < loser.avgRating;
                winner.matchupResult = `<span class="text-emerald-400">WINNER</span> via ${method} ${isUpset ? '⭐' : ''}`;
                loser.matchupResult = `<span class="text-rose-400">ELIMINATED</span> vs ${winner.name}`;
                winners.push(winner);
                matchups.push({ winner, loser, method, upset: isUpset });
            }

            auditLog.push({ round: roundNumber, matchups });
            winners.forEach(g => gameRoundHistory[g.id].push(roundNumber + 1));
            currentRound = winners;
            displayRound();
            updateAuditLog();
        }

        function updateAuditLog() {
            const content = document.getElementById('auditLogContent');
            content.innerHTML = auditLog.map(r => `
                <div class="space-y-2">
                    <div class="text-[8px] font-black uppercase tracking-widest text-slate-500">Round ${r.round} Battles</div>
                    ${r.matchups.map(m => `
                        <div class="text-[10px] py-2 border-b border-white/5 text-slate-300">
                            ${m.loser ? `<b>${m.winner.name}</b> def. ${m.loser.name}` : `<b>${m.winner.name}</b> bye`}
                        </div>
                    `).join('')}
                </div>
            `).join('');
        }

        function renderFinalStandings() {
            const wins = {};
            allGames.forEach(g => wins[g.id] = 0);
            auditLog.forEach(r => r.matchups.forEach(m => { if(m.winner) wins[m.winner.id]++; }));

            const standings = allGames.map(g => ({
                ...g,
                wins: wins[g.id],
                finishRound: Math.max(...gameRoundHistory[g.id])
            })).sort((a, b) => b.finishRound - a.finishRound || b.wins - a.wins || b.avgRating - a.avgRating);

            const root = document.getElementById('finalStandingsView');
            root.innerHTML = standings.map((g, i) => `
                <div class="flex items-center gap-4 p-4 hover:bg-white/5 transition-colors">
                    <div class="text-xl font-black italic text-emerald-500 w-8">${i + 1}</div>
                    <div class="w-10 h-10 rounded-lg bg-black/20 p-1">
                        <img src="${g.thumbnail || ''}" class="w-full h-full object-contain rounded-md">
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="text-xs font-black uppercase italic truncate text-white">${g.name}</div>
                        <div class="text-[8px] font-bold text-slate-500 uppercase tracking-widest">Eliminated Round ${g.finishRound} • ${g.wins} Wins</div>
                    </div>
                </div>
            `).join('');
        }

        function displayCrosswalk() {
            const totalRounds = roundNumber + 1;
            let header = '<th class="p-3 text-left">Contender</th>';
            for (let i = 1; i <= totalRounds; i++) header += `<th class="p-3 text-center">R${i}</th>`;

            const rows = allGames.map(g => {
                const rounds = gameRoundHistory[g.id];
                let cells = '';
                for (let i = 1; i <= totalRounds; i++) {
                    cells += `<td class="p-3 text-center text-xs">${rounds.includes(i) ? '✅' : '—'}</td>`;
                }
                return `<tr class="border-b border-white/5"><td class="p-3 text-[10px] font-black uppercase italic text-white">${g.name}</td>${cells}</tr>`;
            }).join('');

            document.getElementById('crosswalkContent').innerHTML = `
                <table class="w-full text-[10px] font-bold text-slate-500 uppercase tracking-widest">
                    <thead><tr class="bg-white/5">${header}</tr></thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }
    </script>
    <script type="module" src="analytics-init.js"></script>
</body>
</html>
