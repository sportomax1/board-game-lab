<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <title>BGG Player Count Menu</title>
    <style>
        @page { 
            size: letter; 
            margin: 0.5in;
            @top-left { content: ""; }
            @top-center { content: ""; }
            @top-right { content: ""; }
            @bottom-left { content: ""; }
            @bottom-center { content: ""; }
            @bottom-right { content: ""; }
        }
        
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #f7f7fa; color: #222; }
        .container { max-width: 430px; margin: 0 auto; padding: 2em 1em 1em 1em; box-sizing: border-box; min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
        h1 { font-size: 1.7em; margin-bottom: 1em; text-align: center; }
        
        /* Print view hidden by default */
        #printViewContainer { display: none; }
        #printViewContainer.active { display: block; }
        #normalViewContainer.hidden-print { display: none; }
        
        /* Print mode styles */
        @media print {
            #normalViewContainer { display: none !important; }
            #printViewContainer { display: block !important; background: white !important; }
            .no-print { display: none !important; }
            body { background: white !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .print-header { text-align: center !important; }
            h1 { text-align: center !important; page-break-inside: avoid; }
        }
        
        /* Print grid styles */
        .print-header { text-align: center; margin-bottom: 0.25in; font-size: 16px; font-weight: bold; color: #333; }
        .print-grid { display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(12, 1fr); gap: 2px; width: 7.5in; height: 9in; margin: 0 auto; border: 1px solid #ccc; }
        .print-tile { position: relative; border: 1px solid #ddd; background: #f9f9f9; overflow: hidden; }
        .print-tile img { width: 100%; height: 100%; object-fit: contain; display: block; background: #f5f5f5; pointer-events: none; user-select: none; }
        .print-rank { position: absolute; top: 1px; left: 1px; background: rgba(0,0,0,0.8); color: white; font-size: 8px; padding: 1px 2px; border-radius: 2px; font-weight: bold; z-index: 10; }
        .print-category { position: absolute; top: 1px; right: 1px; font-size: 8px; padding: 1px 3px; border-radius: 2px; font-weight: bold; z-index: 10; }
        .category-perfect, .category-best { background: #4caf50; color: white; }
        .category-recommended { background: #ffeb3b; color: black; }
        .print-bayes { position: absolute; bottom: 1px; right: 1px; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: bold; color: black; text-shadow: 0 0 2px rgba(255,255,255,0.8); z-index: 10; }
        .print-votes { position: absolute; bottom: 1px; left: 1px; background: rgba(0,0,0,0.8); color: white; font-size: 8px; padding: 1px 2px; border-radius: 2px; font-weight: bold; z-index: 10; line-height: 1.1; }
        .custom-footer { position: fixed; bottom: 0.25in; right: 0.5in; font-size: 10px; color: #666; z-index: 1000; }
        
        .form-container { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px #0001; padding: 1.5em; margin-bottom: 1.5em; }
        .form-group { margin-bottom: 1em; }
        .form-label { display: block; font-weight: 600; margin-bottom: 0.5em; color: #333; }
        .form-input { width: 100%; padding: 0.8em; border: 1px solid #ccc; border-radius: 8px; font-size: 1em; box-sizing: border-box; }
        .form-input:focus { outline: none; border-color: #1976d2; box-shadow: 0 0 5px rgba(25, 118, 210, 0.3); }
        
        .submit-btn { width: 100%; background: #1976d2; color: #fff; border: none; border-radius: 8px; padding: 1em; font-size: 1.1em; font-weight: 600; cursor: pointer; margin-top: 0.5em; }
        .submit-btn:hover { background: #1565c0; }
        .submit-btn:disabled { background: #ccc; cursor: not-allowed; }
        
        .loading { text-align: center; color: #888; font-size: 1.1em; margin: 2em 0; }
        .stats { background: #e3f2fd; border-radius: 8px; padding: 1em; margin-bottom: 1em; font-size: 0.95em; }
        
        .game-list { margin-top: 1em; }
        .game-card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px #0001; margin-bottom: 1em; padding: 1em 1.2em; display: flex; flex-direction: row; align-items: center; position: relative; }
        .game-thumb { width: 64px; height: 64px; border-radius: 10px; margin-right: 1em; object-fit: contain; flex-shrink: 0; background: #f5f5f5; }
        .game-info { display: flex; flex-direction: column; flex: 1; }
        .game-title { font-size: 1.1em; font-weight: 600; margin-bottom: 0.2em; }
        .game-details { font-size: 0.98em; color: #555; }
        
        .category-flag { position: absolute; top: 8px; right: 8px; padding: 0.2em 0.5em; border-radius: 12px; font-size: 0.75em; font-weight: 600; color: #fff; }
        .flag-perfect { background: #4caf50; } /* Min=Max players - Perfect fit */
        .flag-best { background: #ff9800; } /* Best at player count */
        .flag-recommended { background: #2196f3; } /* Recommended at player count */
        .flag-supported { background: #9e9e9e; } /* Just supports player count */
        
        .bayes-indicator { position: absolute; bottom: 8px; right: 8px; padding: 0.2em 0.5em; border-radius: 8px; font-size: 0.75em; font-weight: 600; }
        .bayes-excellent { background: rgba(76,175,80,0.9); color: white; } /* 8.0+ */
        .bayes-very-good { background: rgba(139,195,74,0.9); color: white; } /* 7.5+ */
        .bayes-good { background: rgba(255,235,59,0.9); color: black; } /* 7.0+ */
        .bayes-average { background: rgba(255,152,0,0.9); color: white; } /* 6.0+ */
        .bayes-below { background: rgba(244,67,54,0.9); color: white; } /* < 6.0 */
        
        .player-votes-indicator { position: absolute; top: 50%; right: 8px; transform: translateY(-50%); background: rgba(0,0,0,0.8); color: white; padding: 0.2em 0.4em; border-radius: 6px; font-size: 0.65em; font-weight: 600; line-height: 1.2; z-index: 2; }
        
        .error { background: #ffebee; color: #c62828; border-radius: 8px; padding: 1em; margin: 1em 0; }
        
        /* Print Options Modal */
        .modal { 
            display: none !important; 
            position: fixed; 
            z-index: 10000; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background-color: rgba(0,0,0,0.5); 
            align-items: center; 
            justify-content: center;
        }
        .modal[style*="display: block"] {
            display: flex !important;
        }
        .modal-content { 
            background-color: #fff; 
            padding: 1.5em; 
            border-radius: 12px; 
            width: 90%; 
            max-width: 500px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            z-index: 10001;
        }
        .modal-header { font-size: 1.2em; font-weight: 600; margin-bottom: 1em; text-align: center; color: #333; }
        .modal-section { margin-bottom: 1.5em; }
        .modal-section h3 { font-size: 1.1em; margin-bottom: 0.5em; color: #333; }
        .corner-options { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8em; margin-bottom: 1em; }
        .corner-group { border: 1px solid #ddd; border-radius: 8px; padding: 0.8em; }
        .corner-title { font-weight: 600; margin-bottom: 0.5em; font-size: 0.85em; color: #333; }
        .option-group { margin-bottom: 0.5em; }
        .option-group label { display: block; font-size: 0.8em; margin-bottom: 0.3em; color: #555; }
        .option-group select { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-size: 0.8em; }
        .modal-buttons { display: flex; gap: 0.8em; justify-content: center; margin-top: 1.5em; }
        .modal-btn { padding: 0.8em 1.2em; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.9em; }
        .btn-print { background: #4caf50; color: white; }
        .btn-print:hover { background: #45a049; }
        .btn-cancel { background: #ccc; color: #333; }
        .btn-cancel:hover { background: #bbb; }
        
        /* Mobile optimizations */
        @media (max-width: 480px) {
            .modal-content { 
                margin: 5% auto; 
                padding: 1em; 
                width: 95%; 
                max-height: 90vh;
            }
            .corner-options { grid-template-columns: 1fr; gap: 0.5em; }
            .modal-header { font-size: 1.1em; }
            .corner-title { font-size: 0.8em; }
            .option-group label { font-size: 0.75em; }
            .option-group select { font-size: 0.75em; padding: 0.6em; }
            .modal-buttons { flex-direction: column; gap: 0.5em; }
            .modal-btn { width: 100%; padding: 1em; }
        }
    </style>
</head>

    <script>
        let allGames = [];
        let gameDetails = {};
        let currentSortedGames = []; // Store current sorted games for print view
        let currentGameDetails = {}; // Store current game details for print view

        // Initialize - no longer need special print page handling
        window.addEventListener('DOMContentLoaded', () => {
            console.log('[INIT] DOMContentLoaded event fired');
        });

        // Clear localStorage when page loads normally
        window.addEventListener('load', () => {
            console.log('[INIT] Window load event fired');
        });

        // Function to fetch user's BGG collection
        async function fetchBGGCollection(username) {
            try {
                const response = await fetch(`/api/bgg-helper?endpoint=collection&username=${username}&own=1&stats=1`);
                if (!response.ok) {
                    if (response.status === 202) {
                        // BGG is processing the request, wait and retry
                        await new Promise(resolve => setTimeout(resolve, 3000));
                        return await fetchBGGCollection(username);
                    }
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const xml = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(xml, 'text/xml');
                
                const items = Array.from(doc.querySelectorAll('item'));
                const games = [];
                
                items.forEach(item => {
                    const objectId = item.getAttribute('objectid');
                    const name = item.querySelector('name')?.textContent || 'Unknown';
                    const thumbnail = item.querySelector('thumbnail')?.textContent || '';
                    const year = item.querySelector('yearpublished')?.textContent || '';
                    
                    // Get stats if available
                    const stats = item.querySelector('stats');
                    let minPlayers = '';
                    let maxPlayers = '';
                    let playingTime = '';
                    let bayesAverage = '';
                    
                    if (stats) {
                        minPlayers = stats.getAttribute('minplayers') || '';
                        maxPlayers = stats.getAttribute('maxplayers') || '';
                        playingTime = stats.getAttribute('playingtime') || '';
                        
                        const rating = stats.querySelector('rating');
                        if (rating) {
                            const bayes = rating.querySelector('bayesaverage');
                            if (bayes) {
                                bayesAverage = parseFloat(bayes.getAttribute('value')) || 0;
                            }
                        }
                    }
                    
                    games.push({
                        objectId,
                        name,
                        thumbnail,
                        year,
                        minPlayers: parseInt(minPlayers) || 0,
                        maxPlayers: parseInt(maxPlayers) || 0,
                        playingTime: parseInt(playingTime) || 0,
                        bayesAverage: bayesAverage
                    });
                });
                
                return games;
            } catch (error) {
                console.error('Error fetching collection:', error);
                throw error;
            }
        }
        
        // Function to fetch detailed game info with player count recommendations
        async function fetchGameDetails(objectIds, startTime, initialGames, username, playerCount) {
            const details = {};
            const batchSize = 20; // Increased batch size for thing API calls
            
            for (let i = 0; i < objectIds.length; i += batchSize) {
                const batch = objectIds.slice(i, i + batchSize);
                const idsParam = batch.join(',');
                
                // Update progress with timer
                const resultsDiv = document.getElementById('results');
                const progress = Math.round((i / objectIds.length) * 100);
                const elapsedTime = ((Date.now() - startTime) / 1000).toFixed(1);
                const estimatedTotal = objectIds.length > 0 ? (elapsedTime / (i + batchSize)) * objectIds.length : 0;
                const eta = estimatedTotal > elapsedTime ? (estimatedTotal - elapsedTime).toFixed(1) : '0.0';
                
                // Update the existing basic results with progress info
                const existingStats = resultsDiv.querySelector('.stats');
                if (existingStats) {
                    const progressDiv = resultsDiv.querySelector('.progress-info') || document.createElement('div');
                    progressDiv.className = 'progress-info';
                    progressDiv.style.cssText = 'background:#fff3e0; border-radius:8px; padding:0.8em; margin:0.5em 0; font-size:0.9em; border-left:4px solid #ff9800;';
                    progressDiv.innerHTML = `
                        <strong>🔄 Enhancing with detailed data...</strong><br>
                        Progress: ${progress}% (${i}/${objectIds.length}) - Batches of ${batchSize}<br>
                        Elapsed: ${elapsedTime}s | ETA: ${eta}s
                    `;
                    
                    if (!resultsDiv.querySelector('.progress-info')) {
                        existingStats.insertAdjacentElement('afterend', progressDiv);
                    }
                }
                
                let retryCount = 0;
                const maxRetries = 3;
                let success = false;
                
                while (retryCount < maxRetries && !success) {
                    try {
                        const response = await fetch(`/api/bgg-helper?endpoint=thing&id=${idsParam}&stats=1`);
                        
                        if (response.status === 429) {
                            // Rate limited - wait longer and retry
                            const waitTime = Math.min(5000 * (retryCount + 1), 15000); // Exponential backoff up to 15 seconds
                            console.warn(`Rate limited for batch starting at ${i}, waiting ${waitTime/1000} seconds... (attempt ${retryCount + 1}/${maxRetries})`);
                            await new Promise(resolve => setTimeout(resolve, waitTime));
                            retryCount++;
                            continue;
                        }
                        
                        if (!response.ok) {
                            console.warn(`Failed to fetch details for batch starting at ${i}: ${response.status}`);
                            break;
                        }
                        
                        success = true;
                        
                        const xml = await response.text();
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(xml, 'text/xml');
                        
                        const items = Array.from(doc.querySelectorAll('item'));
                        items.forEach(item => {
                            const objectId = item.getAttribute('id');
                            
                            // Get player count polls
                            const playerCountPoll = item.querySelector('poll[name="suggested_numplayers"]');
                            const playerCountData = {};
                            const playerVotesArray = []; // Array format for print view
                            
                            if (playerCountPoll) {
                                const results = Array.from(playerCountPoll.querySelectorAll('results'));
                                results.forEach(result => {
                                    const numPlayers = result.getAttribute('numplayers');
                                    const best = parseInt(result.querySelector('result[value="Best"]')?.getAttribute('numvotes') || '0');
                                    const recommended = parseInt(result.querySelector('result[value="Recommended"]')?.getAttribute('numvotes') || '0');
                                    const notRecommended = parseInt(result.querySelector('result[value="Not Recommended"]')?.getAttribute('numvotes') || '0');
                                    
                                    playerCountData[numPlayers] = {
                                        best,
                                        recommended,
                                        notRecommended,
                                        total: best + recommended + notRecommended
                                    };
                                    
                                    // Also store in array format for print view
                                    playerVotesArray.push({
                                        playerCount: parseInt(numPlayers),
                                        best,
                                        recommended,
                                        notRecommended
                                    });
                                });
                            }
                            
                            // Get BGG rank and Bayes average from stats
                            let bggRank = '';
                            let bayesAverage = 0;
                            
                            const statistics = item.querySelector('statistics');
                            if (statistics) {
                                const ranks = statistics.querySelectorAll('rank');
                                for (const rank of ranks) {
                                    if (rank.getAttribute('name') === 'boardgame') {
                                        const rankValue = rank.getAttribute('value');
                                        bggRank = rankValue && rankValue !== 'Not Ranked' ? rankValue : '';
                                        break;
                                    }
                                }
                                
                                const bayesElement = statistics.querySelector('bayesaverage');
                                if (bayesElement) {
                                    bayesAverage = parseFloat(bayesElement.getAttribute('value')) || 0;
                                }
                            }
                            
                            details[objectId] = {
                                playerCountData,
                                playerVotes: playerVotesArray, // Add for print view
                                bggRank,
                                bayesAverage
                            };
                        });
                        
                        // Progressive re-sort and update display after each batch
                        if (i % (batchSize * 2) === 0 || i + batchSize >= objectIds.length) {
                            // Re-categorize games with current details
                            const updatedGames = initialGames.map(game => ({
                                ...game,
                                category: categorizeGame(game, playerCount, details),
                                bayesAverage: details[game.objectId]?.bayesAverage || game.bayesAverage || 0
                            }));
                            
                            // Re-sort with updated categories
                            const reSortedGames = filterAndSortGames(updatedGames, playerCount, details);
                            
                            // Update the display progressively (without changing the progress indicator)
                            updateGameCardsProgressively(reSortedGames, details);
                        }
                        
                    } catch (error) {
                        console.error(`Error fetching details for batch starting at ${i} (attempt ${retryCount + 1}):`, error);
                        retryCount++;
                        if (retryCount < maxRetries) {
                            const waitTime = 3000 * (retryCount + 1); // Progressive delay
                            await new Promise(resolve => setTimeout(resolve, waitTime));
                        }
                    }
                } // End retry loop
                
                // Add longer delay between batches to be more respectful to BGG API
                if (i + batchSize < objectIds.length) {
                    await new Promise(resolve => setTimeout(resolve, 2500)); // Increased from 1000ms to 2500ms
                }
            }
            
            return details;
        }
        
        // Function to categorize games based on player count
        function categorizeGame(game, targetPlayerCount, details) {
            const gameDetails = details[game.objectId];
            if (!gameDetails) return 'supported';
            
            const playerData = gameDetails.playerCountData[targetPlayerCount.toString()];
            if (!playerData) {
                // Check if game supports this player count within min/max range
                if (targetPlayerCount >= game.minPlayers && targetPlayerCount <= game.maxPlayers) {
                    return 'supported';
                }
                return null; // Doesn't support this player count
            }
            
            // Check if min players equals max players and matches target
            if (game.minPlayers === game.maxPlayers && game.minPlayers === targetPlayerCount) {
                return 'perfect';
            }
            
            // Determine category based on voting
            const bestVotes = playerData.best;
            const recommendedVotes = playerData.recommended;
            const notRecommendedVotes = playerData.notRecommended;
            const totalVotes = playerData.total;
            
            if (totalVotes < 3) {
                // Not enough votes, just check if it supports the count
                return 'supported';
            }
            
            // Calculate percentages
            const bestPercent = (bestVotes / totalVotes) * 100;
            const recommendedPercent = (recommendedVotes / totalVotes) * 100;
            
            if (bestPercent >= 50 || (bestVotes > recommendedVotes && bestVotes > notRecommendedVotes)) {
                return 'best';
            } else if ((bestPercent + recommendedPercent) >= 50 || recommendedVotes > notRecommendedVotes) {
                return 'recommended';
            } else {
                return 'supported';
            }
        }
        
        // Function to get Bayes average styling
        function getBayesStyle(bayes) {
            if (bayes >= 8.0) return 'bayes-excellent';
            if (bayes >= 7.5) return 'bayes-very-good';
            if (bayes >= 7.0) return 'bayes-good';
            if (bayes >= 6.0) return 'bayes-average';
            return 'bayes-below';
        }
        
        // Function to filter and sort games
        function filterAndSortGames(games, targetPlayerCount, details) {
            // Filter games that support the target player count
            const filteredGames = games.filter(game => {
                const category = categorizeGame(game, targetPlayerCount, details);
                return category !== null;
            }).map(game => ({
                ...game,
                category: categorizeGame(game, targetPlayerCount, details),
                bayesAverage: details[game.objectId]?.bayesAverage || game.bayesAverage || 0
            }));
            
            // Sort by category priority, then by Bayes average within each category
            const categoryOrder = { 'perfect': 1, 'best': 2, 'recommended': 3, 'supported': 4 };
            
            filteredGames.sort((a, b) => {
                // First sort by category
                if (categoryOrder[a.category] !== categoryOrder[b.category]) {
                    return categoryOrder[a.category] - categoryOrder[b.category];
                }
                
                // Within same category, sort by Bayes average (descending)
                return b.bayesAverage - a.bayesAverage;
            });
            
            return filteredGames;
        }

        // Main function to handle form submission
        async function handleSubmit() {
            const username = document.getElementById('username').value.trim();
            const playerCount = parseInt(document.getElementById('playerCount').value);
            const submitBtn = document.getElementById('submitBtn');
            const resultsDiv = document.getElementById('results');
            
            if (!username) {
                alert('Please enter a username');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Loading...';
            const startTime = Date.now();
            
            try {
                // Fetch collection
                resultsDiv.innerHTML = '<div class="loading">Fetching BGG collection...</div>';
                const games = await fetchBGGCollection(username);
                
                if (games.length === 0) {
                    resultsDiv.innerHTML = '<div class="error">No games found in collection or collection is private.</div>';
                    return;
                }
                
                // Filter games by basic player count first (using min/max from collection)
                const basicFilteredGames = games.filter(game => {
                    return playerCount >= game.minPlayers && playerCount <= game.maxPlayers;
                }).map(game => ({
                    ...game,
                    category: 'loading', // Temporary category while we fetch details
                    bayesAverage: game.bayesAverage || 0
                })).sort((a, b) => b.bayesAverage - a.bayesAverage); // Sort by Bayes average initially
                
                // Show basic results immediately
                const collectionTime = ((Date.now() - startTime) / 1000).toFixed(1);
                displayBasicResults(basicFilteredGames, username, playerCount, collectionTime);
                
                // Now fetch detailed player count data in the background
                const objectIds = basicFilteredGames.map(g => g.objectId);
                if (objectIds.length > 0) {
                    const detailsStartTime = Date.now();
                    const details = await fetchGameDetails(objectIds, startTime, basicFilteredGames, username, playerCount);
                    
                    // Re-categorize and re-sort with detailed data
                    const detailedFilteredGames = filterAndSortGames(basicFilteredGames, playerCount, details);
                    
                    // Update display with final results
                    const totalTime = ((Date.now() - startTime) / 1000).toFixed(1);
                    displayResults(detailedFilteredGames, details, username, playerCount, totalTime);
                }
                
            } catch (error) {
                console.error('Error:', error);
                resultsDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Find Games';
            }
        }

        // Cover Collage Functions
        async function loadCoverCollection() {
            const username = document.getElementById('coverUsername').value.trim();
            if (!username) {
                alert('Please enter a username');
                return;
            }

            document.getElementById('coverLoadBtn').disabled = true;

            try {
                const xml = await fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1`)
                    .then(r => r.text());
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(xml, 'text/xml');
                
                let items = Array.from(doc.querySelectorAll('item'));
                
                if (document.getElementById('coverExcludeExpansions').checked) {
                    items = items.filter(item => item.getAttribute('subtype') !== 'boardgameexpansion');
                }

                const games = [];
                items.forEach(item => {
                    const name = item.querySelector('name')?.textContent || 'Unknown';
                    const thumbnail = item.querySelector('thumbnail')?.textContent || '';
                    
                    if (thumbnail) {
                        const stats = item.querySelector('stats');
                        const rating = stats?.querySelector('rating');
                        games.push({
                            name,
                            thumbnail,
                            userRating: parseFloat(rating?.getAttribute('value') || '0'),
                            average: parseFloat(rating?.querySelector('average')?.getAttribute('value') || '0'),
                            rank: parseInt(rating?.querySelector('rank[name="boardgame"]')?.getAttribute('value') || '999999')
                        });
                    }
                });

                if (games.length === 0) {
                    alert('No games found');
                    document.getElementById('coverLoadBtn').disabled = false;
                    return;
                }

                const sortOrder = document.getElementById('sortOrder').value;
                games.sort((a, b) => {
                    switch(sortOrder) {
                        case 'alpha': return a.name.localeCompare(b.name);
                        case 'average': return b.average - a.average;
                        case 'rating': return b.userRating - a.userRating;
                        case 'rank': return a.rank - b.rank;
                        default: return 0;
                    }
                });

                coverGames = games;
                renderCoverCollage();
                document.getElementById('coverPreview').style.display = 'block';
                document.getElementById('coverPrintBtn').disabled = false;
                document.getElementById('coverLoadBtn').disabled = false;
            } catch (error) {
                alert('Error loading collection: ' + error.message);
                document.getElementById('coverLoadBtn').disabled = false;
            }
        }

        function renderCoverCollage() {
            const collage = document.getElementById('collage');
            collage.innerHTML = '';
            collage.style.gridTemplateColumns = 'repeat(5, 1fr)';
            
            coverGames.slice(0, 50).forEach(game => {
                const tile = document.createElement('div');
                tile.style.cssText = 'aspect-ratio: 0.7; border-radius: 8px; overflow: hidden; background: #f5f5f5;';
                tile.innerHTML = `<img src="${game.thumbnail}" alt="${game.name}" style="width: 100%; height: 100%; object-fit: contain; pointer-events: none; user-select: none; -webkit-user-select: none;">`;
                collage.appendChild(tile);
            });
        }

        function printCoverCollage() {
            const username = document.getElementById('coverUsername').value;
            const sortOrder = document.getElementById('sortOrder').value;
            const printWindow = window.open('', 'print_collage', 'width=8.5in,height=11in');
            
            let html = `
            <!DOCTYPE html>
            <html>
            <head>
                <style>
                    @page { margin: 0.25in; size: letter; }
                    body { margin: 0; padding: 0.25in; background: white; font-family: Arial, sans-serif; }
                    .header { text-align: center; margin-bottom: 0.3in; }
                    .header h1 { margin: 0; font-size: 18px; }
                    .header p { margin: 0; font-size: 11px; color: #666; }
                    .collage { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; }
                    .tile { aspect-ratio: 0.7; overflow: hidden; border: 1px solid #ddd; }
                    .tile img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; user-select: none; -webkit-user-select: none; }
                </style>
            </head>
            <body>
                <div class="header">
                    <h1>${username}'s Collection</h1>
                    <p>Sorted by ${sortOrder} | Generated ${new Date().toLocaleDateString()}</p>
                </div>
                <div class="collage">
            `;

            coverGames.slice(0, 120).forEach(game => {
                html += `<div class="tile"><img src="${game.thumbnail}" alt="${game.name}"></div>`;
            });

            html += `</div></body></html>`;
            
            printWindow.document.write(html);
            printWindow.document.close();
            setTimeout(() => printWindow.print(), 500);
        }

        document.getElementById('coverLoadBtn').addEventListener('click', loadCoverCollection);
        document.getElementById('coverPrintBtn').addEventListener('click', printCoverCollage);

        // Private Collection CSV Handler
        function parseCSV(csvText) {
            const lines = csvText.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            const games = [];

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                
                // Simple CSV parser that handles quoted fields
                const regex = /"([^"]*)"|([^,]+)/g;
                const fields = [];
                let match;
                while ((match = regex.exec(lines[i])) !== null) {
                    fields.push(match[1] !== undefined ? match[1] : match[2].trim());
                }

                const game = {};
                headers.forEach((header, idx) => {
                    game[header] = fields[idx] || '';
                });
                games.push(game);
            }

            return games;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function updatePrivateProgress(percent, text) {
            document.getElementById('privateProgressFill').style.width = `${percent}%`;
            document.getElementById('privateProgressText').textContent = text;
        }

        async function fetchThumbnailsBatch(gameIds) {
            try {
                const thingUrl = `/api/bgg-helper?endpoint=thing&id=${gameIds.join(',')}&stats=1`;
                const response = await fetch(thingUrl);
                const xml = await response.text();
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(xml, 'text/xml');
                
                const thumbnailMap = {};
                Array.from(doc.querySelectorAll('item')).forEach(item => {
                    const id = item.getAttribute('id');
                    const thumbnail = item.querySelector('thumbnail')?.textContent || '';
                    thumbnailMap[id] = thumbnail;
                });
                
                return thumbnailMap;
            } catch (error) {
                console.error('Error fetching thumbnails:', error);
                return {};
            }
        }

        // Store all loaded games for sorting/filtering
        let allPrivateGames = [];

        function sortAndFilterPrivateGames() {
            const sortBy = document.getElementById('privateSortSelect').value;
            const filterOwnedOnly = document.getElementById('filterOwnedOnly').checked;
            
            let filtered = allPrivateGames;
            
            // Filter by owned status
            if (filterOwnedOnly) {
                filtered = filtered.filter(g => g.own === '1' || g.own === 1);
            }
            
            // Sort based on selection
            let sorted = [...filtered];
            const [sortField, sortOrder] = sortBy.split('_');
            
            sorted.sort((a, b) => {
                let aVal = a[sortField];
                let bVal = b[sortField];
                
                // Handle numeric fields
                if (sortField === 'rating' || sortField === 'weight' || sortField === 'numplays') {
                    aVal = parseFloat(aVal) || 0;
                    bVal = parseFloat(bVal) || 0;
                    return sortOrder === 'asc' ? aVal - bVal : bVal - aVal;
                }
                
                // Handle date fields
                if (sortField === 'invdate' || sortField === 'acquisitiondate') {
                    aVal = new Date(aVal || '1970-01-01');
                    bVal = new Date(bVal || '1970-01-01');
                    return sortOrder === 'asc' ? aVal - bVal : bVal - aVal;
                }
                
                // Handle string fields
                aVal = (aVal || '').toString().toLowerCase();
                bVal = (bVal || '').toString().toLowerCase();
                return sortOrder === 'asc' ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
            });
            
            // Update showing count
            document.getElementById('showingGames').textContent = sorted.length;
            
            // Render
            renderPrivateGameCards(sorted);
        }

        function renderPrivateGameCards(games) {
            const gameList = document.getElementById('privateGameList');
            gameList.innerHTML = games.map(game => {
                return `
                    <div class="game-card">
                        ${game.thumbnail ? `<img src="${game.thumbnail}" alt="${game.objectname || game.name}" class="game-thumb">` : '<div class="game-thumb" style="background: #f5f5f5; display: flex; align-items: center; justify-content: center; font-size: 2em;">🎲</div>'}
                        <div class="game-info" style="flex: 1;">
                            <div class="game-title">${game.objectname || game.name}</div>
                            <div class="game-details">
                                <div>📅 Acquired: ${formatDate(game.acquisitiondate)} | Inv Date: ${formatDate(game.invdate)}</div>
                                <div>⭐ Rating: ${game.rating || 'N/A'} | Plays: ${game.numplays || '0'} | Weight: ${game.weight || 'N/A'}</div>
                                <div>📍 ${game.invlocation || game.comment || '-'} ${game.privatecomment ? `| ${game.privatecomment}` : ''}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function displayPrivateGamesWithThumbnails(games) {
            // Show progress
            document.getElementById('privateProgress').style.display = 'block';
            updatePrivateProgress(0, 'Fetching thumbnails...');

            // Store all games
            allPrivateGames = games.map(g => ({
                ...g,
                own: g.own || '0',
                thumbnail: g.thumbnail || ''
            }));

            // Display stats immediately
            document.getElementById('totalGames').textContent = allPrivateGames.length;
            const ownedGames = allPrivateGames.filter(g => g.own === '1' || g.own === 1);
            document.getElementById('showingGames').textContent = ownedGames.length;
            
            if (allPrivateGames.length > 0) {
                const sorted = [...allPrivateGames].sort((a, b) => {
                    const dateA = new Date(a.invdate || a.acquisitiondate || '1970-01-01');
                    const dateB = new Date(b.invdate || b.acquisitiondate || '1970-01-01');
                    return dateB - dateA;
                });
                
                document.getElementById('newestGame').textContent = `${sorted[0].objectname || sorted[0].name} (${formatDate(sorted[0].invdate || sorted[0].acquisitiondate)})`;
                document.getElementById('oldestGame').textContent = `${sorted[sorted.length - 1].objectname || sorted[sorted.length - 1].name} (${formatDate(sorted[sorted.length - 1].invdate || sorted[sorted.length - 1].acquisitiondate)})`;
            }

            // Display games immediately (before thumbnails loaded)
            document.getElementById('privateResults').style.display = 'block';
            sortAndFilterPrivateGames();

            // Batch fetch thumbnails (20 at a time)
            const gameIds = allPrivateGames.map(g => g.objectid).filter(id => id);
            const thumbnailMap = {};
            const batchSize = 20;
            
            for (let i = 0; i < gameIds.length; i += batchSize) {
                const batch = gameIds.slice(i, i + batchSize);
                const batchThumbnails = await fetchThumbnailsBatch(batch);
                Object.assign(thumbnailMap, batchThumbnails);
                
                const progress = Math.round((i + batchSize) / gameIds.length * 100);
                updatePrivateProgress(progress, `Fetched ${Math.min(i + batchSize, gameIds.length)} of ${gameIds.length} thumbnails...`);
                
                // Update thumbnails in cards as they arrive
                allPrivateGames = allPrivateGames.map(game => ({
                    ...game,
                    thumbnail: thumbnailMap[game.objectid] || game.thumbnail
                }));
                sortAndFilterPrivateGames();
            }

            document.getElementById('privateProgress').style.display = 'none';
        }

        // Add event listeners for sorting and filtering
        document.getElementById('privateSortSelect').addEventListener('change', sortAndFilterPrivateGames);
        document.getElementById('filterOwnedOnly').addEventListener('change', sortAndFilterPrivateGames);

        // Print functionality
        document.getElementById('privatePrintBtn').addEventListener('click', function() {
            const filterOwnedOnly = document.getElementById('filterOwnedOnly').checked;
            const games = filterOwnedOnly ? allPrivateGames.filter(g => g.own === '1' || g.own === 1) : allPrivateGames;
            
            const printWindow = window.open('', 'print_private', 'width=8.5in,height=11in');
            
            let html = `
            <!DOCTYPE html>
            <html>
            <head>
                <style>
                    body { font-family: Arial, sans-serif; margin: 0.5in; }
                    h1 { text-align: center; }
                    .game { margin-bottom: 1.2em; page-break-inside: avoid; }
                    .game-header { font-weight: bold; font-size: 1.1em; }
                    .game-details { font-size: 0.9em; color: #555; }
                    .game-thumb { height: 80px; width: auto; margin-right: 1em; float: left; }
                </style>
            </head>
            <body>
                <h1>Private Collection</h1>
                <p><strong>Total Games:</strong> ${games.length} | <strong>Generated:</strong> ${new Date().toLocaleDateString()}</p>
                <hr>
            `;

            games.forEach(game => {
                html += `
                    <div class="game">
                        ${game.thumbnail ? `<img src="${game.thumbnail}" alt="${game.objectname || game.name}" class="game-thumb" style="max-height: 80px;">` : ''}
                        <div class="game-header">${game.objectname || game.name}</div>
                        <div class="game-details">
                            <div>📅 Acquired: ${formatDate(game.acquisitiondate)} | Inv Date: ${formatDate(game.invdate)}</div>
                            <div>⭐ Rating: ${game.rating || 'N/A'} | Plays: ${game.numplays || '0'} | Weight: ${game.weight || 'N/A'}</div>
                            <div>📍 ${game.invlocation || '-'}</div>
                        </div>
                    </div>
                `;
            });

            html += `</body></html>`;
            
            printWindow.document.write(html);
            printWindow.document.close();
            setTimeout(() => printWindow.print(), 500);
        });

        // Upload CSV
        document.getElementById('uploadCsvBtn').addEventListener('click', function() {
            const fileInput = document.getElementById('csvFileInput');
            if (!fileInput.files.length) {
                alert('Please select a CSV file');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async function(e) {
                try {
                    const csvData = e.target.result;
                    let games = parseCSV(csvData);
                    await displayPrivateGamesWithThumbnails(games);
                } catch (error) {
                    alert('Error parsing CSV: ' + error.message);
                    console.error(error);
                    document.getElementById('privateProgress').style.display = 'none';
                }
            };

            reader.readAsText(file);
        });
    </script>
</body>
</html>
