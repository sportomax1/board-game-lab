<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BoxCrush — Match‑3 with your BGG Thumbnails</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>📦</text></svg>">
  <style>
    :root{--size:54px;--gap:6px}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#0f172a;color:#e6eef8;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
    .shell{background:#071024;padding:18px;border-radius:12px;box-shadow:0 12px 40px rgba(2,6,23,0.7);width:min(96vw,820px)}
    h1{margin:0 0 8px;font-size:18px}
    .top{display:flex;gap:10px;align-items:center;margin-bottom:12px}
    input{padding:8px;border-radius:8px;border:1px solid #213547;background:#081827;color:#dfe9f3}
    button{padding:8px 12px;border-radius:8px;border:none;background:#2563eb;color:white;font-weight:700;cursor:pointer}
    .meta{display:flex;gap:12px;align-items:center;margin-bottom:8px}
    #board{display:grid;gap:var(--gap);background:#0b2130;padding:var(--gap);border-radius:8px}
    .cell{width:var(--size);height:var(--size);background:#0f2a3a;border-radius:6px;overflow:hidden;position:relative;cursor:pointer;transition:transform 180ms ease}
    .cell img{width:100%;height:100%;object-fit:cover;display:block}
    .cell.moving{transition:none}
    .score{font-weight:800}
    .controls{display:flex;gap:8px;margin-top:12px}
    .small{font-size:13px;padding:6px}
  </style>
</head>
<body>
  <div class="shell">
    <div class="top">
      <h1>📦 BoxCrush</h1>
      <div style="flex:1;color:#9fb6d4;font-size:13px">Match 3+ tiles to crush boxes. Swap adjacent tiles. Uses your BGG collection thumbnails.</div>
      <input id="user" placeholder="BGG username" style="width:170px">
      <button id="load">Load</button>
    </div>

    <div class="meta"><div>Score: <span id="score" class="score">0</span></div><div>Moves: <span id="moves">0</span></div><div id="status" style="color:#9fb6d4"></div></div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
      <label style="font-size:13px;color:#9fb6d4">Mode:</label>
      <select id="mode" style="padding:6px;border-radius:6px;background:#081827;color:#dfe9f3;border:1px solid #213547">
        <option value="endless">Endless</option>
        <option value="moves">Moves (limit)</option>
        <option value="collect">Collect Target</option>
      </select>
      <input id="movesLimit" placeholder="Moves limit (e.g. 30)" style="width:120px;font-size:13px">
      <button id="setLevel" class="small">Set Level</button>
      <div id="objective" style="margin-left:auto;color:#9fb6d4;font-size:13px"></div>
    </div>

    <div id="board" style="grid-template-columns:repeat(8,var(--size));width:calc(8*var(--size) + 7*var(--gap))"></div>

    <div class="controls">
      <button id="shuffle" class="small">Shuffle</button>
      <button id="new" class="small">New</button>
      <button id="hint" class="small">Hint</button>
    </div>
  </div>

  <script>
  // BoxCrush: improved match-3 implementation
  const IMAGE_PROXY = 'https://images.weserv.nl/?url=';
  const gridSize = 8;
  const boardEl = document.getElementById('board');
  const loadBtn = document.getElementById('load');
  const userInput = document.getElementById('user');
  const scoreEl = document.getElementById('score');
  const movesEl = document.getElementById('moves');
  const statusEl = document.getElementById('status');
  const shuffleBtn = document.getElementById('shuffle');
  const newBtn = document.getElementById('new');
  const hintBtn = document.getElementById('hint');

  let collection = [];
  let pool = [];// cycle through all thumbnails
  let poolIndex = 0;
  let board = []; // cells: {id,thumb,img,el}
  let score = 0; let moves = 0; let animating = false;
  let selected = null;
  let mode = 'endless';
  let movesLimit = 0;
  let targetId = null;
  let targetCount = 0;
  let collectedMap = {};
  let comboMultiplier = 1;

  function shuffleArray(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} }

  async function fetchCollection(user){
    const res = await fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(user)}&stats=1`);
    if(!res.ok) throw new Error('Collection fetch failed');
    const txt = await res.text(); const doc = new DOMParser().parseFromString(txt,'text/xml');
    const items = Array.from(doc.querySelectorAll('item')).map(it=>({ id: it.getAttribute('objectid'), thumb: it.querySelector('thumbnail')?.textContent || it.querySelector('image')?.textContent || '' })).filter(x=>x.thumb);
    return items;
  }

  async function preloadThumbs(items){
    for(const it of items){ it.img = new Image(); it.img.crossOrigin='Anonymous'; it.img.src = IMAGE_PROXY + it.thumb; }
  }

  function nextFromPool(){ if(pool.length===0) return null; const t = pool[poolIndex++]; if(poolIndex>=pool.length){ poolIndex=0; shuffleArray(pool); } return t; }

  function buildEmptyBoard(){ board = Array.from({length:gridSize*gridSize},()=>({id:null,thumb:null,img:null,el:null})); }

  function renderBoard(){ boardEl.innerHTML='';
    for(let r=0;r<gridSize;r++) for(let c=0;c<gridSize;c++){
      const i = r*gridSize+c; const cell = board[i];
      const div = document.createElement('div'); div.className='cell'; div.dataset.i=i; div.dataset.r=r; div.dataset.c=c;
      if(cell.thumb){ const img = document.createElement('img'); img.src = cell.img?.src || (IMAGE_PROXY+cell.thumb); img.alt=''; div.appendChild(img); }
      div.addEventListener('click', onClick);
      boardEl.appendChild(div); cell.el = div;
    }
  }

  function fillBoardRandom(){ for(let i=0;i<board.length;i++){ const g = nextFromPool(); board[i].id = g?.id || null; board[i].thumb = g?.thumb || null; board[i].img = g?.img || null; } }

  function swapIndexes(i1,i2,doRender=true){ [board[i1],board[i2]]=[board[i2],board[i1]]; if(doRender) renderBoard(); }

  function areAdjacent(i1,i2){ const r1=Math.floor(i1/gridSize), c1=i1%gridSize; const r2=Math.floor(i2/gridSize), c2=i2%gridSize; return (Math.abs(r1-r2)+Math.abs(c1-c2))===1 }

  // match detection returns set of indexes to clear
  function detectMatches(){ const toClear = new Set();
    // horizontal runs
    for(let r=0;r<gridSize;r++){
      let runStart = 0;
      for(let c=1;c<=gridSize;c++){
        const i = r*gridSize + c;
        const prevI = r*gridSize + c - 1;
        const prevId = board[prevI] ? board[prevI].id : null;
        const curId = (c<gridSize && board[i]) ? board[i].id : null;
        if(c<gridSize && curId && prevId && curId === prevId){
          // continue run
        } else {
          const runLength = c - runStart;
          if(runLength >= 3){
            for(let cc = runStart; cc < c; cc++) toClear.add(r*gridSize + cc);
          }
          runStart = c;
        }
      }
    }
    // vertical runs
    for(let c=0;c<gridSize;c++){
      let runStart = 0;
      for(let r=1;r<=gridSize;r++){
        const i = r*gridSize + c;
        const prevI = (r-1)*gridSize + c;
        const prevId = board[prevI] ? board[prevI].id : null;
        const curId = (r<gridSize && board[i]) ? board[i].id : null;
        if(r<gridSize && curId && prevId && curId === prevId){
          // continue
        } else {
          const runLength = r - runStart;
          if(runLength >= 3){
            for(let rr = runStart; rr < r; rr++) toClear.add(rr*gridSize + c);
          }
          runStart = r;
        }
      }
    }
    return Array.from(toClear);
  }

  // Clear, drop and refill with animation promises
  async function resolveMatchesAnimated(){
    let chain = 0;
    while(true){ const toClear = detectMatches(); if(toClear.length===0) break; chain++;
      // scoring: base 60 for 3, +30 per extra; chain multiplier
      const groups = toClear.length;
      const base = groups <= 3 ? 60 : 60 + (groups-3)*30;
      const delta = Math.floor(base * comboMultiplier * chain);
      score += delta; scoreEl.textContent = score;
      // update collected counts for objectives
      for(const idx of toClear){ const id = board[idx].id; if(id){ collectedMap[id] = (collectedMap[id]||0)+1; } }
      // visual removal
      for(const idx of toClear){ const el = board[idx].el; if(el){ el.style.opacity=0.2; el.style.transform='scale(0.6)'; } }
      await new Promise(r=>setTimeout(r,220));
      // clear
      for(const idx of toClear){ board[idx].id=null; board[idx].thumb=null; board[idx].img=null; }
      // collapse per column (simulate gravity)
      for(let c=0;c<gridSize;c++){
        const col=[];
        for(let r=gridSize-1;r>=0;r--){ const i=r*gridSize+c; if(board[i].id) col.push(board[i]); }
        while(col.length<gridSize){ const g = nextFromPool(); col.push({ id: g?.id||null, thumb: g?.thumb||null, img: g?.img||null }); }
        // write back
        for(let r=gridSize-1;r>=0;r--){ board[r*gridSize + c] = col[gridSize-1-r]; }
      }
      renderBoard(); await new Promise(r=>setTimeout(r,180));
      // check objective
      if(mode==='collect' && targetId){ if((collectedMap[targetId]||0) >= targetCount){ statusEl.textContent = 'Objective complete!'; break; } }
      if(mode==='moves' && movesLimit>0 && moves>movesLimit){ statusEl.textContent = 'Out of moves'; break; }
    }
    comboMultiplier = 1;
  }

  async function onSwap(i1,i2){ if(animating) return; if(!areAdjacent(i1,i2)) return; animating=true; swapIndexes(i1,i2);
    // if match results, resolve; else swap back
    const matches = detectMatches(); if(matches.length>0){ moves++; movesEl.textContent=moves; comboMultiplier = 1.0; await resolveMatchesAnimated(); } else { await new Promise(r=>setTimeout(r,200)); swapIndexes(i1,i2); }
    animating=false; selected=null; highlightClear(); }

  function highlightClear(){ document.querySelectorAll('.cell').forEach(d=>d.style.outline=''); }

  function onClick(e){ if(animating) return; const i = parseInt(e.currentTarget.dataset.i); if(selected===null){ selected=i; e.currentTarget.style.outline='3px solid rgba(255,215,180,0.9)'; return; } if(selected===i){ selected=null; highlightClear(); return; } onSwap(selected,i); }

  // shuffle board (randomize arrangement but keep pool cycling)
  function shuffleBoard(){ const ids = board.map(b=>({id:b.id,thumb:b.thumb,img:b.img})); shuffleArray(ids); for(let i=0;i<board.length;i++){ board[i]=ids[i]; } renderBoard(); }

  // init new game with collection
  async function newGame(){ if(collection.length<6){ alert('Need at least 6 thumbnails'); return; }
    // rebuild pool as full copy and shuffle
    pool = collection.slice(); shuffleArray(pool); poolIndex=0;
    buildEmptyBoard(); fillBoardRandom(); renderBoard(); score=0;moves=0;scoreEl.textContent=0;movesEl.textContent=0; selected=null; statusEl.textContent='';
    // remove starting matches
    await new Promise(r=>setTimeout(r,80));
    while(detectMatches().length>0){
      const m = detectMatches();
      for(const idx of m){ const g = nextFromPool(); board[idx] = { id: g?.id || null, thumb: g?.thumb || null, img: g?.img || null }; }
      renderBoard(); await new Promise(r=>setTimeout(r,60));
    }
    // reset objective counters
    collectedMap = {};
    updateObjectiveUI();
  }

  function updateObjectiveUI(){ const obj = document.getElementById('objective'); if(mode==='endless'){ obj.textContent=''; } else if(mode==='moves'){ obj.textContent = movesLimit?`Moves limit: ${movesLimit}`:'Set moves limit'; } else if(mode==='collect'){ if(targetId){ obj.textContent = `Collect ${targetCount} of target thumbnail (collected ${collectedMap[targetId]||0})`; } else { obj.textContent = 'Set collect target'; } } }

  // hint finder: try all adjacent swaps and return first that produces match
  function findHint(){ for(let i=0;i<board.length;i++){ const r=Math.floor(i/gridSize), c=i%gridSize; const neigh = [[r+1,c],[r-1,c],[r,c+1],[r,c-1]]; for(const [nr,nc] of neigh){ if(nr<0||nr>=gridSize||nc<0||nc>=gridSize) continue; const j = nr*gridSize + nc; // simulate
        const snapshot = board.map(b=>({id:b.id,thumb:b.thumb})); [snapshot[i],snapshot[j]]=[snapshot[j],snapshot[i]];
        // create temp board ids
        const tempIds = snapshot.map(s=>s.id);
        // quick match detect on temp
        // horizontal
        for(let rr=0;rr<gridSize;rr++){ let run=1; for(let cc=1;cc<gridSize;cc++){ const a=tempIds[rr*gridSize+cc], b=tempIds[rr*gridSize+cc-1]; if(a && b && a===b){ run++; if(run>=3) return [i,j]; } else run=1; } }
        for(let cc=0;cc<gridSize;cc++){ let run=1; for(let rr=1;rr<gridSize;rr++){ const a=tempIds[rr*gridSize+cc], b=tempIds[(rr-1)*gridSize+cc]; if(a && b && a===b){ run++; if(run>=3) return [i,j]; } else run=1; } }
    }} return null; }

  loadBtn.addEventListener('click', async ()=>{
    const user = userInput.value.trim(); if(!user) return alert('Enter username'); loadBtn.disabled=true; statusEl.textContent='Loading...';
    try{ const items = await fetchCollection(user); if(items.length<6) throw new Error('Need at least 6 images'); collection = items; await preloadThumbs(collection); await newGame(); statusEl.textContent=`Loaded ${collection.length} items`; }
    catch(e){ alert(e.message); statusEl.textContent=''; }
    finally{ loadBtn.disabled=false; }
  });

  shuffleBtn.addEventListener('click', ()=>{ shuffleBoard(); });
  newBtn.addEventListener('click', ()=>{ newGame(); });
  hintBtn.addEventListener('click', ()=>{ statusEl.textContent='Try swapping adjacent tiles to make 3 in a row'; setTimeout(()=>statusEl.textContent='',2000); });

  // level controls
  document.getElementById('mode').addEventListener('change',(e)=>{ mode=e.target.value; updateObjectiveUI(); });
  document.getElementById('setLevel').addEventListener('click',()=>{
    const v = document.getElementById('mode').value; mode=v; if(v==='moves'){ const m = parseInt(document.getElementById('movesLimit').value)||0; movesLimit=m; statusEl.textContent=`Moves limit set to ${m}`; } else if(v==='collect'){
      // choose random target from collection
      const pick = collection[Math.floor(Math.random()*collection.length)]; targetId = pick.id; targetCount = Math.max(6, Math.floor(Math.random()*12)+6); collectedMap = {}; statusEl.textContent=`Collect ${targetCount} of target thumbnail`; }
    updateObjectiveUI(); setTimeout(()=>statusEl.textContent='',2000);
  });

  // improved hint button behavior: highlight suggested swap
  hintBtn.addEventListener('click',()=>{
    const h = findHint(); if(!h){ statusEl.textContent='No hints available'; setTimeout(()=>statusEl.textContent='',1500); return; }
    const [a,b]=h; document.querySelectorAll('.cell').forEach(d=>d.style.outline=''); const ea = board[a].el, eb = board[b].el; if(ea) ea.style.outline='3px solid #ffd580'; if(eb) eb.style.outline='3px solid #ffd580'; statusEl.textContent='Hint highlighted'; setTimeout(()=>{ if(ea) ea.style.outline=''; if(eb) eb.style.outline=''; statusEl.textContent=''; },3000);
  });

  // start with empty grid
  buildEmptyBoard(); renderBoard();
  </script>
</body>
</html>
