<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection Comparer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <!-- Setup Screen -->
    <div id="setupScreen" class="fixed inset-0 bg-gradient-to-br from-indigo-900 to-purple-900 z-50 flex items-center justify-center p-4 md:p-8">
        <div class="bg-white rounded-2xl shadow-2xl p-6 md:p-8 max-w-2xl w-full">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-900 mb-2 text-center">📊 Collection Comparer</h1>
            <p class="text-gray-500 text-center text-sm md:text-base mb-6">Compare owned games across multiple BGG collections</p>
            
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-3">Players to Compare</label>
                    <div id="playersContainer" class="space-y-3">
                        <div class="player-input-group flex gap-2">
                            <input type="text" class="flex-1 border-2 border-gray-300 rounded-lg px-4 py-2 focus:border-purple-500 outline-none transition text-sm md:text-base" placeholder="Username (e.g. sportomax)" value="tune_squad">
                            <button onclick="removePlayer(this)" class="px-3 py-2 bg-red-100 text-red-600 rounded-lg font-medium hover:bg-red-200 transition hidden">Remove</button>
                        </div>
                        <div class="player-input-group flex gap-2">
                            <input type="text" class="flex-1 border-2 border-gray-300 rounded-lg px-4 py-2 focus:border-purple-500 outline-none transition text-sm md:text-base" placeholder="Username (e.g. sportomax)" value="sportomax">
                            <button onclick="removePlayer(this)" class="px-3 py-2 bg-red-100 text-red-600 rounded-lg font-medium hover:bg-red-200 transition hidden">Remove</button>
                        </div>
                    </div>
                    <button onclick="addPlayer()" class="mt-3 px-4 py-2 bg-purple-100 text-purple-700 rounded-lg font-medium hover:bg-purple-200 transition text-sm">+ Add Player</button>
                </div>

                <div class="bg-purple-50 rounded-lg p-4 space-y-3">
                    <div class="flex items-center gap-3">
                        <input type="checkbox" id="filterOwn" class="w-4 h-4 rounded" checked>
                        <label for="filterOwn" class="text-sm font-medium text-gray-700">Owned Games Only</label>
                    </div>
                    <div class="flex items-center gap-3">
                        <input type="checkbox" id="excludeExpansions" class="w-4 h-4 rounded" checked>
                        <label for="excludeExpansions" class="text-sm font-medium text-gray-700">Exclude Expansions</label>
                    </div>
                </div>
                
                <button onclick="compareCollections()" class="w-full bg-purple-600 text-white py-3 md:py-4 rounded-xl font-bold text-base md:text-lg hover:bg-purple-700 transition shadow-lg transform hover:scale-[1.02]">
                    Compare Collections
                </button>
            </div>
        </div>
    </div>

    <!-- Progress Bar at Top -->
    <div id="progressContainer" class="w-full h-1 bg-gray-200 fixed top-0 left-0 z-50 overflow-hidden hidden">
        <div id="progressBar" class="h-full bg-gradient-to-r from-purple-500 to-purple-600 w-0 transition-all duration-300"></div>
    </div>

    <!-- Progress Info Bar -->
    <div id="progressInfo" class="bg-purple-50 border-b border-purple-200 px-3 md:px-4 py-2 sticky top-1 z-40 hidden">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <p class="text-xs md:text-sm font-medium text-purple-900" id="progressText">Loading...</p>
            <div class="text-xs text-purple-700" id="progressCount"></div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" class="hidden flex-1 flex flex-col w-full">
        <header class="bg-white shadow-sm sticky top-8 md:top-9 z-30 px-3 md:px-4 py-3 md:py-4">
            <div class="flex flex-col gap-2 md:gap-3 max-w-7xl mx-auto">
                <div class="flex items-center justify-between">
                    <div>
                        <h1 class="font-bold text-xl md:text-2xl text-gray-900 flex items-center gap-2">
                            📊 Collection Comparison
                        </h1>
                        <p class="text-xs md:text-sm text-gray-500 mt-1" id="headerSubtitle">Comparing collections</p>
                    </div>
                    <button onclick="location.reload()" class="p-2 text-gray-400 hover:text-gray-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>

                <div class="flex flex-col md:flex-row items-stretch md:items-center gap-2 md:gap-3">
                    <input type="text" id="searchInput" placeholder="Search games..." class="flex-1 border-2 border-gray-300 rounded-lg px-4 py-2 focus:border-purple-500 outline-none transition text-sm md:text-base">
                    <select id="viewType" onchange="updateDisplay()" class="bg-gray-100 border-2 border-gray-300 rounded-lg px-3 md:px-4 py-2 font-medium text-gray-700 focus:border-purple-500 outline-none text-sm md:text-base">
                        <option value="all">All Games</option>
                        <option value="owned-by-all">Owned by All</option>
                        <option value="owned-by-some">Owned by Some</option>
                        <option value="exclusive">Exclusive Games</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- Stats Grid -->
        <div class="bg-white shadow-sm border-b px-3 md:px-4 py-3 md:py-4">
            <div class="max-w-7xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4">
                <div class="text-center">
                    <div class="text-2xl md:text-3xl font-bold text-purple-600" id="totalGamesCount">0</div>
                    <div class="text-xs md:text-sm text-gray-600">Total Games</div>
                </div>
                <div class="text-center">
                    <div class="text-2xl md:text-3xl font-bold text-purple-600" id="ownedByAllCount">0</div>
                    <div class="text-xs md:text-sm text-gray-600">Owned by All</div>
                </div>
                <div class="text-center">
                    <div class="text-2xl md:text-3xl font-bold text-purple-600" id="uniqueGamesCount">0</div>
                    <div class="text-xs md:text-sm text-gray-600">Unique Games</div>
                </div>
                <div class="text-center">
                    <div class="text-2xl md:text-3xl font-bold text-purple-600" id="overlayPercent">0%</div>
                    <div class="text-xs md:text-sm text-gray-600">Collection Overlap</div>
                </div>
            </div>
        </div>

        <!-- Player Collections Summary -->
        <div id="playersSummary" class="bg-white border-b px-3 md:px-4 py-3 md:py-4">
            <div class="max-w-7xl mx-auto">
                <h2 class="font-bold text-base md:text-lg text-gray-900 mb-3">Player Collections</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3" id="playerCards">
                    <!-- Populated by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Games List -->
        <main class="flex-1 px-3 md:px-4 py-3 md:py-4">
            <div class="max-w-7xl mx-auto grid grid-cols-1 gap-3 md:gap-4" id="gamesList">
                <!-- Games injected here -->
            </div>
            <div id="emptyState" class="text-center py-12 hidden">
                <p class="text-gray-500 text-base md:text-lg">No games found</p>
            </div>
        </main>
    </div>

    <script>
        let collections = {};
        let allComparisons = [];
        let players = [];

        function addPlayer() {
            const container = document.getElementById('playersContainer');
            const newGroup = document.createElement('div');
            newGroup.className = 'player-input-group flex gap-2';
            newGroup.innerHTML = `
                <input type="text" class="flex-1 border-2 border-gray-300 rounded-lg px-4 py-2 focus:border-purple-500 outline-none transition text-sm md:text-base" placeholder="Username">
                <button onclick="removePlayer(this)" class="px-3 py-2 bg-red-100 text-red-600 rounded-lg font-medium hover:bg-red-200 transition">Remove</button>
            `;
            container.appendChild(newGroup);
        }

        function removePlayer(btn) {
            const group = btn.closest('.player-input-group');
            if (document.querySelectorAll('.player-input-group').length > 1) {
                group.remove();
            } else {
                alert('You must have at least one player');
            }
        }

        async function compareCollections() {
            const playerInputs = document.querySelectorAll('.player-input-group input');
            players = Array.from(playerInputs)
                .map(input => input.value.trim())
                .filter(val => val);

            if (players.length < 2) {
                alert('Please enter at least 2 player usernames');
                return;
            }

            console.log('📊 Starting collection comparison for players:', players);
            
            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('progressContainer').classList.remove('hidden');
            document.getElementById('progressInfo').classList.remove('hidden');

            try {
                collections = {};
                let totalLoaded = 0;

                for (let i = 0; i < players.length; i++) {
                    const player = players[i];
                    console.log(`👤 Fetching collection for ${player}...`);
                    updateProgress((i / players.length) * 100, `Loading ${player}'s collection...`, `${i}/${players.length}`);

                    try {
                        // Build query with filters
                        let queryParams = `endpoint=collection&username=${player}&own=1&stats=1`;
                        if (!document.getElementById('excludeExpansions').checked) {
                            queryParams += '&includeexpansions=1';
                        }

                        const res = await fetch(`/api/bgg-helper?${queryParams}`);
                        const text = await res.text();
                        console.log(`📥 Raw response for ${player}:`, text.substring(0, 500));
                        
                        const xml = new DOMParser().parseFromString(text, 'text/xml');

                        // Check for parse errors
                        if (xml.getElementsByTagName('parsererror').length > 0) {
                            console.warn(`⚠️ ${player}: XML parse error`, xml);
                            continue;
                        }

                        const items = Array.from(xml.querySelectorAll('item'));
                        console.log(`✓ ${player}: Loaded ${items.length} items`);

                        // Parse collection data - handle both name formats
                        collections[player] = items
                            .filter(item => {
                                // Skip expansions if needed
                                if (document.getElementById('excludeExpansions').checked) {
                                    const type = item.getAttribute('subtype');
                                    if (type === 'boardgameexpansion') return false;
                                }
                                return true;
                            })
                            .map(item => {
                                const nameEl = item.querySelector('name');
                                const name = nameEl ? nameEl.textContent : (item.querySelector('name[primary]')?.textContent || 'Unknown');
                                
                                return {
                                    id: item.getAttribute('objectid'),
                                    name: name,
                                    year: item.querySelector('yearpublished')?.textContent || '?',
                                    image: item.querySelector('image')?.textContent || '',
                                    thumbnail: item.querySelector('thumbnail')?.textContent || '',
                                    rating: item.querySelector('average')?.textContent || '0',
                                    plays: item.querySelector('numplays')?.textContent || '0',
                                    type: item.getAttribute('subtype') || 'boardgame'
                                };
                            });

                        console.log(`📊 ${player} games:`, collections[player].slice(0, 3));
                        totalLoaded++;
                        updateProgress((totalLoaded / players.length) * 100, `Loaded ${totalLoaded}/${players.length} collections`, `${totalLoaded}/${players.length}`);
                    } catch (err) {
                        console.error(`❌ Error loading ${player}:`, err);
                    }
                }

                console.log('✅ Collections loaded:', collections);
                
                // Only proceed if we have data
                if (totalLoaded === 0) {
                    alert('No collections could be loaded. Please check the usernames and try again.');
                    location.reload();
                    return;
                }

                buildComparisons();
                renderComparison();
                document.getElementById('headerSubtitle').textContent = `Comparing ${Object.keys(collections).length} players`;

                setTimeout(() => {
                    document.getElementById('progressContainer').classList.add('hidden');
                    document.getElementById('progressInfo').classList.add('hidden');
                }, 1500);

            } catch (error) {
                console.error('❌ Error:', error);
                alert('Error: ' + error.message);
                location.reload();
            }
        }

        function buildComparisons() {
            console.log('🔧 Building game comparisons...');
            const gameMap = {};
            const playerList = Object.keys(collections);

            // Collect all games
            for (const player in collections) {
                collections[player].forEach(game => {
                    if (!gameMap[game.id]) {
                        gameMap[game.id] = {
                            id: game.id,
                            name: game.name,
                            year: game.year,
                            image: game.thumbnail || game.image,
                            rating: game.rating,
                            ownedBy: []
                        };
                    }
                    gameMap[game.id].ownedBy.push(player);
                });
            }

            allComparisons = Object.values(gameMap);
            console.log(`📦 Built ${allComparisons.length} game comparisons`);
        }

        function renderComparison() {
            const playerList = Object.keys(collections);
            
            // Render player cards
            const playerCardsHtml = playerList.map(player => {
                const gameCount = collections[player].length;
                return `
                    <div class="bg-gradient-to-br from-purple-50 to-purple-100 rounded-lg p-3 md:p-4 border border-purple-200">
                        <h3 class="font-bold text-base md:text-lg text-gray-900">${player}</h3>
                        <p class="text-sm md:text-base text-purple-700 font-medium">${gameCount} games</p>
                    </div>
                `;
            }).join('');
            document.getElementById('playerCards').innerHTML = playerCardsHtml;

            // Calculate stats
            const playerCount = playerList.length;
            const totalUnique = allComparisons.length;
            const ownedByAll = allComparisons.filter(g => g.ownedBy.length === playerCount).length;
            const uniqueToOne = allComparisons.filter(g => g.ownedBy.length === 1).length;
            const overlap = playerCount > 0 ? Math.round((ownedByAll / totalUnique) * 100) : 0;

            document.getElementById('totalGamesCount').textContent = totalUnique;
            document.getElementById('ownedByAllCount').textContent = ownedByAll;
            document.getElementById('uniqueGamesCount').textContent = uniqueToOne;
            document.getElementById('overlayPercent').textContent = overlap + '%';

            updateDisplay();
        }

        function updateDisplay() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const viewType = document.getElementById('viewType').value;
            const playerCount = Object.keys(collections).length;

            let filtered = allComparisons.filter(game => {
                // Filter by search
                if (searchTerm && !game.name.toLowerCase().includes(searchTerm)) {
                    return false;
                }

                // Filter by view type
                if (viewType === 'owned-by-all' && game.ownedBy.length !== playerCount) {
                    return false;
                }
                if (viewType === 'owned-by-some' && game.ownedBy.length === playerCount) {
                    return false;
                }
                if (viewType === 'exclusive' && game.ownedBy.length !== 1) {
                    return false;
                }

                return true;
            });

            const playerList = Object.keys(collections);
            const container = document.getElementById('gamesList');
            
            if (filtered.length === 0) {
                container.innerHTML = '';
                document.getElementById('emptyState').classList.remove('hidden');
                return;
            }

            document.getElementById('emptyState').classList.add('hidden');

            container.innerHTML = filtered.map(game => {
                const ownersHtml = playerList.map(player => {
                    const isOwner = game.ownedBy.includes(player);
                    const colors = ['bg-blue-100 text-blue-700', 'bg-green-100 text-green-700', 'bg-orange-100 text-orange-700', 'bg-pink-100 text-pink-700'];
                    const colorIdx = playerList.indexOf(player);
                    const color = colors[colorIdx % colors.length];
                    return `
                        <div class="text-center">
                            <div class="text-xs font-medium text-gray-600 mb-1">${player}</div>
                            <div class="text-xl md:text-2xl ${isOwner ? color + ' font-bold rounded px-2 py-1' : 'text-gray-300'} inline-block">
                                ${isOwner ? '✓' : '—'}
                            </div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-3 md:p-4 hover:shadow-md transition-shadow">
                        <div class="flex flex-col md:flex-row gap-3 md:gap-4">
                            <div class="flex-shrink-0 w-full md:w-24">
                                <div class="w-full md:w-24 h-32 md:h-24 bg-gray-100 rounded-lg overflow-hidden">
                                    ${game.image ? `<img src="${game.image}" alt="${game.name}" class="w-full h-full object-cover">` : '<span class="text-4xl md:text-2xl flex items-center justify-center h-full">🎲</span>'}
                                </div>
                            </div>
                            
                            <div class="flex-1 min-w-0">
                                <div class="flex justify-between items-start gap-2 mb-2">
                                    <h3 class="font-bold text-base md:text-lg text-gray-900 flex-1">${game.name}</h3>
                                    <div class="inline-block bg-purple-100 text-purple-800 text-xs font-bold px-2 py-1 rounded flex-shrink-0">
                                        ${game.ownedBy.length}/${playerList.length}
                                    </div>
                                </div>
                                <p class="text-xs md:text-sm text-gray-500 mb-4">${game.year} • Rating: ${parseFloat(game.rating).toFixed(1)}</p>
                                
                                <div class="grid gap-3" style="grid-template-columns: repeat(${playerList.length}, minmax(60px, 1fr));">
                                    ${ownersHtml}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateProgress(percent, text, count) {
            document.getElementById('progressBar').style.width = `${percent}%`;
            document.getElementById('progressText').textContent = text;
            if (count) {
                document.getElementById('progressCount').textContent = count;
            }
        }

        // Initialize search
        document.getElementById('searchInput')?.addEventListener('input', updateDisplay);
    </script>
</body>
</html>
