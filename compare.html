<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collection Comparer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --accent: #7c3aed;
      --accent-dark: #6d28d9;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    * { font-family: var(--font); }

    /* ── Tabs ── */
    .tab-btn {
      position: relative; padding: 10px 18px; font-size: 13px; font-weight: 600;
      color: #94a3b8; border: none; background: none; cursor: pointer;
      transition: color .18s; white-space: nowrap;
    }
    .tab-btn::after {
      content: ''; position: absolute; bottom: 0; left: 12px; right: 12px;
      height: 2.5px; border-radius: 2px; background: var(--accent);
      transform: scaleX(0); transition: transform .2s;
    }
    .tab-btn.active { color: var(--accent); }
    .tab-btn.active::after { transform: scaleX(1); }
    .tab-btn:disabled { opacity: .3; cursor: not-allowed; }
    .tab-btn:not(:disabled):not(.active):hover { color: #475569; }

    /* ── Segment control (mode / view toggles) ── */
    .seg { display:inline-flex; background:#f1f5f9; border-radius:10px; padding:3px; gap:2px; }
    .seg-btn {
      padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 700;
      border: none; cursor: pointer; transition: all .15s; color: #64748b; background: transparent;
    }
    .seg-btn.on { background: #fff; color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    .seg-btn:not(.on):hover { color: #334155; }

    /* ── Primary button ── */
    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: 700;
      background: linear-gradient(135deg, #7c3aed, #6d28d9); color: #fff;
      border: none; cursor: pointer; transition: opacity .15s, transform .1s;
      box-shadow: 0 2px 8px rgba(109,40,217,.35);
    }
    .btn-primary:hover { opacity: .92; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }

    /* ── Secondary button ── */
    .btn-secondary {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 600;
      background: #f8fafc; color: #475569; border: 1.5px solid #e2e8f0;
      cursor: pointer; transition: all .15s;
    }
    .btn-secondary:hover { background: #f1f5f9; border-color: #cbd5e1; color: #334155; }

    /* ── Ghost / dashed button ── */
    .btn-ghost {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: 600;
      background: transparent; color: #7c3aed; border: 1.5px dashed #c4b5fd;
      cursor: pointer; transition: all .15s;
    }
    .btn-ghost:hover { background: #f5f3ff; border-color: #7c3aed; }

    /* ── Danger icon button ── */
    .btn-remove {
      width: 26px; height: 26px; border-radius: 50%; border: none;
      background: #fee2e2; color: #ef4444; font-size: 11px; font-weight: 700;
      cursor: pointer; transition: background .15s; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-remove:hover { background: #fecaca; }
    .btn-remove.invisible { visibility: hidden; }

    /* ── Inputs ── */
    .inp {
      width: 100%; padding: 9px 12px; border-radius: 9px; font-size: 13px;
      border: 1.5px solid #e2e8f0; outline: none; background: #fff;
      transition: border-color .15s, box-shadow .15s;
    }
    .inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,58,237,.12); }

    /* ── Cards ── */
    .card { background: #fff; border-radius: 14px; border: 1px solid #e8eaf0; box-shadow: 0 1px 4px rgba(0,0,0,.05); }

    /* ── Progress ── */
    .progress-inner { transition: width .35s ease; }
    .pulse-dot { animation: pdot 1.3s ease-in-out infinite; }
    @keyframes pdot { 0%,100%{opacity:1} 50%{opacity:.2} }

    /* ── Match card expand ── */
    .expand-body { max-height:0; overflow:hidden; transition: max-height .32s ease; }
    .expand-body.open { max-height: 9999px; }

    /* ── Grid table ── */
    .grid-row:hover td { background: #faf5ff !important; }
    .sticky-col { position: sticky; left: 0; z-index: 8; }
    .owns-cell { min-width: 60px; }

    /* ── Stat pill ── */
    .stat-pill {
      background: #f8fafc; border: 1px solid #e8eaf0; border-radius: 10px;
      padding: 10px 14px; text-align: center;
    }

    /* ── Friend checkbox row ── */
    .friend-row { display:flex; align-items:center; gap:10px; padding:6px 10px; border-radius:8px; cursor:pointer; transition:background .12s; }
    .friend-row:hover { background: #f5f3ff; }
  </style>
</head>
<body class="min-h-screen flex flex-col" style="background:#f4f6fb">

<!-- ══════════════════════ HEADER ══════════════════════ -->
<header style="background:linear-gradient(135deg,#1e1b4b 0%,#312e81 60%,#4c1d95 100%)"
  class="sticky top-0 z-50 shadow-lg">
  <div class="max-w-6xl mx-auto px-4 pt-4 pb-0">

    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl flex items-center justify-center text-xl"
          style="background:rgba(255,255,255,.15);backdrop-filter:blur(4px)">📊</div>
        <div>
          <h1 class="font-extrabold text-white leading-none" style="font-size:17px;letter-spacing:-.3px">
            Collection Comparer</h1>
          <p class="text-xs mt-0.5 font-medium" style="color:rgba(255,255,255,.55)" id="headerSub">
            Compare BGG collections side-by-side</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <div id="loadingDots" class="hidden flex gap-1 items-center px-1">
          <div class="pulse-dot w-1.5 h-1.5 rounded-full bg-violet-300"></div>
          <div class="pulse-dot w-1.5 h-1.5 rounded-full bg-violet-300" style="animation-delay:.2s"></div>
          <div class="pulse-dot w-1.5 h-1.5 rounded-full bg-violet-300" style="animation-delay:.4s"></div>
        </div>
        <button onclick="resetAll()" id="resetBtn"
          class="hidden text-xs font-semibold px-3 py-1.5 rounded-lg transition"
          style="background:rgba(255,255,255,.15);color:#e0e7ff">↩ Reset</button>
      </div>
    </div>

    <!-- Tabs -->
    <div class="flex gap-1">
      <button onclick="switchTab('settings')" id="tab-settings" class="tab-btn active">⚙️ Settings</button>
      <button onclick="switchTab('rates')"    id="tab-rates"    class="tab-btn" disabled style="color:rgba(255,255,255,.35)">📊 Match Rates</button>
      <button onclick="switchTab('grid')"     id="tab-grid"     class="tab-btn" disabled style="color:rgba(255,255,255,.35)">🗂 Match Grid</button>
    </div>
  </div>

  <!-- Progress strip -->
  <div id="progressWrap" class="hidden h-1" style="background:rgba(255,255,255,.15)">
    <div id="progressBar" class="progress-inner h-full w-0"
      style="background:linear-gradient(90deg,#a78bfa,#c4b5fd)"></div>
  </div>
  <div id="progressMsg" class="hidden px-4 py-1.5 text-xs font-semibold flex items-center justify-between"
    style="background:rgba(255,255,255,.08);color:#ddd6fe">
    <span id="progressText">Loading…</span>
    <span id="progressCount" style="color:#c4b5fd"></span>
  </div>
</header>

<!-- ══════════════════════ SETTINGS TAB ══════════════════════ -->
<div id="pane-settings" class="flex-1 flex items-start justify-center px-4 py-8">
  <div class="w-full max-w-md space-y-4">

    <!-- Card -->
    <div class="card p-5">

      <!-- Top row: mode toggle + options -->
      <div class="flex flex-wrap items-center gap-3 mb-4">
        <div class="seg">
          <button id="modeManual"  onclick="setMode('manual')"  class="seg-btn on">✏️ Manual</button>
          <button id="modeFriends" onclick="setMode('friends')" class="seg-btn">👥 Friends</button>
        </div>
        <div class="flex items-center gap-3 ml-auto">
          <label class="flex items-center gap-1.5 cursor-pointer select-none" style="font-size:12px;font-weight:600;color:#64748b">
            <input type="checkbox" id="filterOwn" checked class="w-3.5 h-3.5 accent-violet-600 rounded"> Owned
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer select-none" style="font-size:12px;font-weight:600;color:#64748b">
            <input type="checkbox" id="excludeExp" checked class="w-3.5 h-3.5 accent-violet-600 rounded"> No expansions
          </label>
        </div>
        <input type="checkbox" id="filterOwnF"  checked class="hidden">
        <input type="checkbox" id="excludeExpF" checked class="hidden">
      </div>

      <!-- ── MANUAL ── -->
      <div id="manualMode">
        <div id="playersContainer" class="space-y-2 mb-3">
          <div class="player-row flex items-center gap-2">
            <span style="font-size:11px;color:#cbd5e1;width:14px;text-align:right;flex-shrink:0">1</span>
            <input type="text" value="sportomax" placeholder="BGG username" class="inp" style="flex:1">
            <button onclick="removeRow(this)" class="btn-remove invisible">✕</button>
          </div>
          <div class="player-row flex items-center gap-2">
            <span style="font-size:11px;color:#cbd5e1;width:14px;text-align:right;flex-shrink:0">2</span>
            <input type="text" value="tune_squad" placeholder="BGG username" class="inp" style="flex:1">
            <button onclick="removeRow(this)" class="btn-remove">✕</button>
          </div>
        </div>
        <div class="flex gap-2">
          <button onclick="addRow()" class="btn-ghost" style="flex:1">+ Add Player</button>
          <button onclick="runCompare()" class="btn-primary" style="flex:1.4">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
            Compare
          </button>
        </div>
      </div>

      <!-- ── FRIENDS ── -->
      <div id="friendsMode" class="hidden">
        <div class="flex gap-2 mb-3">
          <input type="text" id="myUsername" value="sportomax" placeholder="Your BGG username"
            class="inp" style="flex:1;font-weight:600">
          <button onclick="loadFriends()" class="btn-secondary" style="flex-shrink:0;white-space:nowrap">
            👥 Load Friends
          </button>
        </div>

        <div id="friendsListWrap" class="hidden">
          <div class="flex items-center justify-between mb-2">
            <span style="font-size:12px;font-weight:700;color:#64748b" id="friendsCountLabel"></span>
            <div class="flex gap-1.5">
              <button onclick="selectAllFriends()"   class="btn-secondary" style="padding:4px 10px;font-size:11px">All</button>
              <button onclick="deselectAllFriends()" class="btn-secondary" style="padding:4px 10px;font-size:11px">None</button>
            </div>
          </div>
          <div id="friendsList"
            class="max-h-52 overflow-y-auto mb-3 rounded-xl border"
            style="border-color:#f1f5f9;background:#fafafe"></div>
          <button id="friendsCompareBtn" onclick="runFriendsCompare()" class="btn-primary hidden" style="width:100%">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
            Compare with Friends
          </button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- ══════════════════════ MATCH RATES TAB ══════════════════════ -->
<div id="pane-rates" class="hidden flex-1 max-w-6xl mx-auto w-full px-4 py-6">

  <!-- Toolbar row -->
  <div class="flex flex-wrap items-center gap-3 mb-5">
    <div class="seg">
      <button id="rateViewAll" onclick="setRatesView('all')" class="seg-btn on">All vs All</button>
      <button id="rateViewOne" onclick="setRatesView('one')" class="seg-btn">One vs All</button>
    </div>
    <!-- User picker: visible only in One vs All mode -->
    <select id="ratesUserPicker" onchange="setRatesUser(this.value)"
      class="hidden"
      style="padding:5px 10px;border-radius:8px;border:1.5px solid #e2e8f0;font-size:12px;font-weight:700;font-family:inherit;background:#fff;color:#475569;cursor:pointer;outline:none;">
    </select>
    <span style="font-size:12px;color:#94a3b8;font-weight:500" id="ratesViewHint">All pairwise comparisons</span>
  </div>

  <!-- Summary stats -->
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6" id="rateSummary"></div>

  <!-- Cards grid -->
  <div id="rateCardsWrap">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="rateCards"></div>
  </div>

  <!-- My Ranking list -->
  <div id="rateRankWrap" class="hidden space-y-3 max-w-2xl"></div>
</div>

<!-- ══════════════════════ MATCH GRID TAB ══════════════════════ -->
<div id="pane-grid" class="hidden flex-1 flex flex-col">

  <!-- Toolbar -->
  <div class="bg-white border-b px-4 py-3 flex flex-wrap gap-2 items-center sticky z-40"
    style="top:117px;border-color:#e8eaf0">
    <div style="position:relative;flex:1;min-width:140px">
      <svg style="position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.4" width="14" height="14" fill="none" stroke="#475569" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="gridSearch" oninput="renderGrid()" placeholder="Search games…"
        class="inp" style="padding-left:32px">
    </div>
    <select id="gridFilter" onchange="renderGrid()"
      class="inp" style="width:auto;cursor:pointer;font-weight:600">
      <option value="all">All Games</option>
      <option value="shared-all">Owned by Everyone</option>
      <option value="shared-some" selected>Owned by 2+</option>
      <option value="exclusive">Exclusive</option>
    </select>
    <select id="gridSort" onchange="renderGrid()"
      class="inp" style="width:auto;cursor:pointer;font-weight:600">
      <option value="matches">↓ Most Matches</option>
      <option value="bayes">↓ Bayes Rating</option>
    </select>
    <select id="gridColSort" onchange="renderGrid()"
      class="inp" style="width:auto;cursor:pointer;font-weight:600">
      <option value="primary-alpha">Cols: Primary first</option>
      <option value="size">Cols: ↓ Collection size</option>
    </select>
    <span style="font-size:12px;color:#94a3b8;font-weight:600;flex-shrink:0" id="gridCount"></span>
  </div>

  <div class="flex-1 overflow-auto px-4 py-4">
    <div class="overflow-x-auto rounded-2xl border bg-white shadow-sm" style="border-color:#e8eaf0">
      <table class="w-full text-sm border-collapse" id="gridTable">
        <thead id="gridHead" class="text-xs font-bold uppercase tracking-wider"
          style="background:#f8fafc;color:#64748b;border-bottom:1px solid #e8eaf0;position:sticky;top:0;z-index:10"></thead>
        <tbody id="gridBody"></tbody>
      </table>
      <div id="gridEmpty" class="hidden py-16 text-center" style="color:#94a3b8;font-size:14px">
        No games match your filters
      </div>
    </div>
  </div>
</div>


<!-- ═══════════════════════ JAVASCRIPT ═══════════════════════ -->
<script>
// ─── State ───────────────────────────────────────────────────────────────────
const S = {
  mode: 'manual',
  activeTab: 'settings',
  loading: false,
  users: [],
  collections: {},      // { username: [game] }
  allGames: [],         // merged deduped list
  pairs: [],            // [{ a, b, shared:[gameId], matchA:%, matchB:% }]
  expandedPair: null,
  filterOwn: true,
  excludeExp: true,
  gridSort: 'matches',  // 'matches' | 'bayes'
  ratesView: 'all',     // 'all' | 'one'
  ratesUser: null,      // null = use users[0]
};

const COLORS = [
  { bg:'bg-blue-500',   light:'bg-blue-50',   border:'border-blue-300',   text:'text-blue-700',   ring:'ring-blue-400' },
  { bg:'bg-emerald-500',light:'bg-emerald-50',border:'border-emerald-300',text:'text-emerald-700',ring:'ring-emerald-400'},
  { bg:'bg-orange-500', light:'bg-orange-50', border:'border-orange-300', text:'text-orange-700', ring:'ring-orange-400'},
  { bg:'bg-pink-500',   light:'bg-pink-50',   border:'border-pink-300',   text:'text-pink-700',   ring:'ring-pink-400'  },
  { bg:'bg-indigo-500', light:'bg-indigo-50', border:'border-indigo-300', text:'text-indigo-700', ring:'ring-indigo-400'},
  { bg:'bg-amber-500',  light:'bg-amber-50',  border:'border-amber-300',  text:'text-amber-700',  ring:'ring-amber-400' },
  { bg:'bg-rose-500',   light:'bg-rose-50',   border:'border-rose-300',   text:'text-rose-700',   ring:'ring-rose-400'  },
  { bg:'bg-teal-500',   light:'bg-teal-50',   border:'border-teal-300',   text:'text-teal-700',   ring:'ring-teal-400'  },
];

// ─── Tab switching ────────────────────────────────────────────────────────────
function switchTab(tab) {
  ['settings','rates','grid'].forEach(t => {
    document.getElementById('pane-'+t).classList.add('hidden');
    document.getElementById('tab-'+t).classList.remove('active');
  });
  document.getElementById('pane-'+tab).classList.remove('hidden');
  document.getElementById('tab-'+tab).classList.add('active');
  S.activeTab = tab;
}

function unlockTabs() {
  ['rates','grid'].forEach(t => {
    const btn = document.getElementById('tab-'+t);
    btn.disabled = false;
    btn.style.color = 'rgba(255,255,255,.7)';
  });
}

// ─── Mode switching ───────────────────────────────────────────────────────────
function setMode(mode) {
  S.mode = mode;
  document.getElementById('manualMode').classList.toggle('hidden', mode !== 'manual');
  document.getElementById('friendsMode').classList.toggle('hidden', mode !== 'friends');
  document.getElementById('modeManual').classList.toggle('on', mode === 'manual');
  document.getElementById('modeFriends').classList.toggle('on', mode === 'friends');
}

// ─── Manual player rows ───────────────────────────────────────────────────────
function addRow() {
  const container = document.getElementById('playersContainer');
  const n = container.querySelectorAll('.player-row').length + 1;
  const div = document.createElement('div');
  div.className = 'player-row flex items-center gap-2';
  div.innerHTML = `
    <span style="font-size:11px;color:#cbd5e1;width:14px;text-align:right;flex-shrink:0">${n}</span>
    <input type="text" class="inp" style="flex:1" placeholder="BGG username">
    <button onclick="removeRow(this)" class="btn-remove">✕</button>
  `;
  container.appendChild(div);
  renumberRows();
}

function removeRow(btn) {
  const rows = document.querySelectorAll('.player-row');
  if (rows.length <= 2) return;
  btn.closest('.player-row').remove();
  renumberRows();
}

function renumberRows() {
  const rows = document.querySelectorAll('.player-row');
  rows.forEach((row, i) => {
    const num = row.querySelector('span');
    if (num) num.textContent = i + 1;
    const btn = row.querySelector('.btn-remove');
    if (btn) btn.classList.toggle('invisible', i === 0 && rows.length <= 2);
  });
}

// ─── Friends mode ─────────────────────────────────────────────────────────────
async function loadFriends() {
  const username = document.getElementById('myUsername').value.trim();
  if (!username) { alert('Enter your username'); return; }

  const btn = document.querySelector('[onclick="loadFriends()"]');
  const origText = btn.textContent;
  btn.textContent = '⏳ Loading…';
  btn.disabled = true;

  try {
    const xml = await fetchBGG(`/api/bgg-helper?endpoint=user&name=${encodeURIComponent(username)}&buddies=1`);
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    const buddies = Array.from(doc.querySelectorAll('buddy')).map(b => b.getAttribute('name')).filter(Boolean);

    if (buddies.length === 0) {
      alert('No buddies found for ' + username);
      return;
    }

    const list = document.getElementById('friendsList');
    list.innerHTML = buddies.map(name => `
      <label class="friend-row">
        <input type="checkbox" class="friend-checkbox w-4 h-4 accent-violet-600 rounded" data-name="${name}" checked>
        <span style="font-size:13px;font-weight:600;color:#334155">👤 ${name}</span>
      </label>
    `).join('');

    document.getElementById('friendsListWrap').classList.remove('hidden');
    document.getElementById('friendsCompareBtn').classList.remove('hidden');
    document.getElementById('friendsCountLabel').textContent = `${buddies.length} friends found`;
  } catch (err) {
    alert('Error: ' + err.message);
  } finally {
    btn.textContent = origText;
    btn.disabled = false;
  }
}

function selectAllFriends() {
  document.querySelectorAll('.friend-checkbox').forEach(c => c.checked = true);
}

function deselectAllFriends() {
  document.querySelectorAll('.friend-checkbox').forEach(c => c.checked = false);
}

async function runFriendsCompare() {
  const me = document.getElementById('myUsername').value.trim();
  if (!me) { alert('Enter your username'); return; }
  const selected = Array.from(document.querySelectorAll('.friend-checkbox:checked'))
    .map(c => c.dataset.name);
  if (selected.length === 0) { alert('Select at least one friend'); return; }
  // Options are shared — read from the visible checkboxes
  S.filterOwn = document.getElementById('filterOwn').checked;
  S.excludeExp = document.getElementById('excludeExp').checked;
  await runWithUsers([me, ...selected]);
}

async function runCompare() {
  const inputs = document.querySelectorAll('#manualMode .player-row input');
  const users = Array.from(inputs).map(i => i.value.trim()).filter(Boolean);
  if (users.length < 2) { alert('Enter at least 2 usernames'); return; }
  S.filterOwn = document.getElementById('filterOwn').checked;
  S.excludeExp = document.getElementById('excludeExp').checked;
  await runWithUsers(users);
}

// ─── Core fetch + compare ─────────────────────────────────────────────────────
async function runWithUsers(users) {
  S.users = users;
  S.collections = {};
  S.loading = true;
  setProgress(0, 'Starting…', '');
  showProgress(true);
  document.getElementById('loadingDots').classList.remove('hidden');
  document.getElementById('resetBtn').classList.remove('hidden');

  const failed = [];
  let done = 0;

  setProgress(0, `Fetching ${users.length} collections in parallel…`, `0/${users.length}`);

  // Fire all collection fetches simultaneously
  const results = await Promise.allSettled(
    users.map(u =>
      fetchCollection(u, S.filterOwn, S.excludeExp).then(games => {
        S.collections[u] = games;
        done++;
        setProgress(Math.round((done / users.length) * 90),
          `Loaded ${u} (${games.length} games)`, `${done}/${users.length}`);
        return { u, games };
      })
    )
  );

  results.forEach((r, i) => {
    if (r.status === 'rejected') {
      console.error(users[i], r.reason);
      failed.push(users[i]);
    }
  });

  setProgress(95, 'Computing matches…', '');
  await tick();

  S.users = Object.keys(S.collections);

  if (S.users.length < 2) {
    alert('Could not load enough collections. Failed: ' + (failed.join(', ') || 'unknown'));
    resetAll();
    return;
  }

  if (failed.length) {
    alert(`⚠️ Couldn't load: ${failed.join(', ')}\nContinuing with ${S.users.length} users.`);
  }

  buildData();
  S.ratesView = 'all';
  S.ratesUser = S.users[0];
  renderRates();
  renderGrid();

  setProgress(100, 'Done!', '');
  setTimeout(() => showProgress(false), 1000);
  document.getElementById('loadingDots').classList.add('hidden');

  unlockTabs();
  switchTab('rates');

  document.getElementById('headerSub').textContent =
    `${S.users.length} users · ${S.allGames.length} unique games`;
  S.loading = false;
}

// ─── BGG API helpers ──────────────────────────────────────────────────────────
async function fetchBGG(url, maxTries = 5, timeoutMs = 15000) {
  let last;
  for (let t = 1; t <= maxTries; t++) {
    try {
      const ctrl = new AbortController();
      const tid = setTimeout(() => ctrl.abort(), timeoutMs);
      const res = await fetch(url, { signal: ctrl.signal });
      clearTimeout(tid);
      if (res.status === 202) {
        await sleep(Math.min(3000 * t, 12000));
        continue;
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      if (!text.trim()) throw new Error('Empty response');
      return text;
    } catch (err) {
      last = err;
      if (t < maxTries) await sleep(Math.min(800 * 2 ** (t - 1), 8000));
    }
  }
  throw last;
}

async function fetchCollection(username, ownOnly, excludeExp) {
  let qs = `endpoint=collection&username=${encodeURIComponent(username)}&stats=1`;
  if (ownOnly) qs += '&own=1';
  const text = await fetchBGG(`/api/bgg-helper?${qs}`);
  const doc = new DOMParser().parseFromString(text, 'text/xml');
  if (doc.querySelector('parsererror')) throw new Error('XML parse error');

  return Array.from(doc.querySelectorAll('item'))
    .filter(item => {
      if (excludeExp && item.getAttribute('subtype') === 'boardgameexpansion') return false;
      return true;
    })
    .map(item => {
      const stats = item.querySelector('stats');
      const rating = stats?.querySelector('rating');
      return {
        id: item.getAttribute('objectid'),
        name: item.querySelector('name')?.textContent || 'Unknown',
        year: item.querySelector('yearpublished')?.textContent || '?',
        thumbnail: item.querySelector('thumbnail')?.textContent || '',
        userRating: parseFloat(rating?.getAttribute('value')) || null,
        average: parseFloat(rating?.querySelector('average')?.getAttribute('value')) || 0,
        bayesaverage: parseFloat(rating?.querySelector('bayesaverage')?.getAttribute('value')) || 0,
        rank: rating?.querySelector('rank[name="boardgame"]')?.getAttribute('value') || 'N/A',
        minPlayers: parseInt(stats?.getAttribute('minplayers')) || 1,
        maxPlayers: parseInt(stats?.getAttribute('maxplayers')) || 1,
        playingTime: parseInt(stats?.getAttribute('playingtime')) || 0,
      };
    });
}

// ─── Data building ────────────────────────────────────────────────────────────
function buildData() {
  // Merge all games by ID
  const gameMap = {};
  for (const u of S.users) {
    for (const g of S.collections[u]) {
      if (!gameMap[g.id]) {
        gameMap[g.id] = { ...g, ownedBy: [] };
      }
      gameMap[g.id].ownedBy.push(u);
    }
  }
  S.allGames = Object.values(gameMap).sort((a, b) =>
    a.ownedBy.length === b.ownedBy.length
      ? b.average - a.average
      : b.ownedBy.length - a.ownedBy.length
  );

  // Build pairwise match data
  S.pairs = [];
  for (let i = 0; i < S.users.length; i++) {
    for (let j = i + 1; j < S.users.length; j++) {
      const a = S.users[i], b = S.users[j];
      const colA = new Set(S.collections[a].map(g => g.id));
      const colB = new Set(S.collections[b].map(g => g.id));
      const shared = [...colA].filter(id => colB.has(id));
      const matchA = colA.size > 0 ? Math.round((shared.length / colA.size) * 100) : 0;
      const matchB = colB.size > 0 ? Math.round((shared.length / colB.size) * 100) : 0;
      const matchAvg = Math.round((matchA + matchB) / 2);

      // Rating correlation on shared games
      let ratingDiffSum = 0, ratingCount = 0;
      for (const id of shared) {
        const ga = S.collections[a].find(g => g.id === id);
        const gb = S.collections[b].find(g => g.id === id);
        if (ga?.userRating && gb?.userRating) {
          ratingDiffSum += Math.abs(ga.userRating - gb.userRating);
          ratingCount++;
        }
      }
      const avgRatingDiff = ratingCount > 0 ? (ratingDiffSum / ratingCount).toFixed(1) : null;

      S.pairs.push({ a, b, shared, matchA, matchB, matchAvg, avgRatingDiff,
        sizeA: colA.size, sizeB: colB.size });
    }
  }

  // Sort pairs by match%
  S.pairs.sort((a, b) => b.matchAvg - a.matchAvg);
}

function setRatesView(view) {

function togglePair(key) {
  const el = document.getElementById('expand-' + key);
  const labelEl = document.getElementById('toggle-label-' + key);
  const isOpen = el.classList.contains('open');

  if (isOpen) {
    el.classList.remove('open');
    const pair = S.pairs.find(p => `${p.a}__${p.b}` === key);
    labelEl.textContent = `▾ ${pair?.shared.length ?? ''} shared games`;
  } else {
    el.classList.add('open');
    labelEl.textContent = '▴ Hide shared games';
    // Lazy render game list
    const inner = document.getElementById('expand-inner-' + key);
    if (!inner.innerHTML) {
      const [userA, userB] = key.split('__');
      const pair = S.pairs.find(p => p.a === userA && p.b === userB);
      if (!pair) return;

      const sharedGames = pair.shared
        .map(id => S.allGames.find(g => g.id === id))
        .filter(Boolean)
        .sort((a, b) => b.average - a.average);

      const HEX2 = ['#3b82f6','#10b981','#f97316','#ec4899','#6366f1','#f59e0b','#ef4444','#14b8a6'];
      const LIGHT = ['#eff6ff','#ecfdf5','#fff7ed','#fdf2f8','#eef2ff','#fffbeb','#fff1f2','#f0fdfa'];
      inner.innerHTML = sharedGames.map(g => {
        const ra = S.collections[userA]?.find(x => x.id === g.id)?.userRating;
        const rb = S.collections[userB]?.find(x => x.id === g.id)?.userRating;
        const iA = S.users.indexOf(userA) % HEX2.length;
        const iB = S.users.indexOf(userB) % HEX2.length;
        return `
          <div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #f8fafc">
            ${g.thumbnail
              ? `<img src="${g.thumbnail}" style="width:32px;height:32px;border-radius:7px;object-fit:cover;flex-shrink:0;background:#f1f5f9">`
              : `<div style="width:32px;height:32px;border-radius:7px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px">🎲</div>`}
            <div style="flex:1;min-width:0">
              <div style="font-size:12px;font-weight:600;color:#1e293b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${g.name}</div>

              ${ra ? `<span style="padding:2px 7px;border-radius:6px;background:${LIGHT[iA]};color:${HEX2[iA]};font-size:11px;font-weight:700">${ra}</span>` : ''}
              ${rb ? `<span style="padding:2px 7px;border-radius:6px;background:${LIGHT[iB]};color:${HEX2[iB]};font-size:11px;font-weight:700">${rb}</span>` : ''}

    }
  }
}

// ─── Render: Match Grid tab ───────────────────────────────────────────────────
// Track which column is being sorted by (null = row sort)
let gridUserSort = null; // username or null

function renderGrid() {
  const search    = (document.getElementById('gridSearch')?.value || '').toLowerCase();
  const filter    = document.getElementById('gridFilter')?.value    || 'shared-some';
  const rowSort   = document.getElementById('gridSort')?.value      || 'matches';
  const colSort   = document.getElementById('gridColSort')?.value   || 'primary-alpha';
  const playerCount = S.users.length;

  // ── Column order ──────────────────────────────────────────────────────────
  let displayUsers;
  if (colSort === 'size') {
    displayUsers = [...S.users].sort((a, b) =>
      (S.collections[b]?.length || 0) - (S.collections[a]?.length || 0));
  } else {
    // primary first, rest alphabetical
    displayUsers = S.users.length > 1
      ? [S.users[0], ...[...S.users.slice(1)].sort((a, b) => a.localeCompare(b))]
      : [...S.users];
  }

  // ── Filter rows ───────────────────────────────────────────────────────────
  let games = S.allGames.filter(g => {
    if (search && !g.name.toLowerCase().includes(search)) return false;
    if (filter === 'shared-all'  && g.ownedBy.length !== playerCount) return false;
    if (filter === 'shared-some' && g.ownedBy.length < 2)             return false;
    if (filter === 'exclusive'   && g.ownedBy.length !== 1)           return false;
    return true;
  });

  // ── Row sort ──────────────────────────────────────────────────────────────
  if (gridUserSort) {
    // Sort by whether this user owns it first, then bayes
    games = [...games].sort((a, b) => {
      const aOwns = a.ownedBy.includes(gridUserSort) ? 1 : 0;
      const bOwns = b.ownedBy.includes(gridUserSort) ? 1 : 0;
      if (bOwns !== aOwns) return bOwns - aOwns;
      return b.bayesaverage - a.bayesaverage;
    });
  } else if (rowSort === 'bayes') {
    games = [...games].sort((a, b) => b.bayesaverage - a.bayesaverage);
  } else {
    games = [...games].sort((a, b) =>
      b.ownedBy.length !== a.ownedBy.length
        ? b.ownedBy.length - a.ownedBy.length
        : b.bayesaverage - a.bayesaverage
    );
  }

  document.getElementById('gridCount').textContent = `${games.length} games`;

  const GH = ['#3b82f6','#10b981','#f97316','#ec4899','#6366f1','#f59e0b','#ef4444','#14b8a6'];
  const TH = 'padding:8px 10px;background:#f8fafc;border-right:1px solid #eef0f4;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap';

  const head = document.getElementById('gridHead');
  head.innerHTML = `<tr>
    <th class="sticky-col" style="${TH};text-align:left;min-width:200px">Game</th>
    <th style="${TH};text-align:center;cursor:pointer" onclick="setGridUserSort(null,'matches')" title="Sort by matches">
      <div style="display:flex;flex-direction:column;align-items:center;gap:1px">
        <span>#</span>
        <span style="font-size:9px;color:#94a3b8">${playerCount} users</span>
      </div>
    </th>
    <th style="${TH};text-align:center;cursor:pointer" onclick="setGridUserSort(null,'bayes')" title="Sort by Bayes rating">⭐ Bayes</th>
    ${displayUsers.map((u, i) => {
      const colSize = S.collections[u]?.length || 0;
      const isActive = gridUserSort === u;
      const bg = isActive ? `background:${GH[S.users.indexOf(u)%GH.length]}18;` : '';
      return `<th class="owns-cell" style="${TH};text-align:center;border-right:1px solid #eef0f4;cursor:pointer;${bg}" onclick="setGridUserSort('${u}',null)" title="Sort by ${u}'s games">
        <div style="display:flex;flex-direction:column;align-items:center;gap:2px">
          <div style="width:22px;height:22px;border-radius:50%;background:${GH[S.users.indexOf(u)%GH.length]};color:#fff;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center">${u[0].toUpperCase()}</div>
          <span style="color:${GH[S.users.indexOf(u)%GH.length]};font-size:10px">${u}</span>
          <span style="color:#94a3b8;font-size:9px">${colSize} games</span>
        </div>
      </th>`;
    }).join('')}
  </tr>`;

  if (games.length === 0) {
    document.getElementById('gridBody').innerHTML = '';
    document.getElementById('gridEmpty').classList.remove('hidden');
    return;
  }
  document.getElementById('gridEmpty').classList.add('hidden');

  const MAX_ROWS = 500;
  const shown = games.slice(0, MAX_ROWS);

  const GL = ['#eff6ff','#ecfdf5','#fff7ed','#fdf2f8','#eef2ff','#fffbeb','#fff1f2','#f0fdfa'];
  const GC = ['#2563eb','#059669','#ea580c','#db2777','#4f46e5','#d97706','#dc2626','#0d9488'];

  document.getElementById('gridBody').innerHTML = shown.map(g => {
    const matchCount = g.ownedBy.length;
    const allOwn = matchCount === playerCount;
    const matchColor = allOwn ? '#059669' : matchCount >= playerCount * 0.6 ? '#d97706' : '#64748b';
    const rowAccent = allOwn ? 'background:#f0fdf4' : '';

    const cells = displayUsers.map(u => {
      const ui = S.users.indexOf(u) % GL.length;
      const owns = g.ownedBy.includes(u);
      const rating = owns ? S.collections[u]?.find(x => x.id === g.id)?.userRating : null;
      if (!owns) {
        return `<td class="owns-cell" style="text-align:center;border-right:1px solid #f1f5f9;color:#e2e8f0;font-size:14px">—</td>`;
      }
      return `<td class="owns-cell" style="text-align:center;border-right:1px solid #f1f5f9;background:${GL[ui]}">
        <div style="display:flex;flex-direction:column;align-items:center;padding:3px 0">
          <span style="color:${GC[ui]};font-weight:800;font-size:13px">✓</span>
          ${rating ? `<span style="font-size:11px;font-weight:700;color:#475569">${rating}</span>` : ''}
        </div>
      </td>`;
    }).join('');

    return `
      <tr class="grid-row" style="border-bottom:1px solid #f1f5f9;${rowAccent}">
        <td class="sticky-col" style="border-right:1px solid #e8eaf0;padding:8px 12px">
          <div style="display:flex;align-items:center;gap:9px">
            ${g.thumbnail
              ? `<img src="${g.thumbnail}" style="width:32px;height:32px;border-radius:7px;object-fit:cover;flex-shrink:0;background:#f1f5f9">`
              : `<div style="width:32px;height:32px;border-radius:7px;background:#f1f5f9;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px">🎲</div>`}
            <div style="min-width:0">
              <div style="font-size:12px;font-weight:600;color:#1e293b;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3">${g.name}</div>
              <div style="font-size:10px;color:#94a3b8;margin-top:1px">${g.year}</div>
            </div>
          </div>
        </td>
        <td style="text-align:center;border-right:1px solid #f1f5f9;padding:0 8px">
          <span style="font-size:13px;font-weight:800;color:${matchColor}">${matchCount}</span>
          <div style="font-size:9px;color:#94a3b8">/${playerCount}</div>
        </td>
        <td style="text-align:center;border-right:1px solid #f1f5f9;padding:0 8px;font-size:12px;font-weight:700;color:#475569">${g.bayesaverage > 0 ? g.bayesaverage.toFixed(1) : '—'}</td>
        ${cells}
      </tr>
    `;
  }).join('');

  if (games.length > MAX_ROWS) {
    document.getElementById('gridBody').innerHTML +=
      `<tr><td colspan="${displayUsers.length + 3}" style="text-align:center;padding:10px;font-size:11px;color:#94a3b8">
        Showing first ${MAX_ROWS} of ${games.length} — search to narrow results
      </td></tr>`;
  }
}

function setGridUserSort(user, rowSortOverride) {
  gridUserSort = user;
  if (rowSortOverride) {
    document.getElementById('gridSort').value = rowSortOverride;
  }
  renderGrid();
}

// ─── Misc helpers ─────────────────────────────────────────────────────────────
function resetAll() {
  S.collections = {};
  S.users = [];
  S.allGames = [];
  S.pairs = [];
  ['rates','grid'].forEach(t => {
    const btn = document.getElementById('tab-'+t);
    btn.disabled = true;
    btn.style.color = 'rgba(255,255,255,.3)';
    btn.classList.remove('active');
  });
  switchTab('settings');
  showProgress(false);
  document.getElementById('loadingDots').classList.add('hidden');
  document.getElementById('resetBtn').classList.add('hidden');
  document.getElementById('headerSub').textContent = 'Compare BGG collections side-by-side';
}

function showProgress(show) {
  document.getElementById('progressWrap').classList.toggle('hidden', !show);
  document.getElementById('progressMsg').classList.toggle('hidden', !show);
}

function setProgress(pct, text, count) {
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = text;
  document.getElementById('progressCount').textContent = count;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function tick() { return new Promise(r => requestAnimationFrame(r)); }
</script>
