<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Creator Workshop</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        // Pure localStorage-based dice creator

        // --- App State ---
        let localDice = [];
        let rollTray = [];

        // --- UI Logic ---
        function switchView(view) {
            document.getElementById('workshop-view').classList.toggle('hidden', view !== 'workshop');
            document.getElementById('roll-space-view').classList.toggle('hidden', view !== 'roll');
            
            document.getElementById('btn-workshop').classList.toggle('bg-indigo-600', view === 'workshop');
            document.getElementById('btn-workshop').classList.toggle('bg-gray-700', view !== 'workshop');
            
            document.getElementById('btn-roll-space').classList.toggle('bg-indigo-600', view === 'roll');
            document.getElementById('btn-roll-space').classList.toggle('bg-gray-700', view !== 'roll');
            
            if (view === 'roll') {
                renderRollTray();
                renderSavedDiceForRollSpace();
            }
        }

        function updateFaceInputs() {
            const dieType = document.getElementById('die-type').value;
            const numFaces = parseInt(dieType.substring(1)); // "d6" -> 6
            const container = document.getElementById('die-face-inputs');
            container.innerHTML = '';
            
            for (let i = 1; i <= numFaces; i++) {
                const inputGroup = document.createElement('div');
                inputGroup.className = 'flex items-center space-x-2';
                inputGroup.innerHTML = `
                    <label for="face-${i}" class="w-8 text-sm font-medium text-gray-300">F${i}:</label>
                    <input type="text" id="face-${i}" name="face-${i}" class="block w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md shadow-sm text-white placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="e.g., ${i} or 💀" value="${i}">
                `;
                container.appendChild(inputGroup);
            }
            updatePreview();
        }

        function updatePreview() {
            const bgColor = document.getElementById('die-color-bg').value;
            const textColor = document.getElementById('die-color-text').value;
            const firstFace = document.getElementById('face-1')?.value || '1';
            
            const previewDie = document.getElementById('preview-die');
            previewDie.style.backgroundColor = bgColor;
            previewDie.style.color = textColor;
            previewDie.textContent = firstFace;
        }

        // --- Data Handling (Local & Cloud) ---
        function getDieDataFromForm() {
            const collectionName = document.getElementById('collection-name').value.trim();
            const dieName = document.getElementById('die-name').value.trim();
            const dieType = document.getElementById('die-type').value;
            const numFaces = parseInt(dieType.substring(1));
            const faces = [];
            
            for (let i = 1; i <= numFaces; i++) {
                const faceValue = document.getElementById(`face-${i}`).value.trim();
                if (!faceValue) {
                    showModal(`Please fill out Face ${i}.`, "error");
                    return null;
                }
                faces.push(faceValue);
            }

            if (!collectionName || !dieName) {
                showModal("Please provide a Collection Name and a Die Name.", "error");
                return null;
            }
            
            return {
                collectionName,
                dieName,
                type: dieType,
                faces,
                bgColor: document.getElementById('die-color-bg').value,
                textColor: document.getElementById('die-color-text').value,
            };
        }
        
        function saveToLocal() {
            const dieData = getDieDataFromForm();
            if (!dieData) return;
            
            // Add a simple local ID
            dieData.id = `local_${new Date().getTime()}`;
            localDice.push(dieData);
            localStorage.setItem('customDice', JSON.stringify(localDice));
            
            showModal(`Saved "${dieData.dieName}" to Local Storage!`, "success");
            renderSavedDiceLists();
            clearForm();
        }
        
        function loadFromLocal() {
            const saved = localStorage.getItem('customDice');
            if (saved) {
                localDice = JSON.parse(saved);
            }
            renderSavedDiceLists();
        }
        
        function clearForm() {
            document.getElementById('collection-name').value = '';
            document.getElementById('die-name').value = '';
            document.getElementById('die-type').value = 'd6';
            updateFaceInputs();
            document.getElementById('die-color-bg').value = '#ffffff';
            document.getElementById('die-color-text').value = '#000000';
            updatePreview();
        }

        function renderSavedDiceLists() {
            renderDiceList(document.getElementById('local-dice-list'), localDice, 'local');
        }

        function renderDiceList(container, diceArray, type) {
            container.innerHTML = '';
            if (diceArray.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-400 italic">No dice saved yet.</p>`;
                return;
            }

            // Group dice by collection
            const collections = diceArray.reduce((acc, die) => {
                (acc[die.collectionName] = acc[die.collectionName] || []).push(die);
                return acc;
            }, {});

            Object.entries(collections).forEach(([collectionName, dice]) => {
                const collectionEl = document.createElement('div');
                collectionEl.className = 'mb-3';
                
                const titleEl = document.createElement('h4');
                titleEl.className = 'text-sm font-semibold text-indigo-300 mb-1';
                titleEl.textContent = collectionName;
                collectionEl.appendChild(titleEl);
                
                const ul = document.createElement('ul');
                ul.className = 'list-disc list-inside space-y-1';
                
                dice.forEach(die => {
                    const li = document.createElement('li');
                    li.className = 'text-xs text-gray-300 flex justify-between items-center';
                    li.innerHTML = `
                        <span>${die.dieName} (${die.type})</span>
                        <button data-die-id="${die.id}" data-type="${type}" class="delete-die-btn text-red-400 hover:text-red-300 text-xs px-1">&times;</button>
                    `;
                    ul.appendChild(li);
                });
                
                collectionEl.appendChild(ul);
                container.appendChild(collectionEl);
            });
            
            // Add delete listeners
            container.querySelectorAll('.delete-die-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const dieId = e.currentTarget.getAttribute('data-die-id');
                    const dieType = e.currentTarget.getAttribute('data-type');
                    deleteDie(dieId, dieType);
                });
            });
        }
        
        function deleteDie(dieId, type) {
            if (type === 'local') {
                localDice = localDice.filter(d => d.id !== dieId);
                localStorage.setItem('customDice', JSON.stringify(localDice));
                renderSavedDiceLists();
                showModal("Deleted die from Local Storage.", "success");
            }
        }
        
        // --- Roll Space Logic ---
        function renderSavedDiceForRollSpace() {
            const container = document.getElementById('roll-space-dice-list');
            container.innerHTML = '';

            if (localDice.length === 0) {
                container.innerHTML = '<p class="text-sm text-gray-400 italic">No saved dice. Go to the Workshop to create some!</p>';
                return;
            }

            const collections = localDice.reduce((acc, die) => {
                (acc[die.collectionName] = acc[die.collectionName] || []).push(die);
                return acc;
            }, {});

            Object.entries(collections).forEach(([collectionName, dice]) => {
                const collectionEl = document.createElement('div');
                collectionEl.className = 'mb-4';
                
                const titleEl = document.createElement('h3');
                titleEl.className = 'text-lg font-semibold text-indigo-300 mb-2';
                titleEl.textContent = collectionName;
                collectionEl.appendChild(titleEl);
                
                const gridEl = document.createElement('div');
                gridEl.className = 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2';
                
                dice.forEach(die => {
                    const dieButton = document.createElement('button');
                    dieButton.className = 'p-2 rounded-lg shadow-md text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-50 transition-transform transform hover:scale-105';
                    dieButton.textContent = `${die.dieName} (${die.type})`;
                    dieButton.style.backgroundColor = die.bgColor;
                    dieButton.style.color = die.textColor;
                    
                    dieButton.onclick = () => addDieToTray(die);
                    
                    gridEl.appendChild(dieButton);
                });
                
                collectionEl.appendChild(gridEl);
                container.appendChild(collectionEl);
            });
        }
        
        function addDieToTray(die) {
            rollTray.push(die);
            renderRollTray();
        }
        
        function renderRollTray() {
            const container = document.getElementById('roll-tray');
            container.innerHTML = '';
            
            if (rollTray.length === 0) {
                container.innerHTML = '<p class="text-sm text-gray-400 italic">Add dice from your collections to roll.</p>';
                return;
            }
            
            rollTray.forEach((die, index) => {
                const dieEl = document.createElement('div');
                dieEl.className = 'p-2 w-16 h-16 rounded-lg shadow-md flex items-center justify-center text-lg font-bold relative transition-all';
                dieEl.style.backgroundColor = die.bgColor;
                dieEl.style.color = die.textColor;
                dieEl.textContent = die.type;
                
                const removeBtn = document.createElement('button');
                removeBtn.className = 'absolute -top-1 -right-1 w-5 h-5 bg-red-600 text-white text-xs rounded-full flex items-center justify-center font-bold shadow-md hover:bg-red-500';
                removeBtn.innerHTML = '&times;';
                removeBtn.onclick = () => {
                    rollTray.splice(index, 1);
                    renderRollTray();
                };
                
                dieEl.appendChild(removeBtn);
                container.appendChild(dieEl);
            });
        }

        function rollDice() {
            const resultsContainer = document.getElementById('roll-results-container');
            const resultsDisplay = document.getElementById('roll-results');
            const animationContainer = document.getElementById('roll-animation-container');
            
            if (rollTray.length === 0) {
                showModal("Add some dice to the tray first!", "error");
                return;
            }
            
            resultsContainer.classList.add('hidden');
            animationContainer.innerHTML = '';
            resultsDisplay.innerHTML = '';
            
            let finalResults = [];

            rollTray.forEach((die, index) => {
                const numFaces = die.faces.length;
                
                // Create animation die
                const animDie = document.createElement('div');
                animDie.className = 'w-24 h-24 rounded-lg shadow-xl flex items-center justify-center text-3xl font-bold m-2 animate-spin-slow';
                animDie.style.backgroundColor = die.bgColor;
                animDie.style.color = die.textColor;
                animationContainer.appendChild(animDie);
                
                let spinCount = 0;
                const maxSpins = 15 + Math.floor(Math.random() * 10); // 1.5 - 2.5s
                
                const spinInterval = setInterval(() => {
                    // Show random face
                    const randomFace = die.faces[Math.floor(Math.random() * numFaces)];
                    animDie.textContent = randomFace;
                    spinCount++;
                    
                    if (spinCount > maxSpins) {
                        clearInterval(spinInterval);
                        
                        // Get final result
                        const resultIndex = Math.floor(Math.random() * numFaces);
                        const resultFace = die.faces[resultIndex];
                        finalResults[index] = { face: resultFace, die: die };
                        
                        // Stop animation and show result
                        animDie.classList.remove('animate-spin-slow');
                        animDie.classList.add('scale-110'); // Pop effect
                        animDie.textContent = resultFace;
                        
                        // Check if all dice are done
                        if (finalResults.filter(r => r).length === rollTray.length) {
                            displayFinalResults(finalResults);
                        }
                    }
                }, 100);
            });
        }
        
        function displayFinalResults(results) {
            const resultsContainer = document.getElementById('roll-results-container');
            const resultsDisplay = document.getElementById('roll-results');
            resultsDisplay.innerHTML = '';
            
            results.forEach(result => {
                const resultEl = document.createElement('div');
                resultEl.className = 'p-3 w-20 h-20 rounded-lg shadow-md flex items-center justify-center text-2xl font-bold';
                resultEl.style.backgroundColor = result.die.bgColor;
                resultEl.style.color = result.die.textColor;
                resultEl.textContent = result.face;
                resultsDisplay.appendChild(resultEl);
            });
            
            resultsContainer.classList.remove('hidden');
        }

        // --- Utility ---
        function showModal(message, type = "info") {
            const modal = document.getElementById('modal');
            const modalMessage = document.getElementById('modal-message');
            const modalClose = document.getElementById('modal-close');
            
            modalMessage.textContent = message;
            
            // Reset colors
            modal.classList.remove('bg-red-600', 'bg-green-600', 'bg-blue-600');
            
            if (type === 'error') {
                modal.classList.add('bg-red-600');
            } else if (type === 'success') {
                modal.classList.add('bg-green-600');
            } else {
                modal.classList.add('bg-blue-600');
            }
            
            modal.classList.remove('hidden', 'opacity-0', '-translate-y-full');
            modal.classList.add('opacity-100', 'translate-y-0');
            
            const close = () => {
                modal.classList.add('opacity-0', '-translate-y-full');
                modal.classList.remove('opacity-100', 'translate-y-0');
                setTimeout(() => modal.classList.add('hidden'), 300);
            };

            modalClose.onclick = close;
            setTimeout(close, 4000); // Auto-dismiss
        }

        // --- Event Listeners ---
        window.onload = () => {
            loadFromLocal();
            
            // View switching
            document.getElementById('btn-workshop').onclick = () => switchView('workshop');
            document.getElementById('btn-roll-space').onclick = () => switchView('roll');
            
            // Workshop listeners
            document.getElementById('die-type').onchange = updateFaceInputs;
            document.getElementById('die-color-bg').oninput = updatePreview;
            document.getElementById('die-color-text').oninput = updatePreview;
            document.getElementById('btn-save-local').onclick = saveToLocal;
            
            // Roll Space listeners
            document.getElementById('btn-roll').onclick = rollDice;
            document.getElementById('btn-clear-tray').onclick = () => {
                rollTray = [];
                renderRollTray();
            };
            
            // Initial setup
            updateFaceInputs();
            switchView('workshop');
        };

        // Make functions globally accessible for inline event handlers
        window.switchView = switchView;
        window.updateFaceInputs = updateFaceInputs;
        window.updatePreview = updatePreview;
        window.saveToLocal = saveToLocal;
        window.rollDice = rollDice;
        window.addDieToTray = addDieToTray;
        window.deleteDie = deleteDie;

    </script>
    
    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* dark gray-blue */
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937; /* gray-800 */
        }
        ::-webkit-scrollbar-thumb {
            background: #4f46e5; /* indigo-600 */
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6366f1; /* indigo-500 */
        }
        
        /* Custom animation */
        @keyframes spin-slow {
            from {
                transform: rotate(0deg) scale(0.9);
            }
            to {
                transform: rotate(360deg) scale(0.9);
            }
        }
        .animate-spin-slow {
            animation: spin-slow 1s linear infinite;
        }
        
        /* Color input styling */
        input[type="color"] {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 40px;
            height: 40px;
            padding: 0;
            border: 2px solid #4b5563; /* gray-600 */
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 6px;
        }
    </style>
</head>
<body class="text-white">

    <!-- Global Modal -->
    <div id="modal" class="hidden fixed top-4 left-1/2 -translate-x-1/2 w-full max-w-md p-4 rounded-lg shadow-lg text-white z-50 transition-all duration-300 transform opacity-0 -translate-y-full">
        <div class="flex justify-between items-center">
            <p id="modal-message">This is a modal message.</p>
            <button id="modal-close" class="text-xl font-bold">&times;</button>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container mx-auto p-4 max-w-6xl">
        
        <!-- Header & View Toggler -->
        <header class="flex flex-col sm:flex-row justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-white mb-4 sm:mb-0">Dice Creator</h1>
            <div class="flex space-x-2 bg-gray-800 p-1 rounded-lg">
                <button id="btn-workshop" class="px-4 py-2 text-sm font-medium rounded-md text-white bg-indigo-600 transition-colors">
                    Workshop
                </button>
                <button id="btn-roll-space" class="px-4 py-2 text-sm font-medium rounded-md text-white bg-gray-700 transition-colors">
                    Roll Space
                </button>
            </div>
        </header>

        <!-- === WORKSHOP VIEW === -->
        <main id="workshop-view" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Column 1: Creator Form -->
            <div class="md:col-span-2 bg-gray-800 p-6 rounded-lg shadow-xl">
                <h2 class="text-2xl font-semibold mb-4 text-white">Create New Die</h2>
                
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <!-- Left Side: Names & Type -->
                    <div class="space-y-4">
                        <div>
                            <label for="collection-name" class="block text-sm font-medium text-gray-300">Collection Name</label>
                            <input type="text" id="collection-name" class="mt-1 block w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md shadow-sm text-white placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="e.g., Elemental Set">
                        </div>
                        
                        <div>
                            <label for="die-name" class="block text-sm font-medium text-gray-300">Die Name</label>
                            <input type="text" id="die-name" class="mt-1 block w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md shadow-sm text-white placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="e.g., Fire d6">
                        </div>

                        <div>
                            <label for="die-type" class="block text-sm font-medium text-gray-300">Die Type</label>
                            <select id="die-type" class="mt-1 block w-full pl-3 pr-10 py-2 bg-gray-700 border border-gray-600 rounded-md text-white focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                                <option value="d4">d4</option>
                                <option value="d6" selected>d6</option>
                                <option value="d8">d8</option>
                                <option value="d10">d10</option>
                                <option value="d12">d12</option>
                                <option value="d20">d20</option>
                            </select>
                        </div>
                        
                        <!-- Colors & Preview -->
                        <div class="pt-2">
                             <label class="block text-sm font-medium text-gray-300 mb-2">Colors & Preview</label>
                            <div class="flex items-center space-x-4">
                                <div>
                                    <label for="die-color-bg" class="block text-xs font-medium text-gray-400">BG</label>
                                    <input type="color" id="die-color-bg" value="#ffffff" class="mt-1">
                                </div>
                                <div>
                                    <label for="die-color-text" class="block text-xs font-medium text-gray-400">Text</label>
                                    <input type="color" id="die-color-text" value="#000000" class="mt-1">
                                </div>
                                <div class="flex-grow flex justify-center items-center">
                                    <div id="preview-die" class="w-20 h-20 rounded-lg shadow-md flex items-center justify-center text-3xl font-bold transition-colors" style="background-color: rgb(255, 255, 255); color: rgb(0, 0, 0);">
                                        1
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                    
                    <!-- Right Side: Faces -->
                    <div class="space-y-3">
                        <label class="block text-sm font-medium text-gray-300">Face Values (Text or Emoji)</label>
                        <div id="die-face-inputs" class="space-y-2 max-h-80 overflow-y-auto pr-2">
                            <!-- Dynamic inputs will be injected here -->
                        </div>
                    </div>
                </div>
                
                <!-- Save Buttons -->
                <div class="mt-8 pt-6 border-t border-gray-700 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                    <button id="btn-save-local" class="w-full sm:w-auto px-6 py-3 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 focus:ring-offset-gray-800">
                        Save to Local
                    </button>
                </div>
            </div>
            
            <!-- Column 2: Saved Dice -->
            <aside class="md:col-span-1 bg-gray-800 p-6 rounded-lg shadow-xl max-h-[80vh] overflow-y-auto">
                <h2 class="text-2xl font-semibold mb-4 text-white">My Collections</h2>
                
                <!-- Local Dice -->
                <div>
                    <h3 class="text-lg font-semibold mb-2 text-green-400 flex items-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h4a2 2 0 012 2v1M5 19h14a2 2 0 002-2v-5a2 2 0 00-2-2H9a2 2 0 00-2 2v5a2 2 0 002 2z"></path></svg>
                        Local Storage
                    </h3>
                    <div id="local-dice-list" class="pl-2 space-y-2">
                        <!-- Local dice list will be injected here -->
                    </div>
                </div>
            </aside>

        </main>
        
        <!-- === ROLL SPACE VIEW === -->
        <main id="roll-space-view" class="hidden">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                <!-- Column 1: Rolling Area -->
                <div class="lg:col-span-2 bg-gray-800 p-6 rounded-lg shadow-xl">
                    <h2 class="text-2xl font-semibold mb-4 text-white">Let's Roll!</h2>
                    
                    <!-- Roll Tray -->
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="text-lg font-medium text-gray-300">Roll Tray</h3>
                            <button id="btn-clear-tray" class="text-xs text-indigo-400 hover:text-indigo-300">Clear Tray</button>
                        </div>
                        <div id="roll-tray" class="min-h-20 bg-gray-900 p-3 rounded-lg flex flex-wrap gap-2 items-center">
                            <!-- Dice in tray will be injected here -->
                        </div>
                    </div>
                    
                    <!-- Roll Button -->
                    <div class="mt-6 text-center">
                        <button id="btn-roll" class="w-full sm:w-1/2 px-8 py-4 border border-transparent rounded-lg shadow-sm text-lg font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 focus:ring-offset-gray-800 transition-transform transform hover:scale-105">
                            Roll Dice
                        </button>
                    </div>
                    
                    <!-- Animation & Results -->
                    <div class="mt-6 min-h-40">
                        <div id="roll-animation-container" class="flex flex-wrap justify-center items-center p-4">
                            <!-- Animation appears here -->
                        </div>
                        
                        <div id="roll-results-container" class="hidden mt-4">
                            <h3 class="text-xl font-semibold text-center text-white mb-4">Results</h3>
                            <div id="roll-results" class="flex flex-wrap justify-center gap-3 p-4 bg-gray-900 rounded-lg">
                                <!-- Results appear here -->
                            </div>
                        </div>
                    </div>
                    
                </div>
                
                <!-- Column 2: Saved Dice for Rolling -->
                <aside class="lg:col-span-1 bg-gray-800 p-6 rounded-lg shadow-xl max-h-[80vh] overflow-y-auto">
                    <h2 class="text-2xl font-semibold mb-4 text-white">Add to Tray</h2>
                    <div id="roll-space-dice-list" class="space-y-4">
                        <!-- Grouped dice buttons will be injected here -->
                    </div>
                </aside>
                
            </div>
        </main>
        
    </div>
    
</body>
</html>
