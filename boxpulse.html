<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>BoxPulse | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>📦</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            overflow-x: hidden !important;
            overflow-y: auto !important;
            max-width: 100vw;
            width: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        /* Glass surfaces */
        .glass {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.09);
        }

        .glass-dark {
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        /* Gradient buttons */
        .btn-blue { background: linear-gradient(135deg,#3b82f6,#2563eb); box-shadow: 0 4px 15px rgba(37,99,235,.35); }
        .btn-purple { background: linear-gradient(135deg,#a855f7,#7c3aed); box-shadow: 0 4px 15px rgba(124,58,237,.35); }
        .btn-green { background: linear-gradient(135deg,#10b981,#059669); box-shadow: 0 4px 15px rgba(16,185,129,.3); }

        /* Game card */
        .gcard {
            border: 1.5px solid rgba(255,255,255,.08);
            background: rgba(255,255,255,.03);
            transition: all .22s ease;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .gcard:hover { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); }

        .gcard.active {
            border-color: #a855f7;
            background: rgba(168,85,247,.15);
            box-shadow: 0 0 25px rgba(168,85,247,.4), inset 0 0 20px rgba(168,85,247,.1);
            transform: scale(1.12);
            z-index: 50;
        }

        .gcard.correct {
            border-color: #10b981;
            background: rgba(16,185,129,.12);
            box-shadow: 0 0 20px rgba(16,185,129,.35);
        }

        .gcard.wrong {
            border-color: #ef4444;
            background: rgba(239,68,68,.12);
            animation: shake .4s ease-in-out;
        }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; } }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; z-index: 50; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal::before { content: ''; position: absolute; inset: 0; background: rgba(15,23,42,.85); backdrop-filter: blur(8px); }

        /* Stat pills */
        .spill {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            border-radius: 999px;
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.07);
        }

        .spill-val { font-size: 12px; font-weight: 900; color: #f1f5f9; }
        .spill-lbl { font-size: 7px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #475569; }

        /* Status message */
        .status-msg {
            animation: fadeUp .3s ease-out;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .08em;
            min-height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-msg.playing { color: #60a5fa; }
        .status-msg.correct { color: #86efac; background: rgba(16,185,129,.12); border: 1px solid rgba(16,185,129,.3); }
        .status-msg.error { color: #ff9999; background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.3); }

        /* Background glow */
        .bg-glow {
            position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
        }

        .bg-glow::before {
            content: '';
            position: absolute;
            top: -30%; right: -20%;
            width: 120px; height: 120px;
            background: rgba(168,85,247,.12);
            filter: blur(140px);
            border-radius: 50%;
        }

        .bg-glow::after {
            content: '';
            position: absolute;
            bottom: -10%; left: 10%;
            width: 100%; height: 60%;
            background: rgba(59,130,246,.08);
            filter: blur(150px);
            border-radius: 50%;
        }

        /* Scrollbar */
        .scrollbar::-webkit-scrollbar { width: 4px; }
        .scrollbar::-webkit-scrollbar-track { background: transparent; }
        .scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 10px; }

        /* Prevent horizontal scrolling on iPhone */
        * { overflow-x: hidden !important; }
        .scrollbar { overflow-x: hidden !important; }
    </style>
</head>
<body>

<div class="bg-glow"></div>

<div class="relative z-10 flex flex-col" style="height:100dvh;">

    <!-- ════ SETUP MODAL ════ -->
    <div id="setupModal" class="modal active p-4">
        <div class="glass relative max-w-sm w-full rounded-[2rem] p-6 border-t border-white/20">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-purple-600 rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-purple-500/30 border-t border-white/20 text-3xl mb-3">
                    📦
                </div>
                <h1 class="text-2xl font-black tracking-tight text-white mb-1 italic uppercase">BoxPulse</h1>
                <p class="text-[9px] text-slate-500 font-bold uppercase tracking-widest">Memory Game with Game Covers</p>
            </div>

            <div class="space-y-4">
                <!-- Grid Size -->
                <div class="space-y-2">
                    <label class="text-[9px] font-black text-slate-500 uppercase tracking-widest">Grid Size</label>
                    <select id="numGames" class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5 text-white font-bold text-xs focus:outline-none focus:ring-2 focus:ring-purple-500/40 transition-all">
                        <option value="4">4 games (2×2)</option>
                        <option value="6">6 games (2×3)</option>
                        <option value="9" selected>9 games (3×3)</option>
                        <option value="12">12 games (3×4)</option>
                        <option value="16">16 games (4×4)</option>
                    </select>
                </div>

                <!-- Speed -->
                <div class="space-y-2">
                    <label class="text-[9px] font-black text-slate-500 uppercase tracking-widest">Speed</label>
                    <select id="gameSpeed" class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5 text-white font-bold text-xs focus:outline-none focus:ring-2 focus:ring-purple-500/40 transition-all">
                        <option value="slow">Slow</option>
                        <option value="normal" selected>Normal</option>
                        <option value="fast">Fast</option>
                    </select>
                </div>

                <!-- Play Button -->
                <button onclick="startGame()" class="w-full btn-purple text-white py-3 rounded-xl font-black text-sm italic uppercase tracking-tighter active:scale-95 transition-transform flex items-center justify-center gap-2 mt-5">
                    <i data-lucide="play" class="w-4 h-4"></i>
                    Play Now
                </button>
            </div>

            <div class="text-[9px] text-slate-500 text-center mt-4 pt-4 border-t border-white/5 font-bold uppercase tracking-widest">
                Tap covers to match sequences
            </div>
        </div>
    </div>

    <!-- ════ GAME VIEW ════ -->
    <div id="gameView" class="hidden flex flex-col h-full">
        <!-- Header -->
        <header class="shrink-0 px-4 py-2.5 border-b border-white/5 bg-slate-900/60 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-purple-600/20 rounded-lg flex items-center justify-center border border-purple-500/30 shadow-md shadow-purple-500/10">
                    <i data-lucide="zap" class="w-3.5 h-3.5 text-purple-400"></i>
                </div>
                <div>
                    <h1 class="text-[15px] font-black italic uppercase tracking-tighter leading-none text-white">BoxPulse</h1>
                    <p id="statusText" class="text-status-msg text-[8px] font-bold text-slate-500 uppercase tracking-widest leading-tight mt-0.5">Playing...</p>
                </div>
            </div>
            <div class="flex gap-1.5">
                <button onclick="togglePause()" class="glass w-9 h-9 rounded-lg flex items-center justify-center text-slate-400 hover:text-white transition-all">
                    <i id="pauseIcon" data-lucide="pause" class="w-4 h-4"></i>
                </button>
                <button onclick="backToSetup()" class="glass w-9 h-9 rounded-lg flex items-center justify-center text-slate-400 hover:text-white transition-all">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                </button>
            </div>
        </header>

        <!-- Stats -->
        <div class="shrink-0 flex items-center gap-2 px-4 py-2.5 border-b border-white/5 bg-slate-900/30">
            <div class="spill">
                <span class="spill-val" id="score">0</span>
                <span class="spill-lbl">Score</span>
            </div>
            <div class="spill">
                <span class="spill-val" id="highScore">0</span>
                <span class="spill-lbl">Best</span>
            </div>
            <div class="spill">
                <span class="spill-val" id="roundNum">1</span>
                <span class="spill-lbl">Round</span>
            </div>
        </div>

        <!-- Game Grid -->
        <div class="flex-1 flex flex-col items-center justify-center p-4 scrollbar overflow-y-auto">
            <div id="gameGrid" class="grid gap-3 w-fit"></div>
        </div>

        <!-- Controls -->
        <div class="shrink-0 p-3 border-t border-white/5">
            <button id="resetBtn" onclick="resetGame()" class="w-full glass border border-white/8 rounded-xl py-2.5 font-black text-[10px] uppercase tracking-widest text-slate-400 hover:text-white transition-all active:scale-95">
                Reset Game
            </button>
        </div>
    </div>

</div>

<script>
    let collection = [];
    let currentGames = [];
    let sequence = [];
    let playerSequence = [];
    let score = 0;
    let round = 1;
    let highScore = 0;
    let isPlaying = false;
    let isPlayerTurn = false;
    let isPaused = false;
    let resumeResolve = null;
    let speedMap = { slow: 1200, normal: 800, fast: 400 };

    const wait = (ms) => new Promise(r => setTimeout(r, ms));

    async function loadCollection() {
        try {
            for (let retry = 0; retry < 5; retry++) {
                const res = await fetch(`/api/bgg-helper?endpoint=collection&username=sportomax&own=1&stats=1`);
                if (res.status === 202) { await wait(3000); continue; }
                
                const xml = await res.text();
                const doc = new DOMParser().parseFromString(xml, 'text/xml');
                collection = Array.from(doc.querySelectorAll('item')).map(item => ({
                    id: item.getAttribute('objectid'),
                    name: item.querySelector('name').textContent,
                    image: item.querySelector('thumbnail')?.textContent || ''
                })).filter(g => g.image);
                
                highScore = parseInt(localStorage.getItem('boxpulseHighScore') || '0');
                document.getElementById('highScore').textContent = highScore;
                return;
            }
        } catch (e) {
            console.error('Load failed:', e);
        }
    }

    async function startGame() {
        const num = parseInt(document.getElementById('numGames').value);
        if (collection.length === 0) await loadCollection();
        
        currentGames = [...collection].sort(() => Math.random() - 0.5).slice(0, num);
        document.getElementById('setupModal').classList.remove('active');
        document.getElementById('gameView').classList.remove('hidden');
        initializeGame();
    }

    function initializeGame() {
        sequence = [];
        playerSequence = [];
        score = 0;
        round = 1;
        updateUI();
        renderGrid();
        setStatus('Tap any card to start');
    }

    function renderGrid() {
        const num = currentGames.length;
        const cols = num <= 4 ? 2 : num <= 9 ? 3 : 4;
        const size = num > 9 ? 60 : num > 4 ? 78 : 96;

        const grid = document.getElementById('gameGrid');
        grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        grid.innerHTML = currentGames.map((game, idx) => `
            <div class="gcard rounded-xl" style="width:${size}px;height:${size}px;" 
                 data-idx="${idx}" onclick="handleCardClick(${idx})">
                <img src="/api/image-proxy?url=${encodeURIComponent(game.image)}" alt="${game.name}" 
                     class="w-full h-full object-cover pointer-events-none user-select-none">
            </div>
        `).join('');
    }

    async function startRound() {
        isPlaying = true;
        isPlayerTurn = false;
        sequence.push(Math.floor(Math.random() * currentGames.length));
        playerSequence = [];
        updateUI();
        setStatus('Watch...');
        await wait(800);
        
        for (let idx of sequence) {
            if (isPaused) await new Promise(r => resumeResolve = r);
            await highlight(idx);
            await wait(speedMap[document.getElementById('gameSpeed').value] / 2);
        }
        
        isPlayerTurn = true;
        setStatus('Your Turn');
    }

    async function highlight(idx) {
        const card = document.querySelector(`[data-idx="${idx}"]`);
        if (!card) return;
        card.classList.add('active');
        await wait(speedMap[document.getElementById('gameSpeed').value] * 0.6);
        card.classList.remove('active');
    }

    async function handleCardClick(idx) {
        if (!isPlaying) return startRound();
        if (!isPlayerTurn || isPaused) return;
        
        playerSequence.push(idx);
        highlight(idx);
        
        if (playerSequence[playerSequence.length - 1] !== sequence[playerSequence.length - 1]) {
            gameOver();
        } else if (playerSequence.length === sequence.length) {
            isPlayerTurn = false;
            score++;
            round++;
            updateUI();
            document.querySelectorAll('.gcard').forEach(c => c.classList.add('correct'));
            setStatus('Correct!');
            await wait(1200);
            document.querySelectorAll('.gcard').forEach(c => c.classList.remove('correct'));
            startRound();
        }
    }

    function gameOver() {
        isPlaying = false;
        isPlayerTurn = false;
        document.querySelectorAll('.gcard').forEach(c => c.classList.add('wrong'));
        
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('boxpulseHighScore', highScore);
            setStatus('🏆 New High Score!');
        } else {
            setStatus('Game Over');
        }
        updateUI();
    }

    function togglePause() {
        if (!isPlaying) return;
        isPaused = !isPaused;
        const icon = document.getElementById('pauseIcon');
        if (isPaused) {
            icon.setAttribute('data-lucide', 'play');
            setStatus('Paused');
        } else {
            icon.setAttribute('data-lucide', 'pause');
            setStatus('Your Turn');
            if (resumeResolve) resumeResolve();
        }
        lucide.createIcons();
    }

    function resetGame() { initializeGame(); }
    function backToSetup() { 
        document.getElementById('gameView').classList.add('hidden');
        document.getElementById('setupModal').classList.add('active');
    }
    function setStatus(t) { document.getElementById('statusText').textContent = t; }
    function updateUI() {
        document.getElementById('score').textContent = score;
        document.getElementById('highScore').textContent = highScore;
        document.getElementById('roundNum').textContent = round;
    }

    window.addEventListener('load', async () => {
        await loadCollection();
        lucide.createIcons();
    });
</script>

<!-- Analytics -->
<script type="module" src="analytics-init.js"></script>

</body>
</html>
