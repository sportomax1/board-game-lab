<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Game Tags Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #f8fafc; --surface: #ffffff; --card: #ffffff; --border: #e2e8f0;
            --text: #0f172a; --muted: #64748b; --accent: #4f46e5; --accent2: #6366f1;
            --green: #16a34a; --red: #dc2626; --orange: #f97316;
            --radius: 14px; --safe-b: env(safe-area-inset-bottom, 0px); --tab-h: 64px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1117; --surface: #1a1d27; --card: #22252f; --border: #2e3140;
                --text: #e4e6ed; --muted: #8b8fa3;
            }
        }
        html { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); -webkit-tap-highlight-color: transparent; }
        body { min-height: 100dvh; display: flex; flex-direction: column; overscroll-behavior: none; }
        input, select, button, textarea { font-family: inherit; font-size: inherit; }

        /* ===== Layout ===== */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }

        /* ===== Password Screen ===== */
        .password-screen { position: fixed; inset: 0; z-index: 200; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 20px; }
        .password-screen.hidden { display: none; }
        .password-box { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; max-width: 400px; width: 100%; box-shadow: var(--shadow-lg); }
        .password-box h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; text-align: center; }
        .password-box p { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 24px; }
        .password-error { font-size: 12px; color: var(--red); margin-bottom: 12px; text-align: center; display: none; }
        .password-field { margin-bottom: 12px; }
        .password-field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
        .password-field input { width: 100%; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 15px; outline: none; transition: border-color .2s; }
        .password-field input:focus { border-color: var(--accent); }

        /* ===== Top Bar ===== */
        .top-bar { position: sticky; top: 0; z-index: 50; backdrop-filter: blur(20px); background: color-mix(in srgb, var(--bg) 82%, transparent); border-bottom: 1px solid var(--border); padding: 12px 16px; }
        .top-bar .container { display: flex; align-items: center; justify-content: space-between; }
        .top-bar h1 { font-size: 18px; font-weight: 700; }
        .top-bar-stat { font-size: 11px; color: var(--muted); background: var(--surface); padding: 4px 8px; border-radius: 6px; }

        /* ===== Views & Tabs ===== */
        .views { flex: 1; overflow: hidden; position: relative; }
        .view { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 0 calc(var(--tab-h) + var(--safe-b) + 16px); opacity: 0; pointer-events: none; transition: opacity .25s; }
        .view.active { opacity: 1; pointer-events: auto; }
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; backdrop-filter: blur(20px); background: color-mix(in srgb, var(--bg) 88%, transparent); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 6px 0 calc(6px + var(--safe-b)); height: calc(var(--tab-h) + var(--safe-b)); }
        .tab-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 12px; border: none; background: none; color: var(--muted); font-size: 10px; font-weight: 600; cursor: pointer; }
        .tab-btn.active { color: var(--accent2); }
        @media (min-width: 768px) {
            .tab-bar { display: none; } /* Hide tabs on desktop */
            .views { display: flex !important; }
            .view { position: static; opacity: 1; pointer-events: auto; padding: 24px 0; display: none; }
            .view.active { display: block; }
            /* Sidebar navigation for desktop */
            body { flex-direction: row; }
            .sidebar { width: 240px; border-right: 1px solid var(--border); padding: 24px; background: var(--surface); height: 100dvh; position: sticky; top: 0; }
            .sidebar h1 { font-size: 20px; font-weight: 800; margin-bottom: 24px; }
            .sidebar .tab-btn { flex-direction: row; justify-content: flex-start; width: 100%; font-size: 14px; padding: 10px; border-radius: 8px; gap: 10px; }
            .sidebar .tab-btn.active { background: color-mix(in srgb, var(--accent) 15%, transparent); }
            .main-content { flex: 1; }
            .top-bar { display: none; } /* Hide top bar on desktop, nav is in sidebar */
        }

        /* ===== Cards & Elements ===== */
        .card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow-sm); }
        .card-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent2); }
        .badge-green { background: color-mix(in srgb, var(--green) 15%, transparent); color: var(--green); }
        .badge-muted { background: color-mix(in srgb, var(--muted) 12%, transparent); color: var(--muted); }

        /* ===== Inputs & Controls ===== */
        .controls-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 16px; }
        @media (min-width: 640px) { .controls-grid { grid-template-columns: 1fr auto; } }
        @media (min-width: 1024px) { .controls-grid { grid-template-columns: 1fr auto auto auto; } }
        .input { width: 100%; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; outline: none; transition: border-color .2s; }
        .input:focus { border-color: var(--accent); }

        /* ===== Buttons ===== */
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; transition: transform .1s, background-color .2s; }
        .btn:active { transform: scale(.97); }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent2); }
        .btn-outline { background: transparent; color: var(--accent2); border: 1px solid var(--border); }
        .btn-outline:hover { background: var(--surface); }
        .btn-sm { padding: 8px 14px; font-size: 13px; border-radius: 8px; }
        .btn-block { width: 100%; }
        .btn-icon { width: 40px; height: 40px; padding: 0; }

        /* ===== Game List ===== */
        #gamesList { display: grid; grid-template-columns: 1fr; gap: 12px; }
        @media (min-width: 768px) { #gamesList { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); } }
        .game-row { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--border); cursor: pointer; transition: box-shadow .2s, transform .2s; box-shadow: var(--shadow-sm); }
        .game-row:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .game-select-checkbox { accent-color: var(--accent); }
        .game-thumb { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: var(--surface); border: 1px solid var(--border); flex-shrink: 0; }
        .game-thumb-empty { width: 48px; height: 48px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 20px; flex-shrink: 0; }
        .game-info { min-width: 0; flex: 1; }
        .game-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .game-meta { font-size: 12px; color: var(--muted); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 4px 8px; }
        .game-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
        .game-tags .badge { font-size: 10px; padding: 2px 6px; }

        /* ===== Tag Pills ===== */
        .tag-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); font-size: 12px; cursor: pointer; margin: 4px 4px 4px 0; }
        .tag-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .tag-pill-close { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; font-weight: 700; }

        /* ===== Modal (fullscreen) ===== */
        .modal { position: fixed; inset: 0; z-index: 150; background: rgba(0, 0, 0, .6); opacity: 0; pointer-events: none; transition: opacity .2s; display: flex; align-items: stretch; }
        .modal.open { opacity: 1; pointer-events: auto; }
        .modal-sheet { position: relative; background: var(--bg); border-radius: 0; max-height: 100vh; height: 100vh; overflow-y: auto; width: 100%; padding: 16px 16px calc(24px + var(--safe-b)); display: flex; flex-direction: column; }
        .modal-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
        .modal-title { font-size: 18px; font-weight: 800; margin: 0; }
        .modal-subtitle { font-size: 13px; color: var(--muted); }
        .modal-body { flex: 1; overflow: auto; padding-top: 16px; }
        .modal-close { background: transparent; border: none; color: var(--muted); font-size: 18px; padding: 8px 12px; border-radius: 8px; cursor: pointer; }

        /* ===== Toasts (compact stacked) ===== */
        .toasts { position: fixed; bottom: calc(var(--tab-h) + var(--safe-b) + 16px); right: 16px; z-index: 110; display: flex; flex-direction: column; gap: 8px; max-width: 360px; }
        @media (min-width: 768px) { .toasts { top: 16px; bottom: auto; } }
        .toast-item { background: color-mix(in srgb, var(--surface) 90%, transparent); color: var(--text); padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow-lg); transform: translateY(10px) scale(.98); opacity: 0; transition: all .28s ease; pointer-events: auto; border: 1px solid var(--border); }
        .toast-item.show { transform: translateY(0) scale(1); opacity: 1; }
        .toast-item.success { background: linear-gradient(90deg, rgba(34, 197, 94, 1), rgba(34, 197, 94, 0.9)); color: #fff; border: none; }
        .toast-item.error { background: linear-gradient(90deg, rgba(239, 68, 68, 1), rgba(239, 68, 68, 0.9)); color: #fff; border: none; }
        .toast-item.info { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent2); border: 1px solid color-mix(in srgb, var(--accent) 18%, transparent); }

        /* ===== Utility ===== */
        .flex { display: flex; } .gap-8 { gap: 8px; } .gap-12 { gap: 12px; } .mb-12 { margin-bottom: 12px; } .mb-16 { margin-bottom: 16px; }
        .text-sm { font-size: 13px; } .text-xs { font-size: 11px; } .text-muted { color: var(--muted); } .hidden { display: none; }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
        .empty-state-icon { font-size: 48px; margin-bottom: 12px; }

        /* ===== Skeleton ===== */
        .skeleton { background: color-mix(in srgb, var(--surface) 50%, transparent); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: var(--radius); height: 74px; }
        @keyframes shimmer { 0% { opacity: .6; } 50% { opacity: 1; } 100% { opacity: .6; } }
    </style>
</head>
<body>
    <!-- Password Screen -->
    <div class="password-screen" id="passwordScreen">
        <div class="password-box">
            <h1>🏷️ Game Tags</h1>
            <p>Manage your collection tags</p>
            <div class="password-error" id="passwordError"></div>
            <div class="password-field">
                <label>Password</label>
                <input type="password" id="appPassword" placeholder="Enter password" onkeypress="if(event.key==='Enter')unlockApp()">
            </div>
            <div class="password-field">
                <label>BGG Username<span class="text-muted"> (default: sportomax)</span></label>
                <input type="text" id="bggUsername" placeholder="sportomax" value="sportomax" onkeypress="if(event.key==='Enter')unlockApp()">
            </div>
            <button class="btn btn-primary btn-block" onclick="unlockApp()">Unlock</button>
        </div>
    </div>

    <div id="desktopSidebar" class="sidebar" style="display:none">
        <h1>🏷️ Tags</h1>
        <nav id="desktopNav" class="flex" style="flex-direction: column; gap: 4px;"></nav>
    </div>

    <div id="mainContent" class="main-content" style="display:none">
        <div id="progressWrap" style="height:3px;overflow:hidden;background:transparent;margin-top:0">
            <div id="progressBar" style="height:3px;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .35s,opacity .35s;opacity:0"></div>
        </div>

        <div class="top-bar" id="topBar">
            <div class="container">
                <h1>🏷️ Tags</h1>
                <span class="top-bar-stat" id="statsBar"></span>
            </div>
        </div>

        <div id="toasts" class="toasts" aria-live="polite"></div>

        <div class="views" id="views">
            <div class="view active" id="view-games">
                <div class="container">
                    <div class="controls-grid">
                        <input type="text" id="gameFilter" class="input" placeholder="Search..." oninput="filterGames()">
                        <select id="tagFilter" class="input" onchange="filterGames()">
                            <option value="">All Tags</option>
                        </select>
                        <select id="sortSelect" class="input" onchange="filterGames()">
                            <option value="name">Sort: Name</option>
                            <option value="rating">Sort: BGG Rating</option>
                            <option value="myRating">Sort: My Rating</option>
                            <option value="rank">Sort: Rank</option>
                            <option value="year">Sort: Year Published</option>
                            <option value="plays">Sort: Plays</option>
                        </select>
                        <div style="display:flex;align-items:center;gap:8px;">
                            <button id="bulkAssignBtn" class="btn btn-sm btn-outline" onclick="openBulkAssignModal()">Bulk Assign</button>
                            <span id="selectedCount" class="text-sm text-muted">0 selected</span>
                        </div>
                    </div>
                    <div class="flex" style="justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        <span class="text-sm text-muted" id="gamesCount">0 games</span>
                    </div>
                    <div id="gamesList"></div>
                    <div id="gamesLoading"><div class="skeleton" style="margin-bottom:12px"></div><div class="skeleton" style="margin-bottom:12px"></div><div class="skeleton"></div></div>
                </div>
            </div>

            <div class="view" id="view-manage">
                <div class="container">
                    <div style="display: grid; grid-template-columns: 1fr; gap: 16px;">
                        <div class="card">
                            <div class="card-title">➕ Add to Game</div>
                            <input type="text" id="newGameSearch" class="input mb-12" placeholder="Find a game..." oninput="filterQuickAddGames()">
                            <div id="quickAddList" style="max-height:250px;overflow-y:auto"></div>
                        </div>
                        <div class="card">
                            <div class="card-title">🏷️ All Tags</div>
                            <div id="allTagsContainer" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
                            <p class="text-xs text-muted" style="text-align:center;margin-top:12px">Click to delete from all games</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="view" id="view-untagged">
                <div class="container">
                    <span class="text-sm text-muted" id="untaggedCount">0 untagged</span>
                    <div id="untaggedList" style="margin-top:12px; display: grid; grid-template-columns: 1fr; gap: 12px;"></div>
                </div>
            </div>

            <div class="view" id="view-stats">
                <div class="container">
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
                        <div class="card">
                            <div class="card-title">📊 Quick Stats</div>
                            <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">
                                <div style="background:var(--surface);padding:12px;border-radius:10px;text-align:center">
                                    <div style="font-size:22px;font-weight:800" id="stat1">0</div>
                                    <div class="text-xs text-muted" style="margin-top:2px">Total Games</div>
                                </div>
                                <div style="background:var(--surface);padding:12px;border-radius:10px;text-align:center">
                                    <div style="font-size:22px;font-weight:800" id="stat2">0</div>
                                    <div class="text-xs text-muted" style="margin-top:2px">Tagged</div>
                                </div>
                                <div style="background:var(--surface);padding:12px;border-radius:10px;text-align:center">
                                    <div style="font-size:22px;font-weight:800" id="stat3">0</div>
                                    <div class="text-xs text-muted" style="margin-top:2px">Total Tags</div>
                                </div>
                                <div style="background:var(--surface);padding:12px;border-radius:10px;text-align:center">
                                    <div style="font-size:22px;font-weight:800" id="stat4">0%</div>
                                    <div class="text-xs text-muted" style="margin-top:2px">Coverage</div>
                                </div>
                            </div>
                        </div>
                        <div class="card">
                            <div class="card-title">☁️ Top Tags</div>
                            <div id="tagsCloudContainer" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <nav class="tab-bar" id="tabBar" style="display:none">
        <button class="tab-btn active" data-view="games" onclick="switchTab(this)">Games</button>
        <button class="tab-btn" data-view="manage" onclick="switchTab(this)">Manage</button>
        <button class="tab-btn" data-view="untagged" onclick="switchTab(this)">Untagged</button>
        <button class="tab-btn" data-view="stats" onclick="switchTab(this)">Stats</button>
    </nav>

    <div class="modal" id="gameModal" onclick="if(event.target===this)closeModal()">
        <div class="modal-sheet">
            <div id="modalContent"></div>
        </div>
    </div>

<script>
let dbClient = null;
let owner = '';
let allGames = [];
let allTags = [];
let gameTagsMap = new Map();
let selectedGames = new Set();

function handleResize() {
    const isDesktop = window.innerWidth >= 768;
    document.getElementById('desktopSidebar').style.display = isDesktop ? 'block' : 'none';
    document.getElementById('mainContent').style.display = 'block'; // Always visible
    document.getElementById('tabBar').style.display = isDesktop ? 'none' : 'flex';
    document.getElementById('topBar').style.display = isDesktop ? 'none' : 'flex';

    // On mobile, ensure a view is active, default to 'games'
    if (!isDesktop) {
        if (!document.querySelector('.view.active')) {
            document.getElementById('view-games').classList.add('active');
            const gamesTab = document.querySelector('.tab-btn[data-view="games"]');
            if (gamesTab) gamesTab.classList.add('active');
        }
    }
}

async function unlockApp() {
    const password = document.getElementById('appPassword').value;
    const username = document.getElementById('bggUsername').value.trim() || 'sportomax';
    const errEl = document.getElementById('passwordError');
    
    try {
        const cfgResp = await fetch('/api/supabase-config');
        if (!cfgResp.ok) throw new Error('Config failed');
        const cfg = await cfgResp.json();
        dbClient = window.supabase.createClient(cfg.url, cfg.anonKey);
        
        const collResp = await fetch('/api/bgg-helper?endpoint=collection&username=' + encodeURIComponent(username) + '&stats=1&own=1');
        if (!collResp.ok) throw new Error('BGG username not found');
        
        owner = username;
        
        document.getElementById('passwordScreen').classList.add('hidden');
        
        // Setup desktop nav
        const desktopNav = document.getElementById('desktopNav');
        const mobileNav = document.getElementById('tabBar');
        desktopNav.innerHTML = mobileNav.innerHTML;
        
        handleResize();
        window.addEventListener('resize', handleResize);
        
        showProgress();
        toast('Loading ' + username + '...', 'info');

        await loadCollection(username);
        await loadTags();
        hideProgress();

        toast('Ready! ✓', 'success');
        
    } catch (e) {
        console.error(e);
        errEl.textContent = e.message;
        errEl.style.display = 'block';
    }
}

async function loadCollection(username) {
    document.getElementById('gamesLoading').style.display = 'grid';
    try {
        const resp = await fetch('/api/bgg-helper?endpoint=collection&username=' + encodeURIComponent(username) + '&stats=1&own=1');
        if (!resp.ok) throw new Error('BGG API failed');
        
            const xml = new DOMParser().parseFromString(await resp.text(), 'text/xml');
            const items = xml.querySelectorAll('item');

            allGames = [];
            items.forEach(item => {
                const bggId = parseInt(item.getAttribute('objectid'));
                const name = (item.querySelector('name') || {}).textContent || 'Unknown';
                const thumb = (item.querySelector('thumbnail') || {}).textContent || '';
                const thumbUrl = thumb ? (thumb.startsWith('//') ? 'https:' + thumb : thumb) : null;
                const year = (item.querySelector('yearpublished') || {}).textContent || '';
                const playingtime = (item.querySelector('playingtime') || {}).textContent || '';

                // Stats (when stats=1)
                const statsEl = item.querySelector('stats');
                const avgNode = statsEl ? (statsEl.querySelector('average') || {}) : null;
                const average = avgNode ? parseFloat((avgNode.getAttribute && avgNode.getAttribute('value')) || avgNode.textContent) || 0 : 0;
                const averageweight = statsEl ? parseFloat((statsEl.querySelector('averageweight') || {}).textContent || 0) || 0 : 0;
                // rank may be nested under ranks -> rank
                let rank = '';
                if (statsEl) {
                    const rankEl = statsEl.querySelector('rank');
                    if (rankEl) rank = rankEl.getAttribute('value') || rankEl.textContent || '';
                }

                // User rating from collection status (when own=1)
                const userRating = parseFloat(item.querySelector('status')?.getAttribute('rating') || '0') || 0;

                // Number of plays (collection may include <numplays>)
                let numplays = 0;
                const npEl = item.querySelector('numplays');
                if (npEl) numplays = parseInt(npEl.textContent || npEl.getAttribute('value') || '0') || 0;

                allGames.push({ bgg_id: bggId, game_name: name, thumbnail_url: thumbUrl, year, playingtime, average, averageweight, rank, myRating: userRating, numplays });
            });
        
        document.getElementById('gamesLoading').style.display = 'none';
        renderGames();
        updateStats();
    } catch (e) {
        document.getElementById('gamesLoading').style.display = 'none';
        toast('Error loading collection: ' + e.message, 'error');
    }
}

async function loadTags() {
    try {
        const { data, error } = await dbClient.from('game_tags').select('*').eq('owner', owner);
        if (error) throw error;
        
        allTags = data || [];
        gameTagsMap.clear();
        allTags.forEach(t => {
            if (!gameTagsMap.has(t.bgg_id)) gameTagsMap.set(t.bgg_id, []);
            gameTagsMap.get(t.bgg_id).push(t.tag_name);
        });
        
        renderGames();
        updateAllTags();
        updateTagFilter();
        updateStats();
    } catch (e) {
        console.error('Load tags error:', e);
        toast('Error loading tags', 'error');
    }
}

function renderGames() {
    const filter = document.getElementById('gameFilter').value.toLowerCase();
    const tagFilter = document.getElementById('tagFilter').value;
    
    let filtered = allGames.filter(g => {
        const nameMatch = g.game_name.toLowerCase().includes(filter);
        const tagMatch = !tagFilter || (gameTagsMap.has(g.bgg_id) && gameTagsMap.get(g.bgg_id).includes(tagFilter));
        return nameMatch && tagMatch;
    });

    // Sorting
    const sortBy = (document.getElementById('sortSelect') && document.getElementById('sortSelect').value) || 'name';
    filtered.sort((a,b) => {
        if (sortBy === 'name') return a.game_name.localeCompare(b.game_name);
        if (sortBy === 'rating') return (b.average||0) - (a.average||0);
        if (sortBy === 'myRating') return (b.myRating||0) - (a.myRating||0);
        if (sortBy === 'plays') return (b.numplays||0) - (a.numplays||0);
        if (sortBy === 'rank') {
            const ra = a.rank ? parseInt(a.rank) : 999999;
            const rb = b.rank ? parseInt(b.rank) : 999999;
            return ra - rb; // lower rank number is better
        }
        if (sortBy === 'year') return (b.year||0) - (a.year||0);
        return 0;
    });
    
    document.getElementById('gamesCount').textContent = filtered.length + ' game' + (filtered.length!==1?'s':'');
    
    if (!filtered.length) {
        document.getElementById('gamesList').innerHTML = '<div class="empty-state"><div class="empty-state-icon">🎲</div><p>No games found</p></div>';
        return;
    }
    
    const html = filtered.map(g => {
        const tags = gameTagsMap.get(g.bgg_id) || [];
        const tagsHtml = tags.map(t => '<span class="badge">' + esc(t) + '</span>').join('');
        const metaPieces = [];
        if (g.myRating && Number(g.myRating) > 0) metaPieces.push('⭐ ' + Number(g.myRating).toFixed(1));
        if (g.numplays && Number(g.numplays) > 0) metaPieces.push(esc(g.numplays) + ' plays');
        if (g.playingtime) metaPieces.push(esc(g.playingtime) + ' min');
        if (g.average && Number(g.average) > 0) metaPieces.push(Number(g.average).toFixed(1) + ' avg');
        if (g.averageweight) metaPieces.push('wt ' + esc(g.averageweight));
        if (g.rank) metaPieces.push('rank #' + esc(g.rank));
        const metaHtml = '<div class="game-meta"><span>#' + g.bgg_id + '</span>' + (metaPieces.length ? ' • ' + metaPieces.join(' • ') : '') + '</div>';

        // build BGG url
        const bggUrl = 'https://boardgamegeek.com/boardgame/' + g.bgg_id;
        return `<div class="game-row" onclick="openModal(${g.bgg_id})">
            <div style="width:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-right:8px">
                <input type="checkbox" class="game-select-checkbox" onchange="toggleSelectGame(${g.bgg_id}, event)" onclick="event.stopPropagation()" ${selectedGames.has(g.bgg_id)?'checked':''}>
            </div>
            ${g.thumbnail_url ? `<a href="${bggUrl}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" title="Open on BGG"><img class="game-thumb" src="${g.thumbnail_url}" alt="" loading="lazy" onerror="this.outerHTML='<div class=game-thumb-empty>🎲</div>'"></a>` : '<div class="game-thumb-empty">🎲</div>'}
            <div class="game-info">
                <div style="display:flex;align-items:center;gap:8px">
                    <div class="game-name">${esc(g.game_name)}</div>
                    ${g.year ? `<div class="text-xs text-muted">(${esc(g.year)})</div>` : ''}
                </div>
                ${metaHtml}
                <div class="game-tags">${tagsHtml}</div>
            </div>
            <span class="badge ${tags.length ? 'badge-green' : 'badge-muted'}">${tags.length}</span>
        </div>`;
    }).join('');
    
    document.getElementById('gamesList').innerHTML = html;
}

async function bulkAssignSelected() {
    const checkboxes = Array.from(document.querySelectorAll('.bulk-tag-checkbox:checked'));
    if (!checkboxes.length) { toast('Select tags to assign', 'error'); return; }
    const tagsToAdd = checkboxes.map(cb => cb.value);
    const ids = Array.from(selectedGames);
    // Compute inserts for DB, avoiding duplicates
    const inserts = [];
    ids.forEach(id => {
        const existing = new Set((gameTagsMap.get(id) || []));
        tagsToAdd.forEach(t => { if (!existing.has(t)) inserts.push({ owner: owner, bgg_id: id, tag_name: t }); });
    });
    if (!inserts.length) { toast('No new tags to add', 'info'); return; }

    try {
        await dbClient.from('game_tags').insert(inserts);
        // update local maps
        inserts.forEach(i => {
            if (!gameTagsMap.has(i.bgg_id)) gameTagsMap.set(i.bgg_id, []);
            gameTagsMap.get(i.bgg_id).push(i.tag_name);
            allTags.push({ owner: owner, bgg_id: i.bgg_id, tag_name: i.tag_name });
        });
        renderGames();
        toast('Assigned tags to ' + ids.length + ' games', 'success');
        selectedGames.clear();
        updateSelectedCount();
        closeModal();
    } catch (e) {
        console.error('Bulk assign error', e);
        toast('Bulk assign failed: ' + (e.message || e), 'error');
    }
}

async function addTag(bggId) {
    const input = document.getElementById('newTagInput');
    const tag = input.value.trim();
    if (!tag) { toast('Enter a tag', 'error'); return; }
    
    try {
        await dbClient.from('game_tags').insert([{ owner: owner, bgg_id: bggId, tag_name: tag }]);
        
        input.value = '';
        if (!gameTagsMap.has(bggId)) gameTagsMap.set(bggId, []);
        gameTagsMap.get(bggId).push(tag);
        allTags.push({ owner: owner, bgg_id: bggId, tag_name: tag });
        
        openModal(bggId);
        renderGames();
        updateAllTags();
        updateTagFilter();
        updateStats();
        toast('Tag added!', 'success');
    } catch (e) {
        console.error(e);
        if (e.message.includes('unique')) toast('Tag already exists', 'error');
        else toast('Error: ' + e.message, 'error');
    }
}

async function removeTag(bggId, tagName) {
    try {
        await dbClient.from('game_tags').delete().eq('owner', owner).eq('bgg_id', bggId).eq('tag_name', tagName);
        
        const tags = gameTagsMap.get(bggId);
        if (tags) tags.splice(tags.indexOf(tagName), 1);
        allTags = allTags.filter(t => !(t.bgg_id === bggId && t.tag_name === tagName));
        
        openModal(bggId);
        renderGames();
        updateAllTags();
        updateTagFilter();
        updateStats();
        toast('Removed', 'success');

async function deleteTagGlobally(tagName) {
    if (!confirm('Delete "' + tagName + '" from all games?')) return;
    
    try {
        await dbClient.from('game_tags').delete().eq('owner', owner).eq('tag_name', tagName);
        
        gameTagsMap.forEach((tags, bggId) => {
            const idx = tags.indexOf(tagName);
            if (idx !== -1) tags.splice(idx, 1);

        allTags = allTags.filter(t => t.tag_name !== tagName);
        
        renderGames();
        updateAllTags();
        updateTagFilter();
        updateStats();
        toast('Deleted from all games', 'success');
    } catch (e) {
        toast('Error: ' + e.message, 'error');

}

async function renameTag(oldName) {
    const newName = prompt('Rename tag', oldName);
    if (!newName || newName.trim() === '' || newName === oldName) return;
    const sanitizedNew = newName.trim();
    try {
        // fetch all rows with oldName for this owner
        const { data: rows, error: selErr } = await dbClient.from('game_tags').select('id,bgg_id').eq('owner', owner).eq('tag_name', oldName);
        if (selErr) throw selErr;

        for (const row of rows) {
            // check if a row with newName exists for same game
            const { data: exists, error: exErr } = await dbClient.from('game_tags').select('id').eq('owner', owner).eq('bgg_id', row.bgg_id).eq('tag_name', sanitizedNew).limit(1);
            if (exErr) throw exErr;
            if (exists && exists.length) {
                // delete the old row (duplicate would occur)
                await dbClient.from('game_tags').delete().eq('id', row.id);
            } else {
                // rename old row
                await dbClient.from('game_tags').update({ tag_name: sanitizedNew }).eq('id', row.id);
            }
        }

        // refresh client state
        await loadTags();
        toast('Tag renamed', 'success');
    } catch (e) {
        console.error('Rename tag error', e);
        toast('Error renaming tag: ' + (e.message || e), 'error');
    }
}

function updateStats() {
    const tagged = allGames.filter(g => gameTagsMap.has(g.bgg_id) && gameTagsMap.get(g.bgg_id).length > 0).length;
    const coverage = allGames.length ? Math.round(tagged / allGames.length * 100) : 0;
    const uniqueTags = new Set(allTags.map(t => t.tag_name)).size;
    
    document.getElementById('stat1').textContent = allGames.length;
    document.getElementById('stat2').textContent = tagged;
    document.getElementById('stat3').textContent = allTags.length;
    document.getElementById('stat4').textContent = coverage + '%';
    document.getElementById('statsBar').textContent = coverage + '% coverage';
    
    const counts = {};
    allTags.forEach(t => { counts[t.tag_name] = (counts[t.tag_name] || 0) + 1; });
    const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]).slice(0, 12);
    const max = sorted[0]?.[1] || 1;
    
    const cloud = sorted.map(([tag, count]) => {
        const size = 90 + (count / max) * 80;
        return `<span class="tag-pill" style="font-size:${size}%;opacity:${0.6 + count/max*0.4}">${esc(tag)}</span>`;
    }).join('');
    
    document.getElementById('tagsCloudContainer').innerHTML = cloud || '<span class="text-muted">No tags</span>';
}

function toast(msg, type = 'info', timeout = 3500) {
    // create a compact toast item and append to container
    try {
        const container = document.getElementById('toasts');
        if (!container) return;
        const item = document.createElement('div');
        item.className = 'toast-item ' + (type || 'info');
        item.textContent = msg;
        container.appendChild(item);
        // force reflow for animation
        requestAnimationFrame(() => item.classList.add('show'));
        // auto remove
        const t = setTimeout(() => {
            item.classList.remove('show');
            setTimeout(() => { try { container.removeChild(item); } catch (e){} }, 300);
        }, timeout || 3500);
        item._t = t;
    } catch (e) {
        console.error('Toast error', e);
    }
}

    } catch (e) {
        console.error('Assign tags error', e);
        toast('Error assigning tags: ' + (e.message || e), 'error');
    }
}

function showProgress() {
    const bar = document.getElementById('progressBar');
    bar.style.opacity = '1';
    bar.style.width = '24%';
    // animate forward
    setTimeout(() => { if (bar) bar.style.width = '64%'; }, 250);
}

function hideProgress() {
    const bar = document.getElementById('progressBar');
    if (!bar) return;
    bar.style.width = '100%';
    setTimeout(() => { bar.style.opacity = '0'; bar.style.width = '0'; }, 300);
}

function esc(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}
</script>
</body>
