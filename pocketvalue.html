<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Pocket Value | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>💎</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        :root {
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-dark {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .game-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .game-card:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .input-dark {
            @apply bg-slate-900/50 border border-white/10 rounded-2xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500/50 transition-all font-medium placeholder-slate-500;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.4s ease-out forwards; }

        .progress-bar {
            height: 4px;
            @apply bg-emerald-500/20 rounded-full overflow-hidden w-full;
        }
        .progress-fill {
            height: 100%;
            @apply bg-emerald-500 transition-all duration-1000;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        .tier-excellent { @apply text-emerald-400 border-emerald-500/30 bg-emerald-500/10; }
        .tier-great { @apply text-blue-400 border-blue-500/30 bg-blue-500/10; }
        .tier-good { @apply text-indigo-400 border-indigo-500/30 bg-indigo-500/10; }
        .tier-fair { @apply text-amber-400 border-amber-500/30 bg-amber-500/10; }
        .tier-poor { @apply text-rose-400 border-rose-500/30 bg-rose-500/10; }

        .status-pill {
            @apply flex flex-col items-center glass px-6 py-2 rounded-2xl border border-white/5;
        }
    </style>
</head>
<body class="min-h-screen selection:bg-emerald-500/30">
    <!-- Background Decor -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-emerald-900/20 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[10%] right-[0%] w-[50%] h-[50%] bg-blue-900/10 blur-[120px] rounded-full"></div>
    </div>

    <div class="relative z-10 flex flex-col min-h-screen pt-safe">
        <!-- Header -->
        <header class="p-6 flex flex-col md:flex-row md:items-center justify-between gap-6 border-b border-white/5 bg-slate-900/50 backdrop-blur-md shrink-0">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-emerald-500/20 rounded-2xl flex items-center justify-center border border-emerald-500/30 shadow-lg shadow-emerald-500/20">
                    <i data-lucide="gem" class="text-emerald-400 w-6 h-6"></i>
                </div>
                <div class="flex flex-col">
                    <h1 class="text-2xl font-black italic uppercase tracking-tighter leading-none text-white">Pocket <span class="text-emerald-400">Value</span></h1>
                    <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-1 italic">Quality to Physical Size Analysis</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="location.reload()" class="glass px-6 py-2 rounded-2xl border border-white/10 text-[10px] font-black uppercase tracking-widest hover:bg-white/10 transition-all">Reset</button>
                <a href="index.html" class="glass px-6 py-2 rounded-2xl border border-white/10 hover:bg-white/10 transition-all text-[10px] font-black uppercase tracking-widest flex items-center gap-2">Back</a>
            </div>
        </header>

        <main class="flex-1 flex flex-col min-h-0">
            <!-- Setup Phase -->
            <div id="setupSection" class="p-6 md:p-8 space-y-8 animate-in">
                <div class="glass rounded-[2.5rem] p-8 border-t border-white/20 shadow-2xl">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 items-end">
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">BGG Username</label>
                            <input type="text" id="username" value="sportomax" class="input-dark w-full">
                        </div>

                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Algorithm Preset</label>
                            <select id="formulaPreset" onchange="selectPreset(this.value)" class="input-dark w-full">
                                <option value="linear">📊 Linear Balance</option>
                                <option value="sqrt">√ Efficiency Focus</option>
                                <option value="weighted">⭐ Quality Multiplier</option>
                            </select>
                        </div>

                        <div class="grid grid-cols-2 gap-3 lg:col-span-1">
                            <div class="space-y-2">
                                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Rating ×</label>
                                <input type="number" id="ratingCoeff" value="1.0" min="0.1" step="0.1" class="input-dark w-full" onchange="applyFormula()">
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Size ÷</label>
                                <input type="number" id="sizeCoeff" value="1.0" min="0.1" step="0.1" class="input-dark w-full" onchange="applyFormula()">
                            </div>
                        </div>

                        <button onclick="fetchAndAnalyze()" id="fetchBtn" class="btn-primary text-white py-4 rounded-2xl font-black text-sm uppercase tracking-widest transition-all hover:scale-[1.02] active:scale-95 shadow-xl">
                            Analyze Collection
                        </button>
                    </div>
                </div>

                <!-- Status Pill -->
                <div id="status" class="hidden glass px-6 py-3 rounded-2xl border border-emerald-500/20 text-center animate-in">
                    <span id="statusText" class="text-[10px] font-black uppercase tracking-widest text-emerald-400 italic">Scanning...</span>
                </div>
            </div>

            <!-- Content Area -->
            <div id="resultsSection" class="hidden flex-1 flex flex-col min-h-0 overflow-hidden">
                <!-- Sorting & Stats Bar -->
                <div class="px-6 py-4 flex flex-col md:flex-row items-center justify-between gap-4 border-b border-white/5 bg-black/20">
                    <div class="flex items-center gap-4">
                        <div class="flex flex-col items-center">
                            <span class="text-[8px] font-black uppercase text-slate-500 tracking-widest mb-1">Items</span>
                            <span id="gameCountMetric" class="text-xl font-black text-white leading-none">0</span>
                        </div>
                        <div class="h-8 w-px bg-white/10 mx-2"></div>
                        <div class="space-y-1">
                            <label class="text-[8px] font-black text-slate-500 uppercase tracking-widest ml-1">Sort results</label>
                            <select id="sortBy" onchange="handleSortChange()" class="bg-white/5 border border-white/10 rounded-xl px-4 py-1 text-[10px] font-black uppercase text-emerald-400 focus:outline-none">
                                <option value="percentile-desc">Percentile (Best) ↓</option>
                                <option value="percentile-asc">Percentile (Worst) ↑</option>
                                <option value="cubic-asc">Smallest First</option>
                                <option value="cubic-desc">Largest First</option>
                                <option value="rating-desc">Rating High ↓</option>
                                <option value="name-asc">Name A-Z</option>
                            </select>
                        </div>
                    </div>
                    <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">
                        Values in <span class="text-emerald-400">Cubic Inches</span>
                    </div>
                </div>

                <!-- Scrollable Grid -->
                <div class="flex-1 overflow-y-auto custom-scrollbar p-6">
                    <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 pb-20"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        const statusEl = document.getElementById('status');
        const statusText = document.getElementById('statusText');
        const fetchBtn = document.getElementById('fetchBtn');
        const resultsGrid = document.getElementById('resultsGrid');
        const resultsSection = document.getElementById('resultsSection');
        const gameCountMetric = document.getElementById('gameCountMetric');
        const sortBySelect = document.getElementById('sortBy');

        let formulaSettings = {
            ratingCoeff: 1.0,
            sizeCoeff: 1.0,
            preset: 'linear'
        };
        const IMAGE_PROXY = '/api/image-proxy?url=';

        function updateStatus(msg, type = 'info') {
            statusText.textContent = msg;
            statusEl.classList.remove('hidden');
            if (type === 'error') statusText.className = 'text-[10px] font-black uppercase tracking-widest text-rose-400 italic';
            else statusText.className = 'text-[10px] font-black uppercase tracking-widest text-emerald-400 italic';
        }

        function selectPreset(preset) {
            formulaSettings.preset = preset;
            if (preset === 'linear') { formulaSettings.ratingCoeff = 1.0; formulaSettings.sizeCoeff = 1.0; }
            else if (preset === 'sqrt') { formulaSettings.ratingCoeff = 1.0; formulaSettings.sizeCoeff = 0.5; }
            else if (preset === 'weighted') { formulaSettings.ratingCoeff = 1.5; formulaSettings.sizeCoeff = 1.0; }
            document.getElementById('ratingCoeff').value = formulaSettings.ratingCoeff;
            document.getElementById('sizeCoeff').value = formulaSettings.sizeCoeff;
            applyFormula();
        }

        function applyFormula() {
            formulaSettings.ratingCoeff = parseFloat(document.getElementById('ratingCoeff').value) || 1.0;
            formulaSettings.sizeCoeff = parseFloat(document.getElementById('sizeCoeff').value) || 1.0;
            localStorage.setItem('pocketValueFormulaSettings', JSON.stringify(formulaSettings));
            if (window.lastAnalyzedGames) renderResults(applySort(window.lastAnalyzedGames));
        }

        async function fetchWithRetry(url, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url);
                    if (response.status === 202) { await new Promise(r => setTimeout(r, 2000 * (i + 1))); continue; }
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return await response.text();
                } catch (e) {
                    if (i === maxRetries - 1) throw e;
                    await new Promise(r => setTimeout(r, 1000 * (i + 1)));
                }
            }
        }

        async function fetchAndAnalyze() {
            const user = document.getElementById('username').value.trim() || 'sportomax';
            fetchBtn.disabled = true;
            updateStatus('Fetching collection...', 'loading');

            try {
                const collectionXml = await fetchWithRetry(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(user)}&own=1&stats=1`);
                const doc = new DOMParser().parseFromString(collectionXml, 'text/xml');
                if (doc.querySelector('error')) throw new Error('User not found or private collection');

                const items = Array.from(doc.querySelectorAll('item'));
                if (items.length === 0) throw new Error('No games found');

                updateStatus(`Found ${items.length} games. Analyzing dimensions...`);

                const games = items.map(item => {
                    const stats = item.querySelector('stats');
                    return {
                        id: item.getAttribute('objectid'),
                        name: item.querySelector('name').textContent,
                        thumbnail: item.querySelector('thumbnail')?.textContent || '',
                        average: parseFloat(stats?.querySelector('rating > average')?.getAttribute('value') || '0')
                    };
                });

                const measurementsMap = {};
                const batchSize = 20;
                const parallelLimit = 100;
                const batches = [];
                for (let i = 0; i < games.length; i += batchSize) batches.push(games.slice(i, i + batchSize));

                for (let i = 0; i < batches.length; i += parallelLimit) {
                    const group = batches.slice(i, i + parallelLimit);
                    updateStatus(`Crunching Data: ${Math.round((i / batches.length) * 100)}%`);

                    await Promise.all(group.map(async (batch) => {
                        const ids = batch.map(g => g.id).join(',');
                        const thingXml = await fetchWithRetry(`/api/bgg-helper?endpoint=thing&id=${ids}&type=boardgame&versions=1`);
                        const tDoc = new DOMParser().parseFromString(thingXml, 'text/xml');

                        tDoc.querySelectorAll('item[type="boardgameversion"]').forEach(version => {
                            const gameId = version.querySelector('link[type="boardgameversion"][inbound="true"]')?.getAttribute('id');
                            const w = parseFloat(version.querySelector('width')?.getAttribute('value') || '0');
                            const l = parseFloat(version.querySelector('length')?.getAttribute('value') || '0');
                            const d = parseFloat(version.querySelector('depth')?.getAttribute('value') || '0');

                            if (gameId && w > 0 && l > 0 && d > 0) {
                                const cubic = w * l * d;
                                if (!measurementsMap[gameId] || cubic < measurementsMap[gameId].cubic) {
                                    measurementsMap[gameId] = { w, l, d, cubic };
                                }
                            }
                        });
                    }));
                    await new Promise(r => setTimeout(r, 200));
                }

                const analyzed = games.filter(g => measurementsMap[g.id]).map(g => {
                    const m = measurementsMap[g.id];
                    return { ...g, ...m, value: m.cubic };
                });

                // Calculate Percentiles
                const valuesSorted = analyzed.map(g => g.value).sort((a, b) => a - b);
                analyzed.forEach(g => {
                    const idx = valuesSorted.indexOf(g.value);
                    g.percentile = Math.round(100 - ((idx / (valuesSorted.length - 1)) * 100));
                });

                window.lastAnalyzedGames = analyzed;
                gameCountMetric.textContent = analyzed.length;
                resultsSection.classList.remove('hidden');
                renderResults(applySort(analyzed));
                updateStatus('Analysis Complete', 'success');
            } catch (error) {
                updateStatus(`Error: ${error.message}`, 'error');
            } finally {
                fetchBtn.disabled = false;
            }
        }

        function applySort(gamesArray) {
            const sorted = [...gamesArray];
            const option = sortBySelect.value;
            switch(option) {
                case 'percentile-desc': sorted.sort((a, b) => b.percentile - a.percentile); break;
                case 'percentile-asc': sorted.sort((a, b) => a.percentile - b.percentile); break;
                case 'cubic-asc': sorted.sort((a, b) => a.cubic - b.cubic); break;
                case 'cubic-desc': sorted.sort((a, b) => b.cubic - a.cubic); break;
                case 'name-asc': sorted.sort((a, b) => a.name.localeCompare(b.name)); break;
                case 'rating-desc': sorted.sort((a, b) => b.average - a.average); break;
            }
            return sorted;
        }

        function handleSortChange() { if(window.lastAnalyzedGames) renderResults(applySort(window.lastAnalyzedGames)); }

        function renderResults(games) {
            resultsGrid.innerHTML = games.map(g => {
                let tier = 'good';
                if (g.percentile >= 80) tier = 'excellent';
                else if (g.percentile >= 60) tier = 'great';
                else if (g.percentile >= 40) tier = 'good';
                else if (g.percentile >= 20) tier = 'fair';
                else tier = 'poor';

                return `
                    <div class="game-card glass rounded-3xl p-4 border border-white/5 flex flex-col animate-in">
                        <div class="flex gap-4 mb-4">
                            <div class="w-16 h-20 bg-black/40 rounded-xl overflow-hidden shrink-0 border border-white/5 p-1">
                                <img src="${IMAGE_PROXY}${encodeURIComponent(g.thumbnail)}" class="w-full h-full object-contain rounded-lg">
                            </div>
                            <div class="flex-1 min-w-0">
                                <h3 class="text-xs font-black text-white uppercase italic truncate leading-tight mb-2">${g.name}</h3>
                                <span class="px-3 py-1 rounded-lg text-[8px] font-black uppercase tracking-widest border tier-${tier}">
                                    ${tier} (${g.percentile}%)
                                </span>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-2 mb-4">
                            <div class="glass-dark p-2 rounded-xl border border-white/5 text-center">
                                <span class="text-[7px] font-black text-slate-500 uppercase block">BGG Rating</span>
                                <span class="text-xs font-bold text-white">${g.average.toFixed(1)}</span>
                            </div>
                            <div class="glass-dark p-2 rounded-xl border border-white/5 text-center">
                                <span class="text-[7px] font-black text-slate-500 uppercase block">Size (in³)</span>
                                <span class="text-xs font-bold text-emerald-400">${g.cubic.toFixed(0)}</span>
                            </div>
                        </div>

                        <div class="mt-auto pt-3 border-t border-white/5">
                            <div class="flex justify-between items-center text-[8px] font-bold text-slate-500 uppercase tracking-widest mb-2">
                                <span>H/W/L: ${g.d.toFixed(1)}/${g.w.toFixed(1)}/${g.l.toFixed(1)}</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${g.percentile}%"></div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Initialize saved state
        const savedSettings = localStorage.getItem('pocketValueFormulaSettings');
        if (savedSettings) formulaSettings = JSON.parse(savedSettings);
    </script>
    <script type="module" src="analytics-init.js"></script>
</body>
</html>
