<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Pocket Value | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>💎</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #0b1120;
            --card: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.08);
            --border-strong: rgba(255,255,255,0.14);
            --em: #10b981;
        }
        * { -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: #f1f5f9;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Ambient glow */
        .glow-tl { position:fixed; top:-15%; left:-10%; width:50vw; height:50vh; background:radial-gradient(ellipse,rgba(16,185,129,.12) 0%,transparent 70%); pointer-events:none; z-index:0; }
        .glow-br { position:fixed; bottom:-10%; right:-5%;  width:45vw; height:45vh; background:radial-gradient(ellipse,rgba(59,130,246,.07) 0%,transparent 70%); pointer-events:none; z-index:0; }

        .glass  { background:var(--card); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--border); }
        .glass2 { background:rgba(0,0,0,.3);  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.04); }

        /* Input */
        .field {
            background:rgba(255,255,255,.05);
            border:1px solid var(--border);
            border-radius:12px;
            padding:10px 14px;
            color:#f1f5f9;
            font-size:13px;
            font-weight:600;
            width:100%;
            outline:none;
            transition:border-color .2s, box-shadow .2s;
        }
        .field:focus { border-color:rgba(16,185,129,.5); box-shadow:0 0 0 3px rgba(16,185,129,.12); }
        .field::placeholder { color:#475569; }
        select.field option { background:#1e293b; color:#f1f5f9; }

        /* Button */
        .btn-go {
            background:linear-gradient(135deg,#10b981,#059669);
            box-shadow:0 4px 20px rgba(16,185,129,.35);
            border-radius:12px;
            padding:11px 22px;
            font-size:12px;
            font-weight:800;
            text-transform:uppercase;
            letter-spacing:.08em;
            color:#fff;
            cursor:pointer;
            transition:all .2s;
            white-space:nowrap;
            border:none;
        }
        .btn-go:hover  { box-shadow:0 6px 24px rgba(16,185,129,.5); transform:translateY(-1px); }
        .btn-go:active { transform:scale(.97); }
        .btn-go:disabled { opacity:.5; cursor:not-allowed; transform:none; }
        .btn-ghost {
            background:var(--card);
            border:1px solid var(--border);
            border-radius:10px;
            padding:8px 16px;
            font-size:10px;
            font-weight:800;
            text-transform:uppercase;
            letter-spacing:.08em;
            color:#94a3b8;
            cursor:pointer;
            transition:all .2s;
        }
        .btn-ghost:hover { background:rgba(255,255,255,.08); color:#f1f5f9; }

        /* Tier colours */
        .t-excellent { color:#10b981; border-color:rgba(16,185,129,.3); background:rgba(16,185,129,.1); }
        .t-great     { color:#3b82f6; border-color:rgba(59,130,246,.3); background:rgba(59,130,246,.1); }
        .t-good      { color:#8b5cf6; border-color:rgba(139,92,246,.3); background:rgba(139,92,246,.1); }
        .t-fair      { color:#f59e0b; border-color:rgba(245,158,11,.3); background:rgba(245,158,11,.1); }
        .t-poor      { color:#f43f5e; border-color:rgba(244,63,94,.3); background:rgba(244,63,94,.1); }

        .tier-bar-excellent { background:linear-gradient(90deg,#10b981,#34d399); }
        .tier-bar-great     { background:linear-gradient(90deg,#3b82f6,#60a5fa); }
        .tier-bar-good      { background:linear-gradient(90deg,#8b5cf6,#a78bfa); }
        .tier-bar-fair      { background:linear-gradient(90deg,#f59e0b,#fbbf24); }
        .tier-bar-poor      { background:linear-gradient(90deg,#f43f5e,#fb7185); }

        /* Card */
        .game-card {
            background:rgba(255,255,255,.035);
            border:1px solid var(--border);
            border-radius:18px;
            transition:transform .22s, border-color .22s, box-shadow .22s;
            overflow:hidden;
        }
        .game-card:hover { transform:translateY(-3px); border-color:rgba(255,255,255,.18); box-shadow:0 12px 40px rgba(0,0,0,.4); }

        /* Row-mode card */
        .game-row {
            background:rgba(255,255,255,.025);
            border:1px solid var(--border);
            border-radius:12px;
            transition:background .15s;
        }
        .game-row:hover { background:rgba(255,255,255,.055); }

        /* Progress bar */
        .pbar-track { height:4px; background:rgba(255,255,255,.07); border-radius:99px; overflow:hidden; }
        .pbar-fill  { height:100%; border-radius:99px; transition:width 1s cubic-bezier(.4,0,.2,1); box-shadow:0 0 8px currentColor; }

        /* Scrollbar */
        .scroll::-webkit-scrollbar { width:4px; }
        .scroll::-webkit-scrollbar-track { background:transparent; }
        .scroll::-webkit-scrollbar-thumb { background:rgba(255,255,255,.1); border-radius:99px; }

        @keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
        .fade-up { animation:fadeUp .35s ease-out forwards; }

        /* Spinner */
        @keyframes spin { to { transform:rotate(360deg); } }
        .spin-anim { animation:spin .7s linear infinite; }

        /* Setup collapse transition */
        #setupInner { transition: max-height .4s cubic-bezier(.4,0,.2,1), opacity .3s; overflow:hidden; }

        /* Tag */
        .tag { display:inline-flex; align-items:center; padding:2px 8px; border-radius:6px; font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; border-width:1px; border-style:solid; }

        /* View toggle */
        .view-btn { padding:5px 10px; border-radius:8px; font-size:10px; font-weight:700; color:#64748b; transition:all .15s; cursor:pointer; border:1px solid transparent; }
        .view-btn.active { background:rgba(255,255,255,.08); color:#f1f5f9; border-color:var(--border); }
    </style>
</head>
<body>
<div class="glow-tl"></div>
<div class="glow-br"></div>

<div class="relative z-10 flex flex-col min-h-screen">

    <!-- ── Header ─────────────────────────────────────────────────────────── -->
    <header class="sticky top-0 z-40 glass border-b border-white/5 px-4 md:px-6 py-3 flex items-center justify-between gap-4">
        <div class="flex items-center gap-3 shrink-0">
            <div class="w-8 h-8 rounded-xl bg-emerald-500/15 border border-emerald-500/25 flex items-center justify-center text-base leading-none">💎</div>
            <div>
                <h1 class="text-sm font-black uppercase tracking-tight text-white leading-none">Pocket <span class="text-emerald-400">Value</span></h1>
                <p class="text-[9px] font-semibold text-slate-500 uppercase tracking-wider mt-0.5 leading-none">Box size vs. quality</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button id="toggleSetupBtn" onclick="toggleSetup()" class="btn-ghost hidden">Settings</button>
            <a href="index.html" class="btn-ghost">← Back</a>
        </div>
    </header>

    <!-- ── Setup ──────────────────────────────────────────────────────────── -->
    <div id="setupSection" class="px-4 md:px-6 pt-4 pb-2 shrink-0">
        <div id="setupInner" style="max-height:500px; opacity:1;">
            <div class="glass rounded-2xl p-4 md:p-5 border border-white/8">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 items-end">
                    <!-- Username -->
                    <div class="space-y-1.5">
                        <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">BGG Username</label>
                        <input type="text" id="username" value="sportomax" class="field" placeholder="sportomax">
                    </div>
                    <!-- Preset -->
                    <div class="space-y-1.5">
                        <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Algorithm</label>
                        <select id="formulaPreset" onchange="selectPreset(this.value)" class="field">
                            <option value="linear">📊 Linear Balance</option>
                            <option value="sqrt">√ Efficiency Focus</option>
                            <option value="weighted">⭐ Quality Multiplier</option>
                        </select>
                    </div>
                    <!-- Coefficients -->
                    <div class="grid grid-cols-2 gap-2">
                        <div class="space-y-1.5">
                            <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Rating ×</label>
                            <input type="number" id="ratingCoeff" value="1.0" min="0.1" step="0.1" class="field" onchange="applyFormula()">
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Size ÷</label>
                            <input type="number" id="sizeCoeff" value="1.0" min="0.1" step="0.1" class="field" onchange="applyFormula()">
                        </div>
                    </div>
                    <!-- CTA -->
                    <button onclick="fetchAndAnalyze()" id="fetchBtn" class="btn-go w-full flex items-center justify-center gap-2">
                        <svg id="analyzeIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                        <div id="analyzeSpinner" class="hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full spin-anim"></div>
                        Analyze
                    </button>
                </div>

                <!-- Status line -->
                <div id="statusLine" class="hidden mt-3 pt-3 border-t border-white/5 flex items-center gap-3">
                    <div class="w-1.5 h-1.5 rounded-full bg-emerald-400 shrink-0" id="statusDot"></div>
                    <span id="statusText" class="text-[10px] font-bold text-emerald-400 uppercase tracking-widest"></span>
                    <div class="flex-1 ml-2">
                        <div class="pbar-track">
                            <div id="progressBar" class="pbar-fill tier-bar-excellent" style="width:0%"></div>
                        </div>
                    </div>
                    <span id="progressPct" class="text-[9px] font-mono text-slate-500 shrink-0"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- ── Results ────────────────────────────────────────────────────────── -->
    <div id="resultsSection" class="hidden flex-1 flex flex-col min-h-0 fade-up">

        <!-- Stats + Controls bar -->
        <div class="px-4 md:px-6 py-3 flex flex-wrap items-center gap-3 border-b border-white/5">
            <!-- KPI chips -->
            <div class="flex items-center gap-3 flex-wrap">
                <div class="glass2 rounded-xl px-3 py-1.5 flex items-center gap-2">
                    <span class="text-[8px] font-bold text-slate-500 uppercase tracking-wider">Games</span>
                    <span id="kpiCount" class="text-sm font-black text-white">0</span>
                </div>
                <div class="glass2 rounded-xl px-3 py-1.5 flex items-center gap-2">
                    <span class="text-[8px] font-bold text-slate-500 uppercase tracking-wider">Median in³</span>
                    <span id="kpiMedian" class="text-sm font-black text-emerald-400">—</span>
                </div>
                <div class="glass2 rounded-xl px-3 py-1.5 flex items-center gap-2">
                    <span class="text-[8px] font-bold text-slate-500 uppercase tracking-wider">Best Value</span>
                    <span id="kpiBest" class="text-sm font-black text-emerald-400 truncate max-w-[120px]">—</span>
                </div>
            </div>

            <!-- Spacer -->
            <div class="flex-1"></div>

            <!-- Search -->
            <div class="relative">
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search…"
                    class="field text-[11px] pl-7 py-1.5 w-36 md:w-48" style="border-radius:10px;">
                <svg class="w-3.5 h-3.5 absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>

            <!-- Sort -->
            <select id="sortBy" onchange="handleSortChange()" class="field text-[10px] py-1.5" style="width:auto; min-width:130px; border-radius:10px;">
                <option value="percentile-desc">Best Value ↓</option>
                <option value="percentile-asc">Worst Value ↑</option>
                <option value="cubic-asc">Smallest First</option>
                <option value="cubic-desc">Largest First</option>
                <option value="rating-desc">Rating High ↓</option>
                <option value="name-asc">Name A–Z</option>
            </select>

            <!-- View toggle -->
            <div class="flex gap-1 glass2 rounded-xl p-1">
                <button id="viewGrid" onclick="setView('grid')" class="view-btn active" title="Grid view">
                    <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 16 16"><path d="M1 2.5A1.5 1.5 0 012.5 1h3A1.5 1.5 0 017 2.5v3A1.5 1.5 0 015.5 7h-3A1.5 1.5 0 011 5.5v-3zm8 0A1.5 1.5 0 0110.5 1h3A1.5 1.5 0 0115 2.5v3A1.5 1.5 0 0113.5 7h-3A1.5 1.5 0 019 5.5v-3zm-8 8A1.5 1.5 0 012.5 9h3A1.5 1.5 0 017 10.5v3A1.5 1.5 0 015.5 15h-3A1.5 1.5 0 011 13.5v-3zm8 0A1.5 1.5 0 0110.5 9h3A1.5 1.5 0 0115 10.5v3A1.5 1.5 0 0113.5 15h-3A1.5 1.5 0 019 13.5v-3z"/></svg>
                </button>
                <button id="viewList" onclick="setView('list')" class="view-btn" title="List view">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
            </div>
        </div>

        <!-- Tier summary strip -->
        <div id="tierStrip" class="px-4 md:px-6 py-2 flex items-center gap-2 flex-wrap border-b border-white/5">
            <!-- populated by JS -->
        </div>

        <!-- Grid / List -->
        <div class="flex-1 overflow-y-auto scroll px-4 md:px-6 py-4">
            <div id="resultsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 pb-6"></div>
            <div id="resultsList" class="hidden space-y-2 pb-6"></div>
            <div id="emptyState" class="hidden py-20 text-center text-slate-600 text-[11px] font-bold uppercase tracking-widest">No matches</div>
        </div>
    </div>

</div>

<script>
    const IMAGE_PROXY = '/api/image-proxy?url=';

    let formulaSettings = { ratingCoeff:1.0, sizeCoeff:1.0, preset:'linear' };
    let currentView = 'grid';
    let currentSearch = '';

    // ── Setup collapse ────────────────────────────────────────────────────────
    let setupOpen = true;
    function toggleSetup() {
        setupOpen = !setupOpen;
        const inner = document.getElementById('setupInner');
        inner.style.maxHeight = setupOpen ? '500px' : '0px';
        inner.style.opacity  = setupOpen ? '1' : '0';
        document.getElementById('toggleSetupBtn').textContent = setupOpen ? 'Hide Settings' : 'Settings';
    }

    function collapseSetup() {
        setupOpen = false;
        const inner = document.getElementById('setupInner');
        inner.style.maxHeight = '0px';
        inner.style.opacity   = '0';
        document.getElementById('toggleSetupBtn').classList.remove('hidden');
        document.getElementById('toggleSetupBtn').textContent = 'Settings';
    }

    // ── Status ────────────────────────────────────────────────────────────────
    function setStatus(msg, pct, isError = false) {
        const line = document.getElementById('statusLine');
        const txt  = document.getElementById('statusText');
        const bar  = document.getElementById('progressBar');
        const dot  = document.getElementById('statusDot');
        const pctEl = document.getElementById('progressPct');
        line.classList.remove('hidden');
        txt.textContent = msg;
        txt.className = `text-[10px] font-bold uppercase tracking-widest ${isError ? 'text-rose-400' : 'text-emerald-400'}`;
        dot.className  = `w-1.5 h-1.5 rounded-full shrink-0 ${isError ? 'bg-rose-400' : 'bg-emerald-400'}`;
        if (pct !== undefined) { bar.style.width = `${pct}%`; pctEl.textContent = `${Math.round(pct)}%`; }
    }

    function setLoading(on) {
        document.getElementById('fetchBtn').disabled = on;
        document.getElementById('analyzeIcon').classList.toggle('hidden', on);
        document.getElementById('analyzeSpinner').classList.toggle('hidden', !on);
    }

    // ── Presets ───────────────────────────────────────────────────────────────
    function selectPreset(p) {
        formulaSettings.preset = p;
        if (p === 'linear')   { formulaSettings.ratingCoeff = 1.0; formulaSettings.sizeCoeff = 1.0; }
        if (p === 'sqrt')     { formulaSettings.ratingCoeff = 1.0; formulaSettings.sizeCoeff = 0.5; }
        if (p === 'weighted') { formulaSettings.ratingCoeff = 1.5; formulaSettings.sizeCoeff = 1.0; }
        document.getElementById('ratingCoeff').value = formulaSettings.ratingCoeff;
        document.getElementById('sizeCoeff').value   = formulaSettings.sizeCoeff;
        applyFormula();
    }

    function applyFormula() {
        formulaSettings.ratingCoeff = parseFloat(document.getElementById('ratingCoeff').value) || 1.0;
        formulaSettings.sizeCoeff   = parseFloat(document.getElementById('sizeCoeff').value)   || 1.0;
        localStorage.setItem('pocketValueFormulaSettings', JSON.stringify(formulaSettings));
        if (window.lastAnalyzedGames) render();
    }

    // ── Fetch ─────────────────────────────────────────────────────────────────
    async function fetchWithRetry(url, maxRetries = 5) {
        for (let i = 0; i < maxRetries; i++) {
            try {
                const r = await fetch(url);
                if (r.status === 202) { await sleep(2000 * (i + 1)); continue; }
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                return await r.text();
            } catch (e) {
                if (i === maxRetries - 1) throw e;
                await sleep(1000 * (i + 1));
            }
        }
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    async function fetchAndAnalyze() {
        const user = document.getElementById('username').value.trim() || 'sportomax';
        setLoading(true);
        setStatus('Fetching collection…', 5);

        try {
            const collXml = await fetchWithRetry(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(user)}&own=1&stats=1`);
            const doc = new DOMParser().parseFromString(collXml, 'text/xml');
            if (doc.querySelector('error')) throw new Error('User not found or private collection');

            const items = Array.from(doc.querySelectorAll('item'));
            if (!items.length) throw new Error('No owned games found');

            setStatus(`Found ${items.length} games — analyzing dimensions…`, 12);

            const games = items.map(item => ({
                id:        item.getAttribute('objectid'),
                name:      item.querySelector('name')?.textContent || 'Unknown',
                thumbnail: item.querySelector('thumbnail')?.textContent || '',
                average:   parseFloat(item.querySelector('stats rating average')?.getAttribute('value') || '0')
            }));

            const measurementsMap = {};
            const batchSize = 20;
            const batches = [];
            for (let i = 0; i < games.length; i += batchSize) batches.push(games.slice(i, i + batchSize));

            let done = 0;
            const parallelLimit = 80;
            for (let i = 0; i < batches.length; i += parallelLimit) {
                const group = batches.slice(i, i + parallelLimit);
                await Promise.all(group.map(async batch => {
                    const ids = batch.map(g => g.id).join(',');
                    try {
                        const thingXml = await fetchWithRetry(`/api/bgg-helper?endpoint=thing&id=${ids}&type=boardgame&versions=1`);
                        const tDoc = new DOMParser().parseFromString(thingXml, 'text/xml');
                        tDoc.querySelectorAll('item[type="boardgameversion"]').forEach(v => {
                            const gameId = v.querySelector('link[type="boardgameversion"][inbound="true"]')?.getAttribute('id');
                            const w = parseFloat(v.querySelector('width')?.getAttribute('value')  || '0');
                            const l = parseFloat(v.querySelector('length')?.getAttribute('value') || '0');
                            const d = parseFloat(v.querySelector('depth')?.getAttribute('value')  || '0');
                            if (gameId && w > 0 && l > 0 && d > 0) {
                                const cubic = w * l * d;
                                if (!measurementsMap[gameId] || cubic < measurementsMap[gameId].cubic)
                                    measurementsMap[gameId] = { w, l, d, cubic };
                            }
                        });
                    } catch { /* skip */ }
                    done++;
                    const pct = 12 + Math.round((done / batches.length) * 82);
                    setStatus(`Crunching data… ${done}/${batches.length} batches`, pct);
                }));
                await sleep(150);
            }

            const analyzed = games.filter(g => measurementsMap[g.id]).map(g => ({
                ...g, ...measurementsMap[g.id], value: measurementsMap[g.id].cubic
            }));

            if (!analyzed.length) throw new Error('No dimension data found for your games');

            // Percentiles
            const sorted = analyzed.map(g => g.value).sort((a, b) => a - b);
            analyzed.forEach(g => {
                const idx = sorted.indexOf(g.value);
                g.percentile = Math.round(100 - ((idx / Math.max(sorted.length - 1, 1)) * 100));
            });

            window.lastAnalyzedGames = analyzed;
            setStatus(`Done — ${analyzed.length} games measured`, 100);
            collapseSetup();
            populateKPIs(analyzed);
            render();
            document.getElementById('resultsSection').classList.remove('hidden');

        } catch (err) {
            setStatus(`Error: ${err.message}`, undefined, true);
        } finally {
            setLoading(false);
        }
    }

    // ── KPIs ──────────────────────────────────────────────────────────────────
    function populateKPIs(games) {
        const cubics = games.map(g => g.cubic).sort((a,b) => a-b);
        const mid = cubics[Math.floor(cubics.length / 2)];
        const best = [...games].sort((a,b) => b.percentile - a.percentile)[0];
        document.getElementById('kpiCount').textContent  = games.length;
        document.getElementById('kpiMedian').textContent = mid ? mid.toFixed(0) + ' in³' : '—';
        document.getElementById('kpiBest').textContent   = best ? best.name : '—';
    }

    // ── Tier strip ────────────────────────────────────────────────────────────
    function renderTierStrip(games) {
        const tiers = ['excellent','great','good','fair','poor'];
        const labels = { excellent:'Excellent (80–100%)', great:'Great (60–79%)', good:'Good (40–59%)', fair:'Fair (20–39%)', poor:'Poor (0–19%)' };
        const counts = {};
        tiers.forEach(t => counts[t] = 0);
        games.forEach(g => { counts[getTier(g.percentile)]++; });
        document.getElementById('tierStrip').innerHTML = tiers.map(t => `
            <button onclick="filterTier('${t}')" id="tier-btn-${t}"
                class="tag t-${t} cursor-pointer hover:opacity-80 transition-opacity" title="${labels[t]}">
                ${t} <span class="ml-1 opacity-70">${counts[t]}</span>
            </button>
            `).join('') + `<button onclick="filterTier(null)" id="tier-btn-all"
                class="tag bg-white/5 border-white/10 text-slate-400 cursor-pointer hover:opacity-80 transition-opacity">
                All
            </button>`;
    }

    let activeTierFilter = null;
    function filterTier(tier) {
        activeTierFilter = tier;
        render();
    }

    // ── Sort & Search ─────────────────────────────────────────────────────────
    function handleSortChange()  { if (window.lastAnalyzedGames) render(); }
    function handleSearch()      { currentSearch = document.getElementById('searchInput').value.toLowerCase(); render(); }

    function applySort(arr) {
        const s = [...arr];
        switch (document.getElementById('sortBy').value) {
            case 'percentile-desc': s.sort((a,b) => b.percentile - a.percentile); break;
            case 'percentile-asc':  s.sort((a,b) => a.percentile - b.percentile); break;
            case 'cubic-asc':       s.sort((a,b) => a.cubic - b.cubic); break;
            case 'cubic-desc':      s.sort((a,b) => b.cubic - a.cubic); break;
            case 'rating-desc':     s.sort((a,b) => b.average - a.average); break;
            case 'name-asc':        s.sort((a,b) => a.name.localeCompare(b.name)); break;
        }
        return s;
    }

    // ── View toggle ───────────────────────────────────────────────────────────
    function setView(v) {
        currentView = v;
        document.getElementById('viewGrid').classList.toggle('active', v === 'grid');
        document.getElementById('viewList').classList.toggle('active', v === 'list');
        document.getElementById('resultsGrid').classList.toggle('hidden', v !== 'grid');
        document.getElementById('resultsList').classList.toggle('hidden', v !== 'list');
    }

    // ── Render ────────────────────────────────────────────────────────────────
    function render() {
        if (!window.lastAnalyzedGames) return;
        let games = applySort(window.lastAnalyzedGames);
        if (currentSearch) games = games.filter(g => g.name.toLowerCase().includes(currentSearch));
        if (activeTierFilter) games = games.filter(g => getTier(g.percentile) === activeTierFilter);

        renderTierStrip(window.lastAnalyzedGames);

        const empty = document.getElementById('emptyState');
        empty.classList.toggle('hidden', games.length > 0);
        document.getElementById('resultsGrid').innerHTML = games.map(buildGridCard).join('');
        document.getElementById('resultsList').innerHTML = games.map(buildListRow).join('');
    }

    function getTier(pct) {
        if (pct >= 80) return 'excellent';
        if (pct >= 60) return 'great';
        if (pct >= 40) return 'good';
        if (pct >= 20) return 'fair';
        return 'poor';
    }

    function tierLabel(pct) {
        const map = { excellent:'Excellent', great:'Great', good:'Good', fair:'Fair', poor:'Poor' };
        return map[getTier(pct)];
    }

    function buildGridCard(g) {
        const tier = getTier(g.percentile);
        const img  = g.thumbnail ? `<img src="${IMAGE_PROXY}${encodeURIComponent(g.thumbnail)}" class="w-full h-full object-contain p-1 rounded-lg" loading="lazy" onerror="this.style.display='none'">` : '';
        return `
        <div class="game-card flex flex-col fade-up">
            <!-- Top: image + name + tier -->
            <div class="p-3 flex items-start gap-3">
                <div class="w-14 h-16 shrink-0 bg-black/30 rounded-xl overflow-hidden border border-white/5 flex items-center justify-center">
                    ${img || '<span class="text-slate-700 text-lg">🎲</span>'}
                </div>
                <div class="flex-1 min-w-0 pt-0.5">
                    <h3 class="text-[11px] font-black text-white leading-tight line-clamp-2 mb-1.5">${escHtml(g.name)}</h3>
                    <span class="tag t-${tier}">${tierLabel(g.percentile)} · ${g.percentile}%</span>
                </div>
            </div>

            <!-- Stats row -->
            <div class="px-3 pb-2 grid grid-cols-3 gap-1.5 text-center">
                <div class="glass2 rounded-xl py-2 px-1">
                    <div class="text-[7px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">Rating</div>
                    <div class="text-[11px] font-black text-white">${g.average > 0 ? g.average.toFixed(1) : '—'}</div>
                </div>
                <div class="glass2 rounded-xl py-2 px-1">
                    <div class="text-[7px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">in³</div>
                    <div class="text-[11px] font-black text-emerald-400">${g.cubic.toFixed(0)}</div>
                </div>
                <div class="glass2 rounded-xl py-2 px-1">
                    <div class="text-[7px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">Rank</div>
                    <div class="text-[11px] font-black text-slate-300">${g.percentile}%</div>
                </div>
            </div>

            <!-- Dimensions + bar -->
            <div class="px-3 pb-3 mt-auto">
                <div class="flex justify-between items-center mb-1.5">
                    <span class="text-[8px] font-semibold text-slate-600 font-mono">${g.d.toFixed(1)} × ${g.w.toFixed(1)} × ${g.l.toFixed(1)} in</span>
                    <span class="text-[8px] font-bold text-slate-500">H×W×L</span>
                </div>
                <div class="pbar-track">
                    <div class="pbar-fill tier-bar-${tier}" style="width:${g.percentile}%; color:transparent;"></div>
                </div>
            </div>
        </div>`;
    }

    function buildListRow(g) {
        const tier = getTier(g.percentile);
        const img  = g.thumbnail ? `<img src="${IMAGE_PROXY}${encodeURIComponent(g.thumbnail)}" class="w-full h-full object-contain p-0.5" loading="lazy" onerror="this.style.display='none'">` : '';
        return `
        <div class="game-row px-3 py-2.5 flex items-center gap-3 fade-up">
            <div class="w-9 h-9 shrink-0 bg-black/30 rounded-lg overflow-hidden border border-white/5 flex items-center justify-center">
                ${img || '<span class="text-slate-700 text-sm">🎲</span>'}
            </div>
            <div class="flex-1 min-w-0">
                <div class="text-[12px] font-bold text-white truncate">${escHtml(g.name)}</div>
                <div class="text-[9px] font-mono text-slate-500 mt-0.5">${g.d.toFixed(1)}×${g.w.toFixed(1)}×${g.l.toFixed(1)} in  ·  ${g.cubic.toFixed(0)} in³</div>
            </div>
            <div class="hidden sm:flex items-center gap-2 shrink-0">
                <div class="w-20 pbar-track">
                    <div class="pbar-fill tier-bar-${tier}" style="width:${g.percentile}%; color:transparent;"></div>
                </div>
            </div>
            <div class="shrink-0 text-right min-w-[70px]">
                <span class="tag t-${tier}">${tierLabel(g.percentile)}</span>
                <div class="text-[9px] font-bold text-slate-500 mt-1">${g.average > 0 ? '★ '+g.average.toFixed(1) : ''}</div>
            </div>
        </div>`;
    }

    function escHtml(s) {
        return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    const saved = localStorage.getItem('pocketValueFormulaSettings');
    if (saved) {
        try {
            formulaSettings = JSON.parse(saved);
            document.getElementById('ratingCoeff').value = formulaSettings.ratingCoeff;
            document.getElementById('sizeCoeff').value   = formulaSettings.sizeCoeff;
            document.getElementById('formulaPreset').value = formulaSettings.preset || 'linear';
        } catch {}
    }

    document.getElementById('username').addEventListener('keypress', e => { if (e.key === 'Enter') fetchAndAnalyze(); });
</script>
<script type="module" src="analytics-init.js"></script>
</body>
</html>
