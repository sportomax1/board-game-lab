<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Pocket Value - Quality to Size Ratio</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>💎</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            height: 100%;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            max-width: none;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            padding-top: env(safe-area-inset-top, 0);
            padding-bottom: env(safe-area-inset-bottom, 0);
            padding-left: env(safe-area-inset-left, 0);
            padding-right: env(safe-area-inset-right, 0);
        }

        .header {
            flex-shrink: 0;
            padding: 1rem;
            border-bottom: 1px solid #eee;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .header p {
            margin: 0.25rem 0 0 0;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .setup-section {
            flex-shrink: 0;
            padding: 1rem;
            background: white;
            border-bottom: 1px solid #eee;
        }

        .input-group {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
            align-items: flex-end;
        }

        .input-field {
            flex: 1;
            min-width: 150px;
        }

        .input-field label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
            color: #666;
        }

        .input-field input {
            width: 100%;
            padding: 0.6rem;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 0.95rem;
            -webkit-appearance: none;
            appearance: none;
            transition: all 0.2s;
        }

        .input-field input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 0.6rem 1.2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            font-size: 0.95rem;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
            opacity: 0.9;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            font-size: 0.8rem;
            color: #666;
            padding: 0.6rem;
            background: #f9f9f9;
            border-radius: 6px;
            text-align: center;
            border-left: 4px solid #667eea;
            margin-top: 0.5rem;
        }

        .status.loading {
            color: #667eea;
            font-weight: 600;
        }

        .status.error {
            background: #ffebee;
            border-left-color: #f44336;
            color: #c62828;
        }

        .status.success {
            background: #e8f5e9;
            border-left-color: #4caf50;
            color: #2e7d32;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            padding: 1rem;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .game-card {
            background: white;
            border-radius: 12px;
            padding: 1rem;
            border: 1px solid #eee;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: all 0.2s;
        }

        .game-card:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            transform: translateY(-2px);
        }

        .game-card-header {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .game-thumbnail {
            width: 60px;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
            background: #f0f0f0;
            flex-shrink: 0;
        }

        .game-title {
            flex: 1;
            min-width: 0;
        }

        .game-name {
            font-weight: 700;
            font-size: 0.95rem;
            margin: 0;
            color: #333;
            line-height: 1.3;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .value-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 0.35rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-top: 0.25rem;
            white-space: nowrap;
        }

        .value-badge.excellent {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .value-badge.good {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }

        .value-badge.poor {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }

        .value-badge.low {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            font-size: 0.8rem;
            margin-bottom: 0.75rem;
        }

        .stat {
            background: #f9f9f9;
            padding: 0.5rem;
            border-radius: 4px;
        }

        .stat-label {
            color: #999;
            font-weight: 500;
            display: block;
            margin-bottom: 0.1rem;
        }

        .stat-value {
            color: #333;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .metric-bar {
            height: 6px;
            background: #eee;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .metric-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
        }

        .empty-state {
            text-align: center;
            padding: 2rem 1rem;
            color: #999;
            grid-column: 1 / -1;
        }

        .empty-state p {
            margin: 0.5rem 0;
            font-size: 1rem;
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.3rem;
            }

            .header p {
                font-size: 0.8rem;
            }

            .setup-section {
                padding: 0.75rem;
            }

            .input-group {
                flex-direction: column;
                gap: 0.5rem;
            }

            .input-field {
                min-width: unset;
            }

            .results-grid {
                grid-template-columns: 1fr;
            }

            .game-card {
                padding: 0.75rem;
            }

            .stats {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💎 Pocket Value</h1>
            <p>Find games with the best quality-to-size ratio</p>
        </div>

        <div class="setup-section">
            <div class="input-group">
                <div class="input-field" style="min-width: 200px;">
                    <label for="username">BGG Username</label>
                    <input type="text" id="username" placeholder="e.g., sportomax" value="sportomax">
                </div>
                <button class="btn" id="fetchBtn" onclick="fetchAndAnalyze()">Analyze</button>
            </div>
            <div class="status" id="status" style="display: none;"></div>
        </div>

        <div class="main-content">
            <div class="results-grid" id="resultsGrid">
                <div class="empty-state">
                    <p>👆 Enter your BGG username and click Analyze</p>
                    <p style="font-size: 0.85rem; color: #bbb;">Compares game quality (average rating) to physical size</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const fetchBtn = document.getElementById('fetchBtn');
        const resultsGrid = document.getElementById('resultsGrid');

        function showStatus(message, type = 'info') {
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
            statusEl.style.display = 'block';
        }

        function hideStatus() {
            statusEl.style.display = 'none';
        }

        async function fetchWithRetry(url, maxRetries = 3) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url);
                    if (response.ok) return await response.text();
                    if (response.status === 429 || response.status === 202 || response.status === 502) {
                        const wait = Math.min(1000 * Math.pow(2, i), 5000);
                        await new Promise(r => setTimeout(r, wait));
                        continue;
                    }
                    throw new Error(`HTTP ${response.status}`);
                } catch (e) {
                    if (i === maxRetries - 1) throw e;
                    await new Promise(r => setTimeout(r, 1000 * (i + 1)));
                }
            }
        }

        async function fetchAndAnalyze() {
            const username = document.getElementById('username').value.trim();
            if (!username) {
                showStatus('Please enter a username', 'error');
                return;
            }

            fetchBtn.disabled = true;
            showStatus('Fetching collection...', 'loading');

            try {
                // Fetch collection with stats
                const collectionUrl = `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1`;
                const collectionText = await fetchWithRetry(collectionUrl);
                const parser = new DOMParser();
                const collectionXml = parser.parseFromString(collectionText, 'text/xml');

                if (collectionXml.querySelector('error')) {
                    throw new Error('User not found or collection is private');
                }

                const items = Array.from(collectionXml.querySelectorAll('item'));
                if (items.length === 0) {
                    throw new Error('No games found in collection');
                }

                showStatus(`Found ${items.length} games. Fetching measurements...`, 'loading');

                // Extract game data with ratings
                const games = items.map(item => {
                    const stats = item.querySelector('stats');
                    const rating = stats?.querySelector('rating');
                    return {
                        id: item.getAttribute('objectid'),
                        name: item.querySelector('name').textContent,
                        thumbnail: item.querySelector('thumbnail')?.textContent || '',
                        average: parseFloat(rating?.querySelector('average')?.getAttribute('value') || '0')
                    };
                });

                // Fetch measurements in batches
                const gameIds = games.map(g => g.id);
                const measurementsMap = {};
                const batchSize = 20;

                for (let i = 0; i < gameIds.length; i += batchSize) {
                    const batch = gameIds.slice(i, i + batchSize);
                    const progress = Math.round(((i + batchSize) / gameIds.length) * 100);
                    showStatus(`Fetching measurements... ${Math.min(progress, 100)}%`, 'loading');

                    const ids = batch.join(',');
                    const thingUrl = `/api/bgg-helper?endpoint=thing&id=${ids}&type=boardgame&versions=1`;
                    const thingText = await fetchWithRetry(thingUrl);
                    const thingXml = parser.parseFromString(thingText, 'text/xml');

                    // Build game info lookup
                    const gameInfo = {};
                    Array.from(thingXml.querySelectorAll('item[type="boardgame"]')).forEach(item => {
                        const id = item.getAttribute('id');
                        gameInfo[id] = {
                            name: item.querySelector('name[type="primary"]')?.getAttribute('value') || 'Unknown'
                        };
                    });

                    // Process version items for measurements
                    Array.from(thingXml.querySelectorAll('item[type="boardgameversion"]')).forEach(version => {
                        const gameLink = version.querySelector('link[type="boardgameversion"][inbound="true"]');
                        if (!gameLink) return;

                        const gameId = gameLink.getAttribute('id');
                        const width = parseFloat(version.querySelector('width')?.getAttribute('value') || '0');
                        const length = parseFloat(version.querySelector('length')?.getAttribute('value') || '0');
                        const depth = parseFloat(version.querySelector('depth')?.getAttribute('value') || '0');

                        if (width > 0 && length > 0 && depth > 0) {
                            const cubic = width * length * depth;
                            if (!measurementsMap[gameId] || cubic < measurementsMap[gameId].cubic) {
                                measurementsMap[gameId] = { width, length, depth, cubic };
                            }
                        }
                    });
                }

                // Calculate value scores
                const analyzed = games
                    .filter(g => measurementsMap[g.id])
                    .map(g => {
                        const m = measurementsMap[g.id];
                        const value = g.average / (m.cubic / 1000); // Quality per 1000 cubic inches
                        return {
                            ...g,
                            cubic: m.cubic,
                            width: m.width,
                            length: m.length,
                            depth: m.depth,
                            value: value
                        };
                    })
                    .sort((a, b) => b.value - a.value);

                showStatus(`Found ${analyzed.length} games with measurements`, 'success');
                renderResults(analyzed);
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
                console.error(error);
            } finally {
                fetchBtn.disabled = false;
            }
        }

        function renderResults(games) {
            if (games.length === 0) {
                resultsGrid.innerHTML = '<div class="empty-state"><p>No games with measurements found</p></div>';
                return;
            }

            const maxValue = Math.max(...games.map(g => g.value));
            const minValue = Math.min(...games.map(g => g.value));

            resultsGrid.innerHTML = games.map((game, idx) => {
                const normalized = (game.value - minValue) / (maxValue - minValue) * 100;
                let valueBadge = 'good';
                let valueLabel = 'Good';
                if (normalized >= 80) {
                    valueBadge = 'excellent';
                    valueLabel = 'Excellent';
                } else if (normalized >= 60) {
                    valueBadge = 'good';
                    valueLabel = 'Good';
                } else if (normalized >= 40) {
                    valueBadge = 'poor';
                    valueLabel = 'Fair';
                } else {
                    valueBadge = 'low';
                    valueLabel = 'Low';
                }

                return `
                    <div class="game-card">
                        <div class="game-card-header">
                            <img src="${game.thumbnail}" alt="${game.name}" class="game-thumbnail" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2280%22%3E%3Crect fill=%22%23f0f0f0%22 width=%2260%22 height=%2280%22/%3E%3C/svg%3E'">
                            <div class="game-title">
                                <h3 class="game-name">${game.name}</h3>
                                <span class="value-badge ${valueBadge}">${valueLabel}</span>
                            </div>
                        </div>
                        
                        <div class="stats">
                            <div class="stat">
                                <span class="stat-label">⭐ Rating</span>
                                <span class="stat-value">${game.average.toFixed(2)}</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">📦 Size</span>
                                <span class="stat-value">${Math.round(game.cubic)} in³</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">💎 Value</span>
                                <span class="stat-value">${game.value.toFixed(2)}</span>
                            </div>
                        </div>

                        <div class="metric-bar">
                            <div class="metric-bar-fill" style="width: ${normalized}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Load saved username
        document.getElementById('username').value = localStorage.getItem('pocketValueUsername') || 'sportomax';
        document.getElementById('username').addEventListener('change', (e) => {
            localStorage.setItem('pocketValueUsername', e.target.value);
        });
    </script>
</body>
</html>
