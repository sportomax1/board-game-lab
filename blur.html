<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blur Guess Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            overflow: hidden;
            background-color: #0d0d0d;
            -webkit-tap-highlight-color: transparent;
        }

        .blur-container {
            position: relative;
            width: 100%;
            max-width: 100%;
            aspect-ratio: 16/9;
            border-radius: 1.5rem;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e, #0d0d0d);
        }

        .blur-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: blur(var(--blur-amount, 25px));
            transition: filter 0.3s ease;
        }

        .blur-hint {
            position: absolute;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fbbf24;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .correct-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #22c55e;
            color: white;
            padding: 1rem 2rem;
            border-radius: 1rem;
            font-size: 1.5rem;
            font-weight: 700;
            animation: popIn 0.5s ease;
            z-index: 50;
        }

        .wrong-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ef4444;
            color: white;
            padding: 1rem 2rem;
            border-radius: 1rem;
            font-size: 1.5rem;
            font-weight: 700;
            animation: popIn 0.5s ease;
            z-index: 50;
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.1);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .bottom-sheet {
            animation: slideUp 0.3s ease;
        }

        .progress-bar {
            height: 4px;
            background: linear-gradient(90deg, #ec4899, #f59e0b, #10b981, #3b82f6);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #10b981;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body class="bg-[#0d0d0d] text-white flex flex-col min-h-screen">

    <!-- Settings Panel -->
    <div id="settingsPanel" class="w-full p-4 bg-gray-900 border-b border-gray-700 shadow-2xl z-20 transition-all duration-300">
        <h1 class="text-3xl text-pink-400 mb-4 font-bold">🫥 Blur Guess Challenge</h1>

        <div class="space-y-4">
            <!-- BGG Username or RAWG -->
            <div>
                <label for="bggUsername" class="block text-sm font-medium text-gray-300 mb-2">BoardGameGeek Username</label>
                <input type="text" id="bggUsername" placeholder="BGG Username" value="sportomax" class="w-full p-3 bg-gray-700 text-white rounded-xl border-2 border-gray-600 focus:ring-pink-500 focus:border-pink-500">
                <div class="text-xs text-gray-400 mt-1">Leave empty to use RAWG API, or enter BGG username for collection-based guessing</div>
            </div>

            <!-- Collection Filters (shown only when BGG username is entered) -->
            <div id="collectionFilters" style="display: none;" class="bg-gray-800 p-3 rounded-xl border border-gray-600 space-y-2">
                <div class="flex items-center gap-3">
                    <input type="checkbox" id="filterOwn" checked class="w-4 h-4">
                    <label for="filterOwn" class="text-sm text-gray-300">Own Games</label>
                </div>
                <div class="flex items-center gap-3">
                    <input type="checkbox" id="filterPrevOwned" class="w-4 h-4">
                    <label for="filterPrevOwned" class="text-sm text-gray-300">Previously Owned</label>
                </div>
                <div class="flex items-center gap-3">
                    <input type="checkbox" id="filterWantToPlay" class="w-4 h-4">
                    <label for="filterWantToPlay" class="text-sm text-gray-300">Want to Play</label>
                </div>
                <div class="flex items-center gap-3">
                    <input type="checkbox" id="filterWantToBuy" class="w-4 h-4">
                    <label for="filterWantToBuy" class="text-sm text-gray-300">Want to Buy</label>
                </div>
                <div class="flex items-center gap-3">
                    <input type="checkbox" id="filterExpansions" class="w-4 h-4">
                    <label for="filterExpansions" class="text-sm text-gray-300">Include Expansions</label>
                </div>
            </div>

            <!-- Blur Amount Slider -->
            <div>
                <label for="blurSlider" class="block text-sm font-medium text-gray-300 mb-2">Blur Intensity: <span id="blurValue">25</span>px</label>
                <input type="range" id="blurSlider" min="5" max="50" value="25" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-pink-500">
            </div>

            <!-- Hint Type -->
            <div>
                <label for="hintType" class="block text-sm font-medium text-gray-300 mb-2">Hint Style</label>
                <select id="hintType" class="w-full p-3 bg-gray-700 text-white rounded-xl border-2 border-gray-600 focus:ring-pink-500 focus:border-pink-500 appearance-none">
                    <option value="none">No Hint</option>
                    <option value="letters">First 3 Letters</option>
                    <option value="length">Word Length</option>
                    <option value="both">Letters + Length</option>
                </select>
            </div>

            <!-- Game Count -->
            <div>
                <label for="gameCount" class="block text-sm font-medium text-gray-300 mb-2">Games to Play: <span id="gameCountValue">10</span></label>
                <input type="range" id="gameCount" min="1" max="50" value="10" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-pink-500">
            </div>

            <!-- Action Buttons -->
            <div class="pt-2 space-y-3">
                <button id="startButton" class="w-full py-4 text-lg font-extrabold bg-green-600 hover:bg-green-700 text-white rounded-xl shadow-lg transition-colors duration-200 active:scale-[0.98]">
                    ▶️ START CHALLENGE
                </button>
            </div>

            <div id="messageBox" class="text-center text-sm text-yellow-400 font-semibold min-h-[1.5rem]"></div>
        </div>
    </div>

    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="hidden fixed inset-0 bg-black/80 flex flex-col items-center justify-center z-50 gap-4">
        <div class="animate-spin rounded-full h-16 w-16 border-4 border-pink-500 border-t-transparent"></div>
        <p class="text-lg font-semibold">Loading games...</p>
    </div>

    <!-- Game Area -->
    <div id="gameArea" class="hidden flex-1 flex flex-col p-4 gap-4 overflow-hidden">
        <!-- Progress -->
        <div class="flex items-center justify-between text-sm">
            <span id="progressText" class="font-semibold">0 / 10</span>
            <span id="scoreText" class="text-green-400 font-bold">Score: 0 / 0</span>
        </div>
        <div class="progress-bar">
            <div id="progressFill" class="progress-fill" style="width: 0%"></div>
        </div>

        <!-- Blur Image -->
        <div class="blur-container">
            <img id="blurImage" src="" alt="Guess this game" class="blur-image">
            <div id="hintDisplay" class="blur-hint" style="display: none;"></div>
            <div id="feedbackBadge"></div>
        </div>

        <!-- Input Section -->
        <div class="flex gap-2">
            <input type="text" id="guessInput" placeholder="Type game name..." class="flex-1 p-3 bg-gray-700 text-white rounded-xl border-2 border-gray-600 focus:ring-pink-500 focus:border-pink-500" autocomplete="off">
            <button id="submitGuess" class="px-6 py-3 bg-pink-600 hover:bg-pink-700 text-white font-bold rounded-xl transition-colors">
                Submit
            </button>
        </div>

        <!-- Blur Slider (adjustable during game) -->
        <div class="bg-gray-800 rounded-lg p-3">
            <label class="text-xs text-gray-400">Blur: <span id="gameBlurValue">25</span>px</label>
            <input type="range" id="gameBlurSlider" min="5" max="50" value="25" class="w-full h-2 bg-gray-600 rounded accent-pink-500">
        </div>

        <!-- Correct Answer Display (hidden until used) -->
        <div id="answerDisplay" class="text-center text-gray-400 text-sm" style="display: none;">
            Answer: <span id="correctAnswer" class="text-pink-400 font-bold"></span>
        </div>

        <!-- Action Buttons -->
        <div class="grid grid-cols-3 gap-2">
            <button id="revealButton" class="py-2 bg-yellow-600 hover:bg-yellow-700 text-white font-semibold rounded-lg transition-colors">
                👁️ Reveal
            </button>
            <button id="manualCheckButton" class="py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition-colors" style="display: none;">
                ✓ I'm Right
            </button>
            <button id="skipButton" class="py-2 bg-gray-700 hover:bg-gray-600 text-gray-300 font-semibold rounded-lg transition-colors">
                ⏭️ Skip
            </button>
        </div>
    </div>

    <!-- Results Screen -->
    <div id="resultsScreen" class="hidden flex-1 flex flex-col items-center justify-center p-4 gap-6">
        <h2 class="text-4xl font-bold text-pink-400">Challenge Complete!</h2>
        
        <div class="bg-gray-800 rounded-2xl p-8 text-center space-y-4 w-full max-w-md">
            <div class="text-5xl font-extrabold text-green-400">
                <span id="finalScore">0</span> / <span id="finalTotal">10</span>
            </div>
            <div class="text-xl text-gray-300">
                Accuracy: <span id="accuracy" class="text-pink-400 font-bold">0%</span>
            </div>
            <div class="text-lg text-gray-300">
                Time: <span id="finalTime" class="text-blue-400 font-bold">0:00</span>
            </div>
            <div id="resultDetails" class="text-sm text-gray-400 space-y-2 mt-4"></div>
        </div>

        <button id="restartButton" class="px-8 py-4 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl text-lg transition-colors">
            🔄 Play Again
        </button>
    </div>

    <script>
        // --- State Management ---
        let gameData = [];
        let currentIndex = 0;
        let score = 0;
        let totalGames = 10;
        let isGameRunning = false;
        let useBGGCollection = false;
        let sessionStartTime = 0;
        let sessionTimeElapsed = 0;
        let sessionTimer = null;
        let gameRevealed = false;

        // --- DOM Elements ---
        const settingsPanel = document.getElementById('settingsPanel');
        const gameArea = document.getElementById('gameArea');
        const resultsScreen = document.getElementById('resultsScreen');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const blurImage = document.getElementById('blurImage');
        const guessInput = document.getElementById('guessInput');
        const submitGuess = document.getElementById('submitGuess');
        const skipButton = document.getElementById('skipButton');
        const startButton = document.getElementById('startButton');
        const bggUsernameInput = document.getElementById('bggUsername');
        const collectionFiltersDiv = document.getElementById('collectionFilters');
        const blurSlider = document.getElementById('blurSlider');
        const blurValue = document.getElementById('blurValue');
        const hintDisplay = document.getElementById('hintDisplay');
        const hintType = document.getElementById('hintType');
        const messageBox = document.getElementById('messageBox');
        const gameBlurSlider = document.getElementById('gameBlurSlider');
        const gameBlurValue = document.getElementById('gameBlurValue');
        const revealButton = document.getElementById('revealButton');
        const manualCheckButton = document.getElementById('manualCheckButton');

        const RAWG_URL = 'https://api.rawg.io/api/games?';

        // --- Utility Functions ---
        async function fetchWithRetry(url, options, maxRetries = 3, delay = 1000) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return response;
                } catch (error) {
                    if (i < maxRetries - 1) {
                        await new Promise(resolve => setTimeout(resolve, delay));
                        delay *= 2;
                    } else {
                        throw error;
                    }
                }
            }
        }

        async function fetchFromBGG(username) {
            try {
                let filters = [];
                if (document.getElementById('filterOwn').checked) filters.push('own=1');
                if (document.getElementById('filterPrevOwned').checked) filters.push('prevowned=1');
                if (document.getElementById('filterWantToPlay').checked) filters.push('wanttoplay=1');
                if (document.getElementById('filterWantToBuy').checked) filters.push('wanttobuy=1');

                const filterStr = filters.length > 0 ? '&' + filters.join('&') : '&own=1';
                const response = await fetch(`/api/bgg-helper?endpoint=collection&username=${username}${filterStr}&stats=1`);

                if (!response.ok) throw new Error('Failed to fetch collection');

                const text = await response.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, 'text/xml');

                const games = Array.from(xml.querySelectorAll('item')).map(item => {
                    const name = item.querySelector('name')?.textContent || 'Unknown';
                    const image = item.querySelector('image')?.textContent || '';
                    const type = item.getAttribute('subtype') || '';
                    const isExpansion = type.toLowerCase() === 'expansion' || name.toLowerCase().includes('expansion');

                    return {
                        id: item.getAttribute('objectid'),
                        name: name,
                        image: image,
                        isExpansion: isExpansion
                    };
                }).filter(g => {
                    if (!g.image) return false;
                    if (g.isExpansion && !document.getElementById('filterExpansions').checked) return false;
                    return true;
                });

                return Array.from(new Map(games.map(g => [g.name, g])).values());
            } catch (error) {
                console.error('BGG Fetch Error:', error);
                throw error;
            }
        }

        async function fetchGameData() {
            loadingIndicator.style.display = 'flex';

            try {
                const bggUsername = bggUsernameInput.value.trim();
                
                if (bggUsername) {
                    useBGGCollection = true;
                    const games = await fetchFromBGG(bggUsername);
                    if (games.length === 0) {
                        messageBox.textContent = '❌ No games found in BGG collection.';
                        loadingIndicator.style.display = 'none';
                        return [];
                    }
                    // Shuffle games randomly
                    gameData = games.sort(() => Math.random() - 0.5);
                    messageBox.textContent = `✅ Loaded ${games.length} games from BGG collection.`;
                } else {
                    useBGGCollection = false;
                    const apiKey = window.RAWG_KEY || 'DEMO_API_KEY_REQUIRED';
                    const bearerToken = window.BEARER_TOKEN;

                    if (apiKey === 'DEMO_API_KEY_REQUIRED' || !bearerToken) {
                        messageBox.textContent = '❌ Error: API credentials missing.';
                        loadingIndicator.style.display = 'none';
                        return [];
                    }

                    const url = `${RAWG_URL}key=${apiKey}&page_size=40&platforms=1&ordering=-rating`;
                    const response = await fetchWithRetry(url, {
                        headers: {
                            'Authorization': `Bearer ${bearerToken}`,
                            'Content-Type': 'application/json'
                        }
                    });

                    const data = await response.json();
                    const games = data.results.map(g => ({
                        id: g.id,
                        name: g.name,
                        image: g.background_image
                    })).filter(g => g.image);

                    // Shuffle games randomly
                    gameData = games.sort(() => Math.random() - 0.5);
                    messageBox.textContent = `✅ Loaded ${games.length} games.`;
                }
                return gameData;
            } catch (error) {
                messageBox.textContent = `❌ Error: ${error.message}`;
                return [];
            } finally {
                loadingIndicator.style.display = 'none';
            }
        }

        // --- Game Logic ---
        function getHint(gameName) {
            const hint = hintType.value;
            if (hint === 'none') return '';
            
            let hintText = '';
            if (hint === 'letters' || hint === 'both') {
                hintText = gameName.substring(0, 3).toUpperCase();
            }
            if (hint === 'length' || hint === 'both') {
                hintText += ` (${gameName.length} letters)`;
            }
            return hintText.trim();
        }

        function displayHint() {
            const hint = getHint(gameData[currentIndex].name);
            if (hint) {
                hintDisplay.textContent = `💡 Hint: ${hint}`;
                hintDisplay.style.display = 'block';
            } else {
                hintDisplay.style.display = 'none';
            }
        }

        function displayGame() {
            const game = gameData[currentIndex];
            blurImage.src = game.image;
            guessInput.value = '';
            guessInput.focus();
            document.getElementById('feedbackBadge').innerHTML = '';
            document.getElementById('answerDisplay').style.display = 'none';
            gameRevealed = false;
            revealButton.textContent = '👁️ Reveal';
            manualCheckButton.style.display = 'none';
            displayHint();

            // Update progress
            document.getElementById('progressText').textContent = `${currentIndex + 1} / ${totalGames}`;
            document.getElementById('scoreText').textContent = `Score: ${score} / ${currentIndex}`;
            document.getElementById('progressFill').style.width = `${(currentIndex / totalGames) * 100}%`;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${String(secs).padStart(2, '0')}`;
        }

        function updateSessionTime() {
            const elapsed = Math.floor((Date.now() - sessionStartTime) / 1000);
            sessionTimeElapsed = elapsed;
        }

        function checkGuess(isManualCheck = false) {
            const guess = guessInput.value.trim().toLowerCase();
            const correct = gameData[currentIndex].name.toLowerCase();

            const badge = document.getElementById('feedbackBadge');
            const isCorrect = guess === correct || guess === correct.split(':')[0].toLowerCase() || isManualCheck;

            if (!guess && !isManualCheck) {
                alert('Please enter a guess or click Reveal to see the answer');
                return;
            }

            if (isCorrect) {
                badge.className = 'correct-badge';
                badge.textContent = '✓ CORRECT!';
                score++;
            } else if (!isManualCheck) {
                badge.className = 'wrong-badge';
                badge.textContent = '✗ WRONG';
                document.getElementById('answerDisplay').style.display = 'block';
                document.getElementById('correctAnswer').textContent = gameData[currentIndex].name;
            }

            guessInput.disabled = true;
            submitGuess.disabled = true;
            skipButton.disabled = true;
            revealButton.disabled = true;
            manualCheckButton.disabled = true;

            setTimeout(() => {
                currentIndex++;
                if (currentIndex >= totalGames) {
                    endGame();
                } else {
                    guessInput.disabled = false;
                    submitGuess.disabled = false;
                    skipButton.disabled = false;
                    revealButton.disabled = false;
                    manualCheckButton.disabled = false;
                    displayGame();
                }
            }, 1500);
        }

        function revealGameName() {
            if (!gameRevealed) {
                gameRevealed = true;
                blurImage.style.filter = 'none';
                document.getElementById('answerDisplay').style.display = 'block';
                document.getElementById('correctAnswer').textContent = gameData[currentIndex].name;
                revealButton.textContent = '✓ Revealed';
                manualCheckButton.style.display = 'block';
                guessInput.placeholder = 'Confirm your answer above...';
            }
        }

        function skipGame() {
            currentIndex++;
            if (currentIndex >= totalGames) {
                endGame();
            } else {
                displayGame();
            }
        }

        function endGame() {
            clearInterval(sessionTimer);
            isGameRunning = false;
            gameArea.style.display = 'none';
            settingsPanel.style.display = 'none';
            resultsScreen.style.display = 'flex';

            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalTotal').textContent = totalGames;
            document.getElementById('finalTime').textContent = formatTime(sessionTimeElapsed);
            const accuracy = Math.round((score / totalGames) * 100);
            document.getElementById('accuracy').textContent = accuracy + '%';
        }

        function startGame() {
            currentIndex = 0;
            score = 0;
            totalGames = parseInt(document.getElementById('gameCount').value);
            isGameRunning = true;
            sessionStartTime = Date.now();
            sessionTimeElapsed = 0;
            gameRevealed = false;

            settingsPanel.style.display = 'none';
            resultsScreen.style.display = 'none';
            gameArea.style.display = 'flex';

            // Start session timer
            clearInterval(sessionTimer);
            sessionTimer = setInterval(updateSessionTime, 100);

            displayGame();
        }

        // --- Event Listeners ---
        bggUsernameInput.addEventListener('input', (e) => {
            collectionFiltersDiv.style.display = e.target.value.trim() ? 'block' : 'none';
        });

        startButton.addEventListener('click', async () => {
            if (gameData.length === 0) {
                const data = await fetchGameData();
                if (data.length === 0) return;
            }
            startGame();
        });

        submitGuess.addEventListener('click', () => checkGuess(false));
        guessInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkGuess(false);
        });

        revealButton.addEventListener('click', revealGameName);
        manualCheckButton.addEventListener('click', () => checkGuess(true));

        skipButton.addEventListener('click', skipGame);

        gameBlurSlider.addEventListener('input', (e) => {
            const value = e.target.value;
            gameBlurValue.textContent = value;
            blurImage.style.filter = gameRevealed ? 'none' : `blur(${value}px)`;
        });

        document.getElementById('restartButton').addEventListener('click', () => {
            resultsScreen.style.display = 'none';
            settingsPanel.style.display = 'block';
        });

        blurSlider.addEventListener('input', (e) => {
            const value = e.target.value;
            blurValue.textContent = value;
            blurImage.style.setProperty('--blur-amount', `${value}px`);
            // Also update game blur slider
            gameBlurSlider.value = value;
            gameBlurValue.textContent = value;
            if (isGameRunning && !gameRevealed) {
                blurImage.style.filter = `blur(${value}px)`;
            }
        });

        document.getElementById('gameCount').addEventListener('input', (e) => {
            document.getElementById('gameCountValue').textContent = e.target.value;
        });

        window.addEventListener('load', () => {
            collectionFiltersDiv.style.display = 'none';
            // Sync blur sliders
            gameBlurSlider.value = blurSlider.value;
            gameBlurValue.textContent = blurSlider.value;
            blurImage.style.setProperty('--blur-amount', `${blurSlider.value}px`);
            
            fetchGameData().then(data => {
                if (data.length > 0) {
                    messageBox.textContent = '✅ Ready to play!';
                }
            });
        });
    </script>
</body>
</html>
