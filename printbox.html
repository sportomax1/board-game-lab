<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Printbox STL Generator</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:20px;background:#f3f4f6;color:#0f172a}
    .panel{background:#fff;padding:16px;border-radius:12px;box-shadow:0 2px 8px rgba(2,6,23,0.08);margin-bottom:12px}
    label{display:block;font-size:12px;color:#475569;margin-bottom:6px}
    input,select{width:100%;padding:8px;border-radius:8px;border:1px solid #e2e8f0;margin-bottom:8px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    button{background:#0ea5a4;color:white;padding:10px 14px;border-radius:10px;border:none;cursor:pointer}
    .muted{font-size:12px;color:#64748b}
  </style>
</head>
<body>
  <h1>Printbox — STL Generator (Standalone)</h1>
  <div class="panel">
    <label>Preset</label>
    <select id="preset">
      <option value="uno">Uno</option>
      <option value="flip7">Flip 7</option>
      <option value="poker">Standard Poker</option>
      <option value="mtg">Magic/TCG</option>
      <option value="custom">Custom</option>
    </select>
    <div class="row">
      <div>
        <label>Card Width (mm)</label>
        <input id="width" type="number" step="0.1" value="56" />
      </div>
      <div>
        <label>Card Height (mm)</label>
        <input id="height" type="number" step="0.1" value="87" />
      </div>
    </div>
    <div class="row">
      <div>
        <label>Card Count</label>
        <input id="count" type="number" value="112" />
      </div>
      <div>
        <label>Card Thickness (mm)</label>
        <input id="thickness" type="number" step="0.1" value="0.3" />
      </div>
    </div>
    <div class="row">
      <div>
        <label>Wall Thickness (mm)</label>
        <input id="wall" type="number" step="0.1" value="1.6" />
      </div>
      <div>
        <label>Lid Tolerance (mm)</label>
        <input id="tolerance" type="number" step="0.01" value="0.15" />
      </div>
    </div>
    <label>Engraving Text (optional)</label>
    <input id="engrave" type="text" placeholder="LABEL" />
    <label><input id="fingers" type="checkbox" checked /> Add finger lips to lid</label>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button id="downloadBox">Download Box STL</button>
      <button id="downloadLid">Download Lid STL</button>
      <button id="downloadCombined">Download Combined</button>
    </div>
    <p class="muted">This standalone page generates ASCII STL files you can open with your slicer.</p>
  </div>

  <script>
    // Presets
    const PRESETS = {
      uno: { name: 'Uno', width: 56, height: 87, defaultCount: 112 },
      flip7: { name: 'Flip 7', width: 56, height: 89, defaultCount: 84 },
      poker: { name: 'Standard Poker', width: 63.5, height: 88.9, defaultCount: 54 },
      mtg: { name: 'Magic/TCG', width: 63, height: 88, defaultCount: 60 },
      custom: { name: 'Custom', width: 60, height: 90, defaultCount: 20 }
    };

    // Helpers (ported from original)
    const fmt = (n) => (Number(n) + 0).toFixed(4);
    function saveFile(content, filename) {
      const blob = new Blob([content], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      link.click();
      URL.revokeObjectURL(url);
    }

    // generateMesh largely preserved but adapted to take engraving and hasFingerLips as args
    function generateMesh(w, h, d, wall, type, opts = {}){
      const { offset = {x:0,y:0,z:0}, engraving = {text:'',position:'front'}, hasFingerLips = true } = opts;
      const facets = [];
      const addTri = (p1,p2,p3)=>{
        const v=(pt)=> `${fmt(pt[0]+offset.x)} ${fmt(pt[1]+offset.y)} ${fmt(pt[2]+offset.z)}`;
        facets.push(`  facet normal 0 0 0\n    outer loop\n      vertex ${v(p1)}\n      vertex ${v(p2)}\n      vertex ${v(p3)}\n    endloop\n  endfacet`);
      };
      const addQuad = (p1,p2,p3,p4)=>{ addTri(p1,p2,p3); addTri(p1,p3,p4); };

      const addWallWithCutout = (x1,y1,x2,y2,zBottom,zTop,thickness,cutoutW,cutoutH)=>{
         const len = Math.sqrt(Math.pow(x2-x1,2)+Math.pow(y2-y1,2));
         const dx=(x2-x1)/len, dy=(y2-y1)/len;
         const nx=-dy, ny=dx;
         const startT=(len-cutoutW)/2, endT=startT+cutoutW, zCut=zTop-cutoutH;
         const oBL=[x1,y1,zBottom], oBR=[x2,y2,zBottom], oTL=[x1,y1,zTop], oTR=[x2,y2,zTop];
         const iBL=[x1+nx*thickness,y1+ny*thickness,zBottom], iBR=[x2+nx*thickness,y2+ny*thickness,zBottom];
         const iTL=[x1+nx*thickness,y1+ny*thickness,zTop], iTR=[x2+nx*thickness,y2+ny*thickness,zTop];
         const pOutStart=[x1+dx*startT,y1+dy*startT], pOutEnd=[x1+dx*endT,y1+dy*endT];
         const pInStart=[pOutStart[0]+nx*thickness,pOutStart[1]+ny*thickness], pInEnd=[pOutEnd[0]+nx*thickness,pOutEnd[1]+ny*thickness];
         addQuad(oBL,[pOutStart[0],pOutStart[1],zBottom],[pOutStart[0],pOutStart[1],zTop],oTL);
         addQuad([pOutEnd[0],pOutEnd[1],zBottom],oBR,oTR,[pOutEnd[0],pOutEnd[1],zTop]);
         addQuad([pOutStart[0],pOutStart[1],zBottom],[pOutEnd[0],pOutEnd[1],zBottom],[pOutEnd[0],pOutEnd[1],zCut],[pOutStart[0],pOutStart[1],zCut]);
         addQuad([pInStart[0],pInStart[1],zBottom],iBL,iTL,[pInStart[0],pInStart[1],zTop]);
         addQuad(iBR,[pInEnd[0],pInEnd[1],zBottom],[pInEnd[0],pInEnd[1],zTop],iTR);
         addQuad([pInEnd[0],pInEnd[1],zBottom],[pInStart[0],pInStart[1],zBottom],[pInStart[0],pInStart[1],zCut],[pInEnd[0],pInEnd[1],zCut]);
         addQuad([pOutStart[0],pOutStart[1],zCut],[pInStart[0],pInStart[1],zCut],[pInStart[0],pInStart[1],zTop],[pOutStart[0],pOutStart[1],zTop]);
         addQuad([pInEnd[0],pInEnd[1],zCut],[pOutEnd[0],pOutEnd[1],zCut],[pOutEnd[0],pOutEnd[1],zTop],[pInEnd[0],pInEnd[1],zTop]);
         addQuad([pOutStart[0],pOutStart[1],zCut],[pOutEnd[0],pOutEnd[1],zCut],[pInEnd[0],pInEnd[1],zCut],[pInStart[0],pInStart[1],zCut]);
         addQuad(oTL,[pOutStart[0],pOutStart[1],zTop],[pInStart[0],pInStart[1],zTop],iTL);
         addQuad([pOutEnd[0],pOutEnd[1],zTop],oTR,iTR,[pInEnd[0],pInEnd[1],zTop]);
      };

      const addSolidWall=(x1,y1,x2,y2,zBottom,zTop,thickness)=>{
         const len=Math.sqrt(Math.pow(x2-x1,2)+Math.pow(y2-y1,2));
         const dx=(x2-x1)/len, dy=(y2-y1)/len; const nx=-dy, ny=dx;
         const oBL=[x1,y1,zBottom], oBR=[x2,y2,zBottom], oTL=[x1,y1,zTop], oTR=[x2,y2,zTop];
         const iBL=[x1+nx*thickness,y1+ny*thickness,zBottom], iBR=[x2+nx*thickness,y2+ny*thickness,zBottom];
         const iTL=[x1+nx*thickness,y1+ny*thickness,zTop], iTR=[x2+nx*thickness,y2+ny*thickness,zTop];
         addQuad(oBL,oBR,oTR,oTL); addQuad(iBR,iBL,iTL,iTR); addQuad(oTL,oTR,iTR,iTL);
      };

      const addWallWithPocket=(x1,y1,x2,y2,zBottom,zTop,thickness,pocketW,pocketH,pocketD)=>{
         const len=Math.sqrt(Math.pow(x2-x1,2)+Math.pow(y2-y1,2));
         const dx=(x2-x1)/len, dy=(y2-y1)/len; const nx=-dy, ny=dx;
         const startT=(len-pocketW)/2, endT=startT+pocketW; const zPocketStart=(zTop-pocketH)/2, zPocketEnd=zPocketStart+pocketH;
         const pts=[]; [0,startT,endT,len].forEach(t=>pts.push([x1+dx*t,y1+dy*t])); const zs=[zBottom,zPocketStart,zPocketEnd,zTop];
         const p=(xi,zi)=>[pts[xi][0],pts[xi][1],zs[zi]];
         for(let xi=0;xi<3;xi++) for(let zi=0;zi<3;zi++) if(!(xi===1&&zi===1)) addQuad(p(xi,zi),p(xi+1,zi),p(xi+1,zi+1),p(xi,zi+1));
         const pi=(xi,zi)=>[pts[xi][0]+nx*thickness,pts[xi][1]+ny*thickness,zs[zi]]; addQuad(pi(3,0),pi(0,0),pi(0,3),pi(3,3)); addQuad(p(0,3),p(3,3),pi(3,3),pi(0,3));
         const pd=(xi,zi)=>[pts[xi][0]+nx*pocketD,pts[xi][1]+ny*pocketD,zs[zi]]; addQuad(pd(1,1),pd(2,1),pd(2,2),pd(1,2));
         addQuad(p(1,1),p(1,2),pd(1,2),pd(1,1)); addQuad(p(2,1),pd(2,1),pd(2,2),p(2,2)); addQuad(p(1,1),pd(1,1),pd(2,1),p(2,1)); addQuad(p(1,2),p(2,2),pd(2,2),pd(1,2));
      };

      // Assembly
      if(type==='box'){
        addQuad([0,0,0],[w,0,0],[w,h,0],[0,h,0]);
        addQuad([wall,h-wall,wall],[w-wall,h-wall,wall],[w-wall,wall,wall],[wall,wall,wall]);
        if(engraving.text && engraving.position==='front'){
          const txtW=Math.min(w*0.7, engraving.text.length*6);
          addWallWithPocket(0,0,w,0,0,d,wall,txtW,14,0.8);
        } else addSolidWall(0,0,w,0,0,d,wall);
        addSolidWall(w,0,w,h,0,d,wall); addSolidWall(w,h,0,h,0,d,wall); addSolidWall(0,h,0,0,0,d,wall);
      } else if(type==='lid'){
        addQuad([0,0,0],[w,0,0],[w,h,0],[0,h,0]);
        addQuad([wall,h-wall,wall],[w-wall,h-wall,wall],[w-wall,wall,wall],[wall,wall,wall]);
        const lipW=24,lipH=15;
        addSolidWall(0,0,w,0,0,d,wall);
        if(hasFingerLips) addWallWithCutout(w,0,w,h,0,d,wall,lipW,lipH); else addSolidWall(w,0,w,h,0,d,wall);
        addSolidWall(w,h,0,h,0,d,wall);
        if(hasFingerLips) addWallWithCutout(0,h,0,0,0,d,wall,lipW,lipH); else addSolidWall(0,h,0,0,0,d,wall);
      }

      return facets.join('\n');
    }

    function computeCalc(width, height, cardCount, cardThickness, wallThickness, tolerance){
      const stackHeight = cardCount * cardThickness;
      const innerW = width + 2; const innerH = height + 2; const innerD = stackHeight + 2;
      return {
        stackHeight, innerW, innerH, innerD,
        outerW: innerW + (wallThickness*2), outerH: innerH + (wallThickness*2), outerD: innerD + (wallThickness),
        lidInnerW: innerW + (wallThickness*2) + (tolerance*2), lidInnerH: innerH + (wallThickness*2) + (tolerance*2), lidDepth:25
      };
    }

    // Wire UI
    const $ = (id)=>document.getElementById(id);
    $('preset').addEventListener('change', ()=>{
      const p = PRESETS[$('preset').value]; $('width').value=p.width; $('height').value=p.height; $('count').value=p.defaultCount;
    });

    function buildAndSave(mode){
      const width = parseFloat($('width').value);
      const height = parseFloat($('height').value);
      const cardCount = parseInt($('count').value,10);
      const cardThickness = parseFloat($('thickness').value);
      const wall = parseFloat($('wall').value);
      const tolerance = parseFloat($('tolerance').value);
      const engraving = { text: $('engrave').value || '', position: 'front' };
      const hasFingerLips = $('fingers').checked;
      const calc = computeCalc(width,height,cardCount,cardThickness,wall,tolerance);
      const lidW = calc.lidInnerW + (wall*2);
      const lidH = calc.lidInnerH + (wall*2);

      if(mode==='box'){
        const stl = 'solid Box\n' + generateMesh(calc.outerW,calc.outerH,calc.outerD,wall,'box',{engraving,hasFingerLips}) + '\nendsolid';
        saveFile(stl, `${PRESETS[$('preset').value].name}_Box.stl`);
      }else if(mode==='lid'){
        const stl = 'solid Lid\n' + generateMesh(lidW,lidH,calc.lidDepth,wall,'lid',{engraving,hasFingerLips}) + '\nendsolid';
        saveFile(stl, `${PRESETS[$('preset').value].name}_Lid.stl`);
      }else{
        let stl = 'solid DeckBoxSet\n';
        stl += generateMesh(calc.outerW,calc.outerH,calc.outerD,wall,'box',{engraving,hasFingerLips});
        stl += '\n' + generateMesh(lidW,lidH,calc.lidDepth,wall,'lid',{offset:{x:calc.outerW+15,y:0,z:0},engraving,hasFingerLips});
        stl += '\nendsolid';
        saveFile(stl, `${PRESETS[$('preset').value].name}_Set.stl`);
      }
    }

    $('downloadBox').addEventListener('click', ()=>buildAndSave('box'));
    $('downloadLid').addEventListener('click', ()=>buildAndSave('lid'));
    $('downloadCombined').addEventListener('click', ()=>buildAndSave('combined'));
  </script>
</body>
</html>
