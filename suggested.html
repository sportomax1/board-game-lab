<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Suggested Player Counts</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>👥</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            height: 100%;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            padding-top: env(safe-area-inset-top, 0);
            padding-bottom: env(safe-area-inset-bottom, 0);
            padding-left: env(safe-area-inset-left, 0);
            padding-right: env(safe-area-inset-right, 0);
        }

        .header {
            flex-shrink: 0;
            padding: 1rem;
            border-bottom: 1px solid #eee;
            background: white;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            color: #333;
        }

        .setup-section {
            flex-shrink: 0;
            padding: 1rem;
            background: white;
            border-bottom: 1px solid #eee;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .setup-input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            -webkit-appearance: none;
            appearance: none;
        }

        .cache-info {
            font-size: 0.75rem;
            color: #999;
            margin-top: 0.5rem;
            padding: 0.5rem;
            background: #f9f9f9;
            border-radius: 4px;
        }

        .setup-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn {
            padding: 0.75rem 1rem;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            font-size: 1rem;
            min-width: 50px;
        }

        .btn:active {
            opacity: 0.9;
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #333;
        }

        .btn-secondary:active {
            background: #d1d5db;
        }

        .status {
            font-size: 0.85rem;
            color: #666;
            padding: 0.5rem;
            background: #f9f9f9;
            border-radius: 4px;
            text-align: center;
        }

        .status.active {
            color: #6366f1;
            font-weight: 600;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 1px solid #eee;
            background: white;
            flex-shrink: 0;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            padding: 1rem 0.75rem;
            text-align: center;
            border: none;
            background: white;
            color: #999;
            cursor: pointer;
            font-weight: 600;
            -webkit-appearance: none;
            appearance: none;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            font-size: 0.9rem;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .tab.active {
            color: #6366f1;
            border-bottom-color: #6366f1;
        }

        .tab:active {
            background: #f5f5f5;
        }

        .tab-content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 1rem;
            display: none;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .player-card {
            padding: 1rem;
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .player-card:active {
            background: #e7f3ff;
            border-color: #6366f1;
            transform: scale(0.98);
        }

        .player-count {
            font-size: 1.3rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .votes-summary {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
        }

        .vote-badge {
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            flex: 1;
            min-width: 60px;
        }

        .best {
            background: #d1fae5;
            color: #059669;
        }

        .recommended {
            background: #bfdbfe;
            color: #1e40af;
        }

        .not-recommended {
            background: #fee2e2;
            color: #dc2626;
        }

        .vote-percent {
            font-size: 0.75rem;
            opacity: 0.8;
            margin-top: 0.2rem;
        }

        .best-flag {
            display: inline-block;
            background: #059669;
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: 700;
            margin-top: 0.5rem;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: white;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            padding: 1.5rem 1rem 1rem;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.2rem;
        }

        .modal-close {
            background: #e5e7eb;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            font-size: 1.2rem;
            cursor: pointer;
            flex-shrink: 0;
        }

        .modal-close:active {
            background: #d1d5db;
        }

        .modal-content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 1rem;
        }

        .vote-detail {
            padding: 1rem;
            background: white;
            border: 1px solid #eee;
            border-radius: 6px;
            margin-bottom: 0.5rem;
        }

        .vote-detail-label {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
        }

        .vote-bar {
            width: 100%;
            height: 20px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .vote-bar-fill {
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 0.5rem;
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .vote-count {
            font-size: 0.85rem;
            color: #666;
        }

        .no-data {
            text-align: center;
            padding: 2rem 1rem;
            color: #999;
        }

        .summary-section {
            padding: 1rem;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .summary-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: #1e40af;
            margin-bottom: 0.5rem;
        }

        .summary-item {
            font-size: 0.9rem;
            color: #1e3a8a;
            margin-bottom: 0.25rem;
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👥 Suggested Player Counts</h1>
        </div>

        <div class="setup-section">
            <div class="input-group">
                <input type="text" id="usernameInput" class="setup-input" placeholder="BGG Username" value="sportomax">
                <button class="btn" id="loadBtn">📦 Load</button>
                <button class="btn btn-secondary" id="clearBtn" title="Clear cache">🗑️</button>
            </div>
            <div class="cache-info" id="cacheInfo"></div>
            <div class="status" id="processingStatus"></div>
        </div>

        <div class="main-content">
            <div class="tabs" id="tabsContainer">
                <!-- Tabs generated by JS -->
            </div>

            <div id="tabsContent">
                <!-- Tab content generated by JS -->
            </div>
        </div>
    </div>

    <!-- Modal for showing vote details -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle"></h2>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-content" id="modalContent"></div>
        </div>
    </div>

    <script>
        const STORAGE_KEY_COLLECTION = 'bgg_suggested_collection';
        const STORAGE_KEY_TIMESTAMP = 'bgg_suggested_timestamp';

        let allGames = [];
        let gameSuggested = {};
        let currentUsername = 'sportomax';
        let playerCounts = [];
        let tabMin = 1;
        let tabMax = 4;

        const usernameInput = document.getElementById('usernameInput');
        const loadBtn = document.getElementById('loadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const processingStatus = document.getElementById('processingStatus');
        const cacheInfo = document.getElementById('cacheInfo');
        const tabsContainer = document.getElementById('tabsContainer');
        const tabsContent = document.getElementById('tabsContent');
        const modalOverlay = document.getElementById('modalOverlay');

        // Load button
        loadBtn.addEventListener('click', loadCollection);

        // Clear cache
        clearBtn.addEventListener('click', () => {
            localStorage.removeItem(STORAGE_KEY_COLLECTION);
            localStorage.removeItem(STORAGE_KEY_TIMESTAMP);
            processingStatus.textContent = '✅ Cache cleared';
            processingStatus.classList.add('active');
            allGames = [];
            gameSuggested = {};
            playerCounts = [];
            tabsContainer.innerHTML = '';
            tabsContent.innerHTML = '';
            cacheInfo.textContent = '';
            setTimeout(() => { processingStatus.classList.remove('active'); }, 2000);
        });

        // Helper functions
        async function fetchWithRetry(url, maxRetries = 3) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url);
                    if (response.status === 202) {
                        await new Promise(resolve => setTimeout(resolve, 2000 * (i + 1)));
                        continue;
                    }
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response;
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    await new Promise(resolve => setTimeout(resolve, 1000 * (i + 1)));
                }
            }
        }

        // Load collection
        async function loadCollection() {
            const username = usernameInput.value.trim();
            if (!username) {
                processingStatus.textContent = '❌ Please enter a username';
                processingStatus.classList.add('active');
                return;
            }

            currentUsername = username;
            localStorage.setItem('bgg_suggested_username', username);

            processingStatus.classList.add('active');
            processingStatus.textContent = '📦 Loading collection...';
            console.log('🔍 Fetching collection for:', username);

            try {
                // Check cache
                const cached = localStorage.getItem(STORAGE_KEY_COLLECTION);
                if (cached) {
                    allGames = JSON.parse(cached);
                    processingStatus.textContent = `✅ Loaded ${allGames.length} games from cache. Fetching player suggestions...`;
                    console.log('✅ Loaded collection from cache:', allGames.length, 'games');
                    updateCacheInfo();
                    // Still fetch suggested data fresh
                    await processGameBatches();
                } else {
                    // Fetch collection
                    const response = await fetchWithRetry(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1`);
                    const xml = new DOMParser().parseFromString(await response.text(), 'text/xml');
                    const items = xml.querySelectorAll('item');

                    allGames = Array.from(items).map(item => ({
                        id: item.getAttribute('objectid'),
                        name: item.querySelector('name')?.textContent || 'Unknown',
                        image: item.querySelector('image')?.textContent || ''
                    })).filter(g => g.id);

                    console.log('📦 Collection fetched:', allGames.length, 'games');
                    localStorage.setItem(STORAGE_KEY_COLLECTION, JSON.stringify(allGames));
                    processingStatus.textContent = `✅ Loaded ${allGames.length} games`;
                    updateCacheInfo();

                    // Process games in batches
                    await processGameBatches();
                    // compute tabs from collection (min/max players) and render initial tabs
                    computeTabsFromCollection();
                    renderAllTabs();
                }

            } catch (error) {
                processingStatus.textContent = `❌ Error: ${error.message}`;
                console.error('❌ Error:', error);
            }
        }

        // Process games in batches
        async function processGameBatches() {
            const batchSize = 20;
            let processed = 0;
            gameSuggested = {};
            playerCounts = [];

            for (let i = 0; i < allGames.length; i += batchSize) {
                const batch = allGames.slice(i, i + batchSize);
                const ids = batch.map(g => g.id).join(',');

                try {
                    processingStatus.textContent = `👥 Processing ${Math.min(processed + batch.length, allGames.length)}/${allGames.length} games...`;
                    console.log(`🔄 Batch ${Math.ceil((i + 1) / batchSize)}: Fetching ${batch.length} games...`);

                    const response = await fetchWithRetry(`/api/bgg-helper?endpoint=thing&id=${ids}&type=boardgame&suggested=1`);
                    const xml = new DOMParser().parseFromString(await response.text(), 'text/xml');
                    const items = xml.querySelectorAll('item');

                    let batchSuggested = 0;
                    Array.from(items).forEach(item => {
                        const gameId = item.getAttribute('id');
                        const game = allGames.find(g => g.id === gameId);
                        if (!game) return;

                        const pollEl = item.querySelector('poll[name="suggested_numplayers"]');
                        if (pollEl) {
                            const resultsElements = pollEl.querySelectorAll('results');
                            const playerCountData = {};

                            Array.from(resultsElements).forEach(results => {
                                const numPlayers = results.getAttribute('numplayers');
                                const votes = {};

                                Array.from(results.querySelectorAll('result')).forEach(result => {
                                    const value = result.getAttribute('value');
                                    const numvotes = parseInt(result.getAttribute('numvotes')) || 0;
                                    votes[value] = numvotes;
                                });

                                playerCountData[numPlayers] = votes;

                                // Track unique player counts
                                if (!playerCounts.includes(numPlayers)) {
                                    playerCounts.push(numPlayers);
                                }
                            });

                            if (Object.keys(playerCountData).length > 0) {
                                gameSuggested[gameId] = {
                                    name: game.name,
                                    image: game.image,
                                    playerCounts: playerCountData
                                };
                                batchSuggested++;
                            }
                        }
                    });

                    console.log(`✅ Batch complete: Found ${batchSuggested} games with player suggestions`);
                    processed += batch.length;
                    // update UI as we collect data
                    renderAllTabs();

                } catch (error) {
                    console.error(`❌ Error processing batch at ${i}:`, error);
                    processingStatus.textContent = `⚠️ Error in batch: ${error.message}`;
                }

                await new Promise(resolve => setTimeout(resolve, 200));
            }

            localStorage.setItem(STORAGE_KEY_TIMESTAMP, new Date().toISOString());

            const resultText = `✅ Done! Found ${Object.keys(gameSuggested).length} games with player suggestions`;
            processingStatus.textContent = resultText;
            console.log(resultText);
            setTimeout(() => { processingStatus.classList.remove('active'); }, 3000);
        }

        // Render all tabs following rule: create tabs 1P..N until the first + entry (e.g. '8+'),
        // and rename the final '+' bucket tab to 'EXTRA' while its data key remains e.g. '8+'.
        function renderAllTabs() {
            if (Object.keys(gameSuggested).length === 0) {
                tabsContainer.innerHTML = '';
                tabsContent.innerHTML = '';
                return;
            }

            // Build tabs based on tabMin/tabMax computed from the collection
            const start = Math.max(1, tabMin || 1);
            const end = Math.max(start, tabMax || start + 3);
            tabsContainer.innerHTML = '';
            tabsContent.innerHTML = '';
            for (let i = start; i <= end; i++) {
                const isLast = (i === end);
                const displayLabel = isLast ? (end + '+' === `${end}+` ? 'EXTRA' : `${i}P`) : `${i}P`;
                // dataKey: numeric or the final 'end+' for EXTRA
                const dataKey = isLast ? `${end}+` : `${i}`;

                const tab = document.createElement('button');
                tab.className = `tab ${i === start ? 'active' : ''}`;
                tab.textContent = displayLabel;
                tab.dataset.tab = `player-${dataKey}`;
                tab.addEventListener('click', () => switchTab(tab, dataKey));
                tabsContainer.appendChild(tab);

                const content = document.createElement('div');
                content.className = `tab-content ${i === start ? 'active' : ''}`;
                content.id = `player-${dataKey}-tab`;
                content.innerHTML = renderPlayerTab(dataKey);
                tabsContent.appendChild(content);
            }
        }

        // Render player tab with Best and Recommended sections
        function renderPlayerTab(playerCount) {
            const bestData = aggregateVotes(playerCount, 'Best');
            const recommendedData = aggregateVotes(playerCount, 'Recommended');

            let html = '';

            html += `
                <div class="summary-section">
                    <div class="summary-title">🏆 Best with ${playerCount} player${playerCount === '1' ? '' : 's'}</div>
                    <div class="vote-detail">
                        <div class="vote-detail-label">Total Votes: ${bestData.totalVotes.toLocaleString()}</div>
                        <div class="vote-bar">
                            <div class="vote-bar-fill" style="width: 100%; background: #059669;">
                                ${bestData.totalVotes > 0 ? bestData.totalVotes.toLocaleString() : 'No data'}
                            </div>
                        </div>
                        <div class="vote-count">${((bestData.totalVotes / bestData.gameCount) * 100).toFixed(1)}% average per game (${bestData.gameCount} games)</div>
                    </div>
                </div>
            `;

            html += `
                <div class="summary-section">
                    <div class="summary-title">✅ Recommended with ${playerCount} player${playerCount === '1' ? '' : 's'}</div>
                    <div class="vote-detail">
                        <div class="vote-detail-label">Total Votes: ${recommendedData.totalVotes.toLocaleString()}</div>
                        <div class="vote-bar">
                            <div class="vote-bar-fill" style="width: 100%; background: #1e40af;">
                                ${recommendedData.totalVotes > 0 ? recommendedData.totalVotes.toLocaleString() : 'No data'}
                            </div>
                        </div>
                        <div class="vote-count">${((recommendedData.totalVotes / recommendedData.gameCount) * 100).toFixed(1)}% average per game (${recommendedData.gameCount} games)</div>
                    </div>
                </div>
            `;

            return html;
        }

        // Aggregate votes across all games for a player count and vote type
        function aggregateVotes(playerCount, voteType) {
            const games = Object.values(gameSuggested);
            let totalVotes = 0;

            // helper maps a poll key (e.g., '8+' or '3') to a tab key based on tabMin/tabMax
            function mapKeyToTab(key) {
                const m = (key||'').toString().match(/^(\d+)(\+)?$/);
                if (!m) return null;
                const n = parseInt(m[1], 10);
                const plus = !!m[2];
                if (plus) {
                    // any plus that starts at or above tabMax maps to the EXTRA tab (tabMax+)
                    if (n >= tabMax) return `${tabMax}+`;
                    return `${n}+`;
                }
                // numeric value maps directly if within range, otherwise if above tabMax map to EXTRA
                if (n >= tabMin && n < tabMax) return `${n}`;
                if (n >= tabMax) return `${tabMax}+`;
                return null;
            }

            games.forEach(game => {
                const keys = Object.keys(game.playerCounts || {});
                keys.forEach(k => {
                    const mapped = mapKeyToTab(k);
                    if (mapped === playerCount) {
                        const votes = (game.playerCounts[k] && game.playerCounts[k][voteType]) || 0;
                        totalVotes += votes;
                    }
                });
            });

            return { voteType, totalVotes, playerCount, gameCount: games.length };
        }

        // Switch tabs
        function switchTab(tab, playerCount) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById(`player-${playerCount}-tab`).classList.add('active');
        }

        // Close modal
        function closeModal() {
            modalOverlay.classList.remove('active');
        }

        // Update cache info
        function updateCacheInfo() {
            // Only show username, not cache info
            cacheInfo.textContent = `👤 Username: ${currentUsername} | 📦 Collection: ${allGames.length} games`;
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Close modal on overlay click
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        // Initialize
        window.addEventListener('load', () => {
            const savedUsername = localStorage.getItem('bgg_suggested_username');
            if (savedUsername) {
                usernameInput.value = savedUsername;
            }
            updateCacheInfo();
            console.log('👥 Suggested Player Counts app loaded');
        });

        // Compute tabMin/tabMax from loaded collection (allGames)
        function computeTabsFromCollection(){
            if(!allGames || allGames.length===0) { tabMin=1; tabMax=4; return; }
            let minP = Infinity, maxP = 0;
            allGames.forEach(g=>{ if(g.minP && g.minP>0) minP = Math.min(minP, g.minP); if(g.maxP) maxP = Math.max(maxP, g.maxP); });
            if(!isFinite(minP)) minP = 1;
            if(maxP===0) maxP = Math.max(4, minP+3);
            tabMin = Math.max(1, minP);
            tabMax = Math.max(tabMin, maxP);
            // cap tabMax to reasonable value (e.g., 12) to avoid huge tab lists
            tabMax = Math.min(tabMax, 12);
        }
    </script>
    <!-- Vercel Web Analytics -->
    <script type="module" src="analytics-init.js"></script>

</body>
</html>
