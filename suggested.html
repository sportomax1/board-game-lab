<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Player Count Suggestions</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>👥</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            height: 100%;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            padding-top: env(safe-area-inset-top, 0);
            padding-bottom: env(safe-area-inset-bottom, 0);
            padding-left: env(safe-area-inset-left, 0);
            padding-right: env(safe-area-inset-right, 0);
        }

        .header {
            flex-shrink: 0;
            padding: 1rem;
            border-bottom: 1px solid #eee;
            background: white;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            color: #333;
        }

        .setup-section {
            flex-shrink: 0;
            padding: 1rem;
            background: white;
            border-bottom: 1px solid #eee;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .setup-input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            -webkit-appearance: none;
            appearance: none;
        }

        .setup-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn {
            padding: 0.75rem 1rem;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            font-size: 1rem;
            min-width: 50px;
        }

        .btn:active {
            opacity: 0.9;
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #333;
        }

        .btn-secondary:active {
            background: #d1d5db;
        }

        .status {
            font-size: 0.85rem;
            color: #666;
            padding: 0.5rem;
            background: #f9f9f9;
            border-radius: 4px;
            text-align: center;
        }

        .status.active {
            color: #6366f1;
            font-weight: 600;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 1px solid #eee;
            background: white;
            flex-shrink: 0;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            padding: 1rem 0.75rem;
            text-align: center;
            border: none;
            background: white;
            color: #999;
            cursor: pointer;
            font-weight: 600;
            -webkit-appearance: none;
            appearance: none;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            font-size: 0.9rem;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .tab.active {
            color: #6366f1;
            border-bottom-color: #6366f1;
        }

        .tab:active {
            background: #f5f5f5;
        }

        .tab-content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 1rem;
            display: none;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .player-card {
            padding: 1rem;
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .player-card:active {
            background: #e7f3ff;
            border-color: #6366f1;
            transform: scale(0.98);
        }

        .player-count {
            font-size: 1.3rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .votes-summary {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
        }

        .vote-badge {
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            flex: 1;
            min-width: 60px;
        }

        .best {
            background: #d1fae5;
            color: #059669;
        }

        .recommended {
            background: #bfdbfe;
            color: #1e40af;
        }

        .not-recommended {
            background: #fee2e2;
            color: #dc2626;
        }

        .vote-percent {
            font-size: 0.75rem;
            opacity: 0.8;
            margin-top: 0.2rem;
        }

        .best-flag {
            display: inline-block;
            background: #059669;
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: 700;
            margin-top: 0.5rem;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: white;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            padding: 1.5rem 1rem 1rem;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.2rem;
        }

        .modal-close {
            background: #e5e7eb;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            font-size: 1.2rem;
            cursor: pointer;
            flex-shrink: 0;
        }

        .modal-close:active {
            background: #d1d5db;
        }

        .modal-content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 1rem;
        }

        .vote-detail {
            padding: 1rem;
            background: white;
            border: 1px solid #eee;
            border-radius: 6px;
            margin-bottom: 0.5rem;
        }

        .vote-detail-label {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
        }

        .vote-bar {
            width: 100%;
            height: 20px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .vote-bar-fill {
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 0.5rem;
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .vote-count {
            font-size: 0.85rem;
            color: #666;
        }

        .no-data {
            text-align: center;
            padding: 2rem 1rem;
            color: #999;
        }

        .summary-section {
            padding: 1rem;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .summary-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: #1e40af;
            margin-bottom: 0.5rem;
        }

        .summary-item {
            font-size: 0.9rem;
            color: #1e3a8a;
            margin-bottom: 0.25rem;
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👥 Player Count Suggestions</h1>
        </div>

        <div class="setup-section">
            <div class="input-group">
                <input type="text" id="gameIdInput" class="setup-input" placeholder="Game ID or name" value="">
                <button class="btn" id="loadBtn">🔍 Load</button>
                <button class="btn btn-secondary" id="clearBtn" title="Clear cache">🗑️</button>
            </div>
            <div class="status" id="processingStatus"></div>
        </div>

        <div class="main-content">
            <div class="tabs" id="tabsContainer">
                <!-- Tabs generated by JS -->
            </div>

            <div id="tabsContent">
                <!-- Tab content generated by JS -->
            </div>
        </div>
    </div>

    <!-- Modal for showing vote details -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle"></h2>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-content" id="modalContent"></div>
        </div>
    </div>

    <script>
        const STORAGE_KEY_GAMES = 'bgg_suggested_games';
        const STORAGE_KEY_TIMESTAMP = 'bgg_suggested_timestamp';

        let allGames = {};
        let playerCountData = {};

        const gameIdInput = document.getElementById('gameIdInput');
        const loadBtn = document.getElementById('loadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const processingStatus = document.getElementById('processingStatus');
        const tabsContainer = document.getElementById('tabsContainer');
        const tabsContent = document.getElementById('tabsContent');
        const modalOverlay = document.getElementById('modalOverlay');

        // Load button
        loadBtn.addEventListener('click', loadGame);

        // Clear cache
        clearBtn.addEventListener('click', () => {
            localStorage.removeItem(STORAGE_KEY_GAMES);
            localStorage.removeItem(STORAGE_KEY_TIMESTAMP);
            processingStatus.textContent = 'Cache cleared';
            allGames = {};
            playerCountData = {};
            tabsContainer.innerHTML = '';
            tabsContent.innerHTML = '';
            setTimeout(() => { processingStatus.textContent = ''; }, 2000);
        });

        // Helper functions
        async function fetchWithRetry(url, maxRetries = 3) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url);
                    if (response.status === 202) {
                        await new Promise(resolve => setTimeout(resolve, 2000 * (i + 1)));
                        continue;
                    }
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response;
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    await new Promise(resolve => setTimeout(resolve, 1000 * (i + 1)));
                }
            }
        }

        // Search for game or use game ID
        async function loadGame() {
            let input = gameIdInput.value.trim();
            if (!input) {
                processingStatus.textContent = '❌ Please enter a game ID or name';
                processingStatus.classList.add('active');
                return;
            }

            processingStatus.classList.add('active');
            processingStatus.textContent = '🔍 Searching...';

            try {
                let gameId = input;

                // If input is not numeric, search for it
                if (isNaN(input)) {
                    processingStatus.textContent = '🔍 Searching for game name...';
                    const searchResp = await fetchWithRetry(`/api/bgg-helper?endpoint=search&query=${encodeURIComponent(input)}`);
                    const searchXml = new DOMParser().parseFromString(await searchResp.text(), 'text/xml');
                    const firstResult = searchXml.querySelector('item');
                    if (!firstResult) {
                        processingStatus.textContent = '❌ Game not found';
                        return;
                    }
                    gameId = firstResult.getAttribute('id');
                }

                // Fetch game details
                processingStatus.textContent = '📦 Loading game data...';
                const response = await fetchWithRetry(`/api/bgg-helper?endpoint=thing&id=${gameId}&type=boardgame&polls=1`);
                const xml = new DOMParser().parseFromString(await response.text(), 'text/xml');
                const item = xml.querySelector('item');

                if (!item) {
                    processingStatus.textContent = '❌ Game not found';
                    return;
                }

                const gameName = item.querySelector('name[type="primary"]')?.textContent || 'Unknown';
                const gameImage = item.querySelector('image')?.textContent || '';

                allGames[gameId] = {
                    id: gameId,
                    name: gameName,
                    image: gameImage
                };

                // Extract suggested numplayers poll
                const poll = item.querySelector('poll[name="suggested_numplayers"]');
                if (!poll) {
                    processingStatus.textContent = '❌ No player count data found';
                    return;
                }

                playerCountData = {};
                const results = poll.querySelectorAll('results');
                Array.from(results).forEach(result => {
                    const numplayers = result.getAttribute('numplayers');
                    const votes = {
                        best: 0,
                        recommended: 0,
                        notRecommended: 0
                    };

                    result.querySelectorAll('result').forEach(r => {
                        const value = r.getAttribute('value');
                        const numvotes = parseInt(r.getAttribute('numvotes')) || 0;
                        if (value === 'Best') votes.best = numvotes;
                        else if (value === 'Recommended') votes.recommended = numvotes;
                        else if (value === 'Not Recommended') votes.notRecommended = numvotes;
                    });

                    playerCountData[numplayers] = votes;
                });

                localStorage.setItem(STORAGE_KEY_GAMES, JSON.stringify(allGames));
                localStorage.setItem(STORAGE_KEY_TIMESTAMP, new Date().toISOString());

                renderTabs();
                processingStatus.textContent = `✅ Loaded: ${gameName}`;
                setTimeout(() => { processingStatus.classList.remove('active'); }, 2000);

            } catch (error) {
                processingStatus.textContent = `❌ Error: ${error.message}`;
                console.error('Error:', error);
            }
        }

        // Render tabs
        function renderTabs() {
            tabsContainer.innerHTML = '';
            tabsContent.innerHTML = '';

            const playerCounts = Object.keys(playerCountData).sort((a, b) => {
                const aNum = parseInt(a);
                const bNum = parseInt(b);
                return aNum - bNum;
            });

            if (playerCounts.length === 0) return;

            // Create summary
            const summary = generateSummary();

            playerCounts.forEach((playerCount, index) => {
                const tab = document.createElement('button');
                tab.className = `tab ${index === 0 ? 'active' : ''}`;
                tab.textContent = `${playerCount}P`;
                tab.dataset.tab = `player-${playerCount}`;
                tab.addEventListener('click', () => switchTab(tab, playerCount));
                tabsContainer.appendChild(tab);

                const content = document.createElement('div');
                content.className = `tab-content ${index === 0 ? 'active' : ''}`;
                content.id = `player-${playerCount}-tab`;
                content.innerHTML = renderPlayerTab(playerCount, summary);
                tabsContent.appendChild(content);
            });
        }

        // Generate summary
        function generateSummary() {
            const pollSummary = document.querySelector('poll-summary') ? 
                document.querySelector('poll-summary') : null;
            
            // Find best player count
            let bestCount = null;
            let maxBest = 0;
            Object.entries(playerCountData).forEach(([count, votes]) => {
                if (votes.best > maxBest) {
                    maxBest = votes.best;
                    bestCount = count;
                }
            });

            return {
                best: bestCount,
                maxBest: maxBest
            };
        }

        // Render player tab
        function renderPlayerTab(playerCount, summary) {
            const votes = playerCountData[playerCount];
            const total = votes.best + votes.recommended + votes.notRecommended;

            const bestPercent = total > 0 ? Math.round((votes.best / total) * 100) : 0;
            const recPercent = total > 0 ? Math.round((votes.recommended / total) * 100) : 0;
            const notRecPercent = total > 0 ? Math.round((votes.notRecommended / total) * 100) : 0;

            let html = '';

            // Show summary if this is best count
            if (summary.best === playerCount) {
                html += `
                    <div class="summary-section">
                        <div class="summary-title">🏆 BEST WITH ${playerCount} PLAYER${playerCount === '1' ? '' : 'S'}</div>
                        <div class="summary-item">${votes.best.toLocaleString()} votes for "Best"</div>
                    </div>
                `;
            }

            html += `
                <div class="player-card" onclick="showVoteDetails('${playerCount}')">
                    <div class="player-count">${playerCount} Player${playerCount === '1' ? '' : 's'}</div>
                    <div class="votes-summary">
                        <div class="vote-badge best">
                            👍 Best<br><div class="vote-percent">${bestPercent}%</div>
                        </div>
                        <div class="vote-badge recommended">
                            👌 Recommended<br><div class="vote-percent">${recPercent}%</div>
                        </div>
                        <div class="vote-badge not-recommended">
                            👎 Not Rec.<br><div class="vote-percent">${notRecPercent}%</div>
                        </div>
                    </div>
                    ${summary.best === playerCount ? '<div class="best-flag">★ BEST WITH ' + playerCount + '</div>' : ''}
                </div>
            `;

            return html;
        }

        // Show vote details in modal
        function showVoteDetails(playerCount) {
            const votes = playerCountData[playerCount];
            const total = votes.best + votes.recommended + votes.notRecommended;

            const bestPercent = total > 0 ? Math.round((votes.best / total) * 100) : 0;
            const recPercent = total > 0 ? Math.round((votes.recommended / total) * 100) : 0;
            const notRecPercent = total > 0 ? Math.round((votes.notRecommended / total) * 100) : 0;

            const gameName = Object.values(allGames)[0]?.name || 'Game';
            document.getElementById('modalTitle').textContent = `${playerCount} Players - ${gameName}`;

            const content = `
                <div class="vote-detail">
                    <div class="vote-detail-label">👍 Best</div>
                    <div class="vote-bar">
                        <div class="vote-bar-fill" style="width: ${bestPercent}%; background: #059669;">
                            ${bestPercent > 10 ? bestPercent + '%' : ''}
                        </div>
                    </div>
                    <div class="vote-count">${votes.best.toLocaleString()} votes (${bestPercent}%)</div>
                </div>

                <div class="vote-detail">
                    <div class="vote-detail-label">👌 Recommended</div>
                    <div class="vote-bar">
                        <div class="vote-bar-fill" style="width: ${recPercent}%; background: #1e40af;">
                            ${recPercent > 10 ? recPercent + '%' : ''}
                        </div>
                    </div>
                    <div class="vote-count">${votes.recommended.toLocaleString()} votes (${recPercent}%)</div>
                </div>

                <div class="vote-detail">
                    <div class="vote-detail-label">👎 Not Recommended</div>
                    <div class="vote-bar">
                        <div class="vote-bar-fill" style="width: ${notRecPercent}%; background: #dc2626;">
                            ${notRecPercent > 10 ? notRecPercent + '%' : ''}
                        </div>
                    </div>
                    <div class="vote-count">${votes.notRecommended.toLocaleString()} votes (${notRecPercent}%)</div>
                </div>

                <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #eee; text-align: center; color: #666; font-size: 0.9rem;">
                    Total Votes: ${total.toLocaleString()}
                </div>
            `;

            document.getElementById('modalContent').innerHTML = content;
            modalOverlay.classList.add('active');
        }

        // Switch tabs
        function switchTab(tab, playerCount) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById(`player-${playerCount}-tab`).classList.add('active');
        }

        // Close modal
        function closeModal() {
            modalOverlay.classList.remove('active');
        }

        // Close modal on overlay click
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        // Initialize
        window.addEventListener('load', () => {
            const saved = localStorage.getItem(STORAGE_KEY_GAMES);
            if (saved) {
                allGames = JSON.parse(saved);
            }
        });
    </script>
</body>
</html>
