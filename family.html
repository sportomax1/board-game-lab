<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Board Game Families</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>👨‍👩‍👧‍👦</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            height: 100%;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            padding-top: env(safe-area-inset-top, 0);
            padding-bottom: env(safe-area-inset-bottom, 0);
            padding-left: env(safe-area-inset-left, 0);
            padding-right: env(safe-area-inset-right, 0);
        }

        .header {
            flex-shrink: 0;
            padding: 1rem;
            border-bottom: 1px solid #eee;
            background: white;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            color: #333;
        }

        .setup-section {
            flex-shrink: 0;
            padding: 1rem;
            background: white;
            border-bottom: 1px solid #eee;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
        }

        .setup-input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            -webkit-appearance: none;
            appearance: none;
        }

        .setup-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn {
            padding: 0.75rem 1rem;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            font-size: 1rem;
            min-width: 50px;
        }

        .btn:active {
            opacity: 0.9;
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #333;
        }

        .btn-secondary:active {
            background: #d1d5db;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 1px solid #eee;
            background: white;
            flex-shrink: 0;
        }

        .tab {
            flex: 1;
            padding: 1rem;
            text-align: center;
            border: none;
            background: white;
            color: #999;
            cursor: pointer;
            font-weight: 600;
            -webkit-appearance: none;
            appearance: none;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .tab.active {
            color: #6366f1;
            border-bottom-color: #6366f1;
        }

        .tab:active {
            background: #f5f5f5;
        }

        .tab-content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 1rem;
            display: none;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .status {
            padding: 1rem;
            text-align: center;
            color: #999;
            font-size: 0.95rem;
            background: #f9f9f9;
            border-radius: 8px;
        }

        .status.success {
            color: #059669;
            background: #d1fae5;
        }

        .status.error {
            color: #dc2626;
            background: #fee2e2;
        }

        .loading {
            text-align: center;
            padding: 2rem 1rem;
        }

        .spinner {
            display: inline-block;
            width: 2rem;
            height: 2rem;
            border: 3px solid #f0f0f0;
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 0.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .family-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .family-item {
            padding: 1rem;
            background: #f9f9f9;
            border-radius: 8px;
            border: 1px solid #eee;
            cursor: pointer;
            transition: all 0.2s;
        }

        .family-item:active {
            background: #e7f3ff;
            border-color: #6366f1;
        }

        .family-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: #333;
        }

        .family-type {
            font-size: 0.85rem;
            color: #999;
            display: inline-block;
            background: #e5e7eb;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            margin-bottom: 0.5rem;
        }

        .family-count {
            font-size: 0.9rem;
            color: #666;
        }

        .game-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .game-card {
            padding: 1rem;
            background: white;
            border: 1px solid #eee;
            border-radius: 8px;
            display: flex;
            gap: 1rem;
        }

        .game-thumbnail {
            width: 60px;
            height: 80px;
            background: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .game-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-info {
            flex: 1;
            min-width: 0;
        }

        .game-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: #333;
            word-break: break-word;
        }

        .game-families {
            font-size: 0.85rem;
            color: #666;
        }

        .family-tag {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 0.25rem 0.5rem;
            border-radius: 3px;
            margin-top: 0.25rem;
            margin-right: 0.25rem;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .family-tag:active {
            background: #bfdbfe;
        }

        .no-data {
            text-align: center;
            padding: 2rem 1rem;
            color: #999;
        }

        .cache-info {
            font-size: 0.75rem;
            color: #999;
            margin-top: 0.5rem;
            padding: 0.5rem;
            background: #f9f9f9;
            border-radius: 4px;
        }

        .controls {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .controls button {
            flex: 1;
            padding: 0.75rem;
            font-size: 0.9rem;
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👨‍👩‍👧‍👦 Board Game Families</h1>
        </div>

        <div class="setup-section">
            <div class="input-group">
                <input type="text" id="usernameInput" class="setup-input" placeholder="BGG Username" value="sportomax">
                <button class="btn" id="loadBtn">📦 Load</button>
                <button class="btn btn-secondary" id="clearBtn" title="Clear cache">🗑️</button>
            </div>
            <div class="cache-info" id="cacheInfo"></div>
        </div>

        <div class="main-content">
            <div class="tabs">
                <button class="tab active" data-tab="families">📋 Families</button>
                <button class="tab" data-tab="games">🎮 Games</button>
            </div>

            <!-- Families Tab -->
            <div class="tab-content active" id="families-tab">
                <div id="familiesStatus" class="status" style="display: none;"></div>
                <div id="familiesList" class="family-list"></div>
            </div>

            <!-- Games Tab -->
            <div class="tab-content" id="games-tab">
                <div class="controls">
                    <input type="text" id="gameFilter" class="setup-input" placeholder="Filter games..." style="flex: 1;">
                </div>
                <div id="gamesList" class="game-list"></div>
            </div>
        </div>
    </div>

    <script>
        // Storage keys
        const STORAGE_KEY_COLLECTION = 'bgg_family_collection';
        const STORAGE_KEY_FAMILIES = 'bgg_family_cache';
        const STORAGE_KEY_TIMESTAMP = 'bgg_family_timestamp';

        let allGames = [];
        let allFamilies = [];
        let gameFamiliesMap = {};
        let currentUsername = 'sportomax';

        const usernameInput = document.getElementById('usernameInput');
        const loadBtn = document.getElementById('loadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const tabs = document.querySelectorAll('.tab');
        const tabContents = document.querySelectorAll('.tab-content');
        const cacheInfo = document.getElementById('cacheInfo');
        const gameFilter = document.getElementById('gameFilter');

        // Tab switching
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tabContents.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab + '-tab').classList.add('active');
            });
        });

        // Load button
        loadBtn.addEventListener('click', loadCollection);

        // Clear cache
        clearBtn.addEventListener('click', () => {
            localStorage.removeItem(STORAGE_KEY_COLLECTION);
            localStorage.removeItem(STORAGE_KEY_FAMILIES);
            localStorage.removeItem(STORAGE_KEY_TIMESTAMP);
            cacheInfo.textContent = 'Cache cleared';
            allGames = [];
            allFamilies = [];
            gameFamiliesMap = {};
            document.getElementById('familiesList').innerHTML = '';
            document.getElementById('gamesList').innerHTML = '';
            setTimeout(() => { cacheInfo.textContent = ''; }, 2000);
        });

        // Game filter
        gameFilter.addEventListener('input', renderGames);

        // Helper functions
        async function fetchWithRetry(url, maxRetries = 3) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url);
                    if (response.status === 202) {
                        await new Promise(resolve => setTimeout(resolve, 2000 * (i + 1)));
                        continue;
                    }
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response;
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    await new Promise(resolve => setTimeout(resolve, 1000 * (i + 1)));
                }
            }
        }

        // Load collection
        async function loadCollection() {
            const username = usernameInput.value.trim();
            if (!username) {
                showStatus('familiesStatus', 'Please enter a username', 'error');
                return;
            }

            currentUsername = username;
            localStorage.setItem('bgg_family_username', username);

            showStatus('familiesStatus', '📦 Loading collection...', '');

            try {
                // Check cache first
                const cached = localStorage.getItem(STORAGE_KEY_COLLECTION);
                if (cached) {
                    allGames = JSON.parse(cached);
                    showStatus('familiesStatus', `✅ Loaded ${allGames.length} games from cache`, 'success');
                    updateCacheInfo();
                } else {
                    // Fetch from API
                    const response = await fetchWithRetry(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1`);
                    const xml = new DOMParser().parseFromString(await response.text(), 'text/xml');
                    const items = xml.querySelectorAll('item');

                    allGames = Array.from(items).map(item => ({
                        id: item.getAttribute('objectid'),
                        name: item.querySelector('name')?.textContent || 'Unknown',
                        image: item.querySelector('image')?.textContent || ''
                    })).filter(g => g.id);

                    localStorage.setItem(STORAGE_KEY_COLLECTION, JSON.stringify(allGames));
                    localStorage.setItem(STORAGE_KEY_TIMESTAMP, new Date().toISOString());
                    showStatus('familiesStatus', `✅ Loaded ${allGames.length} games`, 'success');
                    updateCacheInfo();
                }

                // Fetch families
                await loadFamilies();
                renderFamilies();

            } catch (error) {
                showStatus('familiesStatus', `❌ Error: ${error.message}`, 'error');
                console.error('Error:', error);
            }
        }

        // Load families for all games
        async function loadFamilies() {
            showStatus('familiesStatus', `🔗 Fetching ${allGames.length} game families...`, '');

            gameFamiliesMap = {};
            const batchSize = 20;
            let processed = 0;

            for (let i = 0; i < allGames.length; i += batchSize) {
                const batch = allGames.slice(i, i + batchSize);
                const ids = batch.map(g => g.id).join(',');

                try {
                    const response = await fetchWithRetry(`/api/bgg-helper?endpoint=thing&id=${ids}&type=boardgame`);
                    const xml = new DOMParser().parseFromString(await response.text(), 'text/xml');
                    const items = xml.querySelectorAll('item');

                    Array.from(items).forEach(item => {
                        const gameId = item.getAttribute('id');
                        const familyLinks = item.querySelectorAll('link[type="boardgamefamily"]');
                        gameFamiliesMap[gameId] = Array.from(familyLinks).map(link => ({
                            id: link.getAttribute('id'),
                            name: link.getAttribute('value'),
                            type: link.getAttribute('type')
                        }));
                    });

                    processed += batch.length;
                    showStatus('familiesStatus', `📊 Processed ${processed}/${allGames.length} games...`, '');

                } catch (error) {
                    console.error(`Error fetching batch ${i}:`, error);
                }

                // Small delay between batches
                await new Promise(resolve => setTimeout(resolve, 200));
            }

            // Build unique families list
            const familiesMap = new Map();
            Object.values(gameFamiliesMap).forEach(families => {
                families.forEach(family => {
                    if (!familiesMap.has(family.id)) {
                        familiesMap.set(family.id, family);
                    }
                });
            });

            allFamilies = Array.from(familiesMap.values()).sort((a, b) => a.name.localeCompare(b.name));
            localStorage.setItem(STORAGE_KEY_FAMILIES, JSON.stringify(allFamilies));
            localStorage.setItem(STORAGE_KEY_TIMESTAMP, new Date().toISOString());

            showStatus('familiesStatus', `✅ Found ${allFamilies.length} unique families!`, 'success');
        }

        // Render families
        function renderFamilies() {
            const list = document.getElementById('familiesList');
            if (allFamilies.length === 0) {
                list.innerHTML = '<div class="no-data">No families found</div>';
                return;
            }

            list.innerHTML = allFamilies.map(family => {
                const gameCount = Object.values(gameFamiliesMap).filter(families =>
                    families.some(f => f.id === family.id)
                ).length;

                return `
                    <div class="family-item" onclick="filterByFamily('${family.id}', '${escapeHtml(family.name)}')">
                        <div class="family-name">${escapeHtml(family.name)}</div>
                        <div class="family-type">${family.type || 'boardgamefamily'}</div>
                        <div class="family-count">🎮 ${gameCount} game${gameCount !== 1 ? 's' : ''}</div>
                    </div>
                `;
            }).join('');
        }

        // Render games
        function renderGames() {
            const list = document.getElementById('gamesList');
            const filter = gameFilter.value.toLowerCase();

            const filtered = allGames.filter(game =>
                game.name.toLowerCase().includes(filter)
            );

            if (filtered.length === 0) {
                list.innerHTML = '<div class="no-data">No games found</div>';
                return;
            }

            list.innerHTML = filtered.map(game => {
                const families = gameFamiliesMap[game.id] || [];
                return `
                    <div class="game-card">
                        <div class="game-thumbnail">
                            ${game.image ? `<img src="/api/image-proxy?url=${encodeURIComponent(game.image)}" alt="${escapeHtml(game.name)}" onerror="this.style.display='none';">` : ''}
                        </div>
                        <div class="game-info">
                            <div class="game-name">${escapeHtml(game.name)}</div>
                            <div class="game-families">
                                ${families.length > 0 ? families.map(f => `<div class="family-tag" onclick="event.stopPropagation(); filterByFamily('${f.id}', '${escapeHtml(f.name)}')">${escapeHtml(f.name)}</div>`).join('') : '<span style="color: #999;">No families</span>'}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Filter games by family
        function filterByFamily(familyId, familyName) {
            const gamesInFamily = Object.entries(gameFamiliesMap)
                .filter(([_, families]) => families.some(f => f.id === familyId))
                .map(([gameId, _]) => gameId);

            const gamesInFamilyObjs = allGames.filter(g => gamesInFamily.includes(g.id));

            // Switch to games tab and show filtered list
            document.querySelector('[data-tab="games"]').click();
            document.getElementById('gamesList').innerHTML = gamesInFamilyObjs.map(game => {
                const families = gameFamiliesMap[game.id] || [];
                return `
                    <div class="game-card">
                        <div class="game-thumbnail">
                            ${game.image ? `<img src="/api/image-proxy?url=${encodeURIComponent(game.image)}" alt="${escapeHtml(game.name)}" onerror="this.style.display='none';">` : ''}
                        </div>
                        <div class="game-info">
                            <div class="game-name">${escapeHtml(game.name)}</div>
                            <div class="game-families">
                                ${families.length > 0 ? families.map(f => `<div class="family-tag" onclick="event.stopPropagation(); filterByFamily('${f.id}', '${escapeHtml(f.name)}')">${escapeHtml(f.name)}</div>`).join('') : '<span style="color: #999;">No families</span>'}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            gameFilter.value = '';
        }

        // Show status message
        function showStatus(elementId, message, type) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.className = `status ${type}`;
            if (type) el.style.display = 'block';
        }

        // Update cache info
        function updateCacheInfo() {
            const timestamp = localStorage.getItem(STORAGE_KEY_TIMESTAMP);
            if (timestamp) {
                const date = new Date(timestamp);
                cacheInfo.textContent = `💾 Cached: ${date.toLocaleString()} | Games: ${allGames.length}`;
            }
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize
        window.addEventListener('load', () => {
            const savedUsername = localStorage.getItem('bgg_family_username');
            if (savedUsername) {
                usernameInput.value = savedUsername;
            }
            updateCacheInfo();
        });
    </script>
</body>
</html>
