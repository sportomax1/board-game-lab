<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Rubix Thumbs</title>
    <style>
        body{font-family:system-ui,-apple-system,Segoe UI,Roboto;background:#f2f7fb;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
        .card{background:#fff;padding:18px;border-radius:12px;box-shadow:0 12px 36px rgba(16,40,60,0.08);width:420px}
        .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}
        .cell{width:120px;height:120px;background:#eee;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center}
        .controls{display:flex;gap:8px;flex-wrap:wrap}
        button{padding:8px 10px;border-radius:8px;border:1px solid #dbe7f5;background:#2b8cff;color:white;cursor:pointer}
        .small{padding:6px 8px;font-size:13px}
        .muted{color:#667;font-size:13px}
        .home{float:right}
    </style>
</head>
<body>
    <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between">
            <div>
                <h2 style="margin:0">Rubix Thumbs</h2>
                <div class="muted">3x3 thumb-rotation puzzle — rotate rows/columns to match the solved pattern</div>
            </div>
            <a class="home" href="home.html">Home</a>
        </div>

        <div style="margin-top:8px">Username: <input id="username" value="sportomax" style="padding:6px;border-radius:8px;border:1px solid #ddd"/></div>
        <div class="grid" id="grid"></div>

        <div class="controls">
            <button id="rotateRow0" class="small">Row 1 →</button>
            <button id="rotateRow1" class="small">Row 2 →</button>
            <button id="rotateRow2" class="small">Row 3 →</button>
            <button id="rotCol0" class="small">Col 1 ↓</button>
            <button id="rotCol1" class="small">Col 2 ↓</button>
            <button id="rotCol2" class="small">Col 3 ↓</button>
            <button id="scramble" class="small">Scramble</button>
            <button id="cheat" class="small">Cheat (solve)</button>
        </div>
        <div style="margin-top:8px" class="muted">Tip: scramble applies random rotations; cheat will reverse the scramble and animate it.</div>
    </div>

    <script>
        const gridRoot = document.getElementById('grid');
        let faceImages = []; // 6 face images
        let cubeState = []; // 6 faces, each 9 entries (face index refers to image index)
        let moveHistory = [];
        let animating = false;

        async function loadCollection(username='sportomax'){
            try{
                const res = await fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1`);
                const text = await res.text();
                const xml = new DOMParser().parseFromString(text,'text/xml');
                const found = Array.from(xml.querySelectorAll('item')).map(it=>({ thumbnail: (it.querySelector('thumbnail')||{textContent:''}).textContent })).filter(x=>x.thumbnail).slice(0,6);
                if(found.length < 6) throw new Error('need 6 thumbnails for faces');
                faceImages = found.map(f=>'https://images.weserv.nl/?url='+encodeURIComponent(f.thumbnail));
                // initialize cube state: each face filled with its image index
                cubeState = [];
                for(let i=0;i<6;i++){ const face = new Array(9).fill(i); cubeState.push(face); }
                renderCube();
            }catch(e){ console.warn('loadCollection failed', e); fillDummy(); }
        }

        function fillDummy(){
            state = [];
            for(let i=0;i<9;i++){ state.push('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22120%22 height=%22120%22%3E%3Crect width=120 height=120 fill=%23ddd/%3E%3Ctext x=50 y=70 font-size=24%3E'+(i+1)+'%3C/text%3E%3C/svg%3E'); }
            solvedState = state.slice(); renderGrid();
        }

        function renderCube(){
            gridRoot.innerHTML = '';
            for(let f=0;f<6;f++){
                const faceWrap = document.createElement('div'); faceWrap.style.display='inline-block'; faceWrap.style.margin='6px';
                const title = document.createElement('div'); title.textContent = ['Up','Right','Front','Down','Left','Back'][f]; title.style.fontSize='12px'; title.style.marginBottom='6px'; faceWrap.appendChild(title);
                const g = document.createElement('div'); g.style.display='grid'; g.style.gridTemplateColumns='repeat(3,64px)'; g.style.gap='6px';
                for(let i=0;i<9;i++){
                    const idx = cubeState[f][i];
                    const el = document.createElement('div'); el.className='cell'; el.style.width='64px'; el.style.height='64px'; el.style.overflow='hidden'; el.style.borderRadius='6px'; el.style.background='#ddd';
                    const img = document.createElement('img'); img.src = faceImages[idx] || ('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2264%22 height=%2264%22%3E%3Crect width=64 height=64 fill=%23ccc/%3E%3C/text%3E%3C/svg%3E'); img.style.width='100%'; img.style.height='100%'; img.style.objectFit='cover'; el.appendChild(img);
                    g.appendChild(el);
                }
                faceWrap.appendChild(g);
                gridRoot.appendChild(faceWrap);
            }
        }

        // rotate a face clockwise (face index 0-5)
        function rotateFace(f){
            if(animating) return;
            const arr = cubeState[f];
            const newArr = arr.slice();
            newArr[0]=arr[6]; newArr[1]=arr[3]; newArr[2]=arr[0];
            newArr[3]=arr[7]; newArr[4]=arr[4]; newArr[5]=arr[1];
            newArr[6]=arr[8]; newArr[7]=arr[5]; newArr[8]=arr[2];
            cubeState[f] = newArr;
            moveHistory.push({type:'face',f}); renderCube();
        }

        function scramble(){
            if(animating) return;
            moveHistory = [];
            const moves = 18;
            for(let i=0;i<moves;i++){
                const f = Math.floor(Math.random()*6); rotateFace(f);
            }
        }

        async function cheatSolve(){
            if(animating || moveHistory.length===0) return;
            animating = true;
            const rev = moveHistory.slice().reverse();
            for(const m of rev){ await new Promise(res=>setTimeout(res, 300)); if(m.type==='face'){ // inverse is three clockwise rotations
                    rotateFace(m.f); rotateFace(m.f); rotateFace(m.f);
                }
            }
            moveHistory = [];
            animating = false;
        }

        // bind face buttons
        document.getElementById('rotateRow0').addEventListener('click', ()=>rotateFace(0));
        document.getElementById('rotateRow1').addEventListener('click', ()=>rotateFace(2));
        document.getElementById('rotateRow2').addEventListener('click', ()=>rotateFace(4));
        document.getElementById('rotCol0').addEventListener('click', ()=>rotateFace(1));
        document.getElementById('rotCol1').addEventListener('click', ()=>rotateFace(3));
        document.getElementById('rotCol2').addEventListener('click', ()=>rotateFace(5));

        document.getElementById('scramble').addEventListener('click', scramble);
        document.getElementById('cheat').addEventListener('click', cheatSolve);
        document.getElementById('username').addEventListener('change', ()=> loadCollection(document.getElementById('username').value.trim()));
        loadCollection('sportomax');
    </script>
</body>
</html>
