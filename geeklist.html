<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>BGG Geeklist Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
    }

    .game-card {
      transition: all 0.2s ease;
    }

    .game-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
    }

    .skeleton {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }
  </style>
</head>
<body class="pb-20">

  <header class="sticky top-0 z-30 w-full bg-white/80 backdrop-blur-md border-b px-4 py-4 shadow-sm">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-purple-600 text-white p-2 rounded-lg">
          <i class="fa-solid fa-list"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">Geeklist Viewer</h1>
          <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">BGG Collections</p>
        </div>
      </div>
      <div id="statsBox" class="text-right hidden">
        <div class="text-2xl font-bold text-purple-600" id="gameCount">0</div>
        <div class="text-[10px] text-slate-500 uppercase font-bold">Items</div>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6">
    
    <!-- Fetch Section -->
    <div id="fetchSection" class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
      <h2 class="text-xl font-bold mb-4">Load Geeklist</h2>
      <div class="space-y-4">
        <div>
          <label class="text-xs font-bold text-slate-500 uppercase mb-2 block">Geeklist ID</label>
          <input 
            id="geeklistId" 
            type="text" 
            value="140673" 
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-purple-500 outline-none transition-all"
            placeholder="e.g. 140673"
          >
        </div>
        <button 
          onclick="fetchGeeklist()" 
          id="fetchBtn"
          class="w-full bg-purple-600 text-white py-4 rounded-xl font-bold hover:bg-purple-700 shadow-lg shadow-purple-100 flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-download"></i> Load Geeklist
        </button>
      </div>
    </div>

    <!-- Loading Section -->
    <div id="loadingSection" class="hidden">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
        <div class="flex items-center justify-center gap-3 mb-4">
          <i class="fa-solid fa-circle-notch fa-spin text-purple-600 text-2xl"></i>
          <span class="font-bold text-slate-700">Loading geeklist...</span>
        </div>
        <div class="text-sm text-slate-500 text-center" id="loadingStatus">Fetching items...</div>
        <div class="mt-4 bg-slate-100 rounded-full h-2 overflow-hidden">
          <div id="progressBar" class="bg-purple-600 h-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- Filters and Sort -->
    <div id="controlsSection" class="hidden bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
      <div class="flex flex-col sm:flex-row gap-3">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search items..." 
          oninput="filterItems()"
          class="flex-1 px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-purple-500 outline-none transition-all"
        >
        <select 
          id="sortSelect" 
          onchange="sortItems()" 
          class="px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-purple-500 outline-none transition-all bg-white font-medium text-sm"
        >
          <option value="postdate-desc">Newest First</option>
          <option value="postdate-asc">Oldest First</option>
          <option value="name">Name: A-Z</option>
          <option value="rating-desc">Rating: High to Low</option>
        </select>
      </div>
    </div>

    <!-- Items List -->
    <div id="itemsSection" class="hidden space-y-3">
      <!-- Items will be populated here -->
    </div>

  </main>

<script>
let allItems = [];
let displayedItems = [];
let isLoading = false;

async function fetchGeeklist() {
  const fetchBtn = document.getElementById('fetchBtn');
  const fetchSection = document.getElementById('fetchSection');
  const loadingSection = document.getElementById('loadingSection');
  const controlsSection = document.getElementById('controlsSection');
  const itemsSection = document.getElementById('itemsSection');
  const statsBox = document.getElementById('statsBox');
  const geeklistId = document.getElementById('geeklistId').value.trim();
  
  if (!geeklistId) {
    alert('Please enter a Geeklist ID');
    return;
  }
  
  fetchBtn.disabled = true;
  loadingSection.classList.remove('hidden');
  
  try {
    isLoading = true;
    
    updateLoadingStatus('Fetching geeklist...');
    const geeklistXml = await fetchAPI('geeklist', geeklistId);
    const doc = new DOMParser().parseFromString(geeklistXml, 'text/xml');
    const items = Array.from(doc.querySelectorAll('item'));
    
    if (items.length === 0) {
      throw new Error('No items found in this geeklist');
    }
    
    allItems = items.map((item, idx) => ({
      index: idx,
      id: item.getAttribute('id') || '',
      objectid: item.getAttribute('objectid') || '',
      objecttype: item.getAttribute('objecttype') || '',
      objectname: item.getAttribute('objectname') || 'Unknown',
      username: item.getAttribute('username') || '',
      postdate: item.getAttribute('postdate') || '',
      body: item.querySelector('body')?.textContent || '',
      thumb: '',
      rating: 0,
      year: '',
      loaded: false
    }));
    
    updateLoadingStatus(`Found ${allItems.length} items. Loading details...`);
    document.getElementById('gameCount').textContent = allItems.length;
    
    // Show UI
    fetchSection.classList.add('hidden');
    controlsSection.classList.remove('hidden');
    itemsSection.classList.remove('hidden');
    statsBox.classList.remove('hidden');
    displayedItems = [...allItems];
    renderItems();
    
    // Fetch thing API in batches with 100x parallel processing
    const batchSize = 20;
    const parallelBatches = 100;
    const batches = [];
    
    for (let i = 0; i < allItems.length; i += batchSize) {
      batches.push(allItems.slice(i, i + batchSize));
    }
    
    for (let i = 0; i < batches.length; i += parallelBatches) {
      const batchGroup = batches.slice(i, i + parallelBatches);
      updateLoadingStatus(`Loading details ${Math.min(i + parallelBatches, batches.length)}/${batches.length}...`);
      updateProgress((Math.min(i + parallelBatches, batches.length) / batches.length) * 100);
      
      await Promise.all(batchGroup.map(async (batch) => {
        const ids = batch.map(g => g.objectid).join(',');
        
        try {
          const thingXml = await fetchAPI('thing', ids, '&stats=1');
          const thingDoc = new DOMParser().parseFromString(thingXml, 'text/xml');
          const thingItems = Array.from(thingDoc.querySelectorAll('item'));
          
          thingItems.forEach(thingItem => {
            const id = thingItem.getAttribute('id');
            const item = allItems.find(g => g.objectid === id);
            if (!item) return;
            
            item.thumb = thingItem.querySelector('thumbnail')?.textContent || '';
            item.year = thingItem.querySelector('yearpublished')?.textContent || '';
            
            const avgElement = thingItem.querySelector('statistics ratings average');
            if (avgElement) {
              item.rating = parseFloat(avgElement.getAttribute('value') || '0');
            }
            
            item.loaded = true;
          });
          
        } catch (e) {
          console.error('Batch error:', e);
        }
      }));
      
      sortItems();
      await wait(500);
    }
    
    updateLoadingStatus('Complete!');
    updateProgress(100);
    isLoading = false;
    
    setTimeout(() => {
      loadingSection.classList.add('hidden');
    }, 500);
    
  } catch (e) {
    console.error(e);
    alert('Failed to fetch geeklist: ' + e.message);
    fetchBtn.disabled = false;
    loadingSection.classList.add('hidden');
    fetchSection.classList.remove('hidden');
  }
}

function updateLoadingStatus(msg) {
  document.getElementById('loadingStatus').textContent = msg;
}

function updateProgress(percent) {
  document.getElementById('progressBar').style.width = percent + '%';
}

function filterItems() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  displayedItems = allItems.filter(item => 
    item.objectname.toLowerCase().includes(search) ||
    item.body.toLowerCase().includes(search)
  );
  sortItems();
}

function sortItems() {
  const sortBy = document.getElementById('sortSelect').value;
  
  if (sortBy === 'postdate-desc') {
    displayedItems.sort((a, b) => new Date(b.postdate) - new Date(a.postdate));
  } else if (sortBy === 'postdate-asc') {
    displayedItems.sort((a, b) => new Date(a.postdate) - new Date(b.postdate));
  } else if (sortBy === 'name') {
    displayedItems.sort((a, b) => a.objectname.localeCompare(b.objectname));
  } else if (sortBy === 'rating-desc') {
    displayedItems.sort((a, b) => b.rating - a.rating);
  }
  
  renderItems();
}

function renderItems() {
  const container = document.getElementById('itemsSection');
  container.innerHTML = '';
  
  displayedItems.forEach(item => {
    const card = document.createElement('div');
    card.className = 'game-card bg-white rounded-xl shadow-sm border border-slate-100 p-4 cursor-pointer';
    card.onclick = () => window.open(`https://boardgamegeek.com/boardgame/${item.objectid}`, '_blank');
    
    const isLoaded = item.loaded || !isLoading;
    const dateStr = item.postdate ? new Date(item.postdate).toLocaleDateString() : 'N/A';
    
    card.innerHTML = `
      <div class="flex gap-4">
        <img 
          src="/api/image-proxy?url=${encodeURIComponent(item.thumb)}" 
          alt="${item.objectname}"
          class="w-20 h-20 rounded-lg object-cover bg-slate-200 flex-shrink-0"
          onerror="this.style.display='none'"
        >
        <div class="flex-1 min-w-0">
          <h3 class="font-bold text-slate-900 mb-1">${item.objectname}</h3>
          <div class="text-xs text-slate-500 mb-2 space-y-0.5">
            <div><span class="font-semibold">Type:</span> ${item.objecttype}</div>
            <div><span class="font-semibold">Added by:</span> ${item.username}</div>
            <div><span class="font-semibold">Date:</span> ${dateStr}</div>
            ${item.year ? `<div><span class="font-semibold">Year:</span> ${item.year}</div>` : ''}
          </div>
          <div class="flex flex-wrap gap-2">
            ${isLoaded ? `
              ${item.rating > 0 ? `
                <div class="bg-amber-50 border border-amber-200 text-amber-700 px-2 py-1 rounded text-xs font-bold">
                  ⭐ ${item.rating.toFixed(1)}
                </div>
              ` : ''}
              ${item.body ? `
                <div class="bg-blue-50 border border-blue-200 text-blue-700 px-2 py-1 rounded text-xs font-bold">
                  📝 ${item.body.substring(0, 50)}${item.body.length > 50 ? '...' : ''}
                </div>
              ` : ''}
            ` : `
              <div class="skeleton bg-slate-200 h-6 w-16 rounded"></div>
            `}
          </div>
        </div>
      </div>
    `;
    
    container.appendChild(card);
  });
}

async function fetchAPI(endpoint, id, queryParams = '') {
  let url;
  if (endpoint === 'geeklist') {
    url = `/api/bgg-helper?endpoint=${endpoint}&id=${encodeURIComponent(id)}${queryParams}`;
  } else {
    url = `/api/bgg-helper?endpoint=${endpoint}&id=${encodeURIComponent(id)}${queryParams}`;
  }
  
  for (let attempt = 0; attempt < 5; attempt++) {
    let res;
    try {
      res = await fetch(url);
    } catch (e) {
      await wait(1500 * Math.pow(2, attempt));
      continue;
    }
    if (res.status === 202) {
      await wait(3000);
      continue;
    }
    if (res.ok) {
      return await res.text();
    }
    await wait(2000);
  }
  throw new Error('Failed to fetch from BGG API');
}

function wait(ms) {
  return new Promise(r => setTimeout(r, ms));
}
</script>
<!-- Vercel Web Analytics -->
<script type="module" src="analytics-init.js"></script>
</body>

<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-gradient-to-r from-blue-600 to-purple-600 text-white sticky top-0 z-40 shadow-lg">
        <div class="max-w-2xl mx-auto px-4 py-4">
            <h1 class="text-2xl md:text-3xl font-bold">📋 Geeklist Viewer</h1>
            <p class="text-sm opacity-90 mt-1">Find games from your favorite lists</p>
        </div>
    </header>

    <!-- Input Section -->
    <div class="max-w-2xl mx-auto px-4 py-4">
        <div class="bg-white rounded-xl shadow-md p-4 md:p-6">
            <label for="geeklistIdInput" class="block text-sm font-semibold text-gray-700 mb-2">Geeklist ID</label>
            <div class="flex gap-2">
                <input 
                    id="geeklistIdInput" 
                    type="number" 
                    min="1" 
                    placeholder="e.g. 11205"
                    class="flex-1 px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none text-base transition"
                >
                <button 
                    id="loadGeeklistBtn"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition shadow-md active:scale-95"
                >
                    🔍
                </button>
            </div>
        </div>

        <!-- Sort Controls -->
        <div id="sortControls" class="hidden mt-4 bg-white rounded-xl shadow-md p-4">
            <label for="sortSelect" class="block text-sm font-semibold text-gray-700 mb-2">Sort by</label>
            <select 
                id="sortSelect"
                class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none transition"
            >
                <option value="original">📌 Original Order</option>
                <option value="postdate-asc">🕐 Oldest First</option>
                <option value="postdate-desc">🕐 Newest First</option>
                <option value="name-asc">🔤 A → Z</option>
                <option value="name-desc">🔤 Z → A</option>
            </select>
        </div>
    </div>

    <!-- Games Grid -->
    <div class="max-w-2xl mx-auto px-4 py-4">
        <div id="gamesCardWrapper" class="text-center py-12 text-gray-500">
            <p class="text-lg">Enter a Geeklist ID and tap Load to begin</p>
        </div>
        <div id="gamesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="sticky top-0 bg-gradient-to-r from-blue-600 to-purple-600 text-white p-4 flex justify-between items-center shadow-lg">
                <h2 class="text-xl font-bold">Details</h2>
                <button onclick="closeDetailModal()" class="text-2xl hover:opacity-80 transition">✕</button>
            </div>
            <div class="p-4">
                <pre id="detailContent" class="text-xs bg-gray-100 p-4 rounded-lg overflow-x-auto max-h-96 text-gray-700 font-mono"></pre>
            </div>
            <div class="p-4 border-t bg-gray-50">
                <button onclick="closeDetailModal()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition">
                    Close
                </button>
            </div>
        </div>
    </div>

    <script>
    let userCollection = new Set();
    let userWantToPlay = new Set();
    let userWantToBuy = new Set();
    let userWantInTrade = new Set();
    let userPrevOwned = new Set();
    let userTradingAway = new Set();
    let geeklistData = [];
    
    async function fetchWithRetry(url, maxRetries = 3) {
        for (let attempt = 1; attempt <= maxRetries; attempt++) {
            try {
                const resp = await fetch(url);
                // If 502 (Bad Gateway), retry with delay
                if (resp.status === 502) {
                    if (attempt < maxRetries) {
                        const delay = 1000 * attempt; // 1s, 2s, 3s
                        console.log(`502 error, retrying in ${delay}ms...`);
                        await new Promise(r => setTimeout(r, delay));
                        continue;
                    } else {
                        throw new Error('Service temporarily unavailable (502)');
                    }
                }
                if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
                return resp;
            } catch (error) {
                if (attempt === maxRetries) throw error;
                const delay = 1000 * attempt;
                console.log(`Fetch failed: ${error.message}, retrying in ${delay}ms...`);
                await new Promise(r => setTimeout(r, delay));
            }
        }
    }

    async function fetchUserCollections() {
        const collections = [
            { param: 'own=1', set: 'userCollection' },
            { param: 'wanttoplay=1', set: 'userWantToPlay' },
            { param: 'wanttobuy=1', set: 'userWantToBuy' },
            { param: 'wantintrade=1', set: 'userWantInTrade' },
            { param: 'prevowned=1', set: 'userPrevOwned' },
            { param: 'fortrade=1', set: 'userTradingAway' }
        ];
        
        for (const { param, set } of collections) {
            try {
                const resp = await fetchWithRetry(`/api/bgg-helper?endpoint=collection&username=sportomax&${param}`);
                const xml = await resp.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(xml, 'text/xml');
                const items = Array.from(doc.querySelectorAll('item'));
                window[set] = new Set(items.map(i => i.getAttribute('objectid')));
            } catch (e) {
                console.log(`Failed to fetch ${set}: ${e.message}`);
            }
        }
    }
    
    function getStatusEmoji(objectId) {
        if (!objectId) return '';
        const statusMap = {
            userCollection: '✅',
            userWantToPlay: '🎮',
            userWantToBuy: '🛒',
            userWantInTrade: '🔄',
            userPrevOwned: '⏪',
            userTradingAway: '📤'
        };
        
        for (const [set, emoji] of Object.entries(statusMap)) {
            if (window[set].has(objectId)) return emoji;
        }
        return '';
    }

    function closeDetailModal() {
        document.getElementById('detailModal').classList.remove('active');
    }

    function showDetailModal(xmlString) {
        document.getElementById('detailContent').textContent = xmlString;
        document.getElementById('detailModal').classList.add('active');
    }

    async function fetchThingDetails(objectId) {
        if (!objectId) return {};
        try {
            const resp = await fetchWithRetry(`/api/bgg-helper?endpoint=thing&id=${objectId}`, 2);
            const xml = await resp.text();
            const parser = new DOMParser();
            const doc = parser.parseFromString(xml, 'text/xml');
            const thumb = doc.querySelector('thumbnail');
            const year = doc.querySelector('yearpublished');
            const desc = doc.querySelector('description');
            return {
                thumbnail: thumb ? thumb.textContent : '',
                year: year ? year.textContent : '',
                description: desc ? desc.textContent : ''
            };
        } catch (e) {
            console.log(`Failed to fetch details for ${objectId}`);
            return {};
        }
    }

    function sortGeeklistData(sortType) {
        let sorted = [...geeklistData];
        
        if (sortType === 'postdate-asc') {
            sorted.sort((a, b) => new Date(a.postdate || 0) - new Date(b.postdate || 0));
        } else if (sortType === 'postdate-desc') {
            sorted.sort((a, b) => new Date(b.postdate || 0) - new Date(a.postdate || 0));
        } else if (sortType === 'name-asc') {
            sorted.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
        } else if (sortType === 'name-desc') {
            sorted.sort((a, b) => (b.name || '').localeCompare(a.name || ''));
        }
        
        return sorted;
    }

    function renderGeeklistCards(items) {
        const gamesGrid = document.getElementById('gamesGrid');
        let html = '';
        
        for (let i = 0; i < items.length; i++) {
            const item = items[i];
            const name = item.name || 'Unknown';
            const objectType = item.objectType || '';
            const objectId = item.objectId || '';
            const username = item.username || '';
            const postdate = item.postdate || '';
            const statusEmoji = getStatusEmoji(objectId);
            
            html += `
                <div class="game-card bg-white rounded-xl shadow-md overflow-hidden relative h-full flex flex-col hover:shadow-xl transition" id="geekcard-${i}">
                    ${statusEmoji ? `<div class="status-badge">${statusEmoji}</div>` : ''}
                    <div class="relative overflow-hidden bg-gradient-to-br from-blue-300 to-purple-300 aspect-video">
                        <img src="" alt="${name}" class="game-thumb w-full h-full loading" style="display:none;">
                    </div>
                    <div class="flex-1 p-4 flex flex-col">
                        <h3 class="font-bold text-base md:text-lg text-gray-900 line-clamp-2 mb-2">${name}</h3>
                        <div class="text-xs md:text-sm text-gray-600 space-y-1 flex-1 mb-3">
                            <div><span class="font-semibold">Type:</span> ${objectType}</div>
                            <div><span class="font-semibold">ID:</span> ${objectId}</div>
                            <div><span class="font-semibold">Added:</span> ${username}</div>
                            ${postdate ? `<div><span class="font-semibold">Date:</span> ${new Date(postdate).toLocaleDateString()}</div>` : ''}
                        </div>
                        <div class="flex gap-2">
                            ${objectId ? `<a href="https://boardgamegeek.com/boardgame/${objectId}" target="_blank" class="flex-1 text-center bg-blue-500 hover:bg-blue-600 text-white text-xs font-bold py-2 rounded-lg transition">BGG</a>` : ''}
                            <button onclick="showDetailModal('${item.xmlData.replace(/'/g, "\\'")}')" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs font-bold py-2 rounded-lg transition">XML</button>
                        </div>
                    </div>
                </div>
            `;
        }
        
        gamesGrid.innerHTML = html;
        
        // Fetch thumbnails/details asynchronously
        items.forEach((item, i) => {
            if (item.objectType === 'thing' && item.objectId) {
                fetchThingDetails(item.objectId).then(details => {
                    const card = document.getElementById(`geekcard-${i}`);
                    if (card && details.thumbnail) {
                        const img = card.querySelector('.game-thumb');
                        if (img) {
                            img.src = details.thumbnail;
                            img.style.display = 'block';
                        }
                    }
                });
            }
        });
    }

    async function fetchGeeklist(geeklistId) {
        const gamesCardWrapper = document.getElementById('gamesCardWrapper');
        const gamesGrid = document.getElementById('gamesGrid');
        
        gamesCardWrapper.innerHTML = '<p class="text-lg text-gray-500 py-8">Loading Geeklist and your collection...</p>';
        gamesGrid.innerHTML = '';
        
        // Fetch user collections first
        await fetchUserCollections();
        
        try {
            const resp = await fetchWithRetry(`/api/bgg-helper?endpoint=geeklist&id=${geeklistId}`);
            const xml = await resp.text();
            const parser = new DOMParser();
            const doc = parser.parseFromString(xml, 'text/xml');
            const items = Array.from(doc.querySelectorAll('item'));
            
            if (items.length === 0) {
                gamesCardWrapper.innerHTML = '<p class="text-lg text-gray-500 py-8">No items found in this Geeklist</p>';
                document.getElementById('sortControls').classList.add('hidden');
                return;
            }
            
            gamesCardWrapper.innerHTML = '';
            
            // Store data for sorting
            geeklistData = items.map((item, index) => ({
                name: item.getAttribute('objectname') || 'Unknown',
                objectType: item.getAttribute('objecttype') || '',
                objectId: item.getAttribute('objectid') || '',
                username: item.getAttribute('username') || '',
                postdate: item.getAttribute('postdate') || '',
                originalIndex: index,
                xmlData: item.outerHTML
            }));
            
            // Show sort controls and render
            document.getElementById('sortControls').classList.remove('hidden');
            renderGeeklistCards(geeklistData);
            
        } catch (e) {
            gamesCardWrapper.innerHTML = `<p class="text-lg text-red-600 py-8">Error: ${e.message}</p>`;
            document.getElementById('sortControls').classList.add('hidden');
        }
    }
    
    document.getElementById('loadGeeklistBtn').onclick = () => {
        const geeklistId = document.getElementById('geeklistIdInput').value.trim();
        if (!geeklistId || isNaN(geeklistId) || parseInt(geeklistId) < 1) {
            alert('Please enter a valid Geeklist ID.');
            return;
        }
        fetchGeeklist(geeklistId);
    };

    document.getElementById('sortSelect').onchange = (e) => {
        const sortedData = sortGeeklistData(e.target.value);
        renderGeeklistCards(sortedData);
    };

    document.getElementById('detailModal').onclick = (e) => {
        if (e.target === document.getElementById('detailModal')) {
            closeDetailModal();
        }
    };
    </script>
    <!-- Vercel Web Analytics -->
    <script type="module" src="analytics-init.js"></script>

</body>
</html>
