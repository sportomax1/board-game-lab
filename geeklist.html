<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <title>BGG Geeklist Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f7f7fa;
            color: #222;
        }
        .container {
            max-width: 430px;
            margin: 0 auto;
            padding: 2em 1em 1em 1em;
            box-sizing: border-box;
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom);
        }
        h1 {
            font-size: 1.7em;
            margin-bottom: 1em;
            text-align: center;
        }
        .game-list {
            margin-top: 1em;
        }
        .game-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px #0001;
            margin-bottom: 1em;
            padding: 1em 1.2em;
            display: flex;
            flex-direction: row;
            align-items: center;
            position: relative;
        }
        .status-emoji {
            position: absolute;
            top: 0.5em;
            right: 0.5em;
            font-size: 1.2em;
            z-index: 1;
        }
        .game-thumb {
            width: 64px;
            height: 64px;
            border-radius: 10px;
            margin-right: 1em;
            object-fit: cover;
            flex-shrink: 0;
        }
        .game-info {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .game-title {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 0.2em;
        }
        .game-details {
            font-size: 0.98em;
            color: #555;
        }
        #geeklistPrompt {
            margin-bottom: 1.5em;
            text-align: center;
        }
        #geeklistIdInput {
            font-size: 1.1em;
            padding: 0.5em 1em;
            border-radius: 8px;
            border: 1px solid #bbb;
            width: 60%;
            max-width: 180px;
        }
        #loadGeeklistBtn {
            background: #1976d2;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.7em 2em;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            margin-left: 1em;
        }
    </style>
</head>
<body>
    <a id="homeBtn" href="index.html" style="position:fixed; left:calc(50vw - 215px); top:24px; z-index:999; background:#1976d2; color:#fff; border:none; border-radius:50%; width:54px; height:54px; font-size:2em; box-shadow:0 2px 12px #0002; display:flex; align-items:center; justify-content:center; max-width:430px; text-decoration:none;">
        <span style="display:flex; align-items:center; justify-content:center; width:100%; height:100%;"><svg width="32" height="32" viewBox="0 0 32 32" style="display:block; margin:auto;" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="16" cy="16" r="16" fill="#1976d2"/><path d="M20 10L12 16L20 22" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </a>
    <div class="container">
        <h1>BGG Geeklist Viewer</h1>
        <div id="geeklistPrompt">
            <label for="geeklistIdInput" style="font-size:1.1em;">Enter Geeklist ID:</label>
            <input id="geeklistIdInput" type="number" min="1" placeholder="e.g. 11205">
            <button id="loadGeeklistBtn">Load Geeklist</button>
        </div>
        
        <!-- Sort Controls -->
        <div id="sortControls" style="display:none; margin-bottom:1.5em; text-align:center; gap:1em;">
            <label for="sortSelect" style="font-size:1em; font-weight:600;">Sort by:</label>
            <select id="sortSelect" style="padding:0.5em; border-radius:8px; border:1px solid #bbb; font-size:1em;">
                <option value="original">Original Order</option>
                <option value="postdate-asc">Post Date (Oldest First)</option>
                <option value="postdate-desc">Post Date (Newest First)</option>
                <option value="name-asc">Name (A-Z)</option>
                <option value="name-desc">Name (Z-A)</option>
            </select>
        </div>

        <div id="gamesCardWrapper">
            <div style="text-align:center; color:#888; font-size:1.1em;">Enter a Geeklist ID above and click Load.</div>
        </div>

        <!-- Detail Modal -->
        <div id="detailModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:1000; overflow-y:auto;">
            <div style="background:#fff; margin:2em 1em; padding:1.5em; border-radius:12px; max-width:600px; margin-left:auto; margin-right:auto;">
                <h2 style="margin-top:0;">Full Details</h2>
                <pre id="detailContent" style="white-space:pre-wrap; word-wrap:break-word; font-size:0.9em; max-height:70vh; overflow-y:auto; background:#f5f5f5; padding:1em; border-radius:8px;"></pre>
                <button onclick="document.getElementById('detailModal').style.display='none'" style="background:#1976d2; color:#fff; border:none; padding:0.7em 2em; border-radius:8px; font-size:1em; cursor:pointer; margin-top:1em; width:100%;">Close</button>
            </div>
        </div>
    <script>
    // User collection tracking
    let userCollection = new Set();
    let userWantToPlay = new Set();
    let userWantToBuy = new Set();
    let userWantInTrade = new Set();
    let userPrevOwned = new Set();
    let userTradingAway = new Set();
    let geeklistData = []; // Store original data for sorting
    
    async function fetchUserCollections() {
        // Fetch user's collection
        try {
            const resp = await fetch('/api/bgg-helper?endpoint=collection&username=sportomax&own=1');
            if (resp.ok) {
                const xml = await resp.text();
                const parser = new window.DOMParser();
                const doc = parser.parseFromString(xml, 'text/xml');
                const items = Array.from(doc.querySelectorAll('item'));
                userCollection = new Set(items.map(i => i.getAttribute('objectid')));
            }
        } catch {}
        // Fetch user's want to play
        try {
            const resp = await fetch('/api/bgg-helper?endpoint=collection&username=sportomax&wanttoplay=1');
            if (resp.ok) {
                const xml = await resp.text();
                const parser = new window.DOMParser();
                const doc = parser.parseFromString(xml, 'text/xml');
                const items = Array.from(doc.querySelectorAll('item'));
                userWantToPlay = new Set(items.map(i => i.getAttribute('objectid')));
            }
        } catch {}
        // Fetch user's want to buy
        try {
            const resp = await fetch('/api/bgg-helper?endpoint=collection&username=sportomax&wanttobuy=1');
            if (resp.ok) {
                const xml = await resp.text();
                const parser = new window.DOMParser();
                const doc = parser.parseFromString(xml, 'text/xml');
                const items = Array.from(doc.querySelectorAll('item'));
                userWantToBuy = new Set(items.map(i => i.getAttribute('objectid')));
            }
        } catch {}
        // Fetch user's want in trade
        try {
            const resp = await fetch('/api/bgg-helper?endpoint=collection&username=sportomax&wantintrade=1');
            if (resp.ok) {
                const xml = await resp.text();
                const parser = new window.DOMParser();
                const doc = parser.parseFromString(xml, 'text/xml');
                const items = Array.from(doc.querySelectorAll('item'));
                userWantInTrade = new Set(items.map(i => i.getAttribute('objectid')));
            }
        } catch {}
        // Fetch user's previously owned
        try {
            const resp = await fetch('/api/bgg-helper?endpoint=collection&username=sportomax&prevowned=1');
            if (resp.ok) {
                const xml = await resp.text();
                const parser = new window.DOMParser();
                const doc = parser.parseFromString(xml, 'text/xml');
                const items = Array.from(doc.querySelectorAll('item'));
                userPrevOwned = new Set(items.map(i => i.getAttribute('objectid')));
            }
        } catch {}
        // Fetch user's trading away
        try {
            const resp = await fetch('/api/bgg-helper?endpoint=collection&username=sportomax&fortrade=1');
            if (resp.ok) {
                const xml = await resp.text();
                const parser = new window.DOMParser();
                const doc = parser.parseFromString(xml, 'text/xml');
                const items = Array.from(doc.querySelectorAll('item'));
                userTradingAway = new Set(items.map(i => i.getAttribute('objectid')));
            }
        } catch {}
    }
    
    function getStatusEmoji(objectId) {
        if (!objectId) return '';
        if (userCollection.has(objectId)) return '✅';
        if (userWantToPlay.has(objectId)) return '🎮';
        if (userWantToBuy.has(objectId)) return '🛒';
        if (userWantInTrade.has(objectId)) return '🔄';
        if (userPrevOwned.has(objectId)) return '⏪';
        if (userTradingAway.has(objectId)) return '📤';
        return '';
    }

    function showDetailModal(xmlString) {
        document.getElementById('detailContent').textContent = xmlString;
        document.getElementById('detailModal').style.display = 'block';
    }

    async function fetchThingDetails(objectId) {
        if (!objectId) return {};
        try {
            const resp = await fetch(`/api/bgg-helper?endpoint=thing&id=${objectId}`);
            if (!resp.ok) return {};
            const xml = await resp.text();
            const parser = new window.DOMParser();
            const doc = parser.parseFromString(xml, 'text/xml');
            const thumb = doc.querySelector('thumbnail');
            const year = doc.querySelector('yearpublished');
            const desc = doc.querySelector('description');
            return {
                thumbnail: thumb ? thumb.textContent : '',
                year: year ? year.textContent : '',
                description: desc ? desc.textContent : ''
            };
        } catch {
            return {};
        }
    }

    function sortGeeklistData(sortType) {
        let sorted = [...geeklistData];
        
        if (sortType === 'postdate-asc') {
            sorted.sort((a, b) => new Date(a.postdate || 0) - new Date(b.postdate || 0));
        } else if (sortType === 'postdate-desc') {
            sorted.sort((a, b) => new Date(b.postdate || 0) - new Date(a.postdate || 0));
        } else if (sortType === 'name-asc') {
            sorted.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
        } else if (sortType === 'name-desc') {
            sorted.sort((a, b) => (b.name || '').localeCompare(a.name || ''));
        }
        
        return sorted;
    }

    function renderGeeklistCards(items) {
        const gamesCardWrapper = document.getElementById('gamesCardWrapper');
        let html = '';
        
        for (let i = 0; i < items.length; i++) {
            const item = items[i];
            const name = item.name || 'Unknown';
            const objectType = item.objectType || '';
            const objectId = item.objectId || '';
            const username = item.username || '';
            const postdate = item.postdate || '';
            const statusEmoji = getStatusEmoji(objectId);
            
            html += `<div class='game-card' id='geekcard-${i}'>
                ${statusEmoji ? `<div class='status-emoji'>${statusEmoji}</div>` : ''}
                <img src='' alt='' class='game-thumb' style='width:64px; height:64px; border-radius:10px; margin-right:1em; object-fit:cover; display:none;'>
                <div class='game-info'>
                    <div class='game-title'>#${i + 1} ${name}</div>
                    <div class='game-details'>
                        <b>Type:</b> ${objectType}<br>
                        <b>BGG ID:</b> ${objectId}<br>
                        <b>Added by:</b> ${username}<br>
                        ${postdate ? `<b>Posted:</b> ${new Date(postdate).toLocaleDateString()}<br>` : ''}
                        ${objectId ? `<a href='https://boardgamegeek.com/boardgame/${objectId}' target='_blank' style='color:#1976d2;'>View on BGG</a>` : ''}
                    </div>
                    <button onclick="showDetailModal('${item.xmlData.replace(/'/g, "\\'")}'" style="background:#1976d2; color:#fff; border:none; padding:0.5em 1em; border-radius:6px; margin-top:0.5em; cursor:pointer; font-size:0.9em;">📋 Details</button>
                </div>
            </div>`;
        }
        
        gamesCardWrapper.innerHTML = html;
        
        // Fetch thumbnails/details asynchronously
        items.forEach((item, i) => {
            if (item.objectType === 'thing' && item.objectId) {
                fetchThingDetails(item.objectId).then(details => {
                    const card = document.getElementById(`geekcard-${i}`);
                    if (card && details.thumbnail) {
                        const img = card.querySelector('.game-thumb');
                        if (img) {
                            img.src = details.thumbnail;
                            img.alt = `${item.name || 'Game'} thumbnail`;
                            img.style.display = 'block';
                        }
                    }
                    if (card && details.year) {
                        const info = card.querySelector('.game-details');
                        if (info) {
                            info.innerHTML += `<b>Year:</b> ${details.year}<br>`;
                        }
                    }
                    if (card && details.description) {
                        const info = card.querySelector('.game-details');
                        if (info) {
                            info.innerHTML += `<span style='color:#888; font-size:0.95em;'>${details.description.substring(0,120)}${details.description.length>120?'...':''}</span><br>`;
                        }
                    }
                });
            }
        });
    }

    async function fetchGeeklist(geeklistId) {
        const gamesCardWrapper = document.getElementById('gamesCardWrapper');
        gamesCardWrapper.innerHTML = '<div style="text-align:center; color:#888; font-size:1.1em;">Loading Geeklist and User Collections...</div>';
        
        // Fetch user collections first
        await fetchUserCollections();
        
        try {
            const resp = await fetch(`/api/bgg-helper?endpoint=geeklist&id=${geeklistId}`);
            if (!resp.ok) throw new Error('Failed to fetch Geeklist');
            const xml = await resp.text();
            const parser = new window.DOMParser();
            const doc = parser.parseFromString(xml, 'text/xml');
            const items = Array.from(doc.querySelectorAll('item'));
            
            if (items.length === 0) {
                gamesCardWrapper.innerHTML = '<div style="text-align:center; color:#888;">No items found in this Geeklist.</div>';
                document.getElementById('sortControls').style.display = 'none';
                return;
            }
            
            // Store data for sorting
            geeklistData = items.map((item, index) => ({
                name: item.getAttribute('objectname') || 'Unknown',
                objectType: item.getAttribute('objecttype') || '',
                objectId: item.getAttribute('objectid') || '',
                username: item.getAttribute('username') || '',
                postdate: item.getAttribute('postdate') || '',
                originalIndex: index,
                xmlData: item.outerHTML
            }));
            
            // Show sort controls and render
            document.getElementById('sortControls').style.display = 'block';
            renderGeeklistCards(geeklistData);
            
        } catch (e) {
            gamesCardWrapper.innerHTML = `<div style='text-align:center; color:#c00;'>Error: ${e.message}</div>`;
            document.getElementById('sortControls').style.display = 'none';
        }
    }
    
    document.getElementById('loadGeeklistBtn').onclick = () => {
        const geeklistId = document.getElementById('geeklistIdInput').value.trim();
        if (!geeklistId || isNaN(geeklistId) || parseInt(geeklistId) < 1) {
            alert('Please enter a valid Geeklist ID.');
            return;
        }
        fetchGeeklist(geeklistId);
    };

    // Sort select handler
    document.getElementById('sortSelect').onchange = (e) => {
        const sortedData = sortGeeklistData(e.target.value);
        renderGeeklistCards(sortedData);
    };

    // Close detail modal on outside click
    document.getElementById('detailModal').onclick = (e) => {
        if (e.target === document.getElementById('detailModal')) {
            document.getElementById('detailModal').style.display = 'none';
        }
    };
    </script>
</body>
</html>
