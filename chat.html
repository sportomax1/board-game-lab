<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Pro — Sports & Games Console</title>
    <!-- Modern Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #18181b; /* Zinc 900 */
            --accent: #6366f1;  /* Indigo 500 */
            --bg-main: #ffffff;
            --bg-subtle: #fafafa;
            --text-main: #09090b;
            --text-muted: #71717a;
            --border: #e4e4e7;
            --radius: 0.75rem;
            --shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Full Screen Layout */
        .app-header {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.625rem;
            font-weight: 600;
            font-size: 1.125rem;
            letter-spacing: -0.02em;
            color: var(--primary);
        }

        .actions { display: flex; gap: 0.75rem; align-items: center; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.875rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 1px solid var(--border);
            background: white;
            color: var(--text-main);
        }

        .btn:hover { background: var(--bg-subtle); border-color: #d4d4d8; }
        .btn-primary { background: var(--primary); color: white; border: none; }
        .btn-primary:hover { background: #27272a; }
        .btn-ghost { border: none; background: transparent; color: var(--text-muted); padding: 0.4rem; }
        .btn-ghost:hover { background: var(--bg-subtle); color: var(--text-main); }

        /* Status */
        .status-badge {
            font-size: 0.75rem;
            font-weight: 500;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #d4d4d8; }
        .status-online .status-dot { background: #10b981; }

        /* Full Screen Chat Area */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 2rem 4rem; /* Wide padding for full-screen feel */
            display: flex;
            flex-direction: column;
            gap: 2rem;
            width: 100%;
            max-width: 1400px; /* Limit ultra-wide but allow plenty of room */
            margin: 0 auto;
            scrollbar-width: thin;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 90%;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .message-user { align-self: flex-end; }
        .message-ai { align-self: flex-start; }

        .bubble {
            padding: 1.25rem 1.5rem;
            border-radius: var(--radius);
            font-size: 0.9375rem;
            line-height: 1.6;
        }

        .message-user .bubble {
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 0;
        }

        .message-ai .bubble {
            background: var(--bg-subtle);
            color: var(--text-main);
            border-bottom-left-radius: 0;
            border: 1px solid var(--border);
        }

        .message-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.625rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        /* Typography Refactor */
        .prose strong { color: var(--primary); font-weight: 600; }
        .prose p { margin-bottom: 1rem; }
        .prose ul { margin: 1rem 0 1rem 1.5rem; }
        .prose li { margin-bottom: 0.5rem; }
        .prose table { border: 1px solid var(--border); border-radius: 0.5rem; overflow: hidden; margin: 1.5rem 0; }
        .prose th { background: var(--bg-subtle); border-bottom: 1px solid var(--border); font-weight: 600; padding: 0.75rem; }
        .prose td { border-bottom: 1px solid var(--border); padding: 0.75rem; }
        .prose img { max-width: 120px; height: auto; border-radius: 0.375rem; border: 1px solid var(--border); margin: 0.25rem 0; display: block; }

        /* Full Screen Footer */
        .app-footer {
            background: white;
            border-top: 1px solid var(--border);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: center;
        }

        .input-wrapper {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .suggestions {
            display: flex;
            gap: 0.625rem;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .suggestion-chip {
            white-space: nowrap;
            padding: 0.4rem 0.9rem;
            background: white;
            border: 1px solid var(--border);
            border-radius: 2rem;
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .suggestion-chip:hover { border-color: #a1a1aa; color: var(--text-main); background: var(--bg-subtle); }

        .chat-form {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: 1rem 1.5rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--bg-subtle);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
        }
        .chat-input:focus {
            border-color: #a1a1aa;
            background: white;
            box-shadow: 0 0 0 2px rgba(24, 24, 27, 0.05);
        }

        .send-btn {
            padding: 0.875rem 1.5rem;
            border-radius: var(--radius);
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: opacity 0.2s;
        }
        .send-btn:hover { opacity: 0.9; }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Right Side Data Browser Drawer */
        #data-browser {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 500px;
            background: white;
            box-shadow: -1px 0 0 0 var(--border);
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            display: flex;
            flex-direction: column;
        }
        #data-browser.open { transform: translateX(0); }

        .drawer-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-subtle);
        }

        .drawer-content { flex: 1; overflow-y: auto; padding: 1.5rem; }

        #debug-panel {
            background: #09090b;
            color: #a1a1aa;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 11px;
            padding: 1rem 2rem;
            max-height: 250px;
            overflow-y: auto;
            border-top: 1px solid #27272a;
            display: none;
        }

        @media (max-width: 768px) {
            .chat-container { padding: 1rem; }
            .app-header { padding: 0.75rem 1rem; }
            #data-browser { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <div class="brand">
            <i data-lucide="bot"></i>
            <span>Gemini Pro</span>
        </div>
        
        <div class="actions">
            <div id="status-container" class="status-badge">
                <div class="status-dot"></div>
                <span id="status-text">Ready</span>
            </div>
            <button class="btn btn-secondary" onclick="newConversation()">
                <i data-lucide="plus" size="16"></i> New
            </button>
            <button class="btn btn-secondary" onclick="toggleDataBrowser()">
                <i data-lucide="database" size="16"></i> Data
            </button>
            <button class="btn btn-ghost" onclick="toggleDebug()">
                <i data-lucide="terminal" size="16"></i>
            </button>
        </div>
    </header>

    <!-- Debug Panel -->
    <div id="debug-panel"></div>

    <!-- Main Chat -->
    <main id="chat-window" class="chat-container"></main>

    <!-- Data Browser -->
    <div id="data-browser">
        <div class="drawer-header">
            <h3 style="display: flex; align-items: center; gap: 0.5rem;">
                <i data-lucide="database" size="20"></i> Database
            </h3>
            <button class="btn btn-ghost" onclick="toggleDataBrowser()">
                <i data-lucide="x" size="20"></i>
            </button>
        </div>
        <div class="drawer-content">
            <div id="table-list" style="display: flex; flex-direction: column; gap: 0.5rem;"></div>
            <div id="table-view" style="display:none;">
                <button class="btn btn-secondary" onclick="backToTableList()" style="margin-bottom: 1rem;">
                    <i data-lucide="arrow-left" size="14"></i> Back
                </button>
                <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
                    <input type="text" id="search-input" class="chat-input" style="padding: 0.5rem 1rem; border-radius: 0.5rem;" placeholder="Search records...">
                    <button class="btn btn-primary" onclick="searchTable()"><i data-lucide="search" size="14"></i></button>
                </div>
                <div style="overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-md);">
                    <table id="data-table" style="width: 100%; font-size: 12px; border-collapse: collapse;"></table>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="app-footer">
        <div class="input-wrapper">
            <div id="suggestions-container" class="suggestions"></div>
            
            <form id="chat-form" class="chat-form">
                <input type="text" id="user-input" class="chat-input" autocomplete="off" 
                    placeholder="Ask about sports, games, or your data...">
                <button type="submit" id="send-btn" class="send-btn">
                    <i data-lucide="send" size="20"></i>
                </button>
            </form>
        </div>
    </footer>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Constants & State
        const chatWindow = document.getElementById('chat-window');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const debugPanel = document.getElementById('debug-panel');
        const statusText = document.getElementById('status-text');
        const statusContainer = document.getElementById('status-container');
        const suggestionsContainer = document.getElementById('suggestions-container');

        let currentConversationId = 'conv_' + Date.now();
        let conversationMessages = [];
        let userMessageHistory = []; // Track history for arrow navigation
        let historyIndex = -1;
        let lastTopic = 'general';
        let requestCounter = 0;
        let lastUserMessage = '';

        const suggestionsDb = {
            general: ["Show all tables 📋", "Visualize user data 📊", "Summary of products 📈", "Search records 🔍"]
        };

        // Utility: Status Updates
        function setStatus(text, type = 'idle') {
            statusText.textContent = text;
            statusContainer.className = `status-badge ${type === 'busy' ? 'status-online' : ''}`;
            if (type === 'error') statusContainer.style.background = '#fee2e2';
            else statusContainer.style.background = '#f1f5f9';
        }

        // Utility: Debug Logging
        function dbg(type, ...parts) {
            const entry = document.createElement('div');
            entry.className = `dbg-entry dbg-${type}`;
            const ts = new Date().toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            entry.innerHTML = `<span style="opacity: 0.5;">[${ts}]</span> ${parts.join(' ')}`;
            debugPanel.appendChild(entry);
            debugPanel.scrollTop = debugPanel.scrollHeight;
            console.log(`[${type}]`, ...parts);
        }

        function toggleDebug() {
            debugPanel.classList.toggle('visible');
        }

        // Topic Detection
        function detectTopic(text) {
            return 'general';
        }

        function showSuggestions(topic = 'general') {
            lastTopic = topic;
            const items = suggestionsDb[topic] || suggestionsDb.general;
            suggestionsContainer.innerHTML = '';
            items.forEach(text => {
                const chip = document.createElement('div');
                chip.className = 'suggestion-chip';
                chip.textContent = text;
                chip.onclick = () => {
                    userInput.value = text;
                    chatForm.dispatchEvent(new Event('submit'));
                };
                suggestionsContainer.appendChild(chip);
            });
        }

        // UI: Append Message
        function appendMessage(text, isUser = false, meta = {}) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'message-user' : 'message-ai'}`;

            const bubble = document.createElement('div');
            bubble.className = `bubble ${!isUser ? 'prose' : ''}`;
            
            let html = isUser ? text : marked.parse(text);
            
            // Check for Chart JSON
            const chartRegex = /```json\s*(\{\s*"type":\s*"CHART"[\s\S]*?\})\s*```/;
            const chartMatch = text.match(chartRegex);
            
            if (chartMatch) {
                try {
                    const chartData = JSON.parse(chartMatch[1]);
                    const canvasId = 'chart-' + Date.now();
                    html = html.replace(chartRegex, `<div style="width:100%; max-width:400px; margin:1rem 0;"><canvas id="${canvasId}"></canvas></div>`);
                    
                    setTimeout(() => {
                        const ctx = document.getElementById(canvasId);
                        new Chart(ctx, {
                            type: chartData.chartType || 'bar',
                            data: {
                                labels: chartData.data.map(d => d.label),
                                datasets: [{
                                    label: chartData.label || 'Data',
                                    data: chartData.data.map(d => d.value),
                                    backgroundColor: [
                                        'rgba(79, 70, 229, 0.6)',
                                        'rgba(16, 185, 129, 0.6)',
                                        'rgba(245, 158, 11, 0.6)',
                                        'rgba(239, 68, 68, 0.6)',
                                        'rgba(139, 92, 246, 0.6)'
                                    ],
                                    borderWidth: 1
                                }]
                            },
                            options: { responsive: true, plugins: { legend: { display: chartData.chartType === 'pie' } } }
                        });
                    }, 100);
                } catch (e) { dbg('error', 'Chart parse failed'); }
            }
            
            bubble.innerHTML = html;

            const metaDiv = document.createElement('div');
            metaDiv.className = 'message-meta';
            
            if (isUser) {
                metaDiv.innerHTML = `
                    <span>You</span>
                    <button class="btn-ghost" style="padding:0; font-size:10px; cursor:pointer" onclick="sendMessage('${text.replace(/'/g, "\\'")}')">
                        <i data-lucide="rotate-ccw" size="10" style="display:inline; vertical-align:middle"></i> Resend
                    </button>
                `;
            } else {
                metaDiv.innerHTML = `
                    <span><i data-lucide="sparkles" size="10" style="display:inline; vertical-align:middle"></i> ${meta.model || 'Gemini'}</span>
                    <span>${meta.latency ? meta.latency + 'ms' : ''}</span>
                    <button class="btn-ghost" style="padding:0; font-size:10px; cursor:pointer" onclick="resendLast()">Resend</button>
                `;
            }

            msgDiv.appendChild(bubble);
            msgDiv.appendChild(metaDiv);
            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            lucide.createIcons();
        }

        function sendMessage(msg) {
            userInput.value = msg;
            chatForm.dispatchEvent(new Event('submit'));
        }

        // Arrow Key History Navigation
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (userMessageHistory.length > 0) {
                    historyIndex = (historyIndex === -1) ? userMessageHistory.length - 1 : Math.max(0, historyIndex - 1);
                    userInput.value = userMessageHistory[historyIndex];
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex !== -1) {
                    historyIndex++;
                    if (historyIndex >= userMessageHistory.length) {
                        historyIndex = -1;
                        userInput.value = '';
                    } else {
                        userInput.value = userMessageHistory[historyIndex];
                    }
                }
            }
        });

        function resendLast() {
            if (lastUserMessage) {
                sendMessage(lastUserMessage);
            }
        }

        function newConversation() {
            chatWindow.innerHTML = '';
            conversationMessages = [];
            userMessageHistory = [];
            historyIndex = -1;
            currentConversationId = 'conv_' + Date.now();
            dbg('info', 'Starting new conversation:', currentConversationId);
            appendMessage("Welcome! I am your **Database Content Expert & Visualizer**. I can analyze your data across all tables and provide visual charts, graphs, and summaries. What should we analyze today?");
            showSuggestions('general');
        }

        // Chat Submission
        chatForm.onsubmit = async (e) => {
            e.preventDefault();
            const msg = userInput.value.trim();
            if (!msg) return;

            // Update History
            if (userMessageHistory[userMessageHistory.length - 1] !== msg) {
                userMessageHistory.push(msg);
            }
            historyIndex = -1;

            lastUserMessage = msg;
            requestCounter++;
            const rid = requestCounter;
            
            appendMessage(msg, true);
            userInput.value = '';
            sendBtn.disabled = true;
            setStatus('Thinking...', 'busy');
            dbg('info', `[#${rid}] Sending: ${msg.slice(0, 50)}...`);

            const t0 = performance.now();
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });

                const data = await res.json();
                const latency = Math.round(performance.now() - t0);

                if (res.ok) {
                    let reply = data.reply || '';
                    
                    // Handle embedded CRUD
                    const jsonMatch = reply.match(/```json\s*(\{[\s\S]*?\})\s*```/);
                    if (jsonMatch) {
                        try {
                            const op = JSON.parse(jsonMatch[1]);
                            reply = reply.replace(/```json[\s\S]*?```/, '').trim();
                            dbg('info', `Detected DB action: ${op.action} on ${op.table}`);
                            
                            const dbRes = await fetch('/api/supabase', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(op)
                            });
                            const dbData = await dbRes.json();
                            
                            if (dbData.ok && dbData.rows) {
                                reply += `\n\n**Database Results:**\n\n| ${Object.keys(dbData.rows[0]).join(' | ')} |\n| ${Object.keys(dbData.rows[0]).map(()=>'---').join(' | ')} |\n` + 
                                         dbData.rows.slice(0,10).map(r => `| ${Object.values(r).join(' | ')} |`).join('\n');
                            }
                        } catch(e) { dbg('error', 'DB Op failed:', e.message); }
                    }

                    appendMessage(reply, false, { model: data.model_used, latency });
                    setStatus('Ready');
                    showSuggestions(detectTopic(msg));
                } else {
                    throw new Error(data.reply || 'Server error');
                }
            } catch (err) {
                dbg('error', 'Request failed:', err.message);
                appendMessage(`_Sorry, I encountered an error: ${err.message}_`);
                setStatus('Error', 'error');
            } finally {
                sendBtn.disabled = false;
            }
        };

        // Data Browser Logic
        let browserOpen = false;
        let currentTable = null;

        function toggleDataBrowser() {
            browserOpen = !browserOpen;
            document.getElementById('data-browser').classList.toggle('open', browserOpen);
            if (browserOpen) loadTableList();
        }

        async function loadTableList() {
            const list = document.getElementById('table-list');
            list.innerHTML = '<div style="font-size:12px; color:#64748b">Loading tables...</div>';
            try {
                const res = await fetch('/api/supabase', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'LIST_TABLES' })
                });
                const data = await res.json();
                list.innerHTML = '';
                if (data.ok && data.tables) {
                    data.tables.forEach(t => {
                        const b = document.createElement('button');
                        b.className = 'btn btn-secondary';
                        b.style.justifyContent = 'flex-start';
                        b.innerHTML = `<i data-lucide="table" size="14"></i> ${t}`;
                        b.onclick = () => loadTabData(t);
                        list.appendChild(b);
                    });
                    lucide.createIcons();
                } else {
                    list.innerHTML = `<div style="font-size:12px; color:#ef4444">No tables found. Check SUPABASE_TABLES env.</div>`;
                }
            } catch(e) { list.innerHTML = 'Error loading tables.'; }
        }

        async function loadTabData(table) {
            currentTable = table;
            document.getElementById('table-list').style.display = 'none';
            document.getElementById('table-view').style.display = 'block';
            const tableEl = document.getElementById('data-table');
            tableEl.innerHTML = '<tr><td style="padding:1rem">Loading data...</td></tr>';
            
            try {
                const res = await fetch('/api/supabase', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'READ', table, limit: 50 })
                });
                const data = await res.json();
                displayTableRows(data.rows);
            } catch(e) { tableEl.innerHTML = 'Error loading data.'; }
        }

        function displayTableRows(rows) {
            const tableEl = document.getElementById('data-table');
            if (rows && rows.length > 0) {
                const cols = Object.keys(rows[0]);
                tableEl.innerHTML = `
                    <thead><tr style="background:#f8fafc">
                        ${cols.map(c => `<th style="padding:0.5rem; text-align:left; border-bottom:1px solid var(--border)">${c}</th>`).join('')}
                        <th style="padding:0.5rem; text-align:left; border-bottom:1px solid var(--border)">Actions</th>
                    </tr></thead>
                    <tbody>${rows.map(r => {
                        const id = r.id || Object.values(r)[0];
                        return `<tr>
                            ${cols.map(c => `<td style="padding:0.5rem; border-bottom:1px solid var(--border); color:#475569">${String(r[c]).slice(0,30)}</td>`).join('')}
                            <td style="padding:0.5rem; border-bottom:1px solid var(--border)">
                                <button class="btn-ghost" style="color:#ef4444; padding:0" onclick="deleteRecord('${currentTable}', '${id}')">
                                    <i data-lucide="trash-2" size="14"></i>
                                </button>
                            </td>
                        </tr>`;
                    }).join('')}</tbody>
                `;
                lucide.createIcons();
            } else {
                tableEl.innerHTML = '<tr><td style="padding:1rem">No records found.</td></tr>';
            }
        }

        async function searchTable() {
            const query = document.getElementById('search-input').value.trim();
            if (!currentTable || !query) return;
            dbg('info', 'Searching table:', currentTable, 'query:', query);
            try {
                const res = await fetch('/api/supabase', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'SEARCH', table: currentTable, query: { id: query }, limit: 50 })
                });
                const data = await res.json();
                displayTableRows(data.rows);
            } catch(e) { dbg('error', 'Search failed'); }
        }

        async function deleteRecord(table, id) {
            if (!confirm(`Delete record ${id}?`)) return;
            try {
                const res = await fetch('/api/supabase', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'DELETE', table, id })
                });
                const data = await res.json();
                if (data.ok) loadTabData(table);
                else alert('Delete failed: ' + data.error);
            } catch(e) { dbg('error', 'Delete failed'); }
        }

        function backToTableList() {
            document.getElementById('table-list').style.display = 'flex';
            document.getElementById('table-view').style.display = 'none';
        }

        // Init
        dbg('ok', 'Console initialized');
        newConversation();
    </script>
</body>
</html>
