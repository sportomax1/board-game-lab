<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>BGG Stats Pro</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            background: #fff;
            position: relative;
        }
        .scrollable-content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 12px;
        }
        .status-badge {
            @apply px-1.5 py-0.5 rounded text-[9px] font-bold uppercase tracking-wider border;
        }
        .status-own { @apply bg-emerald-50 text-emerald-700 border-emerald-200; }
        .status-prevowned { @apply bg-slate-100 text-slate-600 border-slate-200; }
        .status-fortrade { @apply bg-amber-50 text-amber-700 border-amber-200; }
        .status-want { @apply bg-rose-50 text-rose-700 border-rose-200; }
        .status-wanttoplay { @apply bg-indigo-50 text-indigo-700 border-indigo-200; }
        .status-wanttobuy { @apply bg-emerald-100 text-emerald-800 border-emerald-300; }
        .status-wishlist { @apply bg-blue-50 text-blue-700 border-blue-200; }
        .status-preordered { @apply bg-purple-50 text-purple-700 border-purple-200; }
        
        .clickable-count {
            @apply cursor-pointer hover:bg-slate-100 transition-colors rounded px-2 py-1 font-bold text-slate-900;
        }
        
        /* Modal Styles */
        #gameModal {
            transition: opacity 0.2s ease-in-out;
        }
        .modal-content {
            transform: translateY(20px);
            transition: transform 0.2s ease-out;
        }
        #gameModal.active .modal-content {
            transform: translateY(0);
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .loader {
            border-top-color: #4f46e5;
            animation: spinner 0.6s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="text-slate-900">

    <div class="app-container shadow-2xl">
        <!-- Compact Header -->
        <header class="bg-white border-b border-slate-100 px-4 py-3 shrink-0">
            <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-2">
                    <div class="bg-indigo-600 p-1.5 rounded-lg shadow-lg shadow-indigo-100">
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    </div>
                    <h1 class="text-lg font-800 tracking-tight">BGG Stats</h1>
                </div>
                <div class="flex-1 max-w-[180px]">
                    <div class="relative">
                        <input type="text" id="usernameInput" value="sportomax" 
                            class="w-full pl-3 pr-8 py-1.5 bg-slate-100 border-none rounded-lg text-xs font-bold focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                        <button id="fetchBtn" class="absolute right-1 top-1 p-1 text-slate-400 hover:text-indigo-600">
                            <svg id="fetchIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            <div id="btnLoader" class="hidden w-4 h-4 border-2 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <div class="scrollable-content space-y-4">
            <div id="welcomeState" class="py-12 text-center px-6">
                <div class="text-4xl mb-4">📊</div>
                <h2 class="text-xl font-800 mb-2">Collection Analyzer</h2>
                <p class="text-xs text-slate-400 mb-6">Enter a BGG username to see a detailed breakdown of games and expansions.</p>
                <button onclick="loadStats()" class="bg-indigo-600 text-white font-bold px-8 py-3 rounded-2xl shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition-all">Start Fetching</button>
            </div>

            <div id="loadingState" class="hidden py-10 text-center">
                <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-200 h-8 w-8 mb-4 mx-auto"></div>
                <p id="loaderText" class="text-xs font-bold text-slate-600">Requesting Collection...</p>
                <p id="loaderSub" class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-2">BGG is thinking</p>
            </div>

            <div id="errorState" class="hidden py-6 text-center bg-rose-50 rounded-2xl border border-rose-100 px-4 mx-4">
                <p id="errorMsg" class="text-xs text-rose-600 font-bold"></p>
            </div>

            <div id="resultsState" class="hidden space-y-4">
                <!-- Summary Row -->
                <div class="grid grid-cols-3 gap-2">
                    <div class="flex flex-col items-center justify-center p-2 rounded-2xl border border-slate-100 bg-slate-50 clickable-count" onclick="showCategory('all')">
                        <span class="text-[9px] text-slate-400 font-bold uppercase tracking-tighter">Total</span>
                        <span id="totalItems" class="text-xl font-800 text-slate-900">0</span>
                    </div>
                    <div class="flex flex-col items-center justify-center p-2 rounded-2xl border border-slate-100 bg-slate-50 clickable-count" onclick="showCategory('boardgame')">
                        <span class="text-[9px] text-indigo-400 font-bold uppercase tracking-tighter">Games</span>
                        <span id="totalGames" class="text-xl font-800 text-indigo-600">0</span>
                    </div>
                    <div class="flex flex-col items-center justify-center p-2 rounded-2xl border border-slate-100 bg-slate-50 clickable-count" onclick="showCategory('boardgameexpansion')">
                        <span class="text-[9px] text-emerald-400 font-bold uppercase tracking-tighter">Expns</span>
                        <span id="totalExpansions" class="text-xl font-800 text-emerald-600">0</span>
                    </div>
                </div>

                <!-- Compact Status Table -->
                <div class="bg-white rounded-2xl border border-slate-100 overflow-hidden shadow-sm">
                    <table class="w-full text-left text-[11px]">
                        <thead class="bg-slate-50 border-b border-slate-100">
                            <tr>
                                <th class="px-3 py-2 font-bold text-slate-400 uppercase">Status</th>
                                <th class="px-2 py-2 font-bold text-slate-400 uppercase text-center">G</th>
                                <th class="px-2 py-2 font-bold text-slate-400 uppercase text-center">E</th>
                                <th class="px-2 py-2 font-bold text-slate-400 uppercase text-center">Σ</th>
                            </tr>
                        </thead>
                        <tbody id="statusTableBody" class="divide-y divide-slate-50"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <footer class="bg-white border-t border-slate-100 p-3 text-center shrink-0">
            <p id="footerLabel" class="text-[9px] font-bold text-slate-300 uppercase tracking-widest">BGG API v2</p>
        </footer>
    </div>

    <!-- Thumbnail Modal -->
    <div id="gameModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden flex flex-col justify-end">
        <div class="bg-white rounded-t-[32px] modal-content flex flex-col h-[80vh]">
            <div class="p-6 border-b border-slate-50 flex justify-between items-center sticky top-0 bg-white rounded-t-[32px]">
                <div>
                    <h3 id="modalTitle" class="text-lg font-800 text-slate-900">Games</h3>
                    <p id="modalSubtitle" class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1">Found 0 items</p>
                </div>
                <button onclick="closeModal()" class="p-2 bg-slate-100 rounded-full text-slate-400 hover:text-slate-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div id="modalList" class="flex-1 overflow-y-auto p-4 grid grid-cols-3 gap-3 content-start">
                <!-- Thumbs -->
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/bgg-helper';
        const IMAGE_PROXY = 'https://images.weserv.nl/?url=';

        const statusMap = [
            { id: 'own', label: 'Owned', color: 'status-own' },
            { id: 'prevowned', label: 'Prev', color: 'status-prevowned' },
            { id: 'fortrade', label: 'Trade', color: 'status-fortrade' },
            { id: 'want', label: 'Want', color: 'status-want' },
            { id: 'wanttoplay', label: 'Play', color: 'status-wanttoplay' },
            { id: 'wanttobuy', label: 'Buy', color: 'status-wanttobuy' },
            { id: 'wishlist', label: 'Wish', color: 'status-wishlist' },
            { id: 'preordered', label: 'Pre', color: 'status-preordered' }
        ];

        let collectionData = [];

        async function fetchBGG(endpoint, params = '', retries = 5) {
            const url = `${API_URL}?endpoint=${endpoint}${params}`;
            for (let i = 0; i < retries; i++) {
                try {
                    const res = await fetch(url);
                    if (res.status === 202) {
                        updateLoader('BGG is processing...', `Attempt ${i + 1}`);
                        await new Promise(r => setTimeout(r, 4000 + i * 2000));
                        continue;
                    }
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return await res.text();
                } catch (e) {
                    if (i === retries - 1) throw e;
                    await new Promise(r => setTimeout(r, 2000));
                }
            }
        }

        function updateLoader(text, sub) {
            document.getElementById('loaderText').textContent = text;
            document.getElementById('loaderSub').textContent = sub;
        }

        async function loadStats() {
            const username = document.getElementById('usernameInput').value.trim();
            if (!username) return;

            document.getElementById('welcomeState').classList.add('hidden');
            document.getElementById('resultsState').classList.add('hidden');
            document.getElementById('errorState').classList.add('hidden');
            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('fetchIcon').classList.add('hidden');
            document.getElementById('btnLoader').classList.remove('hidden');

            updateLoader('Requesting Collection...', username);

            try {
                // Step 1: Get basic collection IDs and status
                const xmlText = await fetchBGG('collection', `&username=${encodeURIComponent(username)}&stats=1`);
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, 'text/xml');

                if (xmlDoc.querySelector('errors error')) {
                    throw new Error(xmlDoc.querySelector('errors error').textContent);
                }

                const items = Array.from(xmlDoc.querySelectorAll('item'));
                collectionData = items.map(item => {
                    const statusNode = item.querySelector('status');
                    const status = {};
                    statusMap.forEach(s => {
                        status[s.id] = statusNode.getAttribute(s.id) === '1';
                    });
                    return {
                        id: item.getAttribute('objectid'),
                        name: item.querySelector('name')?.textContent || 'Unknown',
                        type: item.getAttribute('subtype') || 'boardgame',
                        image: item.querySelector('thumbnail')?.textContent || '',
                        status: status
                    };
                });

                // Step 2: Parallel Enrichment for subtype accuracy (requested)
                // Even though collection has subtype, user specifically asked for parrallel thing fetch.
                const ids = collectionData.map(i => i.id);
                const batchSize = 20;
                const parallelLimit = 100; // 100 parallel batches of 20 = 2000 IDs
                const batches = [];
                for (let i = 0; i < ids.length; i += batchSize) {
                    batches.push(ids.slice(i, i + batchSize).join(','));
                }

                updateLoader('Enriching Types...', `${batches.length} batches`);

                // Run enrichment in chunks of parallelLimit
                for (let i = 0; i < batches.length; i += parallelLimit) {
                    const chunk = batches.slice(i, i + parallelLimit);
                    await Promise.all(chunk.map(async (batchIds) => {
                        try {
                            const thingXml = await fetchBGG('thing', `&id=${batchIds}`);
                            const thingDoc = parser.parseFromString(thingXml, 'text/xml');
                            Array.from(thingDoc.querySelectorAll('item')).forEach(thingItem => {
                                const id = thingItem.getAttribute('id');
                                const type = thingItem.getAttribute('type');
                                const target = collectionData.find(c => c.id === id);
                                if (target) target.type = type;
                            });
                        } catch (e) { console.warn('Batch failed', batchIds); }
                    }));
                }

                renderResults();
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('resultsState').classList.remove('hidden');
                document.getElementById('footerLabel').textContent = `BGG API v2 • ${username}`;
            } catch (err) {
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('errorState').classList.remove('hidden');
                document.getElementById('errorMsg').textContent = err.message || 'Error loading data';
            } finally {
                document.getElementById('fetchIcon').classList.remove('hidden');
                document.getElementById('btnLoader').classList.add('hidden');
            }
        }

        function renderResults() {
            const games = collectionData.filter(i => i.type === 'boardgame');
            const expansions = collectionData.filter(i => i.type === 'boardgameexpansion');

            document.getElementById('totalItems').textContent = collectionData.length;
            document.getElementById('totalGames').textContent = games.length;
            document.getElementById('totalExpansions').textContent = expansions.length;

            const tbody = document.getElementById('statusTableBody');
            tbody.innerHTML = '';
            statusMap.forEach(s => {
                const gItems = games.filter(g => g.status[s.id]);
                const eItems = expansions.filter(e => e.status[s.id]);
                const total = gItems.length + eItems.length;
                if (total === 0) return;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="px-3 py-2"><span class="status-badge ${s.color}">${s.label}</span></td>
                    <td class="px-2 py-2 text-center clickable-count" onclick="showFilteredModal('${s.label}', 'boardgame', '${s.id}')">${gItems.length}</td>
                    <td class="px-2 py-2 text-center clickable-count" onclick="showFilteredModal('${s.label}', 'boardgameexpansion', '${s.id}')">${eItems.length}</td>
                    <td class="px-2 py-2 text-center clickable-count" onclick="showFilteredModal('${s.label}', 'all', '${s.id}')">${total}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function showCategory(type) {
            let filtered = collectionData;
            if (type !== 'all') filtered = collectionData.filter(i => i.type === type);
            showModal(type === 'all' ? 'All Items' : (type === 'boardgame' ? 'Games' : 'Expansions'), filtered);
        }

        function showFilteredModal(label, type, statusId) {
            let filtered = collectionData.filter(i => i.status[statusId]);
            if (type !== 'all') filtered = filtered.filter(i => i.type === type);
            showModal(`${label} - ${type === 'all' ? 'Total' : (type === 'boardgame' ? 'Games' : 'Expansions')}`, filtered);
        }

        function showModal(title, items) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalSubtitle').textContent = `Found ${items.length} items`;
            const list = document.getElementById('modalList');
            list.innerHTML = items.map(i => {
                const thumb = i.image || 'https://cf.geekdo-images.com/zx_9pDp6m60_q6r1uYf8uA__thumb/img/999999_thumb.png';
                return `<a href="https://boardgamegeek.com/${i.type}/${i.id}" target="_blank" class="block bg-slate-50 p-1 rounded-lg border border-slate-100 aspect-square">
                    <img src="${IMAGE_PROXY}${thumb}" class="w-full h-full object-contain" alt="${i.name}">
                </a>`;
            }).join('');
            
            const modal = document.getElementById('gameModal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.add('active'), 10);
        }

        function closeModal() {
            const modal = document.getElementById('gameModal');
            modal.classList.remove('active');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }

        // Handle enter key on input
        document.getElementById('usernameInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') loadStats(); });
    </script>
</body>
</html>
