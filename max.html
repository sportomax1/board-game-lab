<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Max ID Finder</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
    #logContainer { font-family: 'Courier New', monospace; font-size: 11px; }
    .log-entry { padding: 4px 8px; border-bottom: 1px solid #e2e8f0; }
    .log-info { color: #64748b; }
    .log-success { color: #10b981; background: #f0fdf4; }
    .log-warn { color: #f59e0b; background: #fffbeb; }
    .log-error { color: #ef4444; background: #fef2f2; }
  </style>
</head>
<body class="pb-20">
  <header class="sticky top-0 z-30 w-full bg-white/80 backdrop-blur-md border-b px-4 py-3 shadow-sm">
    <div class="max-w-5xl mx-auto flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="bg-emerald-600 text-white p-2 rounded-lg">
          <i class="fa-solid fa-magnifying-glass-chart"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">Max ID Finder</h1>
          <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Find Highest BGG Thing ID</p>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <div id="statsBox" class="text-right hidden">
          <div class="text-2xl font-bold text-emerald-600" id="maxFound">—</div>
          <div class="text-[10px] text-slate-500 uppercase font-bold">Current Max</div>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-4 space-y-4">
    
    <!-- Control Section -->
    <div id="controlSection" class="bg-white rounded-xl shadow-sm border border-slate-100 p-4">
      <div class="flex gap-3 items-end">
        <div class="flex-1">
          <label class="text-xs font-bold text-slate-500 uppercase mb-2 block">Starting ID (optional)</label>
          <input 
            id="startInput" 
            type="number" 
            placeholder="Auto-detect from ~400000" 
            class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:ring-2 focus:ring-emerald-500 outline-none transition-all text-sm"
          >
        </div>
        <div>
          <label class="text-xs font-bold text-slate-500 uppercase mb-2 block">Batch Size</label>
          <input 
            id="batchInput" 
            type="number" 
            value="20" 
            min="10"
            max="100"
            class="w-20 px-3 py-2.5 rounded-lg border border-slate-200 focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-mono"
          >
        </div>
        <div>
          <label class="text-xs font-bold text-slate-500 uppercase mb-2 block">Parallel</label>
          <input 
            id="parallelInput" 
            type="number" 
            value="100" 
            min="1"
            max="500"
            class="w-20 px-3 py-2.5 rounded-lg border border-slate-200 focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-mono"
          >
        </div>
        <button 
          onclick="startSearch()" 
          id="startBtn"
          class="px-8 bg-emerald-600 text-white py-2.5 rounded-lg font-bold hover:bg-emerald-700 flex items-center gap-2 transition-all text-sm"
        >
          <i class="fa-solid fa-play"></i> Find Max
        </button>
        <button 
          onclick="stopSearch()" 
          id="stopBtn"
          class="hidden px-6 bg-red-600 text-white py-2.5 rounded-lg font-bold hover:bg-red-700 transition-all text-sm"
        >
          <i class="fa-solid fa-stop"></i> Stop
        </button>
      </div>
    </div>

    <!-- Metrics -->
    <div id="metricsSection" class="hidden bg-white rounded-xl shadow-sm border border-slate-100 p-4">
      <div class="grid grid-cols-2 sm:grid-cols-5 gap-4 text-center">
        <div>
          <div class="text-2xl font-bold text-indigo-600" id="metricCalls">0</div>
          <div class="text-xs text-slate-500 uppercase font-bold">API Calls</div>
        </div>
        <div>
          <div class="text-2xl font-bold text-purple-600" id="metricChecked">0</div>
          <div class="text-xs text-slate-500 uppercase font-bold">IDs Checked</div>
        </div>
        <div>
          <div class="text-2xl font-bold text-emerald-600" id="metricFound">0</div>
          <div class="text-xs text-slate-500 uppercase font-bold">Found</div>
        </div>
        <div>
          <div class="text-2xl font-bold text-blue-600" id="metricElapsed">0s</div>
          <div class="text-xs text-slate-500 uppercase font-bold">Elapsed</div>
        </div>
        <div>
          <div class="text-2xl font-bold text-slate-600" id="metricRate">0</div>
          <div class="text-xs text-slate-500 uppercase font-bold">IDs/sec</div>
        </div>
      </div>
    </div>

    <!-- Status -->
    <div id="statusSection" class="hidden bg-white rounded-xl shadow-sm border border-slate-100 p-4">
      <div class="flex items-center gap-3 mb-2">
        <i class="fa-solid fa-circle-notch fa-spin text-emerald-600"></i>
        <span class="font-bold text-slate-700" id="statusText">Searching...</span>
      </div>
      <div class="bg-slate-100 rounded-full h-2 overflow-hidden">
        <div id="progressBar" class="bg-emerald-600 h-full transition-all duration-300" style="width: 0%"></div>
      </div>
    </div>

    <!-- Log -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-100">
      <div class="p-4 border-b flex items-center justify-between">
        <h3 class="font-bold text-slate-700">Search Log</h3>
        <button onclick="clearLog()" class="text-xs px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded">Clear</button>
      </div>
      <div id="logContainer" class="max-h-96 overflow-y-auto bg-slate-50"></div>
    </div>
  </main>

<script>
const API_BASE = '/api/bgg-helper';
const MAX_RETRIES = 3;
const VERIFICATION_RANGE = 1000; // Check this many IDs beyond last found to verify max

let isRunning = false;
let shouldStop = false;
let apiCallCount = 0;
let idsChecked = 0;
let idsFound = 0;
let currentMax = 0;
let startTime = 0;

const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const statsBox = document.getElementById('statsBox');
const metricsSection = document.getElementById('metricsSection');
const statusSection = document.getElementById('statusSection');
const maxFound = document.getElementById('maxFound');
const metricCalls = document.getElementById('metricCalls');
const metricChecked = document.getElementById('metricChecked');
const metricFound = document.getElementById('metricFound');
const metricElapsed = document.getElementById('metricElapsed');
const metricRate = document.getElementById('metricRate');
const statusText = document.getElementById('statusText');
const progressBar = document.getElementById('progressBar');
const logContainer = document.getElementById('logContainer');

function log(message, type = 'info') {
  const entry = document.createElement('div');
  entry.className = `log-entry log-${type}`;
  const timestamp = new Date().toLocaleTimeString();
  entry.textContent = `[${timestamp}] ${message}`;
  logContainer.appendChild(entry);
  logContainer.scrollTop = logContainer.scrollHeight;
}

function clearLog() {
  logContainer.innerHTML = '';
}

function updateMetrics() {
  const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
  const rate = idsChecked > 0 ? Math.round(idsChecked / elapsed) : 0;
  metricCalls.textContent = apiCallCount;
  metricChecked.textContent = idsChecked.toLocaleString();
  metricFound.textContent = idsFound.toLocaleString();
  metricElapsed.textContent = `${elapsed}s`;
  metricRate.textContent = rate;
  maxFound.textContent = currentMax > 0 ? currentMax.toLocaleString() : '—';
}

async function startSearch() {
  if (isRunning) return;
  
  isRunning = true;
  shouldStop = false;
  apiCallCount = 0;
  idsChecked = 0;
  idsFound = 0;
  currentMax = 0;
  startTime = Date.now();
  
  startBtn.classList.add('hidden');
  stopBtn.classList.remove('hidden');
  statsBox.classList.remove('hidden');
  metricsSection.classList.remove('hidden');
  statusSection.classList.remove('hidden');
  
  clearLog();
  log('🚀 Starting max ID search...', 'info');
  
  const startId = parseInt(document.getElementById('startInput').value) || 400000;
  log(`📍 Starting from ID: ${startId.toLocaleString()}`, 'info');
  
  try {
    await findMaxId(startId);
    
    if (!shouldStop) {
      log(`✅ Search complete! Maximum ID found: ${currentMax.toLocaleString()}`, 'success');
      statusText.textContent = 'Search Complete';
      progressBar.style.width = '100%';
    } else {
      log('⏹️ Search stopped by user', 'warn');
      statusText.textContent = 'Stopped';
    }
  } catch (error) {
    log(`❌ Error: ${error.message}`, 'error');
    statusText.textContent = 'Error';
  }
  
  isRunning = false;
  startBtn.classList.remove('hidden');
  stopBtn.classList.add('hidden');
}

function stopSearch() {
  shouldStop = true;
  log('⏸️ Stopping search...', 'warn');
}

async function findMaxId(startId) {
  const BATCH_SIZE = parseInt(document.getElementById('batchInput').value) || 20;
  const PARALLEL = parseInt(document.getElementById('parallelInput').value) || 100;
  
  let highestFound = 0;
  
  // Phase 1: Sparse bucket sampling to find approximate range
  log(`📈 Phase 1: Sparse bucket sampling from ${startId.toLocaleString()}`, 'info');
  
  // Generate sparse checkpoints: 1, 10, 100, 1000, 10000, 100000, 1000000...
  const buckets = [];
  for (let exp = 0; exp <= 7; exp++) {
    const bucket = Math.pow(10, exp);
    if (bucket >= startId) buckets.push(bucket);
  }
  
  // Add intermediate buckets for better coverage
  const expandedBuckets = [];
  buckets.forEach((bucket, idx) => {
    expandedBuckets.push(bucket);
    if (idx < buckets.length - 1) {
      const nextBucket = buckets[idx + 1];
      // Add midpoint and quarter points
      expandedBuckets.push(Math.floor(bucket + (nextBucket - bucket) * 0.25));
      expandedBuckets.push(Math.floor(bucket + (nextBucket - bucket) * 0.5));
      expandedBuckets.push(Math.floor(bucket + (nextBucket - bucket) * 0.75));
    }
  });
  
  const sampledBuckets = expandedBuckets.filter(b => b >= startId).sort((a, b) => a - b);
  log(`🎯 Checking ${sampledBuckets.length} sparse checkpoints: ${sampledBuckets.slice(0, 5).join(', ')}... → ${sampledBuckets[sampledBuckets.length - 1].toLocaleString()}`, 'info');
  
  // Check buckets in parallel batches
  for (let i = 0; i < sampledBuckets.length; i += PARALLEL) {
    if (shouldStop) return;
    
    const group = sampledBuckets.slice(i, i + PARALLEL);
    statusText.textContent = `Sampling checkpoints ${group[0].toLocaleString()} - ${group[group.length - 1].toLocaleString()}...`;
    
    const results = await Promise.all(group.map(id => checkIds([id])));
    
    results.forEach((result, idx) => {
      if (result.maxFound > 0) {
        const found = result.maxFound;
        if (found > highestFound) {
          highestFound = found;
          currentMax = highestFound;
          log(`✓ Hit at checkpoint ${group[idx].toLocaleString()}! Found ID: ${found.toLocaleString()}`, 'success');
        }
      }
    });
    
    updateMetrics();
    await new Promise(r => setTimeout(r, 200));
  }
  
  if (highestFound === 0) {
    log(`⊘ No IDs found in any checkpoint ranges`, 'warn');
    return;
  }
  
  log(`📍 Highest checkpoint hit: ${highestFound.toLocaleString()}`, 'success');
  
  if (shouldStop) return;
  
  // Phase 2: Binary search from highest found to narrow down true max
  log(`🔍 Phase 2: Binary search from ${highestFound.toLocaleString()}`, 'info');
  
  let searchStart = highestFound;
  let searchEnd = Math.min(highestFound + 1000000, 10000000); // Cap at 10M
  let trueMax = highestFound;
  
  while (!shouldStop && searchEnd - searchStart > 100) {
    const mid = Math.floor((searchStart + searchEnd) / 2);
    statusText.textContent = `Binary searching: ${searchStart.toLocaleString()} - ${searchEnd.toLocaleString()} (testing ${mid.toLocaleString()})...`;
    
    // Sample around midpoint
    const testIds = [mid - 10, mid, mid + 10, mid + 50, mid + 100].filter(id => id > trueMax);
    const results = await Promise.all(testIds.map(id => checkIds([id])));
    
    let foundInUpper = false;
    for (const result of results) {
      if (result.maxFound > 0) {
        foundInUpper = true;
        if (result.maxFound > trueMax) {
          trueMax = result.maxFound;
          currentMax = trueMax;
          log(`✓ Found ID ${result.maxFound.toLocaleString()} in upper range`, 'success');
        }
      }
    }
    
    if (foundInUpper) {
      searchStart = mid;
    } else {
      searchEnd = mid;
    }
    
    updateMetrics();
    await new Promise(r => setTimeout(r, 200));
  }
  
  if (shouldStop) return;
  
  // Phase 3: Dense verification around found maximum
  log(`🔬 Phase 3: Dense verification from ${trueMax.toLocaleString()}`, 'info');
  
  let verifyId = trueMax;
  let consecutiveGaps = 0;
  const MAX_GAPS = 100;
  
  while (!shouldStop && consecutiveGaps < MAX_GAPS) {
    statusText.textContent = `Verifying ${verifyId.toLocaleString()}... (${consecutiveGaps}/${MAX_GAPS} gaps)`;
    
    const batchIds = [];
    for (let i = 1; i <= BATCH_SIZE; i++) {
      batchIds.push(verifyId + i);
    }
    
    const results = await checkIds(batchIds);
    
    if (results.maxFound > 0 && results.maxFound > trueMax) {
      trueMax = results.maxFound;
      currentMax = trueMax;
      consecutiveGaps = 0;
      verifyId = trueMax;
      log(`✓ Found higher ID ${trueMax.toLocaleString()}!`, 'success');
    } else {
      consecutiveGaps++;
      verifyId += BATCH_SIZE;
    }
    
    updateMetrics();
    const progress = Math.min(100, (consecutiveGaps / MAX_GAPS) * 100);
    progressBar.style.width = `${progress}%`;
    
    await new Promise(r => setTimeout(r, 100));
  }
  
  currentMax = trueMax;
  log(`✅ Verified maximum ID: ${trueMax.toLocaleString()} (after ${consecutiveGaps} consecutive gaps)`, 'success');
}

// Removed checkRange - no longer using dense range checking

async function checkIds(ids) {
  const idsParam = ids.join(',');
  const url = `${API_BASE}?endpoint=thing&id=${encodeURIComponent(idsParam)}`;
  
  apiCallCount++;
  idsChecked += ids.length;
  
  try {
    const txt = await fetchWithRetry(url);
    const doc = new DOMParser().parseFromString(txt, 'text/xml');
    const items = Array.from(doc.querySelectorAll('item'));
    
    let maxFound = 0;
    const foundIds = [];
    
    items.forEach(item => {
      const id = parseInt(item.getAttribute('id'));
      foundIds.push(id);
      if (id > maxFound) maxFound = id;
    });
    
    idsFound += foundIds.length;
    
    if (foundIds.length > 0) {
      log(`API Call #${apiCallCount}: ${idsParam.split(',')[0]}-${idsParam.split(',').slice(-1)} → Found ${foundIds.length} (max: ${maxFound})`, 'info');
    }
    
    return { maxFound, foundCount: foundIds.length };
  } catch (error) {
    log(`API Call #${apiCallCount}: ${idsParam.split(',')[0]}-${idsParam.split(',').slice(-1)} → ERROR: ${error.message}`, 'error');
    return { maxFound: 0, foundCount: 0 };
  }
}

async function fetchWithRetry(url, attempt = 1) {
  try {
    const res = await fetch(url);
    if (res.status === 202) {
      await new Promise(r => setTimeout(r, 2000));
      if (attempt < MAX_RETRIES) return fetchWithRetry(url, attempt + 1);
      throw new Error('BGG queue timeout');
    }
    if (!res.ok) {
      if (attempt < MAX_RETRIES) {
        await new Promise(r => setTimeout(r, 500 * attempt));
        return fetchWithRetry(url, attempt + 1);
      }
      throw new Error(`HTTP ${res.status}`);
    }
    return await res.text();
  } catch (e) {
    if (attempt < MAX_RETRIES) {
      await new Promise(r => setTimeout(r, 500 * attempt));
      return fetchWithRetry(url, attempt + 1);
    }
    throw e;
  }
}
</script>
</body>
</html>
