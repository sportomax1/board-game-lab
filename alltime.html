<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Time Rankings | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #1e293b; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 1);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        .table-container {
            overflow-x: auto;
            border-radius: 0.75rem;
            border: 1px solid #e2e8f0;
        }
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        th { background: #f1f5f9; color: #64748b; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.75rem 1rem; text-align: left; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #e2e8f0; }
        td { padding: 0.75rem 1rem; border-bottom: 1px solid #f1f5f9; font-size: 0.875rem; transition: background 0.2s; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f8fafc; }
        .rank-cell { font-weight: 700; text-align: center; }
        .game-img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: #e2e8f0; border: 1px solid #e2e8f0; }
        .trend-up { color: #10b981; }
        .trend-down { color: #ef4444; }
        .trend-stable { color: #94a3b8; }
        
        .export-grid {
            display: grid;
            gap: 12px;
            padding: 24px;
            background: #fff;
        }
        .export-item {
            position: relative;
            aspect-ratio: 1/1;
            border-radius: 12px;
            overflow: hidden;
            background: #f1f5f9;
        }
        .export-item img { width: 100%; height: 100%; object-fit: cover; }
        .export-rank {
            position: absolute;
            top: 8px; left: 8px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-weight: 900;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1;
        }
        .export-name {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            color: #fff;
            padding: 12px 8px 6px;
            font-size: 10px;
            font-weight: 700;
            text-align: center;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-spin-fast { animation: spin 0.6s linear infinite; }
        
        .custom-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.2s;
            cursor: pointer;
        }
    </style>
</head>
<body class="p-3 md:p-6 pb-20">
    <div class="max-w-7xl mx-auto space-y-4">
        <!-- Header -->
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 glass-card p-5 rounded-3xl">
            <div class="flex items-center gap-4">
                <div class="bg-indigo-600 p-3 rounded-2xl shadow-xl shadow-indigo-200">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-slate-900 tracking-tight leading-none">All Time <span class="text-indigo-600">Library</span></h1>
                    <p class="text-[11px] text-slate-400 font-bold tracking-widest uppercase mt-1.5 flex items-center gap-2">
                        <span>Sportomax Collection Stats</span>
                        <span class="w-1 h-1 bg-slate-300 rounded-full"></span>
                        <span id="gameCountDisplay">0 Games</span>
                    </p>
                </div>
            </div>
            
            <div class="flex flex-wrap items-center gap-2">
                <select id="yearFilter" class="bg-slate-100 border-none rounded-xl px-4 py-2 text-xs font-bold outline-none focus:ring-2 focus:ring-indigo-400">
                    <option value="all">Compare All Years</option>
                </select>
                <div id="status" class="text-[10px] font-bold text-slate-500 bg-slate-100 px-4 py-2 rounded-xl flex items-center gap-2">
                    <div id="statusPulse" class="w-2 h-2 bg-indigo-500 rounded-full animate-pulse"></div>
                    <span id="statusText">INITIALIZING...</span>
                </div>
            </div>
        </header>

        <!-- Insights -->
        <div id="insightsGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <!-- Populated by JS -->
        </div>

        <!-- Main Content -->
        <main class="glass-card rounded-3xl overflow-hidden">
            <div class="p-5 border-b border-slate-100 flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white/50">
                <div class="flex items-center gap-4">
                    <h2 class="text-sm font-black text-slate-800 uppercase tracking-widest">Master Rankings</h2>
                    <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl">
                        <button onclick="changeSort('name')" id="sort-name" class="px-3 py-1.5 rounded-lg text-[10px] font-bold uppercase transition-all">Name</button>
                        <button onclick="changeSort('avg')" id="sort-avg" class="px-3 py-1.5 rounded-lg text-[10px] font-bold uppercase transition-all bg-white shadow-sm">Rank</button>
                        <button onclick="changeSort('diff')" id="sort-diff" class="px-3 py-1.5 rounded-lg text-[10px] font-bold uppercase transition-all">Trend</button>
                    </div>
                </div>
                
                <div class="flex items-center gap-3">
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-3 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        </div>
                        <input type="text" id="gameSearch" placeholder="Search library..." class="pl-9 pr-4 py-2 bg-slate-100 rounded-xl text-xs font-bold outline-none focus:ring-2 focus:ring-indigo-400 w-48 transition-all border-none">
                    </div>
                    
                    <div class="flex items-center gap-2">
                        <button onclick="exportCSV()" class="btn-action bg-slate-800 text-white hover:bg-slate-900">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                            CSV
                        </button>
                        <button onclick="openExportModal()" class="btn-action bg-indigo-600 text-white hover:bg-indigo-700 shadow-lg shadow-indigo-100">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                            Share
                        </button>
                    </div>
                </div>
            </div>
            
            <div id="tableWrapper" class="table-container custom-scroll">
                <table id="rankingsTable">
                    <thead>
                        <tr id="headerRow">
                            <th>Game</th>
                            <!-- Years injected -->
                            <th class="text-center">AVG</th>
                            <th class="text-center">Trend</th>
                        </tr>
                    </thead>
                    <tbody id="rankingBody"></tbody>
                </table>
            </div>
            
            <div id="loadingOverlay" class="p-20 flex flex-col items-center justify-center gap-4">
                <div class="w-10 h-10 border-4 border-indigo-100 border-t-indigo-600 rounded-full animate-spin"></div>
                <p class="text-[11px] font-black text-slate-400 uppercase tracking-[0.2em]">Synchronizing Records</p>
            </div>
            
            <div id="emptyState" class="hidden p-20 text-center">
                <div class="text-slate-200 mb-3 flex justify-center">
                    <svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9.172 9.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </div>
                <p class="text-slate-400 font-bold uppercase tracking-wider text-xs">No records found</p>
            </div>
        </main>
    </div>

    <!-- Export Modal -->
    <div id="exportModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
        <div class="bg-white rounded-3xl w-full max-w-4xl max-h-[90vh] overflow-hidden flex flex-col shadow-2xl">
            <div class="p-5 border-b flex items-center justify-between">
                <div>
                    <h3 class="text-lg font-black text-slate-900">Share Your Rankings</h3>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Generate a grid for social media</p>
                </div>
                <button onclick="closeExportModal()" class="p-2 hover:bg-slate-100 rounded-xl text-slate-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-6 bg-slate-50 custom-scroll">
                <div class="flex flex-wrap items-center gap-3 mb-6">
                    <select id="exportYear" class="bg-white border rounded-xl px-4 py-2 text-xs font-bold outline-none">
                        <option value="all">All Time (Avg)</option>
                    </select>
                    <select id="exportSize" class="bg-white border rounded-xl px-4 py-2 text-xs font-bold outline-none">
                        <option value="9">Top 9 (3x3)</option>
                        <option value="16" selected>Top 16 (4x4)</option>
                        <option value="25">Top 25 (5x5)</option>
                        <option value="50">Top 50 (5x10)</option>
                    </select>
                    <button onclick="generateGrid()" class="bg-indigo-600 text-white px-5 py-2 rounded-xl text-xs font-bold hover:bg-indigo-700 transition-colors">
                        Refresh Grid
                    </button>
                </div>

                <div id="captureAreaContainer" class="flex justify-center">
                    <div id="captureArea" class="bg-white shadow-xl overflow-hidden" style="width: 800px;">
                        <!-- Grid injected here -->
                    </div>
                </div>
            </div>
            
            <div class="p-5 border-t bg-white flex justify-end gap-3">
                <button onclick="downloadImage('png')" class="btn-action bg-slate-800 text-white">Download PNG</button>
                <button onclick="downloadImage('jpg')" class="btn-action bg-indigo-600 text-white">Download JPG</button>
            </div>
        </div>
    </div>

    <script>
        const CSV_URL = 'alltimepub.csv';
        const BGG_COLLECTION_URL = '/api/bgg-helper?endpoint=collection&username=sportomax&stats=1';
        const IMAGE_PROXY = '/api/image-proxy?url=';
        
        let allGames = [];
        let uniqueYears = [];
        let collectionData = {};
        let currentSort = 'avg';
        let sortDir = 1;

        async function init() {
            try {
                updateStatus('FETCHING CSV...', 'indigo');
                const csvText = await fetch(CSV_URL).then(r => r.text());
                const csvData = parseCSV(csvText);
                
                updateStatus('FETCHING BGG DATA...', 'amber');
                await fetchCollection();
                
                processData(csvData);
                populateFilters();
                renderStats();
                renderTable();
                
                document.getElementById('loadingOverlay').classList.add('hidden');
                updateStatus('READY', 'emerald');
                document.getElementById('statusPulse').classList.remove('animate-pulse');
            } catch (err) {
                console.error(err);
                updateStatus('ERROR', 'rose');
            }
        }

        function parseCSV(text) {
            const lines = text.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim());
            return lines.slice(1).map(line => {
                const values = line.split(',');
                const obj = {};
                headers.forEach((h, i) => obj[h] = values[i]?.trim());
                return obj;
            });
        }

        async function fetchCollection() {
            try {
                const response = await fetch(BGG_COLLECTION_URL);
                const text = await response.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, 'text/xml');
                const items = xml.querySelectorAll('item');
                
                items.forEach(item => {
                    const id = item.getAttribute('objectid');
                    const thumbnail = item.querySelector('thumbnail')?.textContent;
                    const image = item.querySelector('image')?.textContent;
                    const name = item.querySelector('name')?.textContent;
                    collectionData[id] = { thumbnail, image, name };
                });
            } catch (e) { console.error('BGG Load Error:', e); }
        }

        function processData(csvData) {
            const gamesMap = {};
            const yearSet = new Set();
            
            csvData.forEach(row => {
                const id = row.id;
                const year = row.year;
                const rank = parseInt(row.rank);
                
                if (!gamesMap[id]) {
                    gamesMap[id] = { id, name: row.name, ranks: {}, avg: 0, diff: 0, count: 0 };
                }
                
                gamesMap[id].ranks[year] = rank;
                yearSet.add(year);
            });
            
            uniqueYears = Array.from(yearSet).sort((a, b) => b - a);
            
            allGames = Object.values(gamesMap).map(game => {
                const ranks = Object.values(game.ranks);
                game.count = ranks.length;
                game.avg = parseFloat((ranks.reduce((a, b) => a + b, 0) / ranks.length).toFixed(1));
                
                const yearsPresent = Object.keys(game.ranks).sort();
                if (yearsPresent.length > 1) {
                    const oldest = game.ranks[yearsPresent[0]];
                    const newest = game.ranks[yearsPresent[yearsPresent.length - 1]];
                    game.diff = oldest - newest;
                }
                return game;
            });
            
            document.getElementById('gameCountDisplay').textContent = `${allGames.length} Games`;
            sortGames();
        }

        function sortGames() {
            const yf = document.getElementById('yearFilter').value;
            allGames.sort((a, b) => {
                let valA, valB;
                if (yf === 'all') {
                    if (currentSort === 'avg') { valA = a.avg; valB = b.avg; }
                    else if (currentSort === 'name') { valA = a.name; valB = b.name; }
                    else { valA = a.diff; valB = b.diff; }
                } else {
                    valA = a.ranks[yf] || 9999;
                    valB = b.ranks[yf] || 9999;
                }
                
                if (valA < valB) return -1 * sortDir;
                if (valA > valB) return 1 * sortDir;
                return 0;
            });
        }

        function changeSort(key) {
            if (currentSort === key) sortDir *= -1;
            else { currentSort = key; sortDir = 1; }
            
            ['name', 'avg', 'diff'].forEach(k => {
                const btn = document.getElementById(`sort-${k}`);
                btn.className = k === key ? 'px-3 py-1.5 rounded-lg text-[10px] font-bold uppercase transition-all bg-white shadow-sm' : 'px-3 py-1.5 rounded-lg text-[10px] font-bold uppercase transition-all text-slate-400 hover:text-slate-600';
            });
            
            sortGames();
            renderTable(document.getElementById('gameSearch').value);
        }

        function populateFilters() {
            const yf = document.getElementById('yearFilter');
            const ey = document.getElementById('exportYear');
            uniqueYears.forEach(y => {
                const opt = new Option(y, y);
                yf.add(opt);
                ey.add(opt.cloneNode(true));
            });
        }

        function renderStats() {
            const ig = document.getElementById('insightsGrid');
            const climbers = [...allGames].sort((a,b) => b.diff - a.diff).slice(0, 1);
            const consistent = allGames.filter(g => g.count === uniqueYears.length).sort((a,b) => a.avg - b.avg).slice(0, 1);
            const newest = uniqueYears[0];
            const champ = [...allGames].filter(g => g.ranks[newest]).sort((a,b) => (a.ranks[newest]||999) - (b.ranks[newest]||999)).slice(0, 1);

            const stats = [
                { label: 'Top Game', val: champ[0]?.name || 'N/A', sub: `#1 in ${newest}`, color: 'indigo' },
                { label: 'Most Improved', val: climbers[0]?.name || 'N/A', sub: `+${climbers[0]?.diff || 0} spots`, color: 'emerald' },
                { label: 'Consistent', val: consistent[0]?.name || 'N/A', sub: `Ranked every year`, color: 'amber' },
                { label: 'Collection', val: allGames.length, sub: 'Games tracked', color: 'slate' }
            ];

            ig.innerHTML = stats.map(s => `
                <div class="glass-card p-5 rounded-3xl border-l-4 border-l-${s.color}-500">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${s.label}</p>
                    <p class="text-sm font-black text-slate-800 truncate mt-1">${s.val}</p>
                    <p class="text-[9px] font-bold text-${s.color}-600 uppercase mt-1 tracking-wider">${s.sub}</p>
                </div>
            `).join('');
        }

        function renderTable(filter = '') {
            const hb = document.getElementById('headerRow');
            const rb = document.getElementById('rankingBody');
            const yf = document.getElementById('yearFilter').value;
            
            hb.innerHTML = `<th>Game</th>` + 
                (yf === 'all' ? uniqueYears.map(y => `<th class="text-center">${y}</th>`).join('') : `<th class="text-center">${yf} Rank</th>`) +
                `<th class="text-center">AVG</th><th class="text-center">Trend</th>`;
            
            const filtered = allGames.filter(g => g.name.toLowerCase().includes(filter.toLowerCase()));
            
            if (!filtered.length) {
                document.getElementById('emptyState').classList.remove('hidden');
                rb.innerHTML = '';
                return;
            }
            
            document.getElementById('emptyState').classList.add('hidden');
            rb.innerHTML = filtered.map(game => {
                const bgg = collectionData[game.id] || {};
                const thumb = bgg.thumbnail ? IMAGE_PROXY + encodeURIComponent(bgg.thumbnail) : 'https://via.placeholder.com/44?text=?';
                
                const trend = game.diff > 0 ? `<span class="trend-up">▲${game.diff}</span>` : (game.diff < 0 ? `<span class="trend-down">▼${Math.abs(game.diff)}</span>` : `<span class="trend-stable">-</span>`);

                let yearRanks = '';
                if (yf === 'all') {
                    yearRanks = uniqueYears.map(y => `<td class="rank-cell font-mono ${game.ranks[y] ? 'text-slate-800' : 'text-slate-200'}">${game.ranks[y] || '-'}</td>`).join('');
                } else {
                    yearRanks = `<td class="rank-cell font-mono text-indigo-600 text-lg">${game.ranks[yf] || '-'}</td>`;
                }

                return `
                    <tr class="group">
                        <td>
                            <div class="flex items-center gap-4">
                                <img src="${thumb}" class="game-img group-hover:scale-110 transition-transform shadow-sm" loading="lazy">
                                <div>
                                    <div class="font-black text-slate-800 leading-none text-sm">${game.name}</div>
                                    <div class="text-[9px] text-slate-400 font-bold uppercase mt-1.5 tracking-wider">${game.count} appearances</div>
                                </div>
                            </div>
                        </td>
                        ${yearRanks}
                        <td class="text-center font-black text-slate-400 text-xs">${game.avg}</td>
                        <td class="text-center font-bold text-xs">${trend}</td>
                    </tr>
                `;
            }).join('');
        }

        // Export Functions
        function exportCSV() {
            const headers = ['ID', 'Name', 'Average', ...uniqueYears];
            const rows = allGames.map(g => [g.id, `"${g.name}"`, g.avg, ...uniqueYears.map(y => g.ranks[y] || '')]);
            const content = [headers, ...rows].map(e => e.join(',')).join('\n');
            const blob = new Blob([content], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('hidden', '');
            a.setAttribute('href', url);
            a.setAttribute('download', `sportomax_rankings_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function openExportModal() {
            document.getElementById('exportModal').classList.remove('hidden');
            generateGrid();
        }

        function closeExportModal() { document.getElementById('exportModal').classList.add('hidden'); }

        async function generateGrid() {
            const area = document.getElementById('captureArea');
            const year = document.getElementById('exportYear').value;
            const size = parseInt(document.getElementById('exportSize').value);
            
            let games = [...allGames];
            if (year === 'all') games.sort((a,b) => a.avg - b.avg);
            else {
                games = games.filter(g => g.ranks[year]).sort((a,b) => (a.ranks[year]||999) - (b.ranks[year]||999));
            }
            
            const top = games.slice(0, size);
            const cols = size === 9 ? 3 : (size === 16 ? 4 : 5);
            
            area.innerHTML = `
                <div class="p-8 bg-slate-900 text-white">
                    <div class="flex items-center justify-between mb-8">
                        <div>
                            <h2 class="text-2xl font-black italic uppercase tracking-tighter">Sportomax <span class="text-indigo-400">Library</span></h2>
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.3em] mt-1">${year === 'all' ? 'All Time Rankings' : year + ' Rankings'}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-xs font-black text-indigo-400">#TOP${size}</p>
                            <p class="text-[8px] font-bold text-slate-500 uppercase tracking-widest">boardgamegeek.com</p>
                        </div>
                    </div>
                    <div class="export-grid" style="grid-template-columns: repeat(${cols}, 1fr); background: transparent; padding: 0;">
                        ${top.map((g, i) => {
                            const bgg = collectionData[g.id] || {};
                            const imgUrl = bgg.image ? IMAGE_PROXY + encodeURIComponent(bgg.image) : (bgg.thumbnail ? IMAGE_PROXY + encodeURIComponent(bgg.thumbnail) : '');
                            return `
                                <div class="export-item">
                                    ${imgUrl ? `<img src="${imgUrl}" crossorigin="anonymous">` : '<div class="w-full h-full bg-slate-800"></div>'}
                                    <div class="export-rank">${i+1}</div>
                                    <div class="export-name truncate px-1">${g.name}</div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                    <div class="mt-8 pt-6 border-t border-white/10 flex justify-between items-center text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em]">
                        <span>Generated via Sportomax All Time</span>
                        <span>v2.0</span>
                    </div>
                </div>
            `;
        }

        async function downloadImage(format) {
            const area = document.getElementById('captureArea');
            const canvas = await html2canvas(area, {
                useCORS: true,
                scale: 2,
                backgroundColor: '#0f172a'
            });
            const link = document.createElement('a');
            link.download = `sportomax_grid_${new Date().getTime()}.${format}`;
            link.href = canvas.toDataURL(`image/${format === 'jpg' ? 'jpeg' : 'png'}`, 0.9);
            link.click();
        }

        function updateStatus(text, color) {
            const st = document.getElementById('statusText');
            const sp = document.getElementById('statusPulse');
            st.textContent = text;
            sp.className = `w-2 h-2 bg-${color}-500 rounded-full animate-pulse`;
        }

        document.getElementById('yearFilter').addEventListener('change', () => {
            sortGames();
            renderTable(document.getElementById('gameSearch').value);
        });
        document.getElementById('gameSearch').addEventListener('input', (e) => renderTable(e.target.value));

        init();
    </script>
</body>
</html>
