<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Time Rankings | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #1e293b; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 1);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        .table-container {
            overflow-x: auto;
            border-radius: 0.75rem;
            border: 1px solid #e2e8f0;
        }
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        th { background: #f1f5f9; color: #64748b; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.75rem 1rem; text-align: left; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #e2e8f0; }
        td { padding: 0.75rem 1rem; border-bottom: 1px solid #f1f5f9; font-size: 0.875rem; transition: background 0.2s; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f8fafc; }
        .rank-cell { font-weight: 700; text-align: center; }
        .game-img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: #e2e8f0; border: 1px solid #e2e8f0; }
        .trend-up { color: #10b981; }
        .trend-down { color: #ef4444; }
        .trend-stable { color: #94a3b8; }
        .export-grid {
            display: grid;
            gap: 12px;
            padding: 24px;
            background: #fff;
        }
        .export-item {
            position: relative;
            aspect-ratio: 1/1;
            border-radius: 12px;
            overflow: hidden;
            background: #0f172a;
        }
        .export-item img { width: 100%; height: 100%; }
        .export-item img.zoom-fill { object-fit: cover; }
        .export-item img.zoom-contain { object-fit: contain; }
        .export-rank {
            position: absolute;
            top: 0; left: 0;
            background: #4f46e5;
            color: #fff;
            font-weight: 900;
            padding: 6px 12px;
            border-bottom-right-radius: 14px;
            font-size: 18px;
            line-height: 1;
            box-shadow: 2px 2px 12px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.2);
            border-top: none; border-left: none;
            z-index: 10;
        }
        .export-name {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.95));
            color: #fff;
            padding: 24px 8px 8px;
            font-size: 11px;
            font-weight: 800;
            text-align: center;
            letter-spacing: -0.01em;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
            z-index: 5;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-spin-fast { animation: spin 0.6s linear infinite; }
        .custom-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.2s;
            cursor: pointer;
        }
        .scale-up-animation {
            animation: scaleUp 0.3s ease-out forwards;
        }
        @keyframes scaleUp {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="p-3 md:p-6 pb-20">
    <div class="max-w-7xl mx-auto space-y-4">
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 glass-card p-5 rounded-3xl">
            <div class="flex items-center gap-4">
                <div class="bg-indigo-600 p-3 rounded-2xl shadow-xl shadow-indigo-200">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 002 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-slate-900 tracking-tight leading-none">All Time <span class="text-indigo-600">Library</span></h1>
                    <p class="text-[11px] text-slate-400 font-bold tracking-widest uppercase mt-1.5 flex items-center gap-2">
                        <span>Sportomax Collection Stats</span>
                        <span class="w-1 h-1 bg-slate-300 rounded-full"></span>
                        <span id="gameCountDisplay">0 Games</span>
                    </p>
                </div>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <select id="yearFilter" onchange="applyFilters()" class="bg-slate-100 border-none rounded-xl px-4 py-2 text-xs font-bold outline-none focus:ring-2 focus:ring-indigo-400">
                    <option value="all">Compare All Years</option>
                </select>
                <div id="status" class="text-[10px] font-bold text-slate-500 bg-slate-100 px-4 py-2 rounded-xl flex items-center gap-2">
                    <div id="statusPulse" class="w-2 h-2 bg-indigo-500 rounded-full animate-pulse"></div>
                    <span id="statusText">INITIALIZING...</span>
                </div>
            </div>
        </header>
        <div id="insightsGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
        <div class="glass-card p-4 rounded-2xl flex flex-wrap items-center gap-4 border-b-4 border-indigo-100">
            <div class="flex flex-col gap-1">
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Appearance Depth</label>
                <select id="minAppearances" onchange="applyFilters()" class="bg-slate-100 rounded-xl px-4 py-2 text-xs font-bold outline-none focus:ring-2 focus:ring-indigo-400 border-none min-w-[140px]">
                    <option value="1">Appear in 1+ Years</option>

            <div class="flex flex-col gap-1">
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Must Include Year</label>
                <select id="requiredYear" onchange="applyFilters()" class="bg-slate-100 rounded-xl px-4 py-2 text-xs font-bold outline-none focus:ring-2 focus:ring-indigo-400 border-none min-w-[140px]">

                </select>
            </div>
            <div class="flex-1"></div>
            <div class="flex flex-col gap-1">
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 text-right mr-1">Sort Flow</label>
                <button onclick="toggleSortDir()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-xl px-4 py-2 text-xs font-black transition-all border-none flex items-center gap-3">
                    <span id="sortDirLabel">ASCENDING</span>
                    <svg id="sortDirIcon" class="w-3.5 h-3.5 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 15l7-7 7 7"/></svg>
                </button>
            </div>
        </div>
        <main class="glass-card rounded-3xl overflow-hidden">
            <div class="p-5 border-b border-slate-100 flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white/50">
                <div class="flex items-center gap-4">
                    <h2 class="text-sm font-black text-slate-800 uppercase tracking-widest">Master Grid</h2>
                    <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl">
                        <button onclick="changeSort('name')" id="sort-name" class="px-3 py-1.5 rounded-lg text-[10px] font-bold uppercase transition-all text-slate-400 hover:text-slate-600">Name</button>
                        <button onclick="changeSort('avg')" id="sort-avg" class="px-3 py-1.5 rounded-lg text-[10px] font-bold uppercase transition-all bg-white shadow-sm">Rank</button>
                        <button onclick="changeSort('diff')" id="sort-diff" class="px-3 py-1.5 rounded-lg text-[10px] font-bold uppercase transition-all text-slate-400 hover:text-slate-600">Trend</button>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-3 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        </div>
                        <input type="text" id="gameSearch" oninput="applyFilters()" placeholder="Filter games..." class="pl-9 pr-4 py-2 bg-slate-100 rounded-xl text-xs font-bold outline-none focus:ring-2 focus:ring-indigo-400 w-48 transition-all border-none">
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="exportCSV()" class="btn-action bg-slate-800 text-white hover:bg-slate-900">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                            CSV
                        </button>
                        <button onclick="openExportModal()" class="btn-action bg-indigo-600 text-white hover:bg-indigo-700 shadow-lg shadow-indigo-100">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                            Share
                        </button>
                    </div>
                </div>
            </div>
            <div id="tableWrapper" class="table-container custom-scroll">
                <table id="rankingsTable">
                    <thead><tr id="headerRow"><th>Game</th><th class="text-center">AVG</th><th class="text-center">Trend</th></tr></thead>
                    <tbody id="rankingBody"></tbody>
                </table>
            </div>
            <div id="loadingOverlay" class="p-20 flex flex-col items-center justify-center gap-4">
                <div class="w-10 h-10 border-4 border-indigo-100 border-t-indigo-600 rounded-full animate-spin"></div>
                <p class="text-[11px] font-black text-slate-400 uppercase tracking-[0.2em]">Synthesizing Records</p>
            </div>
            <div id="emptyState" class="hidden p-20 text-center">
                <div class="text-slate-200 mb-3 flex justify-center"><svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9.172 9.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>
                <p class="text-slate-400 font-bold uppercase tracking-wider text-xs">No matching records</p>
            </div>
        </main>
    </div>
    <div id="exportModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-md">
        <div class="bg-white rounded-[2rem] w-full max-w-4xl max-h-[95vh] overflow-hidden flex flex-col shadow-2xl scale-up-animation">
            <div class="p-6 border-b flex items-center justify-between">
                <div>
                    <h3 class="text-xl font-black text-slate-900 leading-tight">Social Image Generator</h3>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1">Export visual rankings for Sportomax</p>
                </div>
                <button onclick="closeExportModal()" class="p-3 hover:bg-slate-100 rounded-2xl text-slate-400 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-6 bg-slate-50 custom-scroll">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                    <div class="flex flex-col gap-1.5">
                        <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest ml-1">Rank Source</label>
                        <select id="exportYear" onchange="generateGrid()" class="bg-white border-2 border-slate-100 rounded-2xl px-4 py-2.5 text-xs font-bold outline-none focus:border-indigo-400">
                            <option value="all">All Time Average</option>
                        </select>
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest ml-1">Grid Pattern</label>
                        <select id="exportSize" onchange="generateGrid()" class="bg-white border-2 border-slate-100 rounded-2xl px-4 py-2.5 text-xs font-bold outline-none focus:border-indigo-400">
                            <option value="9">Top 9 (3x3)</option>
                            <option value="16" selected>Top 16 (4x4)</option>
                            <option value="25">Top 25 (5x5)</option>
                            <option value="50">Top 50 (5x10)</option>
                        </select>
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest ml-1">Thumbnail Zoom</label>
                        <div class="flex items-center justify-between bg-white border-2 border-slate-100 rounded-2xl px-4 py-2.5">
                            <span class="text-[10px] font-black text-slate-400">FIT</span>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="zoomFill" class="sr-only peer" checked onchange="generateGrid()">
                                <div class="w-10 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600"></div>
                            </label>
                            <span class="text-[10px] font-black text-indigo-600 uppercase">Fill</span>
                        </div>
                    </div>
                    <div class="flex items-end"><button onclick="generateGrid()" class="w-full bg-slate-800 text-white px-5 py-2.5 rounded-2xl text-[10px] font-black hover:bg-slate-900 transition-colors uppercase tracking-widest">Update Preview</button></div>
                </div>
                <div id="captureAreaContainer" class="flex justify-center p-2"><div id="captureArea" class="bg-white shadow-2xl rounded-2xl overflow-hidden" style="width: 800px;"></div></div>
            </div>
            <div class="p-6 border-t bg-white flex flex-col md:flex-row justify-between items-center gap-4">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Hint: high-res 2x scaling applied on download</p>
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <button onclick="downloadImage('png')" class="flex-1 md:flex-none bg-slate-100 hover:bg-slate-200 text-slate-800 font-black py-3 px-8 rounded-2xl text-xs uppercase tracking-widest transition-all">Download PNG</button>
                    <button onclick="downloadImage('jpg')" class="flex-1 md:flex-none bg-indigo-600 hover:bg-indigo-700 text-white font-black py-3 px-8 rounded-2xl text-xs uppercase tracking-widest transition-all shadow-lg shadow-indigo-100">Download JPG</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const CSV_URL = 'alltimepub.csv';
        const BGG_COLLECTION_URL = '/api/bgg-helper?endpoint=collection&username=sportomax&stats=1';
        const IMAGE_PROXY = '/api/image-proxy?url=';
        let allGames = [], uniqueYears = [], collectionData = {}, currentSort = 'avg', sortDir = 1, currentFilteredGames = [];

        async function init() {
            try {
                updateStatus('FETCHING CSV...', 'indigo');
                const csvText = await fetch(CSV_URL).then(r => r.text());
                const csvData = parseCSV(csvText);
                updateStatus('FETCHING BGG DATA...', 'amber');
                await fetchCollection();
                processData(csvData);
                populateFilters();
                renderStats();
                applyFilters();
                document.getElementById('loadingOverlay').classList.add('hidden');
                updateStatus('READY', 'emerald');
                document.getElementById('statusPulse').classList.remove('animate-pulse');
            } catch (err) { console.error(err); updateStatus('ERROR', 'rose'); }
        }

        function parseCSV(text) {
            const lines = text.trim().split('\n'), headers = lines[0].split(',').map(h => h.trim());
            return lines.slice(1).map(line => {
                const values = line.split(','), obj = {};
                headers.forEach((h, i) => obj[h] = values[i]?.trim());
                return obj;
            });
        }

        async function fetchCollection() {
            try {
                const response = await fetch(BGG_COLLECTION_URL), text = await response.text();
                const parser = new DOMParser(), xml = parser.parseFromString(text, 'text/xml');
                xml.querySelectorAll('item').forEach(item => {
                    const id = item.getAttribute('objectid');
                    collectionData[id] = { 
                        thumbnail: item.querySelector('thumbnail')?.textContent, 
                        image: item.querySelector('image')?.textContent, 
                        name: item.querySelector('name')?.textContent 
                    };
                });
            } catch (e) { console.error('BGG Load Error:', e); }
        }

        function processData(csvData) {
            const gamesMap = {}, yearSet = new Set();
            csvData.forEach(row => {
                const id = row.id, year = row.year, rank = parseInt(row.rank);
                if (!gamesMap[id]) gamesMap[id] = { id, name: row.name, ranks: {}, avg: 0, diff: 0, count: 0 };
                gamesMap[id].ranks[year] = rank;
                yearSet.add(year);
            });
            uniqueYears = Array.from(yearSet).sort((a, b) => b - a);
            allGames = Object.values(gamesMap).map(game => {
                const ranks = Object.values(game.ranks);
                game.count = ranks.length;
                game.avg = parseFloat((ranks.reduce((a, b) => a + b, 0) / ranks.length).toFixed(1));
                const yearsPresent = Object.keys(game.ranks).sort();
                if (yearsPresent.length > 1) {
                    const oldest = game.ranks[yearsPresent[0]], newest = game.ranks[yearsPresent[yearsPresent.length - 1]];
                    game.diff = oldest - newest;
                }
                return game;
            });
            document.getElementById('gameCountDisplay').textContent = `${allGames.length} Games`;
        }

        function sortGames(gameList) {
            const yf = document.getElementById('yearFilter').value;
            gameList.sort((a, b) => {
                let valA, valB;
                if (yf === 'all') {
                    if (currentSort === 'avg') { valA = a.avg; valB = b.avg; }
                    else if (currentSort === 'name') { valA = a.name; valB = b.name; }
                    else { valA = a.diff; valB = b.diff; }
                } else {
                    valA = a.ranks[yf] || 9999;
                    valB = b.ranks[yf] || 9999;
                }
                return (valA < valB ? -1 : (valA > valB ? 1 : 0)) * sortDir;
            });
        }

        function toggleSortDir() {
            sortDir *= -1;
            document.getElementById('sortDirLabel').textContent = sortDir === 1 ? 'ASCENDING' : 'DESCENDING';
            document.getElementById('sortDirIcon').style.transform = sortDir === 1 ? `rotate(${sortDir === 1 ? 0 : 180}deg)`;
            applyFilters();
        }

        function changeSort(key) {
            if (currentSort === key) sortDir *= -1; else { currentSort = key; sortDir = 1; }
            ['name', 'avg', 'diff'].forEach(k => {
                const btn = document.getElementById(`sort-${k}`);
                btn.className = k === currentSort ? 'px-3 py-1.5 rounded-lg text-[10px] font-bold uppercase transition-all bg-white shadow-sm' : 'px-3 py-1.5 rounded-lg text-[10px] font-bold uppercase transition-all text-slate-400 hover:text-slate-600';
            });
            applyFilters();
        }

        function populateFilters() {
            const yf = document.getElementById('yearFilter'), ey = document.getElementById('exportYear'), ry = document.getElementById('requiredYear');
            uniqueYears.forEach(y => {
                const opt = new Option(y, y);
                yf.add(opt); ey.add(opt.cloneNode(true)); ry.add(opt.cloneNode(true));
            });
        }

        function renderStats() {
            const ig = document.getElementById('insightsGrid'), climbers = [...allGames].sort((a,b) => b.diff - a.diff).slice(0, 1), consistent = allGames.filter(g => g.count === uniqueYears.length).sort((a,b) => a.avg - b.avg).slice(0, 1), newest = uniqueYears[0], champ = [...allGames].filter(g => g.ranks[newest]).sort((a,b) => (a.ranks[newest]||999) - (b.ranks[newest]||999)).slice(0, 1);
            const stats = [
                { label: 'Top Game', val: champ[0]?.name || 'N/A', sub: `#1 in ${newest}`, color: 'indigo' },
                { label: 'Most Improved', val: climbers[0]?.name || 'N/A', sub: `+${climbers[0]?.diff || 0} spots`, color: 'emerald' },
                { label: 'Consistent', val: consistent[0]?.name || 'N/A', sub: `Ranked every year`, color: 'amber' },
                { label: 'Collection', val: allGames.length, sub: 'Games tracked', color: 'slate' }
            ];
            ig.innerHTML = stats.map(s => `<div class="glass-card p-5 rounded-3xl border-l-4 border-l-${s.color}-500"><p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${s.label}</p><p class="text-sm font-black text-slate-800 truncate mt-1">${s.val}</p><p class="text-[9px] font-bold text-${s.color}-600 uppercase mt-1 tracking-wider">${s.sub}</p></div>`).join('');
        }

        function applyFilters() {
            const search = document.getElementById('gameSearch').value.toLowerCase(), minApps = parseInt(document.getElementById('minAppearances').value), reqYear = document.getElementById('requiredYear').value;
            currentFilteredGames = allGames.filter(g => {
                return g.name.toLowerCase().includes(search) && g.count >= minApps && (reqYear === 'any' || g.ranks[reqYear]);
            });
            sortGames(currentFilteredGames);
            renderTable(currentFilteredGames);
        }

        function renderTable(filteredData) {
            const hb = document.getElementById('headerRow'), rb = document.getElementById('rankingBody'), yf = document.getElementById('yearFilter').value;
            hb.innerHTML = `<th>Game</th>` + (yf === 'all' ? uniqueYears.map(y => `<th class="text-center">${y}</th>`).join('') : `<th class="text-center">${yf} Rank</th>`) + `<th class="text-center">AVG</th><th class="text-center">Trend</th>`;
            if (!filteredData.length) { document.getElementById('emptyState').classList.remove('hidden'); rb.innerHTML = ''; return; }
            document.getElementById('emptyState').classList.add('hidden');
            rb.innerHTML = filteredData.map(game => {
                const bgg = collectionData[game.id] || {}, thumb = bgg.thumbnail ? IMAGE_PROXY + encodeURIComponent(bgg.thumbnail) : 'https://via.placeholder.com/44?text=?';
                const trend = game.diff > 0 ? `<span class="trend-up">▲${game.diff}</span>` : (game.diff < 0 ? `<span class="trend-down">▼${Math.abs(game.diff)}</span>` : `<span class="trend-stable">-</span>`);
                let yearRanks = yf === 'all' ? uniqueYears.map(y => `<td class="rank-cell font-mono ${game.ranks[y] ? 'text-slate-800' : 'text-slate-200'}">${game.ranks[y] || '-'}</td>`).join('') : `<td class="rank-cell font-mono text-indigo-600 text-lg">${game.ranks[yf] || '-'}</td>`;
                return `<tr class="group"><td><div class="flex items-center gap-4"><img src="${thumb}" class="game-img group-hover:scale-110 transition-transform shadow-sm" loading="lazy"><div><div class="font-black text-slate-800 leading-none text-sm">${game.name}</div><div class="text-[9px] text-slate-400 font-bold uppercase mt-1.5 tracking-wider">${game.count} appearances</div></div></div></td>${yearRanks}<td class="text-center font-black text-slate-400 text-xs">${game.avg}</td><td class="text-center font-bold text-xs">${trend}</td></tr>`;
            }).join('');
        }

        function exportCSV() {
            const headers = ['ID', 'Name', 'Average', ...uniqueYears], rows = currentFilteredGames.map(g => [g.id, `"${g.name}"`, g.avg, ...uniqueYears.map(y => g.ranks[y] || '')]), content = [headers, ...rows].map(e => e.join(',')).join('\n'), blob = new Blob([content], { type: 'text/csv' }), url = window.URL.createObjectURL(blob), a = document.createElement('a');
            a.href = url; a.download = `sportomax_rankings_${new Date().toISOString().split('T')[0]}.csv`; document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }

        function openExportModal() { document.getElementById('exportModal').classList.remove('hidden'); generateGrid(); }
        function closeExportModal() { document.getElementById('exportModal').classList.add('hidden'); }
        
        async function generateGrid() {
            const area = document.getElementById('captureArea'), year = document.getElementById('exportYear').value, size = parseInt(document.getElementById('exportSize').value), zoomFill = document.getElementById('zoomFill').checked;
            
            // Use current filtered games and sort them specifically for the grid requested
            let games = [...currentFilteredGames];
            if (year === 'all') {
                // If it's all time, respect the main UI's current sort + direction
                // Or if the main UI is focus on a year, sort by average for "All Time" grid
                if (currentSort === 'avg' || document.getElementById('yearFilter').value !== 'all') {
                    games.sort((a,b) => (a.avg - b.avg) * sortDir);
                } else if (currentSort === 'name') {
                    games.sort((a,b) => a.name.localeCompare(b.name) * sortDir);
                } else {
                    games.sort((a,b) => (b.diff - a.diff) * sortDir);
                }
            } else {
                // Focused year: filter to those with ranks and sort by rank (respecting direction)
                games = games.filter(g => g.ranks[year]).sort((a,b) => (a.ranks[year] - b.ranks[year]) * sortDir);
            }
            
            const top = games.slice(0, size), cols = size === 9 ? 3 : (size === 16 ? 4 : 5);
            area.innerHTML = `<div class="p-8 bg-slate-900 text-white"><div class="flex items-center justify-between mb-8"><div><h2 class="text-3xl font-black italic uppercase tracking-tighter leading-none">Sportomax <span class="text-indigo-500">Library</span></h2><p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.4em] mt-2">${year === 'all' ? 'All Time Rankings' : year + ' Rankings'}</p></div><div class="text-right"><p class="text-lg font-black text-indigo-500 leading-none">#TOP${size}</p><p class="text-[8px] font-bold text-slate-500 uppercase tracking-[0.2em] mt-1">boardgamegeek.com</p></div></div><div class="export-grid" style="grid-template-columns: repeat(${cols}, 1fr); background: transparent; padding: 0;">${top.map((g, i) => { const bgg = collectionData[g.id] || {}, imgUrl = bgg.image ? IMAGE_PROXY + encodeURIComponent(bgg.image) : (bgg.thumbnail ? IMAGE_PROXY + encodeURIComponent(bgg.thumbnail) : ''); return `<div class="export-item">${imgUrl ? `<img src="${imgUrl}" crossorigin="anonymous" class="${zoomFill ? 'zoom-fill' : 'zoom-contain'}">` : '<div class="w-full h-full bg-slate-800"></div>'}<div class="export-rank">${i+1}</div><div class="export-name truncate px-1">${g.name}</div></div>`; }).join('')}</div><div class="mt-10 pt-6 border-t border-white/10 flex justify-between items-center text-[10px] font-black text-slate-500 uppercase tracking-[0.3em]"><span>Generated via Sportomax All Time</span><div class="flex items-center gap-2"><span class="w-1 h-1 bg-slate-700 rounded-full"></span><span>v2.1</span></div></div></div>`;
        }

        async function downloadImage(format) {
            const canvas = await html2canvas(document.getElementById('captureArea'), { useCORS: true, scale: 2, backgroundColor: '#0f172a' });
            const link = document.createElement('a');
            link.download = `sportomax_grid_${new Date().getTime()}.${format}`;
            link.href = canvas.toDataURL(`image/${format === 'jpg' ? 'jpeg' : 'png'}`, 0.9);
            link.click();
        }

        function updateStatus(text, color) { const st = document.getElementById('statusText'), sp = document.getElementById('statusPulse'); st.textContent = text; sp.className = `w-2 h-2 bg-${color}-500 rounded-full animate-pulse`; }
        init();
    </script>
</body>
</html>
