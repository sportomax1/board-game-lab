<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Time Rankings | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #1e293b; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 1);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        .table-container {
            overflow-x: auto;
            border-radius: 0.75rem;
            border: 1px solid #e2e8f0;
        }
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        th { background: #f1f5f9; color: #64748b; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.75rem 1rem; text-align: left; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #e2e8f0; }
        td { padding: 0.75rem 1rem; border-bottom: 1px solid #f1f5f9; font-size: 0.875rem; transition: background 0.2s; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f8fafc; }
        .rank-cell { font-weight: 700; text-align: center; }
        .game-img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; background: #e2e8f0; }
        .trend-up { color: #10b981; }
        .trend-down { color: #ef4444; }
        .trend-stable { color: #94a3b8; }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-spin-fast { animation: spin 0.6s linear infinite; }
        
        /* Custom scrollbar */
        .custom-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="p-3 md:p-6">
    <div class="max-w-7xl mx-auto space-y-4">
        <!-- Header -->
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 glass-card p-4 rounded-2xl">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-xl shadow-lg shadow-indigo-200">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-black text-slate-900 tracking-tight leading-none">All Time <span class="text-indigo-600">Rankings</span></h1>
                    <p class="text-[10px] text-slate-400 font-bold tracking-widest uppercase mt-1">Multi-Year Performance Tracker</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <div id="status" class="text-[10px] font-bold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full flex items-center gap-2">
                    <div id="statusPulse" class="w-1.5 h-1.5 bg-indigo-500 rounded-full animate-pulse"></div>
                    <span id="statusText">INITIALIZING...</span>
                </div>
            </div>
        </header>

        <!-- Stats Bar -->
        <div id="statsSummary" class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <!-- Populated by JS -->
        </div>

        <!-- Main Table Card -->
        <main class="glass-card rounded-2xl overflow-hidden">
            <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-white/50">
                <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider">Historical Comparison</h2>
                <div class="flex items-center gap-2">
                    <input type="text" id="gameSearch" placeholder="Filter games..." class="px-3 py-1.5 bg-slate-100 rounded-lg text-xs font-medium outline-none focus:ring-2 focus:ring-indigo-400 w-40 transition-all border-none">
                </div>
            </div>
            
            <div id="tableWrapper" class="table-container custom-scroll">
                <table id="rankingsTable">
                    <thead>
                        <tr id="headerRow">
                            <th>Game</th>
                            <!-- Years will be injected here -->
                            <th class="text-center">AVG</th>
                            <th class="text-center">DIFF</th>
                        </tr>
                    </thead>
                    <tbody id="rankingBody">
                        <!-- Data rows injected here -->
                    </tbody>
                </table>
            </div>
            
            <div id="loadingOverlay" class="p-12 flex flex-col items-center justify-center gap-3">
                <div class="w-8 h-8 border-4 border-indigo-100 border-t-indigo-600 rounded-full animate-spin"></div>
                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Loading Rankings Data...</p>
            </div>
            
            <div id="emptyState" class="hidden p-12 text-center">
                <p class="text-slate-400 font-medium">No matches found for your search.</p>
            </div>
        </main>
        
        <footer class="text-center py-4">
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Powered by Sportomax & BGG XML API v2</p>
        </footer>
    </div>

    <script>
        const CSV_URL = 'alltimepub.csv';
        const BGG_COLLECTION_URL = '/api/bgg-helper?endpoint=collection&username=sportomax&stats=1';
        
        let allGames = [];
        let uniqueYears = [];
        let collectionData = {};

        async function init() {
            try {
                updateStatus('FETCHING CSV...', 'indigo');
                const csvText = await fetch(CSV_URL).then(r => r.text());
                const csvData = parseCSV(csvText);
                
                updateStatus('FETCHING BGG IMAGES...', 'amber');
                await fetchCollection();
                
                processData(csvData);
                renderStats();
                renderTable();
                
                document.getElementById('loadingOverlay').classList.add('hidden');
                updateStatus('READY', 'emerald');
                document.getElementById('statusPulse').classList.remove('animate-pulse');
            } catch (err) {
                console.error(err);
                updateStatus('ERROR LOADING DATA', 'rose');
                document.getElementById('statusPulse').className = 'w-1.5 h-1.5 bg-rose-500 rounded-full';
            }
        }

        function parseCSV(text) {
            const lines = text.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim());
            return lines.slice(1).map(line => {
                const values = line.split(',');
                const obj = {};
                headers.forEach((h, i) => obj[h] = values[i]?.trim());
                return obj;
            });
        }

        async function fetchCollection() {
            try {
                const response = await fetch(BGG_COLLECTION_URL);
                const text = await response.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, 'text/xml');
                const items = xml.querySelectorAll('item');
                
                items.forEach(item => {
                    const id = item.getAttribute('objectid');
                    const thumbnail = item.querySelector('thumbnail')?.textContent;
                    const name = item.querySelector('name')?.textContent;
                    const own = item.querySelector('status')?.getAttribute('own') === '1';
                    
                    collectionData[id] = { thumbnail, name, own };
                });
            } catch (e) {
                console.error('Failed to load collection:', e);
            }
        }

        function processData(csvData) {
            const gamesMap = {};
            const yearSet = new Set();
            
            csvData.forEach(row => {
                const id = row.id;
                const year = row.year;
                const rank = parseInt(row.rank);
                
                if (!gamesMap[id]) {
                    gamesMap[id] = {
                        id: id,
                        name: row.name,
                        ranks: {},
                        avg: 0,
                        diff: 0
                    };
                }
                
                gamesMap[id].ranks[year] = rank;
                yearSet.add(year);
            });
            
            uniqueYears = Array.from(yearSet).sort((a, b) => b - a); // Newest first
            
            allGames = Object.values(gamesMap).map(game => {
                const ranks = Object.values(game.ranks);
                game.avg = (ranks.reduce((a, b) => a + b, 0) / ranks.length).toFixed(1);
                
                // Difference between oldest and newest appearance
                const yearsPresent = Object.keys(game.ranks).sort();
                if (yearsPresent.length > 1) {
                    const oldest = game.ranks[yearsPresent[0]];
                    const newest = game.ranks[yearsPresent[yearsPresent.length - 1]];
                    game.diff = oldest - newest; // Positive means rank improved (decreased)
                } else {
                    game.diff = 0;
                }
                
                return game;
            });
            
            // Initial sort: Newest year rank ascending
            const latestYear = uniqueYears[0];
            allGames.sort((a, b) => {
                const rankA = a.ranks[latestYear] || 9999;
                const rankB = b.ranks[latestYear] || 9999;
                return rankA - rankB;
            });
        }

        function renderStats() {
            const statsSummary = document.getElementById('statsSummary');
            const totalGames = allGames.length;
            const yearsCount = uniqueYears.length;
            const topPerformers = allGames.filter(g => g.diff > 0).length;
            
            statsSummary.innerHTML = `
                <div class="glass-card p-3 rounded-xl">
                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Total Games</p>
                    <p class="text-xl font-black text-slate-800">${totalGames}</p>
                </div>
                <div class="glass-card p-3 rounded-xl">
                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Years Tracked</p>
                    <p class="text-xl font-black text-slate-800">${yearsCount}</p>
                </div>
                <div class="glass-card p-3 rounded-xl">
                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Climbers</p>
                    <p class="text-xl font-black text-emerald-600">${topPerformers}</p>
                </div>
                <div class="glass-card p-3 rounded-xl">
                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Newest Data</p>
                    <p class="text-xl font-black text-indigo-600">${uniqueYears[0] || 'N/A'}</p>
                </div>
            `;
        }

        function renderTable(filter = '') {
            const headerRow = document.getElementById('headerRow');
            const rankingBody = document.getElementById('rankingBody');
            
            // Setup Headers
            headerRow.innerHTML = `
                <th>Game</th>
                ${uniqueYears.map(y => `<th class="text-center">${y}</th>`).join('')}
                <th class="text-center">AVG</th>
                <th class="text-center">TREND</th>
            `;
            
            const filteredGames = allGames.filter(g => 
                g.name.toLowerCase().includes(filter.toLowerCase())
            );
            
            if (filteredGames.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
                rankingBody.innerHTML = '';
            } else {
                document.getElementById('emptyState').classList.add('hidden');
                rankingBody.innerHTML = filteredGames.map(game => {
                    const bgg = collectionData[game.id] || {};
                    const thumb = bgg.thumbnail || 'https://via.placeholder.com/40?text=?';
                    
                    const trendIcon = game.diff > 0 
                        ? `<span class="trend-up">▲ ${game.diff}</span>` 
                        : (game.diff < 0 ? `<span class="trend-down">▼ ${Math.abs(game.diff)}</span>` : `<span class="trend-stable">-</span>`);

                    return `
                        <tr>
                            <td>
                                <div class="flex items-center gap-3">
                                    <img src="${thumb}" class="game-img" alt="${game.name}">
                                    <div>
                                        <div class="font-bold text-slate-800 leading-tight">${game.name}</div>
                                        <div class="text-[10px] text-slate-400 font-medium">BGG ID: ${game.id}</div>
                                    </div>
                                </div>
                            </td>
                            ${uniqueYears.map(y => {
                                const rank = game.ranks[y];
                                return `<td class="rank-cell font-mono ${rank ? 'text-slate-800' : 'text-slate-200'}">${rank || '-'}</td>`;
                            }).join('')}
                            <td class="text-center font-bold text-slate-500">${game.avg}</td>
                            <td class="text-center font-bold text-xs">${trendIcon}</td>
                        </tr>
                    `;
                }).join('');
            }
        }

        function updateStatus(text, color) {
            const statusText = document.getElementById('statusText');
            const statusPulse = document.getElementById('statusPulse');
            statusText.textContent = text;
            statusPulse.className = `w-1.5 h-1.5 bg-${color}-500 rounded-full animate-pulse`;
        }

        document.getElementById('gameSearch').addEventListener('input', (e) => {
            renderTable(e.target.value);
        });

        init();
    </script>
</body>
</html>
