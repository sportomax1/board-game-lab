<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>BGG Overboxed Game</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>📦</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #e67e22 0%, #d35400 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow: hidden;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 600px;
        }

        .screen.active {
            display: block;
        }

        .setup-card, .game-card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 2rem;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        input[type="text"], select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #e67e22;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e67e22, #d35400);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(230, 126, 34, 0.4);
        }

        .btn-secondary {
            background: #ecf0f1;
            color: #2c3e50;
        }

        .btn-secondary:hover {
            background: #bdc3c7;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border-radius: 8px;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .timer {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .score {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .orders-container {
            margin-bottom: 1.5rem;
        }

        .order-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
            border: 3px solid transparent;
            transition: all 0.3s;
        }

        .order-card.active {
            border-color: #e67e22;
            box-shadow: 0 4px 12px rgba(230, 126, 34, 0.3);
        }

        .order-card.completed {
            opacity: 0.5;
            background: #d5f4e6;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .customer-name {
            font-weight: 700;
            color: #2c3e50;
            font-size: 1.1rem;
        }

        .order-timer {
            background: #e74c3c;
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .order-timer.warning {
            animation: pulse 1s infinite;
        }

        .order-items {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .order-item {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            border: 2px solid #e0e0e0;
        }

        .order-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .order-item.collected::after {
            content: '✓';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(46, 204, 113, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            font-weight: bold;
        }

        .shelf-container {
            margin-bottom: 1.5rem;
        }

        .shelf-label {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.75rem;
            text-align: center;
        }

        .shelf-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 0.5rem;
        }

        @media (max-width: 600px) {
            .shelf-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .shelf-item {
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: transform 0.3s;
            border: 3px solid #e0e0e0;
        }

        .shelf-item:hover {
            transform: scale(1.05);
            border-color: #e67e22;
        }

        .shelf-item.selected {
            border-color: #2ecc71;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.5);
        }

        .shelf-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .action-buttons .btn {
            flex: 1;
        }

        .game-over-screen {
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .game-over-screen h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .final-score {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .stat-label {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #7f8c8d;
        }

        .error-message {
            background: #e74c3c;
            color: white;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .controls {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .controls .btn {
            flex: 1;
            min-width: 120px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.5rem;
            }

            .setup-card, .game-card {
                padding: 1.5rem;
            }

            .order-item {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <!-- Setup Screen -->
    <div id="setupScreen" class="screen active">
        <div class="setup-card">
            <h1>📦 BGG Overboxed</h1>
            <p class="subtitle">Frantically fulfill board game orders before time runs out!</p>

            <div class="form-group">
                <label for="usernameInput">BGG Username</label>
                <input type="text" id="usernameInput" placeholder="Enter your BGG username" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="difficultySelect">Difficulty</label>
                <select id="difficultySelect">
                    <option value="easy">Easy - 90s per order, 3 items</option>
                    <option value="medium" selected>Medium - 60s per order, 4 items</option>
                    <option value="hard">Hard - 45s per order, 5 items</option>
                </select>
            </div>

            <button class="btn btn-primary" onclick="startGame()">Start Game</button>
            <button class="btn btn-secondary" onclick="window.location.href='home.html'">Back to Home</button>

            <div id="errorMessage" class="error-message" style="display: none;"></div>
            <div id="loadingMessage" class="loading" style="display: none;">
                Loading your collection...
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="screen">
        <div class="game-card">
            <h1>📦 Overboxed</h1>
            
            <div id="gameOverScreen" style="display: none;"></div>

            <div class="game-header">
                <div>
                    <div style="font-size: 0.85rem; opacity: 0.9;">Time</div>
                    <div class="timer" id="gameTimer">60</div>
                </div>
                <div>
                    <div style="font-size: 0.85rem; opacity: 0.9;">Score</div>
                    <div class="score" id="gameScore">0</div>
                </div>
                <div>
                    <div style="font-size: 0.85rem; opacity: 0.9;">Orders</div>
                    <div class="score" id="ordersComplete">0</div>
                </div>
            </div>

            <div class="orders-container" id="ordersContainer">
                <!-- Orders will be inserted here -->
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" onclick="submitOrder()" id="submitBtn" disabled>
                    Submit Order (0 items)
                </button>
                <button class="btn btn-secondary" onclick="clearSelection()">
                    Clear Selection
                </button>
            </div>

            <div class="shelf-container">
                <div class="shelf-label">📚 Your Collection - Tap to Select</div>
                <div class="shelf-grid" id="shelfGrid">
                    <!-- Shelf items will be inserted here -->
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-secondary" id="pauseBtn" onclick="pauseGame(this)">Pause</button>
                <button class="btn btn-secondary" onclick="backToSetup()">Exit</button>
            </div>
        </div>
    </div>

    <script>
        const IMAGE_PROXY = 'https://images.weserv.nl/?url=';
        let collection = [];
        let difficulty = 'medium';
        let gameActive = false;
        let gamePaused = false;
        let score = 0;
        let ordersCompleted = 0;
        let currentOrders = [];
        let selectedItems = [];
        let gameTimer = null;
        let orderTimers = {};
        
        const DIFFICULTY_SETTINGS = {
            easy: { orderTime: 90, itemsPerOrder: 3, maxOrders: 3 },
            medium: { orderTime: 60, itemsPerOrder: 4, maxOrders: 4 },
            hard: { orderTime: 45, itemsPerOrder: 5, maxOrders: 5 }
        };

        const CUSTOMER_NAMES = [
            'Alice', 'Bob', 'Charlie', 'Diana', 'Eve', 'Frank', 'Grace', 'Henry',
            'Ivy', 'Jack', 'Kate', 'Leo', 'Mia', 'Nick', 'Olivia', 'Paul'
        ];

        async function startGame() {
            const username = document.getElementById('usernameInput').value.trim();
            const errorEl = document.getElementById('errorMessage');
            const loadingEl = document.getElementById('loadingMessage');

            errorEl.style.display = 'none';
            
            if (!username) {
                errorEl.textContent = 'Please enter a BGG username';
                errorEl.style.display = 'block';
                return;
            }

            difficulty = document.getElementById('difficultySelect').value;
            loadingEl.style.display = 'block';

            try {
                const response = await fetch(`https://boardgamegeek.com/xmlapi2/collection?username=${username}&own=1`);
                const text = await response.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, 'text/xml');

                const items = xml.querySelectorAll('item');
                
                if (items.length === 0) {
                    throw new Error('No games found in collection');
                }

                collection = Array.from(items).map(item => {
                    const name = item.querySelector('name');
                    const thumbnail = item.querySelector('thumbnail');
                    const objectid = item.getAttribute('objectid');
                    
                    return {
                        id: objectid,
                        name: name ? name.textContent : 'Unknown',
                        thumbnail: thumbnail ? thumbnail.textContent : null,
                    };
                }).filter(game => game.thumbnail);

                const minGames = DIFFICULTY_SETTINGS[difficulty].itemsPerOrder * DIFFICULTY_SETTINGS[difficulty].maxOrders + 10;
                if (collection.length < minGames) {
                    throw new Error(`Need at least ${minGames} games with thumbnails for ${difficulty} mode`);
                }

                loadingEl.style.display = 'none';
                localStorage.setItem('overboxed_username', username);
                initializeGame();
            } catch (error) {
                loadingEl.style.display = 'none';
                errorEl.textContent = `Error loading collection: ${error.message}`;
                errorEl.style.display = 'block';
            }
        }

        function initializeGame() {
            score = 0;
            ordersCompleted = 0;
            currentOrders = [];
            selectedItems = [];
            gameActive = true;
            gamePaused = false;

            // Shuffle collection for shelf
            collection = collection.sort(() => Math.random() - 0.5);

            renderShelf();
            generateOrder();
            updateUI();
            
            // Switch to game screen
            document.getElementById('setupScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.add('active');
            document.getElementById('gameOverScreen').style.display = 'none';
        }

        function renderShelf() {
            const shelfGrid = document.getElementById('shelfGrid');
            const displayCount = Math.min(collection.length, 20);
            
            shelfGrid.innerHTML = collection.slice(0, displayCount).map((game, idx) => `
                <div class="shelf-item" onclick="selectShelfItem(${idx})" data-game-id="${game.id}">
                    <img src="${IMAGE_PROXY}${game.thumbnail}" alt="${game.name}"
                         onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23ecf0f1%22/><text x=%2250%22 y=%2250%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2240%22>🎲</text></svg>'">
                </div>
            `).join('');
        }

        function generateOrder() {
            if (!gameActive) return;

            const settings = DIFFICULTY_SETTINGS[difficulty];
            if (currentOrders.length >= settings.maxOrders) return;

            const orderItems = [];
            const availableGames = [...collection];
            
            for (let i = 0; i < settings.itemsPerOrder; i++) {
                const randomIndex = Math.floor(Math.random() * availableGames.length);
                orderItems.push({ ...availableGames[randomIndex], collected: false });
                availableGames.splice(randomIndex, 1);
            }

            const order = {
                id: Date.now(),
                customer: CUSTOMER_NAMES[Math.floor(Math.random() * CUSTOMER_NAMES.length)],
                items: orderItems,
                timeLeft: settings.orderTime,
                completed: false
            };

            currentOrders.push(order);
            startOrderTimer(order.id);
            renderOrders();
        }

        function startOrderTimer(orderId) {
            orderTimers[orderId] = setInterval(() => {
                if (gamePaused || !gameActive) return;

                const order = currentOrders.find(o => o.id === orderId);
                if (!order || order.completed) {
                    clearInterval(orderTimers[orderId]);
                    return;
                }

                order.timeLeft--;

                if (order.timeLeft <= 0) {
                    clearInterval(orderTimers[orderId]);
                    failOrder(orderId);
                }

                renderOrders();
            }, 1000);
        }

        function renderOrders() {
            const container = document.getElementById('ordersContainer');
            
            container.innerHTML = currentOrders.map(order => {
                const allCollected = order.items.every(item => item.collected);
                const isWarning = order.timeLeft <= 10;
                
                return `
                    <div class="order-card ${allCollected ? 'active' : ''} ${order.completed ? 'completed' : ''}">
                        <div class="order-header">
                            <div class="customer-name">${order.customer}</div>
                            <div class="order-timer ${isWarning ? 'warning' : ''}">${order.timeLeft}s</div>
                        </div>
                        <div class="order-items">
                            ${order.items.map(item => `
                                <div class="order-item ${item.collected ? 'collected' : ''}">
                                    <img src="${IMAGE_PROXY}${item.thumbnail}" alt="${item.name}">
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectShelfItem(index) {
            if (!gameActive || gamePaused) return;

            const game = collection[index];
            const shelfItems = document.querySelectorAll('.shelf-item');
            const item = shelfItems[index];

            // Check if already selected
            const existingIndex = selectedItems.findIndex(s => s.id === game.id);
            if (existingIndex >= 0) {
                selectedItems.splice(existingIndex, 1);
                item.classList.remove('selected');
            } else {
                selectedItems.push(game);
                item.classList.add('selected');
            }

            updateSubmitButton();
        }

        function updateSubmitButton() {
            const btn = document.getElementById('submitBtn');
            btn.textContent = `Submit Order (${selectedItems.length} items)`;
            btn.disabled = selectedItems.length === 0;
        }

        function clearSelection() {
            selectedItems = [];
            document.querySelectorAll('.shelf-item').forEach(item => {
                item.classList.remove('selected');
            });
            updateSubmitButton();
        }

        function submitOrder() {
            if (selectedItems.length === 0) return;

            // Find order that matches selected items
            for (const order of currentOrders) {
                if (order.completed) continue;

                let matched = true;
                const orderCopy = [...order.items];

                for (const selected of selectedItems) {
                    const itemIndex = orderCopy.findIndex(item => item.id === selected.id && !item.collected);
                    if (itemIndex >= 0) {
                        order.items[itemIndex].collected = true;
                        orderCopy.splice(itemIndex, 1);
                    }
                }

                // Check if order is complete
                if (order.items.every(item => item.collected)) {
                    completeOrder(order.id);
                    break;
                }
            }

            clearSelection();
            renderOrders();
        }

        function completeOrder(orderId) {
            const order = currentOrders.find(o => o.id === orderId);
            if (!order) return;

            order.completed = true;
            clearInterval(orderTimers[orderId]);

            // Calculate score based on time left
            const timeBonus = Math.floor(order.timeLeft * 10);
            score += 100 + timeBonus;
            ordersCompleted++;

            // Remove completed order after delay
            setTimeout(() => {
                currentOrders = currentOrders.filter(o => o.id !== orderId);
                renderOrders();
                
                // Generate new order
                if (gameActive) {
                    generateOrder();
                }
            }, 1000);

            updateUI();
        }

        function failOrder(orderId) {
            const order = currentOrders.find(o => o.id === orderId);
            if (!order) return;

            // Remove failed order
            currentOrders = currentOrders.filter(o => o.id !== orderId);
            renderOrders();

            // Game over if no orders left
            if (currentOrders.length === 0) {
                endGame();
            } else {
                // Generate new order
                generateOrder();
            }
        }

        function updateUI() {
            document.getElementById('gameScore').textContent = score;
            document.getElementById('ordersComplete').textContent = ordersCompleted;
        }

        function pauseGame(btn) {
            gamePaused = !gamePaused;
            btn.textContent = gamePaused ? 'Resume' : 'Pause';
        }

        function endGame() {
            gameActive = false;
            
            // Clear all timers
            Object.values(orderTimers).forEach(timer => clearInterval(timer));

            const gameOverEl = document.getElementById('gameOverScreen');
            gameOverEl.innerHTML = `
                <div class="game-over-screen">
                    <h2>Game Over! 📦</h2>
                    <div class="final-score">${score}</div>
                    <div style="font-size: 1.1rem; margin-bottom: 1rem;">Final Score</div>
                    <div class="stats">
                        <div class="stat-item">
                            <div class="stat-value">${ordersCompleted}</div>
                            <div class="stat-label">Orders Completed</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${difficulty.toUpperCase()}</div>
                            <div class="stat-label">Difficulty</div>
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="initializeGame()" style="margin-top: 1rem;">
                        Play Again
                    </button>
                </div>
            `;
            gameOverEl.style.display = 'block';
        }

        function backToSetup() {
            gameActive = false;
            Object.values(orderTimers).forEach(timer => clearInterval(timer));
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('setupScreen').classList.add('active');
        }

        // Load saved username
        window.addEventListener('DOMContentLoaded', () => {
            const savedUsername = localStorage.getItem('overboxed_username');
            if (savedUsername) {
                document.getElementById('usernameInput').value = savedUsername;
            }
        });
    </script>
    <!-- Vercel Web Analytics -->
    <script type="module" src="analytics-init.js"></script>
</body>
</html>
