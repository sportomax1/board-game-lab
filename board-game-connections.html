<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Board Game Connections</title><script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script><style>:root{font-family:system-ui;color:#e7edf5;background:#101820}*{box-sizing:border-box}body{margin:0}header{padding:18px 24px;background:#182534;border-bottom:1px solid #344455}h1{margin:0;font-size:23px}small,.muted{color:#a8b7c8}nav{display:flex;gap:6px;overflow:auto;padding:12px 20px;background:#182534}button,select,input{font:inherit;background:#223448;color:#edf4ff;border:1px solid #3c5065;border-radius:8px;padding:9px 12px}button{cursor:pointer}button.active{background:#286aa3}main{padding:18px;max-width:1500px;margin:auto}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:16px}.controls label{display:grid;gap:5px;font-size:12px;color:#b5c6d7}.panel{background:#182534;border:1px solid #344455;border-radius:12px;padding:16px;margin-bottom:14px}#graph{height:560px;width:100%;background:#101b28;border-radius:10px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #33465a;text-align:left}th{color:#a7bbd0;cursor:pointer}tr:hover{background:#223448}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.chip{display:inline-block;padding:3px 8px;background:#30465e;border-radius:15px;margin:2px}a{color:#83c5ff}input[type=file]{max-width:280px}.scroll{overflow:auto}.node{cursor:pointer}#details{min-height:65px}.stat{font-size:24px;font-weight:700}@media(max-width:700px){#graph{height:420px}header{padding:14px}main{padding:12px}}</style></head><body><header><h1>Board Game Connections</h1><small>Board Game Lab · Designer, artist and publisher shared credits</small></header><nav id="tabs"></nav><main><div class="controls"><label>Search<input id="search" placeholder="Person, publisher, game"></label><label>Relationship<select id="relation"><option value="all">All relationships</option><option value="designer-designer">Designer ↔ Designer</option><option value="designer-artist">Designer ↔ Artist</option><option value="designer-publisher">Designer ↔ Publisher</option><option value="artist-publisher">Artist ↔ Publisher</option><option value="artist-artist">Artist ↔ Artist</option><option value="publisher-publisher">Publisher ↔ Publisher</option></select></label><label>Minimum shared games<input id="minimum" type="number" min="1" value="1" style="width:110px"></label><label>From year<input id="from" type="number" min="1800" placeholder="Any" style="width:110px"></label><label>Through year<input id="to" type="number" min="1800" placeholder="Any" style="width:110px"></label><button id="reset">Reset filters</button></div><div id="view"></div></main><script>
const demo=[{id:1,name:"Demo Game Alpha",year:2020,designers:["Designer A","Designer B"],artists:["Artist C"],publishers:["Publisher D"]},{id:2,name:"Demo Game Beta",year:2022,designers:["Designer A","Designer B"],artists:["Artist C"],publishers:["Publisher E"]},{id:3,name:"Demo Game Gamma",year:2024,designers:["Designer B"],artists:["Artist F"],publishers:["Publisher D"]},{id:4,name:"Demo Game Delta",year:2025,designers:["Designer A"],artists:["Artist C"],publishers:["Publisher D"]}];let games=JSON.parse(localStorage.getItem("bgc_games")||"null")||demo;let tab="Network";let selected=null;const tabs=["Network","Matrix","Rankings","Explorer","Paths","Settings"];const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const roles=[["designers","designer"],["artists","artist"],["publishers","publisher"]];function filteredGames(){return games.filter(g=>(!$("from").value||+g.year>=+$("from").value)&&(!$("to").value||+g.year<=+$("to").value))}function graphData(){let nodes=new Map(),edges=new Map();for(const g of filteredGames()){let credits=[];for(const [field,role] of roles)for(const name of g[field]||[]){let id=role+":"+name;if(!nodes.has(id))nodes.set(id,{id,name,role,games:[]});nodes.get(id).games.push(g);credits.push(id)}for(let i=0;i<credits.length;i++)for(let j=i+1;j<credits.length;j++){let a=credits[i],b=credits[j],ra=nodes.get(a).role,rb=nodes.get(b).role;let type=[ra,rb].sort((x,y)=>["designer","artist","publisher"].indexOf(x)-["designer","artist","publisher"].indexOf(y)).join("-");if($("relation").value!=="all"&&type!==$("relation").value)continue;let key=[a,b].sort().join("|");if(!edges.has(key))edges.set(key,{source:a,target:b,type,games:[]});edges.get(key).games.push(g)}}let links=[...edges.values()].filter(e=>e.games.length>=Math.max(1,+$("minimum").value||1));let ids=new Set(links.flatMap(e=>[e.source,e.target]));let q=$("search").value.trim().toLowerCase();if(q){links=links.filter(e=>[e.source,e.target,...e.games.map(g=>g.name)].some(v=>v.toLowerCase().includes(q)));ids=new Set(links.flatMap(e=>[e.source,e.target]))}return{nodes:[...nodes.values()].filter(n=>ids.has(n.id)),links}}function gameList(arr){return [...new Map(arr.map(g=>[g.id||g.name,g])).values()].map(g=>'<span class="chip">'+esc(g.name)+' ('+esc(g.year)+')</span>').join("")}function showDetails(e){selected=e;$("details").innerHTML='<b>'+esc(e.name||e.source.name+" ↔ "+e.target.name)+'</b><p>'+esc(e.role||e.type||"")+' · '+e.games.length+' game credits</p>'+gameList(e.games)}var activeSimulation=null;function renderNetwork(data){if(activeSimulation){activeSimulation.stop();activeSimulation=null}if(data.nodes.length>350||data.links.length>700){let ranked=[...data.links].sort((a,b)=>b.games.length-a.games.length).slice(0,700),keep=new Set(ranked.flatMap(e=>[e.source,e.target]));data={links:ranked,nodes:data.nodes.filter(n=>keep.has(n.id)).sort((a,b)=>b.games.length-a.games.length).slice(0,350)};let keep2=new Set(data.nodes.map(n=>n.id));data.links=data.links.filter(e=>keep2.has(e.source)&&keep2.has(e.target))}$("view").innerHTML='<div class="panel"><div id="graph"></div><div id="details" class="panel muted">Select a node or connection to inspect shared games.</div></div>';if(!window.d3){$("graph").textContent="D3 could not load. Use Rankings or Matrix instead.";return}let el=$("graph"),w=el.clientWidth,h=el.clientHeight;let svg=d3.select(el).append("svg").attr("width","100%").attr("height","100%").attr("viewBox",[0,0,w,h]);let root=svg.append("g");svg.call(d3.zoom().scaleExtent([.2,5]).on("zoom",ev=>root.attr("transform",ev.transform)));let nodes=data.nodes.map(n=>({...n})),links=data.links.map(l=>({...l}));let sim=d3.forceSimulation(nodes);activeSimulation=sim;sim.force("link",d3.forceLink(links).id(d=>d.id).distance(110)).force("charge",d3.forceManyBody().strength(-230)).force("center",d3.forceCenter(w/2,h/2)).force("collide",d3.forceCollide(30));let line=root.append("g").selectAll("line").data(links).join("line").attr("stroke","#6c859c").attr("stroke-opacity",.65).attr("stroke-width",d=>Math.min(9,1+d.games.length*1.5)).on("click",(ev,d)=>showDetails(d));let node=root.append("g").selectAll("g").data(nodes).join("g").attr("class","node").call(d3.drag().on("start",(ev,d)=>{if(!ev.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y}).on("drag",(ev,d)=>{d.fx=ev.x;d.fy=ev.y}).on("end",(ev,d)=>{if(!ev.active)sim.alphaTarget(0);d.fx=null;d.fy=null})).on("click",(ev,d)=>showDetails(d));node.append("circle").attr("r",d=>Math.min(24,9+d.games.length*2)).attr("fill",d=>({designer:"#3b82f6",artist:"#a855f7",publisher:"#d99535"}[d.role]));node.append("text").attr("dy",-21).attr("text-anchor","middle").attr("font-size",11).attr("fill","#e8f2ff").text(d=>d.name);sim.on("tick",()=>{line.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);node.attr("transform",d=>"translate("+d.x+","+d.y+")")})}function renderTable(data,mode){let links=[...data.links].sort((a,b)=>b.games.length-a.games.length).slice(0,500);$("view").innerHTML='<div class="panel scroll"><table><thead><tr><th>Entity A</th><th>Entity B</th><th>Relationship</th><th>Shared games</th><th>Game titles</th></tr></thead><tbody>'+links.map((e,i)=>'<tr data-i="'+i+'"><td>'+esc(e.source)+'</td><td>'+esc(e.target)+'</td><td>'+esc(e.type)+'</td><td>'+e.games.length+'</td><td>'+gameList(e.games)+'</td></tr>').join("")+'</tbody></table></div>';if(!links.length)$("view").innerHTML='<div class="panel">No relationships match these filters.</div>'}function renderExplorer(data){data.nodes=data.nodes.sort((a,b)=>b.games.length-a.games.length).slice(0,250);$("view").innerHTML='<div class="grid">'+data.nodes.sort((a,b)=>b.games.length-a.games.length).map(n=>'<div class="panel"><b>'+esc(n.name)+'</b><p class="muted">'+esc(n.role)+' · '+n.games.length+' game credits</p>'+gameList(n.games)+'</div>').join("")+'</div>'}function renderPaths(data){let options=data.nodes.map(n=>'<option value="'+esc(n.id)+'">'+esc(n.name)+' ('+esc(n.role)+')</option>').join("");$("view").innerHTML='<div class="panel"><h3>Shortest connection path</h3><div class="controls"><label>From<select id="pathA">'+options+'</select></label><label>To<select id="pathB">'+options+'</select></label><button id="findPath">Find path</button></div><div id="pathResult"></div></div>';$("findPath").onclick=()=>{let start=$("pathA").value,end=$("pathB").value,adj=new Map();for(const e of data.links){for(const [a,b] of [[e.source,e.target],[e.target,e.source]]){if(!adj.has(a))adj.set(a,[]);adj.get(a).push({id:b,edge:e})}}let queue=[start],seen=new Set([start]),prev=new Map();while(queue.length){let cur=queue.shift();if(cur===end)break;for(const n of adj.get(cur)||[])if(!seen.has(n.id)){seen.add(n.id);prev.set(n.id,{from:cur,edge:n.edge});queue.push(n.id)}}if(!seen.has(end)){$("pathResult").textContent="No connection found.";return}let path=[],cur=end;while(cur!==start){let p=prev.get(cur);path.unshift({from:p.from,to:cur,edge:p.edge});cur=p.from}$("pathResult").innerHTML=path.length?path.map(p=>'<p><b>'+esc(p.from.split(":").slice(1).join(":"))+' → '+esc(p.to.split(":").slice(1).join(":"))+'</b><div>'+gameList(p.edge.games)+'</div></p>').join(""):"Same entity selected."};if(data.nodes.length>1)$("pathB").selectedIndex=1}function renderSettings(){$("view").innerHTML='<div class="panel"><h3>Import game credits</h3><p class="muted">Import a JSON array of games with id, name, year, designers[], artists[], publishers[]. Or CSV with columns id,name,year,designers,artists,publishers; separate multiple credits with semicolons. Imported data stays in this browser.</p><input type="file" id="file" accept=".json,.csv"><button id="demo">Load demo data</button><button id="export">Export JSON</button><p id="importStatus"></p><p>'+games.length+' games currently loaded.</p></div>';$("file").onchange=async ev=>{try{let file=ev.target.files[0],txt=await file.text(),rows;if(file.name.toLowerCase().endsWith(".json")){rows=JSON.parse(txt);if(!Array.isArray(rows))rows=rows.games}else{let lines=txt.trim().split(/\r?\n/),parse=line=>{let out=[],s="",quote=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'&&line[i+1]==='"'&&quote){s+='"';i++}else if(c==='"')quote=!quote;else if(c===","&&!quote){out.push(s);s=""}else s+=c}out.push(s);return out};let cols=parse(lines.shift()).map(s=>s.trim().toLowerCase());rows=lines.map(line=>Object.fromEntries(parse(line).map((v,i)=>[cols[i],v])))}if(!Array.isArray(rows))throw Error("Expected an array of games");games=rows.map((g,i)=>({id:g.id||i+1,name:String(g.name||g.title||"Untitled"),year:Number(g.year)||0,...Object.fromEntries(roles.map(([field])=>[field,Array.isArray(g[field])?g[field].filter(Boolean):String(g[field]||"").split(";").map(s=>s.trim()).filter(Boolean)]))}));localStorage.setItem("bgc_games",JSON.stringify(games));render()}catch(e){$("importStatus").textContent="Import failed: "+e.message}};$("demo").onclick=()=>{games=demo;localStorage.setItem("bgc_games",JSON.stringify(games));render()};$("export").onclick=()=>{let a=document.createElement("a"),blob=new Blob([JSON.stringify(games,null,2)],{type:"application/json"});a.href=URL.createObjectURL(blob);a.download="board-game-connections.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}function render(){if(tab!=="Network"&&activeSimulation){activeSimulation.stop();activeSimulation=null}let data=tab==="Settings"?{nodes:[],links:[]}:graphData();$("tabs").innerHTML=tabs.map(t=>'<button class="'+(t===tab?"active":"")+'" data-tab="'+t+'">'+t+'</button>').join("");$("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});if(tab==="Network")renderNetwork(data);else if(tab==="Matrix"||tab==="Rankings")renderTable(data,tab);else if(tab==="Explorer")renderExplorer(data);else if(tab==="Paths")renderPaths(data);else renderSettings()}["search","relation","minimum","from","to"].forEach(id=>$(id).addEventListener("input",render));$("reset").onclick=()=>{["search","from","to"].forEach(id=>$(id).value="");$("minimum").value=1;$("relation").value="all";render()};render();

/* Live BGG XML API2 integration through the existing authenticated Vercel proxy. */
const BGG_PROXY='/api/bgg-helper';
let liveLoading=false;
function parseBggXML(xml){const doc=new DOMParser().parseFromString(xml,'application/xml');if(doc.querySelector('parsererror'))throw Error('Invalid BGG XML response');return doc}
async function bggFetch(endpoint,params){const u=new URL(BGG_PROXY,location.origin);u.searchParams.set('endpoint',endpoint);for(const [k,v] of Object.entries(params))u.searchParams.set(k,v);const response=await fetch(u.toString(),{headers:{Accept:'application/xml'}});const body=await response.text();if(!response.ok){let msg=body.slice(0,220);try{const j=JSON.parse(body);msg=j.message||j.error||msg}catch{}throw Error('BGG '+response.status+': '+msg)}if(body.trim().startsWith('{')){let j=JSON.parse(body);if(j.xml||j.data)return parseBggXML(j.xml||j.data);throw Error(j.message||'Unexpected proxy response')}return parseBggXML(body)}
function readThing(item){let name=item.querySelector('name[type="primary"]')?.getAttribute('value')||item.querySelector('name')?.getAttribute('value')||'Unknown';let links=(type)=>[...item.querySelectorAll('link[type="'+type+'"]')].map(x=>({id:x.getAttribute('id'),name:x.getAttribute('value')})).filter(x=>x.id&&x.name);return{id:item.getAttribute('id'),name,year:Number(item.querySelector('yearpublished')?.getAttribute('value'))||0,designers:links('boardgamedesigner').map(x=>x.name),artists:links('boardgameartist').map(x=>x.name),publishers:links('boardgamepublisher').map(x=>x.name),credits:{designers:links('boardgamedesigner'),artists:links('boardgameartist'),publishers:links('boardgamepublisher')},image:item.querySelector('thumbnail')?.textContent||'',bggUrl:'https://boardgamegeek.com/boardgame/'+item.getAttribute('id')}}
function persistGames(){try{if(games.length>250)return;localStorage.setItem('bgc_games',JSON.stringify(games))}catch(e){console.warn('Local storage limit reached; current session still has imported data',e)}}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function loadBGG(){if(liveLoading)return;const username=($('bggUsername')?.value||'sportomax').trim(),limit=Number($('bggLimit')?.value||100);if(!/^[\w-]{1,60}$/.test(username)){alert('Enter a valid BGG username');return}liveLoading=true;let status=$('bggStatus'),btn=$('bggLoad');btn.disabled=true;let collected=[];try{status.textContent='Fetching '+username+' collection from BGG…';let collection;for(let attempt=0;attempt<4;attempt++){try{collection=await bggFetch('collection',{username,excludesubtype:'boardgameexpansion'});break}catch(e){if(attempt===3)throw e;status.textContent='Collection queued or busy; retrying…';await sleep(2500*(attempt+1))}}let ids=[...new Set([...collection.querySelectorAll('item[objectid]')].map(x=>x.getAttribute('objectid')).filter(x=>/^\d+$/.test(x)))];if(!ids.length)throw Error('No collection games returned. Check the username and BGG access.');ids=ids.slice(0,limit===0?ids.length:limit);status.textContent='Found '+ids.length+' game IDs. Loading credits…';let errors=[];for(let i=0;i<ids.length;i+=20){let batch=ids.slice(i,i+20);try{let xml=await bggFetch('thing',{id:batch.join(','),fast:'1'});let parsed=[...xml.querySelectorAll('item[id]')].map(readThing);collected.push(...parsed);games=[...collected];persistGames();status.textContent='Loaded '+collected.length+' of '+ids.length+' games ('+Math.min(i+20,ids.length)+' IDs checked)…';}catch(e){errors.push('Batch '+(Math.floor(i/20)+1)+': '+e.message);status.textContent='Skipped a failed batch; continuing ('+errors.length+' failures)…'}if(i+20<ids.length)await sleep(1300)}if(!collected.length)throw Error(errors.join('; ')||'No game credits were returned');localStorage.setItem('bgc_username',username);localStorage.setItem('bgc_real', '1');status.textContent='Loaded '+collected.length+' real BGG games for '+username+'. '+(errors.length?errors.length+' batches failed; retry to complete.':'');render();}catch(e){status.textContent='BGG import failed: '+e.message;if(collected.length){games=collected;persistGames();render()}}finally{liveLoading=false;btn.disabled=false}}
const previousSettings=renderSettings;
renderSettings=function(){previousSettings();const panel=$('view').querySelector('.panel');panel.insertAdjacentHTML('afterbegin','<h3>Live BoardGameGeek collection</h3><p class="muted">Retrieve actual game credits through the existing authenticated BGG API proxy. Large collections take time; choose a sample size first.</p><div class="controls"><label>BGG username<input id="bggUsername" value="'+esc(localStorage.getItem('bgc_username')||'sportomax')+'"></label><label>Games to retrieve<select id="bggLimit"><option value="100">First 100</option><option value="250">First 250</option><option value="500">First 500</option><option value="0">Entire collection (slow)</option></select></label><button id="bggLoad">Load real BGG data</button></div><p id="bggStatus" role="status">'+(localStorage.getItem('bgc_real')==='1'?'Real BGG data previously imported.':'Demo data loaded. Click to fetch real BGG credits.')+'</p><hr>');$('bggLoad').onclick=loadBGG};
const oldRender=render;
render=function(){oldRender();if(tab!=='Settings'&&localStorage.getItem('bgc_real')!=='1'&&!document.getElementById('realNotice')){const notice=document.createElement('div');notice.id='realNotice';notice.className='panel';notice.innerHTML='<b>Demo data</b> is currently displayed. Open <button id="realSettings">Settings → Load real BGG data</button> to retrieve actual game credits.';$('view').prepend(notice);$('realSettings').onclick=()=>{tab='Settings';render()}}};
render();

/* Persistent BGG data and high-throughput batch loader. */
const CACHE_DB='BGConnectionsCache',CACHE_STORE='games',CACHE_META='metadata';
function openConnectionsDB(){return new Promise((resolve,reject)=>{let q=indexedDB.open(CACHE_DB,1);q.onupgradeneeded=()=>{let db=q.result;if(!db.objectStoreNames.contains(CACHE_STORE))db.createObjectStore(CACHE_STORE,{keyPath:'id'});if(!db.objectStoreNames.contains(CACHE_META))db.createObjectStore(CACHE_META)};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function dbAll(){let db=await openConnectionsDB();return new Promise((resolve,reject)=>{let tx=db.transaction(CACHE_STORE,'readonly'),q=tx.objectStore(CACHE_STORE).getAll();q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);tx.oncomplete=()=>db.close()})}
async function dbSave(batch){if(!batch.length)return;let db=await openConnectionsDB();return new Promise((resolve,reject)=>{let tx=db.transaction(CACHE_STORE,'readwrite');for(let g of batch)tx.objectStore(CACHE_STORE).put(g);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>reject(tx.error)})}
async function dbClear(){let db=await openConnectionsDB();return new Promise((resolve,reject)=>{let tx=db.transaction([CACHE_STORE,CACHE_META],'readwrite');tx.objectStore(CACHE_STORE).clear();tx.objectStore(CACHE_META).clear();tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>reject(tx.error)})}
let currentUsername=localStorage.getItem('bgc_username')||'sportomax',loadingAbort=null,loadedCount=0,loadedTotal=0,failedBatches=0,apiStatus='Ready',syncBusy=false;
function syncStatus(){let s=$('syncStatus');if(s)s.textContent=apiStatus+' · '+loadedCount+'/'+loadedTotal+' games · '+failedBatches+' failed batches';let b=$('syncButton');if(b)b.textContent=syncBusy?'Cancel loading':'Fetch BGG'}
function topBar(){if($('bggTop'))return;let bar=document.createElement('section');bar.id='bggTop';bar.className='panel';bar.style.cssText='margin:12px 18px 0;display:flex;gap:12px;align-items:end;flex-wrap:wrap';bar.innerHTML='<label style="display:grid;gap:4px;font-size:12px">BGG username<input id="topUsername" value="'+esc(currentUsername)+'"></label><label style="display:grid;gap:4px;font-size:12px">Games<select id="topLimit"><option value="100">100</option><option value="500">500</option><option value="0" selected>Entire collection</option></select></label><label style="display:grid;gap:4px;font-size:12px">Parallel workers<select id="topWorkers"><option value="4">4 (gentle)</option><option value="8" selected>8 (recommended)</option><option value="20">20</option><option value="50">50</option><option value="100">100 (aggressive)</option></select></label><button id="syncButton">Fetch BGG</button><button id="cacheButton">Load IndexedDB</button><small id="syncStatus" role="status"></small>';document.querySelector('header').after(bar);$('syncButton').onclick=()=>{if(syncBusy){loadingAbort?.abort();return}syncBGG()};$('cacheButton').onclick=restoreCache;syncStatus()}
async function restoreCache(){try{if(localStorage.getItem('bgc_cache_owner')&&localStorage.getItem('bgc_cache_owner')!==currentUsername){apiStatus='Cache belongs to another username';syncStatus();return}let cached=await dbAll();if(cached.length){games=cached;loadedCount=cached.length;loadedTotal=cached.length;localStorage.setItem('bgc_real','1');apiStatus='IndexedDB cache loaded';render()}else apiStatus='IndexedDB cache empty';syncStatus()}catch(e){apiStatus='IndexedDB unavailable: '+e.message;syncStatus()}}
async function syncBGG(){let username=$('topUsername').value.trim(),limit=Number($('topLimit').value),workers=Number($('topWorkers').value);if(!/^[\w-]{1,60}$/.test(username)){apiStatus='Invalid username';syncStatus();return}if(workers===100&&!confirm('100 simultaneous requests may trigger BGG throttling. Continue?'))return;currentUsername=username;localStorage.setItem('bgc_username',username);syncBusy=true;loadingAbort=new AbortController();failedBatches=0;loadedCount=0;loadedTotal=0;apiStatus='Fetching collection';syncStatus();try{let xml;for(let i=0;i<5;i++){try{xml=await bggFetch('collection',{username,excludesubtype:'boardgameexpansion'});break}catch(e){if(loadingAbort.signal.aborted)throw Error('Cancelled');if(i===4)throw e;await sleep(2500*(i+1))}}let ids=[...new Set([...xml.querySelectorAll('item[objectid]')].map(x=>x.getAttribute('objectid')).filter(x=>/^\d+$/.test(x)))];if(limit)ids=ids.slice(0,limit);loadedTotal=ids.length;if(localStorage.getItem('bgc_cache_owner')!==username){await dbClear();localStorage.setItem('bgc_cache_owner',username)}let existing=await dbAll(),cached=new Map(existing.map(g=>[String(g.id),g]));let missing=ids.filter(id=>!cached.has(id));loadedCount=ids.length-missing.length;apiStatus='Fetching game credits';syncStatus();let batches=[];for(let i=0;i<missing.length;i+=20)batches.push(missing.slice(i,i+20));let cursor=0,errors=[];async function worker(){while(cursor<batches.length&&!loadingAbort.signal.aborted){let batch=batches[cursor++],success=false;for(let retry=0;retry<4&&!success&&!loadingAbort.signal.aborted;retry++){try{let doc=await bggFetch('thing',{id:batch.join(','),fast:'1'});let parsed=[...doc.querySelectorAll('item[id]')].map(readThing);if(!parsed.length)throw Error('Empty batch');await dbSave(parsed);for(let g of parsed)cached.set(String(g.id),g);loadedCount+=parsed.length;success=true;apiStatus='Loading';syncStatus()}catch(e){if(retry===3){failedBatches++;errors.push(e.message);syncStatus()}else await sleep(Math.min(15000,1500*2**retry)+Math.random()*1000)}}}}await Promise.all(Array.from({length:Math.min(workers,batches.length||1)},()=>worker()));games=ids.map(id=>cached.get(id)).filter(Boolean);if(games.length){localStorage.setItem('bgc_real','1');render()}apiStatus=loadingAbort.signal.aborted?'Cancelled; partial data cached':errors.length?'Finished with '+errors.length+' failed batches':'BGG sync complete';syncStatus()}catch(e){apiStatus='BGG error: '+e.message;syncStatus()}finally{syncBusy=false;loadingAbort=null;syncStatus()}}
const originalRenderFinal=render;render=function(){originalRenderFinal();topBar();syncStatus()};
topBar();restoreCache();
</script></body></html>
