<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BGG Collection Collage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 10px;
            overscroll-behavior: none;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            font-size: 1.5em;
            margin: 15px 0;
            color: #333;
        }
        
        .controls {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .form-group {
            margin-bottom: 12px;
        }
        
        .form-label {
            display: block;
            font-weight: 600;
            font-size: 0.95em;
            margin-bottom: 6px;
            color: #333;
        }
        
        .form-input,
        .form-select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
        }
        
        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: #2196F3;
            box-shadow: 0 0 0 3px rgba(33,150,243,0.1);
        }
        
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }
        
        button {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-load {
            background: #2196F3;
            color: white;
        }
        
        .btn-load:hover:not(:disabled) {
            background: #1976D2;
        }
        
        .btn-load:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .btn-print {
            background: #4CAF50;
            color: white;
        }
        
        .btn-print:hover:not(:disabled) {
            background: #45a049;
        }
        
        .btn-print:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9em;
            text-align: center;
        }
        
        .status.loading {
            background: #e3f2fd;
            color: #1976D2;
        }
        
        .status.success {
            background: #e8f5e9;
            color: #388E3C;
        }
        
        .status.error {
            background: #ffebee;
            color: #C62828;
        }
        
        .preview {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .preview-title {
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
            font-size: 0.95em;
        }
        
        .collage {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
            gap: 3px;
            margin-top: 10px;
        }
        
        .collage-tile {
            aspect-ratio: 1;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            background: #f9f9f9;
            position: relative;
            cursor: pointer;
        }
        
        .collage-tile img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: white;
        }
        
        .collage-tile:hover {
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            z-index: 10;
        }
        
        .tile-number {
            position: absolute;
            top: 2px;
            left: 2px;
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 8px;
            padding: 1px 2px;
            border-radius: 2px;
            font-weight: bold;
            min-width: 16px;
            text-align: center;
        }
        
        .info {
            font-size: 0.85em;
            color: #666;
            margin-top: 10px;
            text-align: center;
        }
        
        @media print {
            body {
                background: white;
                padding: 0;
            }
            
            .controls {
                display: none;
            }
            
            .container {
                max-width: 100%;
            }
            
            .preview {
                box-shadow: none;
                padding: 0;
                background: transparent;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎲 My Collection</h1>
        
        <div class="controls">
            <div class="form-group">
                <label class="form-label">BGG Username</label>
                <input type="text" id="username" class="form-input" value="sportomax" placeholder="Enter BGG username">
            </div>
            
            <div class="button-group">
                <button id="loadBtn" class="btn-load">Load Collection</button>
                <button id="printBtn" class="btn-print" disabled>Print Collage</button>
            </div>
            
            <div id="status" class="status" style="display: none;"></div>
        </div>
        
        <div id="preview" class="preview" style="display: none;">
            <div class="preview-title">📸 Collection Collage</div>
            <div id="collage" class="collage"></div>
            <div id="info" class="info"></div>
        </div>
    </div>

    <script>
        let collectionGames = [];
        
        // Show status message
        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }
        
        // Hide status message
        function hideStatus() {
            document.getElementById('status').style.display = 'none';
        }
        
        // BGG API fetch with retry logic
        async function fetchBGG(endpoint, params = {}, retries = 5) {
            const queryParams = new URLSearchParams(params).toString();
            const fullUrl = `/api/bgg-helper?endpoint=${endpoint}&${queryParams}`;
            
            try {
                const response = await fetch(fullUrl);
                
                if (response.status === 202 && retries > 0) {
                    await new Promise(resolve => setTimeout(resolve, 3000));
                    return fetchBGG(endpoint, params, retries - 1);
                }
                
                if (!response.ok) {
                    throw new Error(`BGG error: ${response.status}`);
                }
                
                return await response.text();
            } catch (error) {
                console.error('Fetch error:', error);
                throw error;
            }
        }
        
        // Fetch collection
        async function loadCollection() {
            const username = document.getElementById('username').value.trim();
            
            if (!username) {
                showStatus('Please enter a BGG username', 'error');
                return;
            }
            
            const loadBtn = document.getElementById('loadBtn');
            loadBtn.disabled = true;
            
            showStatus('Fetching your collection...', 'loading');
            
            try {
                const xml = await fetchBGG('collection', {
                    username: username,
                    own: '1'
                });
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(xml, 'text/xml');
                
                if (doc.documentElement.nodeName === 'parsererror') {
                    throw new Error('Failed to parse BGG response');
                }
                
                const items = Array.from(doc.querySelectorAll('item'));
                const games = [];
                
                items.forEach(item => {
                    const name = item.querySelector('name')?.textContent || 'Unknown';
                    const thumbnail = item.querySelector('thumbnail')?.textContent || '';
                    
                    if (thumbnail) {
                        games.push({ name, thumbnail });
                    }
                });
                
                if (games.length === 0) {
                    showStatus('No games found in collection', 'error');
                    loadBtn.disabled = false;
                    return;
                }
                
                collectionGames = games;
                
                showStatus(`✓ Loaded ${games.length} games`, 'success');
                document.getElementById('printBtn').disabled = false;
                
                displayCollage();
                
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
                loadBtn.disabled = false;
            }
        }
        
        // Display collage
        function displayCollage() {
            const collage = document.getElementById('collage');
            const info = document.getElementById('info');
            const preview = document.getElementById('preview');
            
            collage.innerHTML = '';
            
            collectionGames.forEach((game, index) => {
                const tile = document.createElement('div');
                tile.className = 'collage-tile';
                tile.title = game.name;
                
                const img = document.createElement('img');
                img.src = game.thumbnail;
                img.alt = game.name;
                
                const number = document.createElement('div');
                number.className = 'tile-number';
                number.textContent = index + 1;
                
                tile.appendChild(img);
                tile.appendChild(number);
                collage.appendChild(tile);
            });
            
            info.textContent = `${collectionGames.length} games • Tap 'Print Collage' to save as PDF`;
            preview.style.display = 'block';
        }
        
        // Print collage
        function printCollage() {
            const username = document.getElementById('username').value;
            
            let printHtml = `<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>${username} - BGG Collection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: white; }
        
        .header {
            text-align: center;
            padding: 10mm;
            border-bottom: 2px solid #333;
        }
        
        .title { font-size: 24px; font-weight: bold; margin-bottom: 5px; }
        .subtitle { font-size: 12px; color: #666; }
        
        .page {
            page-break-after: always;
            padding: 10mm;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 2px;
            margin-top: 10px;
        }
        
        .tile {
            aspect-ratio: 1;
            border: 1px solid #ddd;
            position: relative;
            overflow: hidden;
            background: white;
        }
        
        .tile img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .number {
            position: absolute;
            top: 2px;
            left: 2px;
            background: rgba(0,0,0,0.8);
            color: white;
            font-size: 10px;
            padding: 2px 4px;
            font-weight: bold;
        }
        
        @media print {
            body { margin: 0; padding: 0; }
            .page { page-break-inside: avoid; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">🎲 ${username}</div>
        <div class="subtitle">BGG Collection (${collectionGames.length} games)</div>
    </div>
`;

            // Split into pages (100 games per page in 10x10 grid)
            for (let pageNum = 0; pageNum < Math.ceil(collectionGames.length / 100); pageNum++) {
                const start = pageNum * 100;
                const end = Math.min(start + 100, collectionGames.length);
                const pageGames = collectionGames.slice(start, end);
                
                printHtml += `<div class="page"><div class="grid">`;
                
                pageGames.forEach((game, idx) => {
                    const number = start + idx + 1;
                    printHtml += `
                        <div class="tile">
                            <img src="${game.thumbnail}" alt="${game.name}" onerror="this.style.display='none'">
                            <div class="number">${number}</div>
                        </div>
                    `;
                });
                
                printHtml += `</div></div>`;
            }
            
            printHtml += `</body></html>`;
            
            const printWindow = window.open();
            printWindow.document.write(printHtml);
            printWindow.document.close();
        }
        
        // Event listeners
        document.getElementById('loadBtn').addEventListener('click', loadCollection);
        document.getElementById('printBtn').addEventListener('click', printCollage);
        
        document.getElementById('username').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loadCollection();
            }
        });
    </script>
</body>
</html>
