'use strict';
const $=id=>document.getElementById(id), BATCH=20, LIMIT=100, ROW_LIMIT=60;
let games=[],filtered=[],selected=null,controller=null,run=0,seed=0,visibleShelves=24,allRows=[];
const val=(e,s)=>e.querySelector(s)?.getAttribute('value')||'', txt=(e,s)=>e.querySelector(s)?.textContent?.trim()||'', num=v=>Number.isFinite(+v)&&v!==''?+v:0, esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=v=>{try{const u=new URL(v);return u.protocol==='https:'||u.protocol==='http:'?u.href:''}catch{return ''}}, image=g=>safeUrl(g.image||g.thumb), thumb=g=>safeUrl(g.thumb||g.image), link=g=>'https://boardgamegeek.com/boardgame/'+encodeURIComponent(g.id);
const delay=(ms,signal)=>new Promise((resolve,reject)=>{if(signal.aborted)return reject(new DOMException('Aborted','AbortError'));const timer=setTimeout(()=>{signal.removeEventListener('abort',abort);resolve()},ms);function abort(){clearTimeout(timer);reject(new DOMException('Aborted','AbortError'))}signal.addEventListener('abort',abort,{once:true})});
async function api(params,signal){for(let i=0;i<6;i++){try{const response=await fetch('/api/bgg-helper?'+new URLSearchParams(params),{signal});if(response.ok&&response.status!==202){const doc=new DOMParser().parseFromString(await response.text(),'application/xml');if(doc.querySelector('parsererror,errors,error')||doc.documentElement.localName!=='items')throw Error('Invalid BGG response');return doc}if(![202,429,500,502,503,504].includes(response.status))throw Error('HTTP '+response.status);const retry=Number(response.headers.get('Retry-After'));await delay(Math.max(retry>0?retry*1000:0,1000*2**i)+Math.random()*500,signal)}catch(e){if(signal.aborted||i===5)throw e;await delay(1000*2**i+Math.random()*500,signal)}}throw Error('BGG did not return data after retries')}
function normalize(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^\p{L}\p{N}.]+/gu,' ').trim()}
function rawFields(item){const out=[];for(const e of [item,...item.querySelectorAll('*')]){if(!e.children.length&&e.textContent.trim()&&!['image','thumbnail'].includes(e.localName))out.push(e.textContent.trim());for(const a of e.attributes){if(a.name==='value'||a.name==='id'||a.name==='objectid'||a.name==='year'||a.name==='name'||a.name==='type'||a.name==='rank'||a.name==='minplayers'||a.name==='maxplayers'||a.name==='playingtime'||a.name==='minplaytime'||a.name==='maxplaytime'){out.push(a.value)}}}return out.join(' ')}
function searchIndex(g){const statusNames={own:'owned',prevowned:'previously owned',want:'want',wanttoplay:'want to play',wanttobuy:'want to buy',wishlist:'wishlist',fortrade:'for trade',preordered:'preordered'};g.searchText=normalize([g.name,g.id,g.year,g.description,g.categories,g.mechanics,g.publishers,g.designers,g.artists,g.time?g.time+' min '+g.time+' minutes':'',g.min&&g.max?Array.from({length:Math.min(100,Math.max(0,g.max-g.min+1))},(_,i)=>(g.min+i)+' players').join(' '):'',g.plays+' plays',g.plays===0?'never played unplayed':'played',g.rating?'personal rating '+g.rating:'',g.average?'bgg rating '+g.average.toFixed(2)+' '+g.average.toFixed(1):'',g.weight?'weight '+g.weight.toFixed(2)+' '+g.weight.toFixed(1):'',...Object.keys(g.statuses||{}).filter(k=>g.statuses[k]).map(k=>statusNames[k]),g.collectionFields,g.thingFields].flat(Infinity).join(' '))}
function collection(item){const st=item.querySelector('stats'),status=item.querySelector('status');return {collectionFields:rawFields(item),statuses:Object.fromEntries(['own','prevowned','want','wanttoplay','wanttobuy','wishlist','fortrade','preordered'].map(k=>[k,status?.getAttribute(k)==='1'])),id:item.getAttribute('objectid'),name:txt(item,'name'),thumb:txt(item,'thumbnail'),image:txt(item,'image'),year:num(txt(item,'yearpublished')),plays:num(txt(item,'numplays')),rating:num(val(item,'stats rating')),average:num(val(item,'stats rating average')),weight:0,min:num(st?.getAttribute('minplayers')||''),max:num(st?.getAttribute('maxplayers')||''),time:num(st?.getAttribute('maxplaytime')||st?.getAttribute('playingtime')||''),description:'',categories:[],mechanics:[],publishers:[],designers:[],artists:[],enriched:false}}
function links(item,type){return [...new Set([...item.querySelectorAll('link[type="'+type+'"]')].map(x=>x.getAttribute('value')).filter(Boolean))]}
function enrich(g,item){Object.assign(g,{image:txt(item,'image')||g.image,thumb:txt(item,'thumbnail')||g.thumb,min:num(val(item,'minplayers'))||g.min,max:num(val(item,'maxplayers'))||g.max,time:num(val(item,'playingtime'))||num(val(item,'maxplaytime'))||g.time,weight:num(val(item,'statistics ratings averageweight')),average:num(val(item,'statistics ratings average'))||g.average,description:txt(item,'description'),categories:links(item,'boardgamecategory'),mechanics:links(item,'boardgamemechanic'),publishers:links(item,'boardgamepublisher'),designers:links(item,'boardgamedesigner'),artists:links(item,'boardgameartist'),thingFields:rawFields(item),enriched:true});searchIndex(g)}
function meta(g){return [g.min&&g.max?(g.min===g.max?g.min:g.min+'–'+g.max)+' players':'',g.time?g.time+' min':'',g.weight?g.weight.toFixed(2)+' weight':'',g.plays+' plays',g.average?'BGG '+g.average.toFixed(1):''].filter(Boolean).join(' · ')}
function artwork(g,small=false){const src=small?thumb(g):image(g);return src?'<img '+(small?'loading="lazy" ':'')+'decoding="async" src="'+esc(src)+'" alt="'+esc(g.name)+'">':'<div class="placeholder">No artwork</div>'}
function spotlight(g,reason){if(!g)return;selected=g;const hero=$('hero');hero.innerHTML=artwork(g)+'<div class="info"><div class="muted">'+esc(reason||'SPOTLIGHT')+'</div><h2>'+esc(g.name)+'</h2><div class="muted">'+esc(meta(g))+'</div><p class="desc">'+esc(g.description||'Explore this game from your collection.')+'</p><div class="actions"><button id="prev">‹ Previous</button><button id="next">Next ›</button><button id="more" class="primary">Details</button><a class="action" href="'+link(g)+'" target="_blank" rel="noopener">BGG ↗</a></div></div>';hero.style.setProperty('--art',image(g)?'url('+JSON.stringify(image(g))+')':'none');$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('more').onclick=()=>details(g);document.querySelectorAll('.tile').forEach(t=>t.setAttribute('aria-current',String(t.dataset.id===g.id)))}
function step(n){if(!filtered.length)return;let i=filtered.findIndex(g=>g.id===selected?.id);spotlight(filtered[(i+n+filtered.length)%filtered.length])}
function details(g){$('detailbody').innerHTML=artwork(g)+'<h2>'+esc(g.name)+'</h2><div>'+esc(meta(g))+'</div><p>'+esc([['Categories',g.categories],['Mechanics',g.mechanics],['Publishers',g.publishers],['Designers',g.designers],['Artists',g.artists]].filter(x=>x[1]?.length).map(x=>x[0]+': '+x[1].join(', ')).join('\n'))+'</p><p>'+esc(g.description||'Detailed description unavailable.')+'</p><a class="action" href="'+link(g)+'" target="_blank" rel="noopener">View on BGG</a>';$('details').showModal()}
$('close').onclick=()=>$('details').close();
function ordered(predicate,score){return filtered.filter(predicate).sort((a,b)=>score(b)-score(a)||a.name.localeCompare(b.name)).slice(0,ROW_LIMIT)}
function hash(s){let h=seed|0;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
function discoveryRows(){const groups=[['categories','Category'],['mechanics','Mechanic'],['publishers','Publisher'],['designers','Designer'],['artists','Artist']];const mode=$('shelfType').value;const result=[];for(const [key,label] of groups){if(mode!=='all'&&mode!==key)continue;const index=new Map();for(const g of filtered){for(const name of g[key]||[]){if(!index.has(name))index.set(name,[]);index.get(name).push(g)}}for(const [name,items] of index){if(items.length<2)continue;const title=label+' · '+name;const list=items.slice().sort((a,b)=>hash(title+'|'+b.id)-hash(title+'|'+a.id)).slice(0,ROW_LIMIT);result.push([title,list,items.length,key])}}return result.sort((a,b)=>hash(a[0])-hash(b[0])||a[0].localeCompare(b[0]))}
function renderNavigation(){const q=$('sectionSearch').value.trim().toLowerCase();const list=$('sectionList');const y=list.scrollTop;const rows=allRows.filter(r=>!q||r[0].toLowerCase().includes(q));$('sectionTotal').textContent=rows.length+' sections'+(q?' found':'');const frag=document.createDocumentFragment();for(const [title,items,total] of rows){const b=document.createElement('button');b.type='button';b.title=title;b.innerHTML='<span>'+esc(title)+'</span><small>'+esc(total||items.length)+'</small>';b.onclick=()=>jumpTo(title);frag.append(b)}list.replaceChildren(frag);list.scrollTop=y}
function jumpTo(title){const index=allRows.findIndex(r=>r[0]===title);if(index<0)return;if(index>=visibleShelves){visibleShelves=index+1;appendShelves()}const section=[...$('rows').children].find(e=>e.dataset.shelfTitle===title);section?.scrollIntoView({behavior:'smooth',block:'start'});closeNav()}
function closeNav(){$('sidebar').classList.remove('open');$('sidebarToggle').setAttribute('aria-expanded','false')}
function buildShelf(row){const [title,items,total]=row;const section=document.createElement('section');section.className='shelf';section.dataset.shelfTitle=title;section.innerHTML='<div class="shelfhead"><h2>'+esc(title)+(total?' <small class="muted">('+total+')</small>':'')+'</h2><button aria-label="Scroll '+esc(title)+' left">‹</button><button aria-label="Scroll '+esc(title)+' right">›</button></div><div class="rail"></div>';const rail=section.querySelector('.rail');rail.dataset.title=title;for(const g of items){const tile=document.createElement('button');tile.className='tile';tile.setAttribute('aria-current',String(g.id===selected?.id));tile.dataset.id=g.id;tile.title=g.name;tile.innerHTML=artwork(g,true)+'<span>'+esc(g.name)+'</span><small>'+esc((g.time?g.time+' min · ':'')+g.plays+' plays')+'</small>';tile.onclick=()=>spotlight(g,title);tile.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const target=e.key==='ArrowRight'?tile.nextElementSibling:tile.previousElementSibling;target?.focus({preventScroll:true});if(target)target.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});if(target){const next=games.find(x=>x.id===target.dataset.id);spotlight(next,title)}}});rail.append(tile)}const buttons=section.querySelectorAll('.shelfhead button');buttons.forEach((b,i)=>b.onclick=()=>rail.scrollBy({left:(i?1:-1)*rail.clientWidth*.85,behavior:'smooth'}));return section}
function appendShelves(){const root=$('rows');if(!root.querySelector('.shelf'))root.replaceChildren();const existing=new Set([...root.children].map(e=>e.dataset.shelfTitle));const frag=document.createDocumentFragment();for(const row of allRows.slice(0,visibleShelves)){if(!existing.has(row[0])){frag.append(buildShelf(row));existing.add(row[0])}}root.append(frag);$('shelfCount').textContent=Math.min(visibleShelves,allRows.length)+' of '+allRows.length+' shelves';}
function reconcileShelves(){const root=$('rows'),desired=allRows.slice(0,visibleShelves);const old=new Map([...root.querySelectorAll('.shelf')].map(e=>[e.dataset.shelfTitle,e]));const anchor=[...old.values()].find(e=>e.getBoundingClientRect().bottom>document.querySelector('header').getBoundingClientRect().bottom);const anchorTitle=anchor?.dataset.shelfTitle,anchorTop=anchor?.getBoundingClientRect().top;const keep=new Set(desired.map(r=>r[0]));for(const [title,e] of old)if(!keep.has(title))e.remove();for(const n of [...root.childNodes])if(n.nodeType!==1||!n.classList.contains('shelf'))n.remove();for(let i=0;i<desired.length;i++){const row=desired[i],title=row[0];let section=old.get(title);const signature=JSON.stringify([row[2],row[1].map(g=>[g.id,g.time,g.plays,g.thumb,g.image,g.name])]);if(!section||section.dataset.signature!==signature){const next=buildShelf(row);next.dataset.signature=signature;if(section){next.querySelector('.rail').scrollLeft=section.querySelector('.rail').scrollLeft;section.replaceWith(next)}section=next}if(root.children[i]!==section)root.insertBefore(section,root.children[i]||null)}$('shelfCount').textContent=desired.length+' of '+allRows.length+' shelves';;if(anchorTitle){const now=[...root.children].find(e=>e.dataset.shelfTitle===anchorTitle);if(now){const delta=now.getBoundingClientRect().top-anchorTop;if(Math.abs(delta)>1)window.scrollBy({top:delta,behavior:'instant'})}}}

async function load(){controller?.abort();const current=++run;controller=new AbortController();const signal=controller.signal,user=$('user').value.trim();if(!user)return;games=[];selected=null;visibleShelves=24;allRows=[];renderNavigation();$('rows').replaceChildren();$('hero').style.removeProperty('--art');$('hero').textContent='Loading collection…';$('status').textContent='Requesting collection for '+user+'…';$('stop').disabled=false;$('progress').hidden=false;$('progress').removeAttribute('value');try{localStorage.setItem('shelfflix-user',user)}catch{}try{const doc=await api({endpoint:'collection',username:user,stats:'1'},signal);if(current!==run)return;const unique=new Map();for(const item of doc.querySelectorAll('item[objectid]')){const g=collection(item);if(g.id&&g.name){const prior=unique.get(g.id);if(!prior)unique.set(g.id,g);else{for(const k of Object.keys(g.statuses))prior.statuses[k] ||= g.statuses[k];prior.plays=Math.max(prior.plays,g.plays);prior.rating=Math.max(prior.rating,g.rating)}}}games=[...unique.values()];games.forEach(searchIndex);seed=Date.now();render();const ids=[...unique.keys()],batches=[];for(let i=0;i<ids.length;i+=BATCH)batches.push(ids.slice(i,i+BATCH));let next=0,done=0,failed=0,lastRender=0;$('progress').max=Math.max(ids.length,1);$('progress').value=0;$('status').textContent=games.length+' collection games · loading details';await Promise.all(Array.from({length:Math.min(LIMIT,batches.length)},async()=>{while(next<batches.length&&!signal.aborted){const batch=batches[next++];try{const d=await api({endpoint:'thing',id:batch.join(','),stats:'1'},signal);if(current!==run||signal.aborted)return;for(const item of d.querySelectorAll('item[id]')){const g=unique.get(item.getAttribute('id'));if(g)enrich(g,item)}}catch(e){if(signal.aborted)return;failed++}finally{if(current===run&&!signal.aborted){done+=batch.length;$('progress').value=done;$('status').textContent=games.length+' collection games · details processed '+done+'/'+ids.length+' · '+f
