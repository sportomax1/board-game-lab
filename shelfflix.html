<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShelfFlix | Board Game Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#141414;color:#f5f5f5;font:16px system-ui,sans-serif}header{position:sticky;top:0;z-index:5;background:#141414f5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 4%;border-bottom:1px solid #333}h1{font-size:28px;color:#e64b45;margin:0;letter-spacing:-1px}form{display:flex;gap:8px;flex:1;justify-content:flex-end}input,select,button,a.action{font:inherit;color:inherit;background:#292929;border:1px solid #555;border-radius:7px;padding:9px 12px}input{min-width:0;width:190px}button,a.action{cursor:pointer;text-decoration:none}button:hover,a.action:hover{background:#444}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:3px}button:disabled{opacity:.5;cursor:default}.primary{background:#b72e29;border-color:#b72e29}#status{padding:8px 4%;color:#ccc;font-size:13px}progress{width:100%;height:5px;accent-color:#e64b45;display:block}main{padding:0 4% 40px}.hero{position:relative;overflow:hidden;min-height:340px;display:flex;align-items:center;gap:28px;background:#242424;border-radius:12px;padding:30px;margin:12px 0 22px;isolation:isolate}.hero:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#141414 15%,#14141499),var(--art,none) center/cover;z-index:-1}.hero img{width:min(28%,220px);aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 8px 14px #0008)}.hero .info{flex:1;min-width:0}.hero h2{font-size:clamp(24px,4vw,48px);margin:6px 0}.muted{color:#bdbdbd}.desc{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:720px;line-height:1.5}.actions,.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.filters{margin:12px 0 24px}.shelf{margin:24px 0}.shelfhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}.shelfhead h2{font-size:20px;margin:0;flex:1}.shelfhead button{padding:4px 12px;font-size:22px}.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 3px 12px;scrollbar-width:thin}.tile{flex:0 0 clamp(128px,14vw,200px);scroll-snap-align:start;padding:0;overflow:hidden;text-align:left;background:#222;border:2px solid transparent}.tile[aria-current=true]{border-color:#e64b45}.tile img,.placeholder{width:100%;aspect-ratio:1;object-fit:contain;background:#292929;display:block}.placeholder{display:grid;place-items:center;color:#aaa}.tile span{display:block;padding:7px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile small{display:block;padding:0 8px 9px;color:#bbb}.empty{padding:24px;color:#aaa}dialog{background:#202020;color:#fff;border:1px solid #555;border-radius:12px;width:min(700px,94vw);max-height:85vh;padding:24px}dialog::backdrop{background:#000b}dialog p{white-space:pre-wrap;line-height:1.5}dialog img{max-width:160px;float:right;margin:0 0 12px 12px}@media(max-width:600px){header{padding:10px 4%}form{flex-basis:100%;justify-content:stretch}form input{flex:1;width:auto}.hero{padding:18px;min-height:250px;gap:14px}.hero img{width:30%}.hero .desc{display:none}.shelfhead h2{font-size:17px}.tile{flex-basis:132px}}
</style></head><body><header><h1>ShelfFlix</h1><a href="index.html" class="muted">Lab</a><form id="load"><input id="user" aria-label="BoardGameGeek username" value="sportomax" required><button class="primary">Load collection</button><button type="button" id="stop" disabled>Cancel</button></form></header><div id="status" role="status" aria-live="polite">Enter a BGG username to browse owned games.</div><progress id="progress" max="1" value="0" hidden></progress><main><section id="hero" class="hero"><div class="info"><div class="muted">YOUR COLLECTION, REDISCOVERED</div><h2>Find your next game.</h2><p>Load your collection to start browsing.</p></div></section><div class="filters"><input id="search" placeholder="Search games" aria-label="Search games"><select id="players" aria-label="Player count"><option value="0">Any player count</option></select><select id="duration" aria-label="Maximum play time"><option value="0">Any duration</option><option>15</option><option>30</option><option>45</option><option>60</option><option>90</option><option>120</option></select><button id="shuffle">Surprise me</button></div><div id="rows"></div></main><dialog id="details"><button id="close">Close</button><div id="detailbody"></div></dialog><script>
'use strict';
const $=id=>document.getElementById(id), BATCH=20, LIMIT=100, ROW_LIMIT=60;
let games=[],filtered=[],selected=null,controller=null,run=0,seed=0;
const val=(e,s)=>e.querySelector(s)?.getAttribute('value')||'', txt=(e,s)=>e.querySelector(s)?.textContent?.trim()||'', num=v=>Number.isFinite(+v)&&v!==''?+v:0, esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=v=>{try{const u=new URL(v);return u.protocol==='https:'||u.protocol==='http:'?u.href:''}catch{return ''}}, image=g=>safeUrl(g.image||g.thumb), thumb=g=>safeUrl(g.thumb||g.image), link=g=>'https://boardgamegeek.com/boardgame/'+encodeURIComponent(g.id);
const delay=(ms,signal)=>new Promise((resolve,reject)=>{if(signal.aborted)return reject(new DOMException('Aborted','AbortError'));const timer=setTimeout(()=>{signal.removeEventListener('abort',abort);resolve()},ms);function abort(){clearTimeout(timer);reject(new DOMException('Aborted','AbortError'))}signal.addEventListener('abort',abort,{once:true})});
async function api(params,signal){for(let i=0;i<6;i++){try{const response=await fetch('/api/bgg-helper?'+new URLSearchParams(params),{signal});if(response.ok&&response.status!==202){const doc=new DOMParser().parseFromString(await response.text(),'application/xml');if(doc.querySelector('parsererror,errors,error')||doc.documentElement.localName!=='items')throw Error('Invalid BGG response');return doc}if(![202,429,500,502,503,504].includes(response.status))throw Error('HTTP '+response.status);const retry=Number(response.headers.get('Retry-After'));await delay(Math.max(retry>0?retry*1000:0,1000*2**i)+Math.random()*500,signal)}catch(e){if(signal.aborted||i===5)throw e;await delay(1000*2**i+Math.random()*500,signal)}}throw Error('BGG did not return data after retries')}
function collection(item){const st=item.querySelector('stats');return {id:item.getAttribute('objectid'),name:txt(item,'name'),thumb:txt(item,'thumbnail'),image:txt(item,'image'),year:num(txt(item,'yearpublished')),plays:num(txt(item,'numplays')),rating:num(val(item,'stats rating')),average:num(val(item,'stats rating average')),weight:0,min:num(st?.getAttribute('minplayers')||''),max:num(st?.getAttribute('maxplayers')||''),time:num(st?.getAttribute('maxplaytime')||st?.getAttribute('playingtime')||''),description:'',categories:[],enriched:false}}
function enrich(g,item){Object.assign(g,{image:txt(item,'image')||g.image,thumb:txt(item,'thumbnail')||g.thumb,min:num(val(item,'minplayers'))||g.min,max:num(val(item,'maxplayers'))||g.max,time:num(val(item,'playingtime'))||num(val(item,'maxplaytime'))||g.time,weight:num(val(item,'statistics ratings averageweight')),average:num(val(item,'statistics ratings average'))||g.average,description:txt(item,'description'),categories:[...item.querySelectorAll('link[type="boardgamecategory"]')].map(x=>x.getAttribute('value')),enriched:true})}
function meta(g){return [g.min&&g.max?(g.min===g.max?g.min:g.min+'–'+g.max)+' players':'',g.time?g.time+' min':'',g.weight?g.weight.toFixed(2)+' weight':'',g.plays+' plays',g.average?'BGG '+g.average.toFixed(1):''].filter(Boolean).join(' · ')}
function artwork(g,small=false){const src=small?thumb(g):image(g);return src?'<img '+(small?'loading="lazy" ':'')+'decoding="async" src="'+esc(src)+'" alt="'+esc(g.name)+'">':'<div class="placeholder">No artwork</div>'}
function spotlight(g,reason){if(!g)return;selected=g;const hero=$('hero');hero.innerHTML=artwork(g)+'<div class="info"><div class="muted">'+esc(reason||'SPOTLIGHT')+'</div><h2>'+esc(g.name)+'</h2><div class="muted">'+esc(meta(g))+'</div><p class="desc">'+esc(g.description||'Explore this game from your collection.')+'</p><div class="actions"><button id="prev">‹ Previous</button><button id="next">Next ›</button><button id="more" class="primary">Details</button><a class="action" href="'+link(g)+'" target="_blank" rel="noopener">BGG ↗</a></div></div>';hero.style.setProperty('--art',image(g)?'url('+JSON.stringify(image(g))+')':'none');$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('more').onclick=()=>details(g);document.querySelectorAll('.tile').forEach(t=>t.setAttribute('aria-current',String(t.dataset.id===g.id)))}
function step(n){if(!filtered.length)return;let i=filtered.findIndex(g=>g.id===selected?.id);spotlight(filtered[(i+n+filtered.length)%filtered.length])}
function details(g){$('detailbody').innerHTML=artwork(g)+'<h2>'+esc(g.name)+'</h2><div>'+esc(meta(g))+'</div><p>'+esc(g.categories.join(' · '))+'</p><p>'+esc(g.description||'Detailed description unavailable.')+'</p><a class="action" href="'+link(g)+'" target="_blank" rel="noopener">View on BGG</a>';$('details').showModal()}
$('close').onclick=()=>$('details').close();
function ordered(predicate,score){return filtered.filter(predicate).sort((a,b)=>score(b)-score(a)||a.name.localeCompare(b.name)).slice(0,ROW_LIMIT)}
function hash(s){let h=seed|0;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
function render(){const q=$('search').value.toLowerCase().trim(),p=+$('players').value,t=+$('duration').value;filtered=games.filter(g=>(!q||g.name.toLowerCase().includes(q))&&(!p||g.min&&g.max&&g.min<=p&&g.max>=p)&&(!t||g.time&&g.time<=t));const rows=[['Recommended for you',ordered(g=>true,g=>(g.rating||g.average)*2+Math.min(g.plays,10)*.15+(g.plays===0?1:0))],['Lightning rounds · 15 min or less',ordered(g=>g.time>0&&g.time<=15,g=>g.average)],['Quick plays · 30 min or less',ordered(g=>g.time>0&&g.time<=30,g=>g.average)],['Most played',ordered(g=>g.plays>0,g=>g.plays)],['Least played',ordered(g=>g.plays>0,g=>-g.plays)],['Never played',ordered(g=>g.plays===0,g=>g.average)],['Hidden gems',ordered(g=>g.plays<=2&&g.average>=7,g=>g.average)],['Your favorites',ordered(g=>g.rating>0,g=>g.rating)],['Top BGG rated',ordered(g=>g.average>0,g=>g.average)],['Two-player night',ordered(g=>g.min>0&&g.min<=2&&g.max>=2,g=>g.average)],['Easy to teach',ordered(g=>g.weight>0&&g.weight<=2,g=>g.average)],['Brain burners',ordered(g=>g.weight>=3.5,g=>g.weight)],['Epic game night',ordered(g=>g.time>=90,g=>g.average)],['Shuffle the shelf',ordered(g=>true,g=>hash(g.id))]];
const root=$('rows');const positions=new Map([...root.querySelectorAll('.rail')].map(r=>[r.dataset.title,r.scrollLeft]));root.replaceChildren();for(const [title,items] of rows){if(!items.length)continue;const section=document.createElement('section');section.className='shelf';section.innerHTML='<div class="shelfhead"><h2>'+esc(title)+'</h2><button aria-label="Scroll '+esc(title)+' left">‹</button><button aria-label="Scroll '+esc(title)+' right">›</button></div><div class="rail"></div>';const rail=section.querySelector('.rail');rail.dataset.title=title;for(const g of items){const tile=document.createElement('button');tile.className='tile';tile.dataset.id=g.id;tile.title=g.name;tile.innerHTML=artwork(g,true)+'<span>'+esc(g.name)+'</span><small>'+esc((g.time?g.time+' min · ':'')+g.plays+' plays')+'</small>';tile.onclick=()=>{spotlight(g,title);$('hero').scrollIntoView({behavior:'smooth',block:'center'})};tile.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const target=e.key==='ArrowRight'?tile.nextElementSibling:tile.previousElementSibling;target?.focus();if(target){const next=games.find(x=>x.id===target.dataset.id);spotlight(next,title)}}});rail.append(tile)}const buttons=section.querySelectorAll('.shelfhead button');buttons.forEach((b,i)=>b.onclick=()=>rail.scrollBy({left:(i?1:-1)*rail.clientWidth*.85,behavior:'smooth'}));root.append(section);rail.scrollLeft=positions.get(title)||0}if(!filtered.length){root.textContent='No games match these filters.';$('hero').style.removeProperty('--art');$('hero').innerHTML='<div class="info"><h2>No matching games</h2><p>Try changing your filters.</p></div>';selected=null}else spotlight(filtered.find(g=>g.id===selected?.id)||rows[0][1][0]||filtered[0])}
async function load(){controller?.abort();const current=++run;controller=new AbortController();const signal=controller.signal,user=$('user').value.trim();if(!user)return;games=[];selected=null;$('rows').replaceChildren();$('hero').style.removeProperty('--art');$('hero').textContent='Loading collection…';$('status').textContent='Requesting collection for '+user+'…';$('stop').disabled=false;$('progress').hidden=false;$('progress').removeAttribute('value');try{localStorage.setItem('shelfflix-user',user)}catch{}try{const doc=await api({endpoint:'collection',username:user,stats:'1',own:'1'},signal);if(current!==run)return;const unique=new Map();for(const item of doc.querySelectorAll('item[objectid]')){if(item.querySelector('status')?.getAttribute('own')!=='1')continue;const g=collection(item);if(g.id&&g.name&&!unique.has(g.id))unique.set(g.id,g)}games=[...unique.values()];seed=Date.now();render();const ids=[...unique.keys()],batches=[];for(let i=0;i<ids.length;i+=BATCH)batches.push(ids.slice(i,i+BATCH));let next=0,done=0,failed=0,lastRender=0;$('progress').max=Math.max(ids.length,1);$('progress').value=0;$('status').textContent=games.length+' owned games · loading details';await Promise.all(Array.from({length:Math.min(LIMIT,batches.length)},async()=>{while(next<batches.length&&!signal.aborted){const batch=batches[next++];try{const d=await api({endpoint:'thing',id:batch.join(','),stats:'1'},signal);if(current!==run||signal.aborted)return;for(const item of d.querySelectorAll('item[id]')){const g=unique.get(item.getAttribute('id'));if(g)enrich(g,item)}}catch(e){if(signal.aborted)return;failed++}finally{if(current===run&&!signal.aborted){done+=batch.length;$('progress').value=done;$('status').textContent=games.length+' owned games · details processed '+done+'/'+ids.length+' · '+failed+' failed batches';if(Date.now()-lastRender>1500){lastRender=Date.now();render()}}}}}));if(current!==run||signal.aborted)return;render();const missing=games.filter(g=>!g.enriched).length;$('status').textContent=games.length+' owned games · '+(games.length-missing)+' enriched'+(missing?' · '+missing+' missing details; collection data retained':'');}catch(e){if(current===run&&!signal.aborted){$('status').textContent='Unable to load collection: '+e.message;$('hero').textContent='Check the username and try again.'}}finally{if(current===run){$('stop').disabled=true;$('progress').hidden=true}}}}
$('load').onsubmit=e=>{e.preventDefault();load()};$('stop').onclick=()=>{controller?.abort();run++;$('stop').disabled=true;$('progress').hidden=true;$('status').textContent='Cancelled · '+games.length+' games retained';if(games.length)render();else $('hero').textContent='Load a collection to begin.'};for(let i=1;i<=12;i++)$('players').add(new Option(i+' player'+(i===1?'':'s'),i));for(const id of ['search','players','duration'])$(id).addEventListener(id==='search'?'input':'change',render);$('shuffle').onclick=()=>{if(!filtered.length)return;seed=Date.now();render();spotlight(filtered[Math.floor(Math.random()*filtered.length)],'SURPRISE ME')};try{$('user').value=localStorage.getItem('shelfflix-user')||'sportomax'}catch{};load();
</script></body></html>
