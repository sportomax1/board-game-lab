<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Type Rank - BGG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { padding: max(env(safe-area-inset-top), 0) max(env(safe-area-inset-right), 0) max(env(safe-area-inset-bottom), 0) max(env(safe-area-inset-left), 0); }
        input, select, button { font-size: 16px; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <div id="settingsModal" class="fixed inset-0 bg-gradient-to-br from-purple-900 to-red-900 z-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-3xl shadow-2xl p-6 md:p-8 max-w-md w-full my-4">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-2 text-center">⌨️ Type Rank</h1>
            <p class="text-gray-500 text-center text-base mb-6">Speed-rank games by type!</p>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">BGG Username</label>
                    <input type="text" id="username" class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 focus:border-purple-500 outline-none" value="sportomax">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Rank Type (Friendlyname)</label>
                    <select id="rankType" class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 focus:border-purple-500 outline-none">
                        <option value="Board Game Rank">Board Game Rank</option>
                        <option value="Abstract Game Rank">Abstract Game Rank</option>
                        <option value="Children's Game Rank">Children's Game Rank</option>
                        <option value="Customizable Rank">Customizable Rank</option>
                        <option value="Family Game Rank">Family Game Rank</option>
                        <option value="Party Game Rank">Party Game Rank</option>
                        <option value="Strategy Game Rank">Strategy Game Rank</option>
                        <option value="Thematic Rank">Thematic Rank</option>
                        <option value="War Game Rank">War Game Rank</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Sort By</label>
                    <select id="sortBy" class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 focus:border-purple-500 outline-none">
                        <option value="rank">Rank Value</option>
                        <option value="average">Average Rating</option>
                    </select>
                </div>
                <div class="flex items-center gap-3 bg-gray-50 p-3 rounded-lg">
                    <input type="checkbox" id="excludeExpansions" class="w-4 h-4">
                    <label for="excludeExpansions" class="text-sm font-bold text-gray-700">Exclude Expansions</label>
                </div>
                <button onclick="startGame()" class="w-full bg-purple-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-purple-700 transition shadow-lg">Start Game</button>
            </div>
        </div>
    </div>
    <div id="infoModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-6 max-w-md w-full">
            <h2 class="text-2xl font-bold text-gray-900 mb-4">ℹ️ How to Play</h2>
            <div class="space-y-3 text-gray-700">
                <p>• Type game names in order from best to worst</p>
                <p>• Beat the clock to rank as many as possible</p>
                <p>• Games sorted by rating or BGG rank</p>
                <p>• Sporcle-style speed ranking!</p>
            </div>
            <button onclick="closeInfo()" class="w-full mt-6 bg-purple-600 text-white py-3 rounded-lg font-bold hover:bg-purple-700">Got it!</button>
        </div>
    </div>
    <div id="app" class="hidden flex-1 flex flex-col">
        <header class="bg-white shadow-sm sticky top-0 z-30 px-4 py-3">
            <div class="max-w-4xl mx-auto flex items-center justify-between">
                <h1 class="font-bold text-xl text-gray-900">⌨️ Type Rank</h1>
                <div class="flex gap-2">
                    <button onclick="showInfo()" class="p-2 text-purple-500 hover:bg-purple-50 rounded-lg">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"/><path stroke-linecap="round" d="M12 16v-4m0-4h.01"/></svg>
                    </button>
                    <button onclick="showSettings()" class="p-2 text-gray-500 hover:bg-gray-100 rounded-lg">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    </button>
                </div>
            </div>
        </header>
        <main class="flex-1 p-4 max-w-4xl mx-auto w-full">
            <div class="bg-white rounded-xl shadow-sm p-4 mb-4 flex justify-between items-center">
                <div>
                    <p class="text-sm text-gray-600">Time Left</p>
                    <p class="text-3xl font-bold text-purple-600" id="timer">5:00</p>
                </div>
                <div class="text-right">
                    <p class="text-sm text-gray-600">Found</p>
                    <p class="text-3xl font-bold text-green-600"><span id="found">0</span> / <span id="total">0</span></p>
                </div>
            </div>
            <!-- Game Image Display -->
            <div id="gameImageContainer" class="hidden bg-white rounded-xl shadow-sm p-4 mb-4 text-center">
                <img id="gameImage" src="" alt="Game" class="mx-auto max-h-32 rounded-lg mb-2">
                <p id="imageName" class="text-sm font-bold text-gray-900"></p>
            </div>

            <div class="bg-white rounded-xl shadow-sm p-4 mb-4">
                <input type="text" id="guessInput" class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 focus:border-purple-500 outline-none text-lg" placeholder="Type game name...">
                <div class="flex gap-2 mt-3">
                    <button onclick="cheatPartial()" class="flex-1 bg-yellow-500 text-white py-2 rounded-lg font-bold text-sm hover:bg-yellow-600">💡 First 3</button>
                    <button onclick="cheatWord()" class="flex-1 bg-orange-500 text-white py-2 rounded-lg font-bold text-sm hover:bg-orange-600">📝 Word</button>
                    <button onclick="cheatLetter()" class="flex-1 bg-red-500 text-white py-2 rounded-lg font-bold text-sm hover:bg-red-600">🔤 Letter</button>
                </div>
            </div>
            <div id="gamesList" class="space-y-2">
            </div>
        </main>
    </div>
    <script>
        let collection = [];
        let gamesList = [];
        let foundGames = new Set();
        let timeLeft = 300;
        let timerInterval = null;
        let sortBy = 'average';
        let cheatUsed = new Set(); // Track which games had cheats used

        async function startGame() {
            const username = document.getElementById('username').value.trim() || 'sportomax';
            const rankType = document.getElementById('rankType').value;
            const excludeExpansions = document.getElementById('excludeExpansions').checked;
            sortBy = document.getElementById('sortBy').value;
            document.getElementById('settingsModal').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            try {
                const res = await fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1`);
                const xml = await res.text();
                const parser = new DOMParser().parseFromString(xml, 'text/xml');
                let items = Array.from(parser.querySelectorAll('item'));
                
                // Filter out expansions if requested
                if (excludeExpansions) {
                    items = items.filter(item => {
                        const subtype = item.getAttribute('subtype');
                        return subtype !== 'boardgameexpansion';
                    });
                }
                
                // Filter by rank type
                collection = items.filter(item => {
                    const stats = item.querySelector('stats');
                    const ranks = stats?.querySelectorAll('rank');
                    let hasRankType = false;
                    ranks?.forEach(r => {
                        if (r.getAttribute('friendlyname') === rankType) hasRankType = true;
                    });
                    return hasRankType;
                }).map(item => {
                    const stats = item.querySelector('stats');
                    const rating = stats?.querySelector('rating');
                    const ranks = stats?.querySelectorAll('rank');
                    let rankValue = 999999;
                    ranks?.forEach(r => {
                        if (r.getAttribute('friendlyname') === rankType) {
                            rankValue = parseInt(r.getAttribute('value') || '999999');
                        }
                    });
                    return {
                        id: item.getAttribute('objectid'),
                        name: item.querySelector('name').textContent,
                        average: parseFloat(rating?.querySelector('average')?.getAttribute('value') || '0'),
                        rank: rankValue
                    };
                });
                
                if (sortBy === 'average') {
                    collection.sort((a, b) => b.average - a.average);
                } else {
                    collection.sort((a, b) => a.rank - b.rank);
                }
                gamesList = collection.filter(g => g.rank !== 999999).slice(0, 20);
                document.getElementById('total').textContent = gamesList.length;
                renderList();
                startTimer();
                document.getElementById('guessInput').focus();
                document.getElementById('guessInput').addEventListener('input', checkGuess);
            } catch (error) {
                alert('Error: ' + error.message);
                location.reload();
            }
        }

        function renderList() {
            const html = gamesList.map((game, idx) => {
                let displayName = '???';
                if (foundGames.has(idx)) {
                    displayName = game.name;
                } else if (cheatUsed.has(idx + '-partial')) {
                    // Show first 3 letters + dots
                    displayName = game.name.substring(0, 3) + '...';
                } else if (cheatUsed.has(idx + '-word')) {
                    // Show full word but hidden letters
                    displayName = game.name.split(' ').map(w => w.charAt(0) + '_'.repeat(w.length - 1)).join(' ');
                } else if (cheatUsed.has(idx + '-letter')) {
                    // Show one random letter revealed
                    const letters = game.name.split('');
                    const revealed = Math.floor(Math.random() * letters.length);
                    displayName = letters.map((l, i) => i === revealed ? l : (l === ' ' ? ' ' : '_')).join('');
                }
                return `
                    <div id="game-${idx}" class="bg-gray-100 rounded-lg p-3 flex items-center gap-3 ${foundGames.has(idx) ? 'bg-green-100' : ''}">
                        <span class="font-bold text-gray-900 w-8">${idx + 1}.</span>
                        <span class="flex-1 font-medium ${foundGames.has(idx) ? 'text-gray-900' : 'text-gray-400'}">${displayName}</span>
                        <span class="text-xs text-gray-600">${foundGames.has(idx) ? (sortBy === 'average' ? game.average.toFixed(1) : '#' + game.rank) : ''}</span>
                    </div>
                `;
            }).join('');
            document.getElementById('gamesList').innerHTML = html;
            document.getElementById('found').textContent = foundGames.size;
        }

        function checkGuess() {
            const guess = document.getElementById('guessInput').value.trim().toLowerCase();
            if (!guess) return;
            
            // Check for exact match (full name only)
            gamesList.forEach((game, idx) => {
                if (!foundGames.has(idx) && game.name.toLowerCase() === guess) {
                    foundGames.add(idx);
                    showGameImage(game);
                    document.getElementById('guessInput').value = '';
                    renderList();
                    if (foundGames.size === gamesList.length) {
                        endGame(true);
                    }
                }
            });
            
            // No partial matches - user must type complete name
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                document.getElementById('timer').textContent = `${mins}:${String(secs).padStart(2, '0')}`;
                if (timeLeft <= 0) endGame(false);
            }, 1000);
        }

        async function showGameImage(game) {
            try {
                const res = await fetch(`/api/bgg-thing?id=${game.id}`);
                const xml = await res.text();
                const parser = new DOMParser().parseFromString(xml, 'text/xml');
                const item = parser.querySelector('item');
                const imageUrl = item.querySelector('image')?.textContent || '';
                
                if (imageUrl) {
                    document.getElementById('gameImage').src = imageUrl;
                    document.getElementById('imageName').textContent = game.name;
                    document.getElementById('gameImageContainer').classList.remove('hidden');
                    
                    // Hide after 2 seconds
                    setTimeout(() => {
                        document.getElementById('gameImageContainer').classList.add('hidden');
                    }, 2000);
                }
            } catch (error) {
                console.error('Error fetching game image:', error);
            }
        }

        function cheatPartial() {
            const unfoundIdx = Array.from(gamesList.entries()).find(([idx, _]) => !foundGames.has(idx));
            if (!unfoundIdx) return;
            const idx = unfoundIdx[0];
            if (!cheatUsed.has(idx + '-partial')) {
                cheatUsed.add(idx + '-partial');
                renderList();
            }
        }

        function cheatWord() {
            const unfoundIdx = Array.from(gamesList.entries()).find(([idx, _]) => !foundGames.has(idx));
            if (!unfoundIdx) return;
            const idx = unfoundIdx[0];
            if (!cheatUsed.has(idx + '-word')) {
                cheatUsed.add(idx + '-word');
                renderList();
            }
        }

        function cheatLetter() {
            const unfoundIdx = Array.from(gamesList.entries()).find(([idx, _]) => !foundGames.has(idx));
            if (!unfoundIdx) return;
            const idx = unfoundIdx[0];
            if (!cheatUsed.has(idx + '-letter')) {
                cheatUsed.add(idx + '-letter');
                renderList();
            }
        }

        function endGame(won) {
            clearInterval(timerInterval);
            if (won) {
                alert(`🎉 You found all ${gamesList.length} games!`);
            } else {
                alert(`⏰ Time's up! You found ${foundGames.size} / ${gamesList.length} games.`);
                foundGames = new Set(gamesList.map((_, i) => i));
                renderList();
            }
        }

        function showSettings() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function showInfo() { document.getElementById('infoModal').classList.remove('hidden'); }
        function closeInfo() { document.getElementById('infoModal').classList.add('hidden'); }
    </script>
</body>
</html>
