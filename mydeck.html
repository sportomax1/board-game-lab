<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>MyDeck - Card Printer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🎴</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            max-width: 100%;
            background: white;
            padding-top: env(safe-area-inset-top, 0);
            padding-bottom: env(safe-area-inset-bottom, 0);
            padding-left: env(safe-area-inset-left, 0);
            padding-right: env(safe-area-inset-right, 0);
        }

        .header {
            flex-shrink: 0;
            padding: 1rem;
            border-bottom: 1px solid #eee;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .header p {
            margin: 0.25rem 0 0 0;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .controls {
            flex-shrink: 0;
            padding: 1rem;
            background: white;
            border-bottom: 1px solid #eee;
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .control-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #666;
        }

        .control-group input,
        .control-group select {
            padding: 0.6rem;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .control-group input:focus,
        .control-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 0.6rem 1.2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
            opacity: 0.9;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .status {
            font-size: 0.8rem;
            color: #666;
            padding: 0.6rem;
            background: #f9f9f9;
            border-radius: 6px;
            text-align: center;
            border-left: 4px solid #667eea;
            margin-top: 0.5rem;
        }

        .status.loading {
            color: #667eea;
            font-weight: 600;
        }

        .status.error {
            background: #ffebee;
            border-left-color: #f44336;
            color: #c62828;
        }

        .status.success {
            background: #e8f5e9;
            border-left-color: #4caf50;
            color: #2e7d32;
        }

        .main-content {
            flex: 1;
            padding: 1rem;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }

        .print-container {
            background: white;
            width: 8.5in;
            height: 11in;
            margin: 0 auto 2rem;
            page-break-after: always;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 0;
            overflow: hidden;
        }

        .card {
            width: 100%;
            height: 100%;
            border: 1px solid #000;
            padding: 0;
            display: flex;
            flex-direction: column;
            position: relative;
            background: white;
            overflow: hidden;
            page-break-inside: avoid;
            box-sizing: border-box;
        }

        .card-image {
            width: 100%;
            height: 1.75in;
            object-fit: cover;
            background: #f0f0f0;
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
            display: block;
            touch-action: none;
            -webkit-touch-callout: none;
        }

        .card-content {
            flex: 1;
            padding: 0.1in;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 1.75in;
        }

        .card-name {
            font-size: 11pt;
            font-weight: bold;
            text-align: center;
            line-height: 1.3;
            margin: 0;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .card-year {
            font-size: 9pt;
            text-align: center;
            color: #666;
            margin: 0.05in 0;
        }

        .card-time {
            font-size: 9pt;
            text-align: center;
            color: #333;
            font-weight: bold;
        }

        .time-badge {
            position: absolute;
            top: 0.05in;
            right: 0.05in;
            width: 0.18in;
            height: 0.3in;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8pt;
            font-weight: bold;
            color: white;
            border: 1px solid #000;
        }

        .time-quick { background: #00FF00; } /* 0-15 min */
        .time-short { background: #55D400; } /* 16-30 min */
        .time-medium { background: #AADD00; } /* 31-45 min */
        .time-longer { background: #FFFF00; color: #000; } /* 46-60 min */
        .time-long { background: #FFAA00; } /* 61-90 min */
        .time-vlong { background: #FF5500; } /* 91-120 min */
        .time-extreme { background: #FF0000; } /* 120+ min */

        .print-actions {
            text-align: center;
            padding: 1rem;
            background: #f9f9f9;
            border-top: 1px solid #eee;
            gap: 0.5rem;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        @media print {
            * {
                margin: 0 !important;
                padding: 0 !important;
                border: none !important;
            }

            html, body {
                background: white;
                margin: 0;
                padding: 0;
                width: 8.5in;
                height: 11in;
            }

            .header,
            .controls,
            .status,
            .print-actions {
                display: none !important;
            }

            .container {
                padding: 0 !important;
                margin: 0 !important;
            }

            .main-content {
                padding: 0 !important;
                margin: 0 !important;
                width: 8.5in;
                height: 11in;
            }

            .print-container {
                width: 8.5in !important;
                height: 11in !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none;
                page-break-after: always;
            }

            .card {
                border: 1px solid #000;
                page-break-inside: avoid;
                margin: 0 !important;
                padding: 0 !important;
            }

            .card-image {
                width: 100% !important;
                height: 1.75in !important;
            }
        }

        @media (max-width: 900px) {
            .print-container {
                width: 100%;
                height: auto;
                grid-template-columns: repeat(2, 1fr);
                gap: 4px;
            }

            .card {
                width: 100%;
                height: auto;
                aspect-ratio: 2.5 / 3.5;
            }
        }

        @media (max-width: 480px) {
            .print-container {
                grid-template-columns: 1fr;
            }

            .card {
                width: 100%;
                height: auto;
            }

            .controls {
                flex-direction: column;
            }

            .control-group {
                width: 100%;
            }

            .control-group input,
            .control-group select {
                width: 100%;
            }
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #999;
        }

        .empty-state p {
            margin: 0.5rem 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎴 MyDeck - Card Printer</h1>
            <p>Print cards from your board game collection (8.5" x 11" sheets)</p>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="username">BGG Username</label>
                <input type="text" id="username" placeholder="e.g., sportomax" value="sportomax">
            </div>
            <div class="control-group">
                <label for="maxGames">Max Games</label>
                <input type="number" id="maxGames" min="1" max="500" value="100">
            </div>
            <button class="btn" id="generateBtn" onclick="generateCards()">Generate Cards</button>
            <div class="status" id="status" style="display: none;"></div>
        </div>

        <div class="main-content" id="mainContent">
            <div class="empty-state">
                <p>👆 Enter your BGG username and click Generate Cards</p>
                <p style="font-size: 0.9rem;">Creates printable 2.5" × 3.5" cards (9 per 8.5" × 11" page)</p>
            </div>
        </div>

        <div class="print-actions" id="printActions" style="display: none;">
            <button class="btn btn-secondary" onclick="window.print()">🖨️ Print / Save as PDF</button>
            <button class="btn btn-secondary" onclick="document.getElementById('mainContent').innerHTML=''; document.getElementById('printActions').style.display='none';">Clear Cards</button>
        </div>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const generateBtn = document.getElementById('generateBtn');
        const mainContent = document.getElementById('mainContent');
        const printActions = document.getElementById('printActions');

        function showStatus(message, type = 'info') {
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
            statusEl.style.display = 'block';
        }

        function hideStatus() {
            statusEl.style.display = 'none';
        }

        async function fetchWithRetry(url, maxRetries = 3) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url);
                    if (response.ok) return await response.text();
                    if (response.status === 429 || response.status === 202 || response.status === 502) {
                        const wait = Math.min(1000 * Math.pow(2, i), 5000);
                        await new Promise(r => setTimeout(r, wait));
                        continue;
                    }
                    throw new Error(`HTTP ${response.status}`);
                } catch (e) {
                    if (i === maxRetries - 1) throw e;
                    await new Promise(r => setTimeout(r, 1000 * (i + 1)));
                }
            }
        }

        function getTimeGroup(minutes) {
            if (minutes <= 15) return 'time-quick';
            if (minutes <= 30) return 'time-short';
            if (minutes <= 45) return 'time-medium';
            if (minutes <= 60) return 'time-longer';
            if (minutes <= 90) return 'time-long';
            if (minutes <= 120) return 'time-vlong';
            return 'time-extreme';
        }

        async function generateCards() {
            const username = document.getElementById('username').value.trim();
            const maxGames = parseInt(document.getElementById('maxGames').value) || 100;

            if (!username) {
                showStatus('Please enter a username', 'error');
                return;
            }

            generateBtn.disabled = true;
            showStatus('Fetching collection...', 'loading');

            try {
                // Fetch collection with stats
                const collectionUrl = `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1`;
                const collectionText = await fetchWithRetry(collectionUrl);
                const parser = new DOMParser();
                const collectionXml = parser.parseFromString(collectionText, 'text/xml');

                if (collectionXml.querySelector('error')) {
                    throw new Error('User not found or collection is private');
                }

                const items = Array.from(collectionXml.querySelectorAll('item')).slice(0, maxGames);
                if (items.length === 0) {
                    throw new Error('No games found in collection');
                }

                showStatus(`Found ${items.length} games. Processing...`, 'loading');

                const games = items.map(item => {
                    const stats = item.querySelector('stats');
                    const rating = stats?.querySelector('rating');
                    return {
                        id: item.getAttribute('objectid'),
                        name: item.querySelector('name').textContent,
                        thumbnail: item.querySelector('thumbnail')?.textContent || '',
                        yearPublished: item.querySelector('yearpublished')?.textContent || '',
                        playingTime: parseInt(item.querySelector('playingtime')?.textContent || '0')
                    };
                });

                renderCards(games);
                hideStatus();
                printActions.style.display = 'flex';

                // Save username
                localStorage.setItem('mydeckUsername', username);
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
                console.error(error);
            } finally {
                generateBtn.disabled = false;
            }
        }

        function renderCards(games) {
            mainContent.innerHTML = '';
            const cardsPerPage = 9;

            for (let pageStart = 0; pageStart < games.length; pageStart += cardsPerPage) {
                const pageGames = games.slice(pageStart, pageStart + cardsPerPage);
                
                // Pad with empty cards to complete the page
                while (pageGames.length < cardsPerPage) {
                    pageGames.push(null);
                }

                const pageDiv = document.createElement('div');
                pageDiv.className = 'print-container';

                pageGames.forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'card';

                    if (game) {
                        const timeGroup = getTimeGroup(game.playingTime);
                        const timeBadgeColor = timeGroup.replace('time-', '');

                        card.innerHTML = `
                            <img src="${game.thumbnail}" alt="${game.name}" class="card-image" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22175%22%3E%3Crect fill=%22%23f0f0f0%22 width=%22200%22 height=%22175%22/%3E%3C/svg%3E'">
                            <div class="card-content">
                                <h3 class="card-name">${game.name}</h3>
                                <div class="card-year">${game.yearPublished || 'N/A'}</div>
                                <div class="card-time">⏱️ ${game.playingTime}'</div>
                            </div>
                            <div class="time-badge ${timeGroup}"></div>
                        `;
                    }

                    pageDiv.appendChild(card);
                });

                mainContent.appendChild(pageDiv);
            }
        }

        // Load saved username
        document.getElementById('username').value = localStorage.getItem('mydeckUsername') || 'sportomax';

        // Prevent pinch zoom and double-tap zoom
        document.addEventListener('wheel', e => {
            if (e.ctrlKey || e.metaKey) e.preventDefault();
        }, { passive: false });

        document.addEventListener('touchmove', e => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', e => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) e.preventDefault();
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
