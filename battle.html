<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
    <title>BGG Compete Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #05070a;
            color: #f1f5f9;
            -webkit-tap-highlight-color: transparent;
        }
        .ios-blur {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(15, 23, 42, 0.8);
        }
        .team-card {
            background: linear-gradient(145deg, #0f172a 0%, #020617 100%);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .team-card:active {
            transform: scale(0.97);
            border-color: #3b82f6;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .custom-scroll::-webkit-scrollbar { height: 4px; width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide { animation: slideIn 0.3s ease-out forwards; }
        
        /* Ensure thumbnails show full content without zoom */
        .game-thumb {
            object-fit: contain;
            background-color: #020617;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Header -->
    <header class="ios-blur sticky top-0 z-50 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-extrabold tracking-tight text-white flex items-center gap-2">
            <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            BGG COMPETE
        </h1>
        <div id="loadingIndicator" class="hidden">
            <div class="animate-spin rounded-full h-5 w-5 border-2 border-blue-500 border-t-transparent"></div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto px-4 pb-32 pt-6 max-w-2xl mx-auto w-full">
        
        <!-- BATTLE TAB -->
        <section id="tab-battle" class="tab-content active space-y-6">
            <div id="resultArea" class="text-center bg-blue-500/10 border border-blue-500/20 py-2 px-4 rounded-full text-sm font-semibold text-blue-400">
                Ready to Rumble
            </div>

            <div class="space-y-4">
                <!-- Team 1 -->
                <div id="team1" class="team-card border border-slate-800 p-5 rounded-3xl cursor-pointer relative overflow-hidden group">
                    <div class="flex justify-between items-center mb-4">
                        <div class="flex flex-col">
                            <span class="text-[10px] font-bold uppercase tracking-widest text-slate-500" id="t1userLabel">USER 1</span>
                            <span class="text-sm font-black text-white" id="t1nameLabel">TEAM 1</span>
                        </div>
                        <div class="flex flex-col items-end gap-1">
                            <div class="bg-slate-900/80 px-3 py-1 rounded-full text-[10px] font-bold text-slate-300">
                                W: <span id="t1wins" class="text-green-400">0</span> | S: <span id="t1subs" class="text-orange-400">0</span>
                            </div>
                            <div class="text-xs font-bold text-blue-400">Avg: <span id="t1avg">-</span></div>
                        </div>
                    </div>
                    <div id="t1thumbs" class="grid grid-cols-5 gap-2"></div>
                </div>

                <!-- VS Divider -->
                <div class="flex items-center justify-center gap-4">
                    <div class="h-px bg-slate-800 flex-1"></div>
                    <span class="text-slate-600 font-black italic text-sm">VS</span>
                    <div class="h-px bg-slate-800 flex-1"></div>
                </div>

                <!-- Team 2 -->
                <div id="team2" class="team-card border border-slate-800 p-5 rounded-3xl cursor-pointer relative overflow-hidden group">
                    <div class="flex justify-between items-center mb-4">
                        <div class="flex flex-col">
                            <span class="text-[10px] font-bold uppercase tracking-widest text-slate-500" id="t2userLabel">USER 2</span>
                            <span class="text-sm font-black text-white" id="t2nameLabel">TEAM 2</span>
                        </div>
                        <div class="flex flex-col items-end gap-1">
                            <div class="bg-slate-900/80 px-3 py-1 rounded-full text-[10px] font-bold text-slate-300">
                                W: <span id="t2wins" class="text-green-400">0</span> | S: <span id="t2subs" class="text-orange-400">0</span>
                            </div>
                            <div class="text-xs font-bold text-blue-400">Avg: <span id="t2avg">-</span></div>
                        </div>
                    </div>
                    <div id="t2thumbs" class="grid grid-cols-5 gap-2"></div>
                </div>
            </div>

            <button id="startBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-900/20 transition-all flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                RE-DEAL ALL
            </button>
        </section>

        <!-- HISTORY TAB -->
        <section id="tab-history" class="tab-content space-y-4">
            <h2 class="text-lg font-bold px-2">Match History</h2>
            <div id="history" class="space-y-4">
                <div class="text-slate-500 text-center py-10 italic">No matches recorded yet.</div>
            </div>
        </section>

        <!-- SETTINGS TAB -->
        <section id="tab-settings" class="tab-content space-y-6 animate-slide">
            <div class="bg-slate-900/50 border border-slate-800 p-6 rounded-3xl space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-4">
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block">Team 1 Setup</label>
                        <input id="user1" value="sportomax" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm focus:border-blue-500 outline-none" placeholder="BGG Username" />
                        <input id="name1" value="Alpha" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm focus:border-blue-500 outline-none" placeholder="Team Name" />
                    </div>
                    <div class="space-y-4">
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block">Team 2 Setup</label>
                        <input id="user2" value="sportomax" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm focus:border-blue-500 outline-none" placeholder="BGG Username" />
                        <input id="name2" value="Omega" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm focus:border-blue-500 outline-none" placeholder="Team Name" />
                    </div>
                </div>

                <div class="flex items-center justify-between border-t border-slate-800 pt-6">
                    <div>
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider block">Team Size</label>
                    </div>
                    <input id="teamSize" type="number" min="1" max="10" value="5" class="w-16 bg-slate-950 border border-slate-800 rounded-xl p-2 text-center text-white" />
                </div>

                <div class="flex items-center justify-between">
                    <div>
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider block">Exclude Expansions</label>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="excludeExpansions" class="sr-only peer">
                        <div class="w-11 h-6 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                    </label>
                </div>

                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 block">Next Match Mode</label>
                    <select id="nextMode" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:border-blue-500 outline-none appearance-none">
                        <option value="shuffle">Shuffle Both</option>
                        <option value="winner">Winner Stays</option>
                        <option value="loser">Loser Stays</option>
                    </select>
                </div>
                
                <button onclick="resetStats()" class="w-full border border-red-500/20 text-red-400 py-3 rounded-xl text-xs font-bold uppercase tracking-widest hover:bg-red-500/10 transition-colors">Reset Season Stats</button>
            </div>
        </section>

    </main>

    <!-- Navigation Bar -->
    <nav class="ios-blur fixed bottom-0 left-0 right-0 border-t border-slate-800 pb-8 pt-3 px-6 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <button onclick="switchTab('battle')" id="nav-battle" class="flex flex-col items-center gap-1 text-slate-400 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                <span class="text-[10px] font-bold uppercase">Battle</span>
            </button>
            <button onclick="switchTab('history')" id="nav-history" class="flex flex-col items-center gap-1 text-slate-400 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span class="text-[10px] font-bold uppercase">History</span>
            </button>
            <button onclick="switchTab('settings')" id="nav-settings" class="flex flex-col items-center gap-1 text-slate-400 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                <span class="text-[10px] font-bold uppercase">Settings</span>
            </button>
        </div>
    </nav>

    <script>
    const startBtn = document.getElementById('startBtn');
    const nextMode = document.getElementById('nextMode');
    const historyEl = document.getElementById('history');
    const loader = document.getElementById('loadingIndicator');

    let coll1 = [], coll2 = [];
    let team1 = [], team2 = [];
    let history = [];
    let stats = { t1wins: 0, t1subs: 0, t2wins: 0, t2subs: 0 };

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(el => el.classList.remove('text-blue-500'));
        document.getElementById(`tab-${tabId}`).classList.add('active');
        document.getElementById(`nav-${tabId}`).classList.add('text-blue-500');
    }
    document.getElementById('nav-battle').classList.add('text-blue-500');

    function resetStats() {
        stats = { t1wins: 0, t1subs: 0, t2wins: 0, t2subs: 0 };
        updateUI();
    }

    function parseCollectionXml(xmlText){
        const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
        const items = Array.from(doc.querySelectorAll('item'));
        return items.map(item => {
            const id = item.getAttribute('objectid') || item.getAttribute('id') || '';
            const name = item.querySelector('name')?.textContent || '';
            const thumb = item.querySelector('thumbnail')?.textContent || item.querySelector('image')?.textContent || '';
            const subtype = item.getAttribute('subtype') || '';
            let bayes = 0;
            const stats = item.querySelector('stats') || item.querySelector('statistics');
            if(stats){
                const bay = stats.querySelector('bayesaverage') || stats.querySelector('rating > bayesaverage');
                if(bay) bayes = parseFloat(bay.getAttribute('value') || bay.textContent) || 0;
            }
            return { id, name, thumb, bayes, subtype };
        }).filter(g=>g.thumb);
    }

    async function fetchCollection(username){
        try{
            const url = `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1`;
            const res = await fetch(url);
            const txt = await res.text();
            return parseCollectionXml(txt);
        }catch(e){ return []; }
    }

    function sampleTeam(coll, size, excludeIds=new Set()){
        const pool = coll.filter(g => !excludeIds.has(g.id));
        if(pool.length === 0) return [];
        const out = [];
        const used = new Set();
        const effectiveSize = Math.min(size, pool.length);
        for(let i=0; i<effectiveSize; i++){
            let tries=0; let pick;
            do{ pick = pool[Math.floor(Math.random()*pool.length)]; tries++; } while(used.has(pick.id) && tries<30);
            used.add(pick.id); out.push(pick);
        }
        return out;
    }

    function teamAverage(team){
        if(!team || team.length===0) return 0;
        const sum = team.reduce((a,b)=>a+(parseFloat(b.bayes)||0), 0);
        return sum / team.length;
    }

    function substituteGame(teamIndex, slotIndex){
        const coll = teamIndex === 1 ? coll1 : coll2;
        const team = teamIndex === 1 ? team1 : team2;
        if(!coll || coll.length===0) return;
        const exclude = new Set();
        team.forEach((g,i)=>{ if(i!==slotIndex) exclude.add(g.id); });
        const other = teamIndex===1?team2:team1;
        other.forEach(g=>exclude.add(g.id));
        const pool = coll.filter(g => !exclude.has(g.id));
        if(pool.length===0) return;
        
        team[slotIndex] = pool[Math.floor(Math.random()*pool.length)];
        if(teamIndex === 1) stats.t1subs++; else stats.t2subs++;
        updateUI();
    }

    function renderTeam(elThumbs, team, teamIndex){
        elThumbs.innerHTML = '';
        team.forEach((g, idx)=>{
            const div = document.createElement('div');
            div.className = "aspect-square rounded-lg overflow-hidden border border-slate-800 bg-slate-900";
            const img = document.createElement('img');
            img.src = g.thumb; img.alt = g.name;
            img.className = "w-full h-full game-thumb grayscale-[0.2] hover:grayscale-0 transition-all cursor-crosshair";
            img.addEventListener('click', (e)=>{ e.stopPropagation(); substituteGame(teamIndex, idx); });
            div.appendChild(img);
            elThumbs.appendChild(div);
        })
    }

    function updateUI(){
        const u1 = document.getElementById('user1').value || 'User 1';
        const u2 = document.getElementById('user2').value || 'User 2';
        const n1 = document.getElementById('name1').value || 'Team 1';
        const n2 = document.getElementById('name2').value || 'Team 2';
        
        document.getElementById('t1userLabel').innerText = u1;
        document.getElementById('t2userLabel').innerText = u2;
        document.getElementById('t1nameLabel').innerText = n1;
        document.getElementById('t2nameLabel').innerText = n2;
        
        document.getElementById('t1wins').innerText = stats.t1wins;
        document.getElementById('t1subs').innerText = stats.t1subs;
        document.getElementById('t2wins').innerText = stats.t2wins;
        document.getElementById('t2subs').innerText = stats.t2subs;
        
        renderTeam(document.getElementById('t1thumbs'), team1, 1);
        renderTeam(document.getElementById('t2thumbs'), team2, 2);
        
        const showA = !!window._picked;
        document.getElementById('t1avg').innerText = showA ? teamAverage(team1).toFixed(2) : '??';
        document.getElementById('t2avg').innerText = showA ? teamAverage(team2).toFixed(2) : '??';
    }

    function addHistory(item){
        history.unshift(item);
        if (history.length === 1) historyEl.innerHTML = '';
        
        const node = document.createElement('div'); 
        node.className = 'bg-slate-900/50 border border-slate-800 p-4 rounded-3xl animate-slide';
        const fav = item.favorite === item.winner;
        
        node.innerHTML = `
            <div class="flex justify-between items-start mb-3">
                <div class="flex flex-col">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-tighter">Winner</span>
                    <span class="text-blue-400 font-extrabold text-lg truncate w-40">${item.winnerName}</span>
                </div>
                <span class="${fav ? 'bg-green-500/10 text-green-400' : 'bg-pink-500/10 text-pink-400'} px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest border border-current opacity-80">
                    ${fav ? 'Favorite Won' : 'Underdog Won'}
                </span>
            </div>
            <div class="space-y-3">
                <div class="flex flex-col gap-1">
                    <span class="text-[9px] font-bold text-slate-600 uppercase">Winning Roster (${item.winnerIndex === 1 ? item.n1 : item.n2})</span>
                    <div class="flex gap-1 overflow-x-auto pb-1 custom-scroll">${item.winnerThumbs}</div>
                </div>
                <div class="flex flex-col gap-1">
                    <span class="text-[9px] font-bold text-slate-600 uppercase">Loser Roster (${item.winnerIndex === 1 ? item.n2 : item.n1})</span>
                    <div class="flex gap-1 overflow-x-auto pb-1 custom-scroll opacity-40">${item.loserThumbs}</div>
                </div>
            </div>
            <div class="mt-3 pt-2 border-t border-slate-800 text-[10px] font-bold text-slate-600 flex justify-between">
                <span>T1 AVG: ${item.t1avg.toFixed(2)}</span>
                <span>T2 AVG: ${item.t2avg.toFixed(2)}</span>
            </div>
        `;
        historyEl.insertBefore(node, historyEl.firstChild);
    }

    function pickWinner(explicitIndex){
        const winnerIndex = explicitIndex;
        const winnerName = winnerIndex===1 ? document.getElementById('name1').value : document.getElementById('name2').value;
        const t1avg = teamAverage(team1);
        const t2avg = teamAverage(team2);
        const favorite = t1avg === t2avg ? (Math.random()<0.5?1:2) : (t1avg>t2avg?1:2);
        const favWon = favorite === winnerIndex;

        if(winnerIndex === 1) stats.t1wins++; else stats.t2wins++;

        const winnerTeamThumbs = (winnerIndex===1?team1:team2).map(g=>`<img src="${g.thumb}" class="w-10 h-10 rounded border border-slate-700 game-thumb shrink-0">`).join('');
        const loserTeamThumbs = (winnerIndex===1?team2:team1).map(g=>`<img src="${g.thumb}" class="w-10 h-10 rounded border border-slate-700 game-thumb shrink-0">`).join('');

        document.getElementById('resultArea').innerHTML = `
            <div class="flex items-center justify-center gap-3">
                <span class="font-bold text-white uppercase">${winnerName} WINS</span>
                <span class="text-xs px-2 py-0.5 rounded ${favWon?'bg-green-500/20 text-green-400':'bg-pink-500/20 text-pink-400'}">${favWon?'FAV':'UPS'}</span>
            </div>`;

        addHistory({ 
            winnerIndex, 
            winnerName, 
            t1avg, t2avg, 
            favorite, 
            winnerThumbs: winnerTeamThumbs, 
            loserThumbs: loserTeamThumbs,
            n1: document.getElementById('name1').value,
            n2: document.getElementById('name2').value
        });

        window._lastWinner = winnerIndex;
        window._picked = true;
        updateUI();
        
        const mode = nextMode?.value || 'shuffle';
        setTimeout(()=> { spawnNext(mode); }, 1500);
    }

    startBtn.addEventListener('click', async ()=>{
        loader.classList.remove('hidden');
        startBtn.disabled = true;
        const u1 = document.getElementById('user1').value;
        const u2 = document.getElementById('user2').value;
        const size = Math.max(1, Math.min(10, parseInt(document.getElementById('teamSize').value)||5));

        [coll1, coll2] = await Promise.all([fetchCollection(u1), fetchCollection(u2)]);

        if(document.getElementById('excludeExpansions')?.checked){
            coll1 = coll1.filter(g => (g.subtype || '').toLowerCase() !== 'boardgameexpansion');
            coll2 = coll2.filter(g => (g.subtype || '').toLowerCase() !== 'boardgameexpansion');
        }

        team1 = sampleTeam(coll1, size);
        team2 = sampleTeam(coll2, size, new Set(team1.map(g=>g.id)));

        window._picked = false;
        updateUI();
        document.getElementById('resultArea').innerText = 'Teams Ready — Tap a Team to Win';
        
        startBtn.disabled = false;
        loader.classList.add('hidden');
        switchTab('battle');
    });

    function spawnNext(mode){
        const size = Math.max(1, Math.min(10, parseInt(document.getElementById('teamSize').value)||5));
        const last = window._lastWinner || 0;
        
        document.getElementById('resultArea').innerText = 'Next match loading...';
        
        setTimeout(()=>{
            if(mode === 'shuffle'){
                team1 = sampleTeam(coll1, size);
                team2 = sampleTeam(coll2, size, new Set(team1.map(g=>g.id)));
            } else if(mode === 'winner'){
                if(last===1){ team2 = sampleTeam(coll2, size, new Set(team1.map(g=>g.id))); }
                else { team1 = sampleTeam(coll1, size, new Set(team2.map(g=>g.id))); }
            } else if(mode === 'loser'){
                const loser = last===1?2:1;
                if(loser===1){ team2 = sampleTeam(coll2, size, new Set(team1.map(g=>g.id))); }
                else { team1 = sampleTeam(coll1, size, new Set(team2.map(g=>g.id))); }
            }
            window._picked = false; window._lastWinner = 0;
            updateUI();
            document.getElementById('resultArea').innerText = 'Next Matchup Ready';
        }, 400);
    }

    document.getElementById('team1').addEventListener('click', ()=>{ if(team1.length && !window._picked) pickWinner(1); });
    document.getElementById('team2').addEventListener('click', ()=>{ if(team2.length && !window._picked) pickWinner(2); });

    </script>
</body>
</html>
