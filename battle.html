<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Game Battle">
    <title>BGG Game Battle - 1v1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            padding-top: max(0px, env(safe-area-inset-top));
            padding-bottom: max(0px, env(safe-area-inset-bottom));
            padding-left: max(0px, env(safe-area-inset-left));
            padding-right: max(0px, env(safe-area-inset-right));
        }
        .score-display {
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: 900;
            text-align: center;
            line-height: 1;
        }
        .tap-feedback {
            transition: transform 0.1s, opacity 0.1s;
        }
        .tap-feedback:active {
            transform: scale(0.98);
            opacity: 0.8;
        }
        .game-image {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: contain;
            background: #f5f5f5;
        }
    </style>
</head>
<body class="bg-gray-50 md:bg-gray-900 min-h-screen flex flex-col">

    <!-- Setup Screen -->
    <div id="setupScreen" class="fixed inset-0 bg-gradient-to-br from-blue-900 to-indigo-900 z-50 flex items-center justify-center p-4 md:p-8 overflow-y-auto">
        <div class="bg-white md:bg-gray-800 rounded-2xl shadow-2xl p-6 md:p-8 max-w-2xl w-full my-auto md:text-white">
            <h1 class="text-3xl md:text-4xl font-black text-center mb-2">⚔️ Game Battle</h1>
            <p class="text-gray-500 md:text-gray-300 text-center mb-8">Two players compete with their collections!</p>
            
            <div class="space-y-6">
                <!-- Player 1 -->
                <div class="border-4 border-blue-300 md:border-blue-600 rounded-xl p-4 bg-blue-50 md:bg-blue-900">
                    <h2 class="text-xl font-bold text-blue-600 md:text-blue-300 mb-3">🔵 Player 1</h2>
                    <input type="text" id="player1Username" class="w-full border-2 border-blue-300 md:border-blue-500 rounded-lg px-4 py-2 md:py-3 focus:border-blue-500 outline-none transition bg-white md:bg-blue-800 md:text-white text-lg" placeholder="BGG Username">
                </div>

                <!-- Player 2 -->
                <div class="border-4 border-red-300 md:border-red-600 rounded-xl p-4 bg-red-50 md:bg-red-900">
                    <h2 class="text-xl font-bold text-red-600 md:text-red-300 mb-3">🔴 Player 2</h2>
                    <input type="text" id="player2Username" class="w-full border-2 border-red-300 md:border-red-500 rounded-lg px-4 py-2 md:py-3 focus:border-red-500 outline-none transition bg-white md:bg-red-800 md:text-white text-lg" placeholder="BGG Username">
                    <p class="text-xs text-gray-500 md:text-gray-400 mt-2">Same or different collection</p>
                </div>

                <!-- Quick Settings Row -->
                <div class="grid grid-cols-3 gap-2 md:gap-4">
                    <div class="bg-gray-100 md:bg-gray-700 rounded-lg p-3">
                        <label class="text-xs font-bold text-gray-600 md:text-gray-300 block mb-1">Games</label>
                        <input type="number" id="gamesPerTeam" class="w-full bg-white md:bg-gray-600 border-2 border-gray-300 md:border-gray-500 rounded px-2 py-2 text-center text-lg font-bold md:text-white" value="10" min="1" max="50">
                    </div>
                    <div class="bg-gray-100 md:bg-gray-700 rounded-lg p-3">
                        <label class="text-xs font-bold text-gray-600 md:text-gray-300 block mb-1">Play To</label>
                        <input type="number" id="playToScore" class="w-full bg-white md:bg-gray-600 border-2 border-gray-300 md:border-gray-500 rounded px-2 py-2 text-center text-lg font-bold md:text-white" value="5" min="1" max="20">
                    </div>
                    <div class="bg-gray-100 md:bg-gray-700 rounded-lg p-3">
                        <label class="text-xs font-bold text-gray-600 md:text-gray-300 block mb-1">Subs</label>
                        <input type="number" id="substitutes" class="w-full bg-white md:bg-gray-600 border-2 border-gray-300 md:border-gray-500 rounded px-2 py-2 text-center text-lg font-bold md:text-white" value="5" min="0" max="10">
                    </div>
                </div>

                <!-- Start Button -->
                <button onclick="startBattle()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white py-4 rounded-xl font-black text-lg hover:from-purple-700 hover:to-indigo-700 transition shadow-lg transform hover:scale-[1.02] tap-feedback mt-6">
                    ⚡ START BATTLE
                </button>
            </div>
        </div>
    </div>

    <!-- Battle Screen -->
    <div id="battleApp" class="hidden fixed inset-0 bg-gray-50 md:bg-gray-900 z-40 flex flex-col">
        <!-- Score Board -->
        <div class="bg-white md:bg-gray-800 border-b-2 border-gray-200 md:border-gray-700 p-3 md:p-6 md:rounded-b-2xl md:shadow-lg">
            <div class="grid grid-cols-3 gap-4 items-center max-w-5xl mx-auto">
                <!-- Player 1 Score -->
                <div class="text-center">
                    <p class="text-sm font-bold text-gray-600 md:text-gray-300 mb-2">🔵 P1</p>
                    <p class="score-display text-blue-600 md:text-blue-400" id="score1">0</p>
                </div>

                <!-- VS -->
                <div class="text-center">
                    <p class="text-lg md:text-2xl font-bold text-gray-400">VS</p>
                    <p class="text-xs text-gray-500 md:text-gray-400 mt-1" id="playToDisplay">To 5</p>
                </div>

                <!-- Player 2 Score -->
                <div class="text-center">
                    <p class="text-sm font-bold text-gray-600 md:text-gray-300 mb-2">🔴 P2</p>
                    <p class="score-display text-red-600 md:text-red-400" id="score2">0</p>
                </div>
            </div>
        </div>

        <!-- Battle Arena -->
        <div class="flex-1 flex flex-col p-3 md:p-6 overflow-hidden max-w-5xl mx-auto w-full">
            <h2 class="text-lg md:text-xl font-bold text-center mb-3 md:mb-4 text-gray-800 md:text-gray-200">🎮 Current Matchup</h2>
            
            <!-- Game Cards -->
            <div class="grid grid-cols-2 gap-2 md:gap-6 flex-1 overflow-hidden mb-4 md:mb-6">
                <!-- Player 1 Card -->
                <div class="bg-white md:bg-gray-800 border-4 border-blue-400 md:border-blue-600 rounded-lg md:rounded-xl overflow-hidden flex flex-col">
                    <img id="p1GameImage" src="" alt="Game" class="game-image">
                    <div class="flex-1 flex flex-col justify-between p-2 md:p-4">
                        <p id="p1GameName" class="font-bold text-xs md:text-sm line-clamp-2 text-center text-gray-800 md:text-white"></p>
                        <div>
                            <p id="p1GameRating" class="text-2xl md:text-3xl font-black text-center text-blue-600 md:text-blue-400"></p>
                            <p id="p1GameYear" class="text-xs text-center text-gray-500 md:text-gray-400"></p>
                        </div>
                    </div>
                </div>

                <!-- Player 2 Card -->
                <div class="bg-white md:bg-gray-800 border-4 border-red-400 md:border-red-600 rounded-lg md:rounded-xl overflow-hidden flex flex-col">
                    <img id="p2GameImage" src="" alt="Game" class="game-image">
                    <div class="flex-1 flex flex-col justify-between p-2 md:p-4">
                        <p id="p2GameName" class="font-bold text-xs md:text-sm line-clamp-2 text-center text-gray-800 md:text-white"></p>
                        <div>
                            <p id="p2GameRating" class="text-2xl md:text-3xl font-black text-center text-red-600 md:text-red-400"></p>
                            <p id="p2GameYear" class="text-xs text-center text-gray-500 md:text-gray-400"></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="space-y-2 md:space-y-3">
                <!-- Main Winner Button -->
                <button onclick="determineWinner()" class="w-full bg-gradient-to-r from-yellow-400 to-orange-500 text-gray-900 py-3 md:py-4 rounded-lg md:rounded-xl font-black text-base md:text-lg hover:from-yellow-500 hover:to-orange-600 transition shadow-lg tap-feedback">
                    🔥 WINNER
                </button>

                <!-- Secondary Actions -->
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="useSubstitute(1)" class="bg-blue-500 md:bg-blue-700 hover:bg-blue-600 md:hover:bg-blue-800 text-white py-2 md:py-3 rounded-lg font-bold transition tap-feedback text-xs md:text-sm">
                        P1 🔄 <span id="p1SubsLeft">5</span>
                    </button>
                    <button onclick="nextRound()" class="bg-gray-600 md:bg-gray-700 hover:bg-gray-700 md:hover:bg-gray-600 text-white py-2 md:py-3 rounded-lg font-bold transition tap-feedback text-xs md:text-sm">
                        NEXT ➡️
                    </button>
                    <button onclick="useSubstitute(2)" class="bg-red-500 md:bg-red-700 hover:bg-red-600 md:hover:bg-red-800 text-white py-2 md:py-3 rounded-lg font-bold transition tap-feedback text-xs md:text-sm">
                        P2 🔄 <span id="p2SubsLeft">5</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="gameOverModal" class="hidden fixed inset-0 bg-black bg-opacity-70 md:bg-opacity-75 z-50 flex items-center justify-center p-4">
        <div class="bg-white md:bg-gray-800 rounded-2xl shadow-2xl p-6 md:p-8 max-w-md w-full text-center md:text-white">
            <h2 class="text-2xl md:text-3xl font-black text-gray-900 md:text-white mb-3" id="winnerText">🎉 WINNER!</h2>
            <p class="text-xl md:text-2xl font-bold text-gray-600 md:text-gray-300 mb-4" id="finalScoreText">5 - 3</p>
            
            <div class="bg-gray-100 md:bg-gray-700 rounded-lg p-3 md:p-4 mb-6">
                <p id="battleStatsText" class="text-sm md:text-base text-gray-700 md:text-gray-300">Battle Statistics</p>
            </div>

            <div class="flex gap-3">
                <button onclick="location.reload()" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white py-3 md:py-4 rounded-lg font-bold transition tap-feedback">
                    🔄 AGAIN
                </button>
                <button onclick="returnToSetup()" class="flex-1 bg-gray-400 md:bg-gray-600 hover:bg-gray-500 md:hover:bg-gray-700 text-gray-900 md:text-white py-3 md:py-4 rounded-lg font-bold transition tap-feedback">
                    🏠 HOME
                </button>
            </div>
        </div>
    </div>

    <script>
        let player1Collections = [];
        let player2Collections = [];
        let player1Team = [];
        let player2Team = [];
        let player1Score = 0;
        let player2Score = 0;
        let currentRound = 0;
        let currentP1Game = null;
        let currentP2Game = null;
        let gamesPerTeam = 10;
        let playToScore = 5;
        let substitutesPerPlayer = 5;
        let player1SubsUsed = 0;
        let player2SubsUsed = 0;

        console.log('[BATTLE] Responsive app initialized - works on mobile and desktop');

        async function startBattle() {
            const p1Username = document.getElementById('player1Username').value.trim();
            const p2Username = document.getElementById('player2Username').value.trim();

            if (!p1Username || !p2Username) {
                alert('Please enter both usernames!');
                return;
            }

            gamesPerTeam = parseInt(document.getElementById('gamesPerTeam').value) || 10;
            playToScore = parseInt(document.getElementById('playToScore').value) || 5;
            substitutesPerPlayer = parseInt(document.getElementById('substitutes').value) || 5;

            console.log('[BATTLE] Starting new battle');
            console.log('   ├─ P1:', p1Username);
            console.log('   ├─ P2:', p2Username);
            console.log('   ├─ Games:', gamesPerTeam);
            console.log('   ├─ Play To:', playToScore);
            console.log('   └─ Subs:', substitutesPerPlayer);

            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('battleApp').classList.remove('hidden');

            await loadPlayerCollections(p1Username, p2Username);
            
            player1Team = selectRandomGames(player1Collections, gamesPerTeam);
            player2Team = selectRandomGames(player2Collections, gamesPerTeam);

            console.log('[BATTLE] Teams created:', player1Team.length, 'vs', player2Team.length);
            document.getElementById('playToDisplay').textContent = `To ${playToScore}`;
            nextRound();
        }

        async function loadPlayerCollections(p1Username, p2Username) {
            console.log('[COLLECTION-API] Loading collections');
            try {
                console.log('[COLLECTION-API] P1:', p1Username);
                const p1Res = await fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(p1Username)}&own=1&stats=1`);
                const p1Xml = await p1Res.text();
                const p1Parser = new DOMParser().parseFromString(p1Xml, 'text/xml');
                const p1Items = Array.from(p1Parser.querySelectorAll('item'));
                
                player1Collections = p1Items.map(item => ({
                    id: item.getAttribute('objectid'),
                    name: item.querySelector('name')?.textContent || 'Unknown',
                    thumbnail: item.querySelector('thumbnail')?.textContent || '',
                    yearpublished: item.getAttribute('publishyear') || '?'
                }));

                console.log('✓ P1:', player1Collections.length, 'games');
                await enrichWithBayesRatings(player1Collections, 'P1');

                console.log('[COLLECTION-API] P2:', p2Username);
                const p2Res = await fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(p2Username)}&own=1&stats=1`);
                const p2Xml = await p2Res.text();
                const p2Parser = new DOMParser().parseFromString(p2Xml, 'text/xml');
                const p2Items = Array.from(p2Parser.querySelectorAll('item'));
                
                player2Collections = p2Items.map(item => ({
                    id: item.getAttribute('objectid'),
                    name: item.querySelector('name')?.textContent || 'Unknown',
                    thumbnail: item.querySelector('thumbnail')?.textContent || '',
                    yearpublished: item.getAttribute('publishyear') || '?'
                }));

                console.log('✓ P2:', player2Collections.length, 'games');
                await enrichWithBayesRatings(player2Collections, 'P2');

            } catch (error) {
                console.error('[COLLECTION-API] Error:', error);
                alert('Error loading collections');
            }
        }

        async function enrichWithBayesRatings(collection, playerName) {
            console.log(`[THING-API] Enriching ${playerName}:`, collection.length, 'games');
            const chunkSize = 20;
            const chunks = [];
            for (let i = 0; i < collection.length; i += chunkSize) {
                chunks.push(collection.slice(i, i + chunkSize));
            }

            for (let chunkIdx = 0; chunkIdx < chunks.length; chunkIdx++) {
                const chunk = chunks[chunkIdx];
                const gameIds = chunk.map(g => g.id).join(',');
                try {
                    const res = await fetch(`/api/bgg-helper?endpoint=thing&id=${gameIds}&stats=1`);
                    const xml = new DOMParser().parseFromString(await res.text(), 'text/xml');
                    const items = Array.from(xml.querySelectorAll('item'));

                    items.forEach(item => {
                        const gameId = item.getAttribute('id');
                        const collectionGame = chunk.find(g => g.id === gameId);
                        if (collectionGame) {
                            const stats = item.querySelector('statistics ratings');
                            collectionGame.bayesAverage = parseFloat(stats?.querySelector('average')?.getAttribute('value') || 0);
                            collectionGame.voters = parseInt(stats?.querySelector('usersrated')?.getAttribute('value') || 0);
                        }
                    });

                    console.log(`✓ [THING-API] ${playerName} Batch ${chunkIdx + 1}/${chunks.length}:`, items.length, 'games');
                } catch (error) {
                    console.error(`✗ [THING-API] ${playerName} Batch ${chunkIdx + 1}:`, error);
                }
            }
        }

        function selectRandomGames(collection, count) {
            const shuffled = [...collection].sort(() => Math.random() - 0.5);
            return shuffled.slice(0, Math.min(count, collection.length));
        }

        function nextRound() {
            if (player1Score >= playToScore || player2Score >= playToScore) {
                endBattle();
                return;
            }

            currentP1Game = player1Team[Math.floor(Math.random() * player1Team.length)];
            currentP2Game = player2Team[Math.floor(Math.random() * player2Team.length)];

            console.log(`[ROUND] ${currentRound + 1}: "${currentP1Game.name}" (${currentP1Game.bayesAverage?.toFixed(1)}) vs "${currentP2Game.name}" (${currentP2Game.bayesAverage?.toFixed(1)})`);

            document.getElementById('p1GameName').textContent = currentP1Game.name;
            document.getElementById('p1GameRating').textContent = (currentP1Game.bayesAverage?.toFixed(1) || 'N/A');
            document.getElementById('p1GameYear').textContent = currentP1Game.yearpublished || '';
            document.getElementById('p1GameImage').src = currentP1Game.thumbnail || '';

            document.getElementById('p2GameName').textContent = currentP2Game.name;
            document.getElementById('p2GameRating').textContent = (currentP2Game.bayesAverage?.toFixed(1) || 'N/A');
            document.getElementById('p2GameYear').textContent = currentP2Game.yearpublished || '';
            document.getElementById('p2GameImage').src = currentP2Game.thumbnail || '';

            currentRound++;
        }

        function determineWinner() {
            const p1Rating = currentP1Game.bayesAverage || 0;
            const p2Rating = currentP2Game.bayesAverage || 0;

            if (p1Rating > p2Rating) {
                player1Score++;
                console.log('✓ P1 wins! Score:', player1Score, '-', player2Score);
                alert(`🔵 +1 (${p1Rating.toFixed(1)} vs ${p2Rating.toFixed(1)})`);
            } else if (p2Rating > p1Rating) {
                player2Score++;
                console.log('✓ P2 wins! Score:', player1Score, '-', player2Score);
                alert(`🔴 +1 (${p2Rating.toFixed(1)} vs ${p1Rating.toFixed(1)})`);
            } else {
                console.log('⚖️ Tie!');
                alert(`⚖️ Tie (${p1Rating.toFixed(1)})`);
            }

            document.getElementById('score1').textContent = player1Score;
            document.getElementById('score2').textContent = player2Score;
        }

        function useSubstitute(playerNum) {
            if (playerNum === 1) {
                if (player1SubsUsed >= substitutesPerPlayer) {
                    alert('No substitutes left!');
                    return;
                }
                player1SubsUsed++;
                currentP1Game = player1Team[Math.floor(Math.random() * player1Team.length)];
                document.getElementById('p1SubsLeft').textContent = substitutesPerPlayer - player1SubsUsed;
                console.log('✓ P1 sub used:', substitutesPerPlayer - player1SubsUsed, 'left');
            } else {
                if (player2SubsUsed >= substitutesPerPlayer) {
                    alert('No substitutes left!');
                    return;
                }
                player2SubsUsed++;
                currentP2Game = player2Team[Math.floor(Math.random() * player2Team.length)];
                document.getElementById('p2SubsLeft').textContent = substitutesPerPlayer - player2SubsUsed;
                console.log('✓ P2 sub used:', substitutesPerPlayer - player2SubsUsed, 'left');
            }
            nextRound();
        }

        function endBattle() {
            console.log('[END-BATTLE] Final:', player1Score, '-', player2Score, '| Rounds:', currentRound);
            const winner = player1Score > player2Score ? '🔵 P1' : '🔴 P2';
            document.getElementById('winnerText').textContent = winner + ' WINS!';
            document.getElementById('finalScoreText').textContent = player1Score + ' - ' + player2Score;
            document.getElementById('battleStatsText').textContent = 'Rounds: ' + currentRound + ' | P1 Subs: ' + player1SubsUsed + '/' + substitutesPerPlayer + ' | P2 Subs: ' + player2SubsUsed + '/' + substitutesPerPlayer;
            document.getElementById('gameOverModal').classList.remove('hidden');
        }

        function returnToSetup() {
            location.reload();
        }

        document.addEventListener('touchmove', function(e) {
            if (e.touches.length > 1) e.preventDefault();
        }, false);

        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
