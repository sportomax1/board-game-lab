<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board Game Memory Matching</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .game-tile {
            cursor: pointer;
            perspective: 1000px;
            transition: transform 0.3s ease;
        }
        
        .game-tile:hover:not(.matched) {
            transform: scale(1.05);
        }
        
        .tile-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        
        .game-tile.flipped .tile-inner {
            transform: rotateY(180deg);
        }
        
        .tile-front, .tile-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .tile-front {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 2rem;
        }
        
        .tile-back {
            transform: rotateY(180deg);
            background: white;
            padding: 4px;
        }
        
        .tile-back img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }
        
        .game-tile.matched .game-tile {
            pointer-events: none;
        }
        
        .stats-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Setup Screen -->
    <div id="setupScreen" class="fixed inset-0 bg-gradient-to-br from-purple-900 to-indigo-900 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
            <h1 class="text-3xl font-bold text-gray-900 mb-2 text-center">🎮 Memory Matching</h1>
            <p class="text-gray-600 text-center text-sm mb-6">Match pairs of games from your BGG collection!</p>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">BGG Username</label>
                    <input type="text" id="usernameInput" class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 focus:border-purple-500 outline-none transition text-base" placeholder="Enter username" value="sportomax">
                </div>
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Number of Games</label>
                    <p class="text-xs text-gray-500 mb-2">More games = more challenging</p>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="setGameCount(10)" class="px-3 py-2 bg-gray-100 text-gray-700 rounded-lg font-semibold hover:bg-gray-200 transition">10</button>
                        <button onclick="setGameCount(15)" class="px-3 py-2 bg-gray-100 text-gray-700 rounded-lg font-semibold hover:bg-gray-200 transition">15</button>
                        <button onclick="setGameCount(20)" class="px-3 py-2 bg-gray-100 text-gray-700 rounded-lg font-semibold hover:bg-gray-200 transition">20</button>
                        <button onclick="setGameCount(25)" class="px-3 py-2 bg-gray-100 text-gray-700 rounded-lg font-semibold hover:bg-gray-200 transition">25</button>
                        <button onclick="setGameCount(30)" class="px-3 py-2 bg-gray-100 text-gray-700 rounded-lg font-semibold hover:bg-gray-200 transition">30</button>
                        <button onclick="setGameCount(35)" class="px-3 py-2 bg-gray-100 text-gray-700 rounded-lg font-semibold hover:bg-gray-200 transition">35</button>
                    </div>
                    <div id="selectedGameCount" class="text-center text-purple-600 font-bold mt-2">Selected: 10 games</div>
                </div>

                <div class="space-y-2">
                    <label class="flex items-center gap-2">
                        <input type="checkbox" id="excludeExpansions" class="w-4 h-4 rounded" checked>
                        <span class="text-sm text-gray-700">Exclude Expansions</span>
                    </label>
                </div>
                
                <button onclick="startGame()" class="w-full bg-purple-600 text-white py-3 rounded-lg font-bold text-lg hover:bg-purple-700 transition shadow-lg">
                    🎯 Start Game
                </button>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="hidden flex flex-col min-h-screen p-4 md:p-6">
        <!-- Header -->
        <div class="max-w-6xl mx-auto w-full mb-6">
            <div class="flex items-center justify-between mb-4">
                <h1 class="text-3xl md:text-4xl font-bold text-gray-900">🎮 Memory Matching</h1>
                <button onclick="location.reload()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg font-semibold hover:bg-gray-300 transition">
                    ↻ New Game
                </button>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4">
                <div class="stats-card">
                    <div class="text-2xl md:text-3xl font-black" id="flipsDisplay">0</div>
                    <div class="text-xs md:text-sm font-semibold mt-1">Flips</div>
                </div>
                <div class="stats-card">
                    <div class="text-2xl md:text-3xl font-black" id="matchesDisplay">0</div>
                    <div class="text-xs md:text-sm font-semibold mt-1">Matches</div>
                </div>
                <div class="stats-card">
                    <div class="text-2xl md:text-3xl font-black" id="totalMatchesDisplay">0</div>
                    <div class="text-xs md:text-sm font-semibold mt-1">Total Pairs</div>
                </div>
                <div class="stats-card">
                    <div class="text-2xl md:text-3xl font-black" id="timeDisplay">0s</div>
                    <div class="text-xs md:text-sm font-semibold mt-1">Time Elapsed</div>
                </div>
            </div>
        </div>

        <!-- Game Grid -->
        <div class="flex-1 flex items-center justify-center">
            <div class="max-w-6xl w-full">
                <div id="gameGrid" class="grid gap-3 md:gap-4 auto-fit" style="grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));">
                    <!-- Game tiles will be inserted here -->
                </div>
            </div>
        </div>

        <!-- Win Modal -->
        <div id="winModal" class="hidden fixed inset-0 bg-black bg-opacity-70 z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full text-center">
                <div class="text-5xl mb-4">🎉</div>
                <h2 class="text-3xl font-bold text-gray-900 mb-2">You Won!</h2>
                <p class="text-gray-600 mb-4">
                    Completed in <span id="finalTime" class="font-bold">0</span> seconds with <span id="finalFlips" class="font-bold">0</span> flips
                </p>
                <div class="space-y-2">
                    <button onclick="location.reload()" class="w-full bg-purple-600 text-white py-3 rounded-lg font-bold hover:bg-purple-700 transition">
                        🎮 Play Again
                    </button>
                    <button onclick="goHome()" class="w-full bg-gray-200 text-gray-700 py-3 rounded-lg font-bold hover:bg-gray-300 transition">
                        🏠 Home
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let collection = [];
        let gameCount = 10;
        let selectedGames = [];
        let gamePairs = [];
        let flipped = [];
        let matched = [];
        let flips = 0;
        let matches = 0;
        let gameStartTime = 0;
        let timerInterval = null;

        function setGameCount(count) {
            gameCount = count;
            document.getElementById('selectedGameCount').textContent = `Selected: ${count} games`;
        }

        async function startGame() {
            const username = document.getElementById('usernameInput').value.trim();
            if (!username) {
                alert('Please enter a username');
                return;
            }

            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');

            try {
                // Load collection
                let queryParams = `endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1`;
                if (document.getElementById('excludeExpansions').checked) {
                    queryParams += '';
                } else {
                    queryParams += '&includeexpansions=1';
                }

                const res = await fetch(`/api/bgg-helper?${queryParams}`);
                const xml = await res.text();
                const parser = new DOMParser().parseFromString(xml, 'text/xml');
                const items = Array.from(parser.querySelectorAll('item'));

                collection = items
                    .filter(item => {
                        // Skip expansions if needed
                        if (document.getElementById('excludeExpansions').checked) {
                            const type = item.getAttribute('subtype');
                            if (type === 'boardgameexpansion') return false;
                        }
                        // Only include items with thumbnails
                        const thumbnail = item.querySelector('thumbnail')?.textContent;
                        return !!thumbnail;
                    })
                    .map(item => ({
                        id: item.getAttribute('objectid'),
                        name: item.querySelector('name').textContent,
                        thumbnail: item.querySelector('thumbnail')?.textContent || '',
                    }))
                    .slice(0, gameCount);

                if (collection.length < gameCount) {
                    alert(`Only found ${collection.length} games with images. Using those instead.`);
                    gameCount = collection.length;
                }

                // Create pairs (each game appears twice)
                gamePairs = [];
                collection.forEach((game, idx) => {
                    gamePairs.push({ ...game, pairId: idx, index: gamePairs.length });
                    gamePairs.push({ ...game, pairId: idx, index: gamePairs.length });
                });

                // Shuffle
                gamePairs.sort(() => Math.random() - 0.5);

                // Initialize game state
                flipped = new Array(gamePairs.length).fill(false);
                matched = new Array(gamePairs.length).fill(false);
                flips = 0;
                matches = 0;
                gameStartTime = Date.now();

                renderGameBoard();
                startTimer();
            } catch (error) {
                console.error('Error:', error);
                alert('Error loading collection: ' + error.message);
                location.reload();
            }
        }

        function renderGameBoard() {
            const grid = document.getElementById('gameGrid');
            const cols = Math.sqrt(gamePairs.length);
            grid.style.gridTemplateColumns = `repeat(${Math.min(6, cols)}, 1fr)`;
            
            grid.innerHTML = gamePairs.map((game, idx) => `
                <div class="game-tile ${matched[idx] ? 'matched' : ''}" onclick="flipTile(${idx})" style="aspect-ratio: 1;">
                    <div class="tile-inner">
                        <div class="tile-front">
                            <div class="text-4xl">?</div>
                        </div>
                        <div class="tile-back">
                            <img src="${game.thumbnail}" alt="${game.name}" onerror="this.src='https://via.placeholder.com/100?text=${encodeURIComponent(game.name.substring(0, 3))}'" loading="lazy">
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function flipTile(idx) {
            if (flipped[idx] || matched[idx] || flipped.filter(f => f).length >= 2) {
                return;
            }

            flipped[idx] = true;
            flips++;
            document.querySelectorAll('.game-tile')[idx].classList.add('flipped');
            document.getElementById('flipsDisplay').textContent = flips;

            const flippedIndices = flipped.map((f, i) => f ? i : -1).filter(i => i !== -1);

            if (flippedIndices.length === 2) {
                const [idx1, idx2] = flippedIndices;
                if (gamePairs[idx1].pairId === gamePairs[idx2].pairId) {
                    // Match found
                    matched[idx1] = true;
                    matched[idx2] = true;
                    matches++;
                    document.getElementById('matchesDisplay').textContent = matches;
                    document.querySelectorAll('.game-tile')[idx1].classList.add('matched');
                    document.querySelectorAll('.game-tile')[idx2].classList.add('matched');
                    flipped[idx1] = false;
                    flipped[idx2] = false;

                    // Check win
                    if (matches === gameCount) {
                        endGame();
                    }
                } else {
                    // No match - flip back
                    setTimeout(() => {
                        document.querySelectorAll('.game-tile')[idx1].classList.remove('flipped');
                        document.querySelectorAll('.game-tile')[idx2].classList.remove('flipped');
                        flipped[idx1] = false;
                        flipped[idx2] = false;
                    }, 1000);
                }
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - gameStartTime) / 1000);
                document.getElementById('timeDisplay').textContent = elapsed + 's';
            }, 100);
        }

        function endGame() {
            clearInterval(timerInterval);
            const elapsed = Math.floor((Date.now() - gameStartTime) / 1000);
            document.getElementById('finalTime').textContent = elapsed;
            document.getElementById('finalFlips').textContent = flips;
            document.getElementById('totalMatchesDisplay').textContent = gameCount;
            document.getElementById('winModal').classList.remove('hidden');
        }

        function goHome() {
            window.location.href = '/index.html';
        }

        // Initialize game count display
        document.getElementById('selectedGameCount').textContent = `Selected: ${gameCount} games`;
        document.getElementById('totalMatchesDisplay').textContent = '0';
    </script>
</body>
</html>
