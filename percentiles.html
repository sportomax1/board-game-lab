<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>BGG Percentiles</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }

    .percentile-badge {
      font-size: 8px;
      font-weight: 800;
      padding: 1px 3px;
      border-radius: 3px;
      text-transform: uppercase;
      display: inline-block;
      line-height: 1;
    }

    .p-100 { background: #14532d; color: white; }
    .p-90 { background: #166534; color: white; }
    .p-80 { background: #15803d; color: white; }
    .p-70 { background: #16a34a; color: white; }
    .p-60 { background: #22c55e; color: #064e3b; }
    .p-50 { background: #4ade80; color: #064e3b; }
    .p-40 { background: #fef08a; color: #713f12; }
    .p-30 { background: #fde047; color: #713f12; }
    .p-20 { background: #facc15; color: #713f12; }
    .p-10 { background: #f87171; color: white; }
    .p-0 { background: #ef4444; color: white; }

    .sticky-col {
      position: sticky;
      left: 0;
      background: white;
      z-index: 25;
    }

    .table-container {
      max-height: calc(100vh - 220px);
      overflow: auto;
    }

    tr:hover td {
      background-color: #f1f5f9 !important;
    }

    .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    .loader {
      border: 2px solid #f3f3f3;
      border-top: 2px solid #6366f1;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .compact-td {
      padding: 0.5rem 0.4rem !important;
    }

    /* Combined Score Row highlight */
    .combined-col {
      background: #fdf2f8;
      border-left: 2px solid #f472b6;
      border-right: 2px solid #f472b6;
    }
  </style>
</head>
<body class="pb-4">

  <header class="sticky top-0 z-40 w-full bg-white/90 backdrop-blur-md border-b px-4 py-2 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-2">
      <div class="bg-indigo-600 text-white p-2 rounded-lg shadow-indigo-100 shadow-md">
        <i class="fa-solid fa-percent text-sm"></i>
      </div>
      <div>
        <h1 class="text-sm font-extrabold tracking-tight">BGG Percentiles</h1>
        <p class="text-[8px] text-slate-500 font-bold uppercase tracking-widest">Analytics Dashboard</p>
      </div>
    </div>
    
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2 bg-slate-50 p-1.5 rounded-lg border border-slate-200">
        <input id="username" type="text" value="sportomax" placeholder="User" class="bg-transparent text-xs font-bold outline-none w-24">
        <label class="flex items-center gap-1 cursor-pointer">
          <input type="checkbox" id="ownOnly" checked class="w-3 h-3 text-indigo-600">
          <span class="text-[10px] font-bold text-slate-600">Own</span>
        </label>
        <button onclick="fetchFullData()" id="fetchBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1 rounded text-[10px] font-bold transition-all">
          Run
        </button>
      </div>
      <div id="gameCountBox" class="hidden text-right">
        <div id="gameCount" class="text-sm font-black text-indigo-600">0</div>
        <div class="text-[8px] font-bold text-slate-400 uppercase">Games</div>
      </div>
    </div>
  </header>

  <main class="max-w-[1800px] mx-auto p-2 space-y-2">

    <!-- Loading State -->
    <div id="loadingSection" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 p-4 text-center space-y-2">
      <div class="flex justify-center items-center gap-3">
        <div class="loader"></div>
        <div id="loadingStatus" class="text-xs font-bold text-slate-700">Initializing...</div>
      </div>
      <div class="w-full max-w-xs mx-auto bg-slate-100 rounded-full h-1 overflow-hidden">
        <div id="progressBar" class="bg-indigo-600 h-full transition-all duration-300" style="width: 0%"></div>
      </div>
    </div>

    <!-- Main Workspace -->
    <div id="resultsSection" class="hidden grid grid-cols-12 gap-2">
      
      <!-- Settings Panel -->
      <div class="col-span-12 lg:col-span-2 space-y-2">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-3">
          <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-wider mb-2 border-b pb-1">Combined Score Config</h3>
          <div id="settingsList" class="space-y-1.5">
            <!-- Toggles injected here -->
          </div>
          <div class="mt-4 pt-2 border-t">
            <label class="text-[9px] font-black text-slate-400 uppercase mb-1 block">Modifier (%)</label>
            <input id="globalModifier" type="number" value="100" oninput="renderTable()" class="w-full px-2 py-1 border rounded text-xs font-bold">
          </div>
        </div>
      </div>

      <!-- Table Section -->
      <div class="col-span-12 lg:col-span-10 space-y-2">
        <div class="flex items-center justify-between px-2">
          <div class="flex items-center gap-3">
            <h2 class="text-xs font-black text-slate-700 uppercase tracking-widest">Global Rankings</h2>
            <div class="text-[9px] font-bold text-slate-400 italic">Top = 100%</div>
          </div>
          <input id="tableSearch" type="text" placeholder="Filter..." oninput="renderTable()" class="px-3 py-1 rounded border border-slate-200 text-xs focus:ring-1 focus:ring-indigo-500 outline-none w-48">
        </div>
        
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
          <div class="table-container custom-scrollbar">
            <table class="w-full text-left border-collapse text-[10px]">
              <thead class="sticky top-0 z-30 shadow-sm">
                <tr class="bg-slate-50 border-b border-slate-200">
                  <th class="p-2 font-black text-slate-500 uppercase sticky-col z-30 min-w-[150px]">Game</th>
                  <th class="p-2 font-black text-indigo-600 uppercase text-center combined-col min-w-[70px]">Combined</th>
                  <th class="p-2 font-black text-slate-500 uppercase text-center border-l min-w-[50px]">Thumb</th>
                  <th class="p-2 font-black text-slate-500 uppercase text-center border-l">ID</th>
                  <th class="p-2 font-black text-slate-500 uppercase text-center border-l">Year</th>
                  <th class="p-2 font-black text-slate-500 uppercase text-center border-l">Time</th>
                  <th class="p-2 font-black text-slate-500 uppercase text-center border-l">Age</th>
                  <th class="p-2 font-black text-slate-500 uppercase text-center border-l">Rated</th>
                  <th class="p-2 font-black text-slate-500 uppercase text-center border-l">Avg</th>
                  <th class="p-2 font-black text-slate-500 uppercase text-center border-l">Bayes</th>
                  <th class="p-2 font-black text-slate-500 uppercase text-center border-l">Rank</th>
                  <th class="p-2 font-black text-slate-500 uppercase text-center border-l">StdD</th>
                  <th class="p-2 font-black text-slate-500 uppercase text-center border-l">Own</th>
                  <th class="p-2 font-black text-slate-500 uppercase text-center border-l">Trade</th>
                  <th class="p-2 font-black text-slate-500 uppercase text-center border-l">Want</th>
                  <th class="p-2 font-black text-slate-500 uppercase text-center border-l">Wish</th>
                  <th class="p-2 font-black text-slate-500 uppercase text-center border-l">Weight</th>
                </tr>
              </thead>
              <tbody id="resultsBody">
                <!-- Rows injected here -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

  </main>

  <script>
    const API_BASE = '/api/bgg-helper';
    const BATCH_SIZE = 20;

    let allGames = [];
    let percentileData = {};
    
    const metricConfig = [
      { id: 'id', label: 'Item ID', order: 'desc', active: false },
      { id: 'year', label: 'Year Pub', order: 'desc', active: true },
      { id: 'time', label: 'Time', order: 'asc', active: true },
      { id: 'age', label: 'Min Age', order: 'asc', active: true },
      { id: 'usersrated', label: 'Rated', order: 'desc', active: true },
      { id: 'average', label: 'Average', order: 'desc', active: true },
      { id: 'bayesaverage', label: 'Bayes Avg', order: 'desc', active: true },
      { id: 'rank', label: 'BGG Rank', order: 'asc', active: true, ignoreNull: true },
      { id: 'stddev', label: 'Std Dev', order: 'asc', active: true },
      { id: 'owned', label: 'Owned', order: 'desc', active: true },
      { id: 'trading', label: 'Trading', order: 'desc', active: true },
      { id: 'wanting', label: 'Wanting', order: 'desc', active: true },
      { id: 'wishing', label: 'Wishing', order: 'desc', active: true },
      { id: 'weight', label: 'Weight', order: 'asc', active: true }
    ];

    function initSettings() {
      const list = document.getElementById('settingsList');
      list.innerHTML = metricConfig.map(m => `
        <label class="flex items-center justify-between p-1.5 rounded hover:bg-slate-50 cursor-pointer group">
          <span class="text-[10px] font-bold text-slate-600 group-hover:text-indigo-600">${m.label}</span>
          <input type="checkbox" ${m.active ? 'checked' : ''} onchange="toggleMetric('${m.id}', this.checked)" class="w-3.5 h-3.5 text-indigo-600 rounded">
        </label>
      `).join('');
    }

    function toggleMetric(id, checked) {
      const m = metricConfig.find(x => x.id === id);
      if (m) m.active = checked;
      renderTable();
    }

    async function fetchFullData() {
      const username = document.getElementById('username').value.trim();
      const ownOnly = document.getElementById('ownOnly').checked;
      if (!username) return;

      document.getElementById('loadingSection').classList.remove('hidden');
      document.getElementById('resultsSection').classList.add('hidden');
      document.getElementById('gameCountBox').classList.add('hidden');

      try {
        updateStatus(`Loading collection...`, 10);
        let collUrl = `${API_BASE}?endpoint=collection&username=${encodeURIComponent(username)}&stats=1&version=2`;
        if (ownOnly) collUrl += '&own=1';
        
        const collXml = await fetchWithRetry(collUrl);
        const collDoc = new DOMParser().parseFromString(collXml, 'text/xml');
        const items = Array.from(collDoc.querySelectorAll('item'));
        
        if (items.length === 0) throw new Error('No games found.');

        const ids = items.map(it => it.getAttribute('objectid'));
        updateStatus(`Analyzing ${ids.length} titles...`, 20);

        const batches = [];
        for (let i = 0; i < ids.length; i += BATCH_SIZE) batches.push(ids.slice(i, i + BATCH_SIZE));

        let processed = 0;
        const results = [];

        await Promise.all(batches.map(async (batch) => {
          const thingUrl = `${API_BASE}?endpoint=thing&id=${encodeURIComponent(batch.join(','))}&stats=1`;
          const thingXml = await fetchWithRetry(thingUrl);
          const thingDoc = new DOMParser().parseFromString(thingXml, 'text/xml');
          
          Array.from(thingDoc.querySelectorAll('item')).forEach(item => {
            const stats = item.querySelector('statistics ratings');
            const rankNode = stats ? stats.querySelector('rank[type="subtype"]') : null;
            const rankVal = rankNode ? rankNode.getAttribute('value') : null;

            results.push({
              id: parseInt(item.getAttribute('id')),
              name: item.querySelector('name[type="primary"]')?.getAttribute('value') || item.querySelector('name')?.textContent,
              thumb: item.querySelector('thumbnail')?.textContent || '',
              year: parseInt(item.querySelector('yearpublished')?.getAttribute('value') || '0'),
              time: parseInt(item.querySelector('playingtime')?.getAttribute('value') || '0'),
              age: parseInt(item.querySelector('minage')?.getAttribute('value') || '0'),
              usersrated: parseInt(stats?.querySelector('usersrated')?.getAttribute('value') || '0'),
              average: parseFloat(stats?.querySelector('average')?.getAttribute('value') || '0'),
              bayesaverage: parseFloat(stats?.querySelector('bayesaverage')?.getAttribute('value') || '0'),
              rank: (rankVal && rankVal !== 'Not Ranked') ? parseInt(rankVal) : null,
              stddev: parseFloat(stats?.querySelector('stddev')?.getAttribute('value') || '0'),
              owned: parseInt(stats?.querySelector('owned')?.getAttribute('value') || '0'),
              trading: parseInt(stats?.querySelector('trading')?.getAttribute('value') || '0'),
              wanting: parseInt(stats?.querySelector('wanting')?.getAttribute('value') || '0'),
              wishing: parseInt(stats?.querySelector('wishing')?.getAttribute('value') || '0'),
              weight: parseFloat(stats?.querySelector('averageweight')?.getAttribute('value') || '0')
            });
          });
          processed += batch.length;
          updateStatus(`Syncing stats... ${Math.min(processed, ids.length)}/${ids.length}`, 20 + (processed / ids.length) * 70);
        }));

        allGames = results;
        calculatePercentiles();
        
        document.getElementById('loadingSection').classList.add('hidden');
        document.getElementById('resultsSection').classList.remove('hidden');
        document.getElementById('gameCountBox').classList.remove('hidden');
        document.getElementById('gameCount').textContent = allGames.length;
        renderTable();
      } catch (err) {
        alert(err.message);
        document.getElementById('loadingSection').classList.add('hidden');
      }
    }

    function calculatePercentiles() {
      percentileData = {};
      metricConfig.forEach(f => {
        let valid = allGames.map(g => ({ id: g.id, val: g[f.id] }));
        if (f.ignoreNull || f.id === 'rank') valid = valid.filter(g => g.val !== null && g.val !== 0);
        valid.sort((a, b) => f.order === 'asc' ? a.val - b.val : b.val - a.val);
        const N = valid.length;
        const ranks = {};
        valid.forEach((g, i) => ranks[g.id] = N > 1 ? (1 - (i / (N - 1))) * 100 : 100);
        percentileData[f.id] = ranks;
      });
    }

    function getPercentileClass(p) {
      if (p === null || p === undefined) return '';
      if (p >= 90) return 'p-100';
      if (p >= 80) return 'p-90';
      if (p >= 70) return 'p-80';
      if (p >= 60) return 'p-70';
      if (p >= 50) return 'p-60';
      if (p >= 40) return 'p-50';
      if (p >= 30) return 'p-40';
      if (p >= 20) return 'p-30';
      if (p >= 10) return 'p-20';
      if (p > 0) return 'p-10';
      return 'p-0';
    }

    function renderTable() {
      const search = document.getElementById('tableSearch').value.toLowerCase();
      const modifier = parseFloat(document.getElementById('globalModifier').value) / 100 || 1;
      const activeMetrics = metricConfig.filter(m => m.active).map(m => m.id);
      
      const tbody = document.getElementById('resultsBody');
      tbody.innerHTML = '';

      const filtered = allGames.filter(g => g.name.toLowerCase().includes(search));

      filtered.forEach(g => {
        // Calculate combined score
        let sum = 0, count = 0;
        activeMetrics.forEach(mid => {
          const p = percentileData[mid] ? percentileData[mid][g.id] : null;
          if (p !== null && p !== undefined) {
            sum += p;
            count++;
          }
        });
        const combined = count > 0 ? (sum / count) * modifier : null;
        const combCls = getPercentileClass(combined);

        const row = document.createElement('tr');
        row.className = 'border-b border-slate-100 transition-colors bg-white';
        
        let html = `
          <td class="compact-td sticky-col z-20 font-bold text-slate-900 border-r border-slate-100 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.05)]">
            <div class="truncate max-w-[150px]" title="${g.name}">${g.name}</div>
          </td>
          <td class="compact-td text-center combined-col">
            <div class="font-black text-xs text-indigo-900">${combined !== null ? combined.toFixed(1) : '—'}</div>
            ${combined !== null ? `<div class="percentile-badge ${combCls}">${Math.round(combined)}%</div>` : ''}
          </td>
          <td class="compact-td text-center border-l">
            ${g.thumb ? `<img src="${g.thumb}" class="w-8 h-8 rounded border bg-slate-100 object-cover mx-auto">` : '<div class="w-8 h-8 bg-slate-100 rounded mx-auto"></div>'}
          </td>
        `;

        metricConfig.forEach(f => {
          const val = g[f.id];
          const p = percentileData[f.id] ? percentileData[f.id][g.id] : null;
          const pCls = getPercentileClass(p);
          const displayVal = (val === null || val === 0) ? '—' : (typeof val === 'number' ? val.toLocaleString(undefined, {maximumFractionDigits: 2}) : val);
          
          html += `<td class="compact-td text-center border-l border-slate-50">
            <div class="font-bold text-slate-700 leading-none">${displayVal}</div>
            ${p !== null ? `<div class="percentile-badge ${pCls}">${Math.round(p)}%</div>` : ''}
          </td>`;
        });

        row.innerHTML = html;
        tbody.appendChild(row);
      });
    }

    async function fetchWithRetry(url, maxRetries = 10) {
      for (let attempt = 0; attempt < maxRetries; attempt++) {
        try {
          const res = await fetch(url);
          if (res.status === 202) { await new Promise(r => setTimeout(r, 2000)); continue; }
          if (res.ok) return await res.text();
          await new Promise(r => setTimeout(r, 1000));
        } catch (e) { await new Promise(r => setTimeout(r, 1000 * Math.pow(2, attempt))); }
      }
      throw new Error('Sync failed');
    }

    function updateStatus(msg, pct) {
      document.getElementById('loadingStatus').textContent = msg;
      document.getElementById('progressBar').style.width = pct + '%';
    }

    initSettings();
  </script>

</body>
</html>
