<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>BGG Percentiles</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    :root{
      --bg: #f8fafc;
      --muted: #64748b;
      --card: #ffffff;
      --accent: #6366f1;
      --radius: 6px;
      --compact-font: 11px;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: #0f172a;
      font-size: var(--compact-font);
      -webkit-font-smoothing:antialiased;
    }

    /* Percentile Colors */
    .p-100 { background: #14532d; color: white; }
    .p-90 { background: #166534; color: white; }
    .p-80 { background: #15803d; color: white; }
    .p-70 { background: #16a34a; color: white; }
    .p-60 { background: #22c55e; color: #064e3b; }
    .p-50 { background: #4ade80; color: #064e3b; }
    .p-40 { background: #fef08a; color: #713f12; }
    .p-30 { background: #fde047; color: #713f12; }
    .p-20 { background: #facc15; color: #713f12; }
    .p-10 { background: #f87171; color: white; }
    .p-0 { background: #ef4444; color: white; }

    .percentile-badge {
      font-size: 9px;
      font-weight: 800;
      padding: 2px 4px;
      border-radius: 4px;
      text-transform: none;
      line-height: 1;
      display:inline-block;
      min-width:34px;
      text-align:center;
    }

    /* Responsive View Switching */
    .view-desktop { display: none; }
    @media (min-width: 900px) {
      .view-desktop { display: table; }
      .view-mobile { display: none; }
    }

    /* Ultra Compact Table (Desktop) */
    .table-container {
      max-height: calc(100vh - 140px);
      overflow: auto;
    }
    th, td {
      padding: 6px 8px !important;
      vertical-align: middle;
      border-bottom: 1px solid #e6eef8;
      white-space: nowrap;
    }
    .sticky-col { position: sticky; left: 0; background: var(--card); z-index: 20; }
    .sticky-col-2 { position: sticky; left: 48px; background: var(--card); z-index: 19; border-right: 1px solid #eef2ff; }
    .compact-row { font-weight:700; font-size:11px }
    .metrics-cell { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .metric-badge {
      background:#fbfdff;
      border:1px solid #eef2ff;
      padding:4px 6px;
      border-radius:6px;
      font-size:10px;
      color:var(--muted);
      display:inline-flex;
      gap:6px;
      align-items:center;
    }
    .metric-key { font-weight:800; color:#0f172a; font-size:10px; }

    /* Compact Mobile Card */
    .mobile-card {
      background: var(--card);
      border: 1px solid #eef2ff;
      border-radius: var(--radius);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 1px 2px rgba(8,16,48,0.04);
    }
    .metric-grid {
      display:flex;
      gap:6px;
      overflow:auto;
      padding-bottom:4px;
    }
    .metric-item {
      background: #fbfdff;
      border: 1px solid #eef2ff;
      padding: 6px 8px;
      border-radius: 6px;
      text-align: center;
      min-width:68px;
    }

    .loader {
      border: 2px solid #f3f3f3;
      border-top: 2px solid #6366f1;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-slate-50">

  <header class="sticky top-0 z-40 w-full bg-white border-b px-3 py-1.5 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-2">
      <div class="bg-indigo-600 text-white p-1 rounded">
        <i class="fa-solid fa-percent text-[10px]"></i>
      </div>
      <h1 class="text-[11px] font-black uppercase tracking-tighter leading-none">BGG Percentiles</h1>
    </div>
    
    <div class="flex items-center gap-2">
      <div class="flex items-center bg-slate-100 px-1.5 py-0.5 rounded border border-slate-200">
        <input id="username" type="text" value="sportomax" class="bg-transparent text-[9px] font-bold outline-none w-16 px-1">
        <button onclick="fetchFullData()" class="bg-indigo-600 text-white px-2 py-0.5 rounded text-[8px] font-black ml-1">RUN</button>
      </div>
    </div>
  </header>

  <main class="p-1.5 space-y-2">

    <!-- Loading -->
    <div id="loadingSection" class="hidden bg-white rounded p-3 text-center border">
      <div class="flex justify-center items-center gap-2">
        <div class="loader"></div>
        <span id="loadingStatus" class="text-[9px] font-bold">Initializing...</span>
      </div>
    </div>

    <!-- Interface -->
    <div id="resultsSection" class="hidden space-y-2">
      
      <!-- Quick Config (Horizontal on Mobile, Vertical on Desktop) -->
      <div class="bg-white rounded p-2 border shadow-sm">
        <div class="flex flex-wrap gap-x-3 gap-y-1 items-center">
          <span class="text-[8px] font-black text-slate-400 uppercase border-r pr-2">COMB Config</span>
          <div id="settingsList" class="flex flex-wrap gap-2">
            <!-- Toggles -->
          </div>
          <div class="flex items-center gap-1 border-l pl-2">
            <span class="text-[8px] font-bold text-slate-400">MOD%</span>
            <input id="globalModifier" type="number" value="100" oninput="renderDisplay()" class="w-10 px-1 border rounded text-[9px] font-bold">
          </div>
          <input id="tableSearch" type="text" placeholder="Filter..." oninput="renderDisplay()" class="ml-auto px-2 py-0.5 rounded border text-[9px] w-24 md:w-48">
        </div>
      </div>

      <!-- Scrollable Area -->
      <div id="displayContainer">
        <!-- Desktop Table -->
        <div class="view-desktop table-container bg-white border rounded shadow-sm">
          <table class="w-full text-left border-collapse">
            <thead class="sticky top-0 bg-slate-100 z-30">
              <tr class="text-[9px] font-black uppercase text-slate-500">
                  <th class="sticky-col">Img</th>
                  <th class="sticky-col-2">Game</th>
                  <th class="text-center bg-rose-50 border-x border-rose-200 text-rose-700">COMB</th>
                  <th class="text-left">Metrics</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>

        <!-- Mobile Cards -->
        <div id="cardContainer" class="view-mobile grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = '/api/bgg-helper';
    const BATCH_SIZE = 20;
    let allGames = [];
    let percentileData = {};
    
    const metricConfig = [
      { id: 'year', label: 'Year', order: 'desc', active: true },
      { id: 'time', label: 'Time', order: 'asc', active: true },
      { id: 'age', label: 'Age', order: 'asc', active: true },
      { id: 'usersrated', label: 'Rated', order: 'desc', active: true },
      { id: 'average', label: 'Avg', order: 'desc', active: true },
      { id: 'bayesaverage', label: 'Bayes', order: 'desc', active: true },
      { id: 'rank', label: 'Rank', order: 'asc', active: true, ignoreNull: true },
      { id: 'stddev', label: 'StdD', order: 'asc', active: true },
      { id: 'owned', label: 'Owned', order: 'desc', active: true },
      { id: 'trading', label: 'Trd', order: 'desc', active: true },
      { id: 'wanting', label: 'Wnt', order: 'desc', active: true },
      { id: 'wishing', label: 'Wsh', order: 'desc', active: true },
      { id: 'weight', label: 'Wgt', order: 'asc', active: true }
    ];

    function initSettings() {
      const list = document.getElementById('settingsList');
      list.innerHTML = metricConfig.map(m => `
        <label class="flex items-center gap-1 cursor-pointer">
          <input type="checkbox" ${m.active ? 'checked' : ''} onchange="toggleMetric('${m.id}', this.checked)" class="w-2.5 h-2.5">
          <span class="text-[8px] font-bold text-slate-500 uppercase">${m.label}</span>
        </label>
      `).join('');
    }

    function toggleMetric(id, checked) {
      const m = metricConfig.find(x => x.id === id);
      if (m) m.active = checked;
      renderDisplay();
    }

    async function fetchFullData() {
      const username = document.getElementById('username').value.trim();
      if (!username) return;
      document.getElementById('loadingSection').classList.remove('hidden');
      document.getElementById('resultsSection').classList.add('hidden');

      try {
        const collXml = await fetchWithRetry(`${API_BASE}?endpoint=collection&username=${encodeURIComponent(username)}&stats=1&own=1&version=2`);
        const collDoc = new DOMParser().parseFromString(collXml, 'text/xml');
        const ids = Array.from(collDoc.querySelectorAll('item')).map(it => it.getAttribute('objectid'));
        if (ids.length === 0) throw new Error('None.');

        const results = [];
        for (let i = 0; i < ids.length; i += BATCH_SIZE) {
          const batch = ids.slice(i, i + BATCH_SIZE);
          const thingXml = await fetchWithRetry(`${API_BASE}?endpoint=thing&id=${encodeURIComponent(batch.join(','))}&stats=1`);
          const thingDoc = new DOMParser().parseFromString(thingXml, 'text/xml');
          Array.from(thingDoc.querySelectorAll('item')).forEach(item => {
            const stats = item.querySelector('statistics ratings');
            const rNode = stats?.querySelector('rank[type="subtype"]');
            const rVal = rNode ? rNode.getAttribute('value') : null;
            results.push({
              id: item.getAttribute('id'),
              name: item.querySelector('name[type="primary"]')?.getAttribute('value') || item.querySelector('name')?.textContent,
              thumb: item.querySelector('thumbnail')?.textContent || '',
              year: parseInt(item.querySelector('yearpublished')?.getAttribute('value') || '0'),
              time: parseInt(item.querySelector('playingtime')?.getAttribute('value') || '0'),
              age: parseInt(item.querySelector('minage')?.getAttribute('value') || '0'),
              usersrated: parseInt(stats?.querySelector('usersrated')?.getAttribute('value') || '0'),
              average: parseFloat(stats?.querySelector('average')?.getAttribute('value') || '0'),
              bayesaverage: parseFloat(stats?.querySelector('bayesaverage')?.getAttribute('value') || '0'),
              rank: (rVal && rVal !== 'Not Ranked') ? parseInt(rVal) : null,
              stddev: parseFloat(stats?.querySelector('stddev')?.getAttribute('value') || '0'),
              owned: parseInt(stats?.querySelector('owned')?.getAttribute('value') || '0'),
              trading: parseInt(stats?.querySelector('trading')?.getAttribute('value') || '0'),
              wanting: parseInt(stats?.querySelector('wanting')?.getAttribute('value') || '0'),
              wishing: parseInt(stats?.querySelector('wishing')?.getAttribute('value') || '0'),
              weight: parseFloat(stats?.querySelector('averageweight')?.getAttribute('value') || '0')
            });
          });
          document.getElementById('loadingStatus').textContent = `Sync: ${results.length}/${ids.length}`;
        }
        allGames = results;
        calculatePercentiles();
        document.getElementById('loadingSection').classList.add('hidden');
        document.getElementById('resultsSection').classList.remove('hidden');
        renderDisplay();
      } catch (err) { alert(err.message); document.getElementById('loadingSection').classList.add('hidden'); }
    }

    function calculatePercentiles() {
      percentileData = {};
      metricConfig.forEach(f => {
        let valid = allGames.map(g => ({ id: g.id, val: g[f.id] }));
        if (f.ignoreNull || f.id === 'rank') valid = valid.filter(g => g.val !== null && g.val !== 0);
        valid.sort((a, b) => f.order === 'asc' ? a.val - b.val : b.val - a.val);
        const N = valid.length;
        const ranks = {};
        valid.forEach((g, i) => ranks[g.id] = N > 1 ? (1 - (i / (N - 1))) * 100 : 100);
        percentileData[f.id] = ranks;
      });
    }

    function getPCls(p) {
      if (p === null || p === undefined) return '';
      if (p >= 90) return 'p-100'; if (p >= 80) return 'p-90'; if (p >= 70) return 'p-80';
      if (p >= 60) return 'p-70'; if (p >= 50) return 'p-60'; if (p >= 40) return 'p-50';
      if (p >= 30) return 'p-40'; if (p >= 20) return 'p-30'; if (p >= 10) return 'p-20';
      return 'p-10';
    }

    function renderDisplay() {
      const search = document.getElementById('tableSearch').value.toLowerCase();
      const modifier = parseFloat(document.getElementById('globalModifier').value) / 100 || 1;
      const activeIds = metricConfig.filter(m => m.active).map(m => m.id);
      const filtered = allGames.filter(g => g.name.toLowerCase().includes(search));

      const tBody = document.getElementById('tableBody');
      const cCont = document.getElementById('cardContainer');
      tBody.innerHTML = ''; cCont.innerHTML = '';

      filtered.forEach(g => {
        let sum = 0, count = 0;
        activeIds.forEach(id => {
          const p = percentileData[id] ? percentileData[id][g.id] : null;
          if (p !== null) { sum += p; count++; }
        });
        const combined = count > 0 ? (sum / count) * modifier : null;
        const cPCls = getPCls(combined);

        // Desktop Row (compact) - show thumb, name, combined score, and compact metrics
        const row = document.createElement('tr');
        row.className = 'compact-row';

        // build compact metrics HTML for active metrics
        const metricsHtml = metricConfig.filter(m => m.active).map(f => {
          const v = g[f.id];
          const p = percentileData[f.id] ? percentileData[f.id][g.id] : null;
          const pTxt = p !== null ? Math.round(p) + '%' : '—';
          const valTxt = (v === null || v === undefined) ? '—' : (typeof v === 'number' ? Number.isInteger(v) ? v.toLocaleString() : v.toLocaleString(undefined, {maximumFractionDigits:1}) : v);
          return `<div class="metric-badge" title="${f.label}: ${valTxt} — ${pTxt}"><span class="metric-key">${f.label}</span><span class="percentile-badge ${getPCls(p)}">${pTxt}</span></div>`;
        }).join('');

        row.innerHTML = `
          <td class="sticky-col"><img src="${g.thumb}" class="w-6 h-6 rounded"></td>
          <td class="sticky-col-2 truncate max-w-[240px]">${g.name}</td>
          <td class="text-center bg-rose-50 font-black border-x border-rose-100">${combined ? combined.toFixed(1) : '—'} <div class="percentile-badge ${cPCls}">${combined ? Math.round(combined)+'%' : '—'}</div></td>
          <td class="metrics-cell">${metricsHtml}</td>
        `;
        tBody.appendChild(row);

        // Mobile Card (compact)
        const card = document.createElement('div');
        card.className = 'mobile-card';
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <img src="${g.thumb}" class="w-8 h-8 rounded">
              <div class="font-black text-[12px] truncate max-w-[180px]">${g.name}</div>
            </div>
            <div class="text-right">
              <div class="text-[12px] font-black text-rose-600">${combined ? combined.toFixed(1) : '—'}</div>
              <div class="percentile-badge ${cPCls}">${combined ? Math.round(combined)+'% COMB' : '—'}</div>
            </div>
          </div>
          <div class="metric-grid">${metricsHtml}</div>
        `;
        cCont.appendChild(card);
      });
    }

    async function fetchWithRetry(url, r = 5) {
      for (let i = 0; i < r; i++) {
        try {
          const res = await fetch(url);
          if (res.status === 202) { await new Promise(ok => setTimeout(ok, 2000)); continue; }
          if (res.ok) return await res.text();
          await new Promise(ok => setTimeout(ok, 1000));
        } catch (e) { await new Promise(ok => setTimeout(ok, 1000)); }
      }
      throw new Error('!');
    }

    initSettings();
  </script>
</body>
</html>
