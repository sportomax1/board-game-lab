<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meeple Matrix</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef2ff;font:14px system-ui}.w{max-width:1400px;margin:auto;padding:16px}.p{background:#121a2e;border:1px solid #293552;border-radius:14px;padding:14px;margin:12px 0}h1{margin:0}small,.muted{color:#9aa7c2}input,select,textarea,button{font:inherit}input,select,textarea{background:#0e1629;color:#eef2ff;border:1px solid #293552;border-radius:8px;padding:9px}button{border:0;border-radius:8px;padding:10px 14px;background:#f5b942;font-weight:700;cursor:pointer}.load,.cfg{display:grid;gap:8px}.load{grid-template-columns:1fr auto}.cfg{grid-template-columns:1fr 1fr}.axis{background:#18223a;padding:10px;border-radius:10px}.axis>div{display:flex;gap:6px;flex-wrap:wrap}.axis textarea{width:100%;margin-top:7px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#18223a;padding:7px 9px;border-radius:999px}.matrix{overflow:auto}.matrix table{border-collapse:collapse;width:100%;min-width:600px}.matrix th,.matrix td{border:1px solid #293552;padding:8px;text-align:center}.matrix th{background:#18223a;position:sticky;top:0}.cell{width:100%;min-height:38px;color:#eef2ff;background:rgba(245,185,66,var(--h));font-weight:800}.cell:disabled{opacity:.35;cursor:default}.total{font-weight:800;background:#1c2945}dialog{width:min(900px,94vw);max-height:85vh;background:#121a2e;color:#eef2ff;border:1px solid #293552;border-radius:14px}.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.game{background:#18223a;padding:8px;border-radius:9px;cursor:pointer}.game img{width:100%;aspect-ratio:1;object-fit:contain;background:white;border-radius:6px}.ver{font-size:11px;background:#293552;border-radius:999px;padding:3px 7px}.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}@media(max-width:650px){.cfg,.load{grid-template-columns:1fr}.w{padding:10px}}</style></head><body><main class="w"><div style="display:flex;align-items:center;gap:8px"><h1>♟ Meeple Matrix</h1><span class="ver">v1.1</span></div><div class="muted">BoardGameGeek collection cross-tab analyzer · corrected Collection Hub field mappings · IndexedDB cache</div><section class="p"><div class="load"><input id="user" value="sportomax" aria-label="BGG username"><button id="load">Load Collection</button></div><div id="msg" class="muted">Default username: sportomax</div></section><section class="p"><b>Collection statuses</b><div id="statuses" class="chips"></div><div class="tools"><button id="allStatus" type="button">All</button><button id="noStatus" type="button">None</button><label class="chip"><input id="na" type="checkbox"> Include N/A</label></div></section><section class="p cfg"><div class="axis"><b>Rows</b><div><select id="rf"></select><select id="rm"><option value="auto">Auto bands</option><option value="step">Fixed width</option><option value="custom">Custom bands</option></select><input id="rs" type="number" min=".1" step=".1" value=".5" style="width:80px"></div><textarea id="rb" placeholder="Custom boundaries: 1,1.5,2,2.5,3,3.5,4,4.5,5"></textarea></div><div class="axis"><b>Columns</b><div><select id="cf"></select><select id="cm"><option value="auto">Auto bands</option><option value="step">Fixed width</option><option value="custom">Custom bands</option></select><input id="cs" type="number" min=".1" step=".1" value="1" style="width:80px"></div><textarea id="cb" placeholder="Custom boundaries: 0,5,6,7,8,9,10"></textarea></div></section><section class="p"><button id="build">Build Matrix</button> <button id="swap">Swap Axes</button> <span id="summary" class="muted"></span></section><section class="p matrix" id="matrix">Load a collection to begin.</section></main><dialog id="dlg"><div style="display:flex;justify-content:space-between;gap:8px"><div><b id="dt"></b><div id="ds" class="muted"></div></div><button id="close">Close</button></div><hr><div id="games" class="games"></div></dialog><script>(()=>{const $=x=>document.querySelector(x);const F={myrating:'My Rating',average:'BGG Average',bayes:'Bayes Average',weight:'BGG Weight',year:'Year Published',rank:'BGG Rank',numplays:'Number of Plays',minplayers:'Min Players',maxplayers:'Max Players',playingtime:'Playing Time',numratings:'Number Ratings',numowned:'Number Owned'};const S={own:'Owned',prevowned:'Previously Owned',fortrade:'For Trade',want:'Want',wanttoplay:'Want to Play',wanttobuy:'Want to Buy',wishlist:'Wishlist',preordered:'Preordered'};let G=[];for(const[k,v]of Object.entries(F))for(const id of['rf','cf'])$('#'+id).add(new Option(v,k));$('#rf').value='weight';$('#cf').value='myrating';for(const[k,v]of Object.entries(S))$('#statuses').insertAdjacentHTML('beforeend',`<label class="chip"><input type="checkbox" data-s="${k}" ${k==='own'?'checked':''}> ${v}</label>`);const num=v=>{if(v==null||v===''||String(v).toUpperCase()==='N/A')return null;const x=parseFloat(v);return Number.isFinite(x)?x:null};const pos=v=>{const x=num(v);return x!==null&&x>0?x:null};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function parse(xml){const d=new DOMParser().parseFromString(xml,'text/xml');return[...d.querySelectorAll('item')].map(i=>{const st=i.querySelector(':scope > status')||i.querySelector('status');const z=i.querySelector(':scope > stats')||i.querySelector('stats');const r=z?.querySelector(':scope > rating')||z?.querySelector('rating');const ranks=r?.querySelector(':scope > ranks')||r?.querySelector('ranks');const boardRank=[...(ranks?.querySelectorAll(':scope > rank')||[])].find(x=>x.getAttribute('name')==='boardgame');const ratingRaw=r?.getAttribute('value');return{id:i.getAttribute('objectid')||i.getAttribute('id')||'',name:i.querySelector(':scope > name')?.textContent?.trim()||i.querySelector('name')?.textContent?.trim()||'Untitled',year:pos(i.querySelector(':scope > yearpublished')?.textContent),image:i.querySelector(':scope > thumbnail')?.textContent?.trim()||'',numplays:num(i.querySelector(':scope > numplays')?.textContent)??0,minplayers:pos(z?.getAttribute('minplayers')),maxplayers:pos(z?.getAttribute('maxplayers')),playingtime:pos(z?.getAttribute('playingtime')),myrating:ratingRaw&&String(ratingRaw).toUpperCase()!=='N/A'?num(ratingRaw):null,average:pos(r?.querySelector(':scope > average')?.getAttribute('value')),bayes:pos(r?.querySelector(':scope > bayesaverage')?.getAttribute('value')),weight:pos(r?.querySelector(':scope > averageweight')?.getAttribute('value')),numratings:pos(r?.querySelector(':scope > usersrated')?.getAttribute('value')),numowned:pos(z?.getAttribute('numowned')),rank:pos(boardRank?.getAttribute('value')),...Object.fromEntries(Object.keys(S).map(k=>[k,st?.getAttribute(k)==='1']))}}).filter(g=>g.id&&g.name)}const DB='meeple-matrix-v2',STORE='collections';function db(){return new Promise((ok,no)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(STORE))q.result.createObjectStore(STORE,{keyPath:'username'})};q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}async function getCache(u){try{const d=await db();return await new Promise((ok,no)=>{const q=d.transaction(STORE).objectStore(STORE).get(u.toLowerCase());q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}catch{return null}}async function putCache(u,g){try{const d=await db();await new Promise((ok,no)=>{const q=d.transaction(STORE,'readwrite').objectStore(STORE).put({username:u.toLowerCase(),savedAt:Date.now(),games:g,parserVersion:2});q.onsuccess=()=>ok();q.onerror=()=>no(q.error)})}catch{}}async function load(){const u=$('#user').value.trim();if(!u)return;$('#load').disabled=true;$('#msg').textContent='Loading through Board Game Lab BGG proxy…';try{const url='/api/bgg-helper?endpoint=collection&username='+encodeURIComponent(u)+'&stats=1&subtype=boardgame';const r=await fetch(url,{headers:{Accept:'text/xml'}});const text=await r.text();if(!r.ok){let detail='HTTP '+r.status;try{detail=JSON.parse(text).message||detail}catch{}throw Error(detail)}G=parse(text);if(!G.length)throw Error('No games returned');await putCache(u,G);const rated=G.filter(x=>x.myrating!==null).length,weighted=G.filter(x=>x.weight!==null).length;$('#msg').textContent=`Loaded ${G.length} items · ${rated} personally rated · ${weighted} with BGG weight · saved in IndexedDB`;build()}catch(e){const c=await getCache(u);if(c?.games?.length){G=c.games;$('#msg').textContent=`Live load failed (${e.message}) · using corrected v1.1 cache (${G.length} items) from ${new Date(c.savedAt).toLocaleString()}`;build()}else $('#msg').textContent='Load failed: '+e.message}finally{$('#load').disabled=false}}function selected(){const a=[...document.querySelectorAll('[data-s]:checked')].map(x=>x.dataset.s);return a.length?G.filter(g=>a.some(s=>g[s])):[]}function bounds(v,m,s,c){v=v.filter(Number.isFinite);if(!v.length)return[];let lo=Math.min(...v),hi=Math.max(...v);if(m==='custom'){const b=[...new Set(c.split(/[,;\n]+/).map(Number).filter(Number.isFinite))].sort((a,b)=>a-b);return b.length>1?b:[lo,hi]}if(m==='auto'){const d=hi-lo;s=d<=5?.5:d<=12?1:d<=100?10:d<=1000?100:1000}s=Math.max(.01,+s||1);const a=Math.floor(lo/s)*s,z=Math.ceil(hi/s)*s;if(a===z)return[a,a+s];const b=[];for(let x=a;b.length<60&&x<=z+.001;x+=s)b.push(+x.toFixed(4));if(b.at(-1)<=hi)b.push(+(b.at(-1)+s).toFixed(4));return b}function bins(b){return b.slice(0,-1).map((x,i)=>({lo:x,hi:b[i+1],label:`${x}–${b[i+1]}`}))}function bi(v,b){if(v==null)return b.findIndex(x=>x.label==='N/A');return b.findIndex((x,i)=>x.lo!==undefined&&v>=x.lo&&(i===b.length-1?v<=x.hi:v<x.hi))}function build(){const g=selected(),rf=$('#rf').value,cf=$('#cf').value;let R=bins(bounds(g.map(x=>x[rf]),$('#rm').value,$('#rs').value,$('#rb').value)),C=bins(bounds(g.map(x=>x[cf]),$('#cm').value,$('#cs').value,$('#cb').value));if($('#na').checked){R.push({label:'N/A'});C.push({label:'N/A'})}if(!g.length){$('#matrix').innerHTML='<div class="muted">No games match the selected collection statuses.</div>';$('#summary').textContent='0 games';return}if(!R.length||!C.length){$('#matrix').innerHTML='<div class="muted">No numeric data available for one or both selected fields. Try Include N/A or another field.</div>';return}const M=R.map(()=>C.map(()=>[]));for(const x of g){const r=bi(x[rf],R),c=bi(x[cf],C);if(r>=0&&c>=0)M[r][c].push(x)}const mx=Math.max(1,...M.flat().map(x=>x.length));let h=`<table><tr><th>${esc(F[rf])} ↓ / ${esc(F[cf])} →</th>${C.map(x=>`<th>${esc(x.label)}</th>`).join('')}<th>Total</th></tr>`;R.forEach((r,ri)=>{h+=`<tr><th>${esc(r.label)}</th>`;C.forEach((c,ci)=>{const q=M[ri][ci].length;h+=`<td><button class="cell" ${q?'':'disabled'} style="--h:${.04+q/mx*.65}" data-r="${ri}" data-c="${ci}">${q}</button></td>`});h+=`<td class="total">${M[ri].reduce((a,x)=>a+x.length,0)}</td></tr>`});h+=`<tr><th>Total</th>${C.map((_,ci)=>`<td class="total">${M.reduce((a,r)=>a+r[ci].length,0)}</td>`).join('')}<td class="total">${M.flat().reduce((a,x)=>a+x.length,0)}</td></tr></table>`;$('#matrix').innerHTML=h;const included=M.flat().reduce((a,x)=>a+x.length,0);$('#summary').textContent=`${g.length} selected · ${included} plotted · ${M.flat().filter(x=>x.length).length} occupied cells`;$('#matrix').querySelectorAll('.cell:not(:disabled)').forEach(b=>b.onclick=()=>{const r=+b.dataset.r,c=+b.dataset.c,L=M[r][c];$('#dt').textContent=R[r].label+' × '+C[c].label;$('#ds').textContent=L.length+' games · '+F[rf]+' × '+F[cf];$('#games').innerHTML=L.map(x=>`<div class="game" onclick="window.open('https://boardgamegeek.com/boardgame/${encodeURIComponent(x.id)}','_blank','noopener')">${x.image?`<img src="${esc(x.image)}" loading="lazy" alt="">`:''}<b>${esc(x.name)}</b><small>${esc(F[rf])}: ${x[rf]??'N/A'}<br>${esc(F[cf])}: ${x[cf]??'N/A'}</small></div>`).join('');$('#dlg').showModal()})}$('#load').onclick=load;$('#build').onclick=build;$('#swap').onclick=()=>{const x=$('#rf').value;$('#rf').value=$('#cf').value;$('#cf').value=x;build()};$('#close').onclick=()=>$('#dlg').close();$('#user').onkeydown=e=>{if(e.key==='Enter')load()};$('#allStatus').onclick=()=>{document.querySelectorAll('[data-s]').forEach(x=>x.checked=true);if(G.length)build()};$('#noStatus').onclick=()=>{document.querySelectorAll('[data-s]').forEach(x=>x.checked=false);if(G.length)build()};document.querySelectorAll('[data-s],#na,#rf,#cf,#rm,#cm,#rs,#cs,#rb,#cb').forEach(x=>x.addEventListener('change',()=>{if(G.length)build()}));})();</script></body></html>
