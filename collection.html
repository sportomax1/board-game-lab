<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Board Game Collection</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>📚</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1rem;
            padding-top: env(safe-area-inset-top, 0);
            padding-bottom: env(safe-area-inset-bottom, 0);
            padding-left: max(1rem, env(safe-area-inset-left, 0));
            padding-right: max(1rem, env(safe-area-inset-right, 0));
        }

        .header {
            padding: 1.5rem 0;
            border-bottom: 1px solid #eee;
            background: white;
            margin-bottom: 1.5rem;
        }

        .header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2rem;
            font-weight: 700;
            color: #333;
        }

        .header p {
            margin: 0;
            color: #666;
            font-size: 0.95rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            background: white;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .control-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-group input,
        .control-group select {
            padding: 0.5rem 0.75rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.95rem;
            min-width: 150px;
            -webkit-appearance: none;
            appearance: none;
        }

        .control-group input:focus,
        .control-group select:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn {
            padding: 0.5rem 1rem;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            -webkit-appearance: none;
            appearance: none;
            transition: all 0.2s;
            align-self: flex-end;
        }

        .btn:hover {
            background: #4f46e5;
        }

        .btn:active {
            opacity: 0.9;
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        .status {
            padding: 1rem;
            text-align: center;
            font-weight: 600;
            background: white;
            border-radius: 8px;
            border: 1px solid #eee;
            margin-bottom: 1.5rem;
        }

        .status.loading {
            color: #666;
        }

        .status.success {
            background: #d1fae5;
            color: #065f46;
            border-color: #6ee7b7;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
            border-color: #fecaca;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .game-card {
            background: white;
            border-radius: 12px;
            border: 1px solid #eee;
            overflow: hidden;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            transform: translateY(-4px);
            border-color: #d1d5db;
        }

        .game-card-image {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background: #f0f0f0;
        }

        .game-card-content {
            padding: 1rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .game-card-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0 0 0.5rem 0;
            color: #333;
            line-height: 1.3;
        }

        .game-card-year {
            font-size: 0.85rem;
            color: #999;
            margin-bottom: 0.75rem;
        }

        .game-card-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            font-size: 0.8rem;
        }

        .info-row {
            display: flex;
            gap: 0.3rem;
        }

        .info-label {
            font-weight: 600;
            color: #666;
        }

        .info-value {
            color: #333;
        }

        .game-card-rating {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }

        .rating-stars {
            color: #f59e0b;
            font-size: 1.1rem;
        }

        .game-card-description {
            font-size: 0.8rem;
            color: #666;
            line-height: 1.4;
            margin-bottom: 0.75rem;
            flex: 1;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .game-card-categories,
        .game-card-mechanics {
            margin-bottom: 0.5rem;
        }

        .tag {
            display: inline-block;
            background: #f3f4f6;
            color: #333;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            margin-right: 0.3rem;
            margin-bottom: 0.3rem;
        }

        .tag.category {
            background: #fef3c7;
            color: #92400e;
        }

        .tag.mechanic {
            background: #dbeafe;
            color: #0c4a6e;
        }

        .tag.designer {
            background: #dcfce7;
            color: #166534;
        }

        .tag.kog {
            background: #fecaca;
            color: #991b1b;
            font-weight: 600;
        }

        .tag.dog {
            background: #c7d2fe;
            color: #312e81;
            font-weight: 600;
        }

        .tag.status {
            background: #e0e7ff;
            color: #3730a3;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #999;
        }

        .empty-state p {
            margin: 0;
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            .game-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                gap: 1rem;
            }

            .controls {
                flex-direction: column;
            }

            .control-group input,
            .control-group select {
                min-width: auto;
                width: 100%;
            }

            .header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Board Game Collection</h1>
            <p id="collectionInfo"></p>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="usernameInput">Username</label>
                <input type="text" id="usernameInput" placeholder="sportomax" value="sportomax">
            </div>

            <div class="control-group">
                <label for="searchInput">Search Games</label>
                <input type="text" id="searchInput" placeholder="Search by name...">
            </div>

            <div class="control-group">
                <label for="sortSelect">Sort By</label>
                <select id="sortSelect">
                    <option value="name-asc">Name (A-Z)</option>
                    <option value="name-desc">Name (Z-A)</option>
                    <option value="year-desc">Year (Newest)</option>
                    <option value="year-asc">Year (Oldest)</option>
                    <option value="rating-desc">Rating (Highest)</option>
                    <option value="rating-asc">Rating (Lowest)</option>
                    <option value="players-asc">Players (Min)</option>
                    <option value="time-asc">Play Time (Shortest)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="categoryFilter">Category</label>
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                </select>
            </div>

            <div class="control-group">
                <label for="mechanicFilter">Mechanic</label>
                <select id="mechanicFilter">
                    <option value="">All Mechanics</option>
                </select>
            </div>

            <button class="btn" id="loadBtn">🔄 Load Collection</button>
            <button class="btn btn-secondary" id="clearFiltersBtn">Clear Filters</button>
        </div>

        <div class="status" id="status"></div>

        <div class="game-grid" id="gameGrid">
            <div class="empty-state">
                <p>Click "Load Collection" to fetch your games</p>
            </div>
        </div>
    </div>

    <script>
        // Get DOM elements
        const usernameInput = document.getElementById('usernameInput');
        const loadBtn = document.getElementById('loadBtn');
        const status = document.getElementById('status');
        const collectionInfo = document.getElementById('collectionInfo');
        const gameGrid = document.getElementById('gameGrid');
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');
        const categoryFilter = document.getElementById('categoryFilter');
        const mechanicFilter = document.getElementById('mechanicFilter');
        const clearFiltersBtn = document.getElementById('clearFiltersBtn');

        let allGames = [];
        let filteredGames = [];

        // Fetch with retry for rate limit handling
        async function fetchWithRetry(url, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url);
                    
                    // BGG is busy - wait longer
                    if (response.status === 202) {
                        const waitTime = 3000 * (i + 1);
                        console.log(`BGG busy (202), waiting ${waitTime}ms before retry ${i + 1}...`);
                        await new Promise(r => setTimeout(r, waitTime));
                        continue;
                    }
                    
                    // Too many requests - significant backoff
                    if (response.status === 429) {
                        const waitTime = 5000 * (i + 1);
                        console.log(`Rate limited (429), waiting ${waitTime}ms before retry ${i + 1}...`);
                        await new Promise(r => setTimeout(r, waitTime));
                        continue;
                    }
                    
                    // Bad gateway from helper - BGG API error
                    if (response.status === 502) {
                        const waitTime = 4000 * (i + 1);
                        console.log(`Helper returned 502 (BGG API error), waiting ${waitTime}ms before retry ${i + 1}...`);
                        await new Promise(r => setTimeout(r, waitTime));
                        continue;
                    }
                    
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response;
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    const waitTime = 2000 * (i + 1);
                    console.log(`Error on attempt ${i + 1}, waiting ${waitTime}ms...`, error.message);
                    await new Promise(r => setTimeout(r, waitTime));
                }
            }
        }

        // Load collection using Collection API v2 with stats=1
        loadBtn.addEventListener('click', async () => {
            const username = usernameInput.value.trim();
            if (!username) {
                showStatus('❌ Please enter a username', 'error');
                return;
            }

            allGames = [];
            filteredGames = [];
            showStatus('📦 Loading collection...', 'loading');

            try {
                // Fetch collection using v2 API with stats=1
                const collResponse = await fetchWithRetry(
                    `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1`
                );
                const collXml = new DOMParser().parseFromString(await collResponse.text(), 'text/xml');
                const items = Array.from(collXml.querySelectorAll('item'));

                console.log(`📦 Found ${items.length} items in collection`);
                showStatus(`📥 Processing ${items.length} games...`, 'loading');

                // Parse games directly from collection API response
                items.forEach(item => {
                    const gameId = item.getAttribute('objectid');
                    const name = item.querySelector('name')?.textContent || 'Unknown';
                    const thumbnail = item.querySelector('thumbnail')?.textContent || '';
                    const image = item.querySelector('image')?.textContent || thumbnail;
                    const yearPublished = parseInt(item.querySelector('yearpublished')?.textContent) || 0;

                    // Extract stats from collection API v2
                    const rating = item.querySelector('stats rating');
                    const myRating = parseFloat(rating?.getAttribute('value') || 0);
                    const average = parseFloat(rating?.querySelector('average')?.getAttribute('value') || 0);
                    const bayesaverage = parseFloat(rating?.querySelector('bayesaverage')?.getAttribute('value') || 0);
                    const usersRated = parseInt(rating?.querySelector('usersrated')?.getAttribute('value') || 0);

                    // Extract collection tags/statuses
                    const collectionTags = [];
                    
                    // Check for collection tags (dog, kog, etc.)
                    const statusElem = item.querySelector('status');
                    if (statusElem?.getAttribute('lastplayed')) {
                        collectionTags.push('⏰ Played');
                    }
                    if (statusElem?.getAttribute('lasttraded')) {
                        collectionTags.push('🔄 Traded');
                    }

                    // Check for wish/want list status
                    if (statusElem?.getAttribute('fortrade') === '1') {
                        collectionTags.push('💰 For Trade');
                    }
                    if (statusElem?.getAttribute('want') === '1') {
                        collectionTags.push('🎯 Want');
                    }
                    if (statusElem?.getAttribute('wanttoplay') === '1') {
                        collectionTags.push('🎮 Want to Play');
                    }
                    if (statusElem?.getAttribute('preordered') === '1') {
                        collectionTags.push('📦 Pre-ordered');
                    }

                    const game = {
                        id: gameId,
                        name: name,
                        image: image,
                        thumbnail: thumbnail,
                        yearPublished: yearPublished,
                        stats: {
                            average: average,
                            bayesaverage: bayesaverage,
                            myRating: myRating,
                            usersRated: usersRated
                        },
                        collectionTags: collectionTags
                    };

                    allGames.push(game);
                });

                filteredGames = [...allGames];
                populateFilters();
                renderGames();
                showStatus(`✅ Loaded ${allGames.length} games!`, 'success');
                collectionInfo.textContent = `${allGames.length} games in collection`;

            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, 'error');
                console.error('Error:', error);
            }
        });

        // Populate filter dropdowns (collection API v2 doesn't provide categories/mechanics)
        function populateFilters() {
            // Filters disabled for collection API v2
        }

        // Apply filters and sorting
        function applyFiltersAndSort() {
            filteredGames = allGames.filter(game => {
                const searchTerm = searchInput.value.toLowerCase();
                const nameMatch = game.name.toLowerCase().includes(searchTerm);
                return nameMatch;
            });

            // Sort
            const [sortField, sortDir] = sortSelect.value.split('-');
            filteredGames.sort((a, b) => {
                let aVal, bVal;
                switch (sortField) {
                    case 'name':
                        aVal = a.name.toLowerCase();
                        bVal = b.name.toLowerCase();
                        break;
                    case 'year':
                        aVal = a.yearPublished;
                        bVal = b.yearPublished;
                        break;
                    case 'rating':
                        aVal = a.stats.average;
                        bVal = b.stats.average;
                        break;
                    case 'players':
                        aVal = 0; // Not available in collection API
                        bVal = 0;
                        break;
                    case 'time':
                        aVal = 0; // Not available in collection API
                        bVal = 0;
                        break;
                    default:
                        return 0;
                }

                if (aVal < bVal) return sortDir === 'asc' ? -1 : 1;
                if (aVal > bVal) return sortDir === 'asc' ? 1 : -1;
                return 0;
            });

            renderGames();
        }

        // Render games
        function renderGames() {
            if (filteredGames.length === 0) {
                gameGrid.innerHTML = '<div class="empty-state"><p>No games found</p></div>';
                return;
            }

            gameGrid.innerHTML = filteredGames.map(game => `
                <div class="game-card">
                    <img src="${game.image || game.thumbnail || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 300%22%3E%3Crect fill=%22%23f0f0f0%22 width=%22200%22 height=%22300%22/%3E%3C/svg%3E'}" 
                         alt="${escapeHtml(game.name)}" class="game-card-image" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 300%22%3E%3Crect fill=%22%23f0f0f0%22 width=%22200%22 height=%22300%22/%3E%3C/svg%3E'">
                    <div class="game-card-content">
                        <h3 class="game-card-title">${escapeHtml(game.name)}</h3>
                        <div class="game-card-year">${game.yearPublished || 'N/A'}</div>

                        ${game.stats.average ? `
                        <div class="game-card-rating">
                            <span class="rating-stars">${getRatingStars(game.stats.average)}</span>
                            <span>${game.stats.average.toFixed(1)}/10 (${game.stats.usersRated} ratings)</span>
                        </div>
                        ` : ''}

                        ${game.stats.myRating > 0 ? `
                        <div class="game-card-rating" style="color: #9333ea;">
                            <span style="font-weight: 600;">Your Rating:</span>
                            <span>${game.stats.myRating}/10</span>
                        </div>
                        ` : ''}

                        ${game.collectionTags.length > 0 ? `
                        <div class="game-card-categories" style="margin-top: 0.5rem;">
                            ${game.collectionTags.map(tag => `<span class="tag status">${tag}</span>`).join('')}
                        </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        // Event listeners
        searchInput.addEventListener('input', applyFiltersAndSort);
        sortSelect.addEventListener('change', applyFiltersAndSort);

        clearFiltersBtn.addEventListener('click', () => {
            searchInput.value = '';
            sortSelect.value = 'name-asc';
            applyFiltersAndSort();
        });

        // Utilities
        function showStatus(message, type) {
            status.textContent = message;
            status.className = `status ${type}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getRatingStars(rating) {
            const stars = Math.round(rating / 2);
            return '★'.repeat(stars) + '☆'.repeat(5 - stars);
        }

        // Load default on startup
        window.addEventListener('load', () => {
            usernameInput.focus();
        });
    </script>
</body>
</html>
