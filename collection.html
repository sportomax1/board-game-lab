<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>BGG Collection</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    .game-card { transition: all 0.2s ease; }
    .game-card:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
    .skeleton { animation: pulse 2s cubic-bezier(0.4,0,0.6,1) infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    .tag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
    .tag-category { background: #dbeafe; color: #1e40af; }
    .tag-mechanic { background: #fce7f3; color: #831843; }
  </style>
</head>
<body class="pb-20">

  <header class="sticky top-0 z-30 w-full bg-white/80 backdrop-blur-md border-b px-4 py-3 shadow-sm">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 text-white p-2 rounded-lg"><i class="fa-solid fa-book"></i></div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">Collection</h1>
          <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Full Details</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <div class="relative">
          <button id="statusBtnHeader" onclick="toggleStatusPanel()" class="bg-slate-100 hover:bg-slate-200 text-slate-800 px-3 py-2 rounded-lg text-sm font-bold transition"><i class="fa-solid fa-tag"></i> Status</button>
          <div id="statusPanel" class="hidden absolute right-0 mt-2 w-64 bg-white border border-slate-200 rounded shadow p-3 text-sm">
            <div class="grid grid-cols-1 gap-2">
              <label><input id="cb_own" type="checkbox" onchange="updateStatusFilter('own', this.checked)"> Own <span id="count_own" class="text-xs text-slate-500 ml-2">(0)</span></label>
              <label><input id="cb_prevowned" type="checkbox" onchange="updateStatusFilter('prevowned', this.checked)"> Prev Owned <span id="count_prevowned" class="text-xs text-slate-500 ml-2">(0)</span></label>
              <label><input id="cb_fortrade" type="checkbox" onchange="updateStatusFilter('fortrade', this.checked)"> For Trade <span id="count_fortrade" class="text-xs text-slate-500 ml-2">(0)</span></label>
              <label><input id="cb_want" type="checkbox" onchange="updateStatusFilter('want', this.checked)"> Want <span id="count_want" class="text-xs text-slate-500 ml-2">(0)</span></label>
              <label><input id="cb_wanttoplay" type="checkbox" onchange="updateStatusFilter('wanttoplay', this.checked)"> Want to Play <span id="count_wanttoplay" class="text-xs text-slate-500 ml-2">(0)</span></label>
              <label><input id="cb_wanttobuy" type="checkbox" onchange="updateStatusFilter('wanttobuy', this.checked)"> Want to Buy <span id="count_wanttobuy" class="text-xs text-slate-500 ml-2">(0)</span></label>
              <label><input id="cb_wishlist" type="checkbox" onchange="updateStatusFilter('wishlist', this.checked)"> Wishlist <span id="count_wishlist" class="text-xs text-slate-500 ml-2">(0)</span></label>
              <label><input id="cb_preordered" type="checkbox" onchange="updateStatusFilter('preordered', this.checked)"> Preordered <span id="count_preordered" class="text-xs text-slate-500 ml-2">(0)</span></label>
            </div>
            <div class="mt-3 flex gap-2">
              <button onclick="clearStatusFilters()" class="flex-1 bg-slate-200 hover:bg-slate-300 px-2 py-1 rounded">Clear</button>
            </div>
          </div>
        </div>

        <!-- Moved Search/Sort/Filter into header -->
        <div class="hidden sm:flex items-center gap-2">
          <input id="searchInput" type="text" placeholder="Search..." oninput="filterGames()" class="px-3 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none text-sm w-56">
          <select id="sortSelect" onchange="sortGames()" class="px-3 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none text-sm bg-white font-bold">
            <option value="name">Name</option>
            <option value="rating">BGG Rating</option>
            <option value="year">Year</option>
            <option value="weight">Complexity</option>
            <option value="playingtime">Playing Time</option>
          </select>
          <button id="sortDirBtn" onclick="toggleSortDir()" class="px-2 py-2 rounded border border-slate-200 bg-white text-sm">▼</button>
          <button onclick="showFilterPanel()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-lg text-sm font-bold transition"><i class="fa-solid fa-filter"></i> Filter</button>
        </div>

        <div id="statsBox" class="text-right hidden">
          <div class="text-2xl font-bold text-indigo-600" id="gameCount">0</div>
          <div class="text-[10px] text-slate-500 uppercase font-bold">Games</div>
        </div>
      </div>
      
      <!-- Header-level filter panel (moved here) -->
      <div id="filterPanel" class="hidden absolute right-4 top-16 w-72 bg-white border border-slate-200 rounded shadow p-3 text-sm z-40">
        <div class="flex items-center justify-between mb-2">
          <span class="font-bold text-sm">Filters (AND/OR Logic)</span>
          <button onclick="addFilter()" class="text-xs bg-indigo-100 text-indigo-700 px-2 py-1 rounded font-bold hover:bg-indigo-200">+ Add Filter</button>
        </div>
        <div id="filtersList" class="space-y-2 max-h-60 overflow-y-auto"></div>
        <div class="mt-2 flex gap-2 text-xs">
          <select id="logicSelect" class="flex-1 px-2 py-1 rounded border border-slate-200 bg-white font-bold">
            <option value="and">AND (all filters match)</option>
            <option value="or">OR (any filter matches)</option>
          </select>
          <button onclick="applyFilters()" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded font-bold">Apply</button>
        </div>
        <div class="mt-2 text-right">
          <button onclick="clearFilters()" class="text-xs bg-slate-200 px-2 py-1 rounded">Clear</button>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 space-y-4">

    <!-- Fetch Section -->
    <div id="fetchSection" class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
      <h2 class="text-lg font-bold mb-3">Load Collection</h2>
      <div class="flex gap-2">
        <input id="username" type="text" value="sportomax" placeholder="BGG username" class="flex-1 px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
        <button onclick="fetchCollection()" id="fetchBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg font-bold transition">Load</button>
      </div>
    </div>

    <!-- Loading Section -->
    <div id="loadingSection" class="hidden">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
        <div class="flex items-center justify-center gap-3 mb-3">
          <i class="fa-solid fa-circle-notch fa-spin text-indigo-600 text-2xl"></i>
          <span class="font-bold text-slate-700" id="loadingStatus">Loading collection...</span>
        </div>
        <div class="bg-slate-100 rounded-full h-2 overflow-hidden">
          <div id="progressBar" class="bg-indigo-600 h-full transition-all duration-300" style="width:0%"></div>
        </div>
      </div>
    </div>

    <!-- Controls (moved to header) -->
    <div id="controlsSection" class="hidden"></div>

    <!-- Games Grid -->
    <div id="gamesSection" class="hidden flex flex-col gap-2"></div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-12">
      <i class="fa-solid fa-inbox text-slate-300 text-5xl mb-4 block"></i>
      <p class="text-slate-500 font-semibold">No games found</p>
    </div>

  </main>

  <!-- Game Details Modal -->
  <div id="detailsModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/60">
    <div class="bg-white rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto m-4 shadow-2xl flex flex-col">
      <div class="sticky top-0 bg-indigo-600 text-white p-4 flex justify-between items-center flex-shrink-0">
        <h2 class="font-bold" id="modalTitle">Game Details</h2>
        <button onclick="closeModal()" class="text-2xl hover:opacity-80">✕</button>
      </div>
      <div id="modalContent" class="p-4 space-y-3 overflow-y-auto">
        <div class="text-slate-500 text-center py-8">Loading...</div>
      </div>
    </div>
  </div>

<script>
const API_BASE = '/api/bgg-helper';
let allGames = [];
let displayedGames = [];
let filters = [];
let filterLogic = 'and';
let statusFilters = [];
let tagFilters = { categories: new Set(), mechanics: new Set() };
let sortAsc = false; // default sort direction (false = desc)

async function fetchCollection() {
  const username = document.getElementById('username').value.trim() || 'sportomax';
  document.getElementById('fetchBtn').disabled = true;
  document.getElementById('fetchSection').classList.add('hidden');
  document.getElementById('loadingSection').classList.remove('hidden');

  try {
    // Step 1: Fetch collection
    updateLoadingStatus('Fetching collection...');
    updateProgress(0);
    const collXml = await fetchWithRetry(`${API_BASE}?endpoint=collection&username=${encodeURIComponent(username)}`);
    const collDoc = new DOMParser().parseFromString(collXml, 'text/xml');
    const collItems = Array.from(collDoc.querySelectorAll('item'));
    
    if (collItems.length === 0) {
      updateLoadingStatus('No games found');
      return;
    }

    // Build a quick map of collection status flags so we can merge them into thing results
    const collectionMap = {};
    collItems.forEach(it => {
      const oid = it.getAttribute('objectid') || it.getAttribute('id');
      if (!oid) return;
      const statusNode = it.querySelector('status');
      const getFlag = (name) => {
        const a = it.getAttribute(name);
        if (a !== null) return parseInt(a || '0');
        const s = statusNode ? statusNode.getAttribute(name) : null;
        if (s !== null) return parseInt(s || '0');
        return 0;
      };
      collectionMap[oid] = {
        own: getFlag('own'),
        prevowned: getFlag('prevowned'),
        fortrade: getFlag('fortrade'),
        want: getFlag('want'),
        wanttoplay: getFlag('wanttoplay'),
        wanttobuy: getFlag('wanttobuy'),
        wishlist: getFlag('wishlist'),
        preordered: getFlag('preordered'),
        lastmodified: it.getAttribute('lastmodified') || (statusNode ? statusNode.getAttribute('lastmodified') || '' : '')
      };
    });

    const objectIds = collItems.map(i => i.getAttribute('objectid'));
    updateLoadingStatus(`Found ${objectIds.length} games. Fetching details…`);
    updateProgress(10);

    // Step 2: Batch fetch thing API with stats=1 (100x parallel, 20 IDs per batch)
    allGames = [];
    const batchSize = 20;
    const batches = [];
    for (let i = 0; i < objectIds.length; i += batchSize) {
      batches.push(objectIds.slice(i, i + batchSize));
    }

    // All batches in parallel
    await Promise.all(batches.map(async (batch, idx) => {
      try {
        const ids = batch.join(',');
        const xml = await fetchWithRetry(`${API_BASE}?endpoint=thing&id=${encodeURIComponent(ids)}&stats=1`);
        const doc = new DOMParser().parseFromString(xml, 'text/xml');
        Array.from(doc.querySelectorAll('item')).forEach(item => {
          const id = item.getAttribute('id');
          const name = item.querySelector('name[type="primary"]')?.getAttribute('value') || item.querySelector('name')?.textContent || '';
          const thumb = item.querySelector('thumbnail')?.textContent || '';
          const image = item.querySelector('image')?.textContent || '';
          const desc = item.querySelector('description')?.textContent?.substring(0, 150).trim() + '…' || '';
          const year = parseInt(item.querySelector('yearpublished')?.getAttribute('value') || '0') || 0;
          const minplayers = parseInt(item.querySelector('minplayers')?.getAttribute('value') || '0') || 0;
          const maxplayers = parseInt(item.querySelector('maxplayers')?.getAttribute('value') || '0') || 0;
          const minplaytime = parseInt(item.querySelector('minplaytime')?.getAttribute('value') || '0') || 0;
          const maxplaytime = parseInt(item.querySelector('maxplaytime')?.getAttribute('value') || '0') || 0;
          const minage = parseInt(item.querySelector('minage')?.getAttribute('value') || '0') || 0;
          
          // Stats - read attribute "value" from thing API response (safer)
          const ratings = item.querySelector('statistics ratings') || item.querySelector('statistics > ratings');
              const bggRating = ratings ? parseFloat(ratings.querySelector('average')?.getAttribute('value') || ratings.querySelector('average')?.textContent || '0') : 0;
          const bayesaverage = ratings ? parseFloat(ratings.querySelector('bayesaverage')?.getAttribute('value') || '0') : 0;
          const userRated = ratings ? parseInt(ratings.querySelector('usersrated')?.getAttribute('value') || '0') : 0;
          const stddev = ratings ? parseFloat(ratings.querySelector('stddev')?.getAttribute('value') || '0') : 0;
          const median = ratings ? parseFloat(ratings.querySelector('median')?.getAttribute('value') || '0') : 0;
          const owned = ratings ? parseInt(ratings.querySelector('owned')?.getAttribute('value') || '0') : 0;
          const trading = ratings ? parseInt(ratings.querySelector('trading')?.getAttribute('value') || '0') : 0;
          const wanting = ratings ? parseInt(ratings.querySelector('wanting')?.getAttribute('value') || '0') : 0;
          const wishing = ratings ? parseInt(ratings.querySelector('wishing')?.getAttribute('value') || '0') : 0;
          const numcomments = ratings ? parseInt(ratings.querySelector('numcomments')?.getAttribute('value') || '0') : 0;
          const numweights = ratings ? parseInt(ratings.querySelector('numweights')?.getAttribute('value') || '0') : 0;
          const avgweight = ratings ? parseFloat(ratings.querySelector('averageweight')?.getAttribute('value') || '0') : 0;
          // ranks
          const ranksNode = ratings ? ratings.querySelector('ranks') : null;
          const primaryRank = ranksNode ? (ranksNode.querySelector('rank[type="subtype"]')?.getAttribute('value') || '') : '';
          const familyRank = ranksNode ? (ranksNode.querySelector('rank[type="family"]')?.getAttribute('value') || '') : '';
          
          // Categories & Mechanics
          const categories = Array.from(item.querySelectorAll('link[type="boardgamecategory"]')).map(l => l.getAttribute('value'));
          const mechanics = Array.from(item.querySelectorAll('link[type="boardgamemechanic"]')).map(l => l.getAttribute('value'));

          // Polls: suggested number of players -> prefer poll-summary, otherwise derive Best/Recommended from poll results
          let bestwith = '';
          let recommendedwith = '';
          try {
            const ps = item.querySelector('poll-summary[name="suggested_numplayers"], poll-summary');
            if (ps) {
              const b = ps.querySelector('result[name="bestwith"]')?.getAttribute('value') || ps.querySelector('result[name="bestwith"]')?.textContent || '';
              const r = ps.querySelector('result[name="recommendedwith"]')?.getAttribute('value') || ps.querySelector('result[name="recommendedwith"]')?.textContent || ps.querySelector('result[name="recommmendedwith"]')?.getAttribute('value') || ps.querySelector('result[name="recommmendedwith"]')?.textContent || '';
              if (b) bestwith = b;
              if (r) recommendedwith = r;
            } else {
              const poll = item.querySelector('poll[name="suggested_numplayers"]');
              if (poll) {
                const bestNums = [];
                const recoNums = [];
                Array.from(poll.querySelectorAll('results')).forEach(res => {
                  const num = res.getAttribute('numplayers');
                  // check all result nodes inside this results
                  Array.from(res.querySelectorAll('result')).forEach(resultNode => {
                    const label = (resultNode.getAttribute('value') || resultNode.textContent || '').toLowerCase();
                    if (!num) return;
                    if (label.includes('best')) bestNums.push(parseInt(num));
                    if (label.includes('recommend')) recoNums.push(parseInt(num));
                  });
                });

                const fmt = (arr) => {
                  if (!arr || arr.length === 0) return '';
                  const nums = Array.from(new Set(arr.map(n => parseInt(n)).filter(n=>!isNaN(n)))).sort((a,b)=>a-b);
                  if (nums.length === 1) return `${nums[0]} players`;
                  const min = nums[0], max = nums[nums.length-1];
                  let consecutive = true;
                  for (let i=0;i<nums.length;i++) if (nums[i] !== min + i) { consecutive = false; break; }
                  if (consecutive) return `${min}–${max} players`;
                  return nums.join(', ') + ' players';
                };

                const bw = fmt(bestNums);
                const rw = fmt(recoNums);
                if (bw) bestwith = `Best with ${bw}`;
                if (rw) recommendedwith = `Recommended with ${rw}`;
              }
            }
          } catch (e) { console.warn('poll parse', e); }
          
          const coll = collectionMap[id] || {};
          allGames.push({
            id, name, thumb, image, desc, year, minplayers, maxplayers, minplaytime, maxplaytime, minage,
            bggRating, bayesaverage, userRated, stddev, median, owned, trading, wanting, wishing, numcomments, numweights, avgweight,
            primaryRank, familyRank, categories, mechanics,
            bestwith, recommendedwith,
            // merge collection flags
            own: coll.own || 0, prevowned: coll.prevowned || 0, fortrade: coll.fortrade || 0, want: coll.want || 0,
            wanttoplay: coll.wanttoplay || 0, wanttobuy: coll.wanttobuy || 0, wishlist: coll.wishlist || 0, preordered: coll.preordered || 0,
            lastmodified: coll.lastmodified || '',
            xmlStr: new XMLSerializer().serializeToString(item)
          });
        });
        updateProgress(10 + ((idx + 1) / batches.length) * 85);
        updateLoadingStatus(`Fetching details ${idx + 1}/${batches.length}…`);
      } catch (e) { console.error('Batch error', e); }
    }));

    updateProgress(100);
    updateLoadingStatus('Complete!');
    
    document.getElementById('controlsSection').classList.remove('hidden');
    document.getElementById('gamesSection').classList.remove('hidden');
    document.getElementById('statsBox').classList.remove('hidden');
    document.getElementById('gameCount').textContent = allGames.length;
    
    displayedGames = [...allGames];
    // update status counts for header panel
    updateStatusCounts(displayedGames);
    renderGames(displayedGames);
    
    setTimeout(() => { document.getElementById('loadingSection').classList.add('hidden'); }, 500);
  } catch (err) {
    console.error(err);
    updateLoadingStatus(`Error: ${err.message}`);
    setTimeout(() => { document.getElementById('loadingSection').classList.add('hidden'); document.getElementById('fetchSection').classList.remove('hidden'); }, 3000);
  } finally {
    document.getElementById('fetchBtn').disabled = false;
  }
}

async function fetchWithRetry(url, maxRetries = 5) {
  for (let attempt = 0; attempt < maxRetries; attempt++) {
    try {
      const res = await fetch(url);
      if (res.status === 202) { await new Promise(r => setTimeout(r, 3000)); continue; }
      if (res.ok) return await res.text();
      await new Promise(r => setTimeout(r, 2000));
    } catch (e) { await new Promise(r => setTimeout(r, 1500 * Math.pow(2, attempt))); }
  }
  throw new Error('Failed to fetch');
}

function filterGames() {
  if (allGames.length === 0) return;
  const search = document.getElementById('searchInput').value.toLowerCase();
  // base set matching search
  const baseSet = allGames.filter(g => g.name.toLowerCase().includes(search));
  // update counts for status panel
  updateStatusCounts(baseSet);
  // apply status filters (OR semantics) if any selected
  if (statusFilters.length > 0) {
    displayedGames = baseSet.filter(g => statusFilters.some(s => Number(g[s]) === 1));
  } else {
    displayedGames = baseSet;
  }
  // apply tag filters (categories/mechanics) - OR semantics within each type, AND across types
  if (tagFilters.categories && tagFilters.categories.size > 0) {
    const cats = Array.from(tagFilters.categories);
    displayedGames = displayedGames.filter(g => (g.categories || []).some(c => cats.includes(c)));
  }
  if (tagFilters.mechanics && tagFilters.mechanics.size > 0) {
    const mecs = Array.from(tagFilters.mechanics);
    displayedGames = displayedGames.filter(g => (g.mechanics || []).some(m => mecs.includes(m)));
  }
  sortGames();
}

function toggleStatusPanel() {
  const panel = document.getElementById('statusPanel');
  panel.classList.toggle('hidden');
}

function updateStatusFilter(name, checked) {
  if (checked) {
    if (!statusFilters.includes(name)) statusFilters.push(name);
    // apply immediately
    filterGames();
  } else {
    statusFilters = statusFilters.filter(s => s !== name);
    // apply immediately
    filterGames();
  }
}

function applyStatusFilters() {
  document.getElementById('statusPanel').classList.add('hidden');
  filterGames();
}

function clearStatusFilters() {
  statusFilters = [];
  const inputs = document.querySelectorAll('#statusPanel input[type="checkbox"]');
  inputs.forEach(i => i.checked = false);
  filterGames();
}

function updateStatusCounts(baseSet) {
  // baseSet is the list after search but before status filtering
  const keys = ['own','prevowned','fortrade','want','wanttoplay','wanttobuy','wishlist','preordered'];
  keys.forEach(k => {
    const el = document.getElementById('count_' + k);
    if (!el) return;
    const cnt = baseSet.filter(g => Number(g[k]) === 1).length;
    el.textContent = `(${cnt})`;
  });
}

function toggleTagFilter(type, encodedValue) {
  const value = decodeURIComponent(encodedValue || '');
  if (!value) return;
  const set = type === 'category' ? tagFilters.categories : tagFilters.mechanics;
  if (!set) return;
  if (set.has(value)) set.delete(value); else set.add(value);
  // re-render games using filterGames which will consider tagFilters
  filterGames();
}

function sortGames() {
  if (displayedGames.length === 0) return;
  const sortBy = document.getElementById('sortSelect').value;
  displayedGames.sort((a, b) => {
    let res = 0;
    if (sortBy === 'name') res = a.name.localeCompare(b.name);
    else if (sortBy === 'rating') res = (b.bggRating || 0) - (a.bggRating || 0);
    else if (sortBy === 'year') res = (b.year || 0) - (a.year || 0);
    else if (sortBy === 'weight') res = (b.avgweight || 0) - (a.avgweight || 0);
    else if (sortBy === 'playingtime') {
      const ta = ((a.minplaytime||0) + (a.maxplaytime||0)) / 2;
      const tb = ((b.minplaytime||0) + (b.maxplaytime||0)) / 2;
      res = tb - ta;
    }
    // apply asc/desc
    if (sortAsc) res = -res;
    return res;
  });
  renderGames(displayedGames);
}

function toggleSortDir() {
  sortAsc = !sortAsc;
  const btn = document.getElementById('sortDirBtn');
  if (btn) btn.textContent = sortAsc ? '▲' : '▼';
  sortGames();
}

function showFilterPanel() {
  const panel = document.getElementById('filterPanel');
  panel.classList.toggle('hidden');
  if (!panel.classList.contains('hidden') && filters.length === 0) {
    addFilter();
  }
}

function addFilter() {
  const id = Date.now();
  filters.push({ id, field: 'bggRating', operator: '>=', value: '5' });
  renderFilterPanel();
}

function removeFilter(id) {
  filters = filters.filter(f => f.id !== id);
  renderFilterPanel();
}

function updateFilter(id, field, operator, value) {
  const f = filters.find(x => x.id === id);
  if (f) { f.field = field; f.operator = operator; f.value = value; }
}

function renderFilterPanel() {
  const list = document.getElementById('filtersList');
  if (filters.length === 0) {
    list.innerHTML = '<div class="text-slate-500 text-xs">No filters added</div>';
    return;
  }
  
  list.innerHTML = filters.map(f => `
    <div class="flex gap-2 text-xs bg-slate-50 p-2 rounded">
      <select onchange="updateFilter(${f.id}, this.value, '${f.operator}', '${f.value}')" class="px-2 py-1 rounded border border-slate-200 bg-white">
        <option value="bggRating" ${f.field === 'bggRating' ? 'selected' : ''}>BGG Rating</option>
        <option value="avgweight" ${f.field === 'avgweight' ? 'selected' : ''}>Weight</option>
        <option value="minplayers" ${f.field === 'minplayers' ? 'selected' : ''}>Min Players</option>
        <option value="maxplayers" ${f.field === 'maxplayers' ? 'selected' : ''}>Max Players</option>
        <option value="minplaytime" ${f.field === 'minplaytime' ? 'selected' : ''}>Min Time</option>
        <option value="maxplaytime" ${f.field === 'maxplaytime' ? 'selected' : ''}>Max Time</option>
        <option value="year" ${f.field === 'year' ? 'selected' : ''}>Year</option>
        <option value="minage" ${f.field === 'minage' ? 'selected' : ''}>Min Age</option>
        <option value="userRated" ${f.field === 'userRated' ? 'selected' : ''}>User Ratings</option>
        <option value="owned" ${f.field === 'owned' ? 'selected' : ''}>Owned</option>
        <option value="wishing" ${f.field === 'wishing' ? 'selected' : ''}>Wishing</option>
      </select>
      <select onchange="updateFilter(${f.id}, '${f.field}', this.value, '${f.value}')" class="px-2 py-1 rounded border border-slate-200 bg-white">
        <option value=">=" ${f.operator === '>=' ? 'selected' : ''}>&ge;</option>
        <option value=">" ${f.operator === '>' ? 'selected' : ''}>&gt;</option>
        <option value="<=" ${f.operator === '<=' ? 'selected' : ''}>&le;</option>
        <option value="<" ${f.operator === '<' ? 'selected' : ''}>&lt;</option>
        <option value="=" ${f.operator === '=' ? 'selected' : ''}>=</option>
      </select>
      <input type="number" value="${f.value}" onchange="updateFilter(${f.id}, '${f.field}', '${f.operator}', this.value)" class="flex-1 px-2 py-1 rounded border border-slate-200">
      <button onclick="removeFilter(${f.id})" class="text-red-600 hover:text-red-800 font-bold">✕</button>
    </div>
  `).join('');
}

function applyFilters() {
  filterLogic = document.getElementById('logicSelect').value;
  const filtered = allGames.filter(game => {
    const results = filters.map(f => {
      const val = game[f.field];
      const target = parseFloat(f.value);
      if (f.operator === '>=') return val >= target;
      if (f.operator === '>') return val > target;
      if (f.operator === '<=') return val <= target;
      if (f.operator === '<') return val < target;
      if (f.operator === '=') return val === target;
      return true;
    });
    return filterLogic === 'and' ? results.every(r => r) : results.some(r => r);
  });
  displayedGames = filtered;
  sortGames();
  document.getElementById('filterPanel').classList.add('hidden');
}

function clearFilters() {
  filters = [];
  renderFilterPanel();
  displayedGames = [...allGames];
  sortGames();
}

function renderGames(games) {
  const container = document.getElementById('gamesSection');
  const emptyState = document.getElementById('emptyState');
  
  if (games.length === 0) {
    container.classList.add('hidden');
    emptyState.classList.remove('hidden');
    return;
  }
  
  container.classList.remove('hidden');
  emptyState.classList.add('hidden');

  container.innerHTML = games.map(g => {
    if (!g || !g.id || !g.name) return '';
    const playerRange = g.minplayers === g.maxplayers ? `${g.minplayers}p` : `${g.minplayers}-${g.maxplayers}p`;
    const timeRange = g.minplaytime === g.maxplaytime ? `${g.minplaytime}m` : `${g.minplaytime}-${g.maxplaytime}m`;
    const bggRating = parseFloat(g.bggRating) || 0;
    const bayesaverage = parseFloat(g.bayesaverage) || 0;
    const avgweight = parseFloat(g.avgweight) || 0;
    const userRated = parseInt(g.userRated) || 0;
    const owned = parseInt(g.owned) || 0;
    const wishing = parseInt(g.wishing) || 0;
    const primaryRank = g.primaryRank || '';
    const xmlStr = g.xmlStr || '';
    
    return `
      <div class="game-card bg-white rounded-lg shadow-sm border border-slate-100 overflow-hidden p-3 flex gap-3 cursor-pointer hover:shadow-md transition" onclick="openModal('${g.id}')">
        <!-- Small Square Thumbnail -->
        <div class="flex-shrink-0">
          ${g.thumb ? `
            <a href="https://boardgamegeek.com/boardgame/${g.id}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">
              <img src="${g.thumb}" alt="${g.name}" class="w-16 h-16 rounded-lg object-cover bg-slate-200">
            </a>
          ` : '<div class="w-16 h-16 bg-slate-200 rounded-lg flex items-center justify-center text-slate-400"><i class="fa-solid fa-image"></i></div>'}
        </div>
        
        <!-- Content -->
        <div class="flex-1 min-w-0">
          <!-- Title -->
          <h3 class="font-bold text-sm text-slate-900 line-clamp-1">${g.name}</h3>
          
          <!-- Meta Row -->
          <div class="text-xs text-slate-600 line-clamp-1 mb-1">${g.year || 'N/A'} • ${playerRange} • ${timeRange} • ${g.minage}+</div>
          ${g.bestwith || g.recommendedwith ? `<div class="text-xs text-slate-500 mb-1">${g.bestwith ? g.bestwith : ''}${g.bestwith && g.recommendedwith ? ' • ' : ''}${g.recommendedwith ? g.recommendedwith : ''}</div>` : ''}
          
          <!-- Stats Row -->
          <div class="flex gap-1 mb-1 text-xs font-bold items-center">
            <span class="bg-purple-100 text-purple-700 px-1.5 py-0.5 rounded">⭐ ${bggRating.toFixed(2)}</span>
            <span class="bg-slate-100 text-slate-800 px-1 py-0.5 rounded">🔮 ${bayesaverage.toFixed(2)}</span>
            <span class="bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded">👥 ${userRated.toLocaleString()}</span>
            <span class="bg-green-100 text-green-700 px-1.5 py-0.5 rounded">🎲 ${owned.toLocaleString()}</span>
            <span class="bg-pink-100 text-pink-700 px-1.5 py-0.5 rounded">❤️ ${wishing.toLocaleString()}</span>
            <span class="bg-orange-100 text-orange-700 px-1.5 py-0.5 rounded">⚖️ ${avgweight.toFixed(2)}</span>
            ${primaryRank ? `<span class="bg-yellow-100 text-yellow-800 px-1 py-0.5 rounded">🏆 ${primaryRank}</span>` : ''}
            ${g.familyRank ? `<span class="bg-amber-100 text-amber-800 px-1 py-0.5 rounded">🏅 ${g.familyRank}</span>` : ''}
          </div>
          
          <!-- Status Badges -->
          <div class="flex gap-1 flex-wrap mt-1 text-xs">
            ${g.own ? `<span class="px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded">🏠 Own</span>` : ''}
            ${g.prevowned ? `<span class="px-2 py-0.5 bg-slate-100 text-slate-800 rounded">🔁 PrevOwned</span>` : ''}
            ${g.fortrade ? `<span class="px-2 py-0.5 bg-amber-100 text-amber-800 rounded">💱 ForTrade</span>` : ''}
            ${g.want ? `<span class="px-2 py-0.5 bg-yellow-100 text-yellow-800 rounded">⭐ Want</span>` : ''}
            ${g.wanttoplay ? `<span class="px-2 py-0.5 bg-indigo-100 text-indigo-800 rounded">▶️ WantToPlay</span>` : ''}
            ${g.wanttobuy ? `<span class="px-2 py-0.5 bg-rose-100 text-rose-800 rounded">💸 WantToBuy</span>` : ''}
            ${g.wishlist ? `<span class="px-2 py-0.5 bg-pink-50 text-pink-700 rounded">📝 Wishlist</span>` : ''}
            ${g.preordered ? `<span class="px-2 py-0.5 bg-blue-50 text-blue-700 rounded">📦 Preordered</span>` : ''}
          </div>

          <!-- Tags: show full lists -->
          <div class="flex gap-1 flex-wrap mt-2 text-xs">
            ${(g.categories||[]).map(c => {
              const enc = encodeURIComponent(c);
              const active = (tagFilters.categories && tagFilters.categories.has(c)) ? 'ring-2 ring-indigo-300 font-bold' : '';
              return `<span onclick="toggleTagFilter('category','${enc}')" class="tag tag-category cursor-pointer ${active}">${c}</span>`;
            }).join('')}
            ${(g.mechanics||[]).map(m => {
              const enc = encodeURIComponent(m);
              const active = (tagFilters.mechanics && tagFilters.mechanics.has(m)) ? 'ring-2 ring-indigo-300 font-bold' : '';
              return `<span onclick="toggleTagFilter('mechanic','${enc}')" class="tag tag-mechanic cursor-pointer ${active}">${m}</span>`;
            }).join('')}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function openModal(id) {
  const game = allGames.find(x => x.id === id);
  const name = game?.name || `Game ${id}`;
  const xmlStr = game?.xmlStr || '';
  document.getElementById('modalTitle').textContent = name;
  const content = document.getElementById('modalContent');
  // remove empty lines from XML then escape for display
  const cleanedXml = (xmlStr || '').split(/\r?\n/).filter(l => l.trim() !== '').join('\n');
  const escapedXml = cleanedXml.replace(/</g, '&lt;').replace(/>/g, '&gt;');

  content.innerHTML = `
    <div class="space-y-3">
      <div class="flex gap-2 border-b pb-2">
        <button id="tabFull" class="px-3 py-1 text-sm font-bold bg-slate-100 rounded">Full Details</button>
        <button id="tabRaw" class="px-3 py-1 text-sm font-bold bg-white rounded">Raw XML</button>
        <div class="ml-auto text-xs text-slate-500">ID: ${id}</div>
      </div>

      <div id="tabContentFull" class="pt-3">
        ${renderFullData(game)}
      </div>

      <div id="tabContentRaw" class="hidden pt-3">
        <div class="bg-slate-900 text-slate-100 p-3 rounded text-xs overflow-x-auto font-mono max-h-96 overflow-y-auto whitespace-pre-wrap break-words">${escapedXml}</div>
        <div class="flex gap-2 text-xs mt-2">
          <button id="copyRawBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded font-bold">📋 Copy XML</button>
          <a href="https://boardgamegeek.com/boardgame/${id}" target="_blank" rel="noopener noreferrer" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded text-center font-bold">🔗 BGG Link</a>
        </div>
      </div>
    </div>
  `;

  // Tab wiring
  // default to Full Details
  document.getElementById('tabFull').classList.add('bg-slate-100');
  document.getElementById('tabContentFull').classList.remove('hidden');
  document.getElementById('tabRaw').classList.remove('bg-slate-100');

  document.getElementById('tabRaw').addEventListener('click', () => {
    document.getElementById('tabContentRaw').classList.remove('hidden');
    document.getElementById('tabContentFull').classList.add('hidden');
    document.getElementById('tabRaw').classList.add('bg-slate-100');
    document.getElementById('tabFull').classList.remove('bg-slate-100');
  });
  document.getElementById('tabFull').addEventListener('click', () => {
    document.getElementById('tabContentFull').classList.remove('hidden');
    document.getElementById('tabContentRaw').classList.add('hidden');
    document.getElementById('tabFull').classList.add('bg-slate-100');
    document.getElementById('tabRaw').classList.remove('bg-slate-100');
  });
  document.getElementById('copyRawBtn').addEventListener('click', () => copyToClipboard(xmlStr));

  document.getElementById('detailsModal').classList.remove('hidden');
}

function renderFullData(game) {
  if (!game) return '<div class="text-sm text-slate-600">No details available</div>';
  // parse xml for some nodes we didn't pre-parse
  const doc = new DOMParser().parseFromString(game.xmlStr || '<item/>', 'text/xml');
  const names = Array.from(doc.querySelectorAll('name')).map(n => ({type: n.getAttribute('type') || 'name', value: n.getAttribute('value') || n.textContent}));
  const designers = Array.from(doc.querySelectorAll('link[type="boardgamedesigner"]')).map(l => l.getAttribute('value'));
  const publishers = Array.from(doc.querySelectorAll('link[type="boardgamepublisher"]')).map(l => l.getAttribute('value'));
  const artists = Array.from(doc.querySelectorAll('link[type="boardgameartist"]')).map(l => l.getAttribute('value'));
  const expansions = Array.from(doc.querySelectorAll('link[type="boardgameexpansion"]')).map(l => l.getAttribute('value'));
  const families = Array.from(doc.querySelectorAll('link[type="boardgamefamily"]')).map(l => l.getAttribute('value'));
  const stats = doc.querySelector('statistics ratings');
  const avg = stats ? (stats.querySelector('average')?.getAttribute('value') || stats.querySelector('average')?.textContent) : '';
  const bayes = stats ? (stats.querySelector('bayesaverage')?.getAttribute('value') || '') : '';
  const users = stats ? (stats.querySelector('usersrated')?.getAttribute('value') || '') : '';
  const owned = stats ? (stats.querySelector('owned')?.getAttribute('value') || '') : '';
  const wishing = stats ? (stats.querySelector('wishing')?.getAttribute('value') || '') : '';
  const avgw = stats ? (stats.querySelector('averageweight')?.getAttribute('value') || '') : '';
  const ranks = stats ? Array.from(stats.querySelectorAll('rank')).map(r => ({name: r.getAttribute('friendlyname') || r.getAttribute('name'), value: r.getAttribute('value')})) : [];

  return `
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="col-span-1">
        ${game.image ? `<img src="${game.image}" alt="${game.name}" class="w-full rounded-lg object-cover">` : ''}
        <div class="mt-2 text-sm text-slate-600">${game.thumb ? `<img src="${game.thumb}" alt="thumb" class="w-32 rounded">` : ''}</div>
        <div class="mt-3 text-xs text-slate-500">ID: ${game.id}</div>
        <div class="mt-2 text-xs text-slate-500">Year: ${game.year || 'N/A'}</div>
        <div class="mt-2 text-xs text-slate-500">Players: ${game.minplayers}-${game.maxplayers}</div>
        <div class="mt-2 text-xs text-slate-500">Playtime: ${game.minplaytime}-${game.maxplaytime} min</div>
        <div class="mt-2 text-xs text-slate-500">Min Age: ${game.minage}</div>
        <div class="mt-3 text-sm font-bold">Stats</div>
        <div class="text-xs text-slate-700 space-y-1">
          <div>Average: ${avg}</div>
          <div>Bayes avg: ${bayes}</div>
          <div>Users rated: ${users}</div>
          <div>Owned: ${owned}</div>
          <div>Wishing: ${wishing}</div>
          <div>Weight: ${avgw}</div>
          ${ranks.map(r=>`<div>${r.name}: ${r.value}</div>`).join('')}
        </div>
      </div>
      <div class="col-span-2">
        <h3 class="text-lg font-bold">${game.name}</h3>
        ${names.filter(n=>n.type!=='primary').length? `<div class="text-sm text-slate-500">Alternate names: ${names.filter(n=>n.type!=='primary').map(n=>n.value).join(', ')}</div>` : ''}
        <div class="mt-3 text-sm text-slate-700">${game.desc || ''}</div>

        <div class="mt-4 grid grid-cols-2 gap-2">
          <div>
            <div class="text-xs font-bold text-slate-600">Designers</div>
            <div class="text-sm text-slate-700">${designers.join(', ')}</div>
          </div>
          <div>
            <div class="text-xs font-bold text-slate-600">Publishers</div>
            <div class="text-sm text-slate-700">${publishers.join(', ')}</div>
          </div>
          <div>
            <div class="text-xs font-bold text-slate-600">Artists</div>
            <div class="text-sm text-slate-700">${artists.join(', ')}</div>
          </div>
          <div>
            <div class="text-xs font-bold text-slate-600">Families</div>
            <div class="text-sm text-slate-700">${families.join(', ')}</div>
          </div>
        </div>

        <div class="mt-4">
          <div class="text-xs font-bold text-slate-600">Categories</div>
          <div class="text-sm text-slate-700">${(game.categories||[]).join(', ')}</div>
        </div>

        <div class="mt-2">
          <div class="text-xs font-bold text-slate-600">Mechanics</div>
          <div class="text-sm text-slate-700">${(game.mechanics||[]).join(', ')}</div>
        </div>

        <div class="mt-4">
          <div class="text-xs font-bold text-slate-600">Expansions</div>
          <div class="text-sm text-slate-700">${expansions.join(', ')}</div>
        </div>
      </div>
    </div>
  `;
}

function closeModal() {
  document.getElementById('detailsModal').classList.add('hidden');
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => {
    alert('XML copied!');
  });
}

function updateLoadingStatus(msg) { document.getElementById('loadingStatus').textContent = msg; }
function updateProgress(pct) { document.getElementById('progressBar').style.width = pct + '%'; }
</script>
