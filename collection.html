<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>BGG Collection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
    }

    .game-card {
      transition: all 0.2s ease;
    }

    .game-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
    }

    .skeleton {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="pb-20">

  <header class="sticky top-0 z-30 w-full bg-white/80 backdrop-blur-md border-b px-4 py-4 shadow-sm">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 text-white p-2 rounded-lg">
          <i class="fa-solid fa-book"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">Collection</h1>
          <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Your Games</p>
        </div>
      </div>
      <div id="statsBox" class="text-right hidden">
        <div class="text-2xl font-bold text-indigo-600" id="gameCount">0</div>
        <div class="text-[10px] text-slate-500 uppercase font-bold">Games</div>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 space-y-6">
    
    <!-- Fetch Section -->
    <div id="fetchSection" class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
      <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
        <i class="fa-solid fa-download text-indigo-600"></i>
        Load Collection
      </h2>
      <div class="space-y-4">
        <div>
          <label class="text-xs font-bold text-slate-500 uppercase mb-2 block">BGG Username</label>
          <input 
            id="username" 
            type="text" 
            value="sportomax" 
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all"
          >
        </div>
        <button 
          onclick="fetchCollection()" 
          id="fetchBtn"
          class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold hover:bg-indigo-700 shadow-lg shadow-indigo-100 flex items-center justify-center gap-2 transition-all"
        >
          <i class="fa-solid fa-download"></i> Load Games
        </button>
      </div>
    </div>

    <!-- Loading Section -->
    <div id="loadingSection" class="hidden">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
        <div class="flex items-center justify-center gap-3 mb-4">
          <i class="fa-solid fa-circle-notch fa-spin text-indigo-600 text-2xl"></i>
          <span class="font-bold text-slate-700">Loading collection...</span>
        </div>
        <div class="text-sm text-slate-500 text-center" id="loadingStatus">Fetching games...</div>
        <div class="mt-4 bg-slate-100 rounded-full h-2 overflow-hidden">
          <div id="progressBar" class="bg-indigo-600 h-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- Filters and Controls -->
    <div id="controlsSection" class="hidden bg-white rounded-2xl shadow-sm border border-slate-100 p-4 space-y-4">
      <!-- Search and Sort -->
      <div class="flex flex-col sm:flex-row gap-3">
        <div class="flex-1">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Search games..." 
            oninput="filterGames()"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all"
          >
        </div>
        <select 
          id="sortSelect" 
          onchange="sortGames()" 
          class="px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all bg-white font-semibold text-sm"
        >
          <option value="name">Name (A-Z)</option>
          <option value="rating">User Rating</option>
          <option value="year">Year Published</option>
          <option value="bggrating">BGG Rating</option>
        </select>
      </div>

      <!-- Display Toggles -->
      <div class="flex flex-wrap gap-3 pt-2 border-t">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="showThumbs" class="form-checkbox text-indigo-600 rounded" checked onchange="filterGames()">
          <span class="text-sm font-semibold text-slate-700">Thumbnails</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="showRating" class="form-checkbox text-indigo-600 rounded" checked onchange="filterGames()">
          <span class="text-sm font-semibold text-slate-700">Your Rating</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="showBgg" class="form-checkbox text-indigo-600 rounded" checked onchange="filterGames()">
          <span class="text-sm font-semibold text-slate-700">BGG Rating</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="showStats" class="form-checkbox text-indigo-600 rounded" checked onchange="filterGames()">
          <span class="text-sm font-semibold text-slate-700">Stats</span>
        </label>
      </div>
    </div>

    <!-- Games Grid -->
    <div id="gamesSection" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- Games will be populated here -->
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-12">
      <i class="fa-solid fa-inbox text-slate-300 text-5xl mb-4 block"></i>
      <p class="text-slate-500 font-semibold">No games found</p>
    </div>

  </main>

<script>
let allGames = [];
let displayedGames = [];

async function fetchCollection() {
  const username = document.getElementById('username').value.trim() || 'sportomax';
  const fetchBtn = document.getElementById('fetchBtn');
  const fetchSection = document.getElementById('fetchSection');
  const loadingSection = document.getElementById('loadingSection');
  const controlsSection = document.getElementById('controlsSection');
  const gamesSection = document.getElementById('gamesSection');
  const emptyState = document.getElementById('emptyState');
  const statsBox = document.getElementById('statsBox');
  
  fetchBtn.disabled = true;
  loadingSection.classList.remove('hidden');
  
  try {
    updateLoadingStatus('Fetching collection...');
    
    // Fetch collection with stats and own=1
    const collXml = await fetchAPI('collection', username, '&stats=1&own=1');
    const doc = new DOMParser().parseFromString(collXml, 'text/xml');
    const items = Array.from(doc.querySelectorAll('item'));
    
    if (items.length === 0) {
      updateLoadingStatus('No items found in collection');
      setTimeout(() => {
        loadingSection.classList.add('hidden');
        fetchSection.classList.remove('hidden');
      }, 2000);
      return;
    }

    allGames = items.map(item => {
      const objectid = item.getAttribute('objectid');
      const name = item.querySelector('name')?.textContent?.trim() || '';
      const thumb = item.querySelector('thumbnail')?.textContent || '';
      const year = item.querySelector('yearpublished')?.textContent || '';
      const userRating = parseFloat(item.querySelector('status')?.getAttribute('rating') || '0');
      const minplayers = parseInt(item.querySelector('stats')?.getAttribute('minplayers') || '0');
      const maxplayers = parseInt(item.querySelector('stats')?.getAttribute('maxplayers') || '0');
      const playingtime = parseInt(item.querySelector('stats')?.getAttribute('playingtime') || '0');
      
      const ratings = item.querySelector('stats rating');
      const bggRating = ratings ? parseFloat(ratings.querySelector('average')?.getAttribute('value') || '0') : 0;
      const numRatings = ratings ? parseInt(ratings.querySelector('usersrated')?.getAttribute('value') || '0') : 0;
      
      return { 
        objectid, 
        name, 
        thumb, 
        year, 
        userRating, 
        bggRating,
        numRatings,
        minplayers, 
        maxplayers, 
        playingtime,
        loaded: true 
      };
    }).filter(game => game.name);
    
    updateLoadingStatus(`Found ${allGames.length} games. Rendering...`);
    
    // Show UI
    loadingSection.classList.remove('hidden');
    fetchSection.classList.add('hidden');
    controlsSection.classList.remove('hidden');
    gamesSection.classList.remove('hidden');
    statsBox.classList.remove('hidden');
    document.getElementById('gameCount').textContent = allGames.length;
    
    displayedGames = [...allGames];
    renderGames(displayedGames);
    
    setTimeout(() => {
      loadingSection.classList.add('hidden');
    }, 500);
    
  } catch (err) {
    console.error(err);
    updateLoadingStatus(`Error: ${err.message}`);
    setTimeout(() => {
      loadingSection.classList.add('hidden');
      fetchSection.classList.remove('hidden');
    }, 3000);
  } finally {
    fetchBtn.disabled = false;
  }
}

async function fetchAPI(endpoint, username, params = '') {
  const url = `/api/bgg-helper?endpoint=${endpoint}&username=${username}${params}`;
  const response = await fetch(url);
  
  if (response.status === 202) {
    await new Promise(resolve => setTimeout(resolve, 3000));
    return fetchAPI(endpoint, username, params);
  }
  
  if (!response.ok) {
    throw new Error(`API error: ${response.status}`);
  }
  
  return await response.text();
}

function filterGames() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  displayedGames = allGames.filter(game => 
    game.name.toLowerCase().includes(search)
  );
  sortGames();
}

function sortGames() {
  const sortBy = document.getElementById('sortSelect').value;
  
  displayedGames.sort((a, b) => {
    switch(sortBy) {
      case 'name': return a.name.localeCompare(b.name);
      case 'rating': return (b.userRating || 0) - (a.userRating || 0);
      case 'year': return parseInt(b.year || 0) - parseInt(a.year || 0);
      case 'bggrating': return (b.bggRating || 0) - (a.bggRating || 0);
      default: return 0;
    }
  });
  
  renderGames(displayedGames);
}

function renderGames(games) {
  const container = document.getElementById('gamesSection');
  const emptyState = document.getElementById('emptyState');
  
  if (games.length === 0) {
    container.classList.add('hidden');
    emptyState.classList.remove('hidden');
    return;
  }
  
  container.classList.remove('hidden');
  emptyState.classList.add('hidden');
  
  const showThumbs = document.getElementById('showThumbs').checked;
  const showRating = document.getElementById('showRating').checked;
  const showBgg = document.getElementById('showBgg').checked;
  const showStats = document.getElementById('showStats').checked;

  container.innerHTML = games.map(game => {
    const playerRange = game.minplayers === game.maxplayers 
      ? `${game.minplayers}p` 
      : `${game.minplayers}-${game.maxplayers}p`;
    
    return `
      <div class="game-card bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden hover:shadow-md transition-all">
        ${showThumbs ? `
          <div class="relative bg-slate-100 h-48 flex items-center justify-center overflow-hidden">
            ${game.thumb ? `
              <img src="${game.thumb}" alt="${game.name}" class="w-full h-full object-cover hover:scale-105 transition-transform cursor-pointer" onclick="window.open('https://boardgamegeek.com/boardgame/${game.objectid}', '_blank')">
            ` : `
              <div class="text-slate-300 text-4xl"><i class="fa-solid fa-image"></i></div>
            `}
          </div>
        ` : ''}
        
        <div class="p-4">
          <h3 class="font-bold text-lg text-slate-900 mb-1 line-clamp-2 hover:text-indigo-600 cursor-pointer transition-colors" onclick="window.open('https://boardgamegeek.com/boardgame/${game.objectid}', '_blank')">${game.name}</h3>
          
          <div class="text-xs text-slate-500 mb-3 flex items-center gap-1">
            <i class="fa-solid fa-calendar-alt"></i>
            ${game.year || 'Unknown'}
          </div>

          ${showStats ? `
            <div class="flex flex-wrap gap-2 mb-3 text-xs">
              <span class="bg-slate-100 text-slate-700 px-2 py-1 rounded-lg font-semibold">
                <i class="fa-solid fa-users"></i> ${playerRange}
              </span>
              <span class="bg-slate-100 text-slate-700 px-2 py-1 rounded-lg font-semibold">
                <i class="fa-solid fa-clock"></i> ${game.playingtime}m
              </span>
            </div>
          ` : ''}

          <div class="flex gap-2 ${showRating || showBgg ? '' : 'hidden'}">
            ${showRating && game.userRating > 0 ? `
              <div class="flex-1 bg-purple-50 rounded-lg p-2 text-center">
                <div class="text-xs text-slate-600 font-semibold">Your Rating</div>
                <div class="text-lg font-bold text-purple-600">${game.userRating.toFixed(1)}</div>
              </div>
            ` : ''}
            ${showBgg && game.bggRating > 0 ? `
              <div class="flex-1 bg-amber-50 rounded-lg p-2 text-center">
                <div class="text-xs text-slate-600 font-semibold">BGG Rating</div>
                <div class="text-lg font-bold text-amber-600">${game.bggRating.toFixed(2)}</div>
              </div>
            ` : ''}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function updateLoadingStatus(message) {
  document.getElementById('loadingStatus').textContent = message;
}
</script>

<!-- Vercel Web Analytics -->
<script type="module" src="analytics-init.js"></script>
</body>
</html>
