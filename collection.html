<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Board Game Collection</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>📚</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1rem;
            padding-top: env(safe-area-inset-top, 0);
            padding-bottom: env(safe-area-inset-bottom, 0);
            padding-left: max(1rem, env(safe-area-inset-left, 0));
            padding-right: max(1rem, env(safe-area-inset-right, 0));
        }

        .header {
            padding: 1.5rem 0;
            border-bottom: 1px solid #eee;
            background: white;
            margin-bottom: 1.5rem;
        }

        .header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2rem;
            font-weight: 700;
            color: #333;
        }

        .header p {
            margin: 0;
            color: #666;
            font-size: 0.95rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            background: white;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .control-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-group input,
        .control-group select {
            padding: 0.5rem 0.75rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.95rem;
            min-width: 150px;
            -webkit-appearance: none;
            appearance: none;
        }

        .control-group input:focus,
        .control-group select:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn {
            padding: 0.5rem 1rem;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            -webkit-appearance: none;
            appearance: none;
            transition: all 0.2s;
            align-self: flex-end;
        }

        .btn:hover {
            background: #4f46e5;
        }

        .btn:active {
            opacity: 0.9;
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        .status {
            padding: 1rem;
            text-align: center;
            font-weight: 600;
            background: white;
            border-radius: 8px;
            border: 1px solid #eee;
            margin-bottom: 1.5rem;
        }

        .status.loading {
            color: #666;
        }

        .status.success {
            background: #d1fae5;
            color: #065f46;
            border-color: #6ee7b7;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
            border-color: #fecaca;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .game-card {
            background: white;
            border-radius: 12px;
            border: 1px solid #eee;
            overflow: hidden;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            transform: translateY(-4px);
            border-color: #d1d5db;
        }

        .game-card-image {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background: #f0f0f0;
        }

        .game-card-content {
            padding: 1rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .game-card-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0 0 0.5rem 0;
            color: #333;
            line-height: 1.3;
        }

        .game-card-year {
            font-size: 0.85rem;
            color: #999;
            margin-bottom: 0.75rem;
        }

        .game-card-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            font-size: 0.8rem;
        }

        .info-row {
            display: flex;
            gap: 0.3rem;
        }

        .info-label {
            font-weight: 600;
            color: #666;
        }

        .info-value {
            color: #333;
        }

        .game-card-rating {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }

        .rating-stars {
            color: #f59e0b;
            font-size: 1.1rem;
        }

        .game-card-description {
            font-size: 0.8rem;
            color: #666;
            line-height: 1.4;
            margin-bottom: 0.75rem;
            flex: 1;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .game-card-categories,
        .game-card-mechanics {
            margin-bottom: 0.5rem;
        }

        .tag {
            display: inline-block;
            background: #f3f4f6;
            color: #333;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            margin-right: 0.3rem;
            margin-bottom: 0.3rem;
        }

        .tag.category {
            background: #fef3c7;
            color: #92400e;
        }

        .tag.mechanic {
            background: #dbeafe;
            color: #0c4a6e;
        }

        .tag.designer {
            background: #dcfce7;
            color: #166534;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #999;
        }

        .empty-state p {
            margin: 0;
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            .game-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                gap: 1rem;
            }

            .controls {
                flex-direction: column;
            }

            .control-group input,
            .control-group select {
                min-width: auto;
                width: 100%;
            }

            .header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Board Game Collection</h1>
            <p id="collectionInfo"></p>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="usernameInput">Username</label>
                <input type="text" id="usernameInput" placeholder="sportomax" value="sportomax">
            </div>

            <div class="control-group">
                <label for="searchInput">Search Games</label>
                <input type="text" id="searchInput" placeholder="Search by name...">
            </div>

            <div class="control-group">
                <label for="sortSelect">Sort By</label>
                <select id="sortSelect">
                    <option value="name-asc">Name (A-Z)</option>
                    <option value="name-desc">Name (Z-A)</option>
                    <option value="year-desc">Year (Newest)</option>
                    <option value="year-asc">Year (Oldest)</option>
                    <option value="rating-desc">Rating (Highest)</option>
                    <option value="rating-asc">Rating (Lowest)</option>
                    <option value="players-asc">Players (Min)</option>
                    <option value="time-asc">Play Time (Shortest)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="categoryFilter">Category</label>
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                </select>
            </div>

            <div class="control-group">
                <label for="mechanicFilter">Mechanic</label>
                <select id="mechanicFilter">
                    <option value="">All Mechanics</option>
                </select>
            </div>

            <button class="btn" id="loadBtn">🔄 Load Collection</button>
            <button class="btn btn-secondary" id="clearFiltersBtn">Clear Filters</button>
        </div>

        <div class="status" id="status"></div>

        <div class="game-grid" id="gameGrid">
            <div class="empty-state">
                <p>Click "Load Collection" to fetch your games</p>
            </div>
        </div>
    </div>

    <script>
        let allGames = [];
        let filteredGames = [];
        const typeMap = {
            'boardgamecategory': 'category',
            'boardgamemechanic': 'mechanic',
            'boardgamedesigner': 'designer'
        };

        const usernameInput = document.getElementById('usernameInput');
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');
        const categoryFilter = document.getElementById('categoryFilter');
        const mechanicFilter = document.getElementById('mechanicFilter');
        const loadBtn = document.getElementById('loadBtn');
        const clearFiltersBtn = document.getElementById('clearFiltersBtn');
        const gameGrid = document.getElementById('gameGrid');
        const status = document.getElementById('status');
        const collectionInfo = document.getElementById('collectionInfo');

        // Fetch with retry
        async function fetchWithRetry(url, maxRetries = 3) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url);
                    if (response.status === 202) {
                        await new Promise(r => setTimeout(r, 2000 * (i + 1)));
                        continue;
                    }
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response;
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    await new Promise(r => setTimeout(r, 1000 * (i + 1)));
                }
            }
        }

        // Load collection
        loadBtn.addEventListener('click', async () => {
            const username = usernameInput.value.trim();
            if (!username) {
                showStatus('❌ Please enter a username', 'error');
                return;
            }

            allGames = [];
            filteredGames = [];
            showStatus('📦 Loading collection...', 'loading');

            try {
                // Fetch collection
                const collResponse = await fetchWithRetry(
                    `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1`
                );
                const collXml = new DOMParser().parseFromString(await collResponse.text(), 'text/xml');
                const items = Array.from(collXml.querySelectorAll('item'));

                // Extract basic game info
                const gameIds = items.map(item => ({
                    id: item.getAttribute('objectid'),
                    name: item.querySelector('name')?.textContent || 'Unknown'
                })).filter(g => g.id);

                showStatus(`📥 Fetching details for ${gameIds.length} games...`, 'loading');

                // Fetch game details in batches
                const batchSize = 25;
                for (let i = 0; i < gameIds.length; i += batchSize) {
                    const batch = gameIds.slice(i, i + batchSize);
                    const ids = batch.map(g => g.id).join(',');

                    try {
                        const response = await fetchWithRetry(
                            `/api/bgg-helper?endpoint=thing&id=${ids}&type=boardgame`
                        );
                        const xml = new DOMParser().parseFromString(await response.text(), 'text/xml');
                        const things = xml.querySelectorAll('item[type="boardgame"]');

                        Array.from(things).forEach(item => {
                            const game = {
                                id: item.getAttribute('id'),
                                name: item.querySelector('name[type="primary"]')?.getAttribute('value') || 'Unknown',
                                image: item.querySelector('image')?.textContent || '',
                                thumbnail: item.querySelector('thumbnail')?.textContent || '',
                                description: item.querySelector('description')?.textContent || '',
                                yearPublished: parseInt(item.querySelector('yearpublished')?.textContent) || 0,
                                minPlayers: parseInt(item.querySelector('minplayers')?.textContent) || 0,
                                maxPlayers: parseInt(item.querySelector('maxplayers')?.textContent) || 0,
                                playingTime: parseInt(item.querySelector('playingtime')?.textContent) || 0,
                                minPlayTime: parseInt(item.querySelector('minplaytime')?.textContent) || 0,
                                maxPlayTime: parseInt(item.querySelector('maxplaytime')?.textContent) || 0,
                                averageRating: parseFloat(item.querySelector('average')?.textContent) || 0,
                                categories: [],
                                mechanics: [],
                                designers: [],
                                artists: []
                            };

                            // Extract categories and mechanics
                            item.querySelectorAll('link[type="boardgamecategory"]').forEach(link => {
                                game.categories.push(link.getAttribute('value'));
                            });
                            item.querySelectorAll('link[type="boardgamemechanic"]').forEach(link => {
                                game.mechanics.push(link.getAttribute('value'));
                            });
                            item.querySelectorAll('link[type="boardgamedesigner"]').forEach(link => {
                                game.designers.push(link.getAttribute('value'));
                            });
                            item.querySelectorAll('link[type="boardgameartist"]').forEach(link => {
                                game.artists.push(link.getAttribute('value'));
                            });

                            allGames.push(game);
                        });

                        showStatus(`📥 Loaded ${allGames.length}/${gameIds.length} games...`, 'loading');
                    } catch (error) {
                        console.error(`Error loading batch ${i}:`, error);
                    }

                    await new Promise(r => setTimeout(r, 200));
                }

                filteredGames = [...allGames];
                populateFilters();
                renderGames();
                showStatus(`✅ Loaded ${allGames.length} games!`, 'success');
                collectionInfo.textContent = `${allGames.length} games in collection`;

            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, 'error');
                console.error('Error:', error);
            }
        });

        // Populate filter dropdowns
        function populateFilters() {
            const categories = new Set();
            const mechanics = new Set();

            allGames.forEach(game => {
                game.categories.forEach(c => categories.add(c));
                game.mechanics.forEach(m => mechanics.add(m));
            });

            const categoriesList = Array.from(categories).sort();
            const mechanicsList = Array.from(mechanics).sort();

            categoryFilter.innerHTML = '<option value="">All Categories</option>' +
                categoriesList.map(c => `<option value="${c}">${escapeHtml(c)}</option>`).join('');

            mechanicFilter.innerHTML = '<option value="">All Mechanics</option>' +
                mechanicsList.map(m => `<option value="${m}">${escapeHtml(m)}</option>`).join('');
        }

        // Apply filters and sorting
        function applyFiltersAndSort() {
            filteredGames = allGames.filter(game => {
                const searchTerm = searchInput.value.toLowerCase();
                const nameMatch = game.name.toLowerCase().includes(searchTerm);
                const categoryMatch = !categoryFilter.value || game.categories.includes(categoryFilter.value);
                const mechanicMatch = !mechanicFilter.value || game.mechanics.includes(mechanicFilter.value);

                return nameMatch && categoryMatch && mechanicMatch;
            });

            // Sort
            const [sortField, sortDir] = sortSelect.value.split('-');
            filteredGames.sort((a, b) => {
                let aVal, bVal;
                switch (sortField) {
                    case 'name':
                        aVal = a.name.toLowerCase();
                        bVal = b.name.toLowerCase();
                        break;
                    case 'year':
                        aVal = a.yearPublished;
                        bVal = b.yearPublished;
                        break;
                    case 'rating':
                        aVal = a.averageRating;
                        bVal = b.averageRating;
                        break;
                    case 'players':
                        aVal = a.minPlayers;
                        bVal = b.minPlayers;
                        break;
                    case 'time':
                        aVal = a.minPlayTime || a.playingTime;
                        bVal = b.minPlayTime || b.playingTime;
                        break;
                    default:
                        return 0;
                }

                if (aVal < bVal) return sortDir === 'asc' ? -1 : 1;
                if (aVal > bVal) return sortDir === 'asc' ? 1 : -1;
                return 0;
            });

            renderGames();
        }

        // Render games
        function renderGames() {
            if (filteredGames.length === 0) {
                gameGrid.innerHTML = '<div class="empty-state"><p>No games found</p></div>';
                return;
            }

            gameGrid.innerHTML = filteredGames.map(game => `
                <div class="game-card">
                    <img src="${game.image || game.thumbnail || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 300%22%3E%3Crect fill=%22%23f0f0f0%22 width=%22200%22 height=%22300%22/%3E%3C/svg%3E'}" 
                         alt="${escapeHtml(game.name)}" class="game-card-image" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 300%22%3E%3Crect fill=%22%23f0f0f0%22 width=%22200%22 height=%22300%22/%3E%3C/svg%3E'">
                    <div class="game-card-content">
                        <h3 class="game-card-title">${escapeHtml(game.name)}</h3>
                        <div class="game-card-year">${game.yearPublished || 'N/A'}</div>

                        <div class="game-card-info">
                            <div class="info-row">
                                <span class="info-label">Players:</span>
                                <span class="info-value">${game.minPlayers}-${game.maxPlayers}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Time:</span>
                                <span class="info-value">${game.minPlayTime || game.playingTime}'</span>
                            </div>
                        </div>

                        ${game.averageRating ? `
                        <div class="game-card-rating">
                            <span class="rating-stars">${getRatingStars(game.averageRating)}</span>
                            <span>${game.averageRating.toFixed(1)}/10</span>
                        </div>
                        ` : ''}

                        ${game.description ? `<p class="game-card-description">${escapeHtml(game.description.substring(0, 150))}</p>` : ''}

                        ${game.categories.length > 0 ? `
                        <div class="game-card-categories">
                            ${game.categories.map(c => `<span class="tag category">${escapeHtml(c)}</span>`).join('')}
                        </div>
                        ` : ''}

                        ${game.mechanics.length > 0 ? `
                        <div class="game-card-mechanics">
                            ${game.mechanics.map(m => `<span class="tag mechanic">${escapeHtml(m)}</span>`).join('')}
                        </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        // Event listeners
        searchInput.addEventListener('input', applyFiltersAndSort);
        sortSelect.addEventListener('change', applyFiltersAndSort);
        categoryFilter.addEventListener('change', applyFiltersAndSort);
        mechanicFilter.addEventListener('change', applyFiltersAndSort);

        clearFiltersBtn.addEventListener('click', () => {
            searchInput.value = '';
            sortSelect.value = 'name-asc';
            categoryFilter.value = '';
            mechanicFilter.value = '';
            applyFiltersAndSort();
        });

        // Utilities
        function showStatus(message, type) {
            status.textContent = message;
            status.className = `status ${type}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getRatingStars(rating) {
            const stars = Math.round(rating / 2);
            return '★'.repeat(stars) + '☆'.repeat(5 - stars);
        }

        // Load default on startup
        window.addEventListener('load', () => {
            usernameInput.focus();
        });
    </script>
</body>
</html>
