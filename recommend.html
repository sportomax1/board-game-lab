<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>BGG Recommend Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    
    :root {
      --primary: #6366f1;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .dragging { opacity: 0.3; transform: scale(0.9); }
    .drop-target { border: 2px dashed var(--primary) !important; }
    .no-select { user-select: none; }
    
    .img-zoom { object-fit: cover; }
    .img-contain { object-fit: contain; }

    .tab-button {
      position: relative;
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      color: #64748b;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-button.active {
      color: #6366f1;
    }

    .tab-button.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: #6366f1;
      border-radius: 3px 3px 0 0;
    }

    .tab-button:hover:not(.active) {
      color: #475569;
      background: rgba(100, 116, 139, 0.05);
    }

    .tab-button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Shelfie View Styles */
    .shelf-container {
      perspective: 1000px;
    }
    .shelf-item {
      transform: rotateY(-15deg) rotateX(5deg);
      box-shadow: -5px 5px 15px rgba(0,0,0,0.5);
      transition: transform 0.3s ease;
    }
    .shelf-item:hover {
      transform: rotateY(0deg) rotateX(0deg) scale(1.05);
    }
    .wood-floor {
      background: linear-gradient(to bottom, #4a2c2a 0%, #2a1817 100%);
      border-bottom: 12px solid #1a0f0e;
    }
    
    /* Footer action (Save / Copy) */
    .footer-action {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 48px); max-width: 720px; display: flex; gap: 12px; z-index: 60;
      padding: 8px; border-radius: 14px; background: rgba(255,255,255,0.9); box-shadow: 0 12px 40px rgba(2,6,23,0.16);
      border: 1px solid rgba(15,23,42,0.06);
    }

    .cta-btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 14px 18px; font-weight: 700; font-size: 16px; border-radius: 12px; cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease, opacity 120ms ease;
      box-shadow: 0 8px 24px rgba(99,102,241,0.12);
      border: none; color: white;
    }

    .cta-btn:active { transform: translateY(1px) scale(0.998); }
    .cta-btn:disabled { opacity: 0.6; cursor: not-allowed; box-shadow: none; }

    .cta-btn.primary { background: linear-gradient(90deg,#10b981,#059669); }
    .cta-btn.secondary { background: linear-gradient(90deg,#6366f1,#4f46e5); }

    .cta-icon {
      display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 10px;
      background: rgba(255,255,255,0.12); box-shadow: inset 0 -1px 0 rgba(0,0,0,0.06);
    }

    /* thumbnail hover affordance */
    .thumb-clickable { cursor: pointer; transition: transform 150ms ease, box-shadow 150ms ease; }
    .thumb-clickable:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(2,6,23,0.12); }
    .filter-quick {
      display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px;
      border-radius: 6px; font-size: 12px; border: none; cursor: pointer; margin-left: 8px;
      background: rgba(15,23,42,0.04);
    }
    .filter-quick.select { color: #059669; }
    .filter-quick.clear { color: #ef4444; }
    .rank-badge { display:inline-block; background: rgba(99,102,241,0.1); color: #4f46e5; font-weight:700; padding:2px 8px; border-radius:999px; font-size:12px; margin-left:8px; }
    
    .modal-backdrop {
      backdrop-filter: blur(4px);
      animation: fadeIn 0.2s ease-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .modal-content-animate {
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    @keyframes slideUp {
      from { 
        opacity: 0;
        transform: translateY(20px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>
<body class="pb-32">

  <header class="sticky top-0 z-30 w-full glass-card border-b px-6 py-4 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-3">
      <div class="bg-indigo-600 text-white p-2 rounded-lg">
        <i class="fa-solid fa-star"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-tight">BGG Recommend</h1>
        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Game Recommendation Suite</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span id="selectedCount" class="text-[10px] font-bold px-2 py-1 rounded bg-slate-100 text-slate-600 uppercase">0 Selected</span>
      <div id="progressStatus" class="text-sm font-semibold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full hidden">
        <i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Loading...
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">
    
    <!-- Tab Navigation -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="flex border-b border-slate-100">
        <button class="tab-button active" onclick="switchTab(0)" id="tab-0">
          <i class="fa-solid fa-cog mr-2"></i>Settings
        </button>
        <button class="tab-button" onclick="switchTab(1)" id="tab-1" disabled>
          <i class="fa-solid fa-check-square mr-2"></i>Selection
        </button>
        <button class="tab-button" onclick="switchTab(2)" id="tab-2" disabled>
          <i class="fa-solid fa-share-alt mr-2"></i>Review & Share
        </button>
      </div>

      <!-- Tab 1: Settings -->
      <div class="tab-content active p-6" id="content-0">
        <h2 class="text-2xl font-bold mb-4">Fetch Collection</h2>
        <div class="space-y-4">
          <div class="space-y-2">
            <label class="text-xs font-bold text-slate-500 uppercase">BGG Username</label>
            <input id="username" type="text" value="sportomax" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
          </div>

          <div class="space-y-2">
            <div class="flex justify-between items-end">
              <label class="text-xs font-bold text-slate-500 uppercase">Collection Status Filters</label>
              <div class="flex gap-2">
                <button onclick="toggleAllFilters(true)" class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded hover:bg-indigo-100" title="Check all filters">Select All</button>
                <button onclick="toggleAllFilters(false)" class="text-[10px] font-bold text-slate-500 bg-slate-100 px-2 py-1 rounded hover:bg-slate-200" title="Uncheck all filters">None</button>
              </div>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
              <label class="flex items-center gap-2 cursor-pointer bg-white p-2 rounded-lg border border-slate-200 hover:bg-slate-50 transition-colors">
                  <input type="checkbox" id="filter-own" checked onchange="filterCollectionRealtime()" class="w-4 h-4 rounded text-indigo-600">
                  <span class="text-xs font-bold text-slate-700">Own</span>
                </label>
              <label class="flex items-center gap-2 cursor-pointer bg-white p-2 rounded-lg border border-slate-200 hover:bg-slate-50 transition-colors">
                <input type="checkbox" id="filter-prevowned" onchange="filterCollectionRealtime()" class="w-4 h-4 rounded text-indigo-600">
                <span class="text-xs font-bold text-slate-700">Prev. Owned</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer bg-white p-2 rounded-lg border border-slate-200 hover:bg-slate-50 transition-colors">
                <input type="checkbox" id="filter-fortrade" onchange="filterCollectionRealtime()" class="w-4 h-4 rounded text-indigo-600">
                <span class="text-xs font-bold text-slate-700">For Trade</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer bg-white p-2 rounded-lg border border-slate-200 hover:bg-slate-50 transition-colors">
                <input type="checkbox" id="filter-want" onchange="filterCollectionRealtime()" class="w-4 h-4 rounded text-indigo-600">
                <span class="text-xs font-bold text-slate-700">Want</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer bg-white p-2 rounded-lg border border-slate-200 hover:bg-slate-50 transition-colors">
                <input type="checkbox" id="filter-wanttoplay" onchange="filterCollectionRealtime()" class="w-4 h-4 rounded text-indigo-600">
                <span class="text-xs font-bold text-slate-700">Want to Play</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer bg-white p-2 rounded-lg border border-slate-200 hover:bg-slate-50 transition-colors">
                <input type="checkbox" id="filter-wanttobuy" onchange="filterCollectionRealtime()" class="w-4 h-4 rounded text-indigo-600">
                <span class="text-xs font-bold text-slate-700">Want to Buy</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer bg-white p-2 rounded-lg border border-slate-200 hover:bg-slate-50 transition-colors">
                <input type="checkbox" id="filter-wishlist" onchange="filterCollectionRealtime()" class="w-4 h-4 rounded text-indigo-600">
                <span class="text-xs font-bold text-slate-700">Wishlist</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer bg-white p-2 rounded-lg border border-slate-200 hover:bg-slate-50 transition-colors">
                <input type="checkbox" id="filter-preordered" onchange="filterCollectionRealtime()" class="w-4 h-4 rounded text-indigo-600">
                <span class="text-xs font-bold text-slate-700">Preordered</span>
              </label>
            </div>
          </div>
          
          <button onclick="fetchCollection()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold hover:bg-indigo-700 shadow-lg shadow-indigo-100 flex items-center justify-center gap-2">
            <i class="fa-solid fa-download"></i> Fetch Collection
          </button>
          
          <button id="viewXmlBtn" onclick="openXmlModal()" class="w-full bg-slate-600 text-white py-3 rounded-xl font-bold hover:bg-slate-700 shadow-lg shadow-slate-100 flex items-center justify-center gap-2 mt-3 hidden">
            <i class="fa-solid fa-code"></i> View XML Response
          </button>
        </div>
      </div>

      <!-- Tab 2: Selection -->
      <div class="tab-content p-6" id="content-1">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-2xl font-bold">Select Games</h2>
          <div class="flex gap-2">
            <button onclick="selectAll()" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-2 rounded-lg hover:bg-indigo-100 transition-colors">
              <i class="fa-solid fa-check-double mr-1"></i> Select All
            </button>
            <button onclick="deselectAll()" class="text-xs font-bold text-slate-600 bg-slate-50 px-3 py-2 rounded-lg hover:bg-slate-100 transition-colors">
              <i class="fa-solid fa-times mr-1"></i> Deselect All
            </button>
          </div>
        </div>
        
        <div class="mb-4 space-y-3">
          <div class="flex gap-3">
            <input type="text" id="searchInput" placeholder="Search games..." 
              oninput="filterGames()" 
              class="flex-1 px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
            
            <select id="sortSelect" onchange="sortAndRender()" 
              aria-label="Sort games by"
              class="px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all bg-white font-medium text-sm">
              <option value="rating">Sort by User Rating</option>
              <option value="average">Sort by BGG Average</option>
              <option value="plays">Sort by Number of Plays</option>
              <option value="numowned">Sort by # Owned</option>
              <option value="bggRank">Sort by BGG Rank</option>
              <option value="year">Sort by Year Published</option>
              <option value="name">Sort by Name</option>
            </select>
          </div>
          
          <div class="flex gap-3 items-center">
            <label class="text-xs font-bold text-slate-500 uppercase">Show:</label>
            <select id="selectionFilter" onchange="renderGameList()" 
              class="px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all bg-white font-medium text-sm">
              <option value="all">All Games</option>
              <option value="selected">Selected Only</option>
              <option value="notselected">Not Selected Only</option>
            </select>
          </div>
        </div>

        <div id="gameList" class="space-y-2 max-h-[500px] overflow-y-auto">
          <!-- Game items will be populated here -->
        </div>

        <button onclick="proceedToReview()" class="mt-6 w-full bg-indigo-600 text-white py-4 rounded-xl font-bold hover:bg-indigo-700 shadow-lg shadow-indigo-100 flex items-center justify-center gap-2">
          <i class="fa-solid fa-arrow-right"></i> Proceed to Review
        </button>
      </div>

      <!-- Tab 3: Review & Share -->
      <div class="tab-content p-6" id="content-2">
        <h2 class="text-2xl font-bold mb-4">Review & Share</h2>
        
        <div class="flex flex-wrap items-center justify-between gap-4 bg-slate-50 p-4 rounded-xl mb-6">
          <div class="flex items-center gap-6">
            <div class="flex flex-col">
              <label class="text-[10px] font-bold text-slate-400 uppercase">Layout</label>
              <select id="layoutSelect" onchange="renderRecommendations()" class="text-sm font-bold outline-none bg-transparent py-1">
                <option value="grid9">Grid 3x3 (Top 9)</option>
                <option value="grid25">Grid 5x5 (Top 25)</option>
                <option value="grid100">Grid 10x10 (Top 100)</option>
                <option value="shelfie">Shelfie View (Top 10)</option>
                <option value="list10">List Mode (Top 10)</option>
                <option value="list50">List Mode (Top 50)</option>
                <option value="list100">List Mode (Top 100)</option>
                <option value="listAll">List All Selected</option>
                <option value="namesRank">Names Only (Rank Order)</option>
                <option value="namesAlpha">Names Only (A-Z)</option>
              </select>
            </div>
            <div class="flex flex-col">
              <label class="text-[10px] font-bold text-slate-400 uppercase">Canvas Color</label>
              <div class="flex gap-2 mt-1">
                  <input type="color" id="bgColor" value="#0f172a" onchange="renderRecommendations()" class="w-6 h-6 rounded border-none cursor-pointer">
                  <input type="color" id="accentColor" value="#6366f1" onchange="renderRecommendations()" class="w-6 h-6 rounded border-none cursor-pointer">
              </div>
            </div>
          </div>

          <div class="flex flex-wrap items-center gap-x-6 gap-y-2">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" id="showNames" checked onchange="renderRecommendations()" class="w-4 h-4 rounded text-indigo-600">
              <span class="text-xs font-bold text-slate-600">Names</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" id="showRanks" checked onchange="renderRecommendations()" class="w-4 h-4 rounded text-indigo-600">
              <span class="text-xs font-bold text-slate-600">Ranks</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" id="zoomImages" onchange="renderRecommendations()" class="w-4 h-4 rounded text-indigo-600">
              <span class="text-xs font-bold text-slate-600">Zoom</span>
            </label>
            <button onclick="exportCSV()" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-lg hover:bg-indigo-100 transition-colors">
              <i class="fa-solid fa-download mr-1"></i> CSV
            </button>
            <button onclick="copyNamesList()" class="text-xs font-bold text-slate-600 bg-slate-50 px-3 py-1 rounded-lg hover:bg-slate-100 transition-colors">
              <i class="fa-solid fa-copy mr-1"></i> Copy Names
            </button>
          </div>
        </div>

        <div id="previewCanvas" class="rounded-3xl p-6 md:p-10 shadow-2xl relative min-h-[400px] transition-colors overflow-hidden">
          <div id="thumbs" class="no-select mx-auto"></div>
          <div class="mt-8 flex justify-center">
              <span class="text-[10px] text-slate-400 font-bold tracking-widest uppercase">Drag items to reorder directly in the grid</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footerAction" class="footer-action hidden">
    <button onclick="composeAndDownload()" class="cta-btn primary" title="Save image to disk">
      <span class="cta-icon"><i class="fa-solid fa-camera"></i></span>
      <span>Save</span>
    </button>
    <button id="copyBtn" onclick="composeAndCopy()" class="cta-btn secondary" title="Copy image to clipboard">
      <span class="cta-icon"><i class="fa-solid fa-copy"></i></span>
      <span>Copy</span>
    </button>
  </div>

  <!-- Copy Names Modal -->
  <div id="copyNamesModal" class="hidden fixed inset-0 z-[100] modal-backdrop bg-black/40 items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full modal-content-animate">
      <div class="bg-indigo-600 text-white px-6 py-4 rounded-t-2xl">
        <h3 class="font-bold text-lg">Copy Game Names</h3>
      </div>
      <div class="p-6">
        <p class="text-sm text-slate-600 mb-4">Choose the order for copying game names:</p>
        <div class="space-y-3">
          <button onclick="copyNamesInOrder('rank')" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition-colors">
            <i class="fa-solid fa-list-ol mr-2"></i>Copy in Rank Order
          </button>
          <button onclick="copyNamesInOrder('alpha')" class="w-full bg-slate-600 text-white py-3 rounded-xl font-bold hover:bg-slate-700 transition-colors">
            <i class="fa-solid fa-sort-alpha-down mr-2"></i>Copy Alphabetically
          </button>
          <button onclick="closeCopyNamesModal()" class="w-full bg-slate-200 text-slate-700 py-3 rounded-xl font-bold hover:bg-slate-300 transition-colors">
            Cancel
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- XML Response Modal -->
  <div id="xmlModal" class="hidden fixed inset-0 z-[100] modal-backdrop bg-black/40 items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-hidden modal-content-animate flex flex-col">
      <div class="bg-slate-800 text-white px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-code"></i>
          <h3 class="font-bold text-lg">XML Response</h3>
        </div>
        <button onclick="closeXmlModal()" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/20 transition-colors">
          <i class="fa-solid fa-times"></i>
        </button>
      </div>
      <div class="px-6 pt-4 pb-2 bg-white border-b border-slate-200">
        <div class="relative">
          <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input 
            type="text" 
            id="xmlSearchInput" 
            placeholder="Search XML content..." 
            oninput="searchXml()"
            class="w-full pl-10 pr-10 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-sm"
          >
          <button 
            onclick="clearXmlSearch()" 
            id="xmlSearchClear"
            class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors"
          >
            <i class="fa-solid fa-times"></i>
          </button>
        </div>
        <div id="xmlSearchResults" class="text-xs text-slate-500 mt-2 hidden"></div>
      </div>
      <div class="p-6 overflow-auto flex-1 bg-slate-50" style="scroll-behavior: smooth;">
        <pre id="xmlContent" class="text-xs font-mono bg-white border border-slate-200 rounded-lg p-4 whitespace-pre-wrap break-words" style="will-change: scroll-position;"></pre>
      </div>
    </div>
  </div>

<script>
let collectionGames = [];
let activeGames = [];
let selectedGames = [];
let currentTab = 0;
let draggedIndex = null;
let lastXmlResponse = '';

// Helper function to get image proxy URL
function getProxyImageUrl(thumbUrl) {
  if (!thumbUrl) return 'https://via.placeholder.com/300?text=?';
  return `/api/image-proxy?url=${encodeURIComponent(thumbUrl)}`;
}

function switchTab(tabIndex) {
  // Hide all tabs
  for (let i = 0; i < 3; i++) {
    document.getElementById(`content-${i}`).classList.remove('active');
    document.getElementById(`tab-${i}`).classList.remove('active');
  }
  
  // Show selected tab
  document.getElementById(`content-${tabIndex}`).classList.add('active');
  document.getElementById(`tab-${tabIndex}`).classList.add('active');
  currentTab = tabIndex;

  // Show/hide footer action buttons
  const footerAction = document.getElementById('footerAction');
  if (tabIndex === 2) {
    renderRecommendations();
  } else {
    footerAction.classList.add('hidden');
  }
}

async function fetchCollection() {
  const username = document.getElementById('username').value.trim() || 'sportomax';
  const progressStatus = document.getElementById('progressStatus');
  progressStatus.classList.remove('hidden');
  
  try {
    // Fetch full collection with stats (no own=1 filter)
    const collXml = await fetchAPI('collection', username, '&stats=1');
    lastXmlResponse = collXml;
    document.getElementById('viewXmlBtn').classList.remove('hidden');
    const doc = new DOMParser().parseFromString(collXml, 'text/xml');
    const items = Array.from(doc.querySelectorAll('item'));
    
    collectionGames = items.map(item => {
      const name = item.querySelector('name')?.textContent?.trim() || '';
      const objectid = item.getAttribute('objectid') || '';
      const thumb = item.querySelector('thumbnail')?.textContent || item.querySelector('image')?.textContent || '';
      const rating = item.querySelector('stats rating[value]')?.getAttribute('value') || 'N/A';
      const average = item.querySelector('stats rating average')?.getAttribute('value') || 'N/A';
      const year = item.querySelector('yearpublished')?.textContent || '';
      const numplays = parseInt(item.querySelector('numplays')?.textContent || '0');
      const numowned = parseInt(item.querySelector('stats')?.getAttribute('numowned') || '0');

      // extract BGG rank (boardgame subtype)
      let bggRank = null;
      try {
        const ranks = item.querySelectorAll('ranks rank');
        ranks.forEach(r => {
          const nameAttr = r.getAttribute('name') || '';
          const typeAttr = r.getAttribute('type') || '';
          // prefer rank where name="boardgame" or type="subtype"
          if ((nameAttr.toLowerCase() === 'boardgame' || typeAttr.toLowerCase() === 'subtype') && !bggRank) {
            const v = r.getAttribute('value');
            if (v && v !== 'Not Ranked') bggRank = parseInt(v);
          }
        });
      } catch (e) { bggRank = null; }
      
      const statusNode = item.querySelector('status');
      const status = {
        own: statusNode?.getAttribute('own') === '1',
        prevowned: statusNode?.getAttribute('prevowned') === '1',
        fortrade: statusNode?.getAttribute('fortrade') === '1',
        want: statusNode?.getAttribute('want') === '1',
        wanttoplay: statusNode?.getAttribute('wanttoplay') === '1',
        wanttobuy: statusNode?.getAttribute('wanttobuy') === '1',
        wishlist: statusNode?.getAttribute('wishlist') === '1',
        preordered: statusNode?.getAttribute('preordered') === '1'
      };
      
      return { name, objectid, thumb, rating, average, year, numplays, numowned, bggRank, status, selected: false };
    }).filter(game => game.name);
    
    // Apply filters and sort
    filterCollection();
    
    // Enable selection tab
    document.getElementById('tab-1').disabled = false;
    progressStatus.classList.add('hidden');
    
    // Switch to selection tab
    switchTab(1);
    
  } catch (e) {
    console.error(e);
    progressStatus.classList.add('hidden');
    alert('Failed to fetch collection. Please try again.');
  }
}

function filterCollectionRealtime() {
  filterCollection();
  if (currentTab === 1) {
    renderGameList();
  }
}

function filterCollection() {
  const filters = {
    own: document.getElementById('filter-own').checked,
    prevowned: document.getElementById('filter-prevowned').checked,
    fortrade: document.getElementById('filter-fortrade').checked,
    want: document.getElementById('filter-want').checked,
    wanttoplay: document.getElementById('filter-wanttoplay').checked,
    wanttobuy: document.getElementById('filter-wanttobuy').checked,
    wishlist: document.getElementById('filter-wishlist').checked,
    preordered: document.getElementById('filter-preordered').checked
  };

  const hasAnyFilter = Object.values(filters).some(v => v);
  
  if (!hasAnyFilter) {
    // If no filters selected, show nothing (or could show all, but usually filters are additive)
    // Let's show nothing to encourage selecting a filter, or maybe show all?
    // User said "add collection stattus flag filters to apply".
    // Let's assume if nothing is checked, we show nothing.
    activeGames = [];
  } else {
    activeGames = collectionGames.filter(game => {
      if (filters.own && game.status.own) return true;
      if (filters.prevowned && game.status.prevowned) return true;
      if (filters.fortrade && game.status.fortrade) return true;
      if (filters.want && game.status.want) return true;
      if (filters.wanttoplay && game.status.wanttoplay) return true;
      if (filters.wanttobuy && game.status.wanttobuy) return true;
      if (filters.wishlist && game.status.wishlist) return true;
      if (filters.preordered && game.status.preordered) return true;
      return false;
    });
  }
  
  sortAndRender();
}

function toggleAllFilters(checked) {
  const ids = ['filter-own', 'filter-prevowned', 'filter-fortrade', 'filter-want', 'filter-wanttoplay', 'filter-wanttobuy', 'filter-wishlist', 'filter-preordered'];
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.checked = checked;
  });
  filterCollectionRealtime();
}

function sortGames() {
  const sortBy = document.getElementById('sortSelect').value || 'rating';
  
  activeGames.sort((a, b) => {
    if (sortBy === 'rating') {
      // Sort by user rating (descending)
      const ratingA = parseFloat(a.rating);
      const ratingB = parseFloat(b.rating);
      if (isNaN(ratingA)) return 1;
      if (isNaN(ratingB)) return -1;
      return ratingB - ratingA;
    } else if (sortBy === 'average') {
      // Sort by BGG average rating (descending)
      const avgA = parseFloat(a.average);
      const avgB = parseFloat(b.average);
      if (isNaN(avgA)) return 1;
      if (isNaN(avgB)) return -1;
      return avgB - avgA;
    } else if (sortBy === 'plays') {
      // Sort by number of plays (descending)
      return b.numplays - a.numplays;
    } else if (sortBy === 'numowned') {
      // Sort by number owned (descending)
      return b.numowned - a.numowned;
    } else if (sortBy === 'bggRank') {
      // Sort by BGG rank (ascending: 1 = best). Undefined ranks go last.
      const ra = (typeof a.bggRank === 'number') ? a.bggRank : Infinity;
      const rb = (typeof b.bggRank === 'number') ? b.bggRank : Infinity;
      return ra - rb;
    } else if (sortBy === 'year') {
      // Sort by year published (descending, newest first)
      const yearA = parseInt(a.year);
      const yearB = parseInt(b.year);
      if (isNaN(yearA)) return 1;
      if (isNaN(yearB)) return -1;
      return yearB - yearA;
    } else if (sortBy === 'name') {
      // Sort by name (ascending, alphabetical)
      return a.name.localeCompare(b.name);
    }
    return 0;
  });
}

function sortAndRender() {

function setupDragEvents(wrapper, idx) {
  wrapper.addEventListener('dragstart', (e) => { draggedIndex = idx; e.currentTarget.classList.add('dragging'); });
  wrapper.addEventListener('dragend', (e) => { e.currentTarget.classList.remove('dragging'); document.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target')); });
  wrapper.addEventListener('dragover', (e) => { e.preventDefault(); wrapper.classList.add('drop-target'); });
  wrapper.addEventListener('dragleave', () => wrapper.classList.remove('drop-target'));
  wrapper.addEventListener('drop', (e) => {
    e.preventDefault();
    if (draggedIndex === null || draggedIndex === idx) return;
    const item = selectedGames.splice(draggedIndex, 1)[0];
    selectedGames.splice(idx, 0, item);
    renderRecommendations();
  });
}

async function getComposedCanvas() {
  const layout = document.getElementById('layoutSelect').value;
  const showNames = document.getElementById('showNames').checked;
  const showRanks = document.getElementById('showRanks').checked;
  const zoom = document.getElementById('zoomImages').checked;
  const bgColor = document.getElementById('bgColor').value;
  
  let limit = 25;
  if (layout === 'grid9') limit = 9;
  else if (layout === 'grid100') limit = 100;
  else if (layout === 'shelfie') limit = 10;
  else if (layout.startsWith('list')) limit = layout === 'listAll' ? selectedGames.length : parseInt(layout.replace('list', ''));
  
  const list = selectedGames.slice(0, limit);
  let cols = 1, rows = 1, tile = 400;
  let isList = layout.startsWith('list');
  let isShelf = (layout === 'shelfie');

  if (layout === 'grid9') { cols = 3; rows = 3; }
  else if (layout === 'grid25') { cols = 5; rows = 5; }
  else if (layout === 'grid100') { cols = 10; rows = 10; tile = 200; }
  else if (isShelf) { cols = 5; rows = 2; tile = 350; }
  else if (isList) { cols = 1; rows = list.length; tile = 160; }

  const canvas = document.createElement('canvas');
  canvas.width = isList ? 1200 : cols * tile;
  canvas.height = rows * tile;
  
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const images = await Promise.all(list.map(game => {
    return loadImage(getProxyImageUrl(game.thumb));
  }));
  
  images.forEach((img, i) => {
    const c = i % cols;
    const r = Math.floor(i / cols);
    const x = c * tile;
    const y = r * tile;
    
    if (img) {
      if (isShelf) {
        ctx.fillStyle = '#1a0f0e';
        ctx.fillRect(x, y + tile - 20, tile, 20);
        ctx.save();
        ctx.shadowBlur = 20;
        ctx.shadowColor = 'black';
        const boxW = tile * 0.7;
        const boxH = tile * 0.85;
        const bx = x + (tile - boxW) / 2;
        const by = y + (tile - boxH) - 20;
        ctx.drawImage(img, bx, by, boxW, boxH);
        ctx.restore();
        if (showRanks) {
          ctx.fillStyle = 'rgba(255,255,255,0.3)';
          ctx.font = '24px sans-serif';
          ctx.fillText(i + 1, bx + 5, by + 25);
        }
      } else if (isList) {
        const size = tile - 30;
        if (zoom) {
          const scale = Math.max(size / img.width, size / img.height);
          const dw = img.width * scale, dh = img.height * scale;
          ctx.save();
          ctx.beginPath();
          // Use arc-based rounded corners for broader browser support
          // roundRect() is not supported in Safari < 16 and older browsers
          const x1 = 15, y1 = y + 15, radius = 20;
          ctx.moveTo(x1 + radius, y1);
          ctx.lineTo(x1 + size - radius, y1);
          ctx.arcTo(x1 + size, y1, x1 + size, y1 + radius, radius);
          ctx.lineTo(x1 + size, y1 + size - radius);
          ctx.arcTo(x1 + size, y1 + size, x1 + size - radius, y1 + size, radius);
          ctx.lineTo(x1 + radius, y1 + size);
          ctx.arcTo(x1, y1 + size, x1, y1 + size - radius, radius);
          ctx.lineTo(x1, y1 + radius);
          ctx.arcTo(x1, y1, x1 + radius, y1, radius);
          ctx.closePath();
          ctx.clip();
          ctx.drawImage(img, 15 + (size - dw) / 2, y + 15 + (size - dh) / 2, dw, dh);
          ctx.restore();
        } else {
          const aspect = img.width / img.height;
          let dw = size, dh = size;
          if (aspect > 1) dh = size / aspect;
          else dw = size * aspect;
          ctx.drawImage(img, 15 + (size - dw) / 2, y + 15 + (size - dh) / 2, dw, dh);
        }
        ctx.fillStyle = '#ffffff';
        ctx.font = `bold 42px sans-serif`;
        ctx.textAlign = 'left';
        let txt = "";
        if (showRanks) txt += `#${i + 1} `;
        if (showNames) txt += list[i].name;
        ctx.fillText(txt, tile + 30, y + (tile / 2) + 15);
      } else {
        const aspect = img.width / img.height;
        let dw = tile, dh = tile;
        if (zoom) {
          const scale = Math.max(tile / img.width, tile / img.height);
          dw = img.width * scale;
          dh = img.height * scale;
          ctx.drawImage(img, x + (tile - dw) / 2, y + (tile - dh) / 2, dw, dh);
        } else {
          if (aspect > 1) dh = tile / aspect;
          else dw = tile * aspect;
          ctx.drawImage(img, x + (tile - dw) / 2, y + (tile - dh) / 2, dw, dh);
        }
        if (showRanks) {
          const fontSize = layout === 'grid100' ? 24 : 30;
          ctx.fillStyle = 'rgba(0,0,0,0.7)';
          ctx.fillRect(x + 5, y + 5, fontSize * 2, fontSize * 2);
          ctx.fillStyle = 'white';
          ctx.font = `bold ${fontSize}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillText(i + 1, x + fontSize + 5, y + fontSize + 15);
        }
        if (showNames && layout !== 'grid100') {
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(x, y + tile - 50, tile, 50);
          ctx.fillStyle = 'white';
          ctx.font = '20px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(list[i].name, x + tile / 2, y + tile - 18);
        }
      }
    }
  });
  return canvas;
}

async function composeAndCopy() {
  const btn = document.getElementById('copyBtn');
  const originalText = btn.innerHTML;
  try {
    const canvas = await getComposedCanvas();
    canvas.toBlob(async (blob) => {
      try {
        const item = new ClipboardItem({ "image/png": blob });
        await navigator.clipboard.write([item]);
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
        setTimeout(() => btn.innerHTML = originalText, 2000);
      } catch (err) {
        btn.innerHTML = '<i class="fa-solid fa-xmark"></i> Fail';
        setTimeout(() => btn.innerHTML = originalText, 2000);
      }
    });
  } catch (err) {
    btn.innerHTML = '<i class="fa-solid fa-xmark"></i> Fail';
    setTimeout(() => btn.innerHTML = originalText, 2000);
  }
}

function loadImage(src) {
  return new Promise((resolve) => {
    fetch(src)
      .then(res => res.blob())
      .then(blob => {
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
        img.src = url;
      })
      .catch(() => resolve(null));
  });
}

  const content = lastXmlResponse;
  const xmlContent = document.getElementById('xmlContent');
  const resultsDiv = document.getElementById('xmlSearchResults');
  const clearBtn = document.getElementById('xmlSearchClear');
  
  if (searchTerm.trim() === '') {
    xmlContent.textContent = content;
    resultsDiv.classList.add('hidden');
    clearBtn.classList.add('hidden');
    return;
  }
  
  clearBtn.classList.remove('hidden');
  
  // Escape special regex characters
  const escapedTerm = searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const regex = new RegExp(escapedTerm, 'gi');
  const matches = content.match(regex);
  
  if (matches && matches.length > 0) {
    // Highlight matches
    const highlighted = content.replace(regex, match => `<mark class="bg-yellow-300 text-black">${match}</mark>`);
    xmlContent.innerHTML = highlighted;
    resultsDiv.textContent = `Found ${matches.length} match${matches.length !== 1 ? 'es' : ''}`;
    resultsDiv.classList.remove('hidden');
    
    // Scroll to first match
    const firstMark = xmlContent.querySelector('mark');
    if (firstMark) {
      firstMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  } else {
    xmlContent.textContent = content;
    resultsDiv.textContent = 'No matches found';
    resultsDiv.classList.remove('hidden');
  }
}

function clearXmlSearch() {
  document.getElementById('xmlSearchInput').value = '';
  searchXml();
}

async function fetchAPI(endpoint, user, queryParams = '') {
  if (!user || user.trim() === '') {
    throw new Error('Username is required');
  }
  let url = `/api/bgg-helper?endpoint=${endpoint}&username=${encodeURIComponent(user)}${queryParams}`;
  for (let attempt = 0; attempt < 5; attempt++) {
    let res;
    try {
      res = await fetch(url);
    } catch (e) {
      await wait(1000 * Math.pow(2, attempt));
      continue;
    }
    if (res.status === 202) {
      await wait(2000);
      continue;
    }
    if (res.ok) return await res.text();
    await wait(1500);
  }
  throw new Error('Failed to fetch from BGG API');
}

function wait(ms) {
  return new Promise(r => setTimeout(r, ms));
}
