<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>BGG Recommend Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    
    :root {
      --primary: #6366f1;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .dragging { opacity: 0.3; transform: scale(0.9); }
    .drop-target { border: 2px dashed var(--primary) !important; }
    .no-select { user-select: none; }
    
    .img-zoom { object-fit: cover; }
    .img-contain { object-fit: contain; }

    .tab-button {
      position: relative;
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      color: #64748b;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-button.active {
      color: #6366f1;
    }

    .tab-button.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: #6366f1;
      border-radius: 3px 3px 0 0;
    }

    .tab-button:hover:not(.active) {
      color: #475569;
      background: rgba(100, 116, 139, 0.05);
    }

    .tab-button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Shelfie View Styles */
    .shelf-container {
      perspective: 1000px;
    }
    .shelf-item {
      transform: rotateY(-15deg) rotateX(5deg);
      box-shadow: -5px 5px 15px rgba(0,0,0,0.5);
      transition: transform 0.3s ease;
    }
    .shelf-item:hover {
      transform: rotateY(0deg) rotateX(0deg) scale(1.05);
    }
    .wood-floor {
      background: linear-gradient(to bottom, #4a2c2a 0%, #2a1817 100%);
      border-bottom: 12px solid #1a0f0e;
    }
    
    /* Footer action (Save / Copy) */
    .footer-action {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 48px); max-width: 720px; display: flex; gap: 12px; z-index: 60;
      padding: 8px; border-radius: 14px; background: rgba(255,255,255,0.9); box-shadow: 0 12px 40px rgba(2,6,23,0.16);
      border: 1px solid rgba(15,23,42,0.06);
    }

    .cta-btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 14px 18px; font-weight: 700; font-size: 16px; border-radius: 12px; cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease, opacity 120ms ease;
      box-shadow: 0 8px 24px rgba(99,102,241,0.12);
      border: none; color: white;
    }

    .cta-btn:active { transform: translateY(1px) scale(0.998); }
    .cta-btn:disabled { opacity: 0.6; cursor: not-allowed; box-shadow: none; }

    .cta-btn.primary { background: linear-gradient(90deg,#10b981,#059669); }
    .cta-btn.secondary { background: linear-gradient(90deg,#6366f1,#4f46e5); }

    .cta-icon {
      display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 10px;
      background: rgba(255,255,255,0.12); box-shadow: inset 0 -1px 0 rgba(0,0,0,0.06);
    }

    /* thumbnail hover affordance */
    .thumb-clickable { cursor: pointer; transition: transform 150ms ease, box-shadow 150ms ease; }
    .thumb-clickable:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(2,6,23,0.12); }
    .filter-quick {
      display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px;
      border-radius: 6px; font-size: 12px; border: none; cursor: pointer; margin-left: 8px;
      background: rgba(15,23,42,0.04);
    }
    .filter-quick.select { color: #059669; }
    .filter-quick.clear { color: #ef4444; }
    .rank-badge { display:inline-block; background: rgba(99,102,241,0.1); color: #4f46e5; font-weight:700; padding:2px 8px; border-radius:999px; font-size:12px; margin-left:8px; }
    
    .modal-backdrop {
      backdrop-filter: blur(4px);
      animation: fadeIn 0.2s ease-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .modal-content-animate {
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    @keyframes slideUp {
      from { 
        opacity: 0;
        transform: translateY(20px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Recommend Pro adaptive workspace */
    #gameList .recommend-select-card {
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: border-color 130ms ease, box-shadow 130ms ease, background-color 130ms ease;
    }
    #gameList .recommend-select-card a {
      touch-action: manipulation;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
    }
    #gameList .recommend-select-card[data-selected="true"] {
      box-shadow: 0 0 0 1px rgba(99,102,241,.15);
    }
    @media (max-width: 639px) {
      .tab-button {
        flex: 1 1 0;
        min-width: 0;
        padding: 0.8rem 0.25rem;
        font-size: 0.74rem;
        line-height: 1.25;
        text-align: center;
        white-space: normal;
      }
      #content-0 { padding: 1rem; }
      #content-1, #content-2 { padding: 0.75rem; }
      #content-1 > div:first-child { gap: 0.5rem; }
      #content-1 > div:first-child h2 { font-size: 1.125rem; }
      #content-1 > div:first-child button { padding: 0.5rem; }
    }
    @media (min-width: 1024px) {
      #content-1 { padding: 1.5rem 2rem; }
    }
  </style>
</head>
<body class="pb-20 sm:pb-32">

  <header class="sticky top-0 z-30 w-full glass-card border-b px-3 sm:px-6 py-2.5 sm:py-4 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-3">
      <div class="bg-indigo-600 text-white p-2 rounded-lg">
        <i class="fa-solid fa-star"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-tight">BGG Recommend</h1>
        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Game Recommendation Suite</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span id="selectedCount" class="text-[10px] font-bold px-2 py-1 rounded bg-slate-100 text-slate-600 uppercase">0 Selected</span>
      <div id="progressStatus" class="text-sm font-semibold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full hidden">
        <i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Loading...
      </div>
    </div>
  </header>

  <main class="w-full max-w-[1800px] mx-auto p-2 sm:p-4 lg:p-6 space-y-3 sm:space-y-6">
    
    <!-- Tab Navigation -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="flex border-b border-slate-100">
        <button class="tab-button active" onclick="switchTab(0)" id="tab-0">
          <i class="fa-solid fa-cog mr-2"></i>Settings
        </button>
        <button class="tab-button" onclick="switchTab(1)" id="tab-1" disabled>
          <i class="fa-solid fa-check-square mr-2"></i>Selection
        </button>
        <button class="tab-button" onclick="switchTab(2)" id="tab-2" disabled>
          <i class="fa-solid fa-share-alt mr-2"></i>Review & Share
        </button>
      </div>

      <!-- Tab 1: Settings -->
      <div class="tab-content active p-6" id="content-0">
        <h2 class="text-2xl font-bold mb-4">Fetch Collection</h2>
        <div class="space-y-4">
          <div class="space-y-2">
            <label class="text-xs font-bold text-slate-500 uppercase">BGG Username</label>
            <input id="username" type="text" value="sportomax" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
          </div>

          <div class="space-y-2">
            <div class="flex justify-between items-end">
              <label class="text-xs font-bold text-slate-500 uppercase">Collection Status Filters</label>
              <div class="flex gap-2">
                <button onclick="toggleAllFilters(true)" class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded hover:bg-indigo-100" title="Check all filters">Select All</button>
                <button onclick="toggleAllFilters(false)" class="text-[10px] font-bold text-slate-500 bg-slate-100 px-2 py-1 rounded hover:bg-slate-200" title="Uncheck all filters">None</button>
              </div>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
              <label class="flex items-center gap-2 cursor-pointer bg-white p-2 rounded-lg border border-slate-200 hover:bg-slate-50 transition-colors">
                  <input type="checkbox" id="filter-own" checked onchange="filterCollectionRealtime()" class="w-4 h-4 rounded text-indigo-600">
                  <span class="text-xs font-bold text-slate-700">Own</span>
                </label>
              <label class="flex items-center gap-2 cursor-pointer bg-white p-2 rounded-lg border border-slate-200 hover:bg-slate-50 transition-colors">
                <input type="checkbox" id="filter-prevowned" onchange="filterCollectionRealtime()" class="w-4 h-4 rounded text-indigo-600">
                <span class="text-xs font-bold text-slate-700">Prev. Owned</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer bg-white p-2 rounded-lg border border-slate-200 hover:bg-slate-50 transition-colors">
                <input type="checkbox" id="filter-fortrade" onchange="filterCollectionRealtime()" class="w-4 h-4 rounded text-indigo-600">
                <span class="text-xs font-bold text-slate-700">For Trade</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer bg-white p-2 rounded-lg border border-slate-200 hover:bg-slate-50 transition-colors">
                <input type="checkbox" id="filter-want" onchange="filterCollectionRealtime()" class="w-4 h-4 rounded text-indigo-600">
                <span class="text-xs font-bold text-slate-700">Want</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer bg-white p-2 rounded-lg border border-slate-200 hover:bg-slate-50 transition-colors">
                <input type="checkbox" id="filter-wanttoplay" onchange="filterCollectionRealtime()" class="w-4 h-4 rounded text-indigo-600">
                <span class="text-xs font-bold text-slate-700">Want to Play</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer bg-white p-2 rounded-lg border border-slate-200 hover:bg-slate-50 transition-colors">
                <input type="checkbox" id="filter-wanttobuy" onchange="filterCollectionRealtime()" class="w-4 h-4 rounded text-indigo-600">
                <span class="text-xs font-bold text-slate-700">Want to Buy</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer bg-white p-2 rounded-lg border border-slate-200 hover:bg-slate-50 transition-colors">
                <input type="checkbox" id="filter-wishlist" onchange="filterCollectionRealtime()" class="w-4 h-4 rounded text-indigo-600">
                <span class="text-xs font-bold text-slate-700">Wishlist</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer bg-white p-2 rounded-lg border border-slate-200 hover:bg-slate-50 transition-colors">
                <input type="checkbox" id="filter-preordered" onchange="filterCollectionRealtime()" class="w-4 h-4 rounded text-indigo-600">
                <span class="text-xs font-bold text-slate-700">Preordered</span>
              </label>
            </div>
          </div>
          
          <button onclick="fetchCollection()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold hover:bg-indigo-700 shadow-lg shadow-indigo-100 flex items-center justify-center gap-2">
            <i class="fa-solid fa-download"></i> Fetch Collection
          </button>
          
          <button id="viewXmlBtn" onclick="openXmlModal()" class="w-full bg-slate-600 text-white py-3 rounded-xl font-bold hover:bg-slate-700 shadow-lg shadow-slate-100 flex items-center justify-center gap-2 mt-3 hidden">
            <i class="fa-solid fa-code"></i> View XML Response
          </button>
        </div>
      </div>

      <!-- Tab 2: Selection -->
      <div class="tab-content p-3 sm:p-6" id="content-1">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-2xl font-bold">Select Games</h2>
          <div class="flex gap-2">
            <button onclick="selectAll()" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-2 rounded-lg hover:bg-indigo-100 transition-colors">
              <i class="fa-solid fa-check-double mr-1"></i> Select All
            </button>
            <button onclick="deselectAll()" class="text-xs font-bold text-slate-600 bg-slate-50 px-3 py-2 rounded-lg hover:bg-slate-100 transition-colors">
              <i class="fa-solid fa-times mr-1"></i> Deselect All
            </button>
          </div>
        </div>
        
        <div class="mb-4 space-y-3">
          <div class="grid grid-cols-[minmax(0,1fr)_auto] gap-2 sm:gap-3">
            <input type="text" id="searchInput" placeholder="Search games..." 
              oninput="filterGames()" 
              class="flex-1 px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
            
            <select id="sortSelect" onchange="sortAndRender()" 
              aria-label="Sort games by"
              class="min-w-0 max-w-[190px] px-2 sm:px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all bg-white font-medium text-xs sm:text-sm">
              <option value="rating">User Rating</option>
              <option value="average">BGG Average</option>
              <option value="plays">Plays</option>
              <option value="numowned"># Owned</option>
              <option value="bggRank">BGG Rank</option>
              <option value="weight">Game Weight</option>
              <option value="year">Year</option>
              <option value="name">Name</option>
            </select>
          </div>
          
          <div class="flex gap-3 items-center">
            <label class="text-xs font-bold text-slate-500 uppercase">Show:</label>
            <select id="selectionFilter" onchange="renderGameList()" 
              class="px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all bg-white font-medium text-sm">
              <option value="all">All Games</option>
              <option value="selected">Selected Only</option>
              <option value="notselected">Not Selected Only</option>
            </select>
          </div>
        </div>

        <div id="gameList" class="space-y-1.5 h-[calc(100dvh-285px)] min-h-[420px] sm:h-auto sm:min-h-0 sm:max-h-[650px] overflow-y-auto">
          <!-- Game items will be populated here -->
        </div>

        <button onclick="proceedToReview()" class="sticky bottom-2 lg:static z-20 mt-3 sm:mt-6 w-full bg-indigo-600 text-white py-3 sm:py-4 rounded-xl font-bold hover:bg-indigo-700 shadow-lg shadow-indigo-100 flex items-center justify-center gap-2">
          <i class="fa-solid fa-arrow-right"></i> Proceed to Review
        </button>
      </div>

      <!-- Tab 3: Review & Share -->
      <div class="tab-content p-3 sm:p-6" id="content-2">
        <h2 class="text-2xl font-bold mb-4">Review & Share</h2>
        
        <div class="flex flex-wrap items-center justify-between gap-4 bg-slate-50 p-4 rounded-xl mb-6">
          <div class="flex items-center gap-6">
            <div class="flex flex-col">
              <label class="text-[10px] font-bold text-slate-400 uppercase">Layout</label>
              <select id="layoutSelect" onchange="renderRecommendations()" class="text-sm font-bold outline-none bg-transparent py-1">
                <option value="grid9">Grid 3x3 (Top 9)</option>
                <option value="grid25">Grid 5x5 (Top 25)</option>
                <option value="grid100">Grid 10x10 (Top 100)</option>
                <option value="shelfie">Shelfie View (Top 10)</option>
                <option value="list10">List Mode (Top 10)</option>
                <option value="list50">List Mode (Top 50)</option>
                <option value="list100">List Mode (Top 100)</option>
                <option value="listAll">List All Selected</option>
                <option value="namesRank">Names Only (Rank Order)</option>
                <option value="namesAlpha">Names Only (A-Z)</option>
              </select>
            </div>
            <div class="flex flex-col">
              <label class="text-[10px] font-bold text-slate-400 uppercase">Canvas Color</label>
              <div class="flex gap-2 mt-1">
                  <input type="color" id="bgColor" value="#0f172a" onchange="renderRecommendations()" class="w-6 h-6 rounded border-none cursor-pointer">
                  <input type="color" id="accentColor" value="#6366f1" onchange="renderRecommendations()" class="w-6 h-6 rounded border-none cursor-pointer">
              </div>
            </div>
          </div>

          <div class="flex flex-wrap items-center gap-x-6 gap-y-2">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" id="showNames" checked onchange="renderRecommendations()" class="w-4 h-4 rounded text-indigo-600">
              <span class="text-xs font-bold text-slate-600">Names</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" id="showRanks" checked onchange="renderRecommendations()" class="w-4 h-4 rounded text-indigo-600">
              <span class="text-xs font-bold text-slate-600">Ranks</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" id="zoomImages" onchange="renderRecommendations()" class="w-4 h-4 rounded text-indigo-600">
              <span class="text-xs font-bold text-slate-600">Zoom</span>
            </label>
            <button onclick="exportCSV()" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-lg hover:bg-indigo-100 transition-colors">
              <i class="fa-solid fa-download mr-1"></i> CSV
            </button>
            <button onclick="copyNamesList()" class="text-xs font-bold text-slate-600 bg-slate-50 px-3 py-1 rounded-lg hover:bg-slate-100 transition-colors">
              <i class="fa-solid fa-copy mr-1"></i> Copy Names
            </button>
          </div>
        </div>

        <div id="previewCanvas" class="rounded-3xl p-6 md:p-10 shadow-2xl relative min-h-[400px] transition-colors overflow-hidden">
          <div id="thumbs" class="no-select mx-auto"></div>
          <div class="mt-8 flex justify-center">
              <span class="text-[10px] text-slate-400 font-bold tracking-widest uppercase">Drag items to reorder directly in the grid</span>
          </div>
        </div>
      </div>
      <p id="exportFeedback" class="text-sm text-slate-600 text-center mt-3" role="status" aria-live="polite"></p>
      <div class="text-center"><a id="exportDownloadLink" class="hidden text-sm font-bold text-indigo-600 underline" href="#" download>Download image manually</a></div>
    </div>
  </main>

  <div id="footerAction" class="footer-action hidden">
    <button id="saveBtn" onclick="composeAndDownload()" class="cta-btn primary" title="Download a PNG or a ZIP of PNG pages">
      <span class="cta-icon"><i class="fa-solid fa-camera"></i></span>
      <span>Save</span>
    </button>
    <button id="copyBtn" onclick="composeAndCopy()" class="cta-btn secondary" title="Copy image to clipboard">
      <span class="cta-icon"><i class="fa-solid fa-copy"></i></span>
      <span>Copy</span>
    </button>
  </div>

  <!-- Copy Names Modal -->
  <div id="copyNamesModal" class="hidden fixed inset-0 z-[100] modal-backdrop bg-black/40 items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full modal-content-animate">
      <div class="bg-indigo-600 text-white px-6 py-4 rounded-t-2xl">
        <h3 class="font-bold text-lg">Copy Game Names</h3>
      </div>
      <div class="p-6">
        <p class="text-sm text-slate-600 mb-4">Choose the order for copying game names:</p>
        <div class="space-y-3">
          <button onclick="copyNamesInOrder('rank')" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition-colors">
            <i class="fa-solid fa-list-ol mr-2"></i>Copy in Rank Order
          </button>
          <button onclick="copyNamesInOrder('alpha')" class="w-full bg-slate-600 text-white py-3 rounded-xl font-bold hover:bg-slate-700 transition-colors">
            <i class="fa-solid fa-sort-alpha-down mr-2"></i>Copy Alphabetically
          </button>
          <button onclick="closeCopyNamesModal()" class="w-full bg-slate-200 text-slate-700 py-3 rounded-xl font-bold hover:bg-slate-300 transition-colors">
            Cancel
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- XML Response Modal -->
  <div id="xmlModal" class="hidden fixed inset-0 z-[100] modal-backdrop bg-black/40 items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-hidden modal-content-animate flex flex-col">
      <div class="bg-slate-800 text-white px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-code"></i>
          <h3 class="font-bold text-lg">XML Response</h3>
        </div>
        <button onclick="closeXmlModal()" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/20 transition-colors">
          <i class="fa-solid fa-times"></i>
        </button>
      </div>
      <div class="px-6 pt-4 pb-2 bg-white border-b border-slate-200">
        <div class="relative">
          <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input 
            type="text" 
            id="xmlSearchInput" 
            placeholder="Search XML content..." 
            oninput="searchXml()"
            class="w-full pl-10 pr-10 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-sm"
          >
          <button 
            onclick="clearXmlSearch()" 
            id="xmlSearchClear"
            class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors"
          >
            <i class="fa-solid fa-times"></i>
          </button>
        </div>
        <div id="xmlSearchResults" class="text-xs text-slate-500 mt-2 hidden"></div>
      </div>
      <div class="p-6 overflow-auto flex-1 bg-slate-50" style="scroll-behavior: smooth;">
        <pre id="xmlContent" class="text-xs font-mono bg-white border border-slate-200 rounded-lg p-4 whitespace-pre-wrap break-words" style="will-change: scroll-position;"></pre>
      </div>
    </div>
  </div>

<script>
let collectionGames = [];
let activeGames = [];
let selectedGames = [];
let currentTab = 0;
let draggedIndex = null;
let lastXmlResponse = '';

// Helper function to get image proxy URL
function getProxyImageUrl(thumbUrl) {
  if (!thumbUrl) return 'https://via.placeholder.com/300?text=?';
  return `/api/image-proxy?url=${encodeURIComponent(thumbUrl)}`;
}

function switchTab(tabIndex) {
  // Hide all tabs
  for (let i = 0; i < 3; i++) {
    document.getElementById(`content-${i}`).classList.remove('active');
    document.getElementById(`tab-${i}`).classList.remove('active');
  }
  
  // Show selected tab
  document.getElementById(`content-${tabIndex}`).classList.add('active');
  document.getElementById(`tab-${tabIndex}`).classList.add('active');
  currentTab = tabIndex;

  // Show/hide footer action buttons
  const footerAction = document.getElementById('footerAction');
  if (tabIndex === 2) {
    renderRecommendations();
  } else {
    footerAction.classList.add('hidden');
  }
}

async function fetchCollection() {
  const username = document.getElementById('username').value.trim() || 'sportomax';
  const progressStatus = document.getElementById('progressStatus');
  progressStatus.classList.remove('hidden');
  
  try {
    // Fetch full collection with stats (no own=1 filter)
    const collXml = await fetchAPI('collection', username, '&stats=1');
    lastXmlResponse = collXml;
    document.getElementById('viewXmlBtn').classList.remove('hidden');
    const doc = new DOMParser().parseFromString(collXml, 'text/xml');
    const items = Array.from(doc.querySelectorAll('item'));
    
    collectionGames = items.map(item => {
      const name = item.querySelector('name')?.textContent?.trim() || '';
      const objectid = item.getAttribute('objectid') || '';
      const thumb = item.querySelector('thumbnail')?.textContent || item.querySelector('image')?.textContent || '';
      const rating = item.querySelector('stats rating[value]')?.getAttribute('value') || 'N/A';
      const average = item.querySelector('stats rating average')?.getAttribute('value') || 'N/A';
      const year = item.querySelector('yearpublished')?.textContent || '';
      const numplays = parseInt(item.querySelector('numplays')?.textContent || '0');
      const numowned = parseInt(item.querySelector('stats')?.getAttribute('numowned') || '0');

      // extract BGG rank (boardgame subtype)
      let bggRank = null;
      try {
        const ranks = item.querySelectorAll('ranks rank');
        ranks.forEach(r => {
          const nameAttr = r.getAttribute('name') || '';
          const typeAttr = r.getAttribute('type') || '';
          // prefer rank where name="boardgame" or type="subtype"
          if ((nameAttr.toLowerCase() === 'boardgame' || typeAttr.toLowerCase() === 'subtype') && !bggRank) {
            const v = r.getAttribute('value');
            if (v && v !== 'Not Ranked') bggRank = parseInt(v);
          }
        });
      } catch (e) { bggRank = null; }
      
      const statusNode = item.querySelector('status');
      const status = {
        own: statusNode?.getAttribute('own') === '1',
        prevowned: statusNode?.getAttribute('prevowned') === '1',
        fortrade: statusNode?.getAttribute('fortrade') === '1',
        want: statusNode?.getAttribute('want') === '1',
        wanttoplay: statusNode?.getAttribute('wanttoplay') === '1',
        wanttobuy: statusNode?.getAttribute('wanttobuy') === '1',
        wishlist: statusNode?.getAttribute('wishlist') === '1',
        preordered: statusNode?.getAttribute('preordered') === '1'
      };
      
      return { name, objectid, thumb, rating, average, year, numplays, numowned, bggRank, weight: null, status, selected: false };
    }).filter(game => game.name);
    
    // Enrich all games from BGG Thing API: 20 IDs/request, up to 100 concurrent requests.
    await enrichThingWeights(collectionGames, progressStatus);

    // Apply filters and sort
    filterCollection();
    
    // Enable selection tab
    document.getElementById('tab-1').disabled = false;
    progressStatus.classList.add('hidden');
    
    // Switch to selection tab
    switchTab(1);
    
  } catch (e) {
    console.error(e);
    progressStatus.classList.add('hidden');
    alert('Failed to fetch collection. Please try again.');
  }
}

function chunkIds(ids, size = 20) {
  const out = [];
  for (let i = 0; i < ids.length; i += size) out.push(ids.slice(i, i + size));
  return out;
}

async function mapLimit(items, limit, fn) {
  let next = 0;
  const workers = Array.from({ length: Math.min(limit, items.length) }, async () => {
    while (true) {
      const i = next++;
      if (i >= items.length) return;
      await fn(items[i], i);
    }
  });
  await Promise.all(workers);
}

async function fetchThingBatch(ids) {
  const url = `/api/bgg-helper?endpoint=thing&id=${encodeURIComponent(ids.join(','))}&stats=1`;
  for (let attempt = 0; attempt < 4; attempt++) {
    try {
      const res = await fetch(url, { cache: 'no-store' });
      if (res.status === 202 || res.status === 429 || res.status >= 500) {
        await wait(500 * Math.pow(2, attempt));
        continue;
      }
      if (!res.ok) throw new Error(`Thing API ${res.status}`);
      return new DOMParser().parseFromString(await res.text(), 'text/xml');
    } catch (e) {
      if (attempt === 3) throw e;
      await wait(500 * Math.pow(2, attempt));
    }
  }
}

async function enrichThingWeights(games, progressStatus) {
  const byId = new Map(games.map(g => [String(g.objectid), g]));
  const batches = chunkIds([...byId.keys()], 20);
  let done = 0;
  await mapLimit(batches, 100, async ids => {
    try {
      const doc = await fetchThingBatch(ids);
      doc.querySelectorAll('item[id]').forEach(item => {
        const game = byId.get(item.getAttribute('id'));
        if (!game) return;
        const raw = item.querySelector('statistics ratings averageweight')?.getAttribute('value');
        const weight = parseFloat(raw);
        game.weight = Number.isFinite(weight) ? weight : null;
      });
    } catch (e) {
      console.warn('Thing weight batch failed', ids, e);
    } finally {
      done++;
      if (progressStatus) {
        progressStatus.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Details ${done}/${batches.length}`;
      }
    }
  });
}

function filterCollectionRealtime() {
  filterCollection();
  if (currentTab === 1) {
    renderGameList();
  }
}

function filterCollection() {
  const filters = {
    own: document.getElementById('filter-own').checked,
    prevowned: document.getElementById('filter-prevowned').checked,
    fortrade: document.getElementById('filter-fortrade').checked,
    want: document.getElementById('filter-want').checked,
    wanttoplay: document.getElementById('filter-wanttoplay').checked,
    wanttobuy: document.getElementById('filter-wanttobuy').checked,
    wishlist: document.getElementById('filter-wishlist').checked,
    preordered: document.getElementById('filter-preordered').checked
  };

  const hasAnyFilter = Object.values(filters).some(v => v);
  
  if (!hasAnyFilter) {
    // If no filters selected, show nothing (or could show all, but usually filters are additive)
    // Let's show nothing to encourage selecting a filter, or maybe show all?
    // User said "add collection stattus flag filters to apply".
    // Let's assume if nothing is checked, we show nothing.
    activeGames = [];
  } else {
    activeGames = collectionGames.filter(game => {
      if (filters.own && game.status.own) return true;
      if (filters.prevowned && game.status.prevowned) return true;
      if (filters.fortrade && game.status.fortrade) return true;
      if (filters.want && game.status.want) return true;
      if (filters.wanttoplay && game.status.wanttoplay) return true;
      if (filters.wanttobuy && game.status.wanttobuy) return true;
      if (filters.wishlist && game.status.wishlist) return true;
      if (filters.preordered && game.status.preordered) return true;
      return false;
    });
  }
  
  sortAndRender();
}

function toggleAllFilters(checked) {
  const ids = ['filter-own', 'filter-prevowned', 'filter-fortrade', 'filter-want', 'filter-wanttoplay', 'filter-wanttobuy', 'filter-wishlist', 'filter-preordered'];
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.checked = checked;
  });
  filterCollectionRealtime();
}

function sortGames() {
  const sortBy = document.getElementById('sortSelect').value || 'rating';
  
  activeGames.sort((a, b) => {
    if (sortBy === 'rating') {
      // Sort by user rating (descending)
      const ratingA = parseFloat(a.rating);
      const ratingB = parseFloat(b.rating);
      if (isNaN(ratingA)) return 1;
      if (isNaN(ratingB)) return -1;
      return ratingB - ratingA;
    } else if (sortBy === 'average') {
      // Sort by BGG average rating (descending)
      const avgA = parseFloat(a.average);
      const avgB = parseFloat(b.average);
      if (isNaN(avgA)) return 1;
      if (isNaN(avgB)) return -1;
      return avgB - avgA;
    } else if (sortBy === 'plays') {
      // Sort by number of plays (descending)
      return b.numplays - a.numplays;
    } else if (sortBy === 'numowned') {
      // Sort by number owned (descending)
      return b.numowned - a.numowned;
    } else if (sortBy === 'bggRank') {
      // Sort by BGG rank (ascending: 1 = best). Undefined ranks go last.
      const ra = (typeof a.bggRank === 'number') ? a.bggRank : Infinity;
      const rb = (typeof b.bggRank === 'number') ? b.bggRank : Infinity;
      return ra - rb;
    } else if (sortBy === 'weight') {
      const wa = Number.isFinite(a.weight) ? a.weight : -1;
      const wb = Number.isFinite(b.weight) ? b.weight : -1;
      return wb - wa;
    } else if (sortBy === 'year') {
      // Sort by year published (descending, newest first)
      const yearA = parseInt(a.year);
      const yearB = parseInt(b.year);
      if (isNaN(yearA)) return 1;
      if (isNaN(yearB)) return -1;
      return yearB - yearA;
    } else if (sortBy === 'name') {
      // Sort by name (ascending, alphabetical)
      return a.name.localeCompare(b.name);
    }
    return 0;
  });
}

function sortAndRender() {
  sortGames();
  renderGameList();
}

function renderGameList() {
  const gameList = document.getElementById('gameList');
  gameList.innerHTML = '';
  
  const searchTerm = document.getElementById('searchInput').value.toLowerCase();
  const selectionFilter = document.getElementById('selectionFilter').value;
  
  const filteredGames = activeGames.filter(game => {
    // Apply search filter
    if (!game.name.toLowerCase().includes(searchTerm)) return false;
    
    // Apply selection filter
    if (selectionFilter === 'selected' && !game.selected) return false;
    if (selectionFilter === 'notselected' && game.selected) return false;
    
    return true;
  });
  
  filteredGames.forEach((game, index) => {
    const gameItem = document.createElement('div');
    gameItem.className = 'flex items-center gap-2 sm:gap-3 p-2 sm:p-3 bg-white rounded-lg border border-slate-200 hover:bg-slate-50 transition-colors';
    
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = game.selected;
    checkbox.onchange = () => toggleGameSelection(game);
    checkbox.className = 'w-5 h-5 rounded text-indigo-600';
    
    const img = document.createElement('img');
    img.src = game.thumb || '';
    img.loading = 'lazy';
    img.decoding = 'async';
    img.referrerPolicy = 'no-referrer';
    img.onerror = () => {
      if (game.thumb && img.dataset.proxyTried !== '1') {
        img.dataset.proxyTried = '1';
        img.src = getProxyImageUrl(game.thumb);
      }
    };
    img.className = 'w-14 h-14 sm:w-16 sm:h-16 rounded-lg object-cover bg-slate-200 thumb-clickable flex-shrink-0';
    img.style.flexShrink = '0';
    img.onclick = () => {
      try { window.open(`https://boardgamegeek.com/boardgame/${game.objectid}`, '_blank'); } catch (e) { window.location.href = `https://boardgamegeek.com/boardgame/${game.objectid}`; }
    };
    
    const info = document.createElement('div');
    info.className = 'flex-1 min-w-0';
    info.innerHTML = `
      <div class="flex items-center gap-2">
        <div class="font-bold text-slate-900 truncate">${game.name}</div>
        ${game.bggRank ? `<span class="rank-badge">#${game.bggRank}</span>` : ''}
      </div>
      <div class="text-xs text-slate-500">
        ${game.year ? `${game.year} • ` : ''}
        User: ${game.rating !== 'N/A' ? parseFloat(game.rating).toFixed(1) : 'N/A'} • 
        Avg: ${game.average !== 'N/A' ? parseFloat(game.average).toFixed(1) : 'N/A'} •
        Plays: ${game.numplays} •
        Owned: ${game.numowned || 0} •
        Weight: ${Number.isFinite(game.weight) ? game.weight.toFixed(2) : 'N/A'}
      </div>
    `;
    
    gameItem.appendChild(checkbox);
    gameItem.appendChild(img);
    gameItem.appendChild(info);
    gameList.appendChild(gameItem);
  });
  
  updateSelectedCount();
}

function toggleGameSelection(game) {
  game.selected = !game.selected;
  updateSelectedCount();
}

function renderRecommendations() {
  const container = document.getElementById('thumbs');
  const previewCanvas = document.getElementById('previewCanvas');
  const bgColor = document.getElementById('bgColor').value;
  const accentColor = document.getElementById('accentColor').value;
  
  previewCanvas.style.backgroundColor = bgColor;
  container.innerHTML = '';
  
  const layout = document.getElementById('layoutSelect').value;
  const showNames = document.getElementById('showNames').checked;
  const showRanks = document.getElementById('showRanks').checked;
  const zoom = document.getElementById('zoomImages').checked;
  
  let limit = 25;
  let gridCols = 'repeat(5, 1fr)';
  let isList = false;
  let isShelf = (layout === 'shelfie');
  let isTextList = (layout === 'namesRank' || layout === 'namesAlpha');

  if (layout === 'grid9') { limit = 9; gridCols = 'repeat(3, 1fr)'; container.style.maxWidth = '600px'; }
  else if (layout === 'grid25') { limit = 25; gridCols = 'repeat(5, 1fr)'; container.style.maxWidth = '800px'; }
  else if (layout === 'grid100') { limit = 100; gridCols = 'repeat(10, 1fr)'; container.style.maxWidth = '1000px'; }
  else if (isShelf) { limit = 10; gridCols = 'repeat(5, 1fr)'; container.style.maxWidth = '800px'; }
  else if (isTextList) { limit = selectedGames.length; container.style.maxWidth = '600px'; }
  else if (layout.startsWith('list')) { 
    limit = layout === 'listAll' ? selectedGames.length : parseInt(layout.replace('list', '')); 
    isList = true;
    container.style.maxWidth = '600px'; 
  }

  let list = selectedGames.slice(0, limit);
  
  // Handle text-only lists
  if (isTextList) {
    if (layout === 'namesAlpha') {
      list = [...list].sort((a, b) => a.name.localeCompare(b.name));
    }
    const textContainer = document.createElement('div');
    textContainer.className = 'bg-white rounded-xl p-6 shadow-md';
    const textList = document.createElement('ol');
    textList.className = 'space-y-2';
    list.forEach((game, idx) => {
      const item = document.createElement('li');
      item.className = 'text-slate-900 font-medium';
      item.textContent = game.name;
      textList.appendChild(item);
    });
    textContainer.appendChild(textList);
    container.appendChild(textContainer);
    document.getElementById('footerAction').classList.remove('hidden');
    return;
  }
  
  const grid = document.createElement('div');
  
  if (isShelf) {
    grid.className = 'grid gap-2';
    grid.style.gridTemplateColumns = gridCols;
  } else {
    grid.className = isList ? 'flex flex-col gap-3' : 'grid gap-2';
    if (!isList) grid.style.gridTemplateColumns = gridCols;
  }

  const imgClass = zoom ? 'img-zoom' : 'img-contain';

  list.forEach((game, idx) => {
    const wrapper = document.createElement('div');
    wrapper.draggable = true;
    wrapper.dataset.index = idx;
    setupDragEvents(wrapper, idx);

    if (isShelf) {
      wrapper.className = `relative aspect-square bg-slate-800 rounded-xl border border-white/10 overflow-hidden group shadow-md`;
      wrapper.appendChild(createImg(game.thumb, `w-full h-full ${imgClass}`));
      if (showRanks) {
        const rb = document.createElement('div');
        rb.className = `absolute top-1 left-1 bg-black/70 text-white font-bold rounded backdrop-blur-md text-xs w-8 h-8 flex items-center justify-center`;
        rb.innerText = idx + 1;
        wrapper.appendChild(rb);
      }
      if (showNames) {
        const nb = document.createElement('div');
        nb.className = "absolute bottom-0 left-0 right-0 bg-black/60 text-white text-[8px] p-1.5 font-medium truncate text-center backdrop-blur-sm";
        nb.innerText = game.name;
        wrapper.appendChild(nb);
      }
    } else if (isList) {
      wrapper.className = `flex items-center bg-white/5 rounded-xl p-2 border border-white/5 group transition-all hover:bg-white/10`;
      const img = createImg(game.thumb, `w-16 h-16 rounded-lg ${imgClass} bg-slate-800 shadow-inner`);
      const info = document.createElement('div');
      info.className = "ml-4 flex-1";
      info.innerHTML = `<div class="flex items-center gap-2">
          ${showRanks ? `<span style="color:${accentColor}" class="font-bold text-sm">#${idx + 1}</span>` : ''}
          <span class="text-white font-bold text-base truncate">${showNames ? game.name : ''}</span>
      </div>`;
      wrapper.appendChild(img);
      wrapper.appendChild(info);
    } else {
      const isDense = limit > 25;
      wrapper.className = `relative aspect-square bg-slate-800 rounded-${isDense ? 'md' : 'xl'} border border-white/10 overflow-hidden group shadow-md`;
      wrapper.appendChild(createImg(game.thumb, `w-full h-full ${imgClass}`));
      if (showRanks) {
        const rb = document.createElement('div');
        rb.className = `absolute top-1 left-1 bg-black/70 text-white font-bold rounded backdrop-blur-md ${isDense ? 'text-[10px] w-6 h-6 flex items-center justify-center' : 'text-xs w-8 h-8 flex items-center justify-center'}`;
        rb.innerText = idx + 1;
        wrapper.appendChild(rb);
      }
      if (showNames && !isDense) {
        const nb = document.createElement('div');
        nb.className = "absolute bottom-0 left-0 right-0 bg-black/60 text-white text-[8px] p-1.5 font-medium truncate text-center backdrop-blur-sm";
        nb.innerText = game.name;
        wrapper.appendChild(nb);
      }
    }
    grid.appendChild(wrapper);
  });
  container.appendChild(grid);
  
  // Show footer action buttons
  document.getElementById('footerAction').classList.remove('hidden');
}

  if (selectedGames.length === 0) {
    alert('Please select at least one game!');
    return;
  }
  
  // Enable review tab
  document.getElementById('tab-2').disabled = false;

  switchTab(2);
}

function setupDragEvents(wrapper, idx) {
  wrapper.addEventListener('dragstart', (e) => { draggedIndex = idx; e.currentTarget.classList.add('dragging'); });
  wrapper.addEventListener('dragend', (e) => { e.currentTarget.classList.remove('dragging'); document.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target')); });
  wrapper.addEventListener('dragover', (e) => { e.preventDefault(); wrapper.classList.add('drop-target'); });
  wrapper.addEventListener('dragleave', () => wrapper.classList.remove('drop-target'));
  wrapper.addEventListener('drop', (e) => {
    e.preventDefault();
    if (draggedIndex === null || draggedIndex === idx) return;
    const item = selectedGames.splice(draggedIndex, 1)[0];
    selectedGames.splice(idx, 0, item);
    renderRecommendations();
  });
}

function createImg(thumbUrl, className) {
  const img = document.createElement('img');
  img.src = thumbUrl || '';
  img.className = className;
  img.loading = 'lazy';
  img.decoding = 'async';
  img.referrerPolicy = 'no-referrer';
  img.onerror = () => {
    if (thumbUrl && img.dataset.proxyTried !== '1') {
      img.dataset.proxyTried = '1';
      img.src = getProxyImageUrl(thumbUrl);
    } else {
      img.removeAttribute('src');
      img.alt = '?';
    }
  };
  return img;
}

  document.getElementById('copyNamesModal').classList.add('flex');

function copyNamesInOrder(order) {
  let list = [...selectedGames];
  
  if (order === 'alpha') {
    list.sort((a, b) => a.name.localeCompare(b.name));
  }
  
  const names = list.map(g => g.name).join('\n');
  navigator.clipboard.writeText(names).then(() => {
    closeCopyNamesModal();
    // Show brief success message
    setTimeout(() => {
      const modal = document.getElementById('copyNamesModal');
      if (!modal.classList.contains('hidden')) return;
      alert('Names copied to clipboard!');
    }, 100);
  }).catch(() => {
    alert('Failed to copy to clipboard');
  });
}

function exportCSV() {
  let csv = "Rank,Name,Year,UserRating,BGGAverage,ThumbnailURL\n";
  selectedGames.forEach((game, idx) => {
    csv += `${idx + 1},"${game.name.replace(/"/g, '""')}","${game.year}","${game.rating}","${game.average}","${game.thumb || ''}"\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `bgg_recommendations_${Date.now()}.csv`;
  a.click();
}

// Canvas exports are rendered independently from the DOM preview so image failures
// cannot prevent game names, ranks, or placeholder artwork from being exported.
const EXPORT_LIST_PAGE_SIZE = 50;
const EXPORT_NAMES_PAGE_SIZE = 100;
const exportImageCache = new Map();
let exportRunning = false;

function exportPlan() {
  const layout = document.getElementById('layoutSelect').value;
  const namesOnly = layout === 'namesRank' || layout === 'namesAlpha';
  const listMode = layout.startsWith('list');
  const limitMap = { grid9: 9, grid25: 25, grid100: 100, shelfie: 10, list10: 10, list50: 50, list100: 100 };
  const limit = limitMap[layout] ?? selectedGames.length;
  let games = selectedGames.slice(0, limit);
  if (layout === 'namesAlpha') games = games.slice().sort((a, b) => a.name.localeCompare(b.name));
  const perPage = namesOnly ? EXPORT_NAMES_PAGE_SIZE : listMode ? EXPORT_LIST_PAGE_SIZE : Math.max(1, games.length);
  const pages = Math.max(1, Math.ceil(games.length / perPage));
  const cols = layout === 'grid9' ? 3 : layout === 'grid100' ? 10 : 5;
  const tile = layout === 'grid100' ? 170 : layout === 'grid9' ? 370 : 290;
  return { layout, games, namesOnly, listMode, pages, perPage, cols, tile };
}

function exportMessage(message, isError = false) {
  const status = document.getElementById('exportFeedback');
  if (status) {
    status.textContent = message;
    status.classList.toggle('text-red-600', isError);
    status.classList.toggle('text-slate-600', !isError);
  }
  if (isError) console.error('Recommend Pro export:', message);
}

function setExportBusy(busy, label = '') {
  exportRunning = busy;
  for (const id of ['copyBtn', 'saveBtn']) {
    const button = document.getElementById(id);
    if (button) button.disabled = busy;
  }
  if (label) exportMessage(label);
}

function canvasPngBlob(canvas) {
  return new Promise((resolve, reject) => {
    try {
      canvas.toBlob(blob => blob && blob.size
        ? resolve(blob)
        : reject(new Error('Could not encode PNG. Try saving a smaller selection.')), 'image/png');
    } catch (error) { reject(error); }
  });
}

async function fetchExportImage(src) {
  if (!src) return null;
  if (exportImageCache.has(src)) return exportImageCache.get(src);
  const task = (async () => {
    // Fetch a same-origin proxy first to avoid tainting the canvas. A direct URL
    // is a CORS-only fallback; neither route is drawn if decoding fails.
    const urls = [getProxyImageUrl(src), src];
    for (const url of urls) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 9000);
      try {
        const response = await fetch(url, { signal: controller.signal, mode: 'cors' });
        if (!response.ok) throw new Error('Image HTTP ' + response.status);
        const blob = await response.blob();
        if (!blob.type.startsWith('image/')) throw new Error('Non-image response');
        const blobUrl = URL.createObjectURL(blob);
        try {
          const image = await new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => reject(new Error('Invalid image'));
            img.src = blobUrl;
          });
          return image;
        } finally {
          URL.revokeObjectURL(blobUrl);
        }
      } catch (error) {
        // Missing artwork is nonfatal. The text and placeholder still export.
      } finally {
        clearTimeout(timeout);
      }
    }
    return null;
  })();
  exportImageCache.set(src, task);
  // Don't indefinitely cache failures: transient image/CDN errors can recover.
  task.then(value => { if (!value) exportImageCache.delete(src); },
    () => exportImageCache.delete(src));
  return task;
}

function drawExportCover(ctx, img, x, y, w, h, cover, fallbackName) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();
  ctx.fillStyle = '#293548';
  ctx.fillRect(x, y, w, h);
  if (img && img.naturalWidth && img.naturalHeight) {
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const scale = cover ? Math.max(w / iw, h / ih) : Math.min(w / iw, h / ih);
    const dw = iw * scale, dh = ih * scale;
    ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
  } else {
    ctx.fillStyle = '#8090aa';
    ctx.font = 'bold ' + Math.max(24, Math.min(w, h) * 0.28) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText((fallbackName || '?').trim().slice(0, 2).toUpperCase(), x + w / 2, y + h / 2);
  }
  ctx.restore();
}

function fitExportText(ctx, value, maxWidth) {
  let str = String(value ?? '');
  if (ctx.measureText(str).width <= maxWidth) return str;
  while (str.length > 1 && ctx.measureText(str + '…').width > maxWidth) str = str.slice(0, -1);
  return str + '…';
}

function drawExportRank(ctx, rank, x, y, size) {
  ctx.fillStyle = 'rgba(0,0,0,.78)';
  ctx.fillRect(x, y, size, size);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold ' + Math.round(size * 0.52) + 'px sans-serif';
  ctx.fillText(String(rank), x + size / 2, y + size / 2, size - 4);
}

async function getComposedCanvas(pageIndex = 0, plan = exportPlan()) {
  if (!plan.games.length) throw new Error('Select at least one game to export.');
  if (pageIndex < 0 || pageIndex >= plan.pages) throw new Error('Invalid export page.');
  const showNames = document.getElementById('showNames').checked;
  const showRanks = document.getElementById('showRanks').checked;
  const zoom = document.getElementById('zoomImages').checked;
  const bgColor = document.getElementById('bgColor').value;
  const accentColor = document.getElementById('accentColor').value;
  const first = pageIndex * plan.perPage;
  const games = plan.games.slice(first, first + plan.perPage);
  const canvas = document.createElement('canvas');
  const rowHeight = plan.namesOnly ? 52 : 150;
  const cols = plan.namesOnly || plan.listMode ? 1 : plan.cols;
  const rows = plan.namesOnly || plan.listMode ? games.length : Math.ceil(games.length / cols);
  canvas.width = plan.namesOnly || plan.listMode ? 1200 : cols * plan.tile;
  canvas.height = Math.max(1, rows * (plan.namesOnly || plan.listMode ? rowHeight : plan.tile));
  // Splitting at 7,500 px avoids blank canvases on common mobile browsers.
  if (canvas.height > 8192 || canvas.width > 8192) throw new Error('Export canvas is too large.');
  const ctx = canvas.getContext('2d');
  if (!ctx) throw new Error('Canvas drawing is unavailable in this browser.');
  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Image requests are bounded so a large selection won't stall the browser.
  const images = new Array(games.length).fill(null);
  if (!plan.namesOnly) {
    let next = 0;
    const worker = async () => {
      while (next < games.length) {
        const i = next++;
        images[i] = await fetchExportImage(games[i].thumb).catch(() => null);
      }
    };
    await Promise.all(Array.from({ length: Math.min(8, games.length) }, worker));
  }

  for (let i = 0; i < games.length; i++) {
    const game = games[i], img = images[i], rank = first + i + 1;
    if (plan.namesOnly) {
      const y = i * rowHeight;
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, y + 1, canvas.width, rowHeight - 2);
      ctx.font = 'bold 25px sans-serif';
      ctx.fillStyle = '#1e293b';
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'left';
      const prefix = plan.layout === 'namesRank' ? rank + '.  ' : '•  ';
      ctx.fillText(fitExportText(ctx, prefix + game.name, canvas.width - 64), 28, y + rowHeight / 2);
    } else if (plan.listMode) {
      const y = i * rowHeight, height = rowHeight - 8;
      ctx.fillStyle = 'rgba(255,255,255,.1)';
      ctx.fillRect(0, y, canvas.width, height);
      drawExportCover(ctx, img, 8, y + 8, 125, 125, zoom, game.name);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 35px sans-serif';
      ctx.fillStyle = accentColor;
      const prefix = showRanks ? '#' + rank + '  ' : '';
      const title = showNames ? game.name : '';
      ctx.fillText(fitExportText(ctx, prefix + title, canvas.width - 178), 160, y + 72);
    } else {
      const tile = plan.tile, col = i % cols, row = Math.floor(i / cols);
      const x = col * tile, y = row * tile;
      drawExportCover(ctx, img, x, y, tile, tile, zoom, game.name);
      if (showNames && plan.layout !== 'grid100') {
        const bar = 46;
        ctx.fillStyle = 'rgba(0,0,0,.75)';
        ctx.fillRect(x, y + tile - bar, tile, bar);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold ' + (tile < 300 ? 16 : 20) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(fitExportText(ctx, game.name, tile - 18), x + tile / 2, y + tile - bar / 2);
      }
      if (showRanks) drawExportRank(ctx, rank, x + 5, y + 5, plan.layout === 'grid100' ? 30 : 42);
    }
  }
  return canvas;
}

// ZIP (store method): one download for all pages, without adding a third-party dependency.
const zipEncoder = new TextEncoder();
function zipCRC(bytes) {
  let crc = -1;
  for (const b of bytes) {
    crc ^= b;
    for (let i = 0; i < 8; i++) crc = (crc >>> 1) ^ (crc & 1 ? 0xedb88320 : 0);
  }
  return (crc ^ -1) >>> 0;
}
async function makeExportZip(entries) {
  const sections = [], directory = [];
  let offset = 0;
  for (const entry of entries) {
    const name = zipEncoder.encode(entry.name);
    const data = new Uint8Array(await entry.blob.arrayBuffer());
    const crc = zipCRC(data);
    const local = new Uint8Array(30 + name.length), l = new DataView(local.buffer);
    l.setUint32(0, 0x04034b50, true);
    l.setUint16(4, 20, true);
    l.setUint32(14, crc, true); l.setUint32(18, data.length, true); l.setUint32(22, data.length, true);
    l.setUint16(26, name.length, true); local.set(name, 30);
    const central = new Uint8Array(46 + name.length), c = new DataView(central.buffer);
    c.setUint32(0, 0x02014b50, true);
    c.setUint16(4, 20, true); c.setUint16(6, 20, true);
    c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
    c.setUint16(28, name.length, true); c.setUint32(42, offset, true);
    central.set(name, 46);
    sections.push(local, data);
    directory.push(central);
    offset += local.length + data.length;
  }
  const dirSize = directory.reduce((total, bytes) => total + bytes.length, 0);
  const end = new Uint8Array(22), e = new DataView(end.buffer);
  e.setUint32(0, 0x06054b50, true);
  e.setUint16(8, entries.length, true); e.setUint16(10, entries.length, true);
  e.setUint32(12, dirSize, true); e.setUint32(16, offset, true);
  return new Blob([...sections, ...directory, end], { type: 'application/zip' });
}

let previousExportUrl = null;
let previousExportTimer = null;
function downloadExportBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  if (previousExportTimer) clearTimeout(previousExportTimer);
  if (previousExportUrl) URL.revokeObjectURL(previousExportUrl);
  previousExportUrl = url;
  const fallback = document.getElementById('exportDownloadLink');
  if (fallback) {
    fallback.href = url;
    fallback.download = filename;
    fallback.textContent = 'Download ' + filename + ' manually if the download did not start';
    fallback.classList.remove('hidden');
  }
  const anchor = document.createElement('a');
  anchor.href = url; anchor.download = filename;
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  // Keep the manually clickable link available on browsers that block auto-downloads.
  previousExportTimer = setTimeout(() => {
    if (previousExportUrl === url) {
      if (fallback) {
        fallback.removeAttribute('href');
        fallback.classList.add('hidden');
      }
      URL.revokeObjectURL(url);
      previousExportUrl = null;
    }
  }, 300000);
}

async function renderExportBlob(plan, pageIndex) {
  const canvas = await getComposedCanvas(pageIndex, plan);
  try { return await canvasPngBlob(canvas); }
  finally { canvas.width = 0; canvas.height = 0; }
}

async function composeAndDownload() {
  if (exportRunning) return;
  setExportBusy(true, 'Preparing image…');
  try {
    const plan = exportPlan();
    if (!plan.games.length) throw new Error('Select at least one game to save.');
    if (plan.pages === 1) {
      const png = await renderExportBlob(plan, 0);
      downloadExportBlob(png, 'bgg_recommendations_' + Date.now() + '.png');
      exportMessage('PNG prepared (' + plan.games.length + ' games). If the download did not start, use the manual link below.');
    } else {
      const images = [];
      for (let page = 0; page < plan.pages; page++) {
        exportMessage('Creating PNG page ' + (page + 1) + ' of ' + plan.pages + '…');
        const blob = await renderExportBlob(plan, page);
        images.push({ name: 'recommendations_page_' + String(page + 1).padStart(2, '0') + '.png', blob });
      }
      const zip = await makeExportZip(images);
      downloadExportBlob(zip, 'bgg_recommendations_' + Date.now() + '.zip');
      exportMessage('ZIP prepared with ' + plan.pages + ' PNG pages (' + plan.games.length + ' games). If the download did not start, use the manual link below.');
    }
  } catch (error) {
    console.error('Save image failed', error);
    exportMessage('Could not save image: ' + (error.message || error), true);
  } finally { setExportBusy(false); }
}

async function composeAndCopy() {
  if (exportRunning) return;
  if (!navigator.clipboard?.write || typeof ClipboardItem === 'undefined') {
    exportMessage('Image clipboard is not supported or allowed. Use Save instead.', true);
    return;
  }
  setExportBusy(true, 'Preparing clipboard image…');
  const btn = document.getElementById('copyBtn');
  try {
    const plan = exportPlan();
    if (!plan.games.length) throw new Error('Select at least one game to copy.');
    // IMPORTANT: call clipboard.write during the click's user activation, BEFORE
    // awaiting remote images. ClipboardItem accepts a promise for the PNG bytes.
    const blobPromise = renderExportBlob(plan, 0);
    const item = new ClipboardItem({ 'image/png': blobPromise });
    await navigator.clipboard.write([item]);
    if (btn) btn.title = 'Image copied';
    exportMessage(plan.pages > 1
      ? 'Copied page 1 of ' + plan.pages + '. Use Save to export every page in a ZIP.'
      : 'PNG copied to clipboard (' + plan.games.length + ' games).');
  } catch (error) {
    console.error('Copy image failed', error);
    exportMessage('Could not copy image: ' + (error.message || error) + '. Try Save instead.', true);
  } finally { setExportBusy(false); }
}

function openXmlModal() {
  document.getElementById('xmlContent').textContent = lastXmlResponse;
  document.getElementById('xmlSearchInput').value = '';
  document.getElementById('xmlSearchResults').classList.add('hidden');
  document.getElementById('xmlSearchClear').classList.add('hidden');
  document.getElementById('xmlModal').classList.remove('hidden');
  document.getElementById('xmlModal').classList.add('flex');
}

function closeXmlModal() {
  document.getElementById('xmlModal').classList.add('hidden');
  document.getElementById('xmlModal').classList.remove('flex');
}

function searchXml() {
  const searchTerm = document.getElementById('xmlSearchInput').value;
  const content = lastXmlResponse;
  const xmlContent = document.getElementById('xmlContent');
  const resultsDiv = document.getElementById('xmlSearchResults');
  const clearBtn = document.getElementById('xmlSearchClear');
  
  if (searchTerm.trim() === '') {
    xmlContent.textContent = content;
    resultsDiv.classList.add('hidden');
    clearBtn.classList.add('hidden');
    return;
  }
  
  clearBtn.classList.remove('hidden');
  
  // Escape special regex characters
  const escapedTerm = searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const regex = new RegExp(escapedTerm, 'gi');
  const matches = content.match(regex);
  
  if (matches && matches.length > 0) {
    // Highlight matches
    const highlighted = content.replace(regex, match => `<mark class="bg-yellow-300 text-black">${match}</mark>`);
    xmlContent.innerHTML = highlighted;
    resultsDiv.textContent = `Found ${matches.length} match${matches.length !== 1 ? 'es' : ''}`;
    resultsDiv.classList.remove('hidden');
    
    // Scroll to first match
    const firstMark = xmlContent.querySelector('mark');
    if (firstMark) {
      firstMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  } else {
    xmlContent.textContent = content;
    resultsDiv.textContent = 'No matches found';
    resultsDiv.classList.remove('hidden');
  }
}

function clearXmlSearch() {
  document.getElementById('xmlSearchInput').value = '';
  searchXml();
}

async function fetchAPI(endpoint, user, queryParams = '') {
  if (!user || user.trim() === '') {
    throw new Error('Username is required');
  }
  let url = `/api/bgg-helper?endpoint=${endpoint}&username=${encodeURIComponent(user)}${queryParams}`;
  for (let attempt = 0; attempt < 5; attempt++) {
    let res;
    try {
      res = await fetch(url);
    } catch (e) {
      await wait(1000 * Math.pow(2, attempt));
      continue;
    }
    if (res.status === 202) {
      await wait(2000);
      continue;
    }
    if (res.ok) return await res.text();
    await wait(1500);
  }
  throw new Error('Failed to fetch from BGG API');
}

function wait(ms) {
  return new Promise(r => setTimeout(r, ms));
}
