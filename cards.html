<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Deck Builder</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🃏</text></svg>">
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        // Pure localStorage-based card deck builder
        
        // --- App State ---
        let currentDeck = {
            name: 'My Deck',
            cards: []
        };
        
        let cardPreviewData = {
            content: '♠',
            bgColor: '#ffffff',
            textColor: '#000000',
            borderColor: '#cccccc'
        };

        // --- localStorage Management ---
        function saveDeckToStorage() {
            const deckData = JSON.stringify(currentDeck);
            localStorage.setItem('cardDeckData', deckData);
            console.log('[SAVE] Deck saved to localStorage:', currentDeck.name, 'Cards:', currentDeck.cards.length);
        }

        function loadDeckFromStorage() {
            const saved = localStorage.getItem('cardDeckData');
            if (saved) {
                currentDeck = JSON.parse(saved);
                console.log('[LOAD] Deck loaded from localStorage:', currentDeck.name, 'Cards:', currentDeck.cards.length);
                updateDeckDisplay();
            } else {
                console.log('[LOAD] No saved deck found, using default');
            }
        }

        function clearAllData() {
            if (confirm('Are you sure? This will delete all cards in your current deck.')) {
                currentDeck = { name: 'My Deck', cards: [] };
                localStorage.removeItem('cardDeckData');
                updateDeckDisplay();
                showModal('Deck cleared.', 'success');
            }
        }

        // --- Export/Import ---
        function exportDeckAsJSON() {
            const dataStr = JSON.stringify(currentDeck, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `${currentDeck.name.replace(/\s+/g, '_')}_deck.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            console.log('[EXPORT] Deck exported as JSON');
            showModal('Deck exported as JSON!', 'success');
        }

        function importDeckFromJSON() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (imported.name && Array.isArray(imported.cards)) {
                            currentDeck = imported;
                            saveDeckToStorage();
                            updateDeckDisplay();
                            showModal(`Imported deck: ${imported.name}`, 'success');
                            console.log('[IMPORT] Deck imported from JSON:', imported.name);
                        } else {
                            showModal('Invalid deck format.', 'error');
                        }
                    } catch (err) {
                        console.error('[IMPORT] Error parsing JSON:', err);
                        showModal('Error importing deck. Invalid JSON format.', 'error');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // --- UI Logic ---
        function switchView(view) {
            document.getElementById('workshop-view').classList.toggle('hidden', view !== 'workshop');
            document.getElementById('play-view').classList.toggle('hidden', view !== 'play');
            document.getElementById('manage-view').classList.toggle('hidden', view !== 'manage');
            
            document.getElementById('btn-workshop').classList.toggle('bg-indigo-600', view === 'workshop');
            document.getElementById('btn-workshop').classList.toggle('bg-gray-700', view !== 'workshop');
            
            document.getElementById('btn-play').classList.toggle('bg-indigo-600', view === 'play');
            document.getElementById('btn-play').classList.toggle('bg-gray-700', view !== 'play');
            
            document.getElementById('btn-manage').classList.toggle('bg-indigo-600', view === 'manage');
            document.getElementById('btn-manage').classList.toggle('bg-gray-700', view !== 'manage');
            
            if (view === 'play') {
                initPlayMode();
            } else if (view === 'manage') {
                updateManageView();
            }
        }

        function updateCardPreview() {
            const content = document.getElementById('card-content').value.trim() || '♠';
            const bgColor = document.getElementById('card-bg-color').value;
            const textColor = document.getElementById('card-text-color').value;
            const borderColor = document.getElementById('card-border-color').value;
            
            cardPreviewData = { content, bgColor, textColor, borderColor };
            
            const preview = document.getElementById('preview-card');
            preview.style.backgroundColor = bgColor;
            preview.style.color = textColor;
            preview.style.borderColor = borderColor;
            preview.textContent = content;
        }

        function addCard() {
            const content = document.getElementById('card-content').value.trim();
            const count = parseInt(document.getElementById('card-count').value) || 1;
            
            if (!content) {
                showModal('Please enter card content.', 'error');
                return;
            }
            
            for (let i = 0; i < count; i++) {
                const card = {
                    id: `card_${Date.now()}_${i}`,
                    content: content,
                    bgColor: cardPreviewData.bgColor,
                    textColor: cardPreviewData.textColor,
                    borderColor: cardPreviewData.borderColor
                };
                currentDeck.cards.push(card);
            }
            
            saveDeckToStorage();
            updateDeckDisplay();
            clearCardForm();
            showModal(`Added ${count} card(s) to deck!`, 'success');
            console.log('[ADD] Added', count, 'card(s):', content);
        }

        function clearCardForm() {
            document.getElementById('card-content').value = '';
            document.getElementById('card-count').value = '1';
            document.getElementById('card-bg-color').value = '#ffffff';
            document.getElementById('card-text-color').value = '#000000';
            document.getElementById('card-border-color').value = '#cccccc';
            updateCardPreview();
        }

        function updateDeckDisplay() {
            document.getElementById('deck-name-input').value = currentDeck.name;
            document.getElementById('card-count-display').textContent = currentDeck.cards.length;
            renderCardGrid();
        }

        function renderCardGrid() {
            const grid = document.getElementById('card-grid');
            grid.innerHTML = '';
            
            if (currentDeck.cards.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center text-gray-400 italic">No cards yet. Add some cards to your deck!</p>';
                return;
            }
            
            currentDeck.cards.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'aspect-video rounded-lg shadow-md p-3 flex items-center justify-center text-center font-bold relative group cursor-pointer transition-transform hover:scale-105 border-2';
                cardEl.style.backgroundColor = card.bgColor;
                cardEl.style.color = card.textColor;
                cardEl.style.borderColor = card.borderColor;
                
                const content = document.createElement('div');
                content.className = 'text-sm md:text-base break-words line-clamp-3';
                content.textContent = card.content;
                cardEl.appendChild(content);
                
                const removeBtn = document.createElement('button');
                removeBtn.className = 'absolute -top-2 -right-2 w-6 h-6 bg-red-600 text-white text-xs rounded-full flex items-center justify-center font-bold shadow-md hover:bg-red-500 opacity-0 group-hover:opacity-100 transition-opacity';
                removeBtn.innerHTML = '&times;';
                removeBtn.onclick = (e) => {
                    e.stopPropagation();
                    removeCard(index);
                };
                cardEl.appendChild(removeBtn);
                
                grid.appendChild(cardEl);
            });
        }

        function removeCard(index) {
            currentDeck.cards.splice(index, 1);
            saveDeckToStorage();
            updateDeckDisplay();
            showModal('Card removed.', 'success');
            console.log('[REMOVE] Card removed at index', index);
        }

        function updateDeckName() {
            const newName = document.getElementById('deck-name-input').value.trim() || 'My Deck';
            currentDeck.name = newName;
            saveDeckToStorage();
            console.log('[RENAME] Deck renamed to:', newName);
        }

        // --- Play Mode ---
        let playDeck = [];
        let currentCardIndex = 0;

        function initPlayMode() {
            if (currentDeck.cards.length === 0) {
                showModal('No cards in deck! Add cards in the Workshop first.', 'error');
                switchView('workshop');
                return;
            }
            
            playDeck = [...currentDeck.cards];
            shuffleArray(playDeck);
            currentCardIndex = 0;
            displayPlayCard();
        }

        function displayPlayCard() {
            const container = document.getElementById('play-card-display');
            
            if (currentCardIndex >= playDeck.length) {
                container.innerHTML = '<div class="text-center text-gray-300"><p class="text-2xl mb-4">Deck Complete!</p><button onclick="window.initPlayMode()" class="px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Shuffle Again</button></div>';
                return;
            }
            
            const card = playDeck[currentCardIndex];
            container.innerHTML = '';
            
            const cardEl = document.createElement('div');
            cardEl.className = 'aspect-video rounded-lg shadow-lg p-6 flex items-center justify-center text-center font-bold border-4 max-w-sm';
            cardEl.style.backgroundColor = card.bgColor;
            cardEl.style.color = card.textColor;
            cardEl.style.borderColor = card.borderColor;
            
            const content = document.createElement('div');
            content.className = 'text-3xl break-words';
            content.textContent = card.content;
            cardEl.appendChild(content);
            
            container.appendChild(cardEl);
            
            const progress = document.getElementById('play-progress');
            progress.textContent = `${currentCardIndex + 1} / ${playDeck.length}`;
        }

        function nextCard() {
            currentCardIndex++;
            displayPlayCard();
        }

        function prevCard() {
            if (currentCardIndex > 0) {
                currentCardIndex--;
                displayPlayCard();
            }
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        // --- Manage View ---
        function updateManageView() {
            const stats = document.getElementById('manage-stats');
            stats.innerHTML = `
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-gray-800 p-4 rounded-lg">
                        <p class="text-gray-400 text-sm">Total Cards</p>
                        <p class="text-3xl font-bold text-indigo-400">${currentDeck.cards.length}</p>
                    </div>
                    <div class="bg-gray-800 p-4 rounded-lg">
                        <p class="text-gray-400 text-sm">Deck Name</p>
                        <p class="text-lg font-bold text-green-400">${currentDeck.name}</p>
                    </div>
                </div>
            `;
        }

        // --- Utility ---
        function showModal(message, type = "info") {
            const modal = document.getElementById('modal');
            const modalMessage = document.getElementById('modal-message');
            const modalClose = document.getElementById('modal-close');
            
            modalMessage.textContent = message;
            
            modal.classList.remove('bg-red-600', 'bg-green-600', 'bg-blue-600');
            
            if (type === 'error') {
                modal.classList.add('bg-red-600');
            } else if (type === 'success') {
                modal.classList.add('bg-green-600');
            } else {
                modal.classList.add('bg-blue-600');
            }
            
            modal.classList.remove('hidden', 'opacity-0', '-translate-y-full');
            modal.classList.add('opacity-100', 'translate-y-0');
            
            const close = () => {
                modal.classList.add('opacity-0', '-translate-y-full');
                modal.classList.remove('opacity-100', 'translate-y-0');
                setTimeout(() => modal.classList.add('hidden'), 300);
            };

            modalClose.onclick = close;
            setTimeout(close, 4000);
        }

        // --- Event Listeners ---
        window.onload = () => {
            loadDeckFromStorage();
            clearCardForm();
            
            document.getElementById('btn-workshop').onclick = () => switchView('workshop');
            document.getElementById('btn-play').onclick = () => switchView('play');
            document.getElementById('btn-manage').onclick = () => switchView('manage');
            
            document.getElementById('card-content').oninput = updateCardPreview;
            document.getElementById('card-bg-color').oninput = updateCardPreview;
            document.getElementById('card-text-color').oninput = updateCardPreview;
            document.getElementById('card-border-color').oninput = updateCardPreview;
            
            document.getElementById('btn-add-card').onclick = addCard;
            document.getElementById('btn-export').onclick = exportDeckAsJSON;
            document.getElementById('btn-import').onclick = importDeckFromJSON;
            document.getElementById('btn-clear').onclick = clearAllData;
            
            document.getElementById('deck-name-input').onchange = updateDeckName;
            
            document.getElementById('btn-next-card').onclick = nextCard;
            document.getElementById('btn-prev-card').onclick = prevCard;
            
            switchView('workshop');
        };

        // Make functions globally accessible
        window.switchView = switchView;
        window.updateCardPreview = updateCardPreview;
        window.addCard = addCard;
        window.nextCard = nextCard;
        window.prevCard = prevCard;
        window.initPlayMode = initPlayMode;
    </script>
    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937;
        }
        ::-webkit-scrollbar-thumb {
            background: #4f46e5;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6366f1;
        }
        
        input[type="color"] {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 40px;
            height: 40px;
            padding: 0;
            border: 2px solid #4b5563;
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 6px;
        }
    </style>
</head>
<body class="text-white">

    <!-- Global Modal -->
    <div id="modal" class="hidden fixed top-4 left-1/2 -translate-x-1/2 w-full max-w-md p-4 rounded-lg shadow-lg text-white z-50 transition-all duration-300 transform opacity-0 -translate-y-full">
        <div class="flex justify-between items-center">
            <p id="modal-message">Message</p>
            <button id="modal-close" class="text-xl font-bold">&times;</button>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container mx-auto p-4 max-w-6xl">
        
        <!-- Header & View Toggler -->
        <header class="flex flex-col sm:flex-row justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-white mb-4 sm:mb-0">Card Deck Builder</h1>
            <div class="flex space-x-2 bg-gray-800 p-1 rounded-lg">
                <button id="btn-workshop" class="px-4 py-2 text-sm font-medium rounded-md text-white bg-indigo-600">
                    Workshop
                </button>
                <button id="btn-play" class="px-4 py-2 text-sm font-medium rounded-md text-white bg-gray-700">
                    Play
                </button>
                <button id="btn-manage" class="px-4 py-2 text-sm font-medium rounded-md text-white bg-gray-700">
                    Manage
                </button>
            </div>
        </header>

        <!-- === WORKSHOP VIEW === -->
        <main id="workshop-view" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Column 1: Card Creator Form -->
            <div class="md:col-span-2 bg-gray-800 p-6 rounded-lg shadow-xl">
                <h2 class="text-2xl font-semibold mb-4 text-white">Create Cards</h2>
                
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <!-- Left Side: Content & Count -->
                    <div class="space-y-4">
                        <div>
                            <label for="card-content" class="block text-sm font-medium text-gray-300">Card Content</label>
                            <input type="text" id="card-content" maxlength="50" class="mt-1 block w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md shadow-sm text-white placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="e.g., ♠, Attack, Question 1">
                        </div>
                        
                        <div>
                            <label for="card-count" class="block text-sm font-medium text-gray-300">Quantity</label>
                            <input type="number" id="card-count" min="1" max="100" value="1" class="mt-1 block w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md shadow-sm text-white placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                        </div>
                        
                        <div class="pt-2">
                            <label class="block text-sm font-medium text-gray-300 mb-2">Colors</label>
                            <div class="flex items-center space-x-4">
                                <div>
                                    <label for="card-bg-color" class="block text-xs font-medium text-gray-400">Background</label>
                                    <input type="color" id="card-bg-color" value="#ffffff" class="mt-1">
                                </div>
                                <div>
                                    <label for="card-text-color" class="block text-xs font-medium text-gray-400">Text</label>
                                    <input type="color" id="card-text-color" value="#000000" class="mt-1">
                                </div>
                                <div>
                                    <label for="card-border-color" class="block text-xs font-medium text-gray-400">Border</label>
                                    <input type="color" id="card-border-color" value="#cccccc" class="mt-1">
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Right Side: Preview -->
                    <div class="space-y-3 flex flex-col justify-center items-center">
                        <label class="block text-sm font-medium text-gray-300">Preview</label>
                        <div id="preview-card" class="aspect-video w-32 rounded-lg shadow-md flex items-center justify-center text-2xl font-bold border-2 bg-white text-black border-gray-300">
                            ♠
                        </div>
                    </div>
                </div>
                
                <!-- Add Button -->
                <div class="mt-8 pt-6 border-t border-gray-700">
                    <button id="btn-add-card" class="w-full px-6 py-3 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 focus:ring-offset-gray-800">
                        Add Cards to Deck
                    </button>
                </div>
            </div>
            
            <!-- Column 2: Card Grid & Deck Info -->
            <aside class="md:col-span-1 bg-gray-800 p-6 rounded-lg shadow-xl">
                <h2 class="text-2xl font-semibold mb-2 text-white">Current Deck</h2>
                
                <div class="mb-4">
                    <label for="deck-name-input" class="block text-sm font-medium text-gray-300">Deck Name</label>
                    <input type="text" id="deck-name-input" value="My Deck" class="mt-1 block w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-white text-sm">
                </div>
                
                <div class="mb-6 bg-gray-900 p-4 rounded-lg">
                    <p class="text-gray-400 text-sm">Total Cards</p>
                    <p id="card-count-display" class="text-3xl font-bold text-indigo-400">0</p>
                </div>
                
                <div id="card-grid" class="grid grid-cols-2 gap-2 max-h-96 overflow-y-auto mb-4">
                    <!-- Card grid will be rendered here -->
                </div>
                
                <div class="space-y-2 pt-4 border-t border-gray-700">
                    <button id="btn-export" class="w-full px-4 py-2 text-sm bg-blue-600 hover:bg-blue-700 text-white rounded-lg">Export JSON</button>
                    <button id="btn-import" class="w-full px-4 py-2 text-sm bg-purple-600 hover:bg-purple-700 text-white rounded-lg">Import JSON</button>
                    <button id="btn-clear" class="w-full px-4 py-2 text-sm bg-red-600 hover:bg-red-700 text-white rounded-lg">Clear Deck</button>
                </div>
            </aside>

        </main>
        
        <!-- === PLAY VIEW === -->
        <main id="play-view" class="hidden">
            <div class="flex flex-col items-center justify-center min-h-96">
                <div id="play-card-display" class="mb-8">
                    <!-- Card will be displayed here -->
                </div>
                
                <div class="flex space-x-4 mb-6">
                    <button id="btn-prev-card" class="px-6 py-3 bg-gray-700 hover:bg-gray-600 text-white rounded-lg font-medium">← Previous</button>
                    <button id="btn-next-card" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium">Next →</button>
                </div>
                
                <div class="text-center text-gray-400">
                    <p>Progress: <span id="play-progress">0 / 0</span></p>
                </div>
            </div>
        </main>
        
        <!-- === MANAGE VIEW === -->
        <main id="manage-view" class="hidden">
            <div class="bg-gray-800 p-8 rounded-lg shadow-xl max-w-2xl mx-auto">
                <h2 class="text-2xl font-semibold mb-8 text-white">Deck Statistics</h2>
                <div id="manage-stats">
                    <!-- Stats will be rendered here -->
                </div>
            </div>
        </main>
        
    </div>
    
</body>
</html>
