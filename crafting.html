<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>🔎 Crafting</title>
    <style>
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#f5f8fb;color:#122;}
        .container{max-width:980px;margin:2rem auto;padding:1rem}
        .card{background:white;padding:1rem;border-radius:12px;box-shadow:0 8px 24px rgba(14,30,37,0.06)}
        .controls{display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
        input[type=text]{padding:0.5rem;border-radius:8px;border:1px solid #e6eefc}
        button{padding:0.5rem 0.8rem;border-radius:8px;border:none;background:#2b8cff;color:white;cursor:pointer}
        button.secondary{background:#2ecc71}
        .summary{display:flex;gap:1rem;margin-top:1rem}
        .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:0.75rem;margin-top:1rem}
        .item{background:#fff;border-radius:8px;padding:8px;display:flex;gap:8px;align-items:center}
        .thumb{width:56px;height:56px;border-radius:6px;overflow:hidden;background:#f0f0f0}
        .thumb img{width:100%;height:100%;object-fit:cover}
        .muted{color:#667}
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🔎 Crafting</h1>
            <p class="muted">Compare a BGG collection (v2) to a Geeklist and see which collection items appear on the list. Default username: <strong>sportomax</strong>. Geeklist: <a href="https://boardgamegeek.com/geeklist/186909" target="_blank">186909</a></p>

            <div class="controls">
                <label style="font-size:0.9rem;color:#445">Username</label>
                <input id="username" type="text" value="sportomax" />
                <label style="font-size:0.9rem;color:#445">Compare Geeklist</label>
                <select id="geeklistSelect">
                    <option value="186909">186909 — 3D Printing</option>
                    <option value="318181">318181 — Small-Box Jackets</option>
                </select>
                <button id="runBtn">Run Check</button>
                <button id="refreshBtn" class="secondary">Refresh</button>
            </div>

            <div id="status" class="muted">Idle</div>

            <div id="log" style="margin-top:0.5rem;max-height:140px;overflow:auto;background:#fbfdff;border-radius:8px;padding:8px;font-family:monospace;font-size:12px;color:#234;box-shadow:inset 0 1px 0 rgba(0,0,0,0.02)"></div>

            <div class="summary">
                <div class="muted">Collection: <span id="colCount">—</span></div>
                <div class="muted">Geeklist Items: <span id="glCount">—</span></div>
                <div class="muted">Intersection: <span id="matchCount">—</span></div>
            </div>

            <div style="margin-top:1rem">
                <h3>Matches (in collection & on geeklist)</h3>
                <div id="matches" class="list"></div>
            </div>

            <div style="margin-top:1rem">
                <h3>Not In Geeklist (in collection only)</h3>
                <div id="collectionOnly" class="list"></div>
            </div>

        </div>
    </div>

    <script>
        // Contents copied from geeklist-coverage.html; kept behavior and parsing intact under new name
        const runBtn = document.getElementById('runBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const status = document.getElementById('status');
        const colCount = document.getElementById('colCount');
        const glCount = document.getElementById('glCount');
        const matchCount = document.getElementById('matchCount');
        const matchesRoot = document.getElementById('matches');
        const colOnlyRoot = document.getElementById('collectionOnly');

        async function fetchCollection(username){
            status.textContent = 'Fetching collection...';
            const url = `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1`;
            const text = await fetch(url).then(r=>r.text());
            const parser = new DOMParser();
            const xml = parser.parseFromString(text,'text/xml');
            const items = Array.from(xml.querySelectorAll('item'));
            const games = items.map(it=>({
                id: it.getAttribute('objectid') || it.getAttribute('id') || '',
                name: it.querySelector('name')?.textContent || '',
                thumbnail: it.querySelector('thumbnail')?.textContent || ''
            }));
            return games;
        }

        async function fetchGeeklist(id){
            status.textContent = 'Fetching geeklist (API)...';
            const apiUrl = `/api/bgg-helper?endpoint=geeklist&id=${encodeURIComponent(id)}`;

            async function parseXmlTextToIds(text){
                const parser = new DOMParser();
                const xml = parser.parseFromString(text,'text/xml');
                const ids = new Set();
                Array.from(xml.querySelectorAll('objectid')).forEach(n=>{ const v=(n.textContent||'').trim(); if(v) ids.add(v); });
                Array.from(xml.querySelectorAll('item')).forEach(it=>{
                    const obj = it.getAttribute('objectid') || it.getAttribute('id');
                    if(obj) ids.add(obj);
                });
                Array.from(xml.querySelectorAll('thing')).forEach(t=>{ const o=t.getAttribute('objectid')||t.getAttribute('id'); if(o) ids.add(o); });
                try{
                    const shortcodeRe = /\[thing=(\d+)\]|\[geekitem=(\d+)\]|thing=(\d+)/gi;
                    let m;
                    while((m = shortcodeRe.exec(text)) !== null){
                        for(let i=1;i<m.length;i++) if(m[i]) ids.add(m[i]);
                    }
                    const objTagRe = /<objectid>(\d+)<\/objectid>/gi;
                    while((m = objTagRe.exec(text)) !== null) ids.add(m[1]);
                }catch(e){ console.warn('Shortcode extraction failed', e.message); }
                return Array.from(ids);
            }

            async function parseItemsMap(text){
                const map = new Map();
                try{
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(text,'text/xml');
                    const items = Array.from(xml.querySelectorAll('item'));
                    items.forEach(it=>{
                        const raw = it.innerHTML || it.textContent || '';
                        let id = (it.getAttribute('objectid')||it.getAttribute('id')||'').trim();
                        const title = (it.querySelector('title')||it.querySelector('name')||{}).textContent || '';
                        const body = (it.querySelector('description')||it.querySelector('body')||{textContent: raw}).textContent || raw;
                        const thing = it.querySelector('thing');
                        if(thing && !id){ id = thing.getAttribute('objectid')||thing.getAttribute('id')||''; }
                        if(!id){ const m = raw.match(/\[thing=(\d+)\]/); if(m) id = m[1]; }
                        let image = '';
                        const thumb = it.querySelector('thumbnail') || it.querySelector('thumb') || it.querySelector('image');
                        if(thumb) image = thumb.textContent || thumb.getAttribute('src') || '';
                        const imageUrls = [];
                        try{
                            const imgShortRe = /\[imageid=(\d+)[^\]]*\]/gi;
                            let mm;
                            while((mm = imgShortRe.exec(raw)) !== null){ if(mm[1]) imageUrls.push('https://boardgamegeek.com/image/'+mm[1]); }
                        }catch(e){}
                        try{
                            const urlRe = /https?:\/\/[^\s"'<>]+/gi;
                            let m2;
                            while((m2 = urlRe.exec(body)) !== null){ const u = m2[0]; if(/boardgamegeek\.com\/image\//i.test(u) || /makerworld\.com/i.test(u) || /\.(png|jpe?g|gif)/i.test(u)) imageUrls.push(u); }
                        }catch(e){}
                        if(image) imageUrls.unshift(image);
                        let sourceUrl = '';
                        try{
                            const linkMatch = raw.match(/https?:\/\/[^\s"'<>]+/i);
                            if(linkMatch) sourceUrl = linkMatch[0];
                        }catch(e){}

                        if(id) map.set(String(id), { id: String(id), title: title||('Item '+id), body: (body||'').trim(), image: image || (imageUrls[0]||''), imageUrls: imageUrls, sourceUrl });
                    });
                }catch(e){ console.warn('parseItemsMap failed', e.message); }
                return map;
            }

            try{
                const text = await fetch(apiUrl).then(r=>r.text());
                log(`API fetch for geeklist ${id}: ${text.slice(0,120).replace(/\n/g,' ')}...`);
                if(/accepted and will be processed|queued/i.test(text)){
                    console.warn('BGG API returned queued response for geeklist; will fallback to local files');
                } else {
                    const ids = await parseXmlTextToIds(text);
                    const itemsMap = await parseItemsMap(text);
                    if(ids.length) return { ids, itemsMap };
                }
            }catch(e){
                console.warn('Geeklist API fetch failed:', e.message);
                log('Geeklist API fetch failed: '+e.message);
            }

            const fallbackFiles = ['/vfmdenverco.xml','/vfm25bgg.xml','/library_bgg.xml','/library.html'];
            for(const f of fallbackFiles){
                try{
                    status.textContent = `Fetching geeklist (fallback ${f})...`;
                    const txt = await fetch(f).then(r=>r.text()).catch(()=>null);
                    if(!txt) continue;
                    const ids = await parseXmlTextToIds(txt);
                    const itemsMap = await parseItemsMap(txt);
                    if(ids.length) return { ids, itemsMap };
                }catch(err){
                    console.warn('Fallback fetch failed for', f, err.message);
                }
            }

            return { ids: [], itemsMap: new Map() };
        }

        function renderList(root, games){
            root.innerHTML = '';
            games.forEach(g=>{
                const el = document.createElement('div'); el.className='item';
                el.innerHTML = `<div class="thumb"><img src="${g.thumbnail||''}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=100 height=100 fill=%23f0f0f0/%3E%3C/svg%3E'"/></div><div><div style='font-weight:700'>${g.name}</div><div class='muted' style='font-size:12px'>ID: ${g.id}</div></div>`;
                el.addEventListener('click', ()=> showItemDetail(g.id));
                root.appendChild(el);
            });
        }

        function log(msg){
            console.log(msg);
            const l = document.getElementById('log');
            if(!l) return;
            const el = document.createElement('div'); el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            l.appendChild(el);
            l.scrollTop = l.scrollHeight;
        }

        async function showItemDetail(id){
            const im = window.__gl_items || new Map();
            const data = im.get(String(id));
            let html = `<div style="padding:12px;max-width:760px">`;
            if(data){
                let resolved = null;
                if(data.image){
                    if(/boardgamegeek\.com\/image\//i.test(data.image) || /boardgamegeek\.com\/file\//i.test(data.image)){
                        try{
                            resolved = await fetchImageFromBGGPage(data.image);
                            if(!resolved) resolved = data.image;
                        }catch(e){ console.warn('resolve image failed', e.message); resolved = data.image; }
                    } else {
                        resolved = data.image;
                    }
                }

                if(Array.isArray(data.imageUrls) && data.imageUrls.length){
                    html += `<div style="width:220px;float:left;margin-right:12px">`;
                    data.imageUrls.slice(0,6).forEach(u=>{
                        let link = u;
                        if(/boardgamegeek\.com\/image\//i.test(u)) link = 'https://images.weserv.nl/?url='+encodeURIComponent(u);
                        html += `<div style="margin-bottom:6px"><a href="${u}" target="_blank"><img src="${link}" style="width:100%;border-radius:6px" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=100 height=100 fill=%23f0f0f0/%3E%3C/svg%3E'"/></a></div>`;
                    });
                    html += `</div>`;
                } else if(resolved) {
                    html += `<div style="width:220px;float:left;margin-right:12px"><img id="glImg" src="${resolved}" style="width:100%;border-radius:8px" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=100 height=100 fill=%23f0f0f0/%3E%3C/svg%3E'"/></div>`;
                    html += `<div style="clear:both;margin-top:8px;font-size:12px;color:#335">Image URL: <a href="${resolved}" target="_blank">${resolved}</a></div>`;
                }

                html += `<div style="font-weight:700;font-size:16px">${data.title||('Item '+id)}</div><div style='font-size:13px;color:#445;margin-top:8px'>${(data.body||'').replace(/\n/g,'<br/>')}</div>`;
                if(data.sourceUrl) html += `<div style="margin-top:8px;font-size:12px;color:#335">Source: <a href="${data.sourceUrl}" target="_blank">${data.sourceUrl}</a></div>`;
            } else {
                html += `<div style="font-weight:700">No detail available for ID ${id}</div>`;
            }
            html += `</div>`;
            let modal = document.getElementById('glModal');
            if(!modal){
                modal = document.createElement('div'); modal.id='glModal';
                modal.style = 'position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:9999';
                modal.addEventListener('click', ()=> modal.remove());
                const inner = document.createElement('div'); inner.id='glModalInner'; inner.style='background:white;border-radius:12px;padding:12px;max-height:80vh;overflow:auto';
                modal.appendChild(inner); document.body.appendChild(modal);
            }
            document.getElementById('glModalInner').innerHTML = html;
        }

        async function fetchImageFromBGGPage(pageUrl){
            try{
                log('Resolving image page: '+pageUrl);
                const res = await fetch(`/api/bgg-helper?endpoint=page&url=${encodeURIComponent(pageUrl)}`);
                if(!res.ok) throw new Error('proxy fetch failed '+res.status);
                const text = await res.text();
                const m = text.match(/<img[^>]+src=["']?([^"'\s>]+)["']?/i);
                if(m && m[1]){
                    let src = m[1];
                    if(src.startsWith('//')) src = 'https:'+src;
                    if(src.startsWith('/')) src = 'https://boardgamegeek.com'+src;
                    try{ return 'https://images.weserv.nl/?url='+encodeURIComponent(src); }catch(e){ return src; }
                }
            }catch(e){ console.warn('fetchImageFromBGGPage failed', e.message); log('Image resolve failed: '+e.message); }
            return null;
        }

        async function runCheck(){
            const username = document.getElementById('username').value.trim() || 'sportomax';
                const geeklistId = document.getElementById('geeklistSelect').value || '186909';
            try{
                status.textContent = 'Fetching collection...'; log('Starting collection fetch for '+username);
                const collection = await fetchCollection(username);
                colCount.textContent = collection.length;

                status.textContent = 'Fetching geeklist...'; log('Requesting geeklist '+geeklistId);
                const primary = await fetchGeeklist(geeklistId);
                const glIds = new Set(primary.ids || []);
                const itemsMap = new Map(primary.itemsMap || []);
                glCount.textContent = glIds.size;

                window.__gl_items = itemsMap;

                const colMap = new Map(collection.map(g=>[String(g.id), g]));
                const matches = [];
                const colOnly = [];

                collection.forEach(g=>{ if(glIds.has(String(g.id))) matches.push(g); else colOnly.push(g); });

                matchCount.textContent = matches.length;
                renderList(matchesRoot, matches.slice(0,200));
                renderList(colOnlyRoot, colOnly.slice(0,200));
                status.textContent = 'Done'; log('Done. Matches: '+matches.length+' / Collection: '+collection.length+' / Geeklist items: '+glIds.size);
            }catch(e){
                status.textContent = 'Error: '+e.message;
                console.error(e);
            }
        }

        runBtn.addEventListener('click', runCheck);
        refreshBtn.addEventListener('click', runCheck);
    </script>
</body>
</html>
```
