<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>🔎 Crafting Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top right, rgba(59, 130, 246, 0.15), transparent),
                              radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.1), transparent);
            color: #f8fafc;
            min-height: 100vh;
            overscroll-behavior: none;
        }

        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tab-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .tab-btn.active {
            color: #3b82f6;
        }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: #3b82f6;
            border-radius: 2px;
        }

        .game-card {
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .game-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.5);
        }

        .thumb-img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* DO NOT ZOOM */
            padding: 4px;
        }

        .modal-body a {
            color: #60a5fa;
            text-decoration: underline;
            word-break: break-all;
        }

        .sort-select {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
        }
        .sort-select:focus { border-color: #3b82f6; }
        .sort-select option { background: #0f172a; color: white; }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }

        .modal-overlay {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade { animation: fadeIn 0.3s ease-out forwards; }

        /* iPhone optimizations */
        @media (max-width: 640px) {
            .game-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Header & Controls -->
        <header class="glass rounded-[2.5rem] p-6 md:p-8 flex flex-col md:flex-row justify-between items-center gap-6 shadow-2xl">
            <div class="space-y-1 text-center md:text-left">
                <h1 class="text-3xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 uppercase">Crafting Finder</h1>
                <p class="text-xs font-bold text-slate-400 tracking-widest uppercase">Geeklist Coverage Tool</p>
            </div>

            <div class="flex flex-wrap justify-center gap-3">
                <div class="flex flex-col gap-1">
                    <label class="text-[10px] font-black text-slate-500 uppercase ml-2">BGG User</label>
                    <input id="username" type="text" value="sportomax" class="bg-slate-900/50 border border-slate-700 px-4 py-2 rounded-xl text-sm focus:border-blue-500 outline-none w-32 md:w-40">
                </div>
                <div class="flex flex-col gap-1">
                    <label class="text-[10px] font-black text-slate-500 uppercase ml-2">Geeklist</label>
                    <select id="geeklistSelect" class="bg-slate-900/50 border border-slate-700 px-4 py-2 rounded-xl text-sm focus:border-blue-500 outline-none w-44 md:w-56 appearance-none">
                        <option value="186909">186909 — 3D Printing</option>
                        <option value="318181">318181 — Small-Box Jackets</option>
                        <option value="329315">329315 — Vertical Storage</option>
                    </select>
                </div>
                <div class="flex items-end gap-2">
                    <button id="runBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-xl text-sm font-black uppercase tracking-wider transition-all shadow-lg shadow-blue-900/20 active:scale-95">Run</button>
                    <button id="refreshBtn" class="glass border-slate-700 hover:bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-sm font-bold active:scale-95">↻</button>
                </div>
            </div>
        </header>

        <!-- Stats Bar -->
        <div class="grid grid-cols-3 gap-4">
            <div class="glass rounded-3xl p-4 text-center">
                <span id="colCount" class="block text-2xl font-black text-white">—</span>
                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-tighter">Collection</span>
            </div>
            <div class="glass rounded-3xl p-4 text-center">
                <span id="glCount" class="block text-2xl font-black text-white">—</span>
                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-tighter">Geeklist</span>
            </div>
            <div class="glass rounded-3xl p-4 text-center border-emerald-500/30">
                <span id="matchCount" class="block text-2xl font-black text-emerald-400">—</span>
                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-tighter">Matches</span>
            </div>
        </div>

        <!-- Main Content & Tabs -->
        <main class="space-y-4">
            <div class="flex items-center justify-between px-4 mt-2">
                <div class="flex gap-6 border-b border-slate-800">
                    <button onclick="switchTab('matches')" id="tab-matches" class="tab-btn active pb-3 text-sm font-black uppercase tracking-widest">Matches</button>
                    <button onclick="switchTab('missing')" id="tab-missing" class="tab-btn pb-3 text-sm font-black uppercase tracking-widest text-slate-500">Missing</button>
                    <button onclick="switchTab('debug')" id="tab-debug" class="tab-btn pb-3 text-sm font-black uppercase tracking-widest text-slate-500">System</button>
                </div>
                
                <div id="sortControls" class="flex items-center gap-2">
                    <label class="text-[9px] font-black text-slate-600 uppercase">Sort By</label>
                    <select id="sortSelect" class="sort-select" onchange="applySort()">
                        <option value="name">Name (A-Z)</option>
                        <option value="id">BGG ID</option>
                    </select>
                </div>
            </div>

            <div id="status" class="text-[10px] font-bold text-blue-400 uppercase tracking-widest ml-4">Idle</div>

            <!-- Matches Tab -->
            <div id="content-matches" class="tab-content">
                <div id="matchesRoot" class="game-grid grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
                    <!-- Cards here -->
                </div>
                <div id="emptyMatches" class="hidden py-20 text-center text-slate-500 font-bold italic">No matches found yet. Run the check!</div>
            </div>

            <!-- Missing Tab -->
            <div id="content-missing" class="tab-content hidden">
                <div id="colOnlyRoot" class="game-grid grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4 opacity-70">
                    <!-- Cards here -->
                </div>
            </div>

            <!-- Debug Tab -->
            <div id="content-debug" class="tab-content hidden space-y-4">
                <div class="glass rounded-3xl p-6">
                    <h3 class="text-sm font-black text-slate-400 uppercase mb-4 tracking-widest">Operation Log</h3>
                    <div id="log" class="custom-scrollbar h-64 overflow-y-auto text-xs font-mono space-y-1 text-slate-300 bg-slate-900/50 p-4 rounded-2xl border border-slate-800"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Detail Modal Template -->
    <div id="detailModal" class="modal-overlay fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div class="glass w-full max-w-2xl max-h-[90vh] rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col md:flex-row animate-fade">
            <div class="md:w-1/2 bg-slate-950/50 flex items-center justify-center p-6 relative">
                <button onclick="closeModal()" class="absolute top-4 left-4 glass w-10 h-10 rounded-full flex items-center justify-center text-white md:hidden">✕</button>
                <div id="modalImages" class="space-y-3 w-full max-h-[400px] overflow-y-auto custom-scrollbar">
                    <!-- Images here -->
                </div>
            </div>
            <div class="md:w-1/2 p-8 flex flex-col justify-between space-y-6">
                <div class="space-y-4">
                    <div class="flex justify-between items-start">
                        <h2 id="modalTitle" class="text-2xl font-black text-white leading-tight"></h2>
                        <button onclick="closeModal()" class="hidden md:flex glass w-10 h-10 rounded-full items-center justify-center text-white hover:bg-slate-800 transition-colors">✕</button>
                    </div>
                    <div id="modalBody" class="text-sm text-slate-400 leading-relaxed max-h-[300px] overflow-y-auto custom-scrollbar"></div>
                </div>
                <div class="pt-6 border-t border-slate-800 flex justify-between items-center">
                    <span id="modalId" class="text-[10px] font-mono text-slate-600 uppercase"></span>
                    <a id="modalSource" href="#" target="_blank" class="text-blue-400 text-xs font-bold hover:underline">View on BGG →</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const runBtn = document.getElementById('runBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const statusEl = document.getElementById('status');
        const colCountEl = document.getElementById('colCount');
        const glCountEl = document.getElementById('glCount');
        const matchCountEl = document.getElementById('matchCount');
        const matchesRoot = document.getElementById('matchesRoot');
        const colOnlyRoot = document.getElementById('colOnlyRoot');
        const logEl = document.getElementById('log');

        const state = {
            collection: [],
            geeklistIds: new Set(),
            itemsMap: new Map(),
            activeTab: 'matches'
        };

        function switchTab(id) {
            state.activeTab = id;
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.getElementById(`content-${id}`).classList.remove('hidden');
            
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('active', 'text-slate-500');
                if (b.id === `tab-${id}`) b.classList.add('active');
                else b.classList.add('text-slate-500');
            });
        }

        async function fetchCollection(username) {
            updateStatus('Fetching collection...', 'loading');
            const url = `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1`;
            const text = await fetch(url).then(r => r.text());
            const parser = new DOMParser();
            const xml = parser.parseFromString(text, 'text/xml');
            const items = Array.from(xml.querySelectorAll('item'));
            return items.map(it => ({
                id: it.getAttribute('objectid') || it.getAttribute('id') || '',
                name: it.querySelector('name')?.textContent || 'Unknown',
                thumbnail: it.querySelector('thumbnail')?.textContent || ''
            }));
        }

        async function fetchGeeklist(id) {
            updateStatus('Fetching geeklist (API)...', 'loading');
            const apiUrl = `/api/bgg-helper?endpoint=geeklist&id=${encodeURIComponent(id)}`;

            async function parseXmlTextToIds(text) {
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, 'text/xml');
                const ids = new Set();
                Array.from(xml.querySelectorAll('objectid')).forEach(n => { const v = (n.textContent || '').trim(); if (v) ids.add(v); });
                Array.from(xml.querySelectorAll('item')).forEach(it => {
                    const obj = it.getAttribute('objectid') || it.getAttribute('id');
                    if (obj) ids.add(obj);
                });
                Array.from(xml.querySelectorAll('thing')).forEach(t => { const o = t.getAttribute('objectid') || t.getAttribute('id'); if (o) ids.add(o); });
                try {
                    const shortcodeRe = /\[thing=(\d+)\]|\[geekitem=(\d+)\]|thing=(\d+)/gi;
                    let m;
                    while ((m = shortcodeRe.exec(text)) !== null) {
                        for (let i = 1; i < m.length; i++) if (m[i]) ids.add(m[i]);
                    }
                } catch (e) {}
                return Array.from(ids);
            }

            async function parseItemsMap(text) {
                const map = new Map();
                try {
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(text, 'text/xml');
                    Array.from(xml.querySelectorAll('item')).forEach(it => {
                        const raw = it.innerHTML || it.textContent || '';
                        let id = (it.getAttribute('objectid') || it.getAttribute('id') || '').trim();
                        const title = (it.querySelector('title') || it.querySelector('name') || {}).textContent || '';
                        const body = (it.querySelector('description') || it.querySelector('body') || { textContent: raw }).textContent || raw;
                        
                        let image = '';
                        const thumb = it.querySelector('thumbnail') || it.querySelector('thumb') || it.querySelector('image');
                        if (thumb) image = thumb.textContent || thumb.getAttribute('src') || '';
                        
                        const imageUrls = [];
                        if (image) imageUrls.push(image);
                        try {
                            const imgShortRe = /\[imageid=(\d+)[^\]]*\]/gi;
                            let mm;
                            while ((mm = imgShortRe.exec(raw)) !== null) { if (mm[1]) imageUrls.push('https://boardgamegeek.com/image/' + mm[1]); }
                        } catch (e) {}

                        if (id) map.set(String(id), { id: String(id), title, body: body.trim(), image, imageUrls });
                    });
                } catch (e) {}
                return map;
            }

            try {
                const text = await fetch(apiUrl).then(r => r.text());
                if (!/accepted and will be processed|queued/i.test(text)) {
                    const ids = await parseXmlTextToIds(text);
                    const itemsMap = await parseItemsMap(text);
                    if (ids.length) return { ids, itemsMap };
                }
            } catch (e) {
                log('Geeklist API failed: ' + e.message);
            }

            return { ids: [], itemsMap: new Map() };
        }

        function renderList(root, games) {
            root.innerHTML = '';
            if (!games.length) return;
            
            games.forEach(g => {
                const card = document.createElement('div');
                card.className = 'game-card glass p-3 rounded-3xl animate-fade';
                card.innerHTML = `
                    <div class="aspect-square rounded-2xl overflow-hidden bg-slate-950/50 mb-3">
                        <img src="${g.thumbnail || ''}" class="thumb-img" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=100 height=100 fill=%231e293b/%3E%3C/svg%3E'">
                    </div>
                    <div class="space-y-1">
                        <div class="text-[10px] font-black text-slate-500 uppercase tracking-tighter truncate">${g.name}</div>
                        <div class="text-[9px] font-mono text-slate-600">#${g.id}</div>
                    </div>
                `;
                card.onclick = () => showItemDetail(g.id);
                root.appendChild(card);
            });
        }

        async function showItemDetail(id) {
            const data = state.itemsMap.get(String(id));
            const modal = document.getElementById('detailModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            const imgContainer = document.getElementById('modalImages');
            const idEl = document.getElementById('modalId');
            const sourceEl = document.getElementById('modalSource');

            title.innerText = data ? data.title : ('Game #' + id);
            
            // Make URLs clickable
            let bodyText = data ? data.body : 'No geeklist description available.';
            bodyText = bodyText.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" class="text-blue-400 underline">$1</a>');
            body.innerHTML = bodyText.replace(/\n/g, '<br/>');
            
            idEl.innerText = 'BGG ID: ' + id;
            sourceEl.href = `https://boardgamegeek.com/boardgame/${id}`;
            
            imgContainer.innerHTML = '';
            const images = data?.imageUrls || [];
            if (images.length === 0) {
                const colGame = state.collection.find(g => String(g.id) === String(id));
                if (colGame && colGame.thumbnail) images.push(colGame.thumbnail);
            }

            images.forEach(u => {
                const wrapper = document.createElement('div');
                wrapper.className = 'rounded-2xl overflow-hidden shadow-lg mb-4';
                let displayUrl = u;
                if (u.includes('boardgamegeek.com/image/')) displayUrl = 'https://images.weserv.nl/?url=' + encodeURIComponent(u);
                wrapper.innerHTML = `<img src="${displayUrl}" class="w-full h-auto" onerror="this.style.display='none'">`;
                imgContainer.appendChild(wrapper);
            });

            modal.classList.remove('hidden');
        }

        function applySort() {
            const criteria = document.getElementById('sortSelect').value;
            const matches = state.collection.filter(g => state.geeklistIds.has(String(g.id)));
            const missing = state.collection.filter(g => !state.geeklistIds.has(String(g.id)));

            const sorter = (a, b) => {
                if (criteria === 'name') return a.name.localeCompare(b.name);
                if (criteria === 'id') return parseInt(a.id) - parseInt(b.id);
                return 0;
            };

            renderList(matchesRoot, matches.sort(sorter));
            renderList(colOnlyRoot, missing.sort(sorter));
        }

        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        function log(msg) {
            const el = document.createElement('div');
            el.innerHTML = `<span class="text-slate-600 font-bold">${new Date().toLocaleTimeString()}</span> ${msg}`;
            logEl.appendChild(el);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function updateStatus(msg, type) {
            statusEl.innerText = msg;
            statusEl.className = `text-[10px] font-bold uppercase tracking-widest ml-4 ${type === 'loading' ? 'text-blue-400' : 'text-emerald-400'}`;
        }

        async function runCheck() {
            const username = document.getElementById('username').value.trim() || 'sportomax';
            const geeklistId = document.getElementById('geeklistSelect').value;
            
            try {
                log(`Starting check for ${username} against list ${geeklistId}`);
                state.collection = await fetchCollection(username);
                colCountEl.innerText = state.collection.length;

                const glData = await fetchGeeklist(geeklistId);
                state.geeklistIds = new Set(glData.ids);
                state.itemsMap = glData.itemsMap;
                glCountEl.innerText = state.geeklistIds.size;

                const matches = [];
                const missing = [];

                state.collection.forEach(g => {
                    if (state.geeklistIds.has(String(g.id))) matches.push(g);
                    else missing.push(g);
                });

                matchCountEl.innerText = matches.length;
                renderList(matchesRoot, matches);
                renderList(colOnlyRoot, missing);

                document.getElementById('emptyMatches').classList.toggle('hidden', matches.length > 0);
                updateStatus('Complete', 'ready');
                log(`Found ${matches.length} matches and ${missing.length} missing items.`);
            } catch (e) {
                updateStatus('Error: ' + e.message, 'error');
                log('Error: ' + e.message);
            }
        }

        runBtn.onclick = runCheck;
        refreshBtn.onclick = runCheck;
        document.getElementById('detailModal').onclick = (e) => {
            if (e.target.id === 'detailModal') closeModal();
        };

        // Initial UI state
        updateStatus('Ready', 'ready');
    </script>
</body>
</html>
