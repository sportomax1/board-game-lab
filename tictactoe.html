<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>BGG Tic-Tac-Toe</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>⭕</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow: hidden;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 500px;
        }

        .screen.active {
            display: block;
        }

        .setup-card, .game-card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 2rem;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        input[type="text"], select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #f39c12;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(243, 156, 18, 0.4);
        }

        .btn-secondary {
            background: #ecf0f1;
            color: #2c3e50;
        }

        .btn-secondary:hover {
            background: #bdc3c7;
        }

        .game-info {
            text-align: center;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .current-player {
            font-size: 1.25rem;
            font-weight: 600;
            color: #2c3e50;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        @media (max-width: 600px) {
            .game-board {
                gap: 0.5rem;
            }
        }

        .cell {
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: transform 0.3s;
            background: #ecf0f1;
            border: 3px solid transparent;
        }

        .cell:hover:not(.taken) {
            transform: scale(1.05);
            border-color: #f39c12;
        }

        .cell.taken {
            cursor: not-allowed;
        }

        .cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cell.x {
            border-color: #e74c3c;
        }

        .cell.o {
            border-color: #3498db;
        }

        .cell.winning {
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .game-over {
            text-align: center;
            padding: 1.5rem;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .game-over h2 {
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }

        .controls {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .controls .btn {
            flex: 1;
            min-width: 120px;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #7f8c8d;
        }

        .error-message {
            background: #e74c3c;
            color: white;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .mode-toggle {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .mode-toggle button {
            flex: 1;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .mode-toggle button.active {
            background: #f39c12;
            color: white;
            border-color: #f39c12;
        }

        .score-display {
            display: flex;
            justify-content: space-around;
            margin-top: 1rem;
            padding: 0.75rem;
            background: white;
            border-radius: 8px;
        }

        .score-item {
            text-align: center;
        }

        .score-label {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-bottom: 0.25rem;
        }

        .score-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .score-value.x {
            color: #e74c3c;
        }

        .score-value.o {
            color: #3498db;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.5rem;
            }

            .setup-card, .game-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Setup Screen -->
    <div id="setupScreen" class="screen active">
        <div class="setup-card">
            <h1>⭕ BGG Tic-Tac-Toe</h1>
            <p class="subtitle">Classic tic-tac-toe with board game thumbnails</p>

            <div class="form-group">
                <label for="usernameInput">BGG Username</label>
                <input type="text" id="usernameInput" placeholder="Enter your BGG username" autocomplete="off">
            </div>

            <div class="form-group">
                <label>Game Mode</label>
                <div class="mode-toggle">
                    <button type="button" class="mode-btn active" data-mode="ai">vs AI</button>
                    <button type="button" class="mode-btn" data-mode="2player">2 Players</button>
                </div>
            </div>

            <div class="form-group" id="difficultyGroup">
                <label for="difficultySelect">AI Difficulty</label>
                <select id="difficultySelect">
                    <option value="easy">Easy - Random moves</option>
                    <option value="medium" selected>Medium - Some strategy</option>
                    <option value="hard">Hard - Unbeatable</option>
                </select>
            </div>

            <button class="btn btn-primary" onclick="startGame()">Start Game</button>
            <button class="btn btn-secondary" onclick="window.location.href='home.html'">Back to Home</button>

            <div id="errorMessage" class="error-message" style="display: none;"></div>
            <div id="loadingMessage" class="loading" style="display: none;">
                Loading your collection...
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="screen">
        <div class="game-card">
            <h1>⭕ Tic-Tac-Toe</h1>
            
            <div id="gameOverMessage" style="display: none;"></div>

            <div class="game-info">
                <div class="current-player" id="currentPlayer">
                    Current Player: X
                </div>
                <div class="score-display">
                    <div class="score-item">
                        <div class="score-label">X Wins</div>
                        <div class="score-value x" id="xWins">0</div>
                    </div>
                    <div class="score-item">
                        <div class="score-label">Draws</div>
                        <div class="score-value" id="draws">0</div>
                    </div>
                    <div class="score-item">
                        <div class="score-label">O Wins</div>
                        <div class="score-value o" id="oWins">0</div>
                    </div>
                </div>
            </div>

            <div class="game-board" id="gameBoard">
                <!-- Cells will be inserted here -->
            </div>

            <div class="controls">
                <button class="btn btn-secondary" onclick="newRound()">New Round</button>
                <button class="btn btn-secondary" onclick="resetScores()">Reset Scores</button>
                <button class="btn btn-secondary" onclick="backToSetup()">Setup</button>
            </div>
        </div>
    </div>

    <script>
        const IMAGE_PROXY = 'https://images.weserv.nl/?url=';
        let collection = [];
        let gameMode = 'ai';
        let difficulty = 'medium';
        let currentPlayer = 'x';
        let board = Array(9).fill(null);
        let gameActive = true;
        let playerThumbnails = { x: null, o: null };
        let scores = { x: 0, o: 0, draw: 0 };

        // Winning combinations
        const winPatterns = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // columns
            [0, 4, 8], [2, 4, 6] // diagonals
        ];

        // Mode selection
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                gameMode = this.dataset.mode;
                document.getElementById('difficultyGroup').style.display = 
                    gameMode === 'ai' ? 'block' : 'none';
            });
        });

        async function startGame() {
            const username = document.getElementById('usernameInput').value.trim();
            const errorEl = document.getElementById('errorMessage');
            const loadingEl = document.getElementById('loadingMessage');

            errorEl.style.display = 'none';
            
            if (!username) {
                errorEl.textContent = 'Please enter a BGG username';
                errorEl.style.display = 'block';
                return;
            }

            difficulty = document.getElementById('difficultySelect').value;
            loadingEl.style.display = 'block';

            try {
                const response = await fetch(`https://boardgamegeek.com/xmlapi2/collection?username=${username}&own=1`);
                const text = await response.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, 'text/xml');

                const items = xml.querySelectorAll('item');
                
                if (items.length === 0) {
                    throw new Error('No games found in collection');
                }

                collection = Array.from(items).map(item => {
                    const name = item.querySelector('name');
                    const thumbnail = item.querySelector('thumbnail');
                    const objectid = item.getAttribute('objectid');
                    
                    return {
                        id: objectid,
                        name: name ? name.textContent : 'Unknown',
                        thumbnail: thumbnail ? thumbnail.textContent : null,
                    };
                }).filter(game => game.thumbnail);

                if (collection.length < 2) {
                    throw new Error('Need at least 2 games with thumbnails in your collection');
                }

                loadingEl.style.display = 'none';
                localStorage.setItem('tictactoe_username', username);
                initializeGame();
            } catch (error) {
                loadingEl.style.display = 'none';
                errorEl.textContent = `Error loading collection: ${error.message}`;
                errorEl.style.display = 'block';
            }
        }

        function initializeGame() {
            // Select random thumbnails for X and O
            const shuffled = [...collection].sort(() => Math.random() - 0.5);
            playerThumbnails.x = shuffled[0];
            playerThumbnails.o = shuffled[1];

            // Load scores from localStorage
            const savedScores = localStorage.getItem('tictactoe_scores');
            if (savedScores) {
                scores = JSON.parse(savedScores);
                updateScoreDisplay();
            }

            newRound();
            
            // Switch to game screen
            document.getElementById('setupScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.add('active');
        }

        function newRound() {
            board = Array(9).fill(null);
            currentPlayer = 'x';
            gameActive = true;
            document.getElementById('gameOverMessage').style.display = 'none';
            renderBoard();
            updateCurrentPlayer();
        }

        function renderBoard() {
            const boardEl = document.getElementById('gameBoard');
            boardEl.innerHTML = board.map((cell, idx) => {
                let content = '';
                if (cell === 'x') {
                    content = `<img src="${IMAGE_PROXY}${playerThumbnails.x.thumbnail}" alt="X">`;
                } else if (cell === 'o') {
                    content = `<img src="${IMAGE_PROXY}${playerThumbnails.o.thumbnail}" alt="O">`;
                }
                
                return `
                    <div class="cell ${cell ? 'taken ' + cell : ''}" onclick="makeMove(${idx})">
                        ${content}
                    </div>
                `;
            }).join('');
        }

        function makeMove(index) {
            if (!gameActive || board[index] !== null) return;

            board[index] = currentPlayer;
            renderBoard();

            const winner = checkWinner();
            if (winner) {
                endGame(winner);
                return;
            }

            if (board.every(cell => cell !== null)) {
                endGame('draw');
                return;
            }

            currentPlayer = currentPlayer === 'x' ? 'o' : 'x';
            updateCurrentPlayer();

            // AI move
            if (gameMode === 'ai' && currentPlayer === 'o' && gameActive) {
                setTimeout(() => {
                    aiMove();
                }, 500);
            }
        }

        function aiMove() {
            if (!gameActive) return;

            let move;
            if (difficulty === 'easy') {
                move = easyAI();
            } else if (difficulty === 'medium') {
                move = mediumAI();
            } else {
                move = hardAI();
            }

            if (move !== null) {
                makeMove(move);
            }
        }

        function easyAI() {
            const available = board.map((cell, idx) => cell === null ? idx : null).filter(idx => idx !== null);
            return available[Math.floor(Math.random() * available.length)];
        }

        function mediumAI() {
            // 50% chance to make optimal move, 50% random
            if (Math.random() < 0.5) {
                return hardAI();
            } else {
                return easyAI();
            }
        }

        function hardAI() {
            // Minimax algorithm
            let bestScore = -Infinity;
            let bestMove = null;

            for (let i = 0; i < 9; i++) {
                if (board[i] === null) {
                    board[i] = 'o';
                    let score = minimax(board, 0, false);
                    board[i] = null;
                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = i;
                    }
                }
            }

            return bestMove;
        }

        function minimax(board, depth, isMaximizing) {
            const winner = checkWinner();
            if (winner === 'o') return 10 - depth;
            if (winner === 'x') return depth - 10;
            if (board.every(cell => cell !== null)) return 0;

            if (isMaximizing) {
                let bestScore = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (board[i] === null) {
                        board[i] = 'o';
                        let score = minimax(board, depth + 1, false);
                        board[i] = null;
                        bestScore = Math.max(score, bestScore);
                    }
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (board[i] === null) {
                        board[i] = 'x';
                        let score = minimax(board, depth + 1, true);
                        board[i] = null;
                        bestScore = Math.min(score, bestScore);
                    }
                }
                return bestScore;
            }
        }

        function checkWinner() {
            for (const pattern of winPatterns) {
                const [a, b, c] = pattern;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    return board[a];
                }
            }
            return null;
        }

        function endGame(result) {
            gameActive = false;
            const gameOverEl = document.getElementById('gameOverMessage');
            
            let message = '';
            if (result === 'draw') {
                message = "It's a Draw! 🤝";
                scores.draw++;
            } else {
                const winnerName = result === 'x' ? 'X' : 'O';
                message = `${winnerName} Wins! 🎉`;
                scores[result]++;
            }

            gameOverEl.innerHTML = `
                <div class="game-over">
                    <h2>${message}</h2>
                </div>
            `;
            gameOverEl.style.display = 'block';

            // Save scores
            localStorage.setItem('tictactoe_scores', JSON.stringify(scores));
            updateScoreDisplay();
        }

        function updateCurrentPlayer() {
            const playerName = currentPlayer === 'x' ? 'X' : 'O';
            const modeText = gameMode === 'ai' && currentPlayer === 'o' ? ' (AI)' : '';
            document.getElementById('currentPlayer').textContent = `Current Player: ${playerName}${modeText}`;
        }

        function updateScoreDisplay() {
            document.getElementById('xWins').textContent = scores.x;
            document.getElementById('oWins').textContent = scores.o;
            document.getElementById('draws').textContent = scores.draw;
        }

        function resetScores() {
            scores = { x: 0, o: 0, draw: 0 };
            localStorage.removeItem('tictactoe_scores');
            updateScoreDisplay();
        }

        function backToSetup() {
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('setupScreen').classList.add('active');
        }

        // Load saved username
        window.addEventListener('DOMContentLoaded', () => {
            const savedUsername = localStorage.getItem('tictactoe_username');
            if (savedUsername) {
                document.getElementById('usernameInput').value = savedUsername;
            }
        });
    </script>
    <!-- Vercel Web Analytics -->
    <script type="module" src="analytics-init.js"></script>
</body>
</html>
