<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>BGG Angry Box</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🎯</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #87CEEB 0%, #4682B4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow: hidden;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 800px;
        }

        .screen.active {
            display: block;
        }

        .setup-card, .game-card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 2rem;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #4682B4;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4682B4 0%, #1e3a8a 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(70, 130, 180, 0.4);
        }

        .btn-secondary {
            background: #ecf0f1;
            color: #2c3e50;
        }

        .btn-secondary:hover {
            background: #bdc3c7;
        }

        #gameCanvas {
            width: 100%;
            max-width: 800px;
            height: 600px;
            border: 3px solid #2c3e50;
            border-radius: 8px;
            background: linear-gradient(to bottom, #87CEEB 0%, #F5DEB3 60%, #8B7355 100%);
            cursor: crosshair;
            display: block;
            margin: 0 auto;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            font-size: 0.8rem;
            color: #7f8c8d;
            margin-bottom: 0.25rem;
        }

        .info-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
        }

        .controls {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .controls .btn {
            flex: 1;
            min-width: 120px;
        }

        .loading {
            text-align: center;
            padding: 2rem;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4682B4;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            display: none;
        }

        .game-over.active {
            display: block;
        }

        .game-over h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #2c3e50;
        }

        .game-over-score {
            font-size: 3rem;
            font-weight: bold;
            color: #4682B4;
            margin: 1rem 0;
        }

        @media (max-width: 768px) {
            #gameCanvas {
                height: 400px;
            }
            
            .game-info {
                flex-wrap: wrap;
            }
            
            .info-item {
                flex: 1;
                min-width: 80px;
            }
        }
    </style>
</head>
<body>
    <!-- Setup Screen -->
    <div id="setupScreen" class="screen active">
        <div class="setup-card">
            <h1>🎯 Angry Box</h1>
            <p class="subtitle">Launch your board game collection to knock down targets!</p>
            
            <div class="form-group">
                <label for="username">BGG Username</label>
                <input type="text" id="username" placeholder="Enter your BGG username">
            </div>

            <div class="form-group">
                <label for="difficulty">Difficulty</label>
                <select id="difficulty">
                    <option value="easy">Easy (10 targets)</option>
                    <option value="medium" selected>Medium (15 targets)</option>
                    <option value="hard">Hard (20 targets)</option>
                </select>
            </div>

            <button class="btn btn-primary" onclick="startGame()">🎮 Start Game</button>
            <button class="btn btn-secondary" onclick="window.location.href='home.html'">🏠 Back to Home</button>
            
            <div id="loadingDiv" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Loading your collection...</p>
            </div>
            
            <div id="errorDiv" class="error" style="display: none;"></div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="screen">
        <div class="game-card">
            <div class="game-info">
                <div class="info-item">
                    <div class="info-label">Score</div>
                    <div class="info-value" id="scoreDisplay">0</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Level</div>
                    <div class="info-value" id="levelDisplay">1</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Shots</div>
                    <div class="info-value" id="shotsDisplay">3</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Targets</div>
                    <div class="info-value" id="targetsDisplay">0</div>
                </div>
            </div>

            <canvas id="gameCanvas"></canvas>

            <div class="controls">
                <button class="btn btn-secondary" onclick="resetLevel()">🔄 Reset Level</button>
                <button class="btn btn-secondary" onclick="pauseGame()">⏸️ Pause</button>
                <button class="btn btn-secondary" onclick="endGame()">🏠 Exit</button>
            </div>

            <div class="game-over" id="gameOver">
                <h2>🎉 Level Complete!</h2>
                <div class="game-over-score" id="finalScore">0</div>
                <p style="margin-bottom: 1rem;">Great job!</p>
                <button class="btn btn-primary" onclick="nextLevel()">➡️ Next Level</button>
                <button class="btn btn-secondary" onclick="endGame()">🏠 Exit</button>
            </div>
        </div>
    </div>

    <script>
        let gameState = {
            username: '',
            games: [],
            score: 0,
            level: 1,
            shots: 3,
            difficulty: 'medium',
            canvas: null,
            ctx: null,
            projectile: null,
            targets: [],
            dragging: false,
            dragStart: null,
            slingshot: { x: 100, y: 500 },
            gravity: 0.5,
            friction: 0.99,
            animationId: null,
            paused: false
        };

        const difficultySettings = {
            easy: { targets: 10, shots: 5 },
            medium: { targets: 15, shots: 3 },
            hard: { targets: 20, shots: 2 }
        };

        async function startGame() {
            const username = document.getElementById('username').value.trim();
            if (!username) {
                showError('Please enter a BGG username');
                return;
            }

            gameState.username = username;
            gameState.difficulty = document.getElementById('difficulty').value;
            
            document.getElementById('loadingDiv').style.display = 'block';
            document.getElementById('errorDiv').style.display = 'none';

            try {
                await loadGames();
                initializeGame();
                document.getElementById('setupScreen').classList.remove('active');
                document.getElementById('gameScreen').classList.add('active');
            } catch (error) {
                showError('Failed to load games: ' + error.message);
            } finally {
                document.getElementById('loadingDiv').style.display = 'none';
            }
        }

        async function fetchBGG(endpoint, params = {}, retries = 5) {
            const queryParams = new URLSearchParams(params).toString();
            const fullUrl = `/api/bgg-helper?endpoint=${endpoint}&${queryParams}`;
            
            try {
                const response = await fetch(fullUrl);

                if (response.status === 202 && retries > 0) {
                    await new Promise(resolve => setTimeout(resolve, 3000));
                    return fetchBGG(endpoint, params, retries - 1);
                }

                if (!response.ok) {
                    throw new Error(`BGG API fetch failed: Status ${response.status}`);
                }

                return await response.text();
            } catch (error) {
                throw new Error(`Network/API error: ${error.message}`);
            }
        }

        async function loadGames() {
            const xmlText = await fetchBGG('collection', { username: gameState.username, own: 1 });
            const parser = new DOMParser();
            const xml = parser.parseFromString(xmlText, 'text/xml');
            
            const items = xml.querySelectorAll('item');
            gameState.games = Array.from(items).map(item => ({
                id: item.getAttribute('objectid'),
                name: item.querySelector('name').textContent,
                thumbnail: item.querySelector('thumbnail')?.textContent || ''
            })).filter(game => game.thumbnail);

            if (gameState.games.length === 0) {
                throw new Error('No games with thumbnails found');
            }
        }

        function initializeGame() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            
            // Set canvas size
            canvas.width = 800;
            canvas.height = 600;
            
            gameState.canvas = canvas;
            gameState.ctx = ctx;
            gameState.score = 0;
            gameState.level = 1;
            gameState.shots = difficultySettings[gameState.difficulty].shots;

            // Setup event listeners
            canvas.addEventListener('mousedown', handleMouseDown);
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('mouseup', handleMouseUp);
            canvas.addEventListener('touchstart', handleTouchStart);
            canvas.addEventListener('touchmove', handleTouchMove);
            canvas.addEventListener('touchend', handleTouchEnd);

            setupLevel();
            gameLoop();
        }

        function setupLevel() {
            const targetCount = difficultySettings[gameState.difficulty].targets;
            gameState.targets = [];
            gameState.projectile = null;
            gameState.shots = difficultySettings[gameState.difficulty].shots;

            // Create target structure
            const startX = 500;
            const startY = 450;
            const boxSize = 40;

            // Build a pyramid of targets
            const rows = Math.ceil(Math.sqrt(targetCount));
            let targetIndex = 0;

            for (let row = 0; row < rows && targetIndex < targetCount; row++) {
                const boxesInRow = rows - row;
                for (let col = 0; col < boxesInRow && targetIndex < targetCount; col++) {
                    const randomGame = gameState.games[Math.floor(Math.random() * gameState.games.length)];
                    gameState.targets.push({
                        x: startX + col * (boxSize + 5) - (boxesInRow * (boxSize + 5)) / 2,
                        y: startY - row * (boxSize + 5),
                        width: boxSize,
                        height: boxSize,
                        vx: 0,
                        vy: 0,
                        rotation: 0,
                        rotationSpeed: 0,
                        active: true,
                        thumbnail: randomGame.thumbnail,
                        image: null,
                        name: randomGame.name
                    });
                    targetIndex++;
                }
            }

            // Preload images
            gameState.targets.forEach(target => {
                const img = new Image();
                img.src = target.thumbnail;
                target.image = img;
            });

            updateDisplay();
        }

        function handleMouseDown(e) {
            if (gameState.paused || gameState.projectile) return;
            
            const rect = gameState.canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (gameState.canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (gameState.canvas.height / rect.height);
            
            const dist = Math.sqrt(Math.pow(x - gameState.slingshot.x, 2) + Math.pow(y - gameState.slingshot.y, 2));
            if (dist < 50) {
                gameState.dragging = true;
                gameState.dragStart = { x, y };
            }
        }

        function handleMouseMove(e) {
            if (!gameState.dragging) return;
            
            const rect = gameState.canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (gameState.canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (gameState.canvas.height / rect.height);
            
            gameState.dragStart = { x, y };
        }

        function handleMouseUp(e) {
            if (!gameState.dragging) return;
            
            launchProjectile();
            gameState.dragging = false;
        }

        function handleTouchStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent('mousedown', {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            gameState.canvas.dispatchEvent(mouseEvent);
        }

        function handleTouchMove(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent('mousemove', {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            gameState.canvas.dispatchEvent(mouseEvent);
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            const mouseEvent = new MouseEvent('mouseup', {});
            gameState.canvas.dispatchEvent(mouseEvent);
        }

        function launchProjectile() {
            if (gameState.shots <= 0 || gameState.projectile) return;

            const dx = gameState.slingshot.x - gameState.dragStart.x;
            const dy = gameState.slingshot.y - gameState.dragStart.y;
            
            const randomGame = gameState.games[Math.floor(Math.random() * gameState.games.length)];
            const img = new Image();
            img.src = randomGame.thumbnail;

            gameState.projectile = {
                x: gameState.slingshot.x,
                y: gameState.slingshot.y,
                vx: dx * 0.2,
                vy: dy * 0.2,
                radius: 20,
                rotation: 0,
                image: img,
                name: randomGame.name
            };

            gameState.shots--;
            updateDisplay();
        }

        function gameLoop() {
            if (gameState.paused) {
                gameState.animationId = requestAnimationFrame(gameLoop);
                return;
            }

            const ctx = gameState.ctx;
            const canvas = gameState.canvas;

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw ground
            ctx.fillStyle = '#8B7355';
            ctx.fillRect(0, 550, canvas.width, 50);

            // Draw slingshot
            drawSlingshot();

            // Update and draw projectile
            if (gameState.projectile) {
                updateProjectile();
                drawProjectile();
            }

            // Update and draw targets
            updateTargets();
            drawTargets();

            // Check win/lose conditions
            checkGameState();

            gameState.animationId = requestAnimationFrame(gameLoop);
        }

        function drawSlingshot() {
            const ctx = gameState.ctx;
            const sling = gameState.slingshot;

            // Draw slingshot base
            ctx.fillStyle = '#654321';
            ctx.fillRect(sling.x - 10, sling.y, 20, 50);

            // Draw band if dragging
            if (gameState.dragging && gameState.dragStart) {
                ctx.strokeStyle = '#654321';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(sling.x - 10, sling.y);
                ctx.lineTo(gameState.dragStart.x, gameState.dragStart.y);
                ctx.lineTo(sling.x + 10, sling.y);
                ctx.stroke();

                // Draw preview projectile
                ctx.save();
                ctx.fillStyle = 'rgba(255, 0, 0, 0.5)';
                ctx.beginPath();
                ctx.arc(gameState.dragStart.x, gameState.dragStart.y, 20, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function updateProjectile() {
            const proj = gameState.projectile;
            if (!proj) return;

            // Apply physics
            proj.vy += gameState.gravity;
            proj.vx *= gameState.friction;
            proj.vy *= gameState.friction;
            
            proj.x += proj.vx;
            proj.y += proj.vy;
            proj.rotation += 0.1;

            // Check collisions with targets
            gameState.targets.forEach(target => {
                if (!target.active) return;
                
                const dist = Math.sqrt(
                    Math.pow(proj.x - (target.x + target.width / 2), 2) + 
                    Math.pow(proj.y - (target.y + target.height / 2), 2)
                );

                if (dist < proj.radius + target.width / 2) {
                    // Hit!
                    target.active = false;
                    target.vx = proj.vx * 0.5;
                    target.vy = proj.vy * 0.5;
                    target.rotationSpeed = (Math.random() - 0.5) * 0.3;
                    gameState.score += 100;
                    updateDisplay();
                }
            });

            // Remove if off screen or stopped
            if (proj.y > 600 || proj.x < 0 || proj.x > 800 || 
                (Math.abs(proj.vx) < 0.1 && Math.abs(proj.vy) < 0.1 && proj.y > 500)) {
                gameState.projectile = null;
            }
        }

        function drawProjectile() {
            const proj = gameState.projectile;
            if (!proj) return;

            const ctx = gameState.ctx;
            ctx.save();
            ctx.translate(proj.x, proj.y);
            ctx.rotate(proj.rotation);
            
            if (proj.image.complete) {
                ctx.drawImage(proj.image, -proj.radius, -proj.radius, proj.radius * 2, proj.radius * 2);
            } else {
                ctx.fillStyle = '#e74c3c';
                ctx.beginPath();
                ctx.arc(0, 0, proj.radius, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.restore();
        }

        function updateTargets() {
            gameState.targets.forEach(target => {
                if (!target.active) {
                    // Apply physics to fallen targets
                    target.vy += gameState.gravity;
                    target.x += target.vx;
                    target.y += target.vy;
                    target.rotation += target.rotationSpeed;
                    target.vx *= 0.98;
                    target.vy *= 0.98;
                }
            });
        }

        function drawTargets() {
            const ctx = gameState.ctx;
            gameState.targets.forEach(target => {
                ctx.save();
                ctx.translate(target.x + target.width / 2, target.y + target.height / 2);
                ctx.rotate(target.rotation);
                
                if (target.image && target.image.complete) {
                    ctx.drawImage(target.image, -target.width / 2, -target.height / 2, target.width, target.height);
                } else {
                    ctx.fillStyle = target.active ? '#3498db' : '#95a5a6';
                    ctx.fillRect(-target.width / 2, -target.height / 2, target.width, target.height);
                }
                
                ctx.restore();
            });
        }

        function checkGameState() {
            const activeTargets = gameState.targets.filter(t => t.active).length;
            document.getElementById('targetsDisplay').textContent = activeTargets;

            // Check if level complete
            if (activeTargets === 0) {
                setTimeout(() => {
                    document.getElementById('finalScore').textContent = gameState.score;
                    document.getElementById('gameOver').classList.add('active');
                    gameState.paused = true;
                }, 500);
            }

            // Check if out of shots
            if (gameState.shots === 0 && !gameState.projectile && activeTargets > 0) {
                setTimeout(() => {
                    alert('Out of shots! Resetting level...');
                    resetLevel();
                }, 1000);
            }
        }

        function updateDisplay() {
            document.getElementById('scoreDisplay').textContent = gameState.score;
            document.getElementById('levelDisplay').textContent = gameState.level;
            document.getElementById('shotsDisplay').textContent = gameState.shots;
            document.getElementById('targetsDisplay').textContent = gameState.targets.filter(t => t.active).length;
        }

        function nextLevel() {
            gameState.level++;
            document.getElementById('gameOver').classList.remove('active');
            gameState.paused = false;
            setupLevel();
        }

        function resetLevel() {
            gameState.score = Math.max(0, gameState.score - 50);
            setupLevel();
        }

        function pauseGame() {
            gameState.paused = !gameState.paused;
            document.querySelector('.controls .btn-secondary:nth-child(2)').textContent = 
                gameState.paused ? '▶️ Resume' : '⏸️ Pause';
        }

        function endGame() {
            if (gameState.animationId) {
                cancelAnimationFrame(gameState.animationId);
            }
            window.location.href = 'home.html';
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorDiv');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
    </script>

    <!-- Vercel Web Analytics -->
    <script type="module" src="analytics-init.js"></script>
</body>
</html>
