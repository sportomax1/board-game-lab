<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Helmet Shuffle | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🎪</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        :root {
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
            height: 100dvh;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-dark {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .shell-container {
            perspective: 1000px;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            touch-action: none;
        }
        
        .shell {
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .shell.lift {
            transform: translateY(-60px) rotateX(-20deg);
        }
        
        .shell.shuffling {
            transition: transform var(--shuffle-duration) cubic-bezier(0.45, 0, 0.55, 1);
        }
        
        .game-thumb {
            width: 60px;
            height: 60px;
            object-fit: contain;
            border-radius: 12px;
            border: 2px solid #f59e0b;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
            background: #000;
            padding: 4px;
        }
        
        @keyframes pulse-gold {
            0%, 100% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
            50% { box-shadow: 0 0 30px rgba(245, 158, 11, 0.8); }
        }
        
        .correct-choice .shell-icon {
            color: #fbbf24;
            filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.5));
        }
        
        .shell-icon {
            font-size: 5rem;
            display: block;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .status-pill {
            @apply flex flex-col items-center glass px-6 py-2 rounded-2xl border border-white/5;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in { animation: fadeIn 0.4s ease-out forwards; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    </style>
</head>
<body class="selection:bg-indigo-500/30">
    <!-- Background Decor -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-indigo-900/20 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[10%] right-[0%] w-[50%] h-[50%] bg-blue-900/10 blur-[120px] rounded-full"></div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/80 backdrop-blur-md"></div>
        <div class="glass relative max-w-sm w-full rounded-[2.5rem] p-8 shadow-2xl border-t border-white/20 max-h-[90vh] overflow-y-auto custom-scrollbar">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-indigo-500/20 rounded-3xl flex items-center justify-center mx-auto mb-4 border border-indigo-500/30">
                    <span class="text-4xl">🎪</span>
                </div>
                <h1 class="text-3xl font-black tracking-tight text-white mb-2 italic uppercase">Helmet <span class="text-indigo-400">Shuffle</span></h1>
                <p class="text-slate-400 text-sm font-medium">Find the hidden game thumbnail</p>
            </div>

            <div class="space-y-5">
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">BGG Username</label>
                    <input type="text" id="username" value="sportomax" class="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all font-medium">
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Difficulty</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="setSpeed('slow', this)" class="speed-btn py-2 rounded-xl border border-white/10 text-[10px] font-black uppercase tracking-widest transition-all bg-white/5">Slow</button>
                        <button onclick="setSpeed('medium', this)" class="speed-btn py-2 rounded-xl border border-indigo-500 text-[10px] font-black uppercase tracking-widest transition-all bg-indigo-500">Medium</button>
                        <button onclick="setSpeed('fast', this)" class="speed-btn py-2 rounded-xl border border-white/10 text-[10px] font-black uppercase tracking-widest transition-all bg-white/5">Fast</button>
                    </div>
                    <input type="hidden" id="shuffleSpeed" value="medium">
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Hiding Object</label>
                    <div class="grid grid-cols-4 gap-2">
                        <button onclick="setObject('door', this)" class="object-btn p-3 rounded-xl border border-indigo-500 bg-indigo-500/20 text-2xl transition-all" data-object="door">🚪</button>
                        <button onclick="setObject('hat', this)" class="object-btn p-3 rounded-xl border border-white/10 bg-white/5 text-2xl transition-all" data-object="hat">🎩</button>
                        <button onclick="setObject('pot', this)" class="object-btn p-3 rounded-xl border border-white/10 bg-white/5 text-2xl transition-all" data-object="pot">🏺</button>
                        <button onclick="setObject('bucket', this)" class="object-btn p-3 rounded-xl border border-white/10 bg-white/5 text-2xl transition-all" data-object="bucket">🪣</button>
                    </div>
                    <input type="hidden" id="hidingObject" value="door">
                </div>

                <div class="flex items-center justify-between bg-white/5 p-4 rounded-2xl border border-white/10">
                    <span class="text-xs font-black text-white uppercase italic tracking-tight">Exclude Expansions</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="excludeExpansions" class="sr-only peer" checked>
                        <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-500"></div>
                    </label>
                </div>

                <button onclick="startGame()" class="w-full btn-primary text-white py-4 rounded-2xl font-black text-lg uppercase tracking-tight hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2 mt-4 shadow-xl">
                    Enter Tent
                </button>
            </div>
        </div>
    </div>

    <!-- Main Game App -->
    <div id="app" class="hidden relative z-10 flex flex-col min-h-screen pt-safe">
        <!-- Header -->
        <header class="p-6 flex items-center justify-between border-b border-white/5 bg-slate-900/50 backdrop-blur-md">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-indigo-500/20 rounded-xl flex items-center justify-center border border-indigo-500/30">
                    <i data-lucide="play" class="text-indigo-400 w-5 h-5 fill-current"></i>
                </div>
                <h1 class="text-xl font-black italic uppercase tracking-tighter text-white">Helmet <span class="text-indigo-400">Shuffle</span></h1>
            </div>
            <div class="flex gap-2">
                <button onclick="showSettings()" class="glass w-10 h-10 rounded-xl flex items-center justify-center text-slate-400 hover:text-white transition-all">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <main class="flex-1 p-4 md:p-8 max-w-5xl mx-auto w-full flex flex-col gap-8 justify-center">
            <!-- Scoreboard -->
            <div class="grid grid-cols-3 gap-3 w-full max-w-sm mx-auto">
                <div class="status-pill">
                    <span class="text-[8px] font-black uppercase tracking-widest text-emerald-500 mb-1">Correct</span>
                    <span id="correctScore" class="text-2xl font-black text-white italic leading-none">0</span>
                </div>
                <div class="status-pill">
                    <span class="text-[8px] font-black uppercase tracking-widest text-rose-500 mb-1">Missed</span>
                    <span id="incorrectScore" class="text-2xl font-black text-white italic leading-none">0</span>
                </div>
                <div class="status-pill">
                    <span class="text-[8px] font-black uppercase tracking-widest text-indigo-500 mb-1">Streak</span>
                    <span id="streakScore" class="text-2xl font-black text-white italic leading-none">0</span>
                </div>
            </div>

            <!-- Game Stage -->
            <div class="glass rounded-[3rem] p-8 md:p-12 border border-white/10 shadow-2xl relative overflow-hidden flex flex-col items-center justify-center min-h-[400px]">
                <div class="absolute inset-0 bg-indigo-500/5 pointer-events-none"></div>
                
                <!-- Initial Show -->
                <div id="initialShow" class="text-center space-y-6 animate-in">
                    <p class="text-[10px] font-black uppercase tracking-[0.3em] text-indigo-400">Memory Phase</p>
                    <div class="relative group">
                        <div class="absolute -inset-4 bg-indigo-500/20 blur-xl rounded-full opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        <img id="initialGameImage" src="" class="relative w-32 h-32 md:w-40 md:h-40 object-contain rounded-2xl border-4 border-indigo-500/30 bg-black/40 p-2 shadow-2xl">
                    </div>
                    <h2 id="initialGameName" class="text-xl font-black text-white italic uppercase tracking-tighter"></h2>
                    <p class="text-[9px] text-slate-500 font-bold uppercase tracking-widest italic">Hiding in 3 seconds...</p>
                </div>

                <!-- Shells Arena -->
                <div id="shellsContainer" class="hidden w-full flex flex-col items-center">
                    <div id="timerDisplay" class="hidden mb-8">
                        <div class="relative w-16 h-16 flex items-center justify-center">
                            <svg class="absolute inset-0 w-full h-full -rotate-90">
                                <circle cx="32" cy="32" r="30" stroke="currentColor" stroke-width="4" fill="transparent" class="text-white/5" />
                                <circle id="timerCircle" cx="32" cy="32" r="30" stroke="currentColor" stroke-width="4" fill="transparent" class="text-indigo-500" stroke-dasharray="188.5" stroke-dashoffset="0" />
                            </svg>
                            <span id="timerValue" class="text-xl font-black italic text-white">10</span>
                        </div>
                    </div>

                    <p id="gameInstruction" class="text-[10px] font-black uppercase tracking-[0.3em] text-amber-400 mb-12">Watch Closely!</p>
                    
                    <div id="shellsArea" class="flex justify-center gap-6 md:gap-16 w-full h-48 relative">
                        <!-- Shells injected here -->
                    </div>

                    <div class="mt-12 h-16">
                        <button id="readyBtn" onclick="startShuffle()" class="hidden btn-primary text-white px-10 py-4 rounded-2xl font-black text-sm uppercase tracking-widest transition-all hover:scale-105 active:scale-95 shadow-xl">
                            Shuffle 🔀
                        </button>
                        <button id="newGameBtn" onclick="newGame()" class="hidden bg-white/5 border border-white/10 text-white px-10 py-4 rounded-2xl font-black text-sm uppercase tracking-widest transition-all hover:bg-white/10 active:scale-95 shadow-xl">
                            Next Round 🎮
                        </button>
                    </div>
                </div>

                <!-- Result Card -->
                <div id="resultMessage" class="hidden animate-reveal text-center space-y-2">
                    <p id="resultText" class="text-4xl font-black italic uppercase tracking-tighter"></p>
                    <p id="resultGame" class="text-[10px] font-bold text-slate-500 uppercase tracking-widest"></p>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        let collection = [];
        let currentGame = null;
        let correctPosition = 0;
        let correctScore = 0;
        let incorrectScore = 0;
        let currentStreak = 0;
        let settings = {};
        let canClick = false;
        let shellPositions = [0, 1, 2];
        let timerInterval = null;
        let remainingTime = 0;
        let isShuffling = false;
        const IMAGE_PROXY = '/api/image-proxy?url=';

        const objects = {
            door: '🚪',
            hat: '🎩',
            pot: '🏺',
            bucket: '🪣'
        };

        function setSpeed(val, btn) {
            document.getElementById('shuffleSpeed').value = val;
            document.querySelectorAll('.speed-btn').forEach(b => {
                b.classList.remove('bg-indigo-500', 'border-indigo-500');
                b.classList.add('bg-white/5', 'border-white/10');
            });
            btn.classList.add('bg-indigo-500', 'border-indigo-500');
            btn.classList.remove('bg-white/5', 'border-white/10');
        }

        function setObject(val, btn) {
            document.getElementById('hidingObject').value = val;
            document.querySelectorAll('.object-btn').forEach(b => {
                b.classList.remove('bg-indigo-500/20', 'border-indigo-500');
                b.classList.add('bg-white/5', 'border-white/10');
            });
            btn.classList.add('bg-indigo-500/20', 'border-indigo-500');
            btn.classList.remove('bg-white/5', 'border-white/10');
        }

        async function fetchWithRetry(url, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                const response = await fetch(url);
                if (response.status === 202) { await new Promise(r => setTimeout(r, 2000 * (i+1))); continue; }
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.text();
            }
            throw new Error('Timeout');
        }

        async function startGame() {
            const username = document.getElementById('username').value.trim() || 'sportomax';
            const speed = document.getElementById('shuffleSpeed').value;
            const object = document.getElementById('hidingObject').value;
            const exclude = document.getElementById('excludeExpansions').checked;
            
            settings = { username, speed, object, exclude, duration: 10 };
            document.getElementById('settingsModal').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            
            try {
                const subtype = exclude ? '&subtype=boardgame' : '';
                const xmlText = await fetchWithRetry(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1${subtype}`);
                const parser = new DOMParser().parseFromString(xmlText, 'text/xml');
                const items = Array.from(parser.querySelectorAll('item'));
                
                collection = items.map(item => ({
                    id: item.getAttribute('objectid'),
                    name: item.querySelector('name').textContent,
                    thumbnail: item.querySelector('thumbnail')?.textContent || ''
                })).filter(g => g.thumbnail);
                
                if (collection.length === 0) throw new Error('No games found');
                newGame();
            } catch (e) {
                alert(e.message);
                showSettings();
            }
        }

        function newGame() {
            if (collection.length === 0) return;
            if (timerInterval) clearInterval(timerInterval);
            
            isShuffling = false;
            canClick = false;
            shellPositions = [0, 1, 2];
            
            document.getElementById('resultMessage').classList.add('hidden');
            document.getElementById('shellsContainer').classList.add('hidden');
            document.getElementById('initialShow').classList.remove('hidden');
            document.getElementById('newGameBtn').classList.add('hidden');
            
            currentGame = collection[Math.floor(Math.random() * collection.length)];
            document.getElementById('initialGameImage').src = `${IMAGE_PROXY}${encodeURIComponent(currentGame.thumbnail)}`;
            document.getElementById('initialGameName').textContent = currentGame.name;
            
            setTimeout(() => {
                document.getElementById('initialShow').classList.add('hidden');
                setupShells();
            }, 3000);
        }

        function setupShells() {
            const icon = objects[settings.object];
            correctPosition = Math.floor(Math.random() * 3);
            
            const area = document.getElementById('shellsArea');
            area.innerHTML = '';
            
            for (let i = 0; i < 3; i++) {
                const container = document.createElement('div');
                container.className = 'shell-container absolute w-24 md:w-32 text-center';
                container.id = `shell-${i}`;
                container.style.left = `${i * 33}%`;
                container.style.transform = 'translateX(0px)';
                container.onclick = () => selectShell(i);
                
                container.innerHTML = `
                    <div class="shell flex flex-col items-center" id="shell-content-${i}">
                        <img src="${i === correctPosition ? IMAGE_PROXY + encodeURIComponent(currentGame.thumbnail) : ''}" 
                             class="game-thumb mb-4" style="visibility: ${i === correctPosition ? 'visible' : 'hidden'}">
                        <span class="shell-icon">${icon}</span>
                    </div>
                `;
                area.appendChild(container);
            }
            
            document.getElementById('shellsContainer').classList.remove('hidden');
            document.getElementById('gameInstruction').textContent = 'Memorize the position';
            
            setTimeout(() => {
                document.getElementById(`shell-content-${correctPosition}`).classList.add('lift');
                setTimeout(() => {
                    document.getElementById(`shell-content-${correctPosition}`).classList.remove('lift');
                    setTimeout(() => {
                        document.getElementById('readyBtn').classList.remove('hidden');
                        document.getElementById('gameInstruction').textContent = 'Ready?';
                    }, 600);
                }, 1500);
            }, 500);
        }

        function startShuffle() {
            document.getElementById('readyBtn').classList.add('hidden');
            document.getElementById('gameInstruction').textContent = 'Watching...';
            isShuffling = true;
            document.querySelectorAll('.game-thumb').forEach(img => img.style.visibility = 'hidden');
            
            remainingTime = settings.duration;
            const timerDiv = document.getElementById('timerDisplay');
            timerDiv.classList.remove('hidden');
            const circle = document.getElementById('timerCircle');
            
            timerInterval = setInterval(() => {
                remainingTime -= 0.1;
                document.getElementById('timerValue').textContent = Math.ceil(remainingTime);
                const offset = 188.5 - (188.5 * (remainingTime / settings.duration));
                circle.style.strokeDashoffset = offset;
                
                if (remainingTime <= 0) {
                    clearInterval(timerInterval);
                    endShuffle();
                }
            }, 100);
            
            const duration = settings.speed === 'slow' ? 1000 : settings.speed === 'fast' ? 400 : 700;
            document.documentElement.style.setProperty('--shuffle-duration', `${duration}ms`);
            document.querySelectorAll('.shell-container').forEach(el => el.classList.add('shuffling'));
            
            performSwaps(duration);
        }

        function performSwaps(duration) {
            if (!isShuffling) return;
            
            const p1 = Math.floor(Math.random() * 3);
            let p2 = Math.floor(Math.random() * 3);
            while (p2 === p1) p2 = Math.floor(Math.random() * 3);
            
            swapShells(p1, p2, duration);
            setTimeout(() => performSwaps(duration), duration + 50);
        }

        function swapShells(pos1, pos2, duration) {
            const s1 = document.getElementById(`shell-${shellPositions[pos1]}`);
            const s2 = document.getElementById(`shell-${shellPositions[pos2]}`);
            
            const areaWidth = document.getElementById('shellsArea').offsetWidth;
            const left1 = pos1 * (areaWidth / 3);
            const left2 = pos2 * (areaWidth / 3);
            
            s1.style.left = `${left2}px`;
            s2.style.left = `${left1}px`;
            
            [shellPositions[pos1], shellPositions[pos2]] = [shellPositions[pos2], shellPositions[pos1]];
        }

        function endShuffle() {
            isShuffling = false;
            document.querySelectorAll('.shell-container').forEach(el => el.classList.remove('shuffling'));
            document.getElementById('timerDisplay').classList.add('hidden');
            document.getElementById('gameInstruction').textContent = 'Pick the shell!';
            canClick = true;
        }

        function selectShell(position) {
            if (!canClick) return;
            canClick = false;
            
            const shellId = shellPositions[position];
            const isCorrect = shellId === correctPosition;
            
            for (let i = 0; i < 3; i++) document.getElementById(`shell-content-${i}`).classList.add('lift');
            document.querySelectorAll('.game-thumb').forEach(img => img.style.visibility = 'visible');
            
            const resText = document.getElementById('resultText');
            if (isCorrect) {
                correctScore++; currentStreak++;
                resText.textContent = 'Correct! 🎉';
                resText.className = 'text-4xl font-black italic uppercase tracking-tighter text-emerald-400';
                document.getElementById(`shell-${shellId}`).classList.add('correct-choice');
            } else {
                incorrectScore++; currentStreak = 0;
                resText.textContent = 'Wrong! ✕';
                resText.className = 'text-4xl font-black italic uppercase tracking-tighter text-rose-500';
            }
            
            document.getElementById('correctScore').textContent = correctScore;
            document.getElementById('incorrectScore').textContent = incorrectScore;
            document.getElementById('streakScore').textContent = currentStreak;
            document.getElementById('resultGame').textContent = `The game was ${currentGame.name}`;
            document.getElementById('resultMessage').classList.remove('hidden');
            document.getElementById('gameInstruction').textContent = '';
            document.getElementById('newGameBtn').classList.remove('hidden');
        }

        function showSettings() { document.getElementById('settingsModal').classList.remove('hidden'); }
    </script>
    <script type="module" src="analytics-init.js"></script>
</body>
</html>
