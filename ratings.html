<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Game Ratings Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body {
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }

        .container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: max(env(safe-area-inset-top, 10px), 10px) max(env(safe-area-inset-right, 10px), 10px) max(env(safe-area-inset-bottom, 10px), 10px) max(env(safe-area-inset-left, 10px), 10px);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: clamp(1rem, 3vw, 1.5rem);
            padding: 0 clamp(0.75rem, 2vw, 1rem);
        }

        h1 {
            font-size: clamp(1.5rem, 5vw, 2rem);
            font-weight: 700;
            margin: 0;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .header-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            background: #334155;
            border: 1px solid #475569;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: clamp(0.875rem, 2vw, 1rem);
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn:active {
            background: #475569;
            transform: scale(0.98);
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: clamp(1rem, 3vw, 1.5rem);
            padding: 0 clamp(0.75rem, 2vw, 1rem);
            margin-bottom: clamp(1rem, 3vw, 1.5rem);
        }

        #status {
            background: #1e293b;
            color: #cbd5e1;
            padding: clamp(0.75rem, 2vw, 1rem);
            border-radius: 8px;
            text-align: center;
            font-size: clamp(0.875rem, 2vw, 1rem);
            border: 1px solid #334155;
        }

        .cards-grid {
            display: flex;
            flex-direction: column;
            gap: clamp(0.5rem, 1.5vw, 0.75rem);
        }

        .card {
            background: #1e293b;
            border-radius: clamp(0.5rem, 2vw, 0.8rem);
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            transition: all 0.2s;
            display: flex;
            flex-direction: row;
            height: auto;
            min-height: clamp(130px, 30vw, 180px);
            border-left: 4px solid #3b82f6;
            cursor: pointer;
            align-items: stretch;
        }

        .card:active {
            transform: scale(0.98);
            box-shadow: 0 4px 12px rgba(59,130,246,0.3);
        }

        .card-image {
            width: clamp(85px, 20vw, 120px);
            aspect-ratio: 3 / 4;
            background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
        }

        .card-content {
            padding: clamp(0.6rem, 2.5vw, 1rem);
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            justify-content: space-between;
        }

        .card-title {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            font-weight: 700;
            color: white;
            margin-bottom: 0.3rem;
            line-height: 1.1;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .card-stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.6rem;
            font-size: clamp(0.65rem, 1.2vw, 0.8rem);
            line-height: 1.2;
        }

        .card-stats-column {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .card-stats-column.ratings {
            border-right: 1px solid #334155;
            padding-right: 0.6rem;
        }

        .card-stats-column.scores {
            border-right: 1px solid #334155;
            padding-right: 0.6rem;
        }

        .card-stats-column.hybrids {
            padding-left: 0.2rem;
        }

        .stat-label {
            font-size: clamp(0.55rem, 0.9vw, 0.65rem);
            color: #3b82f6;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.1rem;
        }

        .card-rating {
            font-size: clamp(0.65rem, 1.2vw, 0.8rem);
            color: #3b82f6;
            font-weight: 600;
            line-height: 1;
            white-space: nowrap;
        }

        .card-stat {
            font-size: clamp(0.6rem, 1.1vw, 0.75rem);
            color: #cbd5e1;
            line-height: 1;
            white-space: nowrap;
        }

        .card-hybrid {
            font-size: clamp(0.6rem, 1.1vw, 0.75rem);
            color: #60a5fa;
            font-weight: 600;
            line-height: 1;
            white-space: nowrap;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: white;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(59,130,246,0.3);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            overflow-y: auto;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: #1e293b;
            padding: clamp(1rem, 3vw, 2rem);
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        .modal-header {
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            font-weight: 700;
            margin-bottom: 1rem;
            color: white;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 1rem;
        }

        .control-group label {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #e2e8f0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-group input,
        .control-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #475569;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            background-color: #334155;
            color: white;
            transition: all 0.2s ease;
        }

        .control-group input::placeholder {
            color: #94a3b8;
        }

        .control-group input:focus,
        .control-group select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .control-group select option {
            background: #1e293b;
            color: white;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            background: #0f172a;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #3b82f6;
        }

        .checkbox-item label {
            cursor: pointer;
            font-size: 0.9rem;
            margin: 0;
            color: #cbd5e1;
        }

        .modal-buttons {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .modal-btn {
            flex: 1;
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-btn.primary {
            background: #3b82f6;
            color: white;
            border: 1px solid #3b82f6;
        }

        .modal-btn.primary:hover {
            background: #2563eb;
            border-color: #2563eb;
        }

        .modal-btn.primary:active {
            transform: scale(0.98);
        }

        .modal-btn.secondary {
            background: #334155;
            color: #e2e8f0;
            border: 1px solid #475569;
        }

        .modal-btn.secondary:hover {
            background: #475569;
            border-color: #64748b;
        }

        .modal-btn.secondary:active {
            transform: scale(0.98);
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #cbd5e1;
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            .checkbox-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⭐ Ratings</h1>
            <div class="header-buttons">
                <button class="btn" id="settingsBtn">⚙️</button>
            </div>
        </div>

        <div id="status" class="content"></div>

        <div class="content">
            <div id="cardsContainer" class="cards-grid"></div>
            <div id="noResults" class="empty-state" style="display: none;">No games found matching your filters.</div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">⚙️ Settings</div>

            <!-- BGG Username -->
            <div class="control-group">
                <label for="usernameInput">BGG Username</label>
                <input type="text" id="usernameInput" placeholder="e.g., sportomax" value="sportomax">
            </div>

            <!-- Collection Status Filters -->
            <div class="control-group">
                <label>Collection Status</label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="statusOwn" checked>
                        <label for="statusOwn">Own</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="statusWishlist">
                        <label for="statusWishlist">Wishlist</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="statusPrevOwned">
                        <label for="statusPrevOwned">Prev Owned</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="statusWantToPlay">
                        <label for="statusWantToPlay">Want to Play</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="statusWantToBuy">
                        <label for="statusWantToBuy">Want to Buy</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="statusForTrade">
                        <label for="statusForTrade">For Trade</label>
                    </div>
                </div>
            </div>

            <!-- Sort Order -->
            <div class="control-group">
                <label for="sortBy">Sort By</label>
                <select id="sortBy">
                    <option value="hybrid-desc">Highest Hybrid Rating</option>
                    <option value="hybrid-asc">Lowest Hybrid Rating</option>
                    <option value="buyscore-desc">Highest Buy Score</option>
                    <option value="buyscore-asc">Lowest Buy Score</option>
                    <option value="playscore-desc">Highest Play Score</option>
                    <option value="playscore-asc">Lowest Play Score</option>
                    <option value="wishlistscore-desc">Highest Wishlist Score</option>
                    <option value="wishlistscore-asc">Lowest Wishlist Score</option>
                    <option value="buyhybrid-desc">Highest Buy Hybrid</option>
                    <option value="buyhybrid-asc">Lowest Buy Hybrid</option>
                    <option value="playhybrid-desc">Highest Play Hybrid</option>
                    <option value="playhybrid-asc">Lowest Play Hybrid</option>
                    <option value="wishlisthybrid-desc">Highest Wishlist Hybrid</option>
                    <option value="wishlisthybrid-asc">Lowest Wishlist Hybrid</option>
                    <option value="bayesaverage-desc">Highest Rated (Bayes)</option>
                    <option value="bayesaverage-asc">Lowest Rated (Bayes)</option>
                    <option value="average-desc">Highest Rated (Community)</option>
                    <option value="average-asc">Lowest Rated (Community)</option>
                    <option value="myrating-desc">My Highest Rating</option>
                    <option value="myrating-asc">My Lowest Rating</option>
                    <option value="name-asc">Name A-Z</option>
                    <option value="name-desc">Name Z-A</option>
                </select>
            </div>

            <!-- Rating Filter -->
            <div class="control-group">
                <label for="minRating">Minimum Community Rating</label>
                <input type="number" id="minRating" min="1" max="10" step="0.1" placeholder="0">
            </div>

            <div class="control-group">
                <label for="maxRating">Maximum Community Rating</label>
                <input type="number" id="maxRating" min="1" max="10" step="0.1" placeholder="10">
            </div>

            <div class="modal-buttons">
                <button class="modal-btn primary" id="applyBtn">Apply</button>
                <button class="modal-btn secondary" id="closeBtn">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // State management
        let settings = {
            username: 'sportomax',
            statuses: { own: true, wishlist: false, prevowned: false, wanttoplay: false, wanttobuy: false, fortrade: false },
            sortBy: 'hybrid-desc',
            minRating: 0,
            maxRating: 10
        };
        let games = [];
        let filteredGames = [];

        const settingsModal = document.getElementById('settingsModal');
        const settingsBtn = document.getElementById('settingsBtn');
        const applyBtn = document.getElementById('applyBtn');
        const closeBtn = document.getElementById('closeBtn');
        const statusEl = document.getElementById('status');
        const cardsContainer = document.getElementById('cardsContainer');
        const noResults = document.getElementById('noResults');

        // Initialize settings modal on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadSettings();
            settingsModal.classList.add('active');
        });

        // Modal controls
        settingsBtn.addEventListener('click', () => {
            loadSettingsFromUI();
            settingsModal.classList.add('active');
        });

        closeBtn.addEventListener('click', () => {
            settingsModal.classList.remove('active');
        });

        applyBtn.addEventListener('click', async () => {
            saveSettingsFromUI();
            settingsModal.classList.remove('active');
            await loadCollection();
        });

        // Settings persistence
        function loadSettings() {
            const saved = localStorage.getItem('ratingsSettings');
            if (saved) {
                settings = JSON.parse(saved);
            }
            updateUIFromSettings();
        }

        function saveSettings() {
            localStorage.setItem('ratingsSettings', JSON.stringify(settings));
        }

        function saveSettingsFromUI() {
            settings.username = document.getElementById('usernameInput').value.trim() || 'sportomax';
            settings.statuses = {
                own: document.getElementById('statusOwn').checked,
                wishlist: document.getElementById('statusWishlist').checked,
                prevowned: document.getElementById('statusPrevOwned').checked,
                wanttoplay: document.getElementById('statusWantToPlay').checked,
                wanttobuy: document.getElementById('statusWantToBuy').checked,
                fortrade: document.getElementById('statusForTrade').checked
            };
            settings.sortBy = document.getElementById('sortBy').value;
            settings.minRating = parseFloat(document.getElementById('minRating').value) || 0;
            settings.maxRating = parseFloat(document.getElementById('maxRating').value) || 10;
            saveSettings();
        }

        function loadSettingsFromUI() {
            document.getElementById('usernameInput').value = settings.username;
            document.getElementById('statusOwn').checked = settings.statuses.own;
            document.getElementById('statusWishlist').checked = settings.statuses.wishlist;
            document.getElementById('statusPrevOwned').checked = settings.statuses.prevowned;
            document.getElementById('statusWantToPlay').checked = settings.statuses.wanttoplay;
            document.getElementById('statusWantToBuy').checked = settings.statuses.wanttobuy;
            document.getElementById('statusForTrade').checked = settings.statuses.fortrade;
            document.getElementById('sortBy').value = settings.sortBy;
            document.getElementById('minRating').value = settings.minRating;
            document.getElementById('maxRating').value = settings.maxRating;
        }

        function updateUIFromSettings() {
            loadSettingsFromUI();
        }

        // Data loading
        async function loadCollection() {
            try {
                statusEl.textContent = 'Loading collection...';
                statusEl.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

                const statusParam = getStatusParam();
                if (!statusParam) {
                    statusEl.textContent = 'Please select at least one collection status.';
                    noResults.style.display = 'block';
                    cardsContainer.innerHTML = '';
                    return;
                }

                const url = `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(settings.username)}&statuses=${statusParam}&stats=1`;
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }

                const xmlText = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, 'text/xml');

                if (xmlDoc.documentElement.tagName === 'parsererror') {
                    throw new Error('Failed to parse XML response');
                }

                // Extract games
                games = [];
                const items = xmlDoc.querySelectorAll('item');
                
                items.forEach(item => {
                    const objectid = item.getAttribute('objectid');
                    const name = item.querySelector('name')?.textContent || 'Unknown';
                    const thumbnail = item.querySelector('thumbnail')?.textContent || '';
                    
                    // Get status flags
                    const status = item.querySelector('status');
                    const own = status?.getAttribute('own') === '1' ? 1 : 0;
                    const wishlist = status?.getAttribute('wishlist') || 0;
                    const preowned = status?.getAttribute('preowned') === '1' ? 1 : 0;
                    const wanttoplay = status?.getAttribute('wanttoplay') === '1' ? 1 : 0;
                    const wanttobuy = status?.getAttribute('wanttobuy') === '1' ? 1 : 0;
                    const fortrade = status?.getAttribute('fortrade') === '1' ? 1 : 0;
                    const wishlistpriority = status?.getAttribute('wishlistpriority') || 0;

                    // Get ratings
                    const rating = item.querySelector('stats rating');
                    const myRating = rating?.getAttribute('value') || 0;
                    const average = rating?.querySelector('average')?.getAttribute('value') || 0;
                    const bayesaverage = rating?.querySelector('bayesaverage')?.getAttribute('value') || 0;

                    // Calculate hybrid rating (average of available ratings)
                    // Include bayesaverage and average even if 0, only exclude myRating if 0
                    const ratingValues = [];
                    if (parseFloat(myRating) > 0) ratingValues.push(parseFloat(myRating));
                    ratingValues.push(parseFloat(bayesaverage) || 0);
                    ratingValues.push(parseFloat(average) || 0);
                    const hybridRating = ratingValues.length > 0 ? ratingValues.reduce((a, b) => a + b, 0) / ratingValues.length : 0;

                    // Calculate individual scores based on status flags
                    // Score = 5 if flag=1, then add inverted priority bonus (1→5, 2→4, 3→3, 4→2, 5→1, 0→0)
                    let buyScoreFinal = 0;
                    let playScoreFinal = 0;
                    let wishlistScoreFinal = 0;
                    
                    // Buy Score: 5 if wanttobuy=1, plus inverted priority
                    if (wanttobuy === 1) {
                        buyScoreFinal = 5;
                        if (wishlistpriority && parseInt(wishlistpriority) > 0) {
                            const priority = parseInt(wishlistpriority);
                            const priorityBonus = priority >= 1 && priority <= 5 ? (6 - priority) : 0;
                            buyScoreFinal += priorityBonus;
                        }
                    }
                    
                    // Play Score: 5 if wanttoplay=1, plus inverted priority
                    if (wanttoplay === 1) {
                        playScoreFinal = 5;
                        if (wishlistpriority && parseInt(wishlistpriority) > 0) {
                            const priority = parseInt(wishlistpriority);
                            const priorityBonus = priority >= 1 && priority <= 5 ? (6 - priority) : 0;
                            playScoreFinal += priorityBonus;
                        }
                    }
                    
                    // Wishlist Score: 5 if wishlist=1, plus inverted priority
                    if (wishlist === '1') {
                        wishlistScoreFinal = 5;
                        if (wishlistpriority && parseInt(wishlistpriority) > 0) {
                            const priority = parseInt(wishlistpriority);
                            const priorityBonus = priority >= 1 && priority <= 5 ? (6 - priority) : 0;
                            wishlistScoreFinal += priorityBonus;
                        }
                    }

                    // Calculate hybrid scores (rating + score combined)
                    const buyHybridScore = buyScoreFinal > 0 ? (hybridRating + buyScoreFinal) / 2 : 0;
                    const playHybridScore = playScoreFinal > 0 ? (hybridRating + playScoreFinal) / 2 : 0;
                    const wishlistHybridScore = wishlistScoreFinal > 0 ? (hybridRating + wishlistScoreFinal) / 2 : 0;

                    games.push({
                        objectid,
                        name,
                        thumbnail,
                        own,
                        wishlist,
                        preowned,
                        wanttoplay,
                        wanttobuy,
                        fortrade,
                        wishlistpriority,
                        myRating: parseFloat(myRating),
                        average: parseFloat(average),
                        bayesaverage: parseFloat(bayesaverage),
                        hybridRating,
                        buyScore: buyScoreFinal,
                        playScore: playScoreFinal,
                        wishlistScore: wishlistScoreFinal,
                        buyHybridScore,
                        playHybridScore,
                        wishlistHybridScore
                    });
                });

                applyFilters();
                statusEl.textContent = `Loaded ${filteredGames.length} games`;
                
                // Log status filters being used
                const enabledStatuses = Object.entries(settings.statuses)
                    .filter(([_, enabled]) => enabled)
                    .map(([status, _]) => status.charAt(0).toUpperCase() + status.slice(1))
                    .join(', ');
                console.log(`📊 COLLECTION FILTERS APPLIED: ${enabledStatuses}`);
                console.log(`📈 Showing ${filteredGames.length} of ${games.length} games`);
                
                // Log proof of math for first 3 games with scores/ratings
                console.log('=== RATINGS MATH PROOF ===');
                games.filter(g => g.hybridRating > 0 || g.buyScore > 0 || g.playScore > 0).slice(0, 3).forEach(game => {
                    console.log(`\n📌 ${game.name}`);
                    console.log(`   MY RATING: ${game.myRating > 0 ? game.myRating : 'N/A'}`);
                    console.log(`   BAYES AVG: ${game.bayesaverage}`);
                    console.log(`   COMM AVG:  ${game.average}`);
                    
                    const ratingVals = [];
                    if (game.myRating > 0) ratingVals.push(`myRating(${game.myRating})`);
                    ratingVals.push(`bayes(${game.bayesaverage})`);
                    ratingVals.push(`avg(${game.average})`);
                    const hybrid = ((game.myRating > 0 ? game.myRating : 0) + game.bayesaverage + game.average) / 3;
                    console.log(`   HYBRID CALC: (${ratingVals.join(' + ')}) / 3 = ${hybrid.toFixed(2)} ✓`);
                    
                    if (game.buyScore > 0) {
                        console.log(`   BUY SCORE: 5 (wantToBuy) + ${game.buyScore - 5} (priority bonus) = ${game.buyScore} 🛒`);
                    }
                    if (game.playScore > 0) {
                        console.log(`   PLAY SCORE: 5 (wantToPlay) + ${game.playScore - 5} (priority bonus) = ${game.playScore} 🎮`);
                    }
                });

            } catch (error) {
                console.error('Error loading collection:', error);
                statusEl.textContent = `Error: ${error.message}`;
            }
        }

        function getStatusParam() {
            const statuses = [];
            if (settings.statuses.own) statuses.push('own');
            if (settings.statuses.wishlist) statuses.push('wishlist');
            if (settings.statuses.prevowned) statuses.push('prevowned');
            if (settings.statuses.wanttoplay) statuses.push('wanttoplay');
            if (settings.statuses.wanttobuy) statuses.push('wanttobuy');
            if (settings.statuses.fortrade) statuses.push('fortrade');
            return statuses.join(',');
        }

        // Filtering and sorting
        function applyFilters() {
            filteredGames = games.filter(game => {
                // Check collection status filters
                const statusMatches = 
                    (settings.statuses.own && game.own === 1) ||
                    (settings.statuses.wishlist && game.wishlist === '1') ||
                    (settings.statuses.prevowned && game.preowned === 1) ||
                    (settings.statuses.wanttoplay && game.wanttoplay === 1) ||
                    (settings.statuses.wanttobuy && game.wanttobuy === 1) ||
                    (settings.statuses.fortrade && game.fortrade === 1);
                
                if (!statusMatches) {
                    return false;
                }
                
                // Rating filter
                const rating = game.bayesaverage || game.average || 0;
                if (rating < settings.minRating || rating > settings.maxRating) {
                    return false;
                }
                return true;
            });

            // Apply sorting
            sortGames();
            renderGames();
        }

        function sortGames() {
            const [sortField, sortDir] = settings.sortBy.split('-');
            
            filteredGames.sort((a, b) => {
                let aVal, bVal;
                
                switch(sortField) {
                    case 'hybrid':
                        aVal = a.hybridRating || 0;
                        bVal = b.hybridRating || 0;
                        break;
                    case 'buyscore':
                        aVal = a.buyScore || 0;
                        bVal = b.buyScore || 0;
                        break;
                    case 'playscore':
                        aVal = a.playScore || 0;
                        bVal = b.playScore || 0;
                        break;
                    case 'wishlistscore':
                        aVal = a.wishlistScore || 0;
                        bVal = b.wishlistScore || 0;
                        break;
                    case 'buyhybrid':
                        aVal = a.buyHybridScore || 0;
                        bVal = b.buyHybridScore || 0;
                        break;
                    case 'playhybrid':
                        aVal = a.playHybridScore || 0;
                        bVal = b.playHybridScore || 0;
                        break;
                    case 'wishlisthybrid':
                        aVal = a.wishlistHybridScore || 0;
                        bVal = b.wishlistHybridScore || 0;
                        break;
                    case 'bayesaverage':
                        aVal = a.bayesaverage || 0;
                        bVal = b.bayesaverage || 0;
                        break;
                    case 'average':
                        aVal = a.average || 0;
                        bVal = b.average || 0;
                        break;
                    case 'myrating':
                        aVal = a.myRating || 0;
                        bVal = b.myRating || 0;
                        break;
                    case 'name':
                        aVal = a.name.toLowerCase();
                        bVal = b.name.toLowerCase();
                        break;
                    default:
                        return 0;
                }
                
                let primarySort;
                if (typeof aVal === 'string') {
                    primarySort = sortDir === 'asc' ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
                } else {
                    primarySort = sortDir === 'asc' ? aVal - bVal : bVal - aVal;
                }
                
                // Tiebreaker: always sort by average descending
                if (primarySort === 0) {
                    const aAvg = a.average || 0;
                    const bAvg = b.average || 0;
                    return bAvg - aAvg; // Always descending for average
                }
                
                return primarySort;
            });
        }

        function renderGames() {
            cardsContainer.innerHTML = '';
            noResults.style.display = filteredGames.length === 0 ? 'block' : 'none';

            filteredGames.forEach(game => {
                const card = createGameCard(game);
                cardsContainer.appendChild(card);
            });
        }

        function createGameCard(game) {
            const card = document.createElement('div');
            card.className = 'card';
            
            // Make card clickable - open BGG page
            card.addEventListener('click', () => {
                window.open(`https://boardgamegeek.com/boardgame/${game.objectid}`, '_blank');
            });
            
            const imageDiv = document.createElement('div');
            imageDiv.className = 'card-image';
            
            if (game.thumbnail) {
                const img = document.createElement('img');
                img.src = `/api/image-proxy?url=${encodeURIComponent(game.thumbnail)}`;
                img.alt = game.name;
                img.onerror = () => {
                    imageDiv.innerHTML = '🎲';
                    imageDiv.style.background = 'linear-gradient(135deg, #3b82f6 0%, #1e40af 100%)';
                    imageDiv.style.color = 'white';
                    imageDiv.style.fontSize = '1.5rem';
                };
                imageDiv.appendChild(img);
            } else {
                imageDiv.innerHTML = '🎲';
                imageDiv.style.background = 'linear-gradient(135deg, #3b82f6 0%, #1e40af 100%)';
                imageDiv.style.color = 'white';
                imageDiv.style.fontSize = '1.5rem';
            }

            const content = document.createElement('div');
            content.className = 'card-content';

            const title = document.createElement('div');
            title.className = 'card-title';
            title.textContent = game.name;
            content.appendChild(title);

            // Create stats row container with 3 columns
            const statsRow = document.createElement('div');
            statsRow.className = 'card-stats-row';

            // COLUMN 1: Ratings
            const ratingsColumn = document.createElement('div');
            ratingsColumn.className = 'card-stats-column ratings';

            const ratingsLabel = document.createElement('div');
            ratingsLabel.className = 'stat-label';
            ratingsLabel.textContent = 'Ratings';
            ratingsColumn.appendChild(ratingsLabel);

            if (game.hybridRating > 0) {
                const hybridRating = document.createElement('span');
                hybridRating.className = 'card-rating';
                hybridRating.textContent = `🎯 ${game.hybridRating.toFixed(1)}`;
                ratingsColumn.appendChild(hybridRating);
            }

            if (game.myRating > 0) {
                const myRating = document.createElement('span');
                myRating.className = 'card-stat';
                myRating.textContent = `⭐ ${game.myRating}`;
                ratingsColumn.appendChild(myRating);
            }

            if (game.bayesaverage > 0) {
                const bayesStat = document.createElement('span');
                bayesStat.className = 'card-stat';
                bayesStat.textContent = `📊 ${game.bayesaverage.toFixed(1)}`;
                ratingsColumn.appendChild(bayesStat);
            }

            if (game.average > 0) {
                const avgStat = document.createElement('span');
                avgStat.className = 'card-stat';
                avgStat.textContent = `📈 ${game.average.toFixed(1)}`;
                ratingsColumn.appendChild(avgStat);
            }

            statsRow.appendChild(ratingsColumn);

            // COLUMN 2: Scores
            const scoresColumn = document.createElement('div');
            scoresColumn.className = 'card-stats-column scores';

            const scoresLabel = document.createElement('div');
            scoresLabel.className = 'stat-label';
            scoresLabel.textContent = 'Scores';
            scoresColumn.appendChild(scoresLabel);

            if (game.buyScore > 0) {
                const buyStat = document.createElement('span');
                buyStat.className = 'card-stat';
                buyStat.textContent = `🛒 ${game.buyScore}`;
                scoresColumn.appendChild(buyStat);
            }

            if (game.playScore > 0) {
                const playStat = document.createElement('span');
                playStat.className = 'card-stat';
                playStat.textContent = `🎮 ${game.playScore}`;
                scoresColumn.appendChild(playStat);
            }

            if (game.wishlistScore > 0) {
                const wishStat = document.createElement('span');
                wishStat.className = 'card-stat';
                wishStat.textContent = `❤️ ${game.wishlistScore}`;
                scoresColumn.appendChild(wishStat);
            }

            statsRow.appendChild(scoresColumn);

            // COLUMN 3: Hybrid Scores
            const hybridsColumn = document.createElement('div');
            hybridsColumn.className = 'card-stats-column hybrids';

            const hybridsLabel = document.createElement('div');
            hybridsLabel.className = 'stat-label';
            hybridsLabel.textContent = 'Hybrids';
            hybridsColumn.appendChild(hybridsLabel);

            if (game.buyHybridScore > 0) {
                const buyHybrid = document.createElement('span');
                buyHybrid.className = 'card-hybrid';
                buyHybrid.textContent = `🛒 ${game.buyHybridScore.toFixed(1)}`;
                hybridsColumn.appendChild(buyHybrid);
            }

            if (game.playHybridScore > 0) {
                const playHybrid = document.createElement('span');
                playHybrid.className = 'card-hybrid';
                playHybrid.textContent = `🎮 ${game.playHybridScore.toFixed(1)}`;
                hybridsColumn.appendChild(playHybrid);
            }

            if (game.wishlistHybridScore > 0) {
                const wishHybrid = document.createElement('span');
                wishHybrid.className = 'card-hybrid';
                wishHybrid.textContent = `❤️ ${game.wishlistHybridScore.toFixed(1)}`;
                hybridsColumn.appendChild(wishHybrid);
            }

            statsRow.appendChild(hybridsColumn);
            content.appendChild(statsRow);
            card.appendChild(imageDiv);
            card.appendChild(content);
            return card;
        }

        // Close modal when clicking outside
        window.addEventListener('click', (event) => {
            if (event.target === settingsModal) {
                settingsModal.classList.remove('active');
            }
        });
    </script>
    <!-- Vercel Web Analytics -->
    <script type="module" src="analytics-init.js"></script>
