<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BGG Contacts</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f4f7fb;font:14px system-ui}.app{max-width:1050px;margin:auto;padding:14px}.panel,.card{background:#0d1929;border:1px solid #203149;border-radius:12px;padding:12px}.tabs,.filters,.actions,.counts,.viewToggle{display:flex;gap:7px;flex-wrap:wrap}.tabs{margin:12px 0}.btn,.chip,input,textarea{font:inherit;border:1px solid #30445f;border-radius:8px;background:#101e30;color:#fff;padding:9px}.btn,.chip{cursor:pointer;font-weight:700}.active,.primary{background:#7c5cff}.yesBtn{background:#176b45;border-color:#39d98a}.noBtn{background:#6b2634;border-color:#ff718b}.load{display:grid;grid-template-columns:1fr auto;gap:7px}.search{width:100%;margin-top:9px}.chip{font-size:11px;padding:6px 8px}.chip.yes{background:#176b45;border-color:#39d98a}.chip.no{background:#6b2634;border-color:#ff718b}.count{background:#17283d;border:1px solid #30445f;border-radius:999px;padding:5px 9px;font-size:11px}.contactTools{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:9px}.viewToggle{flex-wrap:nowrap}.viewBtn{padding:6px 9px;font-size:11px}.games,.contacts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;margin-top:10px}.game{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:9px}.thumb{width:62px;height:80px;object-fit:cover;border-radius:6px}.name{font-weight:800;cursor:pointer}.meta{font-size:11px;color:#91a0b5}.line{font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stats{text-align:right;min-width:68px;font-size:11px;color:#c3ccda}.stat{margin-bottom:5px}.stat b{display:block;color:#fff;font-size:12px}.modal,.gate{position:fixed;inset:0;background:#020814dd;display:none;align-items:center;justify-content:center;padding:14px;z-index:20}.modal.open,.gate{display:flex}.box{width:min(650px,100%);max-height:85vh;overflow:auto;background:#0b1726;border:1px solid #30445f;border-radius:15px;padding:15px}.head,.person{display:flex;justify-content:space-between;align-items:center;gap:8px}.xbtn{width:36px;height:36px;padding:0;font-size:22px}.person{border-bottom:1px solid #203149;padding:9px 0}.personActions{display:flex;gap:6px;align-items:center}.filterBtn{width:36px;height:36px;padding:0}.saved{padding:7px 9px;border-radius:8px;background:#176b45;border:1px solid #39d98a;font-size:11px;font-weight:800}.contact{cursor:pointer;min-height:120px}.contactTitle{font-size:16px;font-weight:800}.contactType{display:inline-block;margin-top:5px;padding:3px 7px;border-radius:999px;background:#17283d;font-size:10px}.contactDetail{margin-top:8px;color:#c3ccda;font-size:12px}.contactNote{margin-top:8px;color:#91a0b5;font-size:11px}.replyTag{display:inline-block;margin-top:7px;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:800}.replyYes{background:#176b45;border:1px solid #39d98a}.replyNo{background:#6b2634;border:1px solid #ff718b}.tableWrap{margin-top:10px;overflow-x:auto;border:1px solid #203149;border-radius:12px;background:#0d1929}.contactTable{width:100%;border-collapse:collapse;min-width:1050px}.contactTable th,.contactTable td{padding:9px;text-align:left;border-bottom:1px solid #203149;white-space:nowrap}.contactTable th{font-size:11px;color:#91a0b5;background:#101e30;position:sticky;top:0}.contactTable tbody tr:hover{background:#13243a}.contactTable input{width:140px;padding:6px}.contactTable .wideInput{width:180px}.contactTable .notesInput{width:220px}.smallBtn{padding:6px 8px;font-size:11px}.editGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.editGrid input,.editGrid textarea{width:100%;margin-top:4px}.full{grid-column:1/-1}.heardToggle{display:flex;gap:6px;margin-top:4px}.hidden{display:none!important}.progress{height:5px;background:#17283d;margin-top:8px}.progress i{display:block;height:100%;width:0;background:#7c5cff}@media(max-width:800px){body{overflow-x:hidden}.app,.panel{width:100%;max-width:100%}.app{padding:10px}.games,.contacts{display:flex;flex-direction:column}.game{width:100%;grid-template-columns:64px minmax(0,1fr) 60px}.thumb{width:64px;height:82px}.stats{min-width:60px}.editGrid{grid-template-columns:1fr}.full{grid-column:auto}.contactTools{align-items:flex-start;flex-direction:column}.tableWrap{width:100%}}</style></head><body><div id="gate" class="gate"><div class="box"><h2>BGG Contacts</h2><input id="pw" style="width:100%" type="password" placeholder="Access Key"><button id="unlock" class="btn primary" style="width:100%;margin-top:8px">Unlock Dashboard</button><div id="pwerr" class="meta"></div></div></div><main class="app"><h1>BGG Contact Finder</h1><div class="tabs"><button class="btn active" data-tab="collection">Collection</button><button class="btn" data-tab="contacts">Contacts</button></div><section id="collection"><div class="panel"><div class="load"><input id="user" value="sportomax"><button id="load" class="btn primary">Refresh BGG</button></div><input id="search" class="search" placeholder="Search games, publishers, designers, artists"><div id="filters" class="filters" style="margin-top:8px"></div><div id="status" class="meta" style="margin-top:8px">Checking saved cache…</div><div class="progress"><i id="prog"></i></div></div><div id="games" class="games"></div></section><section id="contacts" class="hidden"><div class="panel"><input id="csearch" style="width:100%" placeholder="Search contacts"><div class="contactTools"><div id="contactCounts" class="counts"></div><div class="viewToggle"><button id="tableView" class="btn viewBtn">Table</button><button id="cardView" class="btn viewBtn">Cards</button></div></div></div><div id="clist"></div></section></main><div id="gameModal" class="modal"><div class="box"><div class="head"><h2 id="gtitle"></h2><button class="btn xbtn" data-close="gameModal">×</button></div><div id="gbody"></div></div></div><div id="contactModal" class="modal"><div class="box"><div class="head"><div><h2 id="ctitle"></h2><div id="cmeta" class="meta"></div></div><button class="btn xbtn" data-close="contactModal">×</button></div><div class="editGrid"><label>First Contact Date<input id="editDate" type="date"></label><label>Email<input id="editEmail"></label><label>BGG Username<input id="editBgg"></label><label>Source Game<input id="editSource"></label><label>Heard Back?<div class="heardToggle"><button id="heardYes" class="btn">Yes</button><button id="heardNo" class="btn">No</button></div></label><label class="full">Notes<textarea id="editNotes"></textarea></label></div><div class="actions"><button id="deleteContact" class="btn">Delete</button><button id="saveContact" class="btn primary">Save Changes</button></div></div></div><script>const API='/api/bgg-helper',BATCH=20,WORKERS=100,$=x=>document.getElementById(x),sleep=x=>new Promise(r=>setTimeout(r,x));let games=[],contacts=[],game=null,editContact=null,modalHeard=false,contactView=localStorage.getItem('contact_view')||(matchMedia('(max-width:800px)').matches?'cards':'table');const sts=['own','prevowned','fortrade','want','wanttoplay','wanttobuy','wishlist','preordered'],labs={own:'Owned',prevowned:'Prev Owned',fortrade:'For Trade',want:'Want',wanttoplay:'Want to Play',wanttobuy:'Want to Buy',wishlist:'Wishlist',preordered:'Preordered'},sf={};sts.forEach(x=>sf[x]='any');function e(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function cacheKey(){return $('user').value.trim().toLowerCase()}function openCache(){return new Promise((resolve,reject)=>{let r=indexedDB.open('BGGContactsCache',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('collections'))r.result.createObjectStore('collections',{keyPath:'username'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}async function saveCache(){let d=await openCache();return new Promise((res,rej)=>{let t=d.transaction('collections','readwrite');t.objectStore('collections').put({username:cacheKey(),savedAt:Date.now(),games});t.oncomplete=()=>{d.close();res(true)};t.onerror=()=>rej(t.error)})}async function loadCache(){try{let d=await openCache(),c=await new Promise((res,rej)=>{let r=d.transaction('collections').objectStore('collections').get(cacheKey());r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});d.close();if(!c?.games?.length){games=[];$('games').innerHTML='';$('status').textContent='No saved collection. Tap Refresh BGG to load it.';return}games=c.games;$('prog').style.width='100%';$('status').textContent=games.length+' games from device cache • saved '+new Date(c.savedAt).toLocaleString();render()}catch{$('status').textContent='Device cache unavailable. Tap Refresh BGG.'}}async function dbApi(action,opt={}){let r=await fetch('/api/supabase',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,table:'bg_contact',...opt})}),j=await r.json();if(!r.ok||!j.ok)throw Error(typeof j.error==='string'?j.error:JSON.stringify(j.error));return j.rows||[]}async function api(ep,p={},n=6){let r=await fetch(API+'?endpoint='+ep+'&'+new URLSearchParams(p));if(r.status===202&&n){await sleep(1800);return api(ep,p,n-1)}let t=await r.text();if(!r.ok)throw Error('BGG API '+r.status);return t}function col(x){let d=new DOMParser().parseFromString(x,'text/xml');return [...d.querySelectorAll('item')].map(i=>{let s=i.querySelector('status'),o={};sts.forEach(k=>o[k]=+(s?.getAttribute(k)||0));return{id:i.getAttribute('objectid'),title:i.querySelector('name')?.textContent||'',image:i.querySelector('thumbnail')?.textContent||'',status:o}}).filter(x=>x.id)}function cr(i,t){return [...i.querySelectorAll('link[type="'+t+'"]')].map(x=>({id:x.getAttribute('id'),name:x.getAttribute('value'),type:t}))}function things(x,map){let d=new DOMParser().parseFromString(x,'text/xml');return [...d.querySelectorAll('item')].map(i=>{let id=i.getAttribute('id'),b=map.get(id)||{},stats=i.querySelector('statistics ratings'),rank=[...i.querySelectorAll('rank')].find(r=>r.getAttribute('name')==='boardgame');return{id,title:i.querySelector('name[type="primary"]')?.getAttribute('value')||b.title,image:i.querySelector('thumbnail')?.textContent||b.image,status:b.status||{},year:i.querySelector('yearpublished')?.getAttribute('value')||'',rating:stats?.querySelector('average')?.getAttribute('value')||'',rank:rank?.getAttribute('value')||'',publishers:cr(i,'boardgamepublisher'),designers:cr(i,'boardgamedesigner'),artists:cr(i,'boardgameartist')}})}async function pool(a,fn){let n=0,d=0,out=[];async function w(){while(1){let i=n++;if(i>=a.length)return;try{out[i]=await fn(a[i])}catch{out[i]=[]}d++;$('prog').style.width=(15+85*d/a.length)+'%'}}await Promise.all(Array.from({length:Math.min(WORKERS,a.length)},w));return out.flat()}async function load(){try{$('load').disabled=true;let a=col(await api('collection',{username:$('user').value.trim(),stats:1,excludesubtype:'boardgameaccessory'})),m=new Map(a.map(x=>[x.id,x])),c=[];for(let i=0;i<a.length;i+=BATCH)c.push(a.slice(i,i+BATCH).map(x=>x.id));games=await pool(c,ids=>api('thing',{id:ids.join(','),stats:1}).then(x=>things(x,m)));try{await saveCache();$('status').textContent=games.length+' games refreshed and saved on this device'}catch{$('status').textContent=games.length+' games refreshed • device cache could not be saved'}render()}catch(x){$('status').textContent=x.message}finally{$('load').disabled=false}}function people(g){return [...g.publishers,...g.designers,...g.artists]}function saved(p){return contacts.some(c=>String(c.bgg_id)===String(p.id)&&c.bgg_type===p.type)}function render(){let q=$('search').value.toLowerCase(),a=games.filter(g=>sts.every(x=>sf[x]==='any'||sf[x]==='yes'&&!!g.status[x]||sf[x]==='no'&&!g.status[x])&&(!q||[g.title,...people(g).map(x=>x.name)].join(' ').toLowerCase().includes(q)));$('games').innerHTML=a.map(g=>`<div class="card game">${g.image?`<a href="https://boardgamegeek.com/boardgame/${g.id}" target="_blank"><img class="thumb" src="${e(g.image)}"></a>`:''}<div><div class="name" data-g="${g.id}">${e(g.title)}</div><div class="line">Publisher: ${e(g.publishers[0]?.name||'—')}</div><div class="line">Designer: ${e(g.designers[0]?.name||'—')}</div><div class="line">Artist: ${e(g.artists[0]?.name||'—')}</div></div><div class="stats"><div class="stat"><b>${e(g.year||'—')}</b>Year</div><div class="stat"><b>${g.rating?Number(g.rating).toFixed(1):'—'}</b>Rating</div><div class="stat"><b>${g.rank&&g.rank!=='Not Ranked'?'#'+e(g.rank):'—'}</b>Rank</div></div></div>`).join('');document.querySelectorAll('[data-g]').forEach(x=>x.onclick=()=>openGame(x.dataset.g))}function row(p){return `<div class="person"><div><b>${e(p.name)}</b><div class="meta">BGG ID ${p.id}</div></div><div class="personActions"><button class="btn filterBtn" data-filter="${p.type}|${p.id}">⌕</button>${saved(p)?'<span class="saved">✓ Saved</span>':`<button class="btn primary" data-save="${p.type}|${p.id}">Save Contact</button>`}</div></div>`}function findPerson(key){let[t,id]=key.split('|');return people(game).find(p=>p.type===t&&String(p.id)===id)}function openGame(id){game=games.find(x=>x.id===id);$('gtitle').textContent=game.title;let s=(n,a)=>`<h3>${n}</h3>${a.map(row).join('')||'<div class="meta">None</div>'}`;$('gbody').innerHTML=s('Publishers',game.publishers)+s('Designers',game.designers)+s('Artists',game.artists);$('gameModal').classList.add('open');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{let p=findPerson(b.dataset.filter);$('search').value=p.name;closeM('gameModal');render()});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{let p=findPerson(b.dataset.save);let ex=await dbApi('READ',{filters:{bgg_type:p.type,bgg_id:+p.id},limit:1});if(!ex.length)await dbApi('CREATE',{data:{bgg_type:p.type,bgg_id:+p.id,name:p.name,source_game_id:+game.id,source_game_name:game.title,heard_back:false}});await loadContacts();openGame(game.id)})}window.closeM=id=>$(id).classList.remove('open');async function loadContacts(){try{contacts=await dbApi('READ',{limit:1000});contacts.sort((a,b)=>String(a.name).localeCompare(String(b.name)));renderContacts()}catch(err){$('clist').textContent=err.message}}function filteredContacts(){let q=$('csearch').value.toLowerCase();return contacts.filter(c=>!q||[c.name,c.email,c.bgg_username,c.notes,c.first_contact_date,c.source_game_name,c.heard_back?'replied heard back yes':'no reply'].join(' ').toLowerCase().includes(q))}function renderContacts(){let a=filteredContacts(),q=$('csearch').value.toLowerCase(),n=t=>a.filter(c=>c.bgg_type===t).length,replied=a.filter(c=>c.heard_back).length;$('contactCounts').innerHTML=`<span class="count">${a.length}${q?' / '+contacts.length:''} Contacts</span><span class="count">${n('boardgamepublisher')} Publishers</span><span class="count">${n('boardgamedesigner')} Designers</span><span class="count">${n('boardgameartist')} Artists</span><span class="count">${replied} Replied</span><span class="count">${a.length-replied} No Reply</span>`;$('tableView').classList.toggle('active',contactView==='table');$('cardView').classList.toggle('active',contactView==='cards');if(contactView==='table')renderTable(a);else renderCards(a)}function renderTable(a){$('clist').className='tableWrap';$('clist').innerHTML=`<table class="contactTable"><thead><tr><th>Name</th><th>Type</th><th>BGG ID</th><th>Email</th><th>BGG User</th><th>First Contact</th><th>Heard Back</th><th>Source Game</th><th>Notes</th></tr></thead><tbody>${a.map(c=>editRow(c)).join('')}</tbody></table>`;document.querySelectorAll('[data-auto-row]').forEach(x=>{x.addEventListener('change',()=>autoSaveRow(+x.dataset.autoRow,x));if(x.type==='text')x.addEventListener('blur',()=>autoSaveRow(+x.dataset.autoRow,x))})}function editRow(c){return `<tr><td><b>${e(c.name)}</b></td><td>${e(c.bgg_type.replace('boardgame',''))}</td><td>${e(c.bgg_id)}</td><td><input data-auto-row="${c.id}" id="re-email-${c.id}" value="${e(c.email||'')}"></td><td><input data-auto-row="${c.id}" id="re-bgg-${c.id}" value="${e(c.bgg_username||'')}"></td><td><input data-auto-row="${c.id}" id="re-date-${c.id}" type="date" value="${e(c.first_contact_date||'')}"></td><td><button id="re-heard-${c.id}" class="btn smallBtn ${c.heard_back?'yesBtn':'noBtn'}" data-heard="${c.heard_back?'1':'0'}" onclick="toggleRowHeard(${c.id})">${c.heard_back?'Yes':'No'}</button></td><td><input data-auto-row="${c.id}" class="wideInput" id="re-source-${c.id}" value="${e(c.source_game_name||'')}"></td><td><input data-auto-row="${c.id}" class="notesInput" id="re-notes-${c.id}" value="${e(c.notes||'')}"></td></tr>`}let savingRows=new Set;async function autoSaveRow(id,el){if(savingRows.has(id))return;savingRows.add(id);let oldBorder=el?.style.borderColor;if(el)el.style.borderColor='#f0b429';try{await saveRow(id,false);if(el)el.style.borderColor='#39d98a';setTimeout(()=>{if(el)el.style.borderColor=oldBorder||''},700)}catch(err){if(el)el.style.borderColor='#ff718b';console.error(err)}finally{savingRows.delete(id)}}window.toggleRowHeard=async id=>{let b=$('re-heard-'+id),yes=b.dataset.heard!=='1';b.dataset.heard=yes?'1':'0';b.textContent=yes?'Yes':'No';b.className='btn smallBtn '+(yes?'yesBtn':'noBtn');await autoSaveRow(id,b)};async function saveRow(id,reload=false){let heard=$('re-heard-'+id).dataset.heard==='1',data={email:$('re-email-'+id).value.trim()||null,bgg_username:$('re-bgg-'+id).value.trim()||null,first_contact_date:$('re-date-'+id).value||null,heard_back:heard,source_game_name:$('re-source-'+id).value.trim()||null,notes:$('re-notes-'+id).value.trim()||null,updated_at:new Date().toISOString()};await dbApi('UPDATE',{filters:{id},data});let c=contacts.find(x=>x.id===id);if(c)Object.assign(c,data);if(reload)await loadContacts();else{let a=filteredContacts(),replied=a.filter(x=>x.heard_back).length;$('contactCounts').querySelectorAll('.count')[4].textContent=replied+' Replied';$('contactCounts').querySelectorAll('.count')[5].textContent=(a.length-replied)+' No Reply'}}function renderCards(a){$('clist').className='contacts';$('clist').innerHTML=a.map(c=>`<article class="card contact" data-c="${c.id}"><div class="contactTitle">${e(c.name)}</div><span class="contactType">${e(c.bgg_type.replace('boardgame',''))}</span> <span class="replyTag ${c.heard_back?'replyYes':'replyNo'}">${c.heard_back?'Replied':'No Reply'}</span><div class="meta">BGG ID ${c.bgg_id}</div>${c.email?`<div class="contactDetail">✉ ${e(c.email)}</div>`:''}${c.bgg_username?`<div class="contactDetail">BGG: ${e(c.bgg_username)}</div>`:''}${c.first_contact_date?`<div class="contactDetail">First contact: ${e(c.first_contact_date)}</div>`:''}${c.source_game_name?`<div class="meta">Source: ${e(c.source_game_name)}</div>`:''}${c.notes?`<div class="contactNote">${e(c.notes)}</div>`:''}</article>`).join('');document.querySelectorAll('[data-c]').forEach(x=>x.onclick=()=>openContact(+x.dataset.c))}function setModalHeard(v){modalHeard=!!v;$('heardYes').className='btn '+(modalHeard?'yesBtn':'');$('heardNo').className='btn '+(!modalHeard?'noBtn':'')}function openContact(id){editContact=contacts.find(c=>c.id===id);if(!editContact)return;$('ctitle').textContent=editContact.name;$('cmeta').textContent=editContact.bgg_type.replace('boardgame','')+' • BGG ID '+editContact.bgg_id;$('editDate').value=editContact.first_contact_date||'';$('editEmail').value=editContact.email||'';$('editBgg').value=editContact.bgg_username||'';$('editSource').value=editContact.source_game_name||'';$('editNotes').value=editContact.notes||'';setModalHeard(editContact.heard_back);$('contactModal').classList.add('open')}$('heardYes').onclick=()=>setModalHeard(true);$('heardNo').onclick=()=>setModalHeard(false);$('tableView').onclick=()=>{contactView='table';localStorage.setItem('contact_view',contactView);renderContacts()};$('cardView').onclick=()=>{contactView='cards';localStorage.setItem('contact_view',contactView);renderContacts()};$('saveContact').onclick=async()=>{await dbApi('UPDATE',{filters:{id:editContact.id},data:{first_contact_date:$('editDate').value||null,email:$('editEmail').value.trim()||null,bgg_username:$('editBgg').value.trim()||null,source_game_name:$('editSource').value.trim()||null,heard_back:modalHeard,notes:$('editNotes').value.trim()||null,updated_at:new Date().toISOString()}});await loadContacts();closeM('contactModal')};$('deleteContact').onclick=async()=>{if(editContact&&confirm('Delete '+editContact.name+'?')){await dbApi('DELETE',{filters:{id:editContact.id}});await loadContacts();closeM('contactModal')}};sts.forEach(s=>$('filters').insertAdjacentHTML('beforeend',`<button class="chip" data-s="${s}">${labs[s]}</button>`));document.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>{let k=x.dataset.s;sf[k]=sf[k]==='any'?'yes':sf[k]==='yes'?'no':'any';x.className='chip '+(sf[k]==='yes'?'yes':sf[k]==='no'?'no':'');render()});document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(y=>y.classList.toggle('active',y===x));$('collection').classList.toggle('hidden',x.dataset.tab!=='collection');$('contacts').classList.toggle('hidden',x.dataset.tab!=='contacts');if(x.dataset.tab==='contacts')loadContacts()});document.querySelectorAll('.modal').forEach(m=>m.onclick=ev=>{if(ev.target===m)closeM(m.id)});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeM(b.dataset.close));$('load').onclick=load;$('search').oninput=render;$('csearch').oninput=renderContacts;$('user').onchange=loadCache;window.addEventListener('DOMContentLoaded',()=>{let h=localStorage.getItem('app_password_hint');if(h)$('pw').value=h;loadCache()});$('unlock').onclick=async()=>{let p=$('pw').value,c=await fetch('/api/get-password').then(r=>r.text());if(p!==c){$('pwerr').textContent='Invalid key';return}localStorage.setItem('app_password_hint',p);$('gate').classList.add('hidden');await loadCache();await loadContacts()};$('pw').onkeydown=x=>x.key==='Enter'&&$('unlock').click()</script></body></html>
