<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BGG Contacts</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f4f7fb;font:14px system-ui}.app{max-width:1050px;margin:auto;padding:14px}.panel,.card{background:#0d1929;border:1px solid #203149;border-radius:12px;padding:12px}.tabs,.row,.filters,.actions{display:flex;gap:7px;flex-wrap:wrap}.tabs{margin:12px 0}.btn,.chip,input,textarea{font:inherit;border:1px solid #30445f;border-radius:8px;background:#101e30;color:#fff;padding:9px}.btn,.chip{cursor:pointer;font-weight:700}.active,.primary{background:#7c5cff}.load{display:grid;grid-template-columns:1fr auto;gap:7px}.search{width:100%;margin-top:9px}.chip{font-size:11px;padding:6px 8px}.chip.on{background:#30275d}.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;margin-top:10px}.game{display:grid;grid-template-columns:62px 1fr;gap:9px}.thumb{width:62px;height:80px;object-fit:cover;border-radius:6px}.name{font-weight:800;cursor:pointer}.meta{font-size:11px;color:#91a0b5}.line{font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.modal,.gate{position:fixed;inset:0;background:#020814dd;display:none;align-items:center;justify-content:center;padding:14px;z-index:20}.modal.open,.gate{display:flex}.box{width:min(600px,100%);max-height:85vh;overflow:auto;background:#0b1726;border:1px solid #30445f;border-radius:15px;padding:15px}.head,.person{display:flex;justify-content:space-between;align-items:center;gap:8px}.person{border-bottom:1px solid #203149;padding:9px 0}.contacts{display:grid;gap:8px}.contact input,.contact textarea{width:100%;margin-top:6px}.contact textarea{min-height:55px}.hidden{display:none!important}.progress{height:5px;background:#17283d;margin-top:8px}.progress i{display:block;height:100%;width:0;background:#7c5cff}.gatebox{width:min(350px,100%)}@media(max-width:600px){.games{grid-template-columns:1fr}}</style></head><body><div id="gate" class="gate"><div class="box gatebox"><h2>BGG Contacts</h2><input id="pw" style="width:100%" type="password" placeholder="Access key"><button id="unlock" class="btn primary" style="width:100%;margin-top:8px">Unlock</button><div id="pwerr" class="meta"></div></div></div><main class="app"><h1>BGG Contact Finder</h1><div class="tabs"><button class="btn active" data-tab="collection">Collection</button><button class="btn" data-tab="contacts">Contacts</button></div><section id="collection"><div class="panel"><div class="load"><input id="user" value="sportomax" placeholder="BGG username"><button id="load" class="btn primary">Load</button></div><input id="search" class="search" placeholder="Search games, publishers, designers, artists"><div id="filters" class="filters" style="margin-top:8px"></div><div id="status" class="meta" style="margin-top:8px">Ready.</div><div class="progress"><i id="prog"></i></div></div><div id="games" class="games"></div></section><section id="contacts" class="hidden"><div class="panel"><input id="csearch" style="width:100%" placeholder="Search contacts"></div><div id="clist" class="contacts" style="margin-top:8px"></div></section></main><div id="gameModal" class="modal"><div class="box"><div class="head"><h2 id="gtitle"></h2><button class="btn" onclick="closeM('gameModal')">Close</button></div><div id="gbody"></div></div></div><div id="personModal" class="modal"><div class="box"><div class="head"><div><b id="pname"></b><div id="pmeta" class="meta"></div></div><button class="btn" onclick="closeM('personModal')">Close</button></div><div class="actions" style="margin-top:14px"><button id="filterP" class="btn">Filter Collection</button><button id="addP" class="btn primary">Add Contact</button></div></div></div><script>const API='/api/bgg-helper',BATCH=20,WORKERS=100,URL='https://jadyqyrpgcmaixroizov.supabase.co',KEY='sb_publishable_1aiH7EnJyY7XtXYVbSWvjg_NIBK0kYz',db=supabase.createClient(URL,KEY),$=x=>document.getElementById(x),sleep=x=>new Promise(r=>setTimeout(r,x));let games=[],contacts=[],person=null,game=null;const sts=['own','prevowned','fortrade','want','wanttoplay','wanttobuy','wishlist','preordered'],labs={own:'Owned',prevowned:'Prev Owned',fortrade:'For Trade',want:'Want',wanttoplay:'Want to Play',wanttobuy:'Want to Buy',wishlist:'Wishlist',preordered:'Preordered'},sf={};sts.forEach(x=>sf[x]=false);function e(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(ep,p={},n=6){let r=await fetch(API+'?endpoint='+ep+'&'+new URLSearchParams(p));if(r.status===202&&n){await sleep(1800);return api(ep,p,n-1)}let t=await r.text();if(!r.ok)throw Error('BGG API '+r.status);return t}function col(x){let d=new DOMParser().parseFromString(x,'text/xml');return [...d.querySelectorAll('item')].map(i=>{let s=i.querySelector('status'),o={};sts.forEach(k=>o[k]=+(s?.getAttribute(k)||0));return{id:i.getAttribute('objectid'),title:i.querySelector('name')?.textContent||'',image:i.querySelector('thumbnail')?.textContent||'',status:o}}).filter(x=>x.id)}function cr(i,t){return [...i.querySelectorAll('link[type="'+t+'"]')].map(x=>({id:x.getAttribute('id'),name:x.getAttribute('value'),type:t}))}function things(x,map){let d=new DOMParser().parseFromString(x,'text/xml');return [...d.querySelectorAll('item')].map(i=>{let id=i.getAttribute('id'),b=map.get(id)||{};return{id,title:i.querySelector('name[type="primary"]')?.getAttribute('value')||b.title,image:i.querySelector('thumbnail')?.textContent||b.image,status:b.status||{},publishers:cr(i,'boardgamepublisher'),designers:cr(i,'boardgamedesigner'),artists:cr(i,'boardgameartist')}})}async function pool(a,fn){let n=0,d=0,out=[];async function w(){while(1){let i=n++;if(i>=a.length)return;try{out[i]=await fn(a[i])}catch{out[i]=[]}d++;$('prog').style.width=(15+85*d/a.length)+'%';$('status').textContent='Game details '+d+' / '+a.length}}await Promise.all(Array.from({length:Math.min(WORKERS,a.length)},w));return out.flat()}async function load(){try{$('status').textContent='Loading collection…';$('prog').style.width='5%';let a=col(await api('collection',{username:$('user').value.trim(),stats:1,excludesubtype:'boardgameaccessory'})),m=new Map(a.map(x=>[x.id,x])),c=[];for(let i=0;i<a.length;i+=BATCH)c.push(a.slice(i,i+BATCH).map(x=>x.id));games=await pool(c,ids=>api('thing',{id:ids.join(','),stats:1}).then(x=>things(x,m)));$('status').textContent=games.length+' games loaded';render()}catch(x){$('status').textContent=x.message}}function people(g){return [...g.publishers,...g.designers,...g.artists]}function render(){let q=$('search').value.toLowerCase(),on=sts.filter(x=>sf[x]),a=games.filter(g=>(!on.length||on.some(x=>g.status[x]))&&(!q||[g.title,...people(g).map(x=>x.name)].join(' ').toLowerCase().includes(q)));$('games').innerHTML=a.map(g=>`<div class="card game">${g.image?`<a href="https://boardgamegeek.com/boardgame/${g.id}" target="_blank"><img class="thumb" src="${e(g.image)}"></a>`:''}<div><div class="name" data-g="${g.id}">${e(g.title)}</div><div class="line">Publisher: ${e(g.publishers[0]?.name||'—')}</div><div class="line">Designer: ${e(g.designers[0]?.name||'—')}</div><div class="line">Artist: ${e(g.artists[0]?.name||'—')}</div></div></div>`).join('');document.querySelectorAll('[data-g]').forEach(x=>x.onclick=()=>openGame(x.dataset.g))}function openGame(id){game=games.find(x=>x.id===id);$('gtitle').textContent=game.title;let s=(n,a)=>`<h3>${n}</h3>${a.map(p=>`<div class="person"><div><b>${e(p.name)}</b><div class="meta">BGG ID ${p.id}</div></div><button class="btn" data-p="${p.type}|${p.id}">Actions</button></div>`).join('')||'<div class="meta">None</div>'}`;$('gbody').innerHTML=s('Publishers',game.publishers)+s('Designers',game.designers)+s('Artists',game.artists);$('gameModal').classList.add('open');document.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>{let[t,id]=x.dataset.p.split('|');person=people(game).find(p=>p.type===t&&p.id===id);$('pname').textContent=person.name;$('pmeta').textContent=person.type.replace('boardgame','')+' • BGG ID '+person.id;$('personModal').classList.add('open')})}window.closeM=id=>$(id).classList.remove('open');$('filterP').onclick=()=>{$('search').value=person.name;closeM('personModal');closeM('gameModal');render()};$('addP').onclick=async()=>{let {error}=await db.from('BG_contact').upsert({bgg_type:person.type,bgg_id:+person.id,name:person.name,source_game_id:+game.id,source_game_name:game.title},{onConflict:'bgg_type,bgg_id'});if(error)return alert(error.message);$('addP').textContent='Added ✓';loadContacts()};async function loadContacts(){let{data,error}=await db.from('BG_contact').select('*').order('name');if(error)return $('clist').textContent=error.message;contacts=data||[];renderContacts()}function renderContacts(){let q=$('csearch').value.toLowerCase(),a=contacts.filter(c=>!q||[c.name,c.email,c.bgg_username,c.notes].join(' ').toLowerCase().includes(q));$('clist').innerHTML=a.map(c=>`<div class="card contact" data-c="${c.id}"><div class="head"><div><b>${e(c.name)}</b><div class="meta">${e(c.bgg_type.replace('boardgame',''))} • ${c.bgg_id}</div></div><button class="btn del">Delete</button></div><input class="email" placeholder="Email" value="${e(c.email||'')}"><input class="bgg" placeholder="BGG username" value="${e(c.bgg_username||'')}"><textarea class="notes" placeholder="Notes">${e(c.notes||'')}</textarea><button class="btn primary save">Save</button></div>`).join('');document.querySelectorAll('[data-c]').forEach(x=>{let id=+x.dataset.c;x.querySelector('.save').onclick=async()=>{let{error}=await db.from('BG_contact').update({email:x.querySelector('.email').value||null,bgg_username:x.querySelector('.bgg').value||null,notes:x.querySelector('.notes').value||null,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else x.querySelector('.save').textContent='Saved ✓'};x.querySelector('.del').onclick=async()=>{if(confirm('Delete contact?')){await db.from('BG_contact').delete().eq('id',id);loadContacts()}}})}sts.forEach(s=>$('filters').insertAdjacentHTML('beforeend',`<button class="chip" data-s="${s}">${labs[s]}</button>`));document.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>{sf[x.dataset.s]=!sf[x.dataset.s];x.classList.toggle('on');render()});document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(y=>y.classList.toggle('active',y===x));$('collection').classList.toggle('hidden',x.dataset.tab!=='collection');$('contacts').classList.toggle('hidden',x.dataset.tab!=='contacts');if(x.dataset.tab==='contacts')loadContacts()});$('load').onclick=load;$('search').oninput=render;$('csearch').oninput=renderContacts;$('unlock').onclick=async()=>{let t=await fetch('/api/get-password').then(r=>r.text()).catch(()=>''),p=$('pw').value;if(p&&p===t){sessionStorage.setItem('bggContactsUnlocked','1');$('gate').classList.add('hidden');loadContacts()}else $('pwerr').textContent='Invalid access key'};$('pw').onkeydown=x=>x.key==='Enter'&&$('unlock').click();if(sessionStorage.getItem('bggContactsUnlocked')==='1'){$('gate').classList.add('hidden');loadContacts()}</script></body></html>
