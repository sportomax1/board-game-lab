<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BGG Contacts</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f4f7fb;font:14px system-ui}.app{max-width:1050px;margin:auto;padding:14px}.panel,.card{background:#0d1929;border:1px solid #203149;border-radius:12px;padding:12px}.tabs,.filters,.actions{display:flex;gap:7px;flex-wrap:wrap}.tabs{margin:12px 0}.btn,.chip,input,textarea{font:inherit;border:1px solid #30445f;border-radius:8px;background:#101e30;color:#fff;padding:9px}.btn,.chip{cursor:pointer;font-weight:700}.active,.primary{background:#7c5cff}.load{display:grid;grid-template-columns:1fr auto;gap:7px}.search{width:100%;margin-top:9px}.chip{font-size:11px;padding:6px 8px}.chip.yes{background:#176b45;border-color:#39d98a}.chip.no{background:#6b2634;border-color:#ff718b}.games,.contacts{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;margin-top:10px}.game{display:grid;grid-template-columns:62px 1fr;gap:9px}.thumb{width:62px;height:80px;object-fit:cover;border-radius:6px}.name{font-weight:800;cursor:pointer}.meta{font-size:11px;color:#91a0b5}.line{font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.modal,.gate{position:fixed;inset:0;background:#020814dd;display:none;align-items:center;justify-content:center;padding:14px;z-index:20}.modal.open,.gate{display:flex}.box{width:min(600px,100%);max-height:85vh;overflow:auto;background:#0b1726;border:1px solid #30445f;border-radius:15px;padding:15px}.head,.person{display:flex;justify-content:space-between;align-items:center;gap:8px}.person{border-bottom:1px solid #203149;padding:9px 0}.personActions{display:flex;gap:6px;align-items:center;flex-shrink:0}.filterBtn{width:36px;height:36px;padding:0;font-size:18px}.saved{padding:7px 9px;border-radius:8px;background:#176b45;border:1px solid #39d98a;font-size:11px;font-weight:800}.contact{cursor:pointer;min-height:120px}.contactTitle{font-size:16px;font-weight:800}.contactType{display:inline-block;margin-top:5px;padding:3px 7px;border-radius:999px;background:#17283d;font-size:10px;text-transform:capitalize}.contactDetail{margin-top:8px;color:#c3ccda;font-size:12px}.contactNote{margin-top:8px;color:#91a0b5;font-size:11px}.editGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.editGrid label{font-size:11px;color:#91a0b5}.editGrid input,.editGrid textarea{width:100%;margin-top:4px}.editGrid textarea{min-height:90px}.full{grid-column:1/-1}.hidden{display:none!important}.progress{height:5px;background:#17283d;margin-top:8px}.progress i{display:block;height:100%;width:0;background:#7c5cff}@media(max-width:800px){body{overflow-x:hidden}.app,.panel{width:100%;max-width:100%}.app{padding:10px}.load{grid-template-columns:minmax(0,1fr) auto}.games,.contacts{display:flex;flex-direction:column;width:100%}.game{width:100%;grid-template-columns:64px minmax(0,1fr)}.game>div{min-width:0}.thumb{width:64px;height:82px}.person{align-items:flex-start}.personActions{gap:5px}.personActions .primary{padding:8px}.editGrid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div id="gate" class="gate"><div class="box"><h2>BGG Contacts</h2><input id="pw" style="width:100%" type="password" placeholder="Access Key"><button id="unlock" class="btn primary" style="width:100%;margin-top:8px">Unlock Dashboard</button><div id="pwerr" class="meta"></div></div></div><main class="app"><h1>BGG Contact Finder</h1><div class="tabs"><button class="btn active" data-tab="collection">Collection</button><button class="btn" data-tab="contacts">Contacts</button></div><section id="collection"><div class="panel"><div class="load"><input id="user" value="sportomax"><button id="load" class="btn primary">Refresh BGG</button></div><input id="search" class="search" placeholder="Search games, publishers, designers, artists"><div id="filters" class="filters" style="margin-top:8px"></div><div id="status" class="meta" style="margin-top:8px">Checking local cache…</div><div class="progress"><i id="prog"></i></div></div><div id="games" class="games"></div></section><section id="contacts" class="hidden"><div class="panel"><input id="csearch" style="width:100%" placeholder="Search contacts"></div><div id="clist" class="contacts"></div></section></main><div id="gameModal" class="modal"><div class="box"><div class="head"><h2 id="gtitle"></h2><button class="btn" onclick="closeM('gameModal')">Close</button></div><div id="gbody"></div></div></div><div id="contactModal" class="modal"><div class="box"><div class="head"><div><h2 id="ctitle"></h2><div id="cmeta" class="meta"></div></div><button class="btn" onclick="closeM('contactModal')">Close</button></div><div class="editGrid"><label>First Contact Date<input id="editDate" type="date"></label><label>Email<input id="editEmail"></label><label>BGG Username<input id="editBgg"></label><label class="full">Notes<textarea id="editNotes"></textarea></label></div><div class="actions"><button id="deleteContact" class="btn">Delete</button><button id="saveContact" class="btn primary">Save Changes</button></div></div></div><script>const API='/api/bgg-helper',BATCH=20,WORKERS=100,CACHE_PREFIX='bggContactsCollection:v1:',$=x=>document.getElementById(x),sleep=x=>new Promise(r=>setTimeout(r,x));let games=[],contacts=[],game=null,editContact=null;const sts=['own','prevowned','fortrade','want','wanttoplay','wanttobuy','wishlist','preordered'],labs={own:'Owned',prevowned:'Prev Owned',fortrade:'For Trade',want:'Want',wanttoplay:'Want to Play',wanttobuy:'Want to Buy',wishlist:'Wishlist',preordered:'Preordered'},sf={};sts.forEach(x=>sf[x]='any');function e(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function cacheKey(){return CACHE_PREFIX+$('user').value.trim().toLowerCase()}function saveCache(){try{localStorage.setItem(cacheKey(),JSON.stringify({savedAt:Date.now(),games}));return true}catch{return false}}function loadCache(){try{let raw=localStorage.getItem(cacheKey());if(!raw){games=[];$('games').innerHTML='';$('status').textContent='No saved collection. Tap Refresh BGG to load it.';return false}let c=JSON.parse(raw);games=c.games||[];$('prog').style.width='100%';$('status').textContent=games.length+' games from local cache • saved '+new Date(c.savedAt).toLocaleString();render();return true}catch{$('status').textContent='Local cache unavailable. Tap Refresh BGG.';return false}}async function dbApi(action,opt={}){let r=await fetch('/api/supabase',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,table:'bg_contact',...opt})}),j=await r.json();if(!r.ok||!j.ok)throw Error(typeof j.error==='string'?j.error:JSON.stringify(j.error));return j.rows||[]}async function api(ep,p={},n=6){let r=await fetch(API+'?endpoint='+ep+'&'+new URLSearchParams(p));if(r.status===202&&n){await sleep(1800);return api(ep,p,n-1)}let t=await r.text();if(!r.ok)throw Error('BGG API '+r.status);return t}function col(x){let d=new DOMParser().parseFromString(x,'text/xml');return [...d.querySelectorAll('item')].map(i=>{let s=i.querySelector('status'),o={};sts.forEach(k=>o[k]=+(s?.getAttribute(k)||0));return{id:i.getAttribute('objectid'),title:i.querySelector('name')?.textContent||'',image:i.querySelector('thumbnail')?.textContent||'',status:o}}).filter(x=>x.id)}function cr(i,t){return [...i.querySelectorAll('link[type="'+t+'"]')].map(x=>({id:x.getAttribute('id'),name:x.getAttribute('value'),type:t}))}function things(x,map){let d=new DOMParser().parseFromString(x,'text/xml');return [...d.querySelectorAll('item')].map(i=>{let id=i.getAttribute('id'),b=map.get(id)||{};return{id,title:i.querySelector('name[type="primary"]')?.getAttribute('value')||b.title,image:i.querySelector('thumbnail')?.textContent||b.image,status:b.status||{},publishers:cr(i,'boardgamepublisher'),designers:cr(i,'boardgamedesigner'),artists:cr(i,'boardgameartist')}})}async function pool(a,fn){let n=0,d=0,out=[];async function w(){while(1){let i=n++;if(i>=a.length)return;try{out[i]=await fn(a[i])}catch{out[i]=[]}d++;$('prog').style.width=(15+85*d/a.length)+'%';$('status').textContent='Game details '+d+' / '+a.length}}await Promise.all(Array.from({length:Math.min(WORKERS,a.length)},w));return out.flat()}async function load(){try{$('load').disabled=true;$('status').textContent='Refreshing collection from BGG…';let a=col(await api('collection',{username:$('user').value.trim(),stats:1,excludesubtype:'boardgameaccessory'})),m=new Map(a.map(x=>[x.id,x])),c=[];for(let i=0;i<a.length;i+=BATCH)c.push(a.slice(i,i+BATCH).map(x=>x.id));games=await pool(c,ids=>api('thing',{id:ids.join(','),stats:1}).then(x=>things(x,m)));let cached=saveCache();$('status').textContent=games.length+' games refreshed'+(cached?' and saved locally':' • local cache could not be saved');$('prog').style.width='100%';render()}catch(x){$('status').textContent=x.message}finally{$('load').disabled=false}}function people(g){return [...g.publishers,...g.designers,...g.artists]}function saved(p){return contacts.some(c=>String(c.bgg_id)===String(p.id)&&c.bgg_type===p.type)}function render(){let q=$('search').value.toLowerCase(),a=games.filter(g=>sts.every(x=>sf[x]==='any'||sf[x]==='yes'&&!!g.status[x]||sf[x]==='no'&&!g.status[x])&&(!q||[g.title,...people(g).map(x=>x.name)].join(' ').toLowerCase().includes(q)));$('games').innerHTML=a.map(g=>`<div class="card game">${g.image?`<a href="https://boardgamegeek.com/boardgame/${g.id}" target="_blank"><img class="thumb" src="${e(g.image)}"></a>`:''}<div><div class="name" data-g="${g.id}">${e(g.title)}</div><div class="line">Publisher: ${e(g.publishers[0]?.name||'—')}</div><div class="line">Designer: ${e(g.designers[0]?.name||'—')}</div><div class="line">Artist: ${e(g.artists[0]?.name||'—')}</div></div></div>`).join('');document.querySelectorAll('[data-g]').forEach(x=>x.onclick=()=>openGame(x.dataset.g))}function row(p){return `<div class="person"><div><b>${e(p.name)}</b><div class="meta">BGG ID ${p.id}</div></div><div class="personActions"><button class="btn filterBtn" data-filter="${p.type}|${p.id}" title="Filter games">⌕</button>${saved(p)?'<span class="saved">✓ Saved</span>':`<button class="btn primary" data-save="${p.type}|${p.id}">Save Contact</button>`}</div></div>`}function findPerson(key){let[t,id]=key.split('|');return people(game).find(p=>p.type===t&&String(p.id)===id)}function openGame(id){game=games.find(x=>x.id===id);$('gtitle').textContent=game.title;let s=(n,a)=>`<h3>${n}</h3>${a.map(row).join('')||'<div class="meta">None</div>'}`;$('gbody').innerHTML=s('Publishers',game.publishers)+s('Designers',game.designers)+s('Artists',game.artists);$('gameModal').classList.add('open');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{let p=findPerson(b.dataset.filter);$('search').value=p.name;closeM('gameModal');render()});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{let p=findPerson(b.dataset.save);b.disabled=true;b.textContent='Saving…';try{let ex=await dbApi('READ',{filters:{bgg_type:p.type,bgg_id:+p.id},limit:1});if(!ex.length)await dbApi('CREATE',{data:{bgg_type:p.type,bgg_id:+p.id,name:p.name,source_game_id:+game.id,source_game_name:game.title}});await loadContacts();openGame(game.id)}catch(err){b.disabled=false;b.textContent='Save Contact';alert(err.message)}})}window.closeM=id=>$(id).classList.remove('open');async function loadContacts(){try{contacts=await dbApi('READ',{limit:1000});contacts.sort((a,b)=>String(a.name).localeCompare(String(b.name)));renderContacts()}catch(err){$('clist').textContent=err.message}}function renderContacts(){let q=$('csearch').value.toLowerCase(),a=contacts.filter(c=>!q||[c.name,c.email,c.bgg_username,c.notes,c.first_contact_date,c.source_game_name].join(' ').toLowerCase().includes(q));$('clist').innerHTML=a.map(c=>`<article class="card contact" data-c="${c.id}"><div class="contactTitle">${e(c.name)}</div><span class="contactType">${e(c.bgg_type.replace('boardgame',''))}</span><div class="meta">BGG ID ${c.bgg_id}</div>${c.email?`<div class="contactDetail">✉ ${e(c.email)}</div>`:''}${c.bgg_username?`<div class="contactDetail">BGG: ${e(c.bgg_username)}</div>`:''}${c.first_contact_date?`<div class="contactDetail">First contact: ${e(c.first_contact_date)}</div>`:''}${c.source_game_name?`<div class="meta">Found via ${e(c.source_game_name)}</div>`:''}${c.notes?`<div class="contactNote">${e(c.notes)}</div>`:''}</article>`).join('')||'<div class="panel meta">No contacts saved.</div>';document.querySelectorAll('[data-c]').forEach(x=>x.onclick=()=>openContact(+x.dataset.c))}function openContact(id){editContact=contacts.find(c=>c.id===id);if(!editContact)return;$('ctitle').textContent=editContact.name;$('cmeta').textContent=editContact.bgg_type.replace('boardgame','')+' • BGG ID '+editContact.bgg_id;$('editDate').value=editContact.first_contact_date||'';$('editEmail').value=editContact.email||'';$('editBgg').value=editContact.bgg_username||'';$('editNotes').value=editContact.notes||'';$('contactModal').classList.add('open')}$('saveContact').onclick=async()=>{if(!editContact)return;await dbApi('UPDATE',{filters:{id:editContact.id},data:{first_contact_date:$('editDate').value||null,email:$('editEmail').value.trim()||null,bgg_username:$('editBgg').value.trim()||null,notes:$('editNotes').value.trim()||null,updated_at:new Date().toISOString()}});await loadContacts();closeM('contactModal')};$('deleteContact').onclick=async()=>{if(editContact&&confirm('Delete '+editContact.name+'?')){await dbApi('DELETE',{filters:{id:editContact.id}});await loadContacts();closeM('contactModal')}};sts.forEach(s=>$('filters').insertAdjacentHTML('beforeend',`<button class="chip" data-s="${s}">${labs[s]}</button>`));document.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>{let k=x.dataset.s;sf[k]=sf[k]==='any'?'yes':sf[k]==='yes'?'no':'any';x.classList.toggle('yes',sf[k]==='yes');x.classList.toggle('no',sf[k]==='no');x.title=sf[k]==='yes'?'Yes':sf[k]==='no'?'No':'Any';render()});document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(y=>y.classList.toggle('active',y===x));$('collection').classList.toggle('hidden',x.dataset.tab!=='collection');$('contacts').classList.toggle('hidden',x.dataset.tab!=='contacts');if(x.dataset.tab==='contacts')loadContacts()});$('load').onclick=load;$('search').oninput=render;$('csearch').oninput=renderContacts;$('user').onchange=loadCache;window.addEventListener('DOMContentLoaded',()=>{let hint=localStorage.getItem('app_password_hint');if(hint)$('pw').value=hint;loadCache()});$('unlock').onclick=async()=>{let password=$('pw').value,btn=$('unlock');btn.disabled=true;btn.textContent='Checking Key…';try{let correct=await fetch('/api/get-password').then(r=>r.text());if(password!==correct){$('pwerr').textContent='Invalid key';return}localStorage.setItem('app_password_hint',password);$('gate').classList.add('hidden');loadCache();await loadContacts()}catch{$('pwerr').textContent='Unable to verify key'}finally{btn.disabled=false;btn.textContent='Unlock Dashboard'}};$('pw').onkeydown=x=>x.key==='Enter'&&$('unlock').click()</script></body></html>
