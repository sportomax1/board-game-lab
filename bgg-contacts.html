          onchange=&quot;sortGames()&quot; 
          class=&quot;px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none transition-all bg-white font-medium text-sm&quot;
        &gt;
          &lt;option value=&quot;rank-asc&quot;&gt;Rank: Best to Worst&lt;/option&gt;
          &lt;option value=&quot;rank-desc&quot;&gt;Rank: Worst to Best&lt;/option&gt;
          &lt;option value=&quot;name&quot;&gt;Name: A-Z&lt;/option&gt;
          &lt;option value=&quot;rating-desc&quot;&gt;Rating: High to Low&lt;/option&gt;
          &lt;option value=&quot;rating-asc&quot;&gt;Rating: Low to High&lt;/option&gt;
          &lt;option value=&quot;playtime-asc&quot;&gt;Playing Time: Short-Long&lt;/option&gt;
          &lt;option value=&quot;playtime-desc&quot;&gt;Playing Time: Long-Short&lt;/option&gt;

&lt;script&gt;
const FAMILY_ID = 70360; // Board Game Arena family ID
const GEEKLIST_ID = 140673; // BGA geeklist
let allGames = [];
let displayedGames = [];
let isLoading = false;
let bgaGeeklistMap = new Map(); // Map of game ID to BGA URL
let collectionFilter = &#x27;missing&#x27;; // &#x27;missing&#x27; or &#x27;onbga&#x27;
let allCollectionGames = []; // All games from user collection
let missingGames = []; // Games not on BGA
let onBgaGames = []; // Games already on BGA

async function fetchGeeklistUrls() {
  try {
    const geeklistXml = await fetchAPI(&#x27;geeklist&#x27;, GEEKLIST_ID.toString());
    const doc = new DOMParser().parseFromString(geeklistXml, &#x27;text/xml&#x27;);
    const items = doc.querySelectorAll(&#x27;item&#x27;);
    
    items.forEach(item =&gt; {
      const objectid = item.getAttribute(&#x27;objectid&#x27;); // Get the actual game ID, not the geeklist item ID
      
      // Try link element first
      const links = item.querySelectorAll(&#x27;link&#x27;);
      let found = false;
      links.forEach(link =&gt; {
        if (link.getAttribute(&#x27;type&#x27;) === &#x27;boardgamearena&#x27;) {
          const url = link.getAttribute(&#x27;href&#x27;);
          if (url) {
            bgaGeeklistMap.set(objectid, url);
            found = true;
          }
        }
      });
      
      // If not found in links, check body/description for URL
      if (!found) {
        const bodyText = item.textContent || &#x27;&#x27;;
        // Match BGA URLs - they typically look like: https://boardgamearena.com/...
        const urlMatch = bodyText.match(/(https?:\/\/(?:www\.)?boardgamearena\.com[^\s&lt;&gt;&quot;]*)/i);
        if (urlMatch &amp;&amp; urlMatch[1]) {
          bgaGeeklistMap.set(objectid, urlMatch[1]);
        }
      }
    });
    
    console.log(&#x27;BGA Geeklist loaded:&#x27;, bgaGeeklistMap.size, &#x27;games&#x27;);
  } catch (e) {
    console.error(&#x27;Error fetching geeklist:&#x27;, e);
  }
}

async function bgaFetchCollectionReal() {
  if(!BGA_MANUAL_API_ALLOWED) throw new Error(&#x27;Manual Refresh BGA Data required.&#x27;);
  const loadingSection = document.getElementById(&#x27;loadingSection&#x27;);
  const controlsSection = document.getElementById(&#x27;controlsSection&#x27;);
  const gamesSection = document.getElementById(&#x27;gamesSection&#x27;);
  const statsSection = document.getElementById(&#x27;statsSection&#x27;);
  
  try {
    isLoading = true;
    
    // Fetch family to get game IDs
    updateLoadingStatus(&#x27;Fetching Board Game Arena family...&#x27;);
    const familyXml = await fetchAPI(&#x27;family&#x27;, FAMILY_ID.toString());
    const doc = new DOMParser().parseFromString(familyXml, &#x27;text/xml&#x27;);
    const familyItem = doc.querySelector(&#x27;item[type=&quot;boardgamefamily&quot;]&#x27;);
    
    if (!familyItem) throw new Error(&#x27;Family not found&#x27;);
    
    const links = familyItem.querySelectorAll(&#x27;link[type=&quot;boardgamefamily&quot;]&#x27;);
    const gameIds = Array.from(links)
      .map(link =&gt; link.getAttribute(&#x27;id&#x27;))
      .filter(id =&gt; id);
    
    updateLoadingStatus(`Found ${gameIds.length} games. Loading details...`);
    document.getElementById(&#x27;gameCount&#x27;).textContent = gameIds.length;
    
    // Initialize games array with bgaUrl field
    allGames = gameIds.map(id =&gt; ({
      objectid: id,
      name: &#x27;&#x27;,
      thumb: &#x27;&#x27;,
      rating: 0,
      rank: 999999,
      playingtime: null,
      loaded: false,
      bgaUrl: null
    }));
    
    // Fetch geeklist 140673 to get BGA URLs
    updateLoadingStatus(&#x27;Fetching BGA geeklist...&#x27;);
    await fetchGeeklistUrls();
    
    // Show UI
    controlsSection.classList.remove(&#x27;hidden&#x27;);
    gamesSection.classList.remove(&#x27;hidden&#x27;);
    statsSection.classList.remove(&#x27;hidden&#x27;);
    displayedGames = [...allGames];
    renderGames();
    
    // Fetch game details in batches with 100x parallel processing
    const batchSize = 20;
    const parallelBatches = 100;
    const batches = [];
    for (let i = 0; i &lt; gameIds.length; i += batchSize) {
      batches.push(gameIds.slice(i, i + batchSize));
    }
    
    // Process batches in parallel groups
    for (let i = 0; i &lt; batches.length; i += parallelBatches) {
      const batchGroup = batches.slice(i, i + parallelBatches);
      updateLoadingStatus(`Loading details ${Math.min(i + parallelBatches, batches.length)}/${batches.length}...`);
      updateProgress((Math.min(i + parallelBatches, batches.length) / batches.length) * 100);
      
      await Promise.all(batchGroup.map(async (batch) =&gt; {
        const ids = batch.join(&#x27;,&#x27;);
        
        try {
          const thingXml = await fetchAPI(&#x27;thing&#x27;, ids, &#x27;&amp;stats=1&#x27;);
          const thingDoc = new DOMParser().parseFromString(thingXml, &#x27;text/xml&#x27;);
          const thingItems = Array.from(thingDoc.querySelectorAll(&#x27;item&#x27;));
          
          thingItems.forEach(thingItem =&gt; {
            const id = thingItem.getAttribute(&#x27;id&#x27;);
            const game = allGames.find(g =&gt; g.objectid === id);
            if (!game) return;
            
            // Get name
            const nameElem = thingItem.querySelector(&#x27;name[type=&quot;primary&quot;]&#x27;);
            game.name = nameElem ? nameElem.getAttribute(&#x27;value&#x27;) : &#x27;Unknown&#x27;;
            
            // Get thumbnail
            game.thumb = thingItem.querySelector(&#x27;thumbnail&#x27;)?.textContent || &#x27;&#x27;;
            
            // Get rating
            const avgElement = thingItem.querySelector(&#x27;statistics ratings average&#x27;);
            if (avgElement) {
              game.rating = parseFloat(avgElement.getAttribute(&#x27;value&#x27;) || &#x27;0&#x27;);
            }
            
            // Get rank
            const rankElement = thingItem.querySelector(&#x27;statistics ratings ranks rank[name=&quot;boardgame&quot;]&#x27;);
            if (rankElement) {
              const rankValue = rankElement.getAttribute(&#x27;value&#x27;);
              if (rankValue &amp;&amp; rankValue !== &#x27;Not Ranked&#x27;) {
                game.rank = parseInt(rankValue);
              }
            }
            
            // Get playing time
            const playtimeElement = thingItem.querySelector(&#x27;playingtime&#x27;);
            if (playtimeElement) {
              game.playingtime = parseInt(playtimeElement.textContent || &#x27;0&#x27;);
            }
            
            game.loaded = true;
            game.bgaUrl = bgaGeeklistMap.get(id) || null;
          });
          
        } catch (e) {
          console.error(&#x27;Batch error:&#x27;, e);
        }
      }));
      
      // Update display after each parallel group
      updateStats();
      sortGames();
      
      await wait(500);
    }
    
    updateLoadingStatus(&#x27;Complete!&#x27;);
    updateProgress(100);
    isLoading = false;
    
    // Hide loading indicator
    setTimeout(() =&gt; {
      loadingSection.classList.add(&#x27;hidden&#x27;);
    }, 500);
    
  } catch (e) {
    console.error(e);
    alert(&#x27;Failed to fetch games. Please try again.&#x27;);
    loadingSection.classList.add(&#x27;hidden&#x27;);
  }
}

function updateLoadingStatus(msg) {
  document.getElementById(&#x27;loadingStatus&#x27;).textContent = msg;
}

function updateProgress(percent) {
  document.getElementById(&#x27;progressBar&#x27;).style.width = percent + &#x27;%&#x27;;
}

function updateStats() {
  const top100 = allGames.filter(g =&gt; g.rank &lt;= 100 &amp;&amp; g.rank &gt; 0).length;
  const top500 = allGames.filter(g =&gt; g.rank &lt;= 500 &amp;&amp; g.rank &gt; 0).length;
  const top1k = allGames.filter(g =&gt; g.rank &lt;= 1000 &amp;&amp; g.rank &gt; 0).length;
  
  const ratedGames = allGames.filter(g =&gt; g.rating &gt; 0);
  const avgRating = ratedGames.length &gt; 0 
    ? (ratedGames.reduce((sum, g) =&gt; sum + g.rating, 0) / ratedGames.length).toFixed(1)
    : &#x27;0&#x27;;
  
  document.getElementById(&#x27;top100&#x27;).textContent = top100;
  document.getElementById(&#x27;top500&#x27;).textContent = top500;
  document.getElementById(&#x27;top1k&#x27;).textContent = top1k;
  document.getElementById(&#x27;avgRating&#x27;).textContent = avgRating;
}

function filterGames() {
  const search = document.getElementById(&#x27;searchInput&#x27;).value.toLowerCase();
  displayedGames = allGames.filter(game =&gt; game.name.toLowerCase().includes(search));
  sortGames();
}

function sortGames() {
  const sortBy = document.getElementById(&#x27;sortSelect&#x27;).value;
  
  if (sortBy === &#x27;rank-asc&#x27;) {
    displayedGames.sort((a, b) =&gt; a.rank - b.rank);
  } else if (sortBy === &#x27;rank-desc&#x27;) {
    displayedGames.sort((a, b) =&gt; b.rank - a.rank);
  } else if (sortBy === &#x27;name&#x27;) {
    displayedGames.sort((a, b) =&gt; a.name.localeCompare(b.name));
  } else if (sortBy === &#x27;rating-desc&#x27;) {
    displayedGames.sort((a, b) =&gt; b.rating - a.rating);
  } else if (sortBy === &#x27;rating-asc&#x27;) {
    displayedGames.sort((a, b) =&gt; a.rating - b.rating);
  } else if (sortBy === &#x27;playtime-asc&#x27;) {
    displayedGames.sort((a, b) =&gt; (a.playingtime ?? 99999) - (b.playingtime ?? 99999));
  } else if (sortBy === &#x27;playtime-desc&#x27;) {
    displayedGames.sort((a, b) =&gt; (b.playingtime ?? -1) - (a.playingtime ?? -1));
  }
  
  renderGames();
}

function renderGames() {
  const container = document.getElementById(&#x27;gamesSection&#x27;);
  container.innerHTML = &#x27;&#x27;;
  
  displayedGames.forEach(game =&gt; {
    const card = document.createElement(&#x27;div&#x27;);
    card.className = &#x27;game-card bg-white rounded-xl shadow-sm border border-slate-100 p-4 cursor-pointer&#x27;;
    // If has BGA URL, clicking card opens BGA; otherwise open BGG
    card.onclick = () =&gt; {
      if (game.bgaUrl) {
        window.open(game.bgaUrl, &#x27;_blank&#x27;);
      } else {
        window.open(`https://boardgamegeek.com/boardgame/${game.objectid}`, &#x27;_blank&#x27;);
      }
    };
    
    const isLoaded = game.loaded || !isLoading;
    const rankColor = game.rank &lt;= 100 ? &#x27;bg-green-100 text-green-700 border-green-200&#x27; :
                      game.rank &lt;= 500 ? &#x27;bg-blue-100 text-blue-700 border-blue-200&#x27; :
                      game.rank &lt;= 1000 ? &#x27;bg-purple-100 text-purple-700 border-purple-200&#x27; :
                      &#x27;bg-slate-100 text-slate-600 border-slate-200&#x27;;
    
    card.innerHTML = `
      &lt;div class=&quot;flex gap-4&quot;&gt;
        &lt;img 
          src=&quot;/api/image-proxy?url=${encodeURIComponent(game.thumb)}&quot; 
          alt=&quot;${game.name}&quot;
          class=&quot;w-20 h-20 rounded-lg object-cover bg-slate-200 flex-shrink-0 cursor-pointer&quot;
          onclick=&quot;event.stopPropagation(); window.open(&#x27;https://boardgamegeek.com/boardgame/${game.objectid}&#x27;, &#x27;_blank&#x27;)&quot;
        &gt;
        &lt;div class=&quot;flex-1 min-w-0&quot;&gt;
          &lt;div class=&quot;flex items-start justify-between gap-2&quot;&gt;
            &lt;h3 class=&quot;font-bold text-slate-900 mb-2&quot;&gt;${game.name || &#x27;...&#x27;}&lt;/h3&gt;
            ${game.bgaUrl ? `&lt;a href=&quot;${game.bgaUrl}&quot; target=&quot;_blank&quot; onclick=&quot;event.stopPropagation()&quot; class=&quot;bg-green-500 hover:bg-green-600 text-white px-2 py-1 rounded text-xs font-bold flex-shrink-0 whitespace-nowrap transition-colors&quot;&gt;&lt;i class=&quot;fa-solid fa-play&quot;&gt;&lt;/i&gt; Play&lt;/a&gt;` : &#x27;&#x27;}
          &lt;/div&gt;
          &lt;div class=&quot;flex flex-wrap gap-2&quot;&gt;
            ${isLoaded ? `
              &lt;div class=&quot;rank-badge ${rankColor} px-2 py-1 rounded text-xs font-bold border&quot;&gt;
                ${game.rank &lt; 999999 ? &#x27;#&#x27; + game.rank : &#x27;Unranked&#x27;}
              &lt;/div&gt;
              ${game.rating &gt; 0 ? `
                &lt;div class=&quot;bg-amber-50 border border-amber-200 text-amber-700 px-2 py-1 rounded text-xs font-bold&quot;&gt;
                  ⭐ ${game.rating.toFixed(1)}
                &lt;/div&gt;
              ` : &#x27;&#x27;}
            ` : `
              &lt;div class=&quot;skeleton bg-slate-200 h-6 w-16 rounded&quot;&gt;&lt;/div&gt;
              &lt;div class=&quot;skeleton bg-slate-200 h-6 w-20 rounded&quot;&gt;&lt;/div&gt;
            `}
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    `;
    
    container.appendChild(card);
  });
}

let modalGames = [];

function openCollectionModal() {
  document.getElementById(&#x27;collectionModal&#x27;).classList.remove(&#x27;hidden&#x27;);
}

function closeCollectionModal() {
  document.getElementById(&#x27;collectionModal&#x27;).classList.add(&#x27;hidden&#x27;);

async function checkCollection() {
  const username = document.getElementById(&#x27;collectionUsername&#x27;).value;
  const content = document.getElementById(&#x27;modalContent&#x27;);
  const stats = document.getElementById(&#x27;modalStats&#x27;);
  const loadingStatus = document.getElementById(&#x27;modalLoadingStatus&#x27;);
  
  if (!username) return;
  
  content.innerHTML = `
    &lt;div class=&quot;flex flex-col items-center justify-center p-10 gap-3&quot;&gt;
      &lt;i class=&quot;fa-solid fa-circle-notch fa-spin text-blue-600 text-2xl&quot;&gt;&lt;/i&gt;
      &lt;span class=&quot;font-bold text-slate-500&quot;&gt;Fetching collection for ${username}...&lt;/span&gt;
    &lt;/div&gt;
  `;
  stats.classList.add(&#x27;hidden&#x27;);
  loadingStatus.classList.add(&#x27;hidden&#x27;);
  
  try {
    // Corrected to use stats=1 to get ratings and ranks
    const xml = await fetchAPI(&#x27;collection&#x27;, username, &#x27;&amp;own=1&amp;stats=1&#x27;);
    const doc = new DOMParser().parseFromString(xml, &#x27;text/xml&#x27;);
    
    // Check for errors in BGG response
    const errors = doc.querySelector(&#x27;errors&#x27;);
    if (errors) {
       throw new Error(errors.textContent || &#x27;BGG Error&#x27;);
    }

    const items = Array.from(doc.querySelectorAll(&#x27;item&#x27;));
    
    // Create a Set of BGA game IDs for O(1) lookup
    const bgaIds = new Set(allGames.map(g =&gt; g.objectid));
    
    // Separate into missing and onBGA
    allCollectionGames = items.map(item =&gt; {
      const id = item.getAttribute(&#x27;objectid&#x27;);
      let rank = 999999;
      const rankNode = item.querySelector(&#x27;stats rating ranks rank[name=&quot;boardgame&quot;]&#x27;);
      if (rankNode) {
          const val = rankNode.getAttribute(&#x27;value&#x27;);
          if (val &amp;&amp; val !== &#x27;Not Ranked&#x27;) {
              rank = parseInt(val);
          }
      }
      return {
        id: id,
        name: item.querySelector(&#x27;name&#x27;)?.textContent || &#x27;Unknown&#x27;,
        thumb: item.querySelector(&#x27;thumbnail&#x27;)?.textContent || &#x27;&#x27;,
        rating: parseFloat(item.querySelector(&#x27;stats rating&#x27;)?.getAttribute(&#x27;value&#x27;) || &#x27;0&#x27;),
        rank: rank,
        averageweight: null,
        playingtime: null,
        onBga: bgaIds.has(id)
      };
    });
    
    missingGames = allCollectionGames.filter(g =&gt; !g.onBga);
    onBgaGames = allCollectionGames.filter(g =&gt; g.onBga);
    
    // Fetch thing API data for all games with status update
    loadingStatus.classList.remove(&#x27;hidden&#x27;);
    loadingStatus.textContent = &#x27;Loading weight &amp; playtime data...&#x27;;
    
    const batchSize = 20;
    const parallelBatches = 100;
    const allGamesToFetch = [...missingGames, ...onBgaGames];
    const batches = [];
    
    for (let i = 0; i &lt; allGamesToFetch.length; i += batchSize) {
      batches.push(allGamesToFetch.slice(i, i + batchSize));
    }
    
    for (let i = 0; i &lt; batches.length; i += parallelBatches) {
      const batchGroup = batches.slice(i, i + parallelBatches);
      await Promise.all(batchGroup.map(async (batch) =&gt; {
        const ids = batch.map(g =&gt; g.id).join(&#x27;,&#x27;);
        try {
          const thingXml = await fetchAPI(&#x27;thing&#x27;, ids, &#x27;&amp;stats=1&#x27;);
          const thingDoc = new DOMParser().parseFromString(thingXml, &#x27;text/xml&#x27;);
          const thingItems = Array.from(thingDoc.querySelectorAll(&#x27;item&#x27;));
          thingItems.forEach(thingItem =&gt; {
            const id = thingItem.getAttribute(&#x27;id&#x27;);
            const game = allGamesToFetch.find(g =&gt; g.id === id);
            if (!game) return;
            const weightNode = thingItem.querySelector(&#x27;statistics ratings averageweight&#x27;);
            if (weightNode) {
              game.averageweight = parseFloat(weightNode.getAttribute(&#x27;value&#x27;) || &#x27;0&#x27;);
            }
            const ptNode = thingItem.querySelector(&#x27;playingtime&#x27;);
            if (ptNode) {
              game.playingtime = parseInt(ptNode.textContent || &#x27;0&#x27;);
            }
          });
        } catch (e) {
          // Ignore batch error
        }
      }));
    }
    
    loadingStatus.classList.add(&#x27;hidden&#x27;);
    document.getElementById(&#x27;modalCount&#x27;).textContent = missingGames.length;
    document.getElementById(&#x27;modalTitle&#x27;).textContent = &#x27;Games Not on BGA&#x27;;
    stats.classList.remove(&#x27;hidden&#x27;);
    collectionFilter = &#x27;missing&#x27;;
    sortModalGames();
    
  } catch (e) {
    console.error(e);
    content.innerHTML = `
      &lt;div class=&quot;text-center text-red-500 p-10 font-bold&quot;&gt;
        Error fetching collection. &lt;br&gt;Please check username and try again.&lt;br&gt;
        &lt;div class=&quot;text-xs font-normal mt-2 text-slate-400&quot;&gt;${e.message}&lt;/div&gt;
      &lt;/div&gt;
    `;
  }
}

function setModalFilter(filter) {
  collectionFilter = filter;
  document.getElementById(&#x27;filterMissingBtn&#x27;).className = filter === &#x27;missing&#x27;

  document.getElementById(&#x27;filterOnBgaBtn&#x27;).className = filter === &#x27;onbga&#x27;

function sortModalGames() {
  const gamesToSort = collectionFilter === &#x27;missing&#x27; ? missingGames : onBgaGames;
  const sort = document.getElementById(&#x27;modalSort&#x27;).value;
  if (sort === &#x27;rating&#x27;) {
    gamesToSort.sort((a, b) =&gt; b.rating - a.rating);
  } else if (sort === &#x27;rank&#x27;) {
    gamesToSort.sort((a, b) =&gt; a.rank - b.rank);
  } else if (sort === &#x27;alpha&#x27;) {
    gamesToSort.sort((a, b) =&gt; a.name.localeCompare(b.name));
  } else if (sort === &#x27;weight-desc&#x27;) {
    gamesToSort.sort((a, b) =&gt; (b.averageweight ?? -1) - (a.averageweight ?? -1));
  } else if (sort === &#x27;weight-asc&#x27;) {
    gamesToSort.sort((a, b) =&gt; (a.averageweight ?? 999) - (b.averageweight ?? 999));
  } else if (sort === &#x27;playtime-asc&#x27;) {
    gamesToSort.sort((a, b) =&gt; (a.playingtime ?? 99999) - (b.playingtime ?? 99999));
  } else if (sort === &#x27;playtime-desc&#x27;) {
    gamesToSort.sort((a, b) =&gt; (b.playingtime ?? -1) - (a.playingtime ?? -1));
  }
  renderModalGames();
}

function renderModalGames() {
  const content = document.getElementById(&#x27;modalContent&#x27;);

    return;
  }

    // Proxy image if thumb is http

    if (thumbSrc &amp;&amp; !thumbSrc.startsWith(&#x27;https&#x27;)) {
        thumbSrc = `/api/image-proxy?url=${encodeURIComponent(thumbSrc)}`;
    }
    
    div.innerHTML = `
      &lt;img src=&quot;${thumbSrc}&quot; class=&quot;w-16 h-16 rounded bg-slate-100 object-cover flex-shrink-0&quot; onerror=&quot;this.style.display=&#x27;none&#x27;&quot;&gt;
      &lt;div class=&quot;flex-1 min-w-0&quot;&gt;

        &lt;div class=&quot;flex gap-2 text-xs flex-wrap&quot;&gt;
          ${game.rating &gt; 0 ? `&lt;span class=&quot;bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded font-bold border border-amber-200&quot;&gt;⭐ ${game.rating.toFixed(1)}&lt;/span&gt;` : &#x27;&#x27;}

    content.appendChild(div);
  });
}

async function fetchAPI(endpoint, id, queryParams = &#x27;&#x27;) {
  let url;
  if (endpoint === &#x27;collection&#x27;) {
    url = `/api/bgg-helper?endpoint=${endpoint}&amp;username=${encodeURIComponent(id)}${queryParams}`;
  } else if (endpoint === &#x27;geeklist&#x27;) {
    url = `/api/bgg-helper?endpoint=${endpoint}&amp;id=${encodeURIComponent(id)}${queryParams}`;
  } else {
    url = `/api/bgg-helper?endpoint=${endpoint}&amp;id=${encodeURIComponent(id)}${queryParams}`;
  }
  
  for (let attempt = 0; attempt &lt; 5; attempt++) {
    let res;
    try {
      res = await fetch(url);
    } catch (e) {
      await wait(1500 * Math.pow(2, attempt));
      continue;
    }
    if (res.status === 202) {
      await wait(3000);
      continue;
    }
    if (res.ok) {
      return await res.text();
    }
    await wait(2000);
  }
  throw new Error(&#x27;Failed to fetch from BGG API&#x27;);
}

function wait(ms) {
  return new Promise(r =&gt; setTimeout(r, ms));
}
