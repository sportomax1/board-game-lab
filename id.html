<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Thing ID Lookup</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
    .card { transition: all 0.2s ease; }
    .card:hover{ transform: translateY(-2px); box-shadow: 0 8px 16px rgba(0,0,0,0.1);}
  </style>
</head>
<body class="pb-20">
  <!-- Password Screen -->
  <div id="passwordScreen" class="fixed inset-0 bg-gradient-to-br from-indigo-500 to-purple-600 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
      <h1 class="text-2xl font-bold text-gray-900 mb-2 text-center">🆔 Thing ID Lookup</h1>
      <p class="text-sm text-gray-600 text-center mb-6">Batch BGG thing ID retrieval & analysis</p>
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
        <input type="password" id="appPassword" class="w-full border border-gray-300 rounded-lg px-4 py-3 text-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none" placeholder="Enter password">
      </div>
      <div id="passwordError" class="text-red-600 text-sm mb-4 text-center hidden font-medium"></div>
      <button onclick="unlockApp()" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold text-lg hover:bg-indigo-700 transition-all">
        Enter App
      </button>
    </div>
  </div>

  <header class="sticky top-0 z-30 w-full bg-white/80 backdrop-blur-md border-b px-4 py-3 shadow-sm">
    <div class="max-w-4xl mx-auto flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 text-white p-2 rounded-lg">
          <i class="fa-solid fa-hashtag"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">Thing ID Lookup</h1>
          <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">BGG API • 20/batch • 100x parallel</p>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="openHistoryModal()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg transition-all text-xs font-medium flex items-center gap-1.5">
          <i class="fa-solid fa-clock-rotate-left"></i> History
        </button>
        <button onclick="openYearModal()" id="yearBtn" class="hidden px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg transition-all text-xs font-medium flex items-center gap-1.5">
          <i class="fa-solid fa-chart-column"></i> Years
        </button>
        <div id="controlsSection" class="hidden flex items-center gap-3">
          <select id="sortSelect" onchange="onSort()" class="px-3 py-1.5 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none bg-white font-medium text-xs">
            <option value="original">Original</option>
            <option value="alpha">A→Z</option>
            <option value="year">Year</option>
            <option value="id">ID</option>
          </select>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="hideNoResults" onchange="onSort()" class="w-4 h-4 text-indigo-600 rounded">
            <span class="text-xs font-medium text-slate-600">Hide blanks</span>
          </label>
        </div>
        <div id="statsBox" class="text-right hidden">
          <div class="text-2xl font-bold text-indigo-600" id="resultCount">0</div>
          <div class="text-[10px] text-slate-500 uppercase font-bold">Results</div>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6">
    
    <!-- Input Section -->
    <div id="inputSection" class="bg-white rounded-xl shadow-sm border border-slate-100 p-4">
      <div class="flex gap-3">
        <input 
          id="idInput" 
          type="text" 
          placeholder="Enter: 50 (1-50) or 12345,67890 (specific IDs)" 
          class="flex-1 px-4 py-2.5 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-sm"
          onkeypress="if(event.key==='Enter') onRun()"
        >
        <div class="flex items-center gap-2 px-3 border border-slate-200 rounded-lg bg-slate-50">
          <label class="text-xs font-medium text-slate-600 whitespace-nowrap">Parallel:</label>
          <input 
            id="parallelInput" 
            type="number" 
            value="100" 
            min="1" 
            max="500" 
            class="w-16 px-2 py-1 text-sm border-0 bg-transparent outline-none font-mono"
          >
          <span class="text-xs text-slate-400">x</span>
        </div>
        <button 
          onclick="onRun()" 
          id="runBtn"
          class="px-6 bg-indigo-600 text-white py-2.5 rounded-lg font-bold hover:bg-indigo-700 flex items-center gap-2 transition-all text-sm"
        >
          <i class="fa-solid fa-play"></i> Fetch
        </button>
        <button 
          onclick="onClear()" 
          id="clearBtn"
          class="px-4 bg-slate-100 text-slate-700 py-2.5 rounded-lg font-bold hover:bg-slate-200 transition-all text-sm"
        >
          Clear
        </button>
      </div>
    </div>

    <!-- Loading Section -->
    <div id="loadingSection" class="hidden">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
        <div class="flex items-center justify-center gap-3 mb-4">
          <i class="fa-solid fa-circle-notch fa-spin text-indigo-600 text-2xl"></i>
          <span class="font-bold text-slate-700" id="loadingStatus">Processing...</span>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-4 text-center">
          <div>
            <div class="text-2xl font-bold text-indigo-600" id="metricBatches">0</div>
            <div class="text-xs text-slate-500 uppercase font-bold">Batches</div>
          </div>
          <div>
            <div class="text-2xl font-bold text-emerald-600" id="metricElapsed">0s</div>
            <div class="text-xs text-slate-500 uppercase font-bold">Elapsed</div>
          </div>
          <div>
            <div class="text-2xl font-bold text-purple-600" id="metricRate">0</div>
            <div class="text-xs text-slate-500 uppercase font-bold">IDs/sec</div>
          </div>
          <div>
            <div class="text-2xl font-bold text-slate-600" id="metricETA">--</div>
            <div class="text-xs text-slate-500 uppercase font-bold">ETA</div>
          </div>
        </div>
        <div class="bg-slate-100 rounded-full h-2 overflow-hidden">
          <div id="progressBar" class="bg-indigo-600 h-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- Results Grid -->
    <div id="grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
  </main>

  <!-- History Modal -->
  <div id="historyModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-3xl w-full max-h-[80vh] overflow-hidden flex flex-col">
      <div class="p-4 border-b flex items-center justify-between bg-slate-50">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-clock-rotate-left text-indigo-600"></i>
          <h3 class="font-bold text-lg">Session History</h3>
        </div>
        <button onclick="closeHistoryModal()" class="text-slate-400 hover:text-slate-600 text-xl">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div id="historyContent" class="p-4 overflow-y-auto flex-1">
        <p class="text-slate-400 text-center py-8">No runs yet this session</p>
      </div>
    </div>
  </div>

  <!-- Year Distribution Modal -->
  <div id="yearModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[80vh] overflow-hidden flex flex-col">
      <div class="p-4 border-b flex items-center justify-between bg-slate-50">
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-chart-column text-indigo-600"></i>
          <h3 class="font-bold text-lg">Year Distribution</h3>
          <select id="yearSort" onchange="updateYearStats()" class="px-2 py-1 rounded border text-sm">
            <option value="asc">Oldest→Newest</option>
            <option value="desc">Newest→Oldest</option>
          </select>
        </div>
        <button onclick="closeYearModal()" class="text-slate-400 hover:text-slate-600 text-xl">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div id="yearContent" class="p-4 overflow-y-auto flex-1">
        <p class="text-slate-400 text-center py-8">No year data available</p>
      </div>
    </div>
  </div>

<script>
const API_BASE = '/api/bgg-helper';
const BATCH_SIZE = 20;
const MAX_RETRIES = 5;

// Password unlock
window.unlockApp = async () => {
  const password = document.getElementById('appPassword').value;
  const errEl = document.getElementById('passwordError');
  
  if (!password) {
    errEl.textContent = 'Password required';
    errEl.classList.remove('hidden');
    return;
  }
  
  try {
    // Try to validate password by making a simple API call
    const resp = await fetch('/api/supabase-config');
    if (!resp.ok) throw new Error('Config unavailable');
    
    // If we got here, allow access (this is a simplified check)
    // In production, you'd validate the password server-side
    document.getElementById('passwordScreen').classList.add('hidden');
  } catch (e) {
    errEl.textContent = 'Access check failed: ' + e.message;
    errEl.classList.remove('hidden');
  }
};

// Allow Enter key to submit password
document.addEventListener('DOMContentLoaded', () => {
  const pwInput = document.getElementById('appPassword');
  if (pwInput) {
    pwInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') window.unlockApp();
    });
  }
});

const runBtn = document.getElementById('runBtn');
const clearBtn = document.getElementById('clearBtn');
const idInput = document.getElementById('idInput');
const grid = document.getElementById('grid');
const loadingSection = document.getElementById('loadingSection');
const inputSection = document.getElementById('inputSection');
const controlsSection = document.getElementById('controlsSection');
const statsBox = document.getElementById('statsBox');
const loadingStatus = document.getElementById('loadingStatus');
const progressBar = document.getElementById('progressBar');
const sortSelect = document.getElementById('sortSelect');
const hideNoResults = document.getElementById('hideNoResults');
const parallelInput = document.getElementById('parallelInput');
const metricBatches = document.getElementById('metricBatches');
const metricElapsed = document.getElementById('metricElapsed');
const metricRate = document.getElementById('metricRate');
const metricETA = document.getElementById('metricETA');
const yearBtn = document.getElementById('yearBtn');

// Session history
const runHistory = [];

function parseIds(text){
  if(!text) return [];
  const t = text.trim();
  // If single integer provided (no separators), generate range 1..N
  if (/^\d+$/.test(t)){
    const n = parseInt(t,10);
    if (n <= 0) return [];
    const arr = [];
    for (let i=1;i<=n;i++) arr.push(String(i));
    return arr;
  }
  // Otherwise parse as comma/space/newline separated IDs
  return Array.from(new Set(text.split(/[,\n\s]+/).map(s=>s.trim()).filter(Boolean))).filter(x=>/^\d+$/.test(x));
}

async function onRun(){
  const raw = idInput.value;
  let ids = parseIds(raw);
  
  if (ids.length === 0){ 
    alert('Please enter a valid number or list of IDs');
    return; 
  }

  // Show loading
  inputSection.classList.add('hidden');
  loadingSection.classList.remove('hidden');
  controlsSection.classList.add('hidden');
  statsBox.classList.add('hidden');
  grid.innerHTML = '';
  loadingStatus.textContent = `Processing ${ids.length} IDs...`;
  progressBar.style.width = '0%';

  const results = await fetchAllThingIds(ids);
  window._lastResults = { ids, map: results };
  
  // Show results
  loadingSection.classList.add('hidden');
  inputSection.classList.remove('hidden');
  controlsSection.classList.remove('hidden');
  statsBox.classList.remove('hidden');
  yearBtn.classList.remove('hidden');
  
  const foundCount = [...results.values()].filter(v=>v).length;
  document.getElementById('resultCount').textContent = foundCount;
  
  renderCards({ ids, map: results });
}

function onClear(){
  idInput.value = '';
  grid.innerHTML = '';
  controlsSection.classList.add('hidden');
  statsBox.classList.add('hidden');
  window._lastResults = null;
}

function onSort(){
  if(window._lastResults) renderCards(window._lastResults);
}

async function fetchWithRetry(url, attempt=1){
  try{
    const res = await fetch(url);
    if (res.status === 202){
      await new Promise(r=>setTimeout(r, 2000 * attempt));
      if (attempt < MAX_RETRIES) return fetchWithRetry(url, attempt+1);
      throw new Error('Accepted but not ready after retries');
    }
    if (!res.ok){
      if (attempt < MAX_RETRIES){
        await new Promise(r=>setTimeout(r, 500 * Math.pow(2, attempt)));
        return fetchWithRetry(url, attempt+1);
      }
      throw new Error('HTTP ' + res.status);
    }
    return await res.text();
  } catch (e){
    if (attempt < MAX_RETRIES){
      await new Promise(r=>setTimeout(r, 500 * Math.pow(2, attempt)));
      return fetchWithRetry(url, attempt+1);
    }
    throw e;
  }
}

async function fetchAllThingIds(ids){
  const PARALLEL_BATCHES = parseInt(parallelInput.value) || 100;
  const batches = [];
  for (let i = 0; i < ids.length; i += BATCH_SIZE) batches.push(ids.slice(i, i + BATCH_SIZE));

  const resultsMap = new Map();
  ids.forEach(id => resultsMap.set(id, null));
  
  const startTime = Date.now();
  let completedBatches = 0;
  let processedIds = 0;

  for (let i = 0; i < batches.length; i += PARALLEL_BATCHES){
    const group = batches.slice(i, i + PARALLEL_BATCHES);
    const progress = Math.min(100, ((i + group.length) / batches.length) * 100);
    progressBar.style.width = progress + '%';
    
    const elapsedSec = ((Date.now() - startTime) / 1000).toFixed(1);
    const rate = processedIds > 0 ? Math.round(processedIds / (elapsedSec || 1)) : 0;
    const remaining = ids.length - processedIds;
    const etaSec = rate > 0 ? Math.round(remaining / rate) : 0;
    
    metricBatches.textContent = `${i + group.length}/${batches.length}`;
    metricElapsed.textContent = `${elapsedSec}s`;
    metricRate.textContent = rate;
    metricETA.textContent = etaSec > 0 ? `${etaSec}s` : '--';
    loadingStatus.textContent = `Fetching batches ${i + 1}-${Math.min(i + group.length, batches.length)} of ${batches.length} (${PARALLEL_BATCHES}x parallel)...`;
    
    await Promise.all(group.map(async batch => {
      const idsParam = batch.join(',');
      try{
        const url = `${API_BASE}?endpoint=thing&id=${encodeURIComponent(idsParam)}&stats=1`;
        const txt = await fetchWithRetry(url);
        const doc = new DOMParser().parseFromString(txt, 'text/xml');
        const items = Array.from(doc.querySelectorAll('item'));
        items.forEach(it => {
          const id = it.getAttribute('id');
          const name = it.querySelector('name[type="primary"]')?.getAttribute('value') || it.querySelector('name')?.textContent || '';
          const thumb = it.querySelector('thumbnail')?.textContent || '';
          const year = it.querySelector('yearpublished')?.getAttribute('value') || it.querySelector('yearpublished')?.textContent || '';
          resultsMap.set(id, { id, name, thumbnail: thumb, yearpublished: year });
        });
        processedIds += batch.length;
      } catch (e){
        console.warn('Batch fetch failed', batch, e);
      }
    }));
    
    completedBatches += group.length;
    if (i + PARALLEL_BATCHES < batches.length) await new Promise(r=>setTimeout(r, 500));
  }
  
  const totalTime = ((Date.now() - startTime) / 1000).toFixed(1);
  const finalRate = Math.round(ids.length / totalTime);
  metricBatches.textContent = `${batches.length}/${batches.length}`;
  metricElapsed.textContent = `${totalTime}s`;
  metricRate.textContent = finalRate;
  metricETA.textContent = 'Done';

  progressBar.style.width = '100%';
  
  // Save to history
  const foundCount = [...resultsMap.values()].filter(v=>v).length;
  runHistory.push({
    timestamp: new Date(),
    idsRequested: ids.length,
    idsFound: foundCount,
    batches: batches.length,
    batchSize: BATCH_SIZE,
    parallel: PARALLEL_BATCHES,
    elapsed: parseFloat(totalTime),
    rate: finalRate
  });
  
  return resultsMap;
}

function renderCards({ids, map}){
  const entries = ids.map(id => ({ id, data: map.get(id) }));
  const sort = sortSelect.value;
  const hideBlank = hideNoResults.checked;

  let sorted = entries.slice();
  
  // Filter out no-results if toggle is checked
  if (hideBlank) {
    sorted = sorted.filter(e => e.data !== null);
  }
  
  if (sort === 'alpha') sorted.sort((a,b)=>( (a.data?.name||'').toLowerCase().localeCompare((b.data?.name||'').toLowerCase()) ));
  else if (sort === 'year') sorted.sort((a,b)=>( (parseInt(a.data?.yearpublished)||0) - (parseInt(b.data?.yearpublished)||0) ));
  else if (sort === 'id') sorted.sort((a,b)=> parseInt(a.id) - parseInt(b.id));

  grid.innerHTML = '';
  sorted.forEach(entry => {
    const card = document.createElement('div');
    card.className = 'card bg-white border border-slate-200 rounded-xl p-3 flex flex-col gap-2';
    
    if (entry.data){
      const thumb = entry.data.thumbnail 
        ? `<img src="${entry.data.thumbnail}" class="w-full h-32 object-cover rounded-lg">`
        : `<div class="w-full h-32 bg-slate-100 rounded-lg flex items-center justify-center text-slate-300"><i class="fa-solid fa-image text-2xl"></i></div>`;
      
      card.innerHTML = `
        ${thumb}
        <div class="flex-1">
          <div class="font-semibold text-sm line-clamp-2 text-slate-800">${escapeHtml(entry.data.name || 'Unknown')}</div>
          <div class="text-xs text-slate-500 mt-1 flex items-center justify-between">
            <span><i class="fa-solid fa-calendar"></i> ${entry.data.yearpublished || '—'}</span>
            <span class="font-mono text-slate-400">#${entry.data.id}</span>
          </div>
        </div>`;
    } else {
      card.innerHTML = `
        <div class="w-full h-32 bg-slate-50 rounded-lg flex items-center justify-center text-slate-300 border-2 border-dashed border-slate-200">
          <i class="fa-solid fa-question text-3xl"></i>
        </div>
        <div class="flex-1">
          <div class="font-semibold text-sm text-slate-400">ID ${entry.id}</div>
          <div class="text-xs text-slate-400 mt-1">No result found</div>
        </div>`;
    }
    
    grid.appendChild(card);
  });
}

function escapeHtml(s){ 
  return (s+'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c] || c); 
}

// History Modal
function openHistoryModal() {
  const modal = document.getElementById('historyModal');
  const content = document.getElementById('historyContent');
  
  if (runHistory.length === 0) {
    content.innerHTML = '<p class="text-slate-400 text-center py-8">No runs yet this session</p>';
  } else {
    let html = '<div class="space-y-3">';
    runHistory.forEach((run, idx) => {
      const time = run.timestamp.toLocaleTimeString();
      const percent = ((run.idsFound / run.idsRequested) * 100).toFixed(1);
      html += `
        <div class="bg-slate-50 border border-slate-200 rounded-lg p-3">
          <div class="flex items-start justify-between mb-2">
            <div class="font-bold text-slate-700">Run #${idx + 1}</div>
            <div class="text-xs text-slate-500">${time}</div>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm">
            <div>
              <div class="text-xs text-slate-500 uppercase font-bold">IDs Requested</div>
              <div class="font-bold text-indigo-600">${run.idsRequested.toLocaleString()}</div>
            </div>
            <div>
              <div class="text-xs text-slate-500 uppercase font-bold">Found</div>
              <div class="font-bold text-emerald-600">${run.idsFound.toLocaleString()} <span class="text-xs text-slate-400">(${percent}%)</span></div>
            </div>
            <div>
              <div class="text-xs text-slate-500 uppercase font-bold">Time</div>
              <div class="font-bold text-purple-600">${run.elapsed}s <span class="text-xs text-slate-400">(${run.rate} IDs/s)</span></div>
            </div>
            <div>
              <div class="text-xs text-slate-500 uppercase font-bold">Config</div>
              <div class="font-mono text-xs text-slate-600">${run.batches}×${run.batchSize} @ ${run.parallel}x</div>
            </div>
          </div>
        </div>
      `;
    });
    html += '</div>';
    content.innerHTML = html;
  }
  
  modal.classList.remove('hidden');
}

function closeHistoryModal() {
  document.getElementById('historyModal').classList.add('hidden');
}

// Year Distribution Modal
function openYearModal() {
  updateYearStats();
  document.getElementById('yearModal').classList.remove('hidden');
}

function closeYearModal() {
  document.getElementById('yearModal').classList.add('hidden');
}

function updateYearStats() {
  const content = document.getElementById('yearContent');
  const sortOrder = document.getElementById('yearSort').value;
  
  if (!window._lastResults) {
    content.innerHTML = '<p class="text-slate-400 text-center py-8">No data available</p>';
    return;
  }
  
  const yearCounts = new Map();
  let unknownCount = 0;
  
  for (const [id, data] of window._lastResults.map) {
    if (data && data.yearpublished) {
      const year = data.yearpublished;
      yearCounts.set(year, (yearCounts.get(year) || 0) + 1);
    } else if (data) {
      unknownCount++;
    }
  }
  
  const years = Array.from(yearCounts.entries()).sort((a, b) => {
    if (sortOrder === 'asc') return parseInt(a[0]) - parseInt(b[0]);
    return parseInt(b[0]) - parseInt(a[0]);
  });
  
  if (years.length === 0 && unknownCount === 0) {
    content.innerHTML = '<p class="text-slate-400 text-center py-8">No year data available</p>';
    return;
  }
  
  const maxCount = Math.max(...years.map(y => y[1]), unknownCount);
  
  let html = '<div class="space-y-2">';
  
  years.forEach(([year, count]) => {
    const barWidth = (count / maxCount * 100).toFixed(1);
    html += `
      <div class="flex items-center gap-3">
        <div class="w-16 text-sm font-mono font-bold text-slate-700 text-right">${year}</div>
        <div class="flex-1 bg-slate-100 rounded-full h-6 overflow-hidden relative">
          <div class="bg-indigo-500 h-full transition-all" style="width: ${barWidth}%"></div>
          <div class="absolute inset-0 flex items-center justify-end px-2">
            <span class="text-xs font-bold text-slate-700">${count}</span>
          </div>
        </div>
      </div>
    `;
  });
  
  if (unknownCount > 0) {
    const barWidth = (unknownCount / maxCount * 100).toFixed(1);
    html += `
      <div class="flex items-center gap-3">
        <div class="w-16 text-sm font-mono font-bold text-slate-400 text-right">Unknown</div>
        <div class="flex-1 bg-slate-100 rounded-full h-6 overflow-hidden relative">
          <div class="bg-slate-300 h-full transition-all" style="width: ${barWidth}%"></div>
          <div class="absolute inset-0 flex items-center justify-end px-2">
            <span class="text-xs font-bold text-slate-600">${unknownCount}</span>
          </div>
        </div>
      </div>
    `;
  }
  
  html += '</div>';
  html += `<div class="mt-4 text-center text-sm text-slate-500">
    Total: ${years.reduce((sum, y) => sum + y[1], 0) + unknownCount} games across ${years.length} years
  </div>`;
  
  content.innerHTML = html;
}

// Close modals on outside click
document.getElementById('historyModal').addEventListener('click', (e) => {
  if (e.target.id === 'historyModal') closeHistoryModal();
});

document.getElementById('yearModal').addEventListener('click', (e) => {
  if (e.target.id === 'yearModal') closeYearModal();
});
</script>
</body>
</html>
