name: One-time BGG contacts desktop access gate fix
on:
  push:
    paths:
      - '.github/workflows/mobile-bgg-contacts-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch desktop access gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('bgg-contacts.html')
          s = p.read_text()

          old_css = '.modal,.gate{position:fixed;inset:0;background:#020814dd;display:none;align-items:center;justify-content:center;padding:14px;z-index:20}'
          new_css = '.modal,.gate{position:fixed;inset:0;background:#020814dd;display:none;align-items:center;justify-content:center;padding:14px;z-index:20}.gate{z-index:2147483647!important;pointer-events:auto!important;isolation:isolate}.gate .box{position:relative;z-index:1;pointer-events:auto!important}.gate input,.gate button{position:relative;z-index:2;pointer-events:auto!important;user-select:text}.gate input{touch-action:manipulation}'
          if old_css not in s:
              raise SystemExit('Expected gate CSS not found')
          s = s.replace(old_css, new_css, 1)

          old_js = "window.addEventListener('DOMContentLoaded',()=>{let h=localStorage.getItem('app_password_hint');if(h)$('pw').value=h;loadCache()});"
          new_js = "window.addEventListener('DOMContentLoaded',()=>{let h=localStorage.getItem('app_password_hint');if(h)$('pw').value=h;const gate=$('gate'),pw=$('pw');if(gate&&!gate.classList.contains('hidden')){document.querySelector('main.app')?.setAttribute('inert','');requestAnimationFrame(()=>{pw?.focus({preventScroll:true})})}loadCache()});"
          if old_js not in s:
              raise SystemExit('Expected DOMContentLoaded code not found')
          s = s.replace(old_js, new_js, 1)

          old_unlock = "localStorage.setItem('app_password_hint',p);$('gate').classList.add('hidden');await Promise.all([loadCache(),loadContacts(),loadPipeline()])"
          new_unlock = "localStorage.setItem('app_password_hint',p);$('gate').classList.add('hidden');document.querySelector('main.app')?.removeAttribute('inert');await Promise.all([loadCache(),loadContacts(),loadPipeline()])"
          if old_unlock not in s:
              raise SystemExit('Expected unlock code not found')
          s = s.replace(old_unlock, new_unlock, 1)

          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bgg-contacts.html
          git commit -m 'Fix desktop BGG contacts access key interaction'
          git push
