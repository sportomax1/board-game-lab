name: One-time BGG contacts mobile layout fix
on:
  push:
    paths:
      - '.github/workflows/mobile-bgg-contacts-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('bgg-contacts.html')
          s=p.read_text()
          old='@media(max-width:600px){.games,.contacts{grid-template-columns:1fr}.editGrid{grid-template-columns:1fr}.full{grid-column:auto}}'
          new='@media(max-width:800px){body{overflow-x:hidden}.app{width:100%;max-width:100%;padding:10px}.panel{width:100%;max-width:100%}.load{grid-template-columns:minmax(0,1fr) auto}.load input{min-width:0}.games,.contacts{display:flex;flex-direction:column;width:100%;gap:8px}.game{width:100%;max-width:100%;grid-template-columns:64px minmax(0,1fr)}.game>div{min-width:0}.thumb{width:64px;height:82px}.line{max-width:100%}.filters{width:100%}.editGrid{grid-template-columns:1fr}.full{grid-column:auto}}'
          if old not in s:
              raise SystemExit('Expected mobile CSS not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bgg-contacts.html
          git commit -m 'Fix BGG contacts mobile card layout'
          git push
