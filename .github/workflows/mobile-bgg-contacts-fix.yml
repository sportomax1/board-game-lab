name: One-time BGG contacts plain access input fix
on:
  push:
    paths:
      - '.github/workflows/mobile-bgg-contacts-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace access gate with plain form
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('bgg-contacts.html')
          s = p.read_text()

          s = s.replace('id="pw" style="width:100%" type="password" placeholder="Access Key"',
                        'id="pw" style="width:100%;display:block;position:relative;pointer-events:auto;user-select:text" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Access Key"')

          s = s.replace("document.querySelector('main.app')?.setAttribute('inert','');", '')
          s = s.replace("document.querySelector('main.app')?.removeAttribute('inert');", '')
          s = s.replace("requestAnimationFrame(()=>{pw?.focus({preventScroll:true})})", '')
          s = s.replace("requestAnimationFrame(()=>$('pw')?.focus());", '')

          marker = '</style>'
          css = '''<style id="plain-access-fix">#gate{position:relative!important;inset:auto!important;display:block!important;max-width:520px!important;margin:48px auto 0!important;padding:14px!important;background:transparent!important;z-index:auto!important;pointer-events:auto!important;isolation:auto!important}#gate.hidden{display:none!important}#gate .box{position:static!important;width:100%!important;height:auto!important;max-height:none!important;overflow:visible!important;pointer-events:auto!important;transform:none!important;animation:none!important}#gate #pw{display:block!important;width:100%!important;position:relative!important;z-index:1!important;pointer-events:auto!important;user-select:text!important;-webkit-user-select:text!important;opacity:1!important;visibility:visible!important}#gate #unlock{display:block!important;width:100%!important;position:relative!important;z-index:1!important;pointer-events:auto!important}#dashboardApp.hidden{display:none!important}</style>'''
          if 'id="plain-access-fix"' not in s:
              s = s.replace(marker, marker + css, 1)

          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bgg-contacts.html
          git commit -m 'Make BGG contacts access key plain desktop input'
          git push
