name: One-time BGG contacts native prompt fallback
on:
  push:
    paths:
      - '.github/workflows/mobile-bgg-contacts-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add native access prompt fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('bgg-contacts.html')
          s = p.read_text()

          # Keep the visible field, but make the unlock path work even if the
          # desktop browser refuses to focus/type into that field.
          old = "$('unlock').onclick=async()=>{let p=$('pw').value,c=await fetch('/api/get-password').then(r=>r.text());"
          new = "$('unlock').onclick=async()=>{let p=$('pw').value;if(!p)p=window.prompt('Enter Access Key')||'';let c=await fetch('/api/get-password').then(r=>r.text());"
          if old in s:
              s = s.replace(old, new, 1)
          elif "window.prompt('Enter Access Key')" not in s:
              raise SystemExit('Unlock handler anchor not found')

          # Add an explicit native-prompt button below the field so desktop
          # access never depends on HTML input focus.
          old_btn = '<button id="unlock" class="btn primary" style="width:100%;margin-top:8px">Unlock Dashboard</button>'
          new_btn = '<button id="unlock" class="btn primary" style="width:100%;margin-top:8px">Unlock Dashboard</button><button id="promptUnlock" class="btn" style="width:100%;margin-top:8px">Enter Key in Browser Prompt</button>'
          if old_btn in s:
              s = s.replace(old_btn, new_btn, 1)

          # Wire the fallback button after the existing keydown handler.
          anchor = "$('pw').onkeydown=x=>x.key==='Enter'&&$('unlock').click()"
          extra = "$('pw').onkeydown=x=>x.key==='Enter'&&$('unlock').click();if($('promptUnlock'))$('promptUnlock').onclick=()=>{let v=window.prompt('Enter Access Key');if(v!==null){$('pw').value=v;$('unlock').click()}}"
          if anchor in s:
              s = s.replace(anchor, extra, 1)
          elif "promptUnlock" not in s:
              raise SystemExit('Keydown anchor not found')

          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bgg-contacts.html
          git commit -m 'Add native access-key prompt fallback'
          git push
