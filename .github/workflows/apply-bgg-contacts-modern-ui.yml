name: Apply BGG Contacts Modern UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-bgg-contacts-modern-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply frontend shell
        run: python scripts/apply_bgg_contacts_modern_ui.py

      - name: Verify HTML hooks and JS syntax
        run: |
          grep -q 'bgg-contacts-modern.css?v=20260901v3' bgg-contacts.html
          grep -q 'bgg-contacts-modern.js?v=20260901v3' bgg-contacts.html
          grep -q 'data-srcdoc=' bgg-contacts.html
          node --check assets/bgg-contacts-modern.js
          git diff --check

      - name: Commit redesigned app
        run: |
          if git diff --quiet -- bgg-contacts.html; then
            echo 'No HTML changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bgg-contacts.html
          git commit -m 'Redesign BGG contacts frontend'
          git push origin main
