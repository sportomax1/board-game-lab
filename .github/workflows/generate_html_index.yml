name: Generate HTML Index

permissions:
  contents: write

# New files are indexed immediately. Existing files get at most one rebuild
# each Denver calendar day, irrespective of rapid edits to the same app.
on:
  push:
    branches:
      - main

  # A safety check, not an unconditional index rebuild.
  schedule:
    - cron: '0 6 * * *'
      timezone: 'America/Denver'

  workflow_dispatch:

concurrency:
  group: board-game-lab-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for last index commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test index rebuild policy
        run: python -m unittest discover -s .github/scripts -p 'test_index_rebuild_gate.py' -v

      - name: Decide whether index needs updating
        id: index_gate
        env:
          INDEX_EVENT: ${{ github.event_name }}
        run: python .github/scripts/index_rebuild_gate.py

      - name: Set up Python
        if: steps.index_gate.outputs.rebuild == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate app directory
        if: steps.index_gate.outputs.rebuild == 'true'
        run: python generate_index.py

      - name: Commit only when index changed
        if: steps.index_gate.outputs.rebuild == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to index.html; no commit."
          else
            git commit -m "🤖 CI: Recreate index.html index"
            git push origin HEAD:main
          fi
