name: Generate HTML Index

# Ensure the workflow token has write access globally
permissions:
  contents: write

# Runs daily at 6 AM, 10 AM, 2 PM, 6 PM, and 10 PM Mountain Time,
# or manually from GitHub Actions.
on:
  schedule:
    - cron: '0 6,10,14,18,22 * * *'
      timezone: 'America/Denver'

  # Uncomment this if you ALSO want it to run whenever main is updated:
  # push:
  #   branches:
  #     - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    # Fetch the complete Git history.
    # This ensures 'git log' can find the last commit time for all files.
    - name: Checkout repository (Full History)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: python -m pip install --upgrade pip

    # Generate index.html
    - name: Run HTML index generation script
      run: python generate_index.py

    # Commit and push index.html if it changed
    - name: Commit and Push index.html
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git add index.html

        if git diff --cached --quiet; then
          echo "No changes to index.html. Nothing to commit."
        else
          git commit -m "🤖 CI: Recreate index.html index"
          git push
        fi
