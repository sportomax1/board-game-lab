name: One-time BGG contacts tri-state filters
on:
  push:
    paths:
      - '.github/workflows/bgg-contact-tristate-filters.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch filters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('bgg-contacts.html')
          s=p.read_text()
          s=s.replace('.chip.on{background:#30275d}', '.chip.yes{background:#176b45;border-color:#39d98a;color:#fff}.chip.no{background:#6b2634;border-color:#ff718b;color:#fff}')
          s=s.replace("sts.forEach(x=>sf[x]=false)", "sts.forEach(x=>sf[x]='any')")
          old="let q=$('search').value.toLowerCase(),on=sts.filter(x=>sf[x]),a=games.filter(g=>(!on.length||on.some(x=>g.status[x]))&&(!q||[g.title,...people(g).map(x=>x.name)].join(' ').toLowerCase().includes(q)))"
          new="let q=$('search').value.toLowerCase(),a=games.filter(g=>sts.every(x=>sf[x]==='any'||(sf[x]==='yes'&&!!g.status[x])||(sf[x]==='no'&&!g.status[x]))&&(!q||[g.title,...people(g).map(x=>x.name)].join(' ').toLowerCase().includes(q)))"
          if old not in s: raise SystemExit('render pattern not found')
          s=s.replace(old,new)
          old2="document.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>{sf[x.dataset.s]=!sf[x.dataset.s];x.classList.toggle('on');render()})"
          new2="document.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>{let k=x.dataset.s;sf[k]=sf[k]==='any'?'yes':sf[k]==='yes'?'no':'any';x.classList.toggle('yes',sf[k]==='yes');x.classList.toggle('no',sf[k]==='no');x.title=sf[k]==='yes'?'Yes':sf[k]==='no'?'No':'Any';render()})"
          if old2 not in s: raise SystemExit('click pattern not found')
          s=s.replace(old2,new2)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add bgg-contacts.html
          git commit -m 'Make collection status filters tri-state' || exit 0
          git push
