c-size:62px;display:grid!important;grid-template-columns:40px minmax(0,1fr)!important;gap:7px!important;padding:6px!important;border-radius:8px!important;min-width:0}.peopleLayoutV7 .drawerGame img{width:40px!important;height:54px!important;border-radius:5px!important}.peopleLayoutV7 .drawerGame b{font-size:10px!important;line-height:1.25!important}.peopleLayoutV7 .drawerGame small{font-size:8px!important;line-height:1.3!important}.peopleLayoutV7 .drawerGame.drawerHidden{display:none!important}
