name: Run People Analyzer v7 overhaul

on:
  push:
    branches: [main]
    paths:
      - '.github/people-v7-trigger.txt'

permissions:
  contents: write

jobs:
  overhaul:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v7 rail and inspector layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('people.html')
          s=p.read_text(encoding='utf-8')
          if 'people-layout-v7' in s:
              print('v7 already applied')
              raise SystemExit(0)
          head_marker="    html=html.replace('</head>',uxCss+'</head>');"
          body_marker="    html=html.replace('</body>',uxJs+'</body>');"
          if head_marker not in s or body_marker not in s:
              raise SystemExit('Expected v6 injection markers not found')
          block=r'''
