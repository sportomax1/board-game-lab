@media(max-width:900px){.peopleLayoutV7 .shell{padding:7px!important}.peopleLayoutV7 .top{position:static!important;margin-bottom:6px!important;background:transparent!important;backdrop-filter:none!important}.peopleLayoutV7 .title h1{font-size:23px!important}.peopleLayoutV7 .mobileDataToggle{display:inline-flex!important}.peopleLayoutV7 .appGrid,.peopleLayoutV7 .peopleShell.detail-open .appGrid{grid-template-columns:1fr!important;gap:6px!important}.peopleLayoutV7 .leftRail{position:static!important;max-height:none!important;overflow:visible!important}.peopleLayoutV7 .setup.mobileDataCollapsed{padding:5px 7px!important}.peopleLayoutV7 .setup.mobileDataCollapsed>.grid{display:none!important}.peopleLayoutV7 .resultsStrip{grid-template-columns:1fr!important;gap:5px!important}.peopleLayoutV7 .resultsStrip .summary{grid-template-columns:repeat(4,minmax(0,1fr))!important}.peopleLayoutV7 .metric{display:block!important;text-align:center!important;padding:5px 3px!important}.peopleLayoutV7 .metric small{font-size:7px!important}.peopleLayoutV7 .metric b{font-size:15px!important;margin-top:2px!important}.peopleLayoutV7 .tabs{min-height:34px!important;overflow:auto!important}.peopleLayoutV7 .tab{min-height:34px!important;white-space:nowrap!important}.peopleLayoutV7 .rankHeader{position:sticky!important;top:0!important;grid-template-columns:1fr!important;gap:5px!important;padding:6px!important}.peopleLayoutV7 .rankHeader>.sectionHead{min-width:0!important}.peopleLayoutV7 .rankHeader>.toolbar{grid-template-columns:1fr 1fr!important}.peopleLayoutV7 .rankHeader>.toolbar .search{grid-column:1/-1!important}.peopleLayoutV7 .personMain{grid-template-columns:29px minmax(0,1fr) 55px 15px!important;padding:7px 8px!important;gap:6px!important}.peopleLayoutV7 .covers{display:none!important}.peopleLayoutV7 .insights{grid-template-columns:1fr!important}}
