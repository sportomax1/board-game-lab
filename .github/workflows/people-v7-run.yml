    const layoutJs=`<script>
(function(){
 const byId=id=>document.getElementById(id),root=document.querySelector('main.shell');if(!root)return;document.documentElement.classList.add('peopleLayoutV7');root.classList.add('peopleShell');
 const top=root.querySelector('.top'),setup=root.querySelector('.setup'),setupGrid=top?.querySelector(':scope > .grid')||setup?.querySelector('.grid'),filterPanel=byId('filterPanel')||setup?.nextElementSibling,resultsStrip=root.querySelector('.resultsStrip'),workspace=byId('workspace'),drawerBackdrop=byId('drawerBackdrop');if(!setup||!workspace||!drawerBackdrop)return;
 if(setupGrid&&setupGrid.parentElement!==setup)setup.insertBefore(setupGrid,setup.firstChild);if(filterPanel)filterPanel.id='filterPanel';
 const appGrid=document.createElement('div');appGrid.className='appGrid';const leftRail=document.createElement('aside');leftRail.className='leftRail';const centerStage=document.createElement('section');centerStage.className='centerStage';const anchor=resultsStrip||workspace;anchor.parentNode.insertBefore(appGrid,anchor);appGrid.append(leftRail,centerStage,drawerBackdrop);leftRail.append(setup);if(filterPanel)leftRail.append(filterPanel);if(resultsStrip)centerStage.append(resultsStrip);centerStage.append(workspace);
 const syncDetail=()=>root.classList.toggle('detail-open',drawerBackdrop.classList.contains('open'));new MutationObserver(syncDetail).observe(drawerBackdrop,{attributes:true,attributeFilter:['class']});syncDetail();
 const drawerContent=byId('drawerContent');const enhanceDrawer=()=>{if(!drawerContent)return;const games=drawerContent.querySelector('.drawerGames');if(!games||drawerContent.querySelector('.drawerSearchWrap'))return;const cards=[...games.querySelectorAll('.drawerGame')],wrap=document.createElement('div'),input=document.createElement('input'),count=document.createElement('span');wrap.className='drawerSearchWrap';input.className='drawerSearch';input.type='search';input.placeholder='Search games in this list…';input.setAttribute('aria-label','Search games in detail panel');count.className='drawerSearchCount';count.textContent=cards.length+' games';wrap.append(input,count);games.parentNode.insertBefore(wrap,games);let timer;input.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>{const q=input.value.trim().toLowerCase();let shown=0;cards.forEach(card=>{const match=!q||card.textContent.toLowerCase().includes(q);card.classList.toggle('drawerHidden',!match);if(match)shown++});count.textContent=shown+' / '+cards.length},70)})};if(drawerContent)new MutationObserver(enhanceDrawer).observe(drawerContent,{childList:true});enhanceDrawer();
})();
<\\/script>`;
'''
          s=s.replace(head_marker,block+'\n'+"    html=html.replace('</head>',uxCss+layoutCss+'</head>');",1)
          s=s.replace(body_marker,"    html=html.replace('</body>',uxJs+layoutJs+'</body>');",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit overhaul
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add people.html
          git diff --cached --quiet && exit 0
          git commit -m 'Overhaul People Analyzer into rail and inspector layout'
          git push
