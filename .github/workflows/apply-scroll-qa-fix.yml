name: Apply scroll QA fix
on:
  push:
    branches: [main]
    paths:
      - 'assets/bgg-contacts-scroll-fixes.css'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inject scroll fixes stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bgg-contacts.html')
          s=p.read_text()
          tag='<link rel="stylesheet" href="/assets/bgg-contacts-scroll-fixes.css?v=20260901scroll1">'
          if tag not in s:
              s=s.replace('</head>', tag+'</head>', 1)
              p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bgg-contacts.html
          git diff --cached --quiet || git commit -m "Fix app scrolling and overflow behavior"
          git push
