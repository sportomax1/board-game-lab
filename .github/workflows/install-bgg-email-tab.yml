name: Install BGG Email Tab
on:
  push:
    branches: [main]
    paths:
      - 'scripts/install_bgg_email_tab.py'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/install_bgg_email_tab.py
      - name: Commit generated app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bgg-contacts.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Email tab to BGG Contacts"
          git push
