name: Deploy BGG Fetcher

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Apply validated BGA Plays credits patch
        run: |
          python scripts/patch_bgaplays_credits.py bgaplays.html
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('bgaplays.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/bgaplays.js').write_text(scripts[-1], encoding='utf-8')
          for marker in ['publisherFilter','designerFilter','artistFilter','function buildCreditsRows','function enrichCredits','historyCreditsHtml','bgaplays-credits-v1']:
              if marker not in html:
                  raise SystemExit(f'Missing feature marker: {marker}')
          PY
          node --check /tmp/bgaplays.js
          if ! git diff --quiet -- bgaplays.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bgaplays.html
            git commit -m "feat: add publisher designer artist analytics to BGA Plays"
            git push origin HEAD:main
          fi

      - name: Inject BGG API Token into index.html
        env:
          BGG_SECRET: ${{ secrets.BGG_API_TOKEN }}
        run: |
          if [ -z "$BGG_SECRET" ]; then
            echo "::warning::GitHub Secret 'BGG_API_TOKEN' is not set. Placeholder will remain in index.html."
          else
            sed -i "s|GITHUB_SECRET_PLACEHOLDER_TOKEN|\'$BGG_SECRET\'|g" index.html
            echo "Token successfully injected into index.html."
          fi

      - name: Refresh sportomax BGG collection snapshot
        env:
          BGG_SECRET: ${{ secrets.BGG_API_TOKEN }}
        run: |
          if [ -z "$BGG_SECRET" ]; then
            echo "::warning::BGG_API_TOKEN unavailable; skipping collection snapshot."
            exit 0
          fi

          URL="https://boardgamegeek.com/xmlapi2/collection?username=sportomax"
          SUCCESS=0
          for ATTEMPT in 1 2 3 4 5; do
            HTTP_CODE=$(curl --silent --show-error --location \
              --output /tmp/bgg-collection.xml \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer $BGG_SECRET" \
              --header "Accept: text/xml" \
              --header "User-Agent: BoardGameLab-GitHubPages/1.0" \
              "$URL" || true)

            if [ "$HTTP_CODE" = "200" ] && grep -q '<items' /tmp/bgg-collection.xml; then
              mv /tmp/bgg-collection.xml bgg-collection-sportomax.xml
              echo "BGG collection snapshot refreshed."
              SUCCESS=1
              break
            fi

            echo "BGG collection attempt $ATTEMPT returned HTTP $HTTP_CODE; retrying..."
            sleep $((ATTEMPT * 3))
          done

          if [ "$SUCCESS" != "1" ]; then
            echo "::warning::Could not refresh BGG collection snapshot. Thumbnail enrichment will fall back to the live Vercel helper/cache."
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./