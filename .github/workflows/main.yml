    .filters{position:sticky;top:8px;z-index:30;background:rgba(15,23,40,.94);backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);margin-bottom:14px}.filter-grid{display:grid;grid-template-columns:minmax(220px,1.5fr) repeat(5,minmax(120px,.7fr));gap:9px}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field label{color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.field input,.field select{width:100%;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:10px;padding:0 11px;outline:none}.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(124,156,255,.15)}
    .filter-row-2{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr)) auto auto;gap:9px;margin-top:9px;align-items:end}.quick-range{display:flex;gap:6px;flex-wrap:wrap;grid-column:span 2}.chip{min-height:36px;border-radius:999px;padding:0 12px;border:1px solid var(--border);background:var(--surface-2);color:var(--muted);font-weight:700;font-size:13px}.chip.active{background:rgba(124,156,255,.16);border-color:var(--accent);color:#cfd9ff}
