name: Deploy BGG Fetcher

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Apply BGA Plays compact layout and unrestricted collection call
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('bgaplays.html')
          s = path.read_text()

          replacements = {
