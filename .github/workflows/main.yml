    .filter-row-2{display:grid;grid-template-columns:minmax(110px,.65fr) minmax(150px,.85fr) minmax(360px,2.2fr) auto auto;gap:6px;margin-top:6px;align-items:end}.quick-range{display:flex;gap:4px;flex-wrap:nowrap;grid-column:auto;min-width:0}.chip{min-height:30px;border-radius:999px;padding:0 9px;border:1px solid var(--border);background:var(--surface-2);color:var(--muted);font-weight:700;font-size:11px;white-space:nowrap}.chip.active{background:rgba(124,156,255,.16);border-color:var(--accent);color:#cfd9ff}
    .kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin-bottom:7px}.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px 9px;min-width:0}.kpi .label{color:var(--muted);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.065em}.kpi .value{font-size:clamp(16px,1.45vw,21px);line-height:1.05;font-weight:850;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kpi .sub{color:var(--muted);font-size:9px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
''',
            '''    .workspace{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}.panel-head{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 12px;border-bottom:1px solid var(--border)}.panel-head h2{margin:0;font-size:15px}.view-tabs{display:flex;gap:5px;flex-wrap:wrap}.view-tab{min-height:34px;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:8px;padding:0 10px;font-weight:750}.view-tab.active{background:var(--surface-3);border-color:var(--border);color:var(--text)}
''': '''    .workspace{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:9px;align-items:start}.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}.panel-head{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 9px;border-bottom:1px solid var(--border)}.panel-head h2{margin:0;font-size:13px}.view-tabs{display:flex;gap:3px;flex-wrap:wrap}.view-tab{min-height:30px;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:7px;padding:0 8px;font-size:11px;font-weight:750}.view-tab.active{background:var(--surface-3);border-color:var(--border);color:var(--text)}
''',
            '''    @media(max-width:1180px){.filter-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.filter-grid .search-field{grid-column:span 2}.workspace{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.kpis{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:760px){.app{padding:10px}.topbar{flex-direction:column;align-items:stretch}.top-actions{justify-content:flex-start}.status-meta{display:none}.filters{top:4px}.filter-grid{grid-template-columns:1fr 1fr}.filter-grid .search-field{grid-column:1/-1}.filter-row-2{grid-template-columns:1fr 1fr}.quick-range{grid-column:1/-1}.kpis{grid-template-columns:repeat(2,1fr)}.side{grid-template-columns:1fr}.table-wrap{display:none}.mobile-list{display:grid}.matrix-mode .table-wrap{display:block;max-height:65vh}.matrix-mode .mobile-list{display:none}.panel-head{align-items:flex-start;flex-direction:column}.pager{flex-direction:column;align-items:stretch}.pager-actions{justify-content:space-between}.matrix-controls{align-items:stretch}.matrix-controls .field{flex:1 1 140px}.matrix-table th.matrix-game,.matrix-table td.matrix-game{min-width:170px;max-width:170px}}
    @media(max-width:480px){.filter-grid,.filter-row-2{grid-template-columns:1fr}.quick-range{grid-column:auto}.kpis{grid-template-columns:1fr 1fr}.kpi{padding:10px}.top-actions .btn{flex:1}.matrix-controls .field{flex:1 1 100%}}
''': '''    @media(max-width:1180px){.filter-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.filter-grid .search-field{grid-column:span 2}.filter-row-2{grid-template-columns:1fr 1fr 2fr auto auto}.quick-range{flex-wrap:wrap}.workspace{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.kpis{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:760px){button,select,input[type="search"],input[type="number"],input[type="text"],input[type="url"]{min-height:44px}.app{padding:8px}.topbar{flex-direction:column;align-items:stretch;margin-bottom:6px}.title-wrap h1{font-size:22px}.title-wrap p{font-size:10px}.top-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.top-actions .btn{min-height:40px}.status-meta{display:none}.status-strip{margin-bottom:6px}.filters{top:3px;padding:6px}.filter-grid{grid-template-columns:1fr 1fr}.filter-grid .search-field{grid-column:1/-1}.filter-row-2{grid-template-columns:1fr 1fr}.quick-range{grid-column:1/-1;flex-wrap:wrap}.chip{min-height:34px;flex:1 1 auto}.kpis{grid-template-columns:repeat(3,1fr);gap:4px}.kpi{padding:6px 7px}.kpi .value{font-size:17px}.side{grid-template-columns:1fr}.table-wrap{display:none}.mobile-list{display:grid}.matrix-mode .table-wrap{display:block;max-height:65vh}.matrix-mode .mobile-list{display:none}.panel-head{align-items:flex-start;flex-direction:column}.pager{flex-direction:column;align-items:stretch}.pager-actions{justify-content:space-between}.matrix-controls{align-items:stretch}.matrix-controls .field{flex:1 1 140px}.matrix-table th.matrix-game,.matrix-table td.matrix-game{min-width:170px;max-width:170px}}
    @media(max-width:480px){.filter-grid,.filter-row-2{grid-template-columns:1fr}.quick-range{grid-column:auto}.kpis{grid-template-columns:repeat(2,1fr)}.top-actions{grid-template-columns:repeat(2,1fr)}.matrix-controls .field{flex:1 1 100%}}
''',
            '''          <div class="modal-note">Matching is intentionally strict: case-insensitive exact game-name matching after whitespace and punctuation normalization. Non-matches stay blank; there is no fuzzy matching.</div>
''': '''          <div class="modal-note">Loads the username’s full BGG collection with no ownership, status, or subtype restrictions. Thumbnail matching stays strict: case-insensitive exact game-name matching after whitespace and punctuation normalization. Non-matches stay blank.</div>
''',
            '''  async function fetchBggCollection(username){const q=`endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1&excludesubtype=boardgameaccessory`,isPages=location.hostname.endsWith('github.io'),attempts=[];''': '''  async function fetchBggCollection(username){const q=`endpoint=collection&username=${encodeURIComponent(username)}`,isPages=location.hostname.endsWith('github.io'),attempts=[];'''
          }

          changed = False
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new)
                  changed = True
              elif new not in s:
                  raise SystemExit('Expected BGA Plays source block not found; refusing partial patch')

          if changed:
              path.write_text(s)
              print('BGA Plays compact layout / full collection patch applied.')
          else:
              print('BGA Plays patch already present.')
          PY

          if ! git diff --quiet -- bgaplays.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bgaplays.html
            git commit -m "ui: compact BGA Plays controls and load full BGG collection"
            git push origin HEAD:main
          fi

      - name: Inject BGG API Token into index.html
        env:
          BGG_SECRET: ${{ secrets.BGG_API_TOKEN }}
        run: |
          if [ -z "$BGG_SECRET" ]; then
            echo "::warning::GitHub Secret 'BGG_API_TOKEN' is not set. Placeholder will remain in index.html."
          else
            sed -i "s|GITHUB_SECRET_PLACEHOLDER_TOKEN|\'$BGG_SECRET\'|g" index.html
            echo "Token successfully injected into index.html."
          fi

      - name: Refresh sportomax BGG collection snapshot
        env:
          BGG_SECRET: ${{ secrets.BGG_API_TOKEN }}
        run: |
          if [ -z "$BGG_SECRET" ]; then
            echo "::warning::BGG_API_TOKEN unavailable; skipping collection snapshot."
            exit 0
          fi

          URL="https://boardgamegeek.com/xmlapi2/collection?username=sportomax"
          SUCCESS=0
          for ATTEMPT in 1 2 3 4 5; do
            HTTP_CODE=$(curl --silent --show-error --location \
              --output /tmp/bgg-collection.xml \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer $BGG_SECRET" \
              --header "Accept: text/xml" \
              --header "User-Agent: BoardGameLab-GitHubPages/1.0" \
              "$URL" || true)

            if [ "$HTTP_CODE" = "200" ] && grep -q '<items' /tmp/bgg-collection.xml; then
              mv /tmp/bgg-collection.xml bgg-collection-sportomax.xml
              echo "BGG collection snapshot refreshed."
              SUCCESS=1
              break
            fi

            echo "BGG collection attempt $ATTEMPT returned HTTP $HTTP_CODE; retrying..."
            sleep $((ATTEMPT * 3))
          done

          if [ "$SUCCESS" != "1" ]; then
            echo "::warning::Could not refresh BGG collection snapshot. Thumbnail enrichment will fall back to the live Vercel helper/cache."
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
