name: BGG Max Scan (Manual Backup)

# The automatic daily schedule lives in Supabase Cron so it is not dependent
# on Vercel/GitHub deployment availability. This workflow remains as a manual
# fallback after the Vercel endpoint is deployed.
on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Run BGG max scan
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_DOMAIN: ${{ secrets.VERCEL_DOMAIN }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET is not configured in GitHub Actions secrets."
            exit 1
          fi

          DOMAIN="${VERCEL_DOMAIN:-board-game-lab-one-phi-42.vercel.app}"
          DOMAIN="${DOMAIN#https://}"
          DOMAIN="${DOMAIN#http://}"
          DOMAIN="${DOMAIN%/}"
          URL="https://${DOMAIN}/api/bgg-max-scan?mode=scan"

          RESPONSE=$(curl --silent --show-error --fail-with-body \
            --retry 2 \
            --retry-all-errors \
            --max-time 480 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions-BGG-Max-Scan" \
            "${URL}")

          echo "${RESPONSE}" | jq .
          test "$(echo "${RESPONSE}" | jq -r '.success // false')" = "true"
