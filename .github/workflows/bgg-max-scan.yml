name: Daily BGG Max Scan

on:
  schedule:
    # Run daily at 1:15 AM Mountain Time.
    - cron: '15 1 * * *'
      timezone: 'America/Denver'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Run BGG max scan
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_DOMAIN: ${{ secrets.VERCEL_DOMAIN }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET is not configured in GitHub Actions secrets."
            exit 1
          fi

          DOMAIN="${VERCEL_DOMAIN:-board-game-lab-one-phi-42.vercel.app}"
          DOMAIN="${DOMAIN#https://}"
          DOMAIN="${DOMAIN#http://}"
          DOMAIN="${DOMAIN%/}"
          URL="https://${DOMAIN}/api/bgg-max-scan?mode=scan"

          echo "Running daily BGG max scan at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "Endpoint: ${URL}"

          RESPONSE=$(curl --silent --show-error --fail-with-body \
            --retry 2 \
            --retry-all-errors \
            --max-time 480 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions-BGG-Max-Scan" \
            "${URL}")

          echo "${RESPONSE}" | jq .

          SUCCESS=$(echo "${RESPONSE}" | jq -r '.success // false')
          if [ "${SUCCESS}" != "true" ]; then
            echo "BGG max scan returned success=false."
            exit 1
          fi

          MAX_ID=$(echo "${RESPONSE}" | jq -r '.maxId // "unknown"')
          NEW_COUNT=$(echo "${RESPONSE}" | jq -r '.newItemsInserted // 0')
          echo "BGG max scan complete: max=${MAX_ID}, new=${NEW_COUNT}"
