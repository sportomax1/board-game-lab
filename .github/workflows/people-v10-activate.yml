name: Activate People Analyzer v10
on:
  push:
    branches: [main]
    paths:
      - '.github/people-v10-activate-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activate v10 UI refinements
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('people.html')
          s=p.read_text(encoding='utf-8')
          old_css='uxCss+\'<link rel="stylesheet" href="./assets/people-v9.css?v=20260903-v9-r2">\'+\'</head>\''
          new_css='uxCss+\'<link rel="stylesheet" href="./assets/people-v9.css?v=20260903-v9-r2"><link rel="stylesheet" href="./assets/people-v10.css?v=20260903-v10-r1">\'+\'</head>\''
          old_js='uxJs+\'<scr\'+\'ipt src="./assets/people-v9.js?v=20260903-v9-r2"></scr\'+\'ipt>\'+\'</body>\''
          new_js='uxJs+\'<scr\'+\'ipt src="./assets/people-v9.js?v=20260903-v9-r2"></scr\'+\'ipt><scr\'+\'ipt src="./assets/people-v10.js?v=20260903-v10-r1"></scr\'+\'ipt>\'+\'</body>\''
          if old_css not in s:
              old_css='uxCss+\'<link rel="stylesheet" href="./assets/people-v9.css?v=20260903-v9">\'+\'</head>\''
          if old_js not in s:
              old_js='uxJs+\'<scr\'+\'ipt src="./assets/people-v9.js?v=20260903-v9"></scr\'+\'ipt>\'+\'</body>\''
          if old_css not in s or old_js not in s:
              raise SystemExit('Expected People Analyzer v9 asset injection not found')
          s=s.replace(old_css,new_css,1).replace(old_js,new_js,1)
          p.write_text(s,encoding='utf-8')

          idx=Path('index.html')
          t=idx.read_text(encoding='utf-8')
          import re
          t,n=re.subn(r'href="people\.html(?:\?[^\"]*)?" class="app-card"', 'href="people.html?v=20260903-v10-r1" class="app-card"', t, count=1)
          if n!=1:
              raise SystemExit('People Analyzer index link not found')
          idx.write_text(t,encoding='utf-8')
          PY
      - name: Commit v10 activation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add people.html index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Activate People Analyzer v10 efficiency pass'
          git push
