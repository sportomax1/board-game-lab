name: Consolidate SPAs once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/consolidate-spas-once.yml']
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consolidate frontend apps
        run: python scripts/consolidate_spas_once.py
      - name: Commit consolidated production tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Consolidate frontend apps into self-contained SPAs'
            git push origin HEAD:main
          fi
