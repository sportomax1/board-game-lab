name: Apply mobile scroll state fix
on:
  push:
    branches: [main]
    paths:
      - 'bgg-contacts.html'
      - 'assets/bgg-mobile-scroll-state-fix.js'
      - 'assets/bgg-contacts-scroll-fixes.css'
      - '.github/workflows/apply-mobile-scroll-state-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce mobile runtime and fresh CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('bgg-contacts.html')
          s=p.read_text()
          s=re.sub(r'<script src="/assets/bgg-mobile-scroll-state-fix\.js\?v=[^"]+"></script>', '', s)
          tag='<script src="/assets/bgg-mobile-scroll-state-fix.js?v=20260901scrollstate5"></script>'
          s=s.replace('</body>', tag+'</body>')
          s=re.sub(r'/assets/bgg-contacts-scroll-fixes\.css\?v=[^"\']+', '/assets/bgg-contacts-scroll-fixes.css?v=20260901scroll5', s)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q 'bgg-mobile-scroll-state-fix.js?v=20260901scrollstate5' bgg-contacts.html
          grep -q 'bgg-contacts-scroll-fixes.css?v=20260901scroll5' bgg-contacts.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bgg-contacts.html
          if ! git diff --cached --quiet; then
            git commit -m 'Enforce mobile masthead removal in app'
            git pull --rebase origin main
            git push origin main
          fi
