name: Apply mobile scroll state fix
on:
  push:
    branches: [main]
    paths:
      - 'assets/bgg-mobile-scroll-state-fix.js'
      - '.github/workflows/apply-mobile-scroll-state-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject mobile scroll-state fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('bgg-contacts.html')
          s=p.read_text()
          tag='<script src="/assets/bgg-mobile-scroll-state-fix.js?v=20260901scrollstate2"></script>'
          if 'bgg-mobile-scroll-state-fix.js' not in s:
              s=s.replace('</body>', tag+'</body>')
          # Bust the mobile CSS cache too; iOS Safari was retaining the previous layout rules.
          s=s.replace('/assets/bgg-contacts-scroll-fixes.css?v=20260901scroll1','/assets/bgg-contacts-scroll-fixes.css?v=20260901scroll2')
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q 'bgg-mobile-scroll-state-fix.js?v=20260901scrollstate2' bgg-contacts.html
          grep -q 'bgg-contacts-scroll-fixes.css?v=20260901scroll2' bgg-contacts.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bgg-contacts.html
          if ! git diff --cached --quiet; then
            git commit -m 'Wire mobile scroll state fix into app'
            git push
          fi
