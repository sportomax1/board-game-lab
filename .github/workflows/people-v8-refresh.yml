name: People Analyzer v8 cache bust
on:
  push:
    branches: [main]
    paths:
      - '.github/people-v8-refresh-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bust People Analyzer layout asset cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('people.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('people-v7.css?v=20260903-v7','people-v7.css?v=20260903-v8')
          s=s.replace('people-v7.js?v=20260903-v7','people-v7.js?v=20260903-v8')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cache bust
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add people.html
          git diff --cached --quiet && exit 0
          git commit -m 'Bust People Analyzer UI cache for full rehaul'
          git push
