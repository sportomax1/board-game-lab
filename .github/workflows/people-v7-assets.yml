name: Install People Analyzer v7 assets
on:
  push:
    branches:
      - main
    paths:
      - '.github/people-v7-assets-trigger.txt'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link v7 layout assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('people.html')
          s = p.read_text(encoding='utf-8')
          if 'assets/people-v7.css' in s:
              print('v7 assets already linked')
              raise SystemExit(0)
          old_head = "    html=html.replace('</head>',uxCss+'</head>');"
          old_body = "    html=html.replace('</body>',uxJs+'</body>');"
          new_head = "    html=html.replace('</head>',uxCss+'<link rel=\"stylesheet\" href=\"./assets/people-v7.css?v=20260903-v7\">'+'</head>');"
          new_body = "    html=html.replace('</body>',uxJs+'<scr'+'ipt src=\"./assets/people-v7.js?v=20260903-v7\"></scr'+'ipt>'+'</body>');"
          if old_head not in s or old_body not in s:
              raise SystemExit('Expected v6 asset injection markers not found')
          s = s.replace(old_head, new_head, 1).replace(old_body, new_body, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit v7 asset links
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add people.html
          git diff --cached --quiet && exit 0
          git commit -m 'Install People Analyzer v7 rail and inspector layout'
          git push
