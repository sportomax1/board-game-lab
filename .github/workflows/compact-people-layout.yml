# Trigger compact migration
name: Compact People Analyzer layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compact-people-layout.yml'

permissions:
  contents: write

jobs:
  compact-people:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compact layout and clarify IndexedDB cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('people.html')
          text = path.read_text(encoding='utf-8')

          marker = '/* people-compact-v2 */'
          if marker not in text:
              compact_css = r'''
/* people-compact-v2 */
@media(min-width:1001px){
  .shell{max-width:1600px;padding:18px 24px}
  .top{margin-bottom:12px;align-items:center}
  .title h1{font-size:34px;margin:0 0 4px}
  .title p{font-size:13px}
  .top .ghost{min-height:36px;padding:0 12px}
  .panel{margin-bottom:10px;border-radius:14px}
  .setup,.section{padding:12px 14px}
  .grid{grid-template-columns:minmax(220px,1.05fr) minmax(200px,.9fr) minmax(200px,.9fr) auto;gap:10px}
  .field label{margin-bottom:4px;font-size:10px}
  .control{height:38px}
  .ghost,.primary{min-height:38px}
  .primary{padding:0 16px}
  .progressRow{margin-top:8px;font-size:11px}
  .progress{height:4px;margin-top:4px}
  .sectionHead h2{font-size:18px;margin:0}
  #filterBody{display:grid;grid-template-columns:minmax(520px,1fr) minmax(650px,1.2fr);gap:12px;align-items:end}
  .filters{margin-top:0;gap:5px}
  .chip span{padding:5px 8px;font-size:11px}
  .advanced{margin-top:0;gap:7px;grid-template-columns:repeat(6,minmax(90px,1fr))}
  .advanced .control{height:34px;padding:0 9px}
  .advanced .field label{font-size:9px}
  .summary{grid-template-columns:repeat(4,1fr)}
  .metric{padding:9px 13px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .metric small{font-size:11px}
  .metric b{font-size:20px;margin:0}
  .tabs{margin:9px 0 8px;gap:5px}
  .tab{min-height:34px;padding:0 11px}
  .toolbar{margin-bottom:8px;gap:7px}
  .toolbar .control{height:36px}
  .toolbar .ghost{min-height:36px}
  .rankHeader{padding:10px 14px}
  .rankHeader h2{margin:0;font-size:19px}
}
@media(min-width:1001px) and (max-width:1250px){
  #filterBody{grid-template-columns:1fr}
  .advanced{grid-template-columns:repeat(6,minmax(90px,1fr))}
}
'''
              if '</style>' not in text:
                  raise SystemExit('Could not find </style> in people.html')
              text = text.replace('</style>', compact_css + '\n</style>', 1)

          replacements = {
              'Checking local cache…': 'Checking IndexedDB cache…',
              '<span class="cache">Cached ${new Date(saved.at).toLocaleString()}</span>': '<span class="cache">IndexedDB • Cached ${new Date(saved.at).toLocaleString()}</span>',
              '<span class="cache">Cached ${new Date(c.at).toLocaleString()}</span>': '<span class="cache">IndexedDB • Cached ${new Date(c.at).toLocaleString()}</span>',
              "Ready. Load BGG data once; filters are then local.": "Ready. Load BGG data once; results are stored in IndexedDB and filters run locally."
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- people.html; then
            echo "No people.html changes needed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '418982818+github-actions[bot]@users.noreply.github.com'
          git add people.html
          git commit -m 'Compact People Analyzer layout and clarify IndexedDB cache'
          git push