name: Fetch BGG Plays Data

on:
  schedule:
    # Runs every day at 4:00 AM UTC
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger from Actions tab

permissions:
  contents: write

jobs:
  fetch-plays:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Fetch all plays pages
        env:
          API_TOKEN: ${{ secrets.BGG_API_TOKEN }}
        run: |
          #!/bin/bash
          set -e
          
          USERNAME="sportomax"
          OUTPUT_FILE="plays.xml"
          PAGE=1
          
          echo '<?xml version="1.0" encoding="utf-8"?>' > "$OUTPUT_FILE"
          echo '<plays username="sportomax" total="0">' >> "$OUTPUT_FILE"
          
          echo "Starting to fetch plays for user: $USERNAME"
          
          while true; do
            URL="https://boardgamegeek.com/xmlapi2/plays?username=$USERNAME&page=$PAGE"
            echo "Fetching page $PAGE from $URL"
            
            # Fetch the page with bearer token
            RESPONSE=$(curl -s -H "Authorization: Bearer $API_TOKEN" "$URL")
            
            # Check if response contains any play id
            if echo "$RESPONSE" | grep -q '<play id='; then
              echo "Page $PAGE contains plays, processing..."
              
              # Extract just the play elements (skip the XML declaration and plays wrapper)
              echo "$RESPONSE" | grep '<play id=' >> "$OUTPUT_FILE"
              
              PAGE=$((PAGE + 1))
              
              # Be nice to BGG servers - wait 2 seconds between requests
              sleep 2
            else
              echo "Page $PAGE has no plays. Stopping."
              break
            fi
          done
          
          # Close the plays tag
          echo '</plays>' >> "$OUTPUT_FILE"
          
          # Count total plays and update the total attribute
          TOTAL_PLAYS=$(grep -c '<play id=' "$OUTPUT_FILE" || echo "0")
          sed -i "s/total=\"0\"/total=\"$TOTAL_PLAYS\"/" "$OUTPUT_FILE"
          
          echo "Finished! Total plays fetched: $TOTAL_PLAYS across $((PAGE - 1)) pages"
          
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add plays.xml
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to plays.xml"
          else
            git commit -m "Update plays.xml - $(date +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "Changes committed and pushed"
          fi
