# This workflow fetches a BoardGameGeek collection and commits it to the repository.
# It includes retry logic to handle the BGG API's 202 Accepted "please wait" responses.

name: Fetch sportomax BGG Collection

on:
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab
  schedule:
    - cron: '0 */4 * * *' # Runs every 4 hours

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # <-- Add this line
    
    steps:
      # Step 1: Check out your repository's code so we can commit changes to it
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Run the API call with retry logic
      - name: Fetch BGG Collection with Retries
        env:
          # Pass the secret to the script's environment
          BGG_TOKEN: ${{ secrets.BGG_API_TOKEN }}
        run: |
          URL="https://boardgamegeek.com/xmlapi2/collection?username=sportomax&stats=1"
          OUTPUT_FILE="library_sportomax.xml"
          TEMP_FILE="temp_collection.xml"
          MAX_RETRIES=10
          RETRY_COUNT=0

          echo "Fetching BGG collection for username 'sportomax'..."
          echo "URL: $URL"

          # Loop until max retries are hit
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            
            # Make the API call using curl
            # -s: Silent mode
            # -w "%{http_code}": Write the HTTP status code to stdout
            # -o "$TEMP_FILE": Write the body of the response to a temporary file
            # -H "Authorization: ...": Use the secret as a Bearer token as requested
            # -L: Follow redirects
            HTTP_STATUS=$(curl -s -w "%{http_code}" -o "$TEMP_FILE" \
              -H "Authorization: Bearer $BGG_TOKEN" \
              -L "$URL")

            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Success: Received HTTP 200."
              # Check if the file seems valid before declaring success
              if grep -q "<items" "$TEMP_FILE"; then
                echo "Valid XML received. Saving to $OUTPUT_FILE"
                mv "$TEMP_FILE" "$OUTPUT_FILE"
                break # Exit loop on success
              # Check if BGG returned a specific error message
              elif grep -q "<errors>" "$TEMP_FILE"; then
                echo "Error: BGG API returned an error message:"
                cat "$TEMP_FILE" # Print the error
                rm "$TEMP_FILE"
                exit 1 # Fail the job
              else
                echo "Warning: HTTP 200 but response doesn't look like expected XML. Retrying..."
                cat "$TEMP_FILE" # Print the unexpected response
              fi
            # This is the "please wait" response from BGG
            elif [ "$HTTP_STATUS" -eq 202 ]; then
              echo "Received HTTP 202 (Accepted). BGG is processing. Waiting 30 seconds... (Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES)"
            # Handle other errors
            else
              echo "Error: Received unexpected HTTP status $HTTP_STATUS. Retrying in 30 seconds... (Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES)"
              cat "$TEMP_FILE" # Show body for debugging
            fi

            # Increment retry counter
            RETRY_COUNT=$((RETRY_COUNT + 1))
            
            # Fail if we've hit max retries
            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "Error: Max retries reached. Failed to fetch collection."
              rm -f "$TEMP_FILE"
              exit 1 # Fail the job
            fi
            
            # Wait 15 seconds before the next try
            sleep 15
          done

      # Step 3: Commit the new file if it has changed
      - name: Commit and push changes
        run: |
          # Configure git for the actions bot
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          OUTPUT_FILE="library_sportomax.xml"

          # Check if git detects any changes to our target file
          if [ -z "$(git status --porcelain $OUTPUT_FILE)" ]; then
            echo "No changes to $OUTPUT_FILE. Nothing to commit."
          else
            echo "Changes detected in $OUTPUT_FILE. Committing..."
            git add $OUTPUT_FILE
            git commit -m "Update BGG collection for sportomax"
            # Push the changes back to the repository
            git push
          fi
