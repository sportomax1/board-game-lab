name: Fetch BGG Collection (Sportomax)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write   # 👈 this gives the bot permission to push commits

jobs:
  fetch-bgg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install requests

      - name: Fetch BGG collection XML with Python
        run: |
          python3 << 'EOF'
          import requests
          import sys
          from time import sleep
          
          url = "https://boardgamegeek.com/xmlapi2/collection?username=sportomax&stats=1"
          
          print(f"[LIBRARY] Fetching from: {url}")
          
          try:
              # BGG API has rate limits - add timeout and retries
              headers = {
                  'User-Agent': 'GitHub Actions Bot / sportomax collection fetcher'
              }
              
              response = requests.get(url, headers=headers, timeout=30)
              print(f"[LIBRARY] Response status: {response.status_code}")
              print(f"[LIBRARY] Response headers: {dict(response.headers)}")
              print(f"[LIBRARY] Response size: {len(response.text)} bytes")
              
              if response.status_code == 202:
                  print("[LIBRARY] Collection is being prepared (202 Accepted), waiting...")
                  sleep(5)
                  response = requests.get(url, headers=headers, timeout=30)
                  print(f"[LIBRARY] Retry response status: {response.status_code}")
              
              if response.status_code == 200:
                  with open('library_sportomax.xml', 'w', encoding='utf-8') as f:
                      f.write(response.text)
                  print(f"[LIBRARY] ✅ Successfully saved library_sportomax.xml ({len(response.text)} bytes)")
              else:
                  print(f"[LIBRARY] ❌ Failed with status {response.status_code}")
                  print(f"[LIBRARY] Response: {response.text[:500]}")
                  sys.exit(1)
          except Exception as e:
              print(f"[LIBRARY] ❌ Error: {str(e)}")
              sys.exit(1)
          EOF

      - name: Verify file was created
        run: |
          if [ -f library_sportomax.xml ]; then
            SIZE=$(wc -c < library_sportomax.xml)
            LINES=$(wc -l < library_sportomax.xml)
            echo "[LIBRARY] ✅ File exists: $SIZE bytes, $LINES lines"
            head -20 library_sportomax.xml
          else
            echo "[LIBRARY] ❌ File was not created!"
            exit 1
          fi

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add library_sportomax.xml
          git commit -m "[AUTO] Update BGG Sportomax collection - $(date +'%Y-%m-%d %H:%M:%S UTC')" || echo "No changes to commit"
          git push

