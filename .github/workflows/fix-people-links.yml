name: Fix People link styling
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-people-links.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only People link CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('people.html')
          s=p.read_text()
          old='.gameLink{color:inherit;text-decoration:none}.gameLink:hover{text-decoration:none}'
          new='.gameLink,.gameLink:visited,.gameLink:hover,.gameLink:focus,.gameLink:active,.gamePill,.gamePill:visited,.gamePill:hover,.gamePill:focus,.gamePill:active,.drawerGame,.drawerGame:visited,.drawerGame:hover,.drawerGame:focus,.drawerGame:active{color:inherit;text-decoration:none}'
          if old not in s: raise SystemExit('Expected CSS not found; refusing broad rewrite')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add people.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix People Analyzer blue links'
          git push
