name: Upgrade BGG Contacts CRM

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bgg-contacts-crm-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply contact UX upgrade
        run: python scripts/upgrade_bgg_contacts_crm.py

      - name: Verify generated HTML
        run: |
          grep -q 'contacts-crm-v2-2026-09-01' bgg-contacts.html
          grep -q 'Discord Username' bgg-contacts.html
          grep -q 'preferred_contact_method' bgg-contacts.html
          git diff --check

      - name: Commit upgraded app
        run: |
          if git diff --quiet -- bgg-contacts.html; then
            echo 'No HTML changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bgg-contacts.html
          git commit -m 'Upgrade BGG contacts single-step CRM flow'
          git push origin main
