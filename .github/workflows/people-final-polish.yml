name: People Analyzer final polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/people-final-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final People Analyzer UX polish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('people.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace(
            ".statusBar .progressRow{margin:0!important;min-height:17px;padding:0 2px}",
            ".statusBar .progressRow{margin:0!important;min-height:17px;padding:0 2px;display:grid!important;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}"
          )
          s=s.replace(
            ".statusBar.settled .progressRow{min-height:14px;opacity:.88}",
            ".statusBar.settled .progressRow{min-height:14px;opacity:.88}.statusTools{display:flex;align-items:center;gap:6px;justify-content:flex-end}.mobileDataToggle{display:none!important}"
          )
          s=s.replace(
            "#filterPanel.filterClosed{padding:0!important;border:0!important;background:transparent!important;box-shadow:none!important;margin-bottom:3px!important}",
            "#filterPanel.filterClosed{display:none!important}"
          )
          s=s.replace(
            "@media(max-width:1000px){\n  .resultsStrip",
            "@media(max-width:1000px){\n  .mobileDataToggle{display:inline-flex!important;align-items:center;justify-content:center;min-height:34px!important;height:34px;padding:0 10px!important;font-size:10px!important}\n  .setup.mobileDataCollapsed>.grid{display:none!important}\n  .resultsStrip"
          )

          old="""  const filterBody=byId('filterBody');
  const filterToggle=byId('filterCollapse');
  if(filterBody&&filterToggle&&!filterBody.classList.contains('hidden')){
    filterBody.classList.add('hidden');
    filterToggle.textContent='Show filters';
  }
  const syncFilterPanel=()=>filterPanel?.classList.toggle('filterClosed',!!filterBody?.classList.contains('hidden'));
  if(filterBody){new MutationObserver(syncFilterPanel).observe(filterBody,{attributes:true,attributeFilter:['class']});syncFilterPanel()}

  if(filterToggle){
    const badge=document.createElement('span');
    badge.className='filterActiveBadge';
    filterToggle.insertAdjacentElement('beforebegin',badge);
    const updateBadge=()=>{
      const checked=document.querySelectorAll('#filters input:checked').length;
      const advanced=[...document.querySelectorAll('.af')].filter(x=>String(x.value||'').trim()).length;
      const count=checked+advanced;
      badge.textContent=count?String(count):'';
      badge.title=count?(String(count)+' active filter'+(count===1?'':'s')):'';
    };
    document.querySelectorAll('#filters input,.af').forEach(x=>x.addEventListener('change',updateBadge));
    document.querySelectorAll('.af').forEach(x=>x.addEventListener('input',updateBadge));
    updateBadge();
  }

  if(progress&&setup){"""
          new="""  const filterBody=byId('filterBody');
  const filterToggle=byId('filterCollapse');
  const filterHead=filterPanel?.querySelector('.sectionHead');
  const statusTools=document.createElement('span');
  statusTools.className='statusTools';
  setup?.querySelector('.progressRow')?.appendChild(statusTools);
  let filterBadge=null;
  let updateFilterBadge=()=>{};
  if(filterBody&&filterToggle&&!filterBody.classList.contains('hidden')){
    filterBody.classList.add('hidden');
    filterToggle.textContent='Show filters';
  }
  if(filterToggle){
    filterBadge=document.createElement('span');
    filterBadge.className='filterActiveBadge';
    filterToggle.insertAdjacentElement('beforebegin',filterBadge);
    updateFilterBadge=()=>{
      const checked=document.querySelectorAll('#filters input:checked').length;
      const advanced=[...document.querySelectorAll('.af')].filter(x=>String(x.value||'').trim()).length;
      const count=checked+advanced;
      filterBadge.textContent=count?String(count):'';
      filterBadge.title=count?(String(count)+' active filter'+(count===1?'':'s')):'';
    };
    document.querySelectorAll('#filters input,.af').forEach(x=>x.addEventListener('change',updateFilterBadge));
    document.querySelectorAll('.af').forEach(x=>x.addEventListener('input',updateFilterBadge));
  }
  const syncFilterPanel=()=>{
    const closed=!!filterBody?.classList.contains('hidden');
    const desktop=desktopMQ.matches;
    filterPanel?.classList.toggle('filterClosed',closed&&desktop);
    if(closed&&desktop&&filterToggle)statusTools.append(filterBadge,filterToggle);
    else if(filterHead&&filterToggle)filterHead.append(filterBadge,filterToggle);
  };
  if(filterBody)new MutationObserver(syncFilterPanel).observe(filterBody,{attributes:true,attributeFilter:['class']});
  if(desktopMQ.addEventListener)desktopMQ.addEventListener('change',syncFilterPanel);
  syncFilterPanel();
  updateFilterBadge();

  if(progress&&setup){"""
          if old not in s:
              raise SystemExit('Expected filter block not found')
          s=s.replace(old,new,1)

          s=s.replace(
            "  ['yearMin','yearMax','ratingMin','weightMax','playersMin','playersMax'].forEach(id=>{const el=byId(id);if(el&&prefs[id]!=null)el.value=prefs[id]});\n  const savePrefs=()=>{try{",
            "  ['yearMin','yearMax','ratingMin','weightMax','playersMin','playersMax'].forEach(id=>{const el=byId(id);if(el&&prefs[id]!=null)el.value=prefs[id]});\n  updateFilterBadge();\n  const savePrefs=()=>{try{"
          )

          marker="""  if(logBtn){logBtn.textContent='Log';logBtn.title='View API / debug log'}
  const collapse=byId('collapseAll');"""
          replacement="""  if(logBtn){logBtn.textContent='Log';logBtn.title='View API / debug log'}
  const mobileDataToggle=document.createElement('button');
  mobileDataToggle.className='ghost mobileDataToggle';
  mobileDataToggle.type='button';
  mobileDataToggle.textContent='Data';
  mobileDataToggle.title='Show or hide BGG data controls';
  if(top&&logBtn)top.insertBefore(mobileDataToggle,logBtn);
  const mobileMQ=window.matchMedia('(max-width:1000px)');
  let mobileDataManual=false;
  const syncMobileData=()=>{
    if(!setup)return;
    if(!mobileMQ.matches||workspace?.hidden){
      setup.classList.remove('mobileDataCollapsed');
      if(workspace?.hidden)mobileDataManual=false;
    }else if(!mobileDataManual){
      setup.classList.add('mobileDataCollapsed');
    }
    mobileDataToggle.textContent=setup.classList.contains('mobileDataCollapsed')?'Data':'Hide data';
  };
  mobileDataToggle.onclick=()=>{
    mobileDataManual=true;
    setup?.classList.toggle('mobileDataCollapsed');
    syncMobileData();
  };
  if(workspace)new MutationObserver(syncMobileData).observe(workspace,{attributes:true,attributeFilter:['hidden']});
  if(mobileMQ.addEventListener)mobileMQ.addEventListener('change',syncMobileData);
  syncMobileData();
  const collapse=byId('collapseAll');"""
          if marker not in s:
              raise SystemExit('Expected log button marker not found')
          s=s.replace(marker,replacement,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit People Analyzer polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add people.html
          git diff --cached --quiet && exit 0
          git commit -m 'Finish People Analyzer navigation and mobile efficiency'
          git push
