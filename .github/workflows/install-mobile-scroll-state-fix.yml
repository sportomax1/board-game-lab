name: Install mobile scroll state fix
on:
  push:
    paths:
      - '.github/workflows/install-mobile-scroll-state-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add mobile scroll state fix script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('bgg-contacts.html')
          s=p.read_text()
          tag='<script src="/assets/bgg-mobile-scroll-state-fix.js?v=20260901scrollstate1"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'</body>')
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bgg-contacts.html
          git diff --cached --quiet || git commit -m "Fix mobile tab scroll state"
          git push
