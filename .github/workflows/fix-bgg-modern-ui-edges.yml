name: Fix BGG Modern UI Edges

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-bgg-modern-ui-edges.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python scripts/fix_bgg_modern_ui_edges.py
      - run: |
          node --check assets/bgg-contacts-modern.js
          grep -q "fa-brands" assets/bgg-contacts-modern.js
          grep -q "classList.contains('hidden')" assets/bgg-contacts-modern.js
          grep -q "position:relative;width:100%" assets/bgg-contacts-modern.css
          git diff --check
      - name: Commit fixes
        run: |
          if git diff --quiet -- assets/bgg-contacts-modern.js assets/bgg-contacts-modern.css; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/bgg-contacts-modern.js assets/bgg-contacts-modern.css
          git commit -m 'Polish BGG contacts modern interactions'
          git push origin main
