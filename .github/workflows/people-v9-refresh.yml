name: People Analyzer v9 asset switch
on:
  push:
    branches: [main]
    paths:
      - '.github/people-v9-refresh-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch People Analyzer to v9 assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('people.html')
          s=p.read_text(encoding='utf-8')
          replacements = [
            ('people-v7.css?v=20260903-v8','people-v9.css?v=20260903-v9'),
            ('people-v7.js?v=20260903-v8','people-v9.js?v=20260903-v9'),
            ('people-v7.css?v=20260903-v7','people-v9.css?v=20260903-v9'),
            ('people-v7.js?v=20260903-v7','people-v9.js?v=20260903-v9'),
          ]
          before=s
          for old,new in replacements:
              s=s.replace(old,new)
          if s==before:
              raise SystemExit('Expected People Analyzer asset references were not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit v9 asset switch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add people.html
          git diff --cached --quiet && exit 0
          git commit -m 'Switch People Analyzer to v9 dashboard redesign'
          git push
