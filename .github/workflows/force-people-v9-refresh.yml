name: Force People Analyzer v9 refresh
on:
  push:
    branches: [main]
    paths:
      - '.github/force-people-v9-refresh-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force fresh People Analyzer route and assets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('people.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('people-v9.css?v=20260903-v9','people-v9.css?v=20260903-v9-r2')
          s=s.replace('people-v9.js?v=20260903-v9','people-v9.js?v=20260903-v9-r2')
          p.write_text(s,encoding='utf-8')

          idx=Path('index.html')
          t=idx.read_text(encoding='utf-8')
          old='href="people.html" class="app-card"'
          new='href="people.html?v=20260903-v9-r2" class="app-card"'
          if old not in t and new not in t:
              raise SystemExit('People Analyzer index link not found')
          t=t.replace(old,new,1)
          idx.write_text(t,encoding='utf-8')
          PY
      - name: Commit forced refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add people.html index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Force fresh People Analyzer v9 dashboard load'
          git push
