name: Apply BGG Contacts UX
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  apply-ux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/apply_bgg_ux.py
      - name: Commit changes
        run: |
          if git diff --quiet -- bgg-contacts.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bgg-contacts.html
          git commit -m "Refine BGG Contacts responsive UI UX"
          git push
