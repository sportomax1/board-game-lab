name: Apply BGG Contacts UX
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-bgg-ux.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI UX enhancements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('bgg-contacts.html')
          s=p.read_text()
          css=r'''
/* 2026 UX refinement */
:root{--stage1:#0b2747;--stage2:#0c315a;--stage3:#0d3b6d;--stage4:#0e4680;--stage5:#105193;--stage6:#125ca6}
body{padding-bottom:0}.app>h1{margin:8px 0 4px;font-size:22px;letter-spacing:-.02em}.tabs{position:sticky;top:0;z-index:15;margin:0 -14px 12px;padding:9px 14px;background:rgba(7,17,31,.94);backdrop-filter:blur(12px);border-bottom:1px solid #203149;box-shadow:0 8px 20px #02081455}.tabs .btn{border-color:transparent;background:transparent;color:#aebdd0}.tabs .btn.active{background:#1677ff;color:#fff}.tabCount{display:inline-flex;min-width:20px;height:20px;align-items:center;justify-content:center;margin-left:5px;padding:0 6px;border-radius:999px;background:#17283d;border:1px solid #30445f;font-size:10px}.tabs .active .tabCount{background:#0b5fc9;border-color:#63a8ff}.contactTable th,.contactTable td,.pipelineTable th,.pipelineTable td{padding:6px 8px}.contactTable input,.pipelineTable input,.pipelineTable select{padding:5px 7px;min-height:30px}.contactTable tbody tr,.pipelineTable tbody tr{height:42px}.contactTable tbody tr:hover,.pipelineTable tbody tr:hover{background:#11243a}.contactTable th,.pipelineTable th{top:49px;z-index:5}.kanbanCol:nth-child(1){background:var(--stage1)}.kanbanCol:nth-child(2){background:var(--stage2)}.kanbanCol:nth-child(3){background:var(--stage3)}.kanbanCol:nth-child(4){background:var(--stage4)}.kanbanCol:nth-child(5){background:var(--stage5)}.kanbanCol:nth-child(6){background:var(--stage6)}.kanbanCol{border-color:#315276}.kanbanCard{background:#081524e8}.statusSelect,[data-pstatus]{border-left:4px solid #1677ff}.modal{justify-content:flex-end;padding:0;background:#020814aa}.modal .box{width:min(520px,92vw);height:100vh;max-height:100vh;border-radius:16px 0 0 16px;border-right:0;padding:20px;box-shadow:-18px 0 50px #0008;animation:drawerIn .16s ease-out}.gate{justify-content:center;padding:14px}.gate .box{width:min(650px,100%);height:auto;max-height:85vh;border-radius:15px;border:1px solid #30445f;box-shadow:none;animation:none}@keyframes drawerIn{from{transform:translateX(24px);opacity:.5}to{transform:none;opacity:1}}
@media(max-width:800px){body{padding-bottom:72px}.app{padding:10px}.app>h1{font-size:19px}.tabs{position:fixed;left:0;right:0;top:auto;bottom:0;z-index:30;margin:0;padding:8px max(10px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));display:grid;grid-template-columns:repeat(3,1fr);background:#07111ff5;border-top:1px solid #30445f;border-bottom:0;box-shadow:0 -8px 24px #02081488}.tabs .btn{min-height:46px;padding:7px 4px;font-size:12px}.tabCount{display:flex;margin:2px auto 0;width:max-content}.modal{align-items:flex-end}.modal .box{width:100%;height:min(92vh,900px);max-height:92vh;border-radius:18px 18px 0 0;border:1px solid #30445f;border-bottom:0;animation:sheetIn .16s ease-out}.gate{align-items:center}.gate .box{height:auto;max-height:85vh;border-radius:15px;border:1px solid #30445f}@keyframes sheetIn{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}}
'''
          s=s.replace('</style>',css+'</style>',1)
          s=s.replace('data-tab="collection">Collection</button>','data-tab="collection">Collection <span id="collectionTabCount" class="tabCount">—</span></button>',1)
          s=s.replace('data-tab="contacts">Contacts</button>','data-tab="contacts">Contacts <span id="contactsTabCount" class="tabCount">—</span></button>',1)
          s=s.replace('data-tab="pipeline">Games</button>','data-tab="pipeline">Games <span id="gamesTabCount" class="tabCount">—</span></button>',1)
          # Update badges at the natural render/load points without changing data behavior.
          s=s.replace("function render(){let q=", "function render(){if($('collectionTabCount'))$('collectionTabCount').textContent=games.length;let q=",1)
          s=s.replace("function renderContacts(){let a=", "function renderContacts(){if($('contactsTabCount'))$('contactsTabCount').textContent=contacts.length;let a=",1)
          s=s.replace("function renderPipeline(){let a=", "function renderPipeline(){if($('gamesTabCount'))$('gamesTabCount').textContent=pipelineGames.length;let a=",1)
          p.write_text(s)
          PY
      - name: Commit UX update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bgg-contacts.html
          git diff --cached --quiet || git commit -m "Refine BGG Contacts responsive UI UX"
          git push
