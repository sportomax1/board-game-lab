name: Apply BGG Contacts UX
on:
  push:
    branches:
      - main
    paths:
      - 'scripts/apply_bgg_ux.py'
      - 'bga.html'
permissions:
  contents: write
jobs:
  apply-ux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/apply_bgg_ux.py
      - name: Verify BGA manual/cache behavior
        run: |
          grep -q "BGA_MANUAL_API_ALLOWED=false" bgg-contacts.html
          grep -q "bgaLoadSaved" bgg-contacts.html
          grep -q "Manual Refresh BGA Data required" bgg-contacts.html
      - name: Commit changes
        run: |
          if git diff --quiet -- bgg-contacts.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bgg-contacts.html
          git commit -m "Refresh embedded BGA manual cache UX"
          git pull --rebase origin main
          git push origin main
