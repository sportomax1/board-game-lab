name: Scheduled BGG API Fetch

on:
  # This section schedules the workflow to run every 30 minutes (at :00 and :30)
  schedule:
    - cron: '*/30 * * * *'
  # Allows manual running from the Actions tab in GitHub
  workflow_dispatch:

jobs:
  fetch_and_commit:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4
        # Important: Fetch history to allow the workflow to commit later
        with:
          fetch-depth: 0 
          
      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 3. Install Python dependencies
        # The 'requests' library is needed for the API call
        run: pip install requests
        
      - name: 4. Run the API fetch script
        # Executes your Python script
        run: python fetch_bgg_data.py
        
      - name: 5. Commit and Push changes
        # Use the standard Git commands to save the updated mydata.xml file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Check if mydata.xml has changed before committing
          git add mydata.xml
          
          # Commit the changes; '|| exit 0' allows the workflow to succeed
          # even if no new changes were made to the file.
          git commit -m "Automated BGG data update: $(date)" || exit 0 
          
          # Push the changes back to the main branch
          git push
