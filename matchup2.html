<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Matchup 2.0 | Armory Analytics</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>⚔️</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    maxWidth: { 'app': '800px' },
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui'] }
                }
            }
        };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        :root { --primary: #6366f1; --primary-dark: #4f46e5; --bg-color: #f8fafc; --border-color: #e2e8f0; }
        body { overscroll-behavior: none; background-color: var(--bg-color); color: #1e293b; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .tab-bar { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border-color); scrollbar-width: none; }
        .tab-bar::-webkit-scrollbar { display: none; }
        .tab-active { color: var(--primary); position: relative; }
        .tab-active::after { content: ''; position: absolute; bottom: 0; left: 20%; right: 20%; height: 3px; background: var(--primary); border-radius: 3px 3px 0 0; }
        .btn-primary { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }
        .game-vote-card { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .game-vote-card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        .view-content { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        /* Force Square Small Thumbnails */
        .image-container { width: 120px; height: 120px; margin: 0 auto; overflow: hidden; border-radius: 1rem; background: #f1f5f9; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-color); }
        .image-container img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
        .list-img { width: 44px; height: 44px; object-fit: contain; background: #f8fafc; border-radius: 8px; border: 1px solid var(--border-color); padding: 2px; flex-shrink: 0; }
        .winner-overlay { animation: trophyBounce 0.8s ease-out; }
        @keyframes trophyBounce { 0% { transform: scale(0.5); opacity: 0; } 50% { transform: scale(1.2); opacity: 0.8; } 100% { transform: scale(1); opacity: 0.5; } }
    </style>
</head>
<body class="min-h-screen">

    <div id="passwordScreen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900">
        <div class="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-md p-10 text-center space-y-6 animate-in zoom-in duration-300">
            <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-[1.5rem] flex items-center justify-center mx-auto shadow-lg"><i class="fa-solid fa-swords text-3xl"></i></div>
            <h1 class="text-3xl font-black text-slate-900 tracking-tight">Matchup 2.0</h1>
            <div class="space-y-4">
                <input type="password" id="appPassword" class="w-full px-6 py-4 rounded-2xl bg-slate-50 border-transparent focus:bg-white focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all font-bold" placeholder="Password">
                <input type="text" id="bggUsernameInput" class="w-full px-6 py-4 rounded-2xl bg-slate-50 border-transparent focus:bg-white focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all font-bold" value="sportomax">
            </div>
            <button onclick="unlockApp()" class="w-full btn-primary text-white py-5 rounded-[1.5rem] font-black uppercase tracking-widest text-xs transition-all hover:scale-[1.02]">Start Session</button>
            <p id="passwordError" class="text-red-500 text-[10px] font-black hidden uppercase">Access Denied</p>
        </div>
    </div>

    <div id="loading" class="fixed inset-0 bg-white/95 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="text-center space-y-4"><div class="animate-spin rounded-full h-16 w-16 border-b-4 border-indigo-600 mx-auto"></div><p class="text-slate-900 font-black uppercase text-[10px] tracking-widest">Syncing Collection</p></div>
    </div>

    <div id="app" class="hidden pb-24">
        <header class="glass-header sticky top-0 z-40 w-full h-16 sm:h-20 flex items-center px-4 sm:px-6">
            <div class="max-w-app mx-auto w-full flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="bg-indigo-600 text-white w-9 h-9 rounded-xl flex items-center justify-center shadow-lg"><i class="fa-solid fa-swords text-sm"></i></div>
                    <div><h1 class="text-sm font-black text-slate-900 uppercase">Matchup</h1><p id="usernameDisplay" class="text-[9px] text-slate-400 font-black uppercase"></p></div>
                </div>
                <div class="flex items-center gap-3">
                    <div id="sessionCountBadge" class="text-[9px] font-black text-slate-400 uppercase bg-slate-50 px-2 py-1 rounded-lg">0 Decisions</div>
                    <button onclick="logout()" class="text-slate-400 hover:text-red-500 transition-colors"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
            </div>
        </header>

        <div class="tab-bar sticky top-16 sm:top-20 z-30 flex justify-center">
            <div class="max-w-app w-full flex overflow-x-auto">
                <button onclick="switchTab('matchup')" id="tab-matchup" class="flex-1 min-w-[80px] py-4 text-[10px] font-black uppercase tracking-widest tab-active">Combat</button>
                <button onclick="switchTab('tournament')" id="tab-tournament" class="flex-1 min-w-[80px] py-4 text-[10px] font-black uppercase tracking-widest">Events</button>
                <button onclick="switchTab('stats')" id="tab-stats" class="flex-1 min-w-[80px] py-4 text-[10px] font-black uppercase tracking-widest">Ranks</button>
                <button onclick="switchTab('logs')" id="tab-logs" class="flex-1 min-w-[100px] py-4 text-[10px] font-black uppercase tracking-widest">Logs</button>
                <button onclick="switchTab('settings')" id="tab-settings" class="flex-1 min-w-[50px] py-4 text-slate-400"><i class="fa-solid fa-sliders"></i></button>
            </div>
        </div>

        <main class="max-w-app mx-auto p-4 space-y-8">
            <div id="view-matchup" class="view-content space-y-8">
                <div id="tournamentProgress" class="hidden text-center bg-indigo-600 text-white py-2 rounded-xl text-[10px] font-black uppercase tracking-widest shadow-lg"></div>
                <div id="matchupCard" class="grid grid-cols-2 gap-4 sm:gap-10">
                    <div onclick="selectWinner('left')" class="game-vote-card bg-white rounded-[2rem] p-6 border border-slate-100 shadow-sm text-center space-y-4">
                        <div class="image-container shadow-inner relative"><img id="leftImage" src="" onerror="this.src='/images/placeholder.png'"></div>
                        <h3 id="leftName" class="text-xs font-black text-slate-900 line-clamp-2 uppercase min-h-[2.5rem] flex items-center justify-center tracking-tight"></h3>
                    </div>
                    <div onclick="selectWinner('right')" class="game-vote-card bg-white rounded-[2rem] p-6 border border-slate-100 shadow-sm text-center space-y-4">
                        <div class="image-container shadow-inner relative"><img id="rightImage" src="" onerror="this.src='/images/placeholder.png'"></div>
                        <h3 id="rightName" class="text-xs font-black text-slate-900 line-clamp-2 uppercase min-h-[2.5rem] flex items-center justify-center tracking-tight"></h3>
                    </div>
                </div>
                <div class="flex justify-center gap-4"><button onclick="skipMatchup()" class="px-10 py-3 bg-white border border-slate-200 text-[10px] font-black uppercase tracking-widest rounded-xl hover:bg-slate-50 transition-all">Skip</button><button id="undoButton" onclick="undoMatchup()" class="hidden px-10 py-3 bg-red-50 text-red-600 border border-red-100 text-[10px] font-black uppercase tracking-widest rounded-xl hover:bg-red-100 transition-all">Undo</button></div>
                
                <div class="bg-white rounded-[2.5rem] p-8 border border-slate-100 shadow-sm space-y-8 text-center">
                    <h3 class="text-xs font-black text-slate-900 uppercase tracking-widest border-b pb-6">Session Metrics</h3>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-8">
                        <div class="space-y-1"><div id="totalMatchups" class="text-3xl font-black text-indigo-600 tracking-tighter">0</div><div class="text-[8px] font-black text-slate-400 uppercase tracking-[0.2em]">Gross Combat</div></div>
                        <div class="space-y-1"><div id="uniqueGames" class="text-3xl font-black text-slate-900 tracking-tighter">0</div><div class="text-[8px] font-black text-slate-400 uppercase tracking-[0.2em]">Deployed</div></div>
                        <div class="space-y-1 cursor-pointer underline" onclick="showHIndexGames(parseInt(document.getElementById('liveHIndex').textContent), {}, allGamesInCollection)"><div id="liveHIndex" class="text-3xl font-black text-emerald-600 tracking-tighter">0</div><div class="text-[8px] font-black text-slate-400 uppercase tracking-[0.2em]">Power Index</div></div>
                        <div class="space-y-1"><div id="thisWeekCount" class="text-3xl font-black text-purple-600 tracking-tighter">0</div><div class="text-[8px] font-black text-slate-400 uppercase tracking-[0.2em]">7D Velocity</div></div>
                    </div>
                    <div id="liveAppearanceDistribution" class="flex flex-wrap gap-2 justify-center pt-4"></div>
                </div>
            </div>

            <div id="view-tournament" class="hidden view-content space-y-6">
                <div class="bg-white rounded-[2rem] p-8 border space-y-6 shadow-sm">
                    <h3 class="font-black text-slate-900 uppercase text-center text-xs tracking-widest">Event Protocols</h3>
                    <select id="gameMode" onchange="toggleTournamentSettings()" class="w-full p-4 rounded-xl bg-slate-50 font-black text-xs uppercase appearance-none border-transparent outline-none cursor-pointer">
                        <option value="standard">Standard Battle</option><option value="winnerstays">Winner Stays</option><option value="bracket">Elimination Bracket</option><option value="roundrobin">Round Robin League</option>
                    </select>
                    <div id="bracketSettings" class="hidden p-4 bg-indigo-50/50 rounded-xl flex gap-4 border border-indigo-100">
                        <select id="bracketSize" class="p-2 rounded-lg text-[10px] font-black uppercase outline-none"><option value="4">4 Games</option><option value="8" selected>8 Games</option><option value="16">16 Games</option></select>
                        <label class="flex items-center gap-2 text-[10px] font-black uppercase tracking-widest cursor-pointer"><input type="checkbox" id="doubleElimination" class="w-4 h-4 text-indigo-600 rounded"> Double Elim</label>
                    </div>
                    <div id="roundrobinSettings" class="hidden p-4 bg-emerald-50/50 rounded-xl border border-emerald-100">
                        <input type="number" id="roundrobinSize" min="3" max="20" value="6" class="w-full p-2 rounded-lg text-[10px] font-black uppercase text-center" placeholder="League Size">
                    </div>
                    <button onclick="startTournament()" class="w-full py-4 btn-primary text-white rounded-xl font-black uppercase text-xs tracking-widest">Initialize Event</button>
                </div>
                <div id="bracketView" class="hidden bg-white p-6 rounded-[2rem] border overflow-x-auto shadow-sm"><div id="bracketVisualization" class="min-w-[600px]"></div></div>
            </div>

            <div id="view-stats" class="hidden view-content space-y-4">
                <div class="flex items-center justify-between bg-white p-4 rounded-2xl border shadow-sm">
                    <h3 class="font-black text-slate-900 uppercase text-xs tracking-widest">Global Ranks</h3>
                    <input type="text" id="searchStandings" placeholder="Filter..." class="w-32 px-3 py-1.5 rounded-lg bg-slate-50 text-[10px] font-black uppercase border-transparent outline-none">
                </div>
                <div id="standingsList" class="space-y-2"></div>
            </div>

            <div id="view-logs" class="hidden view-content space-y-4">
                <div class="flex items-center justify-between bg-white p-4 rounded-2xl border shadow-sm">
                    <h3 class="font-black text-slate-900 uppercase text-xs tracking-widest">Battle logs</h3>
                    <div class="flex gap-1 bg-slate-50 p-1 rounded-lg"><button id="group-day" onclick="setDailyGrouping('day')" class="px-3 py-1 rounded-md text-[9px] font-black uppercase bg-indigo-600 text-white shadow-sm transition-all">Day</button><button id="group-week" onclick="setDailyGrouping('week')" class="px-3 py-1 rounded-md text-[9px] font-black uppercase text-slate-400 transition-all">Week</button></div>
                </div>
                <div id="matchupList" class="space-y-2"></div>
                <div id="dailyRecordsList" class="space-y-2 pt-4"></div>
            </div>

            <div id="view-settings" class="hidden view-content space-y-6">
                <div class="bg-white rounded-[2rem] p-8 border shadow-sm space-y-8">
                    <div class="grid grid-cols-2 gap-4">
                        <label class="p-4 border rounded-2xl flex items-center gap-3 cursor-pointer hover:bg-slate-50 transition-all"><input type="checkbox" id="ownedOnly" class="w-5 h-5 text-indigo-600 rounded"><span class="text-[10px] font-black uppercase tracking-widest">Inventory Only</span></label>
                        <label class="p-4 border rounded-2xl flex items-center gap-3 cursor-pointer hover:bg-slate-50 transition-all"><input type="checkbox" id="excludeExpansions" class="w-5 h-5 text-indigo-600 rounded" checked><span class="text-[10px] font-black uppercase tracking-widest">Core Content Only</span></label>
                    </div>
                    <div class="space-y-4 text-left"><label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block ml-1">Data Operations</label><div class="grid grid-cols-2 gap-4"><button onclick="loadGames()" class="py-4 bg-indigo-600 text-white rounded-xl font-black uppercase text-xs tracking-widest shadow-lg shadow-indigo-100 transition-all active:scale-95">Sync BGG</button><button onclick="exportRawData()" class="py-4 bg-slate-900 text-white rounded-xl font-black uppercase text-xs tracking-widest shadow-lg transition-all active:scale-95">Export CSV</button></div></div>
                    <div class="space-y-4">
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-1 tracking-[0.2em]">Selection Logic</label>
                        <select id="matchupMode" class="w-full p-4 rounded-xl bg-slate-50 font-black text-xs uppercase appearance-none border-transparent outline-none cursor-pointer hover:bg-slate-100 transition-all"><option value="least-matchups">Least Combat (Balanced)</option><option value="balanced-rating">Balanced ELO (Close Skill)</option><option value="truly-random">Total Chaos (Random)</option></select>
                    </div>
                    <button onclick="resetSession()" class="w-full py-4 bg-slate-100 text-slate-600 rounded-xl font-black uppercase text-xs tracking-widest transition-all hover:bg-slate-200">Clear Session Metrics</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="championModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-xl z-50 hidden flex items-center justify-center p-4" onclick="closeChampionModal()"><div class="bg-white rounded-[3rem] p-10 text-center space-y-6 max-w-sm animate-in zoom-in duration-300" onclick="event.stopPropagation()"><div id="championContent"></div><button onclick="closeChampionModal()" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-black uppercase text-xs tracking-widest">Acknowledge</button></div></div>
    <div id="hIndexModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-50 hidden flex items-center justify-center p-4"><div class="bg-white rounded-[2.5rem] w-full max-w-md max-h-[80vh] flex flex-col animate-in slide-in-from-bottom duration-300 shadow-2xl overflow-hidden"><div class="p-6 border-b border-slate-50 flex items-center justify-between bg-slate-50/50"><h3 class="font-black uppercase text-sm tracking-widest">Power Elite</h3><button onclick="closeHIndexModal()" class="w-8 h-8 rounded-full bg-white border flex items-center justify-center text-slate-400 hover:text-slate-900 transition-all">✕</button></div><div id="hIndexContent" class="p-6 overflow-y-auto custom-scrollbar space-y-3"></div></div></div>
    <div id="gameHistoryModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-50 hidden flex items-center justify-center p-4"><div class="bg-white rounded-[2.5rem] w-full max-w-md max-h-[80vh] flex flex-col animate-in slide-in-from-bottom duration-300 shadow-2xl overflow-hidden"><div class="p-6 border-b border-slate-50 flex items-center justify-between bg-slate-50/50"><h3 id="gameHistoryTitle" class="font-black uppercase text-sm truncate tracking-widest"></h3><button onclick="closeGameHistoryModal()" class="w-8 h-8 rounded-full bg-white border flex items-center justify-center text-slate-400 hover:text-slate-900 transition-all">✕</button></div><div id="gameHistoryContent" class="p-6 overflow-y-auto custom-scrollbar space-y-3"></div></div></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, query, orderBy, where, Timestamp, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        let db; let bggUsername = localStorage.getItem('bgg_username') || 'sportomax';
        let allMatchups = []; let allGamesInCollection = []; let usedGameIds = new Set();
        let tournamentActive = false; let tournamentPairings = []; let pairingIndex = 0; let bracketState = null;
        let lastMatchupId = null; let lastWinner = null; let lastLoser = null; let dailyGroupingMode = 'day';
        let sessionMatchupCount = 0; let isProcessingSelection = false;
        const IMAGE_PROXY = 'https://images.weserv.nl/?url=';

        async function initFirebase() { try { const res = await fetch('/api/firebase-config'); const cfg = await res.json(); const app = initializeApp(cfg); db = getFirestore(app); return true; } catch (e) { return false; } }

        window.unlockApp = async () => {
            const pwd = document.getElementById('appPassword').value; const user = document.getElementById('bggUsernameInput').value.trim();
            const correct = await fetch('/api/get-password').then(r => r.text());
            if (pwd !== correct) { document.getElementById('passwordError').classList.remove('hidden'); return; }
            bggUsername = user || 'sportomax'; localStorage.setItem('bgg_username', bggUsername); localStorage.setItem('app_password_hint', pwd);
            if (await initFirebase()) { document.getElementById('usernameDisplay').textContent = bggUsername; document.getElementById('passwordScreen').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); await loadMatchupHistory(); await loadGames(); }
        };

        async function fetchBGG(endpoint, params = {}) { const q = new URLSearchParams(params).toString(); const url = `/api/bgg-helper?endpoint=${endpoint}&${q}`; try { const res = await fetch(url); if (res.status === 202) { await new Promise(r => setTimeout(r, 2000)); return fetchBGG(endpoint, params); } return await res.text(); } catch (e) { throw e; } }

        window.loadGames = async () => {
            document.getElementById('loading').classList.remove('hidden');
            try {
                const p = { username: bggUsername, stats: 1 }; if (document.getElementById('ownedOnly').checked) p.own = 1;
                const excExp = document.getElementById('excludeExpansions').checked; if (excExp) p.subtype = 'boardgame';
                const xml = await fetchBGG('collection', p); const d = new DOMParser().parseFromString(xml, 'text/xml');
                allGamesInCollection = Array.from(d.querySelectorAll('item')).map(i => ({ id: i.getAttribute('objectid'), name: i.querySelector('name').textContent, image: i.querySelector('thumbnail')?.textContent || i.querySelector('image')?.textContent || '', bggRating: parseFloat(i.querySelector('stats rating average')?.getAttribute('value') || 0) })).filter(i => i.image);
                nextPair(); document.getElementById('loading').classList.add('hidden');
            } catch (e) { document.getElementById('loading').classList.add('hidden'); }
        };

        async function loadMatchupHistory() { onSnapshot(query(collection(db, 'matchups'), orderBy('timestamp', 'desc')), (s) => { allMatchups = s.docs.map(d => ({ id: d.id, ...d.data() })); updateStats(); if (!document.getElementById('view-logs').classList.contains('hidden')) renderMatchupList(); if (!document.getElementById('view-stats').classList.contains('hidden')) loadStandings(); }); }

        function updateStats() {
            document.getElementById('totalMatchups').textContent = allMatchups.length;
            const uniq = new Set([...allMatchups.map(m => m.winnerId), ...allMatchups.map(m => m.loserId)]); document.getElementById('uniqueGames').textContent = uniq.size;
            const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 7); document.getElementById('thisWeekCount').textContent = allMatchups.filter(m => m.timestamp.toDate() > weekAgo).length;
            const counts = {}; allMatchups.forEach(m => { counts[m.winnerId] = (counts[m.winnerId] || 0) + 1; counts[m.loserId] = (counts[m.loserId] || 0) + 1; });
            const apps = Object.values(counts).sort((a,b) => b-a); let h = 0; for (let i = 0; i < apps.length; i++) { if (apps[i] >= i + 1) h = i + 1; else break; } document.getElementById('liveHIndex').textContent = h;
            const colors = { 0:'bg-slate-200', 1:'bg-blue-300', 2:'bg-blue-400', 3:'bg-blue-500', 4:'bg-indigo-500', 5:'bg-indigo-600', 6:'bg-purple-600', 7:'bg-purple-700', 8:'bg-pink-600', 9:'bg-red-600' };
            const dist = {}; uniq.forEach(id => { dist[counts[id]] = (dist[counts[id]] || 0) + 1; });
            document.getElementById('liveAppearanceDistribution').innerHTML = Object.keys(dist).sort((a,b) => b-a).map(c => `<div onclick="showHIndexGames(${c}, {}, allGamesInCollection)" class="${colors[c] || 'bg-red-900'} text-white w-8 h-8 rounded-lg text-[9px] font-black flex flex-col items-center justify-center cursor-pointer shadow-sm"><span>${c}</span><span class="text-[7px] opacity-70">${dist[c]}</span></div>`).join('');
        }

        function nextPair() {
            if (tournamentActive) { const p = tournamentPairings[pairingIndex]; if (p) { currentPair = p; displayPair(); } else showTournamentResults(); return; }
            const mode = document.getElementById('matchupMode').value; const avail = allGamesInCollection.filter(g => !usedGameIds.has(g.id));
            if (avail.length < 2) { usedGameIds.clear(); nextPair(); return; }
            if (mode === 'balanced-rating') avail.sort((a,b) => b.bggRating - a.bggRating);
            currentPair = { left: avail[0], right: avail[1] }; usedGameIds.add(avail[0].id); usedGameIds.add(avail[1].id); displayPair();
        }

        function displayPair() { document.getElementById('leftImage').src = currentPair.left.image; document.getElementById('leftName').textContent = currentPair.left.name; document.getElementById('rightImage').src = currentPair.right.image; document.getElementById('rightName').textContent = currentPair.right.name; }

        window.selectWinner = async (side) => {
            if (isProcessingSelection) return; isProcessingSelection = true;
            const w = side === 'left' ? currentPair.left : currentPair.right; const l = side === 'left' ? currentPair.right : currentPair.left;
            const card = document.querySelector(`.game-vote-card:nth-child(${side === 'left' ? 1 : 2})`); const ov = document.createElement('div');
            ov.className = 'absolute inset-0 bg-emerald-500/40 rounded-[2rem] flex items-center justify-center winner-overlay z-10'; ov.innerHTML = '<span class="text-4xl">🏆</span>'; card.appendChild(ov);
            try {
                const ref = await addDoc(collection(db, 'matchups'), { winnerId: w.id, winnerName: w.name, winnerImage: w.image, loserId: l.id, loserName: l.name, loserImage: l.image, timestamp: Timestamp.now(), username: bggUsername });
                lastMatchupId = ref.id; document.getElementById('undoButton').classList.remove('hidden');
                if (tournamentActive) recordResult(w.id); lastWinner = w; lastLoser = l; sessionMatchupCount++; document.getElementById('sessionCountBadge').textContent = `${sessionMatchupCount} Decisions`;
                setTimeout(() => { ov.remove(); nextPair(); isProcessingSelection = false; }, 600);
            } catch (e) { isProcessingSelection = false; }
        };

        window.undoMatchup = async () => { if (lastMatchupId) { await deleteDoc(doc(db, 'matchups', lastMatchupId)); lastMatchupId = null; document.getElementById('undoButton').classList.add('hidden'); sessionMatchupCount--; document.getElementById('sessionCountBadge').textContent = `${sessionMatchupCount} Decisions`; nextPair(); } };
        window.skipMatchup = () => nextPair();

        window.switchTab = (tab) => {
            ['matchup', 'tournament', 'stats', 'logs', 'settings'].forEach(t => { const v = document.getElementById(`view-${t}`); const b = document.getElementById(`tab-${t}`); v.classList.add('hidden'); b.classList.remove('tab-active', 'text-indigo-600'); b.classList.add('text-slate-400'); });
            document.getElementById(`view-${tab}`).classList.remove('hidden'); const bt = document.getElementById(`tab-${tab}`); bt.classList.add('tab-active', 'text-indigo-600'); bt.classList.remove('text-slate-400');
            if (tab === 'logs') { renderMatchupList(); loadDailyRecords(); } if (tab === 'stats') loadStandings();
        };

        window.startTournament = () => {
            const mode = document.getElementById('gameMode').value; if (mode === 'standard') { switchTab('matchup'); return; }
            tournamentActive = true; pairingIndex = 0; const sz = parseInt(document.getElementById('bracketSize').value);
            const fld = [...allGamesInCollection].sort(() => Math.random()-0.5).slice(0, sz);
            if (mode === 'bracket') { bracketState = { currentRound: 1, totalRounds: Math.log2(sz), rounds: { 1: [] } }; for (let i=0; i<sz/2; i++) bracketState.rounds[1].push({ left: fld[i], right: fld[sz-1-i], winner: null }); tournamentPairings = bracketState.rounds[1]; }
            else if (mode === 'roundrobin') { const sz = parseInt(document.getElementById('roundrobinSize').value); const fld = [...allGamesInCollection].slice(0, sz); roundRobinState = { allGames: fld, results: [] }; tournamentPairings = []; for (let i = 0; i < sz; i++) for (let j = i+1; j < sz; j++) tournamentPairings.push({ left: fld[i], right: fld[j] }); }
            switchTab('matchup'); nextPair();
        };

        function recordResult(wId) {
            const m = tournamentPairings[pairingIndex]; m.winner = m.left.id === wId ? m.left : m.right; pairingIndex++;
            if (pairingIndex >= tournamentPairings.length) {
                if (bracketState) {
                    const r = bracketState.currentRound; if (r === bracketState.totalRounds) { showChampionModal(m.winner); tournamentActive = false; }
                    else { const wns = bracketState.rounds[r].map(x => x.winner); bracketState.currentRound++; bracketState.rounds[r+1] = []; for (let i=0; i<wns.length; i+=2) bracketState.rounds[r+1].push({ left: wns[i], right: wns[i+1], winner: null }); tournamentPairings = bracketState.rounds[r+1]; pairingIndex = 0; }
                } else if (roundRobinState) { showTournamentResults(); }
            }
        }

        function loadStandings() {
            const s = {}; allMatchups.forEach(m => { [m.winnerId, m.loserId].forEach(id => { if (!s[id]) s[id] = { id, n: id === m.winnerId ? m.winnerName : m.loserName, img: id === m.winnerId ? m.winnerImage : m.loserImage, w: 0, l: 0 }; }); s[m.winnerId].w++; s[m.loserId].l++; });
            const list = Object.values(s).map(g => ({ ...g, elo: Math.round((g.w/(g.w+g.l || 1))*1000), winPct: g.w/(g.w+g.l || 1) })).sort((a,b) => b.elo - a.elo);
            const search = document.getElementById('searchStandings')?.value.toLowerCase();
            const filtered = search ? list.filter(x => x.n.toLowerCase().includes(search)) : list;
            document.getElementById('standingsList').innerHTML = filtered.map((g, i) => `<div onclick="showGameHistory('${g.id}', '${g.n.replace(/'/g,"\\'")}')" class="bg-white p-3 rounded-xl border flex items-center gap-4 cursor-pointer shadow-sm hover:shadow-md transition-all"><div class="text-[10px] font-black text-slate-200 w-6">#${i+1}</div><img src="${g.img}" class="list-img flex-shrink-0"><div class="flex-1 min-w-0"><div class="font-black text-[10px] text-slate-900 truncate uppercase">${g.n}</div><div class="text-[8px] font-black text-indigo-600 uppercase tracking-widest">${g.elo} ELO • ${g.w}W-${g.l}L</div></div><div class="text-[10px] font-black text-slate-900">${(g.winPct*100).toFixed(0)}%</div></div>`).join('');
        }

        function renderMatchupList() {
            document.getElementById('matchupList').innerHTML = allMatchups.slice(0, 30).map(m => `<div class="bg-white p-3 rounded-xl border flex items-center gap-4 shadow-sm"><div class="flex-1 min-w-0 space-y-1"><div class="flex items-center gap-2"><img src="${m.winnerImage}" class="list-img !w-6 !h-6"><span class="text-[9px] font-black text-slate-900 uppercase truncate tracking-tight">${m.winnerName}</span><span class="text-[8px] text-green-600 font-black uppercase ml-auto">Win</span></div><div class="flex items-center gap-2 opacity-40"><img src="${m.loserImage}" class="list-img !w-6 !h-6"><span class="text-[9px] font-black text-slate-900 uppercase truncate tracking-tight">${m.loserName}</span></div></div><div class="text-[8px] font-black text-slate-400 text-right uppercase border-l pl-3"><button onclick="deleteDoc(doc(db,'matchups','${m.id}'))" class="text-red-400 block mb-1">Delete</button>${m.timestamp.toDate().toLocaleDateString()}</div></div>`).join('');
        }

        window.loadDailyRecords = () => {
            const grouped = {}; allMatchups.forEach(m => { const d = m.timestamp.toDate(); let k = d.toISOString().split('T')[0]; if (dailyGroupingMode === 'week') { const dd = new Date(d); dd.setDate(d.getDate()-d.getDay()+1); k = dd.toISOString().split('T')[0]; } grouped[k] = (grouped[k] || 0) + 1; });
            const sorted = Object.keys(grouped).sort((a,b) => b.localeCompare(a));
            document.getElementById('dailyRecordsList').innerHTML = sorted.map(k => `<div class="bg-slate-50 rounded-xl p-4 flex items-center justify-between border border-slate-100"><div class="text-[9px] font-black text-slate-900 uppercase tracking-widest">${k}</div><div class="text-indigo-600 font-black text-xs">${grouped[k]} <span class="text-slate-400 text-[8px] uppercase">Records</span></div></div>`).join('');
        };

        window.setDailyGrouping = (m) => { dailyGroupingMode = m; ['day','week'].forEach(x => document.getElementById(`group-${x}`).className = x===m ? 'px-3 py-1.5 rounded-lg text-[9px] font-black uppercase bg-indigo-600 text-white shadow-sm' : 'px-3 py-1.5 rounded-lg text-[9px] font-black uppercase text-slate-400'); loadDailyRecords(); };

        window.showGameHistory = (id, n) => {
            const matches = allMatchups.filter(m => m.winnerId === id || m.loserId === id); document.getElementById('gameHistoryTitle').textContent = n;
            document.getElementById('gameHistoryContent').innerHTML = matches.map(m => `<div class="p-3 rounded-xl border flex items-center gap-3 ${m.winnerId === id ? 'bg-green-50 border-green-100' : 'bg-red-50 border-red-100'}"><img src="${m.winnerId === id ? m.loserImage : m.winnerImage}" class="list-img flex-shrink-0"><div class="flex-1 min-w-0"><div class="text-[8px] font-black uppercase ${m.winnerId === id ? 'text-green-600' : 'text-red-600'}">${m.winnerId === id ? 'Victory' : 'Defeat'}</div><div class="text-[10px] font-black text-slate-900 uppercase truncate">vs ${m.winnerId === id ? m.loserName : m.winnerName}</div></div></div>`).join('');
            document.getElementById('gameHistoryModal').classList.remove('hidden');
        };

        window.showHIndexGames = (h, _, all) => {
            const counts = {}; allMatchups.forEach(m => { counts[m.winnerId] = (counts[m.winnerId] || 0) + 1; counts[m.loserId] = (counts[m.loserId] || 0) + 1; });
            const list = all.filter(g => (counts[g.id] || 0) >= h).sort((a,b) => counts[b.id] - counts[a.id]);
            document.getElementById('hIndexContent').innerHTML = list.map(g => `<div class="flex items-center gap-4 p-3 rounded-xl bg-slate-50 border shadow-sm"><img src="${g.image}" class="list-img flex-shrink-0"><div class="font-black text-[10px] text-slate-900 uppercase truncate tracking-tight">${g.name}</div><div class="text-[9px] font-black text-indigo-600 ml-auto">${counts[g.id]} apps</div></div>`).join('');
            document.getElementById('hIndexModal').classList.remove('hidden');
        };

        window.exportRawData = () => { if (!allMatchups.length) return; const csv = ['Winner,WinnerID,Loser,LoserID,Date', ...allMatchups.map(m => `"${m.winnerName}","${m.winnerId}","${m.loserName}","${m.loserId}","${m.timestamp.toDate().toISOString()}"`)].join('\n'); const b = new Blob([csv], { type: 'text/csv' }); const u = URL.createObjectURL(b); const a = document.createElement('a'); a.href = u; a.download = `matchup_export_${Date.now()}.csv`; a.click(); };
        window.showChampionModal = (c) => { document.getElementById('championContent').innerHTML = `<img src="${c.image}" class="w-32 h-32 object-contain mx-auto rounded-2xl shadow-xl border-4 border-yellow-400 bg-white mb-4"><h2 class="text-xl font-black text-slate-900 uppercase tracking-tight">${c.name}</h2><p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-2">Tournament Champion</p>`; document.getElementById('championModal').classList.remove('hidden'); confetti(); };
        window.closeChampionModal = () => document.getElementById('championModal').classList.add('hidden');
        window.closeHIndexModal = () => document.getElementById('hIndexModal').classList.add('hidden');
        window.closeGameHistoryModal = () => document.getElementById('gameHistoryModal').classList.add('hidden');
        window.logout = () => { if(confirm('Exit Session?')) location.reload(); };
        window.resetSession = () => { sessionMatchupCount = 0; document.getElementById('sessionCountBadge').textContent = '0 Decisions'; };
        document.getElementById('searchStandings')?.addEventListener('input', loadStandings);
        function showTournamentResults() { tournamentActive = false; alert('Tournament Complete!'); }
        function updateTournamentProgress() { if (!tournamentActive) return; const p = document.getElementById('tournamentProgress'); p.textContent = `Match ${pairingIndex+1} of ${tournamentPairings.length}`; p.classList.remove('hidden'); }
    </script>
</body>
</html>
