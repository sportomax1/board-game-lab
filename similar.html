<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Similarity Analyzer | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🎲</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        :root {
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-dark {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .game-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .game-card:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .tab-btn {
            @apply flex-1 py-3 text-[10px] font-black uppercase tracking-widest transition-all border-b-2 border-transparent text-slate-500;
        }
        .tab-btn.active {
            @apply border-indigo-500 text-indigo-400 bg-indigo-500/5;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .input-dark {
            @apply bg-slate-900/50 border border-white/10 rounded-2xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all font-medium placeholder-slate-500;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in { animation: fadeIn 0.4s ease-out forwards; }

        .status-pill {
            @apply text-center p-3 rounded-2xl text-[10px] font-black uppercase tracking-widest mb-4 transition-all;
        }
        .status-pill.loading { @apply bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 animate-pulse; }
        .status-pill.success { @apply bg-emerald-500/20 text-emerald-400 border border-emerald-500/30; }
        .status-pill.error { @apply bg-rose-500/20 text-rose-400 border border-rose-500/30; }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        table { border-collapse: separate; border-spacing: 0; }
        th { @apply sticky top-0 bg-slate-900/90 backdrop-blur z-20 text-[8px] font-black uppercase tracking-widest text-slate-500 p-3 border-b border-white/10; }
        td { @apply p-3 border-b border-white/5 text-[10px] text-slate-300; }
        tr:hover td { @apply bg-white/5; }
    </style>
</head>
<body class="min-h-screen selection:bg-indigo-500/30">
    <!-- Background Decor -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-indigo-900/20 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[10%] right-[0%] w-[50%] h-[50%] bg-blue-900/10 blur-[120px] rounded-full"></div>
    </div>

    <div class="relative z-10 flex flex-col min-h-screen pt-safe">
        <!-- Header -->
        <header class="p-6 flex flex-col md:flex-row md:items-center justify-between gap-6 border-b border-white/5">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-indigo-500/20 rounded-2xl flex items-center justify-center border border-indigo-500/30">
                    <i data-lucide="layers" class="text-indigo-400 w-6 h-6"></i>
                </div>
                <div class="flex flex-col">
                    <h1 class="text-2xl font-black italic uppercase tracking-tighter leading-none text-white">Similarity <span class="text-indigo-400">Analyzer</span></h1>
                    <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-1 italic">Discover shared characteristics in your collection</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="openInfoModal()" class="glass w-10 h-10 rounded-xl flex items-center justify-center text-slate-400 hover:text-white transition-all">
                    <i data-lucide="info" class="w-5 h-5"></i>
                </button>
                <button onclick="openSettingsModal()" class="glass w-10 h-10 rounded-xl flex items-center justify-center text-slate-400 hover:text-white transition-all">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                </button>
                <a href="index.html" class="glass px-6 py-2 rounded-2xl border border-white/10 hover:bg-white/10 transition-all text-[10px] font-black uppercase tracking-widest flex items-center gap-2">Back</a>
            </div>
        </header>

        <!-- SETUP SECTION -->
        <div id="setupSection" class="flex-1 flex flex-col items-center justify-center p-6">
            <div class="glass max-w-sm w-full rounded-[2.5rem] p-8 shadow-2xl border-t border-white/20">
                <div class="space-y-6">
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">BGG Username</label>
                        <input type="text" id="username" value="sportomax" class="input-dark w-full" placeholder="Enter username">
                    </div>

                    <div class="flex items-center justify-between bg-white/5 p-4 rounded-2xl border border-white/10">
                        <div class="flex flex-col">
                            <span class="text-sm font-bold text-white italic tracking-tight">Ignore Expansions</span>
                            <span class="text-[10px] text-slate-500">Only compare base games</span>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="ignoreExpansions" class="sr-only peer" checked>
                            <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-500"></div>
                        </label>
                    </div>

                    <div id="setupStatus" class="status-pill hidden"></div>

                    <button onclick="analyzeCollection()" class="w-full btn-primary text-white py-4 rounded-2xl font-black text-lg uppercase tracking-tight hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2">
                        Analyze Now
                        <i data-lucide="zap" class="w-5 h-5 fill-current"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- RESULTS SECTION -->
        <div id="resultsSection" class="hidden flex-1 flex flex-col min-h-0">
            <!-- Stats Row -->
            <div id="statsSummary" class="p-6 grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3 border-b border-white/5 bg-black/20">
                <!-- Populated by JS -->
            </div>

            <!-- View Tabs -->
            <div class="flex border-b border-white/5 bg-black/10">
                <button onclick="switchView('games')" id="tab-games" class="tab-btn active">📋 By Game</button>
                <button onclick="switchView('similarities')" id="tab-similarities" class="tab-btn">🔗 By Similarity</button>
                <button onclick="switchView('table')" id="tab-table" class="tab-btn">📊 Comparison Matrix</button>
            </div>

            <main class="flex-1 min-h-0 overflow-hidden flex flex-col">
                <!-- Games View -->
                <div id="gamesView" class="view active flex flex-col h-full">
                    <div class="p-6 space-y-4 border-b border-white/5">
                        <div class="flex flex-col md:flex-row gap-4 items-center">
                            <div class="flex-1 w-full relative">
                                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 w-4 h-4"></i>
                                <input type="text" id="gamesSearch" onkeyup="filterGames()" class="input-dark w-full pl-12 py-3 text-sm rounded-xl" placeholder="Filter games...">
                            </div>
                            <div class="flex items-center gap-3 shrink-0">
                                <span class="text-[10px] font-black uppercase tracking-widest text-slate-500">Sort:</span>
                                <select id="gamesSortBy" onchange="sortGames()" class="bg-white/5 border border-white/10 rounded-xl px-4 py-2 text-[10px] font-black uppercase text-indigo-400 focus:outline-none outline-none">
                                    <option value="highest-desc">Highest Match ↓</option>
                                    <option value="highest-asc">Lowest Match ↑</option>
                                    <option value="matches-desc">Most Matches ↓</option>
                                    <option value="name-asc">Name A-Z</option>
                                    <option value="year-desc">Year (Newest)</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div id="gameGrid" class="flex-1 overflow-y-auto custom-scrollbar p-6 space-y-3"></div>
                </div>

                <!-- Similarities View -->
                <div id="similaritiesView" class="view hidden flex flex-col h-full p-6">
                    <div class="max-w-2xl mx-auto w-full space-y-6">
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Focus Game</label>
                            <select id="baseGameSearch" onchange="showSimilarities(this.value)" class="input-dark w-full"></select>
                        </div>
                        <div id="similarityResults" class="space-y-3 overflow-y-auto custom-scrollbar pr-2"></div>
                    </div>
                </div>

                <!-- Table View -->
                <div id="tableView" class="view hidden flex flex-col h-full">
                    <div class="p-6 border-b border-white/5">
                        <div class="relative max-w-md">
                            <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 w-4 h-4"></i>
                            <input type="text" id="tableSearch" onkeyup="filterTable()" class="input-dark w-full pl-12 py-3 text-sm rounded-xl" placeholder="Search matrix...">
                        </div>
                    </div>
                    <div id="comparisonTableContainer" class="flex-1 overflow-auto custom-scrollbar"></div>
                </div>
            </main>

            <!-- Bottom Actions -->
            <footer class="p-4 border-t border-white/5 bg-slate-950 flex justify-center pb-safe">
                <button onclick="resetAnalysis()" class="px-8 py-3 rounded-2xl glass border-white/10 text-[10px] font-black uppercase tracking-widest text-slate-400 hover:text-white transition-all">Reset Analysis</button>
            </footer>
        </div>
    </div>

    <!-- Modals -->
    <div id="infoModal" class="modal-overlay hidden" onclick="if(event.target===this) closeInfoModal()">
        <div class="glass max-w-sm w-full rounded-[2.5rem] p-8 border-t border-white/20">
            <h2 class="text-2xl font-black italic uppercase tracking-tighter text-white mb-6">Scoring <span class="text-indigo-400">Rules</span></h2>
            <div id="scoringInfoList" class="space-y-4 max-h-[60vh] overflow-y-auto custom-scrollbar pr-2"></div>
            <button onclick="closeInfoModal()" class="w-full mt-8 bg-white text-slate-900 py-4 rounded-2xl font-black text-sm uppercase tracking-widest">Got It!</button>
        </div>
    </div>

    <div id="settingsModal" class="modal-overlay hidden" onclick="if(event.target===this) closeSettingsModal()">
        <div class="glass max-w-lg w-full rounded-[2.5rem] p-8 border-t border-white/20 flex flex-col max-h-[90vh]">
            <header class="flex items-center justify-between mb-6 shrink-0">
                <h2 class="text-2xl font-black italic uppercase tracking-tighter text-white">Scoring <span class="text-indigo-400">Config</span></h2>
                <button onclick="closeSettingsModal()" class="w-10 h-10 glass rounded-xl flex items-center justify-center">✕</button>
            </header>
            <div id="scoringConfigContainer" class="flex-1 overflow-y-auto custom-scrollbar space-y-4 pr-2"></div>
            <div class="grid grid-cols-2 gap-3 mt-8 shrink-0">
                <button onclick="resetScoringDefaults()" class="py-4 rounded-2xl glass border-white/10 text-[10px] font-black uppercase tracking-widest text-slate-400">Defaults</button>
                <button onclick="saveScoringConfig()" class="py-4 rounded-2xl btn-primary text-white font-black text-[10px] uppercase tracking-widest">Apply & Run</button>
            </div>
        </div>
    </div>

    <div id="matchesModal" class="modal-overlay hidden" onclick="if(event.target===this) closeMatchesModal()">
        <div class="glass max-w-2xl w-full rounded-[2.5rem] p-8 border-t border-white/20 flex flex-col max-h-[85vh]">
            <header class="flex items-center gap-4 mb-6 shrink-0">
                <div class="w-12 h-12 bg-indigo-500/20 rounded-xl flex items-center justify-center border border-indigo-500/30">
                    <i data-lucide="link" class="text-indigo-400 w-6 h-6"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <h2 id="matchesModalTitle" class="text-lg font-black italic uppercase tracking-tighter text-white truncate leading-tight"></h2>
                    <p class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Similarity matches found</p>
                </div>
                <button onclick="closeMatchesModal()" class="w-10 h-10 glass rounded-xl flex items-center justify-center">✕</button>
            </header>
            <div id="matchesModalContent" class="flex-1 overflow-y-auto custom-scrollbar space-y-3 pr-2"></div>
            <div class="grid grid-cols-2 gap-3 mt-8 shrink-0">
                <button onclick="copyMatches()" class="py-4 rounded-2xl glass border-white/10 text-[10px] font-black uppercase tracking-widest text-slate-400">Copy Summary</button>
                <button onclick="shareMatches()" class="py-4 rounded-2xl btn-primary text-white font-black text-[10px] uppercase tracking-widest">Share List</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        let allGames = [];
        let gameDetails = {};
        let similarityMatrix = {};
        const IMAGE_PROXY = 'https://images.weserv.nl/?url=';

        const defaultScoringConfig = {
            'Year Published': { points: 1, description: 'Exact match', throttle: 0 },
            'Min Players': { points: 1, description: 'Exact match', throttle: 0 },
            'Max Players': { points: 1, description: 'Exact match', throttle: 0 },
            'Playing Time': { points: 1, description: 'Within 15 minutes', throttle: 0 },
            'Min Playtime': { points: 1, description: 'Within 10 minutes', throttle: 0 },
            'Max Playtime': { points: 1, description: 'Within 10 minutes', throttle: 0 },
            'Min Age': { points: 1, description: 'Within 2 years', throttle: 0 },
            'Categories': { points: 1, description: 'Per matching category', throttle: 0 },
            'Mechanics': { points: 1, description: 'Per matching mechanic', throttle: 0 },
            'Designers': { points: 1, description: 'Per matching designer', throttle: 0 },
            'Publishers': { points: 1, description: 'Per matching publisher', throttle: 0 },
            'Artists': { points: 1, description: 'Per matching artist', throttle: 0 }
        };

        let scoringConfig = { ...defaultScoringConfig };

        function loadScoringConfig() {
            const saved = localStorage.getItem('scoringConfigSimilar');
            if (saved) {
                try {
                    const loaded = JSON.parse(saved);
                    scoringConfig = { ...defaultScoringConfig, ...loaded };
                } catch (e) { scoringConfig = { ...defaultScoringConfig }; }
            }
            renderScoringConfig();
            renderScoringInfo();
        }

        function renderScoringConfig() {
            const container = document.getElementById('scoringConfigContainer');
            container.innerHTML = Object.entries(scoringConfig).map(([name, config]) => `
                <div class="glass-dark p-4 rounded-2xl border border-white/5 space-y-3">
                    <div class="flex justify-between items-start">
                        <div class="flex flex-col">
                            <span class="text-xs font-black text-white uppercase italic tracking-tight">${name}</span>
                            <span class="text-[9px] text-slate-500 uppercase tracking-widest">${config.description}</span>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="space-y-1">
                            <label class="text-[8px] font-black uppercase text-slate-600 ml-1">Points</label>
                            <input type="number" step="0.1" value="${config.points}" 
                                onchange="scoringConfig['${name}'].points = parseFloat(this.value)"
                                class="bg-black/40 border border-white/5 rounded-xl px-3 py-2 text-xs text-indigo-400 w-full focus:outline-none">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[8px] font-black uppercase text-slate-600 ml-1">Max Score</label>
                            <input type="number" step="0.1" value="${config.throttle}" 
                                onchange="scoringConfig['${name}'].throttle = parseFloat(this.value)"
                                class="bg-black/40 border border-white/5 rounded-xl px-3 py-2 text-xs text-indigo-400 w-full focus:outline-none"
                                placeholder="0 = No Max">
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderScoringInfo() {
            const container = document.getElementById('scoringInfoList');
            container.innerHTML = Object.entries(scoringConfig).map(([name, config]) => `
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-indigo-500/10 flex items-center justify-center text-indigo-400 font-black italic text-xs">${config.points}</div>
                    <div class="flex-1">
                        <p class="text-[10px] font-black text-white uppercase italic leading-tight">${name}</p>
                        <p class="text-[9px] text-slate-500 uppercase tracking-widest">${config.description}</p>
                    </div>
                </div>
            `).join('');
        }

        function saveScoringConfig() {
            localStorage.setItem('scoringConfigSimilar', JSON.stringify(scoringConfig));
            closeSettingsModal();
            if (Object.keys(gameDetails).length > 0) {
                updateStatus('Recalculating...', 'loading');
                setTimeout(() => {
                    calculateSimilarities();
                    displayResults();
                    updateStatus('Complete', 'success');
                }, 100);
            }
        }

        function resetScoringDefaults() {
            if (confirm('Reset to defaults?')) {
                scoringConfig = { ...defaultScoringConfig };
                renderScoringConfig();
            }
        }

        async function fetchWithRetry(url, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                const response = await fetch(url);
                if (response.status === 202) { await new Promise(r => setTimeout(r, 2000 * (i + 1))); continue; }
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.text();
            }
            throw new Error('Timeout');
        }

        async function analyzeCollection() {
            const username = document.getElementById('username').value.trim() || 'sportomax';
            const ignoreExpansions = document.getElementById('ignoreExpansions').checked;
            updateStatus('Fetching collection...', 'loading');

            try {
                const xmlText = await fetchWithRetry(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1`);
                const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
                
                if (doc.querySelector('errors error')) throw new Error('User not found');

                let items = Array.from(doc.querySelectorAll('item'));
                if (ignoreExpansions) items = items.filter(i => i.getAttribute('subtype') !== 'expansion');
                
                if (items.length === 0) throw new Error('No games found');

                allGames = items.map(item => ({
                    id: item.getAttribute('objectid'),
                    name: item.querySelector('name').textContent
                }));

                updateStatus(`Loading details for ${allGames.length} games...`, 'loading');
                await fetchGameDetails();
                
                updateStatus('Analyzing similarities...', 'loading');
                calculateSimilarities();

                displayResults();
                document.getElementById('setupSection').classList.add('hidden');
                document.getElementById('resultsSection').classList.remove('hidden');
                updateStatus('', '');
            } catch (error) { updateStatus(error.message, 'error'); }
        }

        async function fetchGameDetails() {
            const batchSize = 20;
            const parallelLimit = 50; // Total 1000 items in flight
            const batches = [];
            for (let i = 0; i < allGames.length; i += batchSize) batches.push(allGames.slice(i, i + batchSize));

            for (let i = 0; i < batches.length; i += parallelLimit) {
                const group = batches.slice(i, i + parallelLimit);
                updateStatus(`Loading details ${i * batchSize} - ${Math.min((i + parallelLimit) * batchSize, allGames.length)}...`, 'loading');

                await Promise.all(group.map(async batch => {
                    const ids = batch.map(g => g.id).join(',');
                    try {
                        const xmlText = await fetchWithRetry(`/api/bgg-helper?endpoint=thing&id=${ids}&stats=1`);
                        const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
                        
                        doc.querySelectorAll('item').forEach(item => {
                            const id = item.getAttribute('id');
                            gameDetails[id] = {
                                id, name: item.querySelector('name')?.getAttribute('value'),
                                yearPublished: parseInt(item.querySelector('yearpublished')?.getAttribute('value')) || 0,
                                minPlayers: parseInt(item.querySelector('minplayers')?.getAttribute('value')) || 0,
                                maxPlayers: parseInt(item.querySelector('maxplayers')?.getAttribute('value')) || 0,
                                playingTime: parseInt(item.querySelector('playingtime')?.getAttribute('value')) || 0,
                                minPlaytime: parseInt(item.querySelector('minplaytime')?.getAttribute('value')) || 0,
                                maxPlaytime: parseInt(item.querySelector('maxplaytime')?.getAttribute('value')) || 0,
                                minAge: parseInt(item.querySelector('minage')?.getAttribute('value')) || 0,
                                thumbnail: item.querySelector('thumbnail')?.textContent,
                                image: item.querySelector('image')?.textContent,
                                categories: Array.from(item.querySelectorAll('link[type="boardgamecategory"]')).map(l => l.getAttribute('value')),
                                mechanics: Array.from(item.querySelectorAll('link[type="boardgamemechanic"]')).map(l => l.getAttribute('value')),
                                designers: Array.from(item.querySelectorAll('link[type="boardgamedesigner"]')).map(l => l.getAttribute('value')),
                                publishers: Array.from(item.querySelectorAll('link[type="boardgamepublisher"]')).map(l => l.getAttribute('value')),
                                artists: Array.from(item.querySelectorAll('link[type="boardgameartist"]')).map(l => l.getAttribute('value')),
                                rating: parseFloat(item.querySelector('ratings > average')?.getAttribute('value')) || 0
                            };
                        });
                    } catch (e) { console.error(`Failed to fetch batch ${ids}`, e); }
                }));
                
                if (i + parallelLimit < batches.length) await new Promise(r => setTimeout(r, 500));
            }
        }

        function calculateSimilarities() {
            const ids = Object.keys(gameDetails);
            ids.forEach(id1 => {
                similarityMatrix[id1] = {};
                const g1 = gameDetails[id1];
                ids.forEach(id2 => {
                    if (id1 === id2) { similarityMatrix[id1][id2] = 0; return; }
                    const g2 = gameDetails[id2];
                    let score = 0;
                    const cfg = scoringConfig;

                    if (g1.yearPublished === g2.yearPublished && g1.yearPublished > 0) score += cfg['Year Published'].points;
                    if (g1.minPlayers === g2.minPlayers && g1.minPlayers > 0) score += cfg['Min Players'].points;
                    if (g1.maxPlayers === g2.maxPlayers && g1.maxPlayers > 0) score += cfg['Max Players'].points;
                    if (Math.abs(g1.playingTime - g2.playingTime) <= 15 && g1.playingTime > 0) score += cfg['Playing Time'].points;
                    if (Math.abs(g1.minPlaytime - g2.minPlaytime) <= 10 && g1.minPlaytime > 0) score += cfg['Min Playtime'].points;
                    if (Math.abs(g1.maxPlaytime - g2.maxPlaytime) <= 10 && g1.maxPlaytime > 0) score += cfg['Max Playtime'].points;
                    if (Math.abs(g1.minAge - g2.minAge) <= 2 && g1.minAge > 0) score += cfg['Min Age'].points;

                    const match = (list1, list2, config) => {
                        let pts = list1.filter(x => list2.includes(x)).length * config.points;
                        return config.throttle > 0 ? Math.min(pts, config.throttle) : pts;
                    };

                    score += match(g1.categories, g2.categories, cfg['Categories']);
                    score += match(g1.mechanics, g2.mechanics, cfg['Mechanics']);
                    score += match(g1.designers, g2.designers, cfg['Designers']);
                    score += match(g1.publishers, g2.publishers, cfg['Publishers']);
                    score += match(g1.artists, g2.artists, cfg['Artists']);

                    similarityMatrix[id1][id2] = parseFloat(score.toFixed(1));
                });
            });
        }

        function displayResults() {
            displayStats();
            displayGames();
            displayComparisonTable();
            
            const dropdown = document.getElementById('baseGameSearch');
            dropdown.innerHTML = '<option value="">-- Select Game --</option>' + 
                Object.values(gameDetails).sort((a,b)=>a.name.localeCompare(b.name)).map(g => `<option value="${g.id}">${g.name}</option>`).join('');
        }

        function displayStats() {
            const details = Object.values(gameDetails);
            const total = details.length;
            const cats = new Set(details.flatMap(g => g.categories)).size;
            const mechs = new Set(details.flatMap(g => g.mechanics)).size;
            const des = new Set(details.flatMap(g => g.designers)).size;
            
            const create = (lbl, val, icon) => `
                <div class="glass p-3 rounded-2xl border border-white/5 flex flex-col items-center text-center">
                    <span class="text-[7px] font-black uppercase tracking-widest text-slate-500 mb-1 flex items-center gap-1">
                        <i data-lucide="${icon}" class="w-2 h-2"></i> ${lbl}
                    </span>
                    <span class="text-sm font-black text-white italic leading-none">${val}</span>
                </div>
            `;

            document.getElementById('statsSummary').innerHTML = 
                create('Games', total, 'box') + create('Categories', cats, 'tag') + 
                create('Mechanics', mechs, 'settings') + create('Designers', des, 'pen-tool') +
                create('Artists', new Set(details.flatMap(g => g.artists)).size, 'palette');
            
            lucide.createIcons();
        }

        function displayGames() {
            const container = document.getElementById('gameGrid');
            const data = Object.keys(gameDetails).map(id => {
                const similarities = similarityMatrix[id];
                const scores = Object.values(similarities);
                return { 
                    id, game: gameDetails[id], 
                    highest: Math.max(...scores),
                    matches: scores.filter(s => s > 0).length
                };
            }).sort((a,b) => b.highest - a.highest);

            container.innerHTML = data.map(item => `
                <div class="game-card glass rounded-3xl p-4 border border-white/5 flex items-center gap-4 cursor-pointer animate-in" 
                     data-name="${item.game.name.toLowerCase()}" data-highest="${item.highest}" data-matches="${item.matches}"
                     onclick="openMatchesModal('${item.id}')">
                    <div class="w-14 h-14 rounded-2xl bg-black/40 border border-white/5 p-1 shrink-0 overflow-hidden">
                        <img src="${IMAGE_PROXY}${encodeURIComponent(item.game.thumbnail)}" class="w-full h-full object-contain rounded-xl">
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="text-xs font-black text-white italic uppercase tracking-tighter truncate leading-tight">${item.game.name}</div>
                        <div class="flex gap-3 mt-1">
                            <div class="text-[8px] font-bold text-slate-500 uppercase tracking-widest">Year: <span class="text-slate-300 font-mono">${item.game.yearPublished}</span></div>
                            <div class="text-[8px] font-bold text-slate-500 uppercase tracking-widest">Players: <span class="text-slate-300 font-mono">${item.game.minPlayers}-${item.game.maxPlayers}</span></div>
                        </div>
                    </div>
                    <div class="flex flex-col items-end shrink-0">
                        <div class="bg-indigo-500/10 border border-indigo-500/30 px-3 py-1 rounded-xl text-center">
                            <div class="text-[7px] font-black uppercase text-indigo-400 leading-none mb-0.5">Top</div>
                            <div class="text-lg font-black text-indigo-400 italic leading-none">${item.highest}</div>
                        </div>
                        <div class="text-[8px] font-bold text-slate-600 uppercase tracking-widest mt-1">${item.matches} Links</div>
                    </div>
                </div>
            `).join('');
        }

        function showSimilarities(id) {
            const res = document.getElementById('similarityResults');
            if(!id) { res.innerHTML = ''; return; }
            
            const scores = Object.entries(similarityMatrix[id])
                .filter(([, s]) => s > 0).sort(([, a], [, b]) => b - a).slice(0, 30);

            res.innerHTML = scores.map(([mid, score]) => {
                const g = gameDetails[mid];
                return `
                    <div class="glass-dark p-3 rounded-2xl border border-white/5 flex items-center gap-4 animate-in">
                        <div class="w-10 h-10 rounded-lg overflow-hidden shrink-0">
                            <img src="${IMAGE_PROXY}${encodeURIComponent(g.thumbnail)}" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="text-[10px] font-black text-white uppercase italic truncate">${g.name}</div>
                            <div class="text-[8px] font-bold text-slate-500 uppercase tracking-widest">Rating: ${g.rating.toFixed(1)}</div>
                        </div>
                        <div class="text-sm font-black text-indigo-400 italic">${score}</div>
                    </div>
                `;
            }).join('');
        }

        function displayComparisonTable() {
            const container = document.getElementById('comparisonTableContainer');
            const ids = Object.keys(gameDetails).sort((a,b) => gameDetails[a].name.localeCompare(gameDetails[b].name));
            
            const rows = ids.map(id => {
                const g = gameDetails[id];
                return `
                    <tr data-search="${g.name.toLowerCase()}">
                        <td class="sticky left-0 bg-slate-900/90 backdrop-blur z-10 font-black italic uppercase tracking-tighter text-indigo-400">${g.name}</td>
                        <td class="font-mono">${g.yearPublished}</td>
                        <td class="font-mono">${g.minPlayers}-${g.maxPlayers}</td>
                        <td class="font-mono">${g.playingTime}m</td>
                        <td class="font-mono">${g.minAge}+</td>
                        <td>${g.categories.slice(0,2).join(', ')}</td>
                        <td>${g.mechanics.slice(0,2).join(', ')}</td>
                        <td>${g.designers[0] || '-'}</td>
                        <td class="font-mono text-emerald-400">${g.rating.toFixed(1)}</td>
                    </tr>
                `;
            }).join('');

            container.innerHTML = `
                <table class="w-full text-left">
                    <thead>
                        <tr>
                            <th class="sticky left-0 z-30">Game</th>
                            <th>Year</th><th>Players</th><th>Time</th><th>Age</th>
                            <th>Categories</th><th>Mechanics</th><th>Designer</th><th>Rating</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        function openMatchesModal(id) {
            const g = gameDetails[id];
            document.getElementById('matchesModalTitle').textContent = g.name;
            
            const scores = Object.entries(similarityMatrix[id])
                .filter(([, s]) => s > 0).sort(([, a], [, b]) => b - a).slice(0, 50);

            document.getElementById('matchesModalContent').innerHTML = scores.map(([mid, score]) => {
                const other = gameDetails[mid];
                const matches = getMatchingFields(g, other);
                return `
                    <div class="glass-dark p-4 rounded-3xl border border-white/5 space-y-4 animate-in">
                        <div class="flex items-center gap-4">
                            <div class="w-16 h-20 rounded-xl overflow-hidden shrink-0 border border-white/5">
                                <img src="${IMAGE_PROXY}${encodeURIComponent(other.thumbnail)}" class="w-full h-full object-cover">
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="text-sm font-black text-white italic uppercase tracking-tighter truncate">${other.name}</div>
                                <div class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mt-1">${other.yearPublished} • ${other.minPlayers}-${other.maxPlayers}p</div>
                                <div class="mt-3 flex flex-wrap gap-1.5">
                                    ${matches.map(m => `<span class="bg-indigo-500/10 text-indigo-400 text-[7px] font-black uppercase px-2 py-0.5 rounded-lg border border-indigo-500/20">${m.field}</span>`).join('')}
                                </div>
                            </div>
                            <div class="text-2xl font-black text-indigo-400 italic shrink-0">${score}</div>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('matchesModal').classList.remove('hidden');
            
            // For share/copy
            currentMatchesData = {
                title: `Similar to ${g.name}`,
                text: `Similar Games to ${g.name}:\n` + scores.map(([mid, s], i) => `${i+1}. ${gameDetails[mid].name} (${s} pts)`).join('\n')
            };
        }

        function getMatchingFields(g1, g2) {
            const matches = [];
            if (g1.yearPublished === g2.yearPublished && g1.yearPublished > 0) matches.push({field:'Year'});
            if (g1.minPlayers === g2.minPlayers) matches.push({field:'Min Players'});
            if (g1.maxPlayers === g2.maxPlayers) matches.push({field:'Max Players'});
            if (Math.abs(g1.playingTime - g2.playingTime) <= 15) matches.push({field:'Time'});
            g1.categories.filter(c => g2.categories.includes(c)).forEach(() => matches.push({field:'Category'}));
            g1.mechanics.filter(m => g2.mechanics.includes(m)).forEach(() => matches.push({field:'Mechanic'}));
            return matches;
        }

        function switchView(view) {
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`${view}View`).classList.remove('hidden');
            document.getElementById(`tab-${view}`).classList.add('active');
        }

        function filterGames() {
            const q = document.getElementById('gamesSearch').value.toLowerCase();
            document.querySelectorAll('#gameGrid .game-card').forEach(c => c.style.display = c.dataset.name.includes(q) ? 'flex' : 'none');
        }

        function filterTable() {
            const q = document.getElementById('tableSearch').value.toLowerCase();
            document.querySelectorAll('#comparisonTableContainer tbody tr').forEach(r => r.style.display = r.dataset.search.includes(q) ? '' : 'none');
        }

        function sortGames() {
            const by = document.getElementById('gamesSortBy').value;
            const container = document.getElementById('gameGrid');
            const cards = Array.from(container.children);
            cards.sort((a,b) => {
                if(by === 'highest-desc') return b.dataset.highest - a.highest;
                if(by === 'highest-asc') return a.dataset.highest - b.highest;
                if(by === 'matches-desc') return b.dataset.matches - a.matches;
                if(by === 'name-asc') return a.dataset.name.localeCompare(b.dataset.name);
                return 0;
            });
            cards.forEach(c => container.appendChild(c));
        }

        let currentMatchesData = null;
        function shareMatches() { if(navigator.share) navigator.share(currentMatchesData); else copyMatches(); }
        function copyMatches() { navigator.clipboard.writeText(currentMatchesData.text); alert('Copied!'); }

        function updateStatus(msg, type) {
            const el = document.getElementById('setupStatus');
            if(!msg) { el.classList.add('hidden'); return; }
            el.textContent = msg; el.className = `status-pill ${type}`; el.classList.remove('hidden');
        }

        function resetAnalysis() { location.reload(); }
        function openInfoModal() { document.getElementById('infoModal').classList.remove('hidden'); }
        function closeInfoModal() { document.getElementById('infoModal').classList.add('hidden'); }
        function openSettingsModal() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function closeSettingsModal() { document.getElementById('settingsModal').classList.add('hidden'); }
        function closeMatchesModal() { document.getElementById('matchesModal').classList.add('hidden'); }

        loadScoringConfig();
    </script>
    <script type="module" src="analytics-init.js"></script>
</body>
</html>
