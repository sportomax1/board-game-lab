<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Similarity Analyzer | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🎲</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0b1120;
            --surface: #111827;
            --surface2: #1a2236;
            --surface3: #1e2d44;
            --border: rgba(255,255,255,0.07);
            --border-hover: rgba(255,255,255,0.15);
            --text: #f1f5f9;
            --text2: #cbd5e1;
            --muted: #64748b;
            --muted2: #94a3b8;
            --accent: #6366f1;
            --accent-dark: #4f46e5;
            --accent-glow: rgba(99,102,241,0.25);
            --green: #10b981;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            -webkit-tap-highlight-color: transparent;
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        /* ── Layout ── */
        .app-shell { display: flex; flex-direction: column; min-height: 100dvh; }

        /* ── Header ── */
        header.main-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border-radius: 11px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .brand-text h1 {
            font-size: 16px; font-weight: 800;
            letter-spacing: -0.5px; line-height: 1.1;
            text-transform: uppercase; font-style: italic;
            color: var(--text);
        }
        .brand-text h1 span { color: var(--accent); }
        .brand-text p {
            font-size: 10px; font-weight: 600;
            color: var(--muted); margin-top: 2px;
            letter-spacing: 0.04em;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 6px;
            padding: 9px 16px;
            border-radius: 10px;
            font-size: 11px; font-weight: 700;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s, transform 0.1s, background 0.2s;
            font-family: inherit;
            letter-spacing: 0.02em;
            text-decoration: none;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: #fff;
            box-shadow: 0 3px 10px var(--accent-glow);
        }
        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-ghost {
            background: var(--surface2);
            color: var(--muted2);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { color: var(--text); border-color: var(--border-hover); }
        .btn-icon {
            width: 36px; height: 36px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 9px;
            color: var(--muted2);
            padding: 0;
            font-size: 15px;
        }
        .btn-icon:hover { color: var(--text); border-color: var(--border-hover); }

        /* ── Setup Section ── */
        #setupSection {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .setup-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        .form-label {
            display: block;
            font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.1em;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 11px 14px;
            font-size: 14px; font-weight: 500;
            color: var(--text);
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-input::placeholder { color: var(--muted); }
        .form-input:focus { border-color: var(--accent); }

        .toggle-row {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .toggle-row-text strong {
            display: block;
            font-size: 13px; font-weight: 700;
            color: var(--text);
        }
        .toggle-row-text small {
            font-size: 11px; color: var(--muted);
            margin-top: 2px; display: block;
        }

        /* Toggle switch */
        .toggle-wrap { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
        .toggle-wrap input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute; inset: 0;
            background: var(--surface3);
            border-radius: 24px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .toggle-slider::after {
            content: '';
            position: absolute;
            top: 3px; left: 3px;
            width: 18px; height: 18px;
            border-radius: 50%;
            background: #fff;
            transition: transform 0.2s;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }
        .toggle-wrap input:checked + .toggle-slider { background: var(--accent); }
        .toggle-wrap input:checked + .toggle-slider::after { transform: translateX(20px); }

        /* Status pill */
        .status-pill {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 12px; font-weight: 700;
            text-align: center;
            display: none;
        }
        .status-pill.loading {
            background: rgba(99,102,241,0.12);
            color: #a5b4fc;
            border: 1px solid rgba(99,102,241,0.3);
            display: block;
            animation: pulse 1.5s infinite;
        }
        .status-pill.success {
            background: rgba(16,185,129,0.12);
            color: #6ee7b7;
            border: 1px solid rgba(16,185,129,0.3);
            display: block;
        }
        .status-pill.error {
            background: rgba(239,68,68,0.12);
            color: #fca5a5;
            border: 1px solid rgba(239,68,68,0.3);
            display: block;
        }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

        /* ── Results Section ── */
        #resultsSection {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* Stats Row */
        .stats-row {
            padding: 16px 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border);
            background: rgba(0,0,0,0.2);
        }
        .stat-chip {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
        }
        .stat-chip-label {
            font-size: 10px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.08em;
            color: var(--muted);
            margin-bottom: 4px;
        }
        .stat-chip-val {
            font-size: 18px; font-weight: 900;
            font-style: italic;
            color: var(--text);
            line-height: 1;
        }

        /* Tabs */
        .view-tabs {
            display: flex;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .tab-btn {
            flex: 1;
            padding: 13px 8px;
            font-size: 11px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.06em;
            color: var(--muted);
            background: none; border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s, background 0.2s;
        }
        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            background: rgba(99,102,241,0.04);
        }
        .tab-btn:hover:not(.active) { color: var(--text2); }

        /* View containers */
        .view { display: none; flex: 1; flex-direction: column; min-height: 0; overflow: hidden; }
        .view.active { display: flex; }

        main.results-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        /* Toolbar */
        .toolbar {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .toolbar-input {
            flex: 1;
            min-width: 160px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 9px 12px;
            font-size: 13px; font-weight: 400;
            color: var(--text);
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .toolbar-input::placeholder { color: var(--muted); }
        .toolbar-input:focus { border-color: var(--accent); }

        .toolbar-label {
            font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.08em;
            color: var(--muted);
            white-space: nowrap;
        }

        .toolbar-select {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 9px 12px;
            font-size: 12px; font-weight: 600;
            color: var(--accent);
            font-family: inherit;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .toolbar-select:focus { border-color: var(--accent); }

        /* Scroll area */
        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }

        /* ── Game Cards (By Game view) ── */
        .game-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .game-card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s, transform 0.15s;
        }
        .game-card:hover {
            border-color: rgba(99,102,241,0.4);
            background: rgba(99,102,241,0.05);
            transform: translateY(-1px);
        }
        .game-card:active { transform: scale(0.99); }

        .game-thumb {
            width: 64px; height: 64px;
            border-radius: 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            overflow: hidden;
            flex-shrink: 0;
        }
        .game-thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }

        .game-info { flex: 1; min-width: 0; }
        .game-name {
            font-size: 13px; font-weight: 800;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: -0.3px;
            color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            line-height: 1.2;
        }
        .game-meta {
            display: flex;
            gap: 12px;
            margin-top: 5px;
            flex-wrap: wrap;
        }
        .game-meta-item {
            font-size: 11px; font-weight: 600;
            color: var(--muted);
        }
        .game-meta-item span { color: var(--text2); }

        .game-score-wrap {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        .score-badge {
            background: rgba(99,102,241,0.12);
            border: 1px solid rgba(99,102,241,0.25);
            border-radius: 10px;
            padding: 6px 12px;
            text-align: center;
        }
        .score-badge-label {
            font-size: 9px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.1em;
            color: var(--accent);
            opacity: 0.7;
            line-height: 1;
            margin-bottom: 2px;
        }
        .score-badge-val {
            font-size: 22px; font-weight: 900;
            font-style: italic;
            color: var(--accent);
            line-height: 1;
        }
        .score-links {
            font-size: 11px; font-weight: 600;
            color: var(--muted);
        }

        /* ── Similarities View ── */
        .sim-wrap {
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .sim-card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .sim-thumb {
            width: 48px; height: 48px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
            background: var(--bg);
            border: 1px solid var(--border);
        }
        .sim-thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
        .sim-name {
            font-size: 13px; font-weight: 700;
            font-style: italic;
            text-transform: uppercase;
            color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .sim-rating { font-size: 11px; color: var(--muted); margin-top: 3px; }
        .sim-score {
            font-size: 22px; font-weight: 900;
            font-style: italic;
            color: var(--accent);
            flex-shrink: 0;
        }

        /* ── Table View ── */
        .table-wrap {
            flex: 1;
            overflow: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 12px;
        }
        thead th {
            position: sticky;
            top: 0;
            background: var(--surface);
            z-index: 20;
            padding: 11px 14px;
            font-size: 10px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.08em;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
            text-align: left;
        }
        thead th.sticky-col {
            left: 0;
            z-index: 30;
        }
        tbody td {
            padding: 11px 14px;
            border-bottom: 1px solid var(--border);
            color: var(--text2);
            vertical-align: middle;
            white-space: nowrap;
        }
        tbody tr:hover td { background: rgba(255,255,255,0.03); }
        td.sticky-col {
            position: sticky;
            left: 0;
            background: var(--surface);
            z-index: 10;
            font-weight: 800;
            font-style: italic;
            color: var(--accent);
            font-size: 12px;
        }
        tbody tr:hover td.sticky-col { background: var(--surface2); }
        td.td-mono { font-family: 'Inter', monospace; font-variant-numeric: tabular-nums; }
        td.td-green { color: var(--green); font-weight: 700; }

        /* ── Footer ── */
        .results-footer {
            padding: 12px 20px;
            border-top: 1px solid var(--border);
            background: var(--surface);
            display: flex;
            justify-content: center;
            flex-shrink: 0;
        }

        /* ── Modals ── */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(11,17,32,0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-overlay.hidden { display: none; }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
            overflow: hidden;
        }
        .modal-sm { max-width: 400px; }
        .modal-md { max-width: 500px; }
        .modal-lg { max-width: 680px; }

        .modal-header {
            padding: 20px 24px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .modal-title {
            font-size: 16px; font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: -0.3px;
            flex: 1; min-width: 0;
        }
        .modal-title span { color: var(--accent); }
        .modal-subtitle {
            font-size: 10px; font-weight: 600;
            color: var(--muted);
            margin-top: 2px;
            text-transform: uppercase; letter-spacing: 0.08em;
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }
        .modal-footer .btn { flex: 1; justify-content: center; padding: 12px; font-size: 12px; }

        /* Matches modal icon */
        .modal-icon {
            width: 40px; height: 40px;
            background: rgba(99,102,241,0.12);
            border: 1px solid rgba(99,102,241,0.25);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        /* Match cards in modal */
        .match-card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 10px;
        }
        .match-thumb {
            width: 56px; height: 72px;
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
            background: var(--bg);
            border: 1px solid var(--border);
        }
        .match-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .match-name {
            font-size: 13px; font-weight: 800;
            font-style: italic;
            text-transform: uppercase;
            color: var(--text);
            line-height: 1.2;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .match-sub {
            font-size: 11px; color: var(--muted); margin-top: 4px;
        }
        .match-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 8px;
        }
        .match-tag {
            background: rgba(99,102,241,0.1);
            border: 1px solid rgba(99,102,241,0.2);
            color: #a5b4fc;
            font-size: 10px; font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase; letter-spacing: 0.04em;
        }
        .match-score {
            font-size: 26px; font-weight: 900;
            font-style: italic;
            color: var(--accent);
            flex-shrink: 0;
            align-self: center;
        }

        /* Scoring config */
        .config-row {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
        }
        .config-row-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .config-name {
            font-size: 13px; font-weight: 800;
            font-style: italic;
            text-transform: uppercase;
            color: var(--text);
        }
        .config-desc {
            font-size: 11px; color: var(--muted); margin-top: 2px;
        }
        .config-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .config-field-label {
            font-size: 10px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.08em;
            color: var(--muted);
            margin-bottom: 4px;
        }
        .config-input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 13px;
            color: var(--accent);
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .config-input:focus { border-color: var(--accent); }

        /* Scoring info */
        .info-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .info-row:last-child { border-bottom: none; }
        .info-pts {
            width: 36px; height: 36px;
            background: rgba(99,102,241,0.1);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 900;
            font-style: italic;
            color: var(--accent);
            flex-shrink: 0;
        }
        .info-name {
            font-size: 13px; font-weight: 700;
            text-transform: uppercase;
            color: var(--text);
        }
        .info-desc {
            font-size: 11px; color: var(--muted); margin-top: 2px;
        }

        /* Bg decor */
        .bg-decor {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 0; overflow: hidden;
        }
        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body>
    <div class="bg-decor">
        <div class="bg-blob" style="top:-10%;left:-10%;width:40%;height:40%;background:rgba(99,102,241,0.07)"></div>
        <div class="bg-blob" style="bottom:5%;right:-5%;width:45%;height:45%;background:rgba(59,130,246,0.05)"></div>
    </div>

    <div class="app-shell" style="position:relative;z-index:1">
        <header class="main-header">
            <div class="brand">
                <div class="brand-icon">🎲</div>
                <div class="brand-text">
                    <h1>Similarity <span>Analyzer</span></h1>
                    <p>Discover shared characteristics in your collection</p>
                </div>
            </div>
            <div class="header-actions">
                <button onclick="openInfoModal()" class="btn btn-icon" title="Scoring Rules">ℹ️</button>
                <button onclick="openSettingsModal()" class="btn btn-icon" title="Scoring Config">⚙️</button>
                <a href="index.html" class="btn btn-ghost">← Back</a>
            </div>
        </header>

        <!-- SETUP SECTION -->
        <div id="setupSection">
            <div class="setup-card">
                <div style="display:flex;flex-direction:column;gap:20px">
                    <div>
                        <label class="form-label" for="username">BGG Username</label>
                        <input type="text" id="username" value="sportomax" class="form-input" placeholder="Enter username">
                    </div>

                    <div class="toggle-row">
                        <div class="toggle-row-text">
                            <strong>Ignore Expansions</strong>
                            <small>Only compare base games</small>
                        </div>
                        <label class="toggle-wrap">
                            <input type="checkbox" id="ignoreExpansions" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>

                    <div id="setupStatus" class="status-pill"></div>

                    <button onclick="analyzeCollection()" class="btn btn-primary" style="width:100%;padding:14px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em">
                        Analyze Now ⚡
                    </button>
                </div>
            </div>
        </div>

        <!-- RESULTS SECTION -->
        <div id="resultsSection" class="hidden" style="flex:1;display:none;flex-direction:column;min-height:0">
            <div id="statsSummary" class="stats-row"></div>

            <div class="view-tabs">
                <button onclick="switchView('games')" id="tab-games" class="tab-btn active">📋 By Game</button>
                <button onclick="switchView('similarities')" id="tab-similarities" class="tab-btn">🔗 By Similarity</button>
                <button onclick="switchView('table')" id="tab-table" class="tab-btn">📊 Matrix</button>
            </div>

            <main class="results-main">
                <!-- Games View -->
                <div id="gamesView" class="view active">
                    <div class="toolbar">
                        <input type="text" id="gamesSearch" onkeyup="filterGames()" class="toolbar-input" placeholder="Filter games…">
                        <span class="toolbar-label">Sort:</span>
                        <select id="gamesSortBy" onchange="sortGames()" class="toolbar-select">
                            <option value="highest-desc">Highest Match ↓</option>
                            <option value="highest-asc">Lowest Match ↑</option>
                            <option value="matches-desc">Most Matches ↓</option>
                            <option value="name-asc">Name A–Z</option>
                            <option value="year-desc">Year (Newest)</option>
                        </select>
                    </div>
                    <div class="scroll-area">
                        <div id="gameGrid" class="game-list"></div>
                    </div>
                </div>

                <!-- Similarities View -->
                <div id="similaritiesView" class="view">
                    <div class="toolbar">
                        <div style="flex:1">
                            <label class="form-label" for="baseGameSearch" style="margin-bottom:4px">Focus Game</label>
                            <select id="baseGameSearch" onchange="showSimilarities(this.value)" class="form-input" style="font-size:13px;padding:9px 12px"></select>
                        </div>
                    </div>
                    <div class="scroll-area">
                        <div id="similarityResults" class="sim-wrap"></div>
                    </div>
                </div>

                <!-- Table View -->
                <div id="tableView" class="view">
                    <div class="toolbar">
                        <input type="text" id="tableSearch" onkeyup="filterTable()" class="toolbar-input" placeholder="Search matrix…">
                    </div>
                    <div class="table-wrap" id="comparisonTableContainer"></div>
                </div>
            </main>

            <footer class="results-footer">
                <button onclick="resetAnalysis()" class="btn btn-ghost">Reset Analysis</button>
            </footer>
        </div>
    </div>

    <!-- Info Modal -->
    <div id="infoModal" class="modal-overlay hidden" onclick="if(event.target===this) closeInfoModal()">
        <div class="modal modal-sm">
            <div class="modal-header">
                <div class="modal-title">Scoring <span>Rules</span></div>
            </div>
            <div class="modal-body" id="scoringInfoList"></div>
            <div class="modal-footer">
                <button onclick="closeInfoModal()" class="btn btn-primary">Got It</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal-overlay hidden" onclick="if(event.target===this) closeSettingsModal()">
        <div class="modal modal-md">
            <div class="modal-header">
                <div style="flex:1">
                    <div class="modal-title">Scoring <span>Config</span></div>
                </div>
                <button onclick="closeSettingsModal()" class="btn btn-ghost" style="width:36px;height:36px;padding:0">✕</button>
            </div>
            <div class="modal-body" id="scoringConfigContainer"></div>
            <div class="modal-footer">
                <button onclick="resetScoringDefaults()" class="btn btn-ghost">Defaults</button>
                <button onclick="saveScoringConfig()" class="btn btn-primary">Apply & Run</button>
            </div>
        </div>
    </div>

    <!-- Matches Modal -->
    <div id="matchesModal" class="modal-overlay hidden" onclick="if(event.target===this) closeMatchesModal()">
        <div class="modal modal-lg">
            <div class="modal-header">
                <div class="modal-icon">🔗</div>
                <div style="flex:1;min-width:0">
                    <div id="matchesModalTitle" class="modal-title" style="font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
                    <div class="modal-subtitle">Similarity matches found</div>
                </div>
                <button onclick="closeMatchesModal()" class="btn btn-ghost" style="width:36px;height:36px;padding:0;flex-shrink:0">✕</button>
            </div>
            <div class="modal-body" id="matchesModalContent"></div>
            <div class="modal-footer">
                <button onclick="copyMatches()" class="btn btn-ghost">Copy Summary</button>
                <button onclick="shareMatches()" class="btn btn-primary">Share List</button>
            </div>
        </div>
    </div>

    <script>
        let allGames = [];
        let gameDetails = {};
        let similarityMatrix = {};
        const IMAGE_PROXY = 'https://images.weserv.nl/?url=';

        const defaultScoringConfig = {
            'Year Published': { points: 1, description: 'Exact match', throttle: 0 },
            'Min Players': { points: 1, description: 'Exact match', throttle: 0 },
            'Max Players': { points: 1, description: 'Exact match', throttle: 0 },
            'Playing Time': { points: 1, description: 'Within 15 minutes', throttle: 0 },
            'Min Playtime': { points: 1, description: 'Within 10 minutes', throttle: 0 },
            'Max Playtime': { points: 1, description: 'Within 10 minutes', throttle: 0 },
            'Min Age': { points: 1, description: 'Within 2 years', throttle: 0 },
            'Categories': { points: 1, description: 'Per matching category', throttle: 0 },
            'Mechanics': { points: 1, description: 'Per matching mechanic', throttle: 0 },
            'Designers': { points: 1, description: 'Per matching designer', throttle: 0 },
            'Publishers': { points: 1, description: 'Per matching publisher', throttle: 0 },
            'Artists': { points: 1, description: 'Per matching artist', throttle: 0 }
        };

        let scoringConfig = { ...defaultScoringConfig };

        function escHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function loadScoringConfig() {
            const saved = localStorage.getItem('scoringConfigSimilar');
            if (saved) {
                try {
                    const loaded = JSON.parse(saved);
                    scoringConfig = { ...defaultScoringConfig, ...loaded };
                } catch (e) { scoringConfig = { ...defaultScoringConfig }; }
            }
            renderScoringConfig();
            renderScoringInfo();
        }

        function renderScoringConfig() {
            const container = document.getElementById('scoringConfigContainer');
            container.innerHTML = Object.entries(scoringConfig).map(([name, config]) => `
                <div class="config-row">
                    <div class="config-row-header">
                        <div>
                            <div class="config-name">${escHtml(name)}</div>
                            <div class="config-desc">${escHtml(config.description)}</div>
                        </div>
                    </div>
                    <div class="config-fields">
                        <div>
                            <div class="config-field-label">Points</div>
                            <input type="number" step="0.1" value="${config.points}"
                                onchange="scoringConfig['${escHtml(name)}'].points = parseFloat(this.value)"
                                class="config-input">
                        </div>
                        <div>
                            <div class="config-field-label">Max Score (0 = none)</div>
                            <input type="number" step="0.1" value="${config.throttle}"
                                onchange="scoringConfig['${escHtml(name)}'].throttle = parseFloat(this.value)"
                                class="config-input" placeholder="0 = No Max">
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderScoringInfo() {
            const container = document.getElementById('scoringInfoList');
            container.innerHTML = Object.entries(scoringConfig).map(([name, config]) => `
                <div class="info-row">
                    <div class="info-pts">${config.points}</div>
                    <div>
                        <div class="info-name">${escHtml(name)}</div>
                        <div class="info-desc">${escHtml(config.description)}</div>
                    </div>
                </div>
            `).join('');
        }

        function saveScoringConfig() {
            localStorage.setItem('scoringConfigSimilar', JSON.stringify(scoringConfig));
            closeSettingsModal();
            if (Object.keys(gameDetails).length > 0) {
                updateStatus('Recalculating...', 'loading');
                setTimeout(() => {
                    calculateSimilarities();
                    displayResults();
                    updateStatus('Complete', 'success');
                }, 100);
            }
        }

        function resetScoringDefaults() {
            if (confirm('Reset to defaults?')) {
                scoringConfig = { ...defaultScoringConfig };
                renderScoringConfig();
            }
        }

        async function fetchWithRetry(url, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                const response = await fetch(url);
                if (response.status === 202) { await new Promise(r => setTimeout(r, 2000 * (i + 1))); continue; }
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.text();
            }
            throw new Error('Timeout');
        }

        async function analyzeCollection() {
            const username = document.getElementById('username').value.trim() || 'sportomax';
            const ignoreExpansions = document.getElementById('ignoreExpansions').checked;
            updateStatus('Fetching collection...', 'loading');

            try {
                const xmlText = await fetchWithRetry(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1`);
                const doc = new DOMParser().parseFromString(xmlText, 'text/xml');

                if (doc.querySelector('errors error')) throw new Error('User not found');

                let items = Array.from(doc.querySelectorAll('item'));
                if (ignoreExpansions) items = items.filter(i => i.getAttribute('subtype') !== 'expansion');

                if (items.length === 0) throw new Error('No games found');

                allGames = items.map(item => ({
                    id: item.getAttribute('objectid'),
                    name: item.querySelector('name').textContent
                }));

                updateStatus(`Loading details for ${allGames.length} games...`, 'loading');
                await fetchGameDetails();

                updateStatus('Analyzing similarities...', 'loading');
                calculateSimilarities();

                displayResults();
                document.getElementById('setupSection').style.display = 'none';
                const rs = document.getElementById('resultsSection');
                rs.classList.remove('hidden');
                rs.style.display = 'flex';
                updateStatus('', '');
            } catch (error) { updateStatus(error.message, 'error'); }
        }

        async function fetchGameDetails() {
            const batchSize = 20;
            const parallelLimit = 50;
            const batches = [];
            for (let i = 0; i < allGames.length; i += batchSize) batches.push(allGames.slice(i, i + batchSize));

            for (let i = 0; i < batches.length; i += parallelLimit) {
                const group = batches.slice(i, i + parallelLimit);
                updateStatus(`Loading details ${i * batchSize} – ${Math.min((i + parallelLimit) * batchSize, allGames.length)}...`, 'loading');

                await Promise.all(group.map(async batch => {
                    const ids = batch.map(g => g.id).join(',');
                    try {
                        const xmlText = await fetchWithRetry(`/api/bgg-helper?endpoint=thing&id=${ids}&stats=1`);
                        const doc = new DOMParser().parseFromString(xmlText, 'text/xml');

                        doc.querySelectorAll('item').forEach(item => {
                            const id = item.getAttribute('id');
                            gameDetails[id] = {
                                id, name: item.querySelector('name')?.getAttribute('value'),
                                yearPublished: parseInt(item.querySelector('yearpublished')?.getAttribute('value')) || 0,
                                minPlayers: parseInt(item.querySelector('minplayers')?.getAttribute('value')) || 0,
                                maxPlayers: parseInt(item.querySelector('maxplayers')?.getAttribute('value')) || 0,
                                playingTime: parseInt(item.querySelector('playingtime')?.getAttribute('value')) || 0,
                                minPlaytime: parseInt(item.querySelector('minplaytime')?.getAttribute('value')) || 0,
                                maxPlaytime: parseInt(item.querySelector('maxplaytime')?.getAttribute('value')) || 0,
                                minAge: parseInt(item.querySelector('minage')?.getAttribute('value')) || 0,
                                thumbnail: item.querySelector('thumbnail')?.textContent,
                                image: item.querySelector('image')?.textContent,
                                categories: Array.from(item.querySelectorAll('link[type="boardgamecategory"]')).map(l => l.getAttribute('value')),
                                mechanics: Array.from(item.querySelectorAll('link[type="boardgamemechanic"]')).map(l => l.getAttribute('value')),
                                designers: Array.from(item.querySelectorAll('link[type="boardgamedesigner"]')).map(l => l.getAttribute('value')),
                                publishers: Array.from(item.querySelectorAll('link[type="boardgamepublisher"]')).map(l => l.getAttribute('value')),
                                artists: Array.from(item.querySelectorAll('link[type="boardgameartist"]')).map(l => l.getAttribute('value')),
                                rating: parseFloat(item.querySelector('ratings > average')?.getAttribute('value')) || 0
                            };
                        });
                    } catch (e) { console.error(`Failed to fetch batch ${ids}`, e); }
                }));

                if (i + parallelLimit < batches.length) await new Promise(r => setTimeout(r, 500));
            }
        }

        function calculateSimilarities() {
            const ids = Object.keys(gameDetails);
            ids.forEach(id1 => {
                similarityMatrix[id1] = {};
                const g1 = gameDetails[id1];
                ids.forEach(id2 => {
                    if (id1 === id2) { similarityMatrix[id1][id2] = 0; return; }
                    const g2 = gameDetails[id2];
                    let score = 0;
                    const cfg = scoringConfig;

                    if (g1.yearPublished === g2.yearPublished && g1.yearPublished > 0) score += cfg['Year Published'].points;
                    if (g1.minPlayers === g2.minPlayers && g1.minPlayers > 0) score += cfg['Min Players'].points;
                    if (g1.maxPlayers === g2.maxPlayers && g1.maxPlayers > 0) score += cfg['Max Players'].points;
                    if (Math.abs(g1.playingTime - g2.playingTime) <= 15 && g1.playingTime > 0) score += cfg['Playing Time'].points;
                    if (Math.abs(g1.minPlaytime - g2.minPlaytime) <= 10 && g1.minPlaytime > 0) score += cfg['Min Playtime'].points;
                    if (Math.abs(g1.maxPlaytime - g2.maxPlaytime) <= 10 && g1.maxPlaytime > 0) score += cfg['Max Playtime'].points;
                    if (Math.abs(g1.minAge - g2.minAge) <= 2 && g1.minAge > 0) score += cfg['Min Age'].points;

                    const match = (list1, list2, config) => {
                        let pts = list1.filter(x => list2.includes(x)).length * config.points;
                        return config.throttle > 0 ? Math.min(pts, config.throttle) : pts;
                    };

                    score += match(g1.categories, g2.categories, cfg['Categories']);
                    score += match(g1.mechanics, g2.mechanics, cfg['Mechanics']);
                    score += match(g1.designers, g2.designers, cfg['Designers']);
                    score += match(g1.publishers, g2.publishers, cfg['Publishers']);
                    score += match(g1.artists, g2.artists, cfg['Artists']);

                    similarityMatrix[id1][id2] = parseFloat(score.toFixed(1));
                });
            });
        }

        function displayResults() {
            displayStats();
            displayGames();
            displayComparisonTable();

            const dropdown = document.getElementById('baseGameSearch');
            dropdown.innerHTML = '<option value="">— Select Game —</option>' +
                Object.values(gameDetails).sort((a,b) => a.name.localeCompare(b.name))
                    .map(g => `<option value="${g.id}">${escHtml(g.name)}</option>`).join('');
        }

        function displayStats() {
            const details = Object.values(gameDetails);
            const total = details.length;
            const cats = new Set(details.flatMap(g => g.categories)).size;
            const mechs = new Set(details.flatMap(g => g.mechanics)).size;
            const des = new Set(details.flatMap(g => g.designers)).size;
            const arts = new Set(details.flatMap(g => g.artists)).size;

            const chip = (lbl, val) => `
                <div class="stat-chip">
                    <div class="stat-chip-label">${lbl}</div>
                    <div class="stat-chip-val">${val}</div>
                </div>
            `;

            document.getElementById('statsSummary').innerHTML =
                chip('Games', total) + chip('Categories', cats) +
                chip('Mechanics', mechs) + chip('Designers', des) + chip('Artists', arts);
        }

        function displayGames() {
            const container = document.getElementById('gameGrid');
            const data = Object.keys(gameDetails).map(id => {
                const similarities = similarityMatrix[id];
                const scores = Object.values(similarities);
                return {
                    id, game: gameDetails[id],
                    highest: Math.max(...scores),
                    matches: scores.filter(s => s > 0).length
                };
            }).sort((a,b) => b.highest - a.highest);

            container.innerHTML = data.map(item => `
                <div class="game-card animate-in"
                     data-name="${escHtml(item.game.name.toLowerCase())}"
                     data-highest="${item.highest}"
                     data-matches="${item.matches}"
                     onclick="openMatchesModal('${item.id}')">
                    <div class="game-thumb">
                        ${item.game.thumbnail ? `<img src="${IMAGE_PROXY}${encodeURIComponent(item.game.thumbnail)}" loading="lazy">` : ''}
                    </div>
                    <div class="game-info">
                        <div class="game-name">${escHtml(item.game.name)}</div>
                        <div class="game-meta">
                            <span class="game-meta-item">Year: <span>${item.game.yearPublished || '—'}</span></span>
                            <span class="game-meta-item">Players: <span>${item.game.minPlayers}–${item.game.maxPlayers}</span></span>
                            <span class="game-meta-item">Time: <span>${item.game.playingTime || '—'}m</span></span>
                        </div>
                    </div>
                    <div class="game-score-wrap">
                        <div class="score-badge">
                            <div class="score-badge-label">Top</div>
                            <div class="score-badge-val">${item.highest}</div>
                        </div>
                        <div class="score-links">${item.matches} links</div>
                    </div>
                </div>
            `).join('');
        }

        function showSimilarities(id) {
            const res = document.getElementById('similarityResults');
            if (!id) { res.innerHTML = ''; return; }

            const scores = Object.entries(similarityMatrix[id])
                .filter(([, s]) => s > 0).sort(([, a], [, b]) => b - a).slice(0, 30);

            res.innerHTML = scores.map(([mid, score]) => {
                const g = gameDetails[mid];
                return `
                    <div class="sim-card animate-in">
                        <div class="sim-thumb">
                            ${g.thumbnail ? `<img src="${IMAGE_PROXY}${encodeURIComponent(g.thumbnail)}" loading="lazy">` : ''}
                        </div>
                        <div style="flex:1;min-width:0">
                            <div class="sim-name">${escHtml(g.name)}</div>
                            <div class="sim-rating">⭐ ${g.rating.toFixed(1)} · ${g.yearPublished}</div>
                        </div>
                        <div class="sim-score">${score}</div>
                    </div>
                `;
            }).join('');
        }

        function displayComparisonTable() {
            const container = document.getElementById('comparisonTableContainer');
            const ids = Object.keys(gameDetails).sort((a,b) => gameDetails[a].name.localeCompare(gameDetails[b].name));

            const rows = ids.map(id => {
                const g = gameDetails[id];
                return `
                    <tr data-search="${g.name.toLowerCase()}">
                        <td class="sticky-col">${escHtml(g.name)}</td>
                        <td class="td-mono">${g.yearPublished}</td>
                        <td class="td-mono">${g.minPlayers}–${g.maxPlayers}</td>
                        <td class="td-mono">${g.playingTime}m</td>
                        <td class="td-mono">${g.minAge}+</td>
                        <td>${escHtml(g.categories.slice(0,2).join(', '))}</td>
                        <td>${escHtml(g.mechanics.slice(0,2).join(', '))}</td>
                        <td>${escHtml(g.designers[0] || '—')}</td>
                        <td class="td-mono td-green">${g.rating.toFixed(1)}</td>
                    </tr>
                `;
            }).join('');

            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th class="sticky-col">Game</th>
                            <th>Year</th><th>Players</th><th>Time</th><th>Age</th>
                            <th>Categories</th><th>Mechanics</th><th>Designer</th><th>Rating</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        function openMatchesModal(id) {
            const g = gameDetails[id];
            document.getElementById('matchesModalTitle').textContent = g.name;

            const scores = Object.entries(similarityMatrix[id])
                .filter(([, s]) => s > 0).sort(([, a], [, b]) => b - a).slice(0, 50);

            document.getElementById('matchesModalContent').innerHTML = scores.map(([mid, score]) => {
                const other = gameDetails[mid];
                const matches = getMatchingFields(g, other);
                return `
                    <div class="match-card animate-in">
                        <div class="match-thumb">
                            ${other.thumbnail ? `<img src="${IMAGE_PROXY}${encodeURIComponent(other.thumbnail)}">` : ''}
                        </div>
                        <div style="flex:1;min-width:0">
                            <div class="match-name">${escHtml(other.name)}</div>
                            <div class="match-sub">${other.yearPublished} · ${other.minPlayers}–${other.maxPlayers}p</div>
                            <div class="match-tags">
                                ${matches.map(m => `<span class="match-tag">${escHtml(m.field)}</span>`).join('')}
                            </div>
                        </div>
                        <div class="match-score">${score}</div>
                    </div>
                `;
            }).join('');

            document.getElementById('matchesModal').classList.remove('hidden');

            currentMatchesData = {
                title: `Similar to ${g.name}`,
                text: `Similar Games to ${g.name}:\n` + scores.map(([mid, s], i) => `${i+1}. ${gameDetails[mid].name} (${s} pts)`).join('\n')
            };
        }

        function getMatchingFields(g1, g2) {
            const matches = [];
            if (g1.yearPublished === g2.yearPublished && g1.yearPublished > 0) matches.push({field:'Year'});
            if (g1.minPlayers === g2.minPlayers) matches.push({field:'Min Players'});
            if (g1.maxPlayers === g2.maxPlayers) matches.push({field:'Max Players'});
            if (Math.abs(g1.playingTime - g2.playingTime) <= 15) matches.push({field:'Time'});
            g1.categories.filter(c => g2.categories.includes(c)).forEach(c => matches.push({field: c}));
            g1.mechanics.filter(m => g2.mechanics.includes(m)).forEach(m => matches.push({field: m}));
            return matches;
        }

        function switchView(view) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`${view}View`).classList.add('active');
            document.getElementById(`tab-${view}`).classList.add('active');
        }

        function filterGames() {
            const q = document.getElementById('gamesSearch').value.toLowerCase();
            document.querySelectorAll('#gameGrid .game-card').forEach(c => {
                c.style.display = c.dataset.name.includes(q) ? 'flex' : 'none';
            });
        }

        function filterTable() {
            const q = document.getElementById('tableSearch').value.toLowerCase();
            document.querySelectorAll('#comparisonTableContainer tbody tr').forEach(r => {
                r.style.display = r.dataset.search.includes(q) ? '' : 'none';
            });
        }

        function sortGames() {
            const by = document.getElementById('gamesSortBy').value;
            const container = document.getElementById('gameGrid');
            const cards = Array.from(container.children);
            cards.sort((a,b) => {
                if (by === 'highest-desc') return b.dataset.highest - a.dataset.highest;
                if (by === 'highest-asc') return a.dataset.highest - b.dataset.highest;
                if (by === 'matches-desc') return b.dataset.matches - a.dataset.matches;
                if (by === 'name-asc') return a.dataset.name.localeCompare(b.dataset.name);
                return 0;
            });
            cards.forEach(c => container.appendChild(c));
        }

        let currentMatchesData = null;
        function shareMatches() { if (navigator.share) navigator.share(currentMatchesData); else copyMatches(); }
        function copyMatches() { navigator.clipboard.writeText(currentMatchesData.text); alert('Copied!'); }

        function updateStatus(msg, type) {
            const el = document.getElementById('setupStatus');
            if (!msg) { el.className = 'status-pill'; el.textContent = ''; return; }
            el.textContent = msg;
            el.className = `status-pill ${type}`;
        }

        function resetAnalysis() { location.reload(); }
        function openInfoModal() { document.getElementById('infoModal').classList.remove('hidden'); }
        function closeInfoModal() { document.getElementById('infoModal').classList.add('hidden'); }
        function openSettingsModal() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function closeSettingsModal() { document.getElementById('settingsModal').classList.add('hidden'); }
        function closeMatchesModal() { document.getElementById('matchesModal').classList.add('hidden'); }

        loadScoringConfig();
    </script>
    <script type="module" src="analytics-init.js"></script>
</body>
</html>
