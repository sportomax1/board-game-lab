<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>BGG Pong</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🏓</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow: hidden;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 600px;
        }

        .screen.active {
            display: block;
        }

        .setup-card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 2rem;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #2a5298;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(30, 60, 114, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 60, 114, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        canvas {
            width: 100%;
            height: auto;
            display: block;
            background: #0f1419;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 1rem;
            background: white;
            border-radius: 12px;
            margin-bottom: 1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .score {
            text-align: center;
        }

        .score-label {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 0.25rem;
        }

        .score-value {
            font-size: 2rem;
            font-weight: 900;
            color: #2c3e50;
        }

        .controls {
            margin-top: 1rem;
            padding: 1rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .controls-text {
            text-align: center;
            color: #7f8c8d;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }

        .control-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .control-buttons button {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .control-buttons button:active {
            transform: scale(0.95);
        }

        .pause-btn {
            background: #f39c12;
            color: white;
        }

        .reset-btn {
            background: #e74c3c;
            color: white;
        }

        .settings-btn {
            background: #95a5a6;
            color: white;
        }

        .winner-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .winner-modal.active {
            display: flex;
        }

        .winner-content {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            max-width: 400px;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .winner-title {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #2c3e50;
        }

        .touch-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .touch-btn {
            padding: 1rem;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            touch-action: none;
            user-select: none;
        }

        .touch-btn:active {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <!-- Setup Screen -->
    <div id="setupScreen" class="screen active">
        <div class="setup-card">
            <h1>🏓 Pong</h1>
            <p class="subtitle">Classic pong with BGG collection thumbnail as the ball!</p>
            
            <div class="form-group">
                <label for="username">BGG Username</label>
                <input type="text" id="username" value="sportomax" placeholder="Enter username">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="includeExpansions">
                <label for="includeExpansions" style="margin: 0;">Include expansions</label>
            </div>

            <div style="margin-top: 1.5rem;">
                <button class="btn" onclick="startGame()">Start Game</button>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="screen">
        <div class="game-container">
            <div class="score-board">
                <div class="score">
                    <div class="score-label">Player</div>
                    <div class="score-value" id="playerScore">0</div>
                </div>
                <div class="score">
                    <div class="score-label">Computer</div>
                    <div class="score-value" id="computerScore">0</div>
                </div>
            </div>

            <canvas id="gameCanvas" width="800" height="500"></canvas>

            <div class="controls">
                <div class="controls-text">
                    Desktop: Use ↑↓ arrow keys or W/S keys to move your paddle
                </div>
                <div class="touch-controls">
                    <button class="touch-btn" id="upBtn">↑ Move Up</button>
                    <button class="touch-btn" id="downBtn">↓ Move Down</button>
                </div>
                <div class="control-buttons" style="margin-top: 0.5rem;">
                    <button class="pause-btn" onclick="togglePause()">⏸ Pause</button>
                    <button class="reset-btn" onclick="resetGame()">🔄 Reset</button>
                    <button class="settings-btn" onclick="backToSettings()">⚙️ Settings</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Winner Modal -->
    <div id="winnerModal" class="winner-modal">
        <div class="winner-content">
            <div class="winner-title" id="winnerText">🎉 You Won!</div>
            <div style="margin-top: 1.5rem;">
                <button class="btn" onclick="resetGame()">Play Again</button>
            </div>
        </div>
    </div>

    <script>
        let canvas, ctx;
        let games = [];
        let ballImage = new Image();
        let currentGameIndex = 0;
        let gameRunning = false;
        let gamePaused = false;
        let animationId = null;

        // Game objects
        const paddle1 = { x: 20, y: 200, width: 10, height: 80, dy: 0 };
        const paddle2 = { x: 770, y: 200, width: 10, height: 80, dy: 0 };
        const ball = { x: 400, y: 250, radius: 20, dx: 3, dy: 3 };
        let playerScore = 0;
        let computerScore = 0;

        // Keys
        const keys = {};

        async function startGame() {
            const username = document.getElementById('username').value.trim() || 'sportomax';
            const includeExpansions = document.getElementById('includeExpansions').checked;

            try {
                const subtype = includeExpansions ? '' : '&subtype=boardgame';
                const res = await fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1${subtype}&stats=1`);
                const xml = await res.text();

                const parser = new DOMParser();
                const doc = parser.parseFromString(xml, 'text/xml');

                games = Array.from(doc.querySelectorAll('item')).map(item => ({
                    name: item.querySelector('name').textContent,
                    thumbnail: item.querySelector('thumbnail')?.textContent || ''
                })).filter(g => g.thumbnail);

                if (games.length === 0) {
                    alert('Could not load games with thumbnails. Please check username.');
                    return;
                }

                // Initialize canvas
                canvas = document.getElementById('gameCanvas');
                ctx = canvas.getContext('2d');

                // Load random ball image
                loadRandomBall();

                // Show game screen
                document.getElementById('setupScreen').classList.remove('active');
                document.getElementById('gameScreen').classList.add('active');

                // Setup controls
                setupControls();

                // Start game loop
                gameRunning = true;
                gameLoop();
            } catch (error) {
                alert('Error loading collection: ' + error.message);
            }
        }

        function loadRandomBall() {
            currentGameIndex = Math.floor(Math.random() * games.length);
            ballImage.src = games[currentGameIndex].thumbnail;
            resetBall();
        }

        function setupControls() {
            document.addEventListener('keydown', (e) => {
                keys[e.key] = true;
            });

            document.addEventListener('keyup', (e) => {
                keys[e.key] = false;
            });

            // Touch controls
            const upBtn = document.getElementById('upBtn');
            const downBtn = document.getElementById('downBtn');

            upBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                paddle1.dy = -6;
            });

            upBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                paddle1.dy = 0;
            });

            downBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                paddle1.dy = 6;
            });

            downBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                paddle1.dy = 0;
            });

            // Mouse controls for desktop
            upBtn.addEventListener('mousedown', () => paddle1.dy = -6);
            upBtn.addEventListener('mouseup', () => paddle1.dy = 0);
            downBtn.addEventListener('mousedown', () => paddle1.dy = 6);
            downBtn.addEventListener('mouseup', () => paddle1.dy = 0);
        }

        function gameLoop() {
            if (!gameRunning) return;
            if (gamePaused) {
                animationId = requestAnimationFrame(gameLoop);
                return;
            }

            // Clear canvas
            ctx.fillStyle = '#0f1419';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw center line
            ctx.strokeStyle = '#ffffff33';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Update paddles
            if (keys['ArrowUp'] || keys['w'] || keys['W']) {
                paddle1.dy = -6;
            } else if (keys['ArrowDown'] || keys['s'] || keys['S']) {
                paddle1.dy = 6;
            }

            paddle1.y += paddle1.dy;
            paddle1.y = Math.max(0, Math.min(canvas.height - paddle1.height, paddle1.y));

            // AI for paddle 2
            const paddle2Center = paddle2.y + paddle2.height / 2;
            if (ball.x > canvas.width / 2) {
                if (paddle2Center < ball.y - 10) {
                    paddle2.y += 4;
                } else if (paddle2Center > ball.y + 10) {
                    paddle2.y -= 4;
                }
            }
            paddle2.y = Math.max(0, Math.min(canvas.height - paddle2.height, paddle2.y));

            // Update ball
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Ball collision with top/bottom
            if (ball.y - ball.radius <= 0 || ball.y + ball.radius >= canvas.height) {
                ball.dy = -ball.dy;
            }

            // Ball collision with paddles
            if (ball.x - ball.radius <= paddle1.x + paddle1.width &&
                ball.y >= paddle1.y && ball.y <= paddle1.y + paddle1.height) {
                ball.dx = Math.abs(ball.dx);
                const hitPos = (ball.y - paddle1.y) / paddle1.height - 0.5;
                ball.dy = hitPos * 8;
            }

            if (ball.x + ball.radius >= paddle2.x &&
                ball.y >= paddle2.y && ball.y <= paddle2.y + paddle2.height) {
                ball.dx = -Math.abs(ball.dx);
                const hitPos = (ball.y - paddle2.y) / paddle2.height - 0.5;
                ball.dy = hitPos * 8;
            }

            // Score
            if (ball.x - ball.radius <= 0) {
                computerScore++;
                document.getElementById('computerScore').textContent = computerScore;
                checkWinner();
                loadRandomBall();
            } else if (ball.x + ball.radius >= canvas.width) {
                playerScore++;
                document.getElementById('playerScore').textContent = playerScore;
                checkWinner();
                loadRandomBall();
            }

            // Draw paddles
            ctx.fillStyle = '#3498db';
            ctx.fillRect(paddle1.x, paddle1.y, paddle1.width, paddle1.height);
            ctx.fillRect(paddle2.x, paddle2.y, paddle2.width, paddle2.height);

            // Draw ball (thumbnail)
            if (ballImage.complete) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.clip();
                ctx.drawImage(ballImage, ball.x - ball.radius, ball.y - ball.radius, ball.radius * 2, ball.radius * 2);
                ctx.restore();
            } else {
                ctx.fillStyle = '#f39c12';
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            animationId = requestAnimationFrame(gameLoop);
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.dx = (Math.random() > 0.5 ? 1 : -1) * 3;
            ball.dy = (Math.random() - 0.5) * 4;
        }

        function resetGame() {
            playerScore = 0;
            computerScore = 0;
            document.getElementById('playerScore').textContent = playerScore;
            document.getElementById('computerScore').textContent = computerScore;
            document.getElementById('winnerModal').classList.remove('active');
            gamePaused = false;
            resetBall();
        }

        function togglePause() {
            gamePaused = !gamePaused;
            const btn = document.querySelector('.pause-btn');
            btn.textContent = gamePaused ? '▶️ Resume' : '⏸ Pause';
        }

        function checkWinner() {
            if (playerScore >= 5) {
                gamePaused = true;
                document.getElementById('winnerText').textContent = '🎉 You Won!';
                document.getElementById('winnerModal').classList.add('active');
            } else if (computerScore >= 5) {
                gamePaused = true;
                document.getElementById('winnerText').textContent = '💔 Computer Wins!';
                document.getElementById('winnerModal').classList.add('active');
            }
        }

        function backToSettings() {
            if (confirm('Are you sure you want to go back to settings? Current game will be lost.')) {
                gameRunning = false;
                if (animationId) {
                    cancelAnimationFrame(animationId);
                }
                document.getElementById('gameScreen').classList.remove('active');
                document.getElementById('setupScreen').classList.add('active');
            }
        }
    </script>
    <!-- Vercel Web Analytics -->
    <script type="module" src="analytics-init.js"></script>
</body>
</html>
