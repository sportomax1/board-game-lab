<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>TopTier Game Ranker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: white;
            overscroll-behavior: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }

        /* Tier Headers */
        .tier-header-s { background: #ef4444; color: #450a0a; }
        .tier-header-a { background: #f97316; color: #431407; }
        .tier-header-b { background: #eab308; color: #422006; }
        .tier-header-c { background: #22c55e; color: #052e16; }
        .tier-header-d { background: #64748b; color: #0f172a; }

        .game-card {
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: grab;
            touch-action: none;
        }
        
        .game-card:active {
            cursor: grabbing;
            transform: scale(1.05);
            z-index: 50;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .game-card.dragging {
            opacity: 0.5;
        }

        .game-card.selected-for-move {
            ring: 4px solid #3b82f6;
            transform: scale(1.05);
            z-index: 40;
        }

        .tier-row {
            min-height: 100px;
            transition: background-color 0.2s;
        }

        .tier-row.drag-over {
            background-color: rgba(255, 255, 255, 0.05);
        }
        
        /* Loading Spinner */
        .loader {
            border: 4px solid #1e293b;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-3 flex justify-between items-center z-20 shadow-lg">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-gradient-to-br from-pink-500 to-violet-600 rounded-lg flex items-center justify-center font-bold text-lg">T</div>
            <h1 class="font-bold text-xl tracking-tight">TopTier</h1>
        </div>
        <div class="flex gap-2">
            <button id="shareBtn" class="px-3 py-1.5 text-sm bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition-colors" title="Share tier list">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C9.589 12.17 10.846 11.5 12.5 11.5c2.21 0 4 1.79 4 4M12 6a3 3 0 100 6 3 3 0 000-6m0 0a3 3 0 100-6 3 3 0 000 6m0 0h.01M15 13H9m4 8H5m14 0h.01M9 19h6"></path></svg>
            </button>
            <button id="resetBtn" class="px-3 py-1.5 text-sm bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition-colors hidden">
                Reset
            </button>
            <button id="settingsBtn" class="px-3 py-1.5 text-sm bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow transition-colors">
                Settings
            </button>
        </div>
    </header>

    <!-- Main Tier List Area -->
    <main id="mainArea" class="flex-1 flex flex-col overflow-hidden relative">
        
        <!-- Tiers Container (Scrollable) -->
        <div class="flex-1 overflow-y-auto p-2 space-y-2 pb-40" id="tiersContainer">
            
            <!-- S Tier -->
            <div class="flex rounded-xl overflow-hidden bg-slate-800/50 border border-slate-700 min-h-[110px] shadow-sm">
                <div class="w-16 md:w-24 tier-header-s flex flex-col items-center justify-center p-2 shrink-0 select-none cursor-pointer hover:brightness-110" onclick="selectTierTarget('S')">
                    <span class="text-3xl md:text-4xl font-black">S</span>
                </div>
                <div class="flex-1 p-2 flex flex-wrap gap-2 tier-row content-start" data-tier="S" id="tier-S"></div>
            </div>

            <!-- A Tier -->
            <div class="flex rounded-xl overflow-hidden bg-slate-800/50 border border-slate-700 min-h-[110px] shadow-sm">
                <div class="w-16 md:w-24 tier-header-a flex flex-col items-center justify-center p-2 shrink-0 select-none cursor-pointer hover:brightness-110" onclick="selectTierTarget('A')">
                    <span class="text-3xl md:text-4xl font-black">A</span>
                </div>
                <div class="flex-1 p-2 flex flex-wrap gap-2 tier-row content-start" data-tier="A" id="tier-A"></div>
            </div>

            <!-- B Tier -->
            <div class="flex rounded-xl overflow-hidden bg-slate-800/50 border border-slate-700 min-h-[110px] shadow-sm">
                <div class="w-16 md:w-24 tier-header-b flex flex-col items-center justify-center p-2 shrink-0 select-none cursor-pointer hover:brightness-110" onclick="selectTierTarget('B')">
                    <span class="text-3xl md:text-4xl font-black">B</span>
                </div>
                <div class="flex-1 p-2 flex flex-wrap gap-2 tier-row content-start" data-tier="B" id="tier-B"></div>
            </div>

            <!-- C Tier -->
            <div class="flex rounded-xl overflow-hidden bg-slate-800/50 border border-slate-700 min-h-[110px] shadow-sm">
                <div class="w-16 md:w-24 tier-header-c flex flex-col items-center justify-center p-2 shrink-0 select-none cursor-pointer hover:brightness-110" onclick="selectTierTarget('C')">
                    <span class="text-3xl md:text-4xl font-black">C</span>
                </div>
                <div class="flex-1 p-2 flex flex-wrap gap-2 tier-row content-start" data-tier="C" id="tier-C"></div>
            </div>

            <!-- D Tier -->
            <div class="flex rounded-xl overflow-hidden bg-slate-800/50 border border-slate-700 min-h-[110px] shadow-sm">
                <div class="w-16 md:w-24 tier-header-d flex flex-col items-center justify-center p-2 shrink-0 select-none cursor-pointer hover:brightness-110" onclick="selectTierTarget('D')">
                    <span class="text-3xl md:text-4xl font-black">D</span>
                </div>
                <div class="flex-1 p-2 flex flex-wrap gap-2 tier-row content-start" data-tier="D" id="tier-D"></div>
            </div>
        </div>

        <!-- Unranked / Staging Area (Fixed Bottom) -->
        <div class="absolute bottom-0 left-0 right-0 bg-slate-900/95 border-t border-slate-700 backdrop-blur-md z-10 transition-transform duration-300" id="stagingArea">
            <div class="flex justify-between items-center px-4 py-2 border-b border-slate-800">
                <span class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Unranked <span id="unrankedCount" class="bg-slate-700 text-white px-2 py-0.5 rounded-full text-xs ml-2">0</span></span>
                <button id="toggleStaging" class="text-slate-400 hover:text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
            </div>
            <div class="h-32 overflow-x-auto overflow-y-hidden whitespace-nowrap p-3 flex gap-3 tier-row items-center" id="tier-Unranked" data-tier="Unranked">
                <!-- Games load here -->
                <div id="emptyState" class="text-slate-500 text-sm italic w-full text-center hidden">No games loaded. Check Settings.</div>
            </div>
        </div>

    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4" style="display: flex;">
        <div class="bg-slate-800 w-full max-w-md rounded-2xl border border-slate-700 shadow-2xl overflow-hidden relative">
            <!-- X Close Button -->
            <button id="closeModalX" class="absolute top-4 right-4 text-slate-400 hover:text-white p-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <div class="p-6">
                <h2 class="text-2xl font-bold text-white mb-1">Setup Collection</h2>
                <p class="text-slate-400 text-sm mb-6">Configure filters and load your collection.</p>

                <div class="space-y-5">
                    <!-- Username -->
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2">BGG Username</label>
                        <input type="text" id="usernameInput" value="sportomax" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-slate-600 transition-all">
                    </div>

                    <!-- Filters -->
                    <div class="bg-slate-900/50 rounded-xl p-4 border border-slate-700/50">
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-3">Collection Filters</label>
                        <div class="grid grid-cols-2 gap-3">
                            <label class="flex items-center gap-3 cursor-pointer group">
                                <div class="relative flex items-center">
                                    <input type="checkbox" id="filterOwn" checked class="peer sr-only">
                                    <div class="w-5 h-5 border-2 border-slate-600 rounded bg-slate-800 peer-checked:bg-blue-500 peer-checked:border-blue-500 transition-all"></div>
                                    <svg class="absolute w-3 h-3 text-white left-1 top-1 opacity-0 peer-checked:opacity-100 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                </div>
                                <span class="text-sm text-slate-300 group-hover:text-white transition-colors">Own</span>
                            </label>

                            <label class="flex items-center gap-3 cursor-pointer group">
                                <div class="relative flex items-center">
                                    <input type="checkbox" id="filterPrevOwned" class="peer sr-only">
                                    <div class="w-5 h-5 border-2 border-slate-600 rounded bg-slate-800 peer-checked:bg-blue-500 peer-checked:border-blue-500 transition-all"></div>
                                    <svg class="absolute w-3 h-3 text-white left-1 top-1 opacity-0 peer-checked:opacity-100 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                </div>
                                <span class="text-sm text-slate-300 group-hover:text-white transition-colors">Prev. Owned</span>
                            </label>

                            <label class="flex items-center gap-3 cursor-pointer group">
                                <div class="relative flex items-center">
                                    <input type="checkbox" id="filterWantToPlay" class="peer sr-only">
                                    <div class="w-5 h-5 border-2 border-slate-600 rounded bg-slate-800 peer-checked:bg-blue-500 peer-checked:border-blue-500 transition-all"></div>
                                    <svg class="absolute w-3 h-3 text-white left-1 top-1 opacity-0 peer-checked:opacity-100 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                </div>
                                <span class="text-sm text-slate-300 group-hover:text-white transition-colors">Want to Play</span>
                            </label>

                            <label class="flex items-center gap-3 cursor-pointer group">
                                <div class="relative flex items-center">
                                    <input type="checkbox" id="filterWantToBuy" class="peer sr-only">
                                    <div class="w-5 h-5 border-2 border-slate-600 rounded bg-slate-800 peer-checked:bg-blue-500 peer-checked:border-blue-500 transition-all"></div>
                                    <svg class="absolute w-3 h-3 text-white left-1 top-1 opacity-0 peer-checked:opacity-100 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                </div>
                                <span class="text-sm text-slate-300 group-hover:text-white transition-colors">Want to Buy</span>
                            </label>
                            
                            <label class="flex items-center gap-3 cursor-pointer group col-span-2 border-t border-slate-700 pt-2 mt-1">
                                <div class="relative flex items-center">
                                    <input type="checkbox" id="filterExpansions" class="peer sr-only">
                                    <div class="w-5 h-5 border-2 border-slate-600 rounded bg-slate-800 peer-checked:bg-purple-500 peer-checked:border-purple-500 transition-all"></div>
                                    <svg class="absolute w-3 h-3 text-white left-1 top-1 opacity-0 peer-checked:opacity-100 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                </div>
                                <span class="text-sm text-slate-300 group-hover:text-white transition-colors">Include Expansions</span>
                            </label>

                            <label class="flex items-center gap-3 cursor-pointer group col-span-2 border-t border-slate-700 pt-2 mt-1">
                                <div class="relative flex items-center">
                                    <input type="checkbox" id="filterPlayedOnly" class="peer sr-only">
                                    <div class="w-5 h-5 border-2 border-slate-600 rounded bg-slate-800 peer-checked:bg-green-500 peer-checked:border-green-500 transition-all"></div>
                                    <svg class="absolute w-3 h-3 text-white left-1 top-1 opacity-0 peer-checked:opacity-100 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                </div>
                                <span class="text-sm text-slate-300 group-hover:text-white transition-colors">Played Only (1+ plays)</span>
                            </label>
                        </div>
                    </div>

                    <!-- Random Record Limit -->
                    <div class="bg-slate-900/50 rounded-xl p-4 border border-slate-700/50">
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-3">Random Games Limit</label>
                        <div class="flex items-center gap-4">
                            <input type="range" id="randomLimit" min="1" max="100" value="10" class="flex-1 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
                            <span id="randomLimitDisplay" class="text-sm font-bold text-white bg-slate-700 px-3 py-1 rounded-lg min-w-12 text-center">10</span>
                        </div>
                        <p class="text-xs text-slate-500 mt-2">Load this many random games from your collection (default: 10)</p>
                    </div>

                    <div id="statusMsg" class="text-center text-sm min-h-[20px] font-medium text-amber-400 break-words"></div>

                    <button id="fetchBtn" class="w-full bg-gradient-to-r from-blue-600 to-violet-600 hover:from-blue-500 hover:to-violet-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-900/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                        <span>Load Games</span>
                    </button>
                    
                    <button id="cancelSettings" class="w-full py-2 text-slate-400 hover:text-white text-sm">
                        Close / Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Context Menu for Click-to-Assign -->
    <div id="moveMenu" class="fixed inset-0 bg-black/60 z-40 hidden flex flex-col justify-end md:justify-center md:items-center">
        <div class="bg-slate-800 w-full md:w-80 rounded-t-2xl md:rounded-2xl p-4 border-t md:border border-slate-700 shadow-2xl transform transition-transform">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-white">Move to Tier...</h3>
                <button onclick="closeMoveMenu()" class="p-1 hover:bg-slate-700 rounded-full">
                    <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="grid grid-cols-1 gap-2">
                <button onclick="moveSelectedTo('S')" class="p-3 bg-slate-700 hover:bg-red-900/40 border-l-4 border-red-500 text-left rounded text-white font-bold flex justify-between group">S Tier <span class="opacity-0 group-hover:opacity-100 transition-opacity text-red-400">→</span></button>
                <button onclick="moveSelectedTo('A')" class="p-3 bg-slate-700 hover:bg-orange-900/40 border-l-4 border-orange-500 text-left rounded text-white font-bold flex justify-between group">A Tier <span class="opacity-0 group-hover:opacity-100 transition-opacity text-orange-400">→</span></button>
                <button onclick="moveSelectedTo('B')" class="p-3 bg-slate-700 hover:bg-yellow-900/40 border-l-4 border-yellow-500 text-left rounded text-white font-bold flex justify-between group">B Tier <span class="opacity-0 group-hover:opacity-100 transition-opacity text-yellow-400">→</span></button>
                <button onclick="moveSelectedTo('C')" class="p-3 bg-slate-700 hover:bg-green-900/40 border-l-4 border-green-500 text-left rounded text-white font-bold flex justify-between group">C Tier <span class="opacity-0 group-hover:opacity-100 transition-opacity text-green-400">→</span></button>
                <button onclick="moveSelectedTo('D')" class="p-3 bg-slate-700 hover:bg-slate-600 border-l-4 border-slate-500 text-left rounded text-white font-bold flex justify-between group">D Tier <span class="opacity-0 group-hover:opacity-100 transition-opacity text-slate-400">→</span></button>
                <button onclick="moveSelectedTo('Unranked')" class="p-3 bg-slate-900 text-slate-400 hover:text-white text-center rounded mt-2 text-sm">Return to Unranked</button>
            </div>
        </div>
    </div>

    <!-- Game Details Modal -->
    <div id="gameDetailsModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4" onclick="closeGameDetailsModal(event)">
        <div class="bg-slate-800 rounded-2xl border border-slate-700 shadow-2xl max-w-sm w-full max-h-[90vh] overflow-y-auto" onclick="event.stopPropagation()">
            <div class="sticky top-0 flex justify-between items-center p-4 border-b border-slate-700 bg-slate-800/95">
                <h3 id="gameDetailsName" class="font-bold text-white text-lg"></h3>
                <button onclick="closeGameDetailsModal()" class="p-1 hover:bg-slate-700 rounded-full">
                    <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-4">
                <img id="gameDetailsImage" class="w-full rounded-lg mb-4 bg-slate-700" alt="">
                <div class="space-y-3">
                    <div>
                        <p class="text-xs uppercase font-bold text-slate-400 mb-1">Rating</p>
                        <p id="gameDetailsRating" class="text-white font-semibold">-</p>
                    </div>
                    <div>
                        <p class="text-xs uppercase font-bold text-slate-400 mb-1">Players</p>
                        <p id="gameDetailsPlayers" class="text-white font-semibold">-</p>
                    </div>
                    <div>
                        <p class="text-xs uppercase font-bold text-slate-400 mb-1">Playing Time</p>
                        <p id="gameDetailsTime" class="text-white font-semibold">-</p>
                    </div>
                    <div>
                        <p class="text-xs uppercase font-bold text-slate-400 mb-1">Year</p>
                        <p id="gameDetailsYear" class="text-white font-semibold">-</p>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2 mt-6 pt-4 border-t border-slate-700">
                    <button onclick="assignGameToTier('S')" class="py-2 px-3 bg-red-500 hover:bg-red-600 text-white font-bold rounded text-sm">S Tier</button>
                    <button onclick="assignGameToTier('A')" class="py-2 px-3 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded text-sm">A Tier</button>
                    <button onclick="assignGameToTier('B')" class="py-2 px-3 bg-yellow-500 hover:bg-yellow-600 text-white font-bold rounded text-sm">B Tier</button>
                    <button onclick="assignGameToTier('C')" class="py-2 px-3 bg-green-500 hover:bg-green-600 text-white font-bold rounded text-sm">C Tier</button>
                    <button onclick="assignGameToTier('D')" class="py-2 px-3 bg-slate-600 hover:bg-slate-500 text-white font-bold rounded text-sm col-span-2">D Tier</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Share Modal -->
    <div id="shareModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4" onclick="closeShareModal(event)">
        <div class="bg-slate-800 rounded-2xl border border-slate-700 shadow-2xl max-w-sm w-full" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center p-4 border-b border-slate-700">
                <h3 class="font-bold text-white text-lg">Share Tier List</h3>
                <button onclick="closeShareModal()" class="p-1 hover:bg-slate-700 rounded-full">
                    <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-4 space-y-3">
                <button onclick="shareAsText()" class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Copy as Text
                </button>
                <button onclick="shareAsImage()" class="w-full py-3 px-4 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-lg flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    Screenshot
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- State ---
        let selectedGameId = null;
        let gamesData = [];
        let gameDetailsCache = {}; // Cache for game details
        let selectedGameForDetails = null; // For details modal
        
        // --- DOM Elements ---
        const settingsModal = document.getElementById('settingsModal');
        const fetchBtn = document.getElementById('fetchBtn');
        const cancelSettingsBtn = document.getElementById('cancelSettings');
        const closeModalX = document.getElementById('closeModalX');
        const statusMsg = document.getElementById('statusMsg');
        const moveMenu = document.getElementById('moveMenu');
        const unrankedContainer = document.getElementById('tier-Unranked');
        const unrankedCount = document.getElementById('unrankedCount');
        const settingsBtn = document.getElementById('settingsBtn');
        const resetBtn = document.getElementById('resetBtn');
        const shareBtn = document.getElementById('shareBtn');
        const gameDetailsModal = document.getElementById('gameDetailsModal');
        const shareModal = document.getElementById('shareModal');
        const randomLimitInput = document.getElementById('randomLimit');
        const randomLimitDisplay = document.getElementById('randomLimitDisplay');
        
        // --- API Logic ---
        async function fetchWithRetry(url, options, maxRetries = 3, delay = 1500) {
            let lastError;
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    // If BGG is processing (202), wait and retry
                    if (response.status === 202) {
                        console.log('BGG is processing (202), retrying...');
                        throw new Error('Collection is processing, please wait...');
                    }
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response;
                } catch (error) {
                    console.warn(`Attempt ${i+1} failed: ${error.message}`);
                    lastError = error;
                    if (i < maxRetries - 1) {
                        statusMsg.textContent = `Retrying... (${i+1}/${maxRetries})`;
                        await new Promise(resolve => setTimeout(resolve, delay * (i + 1))); // Exponential-ish backoff
                    } else {
                        throw lastError;
                    }
                }
            }
        }

        async function fetchFromBGG(username) {
            try {
                let filters = [];
                if (document.getElementById('filterOwn').checked) filters.push('own=1');
                if (document.getElementById('filterPrevOwned').checked) filters.push('prevowned=1');
                if (document.getElementById('filterWantToPlay').checked) filters.push('wanttoplay=1');
                if (document.getElementById('filterWantToBuy').checked) filters.push('wanttobuy=1');

                const filterStr = filters.length > 0 ? '&' + filters.join('&') : '&own=1';
                const safeUsername = encodeURIComponent(username);
                
                // Use the retry wrapper
                const response = await fetchWithRetry(`/api/bgg-helper?endpoint=collection&username=${safeUsername}${filterStr}&stats=1`);
                
                const text = await response.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, 'text/xml');
                
                // Soft check for errors: if we can extract items, ignore errors.
                // Sometimes BGG sends mixed signals.
                const items = xml.querySelectorAll('item');
                if (items.length === 0) {
                    const errorNode = xml.querySelector('error');
                    if (errorNode) {
                        throw new Error(errorNode.textContent || 'BGG API returned an error');
                    }
                    const messageNode = xml.querySelector('message');
                    if (messageNode && messageNode.textContent.includes('process')) {
                         throw new Error('Collection is still processing at BGG. Try again in 10 seconds.');
                    }
                }

                const games = Array.from(items).map(item => {
                    const name = item.querySelector('name')?.textContent || 'Unknown';
                    const image = item.querySelector('image')?.textContent || item.querySelector('thumbnail')?.textContent || '';
                    const type = item.getAttribute('subtype') || '';
                    
                    // Extract additional stats from the collection response
                    const yearpublished = item.querySelector('yearpublished')?.textContent || '';
                    const stats = item.querySelector('stats');
                    const minplayers = stats?.getAttribute('minplayers') || 'N/A';
                    const maxplayers = stats?.getAttribute('maxplayers') || 'N/A';
                    const playingtime = stats?.getAttribute('playingtime') || 'N/A';
                    const rating = stats?.querySelector('rating')?.querySelector('average')?.getAttribute('value') || 'N/A';
                    const numplays = parseInt(item.querySelector('numplays')?.textContent || '0') || 0;
                    
                    return {
                        id: item.getAttribute('objectid'),
                        name: name,
                        image: image,
                        subtype: type,
                        year: yearpublished,
                        minPlayers: minplayers,
                        maxPlayers: maxplayers,
                        playingTime: playingtime,
                        rating: rating,
                        numPlays: numplays
                    };
                }).filter(g => {
                    if (!g.image) return false;
                    // Filter expansions (check subtype attribute like random9 does)
                    if (g.subtype === 'boardgameexpansion' && !document.getElementById('filterExpansions').checked) return false;
                    // Filter by play count if "Played Only" is checked
                    if (document.getElementById('filterPlayedOnly').checked && g.numPlays < 1) return false;
                    return true;
                });

                // Apply random limit from settings
                const randomLimit = parseInt(randomLimitInput.value) || 10;
                let filteredGames = Array.from(new Map(games.map(g => [g.name, g])).values());
                
                // Shuffle and limit
                if (randomLimit < filteredGames.length) {
                    filteredGames = filteredGames.sort(() => Math.random() - 0.5).slice(0, randomLimit);
                }

                return filteredGames;
            } catch (error) {
                console.error('BGG Fetch Error:', error);
                throw error;
            }
        }

        // --- UI Logic ---

        function createGameCard(game) {
            const div = document.createElement('div');
            div.className = 'game-card relative w-20 h-20 md:w-24 md:h-24 rounded-lg bg-slate-800 border border-slate-600 overflow-hidden shrink-0 group';
            div.draggable = true;
            div.dataset.id = game.id;
            div.dataset.name = game.name;
            
            // Image
            const img = document.createElement('img');
            img.src = game.image;
            img.alt = game.name;
            img.className = 'w-full h-full object-cover pointer-events-none'; 
            img.loading = 'lazy';
            img.onerror = function() { this.style.display='none'; }; // Hide broken images
            
            // Tooltip/Name overlay
            const overlay = document.createElement('div');
            overlay.className = 'absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center p-1 text-center';
            overlay.innerHTML = `<span class="text-[10px] md:text-xs font-bold text-white leading-tight line-clamp-3">${game.name}</span>`;
            
            div.appendChild(img);
            div.appendChild(overlay);

            // Events
            div.addEventListener('dragstart', handleDragStart);
            div.addEventListener('click', (e) => handleCardClick(e, game.id));
            
            return div;
        }

        function populateUnranked(games) {
            unrankedContainer.innerHTML = '';
            games.forEach(game => {
                unrankedContainer.appendChild(createGameCard(game));
            });
            
            // Check if empty
            if (games.length === 0) {
                 document.getElementById('emptyState').classList.remove('hidden');
                 document.getElementById('emptyState').textContent = "No games found matching filters.";
            } else {
                document.getElementById('emptyState').classList.add('hidden');
            }
            
            updateCounts();
        }

        function updateCounts() {
            const count = unrankedContainer.querySelectorAll('.game-card').length;
            unrankedCount.textContent = count;
            
            const emptyState = document.getElementById('emptyState');
            if (count === 0 && gamesData.length > 0) {
                emptyState.classList.remove('hidden');
                emptyState.textContent = "All ranked! Great job.";
            } else if (count === 0) {
                emptyState.classList.remove('hidden');
                emptyState.textContent = "No games loaded.";
            } else {
                emptyState.classList.add('hidden');
            }
        }

        // --- Interaction Logic ---

        function handleCardClick(e, id) {
            selectedGameId = id;
            selectedGameForDetails = gamesData.find(g => g.id === id);
            
            // Show game details modal
            if (selectedGameForDetails) {
                showGameDetails(selectedGameForDetails);
            } else {
                // Fallback to old move menu
                document.querySelectorAll('.game-card').forEach(c => c.classList.remove('selected-for-move'));
                e.currentTarget.classList.add('selected-for-move');
                moveMenu.classList.remove('hidden');
            }
        }

        function showGameDetails(game) {
            document.getElementById('gameDetailsName').textContent = game.name;
            document.getElementById('gameDetailsImage').src = game.image;
            document.getElementById('gameDetailsRating').textContent = game.rating && game.rating !== 'N/A' ? game.rating.substring(0, 5) : 'Not rated';
            document.getElementById('gameDetailsPlayers').textContent = `${game.minPlayers}-${game.maxPlayers}`;
            document.getElementById('gameDetailsTime').textContent = game.playingTime && game.playingTime !== 'N/A' ? `${game.playingTime} min` : 'N/A';
            document.getElementById('gameDetailsYear').textContent = game.year || 'N/A';
            
            gameDetailsModal.classList.remove('hidden');
        }

        function closeGameDetailsModal(e) {
            if (e && e.target !== gameDetailsModal) return; // Only close if clicking outside
            gameDetailsModal.classList.add('hidden');
        }

        function assignGameToTier(tier) {
            if (!selectedGameId) return;
            
            const card = document.querySelector(`.game-card[data-id="${selectedGameId}"]`);
            const targetContainer = document.getElementById(`tier-${tier}`);
            
            if (card && targetContainer) {
                if (tier === 'Unranked') {
                    targetContainer.insertBefore(card, targetContainer.firstChild);
                    const emptyText = document.getElementById('emptyState');
                    if (emptyText) targetContainer.appendChild(emptyText);
                } else {
                    targetContainer.appendChild(card);
                    const emptyText = document.getElementById('emptyState');
                    if (emptyText && emptyText.parentElement === unrankedContainer) {
                        emptyText.classList.remove('hidden');
                    }
                }
                updateCounts();
            }
            
            closeGameDetailsModal();
            selectedGameId = null;
            selectedGameForDetails = null;
        }

        function closeMoveMenu() {
            moveMenu.classList.add('hidden');
            document.querySelectorAll('.game-card').forEach(c => c.classList.remove('selected-for-move'));
            selectedGameId = null;
        }

        function moveSelectedTo(tier) {
            if (!selectedGameId) return;
            
            const card = document.querySelector(`.game-card[data-id="${selectedGameId}"]`);
            const targetContainer = document.getElementById(`tier-${tier}`);
            
            if (card && targetContainer) {
                if (tier === 'Unranked') {
                    targetContainer.insertBefore(card, targetContainer.firstChild); 
                    const emptyText = document.getElementById('emptyState');
                    targetContainer.appendChild(emptyText); 
                } else {
                    targetContainer.appendChild(card);
                }
                
                card.animate([
                    { transform: 'scale(0.8)', opacity: 0.5 },
                    { transform: 'scale(1)', opacity: 1 }
                ], { duration: 300, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)' });
            }
            
            closeMoveMenu();
            updateCounts();
        }

        let draggedCard = null;

        function handleDragStart(e) {
            draggedCard = this;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', this.dataset.id);
            this.classList.add('dragging');
            closeMoveMenu();
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            document.querySelectorAll('.tier-row').forEach(row => {
                row.classList.remove('drag-over');
                row.classList.remove('target-active');
            });
            draggedCard = null;
        }

        document.querySelectorAll('.tier-row').forEach(zone => {
            zone.addEventListener('dragover', (e) => {
                e.preventDefault(); 
                e.dataTransfer.dropEffect = 'move';
                zone.classList.add('drag-over');
            });

            zone.addEventListener('dragleave', () => {
                zone.classList.remove('drag-over');
            });

            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('drag-over');
                
                if (draggedCard) {
                    const afterElement = getDragAfterElement(zone, e.clientX);
                    if (afterElement == null) {
                        zone.appendChild(draggedCard);
                    } else {
                        zone.insertBefore(draggedCard, afterElement);
                    }
                    updateCounts();
                }
            });
        });

        document.addEventListener('dragend', (e) => {
            if (e.target.classList && e.target.classList.contains('game-card')) {
                handleDragEnd.call(e.target, e);
            }
        });

        function getDragAfterElement(container, x) {
            const draggableElements = [...container.querySelectorAll('.game-card:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = x - box.left - box.width / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        // --- Main Execution ---

        fetchBtn.addEventListener('click', async () => {
            const username = document.getElementById('usernameInput').value.trim();
            if (!username) {
                statusMsg.textContent = "Please enter a username";
                return;
            }

            fetchBtn.innerHTML = '<span class="loader"></span> Processing...';
            fetchBtn.disabled = true;
            statusMsg.textContent = "";
            statusMsg.className = "text-center text-sm font-medium text-blue-400";

            try {
                const games = await fetchFromBGG(username);
                
                // Populate data separate from Modal logic
                gamesData = games;
                populateUnranked(games);
                
                if (games.length === 0) {
                    statusMsg.textContent = "No games found. Check filters or username.";
                    statusMsg.className = "text-center text-sm font-medium text-red-400";
                    fetchBtn.innerHTML = 'Try Again';
                    fetchBtn.disabled = false;
                } else {
                    // Success: Show success briefly then Close Modal
                    statusMsg.textContent = "Games Loaded Successfully!";
                    statusMsg.className = "text-center text-sm font-medium text-green-400";
                    fetchBtn.innerHTML = '✓ Success';
                    
                    setTimeout(() => {
                        settingsModal.style.display = 'none';
                        resetBtn.classList.remove('hidden');
                        fetchBtn.innerHTML = '<span>Load Games</span>';
                        fetchBtn.disabled = false;
                    }, 800);
                }

            } catch (err) {
                console.error(err);
                
                // Safety Check: If we managed to load games despite the error (e.g. partial load or late processing)
                if (gamesData.length > 0) {
                    statusMsg.textContent = "Loaded with warnings.";
                    statusMsg.className = "text-center text-sm font-medium text-yellow-400";
                    setTimeout(() => {
                        settingsModal.style.display = 'none';
                        resetBtn.classList.remove('hidden');
                        fetchBtn.innerHTML = '<span>Load Games</span>';
                        fetchBtn.disabled = false;
                    }, 1000);
                } else {
                    // Real error with no data
                    let msg = err.message;
                    if (msg === 'Failed to fetch') msg = "Network error. Check connection.";
                    statusMsg.textContent = msg;
                    statusMsg.className = "text-center text-sm font-medium text-red-400";
                    fetchBtn.innerHTML = 'Try Again';
                    fetchBtn.disabled = false;
                }
            }
        });

        settingsBtn.addEventListener('click', () => {
            settingsModal.style.display = 'flex';
        });

        // New Logic: Cancel button always closes, allowing user to see partial data or just close logic
        function forceCloseModal() {
             settingsModal.style.display = 'none';
        }

        cancelSettingsBtn.addEventListener('click', forceCloseModal);
        closeModalX.addEventListener('click', forceCloseModal);

        resetBtn.addEventListener('click', () => {
            if(confirm("Clear all tier assignments and reset to unranked?")) {
                const allCards = document.querySelectorAll('.game-card');
                allCards.forEach(card => {
                    unrankedContainer.appendChild(card);
                });
                unrankedContainer.appendChild(document.getElementById('emptyState'));
                updateCounts();
            }
        });

        window.selectTierTarget = (tier) => {
            if (selectedGameId) {
                moveSelectedTo(tier);
            }
        };

        const toggleStagingBtn = document.getElementById('toggleStaging');
        const stagingArea = document.getElementById('stagingArea');
        let isStagingCollapsed = false;

        toggleStagingBtn.addEventListener('click', () => {
            isStagingCollapsed = !isStagingCollapsed;
            if (isStagingCollapsed) {
                stagingArea.style.transform = 'translateY(calc(100% - 40px))';
                toggleStagingBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" /></svg>`;
            } else {
                stagingArea.style.transform = 'translateY(0)';
                toggleStagingBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>`;
            }
        });

        // --- Share Functions ---
        shareBtn.addEventListener('click', () => {
            shareModal.classList.remove('hidden');
        });

        function closeShareModal(e) {
            if (e && e.target !== shareModal) return;
            shareModal.classList.add('hidden');
        }

        function shareAsText() {
            let text = "🎲 My TopTier Board Game Ranking\n\n";
            
            ['S', 'A', 'B', 'C', 'D'].forEach(tier => {
                const container = document.getElementById(`tier-${tier}`);
                const games = Array.from(container.querySelectorAll('.game-card')).map(c => c.dataset.name);
                if (games.length > 0) {
                    text += `${tier} Tier (${games.length}): ${games.join(', ')}\n\n`;
                }
            });

            const unranked = Array.from(unrankedContainer.querySelectorAll('.game-card')).map(c => c.dataset.name);
            if (unranked.length > 0) {
                text += `Unranked (${unranked.length}): ${unranked.join(', ')}\n`;
            }

            // Copy to clipboard
            navigator.clipboard.writeText(text).then(() => {
                alert('Tier list copied to clipboard!');
                closeShareModal();
            }).catch(() => {
                // Fallback: show text in alert
                alert('Copy this:\n\n' + text);
            });
        }

        function shareAsImage() {
            // Use html2canvas for screenshot (if available) or fallback
            const mainArea = document.getElementById('mainArea');
            
            // Check if html2canvas is available
            if (typeof html2canvas !== 'undefined') {
                html2canvas(mainArea, {
                    backgroundColor: '#0f172a',
                    scale: 2,
                    logging: false
                }).then(canvas => {
                    // Download the image
                    const link = document.createElement('a');
                    link.href = canvas.toDataURL('image/png');
                    link.download = 'toptier-ranking.png';
                    link.click();
                    closeShareModal();
                });
            } else {
                // Fallback: use native print
                window.print();
                closeShareModal();
            }
        }

        // Add html2canvas script dynamically if not present
        if (typeof html2canvas === 'undefined') {
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
            document.head.appendChild(script);
        }

        // Random limit slider update
        randomLimitInput.addEventListener('input', (e) => {
            randomLimitDisplay.textContent = e.target.value;
        });
    </script>
</body>
</html>
