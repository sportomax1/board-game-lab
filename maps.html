<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Game Map | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🗺️</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #map {
            height: 100vh;
            width: 100vw;
            background: #0f172a;
        }

        .state-thumb {
            border: 2px solid white;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            background: #1e293b;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            object-fit: cover;
        }

        .state-thumb:hover {
            transform: scale(1.5) z-index(1000);
            border-color: #10b981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
        }

        .leaflet-container {
            background: #0f172a !important;
        }

        .leaflet-popup-content-wrapper {
            background: rgba(15, 23, 42, 0.9) !important;
            color: white !important;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 1rem !important;
        }

        .leaflet-popup-tip {
            background: rgba(15, 23, 42, 0.9) !important;
        }

        .custom-marker {
            background: none !important;
            border: none !important;
        }

        .setup-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
        }

        .game-panel {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: calc(100% - 2rem);
            max-width: 400px;
            pointer-events: none;
        }

        .game-panel-content {
            pointer-events: auto;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .animate-slide-up {
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
    </style>
</head>
<body>
    <!-- Setup Screen -->
    <div id="setupScreen" class="setup-overlay">
        <div class="glass max-w-sm w-full rounded-[2.5rem] p-8 shadow-2xl border-t border-white/20">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-blue-500/20 rounded-3xl flex items-center justify-center mx-auto mb-4 border border-blue-500/30">
                    <span class="text-4xl">🗺️</span>
                </div>
                <h1 class="text-3xl font-black tracking-tight text-white mb-2 italic uppercase">Map <span class="text-blue-400">Explorer</span></h1>
                <p class="text-slate-400 text-sm font-medium">Map your collection across the USA</p>
            </div>

            <div class="space-y-5">
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">BGG Username</label>
                    <input type="text" id="usernameInput" value="sportomax" class="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all font-medium">
                </div>

                <button onclick="loadCollection()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black text-lg uppercase tracking-tight hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2 mt-4 shadow-xl shadow-blue-500/20">
                    Map It
                </button>
            </div>
        </div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Game Detail Panel -->
    <div id="gamePanel" class="game-panel hidden">
        <div class="game-panel-content glass rounded-[2rem] p-4 border border-white/10 shadow-2xl flex items-center gap-4 animate-slide-up">
            <div class="w-16 h-16 rounded-xl overflow-hidden flex-shrink-0 border border-white/5 bg-black/20">
                <img id="panelImg" src="" class="w-full h-full object-contain">
            </div>
            <div class="flex-1 min-w-0">
                <p id="panelState" class="text-[8px] font-black uppercase tracking-[0.2em] text-blue-400 mb-1"></p>
                <h3 id="panelName" class="text-sm font-black text-white uppercase italic tracking-tighter truncate leading-tight"></h3>
                <button id="panelLink" onclick="" class="text-[9px] font-bold text-slate-500 hover:text-white transition-colors uppercase tracking-widest mt-1 flex items-center gap-1">
                    View on BGG
                    <svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </button>
            </div>
            <button onclick="closePanel()" class="text-slate-500 hover:text-white p-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
    </div>

    <script>
        let map;
        let collection = [];
        let stateLayers = [];

        const STATE_CENTROIDS = {
            "AL": [32.806671, -86.791130], "AK": [61.370716, -152.404419], "AZ": [33.729759, -111.431221], "AR": [34.969704, -92.373123],
            "CA": [36.116203, -119.681564], "CO": [39.059811, -105.311104], "CT": [41.597782, -72.755371], "DE": [38.910832, -75.527670],
            "FL": [27.766279, -81.686783], "GA": [33.040619, -83.643074], "HI": [21.094318, -157.498337], "ID": [44.240459, -114.478828],
            "IL": [40.349457, -88.986137], "IN": [39.849426, -86.258278], "IA": [42.011539, -93.210526], "KS": [38.526600, -96.726486],
            "KY": [37.668140, -84.670067], "LA": [31.169546, -91.867805], "ME": [44.693947, -69.381927], "MD": [39.063946, -76.802101],
            "MA": [42.230171, -71.530106], "MI": [43.326618, -84.536095], "MN": [45.694454, -93.900192], "MS": [32.741646, -89.678696],
            "MO": [38.456085, -92.288368], "MT": [46.921925, -110.454353], "NE": [41.125370, -98.268082], "NV": [38.313515, -117.055374],
            "NH": [43.452492, -71.563896], "NJ": [40.298904, -74.521011], "NM": [34.840515, -106.248482], "NY": [42.165726, -74.948051],
            "NC": [35.630066, -79.806419], "ND": [47.528912, -99.784012], "OH": [40.388783, -82.764915], "OK": [35.565342, -96.928917],
            "OR": [44.572021, -122.070938], "PA": [40.590752, -77.209755], "RI": [41.680893, -71.511780], "SC": [33.856892, -80.945007],
            "SD": [44.299782, -99.438828], "TN": [35.747845, -86.692345], "TX": [31.054487, -97.563461], "UT": [40.150032, -111.862434],
            "VT": [44.045876, -72.710686], "VA": [37.769337, -78.169968], "WA": [47.400902, -121.490494], "WV": [38.491226, -80.954453],
            "WI": [44.268543, -89.616508], "WY": [42.755966, -107.302490]
        };

        function initMap() {
            map = L.map('map', {
                center: [37.8, -96],
                zoom: 4,
                zoomControl: false,
                attributionControl: false
            });

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 19
            }).addTo(map);
        }

        async function fetchWithRetry(url, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                const response = await fetch(url);
                if (response.status === 202) {
                    await new Promise(r => setTimeout(r, 3000));
                    continue;
                }
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response;
            }
            throw new Error('Timeout');
        }

        async function loadCollection() {
            const username = document.getElementById('usernameInput').value.trim() || 'sportomax';
            const setupScreen = document.getElementById('setupScreen');
            
            try {
                const res = await fetchWithRetry(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1`);
                const xml = await res.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(xml, 'text/xml');
                
                collection = Array.from(doc.querySelectorAll('item')).map(item => ({
                    id: item.getAttribute('objectid'),
                    name: item.querySelector('name').textContent,
                    thumbnail: item.querySelector('thumbnail')?.textContent || ''
                })).filter(g => g.thumbnail);

                if (collection.length === 0) throw new Error('No games found');

                setupScreen.classList.add('hidden');
                initMap();
                populateMap();
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }

        function populateMap() {
            const shuffled = [...collection].sort(() => Math.random() - 0.5);
            let gameIdx = 0;

            Object.entries(STATE_CENTROIDS).forEach(([abbr, coords]) => {
                const game = shuffled[gameIdx % shuffled.length];
                gameIdx++;

                const icon = L.divIcon({
                    className: 'custom-marker',
                    html: `<img src="${game.thumbnail}" class="state-thumb w-8 h-8 md:w-10 md:h-10" alt="${abbr}">`,
                    iconSize: [40, 40],
                    iconAnchor: [20, 20]
                });

                const marker = L.marker(coords, { icon: icon }).addTo(map);
                
                marker.on('click', () => {
                    showPanel(abbr, game);
                });
            });
        }

        function showPanel(state, game) {
            const panel = document.getElementById('gamePanel');
            document.getElementById('panelState').textContent = state;
            document.getElementById('panelName').textContent = game.name;
            document.getElementById('panelImg').src = game.thumbnail;
            document.getElementById('panelLink').onclick = () => window.open(`https://boardgamegeek.com/boardgame/${game.id}`, '_blank');
            
            panel.classList.remove('hidden');
        }

        function closePanel() {
            document.getElementById('gamePanel').classList.add('hidden');
        }

        function wait(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
    </script>
</body>
</html>
