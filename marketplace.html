<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Marketplace</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>💰</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            height: 100%;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            padding-top: env(safe-area-inset-top, 0);
            padding-bottom: env(safe-area-inset-bottom, 0);
            padding-left: env(safe-area-inset-left, 0);
            padding-right: env(safe-area-inset-right, 0);
        }

        .header {
            flex-shrink: 0;
            padding: 1rem;
            border-bottom: 1px solid #eee;
            background: white;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            color: #333;
        }

        .setup-section {
            flex-shrink: 0;
            padding: 1rem;
            background: white;
            border-bottom: 1px solid #eee;
            max-height: 50vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .setup-input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            -webkit-appearance: none;
            appearance: none;
        }

        .setup-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn {
            padding: 0.75rem 1rem;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            font-size: 1rem;
            min-width: 50px;
        }

        .btn:active {
            opacity: 0.9;
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #333;
        }

        .btn-secondary:active {
            background: #d1d5db;
        }

        .filter-section {
            margin-bottom: 0.75rem;
        }

        .filter-title {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            color: #333;
        }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .filter-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            flex: 0 1 calc(50% - 0.25rem);
        }

        .filter-checkbox:active {
            background: #e0e0e0;
        }

        .filter-checkbox input {
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #ddd;
            border-radius: 4px;
            background: white;
            margin: 0;
        }

        .filter-checkbox input:checked {
            background: #6366f1;
            border-color: #6366f1;
        }

        .status {
            font-size: 0.85rem;
            color: #666;
            padding: 0.5rem;
            background: #f9f9f9;
            border-radius: 4px;
            text-align: center;
        }

        .status.active {
            color: #6366f1;
            font-weight: 600;
        }

        .cache-info {
            font-size: 0.75rem;
            color: #999;
            margin-top: 0.5rem;
            padding: 0.5rem;
            background: #f9f9f9;
            border-radius: 4px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .search-bar {
            flex-shrink: 0;
            padding: 0.75rem 1rem;
            background: white;
            border-bottom: 1px solid #eee;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            -webkit-appearance: none;
            appearance: none;
        }

        .search-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .games-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .game-card {
            background: white;
            border: 1px solid #eee;
            border-radius: 8px;
            overflow: hidden;
        }

        .game-header {
            padding: 1rem;
            background: #f9f9f9;
            border-bottom: 1px solid #eee;
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
        }

        .game-stats {
            padding: 0.75rem 1rem;
            background: white;
            border-bottom: 1px solid #eee;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .stat-box {
            padding: 0.5rem;
            background: #f0f9ff;
            border: 1px solid #bfdbfe;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .stat-label {
            font-weight: 600;
            color: #1e40af;
            font-size: 0.75rem;
            margin-bottom: 0.25rem;
        }

        .stat-value {
            font-size: 0.9rem;
            color: #333;
            font-weight: 600;
        }

        .listings-list {
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .listing-item {
            padding: 0.75rem;
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .listing-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: #059669;
        }

        .listing-condition {
            display: inline-block;
            padding: 0.3rem 0.6rem;
            background: #dbeafe;
            color: #1e40af;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            width: fit-content;
        }

        .listing-condition.likenew {
            background: #dcfce7;
            color: #166534;
        }

        .listing-condition.verygood {
            background: #bfdbfe;
            color: #1e40af;
        }

        .listing-condition.good {
            background: #fef3c7;
            color: #92400e;
        }

        .listing-condition.acceptable {
            background: #fed7aa;
            color: #92400e;
        }

        .listing-date {
            font-size: 0.8rem;
            color: #666;
        }

        .listing-notes {
            font-size: 0.8rem;
            color: #666;
            padding: 0.5rem;
            background: white;
            border-radius: 4px;
            border: 1px solid #eee;
            max-height: 60px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            word-break: break-word;
        }

        .listing-link {
            display: inline-block;
            color: #6366f1;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0.4rem 0.75rem;
            background: #eff6ff;
            border-radius: 4px;
            border: 1px solid #bfdbfe;
        }

        .listing-link:active {
            background: #dbeafe;
        }

        .no-data {
            text-align: center;
            padding: 2rem 1rem;
            color: #999;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-overlay.hidden {
            display: none;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 430px;
            width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid #eee;
            font-size: 1.3rem;
            font-weight: 700;
            color: #333;
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 1rem;
        }

        .modal-footer {
            padding: 1rem;
            border-top: 1px solid #eee;
            display: flex;
            gap: 0.5rem;
            background: #f9f9f9;
        }

        .modal-footer button {
            flex: 1;
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 Marketplace</h1>
        </div>

        <div class="main-content">
            <div class="search-bar">
                <input type="text" id="searchInput" class="search-input" placeholder="Search games...">
            </div>

            <div class="games-list" id="gamesList"></div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">⚙️ Settings</div>
            <div class="modal-body">
                <div style="margin-bottom: 1rem;">
                    <div class="filter-title">👤 Username</div>
                    <input type="text" id="usernameInput" class="setup-input" placeholder="Enter BGG username" value="sportomax">
                </div>

                <div class="filter-section">
                    <div class="filter-title">📦 Collection Status</div>
                    <div class="filter-group">
                        <label class="filter-checkbox">
                            <input type="checkbox" name="status" value="own" checked>
                            Own
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" name="status" value="wanttoplay">
                            Want to Play
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" name="status" value="wanttobuy">
                            Want to Buy
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" name="status" value="prevowned">
                            Prev. Owned
                        </label>
                    </div>
                </div>

                <div class="filter-section">
                    <div class="filter-title">🔍 Condition Filter</div>
                    <div class="filter-group">
                        <label class="filter-checkbox">
                            <input type="checkbox" name="condition" value="likenew" checked>
                            Like New
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" name="condition" value="verygood" checked>
                            Very Good
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" name="condition" value="good" checked>
                            Good
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" name="condition" value="acceptable" checked>
                            Acceptable
                        </label>
                    </div>
                </div>

                <div class="status" id="processingStatus" style="margin-top: 1rem;"></div>
                <div class="cache-info" id="cacheInfo"></div>
            </div>
            <div class="modal-footer">
                <button class="btn" id="loadBtn">📦 Load</button>
                <button class="btn btn-secondary" id="clearBtn">🗑️ Clear</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY_COLLECTION = 'bgg_marketplace_collection';
        const STORAGE_KEY_MARKET_DATA = 'bgg_marketplace_data';
        const STORAGE_KEY_TIMESTAMP = 'bgg_marketplace_timestamp';

        let allGames = [];
        let gameListings = {};
        let currentUsername = 'sportomax';

        const usernameInput = document.getElementById('usernameInput');
        const loadBtn = document.getElementById('loadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const processingStatus = document.getElementById('processingStatus');
        const cacheInfo = document.getElementById('cacheInfo');
        const gamesList = document.getElementById('gamesList');
        const searchInput = document.getElementById('searchInput');
        const settingsModal = document.getElementById('settingsModal');

        // Show modal on load
        function showModal() {
            settingsModal.classList.remove('hidden');
        }

        // Hide modal
        function hideModal() {
            settingsModal.classList.add('hidden');
        }

        // Load button
        loadBtn.addEventListener('click', loadCollection);

        // Clear cache
        clearBtn.addEventListener('click', () => {
            localStorage.removeItem(STORAGE_KEY_COLLECTION);
            localStorage.removeItem(STORAGE_KEY_MARKET_DATA);
            localStorage.removeItem(STORAGE_KEY_TIMESTAMP);
            processingStatus.textContent = '✅ Cache cleared';
            processingStatus.classList.add('active');
            allGames = [];
            gameListings = {};
            gamesList.innerHTML = '';
            cacheInfo.textContent = '';
            setTimeout(() => { processingStatus.classList.remove('active'); }, 2000);
        });

        // Search
        searchInput.addEventListener('input', renderGames);

        // Helper functions
        async function fetchWithRetry(url, maxRetries = 3) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url);
                    if (response.status === 202) {
                        await new Promise(resolve => setTimeout(resolve, 2000 * (i + 1)));
                        continue;
                    }
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response;
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    await new Promise(resolve => setTimeout(resolve, 1000 * (i + 1)));
                }
            }
        }

        // Get selected statuses
        function getSelectedStatuses() {
            const checkboxes = document.querySelectorAll('input[name="status"]:checked');
            return Array.from(checkboxes).map(cb => cb.value);
        }

        // Load collection
        async function loadCollection() {
            const username = usernameInput.value.trim();
            if (!username) {
                processingStatus.textContent = '❌ Please enter a username';
                processingStatus.classList.add('active');
                return;
            }

            const statuses = getSelectedStatuses();
            if (statuses.length === 0) {
                processingStatus.textContent = '❌ Select at least one status';
                processingStatus.classList.add('active');
                return;
            }

            currentUsername = username;
            localStorage.setItem('bgg_marketplace_username', username);

            processingStatus.classList.add('active');
            processingStatus.textContent = '📦 Loading collection...';
            console.log('🔍 Fetching collection for:', username);

            try {
                // Check cache
                const cached = localStorage.getItem(STORAGE_KEY_COLLECTION);
                if (cached) {
                    allGames = JSON.parse(cached);
                    gameListings = JSON.parse(localStorage.getItem(STORAGE_KEY_MARKET_DATA) || '{}');
                    processingStatus.textContent = `✅ Loaded ${allGames.length} games from cache`;
                    console.log('✅ Loaded from cache:', allGames.length, 'games');
                    updateCacheInfo();
                    renderGames();
                    hideModal();
                } else {
                    // Fetch collection
                    const statusParams = statuses.map(s => `&${s}=1`).join('');
                    const url = `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}${statusParams}&stats=1`;
                    console.log('🔗 API URL:', url);
                    
                    const response = await fetchWithRetry(url);
                    const xml = new DOMParser().parseFromString(await response.text(), 'text/xml');
                    const items = xml.querySelectorAll('item');

                    allGames = Array.from(items).map(item => ({
                        id: item.getAttribute('objectid'),
                        name: item.querySelector('name')?.textContent || 'Unknown',
                        image: item.querySelector('image')?.textContent || ''
                    })).filter(g => g.id);

                    console.log('📦 Collection fetched:', allGames.length, 'games');
                    localStorage.setItem(STORAGE_KEY_COLLECTION, JSON.stringify(allGames));
                    processingStatus.textContent = `✅ Loaded ${allGames.length} games`;
                    updateCacheInfo();

                    // Process games in batches
                    await processGameBatches();
                    hideModal();
                }

            } catch (error) {
                processingStatus.textContent = `❌ Error: ${error.message}`;
                console.error('❌ Error:', error);
            }
        }

        // Process games in batches
        async function processGameBatches() {
            const batchSize = 20;
            let processed = 0;
            gameListings = {};

            for (let i = 0; i < allGames.length; i += batchSize) {
                const batch = allGames.slice(i, i + batchSize);
                const ids = batch.map(g => g.id).join(',');

                try {
                    processingStatus.textContent = `💰 Processing ${Math.min(processed + batch.length, allGames.length)}/${allGames.length} games...`;
                    console.log(`🔄 Batch ${Math.ceil((i + 1) / batchSize)}: Fetching ${batch.length} games...`);

                    const url = `/api/bgg-helper?endpoint=thing&id=${ids}&type=boardgame&marketplace=1`;
                    const response = await fetchWithRetry(url);
                    const xml = new DOMParser().parseFromString(await response.text(), 'text/xml');
                    const items = xml.querySelectorAll('item');

                    let batchListings = 0;
                    Array.from(items).forEach(item => {
                        const gameId = item.getAttribute('id');
                        const game = allGames.find(g => g.id === gameId);
                        if (!game) return;

                        const marketplaceEl = item.querySelector('marketplace');
                        if (marketplaceEl) {
                            const listings = Array.from(marketplaceEl.querySelectorAll('listing')).map(l => ({
                                date: l.querySelector('listdate')?.getAttribute('value') || '',
                                price: parseFloat(l.querySelector('price')?.getAttribute('value') || 0),
                                currency: l.querySelector('price')?.getAttribute('currency') || 'USD',
                                condition: l.querySelector('condition')?.getAttribute('value') || 'unknown',
                                notes: l.querySelector('notes')?.getAttribute('value') || '',
                                link: l.querySelector('link')?.getAttribute('href') || ''
                            }));

                            if (listings.length > 0) {
                                gameListings[gameId] = {
                                    name: game.name,
                                    image: game.image,
                                    listings: listings,
                                    stats: calculateListingStats(listings)
                                };
                                batchListings++;
                            }
                        }
                    });

                    console.log(`✅ Batch complete: Found ${batchListings} games with listings`);
                    processed += batch.length;
                    renderGames();

                } catch (error) {
                    console.error(`❌ Error processing batch at ${i}:`, error);
                    processingStatus.textContent = `⚠️ Error in batch: ${error.message}`;
                }

                await new Promise(resolve => setTimeout(resolve, 200));
            }

            localStorage.setItem(STORAGE_KEY_MARKET_DATA, JSON.stringify(gameListings));
            localStorage.setItem(STORAGE_KEY_TIMESTAMP, new Date().toISOString());

            const resultText = `✅ Done! Found ${Object.keys(gameListings).length} games with listings`;
            processingStatus.textContent = resultText;
            console.log(resultText);
            setTimeout(() => { processingStatus.classList.remove('active'); }, 3000);
        }

        // Calculate listing stats
        function calculateListingStats(listings) {
            const prices = listings.filter(l => l.price > 0).map(l => l.price);
            const conditions = {};
            listings.forEach(l => {
                conditions[l.condition] = (conditions[l.condition] || 0) + 1;
            });

            const avgPrice = prices.length > 0 ? (prices.reduce((a, b) => a + b, 0) / prices.length).toFixed(2) : 0;
            const minPrice = prices.length > 0 ? Math.min(...prices).toFixed(2) : 0;
            const maxPrice = prices.length > 0 ? Math.max(...prices).toFixed(2) : 0;

            return {
                count: listings.length,
                avgPrice: avgPrice,
                minPrice: minPrice,
                maxPrice: maxPrice,
                conditions: conditions
            };
        }

        // Get selected conditions
        function getSelectedConditions() {
            const checkboxes = document.querySelectorAll('input[name="condition"]:checked');
            return Array.from(checkboxes).map(cb => cb.value);
        }

        // Render games
        function renderGames() {
            const searchTerm = searchInput.value.toLowerCase();
            const selectedConditions = getSelectedConditions();

            const games = Object.entries(gameListings)
                .filter(([gameId, game]) => {
                    if (!game.name.toLowerCase().includes(searchTerm)) return false;
                    return game.listings.some(l => selectedConditions.includes(l.condition));
                })
                .sort((a, b) => a[1].name.localeCompare(b[1].name));

            if (games.length === 0) {
                gamesList.innerHTML = '<div class="no-data">No games with listings found</div>';
                return;
            }

            gamesList.innerHTML = games.map(([gameId, game]) => {
                const stats = game.stats;
                const filteredListings = game.listings.filter(l => selectedConditions.includes(l.condition));

                return `
                    <div class="game-card">
                        <div class="game-header">${escapeHtml(game.name)}</div>
                        <div class="game-stats">
                            <div class="stat-box">
                                <div class="stat-label">📊 Listings</div>
                                <div class="stat-value">${stats.count}</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-label">💵 Avg Price</div>
                                <div class="stat-value">$${stats.avgPrice}</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-label">📉 Min</div>
                                <div class="stat-value">$${stats.minPrice}</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-label">📈 Max</div>
                                <div class="stat-value">$${stats.maxPrice}</div>
                            </div>
                        </div>
                        <div class="listings-list">
                            ${filteredListings.map(listing => `
                                <div class="listing-item">
                                    <div class="listing-price">💰 $${listing.price.toFixed(2)}</div>
                                    <div class="listing-condition ${listing.condition}">${capitalizeFirst(listing.condition)}</div>
                                    <div class="listing-date">📅 ${formatDate(listing.date)}</div>
                                    ${listing.notes ? `<div class="listing-notes">${escapeHtml(listing.notes)}</div>` : ''}
                                    <a href="${listing.link}" target="_blank" class="listing-link">🔗 View Listing</a>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Format date
        function formatDate(dateStr) {
            if (!dateStr) return 'Unknown date';
            const date = new Date(dateStr);
            return date.toLocaleDateString();
        }

        // Capitalize first
        function capitalizeFirst(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        // Update cache info
        function updateCacheInfo() {
            const timestamp = localStorage.getItem(STORAGE_KEY_TIMESTAMP);
            if (timestamp) {
                const date = new Date(timestamp);
                cacheInfo.textContent = `💾 Cached: ${date.toLocaleString()} | Games: ${allGames.length}`;
            }
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize
        window.addEventListener('load', () => {
            const savedUsername = localStorage.getItem('bgg_marketplace_username');
            if (savedUsername) {
                usernameInput.value = savedUsername;
            }
            updateCacheInfo();
