<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Marketplace | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>💰</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        :root { --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom); }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
            height: 100dvh;
        }

        .glass {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .game-card { transition: all 0.15s cubic-bezier(0.4,0,0.2,1); }
        .game-card:active { transform: scale(0.97); }

        .listing-card {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 1rem;
            border-radius: 1rem;
            transition: background 0.15s;
        }
        .listing-card:hover { background: rgba(255,255,255,0.04); }

        .btn-primary { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }

        .input-dark {
            background-color: rgba(15,23,42,0.6) !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            border-radius: 0.75rem !important;
            padding: 0.65rem 1rem !important;
            color: #ffffff !important;
            width: 100%;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-dark:focus {
            border-color: #10b981 !important;
            box-shadow: 0 0 0 2px rgba(16,185,129,0.18);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 3px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 10px; }

        @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        .animate-in { animation: fadeIn 0.3s ease-out forwards; }

        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(15,23,42,0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            padding: 1rem;
        }

        .progress-fill { transition: width 0.5s cubic-bezier(0.4,0,0.2,1); }

        /* Status filter pills */
        .status-pill {
            padding: 0.4rem 0.85rem;
            border-radius: 9999px;
            border: 1px solid rgba(255,255,255,0.08);
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            transition: all 0.15s;
            background: rgba(255,255,255,0.04);
            color: #64748b;
            white-space: nowrap;
            cursor: pointer;
        }
        .status-pill.active {
            background: rgba(99,102,241,0.2);
            border-color: rgba(99,102,241,0.4);
            color: #a5b4fc;
        }

        /* Sort buttons */
        .sort-btn {
            padding: 0.4rem 0.75rem;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.08);
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.15s;
            background: rgba(255,255,255,0.04);
            color: #64748b;
            cursor: pointer;
            white-space: nowrap;
        }
        .sort-btn.active {
            background: rgba(16,185,129,0.18);
            border-color: rgba(16,185,129,0.35);
            color: #34d399;
        }

        /* Condition badges */
        .cond-badge {
            font-size: 0.6rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.05em;
            padding: 0.2rem 0.55rem; border-radius: 6px; border: 1px solid;
        }
        .cond-new          { color: #f472b6; border-color: rgba(244,114,182,0.3); background: rgba(244,114,182,0.1); }
        .cond-likenew      { color: #34d399; border-color: rgba(52,211,153,0.3);  background: rgba(52,211,153,0.1);  }
        .cond-verygood     { color: #60a5fa; border-color: rgba(96,165,250,0.3);  background: rgba(96,165,250,0.1);  }
        .cond-good         { color: #fbbf24; border-color: rgba(251,191,36,0.3);  background: rgba(251,191,36,0.1);  }
        .cond-acceptable   { color: #fb923c; border-color: rgba(251,146,60,0.3);  background: rgba(251,146,60,0.1);  }
    </style>
</head>
<body class="selection:bg-emerald-500/30">
    <div class="relative z-10 flex flex-col h-full">

        <!-- Header -->
        <header class="px-4 py-3 flex items-center justify-between gap-3 border-b border-white/5 bg-slate-900/60 backdrop-blur-md shrink-0">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-9 h-9 bg-emerald-500/15 rounded-xl flex items-center justify-center border border-emerald-500/25 shrink-0">
                    <i data-lucide="shopping-cart" class="text-emerald-400 w-4 h-4"></i>
                </div>
                <div class="min-w-0">
                    <h1 class="text-base font-black uppercase tracking-tight leading-none text-white">
                        BGG <span class="text-emerald-400">Market</span>
                        <span id="displayUsername" class="hidden text-slate-500 font-medium normal-case tracking-normal text-sm ml-1.5"></span>
                    </h1>
                    <div class="flex gap-3 mt-0.5">
                        <span class="text-[10px] text-slate-600"><span class="text-emerald-400 font-bold" id="gamesLoadedMetric">0</span> games</span>
                        <span class="text-[10px] text-slate-600"><span class="text-slate-400 font-bold" id="apiCallsMetric">0</span> calls</span>
                        <span class="text-[10px] text-slate-600"><span class="text-slate-400 font-bold" id="elapsedMetric">0s</span></span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <button onclick="showModal()" class="glass px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white transition-all">Settings</button>
                <a href="index.html" class="glass px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white transition-all">Back</a>
            </div>
        </header>

        <!-- Progress Bar -->
        <div class="px-4 py-2 bg-black/20 border-b border-white/5 shrink-0">
            <div class="h-1 w-full bg-white/5 rounded-full overflow-hidden">
                <div id="progressFill" class="progress-fill h-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]" style="width:0%"></div>
            </div>
            <div class="flex justify-between mt-1">
                <span id="statusMetric" class="text-[9px] font-semibold text-slate-600 uppercase tracking-wide">Ready</span>
                <span id="progressText" class="text-[9px] font-bold text-emerald-500 uppercase tracking-wide">0%</span>
            </div>
        </div>

        <!-- Status Filters -->
        <div class="px-4 pt-3 pb-2 flex gap-2 overflow-x-auto shrink-0" style="scrollbar-width:none">
            <button onclick="toggleStatusFilter('own')"        class="status-pill active" id="filter-own">Own</button>
            <button onclick="toggleStatusFilter('wanttoplay')" class="status-pill"        id="filter-wanttoplay">Want Play</button>
            <button onclick="toggleStatusFilter('wanttobuy')"  class="status-pill"        id="filter-wanttobuy">Want Buy</button>
            <button onclick="toggleStatusFilter('wishlist')"   class="status-pill"        id="filter-wishlist">Wishlist</button>
            <button onclick="toggleStatusFilter('fortrade')"   class="status-pill"        id="filter-fortrade">For Trade</button>
            <button onclick="toggleStatusFilter('prevowned')"  class="status-pill"        id="filter-prevowned">Prev Owned</button>
        </div>

        <!-- Search + Sort -->
        <div class="px-4 pb-3 space-y-2 shrink-0">
            <div class="glass rounded-xl flex items-center gap-2 px-3 py-0 focus-within:ring-1 focus-within:ring-emerald-500/40 transition-all">
                <i data-lucide="search" class="w-3.5 h-3.5 text-slate-600 shrink-0"></i>
                <input type="text" id="searchInput"
                    class="flex-1 bg-transparent border-none text-sm text-white focus:outline-none py-2.5 placeholder:text-slate-600"
                    placeholder="Search games…">
            </div>
            <div class="flex gap-1.5 overflow-x-auto" style="scrollbar-width:none">
                <button class="sort-btn active" id="sortNameAsc">A–Z</button>
                <button class="sort-btn"        id="sortNameDesc">Z–A</button>
                <button class="sort-btn"        id="sortPriceAsc">Cheapest</button>
                <button class="sort-btn"        id="sortListingsDesc">Most Listings</button>
            </div>
        </div>

        <!-- Game List -->
        <div id="gamesList" class="flex-1 overflow-y-auto custom-scrollbar px-4 pb-8 space-y-2">
            <div class="flex flex-col items-center justify-center py-24 text-slate-700">
                <i data-lucide="shopping-bag" class="w-10 h-10 mb-3 opacity-30"></i>
                <p class="text-xs font-semibold uppercase tracking-widest">No market data loaded</p>
                <p class="text-xs text-slate-700 mt-1">Open Settings to load your collection</p>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal-overlay hidden">
        <div class="glass relative max-w-sm w-full rounded-2xl p-6 shadow-2xl">
            <div class="flex items-center gap-3 mb-5">
                <div class="w-10 h-10 bg-emerald-500/15 rounded-xl flex items-center justify-center border border-emerald-500/25">
                    <i data-lucide="user" class="text-emerald-400 w-5 h-5"></i>
                </div>
                <div>
                    <h2 class="text-base font-black uppercase tracking-tight text-white">Load <span class="text-emerald-400">Profile</span></h2>
                    <p class="text-xs text-slate-500 mt-0.5">Enter your BGG username to fetch listings</p>
                </div>
            </div>

            <div class="space-y-4">
                <div class="space-y-1.5">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">BGG Username</label>
                    <input type="text" id="usernameInput" value="sportomax" class="input-dark">
                </div>
                <div class="flex gap-2">
                    <button id="loadBtn" onclick="loadCollection()" class="flex-1 btn-primary text-white py-3 rounded-xl font-bold text-xs uppercase tracking-wider hover:opacity-90 transition-all shadow-lg shadow-emerald-500/20">Fetch Collection</button>
                    <button id="clearBtn" class="bg-white/5 text-slate-500 px-4 rounded-xl border border-white/8 hover:text-white hover:bg-white/10 transition-all text-sm">🗑️</button>
                </div>
                <button onclick="hideModal()" class="w-full text-xs font-medium text-slate-600 hover:text-slate-400 transition-all py-1">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Details Modal -->
    <div id="detailsModal" class="modal-overlay hidden">
        <div class="glass relative max-w-lg w-full rounded-2xl p-5 shadow-2xl flex flex-col max-h-[88vh]">
            <header class="flex items-center gap-3 mb-4 shrink-0">
                <div class="w-14 h-14 rounded-xl bg-black/40 border border-white/5 overflow-hidden shrink-0">
                    <img id="detailsImg" src="" class="w-full h-full object-contain">
                </div>
                <div class="flex-1 min-w-0">
                    <h2 id="detailsHeader" class="text-base font-black text-white truncate leading-tight"></h2>
                    <p id="detailsCount" class="text-xs text-emerald-400 font-medium mt-0.5"></p>
                </div>
                <button onclick="closeDetailsModal()" class="w-8 h-8 glass rounded-xl flex items-center justify-center text-slate-500 hover:text-white transition-all text-sm shrink-0">✕</button>
            </header>
            <div id="detailsBody" class="flex-1 overflow-y-auto custom-scrollbar space-y-2.5 pr-1"></div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const STORAGE_KEY_COLLECTION = 'bgg_market_all';
        const IMAGE_PROXY = '/api/image-proxy?url=';

        let allGames = [];
        let gameListings = {};
        let totalApiCalls = 0;
        let startTime = null;
        let currentSort = 'nameAsc';
        let activeStatusFilters = new Set(['own']);

        const usernameInput      = document.getElementById('usernameInput');
        const gamesList          = document.getElementById('gamesList');
        const searchInput        = document.getElementById('searchInput');
        const settingsModal      = document.getElementById('settingsModal');
        const detailsModal       = document.getElementById('detailsModal');
        const progressFill       = document.getElementById('progressFill');
        const progressText       = document.getElementById('progressText');
        const gamesLoadedMetric  = document.getElementById('gamesLoadedMetric');
        const apiCallsMetric     = document.getElementById('apiCallsMetric');
        const elapsedMetric      = document.getElementById('elapsedMetric');
        const statusMetric       = document.getElementById('statusMetric');

        // ── Status filter pills ────────────────────────────────────
        function toggleStatusFilter(status) {
            if (activeStatusFilters.has(status)) {
                activeStatusFilters.delete(status);
                document.getElementById(`filter-${status}`).classList.remove('active');
            } else {
                activeStatusFilters.add(status);
                document.getElementById(`filter-${status}`).classList.add('active');
            }
            renderGames();
        }

        // ── Modal helpers ──────────────────────────────────────────
        function showModal() { settingsModal.classList.remove('hidden'); }
        function hideModal() { settingsModal.classList.add('hidden'); }
        function closeDetailsModal() { detailsModal.classList.add('hidden'); }

        settingsModal.addEventListener('click', e => { if (e.target === settingsModal) hideModal(); });
        detailsModal.addEventListener('click',  e => { if (e.target === detailsModal)  closeDetailsModal(); });

        // ── Metrics ────────────────────────────────────────────────
        function updateMetrics() {
            if (startTime) elapsedMetric.textContent = Math.round((Date.now() - startTime) / 1000) + 's';
            gamesLoadedMetric.textContent = Object.keys(gameListings).length;
            apiCallsMetric.textContent    = totalApiCalls;
        }

        function updateProgress(current, total) {
            if (!total) return;
            const pct = Math.round((current / total) * 100);
            progressFill.style.width = pct + '%';
            progressText.textContent = pct + '%';
        }

        // ── Sort ───────────────────────────────────────────────────
        document.getElementById('sortNameAsc').addEventListener('click',     e => { currentSort = 'nameAsc';      setActiveSort(e.target); renderGames(); });
        document.getElementById('sortNameDesc').addEventListener('click',    e => { currentSort = 'nameDesc';     setActiveSort(e.target); renderGames(); });
        document.getElementById('sortPriceAsc').addEventListener('click',    e => { currentSort = 'priceAsc';     setActiveSort(e.target); renderGames(); });
        document.getElementById('sortListingsDesc').addEventListener('click',e => { currentSort = 'listingsDesc'; setActiveSort(e.target); renderGames(); });

        function setActiveSort(btn) {
            document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // ── Clear cache ────────────────────────────────────────────
        document.getElementById('clearBtn').addEventListener('click', () => {
            const user = usernameInput.value.trim();
            localStorage.removeItem(STORAGE_KEY_COLLECTION + '_' + user);
            allGames = []; gameListings = {};
            gamesList.innerHTML = '';
            statusMetric.textContent = 'Cache cleared';
        });

        searchInput.addEventListener('input', renderGames);

        // ── Fetch helper ───────────────────────────────────────────
        async function fetchWithRetry(url, maxRetries = 3) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    totalApiCalls++; updateMetrics();
                    const res = await fetch(url);
                    if (res.status === 202) { await new Promise(r => setTimeout(r, 2000 * (i + 1))); continue; }
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res;
                } catch (err) {
                    if (i === maxRetries - 1) throw err;
                    await new Promise(r => setTimeout(r, 1000 * (i + 1)));
                }
            }
        }

        // ── Load collection ────────────────────────────────────────
        async function loadCollection() {
            const user = usernameInput.value.trim();
            if (!user) return;

            localStorage.setItem('bgg_marketplace_username', user);
            const displayUser = document.getElementById('displayUsername');
            displayUser.textContent = user;
            displayUser.classList.remove('hidden');

            hideModal();
            startTime = Date.now(); totalApiCalls = 0;
            statusMetric.textContent = 'Loading…';
            updateMetrics(); updateProgress(0, 100);

            try {
                const cacheKey = STORAGE_KEY_COLLECTION + '_' + user;
                const cached = localStorage.getItem(cacheKey);
                if (cached) {
                    allGames = JSON.parse(cached);
                } else {
                    const res = await fetchWithRetry(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(user)}&stats=1`);
                    const xml = new DOMParser().parseFromString(await res.text(), 'text/xml');
                    allGames = Array.from(xml.querySelectorAll('item')).map(item => {
                        const s = item.querySelector('status');
                        return {
                            id:    item.getAttribute('objectid'),
                            name:  item.querySelector('name')?.textContent || 'Unknown',
                            image: item.querySelector('image')?.textContent || '',
                            status: {
                                own:        s?.getAttribute('own') === '1',
                                prevowned:  s?.getAttribute('prevowned') === '1',
                                fortrade:   s?.getAttribute('fortrade') === '1',
                                want:       s?.getAttribute('want') === '1',
                                wanttoplay: s?.getAttribute('wanttoplay') === '1',
                                wanttobuy:  s?.getAttribute('wanttobuy') === '1',
                                wishlist:   s?.getAttribute('wishlist') === '1'
                            }
                        };
                    }).filter(g => g.id);
                    localStorage.setItem(cacheKey, JSON.stringify(allGames));
                }
                await processGameBatches();
            } catch (e) {
                console.error(e);
                statusMetric.textContent = 'Error';
            }
        }

        // ── Process batches ────────────────────────────────────────
        async function processGameBatches() {
            const batchSize = 20;
            const parallelLimit = 100;
            let processed = 0;
            gameListings = {};

            const batches = [];
            for (let i = 0; i < allGames.length; i += batchSize) batches.push(allGames.slice(i, i + batchSize));

            for (let i = 0; i < batches.length; i += parallelLimit) {
                const group = batches.slice(i, i + parallelLimit);
                statusMetric.textContent = `Batch ${Math.floor(i / parallelLimit) + 1}/${Math.ceil(batches.length / parallelLimit)}`;

                await Promise.all(group.map(async batch => {
                    const ids = batch.map(g => g.id).join(',');
                    try {
                        const res = await fetchWithRetry(`/api/bgg-helper?endpoint=thing&id=${ids}&type=boardgame&marketplace=1`);
                        const xml = new DOMParser().parseFromString(await res.text(), 'text/xml');
                        Array.from(xml.querySelectorAll('item')).forEach(item => {
                            const id   = item.getAttribute('id');
                            const game = allGames.find(g => g.id === id);
                            const mkt  = item.querySelector('marketplacelistings');
                            if (!mkt || !game) return;
                            const listings = Array.from(mkt.querySelectorAll('listing')).map(l => ({
                                date:      l.querySelector('listdate')?.getAttribute('value') || '',
                                price:     parseFloat(l.querySelector('price')?.getAttribute('value') || 0),
                                condition: l.querySelector('condition')?.getAttribute('value') || 'unknown',
                                notes:     l.querySelector('notes')?.getAttribute('value') || '',
                                link:      l.querySelector('link')?.getAttribute('href') || ''
                            }));
                            if (listings.length > 0) {
                                gameListings[id] = { name: game.name, image: game.image, status: game.status, listings, stats: calcStats(listings) };
                            }
                        });
                    } catch (_) {}
                }));

                processed += group.reduce((s, b) => s + b.length, 0);
                updateProgress(processed, allGames.length);
                updateMetrics();
                renderGames();
                await new Promise(r => setTimeout(r, 200));
            }
            statusMetric.textContent = 'Complete';
            renderGames();
        }

        // ── Stats helper ───────────────────────────────────────────
        function calcStats(listings) {
            const prices = listings.filter(l => l.price > 0).map(l => l.price);
            return {
                count: listings.length,
                avg:   prices.length ? (prices.reduce((a, b) => a + b, 0) / prices.length).toFixed(2) : 0,
                min:   prices.length ? Math.min(...prices).toFixed(2) : 0
            };
        }

        // ── Render game list ───────────────────────────────────────
        function renderGames() {
            const query = searchInput.value.toLowerCase();

            const entries = Object.entries(gameListings).filter(([, g]) => {
                if (!g.name.toLowerCase().includes(query)) return false;
                if (activeStatusFilters.size > 0) {
                    let match = false;
                    activeStatusFilters.forEach(f => { if (g.status[f]) match = true; });
                    if (!match) return false;
                }
                return true;
            }).sort((a, b) => {
                if (currentSort === 'nameAsc')      return a[1].name.localeCompare(b[1].name);
                if (currentSort === 'nameDesc')     return b[1].name.localeCompare(a[1].name);
                if (currentSort === 'priceAsc')     return parseFloat(a[1].stats.min) - parseFloat(b[1].stats.min);
                return b[1].stats.count - a[1].stats.count;
            });

            if (entries.length === 0) {
                gamesList.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-24 text-slate-700">
                        <i data-lucide="search-x" class="w-10 h-10 mb-3 opacity-30"></i>
                        <p class="text-xs font-semibold uppercase tracking-widest">No matches found</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            gamesList.innerHTML = entries.map(([id, g]) => {
                const imgSrc = g.image ? IMAGE_PROXY + encodeURIComponent(g.image) : '';
                const statusTags = buildStatusTags(g.status);
                return `
                <div class="game-card glass rounded-xl p-3 flex items-center gap-3 cursor-pointer animate-in" onclick="showDetails('${id}')">
                    <div class="w-12 h-12 rounded-xl bg-black/40 border border-white/5 overflow-hidden shrink-0 flex items-center justify-center">
                        ${imgSrc ? `<img src="${imgSrc}" class="w-full h-full object-contain" onerror="this.parentElement.innerHTML='🎲'">` : '<span class="text-xl">🎲</span>'}
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="text-sm font-bold text-white truncate leading-tight">${escapeHtml(g.name)}</div>
                        <div class="flex items-center gap-2 mt-0.5">
                            ${parseFloat(g.stats.min) > 0 ? `<span class="text-emerald-400 font-black text-sm">$${g.stats.min}</span><span class="text-slate-700 text-xs">·</span>` : ''}
                            <span class="text-slate-500 text-xs">${g.stats.count} listing${g.stats.count !== 1 ? 's' : ''}</span>
                            ${statusTags ? `<span class="text-slate-700 text-xs">·</span>${statusTags}` : ''}
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-700 shrink-0"></i>
                </div>`;
            }).join('');
            lucide.createIcons();
        }

        function buildStatusTags(status) {
            const map = { own: 'Own', wanttoplay: 'Play', wanttobuy: 'Buy', wishlist: 'Wish', fortrade: 'Trade', prevowned: 'Prev' };
            return Object.entries(map).filter(([k]) => status[k])
                .map(([, label]) => `<span class="text-[9px] font-bold text-indigo-400 uppercase">${label}</span>`)
                .join('<span class="text-slate-700 text-xs mx-0.5">/</span>');
        }

        function escapeHtml(str) {
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        // ── Details modal ──────────────────────────────────────────
        function showDetails(id) {
            const g = gameListings[id];
            const listings = [...g.listings].sort((a, b) => a.price - b.price);

            document.getElementById('detailsImg').src = g.image ? IMAGE_PROXY + encodeURIComponent(g.image) : '';
            document.getElementById('detailsHeader').textContent = g.name;
            document.getElementById('detailsCount').textContent =
                `${listings.length} listing${listings.length !== 1 ? 's' : ''} · avg $${g.stats.avg}`;

            document.getElementById('detailsBody').innerHTML = listings.map(l => `
                <div class="listing-card">
                    <div class="flex items-start justify-between gap-2 mb-2">
                        <div class="text-xl font-black text-emerald-400 leading-none">${l.price > 0 ? '$' + l.price.toFixed(2) : '—'}</div>
                        <span class="cond-badge cond-${l.condition.replace(/\s+/g,'')}">${l.condition}</span>
                    </div>
                    ${l.notes ? `<p class="text-xs text-slate-500 leading-relaxed line-clamp-2 mb-2">${escapeHtml(l.notes)}</p>` : ''}
                    <div class="flex items-center justify-between">
                        <span class="text-[10px] text-slate-600">${l.date}</span>
                        <a href="${l.link}" target="_blank" rel="noopener"
                           class="btn-primary text-white text-[10px] font-bold uppercase tracking-wide px-3 py-1.5 rounded-lg transition-opacity hover:opacity-90 active:scale-95 inline-block">
                            View ↗
                        </a>
                    </div>
                </div>
            `).join('');

            detailsModal.classList.remove('hidden');
        }

        // ── Init ───────────────────────────────────────────────────
        window.onload = () => {
            const savedUser = localStorage.getItem('bgg_marketplace_username');
            if (savedUser) usernameInput.value = savedUser;
            showModal();
        };
    </script>
    <script type="module" src="analytics-init.js"></script>
</body>
</html>
