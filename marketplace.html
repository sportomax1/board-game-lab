<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Marketplace | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>💰</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        :root {
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
            height: 100dvh;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-dark {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .game-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .game-card:active { transform: scale(0.98); }

        .listing-card {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 1rem;
            transition: all 0.2s;
        }
        .listing-card:hover { background: rgba(255, 255, 255, 0.05); }

        .btn-primary {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .input-dark {
            background-color: rgba(15, 23, 42, 0.5) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 1rem !important;
            padding: 0.75rem 1rem !important;
            color: #ffffff !important; /* FORCED WHITE TEXT */
            width: 100%;
            outline: none;
            transition: all 0.2s;
        }
        .input-dark:focus {
            border-color: #10b981 !important;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.4s ease-out forwards; }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .progress-fill {
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sort-btn {
            @apply py-2 px-3 rounded-xl border border-white/10 text-[9px] font-black uppercase tracking-widest transition-all bg-white/5 text-slate-500;
        }
        .sort-btn.active {
            @apply bg-emerald-500 border-emerald-500 text-white shadow-lg shadow-emerald-500/20;
        }

        .status-toggle {
            @apply px-3 py-1.5 rounded-lg border border-white/5 text-[8px] font-black uppercase tracking-tighter transition-all bg-white/5 text-slate-500 whitespace-nowrap;
        }
        .status-toggle.active {
            @apply bg-indigo-500 border-indigo-500 text-white;
        }

        .cond-badge {
            @apply text-[7px] font-black uppercase px-2 py-0.5 rounded-lg border;
        }
        .cond-new { @apply text-pink-400 border-pink-500/30 bg-pink-500/10; }
        .cond-likenew { @apply text-emerald-400 border-emerald-500/30 bg-emerald-500/10; }
        .cond-verygood { @apply text-blue-400 border-blue-500/30 bg-blue-500/10; }
        .cond-good { @apply text-amber-400 border-amber-500/30 bg-amber-500/10; }
        .cond-acceptable { @apply text-orange-400 border-orange-500/30 bg-orange-500/10; }
    </style>
</head>
<body class="selection:bg-emerald-500/30">
    <!-- Background Decor -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-emerald-900/20 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[10%] right-[0%] w-[50%] h-[50%] bg-blue-900/10 blur-[120px] rounded-full"></div>
    </div>

    <div class="relative z-10 flex flex-col h-full pt-safe">
        <!-- Header -->
        <header class="p-6 flex flex-col md:flex-row md:items-center justify-between gap-6 border-b border-white/5 bg-slate-900/50 backdrop-blur-md shrink-0">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-emerald-500/20 rounded-2xl flex items-center justify-center border border-emerald-500/30">
                    <i data-lucide="shopping-cart" class="text-emerald-400 w-6 h-6"></i>
                </div>
                <div class="flex flex-col">
                    <h1 class="text-2xl font-black italic uppercase tracking-tighter leading-none text-white flex items-center">
                        <span id="displayUsername" class="hidden mr-3 border-r border-white/10 pr-3 opacity-50">Sportomax</span>
                        <span>BGG <span class="text-emerald-400">Market</span></span>
                    </h1>
                    <div class="flex gap-4 mt-2">
                        <div class="text-[9px] font-bold text-slate-500 uppercase tracking-widest"><span class="text-emerald-400" id="gamesLoadedMetric">0</span> Games</div>
                        <div class="text-[9px] font-bold text-slate-500 uppercase tracking-widest"><span class="text-emerald-400" id="apiCallsMetric">0</span> Calls</div>
                        <div class="text-[9px] font-bold text-slate-500 uppercase tracking-widest"><span class="text-emerald-400" id="elapsedMetric">0s</span> Elapsed</div>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="showModal()" class="glass px-6 py-2 rounded-2xl border border-white/10 text-[10px] font-black uppercase tracking-widest hover:bg-white/10 transition-all">Settings</button>
                <a href="index.html" class="glass px-6 py-2 rounded-2xl border border-white/10 hover:bg-white/10 transition-all text-[10px] font-black uppercase tracking-widest flex items-center gap-2">Back</a>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-h-0">
            <!-- Progress Bar -->
            <div class="px-6 py-2 bg-black/20 border-b border-white/5">
                <div class="h-1.5 w-full bg-white/5 rounded-full overflow-hidden">
                    <div id="progressFill" class="progress-fill h-full bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.5)]" style="width: 0%;"></div>
                </div>
                <div class="flex justify-between mt-1">
                    <span id="statusMetric" class="text-[8px] font-bold text-slate-500 uppercase tracking-widest">Ready</span>
                    <span id="progressText" class="text-[8px] font-black text-emerald-400 uppercase tracking-widest">0%</span>
                </div>
            </div>

            <!-- Filters -->
            <div class="px-6 pt-4 flex gap-2 overflow-x-auto custom-scrollbar no-scrollbar">
                <button onclick="toggleStatusFilter('own')" class="status-toggle active" id="filter-own">Own</button>
                <button onclick="toggleStatusFilter('wanttoplay')" class="status-toggle" id="filter-wanttoplay">Want Play</button>
                <button onclick="toggleStatusFilter('wanttobuy')" class="status-toggle" id="filter-wanttobuy">Want Buy</button>
                <button onclick="toggleStatusFilter('wishlist')" class="status-toggle" id="filter-wishlist">Wishlist</button>
                <button onclick="toggleStatusFilter('fortrade')" class="status-toggle" id="filter-fortrade">Trade</button>
                <button onclick="toggleStatusFilter('prevowned')" class="status-toggle" id="filter-prevowned">Prev</button>
            </div>

            <!-- Controls -->
            <div class="p-6 space-y-4">                <div class="glass rounded-2xl p-2 border border-white/10 flex items-center gap-3 px-4 focus-within:ring-2 focus-within:ring-emerald-500/50 transition-all">
                    <i data-lucide="search" class="w-4 h-4 text-slate-500"></i>
                    <input type="text" id="searchInput" class="flex-1 bg-transparent border-none text-sm text-white focus:outline-none py-2 font-medium" placeholder="Search games in your collection...">
                </div>

                <div class="flex flex-wrap gap-2">
                    <button class="sort-btn active" id="sortNameAsc">A-Z</button>
                    <button class="sort-btn" id="sortNameDesc">Z-A</button>
                    <button class="sort-btn" id="sortPriceAsc">Price Low</button>
                    <button class="sort-btn" id="sortListingsDesc">Most Listings</button>
                </div>
            </div>

            <!-- List -->
            <div id="gamesList" class="flex-1 overflow-y-auto custom-scrollbar px-6 pb-20 space-y-3">
                <div class="flex flex-col items-center justify-center py-20 text-slate-600">
                    <i data-lucide="shopping-bag" class="w-12 h-12 mb-4 opacity-20"></i>
                    <p class="text-xs font-bold uppercase tracking-widest">No Market Data Loaded</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal-overlay hidden">
        <div class="glass relative max-w-sm w-full rounded-[2.5rem] p-8 shadow-2xl border-t border-white/20">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-emerald-500/20 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-emerald-500/30">
                    <i data-lucide="user" class="text-emerald-400 w-8 h-8"></i>
                </div>
                <h2 class="text-2xl font-black italic uppercase tracking-tighter text-white">Load <span class="text-emerald-400">Profile</span></h2>
            </div>

            <div class="space-y-6">
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">BGG Username</label>
                    <input type="text" id="usernameInput" value="sportomax" class="input-dark w-full text-center text-lg tracking-wide">
                </div>

                <div class="flex gap-2">
                    <button id="loadBtn" onclick="loadCollection()" class="flex-1 bg-emerald-500 text-white py-4 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-emerald-400 transition-all shadow-xl shadow-emerald-500/20">Fetch Collection</button>
                    <button id="clearBtn" class="bg-white/5 text-slate-500 px-6 rounded-2xl border border-white/10 hover:text-white transition-all">🗑️</button>
                </div>
                <button onclick="hideModal()" class="w-full text-[10px] font-bold text-slate-500 uppercase tracking-widest">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Details Modal -->
    <div id="detailsModal" class="modal-overlay hidden">
        <div class="glass relative max-w-lg w-full rounded-[2.5rem] p-8 shadow-2xl border-t border-white/20 flex flex-col max-h-[85vh]">
            <header class="flex items-center gap-4 mb-6 shrink-0">
                <div id="detailsIcon" class="w-16 h-16 rounded-2xl bg-black/40 border border-white/5 p-1 shrink-0">
                    <img id="detailsImg" src="" class="w-full h-full object-contain rounded-xl">
                </div>
                <div class="flex-1 min-w-0">
                    <h2 id="detailsHeader" class="text-xl font-black italic uppercase tracking-tighter text-white truncate leading-tight"></h2>
                    <p id="detailsCount" class="text-[9px] font-bold text-emerald-400 uppercase tracking-widest"></p>
                </div>
                <button onclick="closeDetailsModal()" class="w-10 h-10 glass rounded-xl flex items-center justify-center text-slate-500 hover:text-white transition-all">✕</button>
            </header>
            <div id="detailsBody" class="flex-1 overflow-y-auto custom-scrollbar space-y-4 pr-2"></div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const STORAGE_KEY_COLLECTION = 'bgg_market_all';
        const STORAGE_KEY_TIMESTAMP = 'bgg_marketplace_timestamp';

        let allGames = [];
        let gameListings = {};
        let totalApiCalls = 0;
        let startTime = null;
        let currentSort = 'nameAsc';
        let activeStatusFilters = new Set(['own']); // Default
        const IMAGE_PROXY = '/api/image-proxy?url=';

        const usernameInput = document.getElementById('usernameInput');
        const gamesList = document.getElementById('gamesList');
        const searchInput = document.getElementById('searchInput');
        const settingsModal = document.getElementById('settingsModal');
        const detailsModal = document.getElementById('detailsModal');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const gamesLoadedMetric = document.getElementById('gamesLoadedMetric');
        const apiCallsMetric = document.getElementById('apiCallsMetric');
        const elapsedMetric = document.getElementById('elapsedMetric');
        const statusMetric = document.getElementById('statusMetric');

        function toggleStatusFilter(status) {
            if (activeStatusFilters.has(status)) {
                activeStatusFilters.delete(status);
                document.getElementById(`filter-${status}`).classList.remove('active');
            } else {
                activeStatusFilters.add(status);
                document.getElementById(`filter-${status}`).classList.add('active');
            }
            renderGames();
        }

        function showModal() { settingsModal.classList.remove('hidden'); }
        function hideModal() { settingsModal.classList.add('hidden'); }

        function updateMetrics() {
            if (startTime) {
                const elapsed = Math.round((Date.now() - startTime) / 1000);
                elapsedMetric.textContent = elapsed + 's';
            }
            gamesLoadedMetric.textContent = Object.keys(gameListings).length;
            apiCallsMetric.textContent = totalApiCalls;
        }

        function updateProgress(current, total) {
            if (total === 0) return;
            const percent = Math.round((current / total) * 100);
            progressFill.style.width = percent + '%';
            progressText.textContent = percent + '%';
        }

        document.getElementById('sortNameAsc').addEventListener('click', (e) => { currentSort = 'nameAsc'; updateSortUI(e.target); renderGames(); });
        document.getElementById('sortNameDesc').addEventListener('click', (e) => { currentSort = 'nameDesc'; updateSortUI(e.target); renderGames(); });
        document.getElementById('sortPriceAsc').addEventListener('click', (e) => { currentSort = 'priceAsc'; updateSortUI(e.target); renderGames(); });
        document.getElementById('sortListingsDesc').addEventListener('click', (e) => { currentSort = 'listingsDesc'; updateSortUI(e.target); renderGames(); });

        function updateSortUI(btn) {
            document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        document.getElementById('clearBtn').addEventListener('click', () => {
            const user = usernameInput.value.trim();
            localStorage.removeItem(STORAGE_KEY_COLLECTION + '_' + user);
            allGames = []; gameListings = {};
            gamesList.innerHTML = '';
            alert('Cache Cleared');
        });

        searchInput.addEventListener('input', renderGames);

        async function fetchWithRetry(url, maxRetries = 3) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    totalApiCalls++; updateMetrics();
                    const response = await fetch(url);
                    if (response.status === 202) { await new Promise(r => setTimeout(r, 2000 * (i + 1))); continue; }
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response;
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    await new Promise(r => setTimeout(r, 1000 * (i + 1)));
                }
            }
        }

        async function loadCollection() {
            const user = usernameInput.value.trim();
            if (!user) return alert('Enter username');

            localStorage.setItem('bgg_marketplace_username', user);
            const displayUser = document.getElementById('displayUsername');
            displayUser.textContent = user;
            displayUser.classList.remove('hidden');

            hideModal();
            startTime = Date.now(); totalApiCalls = 0;
            statusMetric.textContent = 'Init...';
            updateMetrics(); updateProgress(0, 100);

            try {
                const cached = localStorage.getItem(STORAGE_KEY_COLLECTION + '_' + user);
                if (cached) {
                    allGames = JSON.parse(cached);
                    await processGameBatches();
                } else {
                    const url = `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(user)}&stats=1`;
                    const res = await fetchWithRetry(url);
                    const xml = new DOMParser().parseFromString(await res.text(), 'text/xml');
                    allGames = Array.from(xml.querySelectorAll('item')).map(item => {
                        const s = item.querySelector('status');
                        return {
                            id: item.getAttribute('objectid'),
                            name: item.querySelector('name')?.textContent || 'Unknown',
                            image: item.querySelector('image')?.textContent || '',
                            status: {
                                own: s?.getAttribute('own') === '1',
                                prevowned: s?.getAttribute('prevowned') === '1',
                                fortrade: s?.getAttribute('fortrade') === '1',
                                want: s?.getAttribute('want') === '1',
                                wanttoplay: s?.getAttribute('wanttoplay') === '1',
                                wanttobuy: s?.getAttribute('wanttobuy') === '1',
                                wishlist: s?.getAttribute('wishlist') === '1'
                            }
                        };
                    }).filter(g => g.id);
                    localStorage.setItem(STORAGE_KEY_COLLECTION + '_' + user, JSON.stringify(allGames));
                    await processGameBatches();
                }
            } catch (e) { 
                console.error(e);
                statusMetric.textContent = 'Error'; 
            }
        }

        async function processGameBatches() {
            const batchSize = 20; 
            const parallelLimit = 100;
            let processed = 0; gameListings = {};
            const batches = [];
            for (let i = 0; i < allGames.length; i += batchSize) batches.push(allGames.slice(i, i + batchSize));

            for (let i = 0; i < batches.length; i += parallelLimit) {
                const group = batches.slice(i, i + parallelLimit);
                statusMetric.textContent = `Batch ${Math.floor(i/parallelLimit)+1}/${Math.ceil(batches.length/parallelLimit)}`;
                
                await Promise.all(group.map(async batch => {
                    const ids = batch.map(g => g.id).join(',');
                    try {
                        const res = await fetchWithRetry(`/api/bgg-helper?endpoint=thing&id=${ids}&type=boardgame&marketplace=1`);
                        const xml = new DOMParser().parseFromString(await res.text(), 'text/xml');
                        Array.from(xml.querySelectorAll('item')).forEach(item => {
                            const id = item.getAttribute('id');
                            const game = allGames.find(g => g.id === id);
                            const marketplaceEl = item.querySelector('marketplacelistings');
                            if (marketplaceEl) {
                                const listings = Array.from(marketplaceEl.querySelectorAll('listing')).map(l => ({
                                    date: l.querySelector('listdate')?.getAttribute('value') || '',
                                    price: parseFloat(l.querySelector('price')?.getAttribute('value') || 0),
                                    condition: l.querySelector('condition')?.getAttribute('value') || 'unknown',
                                    notes: l.querySelector('notes')?.getAttribute('value') || '',
                                    link: l.querySelector('link')?.getAttribute('href') || ''
                                }));

                                if (listings.length > 0) {
                                    gameListings[id] = {
                                        name: game.name, image: game.image, status: game.status,
                                        listings: listings,
                                        stats: calculateStats(listings)
                                    };
                                }
                            }
                        });
                    } catch (e) {}
                }));
                
                processed += group.reduce((s, b) => s + b.length, 0);
                updateProgress(processed, allGames.length); 
                updateMetrics(); 
                renderGames();
                await new Promise(r => setTimeout(r, 200));
            }
            statusMetric.textContent = 'Complete';
            renderGames();
        }

        function calculateStats(listings) {
            const prices = listings.filter(l => l.price > 0).map(l => l.price);
            return {
                count: listings.length,
                avg: prices.length ? (prices.reduce((a,b)=>a+b,0)/prices.length).toFixed(2) : 0,
                min: prices.length ? Math.min(...prices).toFixed(2) : 0
            };
        }

        function renderGames() {
            const query = searchInput.value.toLowerCase();
            const selectedConds = Array.from(document.querySelectorAll('input[name="condition"]:checked')).map(cb => cb.value);
            
            const entries = Object.entries(gameListings).filter(([_, g]) => {
                const nameMatch = g.name.toLowerCase().includes(query);
                const hasCond = g.listings.some(l => selectedConds.includes(l.condition));
                
                // Status Filter Check
                let statusMatch = false;
                if (activeStatusFilters.size === 0) statusMatch = true;
                else {
                    activeStatusFilters.forEach(f => { if (g.status[f]) statusMatch = true; });
                }

                return nameMatch && hasCond && statusMatch;
            }).sort((a, b) => {
                if (currentSort === 'nameAsc') return a[1].name.localeCompare(b[1].name);
                if (currentSort === 'nameDesc') return b[1].name.localeCompare(a[1].name);
                if (currentSort === 'priceAsc') return parseFloat(a[1].stats.min) - parseFloat(b[1].stats.min);
                return b[1].stats.count - a[1].stats.count;
            });

            if (entries.length === 0) {
                gamesList.innerHTML = '<div class="text-center py-20 text-slate-600 text-xs font-bold uppercase tracking-widest">No Matches Found</div>';
                return;
            }

            gamesList.innerHTML = entries.map(([id, g]) => `
                <div class="game-card glass rounded-2xl p-3 border border-white/5 flex items-center gap-4 cursor-pointer animate-in" onclick="showDetails('${id}')">
                    <div class="w-12 h-12 rounded-xl bg-black/40 border border-white/5 p-1 shrink-0 overflow-hidden">
                        <img src="${g.image ? IMAGE_PROXY + encodeURIComponent(g.image) : ''}" class="w-full h-full object-contain rounded-lg">
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="text-xs font-black text-white italic uppercase tracking-tighter truncate leading-tight">${g.name}</div>
                        <div class="text-[8px] font-bold text-emerald-400 uppercase tracking-widest mt-1">$${g.stats.min} Low • ${g.stats.count} Lists</div>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-600"></i>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function calculateStats(listings) {
            const prices = listings.filter(l => l.price > 0).map(l => l.price);
            return {
                count: listings.length,
                avg: prices.length ? (prices.reduce((a,b)=>a+b,0)/prices.length).toFixed(2) : 0,
                min: prices.length ? Math.min(...prices).toFixed(2) : 0
            };
        }

        function renderGames() {
            const query = searchInput.value.toLowerCase();
            const selectedConds = Array.from(document.querySelectorAll('input[name="condition"]:checked')).map(cb => cb.value);
            
            const entries = Object.entries(gameListings).filter(([_, g]) => {
                const nameMatch = g.name.toLowerCase().includes(query);
                const hasCond = g.listings.some(l => selectedConds.includes(l.condition));
                return nameMatch && hasCond;
            }).sort((a, b) => {
                if (currentSort === 'nameAsc') return a[1].name.localeCompare(b[1].name);
                if (currentSort === 'nameDesc') return b[1].name.localeCompare(a[1].name);
                if (currentSort === 'priceAsc') return parseFloat(a[1].stats.min) - parseFloat(b[1].stats.min);
                return b[1].stats.count - a[1].stats.count;
            });

            if (entries.length === 0) {
                gamesList.innerHTML = '<div class="text-center py-20 text-slate-600 text-xs font-bold uppercase tracking-widest">No Matches Found</div>';
                return;
            }

            gamesList.innerHTML = entries.map(([id, g]) => `
                <div class="game-card glass rounded-2xl p-3 border border-white/5 flex items-center gap-4 cursor-pointer animate-in" onclick="showDetails('${id}')">
                    <div class="w-12 h-12 rounded-xl bg-black/40 border border-white/5 p-1 shrink-0 overflow-hidden">
                        <img src="${g.image ? IMAGE_PROXY + encodeURIComponent(g.image) : ''}" class="w-full h-full object-contain rounded-lg">
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="text-xs font-black text-white italic uppercase tracking-tighter truncate leading-tight">${g.name}</div>
                        <div class="text-[8px] font-bold text-emerald-400 uppercase tracking-widest mt-1">$${g.stats.min} Low • ${g.stats.count} Lists</div>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-600"></i>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function showDetails(id) {
            const g = gameListings[id];
            const selectedConds = Array.from(document.querySelectorAll('input[name="condition"]:checked')).map(cb => cb.value);
            const listings = g.listings.filter(l => selectedConds.includes(l.condition)).sort((a,b)=>a.price-b.price);

            document.getElementById('detailsImg').src = g.image ? IMAGE_PROXY + encodeURIComponent(g.image) : '';
            document.getElementById('detailsHeader').textContent = g.name;
            document.getElementById('detailsCount').textContent = `Avg $${g.stats.avg} across ${listings.length} matches`;
            
            document.getElementById('detailsBody').innerHTML = listings.map(l => `
                <div class="listing-card">
                    <div class="flex justify-between items-center">
                        <div class="text-lg font-black text-emerald-400 italic leading-none">$${l.price.toFixed(2)}</div>
                        <span class="cond-badge cond-${l.condition.replace(' ','')}">${l.condition}</span>
                    </div>
                    ${l.notes ? `<p class="text-[9px] text-slate-500 leading-relaxed italic line-clamp-3">${l.notes}</p>` : ''}
                    <div class="flex justify-between items-center pt-2">
                        <span class="text-[7px] font-bold text-slate-600 uppercase">${l.date}</span>
                        <a href="${l.link}" target="_blank" class="px-4 py-1.5 rounded-lg btn-primary text-white text-[8px] font-black uppercase tracking-widest transition-transform active:scale-95">View Box ↗️</a>
                    </div>
                </div>
            `).join('');
            
            detailsModal.classList.remove('hidden');
        }

        function closeDetailsModal() { detailsModal.classList.add('hidden'); }
        function hideModal() { settingsModal.classList.add('hidden'); }

        window.onload = () => {
            const savedUser = localStorage.getItem('bgg_marketplace_username');
            if(savedUser) usernameInput.value = savedUser;
            showModal();
        };
    </script>
    <script type="module" src="analytics-init.js"></script>
</body>
</html>
