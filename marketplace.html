<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Marketplace</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>💰</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            height: 100%;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            max-width: none;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            padding-top: env(safe-area-inset-top, 0);
            padding-bottom: env(safe-area-inset-bottom, 0);
            padding-left: env(safe-area-inset-left, 0);
            padding-right: env(safe-area-inset-right, 0);
        }

        .header {
            flex-shrink: 0;
            padding: 1rem;
            border-bottom: 1px solid #eee;
            background: white;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            color: #333;
        }

        .setup-section {
            flex-shrink: 0;
            padding: 1rem;
            background: white;
            border-bottom: 1px solid #eee;
            max-height: 50vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .setup-input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            -webkit-appearance: none;
            appearance: none;
        }

        .setup-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn {
            padding: 0.75rem 1rem;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            font-size: 1rem;
            min-width: 50px;
        }

        .btn:active {
            opacity: 0.9;
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #333;
        }

        .btn-secondary:active {
            background: #d1d5db;
        }

        .metrics-bar {
            padding: 0.75rem 1rem;
            background: #f0f9ff;
            border-bottom: 1px solid #bfdbfe;
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            flex-wrap: wrap;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .metric-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
            padding: 0.5rem 0.75rem;
            background: white;
            border-radius: 6px;
            border: 1px solid #dbeafe;
        }

        .metric-label {
            font-weight: 600;
            color: #1e40af;
            font-size: 0.8rem;
        }

        .metric-value {
            font-weight: 700;
            color: #333;
            font-size: 0.95rem;
        }

        .progress-bar {
            flex: 1;
            min-width: 150px;
            height: 20px;
            background: white;
            border: 1px solid #dbeafe;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: 700;
            color: white;
        }

        .filter-section {
            margin-bottom: 0.75rem;
        }

        .filter-title {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            color: #333;
        }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .filter-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            flex: 0 1 calc(50% - 0.25rem);
        }

        .filter-checkbox:active {
            background: #e0e0e0;
        }

        .filter-checkbox input {
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #ddd;
            border-radius: 4px;
            background: white;
            margin: 0;
        }

        .filter-checkbox input:checked {
            background: #6366f1;
            border-color: #6366f1;
        }

        .status {
            font-size: 0.85rem;
            color: #666;
            padding: 0.5rem;
            background: #f9f9f9;
            border-radius: 4px;
            text-align: center;
        }

        .status.active {
            color: #6366f1;
            font-weight: 600;
        }

        .cache-info {
            font-size: 0.75rem;
            color: #999;
            margin-top: 0.5rem;
            padding: 0.5rem;
            background: #f9f9f9;
            border-radius: 4px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .search-bar {
            flex-shrink: 0;
            padding: 0.75rem 1rem;
            background: white;
            border-bottom: 1px solid #eee;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            -webkit-appearance: none;
            appearance: none;
        }

        .search-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .games-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-height: 400px;
        }

        .game-card {
            background: white;
            border: 1px solid #eee;
            border-radius: 6px;
            padding: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .game-card:active {
            background: #e7f3ff;
            border-color: #6366f1;
            transform: scale(0.98);
        }

        .game-card.expanded {
            background: #f9f9f9;
        }

        .game-card-main {
            display: contents;
        }

        .game-card-main:active {
            background: transparent;
        }

        .game-thumbnail {
            width: 50px;
            height: 50px;
            flex-shrink: 0;
            background: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        .game-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-info {
            flex: 1;
            min-width: 0;
        }

        .game-header {
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
            margin: 0;
            word-break: break-word;
            display: -webkit-box;
            line-clamp: 1;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .game-count {
            display: inline-block;
            background: #fef3c7;
            color: #92400e;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 0.5rem;
        }

        .game-stats {
            padding: 0.75rem 1rem;
            background: white;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            max-height: 400px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .game-stats.hidden {
            display: none;
        }

        .stat-box {
            padding: 0.5rem;
            background: #f0f9ff;
            border: 1px solid #bfdbfe;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .stat-label {
            font-weight: 600;
            color: #1e40af;
            font-size: 0.75rem;
            margin-bottom: 0.25rem;
        }

        .stat-value {
            font-size: 0.9rem;
            color: #333;
            font-weight: 600;
        }

        .listings-list {
            padding: 0.75rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            border-top: 1px solid #eee;
            max-height: 400px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .listings-list.hidden {
            display: none;
        }

        .listing-item {
            padding: 0.75rem;
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .listing-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: #059669;
        }

        .listing-condition {
            display: inline-block;
            padding: 0.3rem 0.6rem;
            background: #dbeafe;
            color: #1e40af;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            width: fit-content;
        }

        .listing-condition.new {
            background: #fce7f3;
            color: #be185d;
        }

        .listing-condition.likenew {
            background: #dcfce7;
            color: #166534;
        }

        .listing-condition.verygood {
            background: #bfdbfe;
            color: #1e40af;
        }

        .listing-condition.good {
            background: #fef3c7;
            color: #92400e;
        }

        .listing-condition.acceptable {
            background: #fed7aa;
            color: #92400e;
        }

        .listing-date {
            font-size: 0.8rem;
            color: #666;
        }

        .listing-notes {
            font-size: 0.8rem;
            color: #666;
            padding: 0.5rem;
            background: white;
            border-radius: 4px;
            border: 1px solid #eee;
            max-height: 60px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            word-break: break-word;
        }

        .listing-link {
            display: inline-block;
            color: #6366f1;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0.4rem 0.75rem;
            background: #eff6ff;
            border-radius: 4px;
            border: 1px solid #bfdbfe;
        }

        .listing-link:active {
            background: #dbeafe;
        }

        .no-data {
            text-align: center;
            padding: 2rem 1rem;
            color: #999;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-overlay.hidden {
            display: none;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 430px;
            width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid #eee;
            font-size: 1.3rem;
            font-weight: 700;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #999;
            cursor: pointer;
            padding: 0;
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .modal-close:active {
            background: #f0f0f0;
            color: #333;
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 1rem;
        }

        .modal-footer {
            padding: 1rem;
            border-top: 1px solid #eee;
            display: flex;
            gap: 0.5rem;
            background: #f9f9f9;
        }

        .modal-footer button {
            flex: 1;
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 Marketplace</h1>
        </div>

        <div class="main-content">
            <div class="metrics-bar" id="metricsBar">
                <div class="metric-item">
                    <span class="metric-label">📊 Progress:</span>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width: 0%;">0%</div>
                    </div>
                </div>
                <div class="metric-item">
                    <span class="metric-label">🎮 Loaded:</span>
                    <span class="metric-value" id="gamesLoadedMetric">0</span>
                </div>
                <div class="metric-item">
                    <span class="metric-label">📡 API Calls:</span>
                    <span class="metric-value" id="apiCallsMetric">0</span>
                </div>
                <div class="metric-item">
                    <span class="metric-label">⏱️ Elapsed:</span>
                    <span class="metric-value" id="elapsedMetric">0s</span>
                </div>
                <div class="metric-item">
                    <span class="metric-label">🔄 Status:</span>
                    <span class="metric-value" id="statusMetric">Ready</span>
                </div>
            </div>

            <div class="search-bar">
                <input type="text" id="searchInput" class="search-input" placeholder="Search games...">
                <select id="sortSelect" style="padding: 0.5rem 0.75rem; border: 1px solid #ddd; border-radius: 8px; font-size: 0.9rem; background: white; cursor: pointer;">
                    <option value="name">Sort: Name ↑</option>
                    <option value="name-desc">Sort: Name ↓</option>
                    <option value="listings">Sort: Listings ↑</option>
                    <option value="listings-desc">Sort: Listings ↓</option>
                    <option value="price">Sort: Price ↑</option>
                    <option value="price-desc">Sort: Price ↓</option>
                </select>
            </div>

            <div class="games-list" id="gamesList"></div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                ⚙️ Settings
                <button class="modal-close" id="modalCloseBtn">✕</button>
            </div>
            <div class="modal-body">
                <div style="margin-bottom: 1rem;">
                    <div class="filter-title">👤 Username</div>
                    <input type="text" id="usernameInput" class="setup-input" placeholder="Enter BGG username" value="sportomax">
                </div>

                <div class="filter-section">
                    <div class="filter-title">📦 Collection Status</div>
                    <div class="filter-group">
                        <label class="filter-checkbox">
                            <input type="checkbox" name="status" value="own" checked>
                            Own
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" name="status" value="wanttoplay">
                            Want to Play
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" name="status" value="wanttobuy">
                            Want to Buy
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" name="status" value="prevowned">
                            Prev. Owned
                        </label>
                    </div>
                </div>

                <div class="filter-section">
                    <div class="filter-title">🔍 Condition Filter</div>
                    <div class="filter-group">
                        <label class="filter-checkbox">
                            <input type="checkbox" name="condition" value="new" checked>
                            New
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" name="condition" value="likenew" checked>
                            Like New
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" name="condition" value="verygood" checked>
                            Very Good
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" name="condition" value="good" checked>
                            Good
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" name="condition" value="acceptable" checked>
                            Acceptable
                        </label>
                    </div>
                </div>

                <div class="status" id="processingStatus" style="margin-top: 1rem;"></div>
                <div class="cache-info" id="cacheInfo"></div>
            </div>
            <div class="modal-footer">
                <button class="btn" id="loadBtn">📦 Load</button>
                <button class="btn btn-secondary" id="clearBtn">🗑️ Clear</button>
            </div>
        </div>
    </div>

    <!-- Details Modal -->
    <div class="modal-overlay hidden" id="detailsModal">
        <div class="modal-content">
            <div class="modal-header" id="detailsHeader">
                Game Details
                <button class="modal-close" id="detailsCloseBtn">✕</button>
            </div>
            <div class="modal-body" id="detailsBody"></div>
            <div class="modal-footer">
                <button class="btn" onclick="closeDetailsModal()">Close</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY_COLLECTION = 'bgg_marketplace_collection';
        const STORAGE_KEY_TIMESTAMP = 'bgg_marketplace_timestamp';

        let allGames = [];
        let gameListings = {};
        let currentUsername = 'sportomax';
        let originalSettingsHTML = null;
        let totalApiCalls = 0;
        let startTime = null;

        const usernameInput = document.getElementById('usernameInput');
        const loadBtn = document.getElementById('loadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        const processingStatus = document.getElementById('processingStatus');
        const cacheInfo = document.getElementById('cacheInfo');
        const gamesList = document.getElementById('gamesList');
        const searchInput = document.getElementById('searchInput');
        const settingsModal = document.getElementById('settingsModal');
        const progressFill = document.getElementById('progressFill');
        const gamesLoadedMetric = document.getElementById('gamesLoadedMetric');
        const apiCallsMetric = document.getElementById('apiCallsMetric');
        const elapsedMetric = document.getElementById('elapsedMetric');
        const statusMetric = document.getElementById('statusMetric');
        const sortSelect = document.getElementById('sortSelect');
        let currentSortOrder = 'name';

        // Show modal on load
        function showModal() {
            if (!originalSettingsHTML) {
                originalSettingsHTML = document.querySelector('.modal-body').innerHTML;
            }
            settingsModal.classList.remove('hidden');
        }

        // Update metrics display
        function updateMetrics() {
            if (startTime) {
                const elapsed = Math.round((Date.now() - startTime) / 1000);
                elapsedMetric.textContent = elapsed + 's';
            }
            gamesLoadedMetric.textContent = Object.keys(gameListings).length;
            apiCallsMetric.textContent = totalApiCalls;
        }

        // Update progress bar
        function updateProgress(current, total) {
            if (total === 0) return;
            const percent = Math.round((current / total) * 100);
            progressFill.style.width = percent + '%';
            progressFill.textContent = percent + '%';
        }

        // Hide modal
        function hideModal() {
            settingsModal.classList.add('hidden');
        }

        // Load button
        loadBtn.addEventListener('click', () => {
            hideModal();
            loadCollection();
        });

        // Close modal button
        modalCloseBtn.addEventListener('click', hideModal);

        // Clear cache
        clearBtn.addEventListener('click', () => {
            localStorage.removeItem(STORAGE_KEY_COLLECTION);
            localStorage.removeItem(STORAGE_KEY_TIMESTAMP);
            processingStatus.textContent = '✅ Cache cleared';
            processingStatus.classList.add('active');
            allGames = [];
            gameListings = {};
            gamesList.innerHTML = '';
            cacheInfo.textContent = '';
            setTimeout(() => { processingStatus.classList.remove('active'); }, 2000);
        });

        // Search
        searchInput.addEventListener('input', renderGames);

        // Sort change
        sortSelect.addEventListener('change', (e) => {
            currentSortOrder = e.target.value;
            renderGames();
        });

        // Condition filter changes
        document.querySelectorAll('input[name="condition"]').forEach(checkbox => {
            checkbox.addEventListener('change', renderGames);
        });

        // Status filter changes
        document.querySelectorAll('input[name="status"]').forEach(checkbox => {
            checkbox.addEventListener('change', loadCollection);
        });

        // Helper functions
        async function fetchWithRetry(url, maxRetries = 3) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    totalApiCalls++;
                    updateMetrics();
                    console.log(`📡 [API Call ${i + 1}] GET ${url}`);
                    const response = await fetch(url);
                    if (response.status === 202) {
                        console.log(`⏳ [API] Status 202 - retrying after ${2000 * (i + 1)}ms`);
                        await new Promise(resolve => setTimeout(resolve, 2000 * (i + 1)));
                        continue;
                    }
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    console.log(`✅ [API] Response received`);
                    return response;
                } catch (error) {
                    console.error(`❌ [API] Error on attempt ${i + 1}:`, error.message);
                    if (i === maxRetries - 1) throw error;
                    await new Promise(resolve => setTimeout(resolve, 1000 * (i + 1)));
                }
            }
        }

        // Get selected statuses
        function getSelectedStatuses() {
            const checkboxes = document.querySelectorAll('input[name="status"]:checked');
            return Array.from(checkboxes).map(cb => cb.value);
        }

        // Load collection
        async function loadCollection() {
            const username = usernameInput.value.trim();
            if (!username) {
                processingStatus.textContent = '❌ Please enter a username';
                processingStatus.classList.add('active');
                return;
            }

            const statuses = getSelectedStatuses();
            if (statuses.length === 0) {
                processingStatus.textContent = '❌ Select at least one status';
                processingStatus.classList.add('active');
                return;
            }

            // Reset metrics
            startTime = Date.now();
            totalApiCalls = 0;
            statusMetric.textContent = 'Loading...';
            updateMetrics();
            updateProgress(0, 100);

            currentUsername = username;
            localStorage.setItem('bgg_marketplace_username', username);

            processingStatus.classList.add('active');
            processingStatus.textContent = '📦 Loading collection...';
            console.log('🔍 Fetching collection for:', username);

            try {
                // Check cache
                const cached = localStorage.getItem(STORAGE_KEY_COLLECTION);
                if (cached) {
                    allGames = JSON.parse(cached);
                    processingStatus.textContent = `✅ Loaded ${allGames.length} games from cache. Fetching marketplace data...`;
                    console.log('✅ Loaded collection from cache:', allGames.length, 'games');
                    updateCacheInfo();
                    // Still fetch marketplace data fresh
                    await processGameBatches();
                } else {
                    // Fetch collection
                    const statusParams = statuses.map(s => `&${s}=1`).join('');
                    const url = `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}${statusParams}&stats=1`;
                    console.log('🔗 API URL:', url);
                    
                    const response = await fetchWithRetry(url);
                    const xml = new DOMParser().parseFromString(await response.text(), 'text/xml');
                    const items = xml.querySelectorAll('item');

                    allGames = Array.from(items).map(item => ({
                        id: item.getAttribute('objectid'),
                        name: item.querySelector('name')?.textContent || 'Unknown',
                        image: item.querySelector('image')?.textContent || ''
                    })).filter(g => g.id);

                    console.log('📦 Collection fetched:', allGames.length, 'games');
                    localStorage.setItem(STORAGE_KEY_COLLECTION, JSON.stringify(allGames));
                    processingStatus.textContent = `✅ Loaded ${allGames.length} games`;
                    updateCacheInfo();

                    // Process games in batches
                    await processGameBatches();
                }

            } catch (error) {
                processingStatus.textContent = `❌ Error: ${error.message}`;
                console.error('❌ Error:', error);
            }
        }

        // Process games in batches with parallel processing (100x faster like weight.html)
        async function processGameBatches() {
            const batchSize = 20;
            const parallelBatches = 100; // Process 100 batches in parallel for faster loading
            let processed = 0;
            gameListings = {};

            // Create batches
            const batches = [];
            for (let i = 0; i < allGames.length; i += batchSize) {
                batches.push(allGames.slice(i, i + batchSize));
            }

            // Process batches in parallel groups
            for (let i = 0; i < batches.length; i += parallelBatches) {
                const batchGroup = batches.slice(i, i + parallelBatches);
                processingStatus.textContent = `💰 Processing ${Math.min(i + parallelBatches, batches.length)}/${batches.length} batches...`;

                await Promise.all(batchGroup.map(async (batch, batchIndex) => {
                    const ids = batch.map(g => g.id).join(',');

                    try {
                        const url = `/api/bgg-helper?endpoint=thing&id=${ids}&type=boardgame&marketplace=1`;
                        const response = await fetchWithRetry(url);
                        const xml = new DOMParser().parseFromString(await response.text(), 'text/xml');
                        const items = xml.querySelectorAll('item');

                        let batchListings = 0;
                        Array.from(items).forEach(item => {
                            const gameId = item.getAttribute('id');
                            const game = allGames.find(g => g.id === gameId);
                            if (!game) return;

                            // Correct: Use marketplacelistings (plural) not marketplace
                            const marketplaceEl = item.querySelector('marketplacelistings');
                            if (marketplaceEl) {
                                const listingCount = marketplaceEl.querySelectorAll('listing').length;
                                console.log(`✅ Found marketplacelistings for game ${gameId} (${game.name}): ${listingCount} listings`);
                                
                                const listings = Array.from(marketplaceEl.querySelectorAll('listing')).map(l => {
                                    const listdate = l.querySelector('listdate');
                                    const price = l.querySelector('price');
                                    const condition = l.querySelector('condition');
                                    const notes = l.querySelector('notes');
                                    const link = l.querySelector('link');
                                    
                                    return {
                                        date: listdate?.getAttribute('value') || listdate?.textContent || '',
                                        price: parseFloat(price?.getAttribute('value') || price?.textContent || 0),
                                        currency: price?.getAttribute('currency') || 'USD',
                                        condition: condition?.getAttribute('value') || condition?.textContent || 'unknown',
                                        notes: notes?.getAttribute('value') || notes?.textContent || '',
                                        link: link?.getAttribute('href') || link?.textContent || ''
                                    };
                                });

                                if (listings.length > 0) {
                                    gameListings[gameId] = {
                                        name: game.name,
                                        image: game.image,
                                        listings: listings,
                                        stats: calculateListingStats(listings)
                                    };
                                    batchListings++;
                                    console.log(`  ✅ ${game.name}: ${listings.length} listings parsed`);
                                }
                            } else {
                                console.log(`⚠️ No <marketplacelistings> element found for game ${gameId} (${game.name})`);
                            }
                        });

                        console.log(`📊 Batch result: ${batchListings}/${batch.length} games had listings\n`);
                    } catch (error) {
                        console.error(`Error processing batch:`, error);
                    }
                }));

                processed += batchGroup.reduce((sum, batch) => sum + batch.length, 0);
                updateProgress(processed, allGames.length);
                statusMetric.textContent = `Batch ${Math.min(i + parallelBatches, batches.length)}/${batches.length}`;
                updateMetrics();
                renderGames();

                } catch (error) {
                    console.error(`❌ Error processing batch at ${i}:`, error);
                    processingStatus.textContent = `⚠️ Error in batch: ${error.message}`;
                }

                await new Promise(resolve => setTimeout(resolve, 200));
            }

            localStorage.setItem(STORAGE_KEY_TIMESTAMP, new Date().toISOString());

            const resultText = `✅ Done! Found ${Object.keys(gameListings).length} games with listings`;
            processingStatus.textContent = resultText;
            statusMetric.textContent = 'Complete';
            updateProgress(100, 100);
            updateMetrics();
            console.log(resultText);
            hideModal();
            setTimeout(() => { processingStatus.classList.remove('active'); }, 3000);
        }

        // Calculate listing stats
        function calculateListingStats(listings) {
            const prices = listings.filter(l => l.price > 0).map(l => l.price);
            const conditions = {};
            listings.forEach(l => {
                conditions[l.condition] = (conditions[l.condition] || 0) + 1;
            });

            const avgPrice = prices.length > 0 ? (prices.reduce((a, b) => a + b, 0) / prices.length).toFixed(2) : 0;
            const minPrice = prices.length > 0 ? Math.min(...prices).toFixed(2) : 0;
            const maxPrice = prices.length > 0 ? Math.max(...prices).toFixed(2) : 0;

            return {
                count: listings.length,
                avgPrice: avgPrice,
                minPrice: minPrice,
                maxPrice: maxPrice,
                conditions: conditions
            };
        }

        // Get selected conditions
        function getSelectedConditions() {
            const checkboxes = document.querySelectorAll('input[name="condition"]:checked');
            return Array.from(checkboxes).map(cb => cb.value);
        }

        // Render games
        function renderGames() {
            const searchTerm = searchInput.value.toLowerCase();
            const selectedConditions = getSelectedConditions();
            
            // If no games loaded yet, show loading state
            if (Object.keys(gameListings).length === 0) {
                console.log('⏳ No games loaded yet, skipping render');
                gamesList.innerHTML = '<div class="no-data">📦 Loading... Click "Load" to fetch marketplace data</div>';
                return;
            }

            try {
                let games = Object.entries(gameListings)
                    .filter(([gameId, game]) => {
                        if (!game || !game.name || !game.listings) {
                            console.warn(`Invalid game data for ${gameId}:`, game);
                            return false;
                        }
                        if (!game.name.toLowerCase().includes(searchTerm)) return false;
                        return game.listings.some(l => selectedConditions.includes(l.condition));
                    });

                // Apply sorting
                games.sort((a, b) => {
                    const gameA = a[1];
                    const gameB = b[1];
                    const statsA = gameA.stats;
                    const statsB = gameB.stats;
                    
                    switch(currentSortOrder) {
                        case 'name':
                            return gameA.name.localeCompare(gameB.name);
                        case 'name-desc':
                            return gameB.name.localeCompare(gameA.name);
                        case 'listings':
                            return statsA.count - statsB.count;
                        case 'listings-desc':
                            return statsB.count - statsA.count;
                        case 'price':
                            return statsA.avgPrice - statsB.avgPrice;
                        case 'price-desc':
                            return statsB.avgPrice - statsA.avgPrice;
                        default:
                            return gameA.name.localeCompare(gameB.name);
                    }
                });

                if (games.length === 0) {
                    gamesList.innerHTML = '<div class="no-data">No games with listings found</div>';
                    console.log('❌ No games found after filtering');
                    return;
                }

                console.log(`\n📋 Rendering ${games.length} game cards`);

                gamesList.innerHTML = games.map(([gameId, game]) => {
                    const filteredListings = game.listings.filter(l => selectedConditions.includes(l.condition));
                    const stats = game.stats;
                    
                    console.log(`🎨 Card: ${game.name} - ${filteredListings.length} listings, img: ${game.image ? '✓' : '✗'}`);

                    return `
                        <div class="game-card" data-game-id="${gameId}">
                            <div class="game-card-main">
                                <div class="game-thumbnail">
                                    ${game.image ? `<img src="/api/image-proxy?url=${encodeURIComponent(game.image)}" alt="" onerror="this.style.display='none';">` : '<div style="width: 100%; height: 100%; background: #f0f0f0; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #999;">📦</div>'}
                                </div>
                                <div class="game-info">
                                    <div class="game-header">${escapeHtml(game.name)}</div>
                                    <div style="font-size: 0.8rem; color: #666; margin-top: 0.25rem;">
                                        <div>💰 Avg: $${stats.avgPrice} | Min: $${stats.minPrice} | Max: $${stats.maxPrice}</div>
                                        <div style="margin-top: 0.15rem;">📋 ${filteredListings.length} listings</div>
                                    </div>
                                    <span class="game-count" style="margin-top: 0.25rem;">📦 ${stats.count} total</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                // Add click handlers to show details modal
                document.querySelectorAll('.game-card').forEach(card => {
                    card.addEventListener('click', function(e) {
                        const gameId = this.dataset.gameId;
                        const game = gameListings[gameId];
                        if (!game) return;
                        
                        const selectedConds = getSelectedConditions();
                        const filteredListings = game.listings.filter(l => selectedConds.includes(l.condition));
                        showDetailsModal(gameId, game, filteredListings);
                    });
                });
            } catch (error) {
                console.error('❌ Error rendering games:', error);
                gamesList.innerHTML = '<div class="no-data">Error rendering games: ' + error.message + '</div>';
            }
        }

        // Show details modal with marketplace listing info
        function showDetailsModal(gameId, game, listings) {
            const modal = document.getElementById('detailsModal');
            const modalHeader = document.getElementById('detailsHeader');
            const modalBody = document.getElementById('detailsBody');
            const detailsCloseBtn = document.getElementById('detailsCloseBtn');

            modalHeader.innerHTML = `
                💰 ${escapeHtml(game.name)}
                <button class="modal-close" id="detailsCloseBtn">✕</button>
            `;

            const stats = game.stats;
            const listingDetails = listings.map(l => `
                <div style="margin-bottom: 1rem; padding: 1rem; background: #f9f9f9; border-radius: 6px; border-left: 4px solid #6366f1;">
                    <div style="font-size: 1.2rem; font-weight: 700; color: #059669; margin-bottom: 0.5rem;">💰 $${l.price.toFixed(2)}</div>
                    <div style="display: flex; gap: 0.5rem; margin-bottom: 0.75rem;">
                        <span style="display: inline-block; background: ${getConditionColor(l.condition)}; color: white; padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600;">${capitalizeFirst(l.condition)}</span>
                        <span style="display: inline-block; background: #f0f0f0; color: #666; padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.8rem;">📅 ${formatDate(l.date)}</span>
                    </div>
                    ${l.notes ? `<div style="font-size: 0.9rem; color: #666; margin-bottom: 0.75rem;">📝 ${escapeHtml(l.notes)}</div>` : ''}
                    <a href="${l.link}" target="_blank" style="display: inline-block; background: #6366f1; color: white; padding: 0.5rem 1rem; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 0.9rem;">🔗 View Listing</a>
                </div>
            `).join('');

            modalBody.innerHTML = `
                <div style="margin-bottom: 1rem;">
                    <div style="font-weight: 600; margin-bottom: 0.75rem;">📊 Statistics</div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem;">
                        <div style="padding: 0.75rem; background: #f0f9ff; border: 1px solid #bfdbfe; border-radius: 6px;">
                            <div style="font-size: 0.75rem; font-weight: 600; color: #1e40af;">Total Listings</div>
                            <div style="font-size: 1.3rem; font-weight: 700; color: #333;">${stats.count}</div>
                        </div>
                        <div style="padding: 0.75rem; background: #f0f9ff; border: 1px solid #bfdbfe; border-radius: 6px;">
                            <div style="font-size: 0.75rem; font-weight: 600; color: #1e40af;">Average Price</div>
                            <div style="font-size: 1.3rem; font-weight: 700; color: #059669;">$${stats.avgPrice}</div>
                        </div>
                        <div style="padding: 0.75rem; background: #f0f9ff; border: 1px solid #bfdbfe; border-radius: 6px;">
                            <div style="font-size: 0.75rem; font-weight: 600; color: #1e40af;">Min Price</div>
                            <div style="font-size: 1.3rem; font-weight: 700; color: #059669;">$${stats.minPrice}</div>
                        </div>
                        <div style="padding: 0.75rem; background: #f0f9ff; border: 1px solid #bfdbfe; border-radius: 6px;">
                            <div style="font-size: 0.75rem; font-weight: 600; color: #1e40af;">Max Price</div>
                            <div style="font-size: 1.3rem; font-weight: 700; color: #059669;">$${stats.maxPrice}</div>
                        </div>
                    </div>
                </div>
                <div style="font-weight: 600; margin-bottom: 0.75rem;">💰 Listings (${listings.length})</div>
                <div style="max-height: 500px; overflow-y: auto;">
                    ${listingDetails}
                </div>
            `;

            modal.classList.remove('hidden');
            document.getElementById('detailsCloseBtn').addEventListener('click', closeDetailsModal);
        }

        // Get condition color
        function getConditionColor(condition) {
            const colors = {
                new: '#ec4899',
                likenew: '#10b981',
                verygood: '#3b82f6',
                good: '#f59e0b',
                acceptable: '#f97316'
            };
            return colors[condition] || '#6b7280';
        }

        // Close details modal
        function closeDetailsModal() {
            document.getElementById('detailsModal').classList.add('hidden');
        }

        // Format date
        function formatDate(dateStr) {
            if (!dateStr) return 'Unknown date';
            const date = new Date(dateStr);
            return date.toLocaleDateString();
        }

        // Capitalize first
        function capitalizeFirst(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        // Update cache info
        function updateCacheInfo() {
            // Only show username, not cache info
            cacheInfo.textContent = `👤 Username: ${currentUsername} | 📦 Collection: ${allGames.length} games`;
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize
        window.addEventListener('load', () => {
            const savedUsername = localStorage.getItem('bgg_marketplace_username');
            if (savedUsername) {
                usernameInput.value = savedUsername;
            }
            updateCacheInfo();
            console.log('💰 Marketplace app loaded');
            showModal();
        });
    </script>
    <!-- Vercel Web Analytics -->
    <script type="module" src="analytics-init.js"></script>

</body>
