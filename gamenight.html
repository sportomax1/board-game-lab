<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Game Night Menu | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🎭</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            overflow-x: hidden !important;
            overflow-y: auto !important;
            max-width: 100vw;
            width: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        /* Glass surfaces */
        .glass {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.09);
        }

        .glass-dark {
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        /* Gradient buttons */
        .btn-blue { background: linear-gradient(135deg,#3b82f6,#2563eb); box-shadow: 0 4px 15px rgba(37,99,235,.35); }
        .btn-green { background: linear-gradient(135deg,#10b981,#059669); box-shadow: 0 4px 15px rgba(16,185,129,.3); }
        .btn-amber { background: linear-gradient(135deg,#f59e0b,#d97706); box-shadow: 0 4px 12px rgba(245,158,11,.25); }
        .btn-rose { background: linear-gradient(135deg,#f43f5e,#e11d48); box-shadow: 0 4px 10px rgba(244,63,94,.25); }

        /* Input fields */
        .input-field {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            color: #f8fafc;
        }

        .input-field::placeholder { color: #64748b; }
        .input-field:focus { outline: none; ring: 2px; ring-color: rgba(59,130,246,0.4); }

        /* Game/Item cards */
        .item-card {
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.03);
            transition: all .2s ease;
            cursor: pointer;
        }

        .item-card:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); }
        .item-card.selected { background: rgba(59,130,246,.12); border-color: rgba(59,130,246,.4); box-shadow: 0 0 12px rgba(59,130,246,.2); }

        /* Chip badges */
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(59,130,246,0.15);
            border: 1px solid rgba(59,130,246,0.3);
            color: #60a5fa;
            font-size: 11px;
            font-weight: 600;
        }

        .chip i { width: 3px; height: 3px; }

        /* Views */
        .view { display: none; }
        .view.active { display: flex; }

        /* Animations */
        @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; } }

        /* Scrollbar */
        .scrollbar::-webkit-scrollbar { width: 4px; }
        .scrollbar::-webkit-scrollbar-track { background: transparent; }
        .scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        /* Prevent horizontal scrolling on iPhone */
        * { overflow-x: hidden !important; }
        .scrollbar { overflow-x: hidden !important; }

        /* Background glow */
        .bg-glow {
            position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
        }

        .bg-glow::before {
            content: '';
            position: absolute;
            top: 10%; right: 5%;
            width: 100px; height: 100px;
            background: rgba(59,130,246,0.12);
            filter: blur(130px);
            border-radius: 50%;
        }

        .bg-glow::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 80%; height: 50%;
            background: rgba(16,185,129,0.08);
            filter: blur(130px);
            border-radius: 50%;
        }

        @media (max-width: 768px) {
            body { font-size: 14px; }
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white; color: #1a202c; }
            .glass { background: transparent; border: none; backdrop-filter: none; }
            .menu-item { break-inside: avoid; page-break-inside: avoid; }
        }
    </style>
</head>
<body>

<div class="bg-glow"></div>

<div class="relative z-10 flex flex-col h-screen gap-0">

    <!-- ════ BUILDER VIEW ════ -->
    <div id="builderView" class="view active flex-col overflow-hidden">

        <!-- Header -->
        <header class="shrink-0 border-b border-white/5 px-4 py-3 bg-slate-900/60">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-blue-600/20 rounded-lg flex items-center justify-center border border-blue-500/30">
                        <i data-lucide="utensils" class="w-4 h-4 text-blue-400"></i>
                    </div>
                    <div>
                        <h1 class="text-[15px] font-black italic uppercase tracking-tighter leading-none text-white">Game Night</h1>
                        <p class="text-[8px] font-bold text-slate-500 uppercase tracking-widest mt-0.5">Create Your Menu</p>
                    </div>
                </div>
                <button onclick="previewMenu()" class="btn-blue text-white px-4 py-2 rounded-lg font-bold text-[10px] uppercase tracking-widest active:scale-95 transition-transform flex items-center gap-1.5">
                    <i data-lucide="eye" class="w-3 h-3"></i>
                    <span>Preview</span>
                </button>
            </div>
        </header>

        <!-- Content -->
        <div class="flex-1 overflow-y-auto scrollbar p-4 space-y-4">
            <!-- Config section -->
            <div class="glass rounded-2xl p-4 space-y-3">
                <h2 class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Event Details</h2>
                
                <div class="space-y-2">
                    <label class="text-[8px] font-bold text-slate-500 uppercase tracking-widest">Event Title</label>
                    <input type="text" id="eventTitle" value="Game Night"
                        class="w-full input-field rounded-lg px-3 py-2.5 text-sm font-bold"
                        placeholder="Friday Night Gaming">
                </div>

                <div class="space-y-2">
                    <label class="text-[8px] font-bold text-slate-500 uppercase tracking-widest">Date & Time</label>
                    <input type="text" id="eventDate" value="Tonight"
                        class="w-full input-field rounded-lg px-3 py-2.5 text-sm font-bold"
                        placeholder="Tonight at 7 PM">
                </div>
            </div>

            <!-- Games section -->
            <div class="glass rounded-2xl p-4 space-y-3">
                <h2 class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Games</h2>

                <div class="flex gap-2">
                    <input type="text" id="usernameInput" value="sportomax"
                        class="flex-1 input-field rounded-lg px-3 py-2 text-sm font-bold"
                        placeholder="BGG Username">
                    <button onclick="loadCollection()" id="loadBtn"
                        class="btn-blue text-white px-4 py-2 rounded-lg font-bold text-[9px] uppercase tracking-widest active:scale-95 transition-transform">
                        Load
                    </button>
                </div>

                <input type="text" id="gameSearch" placeholder="Search games..."
                    class="w-full input-field rounded-lg px-3 py-2 text-sm font-bold"
                    onkeyup="filterGames()">

                <div id="gamesList" class="space-y-1 max-h-48 overflow-y-auto scrollbar rounded-lg p-1 bg-black/20">
                    <!-- Populated by JS -->
                </div>

                <div id="selectedGamesContainer" class="pt-2 border-t border-white/5">
                    <p class="text-[8px] font-bold text-slate-500 uppercase tracking-widest mb-2">Selected</p>
                    <div id="selectedGames" class="flex flex-wrap gap-2">
                        <!-- Chips -->
                    </div>
                </div>
            </div>

            <!-- Food section -->
            <div class="glass rounded-2xl p-4 space-y-3">
                <h2 class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Food & Drinks</h2>
                <textarea id="foodInput" placeholder="Enter items (one per line)"
                    class="w-full input-field rounded-lg px-3 py-2.5 text-sm font-bold h-24 resize-none">
Pizza
Snacks
Soda
Juice
Beer</textarea>
            </div>
        </div>
    </div>

    <!-- ════ MENU VIEW ════ -->
    <div id="menuView" class="view hidden flex-col">

        <!-- Controls -->
        <div class="shrink-0 glass-dark px-4 py-2 flex items-center justify-between no-print border-b border-white/5">
            <button onclick="backToBuilder()" class="glass px-3 py-2 rounded-lg text-[9px] font-black uppercase tracking-widest text-slate-400 hover:text-white transition-all flex items-center gap-1.5">
                <i data-lucide="arrow-left" class="w-3 h-3"></i>
                Back
            </button>
            <button onclick="window.print()" class="btn-blue text-white px-4 py-2 rounded-lg text-[9px] font-black uppercase tracking-widest active:scale-95 transition-transform flex items-center gap-1.5">
                <i data-lucide="printer" class="w-3 h-3"></i>
                Print
            </button>
        </div>

        <!-- Menu content -->
        <div class="flex-1 overflow-y-auto scrollbar">
            <div id="menuContent" class="max-w-2xl mx-auto p-6 md:p-8">
                <!-- Injected here -->
            </div>
        </div>
    </div>

</div>

<script>
    let allGames = [];
    let selectedGameIds = new Set();

    async function loadCollection() {
        const username = document.getElementById('usernameInput').value.trim();
        if (!username) return;

        const btn = document.getElementById('loadBtn');
        btn.textContent = 'Loading...';
        btn.disabled = true;

        try {
            for (let retry = 0; retry < 5; retry++) {
                const res = await fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1`);
                if (res.status === 202) { await new Promise(r => setTimeout(r, 3000)); continue; }

                const xml = await res.text();
                const doc = new DOMParser().parseFromString(xml, 'text/xml');
                
                allGames = Array.from(doc.querySelectorAll('item')).map(item => ({
                    id: item.getAttribute('objectid'),
                    name: item.querySelector('name')?.textContent || 'Unknown',
                    image: item.querySelector('thumbnail')?.textContent || '',
                    year: item.querySelector('yearpublished')?.textContent || ''
                })).filter(g => g.image);

                allGames.sort((a, b) => a.name.localeCompare(b.name));
                filterGames();
                btn.textContent = 'Load';
                btn.disabled = false;
                return;
            }
        } catch (error) {
            alert('Error loading collection');
            btn.textContent = 'Load';
            btn.disabled = false;
        }
    }

    function filterGames() {
        const term = document.getElementById('gameSearch').value.toLowerCase();
        const container = document.getElementById('gamesList');
        
        if (allGames.length === 0) {
            container.innerHTML = '<div class="text-[10px] text-slate-500 p-3 text-center">Load your collection first</div>';
            return;
        }

        const filtered = allGames.filter(g => g.name.toLowerCase().includes(term));
        
        container.innerHTML = filtered.map(g => `
            <div class="item-card ${selectedGameIds.has(g.id) ? 'selected' : ''} rounded-lg p-2.5 flex items-center gap-2.5 cursor-pointer transition-all"
                 onclick="toggleGame('${g.id}')">
                <div class="w-10 h-10 rounded-lg overflow-hidden flex-shrink-0 bg-white/5 border border-white/5">
                    ${g.image ? `<img src="/api/image-proxy?url=${encodeURIComponent(g.image)}" class="w-full h-full object-cover">` : ''}
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-[11px] font-bold text-white truncate">${g.name}</p>
                    <p class="text-[8px] text-slate-500 font-bold">${g.year || ''}</p>
                </div>
            </div>
        `).join('');
    }

    function toggleGame(id) {
        if (selectedGameIds.has(id)) {
            selectedGameIds.delete(id);
        } else {
            selectedGameIds.add(id);
        }
        filterGames();
        renderSelectedChips();
    }

    function renderSelectedChips() {
        const container = document.getElementById('selectedGames');
        if (selectedGameIds.size === 0) {
            container.innerHTML = '<p class="text-[9px] text-slate-500 italic">No games selected</p>';
            return;
        }

        container.innerHTML = Array.from(selectedGameIds).map(id => {
            const g = allGames.find(x => x.id === id);
            return `
                <div onclick="toggleGame('${id}')" class="chip cursor-pointer hover:bg-blue-500/25 transition-all">
                    <span>${g.name}</span>
                    <i data-lucide="x" class="w-3 h-3"></i>
                </div>
            `;
        }).join('');

        lucide.createIcons();
    }

    function previewMenu() {
        const title = document.getElementById('eventTitle').value || 'Game Night';
        const date = document.getElementById('eventDate').value || 'Tonight';
        const food = document.getElementById('foodInput').value.split('\n').filter(x => x.trim());

        const gamesHtml = Array.from(selectedGameIds).map(id => {
            const g = allGames.find(x => x.id === id);
            return `
                <div class="menu-item mb-6 pb-6 border-b border-white/5 last:border-0">
                    <div class="flex items-start gap-4">
                        <div class="w-20 h-24 rounded-lg overflow-hidden flex-shrink-0 bg-white/5 border border-white/5 shadow-md">
                            ${g.image ? `<img src="/api/image-proxy?url=${encodeURIComponent(g.image)}" class="w-full h-full object-cover">` : ''}
                        </div>
                        <div class="flex-1 pt-1">
                            <h3 class="text-[15px] font-bold text-white">${g.name}</h3>
                            <p class="text-[11px] text-slate-500 font-bold mt-1">${g.year || ''}</p>
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        const foodHtml = food.length > 0 ? `
            <div class="mt-6 pt-6 border-t border-white/5">
                <h2 class="text-[15px] font-black uppercase tracking-tight mb-4 text-white">Refreshments</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                    ${food.map(f => `
                        <div class="flex items-center gap-2 text-[13px] font-bold text-slate-300">
                            <span class="w-1.5 h-1.5 rounded-full bg-blue-400"></span>
                            ${f}
                        </div>
                    `).join('')}
                </div>
            </div>
        ` : '';

        const menuContent = document.getElementById('menuContent');
        menuContent.innerHTML = `
            <div class="glass rounded-2xl p-6 md:p-8 border-t border-white/20 space-y-4">
                <!-- Header -->
                <div class="text-center mb-6">
                    <div class="w-14 h-14 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-blue-500/30 mb-3 text-2xl">
                        🎭
                    </div>
                    <h1 class="text-3xl md:text-4xl font-black text-white mb-1 italic uppercase">${title}</h1>
                    <p class="text-[12px] md:text-sm font-bold text-slate-400 uppercase tracking-widest">${date}</p>
                </div>

                <!-- Games -->
                ${selectedGameIds.size > 0 ? `
                    <div class="mt-8 pt-6 border-t border-white/5">
                        <h2 class="text-[15px] font-black uppercase tracking-tight mb-4 text-white">On the Table</h2>
                        <div class="space-y-0">
                            ${gamesHtml}
                        </div>
                    </div>
                ` : ''}

                <!-- Food -->
                ${foodHtml}

                <!-- Footer -->
                <div class="mt-8 pt-6 border-t border-white/5 text-center">
                    <p class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Created with Sportomax</p>
                </div>
            </div>
        `;

        document.getElementById('builderView').classList.remove('active');
        document.getElementById('menuView').classList.add('active');
        lucide.createIcons();
    }

    function backToBuilder() {
        document.getElementById('menuView').classList.remove('active');
        document.getElementById('builderView').classList.add('active');
    }

    window.addEventListener('load', () => {
        lucide.createIcons();
        filterGames();
    });
</script>

<!-- Analytics -->
<script type="module" src="analytics-init.js"></script>

</body>
</html>
