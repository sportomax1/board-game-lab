<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory — Spending & Collection Analytics</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>📦</text></svg>">
    <style>
        :root {
            --accent: #7c3aed;
            --accent-2: #a855f7;
            --accent-glow: rgba(124,58,237,0.18);
            --surface: #ffffff;
            --surface-2: #f8f7ff;
            --border: #ede9fe;
            --text: #1e1b4b;
            --text-2: #6b7280;
            --text-3: #9ca3af;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --radius: 14px;
            --radius-sm: 8px;
            --shadow: 0 4px 24px rgba(124,58,237,0.08);
            --shadow-hover: 0 8px 32px rgba(124,58,237,0.16);
            --transition: all 0.22s cubic-bezier(0.4,0,0.2,1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
            background: var(--surface-2);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── Header ── */
        .app-header {
            background: linear-gradient(135deg, #4c1d95 0%, #7c3aed 50%, #a855f7 100%);
            color: white;
            padding: 18px 24px 16px;
            position: sticky;
            top: 0;
            z-index: 30;
            box-shadow: 0 2px 20px rgba(76,29,149,0.3);
        }
        .header-inner {
            max-width: 960px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .header-icon { font-size: 28px; line-height: 1; }
        .header-text { flex: 1; min-width: 0; }
        .header-text h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
        .header-text p { font-size: 12px; opacity: 0.75; margin-top: 1px; }
        .header-load {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .header-input {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.25);
            color: white;
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            width: 130px;
            outline: none;
            transition: var(--transition);
        }
        .header-input::placeholder { color: rgba(255,255,255,0.55); }
        .header-input:focus { background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.5); }
        .btn-load {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: var(--transition);
            white-space: nowrap;
        }
        .btn-load:hover { background: rgba(255,255,255,0.3); }
        .btn-load:active { transform: scale(0.97); }

        /* ── Progress Bar ── */
        .progress-bar-wrap {
            height: 3px;
            background: rgba(255,255,255,0.1);
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: rgba(255,255,255,0.9);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* ── Tabs ── */
        .tabs-wrap {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 66px;
            z-index: 20;
            box-shadow: 0 1px 8px rgba(124,58,237,0.06);
        }
        .tabs {
            display: flex;
            max-width: 960px;
            margin: 0 auto;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }
        .tab-btn {
            flex: 0 0 auto;
            padding: 13px 20px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-2);
            border-bottom: 3px solid transparent;
            transition: var(--transition);
            white-space: nowrap;
            font-family: inherit;
        }
        .tab-btn:hover { color: var(--accent); background: var(--accent-glow); }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); background: var(--accent-glow); }

        /* ── Main Content ── */
        .main-content {
            max-width: 960px;
            margin: 0 auto;
            padding: 20px 16px;
        }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        /* ── Cards ── */
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 14px;
        }

        /* ── Metric Cards ── */
        .metric-card {
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 14px;
            position: relative;
            overflow: hidden;
        }
        .metric-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: inherit;
            filter: brightness(1.08);
            opacity: 0;
            transition: opacity 0.2s;
        }
        .metric-card.primary   { background: linear-gradient(135deg, #4c1d95, #7c3aed); color: #fff; border: none; }
        .metric-card.secondary { background: linear-gradient(135deg, #7c3aed, #a855f7); color: #fff; border: none; }
        .metric-card.tertiary  { background: linear-gradient(135deg, #0ea5e9, #38bdf8); color: #fff; border: none; }
        .metric-card.green     { background: linear-gradient(135deg, #059669, #34d399); color: #fff; border: none; }
        .metric-card.warm      { background: linear-gradient(135deg, #f59e0b, #fbbf24); color: #fff; border: none; }
        .metric-card.rose      { background: linear-gradient(135deg, #db2777, #f472b6); color: #fff; border: none; }

        .metric-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; margin-bottom: 6px; }
        .metric-value { font-size: 32px; font-weight: 900; line-height: 1; margin-bottom: 4px; letter-spacing: -1px; }
        .metric-detail { font-size: 11px; opacity: 0.7; font-weight: 500; }

        /* ── Grid ── */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
        .grid-2 .metric-card { margin-bottom: 0; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 14px; }
        .grid-3 .metric-card { margin-bottom: 0; }

        /* ── Filter Bar ── */
        .filter-bar {
            display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center;
        }
        .filter-bar select, .filter-bar input[type="text"] {
            flex: 1 1 140px;
            padding: 9px 12px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-family: inherit;
            background: var(--surface);
            color: var(--text);
            outline: none;
            transition: var(--transition);
        }
        .filter-bar select:focus, .filter-bar input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        /* ── Item List ── */
        .item-list { display: flex; flex-direction: column; gap: 10px; }
        .item-card {
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }
        .item-card:hover {
            border-color: var(--accent);
            box-shadow: var(--shadow-hover);
            transform: translateY(-1px);
        }
        .item-thumb {
            width: 54px; height: 54px;
            background: var(--surface-2);
            border-radius: 10px;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; overflow: hidden;
            border: 1px solid var(--border);
        }
        .item-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
        .item-info { flex: 1; min-width: 0; }
        .item-name { font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.3; margin-bottom: 3px; }
        .item-meta { font-size: 12px; color: var(--text-2); margin-bottom: 1px; }
        .item-badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
        .badge {
            display: inline-block; font-size: 10px; padding: 2px 8px;
            border-radius: 20px; font-weight: 700; letter-spacing: 0.2px;
        }
        .badge.own      { background: #d1fae5; color: #065f46; }
        .badge.prevowned { background: #fef3c7; color: #92400e; }
        .item-price {
            font-size: 15px; font-weight: 800; color: var(--accent);
            flex-shrink: 0; align-self: center;
        }

        /* ── Charts ── */
        .section-title {
            font-size: 13px; font-weight: 800; color: var(--accent);
            text-transform: uppercase; letter-spacing: 0.8px;
            margin: 22px 0 10px; display: flex; align-items: center; gap: 6px;
        }
        .section-title::after {
            content: ''; flex: 1; height: 1.5px; background: var(--border);
        }
        .chart-wrap {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 14px;
        }
        .bar-chart { display: flex; flex-direction: column; gap: 8px; }
        .bar-item { display: flex; align-items: center; gap: 10px; }
        .bar-label { font-size: 11px; font-weight: 700; color: var(--text-2); min-width: 64px; line-height: 1.2; }
        .bar-track { flex: 1; background: var(--surface-2); height: 20px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
        .bar-fill { height: 100%; border-radius: 6px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1); }
        .bar-val { font-size: 11px; font-weight: 800; color: var(--text); min-width: 36px; text-align: right; }

        /* ── Modal ── */
        .modal {
            display: none; position: fixed; inset: 0;
            background: rgba(15,10,40,0.55);
            backdrop-filter: blur(4px);
            z-index: 100;
            align-items: center; justify-content: center; padding: 16px;
        }
        .modal.open { display: flex; }
        .modal-box {
            background: var(--surface);
            border-radius: 20px;
            max-width: 560px; width: 100%;
            max-height: 90vh; overflow-y: auto;
            box-shadow: 0 32px 80px rgba(76,29,149,0.35);
            animation: slideUp 0.25s cubic-bezier(0.4,0,0.2,1);
        }
        @keyframes slideUp { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform: translateY(0); } }
        .modal-head {
            background: linear-gradient(135deg, #4c1d95, #7c3aed);
            color: white; padding: 18px 20px;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 2;
            border-radius: 20px 20px 0 0;
        }
        .modal-head h2 { font-size: 15px; font-weight: 700; }
        .modal-close {
            background: rgba(255,255,255,0.15); border: none; color: white;
            cursor: pointer; width: 32px; height: 32px;
            border-radius: 50%; font-size: 20px;
            display: flex; align-items: center; justify-content: center;
            transition: var(--transition);
        }
        .modal-close:hover { background: rgba(255,255,255,0.28); }
        .modal-body { padding: 20px; }
        .modal-img {
            width: 100%; height: 200px; background: var(--surface-2);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            margin-bottom: 18px; overflow: hidden; border: 1px solid var(--border);
        }
        .modal-img img { width: 100%; height: 100%; object-fit: cover; }
        .detail-group { margin-bottom: 20px; }
        .detail-group-title {
            font-size: 10px; font-weight: 800; color: var(--accent);
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;
        }
        .detail-row {
            display: flex; justify-content: space-between;
            padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-key { color: var(--text-2); font-weight: 500; }
        .detail-val { color: var(--text); font-weight: 700; text-align: right; max-width: 60%; }

        /* ── Loading / Empty ── */
        .loading { text-align: center; padding: 48px 20px; color: var(--text-3); }
        .spinner {
            width: 32px; height: 32px; margin: 0 auto 12px;
            border: 3px solid var(--border); border-top-color: var(--accent);
            border-radius: 50%; animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading p { font-size: 13px; font-weight: 500; }
        .empty { text-align: center; padding: 48px 20px; color: var(--text-3); font-size: 13px; }

        /* ── Status Banner ── */
        .status-banner {
            background: linear-gradient(135deg, #f5f3ff, #ede9fe);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 12px;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 14px;
            display: flex; align-items: center; gap: 8px;
        }
        .status-banner .spin-sm {
            width: 14px; height: 14px;
            border: 2px solid var(--border); border-top-color: var(--accent);
            border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0;
        }

        /* ── Insight Card ── */
        .insight-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 14px;
        }
        .insight-card p { font-size: 13px; line-height: 2; }

        /* ── Import ── */
        .import-zone {
            max-width: 480px; margin: 0 auto 20px; text-align: center;
        }
        .import-zone p { font-size: 13px; color: var(--text-2); margin-bottom: 16px; line-height: 1.7; }
        .btn-primary {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: white; padding: 11px 20px; border: none; border-radius: 10px;
            font-weight: 700; cursor: pointer; font-size: 13px; font-family: inherit;
            text-decoration: none; transition: var(--transition);
            box-shadow: 0 4px 14px var(--accent-glow);
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-primary:active { transform: scale(0.98); }
        .file-input { margin: 14px 0; display: block; width: 100%; font-size: 13px; }

        /* ── Responsive ── */
        @media (min-width: 768px) {
            .main-content { padding: 28px 24px; }
            .metric-value { font-size: 36px; }
            .tab-btn { padding: 14px 26px; }
            .bar-label { min-width: 80px; }
        }
        @media (max-width: 560px) {
            .header-text h1 { font-size: 17px; }
            .header-input { width: 100px; font-size: 12px; }
            .main-content { padding: 12px 10px; }
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
            .metric-value { font-size: 28px; }
            .filter-bar { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="app-header">
    <div class="header-inner">
        <div class="header-icon">📦</div>
        <div class="header-text">
            <h1>Inventory</h1>
            <p>Spending &amp; Collection Analytics</p>
        </div>
        <div class="header-load">
            <input class="header-input" id="usernameInput" type="text" value="sportomax" placeholder="BGG Username" />
            <button class="btn-load" id="loadBtn" onclick="startLoad()">Load</button>
        </div>
    </div>
</div>
<div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>

<div class="tabs-wrap">
    <div class="tabs">
        <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
        <button class="tab-btn" data-tab="items">Items</button>
        <button class="tab-btn" data-tab="spending">Spending</button>
        <button class="tab-btn" data-tab="timeline">Timeline</button>
        <button class="tab-btn" data-tab="analysis">Analysis</button>
        <button class="tab-btn" data-tab="import">📥 Import</button>
    </div>
</div>

<div class="main-content">
    <div id="status-wrap"></div>

    <div class="tab-pane active" id="tab-dashboard">
        <div id="dashboard-inner"><div class="loading"><div class="spinner"></div><p>Load a collection or import CSV</p></div></div>
    </div>
    <div class="tab-pane" id="tab-items">
        <div class="filter-bar">
            <input type="text" id="searchInput" placeholder="Search games…" oninput="renderItems()" />
            <select id="filter-status" onchange="renderItems()">
                <option value="">All Items</option>
                <option value="own">Currently Own</option>
                <option value="prevowned">Sold / Traded</option>
                <option value="hasPrice">With Price</option>
            </select>
            <select id="filter-sort" onchange="renderItems()">
                <option value="price-desc">Price: High → Low</option>
                <option value="price-asc">Price: Low → High</option>
                <option value="date-newest">Date: Newest</option>
                <option value="date-oldest">Date: Oldest</option>
                <option value="name">Name A–Z</option>
            </select>
        </div>
        <div id="items-list" class="item-list"></div>
    </div>
    <div class="tab-pane" id="tab-spending">
        <div id="spending-inner"></div>
    </div>
    <div class="tab-pane" id="tab-timeline">
        <div id="timeline-inner"></div>
    </div>
    <div class="tab-pane" id="tab-analysis">
        <div id="analysis-inner"></div>
    </div>
    <div class="tab-pane" id="tab-import">
        <div class="import-zone">
            <p>Download your BGG private collection CSV (includes price paid, acquisition date, notes) and import it below. Your data is saved locally and enriched with game artwork.</p>
            <a href="https://boardgamegeek.com/geekcollection.php?action=exportcsv&subtype=boardgame&username=sportomax&all=1" target="_blank" class="btn-primary">📥 Download CSV from BGG</a>
            <input type="file" id="csvFileInput" accept=".csv" class="file-input" />
            <button onclick="importCSV()" class="btn-primary" style="width:100%;margin-top:4px;">Import CSV</button>
            <div id="importStatus" style="margin-top:14px;font-size:12px;color:var(--text-2);"></div>
        </div>
    </div>
</div>

<!-- Detail Modal -->
<div class="modal" id="detail-modal">
    <div class="modal-box">
        <div class="modal-head">
            <h2 id="modal-title"></h2>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="modal-img" id="modal-image"></div>
            <div id="modal-details"></div>
        </div>
    </div>
</div>

<script>
    /* ─────────────────────────────────────────
       CONSTANTS
    ───────────────────────────────────────── */
    const THING_BATCH_SIZE    = 20;
    const THING_PARALLEL      = 100;
    const LS_KEY              = 'inventory_data_v2';

    /* ─────────────────────────────────────────
       STATE
    ───────────────────────────────────────── */
    let data = [];
    const gameThumbnails = new Map();
    let loading = false;

    /* ─────────────────────────────────────────
       PROGRESS
    ───────────────────────────────────────── */
    function setProgress(pct) {
        document.getElementById('progressBar').style.width = pct + '%';
    }
    function setStatus(msg) {
        const el = document.getElementById('status-wrap');
        if (msg) {
            el.innerHTML = `<div class="status-banner"><div class="spin-sm"></div>${msg}</div>`;
        } else {
            el.innerHTML = '';
        }
    }

    /* ─────────────────────────────────────────
       LOAD FROM BGG COLLECTION API
    ───────────────────────────────────────── */
    async function startLoad() {
        if (loading) return;
        const username = document.getElementById('usernameInput').value.trim() || 'sportomax';
        document.getElementById('loadBtn').textContent = '…';
        loading = true;
        setProgress(5);

        try {
            setStatus(`Fetching collection for <strong>${username}</strong>…`);
            const items = await fetchCollectionWithRetry(username);
            data = items.filter(i => i.pricepaid || i.invdate);

            setProgress(30);
            renderAll();

            setStatus(`Loading artwork for ${data.length} games…`);
            await loadThingImages();

            setProgress(100);
            setStatus('');
            saveLocal();
            renderItems(); // refresh with thumbnails
        } catch (err) {
            console.error(err);
            setStatus(`❌ ${err.message}`);
        } finally {
            loading = false;
            document.getElementById('loadBtn').textContent = 'Load';
            setTimeout(() => setProgress(0), 800);
        }
    }

    async function fetchCollectionWithRetry(username) {
        const url = `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&prevowned=1&stats=1&showprivate=1`;
        const resp = await fetch(url);
        if (resp.status === 202) {
            await delay(2500);
            return fetchCollectionWithRetry(username);
        }
        if (!resp.ok) throw new Error(`BGG API error ${resp.status}`);
        const text = await resp.text();
        return parseCollectionXML(text);
    }

    function parseCollectionXML(xmlText) {
        const xml = new DOMParser().parseFromString(xmlText, 'text/xml');
        const items = xml.getElementsByTagName('item');
        return Array.from(items).map(item => {
            const status      = item.getElementsByTagName('status')[0];
            const pi          = item.getElementsByTagName('privateinfo')[0];
            const stats       = item.getElementsByTagName('stats')[0];
            const ratingEl    = stats ? stats.getElementsByTagName('rating')[0] : null;
            const avgEl       = ratingEl ? ratingEl.getElementsByTagName('average')[0] : null;
            const thumb       = item.getElementsByTagName('thumbnail')[0]?.textContent || '';
            return {
                objectid:       item.getAttribute('objectid') || '',
                objectname:     item.getElementsByTagName('name')[0]?.textContent || '',
                pricepaid:      pi ? (pi.getAttribute('pricepaid') || '') : '',
                invdate:        pi ? (pi.getAttribute('acquisitiondate') || '') : '',
                acquiredfrom:   pi ? (pi.getAttribute('acquiredfrom') || '') : '',
                privatecomment: pi ? (pi.getAttribute('privatecomment') || '') : '',
                quantity:       parseInt((pi ? pi.getAttribute('quantity') : null) || '1') || 1,
                own:            status ? status.getAttribute('own') === '1' : false,
                prevowned:      status ? status.getAttribute('prevowned') === '1' : false,
                yearpublished:  item.getElementsByTagName('yearpublished')[0]?.textContent || '',
                average:        parseFloat(avgEl?.getAttribute('value') || '0') || 0,
                image:          thumb.startsWith('//') ? 'https:' + thumb : thumb,
                numplays:       item.getElementsByTagName('numplays')[0]?.textContent || '0',
                minplayers:     stats ? stats.getAttribute('minplayers') || '' : '',
                maxplayers:     stats ? stats.getAttribute('maxplayers') || '' : '',
            };
        });
    }

    /* ─────────────────────────────────────────
       THING API — BATCHES OF 20, 100 PARALLEL
    ───────────────────────────────────────── */
    async function loadThingImages() {
        const allIds = [...new Set(data.map(i => i.objectid).filter(Boolean))];
        const batches = [];
        for (let i = 0; i < allIds.length; i += THING_BATCH_SIZE) {
            batches.push(allIds.slice(i, i + THING_BATCH_SIZE));
        }

        for (let i = 0; i < batches.length; i += THING_PARALLEL) {
            const slice = batches.slice(i, i + THING_PARALLEL);
            const pct = 30 + Math.round(((i + slice.length) / batches.length) * 68);
            setProgress(pct);
            await Promise.all(slice.map(batch => fetchThingBatch(batch)));
            if (i + THING_PARALLEL < batches.length) await delay(300);
        }
    }

    async function fetchThingBatch(ids) {
        if (!ids.length) return;
        const url = `/api/bgg-helper?endpoint=thing&id=${ids.join(',')}&stats=1`;
        try {
            const resp = await fetch(url);
            const text = await resp.text();
            const xml  = new DOMParser().parseFromString(text, 'text/xml');
            for (const item of xml.getElementsByTagName('item')) {
                const id    = item.getAttribute('id');
                const thumb = item.getElementsByTagName('thumbnail')[0]?.textContent;
                const img   = item.getElementsByTagName('image')[0]?.textContent;
                const src   = thumb || img;
                if (id && src) {
                    gameThumbnails.set(id, src.startsWith('//') ? 'https:' + src : src);
                }
            }
        } catch (e) { console.warn('Thing batch error:', ids, e); }
    }

    /* ─────────────────────────────────────────
       LOCAL STORAGE
    ───────────────────────────────────────── */
    function saveLocal() {
        try {
            localStorage.setItem(LS_KEY, JSON.stringify({ data, thumbs: [...gameThumbnails.entries()] }));
        } catch (e) {}
    }

    function loadLocal() {
        try {
            const raw = localStorage.getItem(LS_KEY);
            if (!raw) return false;
            const parsed = JSON.parse(raw);
            if (!parsed.data?.length) return false;
            data = parsed.data;
            if (parsed.thumbs) parsed.thumbs.forEach(([k, v]) => gameThumbnails.set(k, v));
            return true;
        } catch (e) { return false; }
    }

    /* ─────────────────────────────────────────
       RENDER ALL
    ───────────────────────────────────────── */
    function renderAll() {
        renderDashboard();
        renderItems();
        renderSpending();
        renderTimeline();
        renderAnalysis();
    }

    /* ── Dashboard ── */
    function renderDashboard() {
        const withPrice = data.filter(i => i.pricepaid && parseFloat(i.pricepaid) > 0);
        const withDate  = data.filter(i => i.invdate);
        const owned     = data.filter(i => i.own);
        const ownedP    = data.filter(i => i.own && i.pricepaid && parseFloat(i.pricepaid) > 0);
        const prevP     = data.filter(i => i.prevowned && i.pricepaid && parseFloat(i.pricepaid) > 0);

        const totalSpent   = withPrice.reduce((s, i) => s + parseFloat(i.pricepaid), 0);
        const ownedSpent   = ownedP.reduce((s, i) => s + parseFloat(i.pricepaid), 0);
        const prevSpent    = prevP.reduce((s, i) => s + parseFloat(i.pricepaid), 0);
        const avgPerGame   = withPrice.length > 0 ? totalSpent / withPrice.length : 0;

        document.getElementById('dashboard-inner').innerHTML = `
            <div class="metric-card primary">
                <div class="metric-label">Total Invested</div>
                <div class="metric-value">$${fmt(totalSpent)}</div>
                <div class="metric-detail">${withPrice.length} games with price · ${withDate.length} inventoried</div>
            </div>
            <div class="grid-2">
                <div class="metric-card secondary">
                    <div class="metric-label">Still Owned</div>
                    <div class="metric-value">$${fmt(ownedSpent)}</div>
                    <div class="metric-detail">${owned.length} games in collection</div>
                </div>
                <div class="metric-card rose">
                    <div class="metric-label">Sold / Traded</div>
                    <div class="metric-value">$${fmt(prevSpent)}</div>
                    <div class="metric-detail">${prevP.length} games divested</div>
                </div>
            </div>
            <div class="grid-2">
                <div class="metric-card tertiary">
                    <div class="metric-label">Avg Per Game</div>
                    <div class="metric-value">$${avgPerGame.toFixed(2)}</div>
                    <div class="metric-detail">across priced games</div>
                </div>
                <div class="metric-card green">
                    <div class="metric-label">Games Owned</div>
                    <div class="metric-value">${owned.length}</div>
                    <div class="metric-detail">${ownedP.length} with recorded price</div>
                </div>
            </div>
        `;
    }

    /* ── Items ── */
    function renderItems() {
        const list    = document.getElementById('items-list');
        const items   = filterSortItems();
        if (!items.length) { list.innerHTML = '<div class="empty">No games found</div>'; return; }

        list.innerHTML = items.map((item, idx) => {
            const thumb = gameThumbnails.get(item.objectid) || item.image;
            const price = item.pricepaid ? `$${parseFloat(item.pricepaid).toFixed(2)}` : '';
            return `
            <div class="item-card" onclick="showDetail(${idx})">
                <div class="item-thumb">
                    ${thumb ? `<img src="${thumb}" alt="" loading="lazy" />` : '🎲'}
                </div>
                <div class="item-info">
                    <div class="item-name">${esc(item.objectname)}</div>
                    <div class="item-meta">${item.invdate || 'No date'}${item.acquiredfrom ? ' · ' + esc(item.acquiredfrom) : ''}</div>
                    ${item.privatecomment ? `<div class="item-meta" style="color:var(--accent-2);font-size:11px;">💬 ${esc(item.privatecomment.substring(0,70))}${item.privatecomment.length>70?'…':''}</div>` : ''}
                    <div class="item-badges">
                        ${item.own      ? '<span class="badge own">Owned</span>' : ''}
                        ${item.prevowned ? '<span class="badge prevowned">Prev Owned</span>' : ''}
                    </div>
                </div>
                ${price ? `<div class="item-price">${price}</div>` : ''}
            </div>`;
        }).join('');
    }

    function filterSortItems() {
        const status = document.getElementById('filter-status')?.value || '';
        const sort   = document.getElementById('filter-sort')?.value || 'price-desc';
        const search = (document.getElementById('searchInput')?.value || '').toLowerCase();

        let filtered = data.filter(i => {
            if (status === 'own')       return i.own;
            if (status === 'prevowned') return i.prevowned;
            if (status === 'hasPrice')  return i.pricepaid && parseFloat(i.pricepaid) > 0;
            return true;
        });

        if (search) filtered = filtered.filter(i => i.objectname.toLowerCase().includes(search));

        filtered.sort((a, b) => {
            if (sort === 'price-desc')  return (parseFloat(b.pricepaid)||0) - (parseFloat(a.pricepaid)||0);
            if (sort === 'price-asc')   return (parseFloat(a.pricepaid)||0) - (parseFloat(b.pricepaid)||0);
            if (sort === 'date-newest') return new Date(b.invdate||0) - new Date(a.invdate||0);
            if (sort === 'date-oldest') return new Date(a.invdate||0) - new Date(b.invdate||0);
            if (sort === 'name')        return a.objectname.localeCompare(b.objectname);
            return 0;
        });
        return filtered;
    }

    /* ── Spending ── */
    function renderSpending() {
        const months={}, quantities={}, quarters={}, quarterQty={}, years={}, yearQty={};

        data.forEach(item => {
            if (!item.invdate) return;
            const y  = item.invdate.substring(0,4);
            const m  = item.invdate.substring(0,7);
            const mn = parseInt(item.invdate.substring(5,7));
            const q  = `${y}-Q${Math.ceil(mn/3)}`;
            const p  = parseFloat(item.pricepaid) || 0;
            const qty = item.quantity || 1;
            months[m]    = (months[m]    || 0) + p;
            quantities[m]= (quantities[m]|| 0) + qty;
            quarters[q]  = (quarters[q]  || 0) + p;
            quarterQty[q]= (quarterQty[q]|| 0) + qty;
            years[y]     = (years[y]     || 0) + p;
            yearQty[y]   = (yearQty[y]   || 0) + qty;
        });

        const last12keys = Object.keys(months).sort().reverse().slice(0,12);
        const m12={}, q12={};
        last12keys.forEach(k => { m12[k]=months[k]; q12[k]=quantities[k]; });

        function barHTML(obj, prefix, grad) {
            const max = Math.max(...Object.values(obj), 1);
            return Object.keys(obj).sort().reverse().map(k => {
                const v = obj[k];
                const pct = (v/max)*100;
                return `<div class="bar-item">
                    <div class="bar-label">${k}</div>
                    <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${grad}"></div></div>
                    <div class="bar-val">${prefix === '$' ? '$'+Math.round(v) : v}</div>
                </div>`;
            }).join('');
        }

        const purp = 'linear-gradient(90deg,#4c1d95,#7c3aed)';
        const blue = 'linear-gradient(90deg,#0ea5e9,#38bdf8)';
        const pink = 'linear-gradient(90deg,#db2777,#f472b6)';
        const gold = 'linear-gradient(90deg,#f59e0b,#fbbf24)';
        const grn  = 'linear-gradient(90deg,#059669,#34d399)';
        const teal = 'linear-gradient(90deg,#0d9488,#2dd4bf)';

        // Acquired From
        const srcSpend={}, srcQty={};
        data.forEach(i => {
            if (!i.acquiredfrom) return;
            const s = i.acquiredfrom.trim();
            srcSpend[s] = (srcSpend[s]||0) + (parseFloat(i.pricepaid)||0);
            srcQty[s]   = (srcQty[s]  ||0) + (i.quantity||1);
        });

        let html = `
            <div class="section-title">Monthly Spending (Last 12)</div>
            <div class="chart-wrap"><div class="bar-chart">${barHTML(m12,'$',purp)}</div></div>

            <div class="section-title">Games Acquired / Month</div>
            <div class="chart-wrap"><div class="bar-chart">${barHTML(q12,'',blue)}</div></div>

            <div class="section-title">Quarterly Spending</div>
            <div class="chart-wrap"><div class="bar-chart">${barHTML(quarters,'$',pink)}</div></div>

            <div class="section-title">Games Acquired / Quarter</div>
            <div class="chart-wrap"><div class="bar-chart">${barHTML(quarterQty,'',gold)}</div></div>

            <div class="section-title">Yearly Spending</div>
            <div class="chart-wrap"><div class="bar-chart">${barHTML(years,'$',grn)}</div></div>

            <div class="section-title">Games Acquired / Year</div>
            <div class="chart-wrap"><div class="bar-chart">${barHTML(yearQty,'',teal)}</div></div>
        `;

        if (Object.keys(srcSpend).length) {
            const sorted = Object.keys(srcSpend).sort((a,b)=>srcSpend[b]-srcSpend[a]);
            const maxS = Math.max(...Object.values(srcSpend),1);
            html += `<div class="section-title">Spending by Source</div>
            <div class="chart-wrap"><div class="bar-chart">
                ${sorted.map(s => `<div class="bar-item">
                    <div class="bar-label" style="min-width:100px">${esc(s)}</div>
                    <div class="bar-track"><div class="bar-fill" style="width:${(srcSpend[s]/maxS)*100}%;background:${purp}"></div></div>
                    <div class="bar-val" style="min-width:80px">$${Math.round(srcSpend[s])} (${srcQty[s]})</div>
                </div>`).join('')}
            </div></div>`;
        }

        document.getElementById('spending-inner').innerHTML = html;
    }

    /* ── Timeline ── */
    function renderTimeline() {
        const sorted = [...data].filter(i => i.invdate).sort((a,b) => new Date(b.invdate)-new Date(a.invdate));
        if (!sorted.length) {
            document.getElementById('timeline-inner').innerHTML = '<div class="empty">No inventory dates</div>';
            return;
        }
        const html = `<div class="section-title">Recent Acquisitions</div>
        <div class="item-list">
        ${sorted.slice(0,60).map(item => {
            const thumb = gameThumbnails.get(item.objectid) || item.image;
            return `<div class="item-card" onclick="showDetailById('${item.objectid}')">
                <div class="item-thumb">${thumb ? `<img src="${thumb}" alt="" loading="lazy"/>` : '📅'}</div>
                <div class="item-info">
                    <div class="item-name">${esc(item.objectname)}</div>
                    <div class="item-meta">${item.invdate} · ${item.own ? 'Owned' : item.prevowned ? 'Prev Owned' : ''}</div>
                    ${item.pricepaid ? `<div class="item-meta">$${parseFloat(item.pricepaid).toFixed(2)}</div>` : ''}
                </div>
            </div>`;
        }).join('')}</div>`;
        document.getElementById('timeline-inner').innerHTML = html;
    }

    /* ── Analysis ── */
    function renderAnalysis() {
        const allOwned    = data.filter(i => i.own);
        const ownedP      = allOwned.filter(i => parseFloat(i.pricepaid||0) > 0);
        const prevP       = data.filter(i => i.prevowned && parseFloat(i.pricepaid||0) > 0);

        const ownedTotal  = allOwned.reduce((s,i) => s + parseFloat(i.pricepaid||0), 0);
        const avgAllOwned = allOwned.length ? ownedTotal / allOwned.length : 0;
        const avgPriced   = ownedP.length   ? ownedP.reduce((s,i)=>s+parseFloat(i.pricepaid),0)/ownedP.length : 0;
        const avgPrev     = prevP.length    ? prevP.reduce((s,i)=>s+parseFloat(i.pricepaid),0)/prevP.length : 0;
        const retention   = (ownedP.length+prevP.length) > 0 ? (ownedP.length/(ownedP.length+prevP.length)*100).toFixed(1) : '0.0';

        document.getElementById('analysis-inner').innerHTML = `
            <div class="metric-card primary">
                <div class="metric-label">Collection Retention</div>
                <div class="metric-value">${retention}%</div>
                <div class="metric-detail">Games kept vs. sold/traded</div>
            </div>
            <div class="grid-3">
                <div class="metric-card secondary">
                    <div class="metric-label">Avg Owned (all)</div>
                    <div class="metric-value">$${avgAllOwned.toFixed(2)}</div>
                    <div class="metric-detail">${allOwned.length} games incl $0</div>
                </div>
                <div class="metric-card secondary">
                    <div class="metric-label">Avg Owned (priced)</div>
                    <div class="metric-value">$${avgPriced.toFixed(2)}</div>
                    <div class="metric-detail">${ownedP.length} with price</div>
                </div>
                <div class="metric-card rose">
                    <div class="metric-label">Avg Sold Price</div>
                    <div class="metric-value">$${avgPrev.toFixed(2)}</div>
                    <div class="metric-detail">${prevP.length} sold</div>
                </div>
            </div>
            <div class="grid-2">
                <div class="metric-card tertiary">
                    <div class="metric-label">No Price Recorded</div>
                    <div class="metric-value">${allOwned.length - ownedP.length}</div>
                    <div class="metric-detail">of ${allOwned.length} owned</div>
                </div>
                <div class="metric-card green">
                    <div class="metric-label">Total Invested (owned)</div>
                    <div class="metric-value">$${fmt(ownedTotal)}</div>
                    <div class="metric-detail">active collection value</div>
                </div>
            </div>
            <div class="section-title">Key Insights</div>
            <div class="insight-card">
                <p>💰 <strong>$${fmt(ownedP.reduce((s,i)=>s+parseFloat(i.pricepaid),0))}</strong> invested in games you still own</p>
                <p>📤 <strong>$${fmt(prevP.reduce((s,i)=>s+parseFloat(i.pricepaid),0))}</strong> divested (sold/traded)</p>
                <p>📊 <strong>${ownedP.length}</strong> keepers vs <strong>${prevP.length}</strong> released</p>
                <p>💵 Overall avg cost: <strong>$${((ownedP.reduce((s,i)=>s+parseFloat(i.pricepaid),0)+prevP.reduce((s,i)=>s+parseFloat(i.pricepaid),0))/((ownedP.length+prevP.length)||1)).toFixed(2)}</strong> per game</p>
            </div>
        `;
    }

    /* ─────────────────────────────────────────
       DETAIL MODAL
    ───────────────────────────────────────── */
    function showDetailById(oid) {
        const item = data.find(i => i.objectid === oid);
        if (item) openModal(item);
    }
    function showDetail(idx) {
        const item = filterSortItems()[idx];
        if (item) openModal(item);
    }
    function openModal(item) {
        const thumb = gameThumbnails.get(item.objectid) || item.image;
        document.getElementById('modal-title').textContent = item.objectname;
        document.getElementById('modal-image').innerHTML = thumb
            ? `<img src="${thumb}" alt="${esc(item.objectname)}">`
            : '<span style="font-size:48px">🎲</span>';

        document.getElementById('modal-details').innerHTML = `
            <div class="detail-group">
                <div class="detail-group-title">Acquisition</div>
                <div class="detail-row"><span class="detail-key">Date</span><span class="detail-val">${item.invdate||'Not recorded'}</span></div>
                <div class="detail-row"><span class="detail-key">Price Paid</span><span class="detail-val">${item.pricepaid?'$'+parseFloat(item.pricepaid).toFixed(2):'Not recorded'}</span></div>
                <div class="detail-row"><span class="detail-key">Quantity</span><span class="detail-val">${item.quantity||1}</span></div>
                ${item.acquiredfrom?`<div class="detail-row"><span class="detail-key">Acquired From</span><span class="detail-val">${esc(item.acquiredfrom)}</span></div>`:''}
                ${item.privatecomment?`<div class="detail-row"><span class="detail-key">Notes</span><span class="detail-val">${esc(item.privatecomment)}</span></div>`:''}
                <div class="detail-row"><span class="detail-key">Status</span><span class="detail-val">${[item.own?'✓ Owned':'',item.prevowned?'✓ Prev Owned':''].filter(Boolean).join(' ')}</span></div>
            </div>
            <div class="detail-group">
                <div class="detail-group-title">Game Info</div>
                <div class="detail-row"><span class="detail-key">Year</span><span class="detail-val">${item.yearpublished||'N/A'}</span></div>
                <div class="detail-row"><span class="detail-key">Players</span><span class="detail-val">${item.minplayers}${item.maxplayers?'–'+item.maxplayers:''}</span></div>
                <div class="detail-row"><span class="detail-key">BGG Rating</span><span class="detail-val">${(item.average||0).toFixed(2)}</span></div>
                <div class="detail-row"><span class="detail-key">Plays</span><span class="detail-val">${item.numplays}</span></div>
            </div>
            <div class="detail-group">
                <a href="https://boardgamegeek.com/thing/${item.objectid}" target="_blank"
                   style="color:var(--accent);text-decoration:none;font-weight:700;font-size:13px;">
                    View on BoardGameGeek →
                </a>
            </div>
        `;
        document.getElementById('detail-modal').classList.add('open');
    }
    function closeModal() {
        document.getElementById('detail-modal').classList.remove('open');
    }
    document.getElementById('detail-modal').addEventListener('click', e => {
        if (e.target.id === 'detail-modal') closeModal();
    });

    /* ─────────────────────────────────────────
       TABS
    ───────────────────────────────────────── */
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
            if (btn.dataset.tab === 'items') renderItems();
        });
    });

    /* ─────────────────────────────────────────
       CSV IMPORT
    ───────────────────────────────────────── */
    async function importCSV() {
        const fileInput = document.getElementById('csvFileInput');
        const statusEl  = document.getElementById('importStatus');
        if (!fileInput.files[0]) { statusEl.textContent = '❌ Select a CSV file first.'; return; }

        const reader = new FileReader();
        reader.onload = async e => {
            try {
                data = parseCSV(e.target.result);
                statusEl.textContent = `✅ Imported ${data.length} games. Fetching artwork…`;
                renderAll();
                switchTab('dashboard');

                setStatus(`Loading artwork for ${data.length} games…`);
                setProgress(10);
                await loadThingImages();
                setProgress(100);
                setStatus('');
                saveLocal();
                renderItems();
                statusEl.textContent = `✅ Done! ${data.length} games loaded.`;
                setTimeout(() => setProgress(0), 800);
            } catch (err) {
                statusEl.textContent = '❌ ' + err.message;
                console.error(err);
            }
        };
        reader.readAsText(fileInput.files[0]);
    }

    function parseCSV(csvText) {
        const lines   = csvText.trim().split('\n');
        const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g,'').toLowerCase());
        const results = [];

        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const regex = /"([^"]*)"|([^,]+)/g;
            const fields = [];
            let m;
            while ((m = regex.exec(lines[i])) !== null) {
                fields.push(m[1] !== undefined ? m[1] : (m[2]||'').trim());
            }
            const row = {};
            headers.forEach((h, idx) => { row[h] = fields[idx] || ''; });

            const item = {
                objectid:       row['objectid'] || row['object id'] || '',
                objectname:     row['objectname'] || row['name'] || '',
                pricepaid:      row['pricepaid'] || row['price paid'] || '',
                invdate:        row['invdate'] || row['acquisition date'] || '',
                acquiredfrom:   row['acquiredfrom'] || row['acquired from'] || '',
                privatecomment: row['privatecomment'] || row['private comments'] || '',
                quantity:       parseInt(row['quantity'] || '1') || 1,
                own:            (row['own'] || row['owned'] || '0') === '1',
                prevowned:      (row['prevowned'] || row['preowned'] || '0') === '1',
                yearpublished:  row['yearpublished'] || row['year published'] || '',
                average:        parseFloat(row['average'] || row['bgg_rating'] || '0') || 0,
                image:          row['thumbnail'] || row['image'] || '',
                numplays:       row['numplays'] || row['plays'] || '0',
                minplayers:     row['minplayers'] || row['min players'] || '',
                maxplayers:     row['maxplayers'] || row['max players'] || '',
            };
            if (item.objectname && (item.pricepaid || item.invdate)) results.push(item);
        }
        return results;
    }

    /* ─────────────────────────────────────────
       UTILS
    ───────────────────────────────────────── */
    function fmt(n)  { return n.toFixed(2); }
    function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
    function esc(s)  { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function switchTab(name) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.id === 'tab-' + name));
    }

    /* ─────────────────────────────────────────
       INIT
    ───────────────────────────────────────── */
    if (loadLocal()) {
        renderAll();
    }
</script>
