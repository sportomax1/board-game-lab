<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory - Spending & Collection Analytics</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>📦</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            padding: 12px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .header p {
            font-size: 13px;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            overflow-x: auto;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            white-space: nowrap;
            min-width: 80px;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }

        .tab-content {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .tab-content.active {
            display: block;
        }

        .metric-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .metric-card.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .metric-card.secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .metric-card.tertiary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .metric-label {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 4px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .metric-detail {
            font-size: 11px;
            opacity: 0.7;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .grid-2 .metric-card {
            margin-bottom: 0;
        }

        .item-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-card {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .item-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
            transform: translateY(-2px);
        }

        .item-thumbnail {
            width: 50px;
            height: 50px;
            background: #e9ecef;
            border-radius: 4px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            overflow: hidden;
        }

        .item-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-info {
            flex: 1;
        }

        .item-name {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .item-meta {
            font-size: 12px;
            color: #666;
            margin-bottom: 2px;
        }

        .item-badges {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .badge {
            display: inline-block;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 600;
            white-space: nowrap;
        }

        .badge.own {
            background: #d4edda;
            color: #155724;
        }

        .badge.prevowned {
            background: #fff3cd;
            color: #856404;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-body {
            padding: 16px;
        }

        .detail-section {
            margin-bottom: 16px;
        }

        .detail-section h3 {
            font-size: 13px;
            font-weight: 700;
            color: #667eea;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #666;
            font-weight: 500;
        }

        .detail-value {
            color: #333;
            font-weight: 600;
        }

        .image-container {
            width: 100%;
            height: 200px;
            background: #e9ecef;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .spinner {
            border: 3px solid #f0f0f0;
            border-top-color: #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .filter-group {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .filter-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .filter-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #e9ecef;
            border-radius: 4px;
            font-size: 13px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .chart-container {
            background: white;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #e9ecef;
        }

        .bar-chart {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .bar-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bar-label {
            font-size: 11px;
            font-weight: 600;
            color: #666;
            min-width: 60px;
        }

        .bar-container {
            flex: 1;
            background: #f0f0f0;
            height: 20px;
            border-radius: 4px;
            overflow: hidden;
        }

        .bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }

        .bar-value {
            font-size: 11px;
            font-weight: 700;
            color: #333;
            min-width: 30px;
            text-align: right;
        }
    </style>
</head>
<body>
    <div id="passwordScreen" style="position: fixed; inset: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 12px;">
        <div style="background: white; border-radius: 16px; max-width: 500px; width: 100%; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); overflow: hidden;">
            <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; text-align: center;">
                <h2 style="font-size: 24px; font-weight: 700; margin: 0;">🔐 Inventory</h2>
                <p style="font-size: 13px; opacity: 0.9; margin: 4px 0 0 0;">Password Protected</p>
            </div>
            <div style="padding: 20px;">
                <label style="display: block; font-size: 12px; font-weight: 600; color: #667eea; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">Password</label>
                <input type="password" id="appPassword" style="width: 100%; padding: 12px; border: 1px solid #e9ecef; border-radius: 8px; font-size: 14px; font-family: inherit; margin-bottom: 16px;" placeholder="Enter password">
                <button onclick="unlockApp()" style="width: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 14px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; font-family: inherit;">Unlock</button>
                <p id="passwordError" style="color: #f56565; font-size: 12px; margin-top: 12px; display: none;">❌ Incorrect password</p>
            </div>
        </div>
    </div>

    <div class="container" id="appContainer" style="display: none;">
        <div class="header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>📊 Inventory</h1>
                    <p>Spending & Collection Analytics</p>
                </div>
                <button onclick="lockApp()" style="background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;">Lock</button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
            <button class="tab-btn" data-tab="items">Items</button>
            <button class="tab-btn" data-tab="spending">Spending</button>
            <button class="tab-btn" data-tab="timeline">Timeline</button>
            <button class="tab-btn" data-tab="analysis">Analysis</button>
            <button class="tab-btn" data-tab="import">📥 Import CSV</button>
        </div>

        <div class="tab-content active" id="dashboard">
            <div id="dashboard-content"></div>
        </div>

        <div class="tab-content" id="items">
            <div class="filter-group">
                <label>Status</label>
                <select id="filter-status">
                    <option value="">All Items</option>
                    <option value="own">Currently Own</option>
                    <option value="prevowned">Sold/Traded</option>
                    <option value="hasPrice">With Price Paid</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Sort By</label>
                <select id="filter-sort">
                    <option value="price-desc">Price: High to Low</option>
                    <option value="price-asc">Price: Low to High</option>
                    <option value="date-newest">Date: Newest</option>
                    <option value="date-oldest">Date: Oldest</option>
                    <option value="name">Name A-Z</option>
                </select>
            </div>
            <div id="items-list" class="item-list"></div>
        </div>

        <div class="tab-content" id="spending">
            <div id="spending-content"></div>
        </div>

        <div class="tab-content" id="timeline">
            <div id="timeline-content"></div>
        </div>

        <div class="tab-content" id="analysis">
            <div id="analysis-content"></div>
        </div>

        <div class="tab-content" id="import">
            <div style="text-align:center;padding:20px;">
                <p style="font-size:13px;color:#666;margin-bottom:16px;">Download your BGG collection CSV and upload it here.</p>
                <div style="margin-bottom:16px;">
                    <a href="https://boardgamegeek.com/geekcollection.php?action=exportcsv&subtype=boardgame&username=sportomax&all=1" target="_blank" style="display:inline-block;background:#667eea;color:white;padding:10px 16px;border-radius:8px;text-decoration:none;font-weight:600;font-size:12px;">📥 Download CSV from BGG</a>
                </div>
                <input type="file" id="csvFileInput" accept=".csv" style="margin-bottom:16px;display:block;width:100%;" />
                <button onclick="importCSV()" style="width:100%;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:12px;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px;">Import CSV</button>
                <div id="importStatus" style="margin-top:12px;font-size:12px;color:#666;"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="detail-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title"></h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="image-container" id="modal-image">
                    <div class="spinner"></div>
                </div>
                <div id="modal-details"></div>
            </div>
        </div>
    </div>

    <script>
        let data = [];

        async function loadData() {
            try {
                const response = await fetch('private_all.xml');
                const xml = await response.text();
                parseXml(xml);
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('dashboard-content').innerHTML = '<div class="empty-state"><p>Failed to load collection data</p></div>';
            }
        }

        function parseXml(xmlString) {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlString, 'text/xml');
            const items = xmlDoc.getElementsByTagName('item');

            data = Array.from(items).map(item => ({
                objectid: item.getElementsByTagName('objectid')[0]?.textContent || '',
                objectname: item.getElementsByTagName('objectname')[0]?.textContent || '',
                pricepaid: item.getElementsByTagName('pricepaid')[0]?.textContent || '',
                invdate: item.getElementsByTagName('invdate')[0]?.textContent || '',
                acquiredfrom: item.getElementsByTagName('acquiredfrom')[0]?.textContent || '',
                privatecomment: item.getElementsByTagName('privatecomment')[0]?.textContent || '',
                quantity: parseInt(item.getElementsByTagName('quantity')[0]?.textContent || 1) || 1,
                own: item.getElementsByTagName('own')[0]?.textContent === '1',
                prevowned: item.getElementsByTagName('prevowned')[0]?.textContent === '1',
                yearpublished: item.getElementsByTagName('yearpublished')[0]?.textContent || '',
                average: parseFloat(item.getElementsByTagName('average')[0]?.textContent || 0),
                image: item.getElementsByTagName('image')[0]?.textContent || '',
                numplays: item.getElementsByTagName('numplays')[0]?.textContent || '0',
                minplayers: item.getElementsByTagName('minplayers')[0]?.textContent || '',
                maxplayers: item.getElementsByTagName('maxplayers')[0]?.textContent || '',
            })).filter(item => item.pricepaid || item.invdate);

            renderDashboard();
            renderItems();
            renderSpending();
            renderTimeline();
            renderAnalysis();
        }

        function renderDashboard() {
            const withPrice = data.filter(i => i.pricepaid);
            const withDate = data.filter(i => i.invdate);
            const ownedWithPrice = data.filter(i => i.own && i.pricepaid);
            const prevownedWithPrice = data.filter(i => i.prevowned && i.pricepaid);

            const totalSpent = withPrice.reduce((sum, i) => sum + (parseFloat(i.pricepaid) || 0), 0);
            const ownedSpent = ownedWithPrice.reduce((sum, i) => sum + (parseFloat(i.pricepaid) || 0), 0);
            const prevownedSpent = prevownedWithPrice.reduce((sum, i) => sum + (parseFloat(i.pricepaid) || 0), 0);

            const html = `
                <div class="metric-card primary">
                    <div class="metric-label">Total Invested</div>
                    <div class="metric-value">$${totalSpent.toFixed(2)}</div>
                    <div class="metric-detail">${withPrice.length} items with prices</div>
                </div>

                <div class="grid-2">
                    <div class="metric-card secondary">
                        <div class="metric-label">Still Owned</div>
                        <div class="metric-value">$${ownedSpent.toFixed(2)}</div>
                        <div class="metric-detail">${ownedWithPrice.length} games</div>
                    </div>
                    <div class="metric-card tertiary">
                        <div class="metric-label">Sold/Traded</div>
                        <div class="metric-value">$${prevownedSpent.toFixed(2)}</div>
                        <div class="metric-detail">${prevownedWithPrice.length} games</div>
                    </div>
                </div>

                <div class="metric-card" style="background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%); color: white;">
                    <div class="metric-label">Average Price/Game</div>
                    <div class="metric-value">$${(totalSpent / withPrice.length).toFixed(2)}</div>
                    <div class="metric-detail">${withDate.length} items inventoried</div>
                </div>

                <div class="metric-card" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); color: white;">
                    <div class="metric-label">Collection Count</div>
                    <div class="metric-value">${ownedWithPrice.length}</div>
                    <div class="metric-detail">games still owned</div>
                </div>
            `;

            document.getElementById('dashboard-content').innerHTML = html;
        }

        function renderItems() {
            const list = document.getElementById('items-list');
            const filteredData = filterAndSortItems();

            if (filteredData.length === 0) {
                list.innerHTML = '<div class="empty-state"><p>No items found</p></div>';
                return;
            }

            list.innerHTML = filteredData.map((item, idx) => `
                <div class="item-card" onclick="showDetail(${idx})">
                    <div class="item-thumbnail">🎲</div>
                    <div class="item-info">
                        <div class="item-name">${item.objectname}</div>
                        <div class="item-meta">${item.pricepaid ? `$${item.pricepaid}` : 'No price'}</div>
                        <div class="item-meta">${item.invdate || 'No date'}</div>
                        ${item.acquiredfrom ? `<div class="item-meta" style="color: #667eea; font-weight: 500;">📍 ${item.acquiredfrom}</div>` : ''}
                        ${item.privatecomment ? `<div class="item-meta" style="color: #f5576c; font-size: 11px; font-style: italic;">💬 ${item.privatecomment.substring(0, 60)}${item.privatecomment.length > 60 ? '...' : ''}</div>` : ''}
                        <div class="item-badges">
                            ${item.own ? '<span class="badge own">Owned</span>' : ''}
                            ${item.prevowned ? '<span class="badge prevowned">Prev Owned</span>' : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterAndSortItems() {
            const status = document.getElementById('filter-status')?.value || '';
            const sort = document.getElementById('filter-sort')?.value || 'price-desc';

            let filtered = [...data];

            if (status === 'own') filtered = filtered.filter(i => i.own);
            else if (status === 'prevowned') filtered = filtered.filter(i => i.prevowned);
            else if (status === 'hasPrice') filtered = filtered.filter(i => i.pricepaid);

            filtered.sort((a, b) => {
                switch (sort) {
                    case 'price-desc': return (parseFloat(b.pricepaid) || 0) - (parseFloat(a.pricepaid) || 0);
                    case 'price-asc': return (parseFloat(a.pricepaid) || 0) - (parseFloat(b.pricepaid) || 0);
                    case 'date-newest': return new Date(b.invdate) - new Date(a.invdate);
                    case 'date-oldest': return new Date(a.invdate) - new Date(b.invdate);
                    case 'name': return a.objectname.localeCompare(b.objectname);
                    default: return 0;
                }
            });

            return filtered;
        }

        function renderSpending() {
            const months = {};
            const quantities = {};
            const quarters = {};
            const quarterQuantities = {};
            const years = {};
            const yearQuantities = {};
            
            data.forEach(item => {
                if (item.invdate) {
                    const month = item.invdate.substring(0, 7);
                    const year = item.invdate.substring(0, 4);
                    const monthNum = parseInt(item.invdate.substring(5, 7));
                    const quarter = `${year}-Q${Math.ceil(monthNum / 3)}`;
                    
                    if (!months[month]) months[month] = 0;
                    if (!quantities[month]) quantities[month] = 0;
                    if (!quarters[quarter]) quarters[quarter] = 0;
                    if (!quarterQuantities[quarter]) quarterQuantities[quarter] = 0;
                    if (!years[year]) years[year] = 0;
                    if (!yearQuantities[year]) yearQuantities[year] = 0;
                    
                    const price = parseFloat(item.pricepaid) || 0;
                    const qty = item.quantity || 1;
                    
                    months[month] += price;
                    quantities[month] += qty;
                    quarters[quarter] += price;
                    quarterQuantities[quarter] += qty;
                    years[year] += price;
                    yearQuantities[year] += qty;
                }
            });

            const sortedMonths = Object.keys(months).sort().reverse().slice(0, 12);
            const maxSpend = Math.max(...Object.values(months));
            const maxQty = Math.max(...Object.values(quantities));

            let html = '<h3 style="margin-bottom: 12px;">Monthly Spending (Last 12 Months)</h3>';
            html += '<div class="chart-container"><div class="bar-chart">';

            sortedMonths.forEach(month => {
                const spend = months[month];
                const percent = (spend / maxSpend) * 100;
                html += `
                    <div class="bar-item">
                        <div class="bar-label">${month}</div>
                        <div class="bar-container">
                            <div class="bar" style="width: ${percent}%"></div>
                        </div>
                        <div class="bar-value">$${spend.toFixed(0)}</div>
                    </div>
                `;
            });

            html += '</div></div>';

            html += '<h3 style="margin-bottom: 12px; margin-top: 16px;">Games Acquired Per Month</h3>';
            html += '<div class="chart-container"><div class="bar-chart">';

            sortedMonths.forEach(month => {
                const qty = quantities[month];
                const percent = (qty / maxQty) * 100;
                html += `
                    <div class="bar-item">
                        <div class="bar-label">${month}</div>
                        <div class="bar-container">
                            <div class="bar" style="width: ${percent}%; background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);"></div>
                        </div>
                        <div class="bar-value">${qty}</div>
                    </div>
                `;
            });

            html += '</div></div>';

            // Quarterly Spending
            const sortedQuarters = Object.keys(quarters).sort().reverse();
            const maxQuarterSpend = Math.max(...Object.values(quarters));
            const maxQuarterQty = Math.max(...Object.values(quarterQuantities));

            html += '<h3 style="margin-bottom: 12px; margin-top: 24px;">Quarterly Spending</h3>';
            html += '<div class="chart-container"><div class="bar-chart">';

            sortedQuarters.forEach(quarter => {
                const spend = quarters[quarter];
                const percent = (spend / maxQuarterSpend) * 100;
                html += `
                    <div class="bar-item">
                        <div class="bar-label">${quarter}</div>
                        <div class="bar-container">
                            <div class="bar" style="width: ${percent}%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);"></div>
                        </div>
                        <div class="bar-value">$${spend.toFixed(0)}</div>
                    </div>
                `;
            });

            html += '</div></div>';

            html += '<h3 style="margin-bottom: 12px; margin-top: 16px;">Games Acquired Per Quarter</h3>';
            html += '<div class="chart-container"><div class="bar-chart">';

            sortedQuarters.forEach(quarter => {
                const qty = quarterQuantities[quarter];
                const percent = (qty / maxQuarterQty) * 100;
                html += `
                    <div class="bar-item">
                        <div class="bar-label">${quarter}</div>
                        <div class="bar-container">
                            <div class="bar" style="width: ${percent}%; background: linear-gradient(90deg, #fa709a 0%, #fee140 100%);"></div>
                        </div>
                        <div class="bar-value">${qty}</div>
                    </div>
                `;
            });

            html += '</div></div>';

            // Yearly Spending
            const sortedYears = Object.keys(years).sort().reverse();
            const maxYearSpend = Math.max(...Object.values(years));
            const maxYearQty = Math.max(...Object.values(yearQuantities));

            html += '<h3 style="margin-bottom: 12px; margin-top: 24px;">Yearly Spending</h3>';
            html += '<div class="chart-container"><div class="bar-chart">';

            sortedYears.forEach(year => {
                const spend = years[year];
                const percent = (spend / maxYearSpend) * 100;
                html += `
                    <div class="bar-item">
                        <div class="bar-label">${year}</div>
                        <div class="bar-container">
                            <div class="bar" style="width: ${percent}%; background: linear-gradient(90deg, #84fab0 0%, #8fd3f4 100%);"></div>
                        </div>
                        <div class="bar-value">$${spend.toFixed(0)}</div>
                    </div>
                `;
            });

            html += '</div></div>';

            html += '<h3 style="margin-bottom: 12px; margin-top: 16px;">Games Acquired Per Year</h3>';
            html += '<div class="chart-container"><div class="bar-chart">';

            sortedYears.forEach(year => {
                const qty = yearQuantities[year];
                const percent = (qty / maxYearQty) * 100;
                html += `
                    <div class="bar-item">
                        <div class="bar-label">${year}</div>
                        <div class="bar-container">
                            <div class="bar" style="width: ${percent}%; background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);"></div>
                        </div>
                        <div class="bar-value">${qty}</div>
                    </div>
                `;
            });

            html += '</div></div>';

            // Acquired From Analysis
            const acquiredFrom = {};
            const acquiredFromQuantities = {};
            
            data.forEach(item => {
                if (item.acquiredfrom) {
                    const source = item.acquiredfrom.trim();
                    if (!acquiredFrom[source]) acquiredFrom[source] = 0;
                    if (!acquiredFromQuantities[source]) acquiredFromQuantities[source] = 0;
                    acquiredFrom[source] += parseFloat(item.pricepaid) || 0;
                    acquiredFromQuantities[source] += item.quantity || 1;
                }
            });

            const sortedSources = Object.keys(acquiredFrom).sort((a, b) => acquiredFrom[b] - acquiredFrom[a]);
            const maxSourceSpend = Math.max(...Object.values(acquiredFrom));

            if (sortedSources.length) {
                html += '<h3 style="margin-bottom: 12px; margin-top: 24px;">Spending by Acquisition Source</h3>';
                html += '<div class="chart-container"><div class="bar-chart">';

                sortedSources.forEach(source => {
                    const spend = acquiredFrom[source];
                    const qty = acquiredFromQuantities[source];
                    const percent = (spend / maxSourceSpend) * 100;
                    html += `
                        <div class="bar-item">
                            <div class="bar-label" style="min-width: 100px;">${source}</div>
                            <div class="bar-container">
                                <div class="bar" style="width: ${percent}%; background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);"></div>
                            </div>
                            <div class="bar-value" style="min-width: 70px;">$${spend.toFixed(0)} (${qty})</div>
                        </div>
                    `;
                });

                html += '</div></div>';
            }

            document.getElementById('spending-content').innerHTML = html;
        }

        function renderTimeline() {
            const sorted = [...data].filter(i => i.invdate).sort((a, b) => new Date(b.invdate) - new Date(a.invdate));

            let html = '<h3 style="margin-bottom: 12px;">Recent Acquisitions</h3>';

            if (sorted.length === 0) {
                html += '<div class="empty-state"><p>No inventory dates found</p></div>';
                document.getElementById('timeline-content').innerHTML = html;
                return;
            }

            html += '<div class="item-list">';
            sorted.slice(0, 50).forEach(item => {
                const status = item.own ? 'Owned' : item.prevowned ? 'Prev Owned' : 'Unknown';
                html += `
                    <div class="item-card" onclick="showDetailById('${item.objectid}')">
                        <div class="item-thumbnail">📅</div>
                        <div class="item-info">
                            <div class="item-name">${item.objectname}</div>
                            <div class="item-meta">${item.invdate} - ${status}</div>
                            <div class="item-meta">${item.pricepaid ? `$${item.pricepaid}` : 'No price'}</div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';

            document.getElementById('timeline-content').innerHTML = html;
        }

        function renderAnalysis() {
            const allOwnedData = data.filter(i => i.own);
            const ownedData = data.filter(i => i.own && i.pricepaid);
            const prevownedData = data.filter(i => i.prevowned && i.pricepaid);

            const ownedTotal = allOwnedData.reduce((sum, i) => sum + parseFloat(i.pricepaid || 0), 0);
            const ownedWithPrice = allOwnedData.filter(i => parseFloat(i.pricepaid || 0) > 0);
            const avgOwnedWithZeros = allOwnedData.length > 0 ? ownedTotal / allOwnedData.length : 0;
            const avgOwnedNoZeros = ownedWithPrice.length > 0 ? ownedWithPrice.reduce((sum, i) => sum + parseFloat(i.pricepaid), 0) / ownedWithPrice.length : 0;
            const avgPrevowned = prevownedData.length > 0 ? prevownedData.reduce((sum, i) => sum + parseFloat(i.pricepaid), 0) / prevownedData.length : 0;

            const html = `
                <div class="metric-card primary">
                    <div class="metric-label">Collection Retention</div>
                    <div class="metric-value">${((ownedData.length / (ownedData.length + prevownedData.length)) * 100).toFixed(1)}%</div>
                    <div class="metric-detail">Percentage of games kept vs sold</div>
                </div>

                <div class="grid-2">
                    <div class="metric-card secondary">
                        <div class="metric-label">Avg Owned Price (all)</div>
                        <div class="metric-value">$${avgOwnedWithZeros.toFixed(2)}</div>
                        <div class="metric-detail">${allOwnedData.length} games incl. $0</div>
                    </div>
                    <div class="metric-card secondary">
                        <div class="metric-label">Avg Owned Price (priced)</div>
                        <div class="metric-value">$${avgOwnedNoZeros.toFixed(2)}</div>
                        <div class="metric-detail">${ownedWithPrice.length} games with price</div>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="metric-card tertiary">
                        <div class="metric-label">Avg Sold Price</div>
                        <div class="metric-value">$${avgPrevowned.toFixed(2)}</div>
                    </div>
                    <div class="metric-card tertiary">
                        <div class="metric-label">Games w/o Price</div>
                        <div class="metric-value">${allOwnedData.length - ownedWithPrice.length}</div>
                        <div class="metric-detail">of ${allOwnedData.length} owned</div>
                    </div>
                </div>

                <h3 style="margin-bottom: 12px;">Key Insights</h3>
                <div class="metric-card" style="background: white; color: #333; border: 1px solid #e9ecef;">
                    <div style="font-size: 13px; line-height: 1.6;">
                        <p>💰 <strong>$${(ownedData.reduce((s, i) => s + parseFloat(i.pricepaid), 0)).toFixed(2)}</strong> invested in games you still own</p>
                        <p>📤 <strong>$${(prevownedData.reduce((s, i) => s + parseFloat(i.pricepaid), 0)).toFixed(2)}</strong> divested (games sold/traded)</p>
                        <p>📊 <strong>${ownedData.length}</strong> keepers vs <strong>${prevownedData.length}</strong> released</p>
                        <p>💵 Average cost: <strong>$${((ownedData.reduce((s, i) => s + parseFloat(i.pricepaid), 0) + prevownedData.reduce((s, i) => s + parseFloat(i.pricepaid), 0)) / (ownedData.length + prevownedData.length)).toFixed(2)}</strong> per game</p>
                    </div>
                </div>
            `;

            document.getElementById('analysis-content').innerHTML = html;
        }

        function showDetailById(objectid) {
            const item = data.find(i => i.objectid === objectid);
            if (item) {
                const idx = data.indexOf(item);
                showDetail(idx);
            }
        }

        function showDetail(idx) {
            const item = filterAndSortItems()[idx];
            if (!item) return;

            document.getElementById('modal-title').textContent = item.objectname;
            
            let imageHtml = '<div class="spinner"></div>';
            if (item.image) {
                imageHtml = `<img src="${item.image}" alt="${item.objectname}">`;
            }
            document.getElementById('modal-image').innerHTML = imageHtml;

            const detailsHtml = `
                <div class="detail-section">
                    <h3>Acquisition</h3>
                    <div class="detail-row">
                        <span class="detail-label">Date</span>
                        <span class="detail-value">${item.invdate || 'Not recorded'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Price Paid</span>
                        <span class="detail-value">${item.pricepaid ? '$' + item.pricepaid : 'Not recorded'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Quantity</span>
                        <span class="detail-value">${item.quantity || 1}</span>
                    </div>
                    ${item.acquiredfrom ? `
                    <div class="detail-row">
                        <span class="detail-label">Acquired From</span>
                        <span class="detail-value">${item.acquiredfrom}</span>
                    </div>
                    ` : ''}
                    ${item.privatecomment ? `
                    <div class="detail-row">
                        <span class="detail-label">Notes</span>
                        <span class="detail-value">${item.privatecomment}</span>
                    </div>
                    ` : ''}
                    <div class="detail-row">
                        <span class="detail-label">Status</span>
                        <span class="detail-value">
                            ${item.own ? '✓ Owned' : ''}
                            ${item.prevowned ? '✓ Previously Owned' : ''}
                        </span>
                    </div>
                </div>

                <div class="detail-section">
                    <h3>Game Info</h3>
                    <div class="detail-row">
                        <span class="detail-label">Year Published</span>
                        <span class="detail-value">${item.yearpublished || 'N/A'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Players</span>
                        <span class="detail-value">${item.minplayers}${item.maxplayers ? '-' + item.maxplayers : ''}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">BGG Rating</span>
                        <span class="detail-value">${(item.average || 0).toFixed(2)}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Plays</span>
                        <span class="detail-value">${item.numplays}</span>
                    </div>
                </div>

                <div class="detail-section">
                    <a href="https://boardgamegeek.com/thing/${item.objectid}" target="_blank" style="color: #667eea; text-decoration: none; font-weight: 600;">
                        View on BoardGameGeek →
                    </a>
                </div>
            `;

            document.getElementById('modal-details').innerHTML = detailsHtml;
            document.getElementById('detail-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.remove('active');
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.tab).classList.add('active');
                if (btn.dataset.tab === 'items') renderItems();
            });
        });

        document.getElementById('filter-status')?.addEventListener('change', renderItems);
        document.getElementById('filter-sort')?.addEventListener('change', renderItems);

        document.getElementById('detail-modal').addEventListener('click', (e) => {
            if (e.target.id === 'detail-modal') closeModal();
        });

        // Password Protection
        const SECRET_PASSWORD = null; // Will be fetched from API

        async function fetchSecret() {
            try {
                const response = await fetch('/api/get-password');
                return await response.text();
            } catch (error) {
                console.error('Error fetching password:', error);
                return '';
            }
        }

        function checkPassword() {
            const stored = localStorage.getItem('inventoryAuth');
            if (stored === 'true') {
                unlockUI();
                return true;
            }
            return false;
        }

        async function unlockApp() {
            const password = document.getElementById('appPassword').value;
            const errorEl = document.getElementById('passwordError');
            
            const correctPassword = await fetchSecret();
            
            if (password === correctPassword && correctPassword !== '') {
                localStorage.setItem('inventoryAuth', 'true');
                unlockUI();
            } else {
                errorEl.style.display = 'block';
                document.getElementById('appPassword').value = '';
            }
        }

        function unlockUI() {
            document.getElementById('passwordScreen').style.display = 'none';
            document.getElementById('appContainer').style.display = 'flex';
            loadData();
        }

        function lockApp() {
            localStorage.removeItem('inventoryAuth');
            document.getElementById('passwordScreen').style.display = 'flex';
            document.getElementById('appContainer').style.display = 'none';
            document.getElementById('appPassword').value = '';
            document.getElementById('passwordError').style.display = 'none';
        }

        // CSV Import Handler
        function importCSV() {
            const fileInput = document.getElementById('csvFileInput');
            const file = fileInput.files[0];
            const statusEl = document.getElementById('importStatus');
            
            if (!file) {
                statusEl.textContent = '❌ Please select a CSV file';
                statusEl.style.color = '#f56565';
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const csv = e.target.result;
                    const parsed = parseCSV(csv);
                    data = parsed;
                    statusEl.textContent = `✅ Imported ${parsed.length} games successfully!`;
                    statusEl.style.color = '#38a169';
                    
                    // Switch to dashboard to show new data
                    setTimeout(() => {
                        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                        document.querySelector('[data-tab="dashboard"]').classList.add('active');
                        document.getElementById('dashboard').classList.add('active');
                        renderDashboard();
                        renderItems();
                        renderSpending();
                        renderTimeline();
                        renderAnalysis();
                    }, 500);
                } catch (error) {
                    statusEl.textContent = '❌ ' + error.message;
                    statusEl.style.color = '#f56565';
                    console.error('CSV parse error:', error);
                }
            };
            reader.readAsText(file);
        }

        function parseCSV(csvText) {
            const lines = csvText.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            const parsed = [];

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                
                // Simple CSV parser supporting quoted fields
                const regex = /"([^"]*)"|([^,]+)/g;
                const fields = [];
                let match;
                while ((match = regex.exec(lines[i])) !== null) {
                    fields.push(match[1] !== undefined ? match[1] : match[2].trim());
                }

                const row = {};
                headers.forEach((h, idx) => {
                    row[h] = fields[idx] || '';
                });
                
                // Map CSV columns to our data structure
                parsed.push({
                    objectid: row['objectid'] || row['object id'] || '',
                    objectname: row['name'] || row['objectname'] || '',
                    pricepaid: row['pricepaid'] || row['price paid'] || '',
                    invdate: row['invdate'] || row['acquisition date'] || '',
                    acquiredfrom: row['acquiredfrom'] || row['acquired from'] || '',
                    privatecomment: row['privatecomment'] || row['private comments'] || '',
                    quantity: parseInt(row['quantity'] || '1') || 1,
                    own: (row['own'] || row['owned'] || '0') === '1',
                    prevowned: (row['prevowned'] || row['preowned'] || '0') === '1',
                    yearpublished: row['yearpublished'] || row['year published'] || '',
                    average: parseFloat(row['average'] || row['bgg_rating'] || '0') || 0,
                    image: row['image'] || row['thumbnail'] || '',
                    numplays: row['numplays'] || row['plays'] || '0',
                    minplayers: row['minplayers'] || row['min players'] || '',
                    maxplayers: row['maxplayers'] || row['max players'] || ''
                });
            }
            
            return parsed.filter(item => item.objectname && (item.pricepaid || item.invdate));
        }

        // Check on load
        window.addEventListener('load', () => {
            if (!checkPassword()) {
                document.getElementById('passwordScreen').style.display = 'flex';
                document.getElementById('appContainer').style.display = 'none';
            } else {
                document.getElementById('passwordScreen').style.display = 'none';
                document.getElementById('appContainer').style.display = 'flex';
                loadData();
            }
        });

        // Allow Enter key to unlock
        document.getElementById('appPassword')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') unlockApp();
        });
    </script>
