<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory - Spending & Collection Analytics</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>📦</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            color: #333;
            min-height: 100vh;
        }

        /* ── Layout Shell ── */
        .app-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 24px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 20;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
        }
        .app-header h1 { font-size: 24px; font-weight: 700; }
        .app-header p { font-size: 13px; opacity: 0.85; margin-top: 2px; }

        .tabs {
            display: flex;
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            overflow-x: auto;
            position: sticky;
            top: 68px;
            z-index: 15;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }

        .tab-btn {
            flex: 0 0 auto;
            padding: 12px 20px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #777;
            border-bottom: 3px solid transparent;
            transition: all 0.25s ease;
            white-space: nowrap;
        }
        .tab-btn:hover { color: #667eea; background: rgba(102,126,234,0.04); }
        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
            background: rgba(102,126,234,0.06);
        }

        .main-content {
            max-width: 960px;
            margin: 0 auto;
            padding: 16px;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ── Metric Cards ── */
        .metric-card {
            background: #fff;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid #e9ecef;
        }
        .metric-card.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff; border: none;
        }
        .metric-card.secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #fff; border: none;
        }
        .metric-card.tertiary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #fff; border: none;
        }
        .metric-card.green {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            color: #fff; border: none;
        }
        .metric-card.warm {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: #fff; border: none;
        }
        .metric-label {
            font-size: 11px; opacity: 0.85; margin-bottom: 4px;
            font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px;
        }
        .metric-value { font-size: 30px; font-weight: 800; margin-bottom: 2px; }
        .metric-detail { font-size: 11px; opacity: 0.7; }

        /* ── Grids ── */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 14px;
        }
        .grid-2 .metric-card { margin-bottom: 0; }

        /* ── Item Cards ── */
        .item-list { display: flex; flex-direction: column; gap: 10px; }

        .item-card {
            background: #fff;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }
        .item-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 14px rgba(102,126,234,0.12);
            transform: translateY(-1px);
        }

        .item-thumbnail {
            width: 52px; height: 52px;
            background: #f0f2f5; border-radius: 8px;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; overflow: hidden;
        }
        .item-thumbnail img { width: 100%; height: 100%; object-fit: cover; }

        .item-info { flex: 1; min-width: 0; }
        .item-name { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 3px; line-height: 1.3; }
        .item-meta { font-size: 12px; color: #888; margin-bottom: 2px; }
        .item-badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }

        .badge {
            display: inline-block; font-size: 10px; padding: 2px 8px;
            border-radius: 4px; font-weight: 700; white-space: nowrap;
        }
        .badge.own { background: #d4edda; color: #155724; }
        .badge.prevowned { background: #fff3cd; color: #856404; }

        /* ── Modal ── */
        .modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.45); z-index: 100;
            align-items: center; justify-content: center; padding: 16px;
        }
        .modal.active { display: flex; }

        .modal-content {
            background: #fff; border-radius: 16px;
            max-width: 560px; width: 100%; max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 24px 64px rgba(0,0,0,0.25);
        }
        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 16px 20px;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 2;
        }
        .modal-header h2 { font-size: 16px; font-weight: 700; }
        .modal-close {
            background: rgba(255,255,255,0.2); border: none; color: white;
            font-size: 22px; cursor: pointer; width: 34px; height: 34px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }
        .modal-close:hover { background: rgba(255,255,255,0.35); }
        .modal-body { padding: 20px; }

        .detail-section { margin-bottom: 20px; }
        .detail-section h3 {
            font-size: 12px; font-weight: 700; color: #667eea;
            text-transform: uppercase; margin-bottom: 10px; letter-spacing: 0.5px;
        }
        .detail-row {
            display: flex; justify-content: space-between;
            padding: 9px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { color: #888; font-weight: 500; }
        .detail-value { color: #333; font-weight: 600; text-align: right; }

        .image-container {
            width: 100%; height: 220px; background: #f0f2f5;
            border-radius: 10px; display: flex; align-items: center;
            justify-content: center; margin-bottom: 16px; overflow: hidden;
        }
        .image-container img { width: 100%; height: 100%; object-fit: cover; }

        /* ── Filter / Controls ── */
        .filter-bar {
            display: flex; gap: 12px; margin-bottom: 14px; flex-wrap: wrap;
        }
        .filter-bar select {
            flex: 1; min-width: 140px; padding: 10px 12px;
            border: 1px solid #ddd; border-radius: 8px;
            font-size: 13px; font-family: inherit;
            background: #fff; color: #333;
        }

        /* ── Charts ── */
        .section-title {
            font-size: 15px; font-weight: 700; color: #444;
            margin: 20px 0 10px; padding-bottom: 6px;
            border-bottom: 2px solid #667eea;
            display: inline-block;
        }
        .chart-container {
            background: #fff; border-radius: 10px; padding: 14px;
            margin-bottom: 14px; border: 1px solid #e9ecef;
        }
        .bar-chart { display: flex; flex-direction: column; gap: 8px; }
        .bar-item { display: flex; align-items: center; gap: 8px; }
        .bar-label { font-size: 11px; font-weight: 600; color: #666; min-width: 60px; }
        .bar-container { flex: 1; background: #f0f0f0; height: 22px; border-radius: 5px; overflow: hidden; }
        .bar { height: 100%; border-radius: 5px; background: linear-gradient(90deg, #667eea 0%, #764ba2 100%); transition: width 0.4s ease; }
        .bar-value { font-size: 11px; font-weight: 700; color: #333; min-width: 30px; text-align: right; }

        /* ── Utility ── */
        .loading { text-align: center; padding: 40px 20px; color: #999; }
        .spinner {
            border: 3px solid #eee; border-top-color: #667eea;
            border-radius: 50%; width: 28px; height: 28px;
            animation: spin 0.8s linear infinite; margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state { text-align: center; padding: 40px 20px; color: #aaa; }

        .insight-card {
            background: #fff; border-radius: 12px; padding: 18px;
            border: 1px solid #e9ecef; margin-bottom: 14px;
        }
        .insight-card p { font-size: 13px; line-height: 1.8; padding: 2px 0; }

        /* ── Import Section ── */
        .import-section {
            max-width: 500px; margin: 20px auto; text-align: center;
        }
        .import-section p { font-size: 13px; color: #888; margin-bottom: 16px; }
        .btn-primary {
            display: inline-block; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff; padding: 12px 20px; border: none; border-radius: 10px;
            font-weight: 600; cursor: pointer; font-size: 13px; font-family: inherit;
            text-decoration: none; transition: opacity 0.2s;
        }
        .btn-primary:hover { opacity: 0.92; }
        .file-input { margin: 16px 0; display: block; width: 100%; }

        /* ── Responsive ── */
        @media (min-width: 768px) {
            .main-content { padding: 24px; }
            .tabs { justify-content: center; }
            .tab-btn { padding: 14px 28px; font-size: 14px; }
            .metric-value { font-size: 34px; }
            .item-card { padding: 16px; }
            .grid-2 { gap: 16px; }
        }

        @media (max-width: 480px) {
            .app-header { padding: 14px 16px; }
            .app-header h1 { font-size: 20px; }
            .main-content { padding: 10px; }
            .metric-card { padding: 14px; }
            .metric-value { font-size: 26px; }
            .grid-2 { grid-template-columns: 1fr; }
            .filter-bar { flex-direction: column; }
            .filter-bar select { min-width: 100%; }
            .modal-content { border-radius: 12px; }
        }
    </style>
</head>
<body>
    <div class="app-header">
        <h1>📦 Inventory</h1>
        <p>Spending & Collection Analytics</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
        <button class="tab-btn" data-tab="items">Items</button>
        <button class="tab-btn" data-tab="spending">Spending</button>
        <button class="tab-btn" data-tab="timeline">Timeline</button>
        <button class="tab-btn" data-tab="analysis">Analysis</button>
        <button class="tab-btn" data-tab="import">📥 Import</button>
    </div>

    <div class="main-content">
        <div class="tab-content active" id="dashboard">
            <div id="dashboard-content"><div class="loading"><div class="spinner"></div><p>Loading collection…</p></div></div>
        </div>

        <div class="tab-content" id="items">
            <div class="filter-bar">
                <select id="filter-status">
                    <option value="">All Items</option>
                    <option value="own">Currently Own</option>
                    <option value="prevowned">Sold/Traded</option>
                    <option value="hasPrice">With Price Paid</option>
                </select>
                <select id="filter-sort">
                    <option value="price-desc">Price: High → Low</option>
                    <option value="price-asc">Price: Low → High</option>
                    <option value="date-newest">Date: Newest</option>
                    <option value="date-oldest">Date: Oldest</option>
                    <option value="name">Name A-Z</option>
                </select>
            </div>
            <div id="items-list" class="item-list"></div>
        </div>

        <div class="tab-content" id="spending">
            <div id="spending-content"></div>
        </div>

        <div class="tab-content" id="timeline">
            <div id="timeline-content"></div>
        </div>

        <div class="tab-content" id="analysis">
            <div id="analysis-content"></div>
        </div>

        <div class="tab-content" id="import">
            <div class="import-section">
                <p>Download your BGG collection CSV and upload it here.</p>
                <a href="https://boardgamegeek.com/geekcollection.php?action=exportcsv&subtype=boardgame&username=sportomax&all=1" target="_blank" class="btn-primary">📥 Download CSV from BGG</a>
                <input type="file" id="csvFileInput" accept=".csv" class="file-input" />
                <button onclick="importCSV()" class="btn-primary" style="width:100%;margin-top:4px;">Import CSV</button>
                <div id="importStatus" style="margin-top:14px;font-size:12px;color:#888;"></div>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal" id="detail-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title"></h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="image-container" id="modal-image"><div class="spinner"></div></div>
                <div id="modal-details"></div>
            </div>
        </div>
    </div>

    <script>
        let data = [];

        /* ── Data Loading ── */
        async function loadData() {
            try {
                const response = await fetch('private_all.xml');
                const xml = await response.text();
                parseXml(xml);
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('dashboard-content').innerHTML = '<div class="empty-state"><p>Failed to load collection data</p></div>';
            }
        }

        function parseXml(xmlString) {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlString, 'text/xml');
            const items = xmlDoc.getElementsByTagName('item');

            data = Array.from(items).map(item => ({
                objectid: item.getElementsByTagName('objectid')[0]?.textContent || '',
                objectname: item.getElementsByTagName('objectname')[0]?.textContent || '',
                pricepaid: item.getElementsByTagName('pricepaid')[0]?.textContent || '',
                invdate: item.getElementsByTagName('invdate')[0]?.textContent || '',
                acquiredfrom: item.getElementsByTagName('acquiredfrom')[0]?.textContent || '',
                privatecomment: item.getElementsByTagName('privatecomment')[0]?.textContent || '',
                quantity: parseInt(item.getElementsByTagName('quantity')[0]?.textContent || 1) || 1,
                own: item.getElementsByTagName('own')[0]?.textContent === '1',
                prevowned: item.getElementsByTagName('prevowned')[0]?.textContent === '1',
                yearpublished: item.getElementsByTagName('yearpublished')[0]?.textContent || '',
                average: parseFloat(item.getElementsByTagName('average')[0]?.textContent || 0),
                image: item.getElementsByTagName('image')[0]?.textContent || '',
                numplays: item.getElementsByTagName('numplays')[0]?.textContent || '0',
                minplayers: item.getElementsByTagName('minplayers')[0]?.textContent || '',
                maxplayers: item.getElementsByTagName('maxplayers')[0]?.textContent || '',
            })).filter(item => item.pricepaid || item.invdate);

            renderDashboard();
            renderItems();
            renderSpending();
            renderTimeline();
            renderAnalysis();
        }

        /* ── Dashboard ── */
        function renderDashboard() {
            const withPrice = data.filter(i => i.pricepaid);
            const withDate = data.filter(i => i.invdate);
            const ownedWithPrice = data.filter(i => i.own && i.pricepaid);
            const prevownedWithPrice = data.filter(i => i.prevowned && i.pricepaid);

            const totalSpent = withPrice.reduce((sum, i) => sum + (parseFloat(i.pricepaid) || 0), 0);
            const ownedSpent = ownedWithPrice.reduce((sum, i) => sum + (parseFloat(i.pricepaid) || 0), 0);
            const prevownedSpent = prevownedWithPrice.reduce((sum, i) => sum + (parseFloat(i.pricepaid) || 0), 0);

            document.getElementById('dashboard-content').innerHTML = `
                <div class="metric-card primary">
                    <div class="metric-label">Total Invested</div>
                    <div class="metric-value">$${totalSpent.toFixed(2)}</div>
                    <div class="metric-detail">${withPrice.length} items with prices</div>
                </div>

                <div class="grid-2">
                    <div class="metric-card secondary">
                        <div class="metric-label">Still Owned</div>
                        <div class="metric-value">$${ownedSpent.toFixed(2)}</div>
                        <div class="metric-detail">${ownedWithPrice.length} games</div>
                    </div>
                    <div class="metric-card tertiary">
                        <div class="metric-label">Sold / Traded</div>
                        <div class="metric-value">$${prevownedSpent.toFixed(2)}</div>
                        <div class="metric-detail">${prevownedWithPrice.length} games</div>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="metric-card green">
                        <div class="metric-label">Avg Price / Game</div>
                        <div class="metric-value">$${(totalSpent / (withPrice.length || 1)).toFixed(2)}</div>
                        <div class="metric-detail">${withDate.length} items inventoried</div>
                    </div>
                    <div class="metric-card warm">
                        <div class="metric-label">Collection Count</div>
                        <div class="metric-value">${ownedWithPrice.length}</div>
                        <div class="metric-detail">games still owned</div>
                    </div>
                </div>
            `;
        }

        /* ── Items ── */
        function renderItems() {
            const list = document.getElementById('items-list');
            const filteredData = filterAndSortItems();

            if (filteredData.length === 0) {
                list.innerHTML = '<div class="empty-state"><p>No items found</p></div>';
                return;
            }

            list.innerHTML = filteredData.map((item, idx) => `
                <div class="item-card" onclick="showDetail(${idx})">
                    <div class="item-thumbnail">🎲</div>
                    <div class="item-info">
                        <div class="item-name">${item.objectname}</div>
                        <div class="item-meta">${item.pricepaid ? '$' + item.pricepaid : 'No price'}</div>
                        <div class="item-meta">${item.invdate || 'No date'}</div>
                        ${item.acquiredfrom ? `<div class="item-meta" style="color:#667eea;font-weight:500;">📍 ${item.acquiredfrom}</div>` : ''}
                        ${item.privatecomment ? `<div class="item-meta" style="color:#f5576c;font-size:11px;font-style:italic;">💬 ${item.privatecomment.substring(0, 60)}${item.privatecomment.length > 60 ? '…' : ''}</div>` : ''}
                        <div class="item-badges">
                            ${item.own ? '<span class="badge own">Owned</span>' : ''}
                            ${item.prevowned ? '<span class="badge prevowned">Prev Owned</span>' : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterAndSortItems() {
            const status = document.getElementById('filter-status')?.value || '';
            const sort = document.getElementById('filter-sort')?.value || 'price-desc';

            let filtered = [...data];
            if (status === 'own') filtered = filtered.filter(i => i.own);
            else if (status === 'prevowned') filtered = filtered.filter(i => i.prevowned);
            else if (status === 'hasPrice') filtered = filtered.filter(i => i.pricepaid);

            filtered.sort((a, b) => {
                switch (sort) {
                    case 'price-desc': return (parseFloat(b.pricepaid) || 0) - (parseFloat(a.pricepaid) || 0);
                    case 'price-asc': return (parseFloat(a.pricepaid) || 0) - (parseFloat(b.pricepaid) || 0);
                    case 'date-newest': return new Date(b.invdate) - new Date(a.invdate);
                    case 'date-oldest': return new Date(a.invdate) - new Date(b.invdate);
                    case 'name': return a.objectname.localeCompare(b.objectname);
                    default: return 0;
                }
            });
            return filtered;
        }

        /* ── Spending ── */
        function renderSpending() {
            const months = {}, quantities = {}, quarters = {}, quarterQuantities = {};
            const years = {}, yearQuantities = {};

            data.forEach(item => {
                if (!item.invdate) return;
                const month = item.invdate.substring(0, 7);
                const year = item.invdate.substring(0, 4);
                const monthNum = parseInt(item.invdate.substring(5, 7));
                const quarter = `${year}-Q${Math.ceil(monthNum / 3)}`;
                const price = parseFloat(item.pricepaid) || 0;
                const qty = item.quantity || 1;

                months[month] = (months[month] || 0) + price;
                quantities[month] = (quantities[month] || 0) + qty;
                quarters[quarter] = (quarters[quarter] || 0) + price;
                quarterQuantities[quarter] = (quarterQuantities[quarter] || 0) + qty;
                years[year] = (years[year] || 0) + price;
                yearQuantities[year] = (yearQuantities[year] || 0) + qty;
            });

            let html = '';

            function barSection(title, dataObj, maxVal, gradient, prefix) {
                let s = `<div class="section-title">${title}</div><div class="chart-container"><div class="bar-chart">`;
                Object.keys(dataObj).sort().reverse().forEach(key => {
                    const v = dataObj[key];
                    const pct = maxVal > 0 ? (v / maxVal) * 100 : 0;
                    s += `<div class="bar-item">
                        <div class="bar-label">${key}</div>
                        <div class="bar-container"><div class="bar" style="width:${pct}%;${gradient ? 'background:linear-gradient(90deg,' + gradient + ')' : ''}"></div></div>
                        <div class="bar-value">${prefix}${prefix === '$' ? v.toFixed(0) : v}</div>
                    </div>`;
                });
                s += '</div></div>';
                return s;
            }

            const sortedMonths12 = Object.keys(months).sort().reverse().slice(0, 12);
            const months12 = {}; sortedMonths12.forEach(m => months12[m] = months[m]);
            const qty12 = {}; sortedMonths12.forEach(m => qty12[m] = quantities[m]);

            html += barSection('Monthly Spending (Last 12)', months12, Math.max(...Object.values(months12), 1), '', '$');
            html += barSection('Games Acquired / Month', qty12, Math.max(...Object.values(qty12), 1), '#4facfe 0%, #00f2fe 100%', '');
            html += barSection('Quarterly Spending', quarters, Math.max(...Object.values(quarters), 1), '#f093fb 0%, #f5576c 100%', '$');
            html += barSection('Games Acquired / Quarter', quarterQuantities, Math.max(...Object.values(quarterQuantities), 1), '#fa709a 0%, #fee140 100%', '');
            html += barSection('Yearly Spending', years, Math.max(...Object.values(years), 1), '#84fab0 0%, #8fd3f4 100%', '$');
            html += barSection('Games Acquired / Year', yearQuantities, Math.max(...Object.values(yearQuantities), 1), '#667eea 0%, #764ba2 100%', '');

            // Acquired From
            const acquiredFrom = {}, acquiredFromQty = {};
            data.forEach(item => {
                if (!item.acquiredfrom) return;
                const src = item.acquiredfrom.trim();
                acquiredFrom[src] = (acquiredFrom[src] || 0) + (parseFloat(item.pricepaid) || 0);
                acquiredFromQty[src] = (acquiredFromQty[src] || 0) + (item.quantity || 1);
            });

            if (Object.keys(acquiredFrom).length) {
                const sortedSources = Object.keys(acquiredFrom).sort((a, b) => acquiredFrom[b] - acquiredFrom[a]);
                const maxS = Math.max(...Object.values(acquiredFrom), 1);
                html += `<div class="section-title">Spending by Source</div><div class="chart-container"><div class="bar-chart">`;
                sortedSources.forEach(src => {
                    const spend = acquiredFrom[src], qty = acquiredFromQty[src];
                    html += `<div class="bar-item">
                        <div class="bar-label" style="min-width:100px">${src}</div>
                        <div class="bar-container"><div class="bar" style="width:${(spend / maxS) * 100}%"></div></div>
                        <div class="bar-value" style="min-width:70px">$${spend.toFixed(0)} (${qty})</div>
                    </div>`;
                });
                html += '</div></div>';
            }

            document.getElementById('spending-content').innerHTML = html;
        }

        /* ── Timeline ── */
        function renderTimeline() {
            const sorted = [...data].filter(i => i.invdate).sort((a, b) => new Date(b.invdate) - new Date(a.invdate));

            let html = '<div class="section-title">Recent Acquisitions</div>';
            if (!sorted.length) {
                html += '<div class="empty-state"><p>No inventory dates found</p></div>';
                document.getElementById('timeline-content').innerHTML = html;
                return;
            }

            html += '<div class="item-list">';
            sorted.slice(0, 50).forEach(item => {
                const status = item.own ? 'Owned' : item.prevowned ? 'Prev Owned' : 'Unknown';
                html += `
                    <div class="item-card" onclick="showDetailById('${item.objectid}')">
                        <div class="item-thumbnail">📅</div>
                        <div class="item-info">
                            <div class="item-name">${item.objectname}</div>
                            <div class="item-meta">${item.invdate} — ${status}</div>
                            <div class="item-meta">${item.pricepaid ? '$' + item.pricepaid : 'No price'}</div>
                        </div>
                    </div>`;
            });
            html += '</div>';
            document.getElementById('timeline-content').innerHTML = html;
        }

        /* ── Analysis ── */
        function renderAnalysis() {
            const allOwnedData = data.filter(i => i.own);
            const ownedData = data.filter(i => i.own && i.pricepaid);
            const prevownedData = data.filter(i => i.prevowned && i.pricepaid);

            const ownedTotal = allOwnedData.reduce((sum, i) => sum + parseFloat(i.pricepaid || 0), 0);
            const ownedWithPrice = allOwnedData.filter(i => parseFloat(i.pricepaid || 0) > 0);
            const avgOwnedWithZeros = allOwnedData.length > 0 ? ownedTotal / allOwnedData.length : 0;
            const avgOwnedNoZeros = ownedWithPrice.length > 0 ? ownedWithPrice.reduce((sum, i) => sum + parseFloat(i.pricepaid), 0) / ownedWithPrice.length : 0;
            const avgPrevowned = prevownedData.length > 0 ? prevownedData.reduce((sum, i) => sum + parseFloat(i.pricepaid), 0) / prevownedData.length : 0;

            const retentionPct = (ownedData.length + prevownedData.length) > 0
                ? ((ownedData.length / (ownedData.length + prevownedData.length)) * 100).toFixed(1) : '0.0';

            document.getElementById('analysis-content').innerHTML = `
                <div class="metric-card primary">
                    <div class="metric-label">Collection Retention</div>
                    <div class="metric-value">${retentionPct}%</div>
                    <div class="metric-detail">Percentage of games kept vs sold</div>
                </div>

                <div class="grid-2">
                    <div class="metric-card secondary">
                        <div class="metric-label">Avg Owned Price (all)</div>
                        <div class="metric-value">$${avgOwnedWithZeros.toFixed(2)}</div>
                        <div class="metric-detail">${allOwnedData.length} games incl. $0</div>
                    </div>
                    <div class="metric-card secondary">
                        <div class="metric-label">Avg Owned Price (priced)</div>
                        <div class="metric-value">$${avgOwnedNoZeros.toFixed(2)}</div>
                        <div class="metric-detail">${ownedWithPrice.length} games with price</div>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="metric-card tertiary">
                        <div class="metric-label">Avg Sold Price</div>
                        <div class="metric-value">$${avgPrevowned.toFixed(2)}</div>
                        <div class="metric-detail">${prevownedData.length} sold/traded</div>
                    </div>
                    <div class="metric-card tertiary">
                        <div class="metric-label">Games w/o Price</div>
                        <div class="metric-value">${allOwnedData.length - ownedWithPrice.length}</div>
                        <div class="metric-detail">of ${allOwnedData.length} owned</div>
                    </div>
                </div>

                <div class="section-title">Key Insights</div>
                <div class="insight-card">
                    <p>💰 <strong>$${(ownedData.reduce((s, i) => s + parseFloat(i.pricepaid), 0)).toFixed(2)}</strong> invested in games you still own</p>
                    <p>📤 <strong>$${(prevownedData.reduce((s, i) => s + parseFloat(i.pricepaid), 0)).toFixed(2)}</strong> divested (games sold/traded)</p>
                    <p>📊 <strong>${ownedData.length}</strong> keepers vs <strong>${prevownedData.length}</strong> released</p>
                    <p>💵 Average cost: <strong>$${((ownedData.reduce((s, i) => s + parseFloat(i.pricepaid), 0) + prevownedData.reduce((s, i) => s + parseFloat(i.pricepaid), 0)) / ((ownedData.length + prevownedData.length) || 1)).toFixed(2)}</strong> per game</p>
                </div>
            `;
        }

        /* ── Detail Modal ── */
        function showDetailById(objectid) {
            const item = data.find(i => i.objectid === objectid);
            if (item) showDetailDirect(item);
        }

        function showDetail(idx) {
            const item = filterAndSortItems()[idx];
            if (item) showDetailDirect(item);
        }

        function showDetailDirect(item) {
            document.getElementById('modal-title').textContent = item.objectname;
            document.getElementById('modal-image').innerHTML = item.image
                ? `<img src="${item.image}" alt="${item.objectname}">`
                : '<div class="spinner"></div>';

            document.getElementById('modal-details').innerHTML = `
                <div class="detail-section">
                    <h3>Acquisition</h3>
                    <div class="detail-row"><span class="detail-label">Date</span><span class="detail-value">${item.invdate || 'Not recorded'}</span></div>
                    <div class="detail-row"><span class="detail-label">Price Paid</span><span class="detail-value">${item.pricepaid ? '$' + item.pricepaid : 'Not recorded'}</span></div>
                    <div class="detail-row"><span class="detail-label">Quantity</span><span class="detail-value">${item.quantity || 1}</span></div>
                    ${item.acquiredfrom ? `<div class="detail-row"><span class="detail-label">Acquired From</span><span class="detail-value">${item.acquiredfrom}</span></div>` : ''}
                    ${item.privatecomment ? `<div class="detail-row"><span class="detail-label">Notes</span><span class="detail-value">${item.privatecomment}</span></div>` : ''}
                    <div class="detail-row"><span class="detail-label">Status</span><span class="detail-value">${item.own ? '✓ Owned' : ''}${item.prevowned ? '✓ Previously Owned' : ''}</span></div>
                </div>
                <div class="detail-section">
                    <h3>Game Info</h3>
                    <div class="detail-row"><span class="detail-label">Year Published</span><span class="detail-value">${item.yearpublished || 'N/A'}</span></div>
                    <div class="detail-row"><span class="detail-label">Players</span><span class="detail-value">${item.minplayers}${item.maxplayers ? '–' + item.maxplayers : ''}</span></div>
                    <div class="detail-row"><span class="detail-label">BGG Rating</span><span class="detail-value">${(item.average || 0).toFixed(2)}</span></div>
                    <div class="detail-row"><span class="detail-label">Plays</span><span class="detail-value">${item.numplays}</span></div>
                </div>
                <div class="detail-section">
                    <a href="https://boardgamegeek.com/thing/${item.objectid}" target="_blank" style="color:#667eea;text-decoration:none;font-weight:600;">View on BoardGameGeek →</a>
                </div>
            `;
            document.getElementById('detail-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.remove('active');
        }

        /* ── Tab Switching ── */
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.tab).classList.add('active');
                if (btn.dataset.tab === 'items') renderItems();
            });
        });

        document.getElementById('filter-status')?.addEventListener('change', renderItems);
        document.getElementById('filter-sort')?.addEventListener('change', renderItems);

        document.getElementById('detail-modal').addEventListener('click', (e) => {
            if (e.target.id === 'detail-modal') closeModal();
        });

        /* ── CSV Import ── */
        function importCSV() {
            const fileInput = document.getElementById('csvFileInput');
            const file = fileInput.files[0];
            const statusEl = document.getElementById('importStatus');

            if (!file) {
                statusEl.textContent = '❌ Please select a CSV file';
                statusEl.style.color = '#f56565';
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const parsed = parseCSV(e.target.result);
                    data = parsed;
                    statusEl.textContent = `✅ Imported ${parsed.length} games successfully!`;
                    statusEl.style.color = '#38a169';

                    setTimeout(() => {
                        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                        document.querySelector('[data-tab="dashboard"]').classList.add('active');
                        document.getElementById('dashboard').classList.add('active');
                        renderDashboard();
                        renderItems();
                        renderSpending();
                        renderTimeline();
                        renderAnalysis();
                    }, 500);
                } catch (error) {
                    statusEl.textContent = '❌ ' + error.message;
                    statusEl.style.color = '#f56565';
                    console.error('CSV parse error:', error);
                }
            };
            reader.readAsText(file);
        }

        function parseCSV(csvText) {
            const lines = csvText.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            const parsed = [];

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const regex = /"([^"]*)"|([^,]+)/g;
                const fields = [];
                let match;
                while ((match = regex.exec(lines[i])) !== null) {
                    fields.push(match[1] !== undefined ? match[1] : match[2].trim());
                }
                const row = {};
                headers.forEach((h, idx) => { row[h] = fields[idx] || ''; });

                parsed.push({
                    objectid: row['objectid'] || row['object id'] || '',
                    objectname: row['name'] || row['objectname'] || '',
                    pricepaid: row['pricepaid'] || row['price paid'] || '',
                    invdate: row['invdate'] || row['acquisition date'] || '',
                    acquiredfrom: row['acquiredfrom'] || row['acquired from'] || '',
                    privatecomment: row['privatecomment'] || row['private comments'] || '',
                    quantity: parseInt(row['quantity'] || '1') || 1,
                    own: (row['own'] || row['owned'] || '0') === '1',
                    prevowned: (row['prevowned'] || row['preowned'] || '0') === '1',
                    yearpublished: row['yearpublished'] || row['year published'] || '',
                    average: parseFloat(row['average'] || row['bgg_rating'] || '0') || 0,
                    image: row['image'] || row['thumbnail'] || '',
                    numplays: row['numplays'] || row['plays'] || '0',
                    minplayers: row['minplayers'] || row['min players'] || '',
                    maxplayers: row['maxplayers'] || row['max players'] || ''
                });
            }
            return parsed.filter(item => item.objectname && (item.pricepaid || item.invdate));
        }

        /* ── Init ── */
        loadData();
    </script>
    <!-- Vercel Web Analytics -->
    <script type="module" src="analytics-init.js"></script>
</body>
