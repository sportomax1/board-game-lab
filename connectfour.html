<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Connect Four - BGG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { padding: max(env(safe-area-inset-top), 0) max(env(safe-area-inset-right), 0) max(env(safe-area-inset-bottom), 0) max(env(safe-area-inset-left), 0); }
        input, select, button { font-size: 16px; }
        .board { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 12px; background: #1e40af; border-radius: 12px; }
        .cell { aspect-ratio: 1; border-radius: 50%; border: 3px solid white; overflow: hidden; cursor: pointer; display: flex; align-items: center; justify-content: center; min-height: 60px; }
        .cell img { width: 100%; height: 100%; object-fit: cover; }
        .cell.empty { background: white; }
        .cell.red { background: red; }
        .cell.yellow { background: yellow; }
        .winning-cell { animation: pulse 0.6s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .search-result { cursor: pointer; border-2 border-gray-300 rounded-lg p-3 hover:border-blue-500 transition; }
        .search-result img { width: 100%; height: auto; border-radius-lg; }
    </style>
</head>
<body class="bg-gradient-to-b from-blue-900 to-blue-800 min-h-screen flex flex-col">
    <div id="setupModal" class="fixed inset-0 bg-gradient-to-br from-red-900 to-yellow-900 z-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-3xl shadow-2xl p-6 md:p-8 max-w-md w-full my-4">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-2 text-center">🔴🟡 Connect Four</h1>
            <p class="text-gray-500 text-center text-base mb-6">Play with BGG game images!</p>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Player 1 Game (Red Pieces)</label>
                    <input type="text" id="player1Search" class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 focus:border-red-500 outline-none" placeholder="Search game...">
                </div>
                <button onclick="searchPlayer1()" class="w-full bg-red-600 text-white py-3 rounded-lg font-bold hover:bg-red-700 transition">Search Player 1</button>
                <div id="player1Results" class="grid grid-cols-3 gap-2 max-h-60 overflow-y-auto hidden"></div>
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Player 2 Game (Yellow Pieces)</label>
                    <input type="text" id="player2Search" class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 focus:border-yellow-500 outline-none" placeholder="Search game...">
                </div>
                <button onclick="searchPlayer2()" class="w-full bg-yellow-600 text-white py-3 rounded-lg font-bold hover:bg-yellow-700 transition">Search Player 2</button>
                <div id="player2Results" class="grid grid-cols-3 gap-2 max-h-60 overflow-y-auto hidden"></div>
                
                <button id="startBtn" onclick="startGame()" class="w-full bg-green-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-green-700 transition shadow-lg disabled:opacity-50 disabled:cursor-not-allowed" disabled>Start Game</button>
            </div>
        </div>
    </div>
    <div id="infoModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-6 max-w-md w-full">
            <h2 class="text-2xl font-bold text-gray-900 mb-4">ℹ️ How to Play</h2>
            <div class="space-y-3 text-gray-700">
                <p>• Click column to drop your piece</p>
                <p>• First to connect 4 in a row wins!</p>
                <p>• Row, column, or diagonal</p>
                <p>• Game pieces are box art from BGG</p>
                <p>• New game button to play again</p>
            </div>
            <button onclick="closeInfo()" class="w-full mt-6 bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700">Got it!</button>
        </div>
    </div>
    <div id="app" class="hidden flex-1 flex flex-col">
        <header class="bg-white shadow-sm sticky top-0 z-30 px-4 py-3">
            <div class="max-w-2xl mx-auto flex items-center justify-between">
                <h1 class="font-bold text-xl text-gray-900">🔴🟡 Connect Four</h1>
                <div class="flex gap-2">
                    <button onclick="showInfo()" class="p-2 text-blue-500 hover:bg-blue-50 rounded-lg">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"/><path stroke-linecap="round" d="M12 16v-4m0-4h.01"/></svg>
                    </button>
                    <button onclick="showSettings()" class="p-2 text-gray-500 hover:bg-gray-100 rounded-lg">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    </button>
                </div>
            </div>
        </header>
        <main class="flex-1 p-4 max-w-2xl mx-auto w-full flex flex-col justify-center">
            <div class="bg-white rounded-xl shadow-sm p-4 mb-4">
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-sm text-gray-600">Current Turn</p>
                        <p class="text-2xl font-bold" id="playerDisplay"></p>
                    </div>
                    <div class="text-center">
                        <p class="text-sm text-gray-600">Status</p>
                        <p class="text-lg font-bold text-gray-900" id="status">In Progress</p>
                    </div>
                </div>
            </div>
            <div id="board" class="board mx-auto mb-4"></div>
            <button onclick="resetGame()" class="w-full bg-green-500 text-white py-3 rounded-lg font-bold hover:bg-green-600">🔄 New Game</button>
        </main>
    </div>

    <script>
        // Initialize variables globally so they're accessible to onclick handlers
        let RED = 1;
        let YELLOW = 2;
        const ROWS = 6;
        const COLS = 7;
        
        let board = [];
        let currentPlayer = RED;
        let gameOver = false;
        let player1Game = {};
        let player2Game = {};

        async function startGame() {
            if (!player1Game.id || !player2Game.id) {
                alert('Please select games for both players');
                return;
            }
            
            document.getElementById('setupModal').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            
            console.log('Player 1:', player1Game);
            console.log('Player 2:', player2Game);
            
            initializeBoard();
            renderBoard();
            updateDisplay();
        }

        function initializeBoard() {
            board = [];
            for (let i = 0; i < ROWS; i++) {
                board[i] = [];
                for (let j = 0; j < COLS; j++) {
                    board[i][j] = 0;
                }
            }
            currentPlayer = RED;
            gameOver = false;
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            
            for (let col = 0; col < COLS; col++) {
                for (let row = 0; row < ROWS; row++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const piece = board[row][col];
                    
                    if (piece === 0) {
                        cell.classList.add('empty');
                    } else if (piece === RED) {
                        if (player1Game.image) {
                            const img = document.createElement('img');
                            img.src = player1Game.image;
                            cell.appendChild(img);
                        }
                        cell.classList.add('red');
                    } else if (piece === YELLOW) {
                        if (player2Game.image) {
                            const img = document.createElement('img');
                            img.src = player2Game.image;
                            cell.appendChild(img);
                        }
                        cell.classList.add('yellow');
                    }
                    
                    cell.onclick = () => dropPiece(col);
                    boardEl.appendChild(cell);
                }
            }
        }

        function dropPiece(col) {
            if (gameOver) return;
            
            for (let row = ROWS - 1; row >= 0; row--) {
                if (board[row][col] === 0) {
                    board[row][col] = currentPlayer;
                    renderBoard();
                    
                    if (checkWin(row, col, currentPlayer)) {
                        gameOver = true;
                        const playerName = currentPlayer === RED ? player1Game.name : player2Game.name;
                        document.getElementById('status').textContent = `${playerName} Wins! 🎉`;
                        highlightWinningPieces();
                    } else if (isBoardFull()) {
                        gameOver = true;
                        document.getElementById('status').textContent = 'Draw!';
                    } else {
                        currentPlayer = currentPlayer === RED ? YELLOW : RED;
                        updateDisplay();
                    }
                    return;
                }
            }
        }

        function checkWin(row, col, player) {
            const directions = [
                [0, 1], [1, 0], [1, 1], [1, -1]
            ];
            
            for (const [dr, dc] of directions) {
                let count = 1;
                
                for (let i = 1; i < 4; i++) {
                    const r = row + dr * i;
                    const c = col + dc * i;
                    if (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] === player) {
                        count++;
                    } else {
                        break;
                    }
                }
                
                for (let i = 1; i < 4; i++) {
                    const r = row - dr * i;
                    const c = col - dc * i;
                    if (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] === player) {
                        count++;
                    } else {
                        break;
                    }
                }
                
                if (count >= 4) return true;
            }
            
            return false;
        }

        function isBoardFull() {
            for (let col = 0; col < COLS; col++) {
                if (board[0][col] === 0) return false;
            }
            return true;
        }

        function highlightWinningPieces() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                if (cell.classList.contains('red') || cell.classList.contains('yellow')) {
                    cell.classList.add('winning-cell');
                }
            });
        }

        function updateDisplay() {
            const playerName = currentPlayer === RED ? player1Game.name : player2Game.name;
            const playerColor = currentPlayer === RED ? '🔴' : '🟡';
            document.getElementById('playerDisplay').innerHTML = `${playerColor} ${playerName}`;
        }

        function resetGame() {
            initializeBoard();
            renderBoard();
            document.getElementById('status').textContent = 'In Progress';
            updateDisplay();
        }

        function showSettings() { document.getElementById('setupModal').classList.remove('hidden'); }
        function showInfo() { document.getElementById('infoModal').classList.remove('hidden'); }
        function closeInfo() { document.getElementById('infoModal').classList.add('hidden'); }

        async function searchPlayer1() {
            const query = document.getElementById('player1Search').value.trim();
            if (!query) return;
            await displaySearchResults(query, 'player1Results', 'player1');
        }

        async function searchPlayer2() {
            const query = document.getElementById('player2Search').value.trim();
            if (!query) return;
            await displaySearchResults(query, 'player2Results', 'player2');
        }

        async function displaySearchResults(query, resultsId, player) {
            const resultsDiv = document.getElementById(resultsId);
            resultsDiv.innerHTML = '<p class="col-span-3 text-center text-gray-600">Searching...</p>';
            resultsDiv.classList.remove('hidden');
            
            try {
                const res = await fetch(`/api/bgg-helper?endpoint=search&query=${encodeURIComponent(query)}`);
                const xml = await res.text();
                console.log('Search XML:', xml.substring(0, 500));
                
                const parser = new DOMParser().parseFromString(xml, 'text/xml');
                const items = Array.from(parser.querySelectorAll('item[id]'));
                console.log('Found items:', items.length);
                
                resultsDiv.innerHTML = '';
                let count = 0;
                for (const item of items) {
                    if (count >= 9) break;
                    const id = item.getAttribute('id');
                    
                    // Parse name - search API uses name elements with value attribute
                    const nameEls = item.querySelectorAll('name');
                    let name = 'Unknown';
                    if (nameEls.length > 0) {
                        name = nameEls[0].getAttribute('value')?.trim();
                        if (!name) {
                            name = nameEls[0].textContent?.trim();
                        }
                        if (!name) {
                            name = 'Unknown';
                        }
                    }
                    
                    console.log(`Fetching details for: ${name} (ID: ${id})`);
                    
                    // Fetch full game details to get thumbnail
                    try {
                        const thingRes = await fetch(`/api/bgg-helper?endpoint=thing&id=${id}`);
                        const thingXml = await thingRes.text();
                        const thingParser = new DOMParser().parseFromString(thingXml, 'text/xml');
                        const thumbnail = thingParser.querySelector('thumbnail')?.textContent?.trim();
                        const image = thingParser.querySelector('image')?.textContent?.trim();
                        
                        const imgUrl = thumbnail || image;
                        console.log(`${name} - thumbnail: ${imgUrl ? 'yes' : 'no'}`);
                        
                        if (!imgUrl) {
                            console.log('Skipping - no image');
                            continue;
                        }
                        
                        const result = document.createElement('div');
                        result.className = 'search-result';
                        result.innerHTML = `<img src="${imgUrl}" alt="${name}" class="rounded-lg mb-1" onerror="this.src='https://via.placeholder.com/100'"><p class="text-xs font-bold text-center truncate">${name}</p>`;
                        result.onclick = () => selectGame(player, id, name, imgUrl);
                        resultsDiv.appendChild(result);
                        count++;
                    } catch (innerError) {
                        console.error(`Error fetching details for ${id}:`, innerError);
                        continue;
                    }
                }
                
                if (count === 0) {
                    resultsDiv.innerHTML = '<p class="col-span-3 text-center text-gray-600">No results with images found</p>';
                }
            } catch (error) {
                console.error('Search error:', error);
                resultsDiv.innerHTML = '<p class="col-span-3 text-center text-red-600">Error searching</p>';
            }
        }

        function selectGame(player, id, name, image) {
            if (player === 'player1') {
                player1Game = { name, image, id };
                document.getElementById('player1Search').value = name;
                document.getElementById('player1Results').classList.add('hidden');
            } else {
                player2Game = { name, image, id };
                document.getElementById('player2Search').value = name;
                document.getElementById('player2Results').classList.add('hidden');
            }
            
            // Enable start button if both games selected
            if (player1Game.id && player2Game.id) {
                document.getElementById('startBtn').disabled = false;
            }
        }
    </script>
</body>
</html>
