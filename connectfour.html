<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Connect Four - BGG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { padding: max(env(safe-area-inset-top), 0) max(env(safe-area-inset-right), 0) max(env(safe-area-inset-bottom), 0) max(env(safe-area-inset-left), 0); }
        input, select, button { font-size: 16px; }
        .board { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; padding: 10px; background: #1e40af; border-radius: 8px; }
        .cell { aspect-ratio: 1; border-radius: 50%; border: 2px solid white; overflow: hidden; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .cell img { width: 100%; height: 100%; object-fit: cover; }
        .cell.empty { background: white; }
        .cell.red { background: red; }
        .cell.yellow { background: yellow; }
        .winning-cell { animation: pulse 0.6s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    </style>
</head>
<body class="bg-gradient-to-b from-blue-900 to-blue-800 min-h-screen flex flex-col">
    <div id="settingsModal" class="fixed inset-0 bg-gradient-to-br from-red-900 to-yellow-900 z-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-3xl shadow-2xl p-6 md:p-8 max-w-md w-full my-4">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-2 text-center">🔴🟡 Connect Four</h1>
            <p class="text-gray-500 text-center text-base mb-6">Play with BGG game images!</p>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Player 1 Game (Red Pieces)</label>
                    <input type="text" id="player1Game" class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 focus:border-red-500 outline-none" placeholder="e.g., Catan">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Player 2 Game (Yellow Pieces)</label>
                    <input type="text" id="player2Game" class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 focus:border-yellow-500 outline-none" placeholder="e.g., Ticket to Ride">
                </div>
                <button onclick="startGame()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-blue-700 transition shadow-lg">Start Game</button>
            </div>
        </div>
    </div>
    <div id="infoModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-6 max-w-md w-full">
            <h2 class="text-2xl font-bold text-gray-900 mb-4">ℹ️ How to Play</h2>
            <div class="space-y-3 text-gray-700">
                <p>• Click column to drop your piece</p>
                <p>• First to connect 4 in a row wins!</p>
                <p>• Row, column, or diagonal</p>
                <p>• Game pieces are box art from BGG</p>
                <p>• New game button to play again</p>
            </div>
            <button onclick="closeInfo()" class="w-full mt-6 bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700">Got it!</button>
        </div>
    </div>
    <div id="app" class="hidden flex-1 flex flex-col">
        <header class="bg-white shadow-sm sticky top-0 z-30 px-4 py-3">
            <div class="max-w-2xl mx-auto flex items-center justify-between">
                <h1 class="font-bold text-xl text-gray-900">🔴🟡 Connect Four</h1>
                <div class="flex gap-2">
                    <button onclick="showInfo()" class="p-2 text-blue-500 hover:bg-blue-50 rounded-lg">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"/><path stroke-linecap="round" d="M12 16v-4m0-4h.01"/></svg>
                    </button>
                    <button onclick="showSettings()" class="p-2 text-gray-500 hover:bg-gray-100 rounded-lg">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    </button>
                </div>
            </div>
        </header>
        <main class="flex-1 p-4 max-w-2xl mx-auto w-full flex flex-col justify-center">
            <div class="bg-white rounded-xl shadow-sm p-4 mb-4">
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-sm text-gray-600">Current Turn</p>
                        <p class="text-2xl font-bold" id="playerDisplay"></p>
                    </div>
                    <div class="text-center">
                        <p class="text-sm text-gray-600">Status</p>
                        <p class="text-lg font-bold text-gray-900" id="status">In Progress</p>
                    </div>
                </div>
            </div>
            <div id="board" class="board mx-auto mb-4"></div>
            <button onclick="resetGame()" class="w-full bg-green-500 text-white py-3 rounded-lg font-bold hover:bg-green-600">🔄 New Game</button>
        </main>
    </div>

    <script>
        const ROWS = 6;
        const COLS = 7;
        const RED = 1;
        const YELLOW = 2;
        
        let board = [];
        let currentPlayer = RED;
        let gameOver = false;
        let player1Game = {};
        let player2Game = {};
        let player1Images = [];
        let player2Images = [];

        async function startGame() {
            const p1 = document.getElementById('player1Game').value.trim() || 'Catan';
            const p2 = document.getElementById('player2Game').value.trim() || 'Ticket to Ride';
            
            document.getElementById('settingsModal').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            
            try {
                // Search for Player 1 game
                console.log('Searching for Player 1 game:', p1);
                let res = await fetch(`/api/bgg-helper?endpoint=search&query=${encodeURIComponent(p1)}&type=boardgame`);
                let xml = await res.text();
                let parser = new DOMParser().parseFromString(xml, 'text/xml');
                let item = parser.querySelector('item');
                if (!item) throw new Error(`${p1} not found`);
                
                const p1Id = item.getAttribute('id');
                res = await fetch(`/api/bgg-helper?endpoint=thing&id=${p1Id}&stats=1`);
                xml = await res.text();
                parser = new DOMParser().parseFromString(xml, 'text/xml');
                player1Game = {
                    name: parser.querySelector('name')?.textContent || p1,
                    image: parser.querySelector('image')?.textContent || ''
                };
                console.log('Player 1 game:', player1Game);
                
                // Search for Player 2 game
                console.log('Searching for Player 2 game:', p2);
                res = await fetch(`/api/bgg-helper?endpoint=search&query=${encodeURIComponent(p2)}&type=boardgame`);
                xml = await res.text();
                parser = new DOMParser().parseFromString(xml, 'text/xml');
                item = parser.querySelector('item');
                if (!item) throw new Error(`${p2} not found`);
                
                const p2Id = item.getAttribute('id');
                res = await fetch(`/api/bgg-helper?endpoint=thing&id=${p2Id}&stats=1`);
                xml = await res.text();
                parser = new DOMParser().parseFromString(xml, 'text/xml');
                player2Game = {
                    name: parser.querySelector('name')?.textContent || p2,
                    image: parser.querySelector('image')?.textContent || ''
                };
                console.log('Player 2 game:', player2Game);
                
                initializeBoard();
                renderBoard();
                updateDisplay();
            } catch (error) {
                console.error('Error:', error);
                alert('Error: ' + error.message);
                location.reload();
            }
        }

        function initializeBoard() {
            board = [];
            for (let i = 0; i < ROWS; i++) {
                board[i] = [];
                for (let j = 0; j < COLS; j++) {
                    board[i][j] = 0;
                }
            }
            currentPlayer = RED;
            gameOver = false;
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            
            for (let col = 0; col < COLS; col++) {
                for (let row = 0; row < ROWS; row++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const piece = board[row][col];
                    
                    if (piece === 0) {
                        cell.classList.add('empty');
                    } else if (piece === RED) {
                        if (player1Game.image) {
                            const img = document.createElement('img');
                            img.src = player1Game.image;
                            cell.appendChild(img);
                        }
                        cell.classList.add('red');
                    } else if (piece === YELLOW) {
                        if (player2Game.image) {
                            const img = document.createElement('img');
                            img.src = player2Game.image;
                            cell.appendChild(img);
                        }
                        cell.classList.add('yellow');
                    }
                    
                    cell.onclick = () => dropPiece(col);
                    boardEl.appendChild(cell);
                }
            }
        }

        function dropPiece(col) {
            if (gameOver) return;
            
            for (let row = ROWS - 1; row >= 0; row--) {
                if (board[row][col] === 0) {
                    board[row][col] = currentPlayer;
                    renderBoard();
                    
                    if (checkWin(row, col, currentPlayer)) {
                        gameOver = true;
                        const playerName = currentPlayer === RED ? player1Game.name : player2Game.name;
                        document.getElementById('status').textContent = `${playerName} Wins! 🎉`;
                        highlightWinningPieces();
                    } else if (isBoardFull()) {
                        gameOver = true;
                        document.getElementById('status').textContent = 'Draw!';
                    } else {
                        currentPlayer = currentPlayer === RED ? YELLOW : RED;
                        updateDisplay();
                    }
                    return;
                }
            }
        }

        function checkWin(row, col, player) {
            const directions = [
                [0, 1], [1, 0], [1, 1], [1, -1]
            ];
            
            for (const [dr, dc] of directions) {
                let count = 1;
                
                for (let i = 1; i < 4; i++) {
                    const r = row + dr * i;
                    const c = col + dc * i;
                    if (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] === player) {
                        count++;
                    } else {
                        break;
                    }
                }
                
                for (let i = 1; i < 4; i++) {
                    const r = row - dr * i;
                    const c = col - dc * i;
                    if (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] === player) {
                        count++;
                    } else {
                        break;
                    }
                }
                
                if (count >= 4) return true;
            }
            
            return false;
        }

        function isBoardFull() {
            for (let col = 0; col < COLS; col++) {
                if (board[0][col] === 0) return false;
            }
            return true;
        }

        function highlightWinningPieces() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                if (cell.classList.contains('red') || cell.classList.contains('yellow')) {
                    cell.classList.add('winning-cell');
                }
            });
        }

        function updateDisplay() {
            const playerName = currentPlayer === RED ? player1Game.name : player2Game.name;
            const playerColor = currentPlayer === RED ? '🔴' : '🟡';
            document.getElementById('playerDisplay').innerHTML = `${playerColor} ${playerName}`;
        }

        function resetGame() {
            initializeBoard();
            renderBoard();
            document.getElementById('status').textContent = 'In Progress';
            updateDisplay();
        }

        function showSettings() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function showInfo() { document.getElementById('infoModal').classList.remove('hidden'); }
        function closeInfo() { document.getElementById('infoModal').classList.add('hidden'); }
    </script>
</body>
</html>
