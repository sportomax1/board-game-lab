<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Game Videos</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🎬</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            height: 100%;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            max-width: none;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            padding-top: env(safe-area-inset-top, 0);
            padding-bottom: env(safe-area-inset-bottom, 0);
            padding-left: env(safe-area-inset-left, 0);
            padding-right: env(safe-area-inset-right, 0);
        }

        .header {
            flex-shrink: 0;
            padding: 1rem;
            border-bottom: 1px solid #eee;
            background: white;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            color: #333;
        }

        .setup-section {
            flex-shrink: 0;
            padding: 1rem;
            background: white;
            border-bottom: 1px solid #eee;
            max-height: 50vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .setup-input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            -webkit-appearance: none;
            appearance: none;
        }

        .setup-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn {
            padding: 0.75rem 1rem;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            font-size: 1rem;
            min-width: 50px;
        }

        .btn:active {
            opacity: 0.9;
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #333;
        }

        .btn-secondary:active {
            background: #d1d5db;
        }

        .filter-section {
            margin-bottom: 0.75rem;
        }

        .filter-title {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            color: #333;
        }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .filter-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            flex: 0 1 calc(50% - 0.25rem);
        }

        .filter-checkbox:active {
            background: #e0e0e0;
        }

        .filter-checkbox input {
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #ddd;
            border-radius: 4px;
            background: white;
            margin: 0;
        }

        .filter-checkbox input:checked {
            background: #6366f1;
            border-color: #6366f1;
        }

        .status {
            font-size: 0.85rem;
            color: #666;
            padding: 0.5rem;
            background: #f9f9f9;
            border-radius: 4px;
            text-align: center;
        }

        .status.active {
            color: #6366f1;
            font-weight: 600;
        }

        .cache-info {
            font-size: 0.75rem;
            color: #999;
            margin-top: 0.5rem;
            padding: 0.5rem;
            background: #f9f9f9;
            border-radius: 4px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .search-bar {
            flex-shrink: 0;
            padding: 0.75rem 1rem;
            background: white;
            border-bottom: 1px solid #eee;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            -webkit-appearance: none;
            appearance: none;
        }

        .search-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .games-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-height: 400px;
        }

        .game-card {
            background: white;
            border: 1px solid #eee;
            border-radius: 6px;
            padding: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .game-card:active {
            background: #e7f3ff;
            border-color: #6366f1;
            transform: scale(0.98);
        }

        .game-card.expanded {
            background: #f9f9f9;
        }

        .game-card-main {
            display: contents;
        }

        .game-card-main:active {
            background: transparent;
        }

        .game-thumbnail {
            width: 50px;
            height: 50px;
            flex-shrink: 0;
            background: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        .game-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-info {
            flex: 1;
            min-width: 0;
        }

        .game-header {
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
            margin: 0;
            word-break: break-word;
            display: -webkit-box;
            line-clamp: 1;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .game-count {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 0.5rem;
        }

        .game-videos {
            padding: 0.75rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            border-top: 1px solid #eee;
            max-height: 400px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .game-videos.hidden {
            display: none;
        }

        .video-item {
            padding: 0.75rem;
            background: white;
            border: 1px solid #eee;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .video-item:active {
            background: #e7f3ff;
            border-color: #6366f1;
        }

        .video-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: #333;
            margin-bottom: 0.25rem;
            word-break: break-word;
        }

        .video-meta {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
        }

        .video-badge {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 0.25rem 0.5rem;
            border-radius: 3px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .video-badge.instructional {
            background: #dcfce7;
            color: #166534;
        }

        .video-badge.review {
            background: #fef3c7;
            color: #92400e;
        }

        .video-badge.other {
            background: #e9d5ff;
            color: #6b21a8;
        }

        .video-user {
            font-size: 0.8rem;
            color: #666;
        }

        .video-link {
            display: inline-block;
            color: #6366f1;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0.4rem 0.75rem;
            background: #eff6ff;
            border-radius: 4px;
            border: 1px solid #bfdbfe;
        }

        .video-link:active {
            background: #dbeafe;
        }

        .no-data {
            text-align: center;
            padding: 2rem 1rem;
            color: #999;
        }

        .settings-toggle {
            flex-shrink: 0;
            padding: 0.75rem 1rem;
            background: white;
            border-bottom: 1px solid #eee;
            text-align: center;
        }

        .settings-toggle button {
            padding: 0.5rem 1rem;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .settings-toggle button:active {
            background: #e0e0e0;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-overlay.hidden {
            display: none;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 430px;
            width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid #eee;
            font-size: 1.3rem;
            font-weight: 700;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #999;
            cursor: pointer;
            padding: 0;
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .modal-close:active {
            background: #f0f0f0;
            color: #333;
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 1rem;
        }

        .modal-footer {
            padding: 1rem;
            border-top: 1px solid #eee;
            display: flex;
            gap: 0.5rem;
            background: #f9f9f9;
        }

        .modal-footer button {
            flex: 1;
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 Game Videos</h1>
        </div>

        <!-- Settings Modal -->
        <div class="modal-overlay" id="settingsModal">
            <div class="modal-content">
                <div class="modal-header">
                    ⚙️ Settings
                    <button class="modal-close" id="modalCloseBtn">✕</button>
                </div>
                <div class="modal-body">
                    <div style="margin-bottom: 1rem;">
                        <div class="filter-title">👤 Username</div>
                        <input type="text" id="usernameInput" class="setup-input" placeholder="Enter BGG username" value="sportomax">
                    </div>

                    <div class="filter-section">
                        <div class="filter-title">📦 Collection Status</div>
                        <div class="filter-group">
                            <label class="filter-checkbox">
                                <input type="checkbox" name="status" value="own" checked>
                                Own
                            </label>
                            <label class="filter-checkbox">
                                <input type="checkbox" name="status" value="wanttoplay">
                                Want to Play
                            </label>
                            <label class="filter-checkbox">
                                <input type="checkbox" name="status" value="wanttobuy">
                                Want to Buy
                            </label>
                            <label class="filter-checkbox">
                                <input type="checkbox" name="status" value="prevowned">
                                Prev. Owned
                            </label>
                        </div>
                    </div>

                    <div class="filter-section">
                        <div class="filter-title">🎥 Video Category</div>
                        <div class="filter-group">
                            <label class="filter-checkbox">
                                <input type="checkbox" name="category" value="instructional" checked>
                                Instructional
                            </label>
                            <label class="filter-checkbox">
                                <input type="checkbox" name="category" value="review" checked>
                                Review
                            </label>
                            <label class="filter-checkbox">
                                <input type="checkbox" name="category" value="preview" checked>
                                Preview
                            </label>
                            <label class="filter-checkbox">
                                <input type="checkbox" name="category" value="other" checked>
                                Other
                            </label>
                        </div>
                    </div>

                    <div class="status" id="processingStatus" style="margin-top: 1rem;"></div>
                    <div class="cache-info" id="cacheInfo"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn" id="loadBtn">📦 Load</button>
                    <button class="btn btn-secondary" id="clearBtn">🗑️ Clear</button>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="search-bar">
                <input type="text" id="searchInput" class="search-input" placeholder="Search games...">
            </div>

            <div class="games-list" id="gamesList"></div>
        </div>
    </div>

    <script>
        const STORAGE_KEY_COLLECTION = 'bgg_videos_collection';
        const STORAGE_KEY_TIMESTAMP = 'bgg_videos_timestamp';

        let allGames = [];
        let gameVideos = {};
        let currentUsername = 'sportomax';

        const usernameInput = document.getElementById('usernameInput');
        const loadBtn = document.getElementById('loadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        const processingStatus = document.getElementById('processingStatus');
        const cacheInfo = document.getElementById('cacheInfo');
        const gamesList = document.getElementById('gamesList');
        const searchInput = document.getElementById('searchInput');
        const settingsModal = document.getElementById('settingsModal');

        // Show modal on load
        function showModal() {
            settingsModal.classList.remove('hidden');
        }

        // Hide modal
        function hideModal() {
            settingsModal.classList.add('hidden');
        }

        // Load button
        loadBtn.addEventListener('click', loadCollection);

        // Close modal button
        modalCloseBtn.addEventListener('click', hideModal);

        // Clear cache
        clearBtn.addEventListener('click', () => {
            localStorage.removeItem(STORAGE_KEY_COLLECTION);
            localStorage.removeItem(STORAGE_KEY_TIMESTAMP);
            processingStatus.textContent = '✅ Cache cleared';
            processingStatus.classList.add('active');
            allGames = [];
            gameVideos = {};
            gamesList.innerHTML = '';
            cacheInfo.textContent = '';
            setTimeout(() => { processingStatus.classList.remove('active'); }, 2000);
        });

        // Search
        searchInput.addEventListener('input', renderGames);

        // Helper functions
        async function fetchWithRetry(url, maxRetries = 3) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    console.log(`📡 [API Call ${i + 1}] GET ${url}`);
                    const response = await fetch(url);
                    if (response.status === 202) {
                        console.log(`⏳ [API] Status 202 - retrying after ${2000 * (i + 1)}ms`);
                        await new Promise(resolve => setTimeout(resolve, 2000 * (i + 1)));
                        continue;
                    }
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    console.log(`✅ [API] Response received`);
                    return response;
                } catch (error) {
                    console.error(`❌ [API] Error on attempt ${i + 1}:`, error.message);
                    if (i === maxRetries - 1) throw error;
                    await new Promise(resolve => setTimeout(resolve, 1000 * (i + 1)));
                }
            }
        }

        // Get selected statuses
        function getSelectedStatuses() {
            const checkboxes = document.querySelectorAll('input[name="status"]:checked');
            return Array.from(checkboxes).map(cb => cb.value);
        }

        // Load collection
        async function loadCollection() {
            const username = usernameInput.value.trim();
            if (!username) {
                processingStatus.textContent = '❌ Please enter a username';
                processingStatus.classList.add('active');
                return;
            }

            const statuses = getSelectedStatuses();
            if (statuses.length === 0) {
                processingStatus.textContent = '❌ Select at least one status';
                processingStatus.classList.add('active');
                return;
            }

            currentUsername = username;
            localStorage.setItem('bgg_videos_username', username);

            processingStatus.classList.add('active');
            processingStatus.textContent = '📦 Loading collection...';
            console.log('🔍 Fetching collection for:', username);

            try {
                // Check cache
                const cached = localStorage.getItem(STORAGE_KEY_COLLECTION);
                if (cached) {
                    allGames = JSON.parse(cached);
                    processingStatus.textContent = `✅ Loaded ${allGames.length} games from cache. Fetching video data...`;
                    console.log('✅ Loaded collection from cache:', allGames.length, 'games');
                    updateCacheInfo();
                    // Still fetch video data fresh
                    await processGameBatches();
                    hideModal();
                } else {
                    // Fetch collection
                    const statusParams = statuses.map(s => `&${s}=1`).join('');
                    const url = `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}${statusParams}&stats=1`;
                    console.log('🔗 API URL:', url);
                    
                    const response = await fetchWithRetry(url);
                    const xml = new DOMParser().parseFromString(await response.text(), 'text/xml');
                    const items = xml.querySelectorAll('item');

                    allGames = Array.from(items).map(item => ({
                        id: item.getAttribute('objectid'),
                        name: item.querySelector('name')?.textContent || 'Unknown',
                        image: item.querySelector('image')?.textContent || ''
                    })).filter(g => g.id);

                    console.log('📦 Collection fetched:', allGames.length, 'games');
                    localStorage.setItem(STORAGE_KEY_COLLECTION, JSON.stringify(allGames));
                    processingStatus.textContent = `✅ Loaded ${allGames.length} games`;
                    updateCacheInfo();

                    // Process games in batches
                    await processGameBatches();
                    hideModal();
                }

            } catch (error) {
                processingStatus.textContent = `❌ Error: ${error.message}`;
                console.error('❌ Error:', error);
            }
        }

        // Process games in batches
        async function processGameBatches() {
            const batchSize = 20;
            let processed = 0;
            gameVideos = {};

            for (let i = 0; i < allGames.length; i += batchSize) {
                const batch = allGames.slice(i, i + batchSize);
                const ids = batch.map(g => g.id).join(',');

                try {
                    processingStatus.textContent = `🎬 Processing ${Math.min(processed + batch.length, allGames.length)}/${allGames.length} games...`;
                    console.log(`\n🔄 Batch ${Math.ceil((i + 1) / batchSize)}/${Math.ceil(allGames.length / batchSize)}: Fetching ${batch.length} games (IDs: ${ids})`);

                    const url = `/api/bgg-helper?endpoint=thing&id=${ids}&type=boardgame&videos=1`;
                    const response = await fetchWithRetry(url);
                    const xml = new DOMParser().parseFromString(await response.text(), 'text/xml');
                    const items = xml.querySelectorAll('item');

                    let batchVideos = 0;
                    Array.from(items).forEach(item => {
                        const gameId = item.getAttribute('id');
                        const game = allGames.find(g => g.id === gameId);
                        if (!game) return;

                        const videosEl = item.querySelector('videos');
                        if (videosEl) {
                            const videos = Array.from(videosEl.querySelectorAll('video')).map(v => ({
                                id: v.getAttribute('id'),
                                title: v.getAttribute('title'),
                                category: v.getAttribute('category') || 'other',
                                language: v.getAttribute('language') || 'Unknown',
                                link: v.getAttribute('link'),
                                username: v.getAttribute('username'),
                                postdate: v.getAttribute('postdate'),
                                thumbnail: v.getAttribute('thumbnail') || ''
                            }));

                            if (videos.length > 0) {
                                gameVideos[gameId] = {
                                    name: game.name,
                                    image: game.image,
                                    videos: videos
                                };
                                batchVideos++;
                                console.log(`  ✅ Found videos for game ${gameId} (${game.name}): ${videos.length} videos`);
                            } else {
                                console.log(`  ⚠️ Empty videos element for game ${gameId} (${game.name})`);
                            }
                        } else {
                            console.log(`  ⚠️ No <videos> element found for game ${gameId} (${game.name})`);
                        }
                    });

                    console.log(`📊 Batch result: ${batchVideos}/${batch.length} games had videos\n`);
                    processed += batch.length;
                    renderGames();

                } catch (error) {
                    console.error(`❌ Error processing batch at ${i}:`, error);
                    processingStatus.textContent = `⚠️ Error in batch: ${error.message}`;
                }

                await new Promise(resolve => setTimeout(resolve, 200));
            }

            localStorage.setItem(STORAGE_KEY_TIMESTAMP, new Date().toISOString());

            const resultText = `✅ Done! Found ${Object.keys(gameVideos).length} games with videos`;
            processingStatus.textContent = resultText;
            console.log(resultText);
            hideModal();
            setTimeout(() => { processingStatus.classList.remove('active'); }, 3000);
        }

        // Get selected categories
        function getSelectedCategories() {
            const checkboxes = document.querySelectorAll('input[name="category"]:checked');
            return Array.from(checkboxes).map(cb => cb.value);
        }

        // Render games
        function renderGames() {
            const searchTerm = searchInput.value.toLowerCase();
            const selectedCategories = getSelectedCategories();
            
            // If no games loaded yet, show loading state
            if (Object.keys(gameVideos).length === 0) {
                console.log('⏳ No games loaded yet, skipping render');
                gamesList.innerHTML = '<div class="no-data">📦 Loading... Click "Load" to fetch video data</div>';
                return;
            }

            const games = Object.entries(gameVideos)
                .filter(([gameId, game]) => {
                    if (!game.name.toLowerCase().includes(searchTerm)) return false;
                    return game.videos.some(v => selectedCategories.includes(v.category));
                })
                .sort((a, b) => a[1].name.localeCompare(b[1].name));

            if (games.length === 0) {
                gamesList.innerHTML = '<div class="no-data">No games with videos found</div>';
                return;
            }

            gamesList.innerHTML = games.map(([gameId, game]) => {
                const filteredVideos = game.videos.filter(v => selectedCategories.includes(v.category));

                return `
                    <div class="game-card" data-game-id="${gameId}">
                        <div class="game-card-main">
                            <div class="game-thumbnail">
                                ${game.image ? `<img src="/api/image-proxy?url=${encodeURIComponent(game.image)}" alt="" onerror="this.style.display='none';">` : '<div style="width: 100%; height: 100%; background: #f0f0f0; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #999;">🎬</div>'}
                            </div>
                            <div class="game-info">
                                <div class="game-header">${escapeHtml(game.name)}</div>
                                <span class="game-count">🎬 ${filteredVideos.length}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Get category emoji
        function getCategoryEmoji(category) {
            const emojis = {
                instructional: '📚',
                review: '⭐',
                preview: '👀',
                other: '🎥'
            };
            return emojis[category] || '🎥';
        }

        // Capitalize first
        function capitalizeFirst(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        // Update cache info
        function updateCacheInfo() {
            // Only show username, not cache info
            cacheInfo.textContent = `👤 Username: ${currentUsername} | 📦 Collection: ${allGames.length} games`;
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize
        window.addEventListener('load', () => {
            const savedUsername = localStorage.getItem('bgg_videos_username');
            if (savedUsername) {
                usernameInput.value = savedUsername;
            }
            updateCacheInfo();
            console.log('🎬 Videos app loaded');
            showModal();
        });
    </script>
</body>
</html>
