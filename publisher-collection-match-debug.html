<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publisher Collection Match Debug</title><style>body{font-family:Arial,sans-serif;background:#0b1120;color:#f1f5f9;margin:0;padding:24px}h1{font-size:34px;margin:0 0 8px}.card{background:#111827;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:18px;margin:14px 0}label{display:block;font-size:12px;color:#94a3b8;margin:10px 0 5px;text-transform:uppercase;font-weight:bold}input,button{padding:11px;border-radius:10px;border:1px solid rgba(255,255,255,.15);font-size:14px}input{background:#1a2236;color:white;width:260px;max-width:100%}button{background:#6366f1;color:white;font-weight:bold;cursor:pointer}button.secondary{background:#1a2236;color:#cbd5e1}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#1a2236;border-radius:14px;padding:14px}.num{font-size:28px;font-weight:900}.muted{color:#94a3b8}#log{background:#020617;color:#cbd5e1;white-space:pre-wrap;font-family:Consolas,monospace;font-size:12px;line-height:1.45;max-height:380px;overflow:auto}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border-bottom:1px solid rgba(255,255,255,.08);padding:10px;text-align:left;font-size:13px}th{color:#94a3b8;text-transform:uppercase;font-size:11px}a{color:#a5b4fc}.pill{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:bold}.owned{background:#064e3b;color:#bbf7d0}.want{background:#78350f;color:#fde68a}.missing{background:#7f1d1d;color:#fecaca}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}} </style></head><body><h1>🏭 Publisher Collection Match Debug</h1><div class="muted">Calls BGG publisher + collection APIs through /api/bgg-helper and logs every step on screen.</div><div class="card"><label>Publisher ID</label><input id="pub" placeholder="Example: 3"><label>BGG Collection Username</label><input id="user" value="sportomax"><div style="margin-top:14px"><button onclick="run()">Run Match</button> <button class="secondary" onclick="copyLog()">Copy Logs</button> <button class="secondary" onclick="clearLog()">Clear Logs</button></div><div id="status" class="muted" style="margin-top:12px">Ready.</div></div><div class="stats"><div class="stat"><div id="sPub" class="num">0</div><div class="muted">Publisher Games</div></div><div class="stat"><div id="sOwned" class="num">0</div><div class="muted">Owned</div></div><div class="stat"><div id="sWant" class="num">0</div><div class="muted">Wishlist / Want</div></div><div class="stat"><div id="sMissing" class="num">0</div><div class="muted">Missing</div></div></div><div class="card"><h3>🛠 On-Screen Logs</h3><div id="log">Logs will show here.</div></div><div class="card"><h3>Results</h3><table><thead><tr><th>Game</th><th>BGG ID</th><th>Status</th><th>Flags</th><th>Year</th><th>Link</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="muted">No results yet.</td></tr></tbody></table></div><script>let logs=[],data=[];const helper='/api/bgg-helper';function line(m){const x='['+new Date().toLocaleTimeString()+'] '+m;logs.push(x);document.getElementById('log').textContent=logs.join('\n');document.getElementById('log').scrollTop=999999;console.log(x)}function clearLog(){logs=[];document.getElementById('log').textContent='Logs cleared.'}function copyLog(){navigator.clipboard&&navigator.clipboard.writeText(logs.join('\n'));document.getElementById('status').textContent='Copied logs.'}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function parseXml(t){return new DOMParser().parseFromString(t,'text/xml')}async function get(url,name){line('URL '+name+': '+url);line('Calling '+name+'...');const r=await fetch(url);const t=await r.text();line(name+' HTTP '+r.status+' chars='+t.length);line('Preview '+name+': '+t.slice(0,300).replace(/\s+/g,' '));if(!r.ok)throw new Error(name+' failed '+r.status+': '+t.slice(0,180));if(t.trim().startsWith('{'))throw new Error(name+' returned JSON instead of XML: '+t.slice(0,180));return t}function attr(n,a){return n&&n.getAttribute(a)||''}function txt(n,s){const f=n.querySelector(s);return f?f.textContent.trim():''}function pubGames(t){const doc=parseXml(t);const nodes=[...doc.querySelectorAll('boardgame')];line('Publisher boardgame nodes='+nodes.length);const seen=new Set(),out=[];nodes.forEach(g=>{const id=attr(g,'objectid')||attr(g,'id');if(!id||seen.has(id))return;seen.add(id);const primary=[...g.querySelectorAll('name')].find(n=>attr(n,'primary')==='true');const name=(primary||g.querySelector('name'))?.textContent?.trim()||('BGG '+id);out.push({id,name,year:txt(g,'yearpublished')})});line('Parsed publisher games='+out.length);if(out.length)line('Samples: '+out.slice(0,5).map(g=>g.id+': '+g.name).join(' | '));return out}function collection(t){const doc=parseXml(t);const items=[...doc.querySelectorAll('item')];line('Collection item nodes='+items.length);const map=new Map();items.forEach(i=>{const id=attr(i,'objectid');const s=i.querySelector('status');if(!id)return;const f={own:attr(s,'own')==='1',wishlist:attr(s,'wishlist')==='1',wanttobuy:attr(s,'wanttobuy')==='1',wanttoplay:attr(s,'wanttoplay')==='1',preordered:attr(s,'preordered')==='1',fortrade:attr(s,'fortrade')==='1'};map.set(id,{id,name:txt(i,'name'),year:txt(i,'yearpublished'),flags:f})});line('Parsed collection items='+map.size);return map}function flags(f){if(!f)return'';let a=[];if(f.own)a.push('Owned');if(f.wishlist)a.push('Wishlist');if(f.wanttobuy)a.push('Want Buy');if(f.wanttoplay)a.push('Want Play');if(f.preordered)a.push('Preordered');if(f.fortrade)a.push('For Trade');return a.join(', ')}function status(f){if(!f)return'Missing';if(f.own)return'Owned';if(f.wishlist||f.wanttobuy||f.wanttoplay||f.preordered)return'Wishlist / Want';return'In Collection'}function pill(s){if(s==='Owned')return'<span class="pill owned">Owned</span>';if(s==='Wishlist / Want')return'<span class="pill want">Wishlist / Want</span>';if(s==='Missing')return'<span class="pill missing">Missing</span>';return'<span class="pill">In Collection</span>'}async function run(){clearLog();const p=document.getElementById('pub').value.trim(),u=document.getElementById('user').value.trim();line('Starting match');line('Publisher ID='+p);line('Username='+u);if(!p||!u){line('ERROR missing input');return}document.getElementById('status').textContent='Running...';try{const pubRaw='https://boardgamegeek.com/xmlapi/boardgamepublisher/'+encodeURIComponent(p);const pubUrl=helper+'?endpoint=page&url='+encodeURIComponent(pubRaw);const colUrl=helper+'?endpoint=collection&username='+encodeURIComponent(u)+'&stats=1&own=1&wishlist=1&wanttobuy=1&wanttoplay=1';const px=await get(pubUrl,'Publisher API');const cx=await get(colUrl,'Collection API');const games=pubGames(px);const col=collection(cx);line('Joining on objectid...');data=games.map(g=>{const c=col.get(g.id),f=c&&c.flags;return{id:g.id,name:g.name,year:g.year||(c&&c.year)||'',status:status(f),flags:flags(f)}});const owned=data.filter(r=>r.status==='Owned').length,want=data.filter(r=>r.status==='Wishlist / Want').length,missing=data.filter(r=>r.status==='Missing').length;line('Join complete. Publisher='+games.length+' Collection='+col.size+' Owned='+owned+' Want='+want+' Missing='+missing);document.getElementById('sPub').textContent=games.length;document.getElementById('sOwned').textContent=owned;document.getElementById('sWant').textContent=want;document.getElementById('sMissing').textContent=missing;render();document.getElementById('status').textContent='Done.'}catch(e){line('ERROR: '+(e.message||e));document.getElementById('status').textContent='Error: '+(e.message||e)}}function render(){const body=document.getElementById('rows');if(!data.length){body.innerHTML='<tr><td colspan="6">No rows.</td></tr>';return}body.innerHTML=data.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+esc(r.id)+'</td><td>'+pill(r.status)+'</td><td>'+esc(r.flags||'—')+'</td><td>'+esc(r.year||'—')+'</td><td><a target="_blank" href="https://boardgamegeek.com/boardgame/'+encodeURIComponent(r.id)+'">BGG</a></td></tr>').join('')}</script></body></html>
