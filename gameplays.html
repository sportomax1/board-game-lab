<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board Game Data Lab</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #64748b;
            --success: #107c10;
            --danger: #d11a2a;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
        }

        /* Sidebar - Saved Sets */
        .sidebar {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .sidebar h2 { font-size: 1.1rem; margin-top: 0; color: var(--secondary); }

        .saved-list {
            list-style: none;
            padding: 0;
            margin: 15px 0;
        }

        .saved-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid var(--border);
            gap: 10px;
            font-size: 0.9rem;
        }

        .saved-item:hover { background: #f1f5f9; }

        .saved-item input[type="checkbox"] { cursor: pointer; }

        .item-name { flex-grow: 1; cursor: pointer; font-weight: 500; }

        .btn-icon {
            background: none; border: none; cursor: pointer; color: var(--secondary);
            padding: 4px; border-radius: 4px;
        }
        .btn-icon:hover { background: #e2e8f0; color: var(--danger); }

        /* Main Content */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .input-header {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
        }

        textarea { height: 120px; font-family: monospace; resize: vertical; background: #f1f5f9; }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
        .btn-outline { background: none; border: 1px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: #eff6ff; }

        /* Table & Controls */
        .table-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .compare-tools {
            display: flex;
            gap: 10px;
            background: #eff6ff;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            align-items: center;
        }

        table { width: 100%; border-collapse: collapse; }
        th { 
            text-align: left; padding: 12px; background: #f8fafc; 
            border-bottom: 2px solid var(--border); cursor: pointer;
            font-size: 0.8rem; text-transform: uppercase;
        }
        th:hover { color: var(--primary); }
        td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 0.95rem; }

        .count-tag {
            background: #dcfce7; color: #166534; padding: 2px 8px;
            border-radius: 10px; font-size: 0.8rem; font-weight: bold;
        }

        .badge-compare {
            font-size: 0.7rem; padding: 2px 6px; border-radius: 4px;
            margin-left: 8px; vertical-align: middle;
        }

        @media (max-width: 800px) {
            .app-container { grid-template-columns: 1fr; }
            .sidebar { position: static; }
        }

        /* ── Password screen ── */
        .password-screen { position: fixed; inset: 0; z-index: 1000; background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%); display: flex; align-items: center; justify-content: center; padding: 20px; }
        .password-box { background: #fff; border-radius: 16px; padding: 40px 32px; width: 100%; max-width: 380px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.4); text-align: center; }
        .password-box h1 { margin: 0 0 6px; font-size: 1.6rem; color: #1e293b; }
        .password-box p { color: #64748b; font-size: 0.875rem; margin: 0 0 24px; }
        .pw-field { margin-bottom: 14px; text-align: left; }
        .pw-field label { display: block; font-size: 0.7rem; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.05em; }
        .pw-field input { width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 1rem; outline: none; box-sizing: border-box; transition: border-color .2s; }
        .pw-field input:focus { border-color: #2563eb; }
        .pw-error { color: #d11a2a; font-size: 0.8rem; min-height: 18px; margin-bottom: 10px; }
        .btn-unlock { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background .2s; }
        .btn-unlock:hover { background: #1d4ed8; }
        .btn-unlock:disabled { background: #94a3b8; cursor: not-allowed; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Password Screen -->
    <div id="passwordScreen" class="password-screen">
        <div class="password-box">
            <h1>🎲 BGA Data Lab</h1>
            <p>Enter your password to access your datasets</p>
            <div class="pw-error" id="unlockError"></div>
            <div class="pw-field">
                <label>Password</label>
                <input type="password" id="unlockPassword" placeholder="Enter password" onkeypress="if(event.key==='Enter')unlockApp()" autofocus>
            </div>
            <button class="btn-unlock" id="unlockBtn" onclick="unlockApp()">Unlock</button>
        </div>
    </div>

    <div id="appContainer" class="app-container" style="display:none">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h2 style="display:flex;align-items:center;justify-content:space-between;margin-top:0">Saved Datasets <span id="syncBadge" style="font-size:0.65rem;font-weight:600;color:#94a3b8;background:#f1f5f9;padding:2px 8px;border-radius:10px">Local</span></h2>
            <p style="font-size: 0.75rem; color: #94a3b8;">Select 2 or more to compare</p>
            <ul id="saved-list" class="saved-list">
                <!-- Items populated by JS -->
            </ul>
            <div id="compare-actions" style="display: none;">
                <button class="btn btn-outline" style="width: 100%;" onclick="compareData('match')">Find Common Games</button>
                <button class="btn btn-outline" style="width: 100%; margin-top: 8px;" onclick="compareData('diff')">Show Unique Games</button>
            </div>
        </aside>

        <!-- Main -->
        <main class="main-content">
            <div class="card" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 25px;">
                <div style="font-size: 0.9rem; font-weight: 600; color: var(--secondary);">Source: Board Game Arena</div>
                <button class="btn btn-outline" onclick="copyBGALink(this)" style="padding: 6px 12px; font-size: 0.8rem;">
                    🔗 Copy BGA Stats Link
                </button>
            </div>

            <div class="card">
                <div class="input-header">
                    <input type="text" id="dataset-name" placeholder="Name this dataset (e.g., My Collection 2026)">
                    <button class="btn" onclick="saveNewDataset()">Save Dataset</button>
                </div>
                <textarea id="raw-input" placeholder="Paste data here:&#10;Captain Flip: 181 games&#10;Azul: 82 games..."></textarea>
            </div>

            <div class="card">
                <div class="table-controls">
                    <input type="text" id="search" placeholder="Filter current view..." oninput="refreshTable()">
                    <div style="font-size: 0.85rem;">
                        Total: <b id="stat-total">0</b> games
                    </div>
                </div>

                <div id="table-wrapper">
                    <p style="text-align: center; color: #94a3b8; padding: 40px;">No data loaded. Select a set or paste and save a new one.</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        let datasets = JSON.parse(localStorage.getItem('boardGameDataSets') || '{}');
        let currentView = []; // The data currently being shown
        let sortCol = 'count';
        let sortDir = 'desc';
        let dbClient = null;
        let owner = '';

        const datasetColors = [
            '#2563eb', '#107c10', '#d11a2a', '#9333ea', '#ea580c', '#0d9488', '#db2777', '#7c3aed'
        ];

        function getColor(name) {
            const names = Object.keys(datasets);
            const index = names.indexOf(name);
            return datasetColors[index % datasetColors.length];
        }

        function init() {
            renderSavedList();
        }

        async function unlockApp() {
            const pw = document.getElementById('unlockPassword').value.trim();
            const errEl = document.getElementById('unlockError');
            const btn = document.getElementById('unlockBtn');
            if (!pw) { errEl.textContent = 'Please enter a password.'; return; }
            errEl.textContent = '';
            btn.disabled = true;
            btn.textContent = 'Connecting...';
            try {
                const cfgResp = await fetch('/api/supabase-config');
                if (!cfgResp.ok) throw new Error('Could not load server config.');
                const cfg = await cfgResp.json();
                dbClient = window.supabase.createClient(cfg.url, cfg.anonKey);
                owner = pw;
                document.getElementById('passwordScreen').style.display = 'none';
                document.getElementById('appContainer').style.display = '';
                const badge = document.getElementById('syncBadge');
                badge.textContent = '☁ Synced';
                badge.style.color = '#107c10';
                badge.style.background = '#dcfce7';
                await loadFromSupabase();
            } catch(e) {
                errEl.textContent = e.message || 'Connection failed.';
                btn.disabled = false;
                btn.textContent = 'Unlock';
            }
        }

        async function loadFromSupabase() {
            if (!dbClient) return;
            try {
                const { data, error } = await dbClient
                    .from('bga_datasets')
                    .select('name, data')
                    .eq('owner', owner)
                    .order('created_at', { ascending: false });
                if (error) throw error;
                if (data && data.length > 0) {
                    data.forEach(row => { datasets[row.name] = row.data; });
                    localStorage.setItem('boardGameDataSets', JSON.stringify(datasets));
                }
            } catch(e) {
                console.error('Supabase load:', e);
            }
            renderSavedList();
        }

        // --- DATA PARSING ---
        function parseInput(text) {
            const lines = text.split('\n');
            const data = [];
            lines.forEach(line => {
                const match = line.match(/(.*?):\s*(\d+)\s*games/i);
                if (match) {
                    data.push({ name: match[1].trim(), count: parseInt(match[2]) });
                }
            });
            return data;
        }

        // --- STORAGE & UI ---
        async function saveNewDataset() {
            const name = document.getElementById('dataset-name').value.trim();
            const input = document.getElementById('raw-input').value.trim();
            
            if (!name || !input) {
                alert("Please provide both a name and data.");
                return;
            }

            const data = parseInput(input);
            if (data.length === 0) {
                alert("Could not find any game data in the input. Format should be 'Game: X games'.");
                return;
            }

            datasets[name] = data;
            localStorage.setItem('boardGameDataSets', JSON.stringify(datasets));

            if (dbClient && owner) {
                try {
                    const { error } = await dbClient.from('bga_datasets')
                        .upsert({ owner, name, data }, { onConflict: 'owner,name' });
                    if (error) throw error;
                } catch(e) { console.error('Supabase save:', e); }
            }

            document.getElementById('dataset-name').value = '';
            document.getElementById('raw-input').value = '';
            
            renderSavedList();
            loadDataset(name);
        }

        async function deleteDataset(name) {
            if (confirm(`Delete '${name}'?`)) {
                delete datasets[name];
                localStorage.setItem('boardGameDataSets', JSON.stringify(datasets));
                if (dbClient && owner) {
                    try {
                        const { error } = await dbClient.from('bga_datasets').delete()
                            .eq('owner', owner).eq('name', name);
                        if (error) throw error;
                    } catch(e) { console.error('Supabase delete:', e); }
                }
                renderSavedList();
            }
        }

        function renderSavedList() {
            const list = document.getElementById('saved-list');
            list.innerHTML = '';
            
            Object.keys(datasets).forEach(name => {
                const color = getColor(name);
                const li = document.createElement('li');
                li.className = 'saved-item';
                li.innerHTML = `
                    <input type="checkbox" class="compare-check" data-name="${name}" onchange="toggleCompareUI()">
                    <span style="width:12px; height:12px; border-radius:50%; background:${color}; flex-shrink:0;"></span>
                    <span class="item-name" onclick="loadDataset('${name}')">${name}</span>
                    <button class="btn-icon" onclick="deleteDataset('${name}')">✕</button>
                `;
                list.appendChild(li);
            });
            toggleCompareUI();
        }

        function loadDataset(name) {
            currentView = [...datasets[name]].map(item => ({...item, origin: name}));
            refreshTable();
        }

        // --- LOGIC: COMPARE & FILTER ---
        function toggleCompareUI() {
            const checked = document.querySelectorAll('.compare-check:checked');
            document.getElementById('compare-actions').style.display = checked.length >= 2 ? 'block' : 'none';
        }

        function compareData(type) {
            const selectedNames = Array.from(document.querySelectorAll('.compare-check:checked')).map(el => el.dataset.name);
            const selectedSets = selectedNames.map(n => datasets[n]);
            
            if (type === 'match') {
                // Intersection: Games present in ALL selected sets
                let common = [...selectedSets[0]];
                for (let i = 1; i < selectedSets.length; i++) {
                    const otherSetNames = new Set(selectedSets[i].map(g => g.name.toLowerCase()));
                    common = common.filter(g => otherSetNames.has(g.name.toLowerCase()));
                }
                currentView = common.map(g => ({...g, origin: 'Common to all'}));
            } else {
                // Difference: Games unique to exactly one set among selected
                const allGamesMap = new Map(); // name -> list of origins
                selectedNames.forEach(setName => {
                    datasets[setName].forEach(g => {
                        const key = g.name.toLowerCase();
                        if (!allGamesMap.has(key)) allGamesMap.set(key, { game: g, origins: [] });
                        allGamesMap.get(key).origins.push(setName);
                    });
                });

                currentView = [];
                allGamesMap.forEach((val, key) => {
                    if (val.origins.length === 1) {
                        currentView.push({ ...val.game, origin: val.origins[0] });
                    }
                });
            }
            refreshTable();
        }

        // --- TABLE RENDERING ---
        function sortTable(col) {
            if (sortCol === col) {
                sortDir = sortDir === 'asc' ? 'desc' : 'asc';
            } else {
                sortCol = col;
                sortDir = 'desc';
            }
            refreshTable();
        }

        function refreshTable() {
            const query = document.getElementById('search').value.toLowerCase();
            let data = currentView.filter(g => g.name.toLowerCase().includes(query));

            // Sort
            data.sort((a, b) => {
                let valA = a[sortCol];
                let valB = b[sortCol];
                if (typeof valA === 'string') {
                    return sortDir === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
                }
                return sortDir === 'asc' ? valA - valB : valB - valA;
            });

            renderTable(data);
        }

        function renderTable(data) {
            const wrapper = document.getElementById('table-wrapper');
            document.getElementById('stat-total').innerText = data.length;

            if (data.length === 0) {
                wrapper.innerHTML = '<p style="text-align: center; color: #94a3b8; padding: 40px;">No results found.</p>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th onclick="sortTable('name')">Game Name ${sortCol === 'name' ? (sortDir === 'asc' ? '▲' : '▼') : ''}</th>
                            <th onclick="sortTable('count')" style="text-align: right;">Plays ${sortCol === 'count' ? (sortDir === 'asc' ? '▲' : '▼') : ''}</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.forEach(g => {
                const color = g.origin === 'Common to all' ? '#64748b' : getColor(g.origin);
                html += `
                    <tr>
                        <td>
                            ${g.name}
                            ${g.origin ? `<span class="badge-compare" style="background:${color}22; color:${color}; border:1px solid ${color}44">${g.origin}</span>` : ''}
                        </td>
                        <td style="text-align: right;"><span class="count-tag">${g.count}</span></td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            wrapper.innerHTML = html;
        }

        function copyBGALink(btn) {
            const url = "https://boardgamearena.com/gamestats?player=85550432&opponent_id=0&finished=1";
            navigator.clipboard.writeText(url).then(() => {
                const originalText = btn.innerHTML;
                btn.innerHTML = "✅ Copied!";
                btn.style.borderColor = "var(--success)";
                btn.style.color = "var(--success)";
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.borderColor = "";
                    btn.style.color = "";
                }, 2000);
            });
        }

        init();
    </script>
</body>
</html>
