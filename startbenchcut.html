<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Start Bench Cut - BGG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { padding: max(env(safe-area-inset-top), 0) max(env(safe-area-inset-right), 0) max(env(safe-area-inset-bottom), 0) max(env(safe-area-inset-left), 0); }
        input, select, button { font-size: 16px; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <div id="settingsModal" class="fixed inset-0 bg-gradient-to-br from-green-900 to-yellow-900 z-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-3xl shadow-2xl p-6 md:p-8 max-w-md w-full my-4">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-2 text-center">🏈 Start/Bench/Cut</h1>
            <p class="text-gray-500 text-center text-base mb-6">Rank your games!</p>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">BGG Username</label>
                    <input type="text" id="username" class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 focus:border-green-500 outline-none" value="sportomax">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Games per Category</label>
                    <select id="perCategory" class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 focus:border-green-500 outline-none">
                        <option value="1">1 per category</option>
                        <option value="2">2 per category</option>
                        <option value="3" selected>3 per category</option>
                        <option value="5">5 per category</option>
                    </select>
                </div>
                <button onclick="startGame()" class="w-full bg-green-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-green-700 transition shadow-lg">Start Game</button>
            </div>
        </div>
    </div>
    <div id="infoModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-6 max-w-md w-full">
            <h2 class="text-2xl font-bold text-gray-900 mb-4">ℹ️ How to Play</h2>
            <div class="space-y-3 text-gray-700">
                <p>• <strong class="text-green-600">Start</strong> - Must play games</p>
                <p>• <strong class="text-yellow-600">Bench</strong> - Sometimes play</p>
                <p>• <strong class="text-red-600">Cut</strong> - Never play</p>
                <p>• Drag games into categories or click to move</p>
                <p>• Fill each category with set number of games</p>
            </div>
            <button onclick="closeInfo()" class="w-full mt-6 bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700">Got it!</button>
        </div>
    </div>
    <div id="app" class="hidden flex-1 flex flex-col">
        <header class="bg-white shadow-sm sticky top-0 z-30 px-4 py-3">
            <div class="max-w-6xl mx-auto flex items-center justify-between">
                <h1 class="font-bold text-xl text-gray-900">🏈 Start/Bench/Cut</h1>
                <div class="flex gap-2">
                    <button onclick="showInfo()" class="p-2 text-green-500 hover:bg-green-50 rounded-lg">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"/><path stroke-linecap="round" d="M12 16v-4m0-4h.01"/></svg>
                    </button>
                    <button onclick="showSettings()" class="p-2 text-gray-500 hover:bg-gray-100 rounded-lg">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    </button>
                </div>
            </div>
        </header>
        <main class="flex-1 p-4 max-w-6xl mx-auto w-full">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <div class="bg-gradient-to-br from-green-50 to-green-100 rounded-xl shadow-sm border-2 border-green-300 p-4">
                    <h2 class="font-bold text-lg text-green-800 mb-3">✅ Start (<span id="startCount">0</span>/<span id="startMax">3</span>)</h2>
                    <div id="startList" class="space-y-2 min-h-[100px]"></div>
                </div>
                <div class="bg-gradient-to-br from-yellow-50 to-yellow-100 rounded-xl shadow-sm border-2 border-yellow-300 p-4">
                    <h2 class="font-bold text-lg text-yellow-800 mb-3">⏸️ Bench (<span id="benchCount">0</span>/<span id="benchMax">3</span>)</h2>
                    <div id="benchList" class="space-y-2 min-h-[100px]"></div>
                </div>
                <div class="bg-gradient-to-br from-red-50 to-red-100 rounded-xl shadow-sm border-2 border-red-300 p-4">
                    <h2 class="font-bold text-lg text-red-800 mb-3">❌ Cut (<span id="cutCount">0</span>/<span id="cutMax">3</span>)</h2>
                    <div id="cutList" class="space-y-2 min-h-[100px]"></div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border-2 border-gray-200 p-4">
                <h2 class="font-bold text-lg text-gray-900 mb-3">Available Games</h2>
                <div id="availableList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2"></div>
            </div>
            <button onclick="newRound()" class="w-full mt-4 bg-purple-500 text-white py-3 rounded-lg font-bold hover:bg-purple-600">🔄 New Round</button>
        </main>
    </div>
    <script>
        let collection = [];
        let available = [];
        let start = [];
        let bench = [];
        let cut = [];
        let perCategory = 3;

        async function startGame() {
            const username = document.getElementById('username').value.trim() || 'sportomax';
            perCategory = parseInt(document.getElementById('perCategory').value);
            document.getElementById('settingsModal').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('startMax').textContent = perCategory;
            document.getElementById('benchMax').textContent = perCategory;
            document.getElementById('cutMax').textContent = perCategory;
            try {
                const res = await fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&subtype=boardgame&stats=1`);
                const xml = await res.text();
                const parser = new DOMParser().parseFromString(xml, 'text/xml');
                const items = Array.from(parser.querySelectorAll('item'));
                collection = items.map(item => ({
                    id: item.getAttribute('objectid'),
                    name: item.querySelector('name').textContent,
                    image: item.querySelector('thumbnail')?.textContent || ''
                }));
                newRound();
            } catch (error) {
                alert('Error: ' + error.message);
                location.reload();
            }
        }

        function newRound() {
            start = [];
            bench = [];
            cut = [];
            const shuffled = [...collection].sort(() => Math.random() - 0.5);
            available = shuffled.slice(0, perCategory * 3);
            render();
        }

        function render() {
            document.getElementById('startCount').textContent = start.length;
            document.getElementById('benchCount').textContent = bench.length;
            document.getElementById('cutCount').textContent = cut.length;
            
            const renderGame = (game) => `
                <div class="bg-white rounded-lg p-3 shadow-sm border border-gray-200 flex items-center gap-2">
                    ${game.image ? `<img src="${game.image}" class="w-12 h-12 rounded object-cover">` : ''}
                    <span class="flex-1 text-sm font-medium">${game.name}</span>
                </div>
            `;
            
            document.getElementById('startList').innerHTML = start.map(renderGame).join('') || '<p class="text-gray-400 text-sm">Empty</p>';
            document.getElementById('benchList').innerHTML = bench.map(renderGame).join('') || '<p class="text-gray-400 text-sm">Empty</p>';
            document.getElementById('cutList').innerHTML = cut.map(renderGame).join('') || '<p class="text-gray-400 text-sm">Empty</p>';
            
            document.getElementById('availableList').innerHTML = available.map((game, idx) => `
                <button onclick="selectGame(${idx})" class="bg-gray-100 hover:bg-gray-200 rounded-lg p-3 text-left border-2 border-gray-300 transition">
                    <div class="font-bold text-sm mb-1">${game.name}</div>
                    <div class="flex gap-1">
                        <button onclick="event.stopPropagation(); moveToStart(${idx})" class="flex-1 bg-green-500 text-white text-xs py-1 rounded hover:bg-green-600">Start</button>
                        <button onclick="event.stopPropagation(); moveToBench(${idx})" class="flex-1 bg-yellow-500 text-white text-xs py-1 rounded hover:bg-yellow-600">Bench</button>
                        <button onclick="event.stopPropagation(); moveToCut(${idx})" class="flex-1 bg-red-500 text-white text-xs py-1 rounded hover:bg-red-600">Cut</button>
                    </div>
                </button>
            `).join('');
        }

        function moveToStart(idx) {
            if (start.length >= perCategory) return alert('Start is full!');
            start.push(available[idx]);
            available.splice(idx, 1);
            render();
        }

        function moveToBench(idx) {
            if (bench.length >= perCategory) return alert('Bench is full!');
            bench.push(available[idx]);
            available.splice(idx, 1);
            render();
        }

        function moveToCut(idx) {
            if (cut.length >= perCategory) return alert('Cut is full!');
            cut.push(available[idx]);
            available.splice(idx, 1);
            render();
            if (available.length === 0) {
                setTimeout(() => alert('Round complete! Starting new round...'), 300);
                setTimeout(newRound, 1000);
            }
        }

        function selectGame(idx) {
            const category = prompt('Move to: Start (s), Bench (b), or Cut (c)?').toLowerCase();
            if (category === 's') moveToStart(idx);
            else if (category === 'b') moveToBench(idx);
            else if (category === 'c') moveToCut(idx);
        }

        function showSettings() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function showInfo() { document.getElementById('infoModal').classList.remove('hidden'); }
        function closeInfo() { document.getElementById('infoModal').classList.add('hidden'); }
    </script>
</body>
</html>
