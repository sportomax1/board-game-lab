<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>PubRank — Pairwise Thumbnail Ranking Simulator</title>
    <style>
        body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#071034;color:#e6eef8;margin:0;padding:18px}
        .wrap{max-width:1100px;margin:0 auto}
        header{display:flex;align-items:center;gap:12px}
        h1{margin:0;font-size:20px}
        .controls{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;background:rgba(255,255,255,0.03);padding:12px;border-radius:10px}
        input,select{padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:inherit}
        .btn{background:linear-gradient(90deg,#7c3aed,#4f46e5);border:none;padding:9px 12px;border-radius:8px;color:white;cursor:pointer}
        .btn-secondary{background:transparent;border:1px solid rgba(255,255,255,0.06);color:#cfe3ff;padding:8px;border-radius:8px}
        .panel{margin-top:12px;background:rgba(255,255,255,0.02);padding:12px;border-radius:10px}
        .thumb{width:72px;height:100px;object-fit:cover;border-radius:6px;box-shadow:0 6px 18px rgba(2,6,23,0.6)}
        table{width:100%;border-collapse:collapse;margin-top:8px}
        th,td{padding:6px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.03)}
        .pair{display:flex;gap:12px;align-items:center}
        .pair .side{display:flex;flex-direction:column;align-items:center}
        .log{height:160px;overflow:auto;background:rgba(0,0,0,0.15);padding:8px;border-radius:6px;font-size:13px}
        .small{font-size:13px;color:#9fb7ff}
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <h1>PubRank — Pairwise Thumbnail Ranking Simulator</h1>
            <div style="flex:1"></div>
        </header>

        <div class="controls">
            <div>
                <label class="small">BGG Username</label><br>
                <input id="username" value="sportomax">
            </div>
            <div>
                <label class="small">Min plays</label><br>
                <input id="minPlays" value="1" style="width:80px">
            </div>
            <div>
                <label class="small">Min avg rating</label><br>
                <input id="minRating" value="0" style="width:80px">
            </div>
            <div>
                <label class="small">Top by rating (0 = all)</label><br>
                <input id="topByRating" value="0" style="width:80px">
            </div>
            <div>
                <label class="small"><input id="excludeExpansions" type="checkbox" checked> Exclude expansions</label>
            </div>
            <div>
                <label class="small"><input id="useRatingBias" type="checkbox"> Use rating bias for pairing</label>
            </div>
            <div>
                <label class="small">Model</label><br>
                <select id="model">
                    <option value="elo">ELO (update ratings)</option>
                    <option value="wins">Win-Count (simple)</option>
                </select>
            </div>
            <div>
                <label class="small">Seed Mode</label><br>
                <select id="seedMode">
                    <option value="none">None (random/1500)</option>
                    <option value="avg">Seed by Average Rating</option>
                    <option value="avg_scaled">Seed by Avg (scaled)</option>
                    <option value="position">Seed by Position (sorted by avg)</option>
                </select>
            </div>
            <div>
                <label class="small">Match Preset</label><br>
                <select id="matchPreset">
                    <option value="preset_500">~500 comparisons</option>
                    <option value="preset_750">~750 comparisons</option>
                    <option value="preset_1000">~1,000 comparisons</option>
                    <option value="preset_2000">~2,000 comparisons</option>
                    <option value="mergesort">MergeSort-like (N log2 N)</option>
                    <option value="quicksort">QuickSort avg (~2 N ln N)</option>
                    <option value="singleelim">Single-elimination (N-1)</option>
                    <option value="roundrobin">Round-robin (N*(N-1)/2)</option>
                </select>
            </div>
            <div>
                <label class="small">Depth</label><br>
                <select id="depth">
                    <option value="light">Light (quick)</option>
                    <option value="medium" selected>Medium (balanced)</option>
                    <option value="deep">Deep (thorough)</option>
                </select>
            </div>
            <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
                <button id="fetchBtn" class="btn">Load Collection</button>
                <button id="startBtn" class="btn">▶ Simulate</button>
                <button id="stopBtn" class="btn-secondary">■ Stop</button>
            </div>
        </div>

        <div class="panel">
            <div style="display:flex;gap:12px">
                <div style="flex:1">
                    <div class="small">Pair (manual/visual)</div>
                    <div id="pairArea" class="pair" style="margin-top:8px">
                        <div class="side"><img id="leftThumb" class="thumb"><button id="leftWin" class="btn-secondary" style="margin-top:8px">Choose Left</button></div>
                        <div class="side"><div class="small">VS</div></div>
                        <div class="side"><img id="rightThumb" class="thumb"><button id="rightWin" class="btn-secondary" style="margin-top:8px">Choose Right</button></div>
                    </div>
                    <div style="margin-top:10px"><button id="nextPair" class="btn-secondary">Next Pair (manual)</button></div>
                </div>
                <div style="width:360px">
                    <div class="small">Projections & Math Modes</div>
                    <div style="margin-top:8px" id="projections"></div>
                    <div class="small" style="margin-top:8px">Share / Export</div>
                    <div style="margin-top:6px"><button id="shareBtn" class="btn-secondary">Copy share link</button> <button id="downloadBtn" class="btn-secondary">Download JSON</button></div>
                </div>
            </div>

            <div style="margin-top:12px;display:flex;gap:12px">
                <div style="flex:1">
                            <div class="small">Leaderboard</div>
                            <table id="leaderboard"><thead><tr><th>#</th><th>Thumb</th><th>Name</th><th>Seed</th><th>Rating</th><th>Wins</th></tr></thead><tbody></tbody></table>
                </div>
                <div style="width:320px">
                    <div class="small">Log</div>
                    <div id="log" class="log"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
    (function(){
        const fetchBtn = document.getElementById('fetchBtn');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const usernameEl = document.getElementById('username');
        const modelEl = document.getElementById('model');
        const depthEl = document.getElementById('depth');
        const minPlaysEl = document.getElementById('minPlays');
        const minRatingEl = document.getElementById('minRating');
        const topByRatingEl = document.getElementById('topByRating');
        const excludeExpansionsEl = document.getElementById('excludeExpansions');
        const useRatingBiasEl = document.getElementById('useRatingBias');
        const seedModeEl = document.getElementById('seedMode');
        const matchPresetEl = document.getElementById('matchPreset');
        const leftThumb = document.getElementById('leftThumb');
        const rightThumb = document.getElementById('rightThumb');
        const leftWin = document.getElementById('leftWin');
        const rightWin = document.getElementById('rightWin');
        const nextPair = document.getElementById('nextPair');
        const leaderboardBody = document.querySelector('#leaderboard tbody');
        const logEl = document.getElementById('log');
        const projectionsEl = document.getElementById('projections');
        const shareBtn = document.getElementById('shareBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        let items = []; // {id,name,thumb,trueStrength,elo,wins,seedValue}
        let running = false; let simTimer = null;
        let currentPair = [];
        let history = [];

        function setStatus(s){ log('STATUS: '+s) }

        function log(s){ const p = document.createElement('div'); p.textContent = s; logEl.appendChild(p); logEl.scrollTop = logEl.scrollHeight }

        function parseCollectionXml(xmlText){
            const parser = new DOMParser(); const doc = parser.parseFromString(xmlText,'text/xml');
            const nodes = Array.from(doc.querySelectorAll('item'));
            return nodes.map(n=>{
                const name = n.querySelector('name')?.textContent || 'Unknown';
                const id = n.getAttribute('objectid') || n.getAttribute('id') || '';
                const thumb = n.querySelector('thumbnail')?.textContent || n.querySelector('image')?.textContent || '';
                const subtype = n.getAttribute('subtype') || '';
                // attempt to read stats/avg rating if present
                const stats = n.querySelector('stats');
                let avg = null;
                if(stats){ avg = parseFloat(stats.getAttribute('rating') || stats.getAttribute('average') || '') || null }
                const numplays = parseInt(n.querySelector('numplays')?.textContent || '0');
                return {id,name,thumb,avg,subtype,numplays};
            }).filter(i=>i.thumb);
        }

        async function loadCollection(){
            const username = (usernameEl.value||'sportomax').trim();
            setStatus('Loading collection for '+username+'...');
            try{
                const res = await fetch('/api/bgg-helper?endpoint=collection&username='+encodeURIComponent(username)+'&own=1&stats=1');
                const text = await res.text();
                const parsed = parseCollectionXml(text);
                // apply filters
                const minPlays = Math.max(0, parseInt(minPlaysEl.value||0));
                const minRating = Math.max(0, parseFloat(minRatingEl.value||0));
                const topBy = Math.max(0, parseInt(topByRatingEl.value||0));
                const excludeExp = !!excludeExpansionsEl.checked;
                let filtered = parsed.filter(it=>{
                    if(excludeExp && it.subtype === 'boardgameexpansion') return false;
                    if((it.numplays||0) < minPlays) return false;
                    if(minRating>0 && (it.avg===null || it.avg < minRating)) return false;
                    return true;
                });
                if(topBy>0){
                    filtered = filtered.slice().sort((a,b)=> (b.avg||0) - (a.avg||0)).slice(0, topBy);
                }

                // determine seeding choice
                const seedMode = document.getElementById('seedMode')?.value || 'none';

                // if position-based seeding, pre-sort by avg
                let posSorted = filtered.slice();
                posSorted.sort((a,b)=> (b.avg||0) - (a.avg||0));

                items = filtered.map((it,idx)=>{
                    // default seedValue and initial elo
                    let seedValue = null;
                    if(seedMode === 'avg' && it.avg){ seedValue = 1000 + (parseFloat(it.avg) * 100); }
                    else if(seedMode === 'avg_scaled' && it.avg){ seedValue = 1200 + ((parseFloat(it.avg)-5) * 120); }
                    else if(seedMode === 'position'){
                        const pos = posSorted.findIndex(x=>x.id===it.id);
                        // map position to seed between 1600 (top) and 1000 (bottom)
                        const max = Math.max(1, posSorted.length-1);
                        seedValue = 1600 - ((pos / max) * 600);
                    }
                    // fallback random-ish
                    if(seedValue === null) seedValue = 1500 + (Math.random()-0.5)*200;

                    return {id:it.id,name:it.name,thumb:it.thumb,avg:it.avg,subtype:it.subtype,numplays:it.numplays,seedValue:Math.round(seedValue),trueStrength:seedValue,elo:Math.round(seedValue),wins:0}
                });
                updateLeaderboard();
                computeProjections();
                setStatus('Loaded '+items.length+' items');
            }catch(e){ setStatus('Load error: '+(e.message||e)); console.error(e) }
        }

        function updateLeaderboard(){
            // sort by model: elo desc then wins
            const sorted = items.slice().sort((a,b)=>{
                if(modelEl.value==='elo') return b.elo - a.elo;
                return b.wins - a.wins;
            });
            leaderboardBody.innerHTML = '';
            sorted.forEach((it,i)=>{
                const tr = document.createElement('tr');
                const seedDisplay = it.seedValue ? it.seedValue : '';
                tr.innerHTML = `<td>${i+1}</td><td><img src="${it.thumb}" style="width:48px;height:66px;object-fit:cover;border-radius:4px"></td><td>${it.name}</td><td>${seedDisplay}</td><td>${Math.round(it.elo)}</td><td>${it.wins}</td>`;
                leaderboardBody.appendChild(tr);
            });
        }

        function chooseRandomPair(){
            if(items.length<2) return [];
            // if rating bias is enabled, do weighted sampling by elo
            if(useRatingBiasEl && useRatingBiasEl.checked){
                const total = items.reduce((s,i)=>s + (i.elo||1500), 0);
                function weightedPick(){
                    let r = Math.random() * total; for(const it of items){ r -= (it.elo||1500); if(r<=0) return it } return items[items.length-1];
                }
                const a = weightedPick(); let b = weightedPick(); let tries=0; while(b===a && tries<12){ b = weightedPick(); tries++ }
                return [a,b];
            }
            const a = items[Math.floor(Math.random()*items.length)];
            let b = items[Math.floor(Math.random()*items.length)];
            let tries = 0; while(b===a && tries<12){ b = items[Math.floor(Math.random()*items.length)]; tries++ }
            return [a,b];
        }

        function showPair(pair){ if(!pair || pair.length<2) return; currentPair = pair; leftThumb.src = pair[0].thumb; rightThumb.src = pair[1].thumb }

        function outcomeByTrueStrength(a,b){
            const diff = a.trueStrength - b.trueStrength;
            const p = 1/(1+Math.pow(10, -diff/400));
            return Math.random() < p ? a : b;
        }

        function applyOutcome(winner,loser){
            winner.wins = (winner.wins||0) + 1;
            if(modelEl.value==='elo'){
                const K = 32;
                const Ra = winner.elo, Rb = loser.elo;
                const Ea = 1/(1+Math.pow(10, (Rb-Ra)/400));
                const Eb = 1/(1+Math.pow(10, (Ra-Rb)/400));
                winner.elo = Ra + K*(1 - Ea);
                loser.elo = Rb + K*(0 - Eb);
            }
            history.push({t:Date.now(), winner: winner.id, loser: loser.id});
        }

        async function stepSimulation(){
            const pair = chooseRandomPair(); if(!pair.length) return;
            showPair(pair);
            const [a,b] = pair;
            const winner = outcomeByTrueStrength(a,b);
            const loser = winner===a? b : a;
            applyOutcome(winner,loser);
            updateLeaderboard();
            log(`Match: ${winner.name} beat ${loser.name}`);
        }

        function runSimulation(){
            if(running) return; running=true; setStatus('Start simulation');
            const depth = depthEl.value || 'medium';
            const N = items.length;
            // determine total comparisons by matchPreset first, fallback to depth
            const preset = document.getElementById('matchPreset')?.value || '';
            let total = 1000;
            if(preset.startsWith('preset_')){
                if(preset==='preset_500') total = 500;
                else if(preset==='preset_750') total = 750;
                else if(preset==='preset_1000') total = 1000;
                else if(preset==='preset_2000') total = 2000;
            } else if(preset==='mergesort'){
                total = Math.round(N * (Math.log2(N)||0));
            } else if(preset==='quicksort'){
                total = Math.round(2 * N * Math.log(N));
            } else if(preset==='singleelim'){
                total = Math.max(0, N-1);
            } else if(preset==='roundrobin'){
                total = Math.round(N*(N-1)/2);
            } else {
                if(depth==='light') total = Math.min(500, Math.max(100, Math.round(N * 5)));
                else if(depth==='medium') total = Math.min(2000, Math.max(500, Math.round(N * 20)));
                else if(depth==='deep') total = Math.min(100000, Math.round(N * (N-1) / 2));
            }
            let done = 0;
            const batch = 20; const delay = 60;
            function loop(){
                for(let i=0;i<batch && done<total && running;i++){
                    const pair = chooseRandomPair(); if(!pair.length) break;
                    const winner = outcomeByTrueStrength(pair[0], pair[1]);
                    const loser = winner===pair[0]? pair[1] : pair[0];
                    applyOutcome(winner,loser);
                    done++;
                }
                updateLeaderboard();
                if(done >= total || !running){ running=false; setStatus('Simulation finished: '+done+' comparisons'); return }
                setTimeout(loop, delay);
            }
            loop();
        }

        fetchBtn.addEventListener('click', loadCollection);
        // recompute projections when presets change
        if(matchPresetEl) matchPresetEl.addEventListener('change', computeProjections);
        if(depthEl) depthEl.addEventListener('change', computeProjections);
        if(seedModeEl) seedModeEl.addEventListener('change', ()=>{ setStatus('Seed mode changed'); });
        nextPair.addEventListener('click', ()=>{ showPair(chooseRandomPair()) });
        leftWin.addEventListener('click', ()=>{ if(currentPair.length){ applyOutcome(currentPair[0], currentPair[1]); updateLeaderboard(); log(`Manual: ${currentPair[0].name} > ${currentPair[1].name}`) } });
        rightWin.addEventListener('click', ()=>{ if(currentPair.length){ applyOutcome(currentPair[1], currentPair[0]); updateLeaderboard(); log(`Manual: ${currentPair[1].name} > ${currentPair[0].name}`) } });
        startBtn.addEventListener('click', ()=>{ runSimulation() });
        stopBtn.addEventListener('click', ()=>{ running=false; setStatus('Stop requested') });

        function computeProjections(){
            const N = Math.max(1, items.length);
            const rr = Math.round(N*(N-1)/2);
            const elim = Math.max(0, N-1);
            const mergesort = Math.round(N * (Math.log2(N)||0));
            const quick = Math.round(2 * N * Math.log(N));

            // preset match counts helpful ranges
            const preset500 = 500;
            const preset750 = 750;
            const preset1000 = 1000;
            const preset2000 = 2000;

            projectionsEl.innerHTML = `
                <div class="small">Items: ${N}</div>
                <div>Round-robin comparisons: <strong>${rr}</strong></div>
                <div>Single-elimination comparisons: <strong>${elim}</strong></div>
                <div>MergeSort-like comparisons (N log2 N): <strong>${mergesort}</strong></div>
                <div>QuickSort average ~ 2 N ln N: <strong>${quick}</strong></div>
                <div style="margin-top:8px" class="small">Quick presets:</div>
                <div><button class="btn-secondary" data-val="${preset500}">~${preset500}</button> <button class="btn-secondary" data-val="${preset750}">~${preset750}</button> <button class="btn-secondary" data-val="${preset1000}">~${preset1000}</button> <button class="btn-secondary" data-val="${preset2000}">~${preset2000}</button></div>
            `;

            // wire preset buttons to set matchPreset selection
            Array.from(projectionsEl.querySelectorAll('button[data-val]')).forEach(b=>{
                b.addEventListener('click', ()=>{
                    const v = parseInt(b.dataset.val || '1000');
                    document.getElementById('matchPreset').value = (v===500? 'preset_500' : v===750? 'preset_750' : v===1000? 'preset_1000' : 'preset_2000');
                    setStatus('Match preset set to '+v+' comparisons');
                });
            });
        }

        shareBtn.addEventListener('click', ()=>{
            const payload = {items: items.map(i=>({id:i.id,name:i.name,thumb:i.thumb,elo:i.elo,wins:i.wins})),history};
            const s = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
            const url = location.origin + location.pathname + '?data=' + s;
            navigator.clipboard.writeText(url).then(()=>setStatus('Share link copied'));
        });

        downloadBtn.addEventListener('click', ()=>{
            const payload = {items: items.map(i=>({id:i.id,name:i.name,thumb:i.thumb,elo:i.elo,wins:i.wins})),history};
            const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'pubrank-result.json'; a.click();
        });

        // load from URL data if present
        (function loadFromUrl(){
            const params = new URLSearchParams(location.search);
            const d = params.get('data'); if(!d) return;
            try{ const json = JSON.parse(decodeURIComponent(escape(atob(d)))); items = json.items.map(i=>({id:i.id,name:i.name,thumb:i.thumb,elo:i.elo||1500,wins:i.wins||0,trueStrength:i.elo||1500})); history = json.history||[]; updateLeaderboard(); computeProjections(); setStatus('Loaded shared result'); }catch(e){console.warn(e)}
        })();

    })();
    </script>
</body>
</html>
