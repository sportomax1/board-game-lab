<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BGG Library Explorer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            min-height: 100vh;
        }
        .container { max-width: 1400px; }
        .game-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .game-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .thumb-container {
            width: 100px;
            height: 100px;
            min-width: 100px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 8px 0 0 8px;
        }
        .thumb-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 4px;
        }
        
        @media (max-width: 640px) {
            .thumb-container {
                width: 85px;
                height: 85px;
                min-width: 85px;
            }
            .game-card { height: auto; min-height: 85px; }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-900">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-3 w-full md:w-auto">
                <div class="bg-indigo-600 p-2 rounded-lg shadow-lg shadow-indigo-200">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C6.5 6.253 2 10.998 2 17s4.5 10.747 10 10.747c5.5 0 10-4.998 10-10.747 0-5.002-4.5-10.747-10-10.747z"></path></svg>
                </div>
                <div class="flex-1">
                    <h1 class="text-xl font-800 tracking-tight leading-none text-slate-900">BGG Library</h1>
                    <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mt-1">
                        <span id="gamesInLibrary">0 games</span> • Convention Library
                    </p>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
                <div class="relative flex-1 md:w-48">
                    <input type="text" id="username" placeholder="BGG Username" value="sportomax"
                           class="w-full pl-9 pr-4 py-2 bg-slate-100 border-none rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 transition-all text-slate-900">
                    <svg class="w-4 h-4 absolute left-3 top-2.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>
                <button id="fetchBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-100 transition-all text-sm flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h5"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 12a8 8 0 018-8h8"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 20v-5h-5"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12a8 8 0 01-8 8H4"></path></svg>
                    Load
                </button>
                <div class="relative flex-1 md:w-48">
                    <input type="text" id="searchInput" placeholder="Search..." 
                        class="w-full pl-9 pr-4 py-2 bg-slate-100 border-none rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 transition-all text-slate-900">
                    <svg class="w-4 h-4 absolute left-3 top-2.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                
                <div class="flex gap-2 w-full md:w-auto">
                    <select id="sortSelect" class="flex-1 md:w-auto bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm font-semibold outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-slate-900 appearance-none">
                        <option value="name" selected>Name</option>
                        <option value="rating">Rating</option>
                        <option value="weight">Weight</option>
                        <option value="year">Year</option>
                        <option value="added">Date Added</option>
                    </select>
                    <button id="exportBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-100 transition-all text-sm flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Export
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6">
        <div id="loader" class="flex flex-col items-center justify-center py-12">
            <div class="relative w-16 h-16">
                <div class="absolute inset-0 border-4 border-slate-100 rounded-full"></div>
                <div class="absolute inset-0 border-4 border-indigo-600 rounded-full border-t-transparent animate-spin"></div>
            </div>
            <p class="mt-4 text-slate-900 font-bold tracking-tight" id="loaderText">Enter a BGG username to begin.</p>
            <p class="text-xs text-slate-400 mt-2 uppercase tracking-widest font-semibold" id="loaderSub">Your game collection awaits</p>
        </div>

        <div id="gamesContainer" class="hidden space-y-2">
            <!-- Games will be rendered here -->
        </div>
    </main>

    <!-- Export Modal -->
    <div id="exportModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[200] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden animate-in fade-in zoom-in duration-200">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <div>
                    <h2 class="text-xl font-800 text-slate-900">Export Library</h2>
                    <p class="text-xs text-slate-500 font-bold uppercase tracking-widest">CSV Configuration</p>
                </div>
                <button id="closeExport" class="p-2 hover:bg-slate-100 rounded-full transition-colors">
                    <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="p-6">
                <div class="flex justify-between mb-4">
                    <span class="text-xs font-800 text-slate-400 uppercase tracking-widest">Columns to Include</span>
                    <div class="flex gap-4">
                        <button id="btnSelectAll" class="text-xs font-bold text-indigo-600 hover:text-indigo-700">Select All</button>
                        <button id="btnSelectNone" class="text-xs font-bold text-slate-400 hover:text-slate-600">None</button>
                    </div>
                </div>
                
                <div id="columnList" class="space-y-2 max-h-[40vh] overflow-y-auto pr-2 custom-scrollbar">
                </div>

                <div class="mt-8 flex gap-3">
                    <button id="copyCSV" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-4 rounded-2xl transition-all flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                        Copy
                    </button>
                    <button id="downloadCSV" class="flex-[2] bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl shadow-lg shadow-indigo-100 transition-all flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Download CSV
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allGames = [];
        let currentSort = 'name';
        let searchQuery = '';
        const IMAGE_PROXY = 'https://images.weserv.nl/?url=';

        const exportColumns = [
            { id: 'objectid', label: 'BGG ID', enabled: true },
            { id: 'name', label: 'Game Name', enabled: true },
            { id: 'yearpublished', label: 'Year', enabled: true },
            { id: 'rating', label: 'Rating', enabled: true },
            { id: 'weight', label: 'Weight', enabled: true },
            { id: 'minplayers', label: 'Min Players', enabled: false },
            { id: 'maxplayers', label: 'Max Players', enabled: false },
            { id: 'best_players', label: 'Best Players', enabled: true },
            { id: 'recommended_players', label: 'Rec. Players', enabled: false },
            { id: 'playtime', label: 'Playtime', enabled: false },
            { id: 'status_own', label: 'Owned', enabled: false },
        ];

        async function fetchAPI(endpoint, user, queryParams = '') {
            let url = `/api/bgg-helper?endpoint=${endpoint}&${user.startsWith('ids=') ? user : `username=${encodeURIComponent(user)}`}${queryParams}`;
            for (let attempt = 0; attempt < 5; attempt++) {
                try {
                    const res = await fetch(url);
                    if (res.status === 202) {
                        await new Promise(r => setTimeout(r, 2000 + attempt * 1000));
                        continue;
                    }
                    if (res.ok) return await res.text();
                } catch (e) {
                    console.error(`Attempt ${attempt + 1} failed for ${url}`, e);
                }
                await new Promise(r => setTimeout(r, 1500));
            }
            throw new Error(`Failed to fetch from BGG API after multiple attempts: ${url}`);
        }

        async function fetchLibraryData() {
            const username = document.getElementById('username').value.trim();
            if (!username) {
                alert('Please enter a BGG username.');
                return;
            }

            const loader = document.getElementById('loader');
            const container = document.getElementById('gamesContainer');
            const loaderText = document.getElementById('loaderText');
            const loaderSub = document.getElementById('loaderSub');

            loader.classList.remove('hidden');
            container.classList.add('hidden');
            loaderText.textContent = 'Loading library...';
            loaderSub.textContent = `Fetching ${username}'s collection`;

            try {
                const collectionXml = await fetchAPI('collection', username, '&stats=1&own=1');
                const doc = new DOMParser().parseFromString(collectionXml, 'text/xml');
                
                if (doc.querySelector('errors error')) {
                    throw new Error(doc.querySelector('errors error').textContent);
                }

                allGames = Array.from(doc.querySelectorAll('item')).map(item => {
                    const ratingNode = item.querySelector('stats rating');
                    const statusNode = item.querySelector('status');
                    return {
                        objectid: item.getAttribute('objectid'),
                        name: item.querySelector('name')?.textContent || 'N/A',
                        thumbnail: item.querySelector('thumbnail')?.textContent || '',
                        yearpublished: item.querySelector('yearpublished')?.textContent || 'N/A',
                        rating: parseFloat(ratingNode?.getAttribute('value') || '0').toFixed(2),
                        weight: 0,
                        minplayers: item.querySelector('stats')?.getAttribute('minplayers') || '0',
                        maxplayers: item.querySelector('stats')?.getAttribute('maxplayers') || '0',
                        playtime: 'N/A',
                        best_players: '',
                        recommended_players: '',
                        status_own: statusNode?.getAttribute('own') === '1',
                        loaded: false,
                    };
                }).filter(g => g.status_own);

                document.getElementById('gamesInLibrary').textContent = `${allGames.length} games`;
                loaderText.textContent = `Found ${allGames.length} games.`;
                loaderSub.textContent = 'Fetching detailed data...';
                
                render(); // Initial render with basic data
                container.classList.remove('hidden');
                loader.classList.add('hidden');

                // Fetch thing data in parallel batches
                const batchSize = 20;
                const parallelBatches = 100;
                const batches = [];
                for (let i = 0; i < allGames.length; i += batchSize) {
                    batches.push(allGames.slice(i, i + batchSize));
                }

                for (let i = 0; i < batches.length; i += parallelBatches) {
                    const batchGroup = batches.slice(i, i + parallelBatches);
                    loaderSub.textContent = `Fetching details... Batch ${i / parallelBatches + 1} of ${Math.ceil(batches.length / parallelBatches)}`;
                    
                    await Promise.all(batchGroup.map(async (batch) => {
                        const ids = batch.map(g => g.objectid).join(',');
                        try {
                            const thingXml = await fetchAPI('thing', `ids=${ids}`, '&stats=1');
                            const thingDoc = new DOMParser().parseFromString(thingXml, 'text/xml');
                            
                            Array.from(thingDoc.querySelectorAll('item')).forEach(thingItem => {
                                const id = thingItem.getAttribute('id');
                                const game = allGames.find(g => g.objectid === id);
                                if (game) {
                                    const stats = thingItem.querySelector('statistics ratings');
                                    game.weight = parseFloat(stats?.querySelector('averageweight')?.getAttribute('value') || '0').toFixed(2);
                                    game.playtime = thingItem.querySelector('playingtime')?.getAttribute('value') || game.playtime;
                                    
                                    const poll = thingItem.querySelector('poll[name="suggested_numplayers"]');
                                    if (poll) {
                                        const results = Array.from(poll.querySelectorAll('results'));
                                        let best = [];
                                        let recommended = [];
                                        results.forEach(r => {
                                            const num = r.getAttribute('numplayers');
                                            const bestVotes = parseInt(r.querySelector('result[value="Best"]')?.getAttribute('numvotes') || '0');
                                            const recVotes = parseInt(r.querySelector('result[value="Recommended"]')?.getAttribute('numvotes') || '0');
                                            const totalVotes = parseInt(poll.getAttribute('totalvotes') || '1');
                                            if (bestVotes > totalVotes / 4 && bestVotes > 5) best.push(num);
                                            else if (recVotes > totalVotes / 4 && recVotes > 5) recommended.push(num);
                                        });
                                        game.best_players = best.join(', ');
                                        game.recommended_players = recommended.join(', ');
                                    }
                                    game.loaded = true;
                                }
                            });
                        } catch (e) {
                            console.error(`Batch failed for IDs ${ids}:`, e);
                        }
                    }));
                    
                    render(); // Re-render after each group of batches
                }
                loaderSub.textContent = 'All details loaded!';

            } catch (error) {
                console.error('Error fetching library:', error);
                loaderText.textContent = 'Error loading library';
                loaderSub.textContent = error.message;
            }
        }

        function render() {
            const container = document.getElementById('gamesContainer');
            
            let filtered = allGames.filter(g => 
                g.name.toLowerCase().includes(searchQuery.toLowerCase())
            );

            // Sort
            if (currentSort === 'name') {
                filtered.sort((a, b) => a.name.localeCompare(b.name));
            } else if (currentSort === 'rating') {
                filtered.sort((a, b) => (b.rating || 0) - (a.rating || 0));
            } else if (currentSort === 'weight') {
                filtered.sort((a, b) => (b.weight || 0) - (a.weight || 0));
            } else if (currentSort === 'year') {
                filtered.sort((a, b) => (b.yearpublished || 0) - (a.yearpublished || 0));
            } else if (currentSort === 'added') {
                // BGG API for collection doesn't provide an added date, so this is a placeholder
                filtered.sort((a, b) => a.name.localeCompare(b.name));
            }

            container.innerHTML = filtered.map(g => {
                const ratingTag = g.rating > 0 ? `<span class="px-1.5 py-0.5 bg-yellow-100 text-yellow-700 text-[10px] font-bold rounded uppercase border border-yellow-200 tracking-wider">⭐ ${g.rating}</span>` : '';
                const weightTag = g.weight > 0 ? `<span class="px-1.5 py-0.5 bg-purple-100 text-purple-700 text-[10px] font-bold rounded uppercase border border-purple-200 tracking-wider">⚖️ ${g.weight}</span>` : '';
                const players = g.minplayers === g.maxplayers ? g.minplayers : `${g.minplayers}-${g.maxplayers}`;
                const playersTag = `<span class="px-1.5 py-0.5 bg-blue-100 text-blue-700 text-[10px] font-bold rounded uppercase border border-blue-200 tracking-wider">👥 ${players}</span>`;
                const bestPlayersTag = g.best_players ? `<span class="px-1.5 py-0.5 bg-green-100 text-green-700 text-[10px] font-bold rounded uppercase border border-green-200 tracking-wider">👍 ${g.best_players}</span>` : '';

                return `
                <div class="game-card bg-white border border-slate-200 rounded-2xl overflow-hidden flex shadow-sm hover:shadow-md transition-all">
                    <div class="thumb-container group relative bg-white border-r border-slate-100">
                        ${g.thumbnail ? `<img src="${IMAGE_PROXY}${encodeURIComponent(g.thumbnail)}&w=100&h=100&fit=contain" alt="${g.name}" class="w-full h-full object-contain p-1">` : `<div class="w-full h-full flex items-center justify-center text-4xl bg-slate-50">📦</div>`}
                        ${!g.loaded ? `<div class="absolute inset-0 bg-white/70 flex items-center justify-center"><div class="w-4 h-4 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></div></div>` : ''}
                    </div>
                    <div class="flex-grow p-3 flex flex-col justify-between overflow-hidden">
                        <div class="flex flex-col gap-0.5 min-w-0">
                            <div class="flex items-center gap-1.5 flex-wrap mb-1">
                                ${ratingTag} ${weightTag} ${playersTag} ${bestPlayersTag}
                            </div>
                            <div class="flex justify-between items-start gap-2">
                                <h3 class="font-bold text-sm leading-tight text-slate-900 truncate flex-1 hover:text-indigo-600 transition-colors" title="${g.name}">${g.name}</h3>
                                <span class="text-xs font-bold text-slate-400">${g.yearpublished}</span>
                            </div>
                            <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mt-0.5">
                                BGG ID: ${g.objectid || 'N/A'}
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function handleSort(value) {
            currentSort = value;
            render();
        }

        function handleSearch(value) {
            searchQuery = value;
            render();
        }

        function renderExportModal() {
            const list = document.getElementById('columnList');
            list.innerHTML = exportColumns.map((col, idx) => {
                return `<div class="flex items-center gap-3 bg-slate-50 p-3 rounded-xl border border-slate-100 group">
                    <input type="checkbox" class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300" ${col.enabled ? 'checked' : ''} onchange="toggleCol('${col.id}')">
                    <span class="text-sm font-bold text-slate-700 flex-1">${col.label}</span>
                </div>`;
            }).join('');
        }

        function toggleCol(id) {
            const col = exportColumns.find(c => c.id === id);
            if (col) col.enabled = !col.enabled;
        }

        function getCSVString() {
            const enabledCols = exportColumns.filter(c => c.enabled);
            if (enabledCols.length === 0) return null;

            const headers = enabledCols.map(c => c.label).join(',');
            const rows = allGames.map(g => {
                return enabledCols.map(col => {
                    let val = g[col.id] || '';
                    if (typeof val === 'string') return '"' + val.replace(/"/g, '""') + '"';
                    return val;
                }).join(',');
            });

            return headers + '\n' + rows.join('\n');
        }

        // Event listeners
        document.getElementById('fetchBtn').addEventListener('click', fetchLibraryData);
        document.getElementById('username').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') fetchLibraryData();
        });
        document.getElementById('searchInput').addEventListener('input', (e) => handleSearch(e.target.value));
        document.getElementById('sortSelect').addEventListener('change', (e) => handleSort(e.target.value));
        document.getElementById('exportBtn').addEventListener('click', () => {
            renderExportModal();
            document.getElementById('exportModal').classList.remove('hidden');
        });
        document.getElementById('closeExport').addEventListener('click', () => {
            document.getElementById('exportModal').classList.add('hidden');
        });
        document.getElementById('btnSelectAll').addEventListener('click', () => {
            exportColumns.forEach(c => c.enabled = true);
            renderExportModal();
        });
        document.getElementById('btnSelectNone').addEventListener('click', () => {
            exportColumns.forEach(c => c.enabled = false);
            renderExportModal();
        });
        document.getElementById('copyCSV').addEventListener('click', () => {
            const csv = getCSVString();
            if (csv) {
                navigator.clipboard.writeText(csv);
                alert('Copied to clipboard!');
            }
        });
        document.getElementById('downloadCSV').addEventListener('click', () => {
            const csv = getCSVString();
            if (csv) {
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'bgg-library.csv';
                a.click();
            }
        });

    </script>
</body>
</html>
