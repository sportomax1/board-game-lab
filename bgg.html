<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BGG Library Explorer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            min-height: 100vh;
        }
        .container { max-width: 1400px; }
        .game-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .game-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .thumb-container {
            width: 100px;
            height: 100px;
            min-width: 100px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 8px 0 0 8px;
        }
        .thumb-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 4px;
        }
        
        @media (max-width: 640px) {
            .thumb-container {
                width: 85px;
                height: 85px;
                min-width: 85px;
            }
            .game-card { height: auto; min-height: 85px; }
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 30px;
            height: 16px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #cbd5e1;
            transition: .4s;
            border-radius: 20px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 10px;
            width: 10px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #4f46e5; }
        input:checked + .slider:before { transform: translateX(14px); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-900">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-3 w-full md:w-auto">
                <div class="bg-indigo-600 p-2 rounded-lg shadow-lg shadow-indigo-200 cursor-pointer" id="openSettings">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </div>
                <div class="flex-1">
                    <h1 class="text-xl font-800 tracking-tight leading-none text-slate-900">BGG Library</h1>
                    <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mt-1">
                        <span id="gamesInLibrary">0 games</span> • Collection Explorer
                    </p>
                </div>
                <div class="flex gap-2">
                    <button id="openExport" class="md:hidden p-2 text-slate-400 hover:text-indigo-600 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    </button>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
                <div class="relative flex-1 md:w-48">
                    <input type="text" id="searchInput" placeholder="Search..." 
                        class="w-full pl-9 pr-4 py-2 bg-slate-100 border-none rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 transition-all text-slate-900">
                    <svg class="w-4 h-4 absolute left-3 top-2.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                
                <div class="flex gap-2 w-full md:w-auto">
                    <select id="sortSelect" class="flex-1 md:w-auto bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm font-semibold outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-slate-900 appearance-none">
                        <option value="name">Name</option>
                        <option value="rating">Rating</option>
                        <option value="rank">Rank</option>
                        <option value="year">Year</option>
                        <option value="weight">Weight</option>
                    </select>
                    <select id="playerFilter" class="flex-1 md:w-auto bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm font-semibold outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-slate-900 appearance-none">
                        <option value="" selected>Any Count</option>
                        <option value="1">1 Player</option>
                        <option value="2">2 Players</option>
                        <option value="3">3 Players</option>
                        <option value="4">4 Players</option>
                        <option value="5">5 Players</option>
                        <option value="6">6+ Players</option>
                    </select>
                    <button id="openExportDesktop" class="hidden md:flex p-2 bg-white border border-slate-200 rounded-xl text-slate-500 hover:text-indigo-600 hover:border-indigo-200 transition-all">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6">
        <div id="loader" class="flex flex-col items-center justify-center py-12">
            <div class="relative w-16 h-16">
                <div class="absolute inset-0 border-4 border-slate-100 rounded-full"></div>
                <div class="absolute inset-0 border-4 border-indigo-600 rounded-full border-t-transparent animate-spin"></div>
            </div>
            <p class="mt-4 text-slate-900 font-bold tracking-tight" id="loaderText">Loading library...</p>
            <p class="text-xs text-slate-400 mt-2 uppercase tracking-widest font-semibold" id="loaderSub">Fetching BGG data</p>
        </div>

        <div id="gameGrid" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 gap-4"></div>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[200] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h2 class="text-xl font-800 text-slate-900">Data Source</h2>
                <button id="closeSettings" class="p-2 hover:bg-slate-100 rounded-full transition-colors">
                    <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="flex items-center gap-2 mb-3">
                        <input type="radio" name="source" value="convention" checked class="w-4 h-4">
                        <span class="font-bold text-slate-700">Convention Library</span>
                    </label>
                    <p class="text-[10px] text-slate-400 ml-6">Load from tabletop.events API</p>
                </div>
                <div>
                    <label class="flex items-center gap-2 mb-3">
                        <input type="radio" name="source" value="username" class="w-4 h-4">
                        <span class="font-bold text-slate-700">BGG Username</span>
                    </label>
                    <input type="text" id="settingsUsername" class="w-full ml-6 px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all font-semibold text-slate-700" placeholder="sportomax" value="sportomax">
                    <p class="text-[10px] text-slate-400 ml-6 mt-2">Load from BGG collection</p>
                </div>
                <button id="saveSettings" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-indigo-100 transition-all">Load Data</button>
            </div>
        </div>
    </div>

    <!-- Export Modal -->
    <div id="exportModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[200] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <div>
                    <h2 class="text-xl font-800 text-slate-900">Export Library</h2>
                    <p class="text-xs text-slate-500 font-bold uppercase tracking-widest">CSV Configuration</p>
                </div>
                <button id="closeExport" class="p-2 hover:bg-slate-100 rounded-full transition-colors">
                    <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="p-6">
                <div class="flex justify-between mb-4">
                    <span class="text-xs font-800 text-slate-400 uppercase tracking-widest">Columns to Include</span>
                    <div class="flex gap-4">
                        <button id="btnSelectAll" class="text-xs font-bold text-indigo-600 hover:text-indigo-700">Select All</button>
                        <button id="btnSelectNone" class="text-xs font-bold text-slate-400 hover:text-slate-600">None</button>
                    </div>
                </div>
                
                <div id="columnList" class="space-y-2 max-h-[40vh] overflow-y-auto pr-2 custom-scrollbar"></div>

                <div class="mt-8 flex gap-3">
                    <button id="copyCSV" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-4 rounded-2xl transition-all flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                        Copy
                    </button>
                    <button id="downloadCSV" class="flex-[2] bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl shadow-lg shadow-indigo-100 transition-all flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Download CSV
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let games = [];
        let currentSort = 'name';
        let searchQuery = '';
        let playerFilter = '';
        let dataSource = 'convention';

        const exportColumns = [
            { id: 'id', label: 'BGG ID', enabled: true },
            { id: 'name', label: 'Game Name', enabled: true },
            { id: 'year', label: 'Year', enabled: true },
            { id: 'rating', label: 'Rating', enabled: true },
            { id: 'rank', label: 'Rank', enabled: true },
            { id: 'weight', label: 'Weight', enabled: true },
            { id: 'minPlayers', label: 'Min Players', enabled: false },
            { id: 'maxPlayers', label: 'Max Players', enabled: false },
            { id: 'playingtime', label: 'Playtime', enabled: true },
            { id: 'locations', label: 'Location', enabled: true },
        ];

        const IMAGE_PROXY = 'https://images.weserv.nl/?url=';

        async function fetchAPI(endpoint, params = '', retries = 5) {
            let url = `/api/bgg-helper?endpoint=${endpoint}${params}`;
            for (let attempt = 0; attempt < retries; attempt++) {
                try {
                    const res = await fetch(url);
                    if (res.status === 202) {
                        await new Promise(r => setTimeout(r, 2000 + attempt * 1000));
                        continue;
                    }
                    if (res.ok) return await res.text();
                } catch (e) {
                    console.error(`Attempt ${attempt + 1} failed for ${url}`, e);
                }
                await new Promise(r => setTimeout(r, 1500));
            }
            throw new Error(`Failed to fetch from BGG API: ${url}`);
        }

        async function fetchConventionLibrary() {
            updateLoader('Fetching convention library...', 'Loading games from tabletop.events');
            
            try {
                // Fetch 100 pages in parallel
                const promises = [];
                for (let page = 1; page <= 100; page++) {
                    promises.push(
                        fetch(`https://tabletop.events/api/library/0AEB11DA-2B7D-11EC-B400-855F800FD618/librarygames?_page=${page}&_items_per_page=100`)
                            .then(r => r.json())
                            .catch(e => ({ result: { items: [] } }))
                    );
                }
                
                const results = await Promise.all(promises);
                const allItems = results.flatMap(data => data.result?.items || []);
                
                updateLoader(`Found ${allItems.length} games`, 'Enriching with BGG data...');
                
                // Map to game objects
                games = allItems.map(item => ({
                    id: item.bgg_id || '',
                    name: item.name || '',
                    year: parseInt(item.date_created?.substring(0, 4)) || 0,
                    rating: 0,
                    rank: 99999,
                    weight: 0,
                    minPlayers: 0,
                    maxPlayers: 0,
                    playingtime: 0,
                    players: '?',
                    locations: [item.custom_fields?.Location || item.Location || 'Unknown'].filter(Boolean),
                    thumb: '',
                    image: '',
                    loaded: false,
                })).filter(g => g.id);

                // Enrich with thing API in batches of 20, 100 parallel
                await enrichWithThingAPI(games);
                
            } catch (error) {
                console.error('Error fetching convention library:', error);
                updateLoader('Error loading library', error.message);
            }
        }

        async function fetchBGGCollection(username) {
            updateLoader('Fetching BGG collection...', `Loading ${username}'s games`);
            
            try {
                const collectionXml = await fetchAPI('collection', `&username=${encodeURIComponent(username)}&stats=1&own=1`);
                const doc = new DOMParser().parseFromString(collectionXml, 'text/xml');
                
                if (doc.querySelector('errors error')) {
                    throw new Error(doc.querySelector('errors error').textContent);
                }

                const items = Array.from(doc.querySelectorAll('item'));
                updateLoader(`Found ${items.length} games`, 'Enriching with BGG data...');
                
                games = items.map(item => {
                    const stats = item.querySelector('stats');
                    const rating = item.querySelector('stats rating');
                    const status = item.querySelector('status');
                    const comment = status?.querySelector('comment')?.textContent || '';
                    return {
                        id: item.getAttribute('objectid'),
                        name: item.querySelector('name')?.textContent || 'Unknown',
                        year: parseInt(item.querySelector('yearpublished')?.textContent) || 0,
                        rating: parseFloat(rating?.getAttribute('value') || '0'),
                        rank: 99999,
                        weight: 0,
                        minPlayers: parseInt(stats?.getAttribute('minplayers') || '0'),
                        maxPlayers: parseInt(stats?.getAttribute('maxplayers') || '0'),
                        playingtime: parseInt(item.querySelector('stats')?.getAttribute('playingtime') || '0'),
                        players: '?',
                        locations: comment ? [comment] : [],
                        thumb: item.querySelector('thumbnail')?.textContent || '',
                        image: item.querySelector('image')?.textContent || '',
                        loaded: false,
                    };
                });

                // Enrich with thing API
                await enrichWithThingAPI(games);
                
            } catch (error) {
                console.error('Error fetching BGG collection:', error);
                updateLoader('Error loading collection', error.message);
            }
        }

        async function enrichWithThingAPI(gameList) {
            const batchSize = 20;
            const parallelBatches = 100;
            const batches = [];
            
            for (let i = 0; i < gameList.length; i += batchSize) {
                batches.push(gameList.slice(i, i + batchSize));
            }

            for (let i = 0; i < batches.length; i += parallelBatches) {
                const batchGroup = batches.slice(i, i + parallelBatches);
                updateLoader(
                    `Enriching games... ${Math.min(i + parallelBatches, batches.length)}/${batches.length} batches`,
                    'Fetching details from BGG'
                );
                
                await Promise.all(batchGroup.map(async (batch) => {
                    const ids = batch.map(g => g.id).join(',');
                    try {
                        const thingXml = await fetchAPI('thing', `&id=${ids}&stats=1`);
                        const thingDoc = new DOMParser().parseFromString(thingXml, 'text/xml');
                        
                        Array.from(thingDoc.querySelectorAll('item')).forEach(thingItem => {
                            const id = thingItem.getAttribute('id');
                            const game = gameList.find(g => g.id === id);
                            if (game) {
                                const stats = thingItem.querySelector('statistics ratings');
                                game.rating = parseFloat(stats?.querySelector('average')?.getAttribute('value') || '0');
                                
                                const rankNode = stats?.querySelector('rank[name="boardgame"]');
                                game.rank = parseInt(rankNode?.getAttribute('value') || '99999');
                                
                                game.weight = parseFloat(stats?.querySelector('averageweight')?.getAttribute('value') || '0');
                                game.minPlayers = parseInt(thingItem.querySelector('minplayers')?.getAttribute('value') || '0');
                                game.maxPlayers = parseInt(thingItem.querySelector('maxplayers')?.getAttribute('value') || '0');
                                game.playingtime = parseInt(thingItem.querySelector('playingtime')?.getAttribute('value') || '0');
                                game.players = game.minPlayers === game.maxPlayers ? `${game.minPlayers}` : `${game.minPlayers}-${game.maxPlayers}`;
                                
                                if (!game.thumb) game.thumb = thingItem.querySelector('thumbnail')?.textContent || '';
                                if (!game.image) game.image = thingItem.querySelector('image')?.textContent || '';
                                
                                game.loaded = true;
                            }
                        });
                    } catch (e) {
                        console.error(`Batch failed for IDs ${ids}:`, e);
                    }
                }));
                
                render();
            }
            
            updateLoader('Complete!', `${gameList.length} games loaded`);
            setTimeout(() => {
                document.getElementById('loader').classList.add('hidden');
            }, 1000);
        }

        function updateLoader(text, subtext) {
            document.getElementById('loaderText').textContent = text;
            document.getElementById('loaderSub').textContent = subtext;
        }

        function render() {
            const container = document.getElementById('gameGrid');
            if (!container) return;
            
            container.classList.remove('hidden');
            document.getElementById('gamesInLibrary').textContent = `${games.length} games`;
            
            let filtered = games.filter(g => {
                const matchesSearch = g.name.toLowerCase().includes(searchQuery.toLowerCase());
                
                let matchesPlayers = true;
                if (playerFilter) {
                    const p = parseInt(playerFilter);
                    if (p === 6) matchesPlayers = g.maxPlayers >= 6;
                    else matchesPlayers = g.minPlayers <= p && g.maxPlayers >= p;
                }
                
                return matchesSearch && matchesPlayers;
            });

            filtered.sort((a, b) => {
                if (currentSort === 'name') return a.name.localeCompare(b.name);
                if (currentSort === 'rating') return b.rating - a.rating;
                if (currentSort === 'rank') return a.rank - b.rank;
                if (currentSort === 'year') return b.year - a.year;
                if (currentSort === 'weight') return b.weight - a.weight;
                return 0;
            });

            container.innerHTML = filtered.map(g => {
                const locTags = g.locations.map(loc => `<span class="px-1.5 py-0.5 bg-slate-100 text-slate-500 text-[10px] font-bold rounded uppercase border border-slate-200 tracking-wider">${loc}</span>`).join('');
                const thumbUrl = g.image || g.thumb || 'https://cf.geekdo-images.com/zx_9pDp6m60_q6r1uYf8uA__thumb/img/999999_thumb.png';

                return `
                <div class="game-card bg-white border border-slate-200 rounded-2xl overflow-hidden flex shadow-sm hover:shadow-md transition-all">
                    <a href="https://boardgamegeek.com/boardgame/${g.id}" target="_blank" class="thumb-container group relative bg-white border-r border-slate-100 cursor-pointer">
                        <img src="${thumbUrl}" loading="lazy" class="w-full h-full object-cover">
                        ${!g.loaded ? '<div class="absolute inset-0 bg-white/70 flex items-center justify-center"><div class="w-4 h-4 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></div></div>' : ''}
                        <div class="absolute inset-0 bg-indigo-600/0 group-hover:bg-indigo-600/5 transition-colors flex items-center justify-center">
                            <span class="text-2xl opacity-0 group-hover:opacity-100 transition-opacity">👁️</span>
                        </div>
                    </a>
                    <div class="flex-grow p-3 flex flex-col justify-between overflow-hidden">
                        <div class="flex flex-col gap-0.5 min-w-0">
                            <div class="flex items-center gap-1.5 flex-wrap mb-1">
                                ${locTags}
                            </div>
                            <div class="flex justify-between items-start gap-2">
                                <h3 class="font-bold text-sm leading-tight text-slate-900 truncate flex-1 hover:text-indigo-600 transition-colors" title="${g.name}">${g.name}</h3>
                                <a href="https://www.youtube.com/results?search_query=board+game+${encodeURIComponent(g.name)}" target="_blank" class="text-red-600 hover:text-red-700 opacity-50 hover:opacity-100 transition-opacity" title="Search on YouTube" onclick="event.stopPropagation()">
                                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
                                </a>
                            </div>
                            <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mt-0.5">${g.year} • ${g.players}p</div>
                        </div>
                        <div class="flex items-center justify-between bg-slate-50 px-2 py-1.5 rounded-xl border border-slate-100 mt-2">
                            <div class="flex flex-col items-center" title="BGG Rating">
                                <span class="text-[10px] font-800 text-indigo-600">⭐ ${g.rating.toFixed(1)}</span>
                            </div>
                            <div class="w-px h-3 bg-slate-200"></div>
                            <div class="flex flex-col items-center" title="BGG Rank">
                                <span class="text-[10px] font-800 text-slate-700">🏆 ${(g.rank < 99999 ? g.rank : '-')}</span>
                            </div>
                            <div class="w-px h-3 bg-slate-200"></div>
                            <div class="flex flex-col items-center" title="Weight">
                                <span class="text-[10px] font-800 text-slate-700">⚖️ ${g.weight.toFixed(2)}</span>
                            </div>
                            <div class="w-px h-3 bg-slate-200"></div>
                            <div class="flex flex-col items-center" title="Play Time">
                                <span class="text-[10px] font-800 text-emerald-600">⏱️ ${g.playingtime}m</span>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function renderExportModal() {
            const list = document.getElementById('columnList');
            list.innerHTML = exportColumns.map(col => {
                return `<div class="flex items-center gap-3 bg-slate-50 p-3 rounded-xl border border-slate-100 group">
                    <input type="checkbox" class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300" ${col.enabled ? 'checked' : ''} onchange="toggleCol('${col.id}')">
                    <span class="text-sm font-bold text-slate-700 flex-1">${col.label}</span>
                </div>`;
            }).join('');
        }

        window.toggleCol = function(id) {
            const col = exportColumns.find(c => c.id === id);
            if (col) col.enabled = !col.enabled;
        };

        function getCSVString() {
            const enabledCols = exportColumns.filter(c => c.enabled);
            if (enabledCols.length === 0) return null;

            const headers = enabledCols.map(c => c.label).join(',');
            const rows = games.map(g => {
                return enabledCols.map(col => {
                    let val = g[col.id] || '';
                    if (col.id === 'locations' && Array.isArray(val)) val = val.join('; ');
                    if (typeof val === 'string') return '"' + val.replace(/"/g, '""') + '"';
                    return val;
                }).join(',');
            });

            return headers + '\n' + rows.join('\n');
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            render();
        });
        
        document.getElementById('sortSelect').addEventListener('change', (e) => {
            currentSort = e.target.value;
            render();
        });

        document.getElementById('playerFilter').addEventListener('change', (e) => {
            playerFilter = e.target.value;
            render();
        });

        document.getElementById('openSettings').addEventListener('click', () => {
            document.getElementById('settingsModal').classList.remove('hidden');
        });

        document.getElementById('closeSettings').addEventListener('click', () => {
            document.getElementById('settingsModal').classList.add('hidden');
        });

        document.getElementById('saveSettings').addEventListener('click', () => {
            const source = document.querySelector('input[name="source"]:checked').value;
            document.getElementById('settingsModal').classList.add('hidden');
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('gameGrid').classList.add('hidden');
            
            if (source === 'convention') {
                fetchConventionLibrary();
            } else {
                const username = document.getElementById('settingsUsername').value.trim() || 'sportomax';
                fetchBGGCollection(username);
            }
        });

        document.getElementById('openExport').addEventListener('click', () => {
            renderExportModal();
            document.getElementById('exportModal').classList.remove('hidden');
        });

        document.getElementById('openExportDesktop').addEventListener('click', () => {
            renderExportModal();
            document.getElementById('exportModal').classList.remove('hidden');
        });

        document.getElementById('closeExport').addEventListener('click', () => {
            document.getElementById('exportModal').classList.add('hidden');
        });

        document.getElementById('btnSelectAll').addEventListener('click', () => {
            exportColumns.forEach(c => c.enabled = true);
            renderExportModal();
        });

        document.getElementById('btnSelectNone').addEventListener('click', () => {
            exportColumns.forEach(c => c.enabled = false);
            renderExportModal();
        });

        document.getElementById('copyCSV').addEventListener('click', () => {
            const csv = getCSVString();
            if (csv) {
                navigator.clipboard.writeText(csv);
                alert('Copied to clipboard!');
            }
        });

        document.getElementById('downloadCSV').addEventListener('click', () => {
            const csv = getCSVString();
            if (csv) {
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'bgg-library.csv';
                a.click();
            }
        });

        // Auto-load on page load
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('openSettings').click();
        });
    </script>
</body>
</html>
