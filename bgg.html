<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BGG Library Explorer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            min-height: 100vh;
        }
        .container { max-width: 1400px; }
        .game-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .game-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .thumb-container {
            width: 100px;
            height: 100px;
            min-width: 100px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 8px 0 0 8px;
        }
        .thumb-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 4px;
        }
        
        @media (max-width: 640px) {
            .thumb-container {
                width: 85px;
                height: 85px;
                min-width: 85px;
            }
            .game-card { height: auto; min-height: 85px; }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-900">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-3 w-full md:w-auto">
                <div class="bg-indigo-600 p-2 rounded-lg shadow-lg shadow-indigo-200">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C6.5 6.253 2 10.998 2 17s4.5 10.747 10 10.747c5.5 0 10-4.998 10-10.747 0-5.002-4.5-10.747-10-10.747z"></path></svg>
                </div>
                <div class="flex-1">
                    <h1 class="text-xl font-800 tracking-tight leading-none text-slate-900">BGG Library</h1>
                    <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mt-1">
                        <span id="gamesInLibrary">0 games</span> • Convention Library
                    </p>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
                <div class="relative flex-1 md:w-48">
                    <input type="text" id="searchInput" placeholder="Search..." 
                        class="w-full pl-9 pr-4 py-2 bg-slate-100 border-none rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 transition-all text-slate-900">
                    <svg class="w-4 h-4 absolute left-3 top-2.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                
                <div class="flex gap-2 w-full md:w-auto">
                    <select id="sortSelect" class="flex-1 md:w-auto bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm font-semibold outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-slate-900 appearance-none">
                        <option value="name" selected>Name</option>
                        <option value="checkout">Checkouts (Desc)</option>
                        <option value="condition">Condition</option>
                        <option value="year">Year</option>
                        <option value="added">Date Added</option>
                        <option value="modified">Date Modified</option>
                    </select>
                    <button id="exportBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-100 transition-all text-sm flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Export
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6">
        <div id="loader" class="flex flex-col items-center justify-center py-12">
            <div class="relative w-16 h-16">
                <div class="absolute inset-0 border-4 border-slate-100 rounded-full"></div>
                <div class="absolute inset-0 border-4 border-indigo-600 rounded-full border-t-transparent animate-spin"></div>
            </div>
            <p class="mt-4 text-slate-900 font-bold tracking-tight" id="loaderText">Loading library...</p>
            <p class="text-xs text-slate-400 mt-2 uppercase tracking-widest font-semibold" id="loaderSub">Fetching BGG Convention Games</p>
        </div>

        <div id="gamesContainer" class="hidden space-y-2">
            <!-- Games will be rendered here -->
        </div>
    </main>

    <!-- Export Modal -->
    <div id="exportModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[200] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden animate-in fade-in zoom-in duration-200">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <div>
                    <h2 class="text-xl font-800 text-slate-900">Export Library</h2>
                    <p class="text-xs text-slate-500 font-bold uppercase tracking-widest">CSV Configuration</p>
                </div>
                <button id="closeExport" class="p-2 hover:bg-slate-100 rounded-full transition-colors">
                    <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="p-6">
                <div class="flex justify-between mb-4">
                    <span class="text-xs font-800 text-slate-400 uppercase tracking-widest">Columns to Include</span>
                    <div class="flex gap-4">
                        <button id="btnSelectAll" class="text-xs font-bold text-indigo-600 hover:text-indigo-700">Select All</button>
                        <button id="btnSelectNone" class="text-xs font-bold text-slate-400 hover:text-slate-600">None</button>
                    </div>
                </div>
                
                <div id="columnList" class="space-y-2 max-h-[40vh] overflow-y-auto pr-2 custom-scrollbar">
                </div>

                <div class="mt-8 flex gap-3">
                    <button id="copyCSV" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-4 rounded-2xl transition-all flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                        Copy
                    </button>
                    <button id="downloadCSV" class="flex-[2] bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl shadow-lg shadow-indigo-100 transition-all flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Download CSV
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allGames = [];
        let currentSort = 'name';
        let searchQuery = '';

        const exportColumns = [
            { id: 'bgg_id', label: 'BGG ID', enabled: true },
            { id: 'name', label: 'Game Name', enabled: true },
            { id: 'publisher_name', label: 'Publisher', enabled: true },
            { id: 'checkout_count', label: 'Checkouts', enabled: true },
            { id: 'overall_condition', label: 'Condition', enabled: true },
            { id: 'Location', label: 'Location', enabled: true },
            { id: 'notes', label: 'Notes', enabled: true },
            { id: 'date_updated', label: 'Last Updated', enabled: true },
            { id: 'missing_components', label: 'Missing Components', enabled: false },
            { id: 'condition_notes', label: 'Condition Notes', enabled: false }
        ];

        async function fetchLibraryData() {
            try {
                const loader = document.getElementById('loader');
                const container = document.getElementById('gamesContainer');
                
                const response = await fetch('https://tabletop.events/api/library/0AEB11DA-2B7D-11EC-B400-855F800FD618/librarygames?_items_per_page=1000');
                const data = await response.json();
                
                allGames = (data.result?.items || []).map(game => ({
                    bgg_id: game.bgg_id || '',
                    objectid: game.bgg_id || '',
                    name: game.name || '',
                    publisher_name: game.publisher_name || '',
                    checkout_count: game.checkout_count || 0,
                    overall_condition: game.overall_condition || 'Good',
                    Location: game.custom_fields?.Location || game.Location || 'Not Specified',
                    notes: game.notes || '',
                    date_updated: game.date_updated || '',
                    date_created: game.date_created || '',
                    missing_components: game.missing_components ? 'Yes' : 'No',
                    condition_notes: game.condition_notes || '',
                    is_checked_out: game.is_checked_out || false,
                    view_uri: game.view_uri || ''
                }));

                document.getElementById('gamesInLibrary').textContent = allGames.length + ' games';
                loader.classList.add('hidden');
                container.classList.remove('hidden');
                
                render();
            } catch (error) {
                console.error('Error fetching library:', error);
                document.getElementById('loaderText').textContent = 'Error loading library';
                document.getElementById('loaderSub').textContent = error.message;
            }
        }

        function render() {
            const container = document.getElementById('gamesContainer');
            
            let filtered = allGames.filter(g => 
                g.name.toLowerCase().includes(searchQuery.toLowerCase())
            );

            // Sort
            if (currentSort === 'name') {
                filtered.sort((a, b) => a.name.localeCompare(b.name));
            } else if (currentSort === 'checkout') {
                filtered.sort((a, b) => (b.checkout_count || 0) - (a.checkout_count || 0));
            } else if (currentSort === 'condition') {
                filtered.sort((a, b) => a.overall_condition.localeCompare(b.overall_condition));
            } else if (currentSort === 'year') {
                filtered.sort((a, b) => new Date(b.date_created || 0) - new Date(a.date_created || 0));
            } else if (currentSort === 'added') {
                filtered.sort((a, b) => new Date(b.date_created || 0) - new Date(a.date_created || 0));
            } else if (currentSort === 'modified') {
                filtered.sort((a, b) => new Date(b.date_updated || 0) - new Date(a.date_updated || 0));
            }

            container.innerHTML = filtered.map(g => {
                const locTag = g.Location ? `<span class="px-1.5 py-0.5 bg-slate-100 text-slate-500 text-[10px] font-bold rounded uppercase border border-slate-200 tracking-wider">${g.Location}</span>` : '';
                const checkoutTag = g.checkout_count > 0 ? `<span class="px-1.5 py-0.5 bg-green-100 text-green-600 text-[10px] font-bold rounded uppercase border border-green-200 tracking-wider">📤 ${g.checkout_count}</span>` : '';
                const conditionColors = {
                    'Like New': 'bg-green-50 text-green-600 border-green-200',
                    'Very Good': 'bg-blue-50 text-blue-600 border-blue-200',
                    'Good': 'bg-yellow-50 text-yellow-600 border-yellow-200',
                    'Fair': 'bg-orange-50 text-orange-600 border-orange-200',
                    'Poor': 'bg-red-50 text-red-600 border-red-200'
                };
                const conditionClass = conditionColors[g.overall_condition] || 'bg-slate-100 text-slate-600 border-slate-200';
                const conditionTag = `<span class="px-1.5 py-0.5 ${conditionClass} text-[10px] font-bold rounded uppercase border tracking-wider">🎮 ${g.overall_condition}</span>`;

                return `
                <div class="game-card bg-white border border-slate-200 rounded-2xl overflow-hidden flex shadow-sm hover:shadow-md transition-all">
                    <div class="thumb-container group relative bg-white border-r border-slate-100">
                        <div class="w-full h-full flex items-center justify-center text-4xl bg-slate-50">📦</div>
                    </div>
                    <div class="flex-grow p-3 flex flex-col justify-between overflow-hidden">
                        <div class="flex flex-col gap-0.5 min-w-0">
                            <div class="flex items-center gap-1.5 flex-wrap mb-1">
                                ${checkoutTag} ${conditionTag} ${locTag}
                            </div>
                            <div class="flex justify-between items-start gap-2">
                                <h3 class="font-bold text-sm leading-tight text-slate-900 truncate flex-1 hover:text-indigo-600 transition-colors" title="${g.name}">${g.name}</h3>
                            </div>
                            <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mt-0.5">
                                BGG ID: ${g.bgg_id || 'N/A'} • ${g.publisher_name || 'Unknown'}
                            </div>
                            ${g.notes ? `<div class="text-[10px] text-slate-500 italic mt-1">📝 ${g.notes}</div>` : ''}
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function handleSort(value) {
            currentSort = value;
            render();
        }

        function handleSearch(value) {
            searchQuery = value;
            render();
        }

        function renderExportModal() {
            const list = document.getElementById('columnList');
            list.innerHTML = exportColumns.map((col, idx) => {
                return `<div class="flex items-center gap-3 bg-slate-50 p-3 rounded-xl border border-slate-100 group">
                    <input type="checkbox" class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300" ${col.enabled ? 'checked' : ''} onchange="toggleCol('${col.id}')">
                    <span class="text-sm font-bold text-slate-700 flex-1">${col.label}</span>
                </div>`;
            }).join('');
        }

        function toggleCol(id) {
            const col = exportColumns.find(c => c.id === id);
            if (col) col.enabled = !col.enabled;
        }

        function getCSVString() {
            const enabledCols = exportColumns.filter(c => c.enabled);
            if (enabledCols.length === 0) return null;

            const headers = enabledCols.map(c => c.label).join(',');
            const rows = allGames.map(g => {
                return enabledCols.map(col => {
                    let val = g[col.id] || '';
                    if (typeof val === 'string') return '"' + val.replace(/"/g, '""') + '"';
                    return val;
                }).join(',');
            });

            return headers + '\n' + rows.join('\n');
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', (e) => handleSearch(e.target.value));
        document.getElementById('sortSelect').addEventListener('change', (e) => handleSort(e.target.value));
        document.getElementById('exportBtn').addEventListener('click', () => {
            renderExportModal();
            document.getElementById('exportModal').classList.remove('hidden');
        });
        document.getElementById('closeExport').addEventListener('click', () => {
            document.getElementById('exportModal').classList.add('hidden');
        });
        document.getElementById('btnSelectAll').addEventListener('click', () => {
            exportColumns.forEach(c => c.enabled = true);
            renderExportModal();
        });
        document.getElementById('btnSelectNone').addEventListener('click', () => {
            exportColumns.forEach(c => c.enabled = false);
            renderExportModal();
        });
        document.getElementById('copyCSV').addEventListener('click', () => {
            const csv = getCSVString();
            if (csv) {
                navigator.clipboard.writeText(csv);
                alert('Copied to clipboard!');
            }
        });
        document.getElementById('downloadCSV').addEventListener('click', () => {
            const csv = getCSVString();
            if (csv) {
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'bgg-library.csv';
                a.click();
            }
        });

        // Load data on page load
        window.addEventListener('DOMContentLoaded', fetchLibraryData);
    </script>
</body>
</html>
