<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Board Game Top Tens</title><style>:root{color-scheme:dark;--b:#07111f;--p:#10233a;--l:#29425e;--t:#f8fafc;--m:#9fb0c5;--a:#6ee7b7}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px system-ui}.w{max-width:1450px;margin:auto;padding:14px}.bar,.panel,.card{background:var(--p);border:1px solid var(--l);border-radius:14px}.bar{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px;position:sticky;top:0;z-index:3}input,select,button{min-height:44px;border:1px solid var(--l);border-radius:10px;background:#081727;color:var(--t);padding:0 12px}button{cursor:pointer;font-weight:800}.run{background:#0ea5e9}.progress{margin:10px 0;padding:10px}.track{height:8px;background:#06111e;border-radius:9px;overflow:hidden}.fill{height:100%;background:var(--a);width:0}.tools{display:grid;grid-template-columns:1fr 130px auto;gap:8px;padding:10px;margin:10px 0}.filters{padding:10px}.tri{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.tri button{display:flex;justify-content:space-between;align-items:center}.tri b{font-size:11px;color:var(--a)}.nav{display:flex;gap:7px;overflow:auto;margin:10px 0}.nav button.on{background:var(--a);color:#052018}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{overflow:hidden}.head{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid var(--l)}.head h3{margin:0}.row{display:grid;grid-template-columns:28px 46px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid #ffffff12}.row img{width:46px;height:46px;object-fit:cover;border-radius:8px}.name{font-weight:800}.meta,.muted{color:var(--m);font-size:12px}.score{text-align:right;color:var(--a);font-weight:800}.empty{padding:30px;text-align:center;color:var(--m)}@media(max-width:850px){.grid{grid-template-columns:1fr}.tri{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.bar,.tools{grid-template-columns:1fr}.tri{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:24px 42px 1fr auto}.row img{width:42px;height:42px}}</style></head><body><div class="w"><h1>Board Game Top Tens</h1><p class="muted">Load the complete BGG collection first. Rankings and filters run only after all detail batches finish.</p><section class="bar"><input id="u" value="sportomax" aria-label="BGG username"><button id="run" class="run">Run full collection</button></section><section class="panel progress"><div id="pt">Nothing runs automatically.</div><div class="track"><div id="pf" class="fill"></div></div></section><section class="panel tools"><input id="q" placeholder="Search games" disabled><select id="lim" disabled><option>5</option><option selected>10</option><option>15</option><option>25</option></select><button id="share" disabled>Share view</button></section><section class="panel filters"><div id="tri" class="tri"></div></section><nav id="nav" class="nav"></nav><main id="grid" class="grid"><div class="panel empty">Enter a username and press Run full collection.</div></main></div><script>const A='/api/bgg-helper',S=['any','yes','no'],F=[['exp','Expansion'],['own','Owned'],['prevowned','Previously owned'],['fortrade','For trade'],['want','Want'],['wanttoplay','Want to play'],['wanttobuy','Want to buy'],['wishlist','Wishlist'],['preordered','Preordered']],G={Time:[['short','Shortest','minplaytime',1,' min'],['long','Longest','maxplaytime',-1,' min']],Weight:[['heavy','Heaviest','avgweight',-1,''],['light','Lightest','avgweight',1,'']],Ratings:[['myhi','My highest rated','user_rating',-1,''],['mylo','My lowest rated','user_rating',1,''],['bgghi','Highest BGG rating','bgg_rating',-1,''],['bgglo','Lowest BGG rating','bgg_rating',1,'']],Popularity:[['ownedhi','Most owned','owned_world',-1,''],['ownedlo','Least owned','owned_world',1,''],['wanthi','Most wanted','wanting',-1,''],['wantlo','Least wanted','wanting',1,''],['wishhi','Most wished','wishing',-1,''],['wishlo','Least wished','wishing',1,'']],Collection:[['playhi','Most played','numplays',-1,''],['playlo','Least played','numplays',1,'']],Identity:[['idhi','Largest BGG ID','bgg_id',-1,''],['idlo','Smallest BGG ID','bgg_id',1,''],['new','Newest','year',-1,''],['old','Oldest','year',1,''],['playerhi','Most players','maxplayers',-1,''],['playerlo','Fewest players','maxplayers',1,'']],Rank:[['best','Best BGG rank','rank',1,''],['worst','Worst BGG rank','rank',-1,'']]};let R=[],st=Object.fromEntries(F.map(x=>[x[0],'any'])),grp='All',loaded=false;const $=x=>document.querySelector(x),n=x=>+x||0,esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),wait=x=>new Promise(r=>setTimeout(r,x));function tri(){ $('#tri').innerHTML=F.map(([k,l])=>`<button data-k="${k}" disabled><span>${l}</span><b>${st[k]}</b></button>`).join('');document.querySelectorAll('#tri button').forEach(b=>b.onclick=()=>{let k=b.dataset.k;st[k]=S[(S.indexOf(st[k])+1)%3];b.querySelector('b').textContent=st[k];render()})}function nav(){let keys=['All',...Object.keys(G)];$('#nav').innerHTML=keys.map(k=>`<button class="${grp===k?'on':''}">${k}</button>`).join('');[...$('#nav').children].forEach((b,i)=>b.onclick=()=>{grp=keys[i];nav();render()})}function enable(v){['q','lim','share'].forEach(id=>$('#'+id).disabled=!v);document.querySelectorAll('#tri button').forEach(b=>b.disabled=!v)}async function ft(url){for(let i=0;i<9;i++){let r=await fetch(url);if(r.status===202){await wait(1500+i*500);continue}if(r.ok)return r.text();if(r.status>=500){await wait(1000*1.5**i);continue}throw Error('Request failed '+r.status)}throw Error('BGG timeout')}function coll(x){let d=new DOMParser().parseFromString(x,'text/xml');return [...d.querySelectorAll('items>item')].map(i=>{let s=i.querySelector('status');return{bgg_id:n(i.getAttribute('objectid')),numplays:n(i.querySelector('numplays')?.textContent),user_rating:n(i.querySelector('stats>rating')?.getAttribute('value')),own:s?.getAttribute('own')==='1',prevowned:s?.getAttribute('prevowned')==='1',fortrade:s?.getAttribute('fortrade')==='1',want:s?.getAttribute('want')==='1',wanttoplay:s?.getAttribute('wanttoplay')==='1',wanttobuy:s?.getAttribute('wanttobuy')==='1',wishlist:s?.getAttribute('wishlist')==='1',preordered:s?.getAttribute('preordered')==='1'}})}function things(x){let d=new DOMParser().parseFromString(x,'text/xml');return [...d.querySelectorAll('items>item')].map(i=>{let a=i.querySelector('statistics ratings'),v=s=>n(a?.querySelector(s)?.getAttribute('value')),rk=[...(a?.querySelectorAll('rank')||[])].find(r=>r.getAttribute('name')==='boardgame');return{bgg_id:n(i.id),exp:i.getAttribute('type')==='boardgameexpansion',name:i.querySelector('name[type="primary"]')?.getAttribute('value')||'Untitled',year:n(i.querySelector('yearpublished')?.getAttribute('value')),minplaytime:n(i.querySelector('minplaytime')?.getAttribute('value')),maxplaytime:n(i.querySelector('maxplaytime')?.getAttribute('value')),maxplayers:n(i.querySelector('maxplayers')?.getAttribute('value')),thumb:i.querySelector('thumbnail')?.textContent||'',bgg_rating:v('average'),avgweight:v('averageweight'),owned_world:v('owned'),wanting:v('wanting'),wishing:v('wishing'),rank:n(rk?.getAttribute('value'))}})}function prog(t,d,z){$('#pt').textContent=t;$('#pf').style.width=(z?Math.round(d/z*100):0)+'%'}async function run(){let u=$('#u').value.trim();if(!u)return;$('#run').disabled=true;enable(false);R=[];try{prog('Requesting complete collection…',0,1);let c=coll(await ft(`${A}?endpoint=collection&username=${encodeURIComponent(u)}&stats=1`)),m=new Map(c.map(x=>[x.bgg_id,x])),ids=c.map(x=>x.bgg_id),b=[];for(let i=0;i<ids.length;i+=20)b.push(ids.slice(i,i+20));let total=b.length,done=0,out=[],wc=Math.min(100,total);prog(`Running ${wc} parallel workers across ${total} batches…`,0,total);await Promise.all(Array.from({length:wc},async()=>{while(b.length){let x=b.shift();if(!x)break;out.push(...things(await ft(`${A}?endpoint=thing&id=${x.join(',')}&stats=1`)));prog(`Completed ${++done}/${total} batches with ${wc} workers`,done,total)}}));R=out.map(x=>({...x,...m.get(x.bgg_id)}));loaded=true;enable(true);prog(`Loaded ${R.length} records for @${u}`,1,1);render()}catch(e){prog(e.message,0,1)}finally{$('#run').disabled=false}}function source(){let q=$('#q').value.toLowerCase();return R.filter(r=>{if(q&&!r.name.toLowerCase().includes(q))return false;return F.every(([k])=>st[k]==='any'||(st[k]==='yes')===!!r[k])})}function list(c,s){let [id,t,f,d,u]=c,a=s.filter(r=>n(r[f])>0||['bgg_id','numplays','owned_world','wanting','wishing'].includes(f));a.sort((x,y)=>(n(x[f])-n(y[f]))*d||n(y.bgg_rating)-n(x.bgg_rating)||x.name.localeCompare(y.name));return a.slice(0,n($('#lim').value)||10)}function card(c,s){let a=list(c,s),[id,t,f,d,u]=c;return`<section class="card" id="${id}"><div class="head"><h3>${t}</h3><button onclick="shareList('${id}')">Share</button></div>${a.map((r,i)=>`<div class="row"><b>${i+1}</b><img src="${esc(r.thumb)}"><div><div class="name">${esc(r.name)}</div><div class="meta">${r.exp?'Expansion':'Base game'} · BGG ${n(r.bgg_rating).toFixed(2)}</div></div><div class="score">${n(r[f]).toLocaleString()}${u}</div></div>`).join('')||'<div class="empty">No records</div>'}</section>`}function render(){if(!loaded)return;let s=source(),cs=(grp==='All'?Object.values(G).flat():G[grp]);$('#grid').innerHTML=cs.map(c=>card(c,s)).join('')}window.shareList=async id=>{let c=Object.values(G).flat().find(x=>x[0]===id),a=list(c,source()),txt=a.map((r,i)=>`${i+1}. ${r.name}`).join('\n'),url=location.href+'#'+id;if(navigator.share)await navigator.share({title:c[1],text:txt,url});else await navigator.clipboard.writeText(txt+'\n'+url)};$('#run').onclick=run;$('#q').oninput=render;$('#lim').onchange=render;$('#share').onclick=()=>navigator.share?.({title:'Board Game Top Tens',url:location.href});tri();nav();enable(false);</script></body></html>
