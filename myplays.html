<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Counter | Sportomax</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 1);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        .status-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .tab-active {
            border-bottom: 2px solid #2563eb;
            color: #2563eb;
        }
        th.sortable { cursor: pointer; user-select: none; }
        th.sortable:hover { background-color: #f1f5f9; }
        
        .switch {
            position: relative;
            display: inline-block;
            width: 30px;
            height: 16px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #cbd5e1;
            transition: .4s;
            border-radius: 20px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 10px; width: 10px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #2563eb; }
        input:checked + .slider:before { transform: translateX(14px); }
        select { -webkit-appearance: none; appearance: none; }
    </style>
</head>
<body class="p-2 md:p-4">
    <div class="max-w-7xl mx-auto">
        <!-- Compact Integrated Header -->
        <div class="glass-card rounded-xl p-3 mb-3">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                    <h1 class="text-lg font-black text-slate-900 tracking-tighter uppercase">Play <span class="text-blue-600">Counter</span></h1>
                    <div id="statsBadge" class="hidden flex gap-1">
                        <span id="playCounter" class="bg-slate-800 text-white px-2 py-0.5 rounded text-[9px] font-bold">0 Plays</span>
                        <span id="collectionCounter" class="bg-blue-600 text-white px-2 py-0.5 rounded text-[9px] font-bold">0 Owned</span>
                    </div>
                </div>

                <div class="flex items-center gap-2 flex-grow sm:flex-grow-0">
                    <input type="text" id="username" value="sportomax" placeholder="BGG User"
                        class="px-2 py-1 rounded border border-slate-200 text-[11px] font-semibold outline-none w-24 focus:ring-1 focus:ring-blue-500">
                    
                    <div class="flex items-center gap-1 bg-slate-50 px-2 py-1 rounded border border-slate-100">
                        <input type="date" id="mindate" onchange="updateUI()" class="bg-transparent text-[9px] outline-none text-slate-500" title="Start Date Filter">
                        <span class="text-slate-300">→</span>
                        <input type="date" id="maxdate" onchange="updateUI()" class="bg-transparent text-[9px] outline-none text-slate-500" title="End Date Filter">
                    </div>

                    <button id="startBtn" onclick="startParsing()" 
                        class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-[11px] px-3 py-1 rounded transition-all shadow-sm flex items-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd" /></svg>
                        Sync
                    </button>
                </div>
            </div>

            <!-- Integrated Status/Progress -->
            <div id="statusSection" class="hidden mt-2 pt-2 border-t border-slate-100 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div id="pulseDot" class="w-1.5 h-1.5 bg-blue-500 rounded-full status-pulse"></div>
                    <span id="statusText" class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Scanning...</span>
                </div>
                <span id="pageInfo" class="text-[9px] font-mono text-slate-400">Ready</span>
            </div>
        </div>



        <!-- Main Workspace -->
        <div class="glass-card rounded-xl overflow-hidden flex flex-col min-h-[75vh]">
            <!-- Navigation Tabs -->
            <div class="flex border-b border-slate-100 bg-white/50">
                <button onclick="switchTab('plays')" id="tab-plays" class="px-4 py-3 text-[10px] font-bold uppercase tracking-wider tab-active whitespace-nowrap">History</button>
                <button onclick="switchTab('stats')" id="tab-stats" class="px-4 py-3 text-[10px] font-bold uppercase tracking-wider text-slate-400 whitespace-nowrap">Analytics</button>
                <button onclick="switchTab('locations')" id="tab-locations" class="px-4 py-3 text-[10px] font-bold uppercase tracking-wider text-slate-400 whitespace-nowrap">Locations</button>
                <button onclick="switchTab('unplayed')" id="tab-unplayed" class="px-4 py-3 text-[10px] font-bold uppercase tracking-wider text-slate-400 whitespace-nowrap">Unplayed</button>
            </div>

            <!-- View Controls & Filters -->
            <div class="p-2 border-b border-slate-100 flex flex-wrap justify-between items-center gap-2 bg-white/30">
                <div class="flex items-center gap-2 flex-grow max-w-2xl">
                    <div class="relative w-full max-w-[180px]">
                        <input type="text" id="tableFilter" onkeyup="filterView()" placeholder="Filter games..." 
                            class="w-full text-[10px] border border-slate-200 rounded pl-7 pr-2 py-1.5 outline-none focus:ring-1 focus:ring-blue-400 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 absolute left-2 top-2.5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </div>
                    
                    <!-- History Specific Filters -->
                    <div id="history-filters" class="flex items-center gap-2">
                        <select id="venueFilter" onchange="updateUI()" class="text-[10px] border border-slate-200 rounded px-2 py-1.5 outline-none bg-white text-slate-600 min-w-[100px]">
                            <option value="">All Venues</option>
                        </select>
                        <input type="number" id="yearFilter" oninput="updateUI()" placeholder="Year" class="w-16 text-[10px] border border-slate-200 rounded px-2 py-1.5 outline-none" title="Filter by Game Year Published">
                        
                        <!-- Copy Action -->
                        <button onclick="copyGameList()" class="ml-2 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded text-[9px] font-bold uppercase tracking-tighter flex items-center gap-1 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                            </svg>
                            Copy Games
                        </button>
                    </div>
                </div>

                <div id="view-controls" class="flex items-center gap-3">
                    <div id="stats-filters" class="hidden flex items-center gap-1.5">
                        <label class="switch"><input type="checkbox" id="ownedOnlyToggle" onchange="updateUI()"><span class="slider"></span></label>
                        <span class="text-[8px] font-bold text-slate-400 uppercase tracking-tighter">Owned</span>
                    </div>
                    <div id="locations-filters" class="hidden flex items-center gap-2">
                        <select id="locationTimePeriod" onchange="renderLocations()" class="text-[10px] border border-slate-200 rounded px-2 py-1.5 outline-none bg-white text-slate-600 min-w-[100px]">
                            <option value="7">Last 7 Days</option>
                            <option value="30">Last 30 Days</option>
                            <option value="365">Last Year</option>
                            <option value="999999">All Time</option>
                        </select>
                        <button onclick="openCalendarModal()" class="px-2 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded text-[11px] font-bold uppercase tracking-tighter flex items-center gap-1 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                            Calendar
                        </button>
                    </div>
                    <div id="unplayed-filters" class="hidden flex items-center gap-1.5">
                        <label class="switch"><input type="checkbox" id="ignoreExpansionsToggle" onchange="updateUI()"><span class="slider"></span></label>
                        <span class="text-[8px] font-bold text-slate-400 uppercase tracking-tighter">No Exp</span>
                    </div>
                </div>
            </div>

            <!-- Data Views -->
            <div id="view-plays" class="flex-1 overflow-y-auto custom-scrollbar">
                <table class="w-full text-left border-collapse">
                    <thead class="sticky top-0 bg-slate-50 text-slate-400 text-[8px] font-bold uppercase tracking-widest z-10">
                        <tr>
                            <th class="px-4 py-2 border-b w-12"></th>
                            <th class="px-4 py-2 border-b">Game</th>
                            <th class="px-4 py-2 border-b">Venue</th>
                            <th class="px-4 py-2 border-b text-right">Date</th>
                        </tr>
                    </thead>
                    <tbody id="playsTableBody" class="text-[11px] divide-y divide-slate-50"></tbody>
                </table>
            </div>

            <div id="view-stats" class="hidden flex-1 overflow-y-auto custom-scrollbar">
                <table class="w-full text-left border-collapse">
                    <thead class="sticky top-0 bg-slate-50 text-slate-400 text-[8px] font-bold uppercase tracking-widest z-10">
                        <tr>
                            <th class="px-4 py-2 border-b w-12"></th>
                            <th class="px-4 py-2 border-b sortable" onclick="sortStats('name')">Title</th>
                            <th class="px-4 py-2 border-b text-center sortable" onclick="sortStats('bga')">BGA</th>
                            <th class="px-4 py-2 border-b text-center sortable" onclick="sortStats('irl')">IRL</th>
                            <th class="px-4 py-2 border-b text-center sortable" onclick="sortStats('total')">Sum</th>
                            <th class="px-4 py-2 border-b text-center sortable" onclick="sortStats('lastBGA')">Last BGA</th>
                            <th class="px-4 py-2 border-b text-right sortable" onclick="sortStats('lastIRL')">Last IRL</th>
                        </tr>
                    </thead>
                    <tbody id="statsTableBody" class="text-[11px] divide-y divide-slate-50"></tbody>
                </table>
            </div>

            <div id="view-locations" class="hidden flex-1 overflow-y-auto custom-scrollbar">
                <table class="w-full text-left border-collapse">
                    <thead class="sticky top-0 bg-slate-50 text-slate-400 text-[8px] font-bold uppercase tracking-widest z-10">
                        <tr>
                            <th class="px-4 py-2 border-b sortable" onclick="sortLocations('location')">Location</th>
                            <th class="px-4 py-2 border-b text-center sortable" onclick="sortLocations('games')">Games</th>
                            <th class="px-4 py-2 border-b text-center sortable" onclick="sortLocations('days')">Days</th>
                            <th class="px-4 py-2 border-b text-center sortable" onclick="sortLocations('total')">Plays</th>
                            <th class="px-4 py-2 border-b text-right sortable" onclick="sortLocations('lastDate')">Last Date</th>
                        </tr>
                    </thead>
                    <tbody id="locationsTableBody" class="text-[11px] divide-y divide-slate-50"></tbody>
                </table>
            </div>

            <div id="view-unplayed" class="hidden flex-1 overflow-y-auto custom-scrollbar">
                <table class="w-full text-left border-collapse">
                    <thead class="sticky top-0 bg-slate-50 text-slate-400 text-[8px] font-bold uppercase tracking-widest z-10">
                        <tr>
                            <th class="px-4 py-2 border-b w-12"></th>
                            <th class="px-4 py-2 border-b">Game Title</th>
                            <th class="px-4 py-2 border-b text-right">Status</th>
                        </tr>
                    </thead>
                    <tbody id="unplayedTableBody" class="text-[11px] divide-y divide-slate-50"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Play Detail Modal -->
    <div id="playDetailModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center overflow-y-auto">
        <div class="bg-white rounded-xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-hidden my-4">
            <div class="bg-gradient-to-r from-blue-600 to-blue-800 text-white p-4 flex justify-between items-center sticky top-0">
                <h2 id="playDetailTitle" class="text-lg font-bold">Play Details</h2>
                <button onclick="closePlayDetailModal()" class="text-2xl font-light hover:text-blue-100">×</button>
            </div>
            <div id="playDetailContent" class="p-4 overflow-y-auto" style="max-height: calc(90vh - 60px);"></div>
        </div>
    </div>

    <!-- Calendar Modal -->
    <div id="calendarModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
        <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full max-h-[80vh] overflow-hidden">
            <div class="bg-gradient-to-r from-blue-600 to-blue-800 text-white p-4 flex justify-between items-center">
                <h2 class="text-lg font-bold">Plays Calendar</h2>
                <button onclick="closeCalendarModal()" class="text-2xl font-light hover:text-blue-100">×</button>
            </div>
            <div id="calendarContent" class="p-4 overflow-y-auto" style="max-height: calc(80vh - 60px);">
                <!-- Calendar will be rendered here -->
            </div>
        </div>
    </div>

    <!-- Location Stats Modal -->
    <div id="locationModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
        <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full max-h-[80vh] overflow-hidden">
            <div class="bg-gradient-to-r from-blue-600 to-blue-800 text-white p-4 flex justify-between items-center">
                <h2 id="locationModalTitle" class="text-lg font-bold">Location Details</h2>
                <button onclick="closeLocationModal()" class="text-2xl font-light hover:text-blue-100">×</button>
            </div>
            <div id="locationModalContent" class="p-4 overflow-y-auto" style="max-height: calc(80vh - 60px);"></div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-4 right-4 bg-slate-900 text-white text-[10px] px-4 py-2 rounded-lg transform translate-y-20 transition-transform duration-300 shadow-xl z-50">
        Copied to clipboard!
    </div>

    <script>
        const PLAY_FETCH_PARALLEL = 100; 
        const THING_BATCH_SIZE = 20; 
        const THING_PARALLEL_BATCHES = 100;
        // BGG bearer token redacted for security. Provide this value server-side
        // or via an environment-backed API. Do NOT commit secrets to the repo.
        const BGG_BEARER_TOKEN = ""; // TODO: set securely
        
        let totalPlays = [];
        let collection = []; 
        let ownedIds = new Set();
        let isRunning = false;
        let gameThumbnails = new Map();
        let gameTypes = new Map();
        let gameYears = new Map();
        let currentTab = 'plays';
        let statsSortField = 'total';
        let statsSortDir = -1;
        let locationsSortField = 'total';
        let locationsSortDir = -1;



        async function startParsing() {
            if (isRunning) return;
            const username = document.getElementById('username').value.trim();
            if (!username) return;

            isRunning = true;
            totalPlays = [];
            collection = [];
            ownedIds.clear();
            gameThumbnails.clear();
            gameTypes.clear();
            gameYears.clear();
            
            document.getElementById('statusSection').classList.remove('hidden');
            document.getElementById('statsBadge').classList.remove('hidden');
            document.getElementById('startBtn').disabled = true;
            document.getElementById('startBtn').classList.add('opacity-50');
            document.getElementById('pulseDot').className = "w-1.5 h-1.5 bg-blue-500 rounded-full status-pulse";
            
            updateStatus(`Syncing Collection...`);
            await fetchCollection(username);
            
            updateStatus(`Scanning History...`);
            let currentPageStart = 1;
            let stopFound = false;
            let playIdsToFetch = new Set();

            while (!stopFound) {
                const batchPromises = [];
                for (let i = 0; i < PLAY_FETCH_PARALLEL; i++) {
                    batchPromises.push(fetchPage(username, currentPageStart + i));
                }

                const results = await Promise.all(batchPromises);
                results.sort((a, b) => a.page - b.page);

                for (const res of results) {
                    if (res && res.plays && res.plays.length > 0) {
                        totalPlays.push(...res.plays);
                        res.plays.forEach(p => { if(p.gameId) playIdsToFetch.add(p.gameId); });
                    } else {
                        stopFound = true;
                    }
                }

                if (!stopFound) {
                    currentPageStart += PLAY_FETCH_PARALLEL;
                    document.getElementById('pageInfo').textContent = `${totalPlays.length} records`;
                    await new Promise(r => setTimeout(r, 600));
                }
            }

            // Populate Venues unique list
            const venues = [...new Set(totalPlays.map(p => p.location))].filter(v => v).sort();
            const venueSelect = document.getElementById('venueFilter');
            venueSelect.innerHTML = '<option value="">All Venues</option>' + venues.map(v => `<option value="${v}">${v}</option>`).join('');

            updateStatus(`Loading Icons & Metadata...`);
            const allIds = [...new Set([...ownedIds, ...playIdsToFetch])];
            const batchesOf20 = [];
            for (let i = 0; i < allIds.length; i += THING_BATCH_SIZE) {
                batchesOf20.push(allIds.slice(i, i + THING_BATCH_SIZE));
            }

            for (let i = 0; i < batchesOf20.length; i += THING_PARALLEL_BATCHES) {
                const currentParallelSet = batchesOf20.slice(i, i + THING_PARALLEL_BATCHES);
                document.getElementById('pageInfo').textContent = `Assets: ${i} / ${batchesOf20.length}`;
                await Promise.all(currentParallelSet.map(batch => fetchThingMetadataBatch(batch)));
                updateUI();
                if (i + THING_PARALLEL_BATCHES < batchesOf20.length) {
                    await new Promise(r => setTimeout(r, 500));
                }
            }

            finishParsing();
        }

        async function fetchCollection(username) {
            // Use the server-side BGG proxy for collection requests
            const url = `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1`;
            try {
                const response = await fetch(url);
                if (response.status === 202) {
                    await new Promise(r => setTimeout(r, 2000));
                    return fetchCollection(username);
                }
                const text = await response.text();
                const xml = new DOMParser().parseFromString(text, "text/xml");
                const items = xml.getElementsByTagName('item');
                for (let i = 0; i < items.length; i++) {
                    const id = items[i].getAttribute('objectid');
                    const name = items[i].getElementsByTagName('name')[0]?.textContent;
                    collection.push({ id, name });
                    ownedIds.add(id);
                }
                document.getElementById('collectionCounter').textContent = `${collection.length} Owned`;
            } catch (e) { console.error(e); }
        }

        async function fetchPage(username, page) {
            // Use the server-side BGG proxy for plays
            const url = `/api/bgg-helper?endpoint=plays&username=${encodeURIComponent(username)}&page=${page}`;
            try {
                const response = await fetch(url);
                const text = await response.text();
                const xml = new DOMParser().parseFromString(text, "text/xml");
                const playNodes = xml.getElementsByTagName('play');
                if (playNodes.length === 0) return { page, plays: [] };

                const pagePlays = [];
                for (let i = 0; i < playNodes.length; i++) {
                    const node = playNodes[i];
                    const item = node.getElementsByTagName('item')[0];
                    const serializer = new XMLSerializer();
                    pagePlays.push({
                        id: node.getAttribute('id'),
                        date: node.getAttribute('date'),
                        quantity: node.getAttribute('quantity') || '1',
                        length: node.getAttribute('length') || '0',
                        incomplete: node.getAttribute('incomplete') || '0',
                        nowinstats: node.getAttribute('nowinstats') || '0',
                        location: node.getAttribute('location') || 'IRL',
                        game: item ? item.getAttribute('name') : 'Unknown',
                        gameId: item ? item.getAttribute('objectid') : null,
                        rawXml: serializer.serializeToString(node)
                    });
                }
                return { page, plays: pagePlays };
            } catch (e) { return { page, plays: [] }; }
        }

        async function fetchThingMetadataBatch(ids) {
            if (ids.length === 0) return;
            // Use the server-side BGG proxy for thing requests
            const url = `/api/bgg-helper?endpoint=thing&id=${ids.join(',')}`;
            try {
                const response = await fetch(url);
                const text = await response.text();
                const xml = new DOMParser().parseFromString(text, "text/xml");
                const items = xml.getElementsByTagName('item');
                for (let i = 0; i < items.length; i++) {
                    const id = items[i].getAttribute('id');
                    const type = items[i].getAttribute('type'); 
                    
                    const thumbNode = items[i].getElementsByTagName('thumbnail')[0];
                    if (thumbNode) {
                        const thumb = thumbNode.textContent;
                        gameThumbnails.set(id, thumb.startsWith('//') ? 'https:' + thumb : thumb);
                    }
                    
                    const yearNode = items[i].getElementsByTagName('yearpublished')[0];
                    if (yearNode) {
                        gameYears.set(id, yearNode.getAttribute('value'));
                    }
                    
                    gameTypes.set(id, type);
                }
            } catch (e) { console.warn("Thing API error for batch", ids, e); }
        }

        function updateUI() {
            const filteredPlays = applyFilters(totalPlays);
            document.getElementById('playCounter').textContent = `${totalPlays.length} Plays`;
            renderPlays(filteredPlays);
            renderStats(filteredPlays);
            renderUnplayed(totalPlays);
        }

        function renderPlays(plays) {
            const tbody = document.getElementById('playsTableBody');
            tbody.innerHTML = plays.map(p => {
                const year = gameYears.get(p.gameId);
                return `
                <tr class="hover:bg-slate-50 transition-colors cursor-pointer" onclick="showPlayDetail('${p.id}')">
                    <td class="px-4 py-1.5">
                        <div class="w-7 h-7 rounded bg-slate-100 overflow-hidden flex items-center justify-center border border-slate-200/50">
                            ${gameThumbnails.has(p.gameId) ? `<img src="${gameThumbnails.get(p.gameId)}" class="w-full h-full object-cover">` : '<div class="text-[5px] text-slate-300">...</div>'}
                        </div>
                    </td>
                    <td class="px-4 py-1.5">
                        <div class="font-bold text-slate-700 leading-tight">${p.game}</div>
                        ${year ? `<div class="text-[8px] text-slate-400 font-mono mt-0.5">${year}</div>` : ''}
                    </td>
                    <td class="px-4 py-1.5 text-[9px] text-slate-400 font-medium">${p.location}</td>
                    <td class="px-4 py-1.5 text-right font-mono text-[9px] text-slate-400">${p.date}</td>
                </tr>
            `}).join('') || '<tr><td colspan="4" class="py-10 text-center text-slate-300 text-[10px]">No records match selected filters.</td></tr>';
        }

        function renderStats(plays) {
            const ownedOnly = document.getElementById('ownedOnlyToggle').checked;
            const statsMap = new Map();
            plays.forEach(p => {
                if (ownedOnly && !ownedIds.has(p.gameId)) return;
                if (!statsMap.has(p.gameId)) {
                    statsMap.set(p.gameId, { id: p.gameId, name: p.game, bga: 0, irl: 0, total: 0, lastBGA: '', lastIRL: '' });
                }
                const s = statsMap.get(p.gameId);
                const loc = (p.location || '').toLowerCase();
                const isBGA = loc.includes('boardgamearena') || loc.includes('bga');
                if (isBGA) {
                    s.bga++;
                    if (!s.lastBGA || p.date > s.lastBGA) s.lastBGA = p.date;
                } else {
                    s.irl++;
                    if (!s.lastIRL || p.date > s.lastIRL) s.lastIRL = p.date;
                }
                s.total++;
            });

            const statsArr = [...statsMap.values()].sort((a, b) => {
                let valA = a[statsSortField];
                let valB = b[statsSortField];
                if (typeof valA === 'string') { valA = valA.toLowerCase(); valB = valB.toLowerCase(); }
                return valA < valB ? -1 * statsSortDir : (valA > valB ? 1 * statsSortDir : 0);
            });

            const tbody = document.getElementById('statsTableBody');
            tbody.innerHTML = statsArr.map(s => `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="px-4 py-1.5">
                        <div class="w-7 h-7 rounded bg-slate-100 overflow-hidden flex items-center justify-center border border-slate-200/50">
                            ${gameThumbnails.has(s.id) ? `<img src="${gameThumbnails.get(s.id)}" class="w-full h-full object-cover">` : '<div class="text-[5px] text-slate-300">...</div>'}
                        </div>
                    </td>
                    <td class="px-4 py-1.5 font-bold text-slate-700">${s.name}</td>
                    <td class="px-4 py-1.5 text-center text-blue-600 font-bold">${s.bga || '0'}</td>
                    <td class="px-4 py-1.5 text-center text-slate-500">${s.irl || '0'}</td>
                    <td class="px-4 py-1.5 text-center font-black text-slate-900">${s.total}</td>
                    <td class="px-4 py-1.5 text-center font-mono text-[8px] text-slate-300">${s.lastBGA || '-'}</td>
                    <td class="px-4 py-1.5 text-right font-mono text-[8px] text-slate-300">${s.lastIRL || '-'}</td>
                </tr>
            `).join('');
        }

        function renderUnplayed(allPlays) {
            const ignoreExpansions = document.getElementById('ignoreExpansionsToggle').checked;
            const playedIds = new Set(allPlays.map(p => p.gameId));
            const unplayed = collection.filter(c => {
                if (playedIds.has(c.id)) return false;
                if (ignoreExpansions && gameTypes.get(c.id) === 'boardgameexpansion') return false;
                return true;
            });
            const tbody = document.getElementById('unplayedTableBody');
            tbody.innerHTML = unplayed.map(u => `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="px-4 py-1.5">
                        <div class="w-7 h-7 rounded bg-slate-100 overflow-hidden flex items-center justify-center border border-slate-200/50">
                            ${gameThumbnails.has(u.id) ? `<img src="${gameThumbnails.get(u.id)}" class="w-full h-full object-cover">` : '<div class="text-[5px] text-slate-300">...</div>'}
                        </div>
                    </td>
                    <td class="px-4 py-1.5 font-bold text-slate-700">${u.name}</td>
                    <td class="px-4 py-1.5 text-right"><span class="px-1.5 py-0.5 bg-red-50 text-red-500 text-[8px] font-bold rounded">UNPLAYED</span></td>
                </tr>
            `).join('');
        }

        function copyGameList() {
            const currentFilteredPlays = applyFilters(totalPlays);
            const distinctGames = [...new Set(currentFilteredPlays.map(p => p.game))].sort();
            
            if (distinctGames.length === 0) return;

            const text = distinctGames.join('\n');
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);

            // Toast notification
            const toast = document.getElementById('toast');
            toast.classList.remove('translate-y-20');
            setTimeout(() => toast.classList.add('translate-y-20'), 2000);
        }

        function sortStats(field) {
            if (statsSortField === field) statsSortDir *= -1;
            else { statsSortField = field; statsSortDir = -1; }
            renderStats(applyFilters(totalPlays));
        }

        function switchTab(tab) {
            currentTab = tab;
            ['plays', 'stats', 'locations', 'unplayed'].forEach(t => {
                document.getElementById(`view-${t}`).classList.toggle('hidden', t !== tab);
                document.getElementById(`tab-${t}`).classList.toggle('tab-active', t === tab);
                document.getElementById(`tab-${t}`).classList.toggle('text-slate-400', t !== tab);
            });
            document.getElementById('history-filters').classList.toggle('hidden', tab !== 'plays');
            document.getElementById('stats-filters').classList.toggle('hidden', tab !== 'stats');
            document.getElementById('locations-filters').classList.toggle('hidden', tab !== 'locations');
            document.getElementById('unplayed-filters').classList.toggle('hidden', tab !== 'unplayed');
            if (tab === 'locations') renderLocations();
            else filterView();
        }

        function applyFilters(plays) {
            const min = document.getElementById('mindate').value;
            const max = document.getElementById('maxdate').value;
            const venue = document.getElementById('venueFilter').value;
            const year = document.getElementById('yearFilter').value;
            
            return plays.filter(p => {
                const dateMatch = (!min || p.date >= min) && (!max || p.date <= max);
                const venueMatch = !venue || p.location === venue;
                const gameYear = gameYears.get(p.gameId);
                const yearMatch = !year || (gameYear && gameYear === year);
                return dateMatch && venueMatch && yearMatch;
            });
        }

        function filterView() {
            const query = document.getElementById('tableFilter').value.toLowerCase();
            const rows = document.querySelectorAll(`#view-${currentTab} tbody tr`);
            rows.forEach(r => { 
                const text = r.innerText.toLowerCase();
                r.style.display = text.includes(query) ? "" : "none"; 
            });
        }

        function updateStatus(text) { document.getElementById('statusText').textContent = text; }
        
        function renderLocations() {
            const days = parseInt(document.getElementById('locationTimePeriod').value) || 999999;
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - days);
            const cutoffStr = cutoffDate.toISOString().split('T')[0];
            
            const locStats = {};
            totalPlays.forEach(p => {
                if (p.date < cutoffStr) return;
                const loc = p.location || 'IRL';
                if (!locStats[loc]) {
                    locStats[loc] = { games: new Set(), days: new Set(), total: 0, lastDate: '' };
                }
                locStats[loc].games.add(p.gameId);
                locStats[loc].days.add(p.date);
                locStats[loc].total++;
                if (!locStats[loc].lastDate || p.date > locStats[loc].lastDate) {
                    locStats[loc].lastDate = p.date;
                }
            });
            
            const tbody = document.getElementById('locationsTableBody');
            let sorted = Object.entries(locStats)
                .map(([loc, stats]) => ({
                    location: loc,
                    games: stats.games.size,
                    days: stats.days.size,
                    total: stats.total,
                    lastDate: stats.lastDate
                }));
            
            // Apply sorting
            sorted.sort((a, b) => {
                let aVal = a[locationsSortField];
                let bVal = b[locationsSortField];
                
                if (locationsSortField === 'location') {
                    return locationsSortDir * aVal.localeCompare(bVal);
                } else if (locationsSortField === 'lastDate') {
                    return locationsSortDir * (aVal.localeCompare(bVal));
                } else {
                    return locationsSortDir * (bVal - aVal);
                }
            });
            
            tbody.innerHTML = sorted.map(s => `
                <tr class="hover:bg-slate-50 transition-colors cursor-pointer" onclick="showLocationStats('${s.location}')">
                    <td class="px-4 py-2 font-bold text-slate-700">${s.location}</td>
                    <td class="px-4 py-2 text-center text-blue-600 font-semibold">${s.games}</td>
                    <td class="px-4 py-2 text-center text-green-600 font-semibold">${s.days}</td>
                    <td class="px-4 py-2 text-center text-purple-600 font-bold">${s.total}</td>
                    <td class="px-4 py-2 text-right text-slate-600 font-semibold text-[10px]">${s.lastDate || 'N/A'}</td>
                </tr>
            `).join('');
        }
        
        function showLocationStats(location) {
            const days = parseInt(document.getElementById('locationTimePeriod').value) || 999999;
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - days);
            const cutoffStr = cutoffDate.toISOString().split('T')[0];
            
            const plays = totalPlays.filter(p => p.location === location && p.date >= cutoffStr);
            const games = [...new Set(plays.map(p => p.gameId))];
            const uniqueDays = [...new Set(plays.map(p => p.date))];
            
            const periodText = {
                '7': 'Last 7 Days',
                '30': 'Last 30 Days',
                '365': 'Last Year',
                '999999': 'All Time'
            }[days] || 'Period';
            
            document.getElementById('locationModalTitle').textContent = `${location} - ${periodText}`;
            
            let html = `
                <div class="grid grid-cols-3 gap-3 mb-4">
                    <div class="bg-blue-50 border border-blue-200 rounded p-3 text-center">
                        <div class="text-2xl font-bold text-blue-700">${games.length}</div>
                        <div class="text-xs text-blue-600 font-semibold mt-1">DISTINCT GAMES</div>
                    </div>
                    <div class="bg-green-50 border border-green-200 rounded p-3 text-center">
                        <div class="text-2xl font-bold text-green-700">${uniqueDays.length}</div>
                        <div class="text-xs text-green-600 font-semibold mt-1">DISTINCT DAYS</div>
                    </div>
                    <div class="bg-purple-50 border border-purple-200 rounded p-3 text-center">
                        <div class="text-2xl font-bold text-purple-700">${plays.length}</div>
                        <div class="text-xs text-purple-600 font-semibold mt-1">TOTAL PLAYS</div>
                    </div>
                </div>
                
                <div class="mb-4">
                    <h3 class="text-sm font-bold text-slate-800 mb-2">Games Played</h3>
                    <div class="grid grid-cols-2 gap-2">
            `;
            
            const gamesByCount = {};
            plays.forEach(p => {
                gamesByCount[p.gameId] = (gamesByCount[p.gameId] || 0) + 1;
            });
            
            Object.entries(gamesByCount)
                .sort((a, b) => b[1] - a[1])
                .forEach(([gameId, count]) => {
                    const play = plays.find(p => p.gameId === gameId);
                    html += `
                        <div class="bg-slate-50 rounded p-2 border border-slate-200 flex items-start gap-2">
                            ${gameThumbnails.has(gameId) ? `<img src="${gameThumbnails.get(gameId)}" class="w-6 h-6 rounded object-cover flex-shrink-0">` : '<div class="w-6 h-6 bg-slate-200 rounded flex-shrink-0"></div>'}
                            <div class="flex-1 min-w-0">
                                <div class="font-semibold text-[10px] text-slate-800 truncate">${play.game}</div>
                                <div class="text-[9px] text-slate-500 font-mono">${count} play${count !== 1 ? 's' : ''}</div>
                            </div>
                        </div>
                    `;
                });
            
            html += `</div></div>`;
            document.getElementById('locationModalContent').innerHTML = html;
            document.getElementById('locationModal').classList.remove('hidden');
        }
        
        function closeLocationModal() {
            document.getElementById('locationModal').classList.add('hidden');
        }
        
        function sortLocations(field) {
            if (locationsSortField === field) {
                locationsSortDir = locationsSortDir === 1 ? -1 : 1;
            } else {
                locationsSortField = field;
                locationsSortDir = field === 'location' ? 1 : -1;
            }
            renderLocations();
        }
        
        function openCalendarModal() {
            renderCalendar();
            document.getElementById('calendarModal').classList.remove('hidden');
        }
        
        function closeCalendarModal() {
            document.getElementById('calendarModal').classList.add('hidden');
        }
        
        function renderCalendar() {
            const days = parseInt(document.getElementById('locationTimePeriod').value) || 999999;
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - days);
            
            // Count plays per day
            const playsByDay = {};
            totalPlays.forEach(p => {
                if (p.date < cutoffDate.toISOString().split('T')[0]) return;
                playsByDay[p.date] = (playsByDay[p.date] || 0) + 1;
            });
            
            // Generate months to display (last 12 months from today)
            let html = '<div class="space-y-6">';
            const today = new Date();
            
            for (let m = 11; m >= 0; m--) {
                const monthDate = new Date(today.getFullYear(), today.getMonth() - m, 1);
                const year = monthDate.getFullYear();
                const month = monthDate.getMonth();
                
                const monthName = monthDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                
                html += `<div class="border border-slate-200 rounded-lg p-3">
                    <h3 class="font-bold text-slate-700 mb-3 text-sm">${monthName}</h3>
                    <div class="grid grid-cols-7 gap-1">`;
                
                // Day headers
                ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(d => {
                    html += `<div class="text-center text-[9px] font-bold text-slate-400 py-1">${d}</div>`;
                });
                
                // Empty cells for days before month starts
                for (let i = 0; i < firstDay; i++) {
                    html += '<div></div>';
                }
                
                // Days of month
                for (let day = 1; day <= daysInMonth; day++) {
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    const count = playsByDay[dateStr] || 0;
                    const isPast = new Date(year, month, day) > today;
                    
                    html += `<div class="text-center p-1.5 rounded border border-slate-100 ${isPast ? 'bg-white' : 'hover:bg-blue-50'} transition-colors">
                        <div class="text-[9px] font-semibold text-gray-300">${day}</div>
                        ${count > 0 ? `<div class="text-[10px] font-bold text-slate-800">${count}</div>` : ''}
                    </div>`;
                }
                
                html += '</div></div>';
            }
            
            html += '</div>';
            document.getElementById('calendarContent').innerHTML = html;
        }
        
        function showPlayDetail(playId) {
            const play = totalPlays.find(p => p.id === playId);
            if (!play) return;
            
            const xmlDoc = new DOMParser().parseFromString(play.rawXml, 'text/xml');
            const playNode = xmlDoc.getElementsByTagName('play')[0];
            
            let html = '<div class="space-y-4">';
            
            // Basic play info
            html += `
                <div class="grid grid-cols-2 gap-3 md:grid-cols-4">
                    <div class="bg-blue-50 border border-blue-200 rounded p-2">
                        <div class="text-[8px] font-bold text-blue-600 uppercase">Play ID</div>
                        <div class="text-sm font-mono text-slate-700">${play.id}</div>
                    </div>
                    <div class="bg-green-50 border border-green-200 rounded p-2">
                        <div class="text-[8px] font-bold text-green-600 uppercase">Date</div>
                        <div class="text-sm font-mono text-slate-700">${play.date}</div>
                    </div>
                    <div class="bg-purple-50 border border-purple-200 rounded p-2">
                        <div class="text-[8px] font-bold text-purple-600 uppercase">Location</div>
                        <div class="text-sm font-mono text-slate-700">${play.location}</div>
                    </div>
                    <div class="bg-amber-50 border border-amber-200 rounded p-2">
                        <div class="text-[8px] font-bold text-amber-600 uppercase">Quantity</div>\n                        <div class="text-sm font-mono text-slate-700">${play.quantity}</div>
                    </div>
                </div>
            `;
            
            // Game item info
            const item = playNode.getElementsByTagName('item')[0];
            if (item) {
                html += `
                    <div class="bg-slate-50 border border-slate-200 rounded-lg p-3">
                        <h3 class="font-bold text-slate-800 mb-2 text-sm">Game</h3>
                        <div class="space-y-1">
                            <div><span class="text-[9px] font-semibold text-slate-500 uppercase">Name:</span> <span class="text-slate-700 font-medium">${item.getAttribute('name')}</span></div>
                            <div><span class="text-[9px] font-semibold text-slate-500 uppercase">Object ID:</span> <span class="text-slate-700 font-mono">${item.getAttribute('objectid')}</span></div>
                            <div><span class="text-[9px] font-semibold text-slate-500 uppercase">Object Type:</span> <span class="text-slate-700">${item.getAttribute('objecttype')}</span></div>
                        </div>
                    </div>
                `;
            }
            
            // Comments
            const comments = playNode.getElementsByTagName('comments')[0];
            if (comments && comments.textContent.trim()) {
                html += `
                    <div class="bg-slate-50 border border-slate-200 rounded-lg p-3">
                        <h3 class="font-bold text-slate-800 mb-2 text-sm">Comments</h3>
                        <div class="text-sm text-slate-700 italic">${comments.textContent}</div>
                    </div>
                `;
            }
            
            // Players section
            const playersNode = playNode.getElementsByTagName('players')[0];
            if (playersNode) {
                const playerElements = playersNode.getElementsByTagName('player');
                if (playerElements.length > 0) {
                    html += `
                        <div class="bg-slate-50 border border-slate-200 rounded-lg p-3">
                            <h3 class="font-bold text-slate-800 mb-3 text-sm">Players (${playerElements.length})</h3>
                            <div class="space-y-2">
                    `;
                    
                    for (let i = 0; i < playerElements.length; i++) {
                        const player = playerElements[i];
                        const username = player.getAttribute('username') || player.getAttribute('name') || 'Unknown';
                        const score = player.getAttribute('score') || '-';
                        const rating = player.getAttribute('rating') || '0';
                        const win = player.getAttribute('win') === '1' ? '✓ Won' : '';
                        const color = player.getAttribute('color') || '-';
                        const position = player.getAttribute('startposition') || '-';
                        
                        html += `
                            <div class="border border-slate-200 rounded p-2 bg-white">
                                <div class="flex justify-between items-start gap-2 mb-1">
                                    <div class="font-semibold text-slate-800 text-sm">${username}</div>
                                    <div class="flex gap-2">
                                        ${win ? `<span class="bg-green-100 text-green-800 text-[9px] font-bold px-2 py-0.5 rounded">${win}</span>` : ''}
                                    </div>
                                </div>
                                <div class="grid grid-cols-4 gap-2 text-[9px]">
                                    <div><span class="text-slate-500 font-semibold">Score:</span> <span class="font-mono text-slate-700">${score}</span></div>
                                    <div><span class="text-slate-500 font-semibold">Rating:</span> <span class="font-mono text-slate-700">${rating}</span></div>
                                    <div><span class="text-slate-500 font-semibold">Color:</span> <span class="font-mono text-slate-700">${color}</span></div>
                                    <div><span class="text-slate-500 font-semibold">Position:</span> <span class="font-mono text-slate-700">${position}</span></div>
                                </div>
                            </div>
                        `;
                    }
                    
                    html += `
                            </div>
                        </div>
                    `;
                }
            }
            
            // Play attributes
            html += `
                <div class="bg-slate-50 border border-slate-200 rounded-lg p-3">
                    <h3 class="font-bold text-slate-800 mb-2 text-sm">Play Attributes</h3>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-[9px]">
                        <div><span class="font-semibold text-slate-500">Length:</span> <span class="font-mono text-slate-700">${play.length} min</span></div>
                        <div><span class="font-semibold text-slate-500">Incomplete:</span> <span class="font-mono text-slate-700">${play.incomplete === '1' ? 'Yes' : 'No'}</span></div>
                        <div><span class="font-semibold text-slate-500">Nowinstats:</span> <span class="font-mono text-slate-700">${play.nowinstats === '1' ? 'Yes' : 'No'}</span></div>
                    </div>
                </div>
            `;\n            \n            html += '</div>';\n            document.getElementById('playDetailTitle').textContent = `${play.game} - ${play.date}`;\n            document.getElementById('playDetailContent').innerHTML = html;\n            document.getElementById('playDetailModal').classList.remove('hidden');\n        }\n        \n        function closePlayDetailModal() {\n            document.getElementById('playDetailModal').classList.add('hidden');\n        }
        
        function finishParsing() {
            isRunning = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('startBtn').classList.remove('opacity-50');
            document.getElementById('pulseDot').className = "w-1.5 h-1.5 bg-emerald-500 rounded-full";
            document.getElementById('pageInfo').textContent = `Done: ${totalPlays.length} records`;
            updateStatus('Sync Complete');
        }
    </script>
</body>
