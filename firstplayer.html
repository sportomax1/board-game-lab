<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>🎯 Ultimate First Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), transparent),
                              radial-gradient(circle at bottom left, rgba(236, 72, 153, 0.1), transparent);
            color: #f8fafc;
            overflow: hidden;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .method-card { transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .method-card:hover { transform: translateY(-5px) scale(1.02); }
        .method-card:active { transform: scale(0.95); }

        /* Touch Selection (Enhanced) */
        #touch-surface { position: fixed; inset: 0; z-index: 50; display: none; }
        .finger-circle {
            position: absolute; width: 100px; height: 100px; border-radius: 50%;
            transform: translate(-50%, -50%); border: 4px solid white;
            box-shadow: 0 0 30px currentColor; transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            pointer-events: none; display: flex; align-items: center; justify-content: center;
        }
        .finger-circle::before {
            content: ''; position: absolute; inset: -15px; border-radius: 50%;
            border: 2px dashed currentColor; opacity: 0.3; animation: rotate 4s linear infinite;
        }
        .finger-circle::after {
            content: ''; position: absolute; inset: 5px; border-radius: 50%;
            border: 2px solid white; opacity: 0.5; transform: scale(var(--progress, 0));
            transition: transform 0.1s linear;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .finger-circle.selecting { animation: selecting-pulse 0.3s infinite alternate; }
        @keyframes selecting-pulse { from { transform: translate(-50%, -50%) scale(1); } to { transform: translate(-50%, -50%) scale(1.1); } }
        
        .finger-circle.winner { 
            width: 200px; height: 200px; border-width: 12px; 
            box-shadow: 0 0 120px currentColor; z-index: 100;
            background: rgba(255,255,255,0.15);
        }
        .finger-circle.winner::after { transform: scale(1.5); opacity: 0; transition: all 0.5s; }

        .touch-countdown {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 8rem; font-weight: 900; color: white; opacity: 0.2;
            pointer-events: none; text-shadow: 0 0 30px rgba(99, 102, 241, 0.5);
        }

        .scan-line {
            position: absolute; left: 0; right: 0; height: 2px;
            background: linear-gradient(to right, transparent, #6366f1, transparent);
            box-shadow: 0 0 20px #6366f1; pointer-events: none;
            animation: scan 2s linear infinite; z-index: 40; opacity: 0.3;
        }
        @keyframes scan { from { top: 0; } to { top: 100%; } }

        /* Spinner Wheel */
        .wheel-container {
            width: 300px; height: 300px; position: relative; border-radius: 50%;
            border: 8px solid rgba(255,255,255,0.1); overflow: hidden;
            transition: transform 4s cubic-bezier(0.1, 0, 0.1, 1);
        }
        .wheel-pointer {
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent;
            border-top: 30px solid #ef4444; z-index: 10; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.5));
        }

        /* 3D Dice with Pips */
        .dice-scene { width: 100px; height: 100px; perspective: 600px; }
        .dice {
            width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.17, 0.67, 0.83, 0.67);
        }
        .dice-face {
            position: absolute; width: 100px; height: 100px; background: white;
            border: 2px solid #e2e8f0; border-radius: 1rem; display: grid;
            grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 10px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
        }
        .pip { background: #1e293b; border-radius: 50%; width: 18px; height: 18px; align-self: center; justify-self: center; }
        
        .face-1 { transform: rotateY(0deg) translateZ(50px); }
        .face-2 { transform: rotateY(90deg) translateZ(50px); }
        .face-3 { transform: rotateX(90deg) translateZ(50px); }
        .face-4 { transform: rotateX(-90deg) translateZ(50px); }
        .face-5 { transform: rotateY(-90deg) translateZ(50px); }
        .face-6 { transform: rotateY(180deg) translateZ(50px); }

        .face-1 .pip:nth-child(1) { grid-area: 2 / 2; }
        .face-2 .pip:nth-child(1) { grid-area: 1 / 1; } .face-2 .pip:nth-child(2) { grid-area: 3 / 3; }
        .face-3 .pip:nth-child(1) { grid-area: 1 / 1; } .face-3 .pip:nth-child(2) { grid-area: 2 / 2; } .face-3 .pip:nth-child(3) { grid-area: 3 / 3; }
        .face-4 .pip:nth-child(1) { grid-area: 1 / 1; } .face-4 .pip:nth-child(2) { grid-area: 1 / 3; } .face-4 .pip:nth-child(3) { grid-area: 3 / 1; } .face-4 .pip:nth-child(4) { grid-area: 3 / 3; }
        .face-5 .pip:nth-child(1) { grid-area: 1 / 1; } .face-5 .pip:nth-child(2) { grid-area: 1 / 3; } .face-5 .pip:nth-child(3) { grid-area: 2 / 2; } .face-5 .pip:nth-child(4) { grid-area: 3 / 1; } .face-5 .pip:nth-child(5) { grid-area: 3 / 3; }
        .face-6 .pip:nth-child(1) { grid-area: 1 / 1; } .face-6 .pip:nth-child(2) { grid-area: 1 / 3; } .face-6 .pip:nth-child(3) { grid-area: 2 / 1; } .face-6 .pip:nth-child(4) { grid-area: 2 / 3; } .face-6 .pip:nth-child(5) { grid-area: 3 / 1; } .face-6 .pip:nth-child(6) { grid-area: 3 / 3; }

        /* Color Method (Enhanced) */
        .color-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 100%; max-width: 400px; margin-bottom: 2rem; }
        .color-bubble {
            width: 100%; aspect-ratio: 1/1; border-radius: 50%; cursor: pointer;
            border: 3px solid transparent; transition: all 0.2s; position: relative;
        }
        .color-bubble.active { border-color: white; box-shadow: 0 0 15px currentColor; transform: scale(1.1); }
        .color-bubble::after {
            content: '✓'; position: absolute; inset: 0; display: flex; align-items: center; 
            justify-content: center; font-weight: 900; color: white; opacity: 0;
        }
        .color-bubble.active::after { opacity: 1; }

        .winner-display {
            width: 180px; height: 180px; border-radius: 3rem; border: 4px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center; font-size: 4rem;
            margin-bottom: 2rem; transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .winner-display.revealed { transform: scale(1.1); border-color: white; box-shadow: 0 0 50px currentColor; }
    </style>
</head>
<body class="h-screen flex flex-col items-center p-4">

    <header class="w-full max-w-4xl flex items-center justify-between mb-6 z-[100] relative">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-indigo-500/20 rounded-xl">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
            </div>
            <h1 class="text-2xl md:text-3xl font-black tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-emerald-400 uppercase">First Player</h1>
        </div>
        <button id="homeBtn" onclick="showScreen('menu')" class="hidden glass px-4 py-2 rounded-xl text-xs font-black uppercase tracking-widest text-slate-400 hover:text-white transition-all pointer-events-auto">Menu</button>
    </header>

    <main class="flex-1 w-full max-w-4xl relative overflow-hidden flex flex-col items-center justify-center">
        <!-- Main Menu -->
        <div id="screen-menu" class="w-full h-full grid grid-cols-2 md:grid-cols-3 gap-4 p-2">
            <div onclick="initMethod('touch')" class="method-card glass p-6 rounded-[2rem] flex flex-col items-center justify-center gap-4 cursor-pointer border-indigo-500/30">
                <div class="text-4xl">👆</div>
                <div class="text-center"><div class="font-black text-xs uppercase tracking-widest text-indigo-400">Touch</div><div class="text-[10px] text-slate-500 mt-1">Multi-finger selector</div></div>
            </div>
            <div onclick="initMethod('wheel')" class="method-card glass p-6 rounded-[2rem] flex flex-col items-center justify-center gap-4 cursor-pointer">
                <div class="text-4xl">🎡</div>
                <div class="text-center"><div class="font-black text-xs uppercase tracking-widest text-emerald-400">Wheel</div><div class="text-[10px] text-slate-500 mt-1">Spin to decide</div></div>
            </div>
            <div onclick="initMethod('dice')" class="method-card glass p-6 rounded-[2rem] flex flex-col items-center justify-center gap-4 cursor-pointer">
                <div class="text-4xl">🎲</div>
                <div class="text-center"><div class="font-black text-xs uppercase tracking-widest text-pink-400">Dice</div><div class="text-[10px] text-slate-500 mt-1">Pips & High Rolls</div></div>
            </div>
            <div onclick="initMethod('prompts')" class="method-card glass p-6 rounded-[2rem] flex flex-col items-center justify-center gap-4 cursor-pointer">
                <div class="text-4xl">🤔</div>
                <div class="text-center"><div class="font-black text-xs uppercase tracking-widest text-yellow-400">Prompts</div><div class="text-[10px] text-slate-500 mt-1">Board game logic</div></div>
            </div>
            <div onclick="initMethod('coin')" class="method-card glass p-6 rounded-[2rem] flex flex-col items-center justify-center gap-4 cursor-pointer">
                <div class="text-4xl">🪙</div>
                <div class="text-center"><div class="font-black text-xs uppercase tracking-widest text-blue-400">Coin</div><div class="text-[10px] text-slate-500 mt-1">Heads or tails</div></div>
            </div>
            <div onclick="initMethod('color')" class="method-card glass p-6 rounded-[2rem] flex flex-col items-center justify-center gap-4 cursor-pointer">
                <div class="text-4xl">🎨</div>
                <div class="text-center"><div class="font-black text-xs uppercase tracking-widest text-purple-400">Colors</div><div class="text-[10px] text-slate-500 mt-1">Lucky shade</div></div>
            </div>
        </div>

        <!-- Touch Selector -->
        <div id="screen-touch" class="hidden w-full h-full flex flex-col items-center justify-center text-center gap-8">
            <div class="space-y-4"><div class="text-6xl animate-bounce">👇</div><h2 class="text-2xl font-black text-white">TOUCH & HOLD</h2></div>
            <div id="touch-surface"></div>
        </div>

        <!-- Spinner Wheel -->
        <div id="screen-wheel" class="hidden w-full h-full flex flex-col items-center justify-center gap-8">
            <div class="relative"><div class="wheel-pointer"></div><div id="wheel" class="wheel-container shadow-2xl"></div></div>
            <div class="flex flex-col items-center gap-4">
                <div class="flex items-center gap-2 bg-slate-900/50 p-2 rounded-2xl border border-slate-800">
                    <button onclick="updatePlayerCount(-1)" class="w-10 h-10 glass rounded-xl font-black">-</button>
                    <div class="px-4 text-sm font-black text-indigo-400"><span id="wheel-player-count">4</span> PLAYERS</div>
                    <button onclick="updatePlayerCount(1)" class="w-10 h-10 glass rounded-xl font-black">+</button>
                </div>
                <div id="wheel-hint" class="count-hint hidden"></div>
                <button onclick="spinWheel()" class="bg-indigo-600 hover:bg-indigo-500 px-12 py-4 rounded-2xl font-black uppercase tracking-widest transition-all active:scale-95 shadow-xl">SPIN</button>
            </div>
        </div>

        <!-- Dice -->
        <div id="screen-dice" class="hidden w-full h-full flex flex-col items-center justify-center gap-12">
            <div class="dice-scene">
                <div id="dice" class="dice">
                    <div class="dice-face face-1"><div class="pip"></div></div>
                    <div class="dice-face face-2"><div class="pip"></div><div class="pip"></div></div>
                    <div class="dice-face face-3"><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
                    <div class="dice-face face-4"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
                    <div class="dice-face face-5"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
                    <div class="dice-face face-6"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
                </div>
            </div>
            <div id="dice-hint" class="count-hint hidden"></div>
            <button onclick="rollDice()" class="bg-pink-600 hover:bg-pink-500 px-12 py-4 rounded-2xl font-black uppercase tracking-widest transition-all active:scale-95 shadow-xl">ROLL DICE</button>
        </div>

        <!-- Prompts -->
        <div id="screen-prompts" class="hidden w-full h-full flex flex-col items-center justify-center gap-8 text-center px-6">
            <div class="glass p-12 rounded-[3rem] w-full max-w-lg space-y-6">
                <div class="text-xs font-black text-indigo-400 uppercase tracking-widest">The First Player is...</div>
                <div id="prompt-text" class="text-2xl md:text-3xl font-black text-white leading-tight">?</div>
            </div>
            <button onclick="newPrompt()" class="bg-indigo-600 hover:bg-indigo-500 px-12 py-4 rounded-2xl font-black uppercase tracking-widest transition-all active:scale-95 shadow-xl">NEW PROMPT</button>
        </div>

        <!-- Coin -->
        <div id="screen-coin" class="hidden w-full h-full flex flex-col items-center justify-center gap-12">
            <div id="coin" class="w-48 h-48 rounded-full glass border-4 border-yellow-500/50 flex items-center justify-center text-6xl shadow-2xl transition-all duration-500">🪙</div>
            <div id="coin-result" class="text-2xl font-black text-yellow-400 uppercase tracking-widest opacity-0">HEADS</div>
            <button onclick="flipCoin()" class="bg-yellow-600 hover:bg-yellow-500 px-12 py-4 rounded-2xl font-black uppercase tracking-widest transition-all active:scale-95 shadow-xl">FLIP COIN</button>
        </div>

        <!-- Color -->
        <div id="screen-color" class="hidden w-full h-full flex flex-col items-center justify-center gap-4 px-6">
            <div id="winner-display" class="winner-display glass">?</div>
            
            <div class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Tap Colors in Play</div>
            <div id="color-grid" class="color-grid">
                <!-- Populated by JS -->
            </div>

            <div class="flex gap-3 w-full max-w-sm">
                <button onclick="pickColorWinner()" class="flex-1 bg-purple-600 hover:bg-purple-500 py-4 rounded-2xl font-black uppercase tracking-widest transition-all active:scale-95 shadow-xl">Pick Winner</button>
                <button id="colorNextBtn" onclick="pickColorWinner()" class="hidden glass px-6 py-4 rounded-2xl font-black uppercase tracking-widest text-slate-400 hover:text-white transition-all active:scale-95">Next</button>
            </div>
        </div>

    </main>

    <script>
        const state = {
            activeScreen: 'menu', playerCount: 4, isSpinning: false, fingers: new Map(), touchTimer: null,
            colors: ['#ef4444', '#10b981', '#3b82f6', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#f97316']
        };

        const screens = ['menu', 'touch', 'wheel', 'dice', 'prompts', 'coin', 'color'];
        const prompts = [
            "Whoever most recently bought a board game", "Whoever most recently won a game",
            "The player whose birthday is coming up next", "Whoever woke up the earliest today",
            "Whoever owns the game being played", "The person who last traveled abroad",
            "Whoever is wearing the most colors", "The tallest player", "The shortest player",
            "Whoever has the longest hair", "The player who most recently ate a snack",
            "Whoever suggested playing a game today", "Whoever has the most unplayed games in their collection",
            "The player sitting closest to the door", "Whoever arrived most recently"
        ];

        function showScreen(id) {
            screens.forEach(s => {
                const el = document.getElementById(`screen-${s}`);
                if (el) el.classList.add('hidden');
            });
            const target = document.getElementById(`screen-${id}`);
            if (target) target.classList.remove('hidden');
            document.getElementById('homeBtn').classList.toggle('hidden', id === 'menu');
            state.activeScreen = id;
            const surface = document.getElementById('touch-surface');
            surface.style.display = id === 'touch' ? 'block' : 'none';
        }

        // --- Color Method (Redesigned) ---
        const colorPalette = [
            { name: 'Red', hex: '#ef4444' }, { name: 'Green', hex: '#10b981' }, 
            { name: 'Blue', hex: '#3b82f6' }, { name: 'Yellow', hex: '#f59e0b' },
            { name: 'Purple', hex: '#8b5cf6' }, { name: 'Pink', hex: '#ec4899' },
            { name: 'Cyan', hex: '#06b6d4' }, { name: 'Orange', hex: '#f97316' },
            { name: 'White', hex: '#ffffff' }, { name: 'Slate', hex: '#475569' }
        ];
        let activeColorIndices = new Set([0, 1, 2, 3]);

        function renderColorGrid() {
            const grid = document.getElementById('color-grid');
            grid.innerHTML = '';
            colorPalette.forEach((c, i) => {
                const bubble = document.createElement('div');
                bubble.className = `color-bubble ${activeColorIndices.has(i) ? 'active' : ''}`;
                bubble.style.backgroundColor = c.hex;
                bubble.style.color = c.hex;
                bubble.onclick = () => {
                    if (activeColorIndices.has(i)) activeColorIndices.delete(i);
                    else activeColorIndices.add(i);
                    renderColorGrid();
                };
                grid.appendChild(bubble);
            });
        }

        function pickColorWinner() {
            if (activeColorIndices.size === 0) return alert("Select at least one color!");
            
            const display = document.getElementById('winner-display');
            const nextBtn = document.getElementById('colorNextBtn');
            display.classList.remove('revealed');
            display.textContent = '?';
            display.style.background = '';
            
            setTimeout(() => {
                const indices = Array.from(activeColorIndices);
                const winIdx = indices[Math.floor(Math.random() * indices.length)];
                const winner = colorPalette[winIdx];
                
                display.textContent = '';
                display.style.background = winner.hex;
                display.style.color = winner.hex;
                display.classList.add('revealed');
                nextBtn.classList.remove('hidden');
                
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            }, 400);
        }

        function initMethod(method) {
            showScreen(method);
            if (method === 'wheel') renderWheel();
            if (method === 'touch') initTouchLogic();
            if (method === 'prompts') newPrompt();
            if (method === 'color') {
                renderColorGrid();
                document.getElementById('winner-display').classList.remove('revealed');
                document.getElementById('winner-display').textContent = '?';
                document.getElementById('winner-display').style.background = '';
                document.getElementById('colorNextBtn').classList.add('hidden');
            }
        }

        function getCountText(num) {
            if (num === 1) return "YOU GO FIRST!";
            if (num === 2) return "2nd PLAYER CLOCKWISE (TO YOUR LEFT)";
            if (num === 3) return "3rd PLAYER CLOCKWISE";
            return `${num}th PLAYER CLOCKWISE`;
        }

        // --- Wheel ---
        function updatePlayerCount(delta) {
            state.playerCount = Math.max(2, Math.min(8, state.playerCount + delta));
            document.getElementById('wheel-player-count').textContent = state.playerCount;
            renderWheel();
        }

        function renderWheel() {
            const wheel = document.getElementById('wheel');
            const step = 360 / state.playerCount;
            let grad = 'conic-gradient(';
            for (let i = 0; i < state.playerCount; i++) {
                grad += `${state.colors[i]} ${i * step}deg ${(i + 1) * step}deg${i === state.playerCount - 1 ? '' : ', '}`;
            }
            wheel.style.background = grad + ')';
            wheel.innerHTML = '';
            for (let i = 0; i < state.playerCount; i++) {
                const num = document.createElement('div');
                num.className = 'absolute font-black text-white text-xl';
                const angle = (i * step + step / 2) * (Math.PI / 180);
                num.style.left = `${150 + 100 * Math.sin(angle)}px`;
                num.style.top = `${150 - 100 * Math.cos(angle)}px`;
                num.style.transform = `translate(-50%, -50%) rotate(${i * step + step / 2}deg)`;
                num.textContent = i + 1;
                wheel.appendChild(num);
            }
        }

        let wheelRotation = 0;
        function spinWheel() {
            if (state.isSpinning) return;
            state.isSpinning = true;
            document.getElementById('wheel-hint').classList.add('hidden');
            const extra = 1800 + Math.random() * 1800;
            wheelRotation += extra;
            const wheel = document.getElementById('wheel');
            wheel.style.transform = `rotate(${wheelRotation}deg)`;
            
            setTimeout(() => {
                state.isSpinning = false;
                const winner = state.playerCount - Math.floor(((wheelRotation % 360)) / (360 / state.playerCount));
                const hint = document.getElementById('wheel-hint');
                hint.textContent = getCountText(winner > state.playerCount ? 1 : winner);
                hint.classList.remove('hidden');
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            }, 4000);
        }

        // --- Dice ---
        function rollDice() {
            const dice = document.getElementById('dice');
            const hint = document.getElementById('dice-hint');
            hint.classList.add('hidden');
            const x = Math.floor(Math.random() * 4) * 90 + 720;
            const y = Math.floor(Math.random() * 4) * 90 + 720;
            dice.style.transform = `rotateX(${x}deg) rotateY(${y}deg)`;
            
            setTimeout(() => {
                const results = [1, 6, 2, 5, 3, 4]; // Simplified face mapping for rotation
                const winner = Math.floor(Math.random() * 6) + 1;
                hint.textContent = getCountText(winner);
                hint.classList.remove('hidden');
                if (navigator.vibrate) navigator.vibrate(50);
            }, 1000);
        }

        // --- Touch Selector (Enhanced) ---
        function initTouchLogic() {
            const surface = document.getElementById('touch-surface');
            surface.innerHTML = '<div id="touch-countdown" class="touch-countdown"></div><div class="scan-line"></div>';
            
            let countdownValue = 3;
            let countdownInterval = null;

            const updateCountdown = () => {
                const el = document.getElementById('touch-countdown');
                if (state.fingers.size >= 2) {
                    el.textContent = countdownValue > 0 ? countdownValue : 'GO!';
                    if (countdownValue === 0 && !state.isSpinning) selectFingerWinner();
                } else {
                    el.textContent = '';
                    countdownValue = 3;
                }
            };

            const handleTouch = (e) => {
                if (state.activeScreen !== 'touch') return;
                e.preventDefault();
                const currentFingers = new Set();
                
                for (let i = 0; i < e.touches.length; i++) {
                    const t = e.touches[i];
                    currentFingers.add(t.identifier);
                    
                    if (!state.fingers.has(t.identifier)) {
                        const el = document.createElement('div');
                        el.className = 'finger-circle';
                        el.style.color = state.colors[state.fingers.size % state.colors.length];
                        surface.appendChild(el);
                        state.fingers.set(t.identifier, { el, x: t.clientX, y: t.clientY, progress: 0 });
                    }
                    
                    const f = state.fingers.get(t.identifier);
                    f.el.style.left = `${t.clientX}px`;
                    f.el.style.top = `${t.clientY}px`;
                }

                // Cleanup
                for (const [id, f] of state.fingers) {
                    if (!currentFingers.has(id)) { f.el.remove(); state.fingers.delete(id); }
                }

                // Logic
                if (state.fingers.size >= 2) {
                    if (!countdownInterval) {
                        countdownValue = 3;
                        updateCountdown();
                        countdownInterval = setInterval(() => {
                            countdownValue--;
                            updateCountdown();
                            if (countdownValue < 0) clearInterval(countdownInterval);
                        }, 800);
                    }
                    state.fingers.forEach(f => {
                        f.el.classList.add('selecting');
                        f.progress = Math.min(1, (3 - countdownValue) / 3);
                        f.el.style.setProperty('--progress', f.progress);
                    });
                } else {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                    state.fingers.forEach(f => {
                        f.el.classList.remove('selecting', 'winner');
                        f.el.style.opacity = '1';
                        f.el.style.setProperty('--progress', 0);
                    });
                    updateCountdown();
                }
            };

            function selectFingerWinner() {
                if (state.fingers.size < 2 || state.isSpinning) return;
                state.isSpinning = true;
                
                const ids = Array.from(state.fingers.keys());
                const winnerId = ids[Math.floor(Math.random() * ids.length)];
                
                state.fingers.forEach((f, id) => {
                    f.el.classList.remove('selecting');
                    if (id === winnerId) {
                        f.el.classList.add('winner');
                        if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 300]);
                    } else {
                        f.el.style.opacity = '0.1';
                        f.el.style.transform = 'translate(-50%, -50%) scale(0.5)';
                    }
                });

                setTimeout(() => { state.isSpinning = false; }, 2000);
            }

            surface.addEventListener('touchstart', handleTouch);
            surface.addEventListener('touchmove', handleTouch);
            surface.addEventListener('touchend', handleTouch);
            surface.addEventListener('touchcancel', handleTouch);
        }

        // --- Others ---
        function newPrompt() {
            const el = document.getElementById('prompt-text');
            el.style.opacity = '0';
            setTimeout(() => { el.textContent = prompts[Math.floor(Math.random() * prompts.length)]; el.style.opacity = '1'; }, 200);
        }

        function flipCoin() {
            const coin = document.getElementById('coin');
            const res = document.getElementById('coin-result');
            coin.style.transform = 'rotateY(1800deg) scale(1.2)';
            res.style.opacity = '0';
            setTimeout(() => {
                const isHeads = Math.random() > 0.5;
                coin.textContent = isHeads ? '🌞' : '🌛';
                coin.style.transform = 'none';
                res.textContent = isHeads ? 'HEADS' : 'TAILS';
                res.style.opacity = '1';
                if (navigator.vibrate) navigator.vibrate(100);
            }, 600);
        }

        function pickColor() {
            const disp = document.getElementById('color-display');
            const hint = document.getElementById('color-hint');
            const idx = Math.floor(Math.random() * state.colors.length);
            disp.style.background = state.colors[idx];
            disp.textContent = '';
            hint.textContent = getCountText(idx + 1);
            hint.classList.remove('hidden');
            if (navigator.vibrate) navigator.vibrate(100);
        }
    </script>
</body>
