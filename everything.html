<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Everything BGG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
    }

    .game-card {
      transition: all 0.2s ease;
    }

    .game-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
    }

    .skeleton {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }

    .attr-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }

    .attr-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 0.5rem;
      padding: 0.75rem;
      font-size: 0.75rem;
    }

    .attr-label {
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }

    .attr-value {
      color: #1e293b;
      word-break: break-word;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="pb-20">

  <header class="sticky top-0 z-30 w-full bg-white/80 backdrop-blur-md border-b px-4 py-4 shadow-sm">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
      <div class="flex items-center gap-3 flex-1">
        <div class="bg-gradient-to-br from-indigo-600 to-purple-600 text-white p-2 rounded-lg">
          <i class="fa-solid fa-star"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">Everything BGG</h1>
          <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Complete Game Data</p>
        </div>
      </div>
      <div id="statsBox" class="text-right hidden">
        <div class="text-2xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent" id="gameCount">0</div>
        <div class="text-[10px] text-slate-500 uppercase font-bold">Games</div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 space-y-6">
    
    <!-- Fetch Section -->
    <div id="fetchSection" class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
      <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
        <i class="fa-solid fa-download text-indigo-600"></i>
        Load Collection
      </h2>
      <div class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="text-xs font-bold text-slate-500 uppercase mb-2 block">BGG Username</label>
            <input 
              id="username" 
              type="text" 
              value="sportomax" 
              class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all"
            >
          </div>
          <div class="flex items-end">
            <label class="flex items-center gap-3 cursor-pointer bg-indigo-50 px-4 py-3 rounded-xl border-2 border-indigo-200 flex-1">
              <input type="checkbox" id="ownedOnly" class="form-checkbox text-indigo-600 rounded" checked>
              <span class="text-sm font-semibold text-indigo-900">Owned Only (own=1)</span>
            </label>
          </div>
        </div>
        <button 
          onclick="fetchCollection()" 
          id="fetchBtn"
          class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-4 rounded-xl font-bold hover:shadow-lg shadow-indigo-100 flex items-center justify-center gap-2 transition-all"
        >
          <i class="fa-solid fa-download"></i> Load Games
        </button>
      </div>
    </div>

    <!-- Loading Section -->
    <div id="loadingSection" class="hidden">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
        <div class="flex items-center justify-center gap-3 mb-4">
          <i class="fa-solid fa-circle-notch fa-spin text-indigo-600 text-2xl"></i>
          <span class="font-bold text-slate-700">Loading collection...</span>
        </div>
        <div class="text-sm text-slate-500 text-center mb-2" id="loadingStatus">Fetching games...</div>
        <div class="bg-slate-100 rounded-full h-2 overflow-hidden">
          <div id="progressBar" class="bg-gradient-to-r from-indigo-600 to-purple-600 h-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div id="controlsSection" class="hidden bg-white rounded-2xl shadow-sm border border-slate-100 p-4 space-y-4">
      <div class="flex flex-col sm:flex-row gap-3 items-start sm:items-center justify-between">
        <div class="flex-1 flex flex-col sm:flex-row gap-3 w-full sm:w-auto">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Search games..." 
            oninput="filterGames()"
            class="flex-1 px-4 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all"
          >
          <select 
            id="sortSelect" 
            onchange="sortGames()" 
            class="px-4 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all bg-white font-semibold text-sm"
          >
            <option value="name">Name (A-Z)</option>
            <option value="rating">Avg Rating</option>
            <option value="year">Year</option>
          </select>
        </div>
        <div class="flex items-center gap-2 bg-gradient-to-r from-indigo-50 to-purple-50 px-3 py-2 rounded-xl border border-indigo-200">
          <span class="text-xs font-bold text-indigo-900 uppercase tracking-wider">View:</span>
          <button 
            id="compactBtn"
            onclick="setViewMode('compact')"
            class="px-3 py-1 rounded-lg font-semibold text-xs transition-all bg-white text-indigo-600 shadow-sm"
          >
            <i class="fa-solid fa-th"></i> Compact
          </button>
          <button 
            id="fullBtn"
            onclick="setViewMode('full')"
            class="px-3 py-1 rounded-lg font-semibold text-xs transition-all text-slate-600 hover:bg-slate-100"
          >
            <i class="fa-solid fa-list"></i> Full
          </button>
        </div>
      </div>
    </div>

    <!-- Games Grid/List -->
    <div id="gamesSection" class="hidden">
      <div id="gamesContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
        <!-- Games will be populated here -->
      </div>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-12">
      <i class="fa-solid fa-inbox text-slate-300 text-5xl mb-4 block"></i>
      <p class="text-slate-500 font-semibold">No games found</p>
    </div>

  </main>

<script>
const BATCH_SIZE = 100;
const RETRY_DELAY = 3000;
const MAX_RETRIES = 15;

let allGames = [];
let displayedGames = [];
let thingData = new Map();
let viewMode = 'compact';

async function fetchCollection() {
  const username = document.getElementById('username').value.trim() || 'sportomax';
  const ownedOnly = document.getElementById('ownedOnly').checked;
  const fetchBtn = document.getElementById('fetchBtn');
  const fetchSection = document.getElementById('fetchSection');
  const loadingSection = document.getElementById('loadingSection');
  const controlsSection = document.getElementById('controlsSection');
  const gamesSection = document.getElementById('gamesSection');
  const emptyState = document.getElementById('emptyState');
  const statsBox = document.getElementById('statsBox');
  
  fetchBtn.disabled = true;
  loadingSection.classList.remove('hidden');
  
  try {
    updateProgress('Fetching collection from BGG...', 10);
    
    // Build query params
    let params = '&stats=1';
    if (ownedOnly) params += '&own=1';
    
    // Fetch collection
    const collXml = await fetchAPI('collection', username, params);
    const doc = new DOMParser().parseFromString(collXml, 'text/xml');
    const items = Array.from(doc.querySelectorAll('item'));
    
    if (items.length === 0) {
      updateProgress('No items found in collection', 50);
      setTimeout(() => {
        loadingSection.classList.add('hidden');
        fetchSection.classList.remove('hidden');
      }, 2000);
      return;
    }

    updateProgress(`Found ${items.length} items. Parsing...`, 20);

    // Parse collection items
    allGames = items.map(item => {
      const objectid = item.getAttribute('objectid');
      const name = item.querySelector('name')?.textContent?.trim() || '';
      const thumb = item.querySelector('thumbnail')?.textContent || '';
      const year = item.querySelector('yearpublished')?.textContent || '';
      const userRating = parseFloat(item.querySelector('status')?.getAttribute('rating') || '0');
      
      const stats = item.querySelector('stats');
      const minplayers = parseInt(stats?.getAttribute('minplayers') || '0');
      const maxplayers = parseInt(stats?.getAttribute('maxplayers') || '0');
      const playingtime = parseInt(stats?.getAttribute('playingtime') || '0');
      
      const ratings = stats?.querySelector('rating');
      const bggRating = ratings ? parseFloat(ratings.querySelector('average')?.getAttribute('value') || '0') : 0;
      
      return { 
        objectid, 
        name, 
        thumb, 
        year, 
        userRating, 
        bggRating,
        minplayers, 
        maxplayers, 
        playingtime,
        collectionItem: item,
        thingItem: null
      };
    }).filter(game => game.name);
    
    updateProgress(`Fetching detailed data for ${allGames.length} games in parallel...`, 30);

    // Fetch thing data in parallel batches
    const gameIds = allGames.map(g => g.objectid);
    await fetchThingDataParallel(gameIds);
    
    updateProgress('Rendering games...', 95);
    
    displayedGames = [...allGames];
    renderGames(displayedGames);
    
    // Show UI
    loadingSection.classList.remove('hidden');
    fetchSection.classList.add('hidden');
    controlsSection.classList.remove('hidden');
    gamesSection.classList.remove('hidden');
    statsBox.classList.remove('hidden');
    document.getElementById('gameCount').textContent = allGames.length;
    
    updateProgress('Complete!', 100);
    
    setTimeout(() => {
      loadingSection.classList.add('hidden');
    }, 800);
    
  } catch (err) {
    console.error(err);
    updateProgress(`Error: ${err.message}`, 0);
    setTimeout(() => {
      loadingSection.classList.add('hidden');
      fetchSection.classList.remove('hidden');
    }, 3000);
  } finally {
    fetchBtn.disabled = false;
  }
}

async function fetchAPI(endpoint, username, params = '', attempt = 0) {
  const url = `/api/bgg-helper?endpoint=${endpoint}&username=${username}${params}`;
  const response = await fetch(url);
  
  if (response.status === 202) {
    if (attempt >= MAX_RETRIES) throw new Error('Request timed out');
    await new Promise(resolve => setTimeout(resolve, RETRY_DELAY));
    return fetchAPI(endpoint, username, params, attempt + 1);
  }
  
  if (!response.ok) {
    throw new Error(`API error: ${response.status}`);
  }
  
  return await response.text();
}

async function fetchThingDataParallel(gameIds) {
  const batches = [];
  for (let i = 0; i < gameIds.length; i += BATCH_SIZE) {
    batches.push(gameIds.slice(i, i + BATCH_SIZE));
  }

  const promises = batches.map((batch, idx) => 
    fetchThingBatch(batch, idx + 1, batches.length)
  );

  await Promise.all(promises);
  
  // Link thing data to games
  allGames.forEach(game => {
    const thing = thingData.get(game.objectid);
    if (thing) {
      game.thingItem = thing;
      
      // Description
      const desc = thing.querySelector('description');
      game.description = desc ? desc.textContent.substring(0, 300) + '...' : '';
      
      // Playtime variations
      const minpt = thing.querySelector('minplaytime');
      const maxpt = thing.querySelector('maxplaytime');
      game.minPlaytime = minpt ? parseInt(minpt.getAttribute('value')) : game.playingtime;
      game.maxPlaytime = maxpt ? parseInt(maxpt.getAttribute('value')) : game.playingtime;
      
      // Min age
      const minage = thing.querySelector('minage');
      game.minAge = minage ? parseInt(minage.getAttribute('value')) : 'N/A';
      
      // Statistics
      const stats = thing.querySelector('statistics ratings');
      if (stats) {
        game.bggRating = parseFloat(stats.querySelector('average')?.getAttribute('value') || game.bggRating);
        game.weight = parseFloat(stats.querySelector('averageweight')?.getAttribute('value') || '0');
        game.numRatings = parseInt(stats.querySelector('usersrated')?.getAttribute('value') || '0');
        game.stddev = parseFloat(stats.querySelector('stddev')?.getAttribute('value') || '0');
        game.numComments = parseInt(stats.querySelector('numcomments')?.getAttribute('value') || '0');
        game.owned = parseInt(stats.querySelector('owned')?.getAttribute('value') || '0');
        game.wanting = parseInt(stats.querySelector('wanting')?.getAttribute('value') || '0');
        game.wishing = parseInt(stats.querySelector('wishing')?.getAttribute('value') || '0');
        game.trading = parseInt(stats.querySelector('trading')?.getAttribute('value') || '0');
        
        // All ranks
        game.ranks = [];
        stats.querySelectorAll('rank').forEach(rank => {
          game.ranks.push({
            name: rank.getAttribute('friendlyname'),
            value: rank.getAttribute('value'),
            bayesaverage: rank.getAttribute('bayesaverage')
          });
        });
      }
      
      // Player count poll summary
      const pollSummary = thing.querySelector('poll-summary[name="suggested_numplayers"]');
      if (pollSummary) {
        const results = Array.from(pollSummary.querySelectorAll('result'));
        game.bestWith = results.find(r => r.getAttribute('name') === 'bestwith')?.getAttribute('value') || '';
        game.recommendedWith = results.find(r => r.getAttribute('name') === 'recommmendedwith')?.getAttribute('value') || '';
      }
      
      // Language dependence
      const langPoll = thing.querySelector('poll[name="language_dependence"]');
      if (langPoll) {
        const topResult = langPoll.querySelector('result');
        game.languageDep = topResult ? topResult.getAttribute('value') : '';
      }
      
      // Extract links
      game.mechanics = [];
      game.categories = [];
      game.designers = [];
      game.artists = [];
      game.publishers = [];
      game.families = [];
      
      thing.querySelectorAll('link').forEach(link => {
        const type = link.getAttribute('type');
        const value = link.getAttribute('value');
        if (type === 'boardgamemechanic') game.mechanics.push(value);
        if (type === 'boardgamecategory') game.categories.push(value);
        if (type === 'boardgamedesigner') game.designers.push(value);
        if (type === 'boardgameartist') game.artists.push(value);
        if (type === 'boardgamepublisher') game.publishers.push(value);
        if (type === 'boardgamefamily') game.families.push(value);
      });
    }
  });
}

async function fetchThingBatch(ids, batchNum, totalBatches) {
  const idsString = ids.join(',');
  const url = `/api/bgg-helper?endpoint=thing&id=${idsString}&stats=1`;
  
  try {
    const response = await fetch(url);
    if (!response.ok) return;

    const xmlText = await response.text();
    const parser = new DOMParser();
    const xml = parser.parseFromString(xmlText, 'text/xml');
    
    const items = xml.querySelectorAll('item');
    items.forEach(item => {
      const id = item.getAttribute('id');
      thingData.set(id, item);
    });

    updateProgress(`Fetching batch ${batchNum}/${totalBatches}...`, 30 + (batchNum / totalBatches) * 60);
  } catch (err) {
    console.warn(`Failed to fetch batch ${batchNum}:`, err);
  }
}

function setViewMode(mode) {
  viewMode = mode;
  const compactBtn = document.getElementById('compactBtn');
  const fullBtn = document.getElementById('fullBtn');
  
  if (mode === 'compact') {
    compactBtn.classList.remove('text-slate-600', 'hover:bg-slate-100');
    compactBtn.classList.add('bg-white', 'text-indigo-600', 'shadow-sm');
    fullBtn.classList.remove('bg-white', 'text-indigo-600', 'shadow-sm');
    fullBtn.classList.add('text-slate-600', 'hover:bg-slate-100');
  } else {
    fullBtn.classList.remove('text-slate-600', 'hover:bg-slate-100');
    fullBtn.classList.add('bg-white', 'text-indigo-600', 'shadow-sm');
    compactBtn.classList.remove('bg-white', 'text-indigo-600', 'shadow-sm');
    compactBtn.classList.add('text-slate-600', 'hover:bg-slate-100');
  }
  
  renderGames(displayedGames);
}

function filterGames() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  displayedGames = allGames.filter(game => 
    game.name.toLowerCase().includes(search)
  );
  sortGames();
}

function sortGames() {
  const sortBy = document.getElementById('sortSelect').value;
  
  displayedGames.sort((a, b) => {
    switch(sortBy) {
      case 'name': return a.name.localeCompare(b.name);
      case 'rating': return (b.bggRating || 0) - (a.bggRating || 0);
      case 'year': return parseInt(b.year || 0) - parseInt(a.year || 0);
      default: return 0;
    }
  });
  
  renderGames(displayedGames);
}

function renderGames(games) {
  const container = document.getElementById('gamesContainer');
  const gamesSection = document.getElementById('gamesSection');
  const emptyState = document.getElementById('emptyState');
  
  if (games.length === 0) {
    gamesSection.classList.add('hidden');
    emptyState.classList.remove('hidden');
    return;
  }
  
  gamesSection.classList.remove('hidden');
  emptyState.classList.add('hidden');

  if (viewMode === 'compact') {
    container.className = 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3';
    container.innerHTML = games.map(game => `
      <div class="game-card bg-white rounded-lg shadow-sm border border-slate-100 overflow-hidden cursor-pointer group" onclick="window.open('https://boardgamegeek.com/boardgame/${game.objectid}', '_blank')">
        <div class="relative bg-slate-100 aspect-square flex items-center justify-center overflow-hidden">
          ${game.thumb ? `
            <img src="${game.thumb}" alt="${game.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform">
          ` : `
            <i class="fa-solid fa-image text-slate-300 text-2xl"></i>
          `}
        </div>
        <div class="p-2">
          <h3 class="font-semibold text-xs text-slate-900 line-clamp-2 mb-1">${game.name}</h3>
          ${game.bggRating > 0 ? `
            <div class="text-xs font-bold text-amber-600">
              <i class="fa-solid fa-star"></i> ${game.bggRating.toFixed(2)}
            </div>
          ` : ''}
        </div>
      </div>
    `).join('');
  } else {
    container.className = 'space-y-3';
    container.innerHTML = games.map(game => `
      <div class="game-card bg-white rounded-xl shadow-sm border border-slate-100 p-4 overflow-hidden">
        <div class="flex gap-4 mb-4">
          ${game.thumb ? `
            <img src="${game.thumb}" alt="${game.name}" class="w-24 h-32 rounded-lg object-cover flex-shrink-0 cursor-pointer" onclick="window.open('https://boardgamegeek.com/boardgame/${game.objectid}', '_blank')">
          ` : `
            <div class="w-24 h-32 rounded-lg bg-slate-100 flex items-center justify-center flex-shrink-0">
              <i class="fa-solid fa-image text-slate-300 text-2xl"></i>
            </div>
          `}
          <div class="flex-1 min-w-0">
            <h2 class="text-lg font-bold text-slate-900 mb-1 cursor-pointer hover:text-indigo-600 transition-colors line-clamp-2" onclick="window.open('https://boardgamegeek.com/boardgame/${game.objectid}', '_blank')">${game.name}</h2>
            <div class="text-sm text-slate-500 mb-2">${game.year || 'Unknown'} • ID: ${game.objectid}</div>
            <div class="grid grid-cols-3 gap-2 text-xs">
              ${game.bggRating > 0 ? `<div class="bg-amber-50 p-1.5 rounded"><span class="font-bold text-amber-700">⭐ ${game.bggRating.toFixed(2)}</span></div>` : ''}
              ${game.weight > 0 ? `<div class="bg-purple-50 p-1.5 rounded"><span class="font-bold text-purple-700">⚙️ ${game.weight.toFixed(2)}</span></div>` : ''}
              ${game.rank !== 'N/A' ? `<div class="bg-green-50 p-1.5 rounded"><span class="font-bold text-green-700">#${game.rank}</span></div>` : ''}
            </div>
          </div>
        </div>

        <!-- Full Attributes -->
        <div class="space-y-4 pt-4 border-t">
          <!-- Description -->
          ${game.description ? `<div class="bg-slate-50 p-3 rounded-lg border border-slate-200"><p class="text-xs text-slate-700 leading-relaxed">${game.description}</p></div>` : ''}
          
          <!-- Gameplay Stats -->
          <div>
            <h3 class="font-bold text-slate-700 mb-2 text-sm">Gameplay</h3>
            <div class="attr-grid">
              <div class="attr-card">
                <div class="attr-label">Min Players</div>
                <div class="attr-value">${game.minplayers || 'N/A'}</div>
              </div>
              <div class="attr-card">
                <div class="attr-label">Max Players</div>
                <div class="attr-value">${game.maxplayers || 'N/A'}</div>
              </div>
              <div class="attr-card">
                <div class="attr-label">Best With</div>
                <div class="attr-value text-[0.65rem]">${game.bestWith ? game.bestWith.replace('Best with ', '') : 'N/A'}</div>
              </div>
              <div class="attr-card">
                <div class="attr-label">Min Time</div>
                <div class="attr-value">${game.minPlaytime && game.minPlaytime !== 'N/A' ? game.minPlaytime + ' min' : 'N/A'}</div>
              </div>
              <div class="attr-card">
                <div class="attr-label">Max Time</div>
                <div class="attr-value">${game.maxPlaytime && game.maxPlaytime !== 'N/A' ? game.maxPlaytime + ' min' : 'N/A'}</div>
              </div>
              <div class="attr-card">
                <div class="attr-label">Min Age</div>
                <div class="attr-value">${game.minAge !== 'N/A' ? game.minAge + '+' : 'N/A'}</div>
              </div>
            </div>
          </div>
          
          <!-- Ratings & Popularity -->
          <div>
            <h3 class="font-bold text-slate-700 mb-2 text-sm">Ratings & Popularity</h3>
            <div class="attr-grid">
              <div class="attr-card">
                <div class="attr-label">BGG Rating</div>
                <div class="attr-value">${game.bggRating > 0 ? game.bggRating.toFixed(2) : 'N/A'}</div>
              </div>
              <div class="attr-card">
                <div class="attr-label">Your Rating</div>
                <div class="attr-value">${game.userRating > 0 ? game.userRating.toFixed(2) : 'Not Rated'}</div>
              </div>
              <div class="attr-card">
                <div class="attr-label">Weight</div>
                <div class="attr-value">${game.weight ? game.weight.toFixed(2) : 'N/A'}</div>
              </div>
              <div class="attr-card">
                <div class="attr-label">Num Ratings</div>
                <div class="attr-value text-[0.65rem]">${game.numRatings ? game.numRatings.toLocaleString() : 'N/A'}</div>
              </div>
              <div class="attr-card">
                <div class="attr-label">Std Dev</div>
                <div class="attr-value">${game.stddev > 0 ? game.stddev.toFixed(2) : 'N/A'}</div>
              </div>
              <div class="attr-card">
                <div class="attr-label">Comments</div>
                <div class="attr-value text-[0.65rem]">${game.numComments ? game.numComments.toLocaleString() : 'N/A'}</div>
              </div>
            </div>
          </div>
          
          <!-- Ownership Stats -->
          <div>
            <h3 class="font-bold text-slate-700 mb-2 text-sm">Ownership</h3>
            <div class="attr-grid">
              <div class="attr-card">
                <div class="attr-label">Owned</div>
                <div class="attr-value text-[0.65rem]">${game.owned ? game.owned.toLocaleString() : '0'}</div>
              </div>
              <div class="attr-card">
                <div class="attr-label">Wanting</div>
                <div class="attr-value text-[0.65rem]">${game.wanting ? game.wanting.toLocaleString() : '0'}</div>
              </div>
              <div class="attr-card">
                <div class="attr-label">Wishing</div>
                <div class="attr-value text-[0.65rem]">${game.wishing ? game.wishing.toLocaleString() : '0'}</div>
              </div>
              <div class="attr-card">
                <div class="attr-label">Trading</div>
                <div class="attr-value text-[0.65rem]">${game.trading ? game.trading.toLocaleString() : '0'}</div>
              </div>
            </div>
          </div>
          
          <!-- Ranks -->
          ${game.ranks && game.ranks.length > 0 ? `
            <div>
              <h3 class="font-bold text-slate-700 mb-2 text-sm">Ranks (${game.ranks.length})</h3>
              <div class="space-y-1">
                ${game.ranks.map(r => `<div class="bg-slate-50 px-2 py-1 rounded text-xs"><span class="font-bold text-green-700">#${r.value}</span> <span class="text-slate-600">${r.name}</span></div>`).join('')}
              </div>
            </div>
          ` : ''}
          
          <!-- Language Dependence -->
          ${game.languageDep ? `<div class="bg-blue-50 p-2 rounded-lg border border-blue-200"><div class="text-xs"><span class="font-bold text-blue-700">Language Dependence:</span> <span class="text-blue-700">${game.languageDep}</span></div></div>` : ''}

          <!-- Links -->
          ${game.mechanics && game.mechanics.length > 0 ? `
            <div>
              <h3 class="font-bold text-slate-700 mb-2 text-sm">Mechanics (${game.mechanics.length})</h3>
              <div class="flex flex-wrap gap-1">
                ${game.mechanics.map(m => `<span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs font-semibold">${m}</span>`).join('')}
              </div>
            </div>
          ` : ''}

          ${game.categories && game.categories.length > 0 ? `
            <div>
              <h3 class="font-bold text-slate-700 mb-2 text-sm">Categories (${game.categories.length})</h3>
              <div class="flex flex-wrap gap-1">
                ${game.categories.map(c => `<span class="bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-semibold">${c}</span>`).join('')}
              </div>
            </div>
          ` : ''}

          ${game.designers && game.designers.length > 0 ? `
            <div>
              <h3 class="font-bold text-slate-700 mb-2 text-sm">Designers (${game.designers.length})</h3>
              <div class="flex flex-wrap gap-1">
                ${game.designers.slice(0, 10).map(d => `<span class="bg-purple-100 text-purple-700 px-2 py-1 rounded text-xs font-semibold">${d}</span>`).join('')}
                ${game.designers.length > 10 ? `<span class="bg-slate-200 text-slate-700 px-2 py-1 rounded text-xs font-semibold">+${game.designers.length - 10}</span>` : ''}
              </div>
            </div>
          ` : ''}

          ${game.artists && game.artists.length > 0 ? `
            <div>
              <h3 class="font-bold text-slate-700 mb-2 text-sm">Artists (${game.artists.length})</h3>
              <div class="flex flex-wrap gap-1">
                ${game.artists.slice(0, 8).map(a => `<span class="bg-indigo-100 text-indigo-700 px-2 py-1 rounded text-xs font-semibold">${a}</span>`).join('')}
                ${game.artists.length > 8 ? `<span class="bg-slate-200 text-slate-700 px-2 py-1 rounded text-xs font-semibold">+${game.artists.length - 8}</span>` : ''}
              </div>
            </div>
          ` : ''}

          ${game.publishers && game.publishers.length > 0 ? `
            <div>
              <h3 class="font-bold text-slate-700 mb-2 text-sm">Publishers (${game.publishers.length})</h3>
              <div class="flex flex-wrap gap-1">
                ${game.publishers.slice(0, 8).map(p => `<span class="bg-orange-100 text-orange-700 px-2 py-1 rounded text-xs font-semibold">${p}</span>`).join('')}
                ${game.publishers.length > 8 ? `<span class="bg-slate-200 text-slate-700 px-2 py-1 rounded text-xs font-semibold">+${game.publishers.length - 8}</span>` : ''}
              </div>
            </div>
          ` : ''}
          
          <!-- Families -->
          ${game.families && game.families.length > 0 ? `
            <div>
              <h3 class="font-bold text-slate-700 mb-2 text-sm">Families (${game.families.length})</h3>
              <div class="flex flex-wrap gap-1">
                ${game.families.slice(0, 5).map(f => `<span class="bg-pink-100 text-pink-700 px-2 py-1 rounded text-xs font-semibold">${f}</span>`).join('')}
                ${game.families.length > 5 ? `<span class="bg-slate-200 text-slate-700 px-2 py-1 rounded text-xs font-semibold">+${game.families.length - 5}</span>` : ''}
              </div>
            </div>
          ` : ''}
        </div>
      </div>
    `).join('');
  }
}

function updateProgress(message, percent) {
  document.getElementById('loadingStatus').textContent = message;
  document.getElementById('progressBar').style.width = percent + '%';
}
</script>

<!-- Vercel Web Analytics -->
<script type="module" src="analytics-init.js"></script>
</body>
</html>
