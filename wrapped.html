<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Year Wrapped | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🎁</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        :root {
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
            height: 100dvh;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .slide {
            display: none;
            height: 100%;
            width: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .slide.active {
            display: flex;
            opacity: 1;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .bar-container {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            height: 240px;
            padding-bottom: 2rem;
        }

        .bar {
            border-radius: 8px 8px 0 0;
            transition: height 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            min-height: 4px;
            position: relative;
        }

        .bar-label {
            position: absolute;
            bottom: -24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* Gradient Themes */
        .theme-emerald { background: radial-gradient(circle at center, #10b98120 0%, #0f172a 70%); }
        .theme-blue { background: radial-gradient(circle at center, #3b82f620 0%, #0f172a 70%); }
        .theme-purple { background: radial-gradient(circle at center, #8b5cf620 0%, #0f172a 70%); }
        .theme-rose { background: radial-gradient(circle at center, #f43f5e20 0%, #0f172a 70%); }
        .theme-amber { background: radial-gradient(circle at center, #f59e0b20 0%, #0f172a 70%); }

        .stat-card {
            @apply glass p-6 rounded-[2rem] border border-white/5 flex flex-col items-center gap-2 min-w-[140px];
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
        }

        .nav-btn {
            @apply p-4 rounded-full glass border border-white/10 text-white hover:bg-white/10 active:scale-95 transition-all;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    </style>
</head>
<body class="selection:bg-emerald-500/30">

    <!-- SETUP SCREEN -->
    <div id="setupScreen" class="fixed inset-0 z-50 flex items-center justify-center p-6 bg-slate-950">
        <div class="glass max-w-sm w-full rounded-[3rem] p-10 border-t border-white/10 shadow-2xl relative overflow-hidden">
            <div class="absolute inset-0 bg-emerald-500/10 blur-[80px] pointer-events-none"></div>
            
            <div class="relative z-10 text-center space-y-8">
                <div>
                    <div class="w-20 h-20 bg-emerald-500/20 rounded-[2rem] flex items-center justify-center mx-auto mb-6 border border-emerald-500/30 shadow-lg shadow-emerald-500/20">
                        <i data-lucide="gift" class="text-emerald-400 w-10 h-10"></i>
                    </div>
                    <h1 class="text-4xl font-black italic uppercase tracking-tighter text-white leading-none">Year <span class="text-emerald-400">Wrapped</span></h1>
                    <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mt-2">Your Gaming Year in Review</p>
                </div>

                <div class="space-y-4">
                    <div class="space-y-2 text-left">
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Username</label>
                        <input type="text" id="usernameInput" value="sportomax" class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500/50 transition-all font-bold text-center placeholder-slate-600">
                    </div>
                    
                    <div class="space-y-2 text-left">
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Year</label>
                        <div class="grid grid-cols-3 gap-2" id="yearSelector">
                            <!-- Populated via JS -->
                        </div>
                        <input type="hidden" id="selectedYear">
                    </div>
                </div>

                <button onclick="generateWrapped()" class="w-full btn-primary text-white py-5 rounded-3xl font-black text-lg uppercase tracking-tight hover:scale-[1.02] active:scale-95 transition-all shadow-xl">
                    Unwrap Stats
                </button>
            </div>
        </div>
    </div>

    <!-- LOADING OVERLAY -->
    <div id="loadingScreen" class="fixed inset-0 z-[60] bg-slate-950 flex flex-col items-center justify-center hidden">
        <div class="relative w-24 h-24 mb-8">
            <div class="absolute inset-0 border-4 border-emerald-500/20 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-t-emerald-500 rounded-full animate-spin"></div>
            <div class="absolute inset-0 flex items-center justify-center">
                <i data-lucide="loader-2" class="text-emerald-400 w-8 h-8 animate-pulse"></i>
            </div>
        </div>
        <h2 class="text-2xl font-black italic uppercase tracking-tighter text-white" id="loadingText">Fetching Plays</h2>
        <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-2" id="loadingSub">Please Wait...</p>
    </div>

    <!-- SLIDES CONTAINER -->
    <div id="slidesContainer" class="relative z-10 w-full h-full"></div>

    <!-- NAVIGATION -->
    <div id="navControls" class="fixed bottom-10 left-0 right-0 z-50 flex justify-center gap-6 hidden pointer-events-none">
        <button onclick="prevSlide()" class="nav-btn pointer-events-auto">
            <i data-lucide="chevron-left" class="w-6 h-6"></i>
        </button>
        <button onclick="nextSlide()" class="nav-btn pointer-events-auto">
            <i data-lucide="chevron-right" class="w-6 h-6"></i>
        </button>
    </div>

    <script>
        lucide.createIcons();

        // Config & State
        let currentSlide = 0;
        let totalSlides = 0;
        let playsData = [];
        let gameMetadata = {}; // stores name, image, year
        let selectedYear = new Date().getFullYear() - 1;
        const PLAY_FETCH_PARALLEL = 100;
        const IMAGE_PROXY = '/api/image-proxy?url=';

        // Init Years
        function initYears() {
            const container = document.getElementById('yearSelector');
            const current = new Date().getFullYear();
            const startYear = 2018;
            let html = '';
            // Generate years down to 2018
            for (let y = current; y >= startYear; y--) {
                html += `<button onclick="selectYear(${y}, this)" class="year-btn py-3 rounded-xl border border-white/10 bg-white/5 text-xs font-bold text-slate-400 hover:bg-white/10 transition-all">${y}</button>`;
            }
            container.innerHTML = html;
            // Select most recent full year (last year) by default, or current if early in year
            const defaultYear = current - 1;
            const defaultBtn = Array.from(container.children).find(b => b.textContent == defaultYear) || container.firstElementChild;
            if(defaultBtn) selectYear(parseInt(defaultBtn.textContent), defaultBtn);
        }

        function selectYear(y, btn) {
            selectedYear = y;
            document.querySelectorAll('.year-btn').forEach(b => {
                b.classList.remove('bg-emerald-500', 'border-emerald-500', 'text-white', 'shadow-lg');
                b.classList.add('bg-white/5', 'border-white/10', 'text-slate-400');
            });
            btn.classList.remove('bg-white/5', 'border-white/10', 'text-slate-400');
            btn.classList.add('bg-emerald-500', 'border-emerald-500', 'text-white', 'shadow-lg');
        }

        initYears();

        async function generateWrapped() {
            const username = document.getElementById('usernameInput').value.trim();
            if (!username) return alert("Please enter a username");

            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('loadingScreen').classList.remove('hidden');

            try {
                await fetchAllPlays(username, selectedYear);
                if (playsData.length === 0) throw new Error("No plays found for this year.");
                
                await fetchMissingMetadata(username);
                buildSlides();
                
                document.getElementById('loadingScreen').classList.add('hidden');
                document.getElementById('navControls').classList.remove('hidden');
                showSlide(0);
            } catch (e) {
                alert(e.message);
                location.reload();
            }
        }

        async function fetchAllPlays(username, year) {
            const updateLoad = (msg) => document.getElementById('loadingSub').textContent = msg;
            playsData = [];
            let page = 1;
            let stop = false;

            while (!stop) {
                updateLoad(`Fetching pages ${page} - ${page + PLAY_FETCH_PARALLEL}...`);
                const promises = [];
                for (let i = 0; i < PLAY_FETCH_PARALLEL; i++) {
                    promises.push(fetch(`/api/bgg-helper?endpoint=plays&username=${encodeURIComponent(username)}&mindate=${year}-01-01&maxdate=${year}-12-31&page=${page + i}`));
                }

                const responses = await Promise.all(promises);
                let emptyPages = 0;

                for (const res of responses) {
                    if (!res.ok) continue;
                    const txt = await res.text();
                    const xml = new DOMParser().parseFromString(txt, 'text/xml');
                    const plays = Array.from(xml.querySelectorAll('play'));
                    
                    if (plays.length === 0) emptyPages++;
                    
                    plays.forEach(p => {
                        playsData.push({
                            date: p.getAttribute('date'),
                            quantity: parseInt(p.getAttribute('quantity')),
                            gameName: p.querySelector('item').getAttribute('name'),
                            gameId: p.querySelector('item').getAttribute('objectid'),
                            location: p.getAttribute('location') || 'Unknown Location'
                        });
                    });
                }

                if (emptyPages === PLAY_FETCH_PARALLEL) stop = true;
                else page += PLAY_FETCH_PARALLEL;
            }
            console.log(`Loaded ${playsData.length} total plays.`);
        }

        async function fetchMissingMetadata(username) {
            const uniqueIds = [...new Set(playsData.map(p => p.gameId))];
            const updateLoad = (msg) => document.getElementById('loadingSub').textContent = msg;
            
            // 1. Try Collection (fastest for owned games)
            updateLoad("Checking collection...");
            try {
                const res = await fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1`);
                const xml = new DOMParser().parseFromString(await res.text(), 'text/xml');
                Array.from(xml.querySelectorAll('item')).forEach(item => {
                    const id = item.getAttribute('objectid');
                    gameMetadata[id] = {
                        name: item.querySelector('name').textContent,
                        image: item.querySelector('thumbnail')?.textContent || '',
                        year: item.querySelector('yearpublished')?.textContent || ''
                    };
                });
            } catch (e) {}

            // 2. Fetch missing IDs in batches
            const missing = uniqueIds.filter(id => !gameMetadata[id]);
            const batchSize = 20; // safe batch size
            
            for (let i = 0; i < missing.length; i += batchSize) {
                updateLoad(`Loading images ${i}/${missing.length}...`);
                const batch = missing.slice(i, i + batchSize);
                const ids = batch.join(',');
                try {
                    const res = await fetch(`/api/bgg-helper?endpoint=thing&id=${ids}`);
                    const xml = new DOMParser().parseFromString(await res.text(), 'text/xml');
                    Array.from(xml.querySelectorAll('item')).forEach(item => {
                        const id = item.getAttribute('id');
                        gameMetadata[id] = {
                            name: item.querySelector('name[type="primary"]')?.getAttribute('value') || 'Unknown',
                            image: item.querySelector('thumbnail')?.textContent || '',
                            year: item.querySelector('yearpublished')?.getAttribute('value') || ''
                        };
                    });
                } catch(e) {}
                await new Promise(r => setTimeout(r, 200)); // nice throttle
            }
        }

        function buildSlides() {
            const container = document.getElementById('slidesContainer');
            const slides = [];

            // Helper to get image
            const getImg = (id) => {
                const url = gameMetadata[id]?.image;
                return url ? `${IMAGE_PROXY}${encodeURIComponent(url)}` : '';
            };

            // Slide 1: Intro
            slides.push(`
                <div class="slide theme-emerald active">
                    <div class="flex flex-col items-center gap-6 animate-in">
                        <h1 class="text-[12rem] font-black text-emerald-500/20 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 select-none pointer-events-none">${selectedYear}</h1>
                        <div class="relative z-10 text-center space-y-4">
                            <i data-lucide="sparkles" class="w-16 h-16 text-emerald-400 mx-auto mb-4"></i>
                            <h2 class="text-6xl font-black text-white italic uppercase tracking-tighter">${selectedYear}</h2>
                            <p class="text-xl font-medium text-slate-300">Your Year in Board Games</p>
                        </div>
                    </div>
                </div>
            `);

            // Slide 2: The Big Numbers
            const totalPlays = playsData.reduce((s, p) => s + p.quantity, 0);
            const uniqueGames = new Set(playsData.map(p => p.gameId)).size;
            
            slides.push(`
                <div class="slide theme-blue">
                    <h3 class="text-sm font-black text-blue-400 uppercase tracking-[0.3em] mb-12">The Overview</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-2xl w-full px-6">
                        <div class="glass p-8 rounded-[3rem] border border-white/10 flex flex-col items-center justify-center gap-2 aspect-square">
                            <span class="text-6xl md:text-8xl font-black text-white tracking-tighter">${totalPlays}</span>
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Total Plays</span>
                        </div>
                        <div class="glass p-8 rounded-[3rem] border border-white/10 flex flex-col items-center justify-center gap-2 aspect-square">
                            <span class="text-6xl md:text-8xl font-black text-blue-400 tracking-tighter">${uniqueGames}</span>
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Unique Games</span>
                        </div>
                    </div>
                </div>
            `);

            // Slide 3: Most Played Game
            const counts = {};
            playsData.forEach(p => counts[p.gameId] = (counts[p.gameId] || 0) + p.quantity);
            const sortedIds = Object.keys(counts).sort((a,b) => counts[b] - counts[a]);
            const topId = sortedIds[0];
            const topMeta = gameMetadata[topId] || { name: 'Unknown', image: '' };

            slides.push(`
                <div class="slide theme-amber">
                    <h3 class="text-sm font-black text-amber-400 uppercase tracking-[0.3em] mb-8">Most Played</h3>
                    <div class="relative w-64 h-64 md:w-80 md:h-80 mb-8 rounded-[3rem] overflow-hidden border-4 border-amber-500/30 shadow-2xl shadow-amber-500/20">
                        <img src="${getImg(topId)}" class="w-full h-full object-cover">
                    </div>
                    <h1 class="text-3xl md:text-5xl font-black text-white italic uppercase tracking-tighter max-w-2xl leading-none mb-4">${topMeta.name}</h1>
                    <div class="glass px-8 py-3 rounded-full border border-white/10">
                        <span class="text-xl font-black text-amber-400">${counts[topId]}</span>
                        <span class="text-xs font-bold text-white uppercase tracking-widest ml-2">Sessions</span>
                    </div>
                </div>
            `);

            // Slide 4: Top 5 List
            const top5 = sortedIds.slice(0, 5).map((id, i) => {
                const m = gameMetadata[id] || {name:'?', image:''};
                return `
                    <div class="flex items-center gap-4 w-full glass p-3 rounded-2xl border border-white/5">
                        <span class="text-2xl font-black text-rose-500/50 w-8 text-right italic">#${i+1}</span>
                        <div class="w-12 h-12 rounded-lg bg-black/40 overflow-hidden shrink-0">
                            <img src="${getImg(id)}" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-1 text-left min-w-0">
                            <div class="text-sm font-black text-white truncate">${m.name}</div>
                            <div class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">${counts[id]} Plays</div>
                        </div>
                    </div>
                `;
            }).join('');

            slides.push(`
                <div class="slide theme-rose">
                    <h3 class="text-sm font-black text-rose-400 uppercase tracking-[0.3em] mb-8">The Heavy Hitters</h3>
                    <div class="w-full max-w-md space-y-3 px-4">
                        ${top5}
                    </div>
                </div>
            `);

            // Slide 5: Monthly Pulse
            const months = Array(12).fill(0);
            playsData.forEach(p => months[new Date(p.date).getMonth()] += p.quantity);
            const maxM = Math.max(...months);
            const monthBars = months.map((v, i) => {
                const h = (v / maxM) * 100;
                const label = new Date(2000, i, 1).toLocaleDateString('en-US', {month:'narrow'});
                return `
                    <div class="flex-1 flex flex-col justify-end h-full group relative">
                        <div class="bar w-full bg-indigo-500 rounded-t-sm group-hover:bg-indigo-400 transition-colors" style="height: ${h}%"></div>
                        <span class="bar-label">${label}</span>
                    </div>
                `;
            }).join('');

            slides.push(`
                <div class="slide theme-purple">
                    <h3 class="text-sm font-black text-indigo-400 uppercase tracking-[0.3em] mb-12">Monthly Pulse</h3>
                    <div class="w-full max-w-3xl h-64 flex items-end gap-2 md:gap-4 px-6 pb-8">
                        ${monthBars}
                    </div>
                    <div class="mt-8 glass px-6 py-3 rounded-2xl border border-white/5 inline-flex items-center gap-3">
                        <i data-lucide="calendar" class="w-4 h-4 text-indigo-400"></i>
                        <span class="text-xs font-bold text-slate-300 uppercase tracking-widest">
                            Busiest Month: <span class="text-white">${new Date(2000, months.indexOf(maxM), 1).toLocaleDateString('en-US', {month:'long'})}</span>
                        </span>
                    </div>
                </div>
            `);

            // Slide 6: Outro
            slides.push(`
                <div class="slide theme-emerald">
                    <div class="text-center space-y-8 animate-in">
                        <div class="w-24 h-24 bg-white/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-white/20">
                            <i data-lucide="check" class="text-emerald-400 w-12 h-12"></i>
                        </div>
                        <h2 class="text-4xl font-black text-white italic uppercase tracking-tighter">That's a Wrap!</h2>
                        <div class="flex gap-4 justify-center">
                            <button onclick="location.reload()" class="btn-primary px-8 py-4 rounded-2xl font-black text-xs text-white uppercase tracking-widest transition-transform hover:scale-105 shadow-xl">
                                Start Over
                            </button>
                        </div>
                    </div>
                </div>
            `);

            container.innerHTML = slides.join('');
            totalSlides = slides.length;
            lucide.createIcons();
        }

        function showSlide(idx) {
            if (idx < 0 || idx >= totalSlides) return;
            const slides = document.querySelectorAll('.slide');
            slides.forEach(s => s.classList.remove('active'));
            slides[idx].classList.add('active');
            currentSlide = idx;
        }

        function nextSlide() { showSlide(currentSlide + 1); }
        function prevSlide() { showSlide(currentSlide - 1); }

        document.addEventListener('keydown', e => {
            if(e.key === 'ArrowRight') nextSlide();
            if(e.key === 'ArrowLeft') prevSlide();
        });

    </script>
    <script type="module" src="analytics-init.js"></script>
</body>
</html>
