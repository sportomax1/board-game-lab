<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Board Game Arena - BGG Collection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
    }

    .game-card {
      transition: all 0.2s ease;
    }

    .game-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
    }

    .skeleton {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }

    .rank-badge {
      transition: all 0.2s ease;
    }
  </style>
</head>
<body class="pb-20">

  <header class="sticky top-0 z-30 w-full bg-white/80 backdrop-blur-md border-b px-4 py-4 shadow-sm">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-blue-600 text-white p-2 rounded-lg">
          <i class="fa-solid fa-gamepad"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">Board Game Arena</h1>
          <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">BGG Collection</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="openCollectionModal()" class="bg-white text-blue-600 border border-blue-200 hover:bg-blue-50 px-3 py-2 rounded-lg text-xs font-bold transition-colors">
          <i class="fa-solid fa-layer-group mr-1"></i> Check Collection
        </button>
        <div id="statsBox" class="text-right">
          <div class="text-2xl font-bold text-blue-600" id="gameCount">0</div>
          <div class="text-[10px] text-slate-500 uppercase font-bold">Games</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Collection Check Modal -->
  <div id="collectionModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" onclick="closeCollectionModal()"></div>
    <div class="absolute inset-4 sm:inset-auto sm:top-10 sm:bottom-10 sm:left-1/2 sm:-translate-x-1/2 sm:w-[600px] bg-white rounded-2xl shadow-2xl flex flex-col overflow-hidden">
      <!-- Modal Header -->
      <div class="p-4 border-b flex items-center justify-between bg-white z-10">
        <div>
          <h2 class="font-bold text-lg" id="modalTitle">Games Not on BGA</h2>
          <div class="flex gap-2 mt-2">
            <button onclick="setModalFilter('missing')" id="filterMissingBtn" class="px-3 py-1 rounded-lg text-xs font-bold bg-red-100 text-red-700 border border-red-200">
              Missing
            </button>
            <button onclick="setModalFilter('onbga')" id="filterOnBgaBtn" class="px-3 py-1 rounded-lg text-xs font-bold bg-slate-200 text-slate-600 border border-slate-300 hover:bg-slate-300">
              On BGA
            </button>
          </div>
        </div>
        <button onclick="closeCollectionModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center transition-colors">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      
      <!-- Modal Controls -->
      <div class="p-4 border-b bg-slate-50 space-y-3">
        <div class="flex gap-2">
          <input type="text" id="collectionUsername" value="sportomax" class="flex-1 px-3 py-2 rounded-lg border border-slate-200 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="BGG Username">
          <button onclick="checkCollection()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-blue-700 transition-colors">
            Check
          </button>
        </div>
        <div class="flex items-center gap-2">
           <select id="modalSort" onchange="sortModalGames()" class="flex-1 px-3 py-2 rounded-lg border border-slate-200 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
             <option value="rating">Avg Rating (High-Low)</option>
             <option value="rank">BGG Rank (Best-Worst)</option>
             <option value="alpha">Alphabetical (A-Z)</option>
             <option value="weight-desc">Weight (High-Low)</option>
             <option value="weight-asc">Weight (Low-High)</option>
             <option value="playtime-asc">Playing Time (Short-Long)</option>
             <option value="playtime-desc">Playing Time (Long-Short)</option>
           </select>
           <div id="modalStats" class="text-xs font-bold text-slate-500 whitespace-nowrap hidden">
             Found <span id="modalCount" class="text-blue-600">0</span> games
           </div>
        </div>
      </div>

      <!-- Modal Content -->
      <div id="modalContent" class="flex-1 overflow-y-auto p-4 space-y-2 bg-slate-50/50">
        <div class="text-center text-slate-500 py-10">
          Enter a username to find games in their collection<br>that are NOT on Board Game Arena.
        </div>
      </div>
      <div id="modalLoadingStatus" class="text-center text-slate-500 text-xs p-2 hidden">
        Loading additional data...
      </div>
    </div>
  </div>

  <main class="max-w-4xl mx-auto p-4 space-y-6">
    
    <!-- Loading Section -->
    <div id="loadingSection">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
        <div class="flex items-center justify-center gap-3 mb-4">
          <i class="fa-solid fa-circle-notch fa-spin text-blue-600 text-2xl"></i>
          <span class="font-bold text-slate-700">Loading Board Game Arena games...</span>
        </div>
        <div class="text-sm text-slate-500 text-center" id="loadingStatus">Fetching family...</div>
        <div class="mt-4 bg-slate-100 rounded-full h-2 overflow-hidden">
          <div id="progressBar" class="bg-blue-600 h-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- Stats Cards -->
    <div id="statsSection" class="hidden grid grid-cols-2 sm:grid-cols-4 gap-4">
      <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-4">
        <div class="text-xs font-bold text-slate-500 uppercase mb-1">Top 100</div>
        <div class="text-2xl font-bold text-green-600" id="top100">0</div>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-4">
        <div class="text-xs font-bold text-slate-500 uppercase mb-1">Top 500</div>
        <div class="text-2xl font-bold text-blue-600" id="top500">0</div>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-4">
        <div class="text-xs font-bold text-slate-500 uppercase mb-1">Top 1K</div>
        <div class="text-2xl font-bold text-purple-600" id="top1k">0</div>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-4">
        <div class="text-xs font-bold text-slate-500 uppercase mb-1">Avg Rating</div>
        <div class="text-2xl font-bold text-amber-600" id="avgRating">0</div>
      </div>
    </div>

    <!-- Filters and Sort -->
    <div id="controlsSection" class="hidden bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
      <div class="flex flex-col sm:flex-row gap-3">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search games..." 
          oninput="filterGames()"
          class="flex-1 px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none transition-all"
        >
        <select 
          id="sortSelect" 
          onchange="sortGames()" 
          class="px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none transition-all bg-white font-medium text-sm"
        >
          <option value="rank-asc">Rank: Best to Worst</option>
          <option value="rank-desc">Rank: Worst to Best</option>
          <option value="name">Name: A-Z</option>
          <option value="rating-desc">Rating: High to Low</option>
          <option value="rating-asc">Rating: Low to High</option>
        </select>
      </div>
    </div>

    <!-- Games List -->
    <div id="gamesSection" class="hidden space-y-3">
      <!-- Games will be populated here -->
    </div>

  </main>

<script>
const FAMILY_ID = 70360; // Board Game Arena family ID
const GEEKLIST_ID = 140673; // BGA geeklist
let allGames = [];
let displayedGames = [];
let isLoading = false;
let bgaGeeklistMap = new Map(); // Map of game ID to BGA URL
let collectionFilter = 'missing'; // 'missing' or 'onbga'
let allCollectionGames = []; // All games from user collection
let missingGames = []; // Games not on BGA
let onBgaGames = []; // Games already on BGA

async function fetchGeeklistUrls() {
  try {
    const geeklistXml = await fetchAPI('geeklist', GEEKLIST_ID.toString());
    const doc = new DOMParser().parseFromString(geeklistXml, 'text/xml');
    const items = doc.querySelectorAll('item');
    
    items.forEach(item => {
      const objectid = item.getAttribute('objectid'); // Get the actual game ID, not the geeklist item ID
      
      // Try link element first
      const links = item.querySelectorAll('link');
      let found = false;
      links.forEach(link => {
        if (link.getAttribute('type') === 'boardgamearena') {
          const url = link.getAttribute('href');
          if (url) {
            bgaGeeklistMap.set(objectid, url);
            found = true;
          }
        }
      });
      
      // If not found in links, check body/description for URL
      if (!found) {
        const bodyText = item.textContent || '';
        // Match BGA URLs - they typically look like: https://boardgamearena.com/...
        const urlMatch = bodyText.match(/(https?:\/\/(?:www\.)?boardgamearena\.com[^\s<>"]*)/i);
        if (urlMatch && urlMatch[1]) {
          bgaGeeklistMap.set(objectid, urlMatch[1]);
        }
      }
    });
    
    console.log('BGA Geeklist loaded:', bgaGeeklistMap.size, 'games');
  } catch (e) {
    console.error('Error fetching geeklist:', e);
  }
}

async function fetchCollection() {
  const loadingSection = document.getElementById('loadingSection');
  const controlsSection = document.getElementById('controlsSection');
  const gamesSection = document.getElementById('gamesSection');
  const statsSection = document.getElementById('statsSection');
  
  try {
    isLoading = true;
    
    // Fetch family to get game IDs
    updateLoadingStatus('Fetching Board Game Arena family...');
    const familyXml = await fetchAPI('family', FAMILY_ID.toString());
    const doc = new DOMParser().parseFromString(familyXml, 'text/xml');
    const familyItem = doc.querySelector('item[type="boardgamefamily"]');
    
    if (!familyItem) throw new Error('Family not found');
    
    const links = familyItem.querySelectorAll('link[type="boardgamefamily"]');
    const gameIds = Array.from(links)
      .map(link => link.getAttribute('id'))
      .filter(id => id);
    
    updateLoadingStatus(`Found ${gameIds.length} games. Loading details...`);
    document.getElementById('gameCount').textContent = gameIds.length;
    
    // Initialize games array with bgaUrl field
    allGames = gameIds.map(id => ({
      objectid: id,
      name: '',
      thumb: '',
      rating: 0,
      rank: 999999,
      loaded: false,
      bgaUrl: null
    }));
    
    // Fetch geeklist 140673 to get BGA URLs
    updateLoadingStatus('Fetching BGA geeklist...');
    await fetchGeeklistUrls();
    
    // Show UI
    controlsSection.classList.remove('hidden');
    gamesSection.classList.remove('hidden');
    statsSection.classList.remove('hidden');
    displayedGames = [...allGames];
    renderGames();
    
    // Fetch game details in batches with 100x parallel processing
    const batchSize = 20;
    const parallelBatches = 100;
    const batches = [];
    for (let i = 0; i < gameIds.length; i += batchSize) {
      batches.push(gameIds.slice(i, i + batchSize));
    }
    
    // Process batches in parallel groups
    for (let i = 0; i < batches.length; i += parallelBatches) {
      const batchGroup = batches.slice(i, i + parallelBatches);
      updateLoadingStatus(`Loading details ${Math.min(i + parallelBatches, batches.length)}/${batches.length}...`);
      updateProgress((Math.min(i + parallelBatches, batches.length) / batches.length) * 100);
      
      await Promise.all(batchGroup.map(async (batch) => {
        const ids = batch.join(',');
        
        try {
          const thingXml = await fetchAPI('thing', ids, '&stats=1');
          const thingDoc = new DOMParser().parseFromString(thingXml, 'text/xml');
          const thingItems = Array.from(thingDoc.querySelectorAll('item'));
          
          thingItems.forEach(thingItem => {
            const id = thingItem.getAttribute('id');
            const game = allGames.find(g => g.objectid === id);
            if (!game) return;
            
            // Get name
            const nameElem = thingItem.querySelector('name[type="primary"]');
            game.name = nameElem ? nameElem.getAttribute('value') : 'Unknown';
            
            // Get thumbnail
            game.thumb = thingItem.querySelector('thumbnail')?.textContent || '';
            
            // Get rating
            const avgElement = thingItem.querySelector('statistics ratings average');
            if (avgElement) {
              game.rating = parseFloat(avgElement.getAttribute('value') || '0');
            }
            
            // Get rank
            const rankElement = thingItem.querySelector('statistics ratings ranks rank[name="boardgame"]');
            if (rankElement) {
              const rankValue = rankElement.getAttribute('value');
              if (rankValue && rankValue !== 'Not Ranked') {
                game.rank = parseInt(rankValue);
              }
            }
            
            game.loaded = true;
            game.bgaUrl = bgaGeeklistMap.get(id) || null;
          });
          
        } catch (e) {
          console.error('Batch error:', e);
        }
      }));
      
      // Update display after each parallel group
      updateStats();
      sortGames();
      
      await wait(500);
    }
    
    updateLoadingStatus('Complete!');
    updateProgress(100);
    isLoading = false;
    
    // Hide loading indicator
    setTimeout(() => {
      loadingSection.classList.add('hidden');
    }, 500);
    
  } catch (e) {
    console.error(e);
    alert('Failed to fetch games. Please try again.');
    loadingSection.classList.add('hidden');
  }
}

function updateLoadingStatus(msg) {
  document.getElementById('loadingStatus').textContent = msg;
}

function updateProgress(percent) {
  document.getElementById('progressBar').style.width = percent + '%';
}

function updateStats() {
  const top100 = allGames.filter(g => g.rank <= 100 && g.rank > 0).length;
  const top500 = allGames.filter(g => g.rank <= 500 && g.rank > 0).length;
  const top1k = allGames.filter(g => g.rank <= 1000 && g.rank > 0).length;
  
  const ratedGames = allGames.filter(g => g.rating > 0);
  const avgRating = ratedGames.length > 0 
    ? (ratedGames.reduce((sum, g) => sum + g.rating, 0) / ratedGames.length).toFixed(1)
    : '0';
  
  document.getElementById('top100').textContent = top100;
  document.getElementById('top500').textContent = top500;
  document.getElementById('top1k').textContent = top1k;
  document.getElementById('avgRating').textContent = avgRating;
}

function filterGames() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  displayedGames = allGames.filter(game => game.name.toLowerCase().includes(search));
  sortGames();
}

function sortGames() {
  const sortBy = document.getElementById('sortSelect').value;
  
  if (sortBy === 'rank-asc') {
    displayedGames.sort((a, b) => a.rank - b.rank);
  } else if (sortBy === 'rank-desc') {
    displayedGames.sort((a, b) => b.rank - a.rank);
  } else if (sortBy === 'name') {
    displayedGames.sort((a, b) => a.name.localeCompare(b.name));
  } else if (sortBy === 'rating-desc') {
    displayedGames.sort((a, b) => b.rating - a.rating);
  } else if (sortBy === 'rating-asc') {
    displayedGames.sort((a, b) => a.rating - b.rating);
  }
  
  renderGames();
}

function renderGames() {
  const container = document.getElementById('gamesSection');
  container.innerHTML = '';
  
  displayedGames.forEach(game => {
    const card = document.createElement('div');
    card.className = 'game-card bg-white rounded-xl shadow-sm border border-slate-100 p-4 cursor-pointer';
    card.onclick = () => window.open(`https://boardgamegeek.com/boardgame/${game.objectid}`, '_blank');
    
    const isLoaded = game.loaded || !isLoading;
    const rankColor = game.rank <= 100 ? 'bg-green-100 text-green-700 border-green-200' :
                      game.rank <= 500 ? 'bg-blue-100 text-blue-700 border-blue-200' :
                      game.rank <= 1000 ? 'bg-purple-100 text-purple-700 border-purple-200' :
                      'bg-slate-100 text-slate-600 border-slate-200';
    
    card.innerHTML = `
      <div class="flex gap-4">
        <img 
          src="/api/image-proxy?url=${encodeURIComponent(game.thumb)}" 
          alt="${game.name}"
          class="w-20 h-20 rounded-lg object-cover bg-slate-200 flex-shrink-0"
          onerror="this.style.display='none'"
        >
        <div class="flex-1 min-w-0">
          <div class="flex items-start justify-between gap-2">
            <h3 class="font-bold text-slate-900 mb-2">${game.name || '...'}</h3>
            ${game.bgaUrl ? `<a href="${game.bgaUrl}" target="_blank" class="bg-green-500 hover:bg-green-600 text-white px-2 py-1 rounded text-xs font-bold flex-shrink-0 whitespace-nowrap transition-colors"><i class="fa-solid fa-arrow-up-right"></i> BGA</a>` : ''}
          </div>
          <div class="flex flex-wrap gap-2">
            ${isLoaded ? `
              <div class="rank-badge ${rankColor} px-2 py-1 rounded text-xs font-bold border">
                ${game.rank < 999999 ? '#' + game.rank : 'Unranked'}
              </div>
              ${game.rating > 0 ? `
                <div class="bg-amber-50 border border-amber-200 text-amber-700 px-2 py-1 rounded text-xs font-bold">
                  ⭐ ${game.rating.toFixed(1)}
                </div>
              ` : ''}
            ` : `
              <div class="skeleton bg-slate-200 h-6 w-16 rounded"></div>
              <div class="skeleton bg-slate-200 h-6 w-20 rounded"></div>
            `}
          </div>
        </div>
      </div>
    `;
    
    container.appendChild(card);
  });
}

let modalGames = [];

function openCollectionModal() {
  document.getElementById('collectionModal').classList.remove('hidden');
}

function closeCollectionModal() {
  document.getElementById('collectionModal').classList.add('hidden');
}

async function checkCollection() {
  const username = document.getElementById('collectionUsername').value;
  const content = document.getElementById('modalContent');
  const stats = document.getElementById('modalStats');
  const loadingStatus = document.getElementById('modalLoadingStatus');
  
  if (!username) return;
  
  content.innerHTML = `
    <div class="flex flex-col items-center justify-center p-10 gap-3">
      <i class="fa-solid fa-circle-notch fa-spin text-blue-600 text-2xl"></i>
      <span class="font-bold text-slate-500">Fetching collection for ${username}...</span>
    </div>
  `;
  stats.classList.add('hidden');
  loadingStatus.classList.add('hidden');
  
  try {
    // Corrected to use stats=1 to get ratings and ranks
    const xml = await fetchAPI('collection', username, '&own=1&stats=1');
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    
    // Check for errors in BGG response
    const errors = doc.querySelector('errors');
    if (errors) {
       throw new Error(errors.textContent || 'BGG Error');
    }

    const items = Array.from(doc.querySelectorAll('item'));
    
    // Create a Set of BGA game IDs for O(1) lookup
    const bgaIds = new Set(allGames.map(g => g.objectid));
    
    // Separate into missing and onBGA
    allCollectionGames = items.map(item => {
      const id = item.getAttribute('objectid');
      let rank = 999999;
      const rankNode = item.querySelector('stats rating ranks rank[name="boardgame"]');
      if (rankNode) {
          const val = rankNode.getAttribute('value');
          if (val && val !== 'Not Ranked') {
              rank = parseInt(val);
          }
      }
      return {
        id: id,
        name: item.querySelector('name')?.textContent || 'Unknown',
        thumb: item.querySelector('thumbnail')?.textContent || '',
        rating: parseFloat(item.querySelector('stats rating')?.getAttribute('value') || '0'),
        rank: rank,
        averageweight: null,
        playingtime: null,
        onBga: bgaIds.has(id)
      };
    });
    
    missingGames = allCollectionGames.filter(g => !g.onBga);
    onBgaGames = allCollectionGames.filter(g => g.onBga);
    
    // Fetch thing API data for all games with status update
    loadingStatus.classList.remove('hidden');
    loadingStatus.textContent = 'Loading weight & playtime data...';
    
    const batchSize = 20;
    const parallelBatches = 100;
    const allGamesToFetch = [...missingGames, ...onBgaGames];
    const batches = [];
    
    for (let i = 0; i < allGamesToFetch.length; i += batchSize) {
      batches.push(allGamesToFetch.slice(i, i + batchSize));
    }
    
    for (let i = 0; i < batches.length; i += parallelBatches) {
      const batchGroup = batches.slice(i, i + parallelBatches);
      await Promise.all(batchGroup.map(async (batch) => {
        const ids = batch.map(g => g.id).join(',');
        try {
          const thingXml = await fetchAPI('thing', ids, '&stats=1');
          const thingDoc = new DOMParser().parseFromString(thingXml, 'text/xml');
          const thingItems = Array.from(thingDoc.querySelectorAll('item'));
          thingItems.forEach(thingItem => {
            const id = thingItem.getAttribute('id');
            const game = allGamesToFetch.find(g => g.id === id);
            if (!game) return;
            const weightNode = thingItem.querySelector('statistics ratings averageweight');
            if (weightNode) {
              game.averageweight = parseFloat(weightNode.getAttribute('value') || '0');
            }
            const ptNode = thingItem.querySelector('playingtime');
            if (ptNode) {
              game.playingtime = parseInt(ptNode.textContent || '0');
            }
          });
        } catch (e) {
          // Ignore batch error
        }
      }));
    }
    
    loadingStatus.classList.add('hidden');
    document.getElementById('modalCount').textContent = missingGames.length;
    document.getElementById('modalTitle').textContent = 'Games Not on BGA';
    stats.classList.remove('hidden');
    collectionFilter = 'missing';
    sortModalGames();
    
  } catch (e) {
    console.error(e);
    content.innerHTML = `
      <div class="text-center text-red-500 p-10 font-bold">
        Error fetching collection. <br>Please check username and try again.<br>
        <div class="text-xs font-normal mt-2 text-slate-400">${e.message}</div>
      </div>
    `;
  }
}

function setModalFilter(filter) {
  collectionFilter = filter;
  document.getElementById('filterMissingBtn').className = filter === 'missing' 
    ? 'px-3 py-1 rounded-lg text-xs font-bold bg-red-100 text-red-700 border border-red-200'
    : 'px-3 py-1 rounded-lg text-xs font-bold bg-slate-200 text-slate-600 border border-slate-300 hover:bg-slate-300';
  document.getElementById('filterOnBgaBtn').className = filter === 'onbga'
    ? 'px-3 py-1 rounded-lg text-xs font-bold bg-green-100 text-green-700 border border-green-200'
    : 'px-3 py-1 rounded-lg text-xs font-bold bg-slate-200 text-slate-600 border border-slate-300 hover:bg-slate-300';
  document.getElementById('modalTitle').textContent = filter === 'missing' ? 'Games Not on BGA' : 'Games Already on BGA';
  document.getElementById('modalCount').textContent = filter === 'missing' ? missingGames.length : onBgaGames.length;
  sortModalGames();
}

function sortModalGames() {
  const gamesToSort = collectionFilter === 'missing' ? missingGames : onBgaGames;
  const sort = document.getElementById('modalSort').value;
  if (sort === 'rating') {
    gamesToSort.sort((a, b) => b.rating - a.rating);
  } else if (sort === 'rank') {
    gamesToSort.sort((a, b) => a.rank - b.rank);
  } else if (sort === 'alpha') {
    gamesToSort.sort((a, b) => a.name.localeCompare(b.name));
  } else if (sort === 'weight-desc') {
    gamesToSort.sort((a, b) => (b.averageweight ?? -1) - (a.averageweight ?? -1));
  } else if (sort === 'weight-asc') {
    gamesToSort.sort((a, b) => (a.averageweight ?? 999) - (b.averageweight ?? 999));
  } else if (sort === 'playtime-asc') {
    gamesToSort.sort((a, b) => (a.playingtime ?? 99999) - (b.playingtime ?? 99999));
  } else if (sort === 'playtime-desc') {
    gamesToSort.sort((a, b) => (b.playingtime ?? -1) - (a.playingtime ?? -1));
  }
  renderModalGames();
}

function renderModalGames() {
  const content = document.getElementById('modalContent');
  content.innerHTML = '';
  
  const gamesToRender = collectionFilter === 'missing' ? missingGames : onBgaGames;
  
  if (gamesToRender.length === 0) {
    content.innerHTML = `
      <div class="text-center text-slate-500 p-10">
        ${collectionFilter === 'missing' ? 'All games in this collection are already on BGA! 🎉' : 'No games found on BGA in this collection.'}
      </div>
    `;
    return;
  }
  
  gamesToRender.forEach(game => {
    const div = document.createElement('div');
    div.className = 'bg-white p-3 rounded-xl border border-slate-100 flex gap-3 hover:shadow-md transition-all cursor-pointer';
    div.onclick = () => window.open(`https://boardgamegeek.com/boardgame/${game.id}`, '_blank');
    
    // Proxy image if thumb is http
    let thumbSrc = game.thumb;
    if (thumbSrc && !thumbSrc.startsWith('https')) {
        thumbSrc = `/api/image-proxy?url=${encodeURIComponent(thumbSrc)}`;
    }
    
    div.innerHTML = `
      <img src="${thumbSrc}" class="w-16 h-16 rounded bg-slate-100 object-cover flex-shrink-0" onerror="this.style.display='none'">
      <div class="flex-1 min-w-0">
        <h4 class="font-bold text-slate-900 truncate text-sm leading-tight mb-1">${game.name}</h4>
        <div class="flex gap-2 text-xs flex-wrap">
          ${game.rating > 0 ? `<span class="bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded font-bold border border-amber-200">⭐ ${game.rating.toFixed(1)}</span>` : ''}
          ${game.rank < 999999 ? `<span class="bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded font-bold border border-blue-200">#${game.rank}</span>` : ''}
          ${typeof game.averageweight === 'number' && !isNaN(game.averageweight) ? `<span class="bg-green-100 text-green-800 px-1.5 py-0.5 rounded font-bold border border-green-200">⚖️ ${game.averageweight.toFixed(2)}</span>` : ''}
          ${typeof game.playingtime === 'number' && !isNaN(game.playingtime) && game.playingtime > 0 ? `<span class="bg-purple-100 text-purple-800 px-1.5 py-0.5 rounded font-bold border border-purple-200"><i class='fa-regular fa-clock'></i> ${game.playingtime} min</span>` : ''}
        </div>
      </div>
    `;
    content.appendChild(div);
  });
}

async function fetchAPI(endpoint, id, queryParams = '') {
  let url;
  if (endpoint === 'collection') {
    url = `/api/bgg-helper?endpoint=${endpoint}&username=${encodeURIComponent(id)}${queryParams}`;
  } else if (endpoint === 'geeklist') {
    url = `/api/bgg-helper?endpoint=${endpoint}&id=${encodeURIComponent(id)}${queryParams}`;
  } else {
    url = `/api/bgg-helper?endpoint=${endpoint}&id=${encodeURIComponent(id)}${queryParams}`;
  }
  
  for (let attempt = 0; attempt < 5; attempt++) {
    let res;
    try {
      res = await fetch(url);
    } catch (e) {
      await wait(1500 * Math.pow(2, attempt));
      continue;
    }
    if (res.status === 202) {
      await wait(3000);
      continue;
    }
    if (res.ok) {
      return await res.text();
    }
    await wait(2000);
  }
  throw new Error('Failed to fetch from BGG API');
}

function wait(ms) {
  return new Promise(r => setTimeout(r, ms));
}

// Auto-start loading
window.addEventListener('load', () => {
  fetchCollection();
});
