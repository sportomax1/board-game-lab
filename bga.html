<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BGG Family Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f7f7fa;
            color: #222;
        }
        .container {
            max-width: 430px;
            margin: 0 auto;
            padding: 2em 1em 1em 1em;
            padding-top: calc(2em + env(safe-area-inset-top));
            padding-bottom: calc(1em + env(safe-area-inset-bottom));
            box-sizing: border-box;
            min-height: 100vh;
        }
        h1 {
            font-size: 1.7em;
            margin-bottom: 1em;
            text-align: center;
            color: #1976d2;
        }
        .search-container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px #0001;
            margin-bottom: 1.5em;
            padding: 1em 1.2em;
        }
        .search-input {
            width: 100%;
            font-size: 1.1em;
            padding: 0.8em 1em;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            min-height: 44px;
            -webkit-appearance: none;
            appearance: none;
        }
        .game-count {
            text-align: center;
            margin: 1em 0;
            font-size: 1em;
            color: #666;
        }
        .game-list {
            margin-top: 1em;
        }
        .game-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px #0001;
            margin-bottom: 1em;
            padding: 1em 1.2em;
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .game-thumbnail-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-right: 1em;
            flex-shrink: 0;
        }
        .game-thumbnail {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            margin-bottom: 0.5em;
            object-fit: cover;
            flex-shrink: 0;
        }
        .status-emoji {
            position: absolute;
            top: 0.5em;
            right: 0.5em;
            font-size: 1.2em;
            z-index: 1;
        }
        .game-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px #0002;
        }
        .game-info {
            flex: 1;
        }
        .game-title {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 0.3em;
            color: #222;
            line-height: 1.3;
        }
        .game-details {
            font-size: 0.9em;
            color: #666;
            line-height: 1.4;
        }
        .bga-link {
            background: #ff6b35;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 0.3em 0.6em;
            font-size: 0.75em;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
            transition: background-color 0.2s ease;
            -webkit-appearance: none;
            appearance: none;
            text-align: center;
            min-width: 60px;
            box-sizing: border-box;
        }
        .bga-link:hover {
            background: #e55a2b;
            text-decoration: none;
        }
        .loading {
            text-align: center;
            padding: 2em;
            font-size: 1.1em;
            color: #666;
        }
        .error {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px #0001;
            padding: 1.5em;
            text-align: center;
            color: #d32f2f;
        }
        .back-button {
            background: #666;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 0.8em 1.5em;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 1em;
            min-height: 44px;
            -webkit-appearance: none;
            appearance: none;
        }
        @media (max-width: 480px) {
            .container {
                padding: 1.5em 0.8em 0.8em 0.8em;
                padding-top: calc(1.5em + env(safe-area-inset-top));
            }
            h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-button">← Back to Hub</a>
        <h1>👨‍👩‍👧‍👦 BGG Family Viewer</h1>
        
        <div class="search-container">
            <input type="number" id="familyIdInput" class="search-input" placeholder="Enter Family ID..." value="70360">
            <button id="loadBtn" style="width: 100%; margin-top: 0.75em; background: #007aff; color: #fff; border: none; padding: 0.8em; border-radius: 8px; cursor: pointer; font-size: 1em; font-weight: 600; -webkit-appearance: none; appearance: none; min-height: 44px;">Load Family</button>
        </div>

        <div class="game-count" id="gameCount"></div>
        
        <div id="loadingDiv" class="loading">🎯 Loading Board Game Arena games...</div>
        <div id="errorDiv" class="error" style="display:none;"></div>
        <div id="gameList" class="game-list"></div>
    </div>

    <script>
        let allGames = [];
        let filteredGames = [];

        // Fetch family games from BGG Family API
        async function loadFamilyGames() {
            const familyId = document.getElementById('familyIdInput').value.trim();
            
            if (!familyId) {
                document.getElementById('errorDiv').style.display = 'block';
                document.getElementById('errorDiv').textContent = 'Please enter a Family ID.';
                return;
            }
            
            document.getElementById('loadingDiv').style.display = 'block';
            document.getElementById('errorDiv').style.display = 'none';
            document.getElementById('gameList').innerHTML = '';
            document.getElementById('gameCount').textContent = '';
            
            try {
                // First, fetch the family data
                const familyResponse = await fetch(`/api/bgg-helper?endpoint=family&id=${familyId}`);
                const familyText = await familyResponse.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(familyText, 'text/xml');
                
                // Check for parse errors
                if (xml.getElementsByTagName('parsererror').length > 0) {
                    throw new Error('Invalid XML response from family endpoint');
                }
                
                // Get family type header
                const family = xml.querySelector('family');
                if (!family) {
                    throw new Error('No family data found for this ID');
                }
                
                const familyType = family.getAttribute('type') || 'Family';
                const familyName = family.querySelector('name')?.textContent || `Family ${familyId}`;
                document.querySelector('h1').textContent = `👨‍👩‍👧‍👦 ${familyName}`;
                
                // Parse items to get game IDs
                const items = xml.querySelectorAll('item');
                const gameIds = Array.from(items).map(item => item.getAttribute('id')).filter(id => id);
                
                if (gameIds.length === 0) {
                    document.getElementById('loadingDiv').style.display = 'none';
                    document.getElementById('errorDiv').style.display = 'block';
                    document.getElementById('errorDiv').textContent = 'No games found in this family.';
                    return;
                }
                
                document.getElementById('gameCount').textContent = `Found ${gameIds.length} games. Loading details...`;
                
                // Fetch details for all games in batches (20 at a time to avoid timeouts)
                allGames = [];
                const batchSize = 20;
                
                for (let i = 0; i < gameIds.length; i += batchSize) {
                    const batch = gameIds.slice(i, i + batchSize);
                    const idsStr = batch.join(',');
                    
                    try {
                        const detailsResponse = await fetch(`/api/bgg-helper?endpoint=thing&id=${idsStr}&stats=1`);
                        const detailsText = await detailsResponse.text();
                        const detailsXml = parser.parseFromString(detailsText, 'text/xml');
                        
                        // Check for parse errors
                        if (detailsXml.getElementsByTagName('parsererror').length > 0) {
                            console.error('Parse error in batch response');
                            continue;
                        }
                        
                        const gameItems = detailsXml.querySelectorAll('item');
                        gameItems.forEach(item => {
                            const id = item.getAttribute('id');
                            const name = item.querySelector('name[type="primary"]')?.getAttribute('value') || 
                                         item.querySelector('name:first-of-type')?.getAttribute('value') || 
                                         'Unknown Game';
                            const thumbnail = item.querySelector('thumbnail')?.textContent || '';
                            
                            // Get average rating
                            let rating = 'N/A';
                            const avgElement = item.querySelector('statistics > rating > average');
                            if (avgElement) {
                                const value = avgElement.getAttribute('value');
                                rating = value ? parseFloat(value).toFixed(1) : 'N/A';
                            }
                            
                            // Get BGG rank (boardgame subtype)
                            let rank = 'Unranked';
                            const rankElement = item.querySelector('statistics > ratings > rank[type="subtype"][value="boardgame"]');
                            if (rankElement) {
                                rank = rankElement.getAttribute('rank') || 'Unranked';
                            }
                            
                            allGames.push({
                                id,
                                name,
                                thumbnail,
                                rating,
                                rank
                            });
                        });
                    } catch (batchError) {
                        console.error(`Error loading batch ${Math.floor(i / batchSize) + 1}:`, batchError);
                    }
                    
                    // Small delay between batches
                    if (i + batchSize < gameIds.length) {
                        await new Promise(resolve => setTimeout(resolve, 100));
                    }
                }
                
                // Sort by rating (highest first), then alphabetically
                allGames.sort((a, b) => {
                    const ratingA = parseFloat(a.rating) || 0;
                    const ratingB = parseFloat(b.rating) || 0;
                    
                    if (ratingB !== ratingA) {
                        return ratingB - ratingA;
                    }
                    return a.name.localeCompare(b.name);
                });
                
                filteredGames = [...allGames];
                displayGames();
                document.getElementById('gameCount').textContent = `Showing ${filteredGames.length} games`;
                document.getElementById('loadingDiv').style.display = 'none';
                
            } catch (error) {
                console.error('Error loading family games:', error);
                document.getElementById('loadingDiv').style.display = 'none';
                document.getElementById('errorDiv').style.display = 'block';
                document.getElementById('errorDiv').textContent = `Error: ${error.message}`;
            }
        }

        function displayGames() {
            const gameList = document.getElementById('gameList');
            gameList.innerHTML = '';
            
            filteredGames.forEach(game => {
                const gameCard = document.createElement('div');
                gameCard.className = 'game-card';
                gameCard.setAttribute('data-game-id', game.id);
                
                const thumbnailHtml = game.thumbnail ? 
                    `<img src="${game.thumbnail}" alt="${game.name}" class="game-thumbnail" onerror="this.style.display='none';">` :
                    '';
                
                gameCard.innerHTML = `
                    <div class="game-thumbnail-container">
                        ${thumbnailHtml}
                    </div>
                    <div class="game-info">
                        <div class="game-title">${game.name}</div>
                        <div class="game-details">
                            <span class="game-rating">⭐ ${game.rating}</span> | <span class="game-rank">Rank: ${game.rank}</span><br>
                            BGG ID: ${game.id}
                        </div>
                    </div>
                `;
                
                // Make card clickable to open BGG page
                gameCard.addEventListener('click', () => {
                    window.open(`https://boardgamegeek.com/boardgame/${game.id}`, '_blank');
                });
                
                gameList.appendChild(gameCard);
            });
        }

        function updateGameCount() {
            const count = filteredGames.length;
            const total = allGames.length;
            document.getElementById('gameCount').textContent = 
                `Showing ${count} of ${total} games`;
        }

        // Search functionality
        document.getElementById('searchInput')?.addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase().trim();
            
            if (searchTerm === '') {
                filteredGames = [...allGames];
            } else {
                filteredGames = allGames.filter(game => 
                    game.name.toLowerCase().includes(searchTerm)
                );
            }
            
            displayGames();
            updateGameCount();
        });

        // Load button event listener
        document.getElementById('loadBtn').addEventListener('click', loadFamilyGames);
        
        // Allow Enter key to load
        document.getElementById('familyIdInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loadFamilyGames();
            }
        });

        // Load default family on page load
        window.addEventListener('load', () => {
            loadFamilyGames();
        });
    </script>
</body>
</html>
