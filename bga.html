<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BGG Board Game Arena - Live</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f7f7fa;
            color: #222;
        }
        .container {
            max-width: 430px;
            margin: 0 auto;
            padding: 2em 1em 1em 1em;
            padding-top: calc(2em + env(safe-area-inset-top));
            padding-bottom: calc(1em + env(safe-area-inset-bottom));
            box-sizing: border-box;
            min-height: 100vh;
        }
        h1 {
            font-size: 1.7em;
            margin: 0 0 0.5em 0;
            text-align: center;
            color: #1976d2;
        }
        .status {
            background: #fff;
            border-radius: 8px;
            padding: 0.8em 1em;
            margin-bottom: 1em;
            font-size: 0.9em;
            color: #666;
            text-align: center;
            box-shadow: 0 2px 8px #0001;
        }
        .debug-panel {
            background: #1e1e1e;
            color: #d4d4d4;
            border-radius: 8px;
            padding: 0.8em;
            margin-bottom: 1em;
            font-family: 'Courier New', monospace;
            font-size: 0.8em;
            max-height: 120px;
            overflow-y: auto;
            border: 2px solid #007aff;
        }
        .log-info { color: #4ec9b0; padding: 0.1em 0; }
        .log-warn { color: #dcdcaa; padding: 0.1em 0; }
        .log-error { color: #f48771; padding: 0.1em 0; }
        .game-list {
            display: flex;
            flex-direction: column;
            gap: 0.8em;
        }
        .game-card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px #0001;
            overflow: hidden;
            display: flex;
            flex-direction: row;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 100px;
        }
        .game-card:active {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px #0002;
        }
        .game-thumbnail-container {
            flex-shrink: 0;
            width: 80px;
            height: 100px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
        }
        .game-thumbnail {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .game-info {
            flex: 1;
            padding: 0.8em 1em;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .game-title {
            font-size: 1em;
            font-weight: 600;
            margin: 0 0 0.3em 0;
            color: #222;
            line-height: 1.3;
            word-break: break-word;
        }
        .game-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8em;
            font-size: 0.85em;
            color: #666;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
        }
        .stat-label {
            font-size: 0.75em;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-value {
            font-size: 1em;
            font-weight: 600;
            color: #1976d2;
        }
        .loading-indicator {
            text-align: center;
            padding: 1em;
            color: #666;
            font-size: 0.9em;
        }
        .spinner {
            display: inline-block;
            width: 1em;
            height: 1em;
            border: 2px solid #f0f0f0;
            border-top: 2px solid #1976d2;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5em;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .back-button {
            background: #666;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.6em 1.2em;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 1em;
            min-height: 44px;
            -webkit-appearance: none;
            appearance: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-button">← Back</a>
        <h1>🎮 Board Game Arena</h1>
        
        <div class="status" id="status">Loading...</div>
        <div id="debugConsole" class="debug-panel"></div>
        
        <div id="gameList" class="game-list">
            <div class="loading-indicator"><span class="spinner"></span>Fetching games...</div>
        </div>
    </div>

    <script>
        const logs = [];
        const FAMILY_ID = 70360;
        const BATCH_SIZE = 5; // Smaller batch for faster display
        let allGames = [];
        let gameIds = [];
        let loadedCount = 0;

        function log(msg, type = 'info') {
            const ts = new Date().toLocaleTimeString();
            const entry = `[${ts}] ${msg}`;
            logs.push({ message: entry, type });
            
            if (type === 'error') console.error(entry);
            else if (type === 'warn') console.warn(entry);
            else console.log(entry);
            
            updateDebugPanel();
        }

        function updateDebugPanel() {
            const debugDiv = document.getElementById('debugConsole');
            if (debugDiv) {
                const lines = logs.slice(-8).map(l => `<div class="log-${l.type}">${l.message}</div>`).join('');
                debugDiv.innerHTML = lines;
                debugDiv.scrollTop = debugDiv.scrollHeight;
            }
        }

        function updateStatus() {
            const status = document.getElementById('status');
            if (gameIds.length > 0) {
                status.textContent = `Loaded ${loadedCount} of ${gameIds.length} games...`;
            } else {
                status.textContent = 'Fetching family data...';
            }
        }

        async function addGameCard(game) {
            const gameList = document.getElementById('gameList');
            
            // Remove loading indicator on first card
            if (loadedCount === 1) {
                gameList.innerHTML = '';
            }
            
            const card = document.createElement('div');
            card.className = 'game-card';
            card.innerHTML = `
                <div class="game-thumbnail-container">
                    ${game.thumbnail ? `<img src="${game.thumbnail}" alt="${game.name}" class="game-thumbnail" onerror="this.style.display='none';">` : ''}
                </div>
                <div class="game-info">
                    <div class="game-title">${game.name}</div>
                    <div class="game-stats">
                        <div class="stat-item">
                            <span class="stat-label">Rating</span>
                            <span class="stat-value">⭐ ${game.rating}</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Rank</span>
                            <span class="stat-value">#${game.rank}</span>
                        </div>
                    </div>
                </div>
            `;
            
            card.addEventListener('click', () => {
                window.open(`https://boardgamegeek.com/boardgame/${game.id}`, '_blank');
            });
            
            gameList.appendChild(card);
        }

        async function fetchGameDetails(ids) {
            try {
                const idsStr = ids.join(',');
                const response = await fetch(`/api/bgg-helper?endpoint=thing&id=${idsStr}&stats=1`);
                const text = await response.text();
                
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, 'text/xml');
                
                if (xml.getElementsByTagName('parsererror').length > 0) {
                    log(`Parse error in batch`, 'warn');
                    return [];
                }
                
                const items = xml.querySelectorAll('item');
                const results = [];
                
                items.forEach(item => {
                    const id = item.getAttribute('id');
                    const nameElem = item.querySelector('name[type="primary"]');
                    let name = nameElem ? nameElem.getAttribute('value') : null;
                    if (!name) {
                        const altName = item.querySelector('name');
                        name = altName ? (altName.getAttribute('value') || altName.textContent) : 'Unknown';
                    }
                    const thumbnail = item.querySelector('thumbnail')?.textContent || '';
                    
                    // Extract rating stats
                    let rating = 'N/A';
                    const avgElement = item.querySelector('statistics > rating > average');
                    if (avgElement) {
                        const val = avgElement.getAttribute('value');
                        rating = val ? parseFloat(val).toFixed(1) : 'N/A';
                    }
                    
                    // Extract rank
                    let rank = 'Unranked';
                    const rankElement = item.querySelector('statistics > ratings > rank[type="subtype"][value="boardgame"]');
                    if (rankElement) {
                        rank = rankElement.getAttribute('rank') || 'Unranked';
                    }
                    
                    results.push({ id, name, thumbnail, rating, rank });
                });
                
                return results;
            } catch (error) {
                log(`Batch fetch error: ${error.message}`, 'error');
                return [];
            }
        }

        async function loadGames() {
            try {
                log('Fetching family data...');
                const response = await fetch(`/api/bgg-helper?endpoint=family&id=${FAMILY_ID}`);
                const text = await response.text();
                
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, 'text/xml');
                
                if (xml.getElementsByTagName('parsererror').length > 0) {
                    throw new Error('XML parse error');
                }
                
                // Extract links from family item
                const familyItem = xml.querySelector('item[type="boardgamefamily"]');
                if (!familyItem) throw new Error('No family item found');
                
                const familyName = familyItem.querySelector('name')?.getAttribute('value') || 'Board Game Arena';
                document.querySelector('h1').textContent = `🎮 ${familyName}`;
                
                const links = familyItem.querySelectorAll('link[type="boardgamefamily"]');
                gameIds = Array.from(links).map(link => link.getAttribute('id')).filter(id => id);
                
                log(`Found ${gameIds.length} games`);
                updateStatus();
                
                // Fetch and display games in batches
                for (let i = 0; i < gameIds.length; i += BATCH_SIZE) {
                    const batch = gameIds.slice(i, i + BATCH_SIZE);
                    log(`Batch ${Math.floor(i / BATCH_SIZE) + 1}: Fetching ${batch.length} games...`);
                    
                    const games = await fetchGameDetails(batch);
                    for (const game of games) {
                        allGames.push(game);
                        loadedCount++;
                        await addGameCard(game);
                        updateStatus();
                    }
                    
                    // Small delay between batches
                    if (i + BATCH_SIZE < gameIds.length) {
                        await new Promise(resolve => setTimeout(resolve, 300));
                    }
                }
                
                log(`✅ Loaded all ${loadedCount} games`);
                document.getElementById('status').textContent = `${loadedCount} games loaded`;
                
            } catch (error) {
                log(`ERROR: ${error.message}`, 'error');
                document.getElementById('status').textContent = `Error: ${error.message}`;
            }
        }

        window.addEventListener('load', () => {
            log('Page loaded');
            loadGames();
        });
    </script>
</body>
</html>
