<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Board Game Arena - BGG Collection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
    }

    .game-card {
      transition: all 0.2s ease;
    }

    .game-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
    }

    .skeleton {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }

    .rank-badge {
      transition: all 0.2s ease;
    }
  </style>
</head>
<body class="pb-20">

  <header class="sticky top-0 z-30 w-full bg-white/80 backdrop-blur-md border-b px-4 py-4 shadow-sm">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-blue-600 text-white p-2 rounded-lg">
          <i class="fa-solid fa-gamepad"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">Board Game Arena</h1>
          <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">BGG Collection</p>
        </div>
      </div>
      <div id="statsBox" class="text-right">
        <div class="text-2xl font-bold text-blue-600" id="gameCount">0</div>
        <div class="text-[10px] text-slate-500 uppercase font-bold">Games</div>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6">
    
    <!-- Loading Section -->
    <div id="loadingSection">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
        <div class="flex items-center justify-center gap-3 mb-4">
          <i class="fa-solid fa-circle-notch fa-spin text-blue-600 text-2xl"></i>
          <span class="font-bold text-slate-700">Loading Board Game Arena games...</span>
        </div>
        <div class="text-sm text-slate-500 text-center" id="loadingStatus">Fetching family...</div>
        <div class="mt-4 bg-slate-100 rounded-full h-2 overflow-hidden">
          <div id="progressBar" class="bg-blue-600 h-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- Stats Cards -->
    <div id="statsSection" class="hidden grid grid-cols-2 sm:grid-cols-4 gap-4">
      <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-4">
        <div class="text-xs font-bold text-slate-500 uppercase mb-1">Top 100</div>
        <div class="text-2xl font-bold text-green-600" id="top100">0</div>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-4">
        <div class="text-xs font-bold text-slate-500 uppercase mb-1">Top 500</div>
        <div class="text-2xl font-bold text-blue-600" id="top500">0</div>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-4">
        <div class="text-xs font-bold text-slate-500 uppercase mb-1">Top 1K</div>
        <div class="text-2xl font-bold text-purple-600" id="top1k">0</div>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-4">
        <div class="text-xs font-bold text-slate-500 uppercase mb-1">Avg Rating</div>
        <div class="text-2xl font-bold text-amber-600" id="avgRating">0</div>
      </div>
    </div>

    <!-- Filters and Sort -->
    <div id="controlsSection" class="hidden bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
      <div class="flex flex-col sm:flex-row gap-3">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search games..." 
          oninput="filterGames()"
          class="flex-1 px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none transition-all"
        >
        <select 
          id="sortSelect" 
          onchange="sortGames()" 
          class="px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none transition-all bg-white font-medium text-sm"
        >
          <option value="rank-asc">Rank: Best to Worst</option>
          <option value="rank-desc">Rank: Worst to Best</option>
          <option value="name">Name: A-Z</option>
          <option value="rating-desc">Rating: High to Low</option>
          <option value="rating-asc">Rating: Low to High</option>
        </select>
      </div>
    </div>

    <!-- Games List -->
    <div id="gamesSection" class="hidden space-y-3">
      <!-- Games will be populated here -->
    </div>

  </main>

<script>
const FAMILY_ID = 70360; // Board Game Arena family ID
let allGames = [];
let displayedGames = [];
let isLoading = false;

async function fetchCollection() {
  const loadingSection = document.getElementById('loadingSection');
  const controlsSection = document.getElementById('controlsSection');
  const gamesSection = document.getElementById('gamesSection');
  const statsSection = document.getElementById('statsSection');
  
  try {
    isLoading = true;
    
    // Fetch family to get game IDs
    updateLoadingStatus('Fetching Board Game Arena family...');
    const familyXml = await fetchAPI('family', FAMILY_ID.toString());
    const doc = new DOMParser().parseFromString(familyXml, 'text/xml');
    const familyItem = doc.querySelector('item[type="boardgamefamily"]');
    
    if (!familyItem) throw new Error('Family not found');
    
    const links = familyItem.querySelectorAll('link[type="boardgamefamily"]');
    const gameIds = Array.from(links)
      .map(link => link.getAttribute('id'))
      .filter(id => id);
    
    updateLoadingStatus(`Found ${gameIds.length} games. Loading details...`);
    document.getElementById('gameCount').textContent = gameIds.length;
    
    // Initialize games array
    allGames = gameIds.map(id => ({
      objectid: id,
      name: '',
      thumb: '',
      rating: 0,
      rank: 999999,
      loaded: false
    }));
    
    // Show UI
    controlsSection.classList.remove('hidden');
    gamesSection.classList.remove('hidden');
    statsSection.classList.remove('hidden');
    displayedGames = [...allGames];
    renderGames();
    
    // Fetch game details in batches with 10x parallel processing
    const batchSize = 20;
    const parallelBatches = 10;
    const batches = [];
    for (let i = 0; i < gameIds.length; i += batchSize) {
      batches.push(gameIds.slice(i, i + batchSize));
    }
    
    // Process batches in parallel groups
    for (let i = 0; i < batches.length; i += parallelBatches) {
      const batchGroup = batches.slice(i, i + parallelBatches);
      updateLoadingStatus(`Loading details ${Math.min(i + parallelBatches, batches.length)}/${batches.length}...`);
      updateProgress((Math.min(i + parallelBatches, batches.length) / batches.length) * 100);
      
      await Promise.all(batchGroup.map(async (batch) => {
        const ids = batch.join(',');
        
        try {
          const thingXml = await fetchAPI('thing', ids, '&stats=1');
          const thingDoc = new DOMParser().parseFromString(thingXml, 'text/xml');
          const thingItems = Array.from(thingDoc.querySelectorAll('item'));
          
          thingItems.forEach(thingItem => {
            const id = thingItem.getAttribute('id');
            const game = allGames.find(g => g.objectid === id);
            if (!game) return;
            
            // Get name
            const nameElem = thingItem.querySelector('name[type="primary"]');
            game.name = nameElem ? nameElem.getAttribute('value') : 'Unknown';
            
            // Get thumbnail
            game.thumb = thingItem.querySelector('thumbnail')?.textContent || '';
            
            // Get rating
            const avgElement = thingItem.querySelector('statistics ratings average');
            if (avgElement) {
              game.rating = parseFloat(avgElement.getAttribute('value') || '0');
            }
            
            // Get rank
            const rankElement = thingItem.querySelector('statistics ratings ranks rank[name="boardgame"]');
            if (rankElement) {
              const rankValue = rankElement.getAttribute('value');
              if (rankValue && rankValue !== 'Not Ranked') {
                game.rank = parseInt(rankValue);
              }
            }
            
            game.loaded = true;
          });
          
        } catch (e) {
          console.error('Batch error:', e);
        }
      }));
      
      // Update display after each parallel group
      updateStats();
      sortGames();
      
      await wait(500);
    }
    
    updateLoadingStatus('Complete!');
    updateProgress(100);
    isLoading = false;
    
    // Hide loading indicator
    setTimeout(() => {
      loadingSection.classList.add('hidden');
    }, 500);
    
  } catch (e) {
    console.error(e);
    alert('Failed to fetch games. Please try again.');
    loadingSection.classList.add('hidden');
  }
}

function updateLoadingStatus(msg) {
  document.getElementById('loadingStatus').textContent = msg;
}

function updateProgress(percent) {
  document.getElementById('progressBar').style.width = percent + '%';
}

function updateStats() {
  const top100 = allGames.filter(g => g.rank <= 100 && g.rank > 0).length;
  const top500 = allGames.filter(g => g.rank <= 500 && g.rank > 0).length;
  const top1k = allGames.filter(g => g.rank <= 1000 && g.rank > 0).length;
  
  const ratedGames = allGames.filter(g => g.rating > 0);
  const avgRating = ratedGames.length > 0 
    ? (ratedGames.reduce((sum, g) => sum + g.rating, 0) / ratedGames.length).toFixed(1)
    : '0';
  
  document.getElementById('top100').textContent = top100;
  document.getElementById('top500').textContent = top500;
  document.getElementById('top1k').textContent = top1k;
  document.getElementById('avgRating').textContent = avgRating;
}

function filterGames() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  displayedGames = allGames.filter(game => game.name.toLowerCase().includes(search));
  sortGames();
}

function sortGames() {
  const sortBy = document.getElementById('sortSelect').value;
  
  if (sortBy === 'rank-asc') {
    displayedGames.sort((a, b) => a.rank - b.rank);
  } else if (sortBy === 'rank-desc') {
    displayedGames.sort((a, b) => b.rank - a.rank);
  } else if (sortBy === 'name') {
    displayedGames.sort((a, b) => a.name.localeCompare(b.name));
  } else if (sortBy === 'rating-desc') {
    displayedGames.sort((a, b) => b.rating - a.rating);
  } else if (sortBy === 'rating-asc') {
    displayedGames.sort((a, b) => a.rating - b.rating);
  }
  
  renderGames();
}

function renderGames() {
  const container = document.getElementById('gamesSection');
  container.innerHTML = '';
  
  displayedGames.forEach(game => {
    const card = document.createElement('div');
    card.className = 'game-card bg-white rounded-xl shadow-sm border border-slate-100 p-4 cursor-pointer';
    card.onclick = () => window.open(`https://boardgamegeek.com/boardgame/${game.objectid}`, '_blank');
    
    const isLoaded = game.loaded || !isLoading;
    const rankColor = game.rank <= 100 ? 'bg-green-100 text-green-700 border-green-200' :
                      game.rank <= 500 ? 'bg-blue-100 text-blue-700 border-blue-200' :
                      game.rank <= 1000 ? 'bg-purple-100 text-purple-700 border-purple-200' :
                      'bg-slate-100 text-slate-600 border-slate-200';
    
    card.innerHTML = `
      <div class="flex gap-4">
        <img 
          src="/api/image-proxy?url=${encodeURIComponent(game.thumb)}" 
          alt="${game.name}"
          class="w-20 h-20 rounded-lg object-cover bg-slate-200 flex-shrink-0"
          onerror="this.style.display='none'"
        >
        <div class="flex-1 min-w-0">
          <h3 class="font-bold text-slate-900 mb-2">${game.name || '...'}</h3>
          <div class="flex flex-wrap gap-2">
            ${isLoaded ? `
              <div class="rank-badge ${rankColor} px-2 py-1 rounded text-xs font-bold border">
                ${game.rank < 999999 ? '#' + game.rank : 'Unranked'}
              </div>
              ${game.rating > 0 ? `
                <div class="bg-amber-50 border border-amber-200 text-amber-700 px-2 py-1 rounded text-xs font-bold">
                  ⭐ ${game.rating.toFixed(1)}
                </div>
              ` : ''}
            ` : `
              <div class="skeleton bg-slate-200 h-6 w-16 rounded"></div>
              <div class="skeleton bg-slate-200 h-6 w-20 rounded"></div>
            `}
          </div>
        </div>
      </div>
    `;
    
    container.appendChild(card);
  });
}

async function fetchAPI(endpoint, id, queryParams = '') {
  let url = `/api/bgg-helper?endpoint=${endpoint}&id=${encodeURIComponent(id)}${queryParams}`;
  for (let attempt = 0; attempt < 5; attempt++) {
    let res;
    try {
      res = await fetch(url);
    } catch (e) {
      await wait(1500 * Math.pow(2, attempt));
      continue;
    }
    if (res.status === 202) {
      await wait(3000);
      continue;
    }
    if (res.ok) {
      return await res.text();
    }
    await wait(2000);
  }
  throw new Error('Failed to fetch from BGG API');
}

function wait(ms) {
  return new Promise(r => setTimeout(r, ms));
}

// Auto-start loading
window.addEventListener('load', () => {
  fetchCollection();
});
</script>
<!-- Vercel Web Analytics -->
<script type="module" src="analytics-init.js"></script>
</body>
</html>
