<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Designer Matrix</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='76' font-size='72'%3E✏️%3C/text%3E%3C/svg%3E">
  <style>
    :root{
      --bg:#08111f;--panel:#0f1b2d;--panel2:#142238;--panel3:#192a44;--line:#263955;
      --text:#edf4ff;--muted:#8fa4c2;--dim:#647894;--accent:#65a8ff;--accent2:#8b7cff;
      --good:#45d6a2;--bad:#ff6b7a;--shadow:0 20px 60px rgba(0,0,0,.32);
      --radius:18px;--game-col:320px
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#07101d 0%,#0a1322 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{overflow-x:hidden}
    button,input,select{font:inherit}
    button{cursor:pointer}
    .topbar{
      position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
      padding:12px 16px;background:rgba(8,17,31,.92);backdrop-filter:blur(18px);
      border-bottom:1px solid rgba(255,255,255,.07)
    }
    .title{font-weight:900;letter-spacing:-.04em;font-size:18px;white-space:nowrap;margin-right:4px}
    .username-wrap{display:flex;gap:8px;min-width:min(100%,420px);flex:1;max-width:560px}
    .control{
      border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;
      min-height:42px;padding:0 12px;outline:none
    }
    .control:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(101,168,255,.12)}
    #username{flex:1;min-width:150px}
    .btn{border:1px solid transparent;border-radius:12px;min-height:42px;padding:0 15px;font-weight:800;color:white;background:linear-gradient(135deg,var(--accent),var(--accent2))}
    .btn.secondary{background:var(--panel2);border-color:var(--line);color:var(--text)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .history-select{max-width:210px}
    main{padding:14px 16px 36px}
    .status-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;color:var(--muted);font-size:13px}
    .status-pill{padding:6px 9px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.025)}
    .status-pill.good{color:#b9f7df;border-color:rgba(69,214,162,.28);background:rgba(69,214,162,.08)}
    .status-pill.bad{color:#ffd0d5;border-color:rgba(255,107,122,.28);background:rgba(255,107,122,.08)}
    .summary{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:10px;margin-bottom:12px}
    .metric{background:linear-gradient(180deg,rgba(20,34,56,.96),rgba(14,26,44,.96));border:1px solid var(--line);border-radius:16px;padding:13px 14px;box-shadow:var(--shadow)}
    .metric strong{display:block;font-size:25px;line-height:1;font-weight:950;letter-spacing:-.05em}
    .metric span{display:block;color:var(--muted);font-size:11px;margin-top:6px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
    .toolbar{
      display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px;
      background:rgba(15,27,45,.96);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0
    }
    .search{flex:1;min-width:220px}
    .toolbar-note{color:var(--dim);font-size:12px;margin-left:auto}
    .table-shell{
      position:relative;border:1px solid var(--line);border-radius:0 0 18px 18px;overflow:auto;
      background:rgba(10,19,34,.96);box-shadow:var(--shadow);height:calc(100vh - 250px);min-height:440px
    }
    table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:13px}
    th,td{border-right:1px solid rgba(255,255,255,.055);border-bottom:1px solid rgba(255,255,255,.055);padding:9px 11px;vertical-align:middle;background:#0b1728}
    thead th{position:sticky;top:0;z-index:22;background:#13233a;color:#b9c9df;text-align:left;min-width:170px}
    thead tr.filters th{top:43px;background:#102039;padding:7px;z-index:21}
    thead th.sortable{cursor:pointer;user-select:none}
    thead th.sortable:hover{background:#182b47}
    .sortmark{color:var(--accent);font-size:11px;margin-left:6px}
    .game-head,.game-cell{
      position:sticky;left:0;z-index:30;min-width:var(--game-col);width:var(--game-col);max-width:var(--game-col);
      box-shadow:8px 0 18px rgba(0,0,0,.16)
    }
    thead .game-head{z-index:40;background:#172943}
    thead tr.filters .game-head{z-index:39;background:#142640}
    tbody .game-cell{background:#0f1d31}
    tbody tr:hover td{background:#11213a}
    tbody tr:hover .game-cell{background:#142640}
    .filter-input{width:100%;height:32px;border-radius:9px;border:1px solid #2a4264;background:#0b182a;color:var(--text);padding:0 9px;outline:none;font-size:12px}
    .filter-input:focus{border-color:var(--accent)}
    .game-wrap{display:grid;grid-template-columns:54px minmax(0,1fr);align-items:center;gap:10px}
    .thumb{width:54px;height:54px;border-radius:10px;object-fit:cover;background:#172842;border:1px solid #29415f}
    .game-name{font-weight:850;white-space:normal;line-height:1.22}
    .game-name a{color:var(--text);text-decoration:none}
    .game-name a:hover{color:#fff;text-decoration:underline}
    .game-meta{color:var(--dim);font-size:11px;margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .meta-item{white-space:nowrap}
    .meta-sort{color:#a9c8ef;cursor:pointer;font-weight:750}
    .meta-sort:hover{color:#fff;text-decoration:underline}
    .save-btn{border:1px solid #355071;background:#13243c;color:#8fa4c2;border-radius:8px;width:30px;height:30px;padding:0;display:grid;place-items:center;font-size:17px;line-height:1;flex:0 0 auto}
    .save-btn.saved{color:#ffd166;border-color:#7d6731;background:#2b2617}
    .saved-toggle.active{border-color:#7d6731;color:#ffd166;background:#2b2617}
    .designer-cell{white-space:normal;line-height:1.25;color:#d7e4f5}
    .designer-link{color:#d7e4f5;text-decoration:none}
    .designer-link:hover{color:white;text-decoration:underline}
    .empty{padding:42px!important;text-align:center;color:var(--muted)}
    .loading-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite alternate}
    @keyframes pulse{from{opacity:.35;transform:scale(.8)}to{opacity:1;transform:scale(1.15)}}
    .progress{height:4px;background:#101e31;overflow:hidden}
    .progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s}
    @media(max-width:800px){
      :root{--game-col:245px}
      main{padding:10px 8px 24px}
      .topbar{padding:10px 8px}
      .title{width:100%}
      .history-select{max-width:none;flex:1}
      .summary{grid-template-columns:repeat(2,1fr)}
      .table-shell{height:calc(100vh - 330px)}
      .game-wrap{grid-template-columns:44px minmax(0,1fr)}
      .thumb{width:44px;height:44px}
      th,td{padding:8px 9px}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="title">Designer Matrix</div>
    <div class="username-wrap">
      <input id="username" class="control" value="sportomax" autocomplete="off" spellcheck="false" placeholder="BGG username">
      <button id="loadBtn" class="btn">Load</button>
    </div>
    <select id="historySelect" class="control history-select" title="Indexed history">
      <option value="">Indexed history</option>
    </select>
    <button id="refreshBtn" class="btn secondary" title="Ignore cached history and reload from BGG">Refresh BGG</button>
    <button id="savedBtn" class="btn secondary saved-toggle" title="Show only games saved in this browser">★ Saved <span id="savedCount">0</span></button>
    <button id="clearBtn" class="btn secondary" title="Clear all table filters">Clear Filters</button>
  </header>
  <div class="progress"><div id="progressBar"></div></div>

  <main>
    <div class="status-row">
      <span id="status" class="status-pill">Ready</span>
      <span id="cacheStatus" class="status-pill">IndexedDB cache enabled</span>
    </div>

    <section class="summary">
      <div class="metric"><strong id="gameCount">0</strong><span>Games</span></div>
      <div class="metric"><strong id="designerCount">0</strong><span>Unique Designers</span></div>
      <div class="metric"><strong id="maxDesignerCount">0</strong><span>Max Designers / Game</span></div>
      <div class="metric"><strong id="visibleCount">0</strong><span>Visible Rows</span></div>
    </section>

    <section class="toolbar">
      <input id="globalSearch" class="control search" placeholder="Search game name, BGG ID, year, or any designer…">
      <select id="pageSize" class="control" title="Rows rendered">
        <option value="100">100 rows</option>
        <option value="250">250 rows</option>
        <option value="500">500 rows</option>
        <option value="99999" selected>All rows</option>
      </select>
      <div id="tableNote" class="toolbar-note">Load a collection to build the designer matrix.</div>
    </section>

    <div class="table-shell" id="tableShell">
      <table>
        <thead id="thead">
          <tr><th class="game-head">Game</th><th>Designer 1</th></tr>
          <tr class="filters"><th class="game-head"></th><th></th></tr>
        </thead>
        <tbody id="tbody"><tr><td class="empty" colspan="2">Enter a BGG username and click Load.</td></tr></tbody>
      </table>
    </div>
  </main>

<script>
(() => {
  'use strict';
  const API = '/api/bgg-helper';
  const THING_BATCH = 20;
  const WORKERS = 100;
  const DB_NAME = 'designerMatrixDB';
  const DB_VERSION = 2;
  const STORE = 'runs';
  const SAVED_KEY = 'designerMatrix.savedGames.v1';

  const state = {
    rows: [],
    filtered: [],
    username: '',
    maxDesigners: 1,
    sortKey: 'name',
    sortDir: 1,
    columnFilters: {},
    forceRefresh: false,
    savedOnly: false,
    saved: loadSaved()
  };

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const norm = s => String(s ?? '').trim().toLowerCase();

  function loadSaved(){
    try{
      const raw=JSON.parse(localStorage.getItem(SAVED_KEY)||'[]');
      return new Set(Array.isArray(raw)?raw.map(String):[]);
    }catch{return new Set();}
  }
  function persistSaved(){
    localStorage.setItem(SAVED_KEY,JSON.stringify([...state.saved]));
    updateSavedUi();
  }
  function updateSavedUi(){
    const n=state.saved.size;
    $('savedCount').textContent=n.toLocaleString();
    $('savedBtn').classList.toggle('active',state.savedOnly);
  }
  function toggleSaved(id){
    id=String(id);
    if(state.saved.has(id)) state.saved.delete(id); else state.saved.add(id);
    persistSaved();
    filterAndRender();
  }

  function setStatus(text, type=''){
    const el = $('status');
    el.textContent = text;
    el.className = 'status-pill' + (type ? ' ' + type : '');
  }
  function setProgress(pct){ $('progressBar').style.width = Math.max(0, Math.min(100, pct)) + '%'; }

  function openDb(){
    return new Promise((resolve,reject)=>{
      const req=indexedDB.open(DB_NAME,DB_VERSION);
      req.onupgradeneeded=()=>{ const db=req.result; if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE,{keyPath:'username'}); };
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error);
    });
  }
  async function dbGet(username){
    const db=await openDb();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(STORE,'readonly'), req=tx.objectStore(STORE).get(norm(username));
      req.onsuccess=()=>resolve(req.result||null); req.onerror=()=>reject(req.error);
    });
  }
  async function dbPut(run){
    const db=await openDb();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(STORE,'readwrite');
      tx.objectStore(STORE).put(run);
      tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error);
    });
  }
  async function dbAll(){
    const db=await openDb();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(STORE,'readonly'), req=tx.objectStore(STORE).getAll();
      req.onsuccess=()=>resolve(req.result||[]); req.onerror=()=>reject(req.error);
    });
  }

  async function refreshHistory(){
    try{
      const runs=(await dbAll()).sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));
      $('historySelect').innerHTML='<option value="">Indexed history</option>'+runs.map(r=>{
        const d=r.savedAt?new Date(r.savedAt).toLocaleDateString():'';
        return '<option value="'+esc(r.username)+'">'+esc(r.username)+' · '+r.rows.length+' games · '+esc(d)+'</option>';
      }).join('');
    }catch(e){
      $('cacheStatus').textContent='IndexedDB unavailable';
      $('cacheStatus').className='status-pill bad';
    }
  }

  async function fetchXml(params, label){
    const url = API + '?' + new URLSearchParams(params);
    const res = await fetch(url,{cache:'no-store'});
    const text = await res.text();
    if(!res.ok) throw new Error(label+' failed ('+res.status+')');
    if(text.trim().startsWith('{')) throw new Error(label+' returned JSON instead of BGG XML');
    const doc=new DOMParser().parseFromString(text,'text/xml');
    if(doc.querySelector('parsererror')) throw new Error(label+' returned invalid XML');
    return doc;
  }

  function parseCollection(doc){
    return [...doc.querySelectorAll('item[objectid]')].map(item=>{
      const statsEl=item.querySelector('stats');
      const ratingEl=statsEl?.querySelector('rating');
      const bggRaw=ratingEl?.querySelector('average')?.getAttribute('value')||'';
      const rankRaw=ratingEl?.querySelector('ranks rank[name="boardgame"]')?.getAttribute('value')||'';
      const bggAvg=(bggRaw && bggRaw!=='N/A')?parseFloat(bggRaw):null;
      const rankParsed=parseInt(rankRaw,10);
      return {
        id:item.getAttribute('objectid')||'',
        name:item.querySelector('name')?.textContent?.trim()||('BGG #'+item.getAttribute('objectid')),
        year:item.querySelector('yearpublished')?.textContent?.trim()||'',
        thumbnail:item.querySelector('thumbnail')?.textContent?.trim()||'',
        rating:Number.isFinite(bggAvg)?bggAvg:null,
        rank:Number.isFinite(rankParsed)?rankParsed:null
      };
    });
  }

  function parseThing(doc){
    const map=new Map();
    [...doc.querySelectorAll('item[id]')].forEach(item=>{
      const id=item.getAttribute('id');
      const primary=item.querySelector('name[type="primary"]');
      const designers=[...item.querySelectorAll('link[type="boardgamedesigner"]')].map(x=>({
        id:x.getAttribute('id')||'',
        name:x.getAttribute('value')||''
      })).filter(x=>x.name);
      const ratingRaw=item.querySelector('statistics ratings average')?.getAttribute('value')||'';
      const rankNode=[...item.querySelectorAll('statistics ratings ranks rank')].find(r=>r.getAttribute('name')==='boardgame');
      const rankRaw=rankNode?.getAttribute('value')||'';
      map.set(id,{
        id,
        name:primary?.getAttribute('value')||'',
        year:item.querySelector('yearpublished')?.getAttribute('value')||'',
        thumbnail:item.querySelector('thumbnail')?.textContent?.trim()||'',
        rating:Number.isFinite(Number(ratingRaw))?Number(ratingRaw):null,
        rank:/^\d+$/.test(rankRaw)?Number(rankRaw):null,
        designers
      });
    });
    return map;
  }

  function chunk(arr,size){ const out=[]; for(let i=0;i<arr.length;i+=size) out.push(arr.slice(i,i+size)); return out; }

  async function mapLimit(items,limit,fn){
    let next=0;
    const out=new Array(items.length);
    async function worker(){
      while(true){
        const i=next++;
        if(i>=items.length) return;
        out[i]=await fn(items[i],i);
      }
    }
    await Promise.all(Array.from({length:Math.min(limit,items.length)},worker));
    return out;
  }

  async function loadFresh(username){
    setStatus('Loading collection…');
    setProgress(3);
    const collectionDoc=await fetchXml({endpoint:'collection',username,stats:'1'},'Collection');
    const base=parseCollection(collectionDoc);
    if(!base.length) throw new Error('No collection games returned for '+username);

    const batches=chunk(base.map(x=>x.id),THING_BATCH);
    let completed=0;
    const maps=await mapLimit(batches,WORKERS,async ids=>{
      let lastErr;
      for(let attempt=1;attempt<=3;attempt++){
        try{
          const doc=await fetchXml({endpoint:'thing',id:ids.join(','),stats:'1'},'Thing batch');
          completed++;
          setStatus('Loading designer metadata… '+completed+'/'+batches.length);
          setProgress(5 + (completed/batches.length)*90);
          return parseThing(doc);
        }catch(e){
          lastErr=e;
          await new Promise(r=>setTimeout(r,350*attempt));
        }
      }
      throw lastErr;
    });

    const details=new Map();
    maps.forEach(m=>m.forEach((v,k)=>details.set(k,v)));
    const rows=base.map(g=>{
      const d=details.get(g.id)||{};
      return {
        id:g.id,
        name:d.name||g.name,
        year:d.year||g.year,
        thumbnail:d.thumbnail||g.thumbnail,
        rating:d.rating??g.rating??null,
        rank:d.rank??g.rank??null,
        designers:Array.isArray(d.designers)?d.designers:[]
      };
    });
    await dbPut({username:norm(username),displayUsername:username,rows,savedAt:Date.now()});
    await refreshHistory();
    setProgress(100);
    return rows;
  }

  function applyRows(rows,username,source){
    state.rows=rows||[];
    state.username=username;
    state.maxDesigners=Math.max(1,...state.rows.map(r=>r.designers?.length||0));
    state.columnFilters={};
    $('globalSearch').value='';
    $('gameCount').textContent=state.rows.length.toLocaleString();
    const pubs=new Set(state.rows.flatMap(r=>(r.designers||[]).map(p=>p.name)));
    $('designerCount').textContent=pubs.size.toLocaleString();
    $('maxDesignerCount').textContent=state.maxDesigners;
    buildHead();
    filterAndRender();
    $('tableNote').textContent=state.rows.length.toLocaleString()+' games · '+pubs.size.toLocaleString()+' unique designers · '+source;
  }

  function buildHead(){
    const cols=['Game',...Array.from({length:state.maxDesigners},(_,i)=>'Designer '+(i+1))];
    $('thead').innerHTML =
      '<tr>'+cols.map((label,i)=>{
        const key=i===0?'name':'pub'+i;
        return '<th class="'+(i===0?'game-head ':'')+'sortable" data-sort="'+key+'">'+esc(label)+'<span class="sortmark" id="sort-'+key+'"></span></th>';
      }).join('')+'</tr>'+
      '<tr class="filters">'+cols.map((label,i)=>{
        const key=i===0?'game':'pub'+i;
        return '<th class="'+(i===0?'game-head':'')+'"><input class="filter-input" data-filter="'+key+'" placeholder="'+(i===0?'Filter games…':'Filter '+esc(label)+'…')+'"></th>';
      }).join('')+'</tr>';

    $('thead').querySelectorAll('[data-sort]').forEach(th=>th.addEventListener('click',()=>{
      const key=th.dataset.sort;
      if(state.sortKey===key) state.sortDir*=-1; else {state.sortKey=key;state.sortDir=1;}
      filterAndRender();
    }));
    $('thead').querySelectorAll('[data-filter]').forEach(inp=>inp.addEventListener('input',()=>{
      state.columnFilters[inp.dataset.filter]=inp.value;
      filterAndRender();
    }));
  }

  function valueForSort(row,key){
    if(key==='name') return norm(row.name);
    if(key==='year') return Number(row.year)||0;
    if(key==='rank') return Number(row.rank)||Number.MAX_SAFE_INTEGER;
    if(key==='rating') return Number(row.rating)||0;
    if(key.startsWith('pub')){
      const idx=Number(key.slice(3))-1;
      return norm(row.designers?.[idx]?.name||'');
    }
    return '';
  }

  function filterAndRender(){
    const global=norm($('globalSearch').value);
    let rows=state.rows.filter(row=>{
      const pubs=row.designers||[];
      const hay=[row.name,row.id,row.year,row.rank,row.rating,...pubs.map(p=>p.name)].join(' ').toLowerCase();
      if(state.savedOnly && !state.saved.has(String(row.id))) return false;
      if(global && !hay.includes(global)) return false;
      for(const [key,raw] of Object.entries(state.columnFilters)){
        const q=norm(raw); if(!q) continue;
        if(key==='game'){
          if(!norm(row.name+' '+row.id+' '+row.year).includes(q)) return false;
        }else if(key.startsWith('pub')){
          const idx=Number(key.slice(3))-1;
          if(!norm(pubs[idx]?.name||'').includes(q)) return false;
        }
      }
      return true;
    });

    rows.sort((a,b)=>{
      const av=valueForSort(a,state.sortKey), bv=valueForSort(b,state.sortKey);
      if(typeof av==='number' && typeof bv==='number') return (av-bv)*state.sortDir;
      return String(av).localeCompare(String(bv),undefined,{numeric:true,sensitivity:'base'})*state.sortDir;
    });

    state.filtered=rows;
    $('visibleCount').textContent=rows.length.toLocaleString();
    document.querySelectorAll('.sortmark').forEach(el=>el.textContent='');
    const mark=$('sort-'+state.sortKey); if(mark) mark.textContent=state.sortDir===1?'▲':'▼';

    const limit=Number($('pageSize').value)||99999;
    const shown=rows.slice(0,limit);
    const colspan=state.maxDesigners+1;
    if(!shown.length){
      $('tbody').innerHTML='<tr><td class="empty" colspan="'+colspan+'">No games match the current filters.</td></tr>';
      return;
    }

    $('tbody').innerHTML=shown.map(row=>{
      const img=row.thumbnail
        ? '<img class="thumb" src="'+esc(row.thumbnail)+'" loading="lazy" alt="">'
        : '<div class="thumb"></div>';
      const gameUrl='https://boardgamegeek.com/boardgame/'+encodeURIComponent(row.id);
      const saved=state.saved.has(String(row.id));
      const rating=row.rating!=null?Number(row.rating).toFixed(1):'—';
      const rank=row.rank!=null?'#'+Number(row.rank).toLocaleString():'—';
      const year=row.year||'—';
      const game='<td class="game-cell"><div class="game-wrap">'+img+'<div><div style="display:flex;align-items:flex-start;gap:8px"><div style="min-width:0;flex:1"><div class="game-name"><a href="'+gameUrl+'" target="_blank" rel="noopener">'+esc(row.name)+'</a></div><div class="game-meta"><span class="meta-item">BGG '+esc(row.id)+'</span><span class="meta-item meta-sort" data-meta-sort="year">Year '+esc(year)+'</span><span class="meta-item meta-sort" data-meta-sort="rating">Rating '+esc(rating)+'</span><span class="meta-item meta-sort" data-meta-sort="rank">Rank '+esc(rank)+'</span></div></div><button class="save-btn '+(saved?'saved':'')+'" data-save-id="'+esc(row.id)+'" title="'+(saved?'Remove from saved games':'Save game in this browser')+'">★</button></div></div></div></td>';
      const pubs=Array.from({length:state.maxDesigners},(_,i)=>{
        const p=row.designers?.[i];
        if(!p) return '<td class="designer-cell"></td>';
        const href=p.id?'https://boardgamegeek.com/boardgamedesigner/'+encodeURIComponent(p.id):'#';
        return '<td class="designer-cell"><a class="designer-link" href="'+href+'" target="_blank" rel="noopener">'+esc(p.name)+'</a></td>';
      }).join('');
      return '<tr>'+game+pubs+'</tr>';
    }).join('');

    $('tbody').querySelectorAll('[data-save-id]').forEach(btn=>btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();toggleSaved(btn.dataset.saveId);}));
    $('tbody').querySelectorAll('[data-meta-sort]').forEach(el=>el.addEventListener('click',()=>{
      const key=el.dataset.metaSort;
      if(state.sortKey===key) state.sortDir*=-1; else {state.sortKey=key; state.sortDir=(key==='rating'?-1:1);}
      filterAndRender();
    }));
    $('tableNote').textContent=rows.length.toLocaleString()+' matching · showing '+shown.length.toLocaleString();
  }

  async function loadUser(force=false){
    const username=$('username').value.trim();
    if(!username) return;
    $('loadBtn').disabled=true; $('refreshBtn').disabled=true;
    try{
      setProgress(1);
      if(!force){
        const cached=await dbGet(username);
        if(cached?.rows?.length){
          const hasStats=cached.rows.some(r=>r.rating!=null || r.rank!=null);
          if(hasStats){
            applyRows(cached.rows,cached.displayUsername||username,'Indexed history');
            setStatus('Loaded from indexed history','good');
            setProgress(100);
            return;
          }
          setStatus('Old cache missing rank/rating — refreshing BGG…');
        }
      }
      const rows=await loadFresh(username);
      applyRows(rows,username,'Fresh BGG load');
      setStatus('Loaded and indexed','good');
    }catch(e){
      console.error(e);
      setStatus(e.message||'Load failed','bad');
      setProgress(0);
    }finally{
      $('loadBtn').disabled=false; $('refreshBtn').disabled=false;
    }
  }

  $('loadBtn').addEventListener('click',()=>loadUser(false));
  $('refreshBtn').addEventListener('click',()=>loadUser(true));
  $('username').addEventListener('keydown',e=>{if(e.key==='Enter') loadUser(false);});
  $('globalSearch').addEventListener('input',filterAndRender);
  $('pageSize').addEventListener('change',filterAndRender);
  $('savedBtn').addEventListener('click',()=>{
    state.savedOnly=!state.savedOnly;
    updateSavedUi();
    filterAndRender();
  });
  $('clearBtn').addEventListener('click',()=>{
    $('globalSearch').value='';
    state.columnFilters={};
    $('thead').querySelectorAll('[data-filter]').forEach(i=>i.value='');
    filterAndRender();
  });
  $('historySelect').addEventListener('change',async e=>{
    if(!e.target.value) return;
    const cached=await dbGet(e.target.value);
    if(cached?.rows){
      $('username').value=cached.displayUsername||cached.username;
      applyRows(cached.rows,cached.displayUsername||cached.username,'Indexed history');
      setStatus('Loaded from indexed history','good');
    }
  });

  updateSavedUi();
  refreshHistory();
})();
</script>
</body>
</html>
