<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>👾 Profile Creator</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>👾</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
            padding-top: env(safe-area-inset-top, 2rem);
            padding-bottom: env(safe-area-inset-bottom, 2rem);
            padding-left: env(safe-area-inset-left, 1rem);
            padding-right: env(safe-area-inset-right, 1rem);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2.5rem;
            font-weight: 800;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .header p {
            margin: 0;
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
        }

        .content {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 800px;
            margin: 0 auto;
        }

        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .avatar-item {
            cursor: pointer;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 1;
            border: 3px solid #e0e0e0;
            transition: all 0.3s;
        }

        .avatar-item:hover {
            transform: scale(1.05);
            border-color: #667eea;
        }

        .avatar-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-item.selected {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
        }

        .preview {
            text-align: center;
            padding: 2rem;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 2rem;
        }

        .preview-avatar {
            width: 150px;
            height: 150px;
            margin: 0 auto 1rem;
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #667eea;
        }

        .preview-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .preview-bio {
            color: #7f8c8d;
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 1rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            min-height: 44px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .content {
                padding: 1.5rem;
            }

            .avatar-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👾 Profile Creator</h1>
            <p>Create your custom profile avatar</p>
        </div>

        <div class="content">
            <div style="margin-bottom: 2rem;">
                <label style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: #2c3e50;">Your Name</label>
                <input type="text" id="nameInput" placeholder="Enter your name" value="">
            </div>

            <div style="margin-bottom: 2rem;">
                <label style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: #2c3e50;">Bio (Optional)</label>
                <input type="text" id="bioInput" placeholder="Write a short bio" value="">
            </div>

            <div style="margin-bottom: 2rem;">
                <label style="display: block; font-weight: 600; margin-bottom: 1rem; color: #2c3e50;">Choose Avatar</label>
                <div class="avatar-grid" id="avatarGrid"></div>
            </div>

            <div class="preview" style="display: none;" id="preview">
                <div class="preview-avatar">
                    <img id="previewImg" src="" alt="Preview">
                </div>
                <div class="preview-name" id="previewName">Your Name</div>
                <div class="preview-bio" id="previewBio">Your bio will appear here</div>
            </div>

            <div class="controls">
                <button class="btn-primary" onclick="saveProfile()">💾 Save Profile</button>
                <button class="btn-secondary" onclick="resetProfile()">🔄 Reset</button>
            </div>
        </div>
    </div>

    <script>
        let selectedAvatar = null;
        const avatars = ['😀', '😂', '🤗', '😎', '🤓', '😍', '🥳', '🤘', '🎨', '🎭', '🎪', '🎯'];
        
        function initAvatarGrid() {
            const grid = document.getElementById('avatarGrid');
            avatars.forEach((emoji, idx) => {
                const item = document.createElement('div');
                item.className = 'avatar-item';
                item.textContent = emoji;
                item.style.fontSize = '3rem';
                item.style.display = 'flex';
                item.style.alignItems = 'center';
                item.style.justifyContent = 'center';
                item.onclick = () => selectAvatar(idx, emoji);
                grid.appendChild(item);
            });
        }

        function selectAvatar(idx, emoji) {
            document.querySelectorAll('.avatar-item').forEach((item, i) => {
                item.classList.toggle('selected', i === idx);
            });
            selectedAvatar = emoji;
            updatePreview();
            document.getElementById('preview').style.display = 'block';
        }

        function updatePreview() {
            document.getElementById('previewName').textContent = document.getElementById('nameInput').value || 'Your Name';
            document.getElementById('previewBio').textContent = document.getElementById('bioInput').value || 'Your bio will appear here';
        }

        function saveProfile() {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) {
                alert('Please enter your name');
                return;
            }
            localStorage.setItem('profile_name', name);
            localStorage.setItem('profile_bio', document.getElementById('bioInput').value);
            localStorage.setItem('profile_avatar', selectedAvatar || '😀');
            alert('Profile saved! 🎉');
        }

        function resetProfile() {
            document.getElementById('nameInput').value = '';
            document.getElementById('bioInput').value = '';
            document.querySelectorAll('.avatar-item').forEach(item => item.classList.remove('selected'));
            selectedAvatar = null;
            document.getElementById('preview').style.display = 'none';
        }

        document.getElementById('nameInput').addEventListener('input', updatePreview);
        document.getElementById('bioInput').addEventListener('input', updatePreview);

        initAvatarGrid();
    </script>
    <!-- Vercel Web Analytics -->
    <script type="module" src="analytics-init.js"></script>
</body>
</html>
