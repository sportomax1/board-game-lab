<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Board Game Colors</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🎨</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1rem;
            padding-top: env(safe-area-inset-top, 0);
            padding-bottom: env(safe-area-inset-bottom, 0);
            padding-left: max(1rem, env(safe-area-inset-left, 0));
            padding-right: max(1rem, env(safe-area-inset-right, 0));
        }

        .header {
            padding: 1.5rem 0;
            border-bottom: 1px solid #eee;
            background: white;
            margin-bottom: 1.5rem;
        }

        .header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2rem;
            font-weight: 700;
            color: #333;
        }

        .header p {
            margin: 0;
            color: #666;
            font-size: 0.95rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            background: white;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .control-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-group input,
        .control-group select {
            padding: 0.5rem 0.75rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.95rem;
            min-width: 150px;
            -webkit-appearance: none;
            appearance: none;
        }

        .toggle-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .toggle-btn {
            padding: 0.5rem 0.75rem;
            border: 2px solid #ddd;
            border-radius: 6px;
            background: white;
            color: #333;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .toggle-btn.active {
            background: #6366f1;
            color: white;
            border-color: #6366f1;
        }

        .toggle-btn:active {
            transform: scale(0.98);
        }

        .control-group input:focus,
        .control-group select:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn {
            padding: 0.5rem 1rem;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.2s;
            height: fit-content;
        }

        .btn:active {
            background: #4f46e5;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #333;
        }

        .btn-secondary:active {
            background: #d1d5db;
        }

        .status {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            margin-bottom: 1.5rem;
            font-weight: 500;
            display: none;
        }

        .status.loading {
            display: block;
            background: #dbeafe;
            color: #0c4a6e;
            border: 1px solid #7dd3fc;
        }

        .status.success {
            display: block;
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .status.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .color-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .color-card:active {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }

        .color-card-thumbnail {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background: #f0f0f0;
        }

        .color-card-content {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            flex: 1;
        }

        .color-card-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: #333;
            line-height: 1.3;
            margin: 0;
        }

        .color-palette {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .color-swatch {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            align-items: center;
            flex: 0 1 calc(50% - 0.25rem);
        }

        .color-box {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 6px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .color-box:active {
            transform: scale(0.95);
        }

        .color-label {
            font-size: 0.7rem;
            font-weight: 500;
            color: #666;
            text-align: center;
            width: 100%;
        }

        .color-hex {
            font-size: 0.65rem;
            color: #999;
            font-family: monospace;
        }

        .primary-badge {
            display: inline-block;
            background: linear-gradient(135deg, #fbbf24, #f97316);
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-top: 0.25rem;
        }

        .color-percentage {
            font-size: 0.75rem;
            color: #999;
            font-weight: 500;
        }

        .empty-state {
            grid-column: 1 / -1;
            padding: 3rem 1rem;
            text-align: center;
            color: #666;
        }

        .empty-state p {
            margin: 0;
            font-size: 1.1rem;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f5f5f5;
        }

        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #999;
        }

        @media (max-width: 640px) {
            .header h1 {
                font-size: 1.5rem;
            }

            .controls {
                flex-direction: column;
            }

            .control-group input,
            .control-group select {
                min-width: 100%;
            }

            .color-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>🎨 Board Game Colors</h1>
            <p>Analyze primary colors from your board game collection</p>
        </div>
    </div>

    <div class="container">
        <div class="controls">
            <div class="control-group">
                <label for="usernameInput">BGG Username</label>
                <input type="text" id="usernameInput" placeholder="sportomax" value="sportomax">
            </div>

            <div class="control-group">
                <label>Color Mode</label>
                <div class="toggle-group">
                    <button class="toggle-btn active" data-mode="detailed">📊 Detailed</button>
                    <button class="toggle-btn" data-mode="basic">🎨 Basic Palette</button>
                </div>
            </div>

            <button class="btn" id="loadBtn">🔄 Load & Analyze</button>
            <button class="btn btn-secondary" id="clearBtn">Clear</button>
        </div>

        <div class="status" id="status"></div>

        <div class="color-grid" id="colorGrid">
            <div class="empty-state">
                <p>Click "Load & Analyze" to fetch and analyze your collection</p>
            </div>
        </div>
    </div>

    <script>
        // DOM elements
        const usernameInput = document.getElementById('usernameInput');
        const loadBtn = document.getElementById('loadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const status = document.getElementById('status');
        const colorGrid = document.getElementById('colorGrid');
        const toggleBtns = document.querySelectorAll('.toggle-btn');

        let allGames = [];
        let colorMode = 'detailed'; // 'detailed' or 'basic'
        const IMAGE_PROXY = 'https://images.weserv.nl/?url=';

        // Basic color palette - 10 core colors
        const BASIC_PALETTE = {
            'black': { hex: '#000000', rgb: [0, 0, 0] },
            'white': { hex: '#FFFFFF', rgb: [255, 255, 255] },
            'red': { hex: '#FF0000', rgb: [255, 0, 0] },
            'green': { hex: '#00AA00', rgb: [0, 170, 0] },
            'yellow': { hex: '#FFFF00', rgb: [255, 255, 0] },
            'blue': { hex: '#0000FF', rgb: [0, 0, 255] },
            'brown': { hex: '#8B4513', rgb: [139, 69, 19] },
            'orange': { hex: '#FF8800', rgb: [255, 136, 0] },
            'pink': { hex: '#FF1493', rgb: [255, 20, 147] },
            'purple': { hex: '#8800FF', rgb: [136, 0, 255] }
        };

        // Color mode toggle
        toggleBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                toggleBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                colorMode = btn.dataset.mode;
                console.log(`🎨 Color mode changed to: ${colorMode}`);
                // Re-render if games are loaded
                if (allGames.length > 0) {
                    console.log(`🔄 Re-rendering ${allGames.length} cards with ${colorMode} colors...`);
                    renderGames();
                }
            });
        });

        // Fetch BGG API with retry logic
        async function fetchBGG(endpoint, params = {}, retries = 5) {
            const queryParams = new URLSearchParams(params).toString();
            const fullUrl = `/api/bgg-helper?endpoint=${endpoint}&${queryParams}`;
            
            try {
                const response = await fetch(fullUrl);

                if (response.status === 202 && retries > 0) {
                    console.log(`BGG busy (202), waiting 3s before retry ${6 - retries}...`);
                    await new Promise(r => setTimeout(r, 3000));
                    return fetchBGG(endpoint, params, retries - 1);
                }

                if (!response.ok) {
                    throw new Error(`BGG API fetch failed: Status ${response.status} ${response.statusText}`);
                }

                return await response.text();

            } catch (error) {
                console.error('Fetch error:', error);
                if (retries > 0) {
                    await new Promise(r => setTimeout(r, 2000));
                    return fetchBGG(endpoint, params, retries - 1);
                }
                throw error;
            }
        }

        function parseXML(xmlText) {
            return new DOMParser().parseFromString(xmlText, 'text/xml');
        }

        // Color analysis function using canvas - SIMPLIFIED for speed
        async function analyzeImageColors(imageUrl) {
            return new Promise((resolve) => {
                // Use image proxy to avoid CORS issues
                const proxiedUrl = imageUrl ? `${IMAGE_PROXY}${encodeURIComponent(imageUrl)}` : null;
                
                if (!proxiedUrl) {
                    resolve({
                        colors: [{ hex: '#cccccc', count: 0, percentage: 100 }],
                        primary: { hex: '#cccccc', count: 0, percentage: 100 }
                    });
                    return;
                }

                const img = new Image();
                img.crossOrigin = 'anonymous';
                
                img.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        // Smaller canvas for faster analysis
                        canvas.width = 50;
                        canvas.height = 50;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        
                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const data = imageData.data;
                        
                        // Sample every other pixel for speed
                        const colorMap = {};
                        const step = 8; // Sample less frequently
                        let pixelCount = 0;
                        
                        for (let i = 0; i < data.length; i += (step * 4)) {
                            const r = data[i];
                            const g = data[i + 1];
                            const b = data[i + 2];
                            const a = data[i + 3];
                            
                            // Skip transparent pixels
                            if (a < 128) continue;
                            
                            const hex = rgbToHex(r, g, b);
                            colorMap[hex] = (colorMap[hex] || 0) + 1;
                            pixelCount++;
                        }
                        
                        if (pixelCount === 0) {
                            resolve({
                                colors: [{ hex: '#999999', count: 0, percentage: 100 }],
                                primary: { hex: '#999999', count: 0, percentage: 100 }
                            });
                            return;
                        }
                        
                        // Convert to array and sort by frequency
                        let colors = Object.entries(colorMap)
                            .map(([hex, count]) => ({
                                hex: hex,
                                count: count,
                                percentage: ((count / pixelCount) * 100).toFixed(1)
                            }))
                            .sort((a, b) => b.count - a.count)
                            .slice(0, 6); // Top 6 colors
                        
                        // Get dominant color (primary color)
                        const primaryColor = colors[0] || { hex: '#cccccc', count: 0, percentage: 0 };
                        
                        resolve({
                            colors: colors,
                            primary: primaryColor
                        });
                    } catch (error) {
                        console.error('Canvas error:', error);
                        resolve({
                            colors: [{ hex: '#999999', count: 0, percentage: 100 }],
                            primary: { hex: '#999999', count: 0, percentage: 100 }
                        });
                    }
                };
                
                img.onerror = () => {
                    console.warn('Failed to load image:', proxiedUrl);
                    resolve({
                        colors: [{ hex: '#cccccc', count: 0, percentage: 100 }],
                        primary: { hex: '#cccccc', count: 0, percentage: 100 }
                    });
                };
                
                img.src = proxiedUrl;
            });
        }

        function rgbToHex(r, g, b) {
            return '#' + [r, g, b].map(x => {
                const hex = x.toString(16);
                return hex.length === 1 ? '0' + hex : hex;
            }).join('').toUpperCase();
        }

        // Calculate Euclidean distance between two RGB colors
        function colorDistance(rgb1, rgb2) {
            const [r1, g1, b1] = rgb1;
            const [r2, g2, b2] = rgb2;
            return Math.sqrt((r1-r2)**2 + (g1-g2)**2 + (b1-b2)**2);
        }

        // Find closest basic palette color
        function getClosestBasicColor(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            const rgb = [r, g, b];

            let closest = null;
            let minDistance = Infinity;

            for (const [name, color] of Object.entries(BASIC_PALETTE)) {
                const distance = colorDistance(rgb, color.rgb);
                if (distance < minDistance) {
                    minDistance = distance;
                    closest = { name, hex: color.hex };
                }
            }

            return closest || { name: 'gray', hex: '#888888' };
        }

        function showStatus(message, type) {
            status.textContent = message;
            status.className = `status ${type}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load collection and analyze colors
        loadBtn.addEventListener('click', async () => {
            const username = usernameInput.value.trim() || 'sportomax';
            console.log(`👤 Loading collection for user: ${username}`);
            
            allGames = [];
            showStatus('📦 Loading collection...', 'loading');

            try {
                console.log(`📡 Fetching collection from BGG API...`);
                const collXml = await fetchBGG('collection', {
                    username: username,
                    own: '1',
                    stats: '1'
                });
                
                console.log(`📄 Parsing XML response...`);
                const collDoc = parseXML(collXml);
                const items = Array.from(collDoc.querySelectorAll('item'));

                console.log(`📦 Found ${items.length} items in collection`);
                console.log(`🎨 Starting color analysis...`);
                showStatus(`🎨 Analyzing ${items.length} games...`, 'loading');

                // Process items
                items.forEach((item, idx) => {
                    const gameId = item.getAttribute('objectid');
                    const name = item.querySelector('name')?.textContent || 'Unknown';
                    const thumbnail = item.querySelector('thumbnail')?.textContent || '';
                    const image = item.querySelector('image')?.textContent || thumbnail;

                    console.log(`  [${idx + 1}/${items.length}] ${name} (ID: ${gameId})`);

                    allGames.push({
                        id: gameId,
                        name: name,
                        thumbnail: image || thumbnail,
                        colors: null
                    });
                });

                console.log(`🚀 Beginning analysis loop...`);
                // Analyze colors for each game
                await analyzeAllGames();
                
            } catch (error) {
                console.error('❌ Error:', error);
                showStatus(`❌ Error: ${error.message}`, 'error');
            }
        });

        async function analyzeAllGames() {
            if (allGames.length === 0) return;

            console.log(`🎨 Starting color analysis for ${allGames.length} games`);
            colorGrid.innerHTML = '';
            let processed = 0;

            for (const game of allGames) {
                console.log(`[${processed + 1}/${allGames.length}] Analyzing: ${game.name}`);
                
                try {
                    if (game.thumbnail) {
                        console.log(`  📥 Fetching thumbnail...`);
                        game.colors = await analyzeImageColors(game.thumbnail);
                        console.log(`  ✅ Colors extracted: Primary = ${game.colors.primary.hex} (${game.colors.primary.percentage}%)`);
                    } else {
                        console.log(`  ⚠️ No thumbnail available, using default color`);
                        game.colors = {
                            colors: [{ hex: '#cccccc', count: 0, percentage: 100 }],
                            primary: { hex: '#cccccc', count: 0, percentage: 100 }
                        };
                    }
                } catch (error) {
                    console.error(`  ❌ Error analyzing ${game.name}:`, error);
                    game.colors = {
                        colors: [{ hex: '#999999', count: 0, percentage: 100 }],
                        primary: { hex: '#999999', count: 0, percentage: 100 }
                    };
                }

                processed++;
                
                // Render card immediately after analysis
                console.log(`  🎴 Rendering card...`);
                renderGameCard(game);
                
                showStatus(`🎨 Analyzed ${processed} of ${allGames.length} games...`, 'loading');
                
                // Small delay to avoid blocking (allows UI to update)
                if (processed % 3 === 0) {
                    await new Promise(r => setTimeout(r, 50));
                }
            }

            console.log(`✅ All ${allGames.length} games analyzed!`);
            showStatus(`✅ Successfully analyzed ${allGames.length} games!`, 'success');
        }

        function renderGames() {
            if (allGames.length === 0) {
                colorGrid.innerHTML = '<div class="empty-state"><p>No games to display</p></div>';
                return;
            }

            colorGrid.innerHTML = allGames.map(game => buildGameCard(game)).join('');
        }

        function renderGameCard(game) {
            // If grid is empty, clear it first
            if (colorGrid.innerHTML.includes('empty-state')) {
                colorGrid.innerHTML = '';
            }

            const cardHTML = buildGameCard(game);
            colorGrid.innerHTML += cardHTML;
        }

        function buildGameCard(game) {
            const colors = game.colors || { colors: [], primary: {} };
            const proxiedThumbnail = game.thumbnail 
                ? `${IMAGE_PROXY}${encodeURIComponent(game.thumbnail)}`
                : 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 60 80%22%3E%3Crect fill=%22%23f0f0f0%22 width=%2260%22 height=%2280%22/%3E%3C/svg%3E';

            // Get colors to display based on mode
            let displayColors = colors.colors;
            if (colorMode === 'basic' && colors.colors.length > 0) {
                // Convert to basic palette and deduplicate
                const basicColors = colors.colors.map(c => getClosestBasicColor(c.hex));
                const uniqueBasicColors = [];
                const seenHexes = new Set();
                
                basicColors.forEach(bc => {
                    if (!seenHexes.has(bc.hex)) {
                        seenHexes.add(bc.hex);
                        uniqueBasicColors.push({
                            hex: bc.hex,
                            name: bc.name,
                            count: 0,
                            percentage: 0
                        });
                    }
                });
                
                displayColors = uniqueBasicColors.length > 0 ? uniqueBasicColors : [{ hex: '#888888', count: 0, percentage: 0, name: 'gray' }];
            }

            return `
                <div class="color-card">
                    <img src="${escapeHtml(proxiedThumbnail)}" 
                         alt="${escapeHtml(game.name)}" 
                         class="color-card-thumbnail"
                         onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 60 80%22%3E%3Crect fill=%22%23f0f0f0%22 width=%2260%22 height=%2280%22/%3E%3C/svg%3E'">
                    <div class="color-card-content">
                        <h3 class="color-card-name">${escapeHtml(game.name)}</h3>
                        
                        <div class="color-palette">
                            ${displayColors.map((color, idx) => `
                                <div class="color-swatch">
                                    <div class="color-box" 
                                         style="background-color: ${color.hex};"
                                         title="${color.hex}${color.name ? ' (' + color.name + ')' : ''}"></div>
                                    <div class="color-label">
                                        ${idx === 0 ? '<span class="primary-badge">Primary</span>' : ''}
                                        <div class="color-hex">${color.hex}</div>
                                        ${color.name ? '<div class="color-name" style="font-size: 0.65rem; color: #666; margin-top: 0.1rem;">' + color.name + '</div>' : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        clearBtn.addEventListener('click', () => {
            console.log('🗑️ Clearing collection...');
            usernameInput.value = 'sportomax';
            allGames = [];
            colorGrid.innerHTML = '<div class="empty-state"><p>Click "Load & Analyze" to fetch and analyze your collection</p></div>';
            status.className = 'status';
            console.log('✅ Cleared! Ready for new analysis');
            usernameInput.focus();
        });

        window.addEventListener('load', () => {
            usernameInput.focus();
        });
    </script>
</body>
</html>
