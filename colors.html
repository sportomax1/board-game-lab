<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Board Game Colors</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🎨</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1rem;
            padding-top: env(safe-area-inset-top, 0);
            padding-bottom: env(safe-area-inset-bottom, 0);
            padding-left: max(1rem, env(safe-area-inset-left, 0));
            padding-right: max(1rem, env(safe-area-inset-right, 0));
        }

        .header {
            padding: 1.5rem 0;
            border-bottom: 1px solid #eee;
            background: white;
            margin-bottom: 1.5rem;
        }

        .header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2rem;
            font-weight: 700;
            color: #333;
        }

        .header p {
            margin: 0;
            color: #666;
            font-size: 0.95rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            background: white;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .control-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-group input,
        .control-group select {
            padding: 0.5rem 0.75rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.95rem;
            min-width: 150px;
            -webkit-appearance: none;
            appearance: none;
        }

        .control-group input:focus,
        .control-group select:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn {
            padding: 0.5rem 1rem;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.2s;
            height: fit-content;
        }

        .btn:active {
            background: #4f46e5;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #333;
        }

        .btn-secondary:active {
            background: #d1d5db;
        }

        .status {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            margin-bottom: 1.5rem;
            font-weight: 500;
            display: none;
        }

        .status.loading {
            display: block;
            background: #dbeafe;
            color: #0c4a6e;
            border: 1px solid #7dd3fc;
        }

        .status.success {
            display: block;
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .status.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .color-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .color-card:active {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }

        .color-card-thumbnail {
            width: 100%;
            aspect-ratio: 4 / 5;
            object-fit: cover;
            background: #f0f0f0;
        }

        .color-card-content {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            flex: 1;
        }

        .color-card-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: #333;
            line-height: 1.3;
            margin: 0;
        }

        .color-palette {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .color-swatch {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            align-items: center;
            flex: 0 1 calc(50% - 0.25rem);
        }

        .color-box {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 6px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .color-box:active {
            transform: scale(0.95);
        }

        .color-label {
            font-size: 0.7rem;
            font-weight: 500;
            color: #666;
            text-align: center;
            width: 100%;
        }

        .color-hex {
            font-size: 0.65rem;
            color: #999;
            font-family: monospace;
        }

        .primary-badge {
            display: inline-block;
            background: linear-gradient(135deg, #fbbf24, #f97316);
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-top: 0.25rem;
        }

        .color-percentage {
            font-size: 0.75rem;
            color: #999;
            font-weight: 500;
        }

        .empty-state {
            grid-column: 1 / -1;
            padding: 3rem 1rem;
            text-align: center;
            color: #666;
        }

        .empty-state p {
            margin: 0;
            font-size: 1.1rem;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f5f5f5;
        }

        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #999;
        }

        @media (max-width: 640px) {
            .header h1 {
                font-size: 1.5rem;
            }

            .controls {
                flex-direction: column;
            }

            .control-group input,
            .control-group select {
                min-width: 100%;
            }

            .color-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>🎨 Board Game Colors</h1>
            <p>Analyze primary colors from your board game collection</p>
        </div>
    </div>

    <div class="container">
        <div class="controls">
            <div class="control-group">
                <label for="usernameInput">BGG Username</label>
                <input type="text" id="usernameInput" placeholder="Enter username">
            </div>

            <button class="btn" id="loadBtn">🔄 Load & Analyze</button>
            <button class="btn btn-secondary" id="clearBtn">Clear</button>
        </div>

        <div class="status" id="status"></div>

        <div class="color-grid" id="colorGrid">
            <div class="empty-state">
                <p>Click "Load & Analyze" to fetch and analyze your collection</p>
            </div>
        </div>
    </div>

    <script>
        // DOM elements
        const usernameInput = document.getElementById('usernameInput');
        const loadBtn = document.getElementById('loadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const status = document.getElementById('status');
        const colorGrid = document.getElementById('colorGrid');

        let allGames = [];

        // Fetch with retry for rate limit handling
        async function fetchWithRetry(url, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url);
                    
                    if (response.status === 202) {
                        const waitTime = 3000 * (i + 1);
                        console.log(`BGG busy (202), waiting ${waitTime}ms before retry ${i + 1}...`);
                        await new Promise(r => setTimeout(r, waitTime));
                        continue;
                    }
                    
                    if (response.status === 429) {
                        const waitTime = 5000 * (i + 1);
                        console.log(`Rate limited (429), waiting ${waitTime}ms before retry ${i + 1}...`);
                        await new Promise(r => setTimeout(r, waitTime));
                        continue;
                    }
                    
                    if (response.status === 502) {
                        const waitTime = 4000 * (i + 1);
                        console.log(`Helper returned 502 (BGG API error), waiting ${waitTime}ms before retry ${i + 1}...`);
                        await new Promise(r => setTimeout(r, waitTime));
                        continue;
                    }
                    
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response;
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    const waitTime = 2000 * (i + 1);
                    console.log(`Error on attempt ${i + 1}, waiting ${waitTime}ms...`, error.message);
                    await new Promise(r => setTimeout(r, waitTime));
                }
            }
        }

        // Color analysis function using canvas
        async function analyzeImageColors(imageUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                
                img.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = 100;
                        canvas.height = 100;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        
                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const data = imageData.data;
                        
                        // Sample every pixel and collect colors
                        const colorMap = {};
                        for (let i = 0; i < data.length; i += 4) {
                            const r = data[i];
                            const g = data[i + 1];
                            const b = data[i + 2];
                            const a = data[i + 3];
                            
                            // Skip transparent pixels
                            if (a < 128) continue;
                            
                            const hex = rgbToHex(r, g, b);
                            colorMap[hex] = (colorMap[hex] || 0) + 1;
                        }
                        
                        // Convert to array and sort by frequency
                        let colors = Object.entries(colorMap)
                            .map(([hex, count]) => ({
                                hex: hex,
                                count: count,
                                percentage: ((count / Object.values(colorMap).reduce((a, b) => a + b, 0)) * 100).toFixed(1)
                            }))
                            .sort((a, b) => b.count - a.count)
                            .slice(0, 6); // Top 6 colors
                        
                        // Get dominant color (primary color)
                        const primaryColor = colors[0] || { hex: '#cccccc', count: 0, percentage: 0 };
                        
                        resolve({
                            colors: colors,
                            primary: primaryColor
                        });
                    } catch (error) {
                        console.error('Canvas error:', error);
                        resolve({
                            colors: [{ hex: '#999999', count: 0, percentage: 100 }],
                            primary: { hex: '#999999', count: 0, percentage: 100 }
                        });
                    }
                };
                
                img.onerror = () => {
                    console.warn('Failed to load image:', imageUrl);
                    resolve({
                        colors: [{ hex: '#cccccc', count: 0, percentage: 100 }],
                        primary: { hex: '#cccccc', count: 0, percentage: 100 }
                    });
                };
                
                img.src = imageUrl;
            });
        }

        function rgbToHex(r, g, b) {
            return '#' + [r, g, b].map(x => {
                const hex = x.toString(16);
                return hex.length === 1 ? '0' + hex : hex;
            }).join('').toUpperCase();
        }

        function showStatus(message, type) {
            status.textContent = message;
            status.className = `status ${type}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load collection and analyze colors
        loadBtn.addEventListener('click', async () => {
            const username = usernameInput.value.trim();
            if (!username) {
                showStatus('❌ Please enter a username', 'error');
                return;
            }

            allGames = [];
            showStatus('📦 Loading collection...', 'loading');

            try {
                const collResponse = await fetchWithRetry(
                    `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&stats=1`
                );
                const collXml = new DOMParser().parseFromString(await collResponse.text(), 'text/xml');
                const items = Array.from(collXml.querySelectorAll('item'));

                console.log(`📦 Found ${items.length} items in collection`);
                showStatus(`🎨 Analyzing ${items.length} games...`, 'loading');

                // Process items
                items.forEach(item => {
                    const gameId = item.getAttribute('objectid');
                    const name = item.querySelector('name')?.textContent || 'Unknown';
                    const thumbnail = item.querySelector('thumbnail')?.textContent || '';
                    const image = item.querySelector('image')?.textContent || thumbnail;

                    allGames.push({
                        id: gameId,
                        name: name,
                        thumbnail: image || thumbnail,
                        colors: null
                    });
                });

                // Analyze colors for each game
                await analyzeAllGames();
                
            } catch (error) {
                console.error('Error:', error);
                showStatus(`❌ Error: ${error.message}`, 'error');
            }
        });

        async function analyzeAllGames() {
            if (allGames.length === 0) return;

            colorGrid.innerHTML = '';
            let processed = 0;

            for (const game of allGames) {
                try {
                    if (game.thumbnail) {
                        game.colors = await analyzeImageColors(game.thumbnail);
                    } else {
                        game.colors = {
                            colors: [{ hex: '#cccccc', count: 0, percentage: 100 }],
                            primary: { hex: '#cccccc', count: 0, percentage: 100 }
                        };
                    }
                } catch (error) {
                    console.error(`Error analyzing ${game.name}:`, error);
                    game.colors = {
                        colors: [{ hex: '#999999', count: 0, percentage: 100 }],
                        primary: { hex: '#999999', count: 0, percentage: 100 }
                    };
                }

                processed++;
                showStatus(`🎨 Analyzed ${processed} of ${allGames.length} games...`, 'loading');

                // Add small delay to prevent blocking
                if (processed % 5 === 0) {
                    await new Promise(r => setTimeout(r, 100));
                }
            }

            renderGames();
            showStatus(`✅ Successfully analyzed ${allGames.length} games!`, 'success');
        }

        function renderGames() {
            if (allGames.length === 0) {
                colorGrid.innerHTML = '<div class="empty-state"><p>No games to display</p></div>';
                return;
            }

            colorGrid.innerHTML = allGames.map(game => {
                const colors = game.colors || { colors: [], primary: {} };
                const primary = colors.primary || {};

                return `
                    <div class="color-card">
                        <img src="${escapeHtml(game.thumbnail)}" 
                             alt="${escapeHtml(game.name)}" 
                             class="color-card-thumbnail"
                             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 60 80%22%3E%3Crect fill=%22%23f0f0f0%22 width=%2260%22 height=%2280%22/%3E%3C/svg%3E'">
                        <div class="color-card-content">
                            <h3 class="color-card-name">${escapeHtml(game.name)}</h3>
                            
                            <div class="color-palette">
                                ${colors.colors.map((color, idx) => `
                                    <div class="color-swatch">
                                        <div class="color-box" 
                                             style="background-color: ${color.hex};"
                                             title="${color.hex} - ${color.percentage}%"></div>
                                        <div class="color-label">
                                            ${idx === 0 ? '<span class="primary-badge">Primary</span>' : ''}
                                            <div class="color-hex">${color.hex}</div>
                                            <div class="color-percentage">${color.percentage}%</div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        clearBtn.addEventListener('click', () => {
            usernameInput.value = '';
            allGames = [];
            colorGrid.innerHTML = '<div class="empty-state"><p>Click "Load & Analyze" to fetch and analyze your collection</p></div>';
            status.className = 'status';
            usernameInput.focus();
        });

        window.addEventListener('load', () => {
            usernameInput.focus();
        });
    </script>
</body>
</html>
