<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>BGG Dots and Boxes</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>⬜</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow: hidden;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 650px;
        }

        .screen.active {
            display: block;
        }

        .setup-card, .game-card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 2rem;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #e74c3c;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(231, 76, 60, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .player-info {
            text-align: center;
        }

        .player-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .score {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 0.25rem;
        }

        .player1 .score {
            color: #3498db;
        }

        .player2 .score {
            color: #e74c3c;
        }

        .player-thumbnail {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid;
            margin: 0 auto;
        }

        .player1 .player-thumbnail {
            border-color: #3498db;
        }

        .player2 .player-thumbnail {
            border-color: #e74c3c;
        }

        .current-turn {
            padding: 0.5rem 1rem;
            background: #ecf0f1;
            border-radius: 8px;
            font-weight: 700;
            color: #2c3e50;
            text-align: center;
        }

        .board-container {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
            overflow-x: auto;
            padding: 0.5rem;
        }

        .board {
            display: inline-block;
            position: relative;
            padding: 20px;
        }

        .dots {
            display: grid;
            gap: 50px;
            position: relative;
        }

        .dot {
            width: 10px;
            height: 10px;
            background: #2c3e50;
            border-radius: 50%;
            position: relative;
        }

        .line {
            position: absolute;
            background: #bdc3c7;
            cursor: pointer;
            transition: all 0.2s;
        }

        .line:hover {
            background: #7f8c8d;
            transform: scale(1.1);
        }

        .line.horizontal {
            height: 4px;
            width: 50px;
            top: 50%;
            transform: translateY(-50%);
        }

        .line.vertical {
            width: 4px;
            height: 50px;
            left: 50%;
            transform: translateX(-50%);
        }

        .line.claimed {
            cursor: default;
        }

        .line.claimed.player1 {
            background: #3498db;
        }

        .line.claimed.player2 {
            background: #e74c3c;
        }

        .box {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 4px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s;
            animation: boxComplete 0.5s ease-out;
        }

        @keyframes boxComplete {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .box.complete {
            opacity: 1;
        }

        .box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-controls {
            display: flex;
            gap: 0.5rem;
        }

        .game-controls button {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .game-controls button:active {
            transform: scale(0.95);
        }

        .new-game-btn {
            background: #2ecc71;
            color: white;
        }

        .settings-btn {
            background: #95a5a6;
            color: white;
        }

        .winner-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .winner-modal.active {
            display: flex;
        }

        .winner-content {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            max-width: 400px;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .winner-title {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #2c3e50;
        }

        .winner-thumbnail {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin: 1rem auto;
            border: 5px solid #f39c12;
        }
    </style>
</head>
<body>
    <!-- Setup Screen -->
    <div id="setupScreen" class="screen active">
        <div class="setup-card">
            <h1>⬜ Dots and Boxes</h1>
            <p class="subtitle">Complete boxes with BGG collection thumbnails!</p>
            
            <div class="form-group">
                <label for="username1">Player 1 BGG Username</label>
                <input type="text" id="username1" value="sportomax" placeholder="Enter username">
            </div>

            <div class="form-group">
                <label for="username2">Player 2 BGG Username</label>
                <input type="text" id="username2" value="sportomax" placeholder="Enter username">
            </div>

            <div class="form-group">
                <label for="gridSize">Grid Size (dots per side)</label>
                <input type="number" id="gridSize" value="4" min="3" max="6" placeholder="4">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="includeExpansions">
                <label for="includeExpansions" style="margin: 0;">Include expansions</label>
            </div>

            <div style="margin-top: 1.5rem;">
                <button class="btn" onclick="startGame()">Start Game</button>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="screen">
        <div class="game-card">
            <div class="game-header">
                <div class="player-info player1">
                    <div class="player-name" id="player1Name">Player 1</div>
                    <div class="score" id="player1Score">0</div>
                    <img id="player1Thumb" class="player-thumbnail" src="" alt="Player 1">
                </div>
                <div class="current-turn" id="turnIndicator">Player 1's Turn</div>
                <div class="player-info player2">
                    <div class="player-name" id="player2Name">Player 2</div>
                    <div class="score" id="player2Score">0</div>
                    <img id="player2Thumb" class="player-thumbnail" src="" alt="Player 2">
                </div>
            </div>

            <div class="board-container">
                <div class="board" id="board"></div>
            </div>

            <div class="game-controls">
                <button class="new-game-btn" onclick="newGame()">New Game</button>
                <button class="settings-btn" onclick="backToSettings()">Settings</button>
            </div>
        </div>
    </div>

    <!-- Winner Modal -->
    <div id="winnerModal" class="winner-modal">
        <div class="winner-content">
            <div class="winner-title" id="winnerText">🎉 Winner!</div>
            <img id="winnerThumb" class="winner-thumbnail" src="" alt="Winner">
            <div style="margin-top: 1.5rem;">
                <button class="btn" onclick="newGame()">Play Again</button>
            </div>
        </div>
    </div>

    <script>
        let gridSize = 4;
        let lines = [];
        let boxes = [];
        let currentPlayer = 1;
        let player1Games = [];
        let player2Games = [];
        let player1Score = 0;
        let player2Score = 0;
        let gameActive = false;

        async function startGame() {
            const username1 = document.getElementById('username1').value.trim() || 'sportomax';
            const username2 = document.getElementById('username2').value.trim() || 'sportomax';
            const includeExpansions = document.getElementById('includeExpansions').checked;
            gridSize = parseInt(document.getElementById('gridSize').value) || 4;

            if (gridSize < 3) gridSize = 3;
            if (gridSize > 6) gridSize = 6;

            try {
                const subtype = includeExpansions ? '' : '&subtype=boardgame';
                
                const [res1, res2] = await Promise.all([
                    fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username1)}&own=1${subtype}&stats=1`),
                    fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username2)}&own=1${subtype}&stats=1`)
                ]);

                const [xml1, xml2] = await Promise.all([res1.text(), res2.text()]);

                const parser = new DOMParser();
                const doc1 = parser.parseFromString(xml1, 'text/xml');
                const doc2 = parser.parseFromString(xml2, 'text/xml');

                player1Games = Array.from(doc1.querySelectorAll('item')).map(item => ({
                    name: item.querySelector('name').textContent,
                    thumbnail: item.querySelector('thumbnail')?.textContent || ''
                })).filter(g => g.thumbnail);

                player2Games = Array.from(doc2.querySelectorAll('item')).map(item => ({
                    name: item.querySelector('name').textContent,
                    thumbnail: item.querySelector('thumbnail')?.textContent || ''
                })).filter(g => g.thumbnail);

                const maxBoxes = (gridSize - 1) * (gridSize - 1);
                if (player1Games.length < maxBoxes || player2Games.length < maxBoxes) {
                    alert('Not enough games with thumbnails. Please check usernames.');
                    return;
                }

                document.getElementById('player1Name').textContent = username1;
                document.getElementById('player2Name').textContent = username2;

                document.getElementById('setupScreen').classList.remove('active');
                document.getElementById('gameScreen').classList.add('active');

                newGame();
            } catch (error) {
                alert('Error loading collections: ' + error.message);
            }
        }

        function newGame() {
            currentPlayer = 1;
            player1Score = 0;
            player2Score = 0;
            gameActive = true;
            document.getElementById('winnerModal').classList.remove('active');

            // Pick random thumbnails for display
            const p1Game = player1Games[Math.floor(Math.random() * player1Games.length)];
            const p2Game = player2Games[Math.floor(Math.random() * player2Games.length)];
            document.getElementById('player1Thumb').src = p1Game.thumbnail;
            document.getElementById('player2Thumb').src = p2Game.thumbnail;

            // Initialize lines and boxes
            lines = [];
            boxes = [];

            const totalBoxes = (gridSize - 1) * (gridSize - 1);
            for (let i = 0; i < totalBoxes; i++) {
                boxes.push({
                    top: false,
                    right: false,
                    bottom: false,
                    left: false,
                    complete: false,
                    player: null
                });
            }

            renderBoard();
            updateScore();
        }

        function renderBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';

            // Create dots grid
            const dots = document.createElement('div');
            dots.className = 'dots';
            dots.style.gridTemplateColumns = `repeat(${gridSize}, auto)`;

            // Add dots and lines
            for (let row = 0; row < gridSize; row++) {
                for (let col = 0; col < gridSize; col++) {
                    const dotContainer = document.createElement('div');
                    dotContainer.style.position = 'relative';

                    const dot = document.createElement('div');
                    dot.className = 'dot';
                    dotContainer.appendChild(dot);

                    // Add horizontal line to the right
                    if (col < gridSize - 1) {
                        const hLine = document.createElement('div');
                        hLine.className = 'line horizontal';
                        hLine.dataset.row = row;
                        hLine.dataset.col = col;
                        hLine.dataset.type = 'h';
                        hLine.style.left = '10px';
                        hLine.onclick = () => claimLine(row, col, 'h');
                        dotContainer.appendChild(hLine);
                    }

                    // Add vertical line below
                    if (row < gridSize - 1) {
                        const vLine = document.createElement('div');
                        vLine.className = 'line vertical';
                        vLine.dataset.row = row;
                        vLine.dataset.col = col;
                        vLine.dataset.type = 'v';
                        vLine.style.top = '10px';
                        vLine.onclick = () => claimLine(row, col, 'v');
                        dotContainer.appendChild(vLine);
                    }

                    dots.appendChild(dotContainer);
                }
            }

            board.appendChild(dots);

            // Render boxes
            renderBoxes();
        }

        function renderBoxes() {
            const board = document.getElementById('board');
            
            // Remove old boxes
            board.querySelectorAll('.box').forEach(el => el.remove());

            // Add completed boxes
            for (let i = 0; i < boxes.length; i++) {
                if (boxes[i].complete) {
                    const row = Math.floor(i / (gridSize - 1));
                    const col = i % (gridSize - 1);
                    
                    const box = document.createElement('div');
                    box.className = 'box complete';
                    box.style.left = `${30 + col * 60}px`;
                    box.style.top = `${30 + row * 60}px`;
                    
                    const img = document.createElement('img');
                    const games = boxes[i].player === 1 ? player1Games : player2Games;
                    const game = games[Math.floor(Math.random() * games.length)];
                    img.src = game.thumbnail;
                    box.appendChild(img);
                    
                    board.appendChild(box);
                }
            }
        }

        function claimLine(row, col, type) {
            if (!gameActive) return;

            const lineElement = document.querySelector(`[data-row="${row}"][data-col="${col}"][data-type="${type}"]`);
            if (lineElement.classList.contains('claimed')) return;

            lineElement.classList.add('claimed', `player${currentPlayer}`);

            // Update boxes
            let boxCompleted = false;

            if (type === 'h') {
                // Horizontal line affects box above and below
                if (row > 0) {
                    const boxIndex = (row - 1) * (gridSize - 1) + col;
                    boxes[boxIndex].bottom = currentPlayer;
                    if (checkBoxComplete(boxIndex)) {
                        boxes[boxIndex].complete = true;
                        boxes[boxIndex].player = currentPlayer;
                        boxCompleted = true;
                        if (currentPlayer === 1) player1Score++;
                        else player2Score++;
                    }
                }
                if (row < gridSize - 1) {
                    const boxIndex = row * (gridSize - 1) + col;
                    boxes[boxIndex].top = currentPlayer;
                    if (checkBoxComplete(boxIndex)) {
                        boxes[boxIndex].complete = true;
                        boxes[boxIndex].player = currentPlayer;
                        boxCompleted = true;
                        if (currentPlayer === 1) player1Score++;
                        else player2Score++;
                    }
                }
            } else {
                // Vertical line affects box left and right
                if (col > 0) {
                    const boxIndex = row * (gridSize - 1) + (col - 1);
                    boxes[boxIndex].right = currentPlayer;
                    if (checkBoxComplete(boxIndex)) {
                        boxes[boxIndex].complete = true;
                        boxes[boxIndex].player = currentPlayer;
                        boxCompleted = true;
                        if (currentPlayer === 1) player1Score++;
                        else player2Score++;
                    }
                }
                if (col < gridSize - 1) {
                    const boxIndex = row * (gridSize - 1) + col;
                    boxes[boxIndex].left = currentPlayer;
                    if (checkBoxComplete(boxIndex)) {
                        boxes[boxIndex].complete = true;
                        boxes[boxIndex].player = currentPlayer;
                        boxCompleted = true;
                        if (currentPlayer === 1) player1Score++;
                        else player2Score++;
                    }
                }
            }

            renderBoxes();
            updateScore();

            // If box was completed, player gets another turn
            if (!boxCompleted) {
                currentPlayer = currentPlayer === 1 ? 2 : 1;
                updateTurnIndicator();
            }

            checkGameOver();
        }

        function checkBoxComplete(index) {
            const box = boxes[index];
            return box.top && box.right && box.bottom && box.left;
        }

        function updateScore() {
            document.getElementById('player1Score').textContent = player1Score;
            document.getElementById('player2Score').textContent = player2Score;
        }

        function updateTurnIndicator() {
            const indicator = document.getElementById('turnIndicator');
            const playerName = currentPlayer === 1 
                ? document.getElementById('player1Name').textContent 
                : document.getElementById('player2Name').textContent;
            indicator.textContent = `${playerName}'s Turn`;
            indicator.style.background = currentPlayer === 1 ? '#e3f2fd' : '#ffebee';
        }

        function checkGameOver() {
            const totalBoxes = (gridSize - 1) * (gridSize - 1);
            if (player1Score + player2Score === totalBoxes) {
                gameActive = false;
                setTimeout(showWinner, 500);
            }
        }

        function showWinner() {
            let winner, winnerName, winnerThumb;
            
            if (player1Score > player2Score) {
                winner = 1;
                winnerName = document.getElementById('player1Name').textContent;
                winnerThumb = document.getElementById('player1Thumb').src;
            } else if (player2Score > player1Score) {
                winner = 2;
                winnerName = document.getElementById('player2Name').textContent;
                winnerThumb = document.getElementById('player2Thumb').src;
            } else {
                document.getElementById('winnerText').textContent = "🤝 It's a Tie!";
                document.getElementById('winnerThumb').style.display = 'none';
                document.getElementById('winnerModal').classList.add('active');
                return;
            }

            document.getElementById('winnerText').textContent = `🎉 ${winnerName} Wins!`;
            document.getElementById('winnerThumb').src = winnerThumb;
            document.getElementById('winnerThumb').style.display = 'block';
            document.getElementById('winnerModal').classList.add('active');
        }

        function backToSettings() {
            if (confirm('Are you sure you want to go back to settings? Current game will be lost.')) {
                document.getElementById('gameScreen').classList.remove('active');
                document.getElementById('setupScreen').classList.add('active');
            }
        }
    </script>
    <!-- Vercel Web Analytics -->
    <script type="module" src="analytics-init.js"></script>
</body>
</html>
