<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BGG Collection Rank Grid</title>
<style>
:root{
  --bg:#f5f7fb;--panel:#fff;--ink:#172033;--muted:#6b7280;--line:#d8dee9;
  --accent:#2563eb;--accent2:#1d4ed8;--empty:#eef2f7;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}
a{color:inherit;text-decoration:none}
.app{max-width:1900px;margin:auto;padding:14px}
.topbar{position:sticky;top:0;z-index:20;background:rgba(245,247,251,.94);backdrop-filter:blur(10px);padding:0 0 10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 20px rgba(15,23,42,.06)}
.controls{padding:12px;display:grid;grid-template-columns:minmax(170px,1.2fr) repeat(4,minmax(110px,.55fr)) auto;gap:9px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px}
label{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input,select,button{min-height:38px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);padding:7px 9px}
button{font-weight:800;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:var(--accent2)}
button:disabled{opacity:.4;cursor:not-allowed}
.subbar{margin-top:8px;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.status{font-size:12px;color:var(--muted)}
.status strong{color:var(--ink)}
.pager{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pager button{min-height:32px;padding:5px 10px}
.pageText{font-size:12px;font-weight:800;min-width:185px;text-align:center}
.gridWrap{overflow:auto;padding:2px 0 14px}
.grid{display:grid;gap:8px;min-width:max-content;grid-template-columns:repeat(var(--cols),var(--cell-w))}
.cell{position:relative;width:var(--cell-w);height:var(--cell-h);border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(15,23,42,.05)}
.cell.empty{background:var(--empty);box-shadow:none}
.thumbWrap{position:relative;flex:1;min-height:0;background:#e5e7eb;overflow:hidden}
.thumb{width:100%;height:100%;object-fit:cover;display:block;transition:transform .18s ease}
.gameLink:hover .thumb{transform:scale(1.04)}
.noThumb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;color:#94a3b8;font-size:11px;font-weight:800}
.rankBadge{position:absolute;top:6px;left:6px;z-index:3;background:rgba(15,23,42,.9);color:#fff;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:900;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.badges{position:absolute;left:6px;right:6px;bottom:6px;z-index:3;display:flex;gap:4px;flex-wrap:wrap;align-items:flex-end}
.badge{background:rgba(255,255,255,.94);border:1px solid rgba(15,23,42,.12);border-radius:999px;padding:3px 6px;font-size:8px;font-weight:900;line-height:1;color:#0f172a;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.badge.wishlist{background:#fef3c7;color:#92400e}
.badge.owned{background:#dcfce7;color:#166534}
.badge.prevowned{background:#e2e8f0;color:#334155}
.badge.want{background:#dbeafe;color:#1e40af}
.badge.trade{background:#fae8ff;color:#86198f}
.cardInfo{padding:6px 7px 7px;background:#fff;min-height:43px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.title{font-size:11px;font-weight:850;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.details{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty .rankOnly{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#94a3b8}
.message{display:none;margin-top:8px;padding:10px 12px;font-size:12px}
.message.show{display:block}
.message.error{background:#fff1f2;border-color:#fecdd3;color:#9f1239}
.message.info{background:#eff6ff;border-color:#bfdbfe;color:#1e40af}
.legend{font-size:11px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media(max-width:1050px){.controls{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){.app{padding:7px}.topbar{position:static}.controls{grid-template-columns:1fr 1fr}.field.username{grid-column:1/-1}.controls .primary{grid-column:1/-1}}
</style>
</head>
<body>
<main class="app">
  <div class="topbar">
    <section class="panel controls">
      <div class="field username"><label for="username">BGG username</label><input id="username" value="sportomax" autocomplete="off"></div>
      <div class="field"><label for="layout">Layout</label><select id="layout"><option value="10x10">10 × 10 · 100</option><option value="20x5">20 × 5 · 100</option><option value="15x7">15 × 7 · 105</option><option value="custom">Custom</option></select></div>
      <div class="field"><label for="pageSize">Page size</label><input id="pageSize" type="number" min="1" max="1000" value="100"></div>
      <div class="field"><label for="columns">Columns</label><input id="columns" type="number" min="1" max="50" value="10"></div>
      <div class="field"><label for="cellSize">Card size</label><select id="cellSize"><option value="compact">Compact</option><option value="normal" selected>Normal</option><option value="large">Large</option></select></div>
      <button id="loadBtn" class="primary">Load Collection</button>
    </section>

    <section class="panel subbar">
      <div>
        <div id="status" class="status">Ready · default user <strong>sportomax</strong></div>
        <div class="legend"><span>Thumbnail-first cards</span><span>Collection states appear only as badges</span><span>Blank rank = no matching ranked collection item</span></div>
      </div>
      <div class="pager"><button id="firstBtn">« First</button><button id="prevBtn">‹ Prev</button><span id="pageText" class="pageText">Ranks 1–100</span><button id="nextBtn">Next ›</button><button id="jumpBtn">Jump…</button></div>
    </section>
    <section id="message" class="panel message"></section>
  </div>

  <div class="gridWrap"><section id="grid" class="grid"></section></div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const els = {username:$("username"),layout:$("layout"),pageSize:$("pageSize"),columns:$("columns"),cellSize:$("cellSize"),loadBtn:$("loadBtn"),status:$("status"),grid:$("grid"),pageText:$("pageText"),firstBtn:$("firstBtn"),prevBtn:$("prevBtn"),nextBtn:$("nextBtn"),jumpBtn:$("jumpBtn"),message:$("message")};
  const state = {page:1,pageSize:100,columns:10,rankMap:new Map(),loaded:false,username:"sportomax"};
  const presets = {"10x10":{size:100,cols:10},"20x5":{size:100,cols:20},"15x7":{size:105,cols:15}};

  function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
  function showMessage(text,type="info"){els.message.textContent=text;els.message.className=`panel message show ${type}`}
  function clearMessage(){els.message.textContent="";els.message.className="panel message"}
  function readLayout(){state.pageSize=Math.max(1,Math.min(1000,Number(els.pageSize.value)||100));state.columns=Math.max(1,Math.min(50,Number(els.columns.value)||10));els.pageSize.value=state.pageSize;els.columns.value=state.columns}
  function applySizing(){const sizes={compact:{w:92,h:118},normal:{w:132,h:165},large:{w:175,h:215}};const s=sizes[els.cellSize.value]||sizes.normal;els.grid.style.setProperty("--cols",state.columns);els.grid.style.setProperty("--cell-w",`${s.w}px`);els.grid.style.setProperty("--cell-h",`${s.h}px`)}

  function statusBadges(status){
    const out=[];
    if(!status) return out;
    if(status.own==="1") out.push({text:"Owned",cls:"owned"});
    if(status.prevowned==="1") out.push({text:"Prev. Owned",cls:"prevowned"});
    if(status.fortrade==="1") out.push({text:"For Trade",cls:"trade"});
    if(status.want==="1") out.push({text:"Want",cls:"want"});
    if(status.wanttoplay==="1") out.push({text:"Want to Play",cls:"want"});
    if(status.wanttobuy==="1") out.push({text:"Want to Buy",cls:"want"});
    if(status.preordered==="1") out.push({text:"Preordered",cls:"want"});
    if(status.wishlist==="1") out.push({text:`Wishlist${status.wishlistpriority&&status.wishlistpriority!=="0"?` ${status.wishlistpriority}`:""}`,cls:"wishlist"});
    return out;
  }

  function render(){
    readLayout();applySizing();
    const start=(state.page-1)*state.pageSize+1,end=start+state.pageSize-1;
    els.pageText.textContent=`Ranks ${start.toLocaleString()}–${end.toLocaleString()}`;
    els.firstBtn.disabled=state.page<=1;els.prevBtn.disabled=state.page<=1;
    const frag=document.createDocumentFragment();
    for(let rank=start;rank<=end;rank++){
      const game=state.rankMap.get(rank),cell=document.createElement("article");
      if(!game){cell.className="cell empty";cell.innerHTML=`<div class="rankOnly">${rank}</div>`;frag.appendChild(cell);continue}
      cell.className="cell";
      const badges=statusBadges(game.status).map(b=>`<span class="badge ${b.cls}">${esc(b.text)}</span>`).join("");
      const thumb=game.thumbnail?`<img class="thumb" src="${esc(game.thumbnail)}" alt="${esc(game.name)}" loading="lazy">`:`<div class="noThumb">No thumbnail</div>`;
      const url=`https://boardgamegeek.com/boardgame/${encodeURIComponent(game.objectid)}`;
      cell.innerHTML=`<a class="gameLink thumbWrap" href="${url}" target="_blank" rel="noopener noreferrer"><div class="rankBadge">#${rank}</div>${thumb}${badges?`<div class="badges">${badges}</div>`:""}</a><div class="cardInfo"><div class="title">${esc(game.name)}</div><div class="details">${esc(game.year||"")}</div></div>`;
      frag.appendChild(cell);
    }
    els.grid.replaceChildren(frag);
  }

  function parseCollection(xmlText){
    const doc=new DOMParser().parseFromString(xmlText,"application/xml");
    if(doc.querySelector("parsererror")) throw new Error("BGG returned XML that could not be parsed.");
    const apiError=doc.querySelector("errors error");
    if(apiError) throw new Error(apiError.getAttribute("message")||"BGG API error.");
    const map=new Map(),items=[...doc.querySelectorAll("items > item")];
    for(const item of items){
      const name=item.querySelector(":scope > name")?.textContent?.trim()||"";
      const year=item.querySelector(":scope > yearpublished")?.textContent?.trim()||"";
      const thumbnail=item.querySelector(":scope > thumbnail")?.textContent?.trim()||"";
      const objectid=item.getAttribute("objectid")||"";
      const statusNode=item.querySelector(":scope > status");
      const status=statusNode?Object.fromEntries([...statusNode.attributes].map(a=>[a.name,a.value])):{};
      const rankNodes=[...item.querySelectorAll("stats rating ranks rank")];
      const overall=rankNodes.find(r=>r.getAttribute("name")==="boardgame"||r.getAttribute("id")==="1"||r.getAttribute("friendlyname")==="Board Game Rank");
      const rank=Number(overall?.getAttribute("value"));
      if(Number.isInteger(rank)&&rank>0&&!map.has(rank)) map.set(rank,{name,year,thumbnail,objectid,rank,status});
    }
    return {map,totalItems:items.length};
  }

  async function loadCollection(){
    clearMessage();const username=els.username.value.trim()||"sportomax";state.username=username;state.page=1;els.loadBtn.disabled=true;els.loadBtn.textContent="Loading…";els.status.innerHTML=`Loading <strong>${esc(username)}</strong> from BGG XML API2…`;
    try{
      const qs=new URLSearchParams({endpoint:"collection",username,stats:"1",subtype:"boardgame"});
      const response=await fetch(`/api/bgg-helper?${qs.toString()}`,{cache:"no-store"});
      const text=await response.text();
      if(!response.ok){let detail=text;try{const j=JSON.parse(text);detail=j.message||j.error||text}catch{}throw new Error(detail||`HTTP ${response.status}`)}
      const {map,totalItems}=parseCollection(text);state.rankMap=map;state.loaded=true;
      els.status.innerHTML=`<strong>${esc(username)}</strong> · ${totalItems.toLocaleString()} collection entries across all statuses · ${map.size.toLocaleString()} with usable overall BGG ranks`;
      if(map.size===0) showMessage("Collection loaded, but no numeric overall Board Game Rank values were found. Ranked slots will remain blank.","info");
      render();
    }catch(err){console.error(err);state.rankMap=new Map();state.loaded=false;els.status.innerHTML=`Could not load <strong>${esc(username)}</strong>`;showMessage(`Load failed: ${err.message}`,"error");render()}
    finally{els.loadBtn.disabled=false;els.loadBtn.textContent="Load Collection"}
  }

  els.layout.addEventListener("change",()=>{const p=presets[els.layout.value];if(p){els.pageSize.value=p.size;els.columns.value=p.cols;state.page=1;render()}});
  function customChanged(){els.layout.value="custom";state.page=1;render()}
  els.pageSize.addEventListener("change",customChanged);els.columns.addEventListener("change",customChanged);els.cellSize.addEventListener("change",render);els.loadBtn.addEventListener("click",loadCollection);els.username.addEventListener("keydown",e=>{if(e.key==="Enter")loadCollection()});
  els.firstBtn.addEventListener("click",()=>{state.page=1;render();scrollTo({top:0,behavior:"smooth"})});
  els.prevBtn.addEventListener("click",()=>{if(state.page>1)state.page--;render();scrollTo({top:0,behavior:"smooth"})});
  els.nextBtn.addEventListener("click",()=>{state.page++;render();scrollTo({top:0,behavior:"smooth"})});
  els.jumpBtn.addEventListener("click",()=>{const currentStart=(state.page-1)*state.pageSize+1;const v=prompt("Jump to BGG rank:",String(currentStart));if(v===null)return;const rank=Math.max(1,Math.floor(Number(v)||1));state.page=Math.floor((rank-1)/state.pageSize)+1;render();scrollTo({top:0,behavior:"smooth"})});
  render();loadCollection();
})();
</script>
</body>
</html>
