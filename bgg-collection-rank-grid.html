<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BGG Collection Rank Grid</title>
<style>
:root{
  --bg:#f5f7fb;--panel:#fff;--ink:#172033;--muted:#6b7280;--line:#d8dee9;
  --accent:#2563eb;--accent2:#1d4ed8;--owned:#eef6ff;--ownedLine:#93c5fd;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}
.app{max-width:1800px;margin:auto;padding:14px}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(245,247,251,.94);backdrop-filter:blur(10px);
  padding:0 0 10px;
}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 20px rgba(15,23,42,.06)}
.controls{padding:12px;display:grid;grid-template-columns:minmax(170px,1.2fr) repeat(4,minmax(110px,.55fr)) auto;gap:9px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px}
label{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input,select,button{
  min-height:38px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);padding:7px 9px
}
button{font-weight:800;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:var(--accent2)}
button:disabled{opacity:.4;cursor:not-allowed}
.subbar{margin-top:8px;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.status{font-size:12px;color:var(--muted)}
.status strong{color:var(--ink)}
.pager{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pager button{min-height:32px;padding:5px 10px}
.pageText{font-size:12px;font-weight:800;min-width:185px;text-align:center}
.gridWrap{overflow:auto;padding:2px 0 14px}
.grid{
  display:grid;gap:5px;min-width:max-content;
  grid-template-columns:repeat(var(--cols),var(--cell-w));
}
.cell{
  width:var(--cell-w);height:var(--cell-h);
  border:1px solid var(--line);border-radius:7px;background:#fff;padding:6px;
  display:flex;flex-direction:column;overflow:hidden;
}
.cell.owned{background:var(--owned);border-color:var(--ownedLine)}
.rank{font-size:11px;font-weight:900;color:#334155;line-height:1}
.title{
  flex:1;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:4px 2px;font-size:12px;font-weight:800;line-height:1.12;
  overflow:hidden;word-break:break-word;
}
.title:empty::after{content:"";display:block}
.details{font-size:9px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:11px}
.message{display:none;margin-top:8px;padding:10px 12px;font-size:12px}
.message.show{display:block}
.message.error{background:#fff1f2;border-color:#fecdd3;color:#9f1239}
.message.info{background:#eff6ff;border-color:#bfdbfe;color:#1e40af}
.legend{font-size:11px;color:var(--muted);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.swatch{width:12px;height:12px;border-radius:3px;background:var(--owned);border:1px solid var(--ownedLine);display:inline-block;vertical-align:-2px;margin-right:4px}
@media(max-width:1050px){.controls{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){
  .app{padding:7px}.topbar{position:static}.controls{grid-template-columns:1fr 1fr}
  .field.username{grid-column:1/-1}.controls .primary{grid-column:1/-1}
}
</style>
</head>
<body>
<main class="app">
  <div class="topbar">
    <section class="panel controls">
      <div class="field username">
        <label for="username">BGG username</label>
        <input id="username" value="sportomax" autocomplete="off">
      </div>

      <div class="field">
        <label for="layout">Layout</label>
        <select id="layout">
          <option value="10x10">10 × 10 · 100</option>
          <option value="20x5">20 × 5 · 100</option>
          <option value="15x7">15 × 7 · 105</option>
          <option value="custom">Custom</option>
        </select>
      </div>

      <div class="field">
        <label for="pageSize">Page size</label>
        <input id="pageSize" type="number" min="1" max="1000" value="100">
      </div>

      <div class="field">
        <label for="columns">Columns</label>
        <input id="columns" type="number" min="1" max="50" value="10">
      </div>

      <div class="field">
        <label for="cellSize">Box size</label>
        <select id="cellSize">
          <option value="compact">Compact</option>
          <option value="normal" selected>Normal</option>
          <option value="large">Large</option>
        </select>
      </div>

      <button id="loadBtn" class="primary">Load Collection</button>
    </section>

    <section class="panel subbar">
      <div>
        <div id="status" class="status">Ready · default user <strong>sportomax</strong></div>
        <div class="legend"><span><span class="swatch"></span>Owned rank found</span><span>Blank title = no owned game at that rank</span></div>
      </div>
      <div class="pager">
        <button id="firstBtn">« First</button>
        <button id="prevBtn">‹ Prev</button>
        <span id="pageText" class="pageText">Ranks 1–100</span>
        <button id="nextBtn">Next ›</button>
        <button id="jumpBtn">Jump…</button>
      </div>
    </section>

    <section id="message" class="panel message"></section>
  </div>

  <div class="gridWrap">
    <section id="grid" class="grid"></section>
  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const els = {
    username:$("username"), layout:$("layout"), pageSize:$("pageSize"), columns:$("columns"),
    cellSize:$("cellSize"), loadBtn:$("loadBtn"), status:$("status"), grid:$("grid"),
    pageText:$("pageText"), firstBtn:$("firstBtn"), prevBtn:$("prevBtn"),
    nextBtn:$("nextBtn"), jumpBtn:$("jumpBtn"), message:$("message")
  };

  const state = {
    page: 1,
    pageSize: 100,
    columns: 10,
    rankMap: new Map(),
    loaded: false,
    username: "sportomax"
  };

  const presets = {
    "10x10": {size:100, cols:10},
    "20x5":  {size:100, cols:20},
    "15x7":  {size:105, cols:15}
  };

  function esc(s){
    return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  }

  function showMessage(text, type="info"){
    els.message.textContent = text;
    els.message.className = `panel message show ${type}`;
  }
  function clearMessage(){
    els.message.textContent = "";
    els.message.className = "panel message";
  }

  function readLayout(){
    state.pageSize = Math.max(1, Math.min(1000, Number(els.pageSize.value) || 100));
    state.columns = Math.max(1, Math.min(50, Number(els.columns.value) || 10));
    els.pageSize.value = state.pageSize;
    els.columns.value = state.columns;
  }

  function applySizing(){
    const sizes = {
      compact:{w:86,h:76},
      normal:{w:118,h:102},
      large:{w:154,h:128}
    };
    const s = sizes[els.cellSize.value] || sizes.normal;
    els.grid.style.setProperty("--cols", state.columns);
    els.grid.style.setProperty("--cell-w", `${s.w}px`);
    els.grid.style.setProperty("--cell-h", `${s.h}px`);
  }

  function render(){
    readLayout();
    applySizing();

    const start = (state.page - 1) * state.pageSize + 1;
    const end = start + state.pageSize - 1;
    els.pageText.textContent = `Ranks ${start.toLocaleString()}–${end.toLocaleString()}`;
    els.firstBtn.disabled = state.page <= 1;
    els.prevBtn.disabled = state.page <= 1;

    const frag = document.createDocumentFragment();
    for(let rank=start; rank<=end; rank++){
      const game = state.rankMap.get(rank);
      const cell = document.createElement("article");
      cell.className = `cell${game ? " owned" : ""}`;
      cell.title = game ? `${game.name} · BGG rank ${rank}` : `BGG rank ${rank}`;
      cell.innerHTML = `
        <div class="rank">${rank}</div>
        <div class="title">${game ? esc(game.name) : ""}</div>
        <div class="details">${game ? esc(game.year || "") : ""}</div>
      `;
      frag.appendChild(cell);
    }
    els.grid.replaceChildren(frag);
  }

  function parseCollection(xmlText){
    const doc = new DOMParser().parseFromString(xmlText, "application/xml");
    if(doc.querySelector("parsererror")) throw new Error("BGG returned XML that could not be parsed.");

    const apiError = doc.querySelector("errors error");
    if(apiError) throw new Error(apiError.getAttribute("message") || "BGG API error.");

    const map = new Map();
    const items = [...doc.querySelectorAll("items > item")];

    for(const item of items){
      const name = item.querySelector(":scope > name")?.textContent?.trim() || "";
      const year = item.querySelector(":scope > yearpublished")?.textContent?.trim() || "";
      const objectid = item.getAttribute("objectid") || "";

      const rankNodes = [...item.querySelectorAll("stats rating ranks rank")];
      const overall = rankNodes.find(r =>
        r.getAttribute("name") === "boardgame" ||
        r.getAttribute("id") === "1" ||
        r.getAttribute("friendlyname") === "Board Game Rank"
      );

      const raw = overall?.getAttribute("value");
      const rank = Number(raw);
      if(Number.isInteger(rank) && rank > 0){
        if(!map.has(rank)) map.set(rank,{name,year,objectid,rank});
      }
    }

    return {map, totalItems:items.length};
  }

  async function loadCollection(){
    clearMessage();
    const username = els.username.value.trim() || "sportomax";
    state.username = username;
    state.page = 1;
    els.loadBtn.disabled = true;
    els.loadBtn.textContent = "Loading…";
    els.status.innerHTML = `Loading <strong>${esc(username)}</strong> from BGG XML API2…`;

    try{
      const qs = new URLSearchParams({
        endpoint:"collection",
        username,
        own:"1",
        stats:"1",
        subtype:"boardgame"
      });
      const response = await fetch(`/api/bgg-helper?${qs.toString()}`, {cache:"no-store"});
      const text = await response.text();

      if(!response.ok){
        let detail = text;
        try{
          const j = JSON.parse(text);
          detail = j.message || j.error || text;
        }catch{}
        throw new Error(detail || `HTTP ${response.status}`);
      }

      const {map,totalItems} = parseCollection(text);
      state.rankMap = map;
      state.loaded = true;

      els.status.innerHTML =
        `<strong>${esc(username)}</strong> · ${totalItems.toLocaleString()} owned collection entries · ` +
        `${map.size.toLocaleString()} with usable overall BGG ranks`;

      if(map.size === 0){
        showMessage("Collection loaded, but no numeric overall Board Game Rank values were found. Ranked slots will remain blank.", "info");
      }
      render();
    }catch(err){
      console.error(err);
      state.rankMap = new Map();
      state.loaded = false;
      els.status.innerHTML = `Could not load <strong>${esc(username)}</strong>`;
      showMessage(`Load failed: ${err.message}`, "error");
      render();
    }finally{
      els.loadBtn.disabled = false;
      els.loadBtn.textContent = "Load Collection";
    }
  }

  els.layout.addEventListener("change", () => {
    const p = presets[els.layout.value];
    if(p){
      els.pageSize.value = p.size;
      els.columns.value = p.cols;
      state.page = 1;
      render();
    }
  });

  function customChanged(){
    els.layout.value = "custom";
    state.page = 1;
    render();
  }

  els.pageSize.addEventListener("change", customChanged);
  els.columns.addEventListener("change", customChanged);
  els.cellSize.addEventListener("change", render);
  els.loadBtn.addEventListener("click", loadCollection);
  els.username.addEventListener("keydown", e => { if(e.key === "Enter") loadCollection(); });

  els.firstBtn.addEventListener("click", () => { state.page=1; render(); scrollTo({top:0,behavior:"smooth"}); });
  els.prevBtn.addEventListener("click", () => { if(state.page>1) state.page--; render(); scrollTo({top:0,behavior:"smooth"}); });
  els.nextBtn.addEventListener("click", () => { state.page++; render(); scrollTo({top:0,behavior:"smooth"}); });
  els.jumpBtn.addEventListener("click", () => {
    const currentStart = (state.page - 1) * state.pageSize + 1;
    const v = prompt("Jump to BGG rank:", String(currentStart));
    if(v === null) return;
    const rank = Math.max(1, Math.floor(Number(v) || 1));
    state.page = Math.floor((rank - 1) / state.pageSize) + 1;
    render();
    scrollTo({top:0,behavior:"smooth"});
  });

  render();
  loadCollection();
})();
</script>
</body>
</html>
