<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>VFM Explorer - Board Game Virtual Flea Market</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>💰</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 80px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            backdrop-filter: blur(10px);
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        
        .header-subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 16px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .loading-section {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }
        
        .loading-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .loading-title {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
            border-radius: 4px;
        }
        
        .progress-items {
            max-height: 200px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 8px;
        }
        
        .progress-item {
            padding: 8px 12px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .progress-item .icon {
            font-size: 16px;
        }
        
        .progress-item.loading {
            background: #fff3cd;
        }
        
        .progress-item.success {
            background: #d4edda;
        }
        
        .progress-item.error {
            background: #f8d7da;
        }
        
        .controls {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }
        
        .search-box {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            margin-bottom: 16px;
            transition: all 0.3s;
        }
        
        .search-box:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .filter-section {
            margin-bottom: 16px;
        }
        
        .filter-label {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: block;
        }
        
        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #333;
        }
        
        .filter-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }
        
        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }
        
        .sort-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 8px;
        }
        
        .sort-btn {
            padding: 10px 16px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .sort-btn:hover {
            border-color: #667eea;
        }
        
        .sort-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
            margin-bottom: 40px;
        }
        
        @media (max-width: 768px) {
            .games-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .game-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            transition: all 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }
        
        .game-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        
        .game-thumbnail {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .game-content {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .game-name {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 8px;
            line-height: 1.3;
        }
        
        .game-list-name {
            font-size: 12px;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
            margin-bottom: 12px;
            font-weight: 600;
        }
        
        .game-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid #e0e0e0;
        }
        
        .game-meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            color: #666;
        }
        
        .game-meta-item .icon {
            font-size: 16px;
        }
        
        .game-price {
            font-size: 20px;
            font-weight: 700;
            color: #667eea;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal.active {
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        
        .modal-content {
            background: white;
            border-radius: 16px;
            max-width: 800px;
            width: 100%;
            margin: 40px auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.3s;
        }
        
        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .modal-header {
            padding: 24px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
        }
        
        .modal-header-content {
            flex: 1;
        }
        
        .modal-title {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        
        .modal-subtitle {
            color: #666;
            font-size: 14px;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 32px;
            color: #999;
            cursor: pointer;
            line-height: 1;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: all 0.2s;
        }
        
        .modal-close:hover {
            background: #f5f5f5;
            color: #333;
        }
        
        .modal-body {
            padding: 24px;
            max-height: 60vh;
            overflow-y: auto;
        }
        
        .modal-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
            padding: 16px;
            background: #f5f5f5;
            border-radius: 12px;
        }
        
        .modal-info-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .modal-info-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        
        .modal-info-value {
            font-size: 16px;
            color: #1a1a1a;
            font-weight: 600;
        }
        
        .modal-body-content {
            line-height: 1.6;
            color: #333;
            margin-bottom: 24px;
        }
        
        .modal-comments {
            margin-top: 24px;
        }
        
        .modal-comments-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #1a1a1a;
        }
        
        .comment {
            background: #f5f5f5;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        
        .comment-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .comment-user {
            font-weight: 600;
            color: #667eea;
        }
        
        .comment-date {
            font-size: 12px;
            color: #999;
        }
        
        .comment-text {
            color: #333;
            line-height: 1.5;
        }
        
        .modal-actions {
            padding: 20px 24px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 12px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .modal-btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .modal-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .modal-btn-secondary {
            background: #f5f5f5;
            color: #333;
        }
        
        .modal-btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }
        
        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        
        .empty-state-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .empty-state-text {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(102, 126, 234, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        
        .loading-overlay.hidden {
            display: none;
        }
        
        .loading-content {
            text-align: center;
            color: white;
        }
        
        .loading-logo {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .loading-text {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .loading-subtext {
            font-size: 16px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-logo">💰</div>
            <div class="loading-text">VFM Explorer</div>
            <div class="loading-subtext">Loading board game listings...</div>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>💰 VFM Explorer</h1>
            <div class="header-subtitle">Browse all Virtual Flea Market listings from multiple years and events</div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="totalGames">0</div>
                    <div class="stat-label">Total Games</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalLists">0</div>
                    <div class="stat-label">VFM Lists</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="visibleGames">0</div>
                    <div class="stat-label">Showing</div>
                </div>
            </div>
        </div>

        <div class="loading-section" id="loadingSection">
            <div class="loading-header">
                <div class="loading-title">Loading VFM Data</div>
                <div class="loading-spinner"></div>
            </div>
            
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            
            <div class="progress-items" id="progressItems"></div>
        </div>

        <div class="controls">
            <input 
                type="text" 
                class="search-box" 
                id="searchBox" 
                placeholder="🔍 Search by game name..."
            >
            
            <div class="filter-section">
                <label class="filter-label">Filter by VFM List</label>
                <div class="filter-buttons" id="filterButtons"></div>
            </div>
            
            <div class="filter-section">
                <label class="filter-label">Sort By</label>
                <div class="sort-controls">
                    <button class="sort-btn active" data-sort="date-desc">
                        📅 Date ↓
                    </button>
                    <button class="sort-btn" data-sort="date-asc">
                        📅 Date ↑
                    </button>
                    <button class="sort-btn" data-sort="name-asc">
                        🔤 Name A-Z
                    </button>
                    <button class="sort-btn" data-sort="name-desc">
                        🔤 Name Z-A
                    </button>
                    <button class="sort-btn" data-sort="price-asc">
                        💰 Price ↑
                    </button>
                    <button class="sort-btn" data-sort="price-desc">
                        💰 Price ↓
                    </button>
                    <button class="sort-btn" data-sort="comments-desc">
                        💬 Comments ↓
                    </button>
                </div>
            </div>
        </div>

        <div class="games-grid" id="gamesGrid"></div>
        
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-state-icon">🔍</div>
            <div class="empty-state-title">No games found</div>
            <div class="empty-state-text">Try adjusting your filters or search terms</div>
        </div>
    </div>

    <div class="modal" id="gameModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-header-content">
                    <div class="modal-title" id="modalTitle"></div>
                    <div class="modal-subtitle" id="modalSubtitle"></div>
                </div>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            
            <div class="modal-body">
                <div class="modal-info" id="modalInfo"></div>
                <div class="modal-body-content" id="modalBody"></div>
                <div class="modal-comments" id="modalComments"></div>
            </div>
            
            <div class="modal-actions">
                <button class="modal-btn modal-btn-primary" id="modalBggBtn">
                    🎲 View on BGG
                </button>
                <button class="modal-btn modal-btn-secondary" id="modalListBtn">
                    📋 View Listing Page
                </button>
            </div>
        </div>
    </div>

    <script>
        // VFM data sources configuration
        const VFM_SOURCES = [
            // Main VFM files
            { file: 'vfm22bgg.xml', name: 'BGG.CON 2022', year: 2022, type: 'bgg' },
            { file: 'vfm22dte.xml', name: 'DTE 2022', year: 2022, type: 'dte' },
            { file: 'vfm22dtw.xml', name: 'DTW 2022', year: 2022, type: 'dtw' },
            { file: 'vfm22spr.xml', name: 'SPR 2022', year: 2022, type: 'spr' },
            { file: 'vfm23bgg.xml', name: 'BGG.CON 2023', year: 2023, type: 'bgg' },
            { file: 'vfm23dte.xml', name: 'DTE 2023', year: 2023, type: 'dte' },
            { file: 'vfm23dtw.xml', name: 'DTW 2023', year: 2023, type: 'dtw' },
            { file: 'vfm23spr.xml', name: 'SPR 2023', year: 2023, type: 'spr' },
            { file: 'vfm24bgg.xml', name: 'BGG.CON 2024', year: 2024, type: 'bgg' },
            { file: 'vfm24dte.xml', name: 'DTE 2024', year: 2024, type: 'dte' },
            { file: 'vfm24dtw.xml', name: 'DTW 2024', year: 2024, type: 'dtw' },
            { file: 'vfm24spr.xml', name: 'SPR 2024', year: 2024, type: 'spr' },
            { file: 'vfm25bgg.xml', name: 'BGG.CON 2025', year: 2025, type: 'bgg' },
            { file: 'vfm25dte.xml', name: 'DTE 2025', year: 2025, type: 'dte' },
            { file: 'vfm25spr.xml', name: 'SPR 2025', year: 2025, type: 'spr' },
            { file: 'vfmdenverco.xml', name: 'Denver CO', year: 2025, type: 'local' },
        ];

        // Global state
        let allGames = [];
        let filteredGames = [];
        let activeFilters = new Set();
        let currentSort = 'date-desc';
        let searchTerm = '';
        
        // Initialize app
        document.addEventListener('DOMContentLoaded', () => {
            loadAllVFMData();
            setupEventListeners();
        });
        
        // Load all VFM data in parallel
        async function loadAllVFMData() {
            const progressItems = document.getElementById('progressItems');
            const progressFill = document.getElementById('progressFill');
            
            let loaded = 0;
            const total = VFM_SOURCES.length;
            
            // Create progress items for each source
            VFM_SOURCES.forEach(source => {
                const item = document.createElement('div');
                item.className = 'progress-item loading';
                item.id = `progress-${source.file}`;
                item.innerHTML = `
                    <span class="icon">⏳</span>
                    <span>${source.name}</span>
                `;
                progressItems.appendChild(item);
            });
            
            // Load all files in parallel
            const promises = VFM_SOURCES.map(source => 
                loadVFMFile(source)
                    .then(games => {
                        loaded++;
                        const progress = (loaded / total) * 100;
                        progressFill.style.width = `${progress}%`;
                        
                        const item = document.getElementById(`progress-${source.file}`);
                        item.className = 'progress-item success';
                        item.innerHTML = `
                            <span class="icon">✅</span>
                            <span>${source.name} (${games.length} games)</span>
                        `;
                        
                        return games;
                    })
                    .catch(error => {
                        loaded++;
                        const progress = (loaded / total) * 100;
                        progressFill.style.width = `${progress}%`;
                        
                        const item = document.getElementById(`progress-${source.file}`);
                        item.className = 'progress-item error';
                        item.innerHTML = `
                            <span class="icon">❌</span>
                            <span>${source.name} (failed)</span>
                        `;
                        
                        return [];
                    })
            );
            
            const results = await Promise.all(promises);
            allGames = results.flat();
            
            // Hide loading overlay and section
            document.getElementById('loadingOverlay').classList.add('hidden');
            document.getElementById('loadingSection').style.display = 'none';
            
            // Update stats
            updateStats();
            
            // Create filter buttons
            createFilterButtons();
            
            // Initial render
            filterAndRender();
        }
        
        // Load a single VFM file
        async function loadVFMFile(source) {
            try {
                const response = await fetch(source.file);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const text = await response.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, 'text/xml');
                
                const games = [];
                const items = xml.querySelectorAll('item');
                
                items.forEach(item => {
                    // Skip rule items
                    const objectName = item.getAttribute('objectname');
                    if (objectName === 'RULES') return;
                    
                    const body = item.querySelector('body')?.textContent || '';
                    
                    // Try to extract price from body
                    const price = extractPrice(body);
                    
                    // Check if sold
                    const isSold = body.toLowerCase().includes('+sold+') || 
                                   body.toLowerCase().includes('sold to');
                    
                    const game = {
                        id: item.getAttribute('id'),
                        objectId: item.getAttribute('objectid'),
                        name: objectName,
                        username: item.getAttribute('username'),
                        postDate: item.getAttribute('postdate'),
                        editDate: item.getAttribute('editdate'),
                        imageId: item.getAttribute('imageid'),
                        body: body,
                        price: price,
                        isSold: isSold,
                        listName: source.name,
                        listFile: source.file,
                        year: source.year,
                        type: source.type,
                        comments: Array.from(item.querySelectorAll('comment')).map(comment => ({
                            username: comment.getAttribute('username'),
                            date: comment.getAttribute('postdate'),
                            text: comment.textContent
                        }))
                    };
                    
                    games.push(game);
                });
                
                return games;
            } catch (error) {
                console.error(`Error loading ${source.file}:`, error);
                return [];
            }
        }
        
        // Extract price from body text
        function extractPrice(text) {
            // Look for common price patterns
            const patterns = [
                /\$(\d+(?:\.\d{2})?)/,  // $20 or $20.00
                /€(\d+(?:\.\d{2})?)/,   // €20 or €20.00
                /£(\d+(?:\.\d{2})?)/,   // £20 or £20.00
                /(\d+)\s*(?:dollars?|usd)/i,
                /(?:price|asking|bin|buy.*now).*?[:\s]+\$?(\d+)/i,
            ];
            
            for (const pattern of patterns) {
                const match = text.match(pattern);
                if (match) {
                    return parseFloat(match[1]);
                }
            }
            
            return null;
        }
        
        // Format price for display
        function formatPrice(price) {
            if (price === null || price === undefined) return 'Price not listed';
            return `$${price.toFixed(2)}`;
        }
        
        // Create filter buttons
        function createFilterButtons() {
            const filterButtons = document.getElementById('filterButtons');
            const uniqueLists = [...new Set(allGames.map(g => g.listName))].sort();
            
            // Add "All" button
            const allBtn = document.createElement('button');
            allBtn.className = 'filter-btn active';
            allBtn.textContent = 'All Lists';
            allBtn.onclick = () => {
                activeFilters.clear();
                updateFilterButtons();
                filterAndRender();
            };
            filterButtons.appendChild(allBtn);
            
            // Add button for each list
            uniqueLists.forEach(listName => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.textContent = listName;
                btn.dataset.list = listName;
                btn.onclick = () => toggleFilter(listName);
                filterButtons.appendChild(btn);
            });
        }
        
        // Toggle filter
        function toggleFilter(listName) {
            if (activeFilters.has(listName)) {
                activeFilters.delete(listName);
            } else {
                activeFilters.add(listName);
            }
            updateFilterButtons();
            filterAndRender();
        }
        
        // Update filter button states
        function updateFilterButtons() {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                if (btn.textContent === 'All Lists') {
                    btn.classList.toggle('active', activeFilters.size === 0);
                } else {
                    btn.classList.toggle('active', activeFilters.has(btn.dataset.list));
                }
            });
        }
        
        // Filter and render games
        function filterAndRender() {
            // Apply filters
            filteredGames = allGames.filter(game => {
                // Filter by list
                if (activeFilters.size > 0 && !activeFilters.has(game.listName)) {
                    return false;
                }
                
                // Filter by search term
                if (searchTerm && !game.name.toLowerCase().includes(searchTerm.toLowerCase())) {
                    return false;
                }
                
                return true;
            });
            
            // Apply sorting
            sortGames();
            
            // Render
            renderGames();
            updateStats();
        }
        
        // Sort games
        function sortGames() {
            const [field, direction] = currentSort.split('-');
            
            filteredGames.sort((a, b) => {
                let aVal, bVal;
                
                switch (field) {
                    case 'date':
                        aVal = new Date(a.postDate).getTime();
                        bVal = new Date(b.postDate).getTime();
                        break;
                    case 'name':
                        aVal = a.name.toLowerCase();
                        bVal = b.name.toLowerCase();
                        break;
                    case 'price':
                        aVal = a.price || 0;
                        bVal = b.price || 0;
                        break;
                    case 'comments':
                        aVal = a.comments.length;
                        bVal = b.comments.length;
                        break;
                    default:
                        return 0;
                }
                
                if (direction === 'asc') {
                    return aVal > bVal ? 1 : -1;
                } else {
                    return aVal < bVal ? 1 : -1;
                }
            });
        }
        
        // Render games
        function renderGames() {
            const grid = document.getElementById('gamesGrid');
            const emptyState = document.getElementById('emptyState');
            
            if (filteredGames.length === 0) {
                grid.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }
            
            grid.style.display = 'grid';
            emptyState.style.display = 'none';
            
            grid.innerHTML = filteredGames.map(game => createGameCard(game)).join('');
            
            // Add click handlers
            document.querySelectorAll('.game-card').forEach(card => {
                card.addEventListener('click', () => {
                    const gameId = card.dataset.gameId;
                    const game = allGames.find(g => g.id === gameId);
                    if (game) showGameModal(game);
                });
            });
        }
        
        // Create game card HTML
        function createGameCard(game) {
            const imageUrl = game.imageId && game.imageId !== '0' 
                ? `https://cf.geekdo-images.com/imagepage/img/${game.imageId}` 
                : '';
            
            const thumbnailHtml = imageUrl 
                ? `<img src="${imageUrl}" alt="${game.name}" class="game-thumbnail">`
                : `<div class="game-thumbnail"></div>`;
            
            const date = new Date(game.postDate).toLocaleDateString();
            
            return `
                <div class="game-card" data-game-id="${game.id}">
                    ${thumbnailHtml}
                    <div class="game-content">
                        <div class="game-name">${escapeHtml(game.name)}</div>
                        <span class="game-list-name">${escapeHtml(game.listName)}</span>
                        
                        <div class="game-meta">
                            <div class="game-meta-item game-price">
                                ${formatPrice(game.price)}
                            </div>
                            <div class="game-meta-item">
                                <span class="icon">💬</span>
                                ${game.comments.length}
                            </div>
                            <div class="game-meta-item">
                                <span class="icon">📅</span>
                                ${date}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // Show game modal
        function showGameModal(game) {
            const modal = document.getElementById('gameModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalSubtitle = document.getElementById('modalSubtitle');
            const modalInfo = document.getElementById('modalInfo');
            const modalBody = document.getElementById('modalBody');
            const modalComments = document.getElementById('modalComments');
            const modalBggBtn = document.getElementById('modalBggBtn');
            const modalListBtn = document.getElementById('modalListBtn');
            
            // Set title
            modalTitle.textContent = game.name;
            modalSubtitle.textContent = `Posted by ${game.username} on ${game.listName}`;
            
            // Set info
            const date = new Date(game.postDate).toLocaleDateString();
            modalInfo.innerHTML = `
                <div class="modal-info-item">
                    <div class="modal-info-label">Price</div>
                    <div class="modal-info-value">${formatPrice(game.price)}</div>
                </div>
                <div class="modal-info-item">
                    <div class="modal-info-label">Posted</div>
                    <div class="modal-info-value">${date}</div>
                </div>
                <div class="modal-info-item">
                    <div class="modal-info-label">Seller</div>
                    <div class="modal-info-value">${escapeHtml(game.username)}</div>
                </div>
                <div class="modal-info-item">
                    <div class="modal-info-label">Comments</div>
                    <div class="modal-info-value">${game.comments.length}</div>
                </div>
            `;
            
            // Set body (strip BBCode tags for basic formatting)
            const formattedBody = formatBodyText(game.body);
            modalBody.innerHTML = `<div style="white-space: pre-wrap;">${formattedBody}</div>`;
            
            // Set comments
            if (game.comments.length > 0) {
                const commentsHtml = game.comments.map(comment => {
                    const commentDate = new Date(comment.date).toLocaleDateString();
                    return `
                        <div class="comment">
                            <div class="comment-header">
                                <span class="comment-user">${escapeHtml(comment.username)}</span>
                                <span class="comment-date">${commentDate}</span>
                            </div>
                            <div class="comment-text">${escapeHtml(comment.text)}</div>
                        </div>
                    `;
                }).join('');
                
                modalComments.innerHTML = `
                    <div class="modal-comments-title">💬 Comments (${game.comments.length})</div>
                    ${commentsHtml}
                `;
                modalComments.style.display = 'block';
            } else {
                modalComments.style.display = 'none';
            }
            
            // Set button actions
            modalBggBtn.onclick = () => {
                window.open(`https://boardgamegeek.com/boardgame/${game.objectId}`, '_blank');
            };
            
            modalListBtn.onclick = () => {
                // Construct URL to BGG geeklist item
                const geeklistId = game.listFile.match(/\d+/)?.[0];
                if (geeklistId) {
                    window.open(`https://boardgamegeek.com/geeklist/${geeklistId}/item/${game.id}`, '_blank');
                }
            };
            
            // Show modal
            modal.classList.add('active');
        }
        
        // Format body text (basic BBCode stripping)
        function formatBodyText(text) {
            return escapeHtml(text)
                .replace(/\[b\](.*?)\[\/b\]/gi, '<strong>$1</strong>')
                .replace(/\[i\](.*?)\[\/i\]/gi, '<em>$1</em>')
                .replace(/\[u\](.*?)\[\/u\]/gi, '<u>$1</u>')
                .replace(/\n/g, '<br>');
        }
        
        // Update stats
        function updateStats() {
            document.getElementById('totalGames').textContent = allGames.length.toLocaleString();
            document.getElementById('totalLists').textContent = new Set(allGames.map(g => g.listName)).size;
            document.getElementById('visibleGames').textContent = filteredGames.length.toLocaleString();
        }
        
        // Setup event listeners
        function setupEventListeners() {
            // Search
            const searchBox = document.getElementById('searchBox');
            searchBox.addEventListener('input', (e) => {
                searchTerm = e.target.value;
                filterAndRender();
            });
            
            // Sort buttons
            document.querySelectorAll('.sort-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentSort = btn.dataset.sort;
                    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    filterAndRender();
                });
            });
            
            // Modal close
            const modal = document.getElementById('gameModal');
            const modalClose = document.getElementById('modalClose');
            
            modalClose.addEventListener('click', () => {
                modal.classList.remove('active');
            });
            
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                }
            });
        }
        
        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
