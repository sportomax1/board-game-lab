<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>RankStore Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --accent: #ec4899;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), transparent),
                              radial-gradient(circle at bottom left, rgba(236, 72, 153, 0.1), transparent);
            color: #f8fafc;
            min-height: 100vh;
            overscroll-behavior: none;
            padding-bottom: 80px;
        }

        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.3s ease-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            padding: 0.5rem;
            transition-property: all;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 150ms;
            color: #64748b;
        }
        .tab-btn.active {
            color: #818cf8;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }

        .history-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1rem;
            border-bottom-width: 1px;
            border-color: rgba(255, 255, 255, 0.05);
            transition: all 0.2s;
            cursor: pointer;
        }
        .history-row:hover { background-color: rgba(255, 255, 255, 0.05); }

        .game-thumb-sm {
            width: 40px; height: 40px; border-radius: 8px; object-fit: contain;
            background: rgba(15, 23, 42, 0.5); padding: 2px; flex-shrink: 0;
        }

        .mini-sparkline {
            width: 60px; height: 20px; opacity: 0.6;
        }

        input, select {
            background-color: rgba(15, 23, 42, 0.5) !important;
            border: 1px solid #334155 !important;
            padding: 0.75rem 1rem !important;
            border-radius: 0.75rem !important;
            font-size: 0.875rem !important;
            outline: 2px solid transparent !important;
            outline-offset: 2px !important;
            width: 100% !important;
            transition: all 0.2s !important;
            color: #ffffff !important;
        }
        input:focus, select:focus {
            border-color: #6366f1 !important;
        }
        input::placeholder { color: #475569; }

        .btn-primary {
            background-color: #4f46e5;
            color: #ffffff;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.75rem;
            padding-top: 1rem;
            padding-bottom: 1rem;
            border-radius: 1rem;
            transition: all 0.2s;
            box-shadow: 0 10px 15px -3px rgba(49, 46, 129, 0.2);
            border: none;
            cursor: pointer;
            width: 100%;
        }
        .btn-primary:hover { background-color: #6366f1; }
        .btn-primary:active { transform: scale(0.95); }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background-color: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(12px);
        }
        .modal-overlay.open { display: flex; }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 1.5rem;
            text-align: center;
            flex: 1;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Header -->
        <header class="glass rounded-[2.5rem] p-6 md:p-8 flex justify-between items-center shadow-2xl">
            <div class="space-y-1">
                <h1 class="text-2xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-pink-400 uppercase">RankStore Pro</h1>
                <p id="recordCount" class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Initializing...</p>
            </div>
            <div id="syncStatus" class="w-3 h-3 rounded-full bg-slate-700"></div>
        </header>

        <!-- MAIN VIEWS -->
        <main>
            <!-- FETCH VIEW -->
            <section id="view-fetch" class="view active space-y-6">
                <div class="glass rounded-[2rem] p-8 space-y-6">
                    <div class="flex items-center gap-3">
                        <span class="text-2xl">⚡</span>
                        <h2 class="text-xl font-black uppercase tracking-tight">Sync Collection</h2>
                    </div>
                    
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-2">BGG Username</label>
                        <input type="text" id="usernameInput" value="sportomax" placeholder="e.g. sportomax">
                    </div>

                    <button onclick="syncData()" id="syncBtn" class="btn-primary w-full">Start Sync</button>
                    
                    <div id="fetchLogs" class="text-[10px] font-mono text-indigo-400 bg-slate-950/50 p-4 rounded-2xl border border-slate-800 min-h-[60px] max-h-40 overflow-y-auto custom-scrollbar">
                        Ready to sync.
                    </div>
                </div>

                <div id="lastSyncCard" class="hidden glass rounded-[2rem] p-8 space-y-4">
                    <h3 class="text-xs font-black text-slate-500 uppercase tracking-widest">Last Sync Summary</h3>
                    <div class="flex gap-3" id="syncStats">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- Maintenance Area -->
                <div class="glass rounded-[2rem] p-8 border-red-500/20 space-y-6">
                    <div class="flex items-center gap-3">
                        <span class="text-2xl">🛠️</span>
                        <h2 class="text-xl font-black uppercase tracking-tight text-red-400">Maintenance</h2>
                    </div>
                    <p class="text-xs text-slate-400">Keep your database lean by removing outdated or invalid records.</p>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <button onclick="cleanupNonOwned()" class="glass border-red-500/30 text-red-400 py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-red-500/10 transition-all">
                            Delete Non-Owned
                        </button>
                        <button onclick="cleanupInvalidRanks()" class="glass border-orange-500/30 text-orange-400 py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-orange-500/10 transition-all">
                            Delete Null Ranks
                        </button>
                    </div>
                </div>
            </section>

            <!-- HISTORY VIEW -->
            <section id="view-history" class="view space-y-6">
                <div class="flex flex-col md:flex-row gap-3">
                    <input type="text" id="historySearch" placeholder="Search games..." oninput="renderHistory()">
                    <select id="historyFilter" onchange="renderHistory()">
                        <option value="all">All Periods</option>
                        <option value="7">Last 7 Days</option>
                        <option value="30">Last 30 Days</option>
                    </select>
                </div>
                <div class="glass rounded-[2.5rem] overflow-hidden" id="historyContainer">
                    <!-- History rows -->
                </div>
            </section>

            <!-- TRENDS VIEW -->
            <section id="view-trends" class="view space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="glass rounded-[2rem] p-6 space-y-4">
                        <h3 class="text-xs font-black text-slate-500 uppercase tracking-widest">Rank Distribution</h3>
                        <canvas id="distChart" class="max-h-64"></canvas>
                    </div>
                    <div class="glass rounded-[2rem] p-6 space-y-4">
                        <h3 class="text-xs font-black text-slate-500 uppercase tracking-widest">Top Movers</h3>
                        <div id="topMovers" class="space-y-2"></div>
                    </div>
                </div>
            </section>

            <!-- GAMES VIEW -->
            <section id="view-games" class="view space-y-6">
                <input type="text" id="gameListSearch" placeholder="Filter games..." oninput="renderGameList()">
                <div id="gameListContainer" class="space-y-3">
                    <!-- Unique game rows -->
                </div>
            </section>
        </main>
    </div>

    <!-- DETAIL MODAL -->
    <div id="detailModal" class="modal-overlay" onclick="closeModal(event)">
        <div class="glass w-full max-w-lg rounded-[2.5rem] p-8 space-y-6 shadow-2xl relative" onclick="event.stopPropagation()">
            <div id="modalContent"></div>
            <canvas id="gameChart" class="max-h-48"></canvas>
            <button onclick="closeModal()" class="w-full glass py-4 rounded-2xl text-[10px] font-black uppercase text-slate-400">Close</button>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 glass border-t border-white/5 z-[500] p-2">
        <div class="max-w-4xl mx-auto flex justify-around">
            <button onclick="switchTab('fetch', this)" class="tab-btn active">
                <span class="text-xl">⚡</span>
                <span class="text-[9px] font-black uppercase">Sync</span>
            </button>
            <button onclick="switchTab('history', this)" class="tab-btn">
                <span class="text-xl">📜</span>
                <span class="text-[9px] font-black uppercase">History</span>
            </button>
            <button onclick="switchTab('trends', this)" class="tab-btn">
                <span class="text-xl">📊</span>
                <span class="text-[9px] font-black uppercase">Trends</span>
            </button>
            <button onclick="switchTab('games', this)" class="tab-btn">
                <span class="text-xl">🎮</span>
                <span class="text-[9px] font-black uppercase">Games</span>
            </button>
        </div>
    </nav>

    <script>
        // ═══════════════════════════════════════════════════════════════════
        // STATE
        // Tables: rank_games · rank_current · rank_periods · rank_runs
        // ═══════════════════════════════════════════════════════════════════
        const state = {
            db: null,
            periods: [],       // rank_periods rows
            currentRanks: [],  // rank_current rows
            runs: [],          // rank_runs rows (last 10)
            uniqueGames: new Map(), // bgg_id → { name, current, history[] }
            isSyncing: false,
            thumbCache: JSON.parse(localStorage.getItem('rankstore_thumbs') || '{}')
        };

        function saveThumbCache() {
            try { localStorage.setItem('rankstore_thumbs', JSON.stringify(state.thumbCache)); } catch (_) {}
        }

        function log(msg) {
            console.log(`[RankStore] ${msg}`);
            const el = document.getElementById('fetchLogs');
            el.innerHTML = `<div><span class="text-slate-600">[${new Date().toLocaleTimeString()}]</span> ${msg}</div>` + el.innerHTML;
        }

        function switchTab(id, btn) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`view-${id}`).classList.add('active');
            btn.classList.add('active');
            if (id === 'history') renderHistory();
            if (id === 'trends') renderTrends();
            if (id === 'games') renderGameList();
        }

        // ─── BGG fetch with 202 retry ───────────────────────────────────────
        async function bggFetch(url, retries = 5, delay = 2000) {
            for (let i = 0; i < retries; i++) {
                const res = await fetch(url);
                if (res.status === 202) {
                    log(`BGG queued (202) — retrying in ${delay / 1000}s…`);
                    await new Promise(r => setTimeout(r, delay));
                    delay = Math.min(delay * 1.5, 10000);
                    continue;
                }
                if (!res.ok) throw new Error(`BGG HTTP ${res.status}`);
                return res.text();
            }
            throw new Error('Max BGG retries exceeded');
        }

        // ─── Batch helpers ─────────────────────────────────────────────────
        function chunkArray(arr, size) {
            const out = [];
            for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
            return out;
        }

        async function batchedUpsert(table, rows, options = {}, batchSize = 500) {
            if (!rows.length) return;
            const chunks = chunkArray(rows, batchSize);
            for (let i = 0; i < chunks.length; i++) {
                const { error } = await state.db.from(table).upsert(chunks[i], options);
                if (error) throw error;
                log(`${table}: upserted batch ${i + 1}/${chunks.length}`);
            }
        }

        async function batchedInsert(table, rows, batchSize = 500) {
            if (!rows.length) return;
            const batches = chunkArray(rows, batchSize);
            for (let i = 0; i < batches.length; i++) {
                const { error } = await state.db.from(table).insert(batches[i]);
                if (error) throw error;
                log(`${table}: inserted batch ${i + 1}/${batches.length}`);
            }
        }

        async function loadCurrentRankMap(bggIds) {
            const result = new Map();
            if (!bggIds.length) return result;
            for (const ids of chunkArray(bggIds, 500)) {
                const { data, error } = await state.db
                    .from('rank_current')
                    .select('bgg_id,bgg_rank')
                    .in('bgg_id', ids);
                if (error) throw error;
                data.forEach(row => result.set(row.bgg_id, row));
            }
            return result;
        }

        // ─── Build uniqueGames map from DB rows ────────────────────────────
        function buildUniqueGames(currentRows, periodRows) {
            const map = new Map();
            currentRows.forEach(row => {
                map.set(row.bgg_id, { name: row.game_name, current: row.bgg_rank, history: [] });
            });
            periodRows.forEach(row => {
                if (!map.has(row.bgg_id)) {
                    map.set(row.bgg_id, {
                        name: row.game_name,
                        current: row.valid_to === null ? row.bgg_rank : null,
                        history: []
                    });
                }
                const game = map.get(row.bgg_id);
                if (!game.name && row.game_name) game.name = row.game_name;
                game.history.push(row);
                if (row.valid_to === null) game.current = row.bgg_rank;
            });
            map.forEach(g => g.history.sort((a, b) => new Date(a.valid_from) - new Date(b.valid_from)));
            return map;
        }

        function renderLastSync(run) {
            const card = document.getElementById('lastSyncCard');
            if (!run) { card.classList.add('hidden'); return; }
            card.classList.remove('hidden');
            document.getElementById('syncStats').innerHTML = [
                { label: 'Checked', value: run.checked_count  ?? 0, color: 'text-slate-200' },
                { label: 'Ranked',  value: run.ranked_count   ?? 0, color: 'text-indigo-300' },
                { label: 'New',     value: run.inserted_count ?? 0, color: 'text-emerald-400' },
                { label: 'Changed', value: run.changed_count  ?? 0, color: 'text-amber-400' },
                { label: 'Same',    value: run.unchanged_count ?? 0, color: 'text-sky-300' }
            ].map(s => `
                <div class="stat-card !p-3">
                    <div class="text-lg font-black ${s.color}">${s.value}</div>
                    <div class="text-[8px] font-black uppercase text-slate-500">${s.label}</div>
                </div>`).join('');
        }

        // ─── Load all data from DB ─────────────────────────────────────────
        async function loadStoreData() {
            log('Loading data from DB…');
            const [currentRes, periodsRes, runsRes] = await Promise.all([
                state.db.from('rank_current').select('*').order('bgg_rank', { ascending: true, nullsFirst: false }),
                state.db.from('rank_periods').select('*').order('valid_from', { ascending: false }),
                state.db.from('rank_runs').select('*').order('started_at', { ascending: false }).limit(10)
            ]);
            if (currentRes.error) throw currentRes.error;
            if (periodsRes.error) throw periodsRes.error;
            if (runsRes.error) throw runsRes.error;

            state.currentRanks = currentRes.data || [];
            state.periods      = periodsRes.data || [];
            state.runs         = runsRes.data    || [];
            state.uniqueGames  = buildUniqueGames(state.currentRanks, state.periods);

            document.getElementById('recordCount').textContent =
                `${state.currentRanks.length} Current Games • ${state.periods.length} Rank Periods`;
            renderLastSync(state.runs[0]);
            log(`Loaded ${state.currentRanks.length} games, ${state.periods.length} periods.`);
        }

        async function initDb() {
            try {
                const res = await fetch('/api/supabase-config');
                const cfg = await res.json();
                state.db = supabase.createClient(cfg.url, cfg.anonKey);
                document.getElementById('syncStatus').classList.replace('bg-slate-700', 'bg-emerald-500');
                await loadStoreData();
                if (state.uniqueGames.size > 0) fetchMissingThumbnails();
            } catch (err) {
                console.error('[RankStore] DB init failed:', err);
                document.getElementById('syncStatus').classList.replace('bg-slate-700', 'bg-red-500');
            }
        }

        // ─── Background thumbnail backfill ────────────────────────────────
        async function fetchMissingThumbnails() {
            const missingIds = Array.from(state.uniqueGames.keys()).filter(id => !state.thumbCache[id]);
            if (!missingIds.length) return;
            log(`Backfilling thumbnails for ${missingIds.length} games…`);
            const username = document.getElementById('usernameInput').value || 'sportomax';
            try {
                const xml = await bggFetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&stats=1`);
                new DOMParser().parseFromString(xml, 'text/xml')
                    .querySelectorAll('item')
                    .forEach(it => {
                        const id    = Number(it.getAttribute('objectid'));
                        const thumb = it.querySelector('thumbnail')?.textContent?.trim();
                        if (id && thumb) state.thumbCache[id] = thumb;
                    });
                saveThumbCache();
                renderHistory();
                renderGameList();
            } catch (e) {
                log('Thumbnail backfill failed (non-critical).');
            }
        }

        async function syncData() {
            if (state.isSyncing) return;
            const username = document.getElementById('usernameInput').value.trim();
            if (!username) { alert('Enter a BGG username first.'); return; }

            state.isSyncing = true;
            document.getElementById('syncBtn').disabled = true;
            const now = new Date().toISOString();
            let runId = null;

            log(`Starting sync for "${username}"…`);

            try {
                // ── 1. Open a rank_runs record ──────────────────────────────
                const { data: runRow, error: runErr } = await state.db
                    .from('rank_runs')
                    .insert({ username, status: 'running', started_at: now, notes: 'Sync started' })
                    .select('id')
                    .single();
                if (runErr) throw runErr;
                runId = runRow.id;
                log(`Run #${runId} opened.`);

                // ── 2. Fetch BGG collection ─────────────────────────────────
                const xml = await bggFetch(
                    `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1`
                );
                const items = Array.from(
                    new DOMParser().parseFromString(xml, 'text/xml').querySelectorAll('item')
                );
                log(`Fetched ${items.length} owned items from BGG.`);

                // ── 3. Parse items ──────────────────────────────────────────
                const seen        = new Set();
                const gameRows    = []; // → rank_games
                const rankedGames = []; // → rank_current

                items.forEach(it => {
                    const bggId = Number(it.getAttribute('objectid'));
                    if (!Number.isFinite(bggId) || seen.has(bggId)) return;
                    seen.add(bggId);

                    const name  = it.querySelector('name')?.textContent?.trim() || `BGG #${bggId}`;
                    const thumb = it.querySelector('thumbnail')?.textContent?.trim() || null;
                    if (thumb) state.thumbCache[bggId] = thumb;

                    gameRows.push({ bgg_id: bggId, game_name: name, thumbnail_url: thumb, updated_at: now });

                    const rankEl  = it.querySelector('rank[name="boardgame"]');
                    const rankVal = rankEl?.getAttribute('value');
                    if (!rankVal || rankVal === 'Not Ranked') return;
                    const rank = Number(rankVal);
                    if (!Number.isFinite(rank)) return;

                    rankedGames.push({
                        bgg_id:          bggId,
                        game_name:       name,
                        bgg_rank:        rank,
                        last_checked_at: now,
                        updated_at:      now
                    });
                });

                saveThumbCache();
                log(`Parsed: ${items.length} owned, ${rankedGames.length} ranked.`);

                // ── 4. Upsert rank_games (game metadata cache) ──────────────
                await batchedUpsert('rank_games', gameRows, { onConflict: 'bgg_id' });

                // ── 5. Load existing rank_current in batches → Map ──────────
                const existingMap = await loadCurrentRankMap(rankedGames.map(g => g.bgg_id));
                log(`Loaded ${existingMap.size} existing current ranks for comparison.`);

                // ── 6. Categorize: new / changed / unchanged ────────────────
                const insertedIds  = [];
                const changedIds   = [];
                const unchangedIds = [];
                const toClose      = []; // bgg_ids needing active period closed
                const newPeriods   = []; // rows to insert into rank_periods

                rankedGames.forEach(game => {
                    const prev = existingMap.get(game.bgg_id);
                    if (!prev) {
                        // Brand-new game — open first period
                        insertedIds.push(game.bgg_id);
                        newPeriods.push({
                            bgg_id:     game.bgg_id,
                            game_name:  game.game_name,
                            bgg_rank:   game.bgg_rank,
                            valid_from: now,
                            valid_to:   null
                        });
                    } else if (prev.bgg_rank === game.bgg_rank) {
                        // Rank unchanged — only update last_checked_at, no new period row
                        unchangedIds.push(game.bgg_id);
                    } else {
                        // Rank changed — close old period, open new one
                        changedIds.push(game.bgg_id);
                        toClose.push(game.bgg_id);
                        newPeriods.push({
                            bgg_id:     game.bgg_id,
                            game_name:  game.game_name,
                            bgg_rank:   game.bgg_rank,
                            valid_from: now,
                            valid_to:   null
                        });
                    }
                });

                log(`Categorized — new: ${insertedIds.length}, changed: ${changedIds.length}, same: ${unchangedIds.length}.`);

                // ── 7. Upsert all ranked games into rank_current ────────────
                //      Handles inserts (new) and updates (changed/unchanged) in one pass
                await batchedUpsert('rank_current', rankedGames, { onConflict: 'bgg_id' });

                // ── 8. Close old active periods for changed games ───────────
                if (toClose.length) {
                    for (const ids of chunkArray(toClose, 500)) {
                        const { error } = await state.db
                            .from('rank_periods')
                            .update({ valid_to: now })
                            .in('bgg_id', ids)
                            .is('valid_to', null);
                        if (error) throw error;
                    }
                    log(`Closed active periods for ${toClose.length} changed games.`);
                }

                // ── 9. Insert new rank_periods (only for new + changed) ─────
                if (newPeriods.length) {
                    await batchedInsert('rank_periods', newPeriods);
                    log(`Inserted ${newPeriods.length} new rank periods.`);
                } else {
                    log('No rank changes this sync — zero new periods written.');
                }

                // ── 10. Close the rank_runs record ──────────────────────────
                const { error: updateRunErr } = await state.db
                    .from('rank_runs')
                    .update({
                        finished_at:     new Date().toISOString(),
                        status:          'success',
                        checked_count:   items.length,
                        ranked_count:    rankedGames.length,
                        inserted_count:  insertedIds.length,
                        changed_count:   changedIds.length,
                        unchanged_count: unchangedIds.length,
                        notes:           `OK: ${rankedGames.length} ranked, ${newPeriods.length} new periods.`
                    })
                    .eq('id', runId);
                if (updateRunErr) throw updateRunErr;

                log(`Sync complete — run #${runId} closed.`);
                await loadStoreData();
                renderHistory();
                renderGameList();
                renderTrends();

            } catch (err) {
                console.error('[RankStore] Sync error:', err);
                log(`Error: ${err.message}`);
                if (runId) {
                    await state.db.from('rank_runs').update({
                        finished_at: new Date().toISOString(),
                        status:      'error',
                        notes:       err.message
                    }).eq('id', runId).catch(() => {});
                }
                alert(`Sync failed: ${err.message}`);
            } finally {
                state.isSyncing = false;
                document.getElementById('syncBtn').disabled = false;
            }
        }

        function renderHistory() {
            const container = document.getElementById('historyContainer');
            const search = document.getElementById('historySearch').value.toLowerCase();
            const days = document.getElementById('historyFilter').value;

            let filtered = state.periods;
            if (search) filtered = filtered.filter(r => (r.game_name || '').toLowerCase().includes(search));
            if (days !== 'all') {
                const cutoff = new Date();
                cutoff.setDate(cutoff.getDate() - Number.parseInt(days, 10));
                filtered = filtered.filter(r => new Date(r.valid_from) >= cutoff);
            }

            const rows = [...filtered].sort((a, b) => new Date(b.valid_from) - new Date(a.valid_from));

            container.innerHTML = rows.map(r => {
                const thumb = state.thumbCache[r.bgg_id] || '';
                const start = new Date(r.valid_from).toLocaleDateString();
                const end   = r.valid_to ? new Date(r.valid_to).toLocaleDateString() : 'Active';
                return `<div class="history-row" onclick="openGameDetail(${r.bgg_id})">
                    <img src="${thumb}" class="game-thumb-sm" onerror="this.style.display='none'">
                    <div class="flex-1 overflow-hidden">
                        <div class="text-sm font-black truncate text-slate-200">${r.game_name || `BGG #${r.bgg_id}`}</div>
                        <div class="text-[9px] font-bold text-slate-500 uppercase">${start} → ${end}</div>
                    </div>
                    <div class="text-lg font-black text-indigo-400">${r.bgg_rank ?? 'N/A'}</div>
                </div>`;
            }).join('') || '<div class="p-8 text-center text-slate-500 text-xs uppercase font-black tracking-wider">No rank periods found.</div>';
        }

        function renderGameList() {
            const container = document.getElementById('gameListContainer');
            const search = document.getElementById('gameListSearch').value.toLowerCase();

            const games = Array.from(state.uniqueGames.entries());
            const filtered = search
                ? games.filter(([, g]) => (g.name || '').toLowerCase().includes(search))
                : games;

            container.innerHTML = filtered
                .sort((a, b) => (a[1].current ?? Number.MAX_SAFE_INTEGER) - (b[1].current ?? Number.MAX_SAFE_INTEGER))
                .map(([id, g]) => {
                    const thumb = state.thumbCache[id] || '';
                    return `
                    <div class="glass p-4 rounded-3xl flex items-center gap-4 hover:border-indigo-500/30 transition-all cursor-pointer" onclick="openGameDetail(${id})">
                        <img src="${thumb}" class="game-thumb-sm" onerror="this.style.display='none'">
                        <div class="flex-1 flex flex-col">
                            <span class="text-xs font-black text-white">${g.name || `BGG #${id}`}</span>
                            <span class="text-[9px] font-bold text-slate-500 uppercase">${g.history.length} period${g.history.length !== 1 ? 's' : ''}</span>
                        </div>
                        <div class="text-xl font-black text-indigo-400">${g.current ?? 'N/A'}</div>
                    </div>
                `;
                }).join('') || '<div class="glass p-5 rounded-3xl text-center text-slate-500 text-xs uppercase font-black tracking-wider">No current ranks found.</div>';
        }

        function renderTrends() {
            const current = state.currentRanks.filter(r => Number.isFinite(r.bgg_rank));
            if (!current.length) return;

            const bins = { '1-100': 0, '101-500': 0, '501-1k': 0, '1k-5k': 0, '5k+': 0 };
            current.forEach(g => {
                if (g.bgg_rank <= 100) bins['1-100']++;
                else if (g.bgg_rank <= 500) bins['101-500']++;
                else if (g.bgg_rank <= 1000) bins['501-1k']++;
                else if (g.bgg_rank <= 5000) bins['1k-5k']++;
                else bins['5k+']++;
            });

            const ctx = document.getElementById('distChart').getContext('2d');
            if (window.distChartInst) window.distChartInst.destroy();
            window.distChartInst = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(bins),
                    datasets: [{
                        data: Object.values(bins),
                        backgroundColor: '#6366f1',
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b' } },
                        x: { grid: { display: false }, ticks: { color: '#64748b' } }
                    }
                }
            });

            const movers = Array.from(state.uniqueGames.entries())
                .map(([id, g]) => {
                    if (g.history.length < 2) return null;
                    const sorted = [...g.history].sort((a, b) => new Date(a.valid_from) - new Date(b.valid_from));
                    const first = sorted[0].bgg_rank;
                    const last  = sorted[sorted.length - 1].bgg_rank;
                    if (!Number.isFinite(first) || !Number.isFinite(last)) return null;
                    return { name: g.name || `BGG #${id}`, change: first - last, id };
                })
                .filter(Boolean)
                .sort((a, b) => b.change - a.change);

            document.getElementById('topMovers').innerHTML = movers.slice(0, 5).map(m => `
                <div class="flex items-center gap-3 p-3 rounded-2xl bg-slate-900/50 border border-white/5 cursor-pointer hover:border-indigo-500/30" onclick="openGameDetail(${m.id})">
                    <img src="${state.thumbCache[m.id] || ''}" class="w-8 h-8 rounded-lg object-contain" onerror="this.style.display='none'">
                    <span class="text-[11px] font-black truncate flex-1 text-slate-200">${m.name}</span>
                    <span class="text-[10px] font-black text-emerald-400">↑ ${m.change}</span>
                </div>`).join('') || '<div class="text-[10px] text-slate-600 text-center py-4 italic">Need more rank changes…</div>';
        }

        // ─── Game detail modal ─────────────────────────────────────────────
        function openGameDetail(id) {
            const game = state.uniqueGames.get(id);
            if (!game) return;

            const history = [...game.history].sort((a, b) => new Date(a.valid_from) - new Date(b.valid_from));
            const ranks   = history.map(h => h.bgg_rank).filter(Number.isFinite);
            const current = game.current ?? 'N/A';
            const best    = ranks.length ? Math.min(...ranks) : 'N/A';
            const worst   = ranks.length ? Math.max(...ranks) : 'N/A';
            const avg     = ranks.length ? Math.round(ranks.reduce((a, b) => a + b, 0) / ranks.length) : 'N/A';
            const thumb   = state.thumbCache[id] || '';

            document.getElementById('modalContent').innerHTML = `
                <div class="flex flex-col items-center text-center space-y-4">
                    <img src="${thumb}" class="w-24 h-24 rounded-3xl object-contain glass p-2" onerror="this.style.display='none'">
                    <div class="space-y-1">
                        <div class="text-[10px] font-black text-indigo-400 uppercase tracking-widest">Game Insights</div>
                        <h2 class="text-2xl font-black text-white leading-tight">${game.name || `BGG #${id}`}</h2>
                        <div class="text-xs text-slate-500 font-bold">BGG ID #${id} • ${history.length} period${history.length !== 1 ? 's' : ''}</div>
                    </div>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <div class="stat-card"><div class="text-lg font-black text-white">${current}</div><div class="text-[8px] font-black uppercase text-slate-500">Current</div></div>
                    <div class="stat-card"><div class="text-lg font-black text-emerald-400">${best}</div><div class="text-[8px] font-black uppercase text-slate-500">Best</div></div>
                    <div class="stat-card"><div class="text-lg font-black text-red-400">${worst}</div><div class="text-[8px] font-black uppercase text-slate-500">Worst</div></div>
                    <div class="stat-card"><div class="text-lg font-black text-indigo-400">${avg}</div><div class="text-[8px] font-black uppercase text-slate-500">Avg</div></div>
                </div>`;

            document.getElementById('detailModal').classList.add('open');
            renderGameChart(history);
        }

        function closeModal(e) {
            if (e && e.target.id !== 'detailModal') return;
            document.getElementById('detailModal').classList.remove('open');
        }

        let gameChartInst = null;
        function renderGameChart(history) {
            const ctx = document.getElementById('gameChart').getContext('2d');
            if (gameChartInst) gameChartInst.destroy();
            const data = [...history].sort((a, b) => new Date(a.valid_from) - new Date(b.valid_from));
            gameChartInst = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(r => new Date(r.valid_from).toLocaleDateString()),
                    datasets: [{
                        label: 'Rank',
                        data: data.map(r => r.bgg_rank),
                        borderColor: '#6366f1',
                        tension: 0.4,
                        fill: true,
                        backgroundColor: 'rgba(99, 102, 241, 0.1)'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { reverse: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b' } },
                        x: { display: false }
                    }
                }
            });
        }

        // ─── Maintenance ───────────────────────────────────────────────────
        async function cleanupInvalidRanks() {
            if (!confirm('Delete null-rank rows from rank_current and close their active rank_periods?')) return;
            try {
                const now = new Date().toISOString();
                const { error: e1 } = await state.db.from('rank_current').delete().is('bgg_rank', null);
                if (e1) throw e1;
                const { error: e2 } = await state.db.from('rank_periods')
                    .update({ valid_to: now })
                    .is('bgg_rank', null)
                    .is('valid_to', null);
                if (e2) throw e2;
                log('Null-rank cleanup complete.');
                await loadStoreData();
                renderHistory();
                renderGameList();
                renderTrends();
            } catch (err) {
                alert(`Cleanup failed: ${err.message}`);
            }
        }

        async function cleanupNonOwned() {
            alert('Non-owned cleanup is manual in this version. Use sync logs to review removed games.');
        }

        // ── Boot ──────────────────────────────────────────────────────────
        initDb();
    </script>

</body>
</html>
