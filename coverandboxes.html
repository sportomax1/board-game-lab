<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>📦 Cover and Boxes</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>📦</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100vh;
            max-width: 650px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
        }

        .setup-card, .game-card {
            background: white;
            border-radius: 16px;
            padding: 1.5rem 1.5rem 2rem 1.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin: auto;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        h1 {
            font-size: 2rem;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #e74c3c;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(231, 76, 60, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .player-info {
            text-align: center;
        }

        .player-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .score {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 0.25rem;
        }

        .player1 .score {
            color: #3498db;
        }

        .player2 .score {
            color: #e74c3c;
        }

        .player-thumbnail {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid;
            margin: 0 auto;
        }

        .player1 .player-thumbnail {
            border-color: #3498db;
        }

        .player2 .player-thumbnail {
            border-color: #e74c3c;
        }

        .current-turn {
            padding: 0.5rem 1rem;
            background: #ecf0f1;
            border-radius: 8px;
            font-weight: 700;
            color: #2c3e50;
            text-align: center;
        }

        .board-container {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
            overflow-x: auto;
            padding: 0.5rem;
        }

        .board {
            display: inline-block;
            position: relative;
            padding: 20px;
        }

        .dots {
            display: grid;
            gap: 50px;
            position: relative;
        }

        .dot {
            width: 10px;
            height: 10px;
            background: #2c3e50;
            border-radius: 50%;
            position: relative;
        }

        .line {
            position: absolute;
            background: #bdc3c7;
            cursor: pointer;
            transition: all 0.2s;
        }

        .line:hover {
            background: #7f8c8d;
            transform: scale(1.1);
        }

        .line.horizontal {
            height: 4px;
            width: 50px;
            top: 50%;
            transform: translateY(-50%);
        }

        .line.vertical {
            width: 4px;
            height: 50px;
            left: 50%;
            transform: translateX(-50%);
        }

        .line.claimed {
            cursor: default;
        }

        .line.claimed.player1 {
            background: #3498db;
        }

        .line.claimed.player2 {
            background: #e74c3c;
        }

        .box {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 4px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s;
            animation: boxComplete 0.5s ease-out;
        }

        @keyframes boxComplete {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .box.complete {
            opacity: 1;
        }

        .box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-controls {
            display: flex;
            gap: 0.5rem;
        }

        .game-controls button {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .game-controls button:active {
            transform: scale(0.95);
        }

        .new-game-btn {
            background: #2ecc71;
            color: white;
        }

        .settings-btn {
            background: #95a5a6;
            color: white;
        }

        .winner-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .winner-modal.active {
            display: flex;
        }

        .winner-content {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            max-width: 400px;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .winner-title {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #2c3e50;
        }

        .winner-thumbnail {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin: 1rem auto;
            border: 5px solid #f39c12;
        }

        .credit-line {
            text-align: center;
            font-size: 0.75rem;
            color: #95a5a6;
            margin-top: 1rem;
            border-top: 1px solid #ecf0f1;
            padding-top: 0.75rem;
        }
    </style>
</head>
<body>
    <!-- Setup Screen -->
    <div id="setupScreen" class="screen active">
        <div class="setup-card" style="margin: 1rem auto;">
            <h1 style="font-size: 1.5rem;">📦 Cover and Boxes</h1>
            <p class="subtitle" style="margin-bottom: 1rem;">Complete boxes with game thumbnails!</p>
            
            <div style="margin-bottom: 1rem;">
                <button id="startBtn" class="btn" onclick="startGame()">Start Game</button>
            </div>

            <div class="form-group" style="margin-bottom: 1rem;">
                <label for="username1" style="font-size: 0.85rem;">Player 1 BGG Username</label>
                <input type="text" id="username1" value="sportomax" placeholder="Enter username" style="padding: 0.6rem; font-size: 0.95rem;">
            </div>

            <div class="form-group" style="margin-bottom: 1rem;">
                <label for="username2" style="font-size: 0.85rem;">Player 2 BGG Username</label>
                <input type="text" id="username2" value="sportomax" placeholder="Enter username" style="padding: 0.6rem; font-size: 0.95rem;">
            </div>

            <div class="form-group" style="margin-bottom: 1rem;">
                <label for="gridSize" style="font-size: 0.85rem;">Grid Size (dots per side)</label>
                <input type="number" id="gridSize" value="4" min="3" max="6" placeholder="4" style="padding: 0.6rem; font-size: 0.95rem;">
            </div>

            <div class="checkbox-group" style="margin-bottom: 1rem;">
                <input type="checkbox" id="includeExpansions" style="width: 16px; height: 16px;">
                <label for="includeExpansions" style="margin: 0; font-size: 0.9rem;">Include expansions</label>
            </div>

            <div class="form-group" style="margin-bottom: 1rem;">
                <label for="boxCoverMode" style="font-size: 0.85rem;">Box Cover Mode</label>
                <select id="boxCoverMode" style="width: 100%; padding: 0.6rem; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 0.95rem;">
                    <option value="player">Use player's thumbnail for all boxes</option>
                    <option value="random">Random per box (consistent)</option>
                </select>
            </div>

            <div class="credit-line" style="font-size: 0.75rem; text-align: center; color: #999; margin-top: 1.5rem;">
                Based on the classic Dots and Boxes game concept
            </div>
        </div>
    </div>

    <!-- Cover Picker Modal -->
    <div id="coverPickerModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); z-index:1000; padding:1rem; overflow-y:auto; -webkit-overflow-scrolling: touch;">
        <div style="background:white; border-radius:16px; padding:1.5rem; max-width:100%; margin:1rem auto;">
            <h2 style="font-size:1.3rem; margin-bottom:1rem; text-align:center;">Choose Box Covers</h2>
            
            <div style="margin-bottom:1.5rem;">
                <div style="font-weight:700; margin-bottom:0.5rem; font-size:0.95rem;">Player 1</div>
                <input type="text" id="p1Search" placeholder="Search games..." style="width:100%; padding:0.6rem; margin-bottom:0.75rem; border:2px solid #e0e0e0; border-radius:8px; font-size:0.9rem;">
                <div id="p1Gallery" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(60px, 1fr)); gap:6px; max-height:250px; overflow-y:auto; -webkit-overflow-scrolling: touch; border:1px solid #e0e0e0; padding:8px; border-radius:8px; background:#f9f9f9;"></div>
            </div>
            
            <div style="margin-bottom:1.5rem;">
                <div style="font-weight:700; margin-bottom:0.5rem; font-size:0.95rem;">Player 2</div>
                <input type="text" id="p2Search" placeholder="Search games..." style="width:100%; padding:0.6rem; margin-bottom:0.75rem; border:2px solid #e0e0e0; border-radius:8px; font-size:0.9rem;">
                <div id="p2Gallery" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(60px, 1fr)); gap:6px; max-height:250px; overflow-y:auto; -webkit-overflow-scrolling: touch; border:1px solid #e0e0e0; padding:8px; border-radius:8px; background:#f9f9f9;"></div>
            </div>
            
            <div style="display:flex; gap:0.75rem; margin-top:1rem;">
                <button onclick="closePickerModal()" style="flex:1; padding:0.8rem; background:#e0e0e0; border:none; border-radius:8px; font-weight:600; cursor:pointer; font-size:0.95rem;">Cancel</button>
                <button id="proceedBtn" onclick="proceedToGame()" style="flex:1; padding:0.8rem; background:linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); color:white; border:none; border-radius:8px; font-weight:600; cursor:pointer; font-size:0.95rem;">Play Game</button>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="screen">
        <div class="game-card">
            <div class="game-header">
                <div class="player-info player1">
                    <div class="player-name" id="player1Name">Player 1</div>
                    <div class="score" id="player1Score">0</div>
                    <img id="player1Thumb" class="player-thumbnail" src="" alt="Player 1">
                </div>
                <div class="current-turn" id="turnIndicator">Player 1's Turn</div>
                <div class="player-info player2">
                    <div class="player-name" id="player2Name">Player 2</div>
                    <div class="score" id="player2Score">0</div>
                    <img id="player2Thumb" class="player-thumbnail" src="" alt="Player 2">
                </div>
            </div>

            <div class="board-container">
                <div class="board" id="board"></div>
            </div>

            <div class="game-controls">
                <button class="new-game-btn" onclick="newGame()">New Game</button>
                <button class="settings-btn" onclick="backToSettings()">Settings</button>
            </div>
        </div>
    </div>

    <!-- Winner Modal -->
    <div id="winnerModal" class="winner-modal">
        <div class="winner-content">
            <div class="winner-title" id="winnerText">🎉 Winner!</div>
            <img id="winnerThumb" class="winner-thumbnail" src="" alt="Winner">
            <div style="margin-top: 1.5rem;">
                <button class="btn" onclick="newGame()">Play Again</button>
            </div>
        </div>
    </div>

    <script>
        let gridSize = 4;
        let lines = [];
        let boxes = [];
        let currentPlayer = 1;
        let player1Games = [];
        let player2Games = [];
        let player1Score = 0;
        let player2Score = 0;
        let gameActive = false;

        // Cover selection mode and persisted choices
        let boxCoverMode = localStorage.getItem('dots_boxCoverMode') || 'random';
        let selectedPlayer1CoverIndex = parseInt(localStorage.getItem('dots_p1_cover_idx') || '-1', 10);
        let selectedPlayer2CoverIndex = parseInt(localStorage.getItem('dots_p2_cover_idx') || '-1', 10);
        let selectedPlayer1Cover = localStorage.getItem('dots_p1_cover') || '';
        let selectedPlayer2Cover = localStorage.getItem('dots_p2_cover') || '';

        async function startGame() {
            const username1 = document.getElementById('username1').value.trim() || 'sportomax';
            const username2 = document.getElementById('username2').value.trim() || 'sportomax';
            const includeExpansions = document.getElementById('includeExpansions').checked;
            gridSize = parseInt(document.getElementById('gridSize').value) || 4;

            if (gridSize < 3) gridSize = 3;
            if (gridSize > 6) gridSize = 6;

            try {
                const subtype = includeExpansions ? '' : '&subtype=boardgame';
                
                const [res1, res2] = await Promise.all([
                    fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username1)}&own=1${subtype}&stats=1`),
                    fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username2)}&own=1${subtype}&stats=1`)
                ]);

                const [xml1, xml2] = await Promise.all([res1.text(), res2.text()]);

                const parser = new DOMParser();
                const doc1 = parser.parseFromString(xml1, 'text/xml');
                const doc2 = parser.parseFromString(xml2, 'text/xml');

                player1Games = Array.from(doc1.querySelectorAll('item')).map(item => ({
                    name: item.querySelector('name').textContent,
                    thumbnail: item.querySelector('thumbnail')?.textContent || ''
                })).filter(g => g.thumbnail);

                player2Games = Array.from(doc2.querySelectorAll('item')).map(item => ({
                    name: item.querySelector('name').textContent,
                    thumbnail: item.querySelector('thumbnail')?.textContent || ''
                })).filter(g => g.thumbnail);

                const maxBoxes = (gridSize - 1) * (gridSize - 1);
                if (player1Games.length < maxBoxes || player2Games.length < maxBoxes) {
                    alert('Not enough games with thumbnails. Please check usernames.');
                    return;
                }

                // Initialize box cover mode from UI or persisted value
                const modeSelect = document.getElementById('boxCoverMode');
                if (modeSelect) {
                    boxCoverMode = localStorage.getItem('dots_boxCoverMode') || modeSelect.value || 'random';
                    modeSelect.value = boxCoverMode;
                    modeSelect.onchange = () => {
                        boxCoverMode = modeSelect.value;
                        localStorage.setItem('dots_boxCoverMode', boxCoverMode);
                    };
                }

                // If we have persisted selected cover thumbs, but they aren't valid in the current collection, reset index
                if (selectedPlayer1Cover && !player1Games.some(g=>g.thumbnail===selectedPlayer1Cover)) {
                    selectedPlayer1Cover = '';
                    selectedPlayer1CoverIndex = -1;
                    localStorage.removeItem('dots_p1_cover');
                    localStorage.removeItem('dots_p1_cover_idx');
                }
                if (selectedPlayer2Cover && !player2Games.some(g=>g.thumbnail===selectedPlayer2Cover)) {
                    selectedPlayer2Cover = '';
                    selectedPlayer2CoverIndex = -1;
                    localStorage.removeItem('dots_p2_cover');
                    localStorage.removeItem('dots_p2_cover_idx');
                }

                // Ensure we have a default selected cover (use a random one) for player's thumbnail mode
                if (!selectedPlayer1Cover && player1Games.length) {
                    selectedPlayer1CoverIndex = Math.floor(Math.random()*player1Games.length);
                    selectedPlayer1Cover = player1Games[selectedPlayer1CoverIndex].thumbnail;
                    localStorage.setItem('dots_p1_cover', selectedPlayer1Cover);
                    localStorage.setItem('dots_p1_cover_idx', selectedPlayer1CoverIndex);
                }
                if (!selectedPlayer2Cover && player2Games.length) {
                    selectedPlayer2CoverIndex = Math.floor(Math.random()*player2Games.length);
                    selectedPlayer2Cover = player2Games[selectedPlayer2CoverIndex].thumbnail;
                    localStorage.setItem('dots_p2_cover', selectedPlayer2Cover);
                    localStorage.setItem('dots_p2_cover_idx', selectedPlayer2CoverIndex);
                }

                document.getElementById('player1Name').textContent = username1;
                document.getElementById('player2Name').textContent = username2;

                // Populate cover picker galleries and show picker so user can choose covers before starting
                populateCoverGalleries();
                document.getElementById('coverPickerModal').style.display = 'block';
                // hide start button to avoid double-fetch
                const startBtn = document.getElementById('startBtn');
                if (startBtn) startBtn.style.display = 'none';
                return;
            } catch (error) {
                alert('Error loading collections: ' + error.message);
            }
        }

        function newGame() {
            currentPlayer = 1;
            player1Score = 0;
            player2Score = 0;
            gameActive = true;
            document.getElementById('winnerModal').classList.remove('active');

            // Set player thumbnails based on selected cover or a random default
            if (!selectedPlayer1Cover && player1Games.length) {
                selectedPlayer1CoverIndex = Math.floor(Math.random() * player1Games.length);
                selectedPlayer1Cover = player1Games[selectedPlayer1CoverIndex].thumbnail;
                localStorage.setItem('dots_p1_cover', selectedPlayer1Cover);
                localStorage.setItem('dots_p1_cover_idx', selectedPlayer1CoverIndex);
            }
            if (!selectedPlayer2Cover && player2Games.length) {
                selectedPlayer2CoverIndex = Math.floor(Math.random() * player2Games.length);
                selectedPlayer2Cover = player2Games[selectedPlayer2CoverIndex].thumbnail;
                localStorage.setItem('dots_p2_cover', selectedPlayer2Cover);
                localStorage.setItem('dots_p2_cover_idx', selectedPlayer2CoverIndex);
            }

            document.getElementById('player1Thumb').src = selectedPlayer1Cover || (player1Games[0] && player1Games[0].thumbnail) || '';
            document.getElementById('player2Thumb').src = selectedPlayer2Cover || (player2Games[0] && player2Games[0].thumbnail) || '';

            // Initialize lines and boxes
            lines = [];
            boxes = [];

            const totalBoxes = (gridSize - 1) * (gridSize - 1);

            // Initialize boxes and deterministic per-player thumbnails for each box (used in random mode)
            for (let i = 0; i < totalBoxes; i++) {
                const thumbFor = {};
                if (player1Games.length) thumbFor[1] = player1Games[deterministicIndex(i, player1Games.length)].thumbnail;
                if (player2Games.length) thumbFor[2] = player2Games[deterministicIndex(i + 1000, player2Games.length)].thumbnail;
                boxes.push({
                    top: false,
                    right: false,
                    bottom: false,
                    left: false,
                    complete: false,
                    player: null,
                    thumbFor
                });
            }

            renderBoard();
            updateScore();
        }

        function renderBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';

            // Create dots grid
            const dots = document.createElement('div');
            dots.className = 'dots';
            dots.style.gridTemplateColumns = `repeat(${gridSize}, auto)`;

            // Add dots and lines
            for (let row = 0; row < gridSize; row++) {
                for (let col = 0; col < gridSize; col++) {
                    const dotContainer = document.createElement('div');
                    dotContainer.style.position = 'relative';

                    const dot = document.createElement('div');
                    dot.className = 'dot';
                    dotContainer.appendChild(dot);

                    // Add horizontal line to the right
                    if (col < gridSize - 1) {
                        const hLine = document.createElement('div');
                        hLine.className = 'line horizontal';
                        hLine.dataset.row = row;
                        hLine.dataset.col = col;
                        hLine.dataset.type = 'h';
                        hLine.style.left = '10px';
                        hLine.onclick = () => claimLine(row, col, 'h');
                        dotContainer.appendChild(hLine);
                    }

                    // Add vertical line below
                    if (row < gridSize - 1) {
                        const vLine = document.createElement('div');
                        vLine.className = 'line vertical';
                        vLine.dataset.row = row;
                        vLine.dataset.col = col;
                        vLine.dataset.type = 'v';
                        vLine.style.top = '10px';
                        vLine.onclick = () => claimLine(row, col, 'v');
                        dotContainer.appendChild(vLine);
                    }

                    dots.appendChild(dotContainer);
                }
            }

            board.appendChild(dots);

            // Render boxes
            renderBoxes();
        }

        function renderBoxes() {
            const board = document.getElementById('board');
            
            // Remove old boxes
            board.querySelectorAll('.box').forEach(el => el.remove());

            // Add completed boxes
            for (let i = 0; i < boxes.length; i++) {
                if (boxes[i].complete) {
                    const row = Math.floor(i / (gridSize - 1));
                    const col = i % (gridSize - 1);
                    
                    const box = document.createElement('div');
                    box.className = 'box complete';
                    box.style.left = `${30 + col * 60}px`;
                    box.style.top = `${30 + row * 60}px`;
                    
                    const img = document.createElement('img');
                    // Choose thumbnail according to mode and owner
                    const owner = boxes[i].player;
                    if (boxCoverMode === 'player') {
                        img.src = owner === 1 ? (selectedPlayer1Cover || (player1Games[0] && player1Games[0].thumbnail)) : (selectedPlayer2Cover || (player2Games[0] && player2Games[0].thumbnail));
                    } else {
                        // random mode: use precomputed deterministic thumbFor for the owner
                        img.src = boxes[i].thumbFor && boxes[i].thumbFor[owner] ? boxes[i].thumbFor[owner] : ((owner === 1 ? (player1Games[0] && player1Games[0].thumbnail) : (player2Games[0] && player2Games[0].thumbnail)) || '');
                    }
                    box.appendChild(img);
                    
                    board.appendChild(box);
                }
            }
        }

        function claimLine(row, col, type) {
            if (!gameActive) return;

            const lineElement = document.querySelector(`[data-row="${row}"][data-col="${col}"][data-type="${type}"]`);
            if (lineElement.classList.contains('claimed')) return;

            lineElement.classList.add('claimed', `player${currentPlayer}`);

            // Update boxes
            let boxCompleted = false;

            if (type === 'h') {
                // Horizontal line affects box above and below
                if (row > 0) {
                    const boxIndex = (row - 1) * (gridSize - 1) + col;
                    boxes[boxIndex].bottom = currentPlayer;
                    if (checkBoxComplete(boxIndex)) {
                        boxes[boxIndex].complete = true;
                        boxes[boxIndex].player = currentPlayer;
                        boxCompleted = true;
                        if (currentPlayer === 1) player1Score++;
                        else player2Score++;
                    }
                }
                if (row < gridSize - 1) {
                    const boxIndex = row * (gridSize - 1) + col;
                    boxes[boxIndex].top = currentPlayer;
                    if (checkBoxComplete(boxIndex)) {
                        boxes[boxIndex].complete = true;
                        boxes[boxIndex].player = currentPlayer;
                        boxCompleted = true;
                        if (currentPlayer === 1) player1Score++;
                        else player2Score++;
                    }
                }
            } else {
                // Vertical line affects box left and right
                if (col > 0) {
                    const boxIndex = row * (gridSize - 1) + (col - 1);
                    boxes[boxIndex].right = currentPlayer;
                    if (checkBoxComplete(boxIndex)) {
                        boxes[boxIndex].complete = true;
                        boxes[boxIndex].player = currentPlayer;
                        boxCompleted = true;
                        if (currentPlayer === 1) player1Score++;
                        else player2Score++;
                    }
                }
                if (col < gridSize - 1) {
                    const boxIndex = row * (gridSize - 1) + col;
                    boxes[boxIndex].left = currentPlayer;
                    if (checkBoxComplete(boxIndex)) {
                        boxes[boxIndex].complete = true;
                        boxes[boxIndex].player = currentPlayer;
                        boxCompleted = true;
                        if (currentPlayer === 1) player1Score++;
                        else player2Score++;
                    }
                }
            }

            renderBoxes();
            updateScore();

            // If box was completed, player gets another turn
            if (!boxCompleted) {
                currentPlayer = currentPlayer === 1 ? 2 : 1;
                updateTurnIndicator();
            }

            checkGameOver();
        }

        function checkBoxComplete(index) {
            const box = boxes[index];
            return box.top && box.right && box.bottom && box.left;
        }

        function updateScore() {
            document.getElementById('player1Score').textContent = player1Score;
            document.getElementById('player2Score').textContent = player2Score;
        }

        function updateTurnIndicator() {
            const indicator = document.getElementById('turnIndicator');
            const playerName = currentPlayer === 1 
                ? document.getElementById('player1Name').textContent 
                : document.getElementById('player2Name').textContent;
            indicator.textContent = `${playerName}'s Turn`;
            indicator.style.background = currentPlayer === 1 ? '#e3f2fd' : '#ffebee';
        }

        function checkGameOver() {
            const totalBoxes = (gridSize - 1) * (gridSize - 1);
            if (player1Score + player2Score === totalBoxes) {
                gameActive = false;
                setTimeout(showWinner, 500);
            }
        }

        function showWinner() {
            let winner, winnerName, winnerThumb;
            
            if (player1Score > player2Score) {
                winner = 1;
                winnerName = document.getElementById('player1Name').textContent;
                winnerThumb = document.getElementById('player1Thumb').src;
            } else if (player2Score > player1Score) {
                winner = 2;
                winnerName = document.getElementById('player2Name').textContent;
                winnerThumb = document.getElementById('player2Thumb').src;
            } else {
                document.getElementById('winnerText').textContent = "🤝 It's a Tie!";
                document.getElementById('winnerThumb').style.display = 'none';
                document.getElementById('winnerModal').classList.add('active');
                return;
            }

            document.getElementById('winnerText').textContent = `🎉 ${winnerName} Wins!`;
            document.getElementById('winnerThumb').src = winnerThumb;
            document.getElementById('winnerThumb').style.display = 'block';
            document.getElementById('winnerModal').classList.add('active');
        }

        // Deterministic index helper for consistent random selection
        function deterministicIndex(seed, range) {
            if (!range || range <= 0) return 0;
            // simple LCG-like operation for determinism
            const a = 1664525;
            const c = 1013904223;
            let x = (seed >>> 0);
            x = (a * x + c) >>> 0;
            return x % range;
        }

        // Allow user to click player thumbnails to cycle their selected cover
        document.addEventListener('click', function (e) {
            if (e.target && e.target.id === 'player1Thumb') {
                if (!player1Games.length) return;
                selectedPlayer1CoverIndex = (selectedPlayer1CoverIndex + 1) % player1Games.length;
                selectedPlayer1Cover = player1Games[selectedPlayer1CoverIndex].thumbnail;
                localStorage.setItem('dots_p1_cover', selectedPlayer1Cover);
                localStorage.setItem('dots_p1_cover_idx', selectedPlayer1CoverIndex);
                document.getElementById('player1Thumb').src = selectedPlayer1Cover;
                renderBoxes();
            }
            if (e.target && e.target.id === 'player2Thumb') {
                if (!player2Games.length) return;
                selectedPlayer2CoverIndex = (selectedPlayer2CoverIndex + 1) % player2Games.length;
                selectedPlayer2Cover = player2Games[selectedPlayer2CoverIndex].thumbnail;
                localStorage.setItem('dots_p2_cover', selectedPlayer2Cover);
                localStorage.setItem('dots_p2_cover_idx', selectedPlayer2CoverIndex);
                document.getElementById('player2Thumb').src = selectedPlayer2Cover;
                renderBoxes();
            }
            // Gallery item clicks
            if (e.target && e.target.dataset && e.target.dataset.player === '1' && e.target.dataset.idx) {
                const idx = parseInt(e.target.dataset.idx, 10);
                selectedPlayer1CoverIndex = idx;
                selectedPlayer1Cover = player1Games[idx].thumbnail;
                localStorage.setItem('dots_p1_cover', selectedPlayer1Cover);
                localStorage.setItem('dots_p1_cover_idx', selectedPlayer1CoverIndex);
                document.getElementById('player1Thumb').src = selectedPlayer1Cover;
                highlightSelectedGallery('p1Gallery', selectedPlayer1CoverIndex);
            }
            if (e.target && e.target.dataset && e.target.dataset.player === '2' && e.target.dataset.idx) {
                const idx = parseInt(e.target.dataset.idx, 10);
                selectedPlayer2CoverIndex = idx;
                selectedPlayer2Cover = player2Games[idx].thumbnail;
                localStorage.setItem('dots_p2_cover', selectedPlayer2Cover);
                localStorage.setItem('dots_p2_cover_idx', selectedPlayer2CoverIndex);
                document.getElementById('player2Thumb').src = selectedPlayer2Cover;
                highlightSelectedGallery('p2Gallery', selectedPlayer2CoverIndex);
            }
        });

        function populateCoverGalleries(p1Filter = '', p2Filter = '') {
            const p1 = document.getElementById('p1Gallery');
            const p2 = document.getElementById('p2Gallery');
            if (!p1 || !p2) return;
            p1.innerHTML = '';
            p2.innerHTML = '';
            
            // Filter and display all player 1 games
            const p1FilterLower = p1Filter.toLowerCase();
            const filtered1 = p1Filter 
                ? player1Games.filter(g => g.name.toLowerCase().includes(p1FilterLower))
                : player1Games;
            
            filtered1.forEach((game, displayIdx) => {
                const actualIdx = player1Games.indexOf(game);
                const img = document.createElement('img');
                img.src = game.thumbnail;
                img.title = game.name;
                img.style.width = '100%';
                img.style.height = '64px';
                img.style.objectFit = 'cover';
                img.style.cursor = 'pointer';
                img.dataset.player = '1';
                img.dataset.idx = actualIdx;
                img.style.border = actualIdx === selectedPlayer1CoverIndex ? '3px solid #3498db' : '2px solid #eee';
                img.style.borderRadius = '4px';
                p1.appendChild(img);
            });
            
            // Filter and display all player 2 games
            const p2FilterLower = p2Filter.toLowerCase();
            const filtered2 = p2Filter 
                ? player2Games.filter(g => g.name.toLowerCase().includes(p2FilterLower))
                : player2Games;
            
            filtered2.forEach((game, displayIdx) => {
                const actualIdx = player2Games.indexOf(game);
                const img = document.createElement('img');
                img.src = game.thumbnail;
                img.title = game.name;
                img.style.width = '100%';
                img.style.height = '64px';
                img.style.objectFit = 'cover';
                img.style.cursor = 'pointer';
                img.dataset.player = '2';
                img.dataset.idx = actualIdx;
                img.style.border = actualIdx === selectedPlayer2CoverIndex ? '3px solid #e74c3c' : '2px solid #eee';
                img.style.borderRadius = '4px';
                p2.appendChild(img);
            });
        }

        function highlightSelectedGallery(containerId, selIdx) {
            const c = document.getElementById(containerId);
            if (!c) return;
            Array.from(c.children).forEach((child, i) => {
                const idx = parseInt(child.dataset.idx, 10);
                child.style.border = idx === selIdx ? (containerId === 'p1Gallery' ? '3px solid #3498db' : '3px solid #e74c3c') : '2px solid #eee';
            });
        }

        // Add search functionality
        document.addEventListener('DOMContentLoaded', function() {
            const p1Search = document.getElementById('p1Search');
            const p2Search = document.getElementById('p2Search');
            
            if (p1Search) {
                p1Search.addEventListener('input', function(e) {
                    const p2Filter = p2Search ? p2Search.value : '';
                    populateCoverGalleries(e.target.value, p2Filter);
                });
            }
            
            if (p2Search) {
                p2Search.addEventListener('input', function(e) {
                    const p1Filter = p1Search ? p1Search.value : '';
                    populateCoverGalleries(p1Filter, e.target.value);
                });
            }

            // Close modal when clicking background (not on modal content)
            const modal = document.getElementById('coverPickerModal');
            if (modal) {
                modal.addEventListener('click', function(e) {
                    if (e.target === modal) {
                        closePickerModal();
                    }
                });
            }
        });

        function closePickerModal() {
            document.getElementById('coverPickerModal').style.display = 'none';
        }

        function proceedToGame() {
            // hide picker and start
            closePickerModal();
            document.getElementById('setupScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.add('active');
            // ensure player thumbnails are set
            document.getElementById('player1Thumb').src = selectedPlayer1Cover || (player1Games[0] && player1Games[0].thumbnail) || '';
            document.getElementById('player2Thumb').src = selectedPlayer2Cover || (player2Games[0] && player2Games[0].thumbnail) || '';
            newGame();
        }

        function backToSettings() {
            if (confirm('Are you sure you want to go back to settings? Current game will be lost.')) {
                document.getElementById('gameScreen').classList.remove('active');
                document.getElementById('setupScreen').classList.add('active');
            }
        }
    </script>
