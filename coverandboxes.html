<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>📦 Covers & Boxes Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --p1-color: #3b82f6;
            --p2-color: #ef4444;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), transparent),
                              radial-gradient(circle at bottom left, rgba(236, 72, 153, 0.1), transparent);
            color: #f8fafc;
            min-height: 100vh;
            overflow: hidden;
            overscroll-behavior: none;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            max-width: 1000px;
            padding: 1rem;
            flex-direction: column;
            justify-content: center;
        }

        .screen.active { display: flex; }

        /* Force Visible Scrollbar for Pickers */
        .gallery-container {
            overflow-y: scroll !important;
            touch-action: pan-y !important;
            -webkit-overflow-scrolling: touch !important;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.3) transparent;
        }
        .gallery-container::-webkit-scrollbar { width: 6px; }
        .gallery-container::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 10px; }
        .gallery-container::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 10px; }

        .board-container {
            position: relative;
            margin: 0 auto;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 2rem;
            padding: 20px;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .board { position: relative; display: grid; gap: 0; }

        .dot { width: 8px; height: 8px; background: #475569; border-radius: 50%; position: relative; z-index: 10; }

        .line { position: absolute; background: rgba(255, 255, 255, 0.05); cursor: pointer; transition: all 0.2s; z-index: 5; }
        .line:hover { background: rgba(255, 255, 255, 0.2); }
        .line.claimed { cursor: default; }
        .line.claimed.p1 { background: var(--p1-color); box-shadow: 0 0 10px var(--p1-color); }
        .line.claimed.p2 { background: var(--p2-color); box-shadow: 0 0 10px var(--p2-color); }
        .line.horizontal { height: 6px; border-radius: 3px; transform: translateY(-50%); }
        .line.vertical { width: 6px; border-radius: 3px; transform: translateX(-50%); }

        .box {
            position: absolute; display: flex; align-items: center; justify-content: center;
            overflow: hidden; padding: 4px; opacity: 0; transform: scale(0.5);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .box.complete { opacity: 1; transform: scale(1); }
        .box img { width: 100%; height: 100%; object-fit: contain; border-radius: 8px; }

        .player-card { transition: all 0.3s; border-bottom: 4px solid transparent; }
        .player-card.active { background: rgba(255, 255, 255, 0.05); border-bottom-color: currentColor; transform: scale(1.05); }

        @media (max-width: 640px) {
            .board-container { padding: 10px; }
            .dot { width: 6px; height: 6px; }
        }
    </style>
</head>
<body>

    <!-- SETUP SCREEN -->
    <div id="setupScreen" class="screen active">
        <div class="glass p-8 rounded-[2.5rem] shadow-2xl max-w-lg mx-auto w-full space-y-6 overflow-y-auto gallery-container max-h-full">
            <div class="text-center space-y-2">
                <div class="inline-block p-4 bg-indigo-500/20 rounded-2xl mb-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                    </svg>
                </div>
                <h1 class="text-3xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-pink-400 uppercase">Covers & Boxes</h1>
            </div>

            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-500 uppercase ml-1">P1 User</label>
                        <input type="text" id="username1" value="sportomax" class="w-full bg-slate-900/50 border border-slate-700 p-3 rounded-xl text-white text-sm outline-none focus:border-blue-500">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-500 uppercase ml-1">P2 User</label>
                        <input type="text" id="username2" value="sportomax" class="w-full bg-slate-900/50 border border-slate-700 p-3 rounded-xl text-white text-sm outline-none focus:border-red-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-500 uppercase ml-1">Grid Size</label>
                        <select id="gridSize" class="w-full bg-slate-900/50 border border-slate-700 p-3 rounded-xl text-white text-sm outline-none">
                            <option value="3">3x3</option>
                            <option value="4" selected>4x4</option>
                            <option value="5">5x5</option>
                            <option value="6">6x6</option>
                        </select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-500 uppercase ml-1">Box Mode</label>
                        <select id="boxCoverMode" class="w-full bg-slate-900/50 border border-slate-700 p-3 rounded-xl text-white text-sm outline-none">
                            <option value="player">Specific Choice</option>
                            <option value="random">Randomize Each Box</option>
                        </select>
                    </div>
                </div>

                <div class="flex items-center gap-2 bg-slate-900/40 p-3 rounded-xl border border-slate-800">
                    <input type="checkbox" id="includeExpansions" class="w-4 h-4 rounded border-slate-700 text-indigo-600 bg-slate-800">
                    <label for="includeExpansions" class="text-xs text-slate-300">Include expansions</label>
                </div>

                <button onclick="initSetup()" class="w-full bg-gradient-to-r from-indigo-600 to-pink-600 text-white py-4 rounded-2xl text-lg font-black uppercase shadow-xl active:scale-95">
                    Load Collections
                </button>
            </div>
        </div>
    </div>

    <!-- PICKER SCREEN -->
    <div id="pickerScreen" class="screen">
        <div class="glass p-6 rounded-[2.5rem] shadow-2xl max-w-4xl mx-auto w-full space-y-6 flex flex-col h-full md:h-auto max-h-[90vh]">
            <h2 class="text-xl font-black text-center text-indigo-400 uppercase">Choose Your Covers</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 flex-1 overflow-hidden">
                <!-- P1 Picker -->
                <div class="flex flex-col gap-3 overflow-hidden">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-black text-blue-400 uppercase">Player 1</span>
                        <input type="text" id="p1Search" placeholder="Search..." class="bg-slate-900/50 border border-slate-800 rounded-lg px-2 py-1 text-[10px] outline-none">
                    </div>
                    <div id="p1Gallery" class="grid grid-cols-4 gap-2 gallery-container p-2 bg-slate-950/30 rounded-2xl flex-1"></div>
                </div>
                <!-- P2 Picker -->
                <div class="flex flex-col gap-3 overflow-hidden">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-black text-red-400 uppercase">Player 2</span>
                        <input type="text" id="p2Search" placeholder="Search..." class="bg-slate-900/50 border border-slate-800 rounded-lg px-2 py-1 text-[10px] outline-none">
                    </div>
                    <div id="p2Gallery" class="grid grid-cols-4 gap-2 gallery-container p-2 bg-slate-950/30 rounded-2xl flex-1"></div>
                </div>
            </div>

            <div class="flex gap-3">
                <button onclick="showScreen('setup')" class="flex-1 glass py-4 rounded-2xl font-black text-[10px] text-slate-400 uppercase">Back</button>
                <button onclick="finalizeAndStart()" class="flex-[2] bg-indigo-600 text-white py-4 rounded-2xl font-black text-xs uppercase shadow-lg">Start Game</button>
            </div>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="gameScreen" class="screen">
        <div class="flex flex-col gap-4 max-w-2xl mx-auto w-full h-full justify-between py-4">
            <div class="grid grid-cols-2 gap-4">
                <div id="p1Card" class="glass player-card rounded-3xl p-4 flex items-center gap-4 text-blue-400">
                    <div class="relative">
                        <img id="p1Thumb" class="w-12 h-12 rounded-xl object-contain bg-slate-900/50 border-2 border-blue-500/30">
                        <div id="p1Score" class="absolute -bottom-2 -right-2 glass w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-black border-blue-500">0</div>
                    </div>
                    <div><div class="text-[8px] font-black uppercase opacity-50">Player 1</div><div id="p1Name" class="text-xs font-black truncate">?</div></div>
                </div>
                <div id="p2Card" class="glass player-card rounded-3xl p-4 flex items-center gap-4 text-red-400 text-right justify-end">
                    <div><div class="text-[8px] font-black uppercase opacity-50">Player 2</div><div id="p2Name" class="text-xs font-black truncate">?</div></div>
                    <div class="relative">
                        <img id="p2Thumb" class="w-12 h-12 rounded-xl object-contain bg-slate-900/50 border-2 border-red-500/30">
                        <div id="p2Score" class="absolute -bottom-2 -left-2 glass w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-black border-red-500">0</div>
                    </div>
                </div>
            </div>
            <div class="flex-1 flex items-center justify-center overflow-hidden p-2">
                <div id="boardContainer" class="board-container shadow-2xl"><div id="board" class="board"></div></div>
            </div>
            <div class="grid grid-cols-3 gap-3">
                <button onclick="newGame()" class="glass py-4 rounded-2xl text-[10px] font-black uppercase text-slate-400">Restart</button>
                <button id="randomizeAllBtn" onclick="randomizeBoardCovers()" class="hidden glass py-4 rounded-2xl text-[10px] font-black uppercase text-indigo-400">Shuffle</button>
                <button onclick="showScreen('setup')" class="glass py-4 rounded-2xl text-[10px] font-black uppercase text-red-400">Settings</button>
            </div>
        </div>
    </div>

    <!-- WINNER MODAL -->
    <div id="winnerModal" class="fixed inset-0 z-[1000] hidden items-center justify-center p-6">
        <div class="absolute inset-0 bg-slate-950/90 backdrop-blur-md"></div>
        <div class="glass p-10 rounded-[3rem] shadow-2xl text-center space-y-6 relative max-w-sm w-full">
            <div class="text-5xl">🏆</div>
            <h2 id="winnerText" class="text-3xl font-black bg-clip-text text-transparent bg-gradient-to-r from-yellow-400 to-orange-500 uppercase">Winner!</h2>
            <div class="flex justify-center"><img id="winnerThumb" class="w-32 h-32 rounded-3xl object-contain glass p-2 border-4 border-yellow-500/50"></div>
            <button onclick="newGame()" class="w-full bg-yellow-600 text-white py-4 rounded-2xl font-black uppercase">Play Again</button>
        </div>
    </div>

    <!-- LOADER -->
    <div id="loader" class="fixed inset-0 z-[2000] hidden flex flex-col items-center justify-center bg-slate-950/80 backdrop-blur-sm">
        <div class="w-16 h-16 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 text-white font-black uppercase text-xs">Fetching Collection</p>
    </div>

    <script>
        const state = { gridSize: 4, currentPlayer: 1, player1: { name: '', games: [], score: 0, coverIdx: 0 }, player2: { name: '', games: [], score: 0, coverIdx: 0 }, boxes: [], gameActive: false, mode: 'player' };
        const screens = { setup: document.getElementById('setupScreen'), picker: document.getElementById('pickerScreen'), game: document.getElementById('gameScreen') };

        function showScreen(id) {
            Object.values(screens).forEach(s => s.classList.remove('active'));
            screens[id].classList.add('active');
            if (id === 'game') adjustBoardScale();
        }

        async function initSetup() {
            const u1 = document.getElementById('username1').value.trim() || 'sportomax';
            const u2 = document.getElementById('username2').value.trim() || 'sportomax';
            const includeExp = document.getElementById('includeExpansions').checked;
            state.gridSize = parseInt(document.getElementById('gridSize').value);
            state.mode = document.getElementById('boxCoverMode').value;
            document.getElementById('loader').classList.remove('hidden');
            try {
                const subtype = includeExp ? '' : '&subtype=boardgame';
                const [r1, r2] = await Promise.all([
                    fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(u1)}&own=1${subtype}&stats=1`),
                    fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(u2)}&own=1${subtype}&stats=1`)
                ]);
                const [x1, x2] = await Promise.all([r1.text(), r2.text()]);
                const parser = new DOMParser();
                const parse = (x) => Array.from(parser.parseFromString(x, 'text/xml').querySelectorAll('item')).map(it => ({ name: it.querySelector('name')?.textContent || 'Unknown', thumb: it.querySelector('thumbnail')?.textContent || '' })).filter(g => g.thumb);
                state.player1.games = parse(x1); state.player2.games = parse(x2);
                state.player1.name = u1; state.player2.name = u2;
                if (state.player1.games.length < 5 || state.player2.games.length < 5) throw new Error('Not enough games');
                renderGalleries(); showScreen('picker');
            } catch (err) { alert(err.message); } finally { document.getElementById('loader').classList.add('hidden'); }
        }

        function renderGalleries(p1Filter = '', p2Filter = '') {
            const render = (container, games, player, filter) => {
                const filtered = filter ? games.filter(g => g.name.toLowerCase().includes(filter.toLowerCase())) : games;
                container.innerHTML = filtered.map(g => {
                    const idx = games.indexOf(g);
                    const active = (player === 1 ? state.player1.coverIdx : state.player2.coverIdx) === idx;
                    return `<div onclick="selectCover(${player}, ${idx})" class="aspect-square rounded-lg glass p-1 cursor-pointer transition-all border-2 ${active ? (player === 1 ? 'border-blue-500 scale-105' : 'border-red-500 scale-105') : 'border-transparent'}"><img src="${g.thumb}" class="w-full h-full object-contain rounded-md"></div>`;
                }).join('');
            };
            render(document.getElementById('p1Gallery'), state.player1.games, 1, p1Filter);
            render(document.getElementById('p2Gallery'), state.player2.games, 2, p2Filter);
        }

        function selectCover(p, idx) { if (p === 1) state.player1.coverIdx = idx; else state.player2.coverIdx = idx; renderGalleries(document.getElementById('p1Search').value, document.getElementById('p2Search').value); }
        document.getElementById('p1Search').oninput = (e) => renderGalleries(e.target.value, document.getElementById('p2Search').value);
        document.getElementById('p2Search').oninput = (e) => renderGalleries(document.getElementById('p1Search').value, e.target.value);

        function finalizeAndStart() {
            document.getElementById('p1Name').textContent = state.player1.name; document.getElementById('p2Name').textContent = state.player2.name;
            document.getElementById('p1Thumb').src = state.player1.games[state.player1.coverIdx].thumb;
            document.getElementById('p2Thumb').src = state.player2.games[state.player2.coverIdx].thumb;
            document.getElementById('randomizeAllBtn').classList.toggle('hidden', state.mode !== 'random');
            showScreen('game'); newGame();
        }

        function newGame() {
            state.currentPlayer = 1; state.player1.score = 0; state.player2.score = 0; state.gameActive = true; state.boxes = [];
            document.getElementById('winnerModal').classList.add('hidden');
            const count = state.gridSize - 1;
            for (let i = 0; i < count * count; i++) { state.boxes.push({ t: false, r: false, b: false, l: false, owner: null, p1Thumb: state.player1.games[Math.floor(Math.random() * state.player1.games.length)].thumb, p2Thumb: state.player2.games[Math.floor(Math.random() * state.player2.games.length)].thumb }); }
            renderBoard(); updateUI();
        }

        function renderBoard() {
            const board = document.getElementById('board'); const size = state.gridSize; const cellSize = 60; const totalSize = (size - 1) * cellSize;
            board.style.width = `${totalSize}px`; board.style.height = `${totalSize}px`; board.innerHTML = '';
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const dot = document.createElement('div'); dot.className = 'dot'; dot.style.position = 'absolute'; dot.style.left = `${c * cellSize}px`; dot.style.top = `${r * cellSize}px`; dot.style.transform = 'translate(-50%, -50%)'; board.appendChild(dot);
                    if (c < size - 1) { const h = document.createElement('div'); h.className = 'line horizontal'; h.style.width = `${cellSize}px`; h.style.left = `${c * cellSize}px`; h.style.top = `${r * cellSize}px`; h.onclick = () => handleLineClick(h, 'h', r, c); board.appendChild(h); }
                    if (r < size - 1) { const v = document.createElement('div'); v.className = 'line vertical'; v.style.height = `${cellSize}px`; v.style.left = `${c * cellSize}px`; v.style.top = `${r * cellSize}px`; v.onclick = () => handleLineClick(v, 'v', r, c); board.appendChild(v); }
                }
            }
        }

        function handleLineClick(el, type, r, c) {
            if (!state.gameActive || el.classList.contains('claimed')) return;
            el.classList.add('claimed', `p${state.currentPlayer}`); let boxMade = false; const size = state.gridSize - 1;
            if (type === 'h') { if (r > 0) boxMade |= check((r - 1) * size + c, 'b'); if (r < size) boxMade |= check(r * size + c, 't'); }
            else { if (c > 0) boxMade |= check(r * size + (c - 1), 'r'); if (c < size) boxMade |= check(r * size + c, 'l'); }
            if (!boxMade) state.currentPlayer = state.currentPlayer === 1 ? 2 : 1;
            updateUI(); checkGameOver();
        }

        function check(idx, side) {
            const b = state.boxes[idx]; b[side] = true;
            if (b.t && b.r && b.b && b.l && !b.owner) { b.owner = state.currentPlayer; if (state.currentPlayer === 1) state.player1.score++; else state.player2.score++; draw(idx); return true; }
            return false;
        }

        function draw(idx) {
            const size = state.gridSize - 1; const r = Math.floor(idx / size); const c = idx % size; const cellSize = 60; const b = state.boxes[idx];
            const el = document.createElement('div'); el.className = 'box complete'; el.style.width = `${cellSize}px`; el.style.height = `${cellSize}px`; el.style.left = `${c * cellSize}px`; el.style.top = `${r * cellSize}px`;
            const thumb = state.mode === 'player' ? (b.owner === 1 ? state.player1.games[state.player1.coverIdx].thumb : state.player2.games[state.player2.coverIdx].thumb) : (b.owner === 1 ? b.p1Thumb : b.p2Thumb);
            el.innerHTML = `<img src="${thumb}" style="border: 2px solid ${b.owner === 1 ? 'var(--p1-color)' : 'var(--p2-color)'}">`;
            document.getElementById('board').appendChild(el);
        }

        function updateUI() {
            document.getElementById('p1Score').textContent = state.player1.score; document.getElementById('p2Score').textContent = state.player2.score;
            document.getElementById('p1Card').className = `glass player-card rounded-3xl p-4 flex items-center gap-4 text-blue-400 ${state.currentPlayer === 1 ? 'active shadow-[0_0_20px_rgba(59,130,246,0.3)]' : 'opacity-40'}`;
            document.getElementById('p2Card').className = `glass player-card rounded-3xl p-4 flex items-center gap-4 text-red-400 text-right justify-end ${state.currentPlayer === 2 ? 'active shadow-[0_0_20px_rgba(239,68,68,0.3)]' : 'opacity-40'}`;
        }

        function randomizeBoardCovers() {
            state.boxes.forEach(b => { b.p1Thumb = state.player1.games[Math.floor(Math.random() * state.player1.games.length)].thumb; b.p2Thumb = state.player2.games[Math.floor(Math.random() * state.player2.games.length)].thumb; });
            document.querySelectorAll('.box.complete').forEach(el => el.remove());
            state.boxes.forEach((b, i) => { if (b.owner) draw(i); });
        }

        function checkGameOver() { if (state.player1.score + state.player2.score === (state.gridSize - 1)**2) { state.gameActive = false; setTimeout(showWinner, 600); } }

        function showWinner() {
            const w = state.player1.score > state.player2.score ? 1 : (state.player2.score > state.player1.score ? 2 : 0);
            const modal = document.getElementById('winnerModal');
            if (w === 0) { document.getElementById('winnerText').textContent = "Tie!"; document.getElementById('winnerThumb').src = state.player1.games[state.player1.coverIdx].thumb; }
            else { const d = w === 1 ? state.player1 : state.player2; document.getElementById('winnerText').textContent = `${d.name} Wins!`; document.getElementById('winnerThumb').src = d.games[d.coverIdx].thumb; if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]); }
            modal.classList.remove('hidden'); modal.classList.add('flex');
        }

        function adjustBoardScale() {
            const board = document.getElementById('board'); const boardSize = (state.gridSize - 1) * 60;
            const scale = Math.min(1, (window.innerWidth - 40) / boardSize, (window.innerHeight - 300) / boardSize);
            board.style.transform = `scale(${scale})`;
        }
        window.onresize = adjustBoardScale;
    </script>
</body>
</html>
