<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Scorepad</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>📝</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="font-bold text-xl">📝 Scorepad</h1>
            <button onclick="resetGame()" class="text-sm bg-blue-700 px-3 py-1 rounded hover:bg-blue-800">New Game</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-md mx-auto w-full p-4">
        
        <!-- Setup Section -->
        <div id="setupSection" class="bg-white rounded-xl shadow-sm p-6 mb-6">
            <h2 class="text-lg font-bold text-gray-800 mb-4">Add Players</h2>
            <div class="flex gap-2 mb-4">
                <input type="text" id="playerNameInput" placeholder="Player Name" class="flex-1 border rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none" onkeypress="handleEnter(event)">
                <button onclick="addPlayer()" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-blue-700">+</button>
            </div>
            <div id="playerListSetup" class="flex flex-wrap gap-2">
                <!-- Player tags go here -->
            </div>
            <button onclick="startGame()" id="startBtn" class="w-full mt-6 bg-green-600 text-white py-3 rounded-lg font-bold text-lg shadow-lg hover:bg-green-700 transition hidden">
                Start Scoring
            </button>
        </div>

        <!-- Scoring Section -->
        <div id="scoringSection" class="hidden space-y-4">
            <div id="scoreList" class="space-y-3">
                <!-- Player Score Cards -->
            </div>
            
            <div class="mt-8 p-4 bg-yellow-50 rounded-lg border border-yellow-100 text-center">
                <h3 class="font-bold text-yellow-800 text-lg mb-2">🏆 Current Leader</h3>
                <p id="leaderText" class="text-2xl font-bold text-yellow-600">-</p>
            </div>
        </div>

    </main>

    <!-- Add Score Modal -->
    <div id="scoreModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-end sm:items-center justify-center">
        <div class="bg-white w-full max-w-md rounded-t-xl sm:rounded-xl p-6 animate-slide-up">
            <h3 class="text-xl font-bold mb-4">Add Score for <span id="modalPlayerName" class="text-blue-600"></span></h3>
            
            <div class="grid grid-cols-3 gap-3 mb-4">
                <button onclick="addToInput(1)" class="p-4 bg-gray-100 rounded-lg font-bold text-xl hover:bg-gray-200">1</button>
                <button onclick="addToInput(5)" class="p-4 bg-gray-100 rounded-lg font-bold text-xl hover:bg-gray-200">5</button>
                <button onclick="addToInput(10)" class="p-4 bg-gray-100 rounded-lg font-bold text-xl hover:bg-gray-200">10</button>
            </div>

            <div class="flex gap-2 mb-6">
                <button onclick="adjustInput(-1)" class="px-4 py-2 bg-red-100 text-red-600 rounded-lg font-bold">-</button>
                <input type="number" id="scoreInput" class="flex-1 text-center text-2xl font-bold border rounded-lg py-2" value="0">
                <button onclick="adjustInput(1)" class="px-4 py-2 bg-green-100 text-green-600 rounded-lg font-bold">+</button>
            </div>

            <div class="flex gap-3">
                <button onclick="closeModal()" class="flex-1 py-3 text-gray-600 font-bold hover:bg-gray-100 rounded-lg">Cancel</button>
                <button onclick="confirmScore()" class="flex-1 py-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700">Add Points</button>
            </div>
        </div>
    </div>

    <script>
        let players = [];
        let activePlayerIndex = null;

        // Load from local storage on init
        const saved = localStorage.getItem('scorepad_data');
        if (saved) {
            const data = JSON.parse(saved);
            players = data.players || [];
            if (players.length > 0 && data.gameActive) {
                showScoring();
            } else {
                renderSetupList();
            }
        }

        function handleEnter(e) {
            if (e.key === 'Enter') addPlayer();
        }

        function addPlayer() {
            const input = document.getElementById('playerNameInput');
            const name = input.value.trim();
            if (!name) return;
            
            players.push({ name, score: 0, history: [] });
            input.value = '';
            renderSetupList();
            saveData();
        }

        function renderSetupList() {
            const container = document.getElementById('playerListSetup');
            container.innerHTML = players.map((p, i) => `
                <div class="bg-gray-100 px-3 py-1 rounded-full flex items-center gap-2">
                    <span>${p.name}</span>
                    <button onclick="removePlayer(${i})" class="text-red-500 font-bold hover:text-red-700">&times;</button>
                </div>
            `).join('');
            
            const startBtn = document.getElementById('startBtn');
            if (players.length > 0) startBtn.classList.remove('hidden');
            else startBtn.classList.add('hidden');
        }

        function removePlayer(index) {
            players.splice(index, 1);
            renderSetupList();
            saveData();
        }

        function startGame() {
            if (players.length === 0) return;
            showScoring();
            saveData(true);
        }

        function showScoring() {
            document.getElementById('setupSection').classList.add('hidden');
            document.getElementById('scoringSection').classList.remove('hidden');
            renderScores();
        }

        function renderScores() {
            const container = document.getElementById('scoreList');
            
            // Sort for display but keep original index for editing? 
            // Better to just map and find max.
            const maxScore = Math.max(...players.map(p => p.score));
            
            container.innerHTML = players.map((p, i) => `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center ${p.score === maxScore && p.score > 0 ? 'ring-2 ring-yellow-400' : ''}">
                    <div>
                        <div class="font-bold text-lg text-gray-800">${p.name}</div>
                        <div class="text-xs text-gray-400">${p.history.length > 0 ? 'Last: +' + p.history[p.history.length-1] : 'No points yet'}</div>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="text-3xl font-bold text-blue-600">${p.score}</div>
                        <button onclick="openScoreModal(${i})" class="bg-blue-50 text-blue-600 w-10 h-10 rounded-full flex items-center justify-center font-bold text-xl hover:bg-blue-100 transition">+</button>
                    </div>
                </div>
            `).join('');

            // Update leader
            const leaders = players.filter(p => p.score === maxScore);
            if (maxScore === 0) document.getElementById('leaderText').textContent = '-';
            else document.getElementById('leaderText').textContent = leaders.map(l => l.name).join(' & ') + ` (${maxScore})`;
        }

        function openScoreModal(index) {
            activePlayerIndex = index;
            document.getElementById('modalPlayerName').textContent = players[index].name;
            document.getElementById('scoreInput').value = '0';
            document.getElementById('scoreModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('scoreModal').classList.add('hidden');
        }

        function addToInput(val) {
            const input = document.getElementById('scoreInput');
            input.value = parseInt(input.value || 0) + val;
        }

        function adjustInput(delta) {
            const input = document.getElementById('scoreInput');
            input.value = parseInt(input.value || 0) + delta;
        }

        function confirmScore() {
            const val = parseInt(document.getElementById('scoreInput').value || 0);
            if (val !== 0 && activePlayerIndex !== null) {
                players[activePlayerIndex].score += val;
                players[activePlayerIndex].history.push(val);
                renderScores();
                saveData(true);
            }
            closeModal();
        }

        function resetGame() {
            if (confirm('Start a new game? Current scores will be lost.')) {
                players = [];
                document.getElementById('scoringSection').classList.add('hidden');
                document.getElementById('setupSection').classList.remove('hidden');
                renderSetupList();
                saveData(false);
            }
        }

        function saveData(gameActive = false) {
            localStorage.setItem('scorepad_data', JSON.stringify({
                players,
                gameActive
            }));
        }
    </script>
    <style>
        @keyframes slide-up {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slide-up 0.3s ease-out;
        }
    </style>
    <!-- Vercel Web Analytics -->
    <script type="module" src="analytics-init.js"></script>

</body>
</html>
