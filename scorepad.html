<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EliteScore Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: black;
            color: white;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }

        .ios-blur {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .jog-dial {
            touch-action: none;
            cursor: pointer;
            position: relative;
            user-select: none;
        }

        .jog-dial-inner {
            transition: transform 0.05s linear;
            will-change: transform;
        }

        .custom-scrollbar::-webkit-scrollbar {
            display: none;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-animate {
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        #app-container {
            height: calc(100vh - 180px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .quick-btn {
            transition: all 0.1s ease;
        }
        .quick-btn:active {
            transform: scale(0.9);
            background-color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Header -->
    <header class="z-30 px-6 py-6 flex items-center justify-between bg-black/80 ios-blur shrink-0">
        <div>
            <h1 id="game-title-display" class="text-3xl font-black tracking-tighter">Quick Score</h1>
            <p class="text-[10px] font-black uppercase tracking-widest text-blue-500">Enhanced Jog Dial</p>
        </div>
        <div class="flex gap-2">
            <button onclick="undoLastAction()" class="w-12 h-12 bg-zinc-900 rounded-2xl flex items-center justify-center text-zinc-400 active:bg-zinc-800 transition-colors">
                <i data-lucide="undo-2"></i>
            </button>
            <button onclick="toggleSetup(true)" class="w-12 h-12 bg-zinc-900 rounded-2xl flex items-center justify-center text-zinc-400">
                <i data-lucide="settings-2"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main id="app-container" class="flex-1 px-4 space-y-4 pt-4 custom-scrollbar">
        <!-- Players injected here -->
    </main>

    <!-- History View -->
    <main id="history-container" class="hidden flex-1 px-4 space-y-3 pt-4 overflow-y-auto custom-scrollbar">
        <!-- Log entries injected here -->
    </main>

    <!-- Bottom Navigation -->
    <nav class="shrink-0 p-6 pb-10 flex justify-center bg-gradient-to-t from-black via-black to-transparent">
        <div class="w-full max-w-sm bg-zinc-900/90 ios-blur border border-white/10 p-1.5 rounded-full shadow-2xl flex">
            <button onclick="switchTab('scoreboard')" id="nav-scores" class="flex-1 py-4 rounded-full flex items-center justify-center gap-2 transition-all bg-white text-black">
                <i data-lucide="trophy" class="w-4 h-4"></i>
                <span class="text-[10px] font-black uppercase">Scores</span>
            </button>
            <button onclick="switchTab('history')" id="nav-logs" class="flex-1 py-4 rounded-full flex items-center justify-center gap-2 transition-all text-zinc-500">
                <i data-lucide="history" class="w-4 h-4"></i>
                <span class="text-[10px] font-black uppercase">Logs</span>
            </button>
        </div>
    </nav>

    <!-- Setup Modal -->
    <div id="setup-modal" class="fixed inset-0 z-50 hidden flex items-end justify-center">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-md" onclick="toggleSetup(false)"></div>
        <div class="relative w-full max-w-lg bg-zinc-900 rounded-t-[3rem] p-8 pb-12 shadow-2xl modal-animate max-h-[90vh] overflow-y-auto custom-scrollbar">
            <div class="flex items-center justify-between mb-8">
                <h2 class="text-2xl font-black">Customize Game</h2>
                <button onclick="toggleSetup(false)" class="p-2 bg-zinc-800 rounded-full"><i data-lucide="x"></i></button>
            </div>
            <div class="space-y-8">
                <div>
                    <label class="text-[10px] font-black text-zinc-500 uppercase tracking-widest mb-3 block">Game Title</label>
                    <input type="text" id="game-title-input" class="w-full bg-black border border-zinc-800 rounded-2xl p-4 font-bold outline-none focus:border-blue-500 text-white">
                </div>
                <div class="space-y-4">
                    <label class="text-[10px] font-black text-zinc-500 uppercase tracking-widest block">Players</label>
                    <div id="setup-players-list" class="space-y-4"></div>
                    <button onclick="addPlayer()" class="w-full py-4 border-2 border-dashed border-zinc-800 rounded-2xl text-zinc-500 font-bold hover:text-white transition-colors">
                        + Add New Player
                    </button>
                </div>
                <div class="flex gap-4 pt-4">
                    <button onclick="resetAll()" class="flex-1 bg-rose-500/10 text-rose-500 py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest border border-rose-500/20">Clear All</button>
                    <button onclick="toggleSetup(false)" class="flex-1 bg-white text-black py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest shadow-xl">Done</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let players = [
            { id: 1, name: 'Player 1', score: 0, color: 'bg-blue-500', emoji: '🎯' },
            { id: 2, name: 'Player 2', score: 0, color: 'bg-rose-500', emoji: '🎲' }
        ];
        let history = [];
        let gameTitle = "Quick Score";

        const colorPalette = ['bg-blue-500', 'bg-rose-500', 'bg-emerald-500', 'bg-amber-500', 'bg-violet-500', 'bg-sky-500', 'bg-orange-500', 'bg-fuchsia-500'];
        const emojiPalette = ['🎯', '🎲', '👾', '🔥', '⭐️', '🏆', '💎', '🚀', '👑', '🐼'];

        function initIcons() { lucide.createIcons(); }

        function renderScoreboard() {
            const container = document.getElementById('app-container');
            container.innerHTML = players.map(p => `
                <div class="relative bg-zinc-900/40 border border-zinc-800/80 rounded-[2.5rem] p-6 flex items-center justify-between overflow-hidden">
                    <div class="flex flex-col gap-1 z-10 pointer-events-none w-1/2">
                        <span class="text-3xl">${p.emoji}</span>
                        <h3 class="text-zinc-500 font-bold text-[10px] tracking-widest uppercase truncate">${p.name}</h3>
                        <div class="text-5xl font-black text-white tabular-nums" id="score-display-${p.id}">${p.score}</div>
                        
                        <!-- Quick Hit Buttons -->
                        <div class="flex flex-wrap gap-1.5 mt-3 pointer-events-auto">
                            <button onclick="changeScore(${p.id}, -5)" class="quick-btn bg-rose-500/10 border border-rose-500/20 text-rose-500 px-2.5 py-1 rounded-lg text-[10px] font-black">-5</button>
                            <button onclick="changeScore(${p.id}, -1)" class="quick-btn bg-rose-500/10 border border-rose-500/20 text-rose-500 px-2.5 py-1 rounded-lg text-[10px] font-black">-1</button>
                            <button onclick="changeScore(${p.id}, 1)" class="quick-btn bg-white/5 border border-white/10 px-2.5 py-1 rounded-lg text-[10px] font-black">+1</button>
                            <button onclick="changeScore(${p.id}, 5)" class="quick-btn bg-white/5 border border-white/10 px-2.5 py-1 rounded-lg text-[10px] font-black">+5</button>
                            <button onclick="changeScore(${p.id}, 10)" class="quick-btn bg-white/5 border border-white/10 px-2.5 py-1 rounded-lg text-[10px] font-black">+10</button>
                        </div>
                    </div>

                    <!-- Spin Wheel (Jog Dial) -->
                    <div class="jog-dial relative w-36 h-36 flex items-center justify-center" 
                         onpointerdown="startJog(event, ${p.id})">
                        <svg class="w-full h-full absolute inset-0 -rotate-90" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="2" class="text-zinc-800" />
                            <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="8" stroke-dasharray="1 10" class="text-zinc-700 opacity-20" />
                        </svg>
                        <div id="dial-visual-${p.id}" class="jog-dial-inner w-24 h-24 rounded-full border-4 border-zinc-700 bg-zinc-800 flex items-center justify-center shadow-2xl relative">
                            <div class="w-1.5 h-6 bg-blue-500 rounded-full shadow-[0_0_10px_rgba(59,130,246,0.5)] absolute top-2"></div>
                            <div class="text-zinc-500 pointer-events-none select-none">
                                <i data-lucide="compass" class="w-8 h-8 opacity-10"></i>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
            initIcons();
        }

        function renderHistory() {
            const container = document.getElementById('history-container');
            if (history.length === 0) {
                container.innerHTML = `<p class="text-center py-20 text-zinc-600 font-bold uppercase tracking-widest">No History</p>`;
                return;
            }
            container.innerHTML = history.map(h => `
                <div class="bg-zinc-900/50 border border-zinc-800 p-4 rounded-2xl flex justify-between items-center animate-in fade-in slide-in-from-top-2">
                    <div class="flex items-center gap-3">
                        <div class="w-1 h-6 rounded-full ${h.color}"></div>
                        <span class="font-bold">${h.playerName}</span>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="text-[9px] text-zinc-700 font-black uppercase tracking-tighter">${h.type || 'TAP'}</span>
                        <span class="font-black ${h.amount >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${h.change}</span>
                        <span class="text-[10px] text-zinc-600 font-bold uppercase">${h.time}</span>
                    </div>
                </div>
            `).join('');
        }

        function changeScore(id, amount, skipLog = false, type = 'TAP') {
            const player = players.find(p => p.id === id);
            if (!player) return;
            player.score += amount;
            
            if (!skipLog) {
                const log = {
                    id: Date.now() + Math.random(),
                    playerId: id,
                    playerName: player.name,
                    change: amount >= 0 ? `+${amount}` : `${amount}`,
                    amount: amount,
                    type: type,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                    color: player.color
                };
                history.unshift(log);
                history = history.slice(0, 50);
                renderHistory();
            }
            
            // Selective update for speed
            const display = document.getElementById(`score-display-${id}`);
            if (display) display.innerText = player.score;
        }

        function undoLastAction() {
            if (history.length === 0) return;
            const last = history.shift();
            const player = players.find(p => p.id === last.playerId);
            if (player) {
                player.score -= last.amount;
                renderScoreboard();
                renderHistory();
            }
        }

        // Jog Dial Logic
        let jogState = { active: false, id: null, lastAngle: 0, accumulator: 0, sessionChange: 0 };
        const JOG_THRESHOLD = 25; // Degrees per point

        function startJog(e, id) {
            jogState.active = true;
            jogState.id = id;
            jogState.accumulator = 0;
            jogState.sessionChange = 0;
            
            const rect = e.currentTarget.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            const getAngle = (px, py) => Math.atan2(py - centerY, px - centerX) * (180 / Math.PI);
            jogState.lastAngle = getAngle(e.clientX, e.clientY);
            
            e.currentTarget.setPointerCapture(e.pointerId);
            
            const moveHandler = (moveEvent) => {
                if (!jogState.active) return;
                const currentAngle = getAngle(moveEvent.clientX, moveEvent.clientY);
                let delta = currentAngle - jogState.lastAngle;
                
                if (delta > 180) delta -= 360;
                if (delta < -180) delta += 360;

                jogState.accumulator += delta;
                jogState.lastAngle = currentAngle;

                // Visual Rotation
                const dial = document.getElementById(`dial-visual-${id}`);
                if (dial) dial.style.transform = `rotate(${jogState.accumulator}deg)`;

                if (Math.abs(jogState.accumulator) >= JOG_THRESHOLD) {
                    const points = Math.floor(jogState.accumulator / JOG_THRESHOLD);
                    if (points !== 0) {
                        jogState.sessionChange += points;
                        // Update score immediately but skip individual logging
                        changeScore(id, points, true); 
                        jogState.accumulator %= JOG_THRESHOLD;
                    }
                }
            };

            const upHandler = () => {
                jogState.active = false;
                
                // Finalize Logging for the whole spin session
                if (jogState.sessionChange !== 0) {
                    const player = players.find(p => p.id === id);
                    const log = {
                        id: Date.now() + Math.random(),
                        playerId: id,
                        playerName: player.name,
                        change: jogState.sessionChange >= 0 ? `+${jogState.sessionChange}` : `${jogState.sessionChange}`,
                        amount: jogState.sessionChange,
                        type: 'SPIN',
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                        color: player.color
                    };
                    history.unshift(log);
                    history = history.slice(0, 50);
                    renderHistory();
                }

                const dial = document.getElementById(`dial-visual-${id}`);
                if (dial) dial.style.transform = `rotate(0deg)`;
                
                window.removeEventListener('pointermove', moveHandler);
                window.removeEventListener('pointerup', upHandler);
            };

            window.addEventListener('pointermove', moveHandler);
            window.addEventListener('pointerup', upHandler);
        }

        // Setup & Helpers
        function toggleSetup(show) {
            const m = document.getElementById('setup-modal');
            m.style.display = show ? 'flex' : 'none';
            if (show) renderSetup();
        }

        function renderSetup() {
            const list = document.getElementById('setup-players-list');
            list.innerHTML = players.map(p => `
                <div class="bg-black/50 p-4 rounded-2xl border border-zinc-800 flex flex-col gap-4">
                    <div class="flex gap-2">
                        <select onchange="updatePlayer(${p.id}, 'emoji', this.value)" class="bg-zinc-800 text-white rounded-xl p-2 outline-none">
                            ${emojiPalette.map(e => `<option value="${e}" ${p.emoji === e ? 'selected' : ''}>${e}</option>`).join('')}
                        </select>
                        <input type="text" value="${p.name}" oninput="updatePlayer(${p.id}, 'name', this.value)" class="flex-1 bg-zinc-800 border-none rounded-xl px-4 font-bold outline-none text-white">
                        <button onclick="deletePlayer(${p.id})" class="p-2 text-rose-500"><i data-lucide="trash-2"></i></button>
                    </div>
                </div>
            `).join('');
            initIcons();
        }

        function updatePlayer(id, field, value) {
            const p = players.find(x => x.id === id);
            if (p) { p[field] = value; renderScoreboard(); }
        }

        function addPlayer() {
            if (players.length >= 8) return;
            players.push({ id: Date.now(), name: `Player ${players.length+1}`, score: 0, color: colorPalette[players.length % colorPalette.length], emoji: '🐼' });
            renderScoreboard(); renderSetup();
        }

        function deletePlayer(id) {
            if (players.length > 1) { players = players.filter(p => p.id !== id); renderScoreboard(); renderSetup(); }
        }

        function resetAll() {
            players.forEach(p => p.score = 0);
            history = [];
            renderScoreboard();
            renderHistory();
            toggleSetup(false);
        }

        function switchTab(tab) {
            document.getElementById('app-container').classList.toggle('hidden', tab !== 'scoreboard');
            document.getElementById('history-container').classList.toggle('hidden', tab === 'scoreboard');
            document.getElementById('nav-scores').className = tab === 'scoreboard' ? 'flex-1 py-4 rounded-full flex items-center justify-center gap-2 transition-all bg-white text-black' : 'flex-1 py-4 rounded-full flex items-center justify-center gap-2 transition-all text-zinc-500';
            document.getElementById('nav-logs').className = tab !== 'scoreboard' ? 'flex-1 py-4 rounded-full flex items-center justify-center gap-2 transition-all bg-white text-black' : 'flex-1 py-4 rounded-full flex items-center justify-center gap-2 transition-all text-zinc-500';
        }

        document.getElementById('game-title-input').addEventListener('input', e => {
            gameTitle = e.target.value;
            document.getElementById('game-title-display').innerText = gameTitle;
        });

        window.onload = () => { renderScoreboard(); initIcons(); };
    </script>
</body>
</html>
