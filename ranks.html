<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGG Top Ranked</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .rank-badge { 
            clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 50% 85%, 0% 100%);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <!-- Setup Screen -->
    <div id="setupScreen" class="fixed inset-0 bg-gradient-to-br from-indigo-900 to-purple-900 z-50 flex items-center justify-center p-4 md:p-8">
        <div class="bg-white rounded-2xl shadow-2xl p-6 md:p-8 max-w-md w-full">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-900 mb-2 text-center">🏆 BGG Rankings</h1>
            <p class="text-gray-500 text-center text-sm md:text-base mb-8">Explore the highest rated games</p>
            
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">🏆 Top Ranked</label>
                    <p class="text-sm text-gray-600 mb-4">BoardGameGeek's highest rated games</p>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Quantity</label>
                    <input type="number" id="limitInput" class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 focus:border-purple-500 outline-none transition text-base" value="100" min="1" max="500">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">📚 Collection Username (Optional)</label>
                    <input type="text" id="usernameInput" class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 focus:border-purple-500 outline-none transition text-base" placeholder="Enter BGG username" value="sportomax">
                    <p class="text-xs text-gray-500 mt-1">Compare with your owned/prev-owned games</p>
                </div>
                
                <button onclick="fetchGames()" class="w-full bg-purple-600 text-white py-3 md:py-4 rounded-xl font-bold text-base md:text-lg hover:bg-purple-700 transition shadow-lg transform hover:scale-[1.02]">
                    Load Games
                </button>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" class="hidden flex-1 flex flex-col w-full">
        <!-- Progress Bar at Top -->
        <div id="progressContainer" class="w-full h-1 bg-gray-200 sticky top-0 z-50 overflow-hidden hidden">
            <div id="progressBar" class="h-full bg-gradient-to-r from-purple-500 to-purple-600 w-0 transition-all duration-300"></div>
        </div>

        <!-- Progress Info Bar -->
        <div id="progressInfo" class="bg-purple-50 border-b border-purple-200 px-3 md:px-4 py-2 sticky top-1 z-40 hidden">
            <div class="max-w-5xl mx-auto flex items-center justify-between">
                <div>
                    <p class="text-xs md:text-sm font-medium text-purple-900" id="progressText">Loading...</p>
                </div>
                <div class="text-xs text-purple-700" id="progressCount"></div>
            </div>
        </div>

        <header class="bg-white shadow-sm sticky top-8 md:top-9 z-30 px-3 md:px-4 py-3 md:py-4">
            <div class="flex flex-col gap-3 md:gap-4 max-w-5xl mx-auto">
                <div>
                    <h1 class="font-bold text-xl md:text-2xl text-gray-900 flex items-center gap-2">
                        <span id="headerIcon">🏆</span>
                        <span id="headerTitle" class="truncate">Top Ranked</span>
                    </h1>
                    <p class="text-xs md:text-sm text-gray-500 mt-1" id="headerSubtitle">BoardGameGeek's highest rated games</p>
                </div>
                
                <div class="flex flex-col md:flex-row items-stretch md:items-center gap-2 md:gap-3">
                    <select id="sortSelect" onchange="sortGames()" class="bg-gray-100 border-none rounded-lg px-3 md:px-4 py-2 font-medium text-gray-700 focus:ring-2 focus:ring-purple-500 text-sm md:text-base flex-1 md:flex-none">
                        <option value="rank">Sort by Rank</option>
                        <option value="rating">Sort by Rating</option>
                        <option value="weight">Sort by Weight</option>
                        <option value="year">Sort by Year</option>
                    </select>
                    <div id="filterButtons" class="flex gap-2 flex-wrap hidden">
                        <button onclick="filterByStatus('all')" class="filter-btn px-3 md:px-4 py-2 rounded-lg text-sm font-medium transition border-2 border-transparent bg-gray-100 text-gray-700 hover:border-purple-400" data-filter="all">All</button>
                        <button onclick="filterByStatus('owned')" class="filter-btn px-3 md:px-4 py-2 rounded-lg text-sm font-medium transition border-2 border-transparent bg-gray-100 text-gray-700 hover:border-purple-400" data-filter="owned">📦 Owned</button>
                        <button onclick="filterByStatus('prevowned')" class="filter-btn px-3 md:px-4 py-2 rounded-lg text-sm font-medium transition border-2 border-transparent bg-gray-100 text-gray-700 hover:border-purple-400" data-filter="prevowned">🏷️ Prev-Owned</button>
                    </div>
                    <button onclick="location.reload()" class="p-2 text-gray-400 hover:text-gray-600 self-end md:self-auto">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
            </div>
        </header>

        <main class="p-3 md:p-4 grid grid-cols-1 gap-3 md:gap-4 max-w-5xl mx-auto w-full" id="gamesList">
            <!-- Games injected here -->
        </main>
    </div>

    <script>
        let currentMode = 'rank';
        let gamesData = [];
        let allGameIds = [];
        let userCollection = {};
        let currentFilter = 'all';

        const STATUS_EMOJIS = {
            own: '📦',
            prevowned: '🏷️',
            fortrade: '🔄',
            want: '💚',
            wanttoplay: '🎮',
            wanttobuy: '💳',
            wishlist: '⭐',
            preordered: '📅'
        };

        async function fetchGames() {
            const limit = parseInt(document.getElementById('limitInput').value) || 100;
            const username = document.getElementById('usernameInput').value.trim();
            
            console.log('🎮 [RANKS] Starting game fetch');
            console.log('   ├─ Limit:', limit);
            console.log('   └─ Username:', username || '(not provided)');
            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            
            // Show progress bars
            document.getElementById('progressContainer').classList.remove('hidden');
            document.getElementById('progressInfo').classList.remove('hidden');

            try {
                // Load user collection if username provided
                if (username) {
                    console.log('📚 [COLLECTION API] Loading collection for user:', username);
                    updateProgress(5, `Loading collection for ${username}...`, '');
                    
                    try {
                        const collUrl = `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&prevowned=1&fortrade=1&want=1&wanttoplay=1&wanttobuy=1&wishlist=1&preordered=1&stats=1`;
                        console.log('   ├─ API Request URL:', collUrl);
                        console.log('   ├─ Timestamp:', new Date().toISOString());
                        
                        const collRes = await fetch(collUrl);
                        console.log('   ├─ Response Status:', collRes.status, collRes.statusText);
                        console.log('   ├─ Response Headers:', Array.from(collRes.headers.entries()));
                        
                        const collXml = await collRes.text();
                        console.log('   ├─ Response Size:', collXml.length, 'bytes');
                        console.log('   ├─ Response Preview:', collXml.substring(0, 200));
                        
                        const collParser = new DOMParser().parseFromString(collXml, 'text/xml');
                        const items = Array.from(collParser.querySelectorAll('item'));
                        console.log('   ├─ Parsed Items:', items.length);
                        
                        let ownCount = 0, prevOwnCount = 0;
                        items.forEach(item => {
                            const gameId = item.getAttribute('objectid');
                            const statusEl = item.querySelector('status');
                            
                            // Parse all status attributes
                            const statuses = {
                                own: statusEl?.getAttribute('own') === '1' || false,
                                prevowned: statusEl?.getAttribute('prevowned') === '1' || false,
                                fortrade: statusEl?.getAttribute('fortrade') === '1' || false,
                                want: statusEl?.getAttribute('want') === '1' || false,
                                wanttoplay: statusEl?.getAttribute('wanttoplay') === '1' || false,
                                wanttobuy: statusEl?.getAttribute('wanttobuy') === '1' || false,
                                wishlist: statusEl?.getAttribute('wishlist') === '1' || false,
                                preordered: statusEl?.getAttribute('preordered') === '1' || false
                            };
                            
                            if (statuses.own) ownCount++;
                            if (statuses.prevowned) prevOwnCount++;
                            
                            userCollection[gameId] = statuses;
                        });
                        
                        console.log('✓ [COLLECTION API] Collection loaded successfully');
                        console.log('   ├─ Total Games:', Object.keys(userCollection).length);
                        console.log('   ├─ Owned:', ownCount);
                        console.log('   ├─ Previously Owned:', prevOwnCount);
                        document.getElementById('filterButtons').classList.remove('hidden');
                    } catch (err) {
                        console.warn('⚠️ [COLLECTION API] Could not load collection:', err.message);
                        console.error('   └─ Error Details:', err);
                    }
                }

                let ids = [];
                
                // Calculate pages needed (100 items per page)
                const pages = Math.ceil(limit / 100);
                console.log('📄 [BROWSE API] Fetching rankings');
                console.log('   ├─ Total Pages:', pages);
                console.log('   ├─ Items per Page: 100');
                console.log('   └─ Total Target:', limit);
                updateProgress(10, `Fetching ${pages} pages of rankings...`, '');
                
                for (let p = 1; p <= pages; p++) {
                    console.log(`📖 [BROWSE API] Fetching page ${p}/${pages}`);
                    
                    const browseUrl = `/api/bgg-helper?endpoint=browse&page=${p}`;
                    console.log('   ├─ API Request URL:', browseUrl);
                    console.log('   ├─ Timestamp:', new Date().toISOString());
                    
                    const res = await fetch(browseUrl);
                    console.log('   ├─ Response Status:', res.status, res.statusText);
                    
                    const html = await res.text();
                    console.log('   ├─ Response Size:', html.length, 'bytes');
                    
                    // Parse HTML to find game IDs
                    // Look for links like /boardgame/174430/gloomhaven
                    const regex = /href="\/boardgame\/(\d+)\/[^"]*"/g;
                    let match;
                    let pageIds = 0;
                    while ((match = regex.exec(html)) !== null) {
                        if (ids.length < limit) {
                            // Avoid duplicates if any
                            if (!ids.includes(match[1])) {
                                ids.push(match[1]);
                                pageIds++;
                            }
                        }
                    }
                    const pagePercent = 10 + (p/pages)*20;
                    console.log(`✓ [BROWSE API] Page ${p} parsed`);
                    console.log('   ├─ Found on Page:', pageIds);
                    console.log('   ├─ Total Collected:', ids.length);
                    updateProgress(pagePercent, `Parsed page ${p}/${pages}...`, `${ids.length} games found`);
                }
                
                allGameIds = ids;
                console.log('✅ [BROWSE API] ID collection complete');
                console.log('   ├─ Total IDs Collected:', ids.length);
                console.log('   ├─ Game IDs:', ids.slice(0, 5).join(', '), ids.length > 5 ? '...' : '');

                document.getElementById('headerIcon').textContent = '🏆';
                document.getElementById('headerTitle').textContent = 'Top Ranked';
                document.getElementById('headerSubtitle').textContent = `Top ${ids.length} Games on BGG`;

                if (ids.length === 0) throw new Error('No games found.');

                updateProgress(40, 'Fetching game details in batches...', `0 / ${ids.length}`);
                
                // Fetch details in chunks of 20
                const chunkSize = 20;
                const chunks = [];
                for (let i = 0; i < ids.length; i += chunkSize) {
                    chunks.push(ids.slice(i, i + chunkSize));
                }

                console.log('🔄 [THING API] Starting batch fetching');
                console.log('   ├─ Total Batches:', chunks.length);
                console.log('   ├─ Chunk Size:', chunkSize);
                console.log('   ├─ Total Games to Fetch:', ids.length);

                gamesData = [];
                let processed = 0;

                for (let batchIdx = 0; batchIdx < chunks.length; batchIdx++) {
                    const chunk = chunks[batchIdx];
                    console.log(`📦 [THING API] Batch ${batchIdx + 1}/${chunks.length}`);
                    
                    const thingUrl = `/api/bgg-helper?endpoint=thing&id=${chunk.join(',')}&stats=1`;
                    console.log('   ├─ API Request URL:', thingUrl);
                    console.log('   ├─ Game IDs in Batch:', chunk.join(', '));
                    console.log('   ├─ Request Timestamp:', new Date().toISOString());
                    
                    const res = await fetch(thingUrl);
                    console.log('   ├─ Response Status:', res.status, res.statusText);
                    
                    const text = await res.text();
                    console.log('   ├─ Response Size:', text.length, 'bytes');
                    
                    const xml = new DOMParser().parseFromString(text, 'text/xml');
                    const batchItems = Array.from(xml.querySelectorAll('item'));
                    console.log('   ├─ Parsed Items:', batchItems.length);

                    // Process this batch's items
                    const batchGames = batchItems.map((item, idx) => {
                        const stats = item.querySelector('statistics ratings');
                        const rankObj = stats.querySelector('rank[name="boardgame"]');
                        const rank = rankObj ? parseInt(rankObj.getAttribute('value')) : 999999;
                        const gameId = item.getAttribute('id');
                        const gameName = item.querySelector('name[type="primary"]').getAttribute('value');
                        const gameRating = parseFloat(stats.querySelector('average').getAttribute('value')).toFixed(1);
                        
                        if (idx < 3) {
                            console.log(`      └─ Game ${gameId}: "${gameName}" (Rating: ${gameRating}, Rank: ${rank})`);
                        }
                        
                        return {
                            id: gameId,
                            name: gameName,
                            year: item.querySelector('yearpublished')?.getAttribute('value') || '?',
                            image: item.querySelector('thumbnail')?.textContent || '',
                            rating: gameRating,
                            rank: isNaN(rank) ? 999999 : rank,
                            weight: parseFloat(stats.querySelector('averageweight').getAttribute('value')).toFixed(2),
                            voters: parseInt(stats.querySelector('usersrated').getAttribute('value')),
                            description: item.querySelector('description')?.textContent || '',
                            statusTags: userCollection[gameId] || {},
                            owned: userCollection[gameId]?.own || false,
                            prevOwned: userCollection[gameId]?.prevowned || false
                        };
                    });

                    gamesData = gamesData.concat(batchGames);
                    processed += chunk.length;
                    
                    // Sort current data and render immediately
                    gamesData.sort((a, b) => a.rank - b.rank);
                    renderGames();
                    
                    const progressPercent = 40 + (processed / ids.length) * 59;
                    console.log(`✓ [THING API] Batch ${batchIdx + 1} complete`);
                    console.log('   ├─ Batch Items Processed:', batchGames.length);
                    console.log('   ├─ Total Processed:', processed + '/' + ids.length);
                    console.log('   ├─ Progress %:', Math.round((processed/ids.length)*100));
                    updateProgress(progressPercent, `Loaded batch ${batchIdx + 1}/${chunks.length}...`, `${processed} / ${ids.length} games`);
                }

                console.log('✅ [THING API] All batches complete!');
                console.log('   ├─ Total Games Loaded:', gamesData.length);
                console.log('   ├─ Final Data Sample:', gamesData.slice(0, 3));
                updateProgress(100, '✅ Done! All games loaded.', `${gamesData.length} games ready`);
                
                // Keep progress visible briefly then fade
                setTimeout(() => {
                    document.getElementById('progressContainer').classList.add('hidden');
                    document.getElementById('progressInfo').classList.add('hidden');
                }, 2000);

            } catch (error) {
                console.error('❌ Error:', error.message);
                alert('Error: ' + error.message);
                location.reload();
            }
        }

        function updateProgress(percent, text, count) {
            document.getElementById('progressBar').style.width = `${percent}%`;
            document.getElementById('progressText').textContent = text;
            if (count) {
                document.getElementById('progressCount').textContent = count;
            }
        }

        function sortGames() {
            const criteria = document.getElementById('sortSelect').value;
            
            gamesData.sort((a, b) => {
                if (criteria === 'rank') return a.rank - b.rank;
                if (criteria === 'rating') return b.rating - a.rating;
                if (criteria === 'weight') return b.weight - a.weight;
                if (criteria === 'year') return b.year - a.year;
            });
            
            renderGames();
        }

        function filterByStatus(status) {
            currentFilter = status;
            
            // Update button states
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.getAttribute('data-filter') === status) {
                    btn.classList.add('bg-purple-600', 'text-white', 'border-purple-600');
                    btn.classList.remove('bg-gray-100', 'text-gray-700', 'border-transparent');
                } else {
                    btn.classList.remove('bg-purple-600', 'text-white', 'border-purple-600');
                    btn.classList.add('bg-gray-100', 'text-gray-700', 'border-transparent');
                }
            });
            
            renderGames();
        }

        function getDisplayedGames() {
            if (currentFilter === 'all') return gamesData;
            if (currentFilter === 'owned') return gamesData.filter(g => g.owned);
            if (currentFilter === 'prevowned') return gamesData.filter(g => g.prevOwned && !g.owned);
            return gamesData;
        }

        function renderGames() {
            const container = document.getElementById('gamesList');
            const displayedGames = getDisplayedGames();
            
            container.innerHTML = displayedGames.map((game, index) => {
                // Build status emoji tags - show all active statuses
                const statusEntries = Object.entries(game.statusTags || {})
                    .filter(([key, value]) => value === true);
                
                const statusTagsHtml = statusEntries.length > 0 
                    ? `<div class="flex flex-wrap gap-1.5 mt-2">
                        ${statusEntries.map(([key, _]) => 
                            `<div class="inline-flex items-center gap-1 bg-blue-100 text-blue-700 px-2 py-1 rounded-full text-xs font-medium" title="${key}">
                                <span>${STATUS_EMOJIS[key] || ''}</span>
                                <span>${key === 'own' ? 'Own' : key === 'prevowned' ? 'Prev-Own' : key === 'fortrade' ? 'For Trade' : key === 'want' ? 'Want' : key === 'wanttoplay' ? 'Want to Play' : key === 'wanttobuy' ? 'Want to Buy' : key === 'wishlist' ? 'Wishlist' : key === 'preordered' ? 'Pre-ordered' : key}</span>
                            </div>`
                        ).join('')}
                      </div>`
                    : '';
                
                return `
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-3 md:p-4 flex flex-col md:flex-row gap-3 md:gap-4 items-start md:items-center hover:shadow-md transition-shadow group">
                    <div class="relative flex-shrink-0 w-full md:w-auto">
                        <div class="w-full md:w-20 h-24 md:h-20 bg-gray-100 rounded-lg overflow-hidden">
                            ${game.image ? `<img src="${game.image}" class="w-full h-full object-cover">` : '<span class="text-4xl md:text-2xl flex items-center justify-center h-full">🎲</span>'}
                        </div>
                        <div class="absolute top-2 left-2 md:-top-2 md:-left-2 bg-gray-900 text-white text-xs font-bold w-8 h-8 flex items-center justify-center rounded-full border-2 border-white shadow-sm">
                            ${game.rank === 999999 ? '-' : game.rank}
                        </div>
                        ${game.owned ? '<div class="absolute bottom-1 right-1 bg-green-500 text-white px-2 py-1 rounded text-xs font-bold">📦 Owned</div>' : ''}
                        ${game.prevOwned && !game.owned ? '<div class="absolute bottom-1 right-1 bg-orange-500 text-white px-2 py-1 rounded text-xs font-bold">🏷️ Prev-Owned</div>' : ''}
                    </div>
                    
                    <div class="flex-1 min-w-0 w-full md:w-auto">
                        <div class="flex flex-col md:flex-row md:justify-between md:items-start gap-2 mb-1">
                            <div class="flex-1">
                                <h3 class="font-bold text-base md:text-lg text-gray-900 truncate group-hover:text-purple-600 transition-colors">${game.name}</h3>
                                ${statusTagsHtml}
                            </div>
                            <span class="bg-purple-100 text-purple-800 text-xs font-bold px-3 py-1 rounded self-start md:self-center whitespace-nowrap">${game.rating}</span>
                        </div>
                        <p class="text-xs md:text-sm text-gray-500 mb-2">${game.year} • ${game.weight} / 5 Weight</p>
                        <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4 text-xs text-gray-400">
                            <span>👥 ${game.voters.toLocaleString()} Ratings</span>
                            <a href="https://boardgamegeek.com/boardgame/${game.id}" target="_blank" class="text-purple-500 hover:underline font-medium">View on BGG ↗</a>
                        </div>
                    </div>
                </div>
            `}).join('');
        }
    </script>
</body>
</html>
