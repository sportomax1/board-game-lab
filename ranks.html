<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🏆</text></svg>">
    <title>BGG Top Ranked</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        
        body {
          font-family: 'Plus Jakarta Sans', sans-serif;
          background-color: #f8fafc;
        }

        .game-card {
          transition: all 0.2s ease;
        }

        .game-card:hover {
          transform: translateY(-2px);
          box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        .skeleton {
          animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: .5; }
        }
        
        .rank-badge { 
            clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 50% 85%, 0% 100%);
        }
        .year-tabs {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            scroll-behavior: smooth;
        }
        .year-tab {
            flex-shrink: 0;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            border: 2px solid #e5e7eb;
            background: #f9fafb;
            color: #374151;
        }
        .year-tab:hover {
            border-color: #667eea;
            background: #f3f4f6;
        }
        .year-tab.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        /* Print view styles */
        #printViewContainer { display: none; }
        #printViewContainer.active { display: block; }
        #app.hidden-print { display: none; }
        
        @media print {
            #normalViewContainer { display: none !important; }
            #printViewContainer { display: block !important; background: white !important; }
            .no-print { display: none !important; }
            body { background: white !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
        
        .print-header { text-align: center; margin-bottom: 0.25in; font-size: 20px; font-weight: bold; color: #333; }
        .print-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; width: 100%; margin: 0 auto; }
        .print-tile { position: relative; border: 1px solid #ddd; background: #f9f9f9; overflow: hidden; aspect-ratio: 1; }
        .print-tile img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; user-select: none; background: #f5f5f5; }
        .print-tile.owned img { opacity: 1; }
        .print-tile.prevowned img { opacity: 0.33; }
        .print-tile.unowned img { opacity: 0.1; }
        .print-rank { position: absolute; top: 2px; left: 2px; background: rgba(0,0,0,0.8); color: white; font-size: 10px; padding: 2px 4px; border-radius: 2px; font-weight: bold; z-index: 10; }
        .print-year { position: absolute; bottom: 2px; right: 2px; color: white; font-size: 10px; padding: 2px; font-weight: bold; z-index: 10; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .print-tile.owned .print-year { color: black; text-shadow: 1px 1px 2px rgba(255,255,255,0.3); }
        .print-tile.prevowned .print-year { color: #666; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); }
        .print-tile.unowned .print-year { color: #999; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); }
    </style>
</head>
<body class="pb-20">

    <!-- Setup Screen -->
    <div id="setupScreen" class="fixed inset-0 bg-gradient-to-br from-indigo-900 to-purple-900 z-50 flex items-center justify-center p-4 md:p-8">
        <div class="bg-white rounded-2xl shadow-2xl p-6 md:p-8 max-w-md w-full">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-900 mb-2 text-center">🏆 BGG Rankings</h1>
            <p class="text-gray-500 text-center text-sm md:text-base mb-8">Explore the highest rated games</p>
            
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Quantity</label>
                    <input type="number" id="limitInput" class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 focus:border-purple-500 outline-none transition text-base" value="100" min="1" max="500">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">📚 Collection Username (Optional)</label>
                    <input type="text" id="usernameInput" class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 focus:border-purple-500 outline-none transition text-base" placeholder="Enter BGG username" value="sportomax">
                    <p class="text-xs text-gray-500 mt-1">Compare with your owned/prev-owned games</p>
                </div>
                
                <button onclick="fetchGames()" class="w-full bg-purple-600 text-white py-3 md:py-4 rounded-xl font-bold text-base md:text-lg hover:bg-purple-700 transition shadow-lg transform hover:scale-[1.02]">
                    Load Games
                </button>
            </div>
        </div>
    </div>

    <!-- Main App Header (sticky, players.html style) -->
    <header class="sticky top-0 z-30 w-full bg-white/80 backdrop-blur-md border-b px-4 py-4 shadow-sm hidden" id="mainHeader">
        <div class="max-w-4xl mx-auto flex items-center justify-between gap-4">
          <div class="flex items-center gap-3">
            <div class="bg-purple-600 text-white p-2 rounded-lg">
              <i class="fa-solid fa-trophy"></i>
            </div>
            <div>
              <h1 class="text-xl font-bold tracking-tight">Top Ranked</h1>
              <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">BGG Rankings</p>
            </div>
          </div>
          <div id="statsBox" class="text-right">
            <div class="text-2xl font-bold text-purple-600" id="gameCount">0</div>
            <div class="text-[10px] text-slate-500 uppercase font-bold">Games</div>
          </div>
        </div>
    </header>

    <!-- Controls Bar -->
    <div id="controlsBar" class="hidden bg-white border-b border-slate-100 sticky top-20 z-20 px-4 py-3">
      <div class="max-w-4xl mx-auto space-y-3">
        <!-- Filter Buttons -->
        <div class="flex flex-wrap gap-2" id="filterContainer">
          <button class="filter-btn bg-purple-100 text-purple-700 px-3 py-1 rounded-full text-xs font-bold border-2 border-purple-300" data-filter="all" onclick="toggleFilter('all')">
            <i class="fa-solid fa-list mr-1"></i>All Games
          </button>
          <button class="filter-btn bg-slate-100 text-slate-600 px-3 py-1 rounded-full text-xs font-bold border border-slate-300" data-filter="own" onclick="toggleFilter('own')" title="Games you own">
            <i class="fa-solid fa-check mr-1"></i>Owned
          </button>
          <button class="filter-btn bg-slate-100 text-slate-600 px-3 py-1 rounded-full text-xs font-bold border border-slate-300" data-filter="prevowned" onclick="toggleFilter('prevowned')" title="Previously owned">
            <i class="fa-solid fa-tag mr-1"></i>Prev-Owned
          </button>
          <button class="filter-btn bg-slate-100 text-slate-600 px-3 py-1 rounded-full text-xs font-bold border border-slate-300" data-filter="want" onclick="toggleFilter('want')" title="Games you want">
            <i class="fa-solid fa-heart mr-1"></i>Want
          </button>
          <button class="filter-btn bg-slate-100 text-slate-600 px-3 py-1 rounded-full text-xs font-bold border border-slate-300" data-filter="wanttoplay" onclick="toggleFilter('wanttoplay')" title="Want to play">
            <i class="fa-solid fa-gamepad mr-1"></i>Play
          </button>
          <button class="filter-btn bg-slate-100 text-slate-600 px-3 py-1 rounded-full text-xs font-bold border border-slate-300" data-filter="unowned" onclick="toggleFilter('unowned')" title="Games not in collection">
            <i class="fa-solid fa-circle mr-1"></i>Unowned
          </button>
        </div>
        
        <!-- Action Buttons -->
        <div class="flex flex-wrap gap-2">
          <button onclick="showYearAnalysis()" class="bg-indigo-500 hover:bg-indigo-600 text-white px-3 py-1 rounded-lg text-xs font-bold transition-colors">
            <i class="fa-solid fa-calendar mr-1"></i>By Year
          </button>
          <button onclick="showCategoryAnalysis()" class="bg-teal-500 hover:bg-teal-600 text-white px-3 py-1 rounded-lg text-xs font-bold transition-colors">
            <i class="fa-solid fa-tag mr-1"></i>By Category
          </button>
          <button onclick="togglePrintMode()" class="bg-rose-500 hover:bg-rose-600 text-white px-3 py-1 rounded-lg text-xs font-bold transition-colors">
            <i class="fa-solid fa-print mr-1"></i>Print
          </button>
          <button onclick="shareCollection()" class="bg-sky-500 hover:bg-sky-600 text-white px-3 py-1 rounded-lg text-xs font-bold transition-colors">
            <i class="fa-solid fa-share mr-1"></i>Share
          </button>
          <button onclick="downloadData()" class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded-lg text-xs font-bold transition-colors">
            <i class="fa-solid fa-download mr-1"></i>Export
          </button>
        </div>
      </div>
    </div>

    <!-- Main App -->
    <main id="app" class="hidden flex-1 flex flex-col w-full">
        <!-- Progress Bar at Top -->
        <div id="progressContainer" class="w-full h-1 bg-gray-200 sticky top-20 z-50 overflow-hidden hidden">
            <div id="progressBar" class="h-full bg-gradient-to-r from-purple-500 to-purple-600 w-0 transition-all duration-300"></div>
        </div>

        <!-- Progress Info Bar -->
        <div id="progressInfo" class="bg-purple-50 border-b border-purple-200 px-3 md:px-4 py-2 sticky top-20 z-40 hidden">
            <div class="max-w-5xl mx-auto flex items-center justify-between">
                <div>
                    <p class="text-xs md:text-sm font-medium text-purple-900" id="progressText">Loading...</p>
                </div>
                <div class="text-xs text-purple-700" id="progressCount"></div>
            </div>
        </div>

        <!-- Games Grid -->
        <div class="p-3 md:p-4 grid grid-cols-1 gap-3 md:gap-4 max-w-5xl mx-auto w-full flex-1" id="gamesList">
            <!-- Games injected here -->
        </div>
    </main>

    <!-- Print View Container -->
    <div id="printViewContainer" class="hidden-print bg-white p-8">
        <div class="print-header">🏆 Top Ranked Games</div>
        <div class="print-grid" id="printGrid">
            <!-- Print tiles injected here -->
        </div>
    </div>

    <!-- Year Analysis Modal -->
    <div id="yearAnalysisModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-5xl w-full max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
                <h2 class="text-2xl font-bold text-gray-900">📅 Games by Year</h2>
                <button onclick="closeYearAnalysis()" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-6">
                <div id="yearTabsContainer" class="mb-6 year-tabs" role="tablist"></div>
                <div id="yearGamesList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>
        </div>
    </div>

    <!-- Category Analysis Modal -->
    <div id="categoryAnalysisModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-5xl w-full max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
                <h2 class="text-2xl font-bold text-gray-900">🏷️ Games by Category Rank</h2>
                <button onclick="closeCategoryAnalysis()" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-6">
                <div id="categoryTabsContainer" class="mb-6 year-tabs" role="tablist"></div>
                <div id="categoryGamesList" class="flex flex-col gap-2 md:gap-3"></div>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'rank';
        let gamesData = [];
        let allGameIds = [];
        let userCollection = {};
        let activeFilters = new Set(['all']);

        const STATUS_EMOJIS = {
            own: '📦',
            prevowned: '🏷️',
            fortrade: '🔄',
            want: '💚',
            wanttoplay: '🎮',
            wanttobuy: '💳',
            wishlist: '⭐',
            preordered: '📅'
        };

        async function fetchGames() {
            const limit = parseInt(document.getElementById('limitInput').value) || 100;
            const username = document.getElementById('usernameInput').value.trim();
            
            console.log('🎮 [RANKS] Starting game fetch');
            console.log('   ├─ Limit:', limit);
            console.log('   └─ Username:', username || '(not provided)');
            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('mainHeader').classList.remove('hidden');
            document.getElementById('controlsBar').classList.remove('hidden');
            
            // Show progress bars
            document.getElementById('progressContainer').classList.remove('hidden');
            document.getElementById('progressInfo').classList.remove('hidden');

            try {
                let ids = [];
                
                // Calculate pages needed (100 items per page)
                const pages = Math.ceil(limit / 100);
                console.log('📄 [BROWSE API] Fetching rankings');
                console.log('   ├─ Total Pages:', pages);
                console.log('   ├─ Items per Page: 100');
                console.log('   └─ Total Target:', limit);
                updateProgress(5, `Fetching ${pages} pages of rankings...`, '');
                
                for (let p = 1; p <= pages; p++) {
                    console.log(`📖 [BROWSE API] Fetching page ${p}/${pages}`);
                    
                    const browseUrl = `/api/bgg-helper?endpoint=browse&page=${p}`;
                    console.log('   ├─ API Request URL:', browseUrl);
                    console.log('   ├─ Timestamp:', new Date().toISOString());
                    
                    const res = await fetch(browseUrl);
                    console.log('   ├─ Response Status:', res.status, res.statusText);
                    
                    const html = await res.text();
                    console.log('   ├─ Response Size:', html.length, 'bytes');
                    
                    // Parse HTML to find game IDs
                    // Look for links like /boardgame/174430/gloomhaven
                    const regex = /href="\/boardgame\/(\d+)\/[^"]*"/g;
                    let match;
                    let pageIds = 0;
                    while ((match = regex.exec(html)) !== null) {
                        if (ids.length < limit) {
                            // Avoid duplicates if any
                            if (!ids.includes(match[1])) {
                                ids.push(match[1]);
                                pageIds++;
                            }
                        }
                    }
                    const pagePercent = 5 + (p/pages)*15;
                    console.log(`✓ [BROWSE API] Page ${p} parsed`);
                    console.log('   ├─ Found on Page:', pageIds);
                    console.log('   ├─ Total Collected:', ids.length);
                    updateProgress(pagePercent, `Parsed page ${p}/${pages}...`, `${ids.length} games found`);
                }
                
                allGameIds = ids;
                console.log('✅ [BROWSE API] ID collection complete');
                console.log('   ├─ Total IDs Collected:', ids.length);
                console.log('   ├─ Game IDs:', ids.slice(0, 5).join(', '), ids.length > 5 ? '...' : '');

                document.getElementById('gameCount').textContent = ids.length;
                
                if (ids.length === 0) throw new Error('No games found.');

                updateProgress(25, 'Fetching game details in batches...', `0 / ${ids.length}`);
                
                // Fetch details in chunks of 20
                const chunkSize = 20;
                const parallelBatches = 100; // Process 100 batches in parallel for faster loading
                const chunks = [];
                for (let i = 0; i < ids.length; i += chunkSize) {
                    chunks.push(ids.slice(i, i + chunkSize));
                }

                console.log('🔄 [THING API] Starting batch fetching');
                console.log('   ├─ Total Batches:', chunks.length);
                console.log('   ├─ Chunk Size:', chunkSize);
                console.log('   ├─ Total Games to Fetch:', ids.length);

                gamesData = [];
                let processed = 0;

                // Process batches in parallel groups
                for (let i = 0; i < chunks.length; i += parallelBatches) {
                    const batchGroup = chunks.slice(i, i + parallelBatches);
                    
                    await Promise.all(batchGroup.map(async (chunk, batchIndex) => {
                        const batchIdx = i + batchIndex;
                        console.log(`📦 [THING API] Batch ${batchIdx + 1}/${chunks.length}`);
                        
                        const thingUrl = `/api/bgg-helper?endpoint=thing&id=${chunk.join(',')}&stats=1`;
                        console.log('   ├─ API Request URL:', thingUrl);
                        console.log('   ├─ Game IDs in Batch:', chunk.join(', '));
                        console.log('   ├─ Request Timestamp:', new Date().toISOString());
                        
                        const res = await fetch(thingUrl);
                        console.log('   ├─ Response Status:', res.status, res.statusText);
                        
                        const text = await res.text();
                        console.log('   ├─ Response Size:', text.length, 'bytes');
                        
                        const xml = new DOMParser().parseFromString(text, 'text/xml');
                        const batchItems = Array.from(xml.querySelectorAll('item'));
                        console.log('   ├─ Parsed Items:', batchItems.length);

                        // Process this batch's items - extract all category ranks
                        const batchGames = batchItems.map((item, idx) => {
                            const stats = item.querySelector('statistics ratings');
                            const rankObj = stats.querySelector('rank[name="boardgame"]');
                            const rank = rankObj ? parseInt(rankObj.getAttribute('value')) : 999999;
                            const gameId = item.getAttribute('id');
                            const gameName = item.querySelector('name[type="primary"]').getAttribute('value');
                            const gameRating = parseFloat(stats.querySelector('average').getAttribute('value')).toFixed(1);
                            
                            // Extract category ranks from all rank elements
                            const categoryRanks = {};
                            const rankElements = Array.from(stats.querySelectorAll('rank'));
                            rankElements.forEach(rankEl => {
                              const name = rankEl.getAttribute('name');
                              const value = rankEl.getAttribute('value');
                              if (name && value) {
                                categoryRanks[name] = parseInt(value);
                              }
                            });
                            
                            if (idx < 3) {
                                console.log(`      └─ Game ${gameId}: "${gameName}" (Rating: ${gameRating}, Rank: ${rank})`);
                            }
                            
                            return {
                                id: gameId,
                                name: gameName,
                                year: item.querySelector('yearpublished')?.getAttribute('value') || '?',
                                image: item.querySelector('thumbnail')?.textContent || '',
                                rating: gameRating,
                                rank: isNaN(rank) ? 999999 : rank,
                                weight: parseFloat(stats.querySelector('averageweight').getAttribute('value')).toFixed(2),
                                voters: parseInt(stats.querySelector('usersrated').getAttribute('value')),
                                description: item.querySelector('description')?.textContent || '',
                                categoryRanks: categoryRanks,
                                statusTags: {},
                                owned: false,
                                prevOwned: false
                            };
                        });

                        gamesData = gamesData.concat(batchGames);
                        processed += chunk.length;
                        
                        console.log(`✓ [THING API] Batch ${batchIdx + 1} complete`);
                        console.log('   ├─ Batch Items Processed:', batchGames.length);
                        console.log('   ├─ Total Processed:', processed + '/' + ids.length);
                        console.log('   ├─ Progress %:', Math.round((processed/ids.length)*100));
                    }));
                    
                    // Sort current data and render immediately (WITHOUT collection tags)
                    gamesData.sort((a, b) => a.rank - b.rank);
                    renderGames();
                    
                    const progressPercent = 25 + (processed / ids.length) * 60;
                    updateProgress(progressPercent, `Loaded batch ${Math.min(i + parallelBatches, chunks.length)}/${chunks.length}...`, `${processed} / ${ids.length} games`);
                    
                    // Throttle between parallel groups
                    await new Promise(resolve => setTimeout(resolve, 500));
                }

                console.log('✅ [THING API] All batches complete!');
                console.log('   ├─ Total Games Loaded:', gamesData.length);
                console.log('   ├─ Final Data Sample:', gamesData.slice(0, 3));
                updateProgress(88, '✅ Ranks loaded! Fetching collection data...', `${gamesData.length} games ready`);
                
                // NOW fetch user collection if username provided (AFTER ranks are displayed)
                if (username) {
                    console.log('📚 [COLLECTION API] Loading collection for user:', username);
                    
                    try {
                        const collUrl = `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&stats=1`;
                        console.log('   ├─ API Request URL:', collUrl);
                        console.log('   ├─ Timestamp:', new Date().toISOString());
                        
                        const collRes = await fetch(collUrl);
                        console.log('   ├─ Response Status:', collRes.status, collRes.statusText);
                        
                        const collXml = await collRes.text();
                        console.log('   ├─ Response Size:', collXml.length, 'bytes');
                        
                        const collParser = new DOMParser().parseFromString(collXml, 'text/xml');
                        const items = Array.from(collParser.querySelectorAll('item'));
                        console.log('   ├─ Parsed Items:', items.length);
                        
                        let ownCount = 0, prevOwnCount = 0;
                        items.forEach((item, idx) => {
                            const gameId = item.getAttribute('objectid');
                            const statusEl = item.querySelector('status');
                            
                            // Parse all status attributes
                            const statuses = {
                                own: statusEl?.getAttribute('own') === '1' || false,
                                prevowned: statusEl?.getAttribute('prevowned') === '1' || false,
                                fortrade: statusEl?.getAttribute('fortrade') === '1' || false,
                                want: statusEl?.getAttribute('want') === '1' || false,
                                wanttoplay: statusEl?.getAttribute('wanttoplay') === '1' || false,
                                wanttobuy: statusEl?.getAttribute('wanttobuy') === '1' || false,
                                wishlist: statusEl?.getAttribute('wishlist') === '1' || false,
                                preordered: statusEl?.getAttribute('preordered') === '1' || false
                            };
                            
                            if (idx < 3) {
                                console.log(`      └─ Game ${gameId}: ${JSON.stringify(statuses)}`);
                            }
                            
                            if (statuses.own) ownCount++;
                            if (statuses.prevowned) prevOwnCount++;
                            
                            userCollection[gameId] = statuses;
                        });
                        
                        console.log('✓ [COLLECTION API] Collection loaded successfully');
                        console.log('   ├─ Total Games:', Object.keys(userCollection).length);
                        console.log('   ├─ Owned:', ownCount);
                        console.log('   ├─ Previously Owned:', prevOwnCount);
                        
                        // Update games data with collection tags
                        gamesData = gamesData.map(game => ({
                            ...game,
                            statusTags: userCollection[game.id] || {},
                            owned: userCollection[game.id]?.own || false,
                            prevOwned: userCollection[game.id]?.prevowned || false
                        }));
                        
                        console.log('✓ [COLLECTION API] Updated games with collection tags');
                        console.log('   └─ Updated games sample:', gamesData.slice(0, 3).map(g => ({ id: g.id, owned: g.owned, tags: Object.keys(g.statusTags).filter(k => g.statusTags[k]) })));
                        
                        // Re-render with collection tags
                        renderGames();
                        
                    } catch (err) {
                        console.warn('⚠️ [COLLECTION API] Could not load collection:', err.message);

            const rows = filteredGames.map(g => [
                g.rank === 999999 ? '-' : g.rank,
                `"${g.name.replace(/"/g, '""')}"`,
                g.year,
                g.rating,
                g.weight,
                g.voters,
                `https://boardgamegeek.com/boardgame/${g.id}`
            ]);

            const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
            
            // Download file
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.setAttribute('href', URL.createObjectURL(blob));
            link.setAttribute('download', `bgg-ranks-${new Date().toISOString().split('T')[0]}.csv`);
            link.click();
        }

        function updateTopX() {
            const newLimit = parseInt(document.getElementById('topXInput').value) || 100;
            const currentCount = gamesData.length;
            
            if (newLimit < currentCount) {
                // Filter to show only top X
                gamesData = gamesData.slice(0, newLimit);
                document.getElementById('headerSubtitle').textContent = `Top ${newLimit} Games on BGG`;
                renderGames();
            } else if (newLimit > currentCount) {
                // Need to fetch more data - reload with new limit
                const username = document.getElementById('usernameInput').value.trim();
                document.getElementById('limitInput').value = newLimit;
                document.getElementById('topXInput').value = newLimit;
                fetchGames();
            }
        }
    </script>

</body>
