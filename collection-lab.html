<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Collection Lab · Board Game Lab</title>
<style>
:root{--bg:#0b1020;--panel:#121a2e;--panel2:#17213a;--line:#263553;--text:#eef3ff;--muted:#9fb0cf;--accent:#70a5ff;--good:#4bd19b;--warn:#ffcb6b;--bad:#ff6b7a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.35 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}
header{position:sticky;top:0;z-index:20;background:#0b1020eF;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 14px}
.top{max-width:1600px;margin:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.brand{font-weight:800;font-size:18px;margin-right:auto}.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 12px;border-radius:9px;cursor:pointer}.btn:hover{border-color:var(--accent)}.primary{background:var(--accent);color:#071126;border-color:transparent;font-weight:800}.danger{color:#ffd6da}
main{max-width:1600px;margin:auto;padding:14px}.toolbar,.filters,.fieldbar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:180px}.input,.select{background:#0c1427;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:38px}.input:focus,.select:focus{outline:1px solid var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{display:flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 9px;background:#0c1427}.chip input{accent-color:var(--accent)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.stat{background:var(--panel);border:1px solid var(--line);padding:7px 10px;border-radius:9px}.stat b{color:var(--accent)}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:calc(100vh - 250px)}table{width:100%;border-collapse:separate;border-spacing:0;min-width:1250px;background:var(--panel)}
th{position:sticky;top:0;background:#17213a;color:#cfe0ff;text-align:left;padding:9px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;z-index:3}td{padding:8px 9px;border-bottom:1px solid #202d48;vertical-align:top}tr:hover td{background:#16203a}.thumb{width:42px;height:42px;object-fit:cover;border-radius:6px;background:#24304a}.game{font-weight:750}.small{font-size:12px;color:var(--muted);max-width:280px;white-space:normal}.rank{font-variant-numeric:tabular-nums}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 6px;margin:1px;font-size:11px}
.customCell input,.customCell select{max-width:130px;padding:5px;background:#0c1427;color:var(--text);border:1px solid var(--line);border-radius:6px}.saveDot{color:var(--good)}
.cards{display:none}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}.cardtop{display:grid;grid-template-columns:54px 1fr auto;gap:9px}.card .thumb{width:54px;height:54px}.cardstats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:8px 0}.cardstats span{background:#0c1427;padding:5px;border-radius:6px;text-align:center}.people{font-size:12px;color:var(--muted);margin-top:4px}.customGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px}.customGrid label{display:flex;flex-direction:column;gap:3px}.customGrid input,.customGrid select{width:100%}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);width:min(560px,94vw);padding:16px}dialog::backdrop{background:#0009}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.formgrid label{display:flex;flex-direction:column;gap:4px}.full{grid-column:1/-1}
#toast{position:fixed;right:14px;bottom:14px;z-index:50;background:#16213a;border:1px solid var(--line);padding:10px 13px;border-radius:9px;display:none;max-width:360px}.error{color:#ffb2bb}
@media(max-width:760px){header{position:static}.brand{width:100%}main{padding:8px}.toolbar,.filters,.fieldbar{padding:8px}.tablewrap{display:none}.cards{display:block}.row>.input,.row>.select{flex:1;min-width:135px}.btn{padding:9px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.customGrid{grid-template-columns:1fr 1fr}}
</style></head>
<body><header><div class="top"><div class="brand">🎲 Collection Lab <span class="muted">Board Game Lab</span></div><input id="username" class="input" value="sportomax" aria-label="BGG username"><button class="btn primary" id="refresh">Refresh BGG</button><button class="btn" id="fieldsBtn">Custom fields</button><a class="btn" href="index.html" style="text-decoration:none">Home</a></div></header>
<main>
<section class="toolbar"><div class="row"><input id="search" class="input grow" placeholder="Search game, publisher, designer, artist…"><select id="sort" class="select"><option value="rank:asc">Rank ↑</option><option value="rating:desc">Rating ↓</option><option value="year:desc">Year ↓</option><option value="name:asc">Name A-Z</option></select><select id="flagFilter" class="select"><option value="">All custom values</option><option value="__none">No custom values</option><option value="__any">Has any custom value</option></select></div></section>
<section class="filters"><div class="row"><b>Status</b><span class="muted">Match</span><select id="matchMode" class="select"><option value="any">ANY selected</option><option value="all">ALL selected</option></select><button class="btn" id="clearStatus">Clear</button></div><div id="statusChips" class="chips"></div></section>
<section class="fieldbar"><div class="row"><b>Custom filter</b><select id="customFieldFilter" class="select"><option value="">Choose field…</option></select><select id="customValueFilter" class="select"><option value="">Any value</option><option value="__blank">Blank</option><option value="__set">Has value</option></select><span id="cacheState" class="muted"></span></div></section>
<div class="stats"><span class="stat"><b id="shown">0</b> shown</span><span class="stat"><b id="total">0</b> cached</span><span class="stat"><b id="flagged">0</b> flagged</span><span class="stat"><b id="sync">Ready</b></span></div>
<div class="tablewrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div><div id="cards" class="cards"></div>
</main>
<dialog id="fieldDialog"><h2 style="margin-top:0">Custom fields</h2><div id="fieldList"></div><hr style="border-color:var(--line)"><div class="formgrid"><label>Name<input id="fieldLabel" class="input" placeholder="BGA candidate"></label><label>Type<select id="fieldType" class="select"><option value="boolean">Flag / checkbox</option><option value="text">Text</option><option value="number">Number</option><option value="select">Select</option><option value="multiselect">Multi-select</option></select></label><label class="full">Options <span class="muted">(comma-separated for select types)</span><input id="fieldOptions" class="input" placeholder="High, Medium, Low"></label></div><div class="row" style="margin-top:12px"><button class="btn primary" id="addField">Add field</button><button class="btn" onclick="fieldDialog.close()">Close</button></div></dialog><div id="toast"></div>
<script>
const $=s=>document.querySelector(s), statuses=['own','prevowned','fortrade','want','wanttoplay','wanttobuy','wishlist','preordered'];
let games=[],fields=[],values=new Map(),sortKey='rank',sortDir='asc',db;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=(m,bad=false)=>{let e=$('#toast');e.textContent=m;e.className=bad?'error':'';e.style.display='block';setTimeout(()=>e.style.display='none',3500)};
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open('boardGameLabCollection',2);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains('games'))d.createObjectStore('games',{keyPath:'bgg_id'});if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'key'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function idbAll(store){return new Promise((ok,no)=>{let r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function idbPutMany(store,rows){return new Promise((ok,no)=>{let tx=db.transaction(store,'readwrite'),s=tx.objectStore(store);rows.forEach(x=>s.put(x));tx.oncomplete=ok;tx.onerror=()=>no(tx.error)})}
function parseCollection(xml){let d=new DOMParser().parseFromString(xml,'text/xml');if(d.querySelector('parsererror'))throw Error('BGG returned invalid XML');return [...d.querySelectorAll('item')].map(n=>{let st=n.querySelector('status'),rating=n.querySelector('rating'),rank=[...n.querySelectorAll('rank')].find(x=>x.getAttribute('name')==='boardgame');return{bgg_id:+n.getAttribute('objectid'),name:n.querySelector('name')?.textContent||'',year:+(n.querySelector('yearpublished')?.textContent||0),thumb:n.querySelector('thumbnail')?.textContent||'',image:n.querySelector('image')?.textContent||'',rating:+(rating?.querySelector('average')?.getAttribute('value')||0),rank:+(rank?.getAttribute('value')||0)||999999,weight:+(rating?.querySelector('averageweight')?.getAttribute('value')||0),numplays:+(n.querySelector('numplays')?.textContent||0),...Object.fromEntries(statuses.map(k=>[k,+(st?.getAttribute(k)||0)])),fetched_at:Date.now()}})}
function parseThings(xml){let d=new DOMParser().parseFromString(xml,'text/xml');return [...d.querySelectorAll('item')].map(n=>({bgg_id:+n.getAttribute('id'),publishers:[...n.querySelectorAll('link[type="boardgamepublisher"]')].map(x=>x.getAttribute('value')),designers:[...n.querySelectorAll('link[type="boardgamedesigner"]')].map(x=>x.getAttribute('value')),artists:[...n.querySelectorAll('link[type="boardgameartist"]')].map(x=>x.getAttribute('value')),detail_at:Date.now()}))}
async function fetchXML(url){let r=await fetch(url);if(r.status===202)throw Error('BGG queued the collection. Tap Refresh again in a few seconds.');if(!r.ok){let t=await r.text();throw Error(t.slice(0,220)||('HTTP '+r.status))}return r.text()}
async function refreshBGG(){try{$('#refresh').disabled=true;$('#sync').textContent='BGG…';let u=$('#username').value.trim()||'sportomax';localStorage.setItem('collectionLabUser',u);let xml=await fetchXML('/api/bgg-helper?endpoint=collection&username='+encodeURIComponent(u)+'&stats=1');let fresh=parseCollection(xml),old=new Map(games.map(g=>[g.bgg_id,g]));games=fresh.map(g=>({...old.get(g.bgg_id),...g}));await idbPutMany('games',games);render();let need=games.filter(g=>!g.detail_at||Date.now()-g.detail_at>30*864e5);$('#sync').textContent=need.length?'Details…':'Synced';for(let i=0;i<need.length;i+=20){let batch=need.slice(i,i+20),tx=await fetchXML('/api/bgg-helper?endpoint=thing&id='+batch.map(x=>x.bgg_id).join(','));let detail=parseThings(tx),dm=new Map(detail.map(x=>[x.bgg_id,x]));games=games.map(g=>dm.has(g.bgg_id)?{...g,...dm.get(g.bgg_id)}:g);await idbPutMany('games',games);$('#sync').textContent='Details '+Math.min(i+20,need.length)+'/'+need.length;render()}$('#sync').textContent='Synced';toast('Collection refreshed: '+games.length+' games')}catch(e){toast(e.message,true);$('#sync').textContent='Error'}finally{$('#refresh').disabled=false}}
async function loadCustom(){let u=$('#username').value.trim()||'sportomax',r=await fetch('/api/bgg-lab?owner='+encodeURIComponent(u)),p=await r.json();if(!p.ok)throw Error(p.error);fields=p.fields||[];values=new Map((p.values||[]).map(v=>[v.bgg_id+'|'+v.field_key,v.value]));buildFieldFilters();render()}
function valueFor(id,key){return values.get(id+'|'+key)}
function isSet(v){return !(v===undefined||v===null||v===''||v===false||(Array.isArray(v)&&!v.length))}
async function saveValue(id,key,value){values.set(id+'|'+key,value);renderCounts();let r=await fetch('/api/bgg-lab',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'value',owner:$('#username').value.trim(),bgg_id:id,field_key:key,value})}),p=await r.json();if(!p.ok){toast(p.error,true);return}document.querySelectorAll('[data-save="'+id+'|'+key+'"]').forEach(x=>{x.textContent='✓';setTimeout(()=>x.textContent='',1000)})}
function customInput(g,f,card=false){let v=valueFor(g.bgg_id,f.field_key),id='cf_'+g.bgg_id+'_'+f.field_key+(card?'c':'');if(f.field_type==='boolean')return '<label><input type="checkbox" '+(v===true?'checked':'')+' onchange="saveValue('+g.bgg_id+',\''+esc(f.field_key)+'\',this.checked)"> '+esc(f.label)+' <span class="saveDot" data-save="'+g.bgg_id+'|'+esc(f.field_key)+'"></span></label>';if(f.field_type==='select'||f.field_type==='multiselect'){let opts=(f.options||[]).map(o=>'<option '+(Array.isArray(v)?v.includes(o):v===o?'selected':'')+'>'+esc(o)+'</option>').join('');return '<label>'+esc(f.label)+'<select '+(f.field_type==='multiselect'?'multiple':'')+' onchange="saveValue('+g.bgg_id+',\''+esc(f.field_key)+'\','+(f.field_type==='multiselect'?'[...this.selectedOptions].map(o=>o.value)':'this.value')+')"><option value=""></option>'+opts+'</select></label>'}return '<label>'+esc(f.label)+'<input type="'+(f.field_type==='number'?'number':'text')+'" value="'+esc(v??'')+'" onchange="saveValue('+g.bgg_id+',\''+esc(f.field_key)+'\','+(f.field_type==='number'?'this.value===\'\'?null:Number(this.value)':'this.value')+')"></label>'}
function filtered(){let q=$('#search').value.trim().toLowerCase(),sel=[...document.querySelectorAll('.statusCheck:checked')].map(x=>x.value),mode=$('#matchMode').value,ff=$('#flagFilter').value,cf=$('#customFieldFilter').value,cv=$('#customValueFilter').value;let a=games.filter(g=>{if(q&&!([g.name,...(g.publishers||[]),...(g.designers||[]),...(g.artists||[])].join(' ').toLowerCase().includes(q)))return false;if(sel.length){let hits=sel.map(s=>!!g[s]);if(mode==='all'?!hits.every(Boolean):!hits.some(Boolean))return false}let vals=fields.map(f=>valueFor(g.bgg_id,f.field_key));if(ff==='__none'&&vals.some(isSet))return false;if(ff==='__any'&&!vals.some(isSet))return false;if(ff&&!ff.startsWith('__')&&!isSet(valueFor(g.bgg_id,ff)))return false;if(cf){let v=valueFor(g.bgg_id,cf);if(cv==='__blank'&&isSet(v))return false;if(cv==='__set'&&!isSet(v))return false;if(cv&&!cv.startsWith('__')&&!(Array.isArray(v)?v.includes(cv):String(v)===cv))return false}return true});a.sort((x,y)=>{let av=sortKey==='rating'?x.rating:sortKey==='year'?x.year:sortKey==='name'?x.name.toLowerCase():x.rank,bv=sortKey==='rating'?y.rating:sortKey==='year'?y.year:sortKey==='name'?y.name.toLowerCase():y.rank;return(av>bv?1:av<bv?-1:0)*(sortDir==='asc'?1:-1)});return a}
function render(){let a=filtered();$('#shown').textContent=a.length;$('#total').textContent=games.length;renderCounts();let base=[['Game','name'],['Year','year'],['Rank','rank'],['Rating','rating'],['Status','status'],['Publisher','publisher'],['Designer','designer'],['Artist','artist']];$('#head').innerHTML=base.map(x=>'<th data-sort="'+x[1]+'">'+x[0]+'</th>').join('')+fields.map(f=>'<th>'+esc(f.label)+'</th>').join('');$('#body').innerHTML=a.map(g=>'<tr><td><div style="display:flex;gap:8px"><img class="thumb" loading="lazy" src="'+esc(g.thumb)+'"><div><div class="game">'+esc(g.name)+'</div><div class="small">BGG '+g.bgg_id+'</div></div></div></td><td>'+g.year+'</td><td class="rank">'+(g.rank===999999?'—':'#'+g.rank)+'</td><td>'+((g.rating||0).toFixed(2))+'</td><td>'+statuses.filter(s=>g[s]).map(s=>'<span class="tag">'+s+'</span>').join('')+'</td><td class="small">'+esc((g.publishers||[]).join(', '))+'</td><td class="small">'+esc((g.designers||[]).join(', '))+'</td><td class="small">'+esc((g.artists||[]).join(', '))+'</td>'+fields.map(f=>'<td class="customCell">'+customInput(g,f)+'</td>').join('')+'</tr>').join('');$('#cards').innerHTML=a.map(g=>'<div class="card"><div class="cardtop"><img class="thumb" loading="lazy" src="'+esc(g.thumb)+'"><div><div class="game">'+esc(g.name)+'</div><div class="small">'+g.year+' · '+(g.rank===999999?'Unranked':'#'+g.rank)+' · '+(g.rating||0).toFixed(2)+'</div></div><div class="small">BGG '+g.bgg_id+'</div></div><div>'+statuses.filter(s=>g[s]).map(s=>'<span class="tag">'+s+'</span>').join('')+'</div><div class="people">Pub: '+esc((g.publishers||[]).join(', ')||'—')+'</div><div class="people">Design: '+esc((g.designers||[]).join(', ')||'—')+'</div><div class="people">Art: '+esc((g.artists||[]).join(', ')||'—')+'</div><div class="customGrid">'+fields.map(f=>customInput(g,f,true)).join('')+'</div></div>').join('')}
function renderCounts(){$('#flagged').textContent=games.filter(g=>fields.some(f=>isSet(valueFor(g.bgg_id,f.field_key)))).length}
function buildFieldFilters(){let opts=fields.map(f=>'<option value="'+esc(f.field_key)+'">'+esc(f.label)+'</option>').join('');$('#flagFilter').innerHTML='<option value="">All custom values</option><option value="__none">No custom values</option><option value="__any">Has any custom value</option>'+opts;$('#customFieldFilter').innerHTML='<option value="">Choose field…</option>'+opts;renderFieldList()}
function renderFieldList(){$('#fieldList').innerHTML=fields.length?fields.map(f=>'<div class="row" style="margin:6px 0"><b class="grow">'+esc(f.label)+'</b><span class="muted">'+esc(f.field_type)+'</span><button class="btn danger" onclick="deleteField(\''+esc(f.field_key)+'\')">Delete</button></div>').join(''):'<p class="muted">No custom fields yet.</p>'}
async function addField(){let label=$('#fieldLabel').value.trim(),field_type=$('#fieldType').value,options=$('#fieldOptions').value.split(',').map(x=>x.trim()).filter(Boolean);if(!label)return;let r=await fetch('/api/bgg-lab',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'field',owner:$('#username').value.trim(),label,field_type,options})}),p=await r.json();if(!p.ok)return toast(p.error,true);$('#fieldLabel').value='';$('#fieldOptions').value='';await loadCustom();toast('Field added')}
async function deleteField(k){if(!confirm('Delete this field and all of its saved values?'))return;let r=await fetch('/api/bgg-lab?kind=field&owner='+encodeURIComponent($('#username').value.trim())+'&field_key='+encodeURIComponent(k),{method:'DELETE'}),p=await r.json();if(!p.ok)return toast(p.error,true);await loadCustom()}
function buildStatuses(){$('#statusChips').innerHTML=statuses.map(s=>'<label class="chip"><input class="statusCheck" type="checkbox" value="'+s+'">'+s+'</label>').join('')}
function buildCustomValueFilter(){let k=$('#customFieldFilter').value,f=fields.find(x=>x.field_key===k),e=$('#customValueFilter');e.innerHTML='<option value="">Any value</option><option value="__blank">Blank</option><option value="__set">Has value</option>'+((f&&(f.field_type==='select'||f.field_type==='multiselect'))?(f.options||[]).map(o=>'<option>'+esc(o)+'</option>').join(''):'');render()}
async function init(){db=await openDB();games=await idbAll('games');$('#username').value=localStorage.getItem('collectionLabUser')||'sportomax';buildStatuses();try{await loadCustom()}catch(e){toast(e.message,true)}render();$('#cacheState').textContent=games.length?'Loaded from IndexedDB':'No local cache yet'}
$('#refresh').onclick=async()=>{await refreshBGG();await loadCustom()};$('#fieldsBtn').onclick=()=>{$('#fieldDialog').showModal();renderFieldList()};$('#addField').onclick=addField;$('#clearStatus').onclick=()=>{document.querySelectorAll('.statusCheck').forEach(x=>x.checked=false);render()};$('#search').oninput=render;$('#matchMode').onchange=render;$('#flagFilter').onchange=render;$('#customFieldFilter').onchange=buildCustomValueFilter;$('#customValueFilter').onchange=render;$('#sort').onchange=e=>{[sortKey,sortDir]=e.target.value.split(':');render()};document.addEventListener('change',e=>{if(e.target.classList.contains('statusCheck'))render()});$('#username').onchange=async()=>{localStorage.setItem('collectionLabUser',$('#username').value.trim());await loadCustom()};init();
</script></body></html>
