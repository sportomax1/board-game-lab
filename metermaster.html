<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Meter Master - BGG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { padding: max(env(safe-area-inset-top), 0) max(env(safe-area-inset-right), 0) max(env(safe-area-inset-bottom), 0) max(env(safe-area-inset-left), 0); }
        input, select, button { font-size: 16px; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <div id="settingsModal" class="fixed inset-0 bg-gradient-to-br from-orange-900 to-red-900 z-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-3xl shadow-2xl p-6 md:p-8 max-w-md w-full my-4">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-2 text-center">📊 Meter Master</h1>
            <p class="text-gray-500 text-center text-base mb-6">Sort games by stats!</p>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">BGG Username</label>
                    <input type="text" id="username" class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 focus:border-orange-500 outline-none" value="sportomax">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Sort Category</label>
                    <select id="category" class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 focus:border-orange-500 outline-none">
                        <option value="weight">Weight (1-5)</option>
                        <option value="average">Average Rating (1-10)</option>
                        <option value="rank">BGG Rank</option>
                        <option value="userrating">My Rating (1-10)</option>
                    </select>
                </div>
                <button onclick="startGame()" class="w-full bg-orange-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-orange-700 transition shadow-lg">Start Game</button>
            </div>
        </div>
    </div>
    <div id="infoModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-6 max-w-md w-full">
            <h2 class="text-2xl font-bold text-gray-900 mb-4">ℹ️ How to Play</h2>
            <div class="space-y-3 text-gray-700">
                <p>• Click games to place them in rating zones</p>
                <p>• Zones are based on selected category</p>
                <p>• Sort all games into correct ranges</p>
                <p>• Green = correct, Red = wrong</p>
            </div>
            <button onclick="closeInfo()" class="w-full mt-6 bg-orange-600 text-white py-3 rounded-lg font-bold hover:bg-orange-700">Got it!</button>
        </div>
    </div>
    <div id="app" class="hidden flex-1 flex flex-col">
        <header class="bg-white shadow-sm sticky top-0 z-30 px-4 py-3">
            <div class="max-w-6xl mx-auto flex items-center justify-between">
                <h1 class="font-bold text-xl text-gray-900">📊 Meter Master</h1>
                <div class="flex gap-2">
                    <button onclick="showInfo()" class="p-2 text-orange-500 hover:bg-orange-50 rounded-lg">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"/><path stroke-linecap="round" d="M12 16v-4m0-4h.01"/></svg>
                    </button>
                    <button onclick="showSettings()" class="p-2 text-gray-500 hover:bg-gray-100 rounded-lg">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    </button>
                </div>
            </div>
        </header>
        <main class="flex-1 p-4 max-w-6xl mx-auto w-full">
            <div class="bg-white rounded-xl shadow-sm p-4 mb-4">
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-sm text-gray-600">Correct</p>
                        <p class="text-2xl font-bold text-green-600" id="correct">0</p>
                    </div>
                    <div class="text-center">
                        <p class="text-sm text-gray-600">Category</p>
                        <p class="text-lg font-bold text-gray-900" id="categoryDisplay">Weight</p>
                    </div>
                    <div class="text-right">
                        <p class="text-sm text-gray-600">Remaining</p>
                        <p class="text-2xl font-bold text-orange-600" id="remaining">0</p>
                    </div>
                </div>
            </div>
            <div id="zones" class="grid grid-cols-2 md:grid-cols-5 gap-2 mb-4"></div>
            <div class="bg-white rounded-xl shadow-sm p-4">
                <h3 class="font-bold text-gray-900 mb-3">Games to Sort</h3>
                <div id="gamesList" class="grid grid-cols-1 md:grid-cols-2 gap-2"></div>
            </div>
            <button onclick="checkAnswers()" class="w-full mt-4 bg-green-500 text-white py-3 rounded-lg font-bold hover:bg-green-600">✓ Check Answers</button>
        </main>
    </div>
    <script>
        let collection = [];
        let category = 'weight';
        let zones = {};
        let currentGame = null;

        async function startGame() {
            const username = document.getElementById('username').value.trim() || 'sportomax';
            category = document.getElementById('category').value;
            document.getElementById('settingsModal').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('categoryDisplay').textContent = category.charAt(0).toUpperCase() + category.slice(1);
            try {
                const res = await fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&subtype=boardgame&stats=1`);
                const xml = await res.text();
                const parser = new DOMParser().parseFromString(xml, 'text/xml');
                const items = Array.from(parser.querySelectorAll('item'));
                collection = items.map(item => {
                    const stats = item.querySelector('stats');
                    const rating = stats?.querySelector('rating');
                    return {
                        id: item.getAttribute('objectid'),
                        name: item.querySelector('name').textContent,
                        weight: parseFloat(rating?.querySelector('averageweight')?.getAttribute('value') || '0'),
                        average: parseFloat(rating?.querySelector('average')?.getAttribute('value') || '0'),
                        rank: parseInt(rating?.querySelector('rank[name="boardgame"]')?.getAttribute('value') || '999999'),
                        userrating: parseFloat(rating?.querySelector('rating[username]')?.getAttribute('value') || '0')
                    };
                }).slice(0, 20);
                setupZones();
                render();
            } catch (error) {
                alert('Error: ' + error.message);
                location.reload();
            }
        }

        function setupZones() {
            const ranges = category === 'weight' ? 
                [[1,2],[2,3],[3,4],[4,5]] :
                category === 'average' || category === 'userrating' ?
                [[0,2],[2,4],[4,6],[6,8],[8,10]] :
                [[1,100],[101,500],[501,1000],[1001,5000]];
            
            zones = {};
            ranges.forEach(([min, max]) => {
                zones[`${min}-${max}`] = [];
            });
        }

        function render() {
            const rangeKeys = Object.keys(zones);
            document.getElementById('zones').innerHTML = rangeKeys.map(range => `
                <div class="bg-gradient-to-br from-orange-50 to-red-50 rounded-xl border-2 border-orange-300 p-4">
                    <h3 class="font-bold text-sm text-orange-800 mb-2">${range}</h3>
                    <div id="zone-${range}" class="space-y-1 min-h-[100px]">
                        ${zones[range].map((g, i) => `<div class="bg-white p-2 rounded text-xs">${g.name}</div>`).join('')}
                    </div>
                </div>
            `).join('');
            
            const unassigned = collection.filter(g => !Object.values(zones).flat().find(zg => zg.id === g.id));
            document.getElementById('gamesList').innerHTML = unassigned.map(game => `
                <button onclick="selectGame('${game.id}')" class="bg-gray-100 hover:bg-gray-200 p-3 rounded-lg text-left border border-gray-300 text-sm">
                    <div class="font-bold">${game.name}</div>
                    <div class="grid grid-cols-2 gap-1 mt-2">
                        ${Object.keys(zones).slice(0, 4).map(range => `
                            <button onclick="event.stopPropagation(); placeInZone('${game.id}', '${range}')" class="bg-orange-500 text-white text-xs py-1 rounded hover:bg-orange-600">${range}</button>
                        `).join('')}
                    </div>
                </button>
            `).join('');
            
            document.getElementById('remaining').textContent = unassigned.length;
        }

        function placeInZone(gameId, zoneKey) {
            const game = collection.find(g => g.id === gameId);
            zones[zoneKey].push(game);
            render();
        }

        function checkAnswers() {
            let correct = 0;
            Object.entries(zones).forEach(([range, games]) => {
                const [min, max] = range.split('-').map(Number);
                games.forEach(game => {
                    const value = game[category];
                    if (value >= min && value <= max) correct++;
                });
            });
            document.getElementById('correct').textContent = correct;
            alert(`You got ${correct} / ${collection.length} correct!`);
        }

        function selectGame(id) {
            const zone = prompt('Enter zone (e.g., 1-2, 2-4):');
            if (zone && zones[zone]) placeInZone(id, zone);
        }

        function showSettings() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function showInfo() { document.getElementById('infoModal').classList.remove('hidden'); }
        function closeInfo() { document.getElementById('infoModal').classList.add('hidden'); }
    </script>
</body>
</html>
