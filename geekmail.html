<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GeekMail CSV Explorer</title>
<style>body{margin:0;background:#0b1020;color:#edf2ff;font:14px system-ui;display:grid;place-items:center;min-height:100vh}#boot{padding:24px;text-align:center}</style>
</head>
<body>
<div id="boot">Loading GeekMail Explorer…</div>
<script>
(async()=>{
  const BUILD='20260911-1805-inline-collection-ui';
  const uiPatch=String.raw`<script>
(()=>{
  if(window.__GEEKMAIL_COLLECTION_UI__)return;
  window.__GEEKMAIL_COLLECTION_UI__=true;
  const API_FALLBACK='https://board-game-lab-one-phi-42.vercel.app/api/bgg-helper';
  let collection=[],observer=null,scanTimer=null;
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const norm=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[\\u0300-\\u036f]/g,'').replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').replace(/\\s+/g,' ').trim();
  const style=document.createElement('style');
  style.textContent='.bgg-enrich{margin:0 0 10px;background:#111a2e;border:1px solid #28344f;border-radius:14px;padding:10px 12px}.bgg-enrich-top{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.bgg-enrich-title{font-weight:800;font-size:13px;margin-right:auto;align-self:center}.bgg-enrich-field{display:flex;flex-direction:column;gap:4px;min-width:190px}.bgg-enrich-field label{font-size:10px;color:#9fb0cc}.bgg-enrich input{background:#0d1424;color:#edf2ff;border:1px solid #28344f;border-radius:9px;padding:8px 9px}.bgg-enrich button{border:1px solid #4c7ce7;background:#305ec8;color:#fff;padding:8px 11px;border-radius:9px;cursor:pointer}.bgg-enrich button:disabled{opacity:.5;cursor:wait}.bgg-progress{height:7px;background:#0a1020;border:1px solid #28344f;border-radius:999px;overflow:hidden;margin-top:9px}.bgg-progress>div{height:100%;width:0;background:linear-gradient(90deg,#547fe4,#53d3a3);transition:width .25s}.bgg-enrich-bottom{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:7px;flex-wrap:wrap}.bgg-status{font-size:11px;color:#9fb0cc}.bgg-mini-stats{display:flex;gap:6px;flex-wrap:wrap}.bgg-mini-stat{font-size:10px;color:#cbd8ef;background:#10192c;border:1px solid #28344f;border-radius:999px;padding:3px 7px}.collection-match{display:flex;align-items:center;gap:8px;margin:7px 0;padding:6px 7px;border:1px solid #41608e;background:#101d34;border-radius:9px;text-decoration:none;color:#edf2ff}.collection-match img{width:42px;height:42px;border-radius:6px;object-fit:cover;background:#0b1020;flex:0 0 auto}.collection-match strong{font-size:11px;display:block}.collection-match small{font-size:9px;color:#9fb0cc;display:block}';
  document.head.appendChild(style);
  const topbar=document.querySelector('.topbar');
  if(!topbar){console.error('GeekMail enrichment: .topbar not found');return;}
  const panel=document.createElement('div');
  panel.className='bgg-enrich';
  panel.innerHTML='<div class="bgg-enrich-top"><div class="bgg-enrich-title">🎲 BGG Collection Enrichment</div><div class="bgg-enrich-field"><label>BGG username</label><input id="bggCollectionUser"></div><button id="bggLoadCollection">Load / Refresh Collection</button></div><div class="bgg-progress"><div id="bggProgressFill"></div></div><div class="bgg-enrich-bottom"><div id="bggCollectionStatus" class="bgg-status">Ready to load collection.</div><div class="bgg-mini-stats"><span class="bgg-mini-stat">Games <b id="bggStatGames">0</b></span><span class="bgg-mini-stat">Thumbnails <b id="bggStatThumbs">0</b></span><span class="bgg-mini-stat">Cards scanned <b id="bggStatScanned">0</b></span><span class="bgg-mini-stat">Matched <b id="bggStatMatched">0</b></span></div></div>';
  topbar.insertAdjacentElement('afterend',panel);
  const user=panel.querySelector('#bggCollectionUser'),button=panel.querySelector('#bggLoadCollection'),status=panel.querySelector('#bggCollectionStatus'),fill=panel.querySelector('#bggProgressFill'),gamesEl=panel.querySelector('#bggStatGames'),thumbsEl=panel.querySelector('#bggStatThumbs'),scannedEl=panel.querySelector('#bggStatScanned'),matchedEl=panel.querySelector('#bggStatMatched');
  user.value=localStorage.getItem('geekmailCollectionUser')||document.querySelector('#myUser')?.value||'sportomax';
  const progress=(n,t)=>{fill.style.width=Math.max(0,Math.min(100,n))+'%';if(t)status.textContent=t;};
  function parse(xml){const doc=new DOMParser().parseFromString(xml,'text/xml');if(doc.querySelector('parsererror'))throw new Error('Invalid BGG XML');return [...doc.querySelectorAll('item')].map(i=>({id:i.getAttribute('objectid')||'',name:i.querySelector('name')?.textContent?.trim()||'',thumbnail:i.querySelector('thumbnail')?.textContent?.trim()||'',image:i.querySelector('image')?.textContent?.trim()||''})).filter(g=>g.id&&g.name).map(g=>({...g,norm:norm(g.name)}));}
  async function getXml(username,subtype){const qs=new URLSearchParams({endpoint:'collection',username,subtype,stats:'1'});const urls=[];if(location.protocol.startsWith('http'))urls.push(location.origin+'/api/bgg-helper?'+qs);urls.push(API_FALLBACK+'?'+qs);let last;for(const url of [...new Set(urls)]){try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(r.status+' '+r.statusText);const text=await r.text();if(!text.trim().startsWith('<'))throw new Error('BGG helper returned non-XML');return text;}catch(e){last=e;}}throw last||new Error('Collection request failed');}
  function best(subject,body){const s=norm(subject),b=norm(body);let winner=null,score=0;for(const g of collection){const n=g.norm;if(!n||n.length<3)continue;let x=0;if(s===n)x=1000+n.length;else if(n.length>=4&&s.includes(n))x=850+n.length;else if(s.length>=5&&n.includes(s))x=720+s.length;else if(n.length>=5&&b.includes(n))x=500+n.length;else{const t=n.split(' ').filter(v=>v.length>=3);if(t.length>=2){const sh=t.filter(v=>s.includes(v)).length,bh=t.filter(v=>b.includes(v)).length;if(sh===t.length)x=650+t.length*10;else if(bh===t.length)x=360+t.length*10;}}if(x>score){score=x;winner=g;}}return score>=360?winner:null;}
  function scan(){if(!collection.length)return;const cards=[...document.querySelectorAll('.message-card')];let matched=0;for(const card of cards){card.querySelector('.collection-match')?.remove();const m=best(card.querySelector('.message-subject')?.textContent||'',card.querySelector('.body-content')?.textContent||'');if(!m)continue;matched++;const a=document.createElement('a');a.className='collection-match';a.href='https://boardgamegeek.com/boardgame/'+encodeURIComponent(m.id);a.target='_blank';a.rel='noopener';a.innerHTML=(m.thumbnail?'<img src="'+esc(m.thumbnail)+'" alt="">':'')+'<span><strong>'+esc(m.name)+'</strong><small>Collection match · BGG #'+esc(m.id)+(m.thumbnail?' · thumbnail loaded':' · no thumbnail')+'</small></span>';const anchor=card.querySelector('.message-route')||card.querySelector('.message-subject');anchor?.insertAdjacentElement('afterend',a);}scannedEl.textContent=cards.length.toLocaleString();matchedEl.textContent=matched.toLocaleString();status.textContent='Ready · '+matched+'/'+cards.length+' visible message cards matched';}
  const queue=()=>{clearTimeout(scanTimer);scanTimer=setTimeout(scan,120);};
  async function load(){const username=user.value.trim()||'sportomax';user.value=username;const my=document.querySelector('#myUser');if(my)my.value=username;localStorage.setItem('geekmailCollectionUser',username);button.disabled=true;collection=[];gamesEl.textContent=thumbsEl.textContent=scannedEl.textContent=matchedEl.textContent='0';try{progress(8,'Connecting to BGG for '+username+'…');const [base,exp]=await Promise.all([getXml(username,'boardgame'),getXml(username,'boardgameexpansion').catch(()=>'<items/>')]);progress(55,'Parsing collection names and thumbnails…');const map=new Map();[...parse(base),...parse(exp)].forEach(g=>{const old=map.get(g.id);if(!old||(!old.thumbnail&&g.thumbnail))map.set(g.id,g);});collection=[...map.values()];const thumbs=collection.filter(g=>g.thumbnail||g.image).length;gamesEl.textContent=collection.length.toLocaleString();thumbsEl.textContent=thumbs.toLocaleString();progress(82,'Matching message cards…');scan();progress(100,'Loaded '+collection.length.toLocaleString()+' games · '+thumbs.toLocaleString()+' with artwork');observer?.disconnect();observer=new MutationObserver(queue);observer.observe(document.querySelector('#contactsView')||document.body,{childList:true,subtree:true});}catch(e){console.error(e);progress(0,'Collection load failed: '+e.message);}finally{button.disabled=false;}}
  user.addEventListener('input',()=>{const my=document.querySelector('#myUser');if(my)my.value=user.value;});
  button.addEventListener('click',load);
  status.textContent='Enter a BGG username and click Load / Refresh Collection. Default: '+user.value+'.';
})();
<\/script>`;
  try{
    const urls=[1,2,3].map(n=>`assets/geekmail/payload-${n}.txt?v=${BUILD}`);
    const [parts,collectionPatch]=await Promise.all([
      Promise.all(urls.map(async url=>{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(`${url}: ${r.status}`);return r.text();})),
      fetch(`assets/geekmail/collection-patch.txt?v=${BUILD}`,{cache:'no-store'}).then(async r=>{if(!r.ok)return '';return r.text();})
    ]);
    let app=parts.join('');
    const extras=`<script>window.GEEKMAIL_BUILD=${JSON.stringify(BUILD)};<\\/script>\n${collectionPatch}\n${uiPatch}`;
    app=/<\/body>\s*<\/html>\s*$/i.test(app)?app.replace(/<\/body>\s*<\/html>\s*$/i,extras+'\n</body></html>'):app+extras;
    document.open();document.write(app);document.close();
  }catch(error){document.getElementById('boot').textContent='Could not load GeekMail Explorer: '+error.message;console.error(error);}
})();
</script>
</body>
</html>
