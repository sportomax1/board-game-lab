<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GeekMail CSV Explorer</title>
<style>
  body{margin:0;background:#0b1020;color:#edf2ff;font:14px system-ui;display:grid;place-items:center;min-height:100vh}
  #boot{padding:24px;text-align:center}
</style>
</head>
<body>
<div id="boot">Loading GeekMail Explorer…</div>
<script>
(async()=>{
  try{
    const urls=[
      'assets/geekmail/payload-1.txt',
      'assets/geekmail/payload-2.txt',
      'assets/geekmail/payload-3.txt'
    ];
    const [parts,patch]=await Promise.all([
      Promise.all(urls.map(async url=>{
        const response=await fetch(url,{cache:'no-store'});
        if(!response.ok) throw new Error(`${url}: ${response.status}`);
        return response.text();
      })),
      fetch('assets/geekmail/collection-patch.txt',{cache:'no-store'}).then(async response=>{
        if(!response.ok) throw new Error(`collection patch: ${response.status}`);
        return response.text();
      })
    ]);
    let app=parts.join('');
    if(/<\/body>\s*<\/html>\s*$/i.test(app)){
      app=app.replace(/<\/body>\s*<\/html>\s*$/i,patch+'\n</body></html>');
    }else{
      app+=patch;
    }
    document.open();
    document.write(app);
    document.close();
  }catch(error){
    document.getElementById('boot').textContent='Could not load GeekMail Explorer: '+error.message;
    console.error(error);
  }
})();
</script>
</body>
</html>
