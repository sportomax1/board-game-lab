<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GeekMail CSV Explorer</title>
<style>
  body{margin:0;background:#0b1020;color:#edf2ff;font:14px system-ui;display:grid;place-items:center;min-height:100vh}
  #boot{padding:24px;text-align:center}
</style>
</head>
<body>
<div id="boot">Loading GeekMail Explorer…</div>
<script>
(async()=>{
  const BUILD='20260911-1825-supabase-cloud';
  try{
    const urls=[1,2,3].map(n=>`assets/geekmail/payload-${n}.txt?v=${BUILD}`);
    const patchUrls=[
      `assets/geekmail/collection-patch.txt?v=${BUILD}`,
      `assets/geekmail/ui-patch.txt?v=${BUILD}`,
      `assets/geekmail/cloud-patch.txt?v=${BUILD}`
    ];
    const [parts,patches]=await Promise.all([
      Promise.all(urls.map(async url=>{
        const response=await fetch(url,{cache:'no-store'});
        if(!response.ok) throw new Error(`${url}: ${response.status}`);
        return response.text();
      })),
      Promise.all(patchUrls.map(async url=>{
        const response=await fetch(url,{cache:'no-store'});
        if(!response.ok) throw new Error(`${url}: ${response.status}`);
        return response.text();
      }))
    ]);
    let app=parts.join('');
    const buildMarker=`<script>window.GEEKMAIL_BUILD=${JSON.stringify(BUILD)};<\/script>`;
    const patch=buildMarker+'\n'+patches.join('\n');
    if(/<\/body>\s*<\/html>\s*$/i.test(app)){
      app=app.replace(/<\/body>\s*<\/html>\s*$/i,patch+'\n</body></html>');
    }else{
      app+=patch;
    }
    document.open();
    document.write(app);
    document.close();
  }catch(error){
    document.getElementById('boot').textContent='Could not load GeekMail Explorer: '+error.message;
    console.error(error);
  }
})();
</script>
</body>
</html>
