<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Last Game Standing</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🏆</text></svg>">
    <style>
        :root {
            --primary: #007AFF; /* iOS Blue */
            --accent: #34C759;  /* iOS Green */
            --danger: #FF3B30;  /* iOS Red */
            --bg: #F2F2F7;      /* iOS Grouped Background */
            --card-bg: #FFFFFF;
            --text-main: #000000;
            --text-secondary: #8E8E93;
            --border: rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
        }

        /* Standard iOS Header Blur */
        .nav-bar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(249, 249, 249, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 0.5px solid var(--border);
            padding: env(safe-area-inset-top) 16px 12px 16px;
            text-align: center;
        }

        .nav-bar h1 {
            font-size: 17px;
            font-weight: 600;
            margin: 8px 0;
            letter-spacing: -0.4px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 16px;
            padding-bottom: 60px;
        }

        /* Modern Card Containers */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }

        .section-header {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 8px;
            padding-left: 4px;
        }

        /* Inputs & List Styling */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #E9E9EB;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            outline: none;
            -webkit-appearance: none;
        }

        .checkbox-row {
            display: flex;
            gap: 20px;
            padding: 8px 4px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 400;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            width: 100%;
        }

        .btn:active {
            opacity: 0.7;
            transform: scale(0.98);
        }

        /* Segmented Control (iOS Tabs) */
        .segmented-control {
            display: flex;
            background: #E3E3E8;
            padding: 2px;
            border-radius: 8px;
            margin: 0 0 20px 0;
        }

        .segment {
            flex: 1;
            padding: 6px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        .segment.active {
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.12);
            color: black;
        }

        /* Battle Interface */
        .matchup-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }

        .game-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid transparent;
            transition: all 0.2s;
            cursor: pointer;
            text-align: center;
            padding-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
        }

        .game-card:active {
            transform: scale(0.96);
        }

        .game-img-container {
            width: 100%;
            aspect-ratio: 1/1;
            overflow: hidden;
            background: #F2F2F7;
        }

        .game-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-name {
            font-size: 14px;
            font-weight: 600;
            margin: 10px 8px 4px 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 40px;
        }

        .game-stats {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* List Items (Final Results) */
        .list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 0.5px solid var(--border);
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .rank-number {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary);
            width: 24px;
        }

        .thumb-mini {
            width: 54px;
            height: 54px;
            border-radius: 8px;
            object-fit: cover;
            background: #eee;
        }

        .item-info {
            flex: 1;
        }

        .item-name {
            font-weight: 600;
            font-size: 15px;
        }

        .item-meta {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .status-pill {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            text-transform: uppercase;
        }

        /* Utility */
        .hidden { display: none; }
        
        #loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(0,122,255,0.2);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="nav-bar">
    <h1>Last Game Standing</h1>
</div>

<div class="container">
    <!-- Setup -->
    <div id="setup-view" class="card">
        <div class="section-header">Collection Settings</div>
        <div class="input-group">
            <input type="text" id="username" value="sportomax" placeholder="BGG Username" autocomplete="off">
            <div class="checkbox-row">
                <div class="checkbox-item">
                    <input type="checkbox" id="own" checked> <label for="own">Own</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="played"> <label for="played">Played</label>
                </div>
            </div>
            <button class="btn" onclick="fetchCollection()">Start Tournament</button>
        </div>
    </div>

    <!-- Loading State -->
    <div id="loading" class="hidden">
        <div class="spinner"></div>
        <div>Fetching BGG Collection...</div>
    </div>

    <!-- Battle View -->
    <div id="battle-view" class="hidden">
        <div class="card">
            <div style="display:flex; justify-content: space-between; align-items: flex-end; margin-bottom: 16px;">
                <div>
                    <div id="round-label" style="font-size: 20px; font-weight: 800; letter-spacing: -0.5px;">Round 1</div>
                    <div id="progress-label" style="font-size: 13px; color: var(--text-secondary);">Match 1/10</div>
                </div>
            </div>
            <div class="section-header">Pick the Winner</div>
            <div class="matchup-grid" id="matchup-container">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

    <!-- Result Views Container -->
    <div id="results-container" class="hidden">
        <div class="segmented-control">
            <div class="segment active" id="tab-standings" onclick="switchTab('standings')">Standings</div>
            <div class="segment" id="tab-crosswalk" onclick="switchTab('crosswalk')">Crosswalk</div>
        </div>

        <div id="standings-view">
            <div class="card">
                <div class="section-header">Tournament Ranking</div>
                <div id="standings-list"></div>
                <button class="btn" style="margin-top:24px; background: #8E8E93" onclick="location.reload()">New Tournament</button>
            </div>
        </div>

        <div id="crosswalk-view" class="hidden">
            <div class="card">
                <div class="section-header">Collection Status</div>
                <div id="crosswalk-list"></div>
            </div>
        </div>
    </div>
</div>

<script>
    let allGames = [];
    let matchups = [];
    let currentMatchIdx = 0;
    let roundNum = 1;
    let gamesFinished = [];

    // Navigation Logic
    function switchTab(tab) {
        document.getElementById('tab-standings').classList.toggle('active', tab === 'standings');
        document.getElementById('tab-crosswalk').classList.toggle('active', tab === 'crosswalk');
        document.getElementById('standings-view').classList.toggle('hidden', tab !== 'standings');
        document.getElementById('crosswalk-view').classList.toggle('hidden', tab !== 'crosswalk');
    }

    // Logic - UNCHANGED as per instructions
    function sleep(ms){ return new Promise(res=>setTimeout(res, ms)); }

    async function fetchWithRetries(url, opts = {}, maxAttempts = 6, baseDelay = 1200){
        let attempt = 0;
        let last = null;
        while(attempt < maxAttempts){
            attempt++;
            try{
                const res = await fetch(url, opts);
                const text = await res.text().catch(()=>'');
                let json = null;
                try{ json = text ? JSON.parse(text) : null; }catch(e){ json = null; }

                if(res.ok || res.status === 202) return { res, text, json };

                const statusHint = json?.status || res.status;
                if(statusHint === 429 || res.status === 429 || res.status === 502 || res.status === 503){
                    const ra = res.headers.get('Retry-After');
                    let delay = baseDelay * Math.pow(2, attempt-1);
                    if(ra){
                        const raSec = parseInt(ra, 10);
                        if(!isNaN(raSec)) delay = Math.max(delay, raSec*1000);
                    }
                    last = { res, text, json };
                    await sleep(delay);
                    continue;
                }

                return { res, text, json };
            } catch(e){
                last = { err: e };
                await sleep(baseDelay * Math.pow(2, attempt-1));
                continue;
            }
        }
        return last || { res: null, text: '', json: null };
    }

    async function fetchCollection() {
        const username = document.getElementById('username').value.trim();
        if (!username) return;

        const own = document.getElementById('own').checked;
        const played = document.getElementById('played').checked;
        
        document.getElementById('setup-view').classList.add('hidden');
        document.getElementById('loading').classList.remove('hidden');

        try {
            const BGG_HELPER = '/api/bgg-helper?endpoint=collection&';
            const params = [`username=${encodeURIComponent(username)}`,
                'stats=1',
                own ? 'own=1' : '',
                played ? 'played=1' : '',
                'subtype=boardgame',
                'excludesubtype=boardgameexpansion'
            ].filter(Boolean).join('&');
            const url = BGG_HELPER + params;

            const { res, text, json, err } = await fetchWithRetries(url, {}, 6, 1200);
            if(err){
                alert('Error fetching collection (network).');
                console.error('BGG helper network error', err);
                location.reload();
                return;
            }
            if(!res){
                alert('Error fetching collection (no response).');
                location.reload();
                return;
            }
            if(res.status === 202){
                // queued on server
                setTimeout(fetchCollection, 3000);
                return;
            }
            if(!res.ok){
                console.error('BGG helper error', json || text || '<no body>');
                alert('Error fetching collection. See console for details.');
                location.reload();
                return;
            }

            if(!text || text.trim().length === 0){
                alert('Empty response from BGG helper. Try again later.');
                location.reload();
                return;
            }

            const parser = new DOMParser();
            const xml = parser.parseFromString(text, "text/xml");
            if(xml.querySelector('message')){
                // server or BGG busy
                setTimeout(fetchCollection, 3000);
                return;
            }
            const items = xml.querySelectorAll('item');

            allGames = Array.from(items).map(item => ({
                id: item.getAttribute('objectid'),
                name: item.querySelector('name').textContent,
                thumbnail: item.querySelector('thumbnail')?.textContent || '',
                wins: 0,
                losses: 0,
                avgRating: parseFloat(item.querySelector('stats rating')?.getAttribute('value')) || 0,
                status: 'active',
                finishRound: 0
            }));

            if (allGames.length < 2) {
                alert("Need at least 2 games.");
                location.reload();
                return;
            }

            document.getElementById('loading').classList.add('hidden');
            startRound();
        } catch (e) {
            alert("Error fetching collection.");
            location.reload();
        }
    }

    function startRound() {
        const activeGames = allGames.filter(g => g.status === 'active');
        
        if (activeGames.length === 1) {
            activeGames[0].finishRound = roundNum;
            gamesFinished.push(activeGames[0]);
            showFinalResults();
            return;
        }

        activeGames.sort(() => Math.random() - 0.5);
        
        matchups = [];
        for (let i = 0; i < activeGames.length; i += 2) {
            if (i + 1 < activeGames.length) {
                matchups.push([activeGames[i], activeGames[i+1]]);
            } else {
                activeGames[i].wins++;
            }
        }

        currentMatchIdx = 0;
        document.getElementById('battle-view').classList.remove('hidden');
        document.getElementById('round-label').textContent = `Round ${roundNum}`;
        showMatch();
    }

    function showMatch() {
        if (currentMatchIdx >= matchups.length) {
            roundNum++;
            startRound();
            return;
        }

        const [g1, g2] = matchups[currentMatchIdx];
        document.getElementById('progress-label').textContent = `Match ${currentMatchIdx + 1} of ${matchups.length}`;
        
        const container = document.getElementById('matchup-container');
        container.innerHTML = `
            <div class="game-card" onclick="vote(0)">
                <div class="game-img-container">
                    <img src="${g1.thumbnail}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect fill=%22%23eee%22 width=%22100%22 height=%22100%22/%3E%3C/svg%3E'">
                </div>
                <div class="game-name">${g1.name}</div>
                <div class="game-stats">BGG Rating: ${g1.avgRating.toFixed(1)}</div>
            </div>
            <div class="game-card" onclick="vote(1)">
                <div class="game-img-container">
                    <img src="${g2.thumbnail}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect fill=%22%23eee%22 width=%22100%22 height=%22100%22/%3E%3C/svg%3E'">
                </div>
                <div class="game-name">${g2.name}</div>
                <div class="game-stats">BGG Rating: ${g2.avgRating.toFixed(1)}</div>
            </div>
        `;
    }

    function vote(winnerIdx) {
        const pair = matchups[currentMatchIdx];
        const winner = pair[winnerIdx];
        const loser = pair[winnerIdx === 0 ? 1 : 0];

        winner.wins++;
        loser.losses++;
        loser.status = 'eliminated';
        loser.finishRound = roundNum;
        gamesFinished.push(loser);

        currentMatchIdx++;
        showMatch();
    }

    function showFinalResults() {
        document.getElementById('battle-view').classList.add('hidden');
        document.getElementById('results-container').classList.remove('hidden');

        const standings = gamesFinished.sort((a, b) => {
            if (b.finishRound !== a.finishRound) return b.finishRound - a.finishRound;
            if (b.wins !== a.wins) return b.wins - a.wins;
            return b.avgRating - a.avgRating;
        });

        const list = document.getElementById('standings-list');
        list.innerHTML = standings.map((g, idx) => `
            <div class="list-item">
                <div class="rank-number">${idx + 1}</div>
                <img src="${g.thumbnail}" class="thumb-mini" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect fill=%22%23f0f0f0%22 width=%22100%22 height=%22100%22/%3E%3C/svg%3E'">
                <div class="item-info">
                    <div class="item-name">${g.name}</div>
                    <div class="item-meta">Round ${g.finishRound} • ${g.wins} Wins</div>
                </div>
            </div>
        `).join('');

        const crosswalk = document.getElementById('crosswalk-list');
        crosswalk.innerHTML = allGames.sort((a,b) => a.name.localeCompare(b.name)).map(g => `
            <div class="list-item">
                <img src="${g.thumbnail}" class="thumb-mini" style="width:36px; height:36px;">
                <div class="item-info">
                    <div class="item-name" style="font-size:13px">${g.name}</div>
                </div>
                <div class="status-pill" style="background: ${g.status === 'active' ? '#E1F5FE' : '#FFEBEE'}; color: ${g.status === 'active' ? '#0288D1' : '#D32F2F'}">
                    ${g.status}
                </div>
            </div>
        `).join('');
    }
</script>

</body>
</html>
