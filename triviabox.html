<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Trivia Box | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>📦</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-dark {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .clue-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hidden-game h2 {
            filter: blur(12px);
            opacity: 0.3;
        }

        .btn-primary {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }

        .info-item {
            @apply glass-dark p-4 rounded-2xl border border-white/5 flex flex-col gap-1;
        }

        @keyframes bounce-in {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-reveal {
            animation: bounce-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen selection:bg-amber-500/30">
    <!-- Background Decor -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-amber-900/20 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[10%] right-[0%] w-[50%] h-[50%] bg-blue-900/10 blur-[120px] rounded-full"></div>
    </div>

    <div class="relative z-10 flex flex-col min-h-screen pt-safe">
        <!-- Header -->
        <header class="p-6 flex items-center justify-between border-b border-white/5">
            <div class="flex flex-col">
                <h1 class="text-2xl font-black italic uppercase tracking-tighter leading-none text-white">Trivia <span class="text-amber-400">Box</span></h1>
                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-1">BGG Jeopardy Edition</p>
            </div>
            <button onclick="resetGame()" class="glass px-6 py-2 rounded-2xl border border-white/10 text-[10px] font-black uppercase tracking-widest hover:bg-white/10 transition-all">Restart</button>
        </header>

        <main class="flex-1 p-4 md:p-8 max-w-4xl mx-auto w-full flex flex-col justify-center">
            <!-- Setup Section -->
            <div id="setupSection" class="glass rounded-[2.5rem] p-8 md:p-12 shadow-2xl border-t border-white/20">
                <div class="text-center mb-10">
                    <div class="w-20 h-20 bg-amber-500/20 rounded-3xl flex items-center justify-center mx-auto mb-6 border border-amber-500/30">
                        <span class="text-4xl">🎲</span>
                    </div>
                    <h2 class="text-3xl font-black text-white italic uppercase tracking-tight mb-3">Welcome to the <span class="text-amber-400">Arena</span></h2>
                    <p class="text-slate-400 text-sm font-medium">Guess board games based on their mechanics, designers, and more.</p>
                </div>

                <div class="space-y-6 max-w-sm mx-auto">
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">BGG Username</label>
                        <input type="text" id="username" value="sportomax" class="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-amber-500/50 transition-all font-medium">
                    </div>

                    <div class="flex items-center justify-between bg-white/5 p-4 rounded-2xl border border-white/10">
                        <span class="text-sm font-bold text-white italic tracking-tight">Include Descriptions</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="useDescription" class="sr-only peer" checked>
                            <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-amber-500"></div>
                        </label>
                    </div>

                    <button onclick="loadGames()" class="w-full btn-primary text-slate-900 py-4 rounded-2xl font-black text-lg uppercase tracking-tight hover:scale-[1.02] active:scale-95 transition-all shadow-xl">
                        Enter Competition
                    </button>
                </div>
                <div id="setupStatus" class="mt-6 text-center text-xs font-bold text-amber-400 uppercase tracking-widest hidden"></div>
            </div>

            <!-- Game Section -->
            <div id="gameSection" class="hidden flex flex-col gap-6 animate-in">
                <!-- Scoreboard -->
                <div class="grid grid-cols-3 gap-3">
                    <div class="glass p-4 rounded-[2rem] border border-white/5 flex flex-col items-center">
                        <span class="text-[8px] font-black uppercase tracking-widest text-emerald-500 mb-1">Correct</span>
                        <span id="correctCount" class="text-2xl font-black text-white italic leading-none">0</span>
                    </div>
                    <div class="glass p-4 rounded-[2rem] border border-white/5 flex flex-col items-center">
                        <span class="text-[8px] font-black uppercase tracking-widest text-rose-500 mb-1">Wrong</span>
                        <span id="wrongCount" class="text-2xl font-black text-white italic leading-none">0</span>
                    </div>
                    <div class="glass p-4 rounded-[2rem] border border-white/5 flex flex-col items-center">
                        <span class="text-[8px] font-black uppercase tracking-widest text-amber-500 mb-1">Accuracy</span>
                        <span id="accuracy" class="text-2xl font-black text-white italic leading-none">0%</span>
                    </div>
                </div>

                <!-- Clue Card -->
                <div id="gameCard" class="glass rounded-[3rem] p-8 border border-white/10 shadow-2xl relative overflow-hidden flex flex-col items-center min-h-[400px] justify-center">
                    <div class="absolute top-4 left-1/2 -translate-x-1/2 text-[10px] font-black uppercase tracking-[0.3em] text-slate-600 italic" id="questionNum">Question 1</div>
                    
                    <div id="revealSection" class="hidden w-full flex flex-col items-center gap-6 mb-8 animate-reveal">
                        <div class="w-32 h-32 rounded-3xl bg-black/40 border border-white/10 p-2 shadow-2xl">
                            <img id="gameThumbnail" src="" class="w-full h-full object-contain rounded-2xl">
                        </div>
                        <h2 id="gameNameAnswer" class="text-3xl md:text-4xl font-black text-amber-400 italic uppercase tracking-tighter text-center"></h2>
                    </div>

                    <div id="gameInfo" class="grid grid-cols-1 md:grid-cols-2 gap-3 w-full max-w-2xl overflow-y-auto max-h-[500px] custom-scrollbar pr-2">
                        <!-- Clues injected here -->
                    </div>

                    <div id="resultIndicator" class="hidden text-6xl mt-8 animate-reveal"></div>
                </div>

                <!-- Controls -->
                <div id="controls" class="flex flex-col sm:flex-row gap-3">
                    <button id="revealBtn" onclick="revealAnswer()" class="flex-1 btn-primary text-slate-900 py-4 rounded-2xl font-black text-sm uppercase tracking-widest hover:scale-[1.02] active:scale-95 transition-all">Reveal Identity</button>
                    
                    <div id="actionBtns" class="hidden flex-1 flex gap-3">
                        <button onclick="markCorrect()" class="flex-1 bg-emerald-500 text-white py-4 rounded-2xl font-black text-sm uppercase tracking-widest hover:bg-emerald-400 active:scale-95 transition-all">Got It ✓</button>
                        <button onclick="markWrong()" class="flex-1 bg-rose-500 text-white py-4 rounded-2xl font-black text-sm uppercase tracking-widest hover:bg-rose-400 active:scale-95 transition-all">Missed ✕</button>
                    </div>

                    <button id="nextBtn" onclick="nextGame()" class="hidden flex-1 bg-blue-600 text-white py-4 rounded-2xl font-black text-sm uppercase tracking-widest hover:bg-blue-500 active:scale-95 transition-all">Next Challenger ➜</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        let allGames = [];
        let gameDetailsMap = {};
        let gameQueue = [];
        let currentGameIndex = 0;
        let currentGameDetails = null;
        let revealed = false;
        let answered = false;
        let correct = 0;
        let wrong = 0;
        let useDescription = true;

        const IMAGE_PROXY = 'https://images.weserv.nl/?url=';

        async function fetchWithRetry(url, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url);
                    if (response.status === 202) {
                        await new Promise(r => setTimeout(r, 2000 * (i + 1)));
                        continue;
                    }
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return await response.text();
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    await new Promise(r => setTimeout(r, 1000 * (i + 1)));
                }
            }
        }

        async function loadGames() {
            const username = document.getElementById('username').value.trim() || 'sportomax';
            useDescription = document.getElementById('useDescription').checked;
            updateStatus(`Scanning collection...`, 'loading');

            try {
                const collectionUrl = `/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1`;
                const collectionText = await fetchWithRetry(collectionUrl);
                const parser = new DOMParser();
                const collectionXml = parser.parseFromString(collectionText, 'text/xml');

                if (collectionXml.querySelector('errors error')) throw new Error('Private or non-existent collection');

                const items = Array.from(collectionXml.querySelectorAll('item'));
                if (items.length === 0) throw new Error('No games found');

                allGames = items.map(item => ({
                    id: item.getAttribute('objectid'),
                    name: item.querySelector('name').textContent
                })).sort(() => Math.random() - 0.5);

                gameQueue = [...allGames];
                document.getElementById('setupSection').classList.add('hidden');
                document.getElementById('gameSection').classList.remove('hidden');
                resetScores();
                fetchGameDetailsAsync();
                
                // Wait for initial data
                while (!gameDetailsMap[allGames[0].id]) await new Promise(r => setTimeout(r, 100));
                showGame();
            } catch (error) {
                updateStatus(`Error: ${error.message}`, 'error');
            }
        }

        async function fetchGameDetailsAsync() {
            const batchSize = 20;
            for (let i = 0; i < allGames.length; i += batchSize) {
                const batch = allGames.slice(i, i + batchSize);
                const ids = batch.map(g => g.id).join(',');
                try {
                    const res = await fetchWithRetry(`/api/bgg-helper?endpoint=thing&id=${ids}&stats=1`);
                    const xml = new DOMParser().parseFromString(res, 'text/xml');
                    Array.from(xml.querySelectorAll('item')).forEach(item => {
                        const id = item.getAttribute('id');
                        const game = allGames.find(g => g.id === id);
                        let desc = item.querySelector('description')?.textContent || '';
                        desc = desc.substring(0, 250).replace(new RegExp(game.name, 'gi'), '[REDACTED]') + '...';
                        
                        gameDetailsMap[id] = {
                            name: item.querySelector('name')?.getAttribute('value') || game.name,
                            year: item.querySelector('yearpublished')?.getAttribute('value'),
                            players: `${item.querySelector('minplayers')?.getAttribute('value')}-${item.querySelector('maxplayers')?.getAttribute('value')}`,
                            time: item.querySelector('playingtime')?.getAttribute('value'),
                            description: desc,
                            thumb: item.querySelector('thumbnail')?.textContent,
                            rating: parseFloat(item.querySelector('statistics > ratings > average')?.getAttribute('value') || 0).toFixed(1),
                            mechanics: Array.from(item.querySelectorAll('link[type="boardgamemechanic"]')).map(l => l.getAttribute('value')),
                            designers: Array.from(item.querySelectorAll('link[type="boardgamedesigner"]')).map(l => l.getAttribute('value'))
                        };
                    });
                } catch (e) { console.error(e); }
                await new Promise(r => setTimeout(r, 500));
            }
        }

        function showGame() {
            if (currentGameIndex >= gameQueue.length) return alert('Tournament Complete!');
            const game = gameQueue[currentGameIndex];
            currentGameDetails = gameDetailsMap[game.id] || game;
            
            revealed = false; answered = false;
            document.getElementById('questionNum').textContent = `Fighter ${currentGameIndex + 1}/${gameQueue.length}`;
            document.getElementById('revealSection').classList.add('hidden');
            document.getElementById('resultIndicator').classList.add('hidden');
            document.getElementById('revealBtn').classList.remove('hidden');
            document.getElementById('actionBtns').classList.add('hidden');
            document.getElementById('nextBtn').classList.add('hidden');

            const info = document.getElementById('gameInfo');
            info.innerHTML = '';
            
            if (useDescription && currentGameDetails.description) {
                info.innerHTML += `<div class="info-item md:col-span-2">
                    <span class="text-[8px] font-black uppercase text-amber-500 tracking-widest">Secret Files</span>
                    <p class="text-xs text-slate-300 leading-relaxed italic">${currentGameDetails.description}</p>
                </div>`;
            }

            const addStat = (lbl, val) => {
                if(!val || val.includes('undefined')) return;
                info.innerHTML += `<div class="info-item">
                    <span class="text-[8px] font-black uppercase text-amber-500 tracking-widest">${lbl}</span>
                    <span class="text-xs font-bold text-white uppercase">${val}</span>
                </div>`;
            };

            addStat('Year Built', currentGameDetails.year);
            addStat('Combatants', currentGameDetails.players);
            addStat('Duration', `${currentGameDetails.time}m`);
            addStat('Power Level', currentGameDetails.rating);
            addStat('Abilities', currentGameDetails.mechanics?.slice(0, 3).join(', '));
            addStat('Architect', currentGameDetails.designers?.slice(0, 2).join(', '));
        }

        function revealAnswer() {
            revealed = true;
            document.getElementById('gameThumbnail').src = `${IMAGE_PROXY}${encodeURIComponent(currentGameDetails.thumb)}`;
            document.getElementById('gameNameAnswer').textContent = currentGameDetails.name;
            document.getElementById('revealSection').classList.remove('hidden');
            document.getElementById('revealBtn').classList.add('hidden');
            document.getElementById('actionBtns').classList.remove('hidden');
        }

        function markCorrect() {
            if (answered) return;
            answered = true;
            correct++;
            showResult('✅', 'text-emerald-500');
        }

        function markWrong() {
            if (answered) return;
            answered = true;
            wrong++;
            showResult('✕', 'text-rose-500');
        }

        function showResult(icon, color) {
            const ind = document.getElementById('resultIndicator');
            ind.textContent = icon;
            ind.className = `text-6xl mt-8 animate-reveal ${color}`;
            ind.classList.remove('hidden');
            document.getElementById('actionBtns').classList.add('hidden');
            document.getElementById('nextBtn').classList.remove('hidden');
            updateScores();
        }

        function nextGame() { currentGameIndex++; showGame(); }
        function resetGame() { location.reload(); }
        function resetScores() { correct = 0; wrong = 0; updateScores(); }
        function updateScores() {
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('wrongCount').textContent = wrong;
            const total = correct + wrong;
            document.getElementById('accuracy').textContent = `${total > 0 ? Math.round((correct / total) * 100) : 0}%`;
        }

        function updateStatus(msg, type) {
            const el = document.getElementById('setupStatus');
            el.textContent = msg;
            el.className = `mt-6 text-center text-xs font-black uppercase tracking-widest ${type === 'error' ? 'text-rose-500' : 'text-amber-400'}`;
            el.classList.remove('hidden');
        }
    </script>
    <script type="module" src="analytics-init.js"></script>
</body>
</html>
