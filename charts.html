<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>BGG Charts | Sportomax</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0b1120; --surface: #111827; --surface2: #1a2236;
      --border: rgba(255,255,255,0.07); --border-hover: rgba(255,255,255,0.15);
      --text: #f1f5f9; --muted: #64748b;
      --accent: #6366f1; --accent-dark: #4f46e5; --accent-glow: rgba(99,102,241,0.22);
    }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; -webkit-tap-highlight-color: transparent; }
    header { position: sticky; top: 0; z-index: 30; background: rgba(17,24,39,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 14px 20px; }
    .header-inner { max-width: 900px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon { width: 38px; height: 38px; background: linear-gradient(135deg, var(--accent), var(--accent-dark)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; box-shadow: 0 4px 12px var(--accent-glow); }
    .brand-text h1 { font-size: 15px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.1; text-transform: uppercase; font-style: italic; }
    .brand-text h1 span { color: var(--accent); }
    .brand-text p { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-top: 2px; }
    .header-stat .big { font-size: 22px; font-weight: 800; color: var(--accent); line-height: 1; }
    .header-stat .lbl { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-top: 2px; text-align: right; }
    main { max-width: 900px; margin: 0 auto; padding: 20px 16px 60px; display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 1; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    .card-body { padding: 18px 20px; }
    .tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--surface); }
    .tab-btn { flex: 1; padding: 12px 10px; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; transition: color 0.2s, border-color 0.2s, background 0.2s; font-family: inherit; }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); background: rgba(99,102,241,0.04); }
    .tab-btn:hover:not(.active) { color: var(--text); }
    .tab-pane { display: none; } .tab-pane.active { display: block; }
    .field-label { display: block; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 6px; }
    .input-row { display: flex; gap: 8px; }
    input[type="text"], input[type="file"], select { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; font-size: 12px; color: var(--text); font-family: inherit; outline: none; transition: border-color 0.2s; width: 100%; }
    input[type="text"]:focus, select:focus { border-color: var(--accent); }
    input[type="text"]::placeholder { color: var(--muted); }
    select option { background: var(--surface2); color: var(--text); }
    input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 18px; border-radius: 10px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; border: none; transition: opacity 0.2s, transform 0.1s; font-family: inherit; flex-shrink: 0; white-space: nowrap; }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #fff; box-shadow: 0 3px 10px var(--accent-glow); }
    .btn-primary:hover { opacity: 0.9; }
    .pill-group { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .pill-btn { padding: 6px 14px; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; cursor: pointer; border: none; background: var(--surface2); color: var(--muted); font-family: inherit; transition: background 0.15s, color 0.15s; }
    .pill-btn.active { background: var(--accent); color: #fff; }
    .pill-btn:hover:not(.active) { color: var(--text); }
    .controls-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    @media (max-width: 640px) { .controls-grid { grid-template-columns: 1fr; } }
    .controls-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
    @media (max-width: 480px) { .controls-row { grid-template-columns: 1fr; } }
    .check-label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 11px; font-weight: 600; color: var(--muted); padding-top: 14px; border-top: 1px solid var(--border); }
    .check-label:hover { color: var(--text); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid rgba(99,102,241,0.25); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    .loading-inner { text-align: center; padding: 32px 20px; }
    .spinner-wrap { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 8px; }
    .loading-status { font-size: 13px; font-weight: 700; color: var(--text); }
    .loading-sub { font-size: 10px; font-weight: 600; color: var(--muted); margin-top: 4px; }
    .chart-wrap { position: relative; width: 100%; }
    .plays-header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--border); }
    .plays-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text); flex: 1; min-width: 0; }
    .source-toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
    .source-irl { color: #818cf8; } .source-bga { color: #2dd4bf; }
    .hidden { display: none !important; }
    .section-hint { font-size: 10px; font-weight: 600; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }
    .bg-decor { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .bg-blob { position: absolute; border-radius: 50%; filter: blur(100px); }
  </style>
</head>
<body>

<div class="bg-decor">
  <div class="bg-blob" style="top:-10%;left:-10%;width:40%;height:40%;background:rgba(99,102,241,0.06)"></div>
  <div class="bg-blob" style="bottom:5%;right:-5%;width:45%;height:45%;background:rgba(13,148,136,0.05)"></div>
</div>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-icon"><i class="fa-solid fa-chart-line" style="color:#fff;font-size:16px"></i></div>
      <div class="brand-text">
        <h1>Collection <span>Charts</span></h1>
        <p>Visualize Your BGG Data</p>
      </div>
    </div>
    <div class="header-stat">
      <div class="big" id="gameCount">0</div>
      <div class="lbl" id="gameCountLabel">Games</div>
    </div>
  </div>
</header>

<main>

  <div class="card" id="fetchSection">
    <div class="tabs">
      <button class="tab-btn active" id="tabCollection" onclick="switchTab('collection')"><i class="fa-solid fa-box-archive" style="margin-right:5px"></i>Collection</button>
      <button class="tab-btn" id="tabCsv" onclick="switchTab('csv')"><i class="fa-solid fa-file-csv" style="margin-right:5px"></i>CSV Upload</button>
      <button class="tab-btn" id="tabPlays" onclick="switchTab('plays')"><i class="fa-solid fa-dice" style="margin-right:5px"></i>Plays</button>
    </div>
    <div class="tab-pane active card-body" id="collectionTab">
      <label class="field-label" for="username">BGG Username</label>
      <div class="input-row">
        <input type="text" id="username" value="sportomax" placeholder="Enter username…">
        <button class="btn btn-primary" onclick="fetchCollection()" id="fetchBtn"><i class="fa-solid fa-download"></i> Load</button>
      </div>
    </div>
    <div class="tab-pane card-body" id="csvTab">
      <p class="section-hint">CSV must contain a date column (e.g. <code style="background:var(--surface2);padding:1px 5px;border-radius:4px;font-size:9px">invdate</code>) or numeric fields for charting.</p>
      <label class="field-label" for="csvFile">CSV File</label>
      <div class="input-row">
        <input type="file" id="csvFile" accept=".csv">
        <button class="btn btn-primary" onclick="loadCSV()" id="csvBtn"><i class="fa-solid fa-upload"></i> Load</button>
      </div>
    </div>
    <div class="tab-pane card-body" id="playsTab">
      <label class="field-label" for="playsUsername">BGG Username</label>
      <div class="input-row">
        <input type="text" id="playsUsername" value="sportomax" placeholder="Enter username…">
        <button class="btn btn-primary" onclick="fetchPlays()" id="fetchPlaysBtn"><i class="fa-solid fa-download"></i> Load</button>
      </div>
    </div>
  </div>

  <div class="card" id="loadingSection" style="display:none">
    <div class="loading-inner">
      <div class="spinner-wrap"><div class="spinner"></div><span class="loading-status" id="loadingStatus">Loading data…</span></div>
      <div class="loading-sub" id="pageInfo"></div>
    </div>
  </div>

  <div class="card hidden" id="controlsSection">
    <div class="card-body" style="display:flex;flex-direction:column;gap:14px">
      <div class="controls-grid">
        <div>
          <label class="field-label" for="chartTypeSelect">Chart Type</label>
          <select id="chartTypeSelect" onchange="generateChart()">
            <option value="bar">Bar Chart</option>
            <option value="line">Line Graph</option>
            <option value="pie">Pie Chart</option>
          </select>
        </div>
        <div>
          <label class="field-label" for="xAxisSelect">Group By (X-Axis)</label>
          <select id="xAxisSelect" onchange="generateChart()"></select>
        </div>
        <div>
          <label class="field-label" for="yAxisSelect">Value (Y-Axis)</label>
          <select id="yAxisSelect" onchange="generateChart()"><option value="count">Count of Games</option></select>
        </div>
      </div>
      <div class="controls-row hidden" id="dynamicControls">
        <div id="timeGroupSection" class="hidden">
          <label class="field-label" for="timeGroupSelect">Group Dates By</label>
          <select id="timeGroupSelect" onchange="generateChart()">
            <option value="month">Month</option>
            <option value="quarter">Quarter</option>
            <option value="year">Year</option>
          </select>
        </div>
        <div id="dateRangeSection" class="hidden">
          <label class="field-label" for="dateRangeSelect">Date Range</label>
          <select id="dateRangeSelect" onchange="generateChart()">
            <option value="all">All Time</option>
            <option value="12">Last 12 Months</option>
            <option value="24">Last 24 Months</option>
            <option value="thisYear">This Year</option>
          </select>
        </div>
      </div>
      <label class="check-label" id="flipAxesLabel">
        <input type="checkbox" id="flipAxesCheckbox" onchange="generateChart()">
        Flip Axes (Horizontal Bars)
      </label>
    </div>
  </div>

  <div class="card hidden" id="chartContainer">
    <div class="card-body">
      <div class="chart-wrap" id="chartWrap" style="min-height:340px"><canvas id="myChart"></canvas></div>
    </div>
  </div>

  <div class="card hidden" id="playsChartSection">
    <div class="plays-header">
      <span class="plays-title" id="playsChartTitle">Plays Over Time</span>
      <div class="pill-group">
        <button class="pill-btn active" id="groupMonth" onclick="setPlaysGroup('month')">Month</button>
        <button class="pill-btn" id="groupYear" onclick="setPlaysGroup('year')">Year</button>
      </div>
      <label class="source-toggle source-irl"><input type="checkbox" id="showIRL" checked onchange="generatePlaysChart()"> IRL</label>
      <label class="source-toggle source-bga"><input type="checkbox" id="showBGA" checked onchange="generatePlaysChart()"> BGA</label>
    </div>
    <div class="card-body">
      <div class="chart-wrap" id="playsChartWrap" style="min-height:300px"><canvas id="playsChart"></canvas></div>
    </div>
  </div>

</main>

<script>
const API_BASE = '/api/bgg-helper';
const PLAY_FETCH_PARALLEL = 100;
let allGames = [], chart = null, rawPlays = [], playsGroup = 'month', playsChart = null;

Chart.defaults.color = '#94a3b8';
Chart.defaults.borderColor = 'rgba(255,255,255,0.06)';
Chart.defaults.font.family = "'Inter', sans-serif";

function switchTab(tab) {
  ['collection','csv','plays'].forEach(t => {
    document.getElementById(t + 'Tab').classList.toggle('active', t === tab);
    document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).classList.toggle('active', t === tab);
  });
  if (tab !== 'plays') {
    document.getElementById('playsChartSection').classList.add('hidden');
  } else {
    document.getElementById('controlsSection').classList.add('hidden');
    document.getElementById('chartContainer').classList.add('hidden');
    if (rawPlays.length > 0) document.getElementById('playsChartSection').classList.remove('hidden');
  }
}

function parseCSVLine(line) {
  const result = []; let current = '', inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const char = line[i], next = line[i+1];
    if (char === '"') { if (inQuotes && next === '"') { current += '"'; i++; } else inQuotes = !inQuotes; }
    else if (char === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
    else current += char;
  }
  result.push(current.trim()); return result;
}

async function loadCSV() {
  const file = document.getElementById('csvFile').files[0];
  if (!file) { alert('Please select a CSV file'); return; }
  showLoading('Parsing CSV…');
  const text = await file.text();
  const lines = text.trim().split('\n');
  const headers = parseCSVLine(lines[0]).map(h => h.replace(/^['"]|['"]$/g, ''));
  allGames = [];
  for (let i = 1; i < lines.length; i++) {
    const vals = parseCSVLine(lines[i]).map(v => v.replace(/^['"]|['"]$/g, ''));
    const row = {}; headers.forEach((h, idx) => row[h] = vals[idx] || ''); allGames.push(row);
  }
  hideLoading(); setCount(allGames.length, 'Rows');
  document.getElementById('controlsSection').classList.remove('hidden');
  document.getElementById('chartContainer').classList.remove('hidden');
  populateAxisOptions(headers); generateChart();
}

async function fetchCollection() {
  const username = document.getElementById('username').value.trim() || 'sportomax';
  showLoading('Fetching collection…');
  try {
    const xml = await fetchWithRetry(`${API_BASE}?endpoint=collection&username=${encodeURIComponent(username)}&stats=1&own=1`);
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    const items = Array.from(doc.querySelectorAll('item')).filter(item =>
      parseInt(item.querySelector('status')?.getAttribute('own') || '0') === 1);
    if (!items.length) { updateLoadingStatus('No owned games found.'); return; }
    updateLoadingStatus(`Parsing ${items.length} games…`);
    allGames = items.map(item => ({
      name: item.querySelector('name')?.textContent || 'N/A',
      year: item.querySelector('yearpublished')?.textContent || '',
      rating: item.querySelector('stats rating')?.getAttribute('value') || '0',
      bggRating: item.querySelector('stats rating average')?.getAttribute('value') || '0',
      averageweight: item.querySelector('stats rating averageweight')?.getAttribute('value') || '0',
      minplayers: item.querySelector('stats')?.getAttribute('minplayers') || '0',
      maxplayers: item.querySelector('stats')?.getAttribute('maxplayers') || '0',
      playingtime: item.querySelector('stats')?.getAttribute('playingtime') || '0',
    }));
    hideLoading(); setCount(allGames.length, 'Games');
    document.getElementById('controlsSection').classList.remove('hidden');
    document.getElementById('chartContainer').classList.remove('hidden');
    populateAxisOptions(Object.keys(allGames[0] || {})); generateChart();
  } catch(err) { updateLoadingStatus('Error: ' + err.message); }
}

async function fetchPlays() {
  const username = document.getElementById('playsUsername').value.trim();
  if (!username) return;
  showLoading('Fetching plays…');
  document.getElementById('playsChartSection').classList.add('hidden');
  document.getElementById('pageInfo').textContent = '';
  rawPlays = await fetchAllPlays(username);
  hideLoading();
  if (!rawPlays.length) { updateLoadingStatus('No plays found.'); return; }
  setCount(rawPlays.length, 'Plays');
  document.getElementById('playsChartTitle').textContent = `${rawPlays.length.toLocaleString()} plays · ${username}`;
  document.getElementById('playsChartSection').classList.remove('hidden');
  generatePlaysChart();
}

async function fetchAllPlays(username) {
  let pageStart = 1, stopFound = false; const allP = [];
  while (!stopFound) {
    const batch = []; for (let i = 0; i < PLAY_FETCH_PARALLEL; i++) batch.push(fetchPage(username, pageStart + i));
    const results = (await Promise.all(batch)).sort((a,b) => a.page - b.page);
    for (const res of results) { if (res.plays.length > 0) allP.push(...res.plays); else stopFound = true; }
    if (!stopFound) { pageStart += PLAY_FETCH_PARALLEL; document.getElementById('pageInfo').textContent = allP.length.toLocaleString() + ' records loaded…'; await new Promise(r => setTimeout(r, 600)); }
  }
  return allP;
}

async function fetchPage(username, page) {
  const url = `${API_BASE}?endpoint=plays&username=${encodeURIComponent(username)}&page=${page}`;
  try {
    const res = await fetch(url); const text = await res.text();
    const xml = new DOMParser().parseFromString(text, 'text/xml');
    const nodes = xml.getElementsByTagName('play');
    if (!nodes.length) return { page, plays: [] };
    return { page, plays: Array.from(nodes).map(n => {
      const item = n.getElementsByTagName('item')[0];
      return { id: n.getAttribute('id'), date: n.getAttribute('date'), quantity: n.getAttribute('quantity') || '1', length: n.getAttribute('length') || '0', location: n.getAttribute('location') || 'IRL', game: item?.getAttribute('name') || 'Unknown', gameId: item?.getAttribute('objectid') || null };
    })};
  } catch { return { page, plays: [] }; }
}

function populateAxisOptions(headers) {
  const xSel = document.getElementById('xAxisSelect'), ySel = document.getElementById('yAxisSelect');
  xSel.innerHTML = ''; Array.from(ySel.options).forEach(o => { if (o.value !== 'count') o.remove(); });
  headers.forEach(h => {
    xSel.add(new Option(h, h));
    if (allGames.every(g => g[h] === '' || g[h] === null || !isNaN(g[h]))) {
      ySel.add(new Option('Sum of ' + h, 'sum-' + h)); ySel.add(new Option('Average of ' + h, 'avg-' + h));
    }
  });
  const dateField = headers.find(h => h.toLowerCase().includes('date'));
  if (dateField) xSel.value = dateField;
  updateDynamicControls();
}

function updateDynamicControls() {
  const xField = document.getElementById('xAxisSelect').value;
  const chartType = document.getElementById('chartTypeSelect').value;
  const isDate = xField && xField.toLowerCase().includes('date');
  document.getElementById('timeGroupSection').classList.toggle('hidden', !isDate);
  document.getElementById('dateRangeSection').classList.toggle('hidden', !isDate);
  document.getElementById('dynamicControls').classList.toggle('hidden', !isDate);
  const flipLabel = document.getElementById('flipAxesLabel');
  if (chartType === 'bar') flipLabel.style.display = '';
  else { flipLabel.style.display = 'none'; document.getElementById('flipAxesCheckbox').checked = false; }
}

function generateChart() {
  const ctx = document.getElementById('myChart').getContext('2d');
  const chartType = document.getElementById('chartTypeSelect').value;
  const xField    = document.getElementById('xAxisSelect').value;
  const yAction   = document.getElementById('yAxisSelect').value;
  const timeGroup = document.getElementById('timeGroupSelect').value;
  const dateRange = document.getElementById('dateRangeSelect').value;
  const flipAxes  = document.getElementById('flipAxesCheckbox').checked;
  updateDynamicControls();
  if (!xField) return;
  let filtered = allGames;
  if (xField.toLowerCase().includes('date') && dateRange !== 'all') {
    const now = new Date(); let start = new Date();
    if (dateRange === '12') start.setMonth(now.getMonth() - 12);
    else if (dateRange === '24') start.setMonth(now.getMonth() - 24);
    else if (dateRange === 'thisYear') start = new Date(now.getFullYear(), 0, 1);
    filtered = allGames.filter(g => { const d = new Date(g[xField]); return !isNaN(d) && d >= start && d <= now; });
  }
  const grouped = {};
  filtered.forEach(g => {
    let key = String(g[xField] ?? ''); if (!key) return;
    if (xField.toLowerCase().includes('date')) {
      const d = new Date(key); if (isNaN(d)) return;
      const y = d.getUTCFullYear(), m = d.getUTCMonth(), q = Math.floor(m/3)+1;
      if (timeGroup === 'month') key = `${y}-${String(m+1).padStart(2,'0')}`;
      else if (timeGroup === 'quarter') key = `${y}-Q${q}`;
      else key = String(y);
    }
    if (!grouped[key]) grouped[key] = { count: 0, sum: 0, values: [] };
    grouped[key].count++;
    if (yAction !== 'count') { const yField = yAction.split('-')[1], v = parseFloat(g[yField]); if (!isNaN(v)) { grouped[key].sum += v; grouped[key].values.push(v); } }
  });
  const labels = Object.keys(grouped).sort();
  const yLabel = document.getElementById('yAxisSelect').selectedOptions[0].text;
  let data;
  if (yAction === 'count') data = labels.map(l => grouped[l].count);
  else if (yAction.startsWith('sum-')) data = labels.map(l => grouped[l].sum);
  else data = labels.map(l => grouped[l].count > 0 ? grouped[l].sum / grouped[l].count : 0);
  if (chart) chart.destroy();
  const isPie = chartType === 'pie';
  chart = new Chart(ctx, {
    type: chartType,
    data: { labels, datasets: [{ label: yLabel, data, backgroundColor: isPie ? generateColors(labels.length) : 'rgba(99,102,241,0.55)', borderColor: isPie ? 'transparent' : 'rgba(99,102,241,0.9)', borderWidth: 1, borderRadius: isPie ? 0 : 4, fill: chartType === 'line' ? 'origin' : false, tension: 0.35, pointBackgroundColor: 'rgba(99,102,241,0.9)' }] },
    options: {
      indexAxis: (chartType === 'bar' && flipAxes) ? 'y' : 'x',
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: isPie, labels: { color: '#94a3b8', padding: 16, font: { size: 11 } } },
        tooltip: { backgroundColor: 'rgba(17,24,39,0.95)', titleColor: '#f1f5f9', bodyColor: '#94a3b8', borderColor: 'rgba(255,255,255,0.08)', borderWidth: 1, padding: 10 }
      },
      scales: {
        y: { display: !isPie, beginAtZero: true, grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#64748b' } },
        x: { display: !isPie, grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#64748b' } }
      }
    }
  });
}

function isBGAPlay(p) { const l = (p.location || '').toLowerCase(); return l.includes('bga') || l.includes('boardgamearena') || l.includes('board game arena'); }

function setPlaysGroup(group) {
  playsGroup = group;
  document.getElementById('groupMonth').classList.toggle('active', group === 'month');
  document.getElementById('groupYear').classList.toggle('active', group === 'year');
  generatePlaysChart();
}

function formatPeriodLabel(key) {
  if (playsGroup === 'month' && /^\d{4}-\d{2}$/.test(key)) {
    const [y,m] = key.split('-');
    return new Date(+y,+m-1,1).toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
  }
  return key;
}

function generatePlaysChart() {
  const showIRL = document.getElementById('showIRL').checked, showBGA = document.getElementById('showBGA').checked;
  const irlMap = {}, bgaMap = {};
  rawPlays.forEach(p => {
    if (!p.date) return; const d = new Date(p.date); if (isNaN(d)) return;
    const qty = parseInt(p.quantity) || 1;
    const key = playsGroup === 'month' ? `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}` : String(d.getUTCFullYear());
    if (isBGAPlay(p)) bgaMap[key] = (bgaMap[key] || 0) + qty; else irlMap[key] = (irlMap[key] || 0) + qty;
  });
  const allKeys = [...new Set([...Object.keys(irlMap), ...Object.keys(bgaMap)])].sort().reverse();
  const displayLabels = allKeys.map(formatPeriodLabel);
  const datasets = [];
  if (showIRL) datasets.push({ label: 'IRL', data: allKeys.map(k => irlMap[k] || 0), backgroundColor: 'rgba(99,102,241,0.7)', borderColor: 'rgba(99,102,241,0.9)', borderWidth: 1, borderRadius: 3 });
  if (showBGA) datasets.push({ label: 'BGA', data: allKeys.map(k => bgaMap[k] || 0), backgroundColor: 'rgba(13,148,136,0.7)', borderColor: 'rgba(13,148,136,0.9)', borderWidth: 1, borderRadius: 3 });
  const rowH = playsGroup === 'year' ? 36 : 26;
  document.getElementById('playsChartWrap').style.minHeight = Math.max(240, allKeys.length * rowH + 60) + 'px';
  if (playsChart) playsChart.destroy();
  playsChart = new Chart(document.getElementById('playsChart').getContext('2d'), {
    type: 'bar', data: { labels: displayLabels, datasets },
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: datasets.length > 1, position: 'top', labels: { color: '#94a3b8', font: { size: 11 } } },
        tooltip: { backgroundColor: 'rgba(17,24,39,0.95)', titleColor: '#f1f5f9', bodyColor: '#94a3b8', borderColor: 'rgba(255,255,255,0.08)', borderWidth: 1, padding: 10, callbacks: { footer: items => items.length > 1 ? 'Total: ' + items.reduce((s,i) => s+i.raw, 0) : '' } }
      },
      scales: {
        x: { stacked: true, beginAtZero: true, grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#64748b' }, title: { display: true, text: 'Plays', font: { weight: 'bold', size: 11 }, color: '#64748b' } },
        y: { stacked: true, grid: { display: false }, ticks: { color: '#94a3b8', font: { size: playsGroup === 'year' ? 13 : 11 } } }
      }
    }
  });
}

function generateColors(n) { return Array.from({length:n},(_,i) => `hsla(${Math.round(i*360/n)},60%,58%,0.8)`); }

function showLoading(msg) { document.getElementById('loadingStatus').textContent = msg; document.getElementById('loadingSection').style.display = ''; document.getElementById('fetchSection').classList.add('hidden'); }
function hideLoading() { document.getElementById('loadingSection').style.display = 'none'; document.getElementById('fetchSection').classList.remove('hidden'); }
function updateLoadingStatus(msg) { document.getElementById('loadingStatus').textContent = msg; }
function setCount(n, label) { document.getElementById('gameCount').textContent = n.toLocaleString(); document.getElementById('gameCountLabel').textContent = label; }

async function fetchWithRetry(url, maxRetries = 3) {
  for (let attempt = 0; attempt < maxRetries; attempt++) {
    try {
      const res = await fetch(url);
      if (res.status === 202) { await new Promise(r => setTimeout(r, 2000 + attempt*500)); continue; }
      if (res.ok) return await res.text();
      if ([429,500,502,503,504].includes(res.status)) { if (attempt === maxRetries-1) throw new Error(`HTTP ${res.status}`); await new Promise(r => setTimeout(r, 1200+attempt*800)); continue; }
      throw new Error(`HTTP ${res.status}`);
    } catch(e) { if (attempt === maxRetries-1) throw e; await new Promise(r => setTimeout(r, 1200+attempt*800)); }
  }
  throw new Error('Failed to fetch');
}

window.addEventListener('DOMContentLoaded', () => { switchTab('collection'); updateDynamicControls(); });
</script>
