<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>BGG Charts</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="pb-20">

  <header class="sticky top-0 z-30 w-full bg-white/80 backdrop-blur-md border-b px-4 py-3 shadow-sm">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 text-white p-2 rounded-lg"><i class="fa-solid fa-chart-line"></i></div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">Collection Charts</h1>
          <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Visualize Your Collection</p>
        </div>
      </div>
      <div id="statsBox" class="text-right">
        <div class="text-2xl font-bold text-indigo-600" id="gameCount">0</div>
        <div class="text-[10px] text-slate-500 uppercase font-bold">Games</div>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 space-y-4">

    <!-- Fetch Section -->
    <div id="fetchSection" class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
      <div class="flex gap-2 mb-4 border-b">
        <button id="tabCollection" onclick="switchTab('collection')" class="px-4 py-2 font-bold border-b-2 border-indigo-600 text-indigo-600">Collection</button>
        <button id="tabCsv" onclick="switchTab('csv')" class="px-4 py-2 font-bold text-slate-500 hover:text-slate-700">CSV Upload</button>
        <button id="tabPlays" onclick="switchTab('plays')" class="px-4 py-2 font-bold text-slate-500 hover:text-slate-700">Plays</button>
      </div>
      
      <!-- BGG Collection Tab -->
      <div id="collectionTab">
        <h2 class="text-lg font-bold mb-3">Load BGG Collection</h2>
        <div class="flex gap-2 mb-2">
          <input id="username" type="text" value="sportomax" placeholder="BGG username" class="flex-1 px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
          <button onclick="fetchCollection()" id="fetchBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg font-bold transition">Load</button>
        </div>
      </div>
      
      <!-- CSV Upload Tab -->
      <div id="csvTab" class="hidden">
        <h2 class="text-lg font-bold mb-3">Upload CSV File</h2>
        <p class="text-sm text-slate-600 mb-3">CSV must contain a date column (e.g., 'invdate') or other numeric data for charting.</p>
        <div class="flex gap-2 mb-3">
          <input type="file" id="csvFile" accept=".csv" class="flex-1 px-4 py-2 rounded-lg border border-slate-200 text-sm">
          <button onclick="loadCSV()" id="csvBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg font-bold transition">Load</button>
        </div>
      </div>

      <!-- BGG Plays Tab -->
      <div id="playsTab" class="hidden">
        <h2 class="text-lg font-bold mb-3">Load BGG Plays</h2>
        <div class="flex gap-2 mb-2">
          <input id="playsUsername" type="text" value="sportomax" placeholder="BGG username" class="flex-1 px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
          <button onclick="fetchPlays()" id="fetchPlaysBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg font-bold transition">Load</button>
        </div>
      </div>
    </div>

    <!-- Loading Section -->
    <div id="loadingSection" class="hidden">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
            <div class="flex items-center justify-center gap-3 mb-3">
                <i class="fa-solid fa-circle-notch fa-spin text-indigo-600 text-2xl"></i>
                <span class="font-bold text-slate-700" id="loadingStatus">Loading data...</span>
            </div>
            <div id="pageInfo" class="text-center text-xs text-slate-500 mt-2"></div>
        </div>
    </div>

    <!-- Chart Controls -->
    <div id="controlsSection" class="hidden bg-white rounded-2xl shadow-sm border border-slate-100 p-4 space-y-3">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label for="chartTypeSelect" class="text-xs font-bold text-slate-500">Chart Type</label>
                <select id="chartTypeSelect" onchange="generateChart()" class="w-full mt-1 px-3 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none text-sm bg-white font-bold">
                    <option value="bar">Bar Chart</option>
                    <option value="line">Line Graph</option>
                    <option value="pie">Pie Chart</option>
                </select>
            </div>
            <div>
                <label for="xAxisSelect" class="text-xs font-bold text-slate-500">Group By (X-Axis)</label>
                <select id="xAxisSelect" onchange="generateChart()" class="w-full mt-1 px-3 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none text-sm bg-white font-bold"></select>
            </div>
            <div>
                <label for="yAxisSelect" class="text-xs font-bold text-slate-500">Value (Y-Axis)</label>
                <select id="yAxisSelect" onchange="generateChart()" class="w-full mt-1 px-3 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none text-sm bg-white font-bold">
                  <option value="count">Count of Games</option>
                </select>
            </div>
        </div>
         <div id="dynamicControls" class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2 border-t border-slate-100">
            <div id="timeGroupSection" class="hidden">
                <label for="timeGroupSelect" class="text-xs font-bold text-slate-500">Group Dates By</label>
                <select id="timeGroupSelect" onchange="generateChart()" class="w-full mt-1 px-3 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none text-sm bg-white font-bold">
                    <option value="month">Month</option>
                    <option value="quarter">Quarter</option>
                    <option value="year">Year</option>
                </select>
            </div>
            <div id="dateRangeSection" class="hidden">
                <label for="dateRangeSelect" class="text-xs font-bold text-slate-500">Date Range</label>
                <select id="dateRangeSelect" onchange="generateChart()" class="w-full mt-1 px-3 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none text-sm bg-white font-bold">
                    <option value="all">All Time</option>
                    <option value="12">Last 12 Months</option>
                    <option value="24">Last 24 Months</option>
                    <option value="thisYear">This Year</option>
                </select>
            </div>
        </div>
        <div class="pt-2 border-t border-slate-100">
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" id="flipAxesCheckbox" onchange="generateChart()" class="form-checkbox text-indigo-600 rounded">
                <span class="text-sm font-semibold text-slate-700">Flip Axes (Horizontal Bars)</span>
            </label>
        </div>
    </div>

    <!-- Chart Canvas -->
    <div id="chartContainer" class="hidden bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
        <canvas id="myChart"></canvas>
    </div>

    <!-- Plays Chart Section (dedicated, shown only for plays data) -->
    <div id="playsChartSection" class="hidden bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
        <div class="flex flex-wrap items-center gap-3 mb-4">
            <span class="font-bold text-slate-700 text-sm" id="playsChartTitle">Plays Over Time</span>
            <!-- Month / Year toggle -->
            <div class="flex ml-auto rounded-lg overflow-hidden border border-slate-200">
                <button id="groupMonth" onclick="setPlaysGroup('month')" class="px-3 py-1.5 text-xs font-bold bg-indigo-600 text-white">Month</button>
                <button id="groupYear" onclick="setPlaysGroup('year')" class="px-3 py-1.5 text-xs font-bold text-slate-500 hover:bg-slate-50">Year</button>
            </div>
            <!-- IRL / BGA source toggles -->
            <label class="flex items-center gap-1.5 cursor-pointer select-none">
                <input type="checkbox" id="showIRL" checked onchange="generatePlaysChart()" class="rounded accent-indigo-600">
                <span class="text-xs font-bold text-indigo-600">IRL</span>
            </label>
            <label class="flex items-center gap-1.5 cursor-pointer select-none">
                <input type="checkbox" id="showBGA" checked onchange="generatePlaysChart()" class="rounded accent-teal-600">
                <span class="text-xs font-bold text-teal-600">BGA</span>
            </label>
        </div>
        <div id="playsChartWrap" style="position:relative; min-height:300px;">
            <canvas id="playsChart"></canvas>
        </div>
    </div>

  </main>

<script>
const API_BASE = '/api/bgg-helper';
const PLAY_FETCH_PARALLEL = 100;
let allGames = [];
let chart;
let rawPlays = [];
let playsGroup = 'month';
let playsChart = null;

function switchTab(tab) {
    document.getElementById('collectionTab').classList.toggle('hidden', tab !== 'collection');
    document.getElementById('csvTab').classList.toggle('hidden', tab !== 'csv');
    document.getElementById('playsTab').classList.toggle('hidden', tab !== 'plays');

    // Hide plays-specific chart when leaving plays tab
    if (tab !== 'plays') {
        document.getElementById('playsChartSection').classList.add('hidden');
    } else {
        // Hide collection/csv chart when entering plays tab
        document.getElementById('controlsSection').classList.add('hidden');
        document.getElementById('chartContainer').classList.add('hidden');
        if (rawPlays.length > 0) document.getElementById('playsChartSection').classList.remove('hidden');
    }

    ['Collection', 'Csv', 'Plays'].forEach(t => {
        const tabBtn = document.getElementById(`tab${t}`);
        if(tabBtn) {
            tabBtn.classList.toggle('border-indigo-600', t.toLowerCase() === tab);
            tabBtn.classList.toggle('text-indigo-600', t.toLowerCase() === tab);
            tabBtn.classList.toggle('text-slate-500', t.toLowerCase() !== tab);
        }
    });
}

function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const char = line[i];
    const nextChar = line[i + 1];
    if (char === '"') {
      if (inQuotes && nextChar === '"') { current += '"'; i++; }
      else { inQuotes = !inQuotes; }
    } else if (char === ',' && !inQuotes) {
      result.push(current.trim());
      current = '';
    } else {
      current += char;
    }
  }
  result.push(current.trim());
  return result;
}

async function loadCSV() {
  const fileInput = document.getElementById('csvFile');
  const file = fileInput.files[0];
  if (!file) { alert('Please select a CSV file'); return; }

  document.getElementById('fetchSection').classList.add('hidden');
  document.getElementById('loadingSection').classList.remove('hidden');

    const text = await file.text();
    const lines = text.trim().split('\n');
  const headers = parseCSVLine(lines[0]).map(h => h.replace(/^['"]|['"]$/g, ''));
  
  allGames = []; // Reset for CSV data
  for (let i = 1; i < lines.length; i++) {
    const values = parseCSVLine(lines[i]).map(v => v.replace(/^['"]|['"]$/g, ''));
    const row = {};
    headers.forEach((header, idx) => {
      row[header] = values[idx] || '';
    });
    allGames.push(row);
  }
  
  document.getElementById('loadingSection').classList.add('hidden');
  document.getElementById('controlsSection').classList.remove('hidden');
  document.getElementById('chartContainer').classList.remove('hidden');
  document.getElementById('gameCount').textContent = allGames.length;

  populateAxisOptions(headers);
  generateChart();
}


async function fetchCollection() {
    const username = document.getElementById('username').value.trim() || 'sportomax';
    document.getElementById('fetchSection').classList.add('hidden');
    document.getElementById('loadingSection').classList.remove('hidden');
    
    try {
        updateLoadingStatus('Fetching collection...');
        const collXml = await fetchWithRetry(`${API_BASE}?endpoint=collection&username=${encodeURIComponent(username)}&stats=1`);
        const collDoc = new DOMParser().parseFromString(collXml, 'text/xml');
        
        const collItems = Array.from(collDoc.querySelectorAll('item')).filter(item => {
            const statusNode = item.querySelector('status');
            return statusNode && parseInt(statusNode.getAttribute('own') || '0') === 1;
        });

        if (collItems.length === 0) {
            updateLoadingStatus('No owned games found.');
            return;
        }

        updateLoadingStatus(`Found ${collItems.length} games. Parsing data...`);
        allGames = collItems.map(item => ({
            name: item.querySelector('name')?.textContent || 'N/A',
            year: item.querySelector('yearpublished')?.textContent || 'N/A',
            rating: item.querySelector('stats rating')?.getAttribute('value') || '0',
            bggRating: item.querySelector('stats rating average')?.getAttribute('value') || '0',
            averageweight: item.querySelector('stats rating averageweight')?.getAttribute('value') || '0',
            minplayers: item.querySelector('stats')?.getAttribute('minplayers') || '0',
            maxplayers: item.querySelector('stats')?.getAttribute('maxplayers') || '0',
            playingtime: item.querySelector('stats')?.getAttribute('playingtime') || '0',
        }));

        document.getElementById('loadingSection').classList.add('hidden');
        document.getElementById('controlsSection').classList.remove('hidden');
        document.getElementById('chartContainer').classList.remove('hidden');
        document.getElementById('gameCount').textContent = allGames.length;
        
        const headers = Object.keys(allGames[0] || {});
        populateAxisOptions(headers);
        generateChart();

    } catch (err) {
        console.error(err);
        updateLoadingStatus(`Error: ${err.message}`);
    }
}

async function fetchPlays() {
    const username = document.getElementById('playsUsername').value.trim();
    if (!username) return;

    document.getElementById('fetchSection').classList.add('hidden');
    document.getElementById('loadingSection').classList.remove('hidden');
    document.getElementById('playsChartSection').classList.add('hidden');
    updateLoadingStatus('Fetching plays...');
    document.getElementById('pageInfo').textContent = '';

    rawPlays = await fetchAllPlays(username);

    document.getElementById('loadingSection').classList.add('hidden');
    document.getElementById('fetchSection').classList.remove('hidden');
    document.getElementById('gameCount').textContent = rawPlays.length.toLocaleString();

    if (rawPlays.length === 0) {
        updateLoadingStatus('No plays found.');
        return;
    }

    document.getElementById('playsChartTitle').textContent =
        `${rawPlays.length.toLocaleString()} plays · ${username}`;
    document.getElementById('playsChartSection').classList.remove('hidden');
    generatePlaysChart();
}

async function fetchAllPlays(username) {
    let currentPageStart = 1;
    let stopFound = false;
    const allPlays = [];

    while (!stopFound) {
        const batchPromises = [];
        for (let i = 0; i < PLAY_FETCH_PARALLEL; i++) {
            batchPromises.push(fetchPage(username, currentPageStart + i));
        }

        const results = await Promise.all(batchPromises);
        results.sort((a, b) => a.page - b.page);

        for (const res of results) {
            if (res && res.plays && res.plays.length > 0) {
                allPlays.push(...res.plays);
            } else {
                stopFound = true;
            }
        }

        if (!stopFound) {
            currentPageStart += PLAY_FETCH_PARALLEL;
            document.getElementById('pageInfo').textContent = `${allPlays.length} records`;
            await new Promise(r => setTimeout(r, 600));
        }
    }
    return allPlays;
}

async function fetchPage(username, page) {
    const url = `/api/bgg-helper?endpoint=plays&username=${encodeURIComponent(username)}&page=${page}`;
    try {
        const response = await fetch(url);
        const text = await response.text();
        const xml = new DOMParser().parseFromString(text, "text/xml");
        const playNodes = xml.getElementsByTagName('play');
        if (playNodes.length === 0) return { page, plays: [] };

        const pagePlays = [];
        for (let i = 0; i < playNodes.length; i++) {
            const node = playNodes[i];
            const item = node.getElementsByTagName('item')[0];
            const serializer = new XMLSerializer();
            pagePlays.push({
                id: node.getAttribute('id'),
                date: node.getAttribute('date'),
                quantity: node.getAttribute('quantity') || '1',
                length: node.getAttribute('length') || '0',
                incomplete: node.getAttribute('incomplete') || '0',
                nowinstats: node.getAttribute('nowinstats') || '0',
                location: node.getAttribute('location') || 'IRL',
                game: item ? item.getAttribute('name') : 'Unknown',
                gameId: item ? item.getAttribute('objectid') : null,
                rawXml: serializer.serializeToString(node)
            });
        }
        return { page, plays: pagePlays };
    } catch (e) { return { page, plays: [] }; }
}


function populateAxisOptions(headers) {
    const xAxisSelect = document.getElementById('xAxisSelect');
    const yAxisSelect = document.getElementById('yAxisSelect');
    xAxisSelect.innerHTML = '';
    
    // Clear previous options except for the default "Count" option
    const yOptions = Array.from(yAxisSelect.options);
    yOptions.forEach(opt => {
        if(opt.value !== 'count') yAxisSelect.remove(opt.index);
    });

    headers.forEach(header => {
        const option = new Option(header, header);
        xAxisSelect.add(option);
        
        // Add numeric fields to Y-axis options
        const isNumeric = allGames.every(g => g[header] === '' || g[header] === null || !isNaN(g[header]));
        if (isNumeric) {
            yAxisSelect.add(new Option(`Sum of ${header}`, `sum-${header}`));
            yAxisSelect.add(new Option(`Average of ${header}`, `avg-${header}`));
        }
    });

    // Automatically select a date field if available for X-axis
    const dateField = headers.find(h => h.toLowerCase().includes('date'));
    if (dateField) {
        xAxisSelect.value = dateField;
    }
    
    updateDynamicControls();
}

function updateDynamicControls() {
    const xAxisSelect = document.getElementById('xAxisSelect');
    const chartType = document.getElementById('chartTypeSelect').value;
    const selectedField = xAxisSelect.value;
    const isDate = selectedField && selectedField.toLowerCase().includes('date');
    
    document.getElementById('timeGroupSection').classList.toggle('hidden', !isDate);
    document.getElementById('dateRangeSection').classList.toggle('hidden', !isDate);
    
    const flipCheckbox = document.getElementById('flipAxesCheckbox');
    const flipCheckboxLabel = flipCheckbox.parentElement;
    if (chartType === 'bar') {
        flipCheckboxLabel.classList.remove('hidden');
    } else {
        flipCheckboxLabel.classList.add('hidden');
        flipCheckbox.checked = false;
    }
}


function generateChart() {
    const ctx = document.getElementById('myChart').getContext('2d');
    const chartType = document.getElementById('chartTypeSelect').value;
    const xAxisField = document.getElementById('xAxisSelect').value;
    const yAxisAction = document.getElementById('yAxisSelect').value;
    const timeGroup = document.getElementById('timeGroupSelect').value;
    const dateRange = document.getElementById('dateRangeSelect').value;
    const flipAxes = document.getElementById('flipAxesCheckbox').checked;
    
    updateDynamicControls();

    if (!xAxisField) return;

    let filteredGames = allGames; // Use the globally available allGames which can be collection or plays

    // Handle date range filtering if the X-axis is a date field
    if (xAxisField.toLowerCase().includes('date') && dateRange !== 'all') {
        const now = new Date();
        let startDate = new Date();

        if (dateRange === '12') {
            startDate.setMonth(now.getMonth() - 12);
        } else if (dateRange === '24') {
            startDate.setMonth(now.getMonth() - 24);
        } else if (dateRange === 'thisYear') {
            startDate = new Date(now.getFullYear(), 0, 1);
        }

        filteredGames = allGames.filter(game => {
            const gameDate = new Date(game[xAxisField]);
            return !isNaN(gameDate.getTime()) && gameDate >= startDate && gameDate <= now;
        });
    }

    let groupedData = {};

    filteredGames.forEach(game => {
        let key = game[xAxisField];
        if (key === null || key === undefined) return;
        key = String(key);

        // Handle date grouping for X-axis
        if (xAxisField.toLowerCase().includes('date')) {
            try {
                const date = new Date(key);
                if (isNaN(date.getTime())) return;

                const year = date.getUTCFullYear();
                const month = date.getUTCMonth();
                const quarter = Math.floor(month / 3) + 1;

                if (timeGroup === 'month') key = `${year}-${String(month + 1).padStart(2, '0')}`;
                else if (timeGroup === 'quarter') key = `${year}-Q${quarter}`;
                else if (timeGroup === 'year') key = year.toString();
                
            } catch(e) {
                console.warn(`Invalid date: ${key}`);
                return;
            }
        }

        if (!groupedData[key]) {
            groupedData[key] = { count: 0, sum: 0, values: [] };
        }

        groupedData[key].count++;
        if (yAxisAction.startsWith('sum-') || yAxisAction.startsWith('avg-')) {
            const yField = yAxisAction.split('-')[1];
            const value = parseFloat(game[yField]);
            if (!isNaN(value)) {
                groupedData[key].sum += value;
                groupedData[key].values.push(value);
            }
        }
    });

    const sortedLabels = Object.keys(groupedData).sort();
    
    const labels = sortedLabels;
    let data = [];

    // Determine the dataset label and data based on Y-axis action
    let datasetLabel = document.getElementById('yAxisSelect').selectedOptions[0].text;
    if (yAxisAction === 'count') {
        datasetLabel = 'Count of Plays'; // Adjusted label for play data
        data = sortedLabels.map(label => groupedData[label].count);
    } else if (yAxisAction.startsWith('sum-')) {
        data = sortedLabels.map(label => groupedData[label].sum);
    } else if (yAxisAction.startsWith('avg-')) {
        data = sortedLabels.map(label => {
            const group = groupedData[label];
            return group.count > 0 ? group.sum / group.count : 0;
        });
    }

    if (chart) {
        chart.destroy();
    }

    chart = new Chart(ctx, {
        type: chartType,
        data: {
            labels: labels,
            datasets: [{
                label: datasetLabel,
                data: data,
                backgroundColor: chartType === 'pie' ? generateColors(labels.length) : 'rgba(79, 70, 229, 0.5)',
                borderColor: 'rgba(79, 70, 229, 1)',
                borderWidth: 1,
                fill: chartType === 'line'
            }]
        },
        options: {
            indexAxis: (chartType === 'bar' && flipAxes) ? 'y' : 'x',
            scales: {
                y: {
                    beginAtZero: true,
                    display: chartType !== 'pie'
                },
                x: {
                    display: chartType !== 'pie'
                }
            },
            responsive: true,
            maintainAspectRatio: false
        }
    });
}

function isBGAPlay(play) {
    const loc = (play.location || '').toLowerCase();
    return loc.includes('bga') || loc.includes('boardgamearena') || loc.includes('board game arena');
}

function setPlaysGroup(group) {
    playsGroup = group;
    const activeClass = 'px-3 py-1.5 text-xs font-bold bg-indigo-600 text-white';
    const inactiveClass = 'px-3 py-1.5 text-xs font-bold text-slate-500 hover:bg-slate-50';
    document.getElementById('groupMonth').className = group === 'month' ? activeClass : inactiveClass;
    document.getElementById('groupYear').className = group === 'year' ? activeClass : inactiveClass;
    generatePlaysChart();
}

function formatPeriodLabel(key) {
    if (playsGroup === 'month' && /^\d{4}-\d{2}$/.test(key)) {
        const [year, month] = key.split('-');
        return new Date(parseInt(year), parseInt(month) - 1, 1)
            .toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
    }
    return key;
}

function generatePlaysChart() {
    const showIRL = document.getElementById('showIRL').checked;
    const showBGA = document.getElementById('showBGA').checked;

    const irlMap = {};
    const bgaMap = {};

    rawPlays.forEach(p => {
        if (!p.date) return;
        const d = new Date(p.date);
        if (isNaN(d.getTime())) return;
        const qty = parseInt(p.quantity) || 1;
        let key;
        if (playsGroup === 'month') {
            key = `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`;
        } else {
            key = String(d.getUTCFullYear());
        }
        if (isBGAPlay(p)) {
            bgaMap[key] = (bgaMap[key] || 0) + qty;
        } else {
            irlMap[key] = (irlMap[key] || 0) + qty;
        }
    });

    // All period keys, newest first (top to bottom on horizontal bar)
    const allKeys = [...new Set([...Object.keys(irlMap), ...Object.keys(bgaMap)])]
        .sort().reverse();
    const displayLabels = allKeys.map(formatPeriodLabel);

    const datasets = [];
    if (showIRL) datasets.push({
        label: 'IRL',
        data: allKeys.map(k => irlMap[k] || 0),
        backgroundColor: 'rgba(79, 70, 229, 0.75)',
        borderColor: 'rgba(79, 70, 229, 1)',
        borderWidth: 1,
        borderRadius: 3,
    });
    if (showBGA) datasets.push({
        label: 'BGA',
        data: allKeys.map(k => bgaMap[k] || 0),
        backgroundColor: 'rgba(13, 148, 136, 0.75)',
        borderColor: 'rgba(13, 148, 136, 1)',
        borderWidth: 1,
        borderRadius: 3,
    });

    // Scale chart height to number of rows
    const rowHeight = playsGroup === 'year' ? 36 : 26;
    const chartHeight = Math.max(200, allKeys.length * rowHeight + 60);
    document.getElementById('playsChartWrap').style.minHeight = chartHeight + 'px';

    if (playsChart) playsChart.destroy();
    const ctx = document.getElementById('playsChart').getContext('2d');
    playsChart = new Chart(ctx, {
        type: 'bar',
        data: { labels: displayLabels, datasets },
        options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: {
                    stacked: true,
                    beginAtZero: true,
                    grid: { color: 'rgba(0,0,0,0.05)' },
                    title: { display: true, text: 'Plays', font: { weight: 'bold', size: 11 } }
                },
                y: {
                    stacked: true,
                    grid: { display: false },
                    ticks: { font: { size: playsGroup === 'year' ? 13 : 11 } }
                }
            },
            plugins: {
                legend: { display: datasets.length > 1, position: 'top' },
                tooltip: {
                    callbacks: {
                        footer: (items) => {
                            if (items.length < 2) return '';
                            const total = items.reduce((s, i) => s + i.raw, 0);
                            return `Total: ${total}`;
                        }
                    }
                }
            }
        }
    });
}

function generateColors(numColors) {
    const colors = [];
    for (let i = 0; i < numColors; i++) {
        const hue = (360 / numColors) * i;
        colors.push(`hsla(${hue}, 70%, 60%, 0.8)`);
    }
    return colors;
}

function updateLoadingStatus(status) {
    document.getElementById('loadingStatus').textContent = status;
}

async function fetchWithRetry(url, maxRetries = 3) {
  for (let attempt = 0; attempt < maxRetries; attempt++) {
    try {
      const res = await fetch(url);
      if (res.status === 202) { 
                await new Promise(r => setTimeout(r, 2000 + attempt * 500)); 
        continue; 
      }
            if (res.ok) return await res.text();

            // Retry transient upstream/proxy failures with backoff.
            if ([429, 500, 502, 503, 504].includes(res.status)) {
                if (attempt === maxRetries - 1) {
                    throw new Error(`HTTP ${res.status} after ${maxRetries} attempts`);
                }
                await new Promise(r => setTimeout(r, 1200 + attempt * 800));
                continue;
            }

            throw new Error(`HTTP ${res.status}`);
    } catch (e) { 
      if (attempt === maxRetries - 1) throw e;
            await new Promise(r => setTimeout(r, 1200 + attempt * 800));
    }
  }
  throw new Error('Failed to fetch after multiple retries.');
}

    switchTab('collection');
    updateDynamicControls();
});
