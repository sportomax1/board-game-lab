<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Games - BGG</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🎮</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        body {
            padding-top: max(0px, env(safe-area-inset-top));
            padding-bottom: max(0px, env(safe-area-inset-bottom));
            padding-left: max(0px, env(safe-area-inset-left));
            padding-right: max(0px, env(safe-area-inset-right));
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }
        .screen {
            width: 100%;
            max-width: 420px;
            display: none;
            flex-direction: column;
            gap: 20px;
        }
        .screen.active {
            display: flex;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        h1 {
            margin: 0 0 8px 0;
            font-size: 32px;
            color: white;
            text-align: center;
            font-weight: 700;
        }
        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            margin-bottom: 24px;
        }
        .option-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }
        .option-label {
            font-weight: 600;
            color: #333;
            font-size: 14px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .radio-option {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
        }
        .radio-option:active {
            transform: scale(0.98);
        }
        .radio-option.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }
        .radio-option input[type="radio"] {
            margin-right: 12px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }
        .option-text {
            flex: 1;
        }
        .option-title {
            font-weight: 600;
            color: #333;
            font-size: 16px;
        }
        .option-desc {
            font-size: 13px;
            color: #999;
            margin-top: 2px;
        }
        input[type="text"],
        input[type="search"] {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus,
        input[type="search"]:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 18px;
            font-weight: 700;
            margin-top: 12px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        .btn-search {
            background: #f0f0f0;
            color: #333;
            margin-top: 8px;
            font-weight: 600;
        }
        .btn-search:active {
            background: #e0e0e0;
        }
        .game-list {
            display: grid;
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 8px;
        }
        .game-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background: #f9fafb;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .game-item:active {
            background: #e5e7eb;
            transform: scale(0.98);
        }
        .game-item.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }
        .game-item img {
            width: 50px;
            height: 50px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .game-item-info {
            flex: 1;
            min-width: 0;
        }
        .game-item-name {
            font-weight: 600;
            color: #333;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .selected-game-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
        }
        .selected-game-card img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
        }
        .selected-game-card-info {
            flex: 1;
        }
        .selected-game-card-label {
            font-size: 11px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .selected-game-card-name {
            font-weight: 700;
            font-size: 16px;
            margin-top: 2px;
        }
        .board-container {
            background: white;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            color: #333;
        }
        .board-header h2 {
            margin: 0;
            font-size: 20px;
        }
        .board-status {
            text-align: center;
            font-weight: 600;
            font-size: 14px;
        }
        .board-grid {
            display: grid;
            gap: 4px;
            margin-bottom: 16px;
            background: #f0f0f0;
            padding: 8px;
            border-radius: 12px;
        }
        .cell {
            aspect-ratio: 1;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            min-height: 40px;
            transition: transform 0.1s;
        }
        .cell:active {
            transform: scale(0.95);
        }
        .cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .player-turn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #f9fafb;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .player-turn img {
            width: 50px;
            height: 50px;
            border-radius: 6px;
            object-fit: cover;
        }
        .player-turn-info {
            flex: 1;
        }
        .player-turn-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
        }
        .player-turn-name {
            font-weight: 700;
            font-size: 16px;
            color: #333;
        }
        .btn-new-game {
            background: #10b981;
        }
        .btn-back {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }
        .btn-back:active {
            background: #f0f4ff;
        }
        .empty-message {
            text-align: center;
            color: #999;
            padding: 20px;
            font-size: 14px;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .screen.active {
            animation: fadeIn 0.2s ease-in;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- SCREEN 1: API SELECTION -->
        <div id="apiScreen" class="screen active">
            <h1>🎮 Games</h1>
            <p class="subtitle">Choose your game source</p>
            <div class="card">
                <div class="option-group">
                    <label class="option-label">Game Source</label>
                    <label class="radio-option selected" onclick="selectAPI('collection')">
                        <input type="radio" name="apiSource" value="collection" checked>
                        <div class="option-text">
                            <div class="option-title">📚 My Collection</div>
                            <div class="option-desc">Games from sportomax's BGG collection</div>
                        </div>
                    </label>
                    <label class="radio-option" onclick="selectAPI('search')">
                        <input type="radio" name="apiSource" value="search">
                        <div class="option-text">
                            <div class="option-title">🔍 Search All</div>
                            <div class="option-desc">Search entire BoardGameGeek database</div>
                        </div>
                    </label>
                </div>
                <button class="btn-primary" onclick="loadGames()">▶️ Continue</button>
            </div>
        </div>

        <!-- SCREEN 2: GAME SELECTION -->
        <div id="gameScreen" class="screen">
            <h1>🎮 Games</h1>
            <p class="subtitle">Select your games</p>
            <div class="card">
                <!-- Player 1 -->
                <div class="option-group">
                    <div class="option-label">🔴 Player 1</div>
                    <input type="search" id="search1" placeholder="Search game..." onkeyup="filterGames(1)">
                    <button class="btn-search" onclick="searchGames(1)">🔍 Search</button>
                    <div id="list1" class="game-list"></div>
                    <div id="player1Selected" class="selected-game-card" style="display: none;">
                        <img id="p1Img" src="">
                        <div class="selected-game-card-info">
                            <div class="selected-game-card-label">Selected</div>
                            <div class="selected-game-card-name" id="p1Name"></div>
                        </div>
                        <button class="btn-search" style="margin-left:8px;" onclick="openThumbPicker(1)">Choose Thumbnail</button>
                    </div>
                </div>

                <!-- Player 2 -->
                <div class="option-group">
                    <div class="option-label">🟡 Player 2</div>
                    <input type="search" id="search2" placeholder="Search game..." onkeyup="filterGames(2)">
                    <button class="btn-search" onclick="searchGames(2)">🔍 Search</button>
                    <div id="list2" class="game-list"></div>
                    <div id="player2Selected" class="selected-game-card" style="display: none;">
                        <img id="p2Img" src="">
                        <div class="selected-game-card-info">
                            <div class="selected-game-card-label">Selected</div>
                            <div class="selected-game-card-name" id="p2Name"></div>
                        </div>
                        <button class="btn-search" style="margin-left:8px;" onclick="openThumbPicker(2)">Choose Thumbnail</button>
                    </div>
                </div>

                <button class="btn-primary" id="playBtn" onclick="startPlay()" style="display: none;">▶️ Play</button>
                <button class="btn-back" onclick="backToAPI()">← Back</button>
            </div>
        </div>

        <!-- SCREEN 3: GAME PLAY -->
        <div id="playScreen" class="screen">
            <h1 id="gameTitle">🎮</h1>
            <div class="board-container">
                <div class="board-header">
                    <div>Game</div>
                    <div class="board-status" id="status">In Progress</div>
                </div>
                <div class="player-turn" id="playerTurn"></div>
                <div id="boardGrid" class="board-grid"></div>
                <div style="margin-top:8px; display:flex; gap:8px; justify-content:center;">
                    <button class="btn-search" onclick="openThumbPicker(1)">Choose P1 Thumbnail</button>
                    <button class="btn-search" onclick="openThumbPicker(2)">Choose P2 Thumbnail</button>
                </div>
                <button class="btn-new-game" onclick="resetGame()">🔄 New Game</button>
                <button class="btn-back" onclick="backToGames()">← Back to Games</button>
            </div>
        </div>
    </div>

    <script>
    <!-- Thumbnail Picker Modal -->
    <div id="thumbModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; z-index:1000;">
        <div style="background:white; padding:16px; border-radius:8px; max-width:360px; width:90%; text-align:center;">
            <h3 style="margin:0 0 8px 0">Choose Thumbnail</h3>
            <div id="thumbOptions" style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:12px;"></div>
            <div style="display:flex; gap:8px; justify-content:center;">
                <button onclick="closeThumbPicker()" class="btn-back">Cancel</button>
            </div>
        </div>
    </div>
        let apiType = 'collection';
        let allGames = [];
        let filteredGames1 = [];
        let filteredGames2 = [];
        let player1 = null;
        let player2 = null;
        let currentPlayer = 1;
        let gameActive = true;
        let board = [];
        let selectedGame = null;

        function selectAPI(type) {
            apiType = type;
            document.querySelectorAll('.radio-option').forEach(el => el.classList.remove('selected'));
            event.target.closest('.radio-option').classList.add('selected');
        }

        async function loadGames() {
            try {
                const apiScreen = document.getElementById('apiScreen');
                const gameScreen = document.getElementById('gameScreen');
                apiScreen.classList.remove('active');
                gameScreen.classList.add('active');

                if (apiType === 'collection') {
                    const res = await fetch('/api/bgg-helper?endpoint=collection&username=sportomax&own=1&stats=1');
                    const xml = await res.text();
                    const parser = new DOMParser().parseFromString(xml, 'text/xml');
                    allGames = Array.from(parser.querySelectorAll('item')).map(item => ({
                        id: item.getAttribute('objectid'),
                        name: item.querySelector('name')?.textContent || 'Unknown',
                        image: item.querySelector('thumbnail')?.textContent || item.querySelector('image')?.textContent || ''
                    })).filter(g => g.image);
                } else {
                    allGames = [];
                }
                displayGames(1);
                displayGames(2);
            } catch (err) {
                alert('Error loading games: ' + err.message);
                console.error(err);
            }
        }

        async function searchGames(player) {
            const query = (player === 1 ? document.getElementById('search1') : document.getElementById('search2')).value.trim();
            if (!query) return;

            try {
                const res = await fetch('/api/bgg-helper?endpoint=search&query=' + encodeURIComponent(query));
                const xml = await res.text();
                const parser = new DOMParser().parseFromString(xml, 'text/xml');
                const items = Array.from(parser.querySelectorAll('item[id]'));
                const results = [];
                let count = 0;

                for (const item of items) {
                    if (count >= 20) break;
                    const id = item.getAttribute('id');
                    const nameEls = item.querySelectorAll('name');
                    const name = nameEls.length > 0 ? (nameEls[0].getAttribute('value') || nameEls[0].textContent || 'Unknown') : 'Unknown';

                    try {
                        const thingRes = await fetch('/api/bgg-helper?endpoint=thing&id=' + id);
                        const thingXml = await thingRes.text();
                        const thingParser = new DOMParser().parseFromString(thingXml, 'text/xml');
                        const image = thingParser.querySelector('thumbnail')?.textContent || thingParser.querySelector('image')?.textContent || '';
                        if (image) {
                            results.push({ id, name, image });
                            count++;
                        }
                    } catch (e) {}
                }

                if (player === 1) {
                    filteredGames1 = results;
                    displayGames(1);
                } else {
                    filteredGames2 = results;
                    displayGames(2);
                }
            } catch (err) {
                console.error('Search error:', err);
            }
        }

        function filterGames(player) {
            const query = (player === 1 ? document.getElementById('search1') : document.getElementById('search2')).value.toLowerCase();
            const games = apiType === 'collection' ? allGames : (player === 1 ? filteredGames1 : filteredGames2);
            const filtered = games.filter(g => g.name.toLowerCase().includes(query));
            
            const list = document.getElementById(player === 1 ? 'list1' : 'list2');
            list.innerHTML = filtered.length === 0 ? '<div class="empty-message">No games found</div>' : '';
            filtered.forEach(game => {
                const div = document.createElement('div');
                div.className = 'game-item';
                div.innerHTML = '<img src="' + game.image + '" onerror="this.src=\'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect fill=%22%23ddd%22 width=%22100%22 height=%22100%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 font-size=%2230%22 text-anchor=%22middle%22 dy=%22.3em%22%3E?%3C/text%3E%3C/svg%3E\'"><div class="game-item-info"><div class="game-item-name">' + game.name + '</div></div>';
                div.onclick = () => selectGame(player, game);
                list.appendChild(div);
            });
        }

        function displayGames(player) {
            filterGames(player);
        }

        function selectGame(player, game) {
            if (player === 1) {
                player1 = game;
                document.getElementById('player1Selected').style.display = 'flex';
                document.getElementById('p1Img').src = game.image;
                document.getElementById('p1Name').textContent = game.name;
                document.getElementById('list1').classList.add('hidden');
            } else {
                player2 = game;
                document.getElementById('player2Selected').style.display = 'flex';
                document.getElementById('p2Img').src = game.image;
                document.getElementById('p2Name').textContent = game.name;
                document.getElementById('list2').classList.add('hidden');
            }
            if (player1 && player2) {
                document.getElementById('playBtn').style.display = 'flex';
            }
        }

        function openThumbPicker(player){
            const modal = document.getElementById('thumbModal');
            const container = document.getElementById('thumbOptions');
            container.innerHTML = '';
            const g = player===1 ? player1 : player2;
            // option: game's thumbnail if available
            if (g && g.image) {
                const img = document.createElement('img'); img.src = g.image; img.style.width='64px'; img.style.height='64px'; img.style.objectFit='contain'; img.style.cursor='pointer'; img.style.borderRadius='8px';
                img.onclick = ()=>{ pickThumbnailForPlayer(player, g.image); };
                container.appendChild(img);
            }
            // simple colored discs as SVG data URLs
            const redDisc = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><circle cx="32" cy="32" r="28" fill="%23e3342f"/></svg>';
            const yellowDisc = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><circle cx="32" cy="32" r="28" fill="%23f6e05e"/></svg>';
            const blueDisc = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><circle cx="32" cy="32" r="28" fill="%233b82f6"/></svg>';
            [redDisc,yellowDisc,blueDisc].forEach(u=>{
                const i = document.createElement('img'); i.src = u; i.style.width='64px'; i.style.height='64px'; i.style.cursor='pointer'; i.style.borderRadius='8px'; i.onclick = ()=>{ pickThumbnailForPlayer(player, u); };
                container.appendChild(i);
            });
            modal.style.display='flex';
            modal.dataset.player = String(player);
        }

        function closeThumbPicker(){ document.getElementById('thumbModal').style.display='none'; }

        function pickThumbnailForPlayer(player, url){
            if (player===1 && player1) { player1.image = url; document.getElementById('p1Img').src = url; }
            if (player===2 && player2) { player2.image = url; document.getElementById('p2Img').src = url; }
            // if board exists, re-render to reflect new images
            if (selectedGame === 'connectfour') renderBoard();
            closeThumbPicker();
        }

        function startPlay() {
            if (!player1 || !player2) return;
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('playScreen').classList.add('active');
            document.getElementById('gameTitle').textContent = '🎲 Connect Four';
            selectedGame = 'connectfour';
            initBoard(7, 6);
            renderBoard();
            updateTurn();
        }

        function initBoard(cols, rows) {
            board = [];
            for (let i = 0; i < rows; i++) {
                board[i] = [];
                for (let j = 0; j < cols; j++) {
                    board[i][j] = 0;
                }
            }
            currentPlayer = 1;
            gameActive = true;
            document.getElementById('status').textContent = 'In Progress';
        }

        function renderBoard() {
            const grid = document.getElementById('boardGrid');
            grid.innerHTML = '';
            const cols = board[0].length;
            const rows = board.length;
            grid.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const piece = board[r][c];
                    if (piece === 0) {
                        cell.style.cursor = 'pointer';
                        cell.onclick = () => dropPiece(c);
                    } else {
                        const img = document.createElement('img');
                        img.src = piece === 1 ? player1.image : player2.image;
                        cell.appendChild(img);
                    }
                    grid.appendChild(cell);
                }
            }
        }

        function dropPiece(col) {
            if (!gameActive) return;
            for (let r = board.length - 1; r >= 0; r--) {
                if (board[r][col] === 0) {
                    board[r][col] = currentPlayer;
                    renderBoard();
                    if (checkWin(r, col)) {
                        gameActive = false;
                        document.getElementById('status').textContent = (currentPlayer === 1 ? player1.name : player2.name) + ' Wins!';
                    } else if (checkFull()) {
                        gameActive = false;
                        document.getElementById('status').textContent = 'Draw!';
                    } else {
                        currentPlayer = currentPlayer === 1 ? 2 : 1;
                        updateTurn();
                    }
                    return;
                }
            }
        }

        function checkWin(r, c) {
            const directions = [[0,1], [1,0], [1,1], [1,-1]];
            for (let [dr, dc] of directions) {
                let count = 1;
                for (let i = 1; i < 4; i++) {
                    const nr = r + dr * i, nc = c + dc * i;
                    if (nr >= 0 && nr < board.length && nc >= 0 && nc < board[0].length && board[nr][nc] === currentPlayer) count++;
                    else break;
                }
                for (let i = 1; i < 4; i++) {
                    const nr = r - dr * i, nc = c - dc * i;
                    if (nr >= 0 && nr < board.length && nc >= 0 && nc < board[0].length && board[nr][nc] === currentPlayer) count++;
                    else break;
                }
                if (count >= 4) return true;
            }
            return false;
        }

        function checkFull() {
            return board[0].every(cell => cell !== 0);
        }

        function updateTurn() {
            const player = currentPlayer === 1 ? player1 : player2;
            document.getElementById('playerTurn').innerHTML = 
                '<img src="' + player.image + '">' +
                '<div class="player-turn-info">' +
                  '<div class="player-turn-label">' + (currentPlayer === 1 ? '🔴' : '🟡') + ' Player ' + currentPlayer + '</div>' +
                  '<div class="player-turn-name">' + player.name + '</div>' +
                '</div>';
        }

        function resetGame() {
            initBoard(7, 6);
            renderBoard();
            updateTurn();
        }

        function backToGames() {
            document.getElementById('playScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.add('active');
        }

        function backToAPI() {
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('apiScreen').classList.add('active');
            player1 = null;
            player2 = null;
            document.getElementById('playBtn').style.display = 'none';
        }
    </script>
</body>
</html>
