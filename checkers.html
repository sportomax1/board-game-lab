<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>BGG Checkers</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>⚫</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #8e44ad 0%, #9b59b6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow: hidden;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 600px;
        }

        .screen.active {
            display: block;
        }

        .setup-card, .game-card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 2rem;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #9b59b6;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #8e44ad 0%, #9b59b6 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(142, 68, 173, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(142, 68, 173, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .player-info {
            text-align: center;
        }

        .player-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .pieces-count {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .player-red .pieces-count {
            color: #e74c3c;
        }

        .player-black .pieces-count {
            color: #2c3e50;
        }

        .current-turn {
            padding: 0.5rem 1rem;
            background: #ecf0f1;
            border-radius: 8px;
            font-weight: 700;
            color: #2c3e50;
            text-align: center;
        }

        .board {
            background: #34495e;
            border-radius: 12px;
            padding: 0.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .board-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 0;
        }

        .cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }

        .cell.light {
            background: #ecf0f1;
        }

        .cell.dark {
            background: #95a5a6;
        }

        .cell.selected {
            background: #f39c12;
        }

        .cell.valid-move {
            background: #2ecc71;
            cursor: pointer;
        }

        .piece {
            width: 85%;
            height: 85%;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid transparent;
            transition: transform 0.2s;
            position: relative;
        }

        .piece.red {
            border-color: #e74c3c;
        }

        .piece.black {
            border-color: #2c3e50;
        }

        .piece.king {
            border-width: 5px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }

        .piece.king::after {
            content: '👑';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            z-index: 10;
        }

        .piece img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cell:hover .piece {
            transform: scale(1.1);
        }

        .game-controls {
            display: flex;
            gap: 0.5rem;
        }

        .game-controls button {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .game-controls button:active {
            transform: scale(0.95);
        }

        .new-game-btn {
            background: #2ecc71;
            color: white;
        }

        .settings-btn {
            background: #95a5a6;
            color: white;
        }

        .winner-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .winner-modal.active {
            display: flex;
        }

        .winner-content {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            max-width: 400px;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .winner-title {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <!-- Setup Screen -->
    <div id="setupScreen" class="screen active">
        <div class="setup-card">
            <h1>⚫ Checkers</h1>
            <p class="subtitle">Play checkers with BGG collection thumbnails!</p>
            
            <div class="form-group">
                <label for="username1">Red Player BGG Username</label>
                <input type="text" id="username1" value="sportomax" placeholder="Enter username">
            </div>

            <div class="form-group">
                <label for="username2">Black Player BGG Username</label>
                <input type="text" id="username2" value="sportomax" placeholder="Enter username">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="includeExpansions">
                <label for="includeExpansions" style="margin: 0;">Include expansions</label>
            </div>

            <div style="margin-top: 1.5rem;">
                <button class="btn" onclick="startGame()">Start Game</button>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="screen">
        <div class="game-card">
            <div class="game-header">
                <div class="player-info player-red">
                    <div class="player-name" id="redPlayerName">Red</div>
                    <div class="pieces-count" id="redCount">12</div>
                </div>
                <div class="current-turn" id="turnIndicator">Red's Turn</div>
                <div class="player-info player-black">
                    <div class="player-name" id="blackPlayerName">Black</div>
                    <div class="pieces-count" id="blackCount">12</div>
                </div>
            </div>

            <div class="board">
                <div class="board-grid" id="board"></div>
            </div>

            <div class="game-controls">
                <button class="new-game-btn" onclick="newGame()">New Game</button>
                <button class="settings-btn" onclick="backToSettings()">Settings</button>
            </div>
        </div>
    </div>

    <!-- Winner Modal -->
    <div id="winnerModal" class="winner-modal">
        <div class="winner-content">
            <div class="winner-title" id="winnerText">🎉 Winner!</div>
            <div style="margin-top: 1.5rem;">
                <button class="btn" onclick="newGame()">Play Again</button>
            </div>
        </div>
    </div>

    <script>
        const BOARD_SIZE = 8;
        let board = [];
        let currentPlayer = 'red';
        let selectedPiece = null;
        let validMoves = [];
        let redGames = [];
        let blackGames = [];
        let gameActive = false;

        async function startGame() {
            const username1 = document.getElementById('username1').value.trim() || 'sportomax';
            const username2 = document.getElementById('username2').value.trim() || 'sportomax';
            const includeExpansions = document.getElementById('includeExpansions').checked;

            try {
                const subtype = includeExpansions ? '' : '&subtype=boardgame';
                
                const [res1, res2] = await Promise.all([
                    fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username1)}&own=1${subtype}&stats=1`),
                    fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username2)}&own=1${subtype}&stats=1`)
                ]);

                const [xml1, xml2] = await Promise.all([res1.text(), res2.text()]);

                const parser = new DOMParser();
                const doc1 = parser.parseFromString(xml1, 'text/xml');
                const doc2 = parser.parseFromString(xml2, 'text/xml');

                redGames = Array.from(doc1.querySelectorAll('item')).map(item => ({
                    name: item.querySelector('name').textContent,
                    thumbnail: item.querySelector('thumbnail')?.textContent || ''
                })).filter(g => g.thumbnail);

                blackGames = Array.from(doc2.querySelectorAll('item')).map(item => ({
                    name: item.querySelector('name').textContent,
                    thumbnail: item.querySelector('thumbnail')?.textContent || ''
                })).filter(g => g.thumbnail);

                if (redGames.length < 12 || blackGames.length < 12) {
                    alert('Not enough games with thumbnails. Need at least 12 per player.');
                    return;
                }

                document.getElementById('redPlayerName').textContent = username1;
                document.getElementById('blackPlayerName').textContent = username2;

                document.getElementById('setupScreen').classList.remove('active');
                document.getElementById('gameScreen').classList.add('active');

                newGame();
            } catch (error) {
                alert('Error loading collections: ' + error.message);
            }
        }

        function newGame() {
            currentPlayer = 'red';
            selectedPiece = null;
            validMoves = [];
            gameActive = true;
            document.getElementById('winnerModal').classList.remove('active');

            // Initialize board
            board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));

            // Place red pieces (top)
            const selectedRed = [...redGames].sort(() => Math.random() - 0.5).slice(0, 12);
            let redIndex = 0;
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    if ((row + col) % 2 === 1) {
                        board[row][col] = {
                            color: 'red',
                            king: false,
                            game: selectedRed[redIndex++]
                        };
                    }
                }
            }

            // Place black pieces (bottom)
            const selectedBlack = [...blackGames].sort(() => Math.random() - 0.5).slice(0, 12);
            let blackIndex = 0;
            for (let row = 5; row < 8; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    if ((row + col) % 2 === 1) {
                        board[row][col] = {
                            color: 'black',
                            king: false,
                            game: selectedBlack[blackIndex++]
                        };
                    }
                }
            }

            renderBoard();
            updateStatus();
        }

        function renderBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';

            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    const cell = document.createElement('div');
                    cell.className = `cell ${(row + col) % 2 === 0 ? 'light' : 'dark'}`;
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    
                    const piece = board[row][col];
                    if (piece) {
                        const pieceDiv = document.createElement('div');
                        pieceDiv.className = `piece ${piece.color} ${piece.king ? 'king' : ''}`;
                        
                        const img = document.createElement('img');
                        img.src = piece.game.thumbnail;
                        pieceDiv.appendChild(img);
                        
                        cell.appendChild(pieceDiv);
                    }

                    cell.onclick = () => handleCellClick(row, col);
                    boardElement.appendChild(cell);
                }
            }

            // Highlight selected piece and valid moves
            if (selectedPiece) {
                const selectedCell = document.querySelector(`[data-row="${selectedPiece.row}"][data-col="${selectedPiece.col}"]`);
                selectedCell.classList.add('selected');

                validMoves.forEach(move => {
                    const moveCell = document.querySelector(`[data-row="${move.row}"][data-col="${move.col}"]`);
                    moveCell.classList.add('valid-move');
                });
            }
        }

        function handleCellClick(row, col) {
            if (!gameActive) return;

            const piece = board[row][col];

            // If clicking a valid move
            const move = validMoves.find(m => m.row === row && m.col === col);
            if (move) {
                movePiece(selectedPiece, move);
                return;
            }

            // If clicking own piece
            if (piece && piece.color === currentPlayer) {
                selectedPiece = { row, col };
                validMoves = getValidMoves(row, col);
                renderBoard();
            } else {
                selectedPiece = null;
                validMoves = [];
                renderBoard();
            }
        }

        function getValidMoves(row, col) {
            const piece = board[row][col];
            if (!piece) return [];

            const moves = [];
            const directions = piece.king 
                ? [[-1, -1], [-1, 1], [1, -1], [1, 1]]
                : piece.color === 'red' 
                    ? [[1, -1], [1, 1]]
                    : [[-1, -1], [-1, 1]];

            // Regular moves
            directions.forEach(([dr, dc]) => {
                const newRow = row + dr;
                const newCol = col + dc;
                if (isValidPosition(newRow, newCol) && !board[newRow][newCol]) {
                    moves.push({ row: newRow, col: newCol, jump: false });
                }

                // Jump moves
                const jumpRow = row + dr * 2;
                const jumpCol = col + dc * 2;
                if (isValidPosition(jumpRow, jumpCol) && !board[jumpRow][jumpCol]) {
                    const middlePiece = board[newRow][newCol];
                    if (middlePiece && middlePiece.color !== piece.color) {
                        moves.push({ row: jumpRow, col: jumpCol, jump: true, jumpedRow: newRow, jumpedCol: newCol });
                    }
                }
            });

            return moves;
        }

        function isValidPosition(row, col) {
            return row >= 0 && row < BOARD_SIZE && col >= 0 && col < BOARD_SIZE;
        }

        function movePiece(from, to) {
            const piece = board[from.row][from.col];
            board[to.row][to.col] = piece;
            board[from.row][from.col] = null;

            // Handle jump
            if (to.jump) {
                board[to.jumpedRow][to.jumpedCol] = null;
            }

            // Check for king promotion
            if (piece.color === 'red' && to.row === BOARD_SIZE - 1) {
                piece.king = true;
            } else if (piece.color === 'black' && to.row === 0) {
                piece.king = true;
            }

            selectedPiece = null;
            validMoves = [];

            // Switch player
            currentPlayer = currentPlayer === 'red' ? 'black' : 'red';

            renderBoard();
            updateStatus();
            checkWinner();
        }

        function updateStatus() {
            let redCount = 0;
            let blackCount = 0;

            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    const piece = board[row][col];
                    if (piece) {
                        if (piece.color === 'red') redCount++;
                        else blackCount++;
                    }
                }
            }

            document.getElementById('redCount').textContent = redCount;
            document.getElementById('blackCount').textContent = blackCount;

            const playerName = currentPlayer === 'red' 
                ? document.getElementById('redPlayerName').textContent 
                : document.getElementById('blackPlayerName').textContent;
            document.getElementById('turnIndicator').textContent = `${playerName}'s Turn`;
            document.getElementById('turnIndicator').style.background = 
                currentPlayer === 'red' ? '#fee' : '#f5f5f5';
        }

        function checkWinner() {
            let redCount = 0;
            let blackCount = 0;

            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    const piece = board[row][col];
                    if (piece) {
                        if (piece.color === 'red') redCount++;
                        else blackCount++;
                    }
                }
            }

            if (redCount === 0) {
                gameActive = false;
                showWinner('black');
            } else if (blackCount === 0) {
                gameActive = false;
                showWinner('red');
            }
        }

        function showWinner(winner) {
            const playerName = winner === 'red' 
                ? document.getElementById('redPlayerName').textContent 
                : document.getElementById('blackPlayerName').textContent;
            
            document.getElementById('winnerText').textContent = `🎉 ${playerName} Wins!`;
            document.getElementById('winnerModal').classList.add('active');
        }

        function backToSettings() {
            if (confirm('Are you sure you want to go back to settings? Current game will be lost.')) {
                document.getElementById('gameScreen').classList.remove('active');
                document.getElementById('setupScreen').classList.add('active');
            }
        }
    </script>
    <!-- Vercel Web Analytics -->
    <script type="module" src="analytics-init.js"></script>
</body>
</html>
