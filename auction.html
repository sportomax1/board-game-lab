<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>BGG Auction Browser</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔨</text></svg>">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    :root {
      --bg:#0a0f1e; --surface:#111827; --card:#1a2235; --border:#1e2d45;
      --text:#e2e8f0; --muted:#64748b;
      --accent:#f59e0b; --accent2:#d97706;
      --green:#10b981; --blue:#3b82f6; --purple:#8b5cf6; --red:#ef4444; --orange:#f97316;
    }

    body {
      font-family:'Plus Jakarta Sans',sans-serif;
      background:var(--bg); color:var(--text);
      min-height:100dvh;
      padding-bottom:max(1.5rem,env(safe-area-inset-bottom));
    }

    a { color:inherit; text-decoration:none; }

    /* ── Header ─────────────────────────────────────── */
    header {
      position:sticky; top:0; z-index:40;
      background:rgba(10,15,30,0.92);
      backdrop-filter:blur(16px);
      border-bottom:1px solid var(--border);
      padding:max(0.75rem,env(safe-area-inset-top)) 1rem 0.75rem;
    }
    .header-inner {
      max-width:1400px; margin:0 auto;
      display:flex; align-items:center; gap:0.75rem; flex-wrap:wrap;
    }
    .brand { display:flex; align-items:center; gap:0.6rem; flex-shrink:0; }
    .brand-icon {
      width:38px; height:38px; border-radius:10px;
      background:linear-gradient(135deg,#f59e0b,#ef4444);
      display:flex; align-items:center; justify-content:center; font-size:1.15rem;
    }
    .brand-title { font-size:1.05rem; font-weight:800; }
    .brand-sub { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); }

    .controls { display:flex; align-items:center; gap:0.5rem; flex:1; flex-wrap:wrap; }
    #statusText { font-size:12px; color:var(--muted); font-weight:500; max-width:100%; }

    .btn {
      padding:8px 20px; border:none; border-radius:10px;
      font-weight:700; font-size:0.85rem; font-family:inherit;
      cursor:pointer; transition:all .2s; min-height:36px; color:#fff;
    }
    .btn:hover:not(:disabled) { filter:brightness(1.15); }
    .btn:disabled { opacity:0.5; cursor:not-allowed; }
    .btn-accent { background:var(--accent); }
    .btn-green  { background:var(--green); }
    .btn-red    { background:var(--red); }
    .btn-sm { padding:5px 12px; font-size:0.75rem; min-height:28px; }

    .user-input {
      padding:7px 12px; border-radius:10px; border:1.5px solid var(--border);
      background:var(--surface); color:var(--text); font-size:0.82rem;
      font-family:inherit; outline:none; width:120px;
    }
    .user-input:focus { border-color:var(--green); }

    /* ── Progress ────────────────────────────────────── */
    .progress-wrap {
      max-width:1400px; margin:0 auto; padding:0.5rem 1rem;
      display:none;
    }
    .progress-wrap.show { display:block; }
    .progress-bar-outer {
      width:100%; height:6px; background:var(--surface);
      border-radius:3px; overflow:hidden; margin-bottom:0.4rem;
    }
    .progress-bar-inner {
      height:100%; background:linear-gradient(90deg,var(--accent),var(--orange));
      width:0%; transition:width .3s;
      border-radius:3px;
    }
    .progress-label {
      font-size:0.7rem; color:var(--muted); font-family:'JetBrains Mono',monospace;
    }

    /* ── Stats Bar ───────────────────────────────────── */
    .stats-bar {
      max-width:1400px; margin:0 auto; padding:0.5rem 1rem;
      display:none; gap:10px; flex-wrap:wrap; align-items:center;
    }
    .stats-bar.show { display:flex; }
    .stat-pill {
      background:var(--surface); border:1px solid var(--border);
      border-radius:10px; padding:6px 14px; font-size:0.75rem; font-weight:700;
    }
    .stat-val { color:var(--accent); }

    /* ── Filters ─────────────────────────────────────── */
    .filter-bar {
      max-width:1400px; margin:0 auto; padding:0.5rem 1rem;
      display:none; gap:8px; flex-wrap:wrap; align-items:center;
    }
    .filter-bar.show { display:flex; }
    .filter-input {
      padding:7px 14px; border-radius:10px; border:1.5px solid var(--border);
      background:var(--surface); color:var(--text); font-size:0.82rem;
      font-family:inherit; outline:none; transition:border-color .2s;
    }
    .filter-input:focus { border-color:var(--accent); }
    .filter-select {
      padding:7px 14px; border-radius:10px; border:1.5px solid var(--border);
      background:var(--surface); color:var(--text); font-size:0.82rem;
      font-family:inherit; outline:none; cursor:pointer;
    }

    /* ── Sub-geeklist pills ──────────────────────────── */
    .sub-gl-bar {
      max-width:1400px; margin:0 auto; padding:0.4rem 1rem;
      display:none; gap:6px; flex-wrap:wrap; align-items:center;
    }
    .sub-gl-bar.show { display:flex; }
    .gl-pill {
      padding:4px 12px; border-radius:20px; font-size:0.68rem; font-weight:700;
      cursor:pointer; transition:all .15s; border:1.5px solid var(--border);
      background:var(--surface); color:var(--muted);
      max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      display:inline-flex; align-items:center; gap:4px;
    }
    .gl-pill.active { border-color:var(--accent); color:var(--accent); background:rgba(245,158,11,0.1); }
    .gl-pill:hover:not(.active) { border-color:rgba(245,158,11,0.4); color:var(--text); }
    .gl-pill .gl-count {
      display:inline-block; background:rgba(245,158,11,0.2); color:var(--accent);
      padding:0 6px; border-radius:10px; font-size:0.6rem;
    }
    .gl-link {
      display:inline-flex; align-items:center; justify-content:center;
      width:16px; height:16px; border-radius:50%;
      background:rgba(59,130,246,0.15); color:var(--blue);
      font-size:0.55rem; font-weight:900; text-decoration:none;
      transition:all .15s; flex-shrink:0;
    }
    .gl-link:hover { background:rgba(59,130,246,0.35); color:#93bbfc; }

    /* ── Card List (horizontal cards) ──────────────── */
    .list-wrap {
      max-width:1400px; margin:0 auto; padding:1rem;
    }
    .card-list {
      display:flex; flex-direction:column; gap:10px;
    }

    .game-card {
      background:var(--card); border:1.5px solid var(--border);
      border-radius:14px; overflow:hidden; cursor:pointer;
      transition:transform .15s, border-color .2s, box-shadow .2s;
      display:flex; flex-direction:row; align-items:stretch;
    }
    .game-card:hover {
      border-color:rgba(245,158,11,0.5);
      box-shadow:0 4px 20px rgba(245,158,11,0.08);
    }

    .card-thumb {
      width:90px; min-height:90px; flex-shrink:0;
      background:linear-gradient(135deg,#1e293b,#334155);
      display:flex; align-items:center; justify-content:center;
      overflow:hidden; position:relative; cursor:pointer;
    }
    .card-thumb img {
      width:100%; height:100%; object-fit:contain;
    }
    .card-thumb-ph { font-size:2rem; opacity:0.3; }

    .card-content {
      flex:1; min-width:0; padding:0.6rem 0.8rem;
      display:flex; flex-direction:column; gap:3px;
    }
    .card-top { display:flex; align-items:flex-start; gap:8px; }
    .card-name {
      font-weight:700; font-size:0.88rem; line-height:1.3; flex:1; min-width:0;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .card-name a { color:var(--text); text-decoration:none; }
    .card-name a:hover { color:var(--accent); }
    .card-price {
      background:var(--accent); color:#000; font-weight:800; font-size:0.8rem;
      padding:2px 10px; border-radius:8px; flex-shrink:0; white-space:nowrap;
    }
    .card-price.no-price { background:var(--surface); color:var(--muted); font-weight:600; font-size:0.7rem; }

    .card-meta-row {
      display:flex; align-items:center; gap:6px; flex-wrap:wrap;
      font-size:0.7rem; color:var(--muted); line-height:1.5;
    }
    .card-meta-row span { display:inline-flex; align-items:center; gap:2px; }

    .auction-row {
      display:flex; align-items:center; gap:5px; flex-wrap:wrap;
      font-size:0.68rem; line-height:1.5;
    }
    .auction-field {
      display:inline-flex; align-items:center; gap:3px;
      padding:1px 8px; border-radius:6px; white-space:nowrap;
    }
    .af-start  { color:#60a5fa; background:rgba(96,165,250,0.1);  border:1px solid rgba(96,165,250,0.2); }
    .af-end    { color:#fb923c; background:rgba(251,146,60,0.1);   border:1px solid rgba(251,146,60,0.2); }
    .af-bids   { color:#94a3b8; background:rgba(148,163,184,0.08); border:1px solid rgba(148,163,184,0.15); }
    .af-maxbid { color:#34d399; background:rgba(52,211,153,0.1);   border:1px solid rgba(52,211,153,0.2); font-weight:700; }

    .card-tags {
      display:flex; gap:4px; flex-wrap:wrap;
    }
    .tag {
      display:inline-block; padding:1px 7px; border-radius:6px;
      font-size:0.6rem; font-weight:700; border:1px solid;
    }
    .tag-mech { color:#f9a8d4; border-color:rgba(249,168,212,0.25); background:rgba(249,168,212,0.08); }
    .tag-cat  { color:#93c5fd; border-color:rgba(147,197,253,0.25); background:rgba(147,197,253,0.08); }

    /* Collection status badges */
    .coll-badges { display:flex; gap:4px; flex-wrap:wrap; }
    .coll-badge {
      display:inline-block; padding:1px 7px; border-radius:6px;
      font-size:0.6rem; font-weight:800; border:1px solid;
    }
    .cb-own        { color:#34d399; border-color:rgba(52,211,153,0.3); background:rgba(52,211,153,0.1); }
    .cb-prevowned  { color:#94a3b8; border-color:rgba(148,163,184,0.3); background:rgba(148,163,184,0.08); }
    .cb-fortrade   { color:#fbbf24; border-color:rgba(251,191,36,0.3); background:rgba(251,191,36,0.1); }
    .cb-want       { color:#f472b6; border-color:rgba(244,114,182,0.3); background:rgba(244,114,182,0.1); }
    .cb-wanttoplay { color:#a78bfa; border-color:rgba(167,139,250,0.3); background:rgba(167,139,250,0.1); }
    .cb-wanttobuy  { color:#fb923c; border-color:rgba(251,146,60,0.3); background:rgba(251,146,60,0.1); }
    .cb-wishlist   { color:#f9a8d4; border-color:rgba(249,168,212,0.3); background:rgba(249,168,212,0.1); }
    .cb-preordered { color:#60a5fa; border-color:rgba(96,165,250,0.3); background:rgba(96,165,250,0.1); }
    .cb-rated      { color:#c084fc; border-color:rgba(192,132,252,0.3); background:rgba(192,132,252,0.1); }
    .cb-notincoll  { color:#475569; border-color:rgba(71,85,105,0.3); background:rgba(71,85,105,0.08); }

    .card-body-text {
      font-size:0.68rem; color:#94a3b8; line-height:1.4;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }

    .card-footer {
      display:flex; align-items:center; gap:8px; font-size:0.65rem; color:var(--muted);
      margin-top:auto; padding-top:4px; border-top:1px solid var(--border);
    }
    .card-footer a { color:var(--blue); text-decoration:none; }
    .card-footer a:hover { text-decoration:underline; color:#93bbfc; }

    /* ── Empty / placeholder ─────────────────────────── */
    .placeholder-msg {
      text-align:center; padding:3rem 1rem;
      color:var(--muted); font-size:0.9rem;
    }

    /* ── Console panel ───────────────────────────────── */
    .console-toggle {
      position:fixed; bottom:16px; right:16px; z-index:50;
      width:42px; height:42px; border-radius:50%;
      background:var(--surface); border:1.5px solid var(--border);
      color:var(--accent); font-size:1.1rem; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:all .2s;
    }
    .console-toggle:hover { background:var(--card); border-color:var(--accent); }
    .console-toggle .badge {
      position:absolute; top:-4px; right:-4px;
      background:var(--red); color:#fff; font-size:0.55rem; font-weight:800;
      min-width:16px; height:16px; border-radius:8px; padding:0 4px;
      display:flex; align-items:center; justify-content:center;
    }

    .console-panel {
      position:fixed; bottom:70px; right:16px; z-index:50;
      width:420px; max-width:calc(100vw - 32px);
      max-height:350px; overflow-y:auto;
      background:var(--surface); border:1.5px solid var(--border);
      border-radius:12px; padding:0.5rem;
      font-family:'JetBrains Mono',monospace; font-size:0.68rem;
      display:none; box-shadow:0 8px 30px rgba(0,0,0,0.5);
    }
    .console-panel.show { display:block; }
    .console-line { padding:2px 6px; border-radius:4px; line-height:1.6; word-break:break-all; }
    .console-line.info  { color:#60a5fa; }
    .console-line.warn  { color:#fbbf24; background:rgba(251,191,36,0.05); }
    .console-line.error { color:#f87171; background:rgba(248,113,113,0.05); }
    .console-line.ok    { color:#34d399; }
    .console-line.dim   { color:#475569; }

    @media(max-width:700px) {
      .card-thumb { width:70px; min-height:70px; }
      .console-panel { width:calc(100vw - 32px); }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-icon">🔨</div>
      <div>
        <div class="brand-title">BGG Auctions</div>
        <div class="brand-sub">Geeklist Metalist Crawler</div>
      </div>
    </div>
    <div class="controls">
      <button class="btn btn-accent" id="loadBtn" onclick="start()">🔨 Load Auctions</button>
      <button class="btn btn-red" id="stopBtn" onclick="stopCrawl()" style="display:none">⛔ Stop</button>
      <span style="color:var(--border)">|</span>
      <input class="user-input" id="userInput" value="sportomax" placeholder="BGG username" />
      <button class="btn btn-green btn-sm" id="collBtn" onclick="loadCollection()">📦 Load Collection</button>
      <span id="collStatus" style="font-size:11px;color:var(--muted);display:none"></span>
      <span id="statusText">Crawls geeklist 66420 → all sub-geeklists → auction items.</span>
    </div>
  </div>
</header>

<!-- Progress -->
<div class="progress-wrap" id="progressWrap">
  <div class="progress-bar-outer"><div class="progress-bar-inner" id="progressBar"></div></div>
  <div class="progress-label" id="progressLabel">Preparing…</div>
</div>

<!-- Stats -->
<div class="stats-bar" id="statsBar">
  <div class="stat-pill">📋 Sub-lists: <span class="stat-val" id="stSubLists">0</span></div>
  <div class="stat-pill">🎲 Games: <span class="stat-val" id="stGames">0</span></div>
  <div class="stat-pill">💰 Priced: <span class="stat-val" id="stPriced">0</span></div>
  <div class="stat-pill">📊 Avg Price: <span class="stat-val" id="stAvgPrice">—</span></div>
  <div class="stat-pill" id="stCollPill" style="display:none">📦 In Collection: <span class="stat-val" id="stInColl">0</span></div>
</div>

<!-- Sub-geeklist pills -->
<div class="sub-gl-bar" id="subGlBar">
  <div class="gl-pill active" onclick="filterByList('all')">All</div>
</div>

<!-- Filters -->
<div class="filter-bar" id="filterBar">
  <input class="filter-input" id="searchInput" placeholder="🔎 Search games…" style="flex:1;min-width:180px;" oninput="applyFilters()" />
  <select class="filter-select" id="sortSelect" onchange="applyFilters()">
    <option value="price-desc">💰 Price High → Low</option>
    <option value="price-asc">💰 Price Low → High</option>
    <option value="name-asc">🔤 Name A → Z</option>
    <option value="name-desc">🔤 Name Z → A</option>
    <option value="rating-desc">⭐ Rating High → Low</option>
    <option value="weight-desc">⚙ Weight High → Low</option>
    <option value="date-desc">📅 Newest First</option>
    <option value="userrating-desc">🎯 My Rating High → Low</option>
  </select>
  <select class="filter-select" id="priceFilter" onchange="applyFilters()">
    <option value="all">All Prices</option>
    <option value="has-price">Has Price</option>
    <option value="under10">Under $10</option>
    <option value="under25">Under $25</option>
    <option value="under50">Under $50</option>
    <option value="over50">$50+</option>
  </select>
  <select class="filter-select" id="collFilter" onchange="applyFilters()">
    <option value="all">All Collection</option>
    <option value="in-coll">In My Collection</option>
    <option value="not-in-coll">Not In Collection</option>
    <option value="own">🏠 Own</option>
    <option value="prevowned">🔁 Prev. Owned</option>
    <option value="fortrade">💱 For Trade</option>
    <option value="want">⭐ Want</option>
    <option value="wanttoplay">▶ Want to Play</option>
    <option value="wanttobuy">💸 Want to Buy</option>
    <option value="wishlist">📝 Wishlist</option>
    <option value="preordered">📦 Preordered</option>
    <option value="rated">🎯 Rated</option>
  </select>
</div>

<!-- Cards -->
<div class="list-wrap">
  <div class="card-list" id="cardGrid"></div>
  <div class="placeholder-msg" id="placeholder">Click <strong>Load Auctions</strong> to crawl the BGG auction metalist.</div>
</div>

<!-- Console toggle + panel -->
<button class="console-toggle" id="consoleToggle" onclick="toggleConsole()">
  🖥
  <span class="badge" id="consoleBadge" style="display:none">0</span>
</button>
<div class="console-panel" id="consolePanel"></div>

<script>
// ═══════════════════════════════════════════════════════
//  GLOBALS
// ═══════════════════════════════════════════════════════
const MASTER_ID = '66420';
let allItems     = [];
let displayed    = [];
let subGeeklists = [];   // { id, title, itemCount }
let activeGlFilter = 'all';
let stopped      = false;
let consoleLines = [];
let consoleOpen  = false;
let unseenLogs   = 0;

// Collection map: objectId → { own, prevowned, fortrade, want, wanttoplay, wanttobuy, wishlist, preordered, userRating, numPlays }
let collMap      = {};
let collLoaded   = false;

// ═══════════════════════════════════════════════════════
//  CONSOLE LOGGER
// ═══════════════════════════════════════════════════════
function clog(msg, level) {
  if (!level) level = 'info';
  const ts = new Date().toLocaleTimeString('en-US', { hour12: false });
  const line = `[${ts}] ${msg}`;
  consoleLines.push({ text: line, level });

  if (level === 'error') console.error(line);
  else if (level === 'warn') console.warn(line);
  else console.log(line);

  if (consoleOpen) renderConsole();
  else {
    unseenLogs++;
    const badge = document.getElementById('consoleBadge');
    badge.textContent = unseenLogs > 99 ? '99+' : unseenLogs;
    badge.style.display = '';
  }
}

function renderConsole() {
  const el = document.getElementById('consolePanel');
  const tail = consoleLines.slice(-200);
  el.innerHTML = tail.map(l =>
    `<div class="console-line ${l.level}">${esc(l.text)}</div>`
  ).join('');
  el.scrollTop = el.scrollHeight;
}

function toggleConsole() {
  consoleOpen = !consoleOpen;
  document.getElementById('consolePanel').classList.toggle('show', consoleOpen);
  if (consoleOpen) {
    unseenLogs = 0;
    document.getElementById('consoleBadge').style.display = 'none';
    renderConsole();
  }
}

// ═══════════════════════════════════════════════════════
//  UTILITIES
// ═══════════════════════════════════════════════════════
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
function setStatus(msg) { document.getElementById('statusText').textContent = msg; }
function setProg(pct, label) {
  document.getElementById('progressBar').style.width = pct + '%';
  if (label) document.getElementById('progressLabel').textContent = label;
}

async function fetchBGG(endpoint, params, attempt) {
  if (attempt === undefined) attempt = 0;
  const MAX = 6;
  const qs = new URLSearchParams(params).toString();
  const url = '/api/bgg-helper?endpoint=' + endpoint + '&' + qs;
  let res;
  try {
    res = await fetch(url);
  } catch (netErr) {
    if (attempt >= MAX) throw netErr;
    const w = Math.min(500 * Math.pow(2, attempt), 16000);
    clog('Network error — retry ' + (attempt+1) + '/' + MAX + ' in ' + (w/1000).toFixed(1) + 's', 'warn');
    await delay(w);
    return fetchBGG(endpoint, params, attempt + 1);
  }
  if (res.status === 202) {
    if (attempt >= MAX) throw new Error('BGG timeout after ' + MAX + ' retries (202)');
    const w = 3000 + attempt * 1000;
    clog('BGG processing (202) — retry ' + (attempt+1) + '/' + MAX + ' in ' + (w/1000).toFixed(1) + 's', 'warn');
    await delay(w);
    return fetchBGG(endpoint, params, attempt + 1);
  }
  if (res.status === 429) {
    if (attempt >= MAX) throw new Error('Rate limited after ' + MAX + ' retries (429)');
    const w = Math.min(2000 * Math.pow(2, attempt), 32000);
    clog('Rate limited (429) — retry ' + (attempt+1) + '/' + MAX + ' in ' + (w/1000).toFixed(1) + 's', 'warn');
    await delay(w);
    return fetchBGG(endpoint, params, attempt + 1);
  }
  if (res.status >= 500) {
    if (attempt >= MAX) throw new Error('Server error ' + res.status + ' after ' + MAX + ' retries');
    const w = Math.min(1000 * Math.pow(2, attempt), 16000);
    clog('Server error ' + res.status + ' — retry ' + (attempt+1) + '/' + MAX, 'warn');
    await delay(w);
    return fetchBGG(endpoint, params, attempt + 1);
  }
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.text();
}

// ═══════════════════════════════════════════════════════
//  PRICE EXTRACTION
// ═══════════════════════════════════════════════════════
function extractPrice(bodyText) {
  if (!bodyText) return null;
  const patterns = [
    /\$\s?(\d{1,4}(?:\.\d{1,2})?)/,
    /(\d{1,4}(?:\.\d{1,2})?)\s*(?:USD|usd|dollars?)/,
    /(?:price|asking|starting|bid|buy\s*it\s*now|BIN)[:\s]*\$?\s*(\d{1,4}(?:\.\d{1,2})?)/i,
  ];
  for (const pat of patterns) {
    const m = bodyText.match(pat);
    if (m) {
      const val = parseFloat(m[1]);
      if (val > 0 && val < 10000) return val;
    }
  }
  return null;
}

// ═══════════════════════════════════════════════════════
//  END DATE EXTRACTION (from listing body text)
// ═══════════════════════════════════════════════════════
function extractEndDate(text) {
  if (!text) return null;
  const patterns = [
    // "ends March 30" / "ends March 30, 2025" / "end: 3/30/25"
    /(?:auction\s+)?ends?\s+(?:on\s+)?([A-Za-z]+\.?\s+\d{1,2}(?:,?\s+\d{4})?)/i,
    /(?:auction\s+)?ends?\s+(?:on\s+)?(\d{1,2}[\/\-]\d{1,2}(?:[\/\-]\d{2,4})?)/i,
    // "end date: March 30" / "closing: 3/30"
    /end(?:\s+date)?[:\s]+([A-Za-z]+\.?\s+\d{1,2}(?:,?\s+\d{4})?)/i,
    /end(?:\s+date)?[:\s]+(\d{1,2}[\/\-]\d{1,2}(?:[\/\-]\d{2,4})?)/i,
    // "close date:" / "closes:" / "closing:"
    /clos(?:e[sd]?|ing)(?:\s+date)?[:\s]+([A-Za-z]+\.?\s+\d{1,2}(?:,?\s+\d{4})?)/i,
    /clos(?:e[sd]?|ing)(?:\s+date)?[:\s]+(\d{1,2}[\/\-]\d{1,2}(?:[\/\-]\d{2,4})?)/i,
  ];
  for (const pat of patterns) {
    const m = text.match(pat);
    if (m) return m[1].trim();
  }
  return null;
}

// ═══════════════════════════════════════════════════════
//  BID AMOUNT EXTRACTION (from a single comment's text)
// ═══════════════════════════════════════════════════════
function extractBidAmount(commentText) {
  if (!commentText) return null;
  const clean = commentText.trim();
  const patterns = [
    /(?:i\s+(?:bid|offer)|my\s+bid|bidding)[:\s]*\$?\s*(\d{1,4}(?:\.\d{1,2})?)/i,
    /(?:^|\s)\$\s?(\d{1,4}(?:\.\d{1,2})?)/m,
    /(\d{1,4}(?:\.\d{1,2})?)\s*(?:USD|dollars?)\b/i,
  ];
  for (const pat of patterns) {
    const m = clean.match(pat);
    if (m) {
      const val = parseFloat(m[1]);
      if (val > 0 && val < 10000) return val;
    }
  }
  return null;
}

// ═══════════════════════════════════════════════════════
//  STRIP HTML/BBCode for display
// ═══════════════════════════════════════════════════════
function stripMarkup(s) {
  if (!s) return '';
  return s
    .replace(/<[^>]*>/g, '')
    .replace(/\[\/?\w+[^\]]*\]/g, '')
    .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"').replace(/&#\d+;/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

// ═══════════════════════════════════════════════════════
//  COLLECTION LOADER (BGG API v2)
// ═══════════════════════════════════════════════════════
async function loadCollection() {
  const user = (document.getElementById('userInput').value || '').trim();
  if (!user) { clog('No username entered', 'warn'); return; }
  const cs = document.getElementById('collStatus');
  cs.style.display = ''; cs.textContent = '⏳ Loading…';
  document.getElementById('collBtn').disabled = true;

  clog('Loading collection for "' + user + '"…');
  try {
    const xml = await fetchBGG('collection', { username: user, stats: 1, subtype: 'boardgame' });
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    const items = Array.from(doc.querySelectorAll('item'));
    clog('Collection: ' + items.length + ' items for "' + user + '"', 'ok');

    collMap = {};
    items.forEach(item => {
      const id = item.getAttribute('objectid') || '';
      if (!id) return;
      const st = item.querySelector('status');
      const ratingEl = item.querySelector('rating');
      const ur = ratingEl ? ratingEl.getAttribute('value') : null;
      const np = item.querySelector('numplays');
      collMap[id] = {
        own:         st?.getAttribute('own') === '1',
        prevowned:   st?.getAttribute('prevowned') === '1',
        fortrade:    st?.getAttribute('fortrade') === '1',
        want:        st?.getAttribute('want') === '1',
        wanttoplay:  st?.getAttribute('wanttoplay') === '1',
        wanttobuy:   st?.getAttribute('wanttobuy') === '1',
        wishlist:    st?.getAttribute('wishlist') === '1',
        preordered:  st?.getAttribute('preordered') === '1',
        userRating:  ur && ur !== 'N/A' ? parseFloat(ur) : null,
        numPlays:    np ? parseInt(np.textContent) || 0 : 0,
      };
    });

    collLoaded = true;
    cs.textContent = '✅ ' + items.length + ' games loaded';
    clog('Collection map built: ' + Object.keys(collMap).length + ' entries', 'ok');

    // Show collection stats
    document.getElementById('stCollPill').style.display = '';
    updateStats();
    applyFilters();
  } catch (e) {
    clog('Collection load failed: ' + e.message, 'error');
    cs.textContent = '❌ Error';
  }
  document.getElementById('collBtn').disabled = false;
}

// ═══════════════════════════════════════════════════════
//  STEP 1: FETCH MASTER GEEKLIST — FIND SUB-GEEKLISTS
// ═══════════════════════════════════════════════════════
async function fetchMasterList() {
  clog('Fetching master geeklist #' + MASTER_ID + '…');
  const xml = await fetchBGG('geeklist', { id: MASTER_ID });
  const doc = new DOMParser().parseFromString(xml, 'text/xml');
  const title = doc.querySelector('geeklist title');
  clog('Master list: "' + (title ? title.textContent : 'unknown') + '"', 'ok');

  const items = Array.from(doc.querySelectorAll('item'));
  clog('Master list has ' + items.length + ' items — scanning for sub-geeklist links…');

  const glIds = new Map(); // id → title

  items.forEach((item, idx) => {
    const body = item.textContent || '';
    const itemName = item.getAttribute('objectname') || 'Item #' + idx;

    // Pattern 1: [geeklist=XXXXX] BBCode
    const bbMatches = body.matchAll(/\[geeklist[= ](\d+)\]/gi);
    for (const m of bbMatches) {
      if (!glIds.has(m[1])) {
        glIds.set(m[1], itemName);
        clog('  Found sub-geeklist #' + m[1] + ' via BBCode in "' + itemName + '"', 'dim');
      }
    }

    // Pattern 2: /geeklist/XXXXX in URLs
    const urlMatches = body.matchAll(/\/geeklist\/(\d+)/gi);
    for (const m of urlMatches) {
      if (m[1] !== MASTER_ID && !glIds.has(m[1])) {
        glIds.set(m[1], itemName);
        clog('  Found sub-geeklist #' + m[1] + ' via URL in "' + itemName + '"', 'dim');
      }
    }

    // Pattern 3: geeklistId=XXXXX or geeklist=XXXXX
    const paramMatches = body.matchAll(/geeklist(?:Id)?[= ](\d+)/gi);
    for (const m of paramMatches) {
      if (m[1] !== MASTER_ID && !glIds.has(m[1])) {
        glIds.set(m[1], itemName);
        clog('  Found sub-geeklist #' + m[1] + ' via param in "' + itemName + '"', 'dim');
      }
    }
  });

  clog('Discovered ' + glIds.size + ' unique sub-geeklists', 'ok');
  return glIds;
}

// ═══════════════════════════════════════════════════════
//  STEP 2: FETCH A SUB-GEEKLIST → PARSE AUCTION ITEMS
// ═══════════════════════════════════════════════════════
async function fetchSubGeeklist(glId, glHint) {
  clog('Fetching sub-geeklist #' + glId + ' ("' + glHint + '")…');
  const xml = await fetchBGG('geeklist', { id: glId, comments: 1 });
  const doc = new DOMParser().parseFromString(xml, 'text/xml');

  const titleEl = doc.querySelector('geeklist title');
  const glTitle = titleEl ? titleEl.textContent.trim() : glHint || 'Geeklist #' + glId;

  const nodes = Array.from(doc.querySelectorAll('item'));
  clog('  Sub-geeklist #' + glId + ': "' + glTitle + '" — ' + nodes.length + ' items');

  const parsed = [];
  nodes.forEach(node => {
    const itemId     = node.getAttribute('id') || '';
    const objectId   = node.getAttribute('objectid') || '';
    const name       = node.getAttribute('objectname') || 'Unknown';
    const objectType = node.getAttribute('objecttype') || '';
    const seller     = node.getAttribute('username') || '';
    const postdate   = node.getAttribute('postdate') || '';

    // Extract body HTML, stripping nested <comment> blocks so price/text parsing isn't polluted
    const bodyRaw  = node.innerHTML || '';
    const bodyHtml = bodyRaw.replace(/<comment\b[^>]*>[\s\S]*?<\/comment>/gi, '').trim();
    const bodyText = stripMarkup(bodyHtml);
    const price    = extractPrice(bodyText);
    const endDate  = extractEndDate(bodyText);

    // Comments for bid extraction
    const commentNodes = Array.from(node.querySelectorAll('comment'));
    const numComments  = parseInt(node.getAttribute('numcomments') || '0', 10) || commentNodes.length;
    let maxBid = null;
    commentNodes.forEach(cn => {
      const bid = extractBidAmount(cn.textContent || '');
      if (bid !== null && (maxBid === null || bid > maxBid)) maxBid = bid;
    });

    if (objectType && objectType !== 'thing') return;

    parsed.push({
      name, objectId, itemId, seller, postdate,
      endDate, numComments, maxBid,
      maxBidRaw: maxBid !== null ? '$' + maxBid.toFixed(2) : null,
      bodyText, bodyHtml,
      price, priceRaw: price !== null ? '$' + price.toFixed(2) : null,
      glId, glTitle,
      thumb: '', image: '', rating: null, year: null, weight: null,
      mechanics: [], categories: []
    });
  });

  clog('  Parsed ' + parsed.length + ' game items, ' + parsed.filter(p => p.price !== null).length + ' with prices', 'ok');
  return { glId, glTitle, items: parsed };
}

// ═══════════════════════════════════════════════════════
//  STEP 3: ENRICH WITH THING API — 100x PARALLEL, 20 IDs PER
// ═══════════════════════════════════════════════════════
async function enrichItems(items) {
  if (!items.length) return;
  const ids = [...new Set(items.map(i => i.objectId).filter(Boolean))].join(',');
  if (!ids) return;
  try {
    const xml = await fetchBGG('thing', { id: ids, stats: 1 });
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    doc.querySelectorAll('item').forEach(thing => {
      const tid = thing.getAttribute('id');
      const matching = items.filter(i => i.objectId === tid);
      if (!matching.length) return;

      const thumb = thing.querySelector('thumbnail')?.textContent?.trim() || '';
      const image = thing.querySelector('image')?.textContent?.trim() || '';
      const year  = thing.querySelector('yearpublished')?.getAttribute('value') || '';
      const avg   = thing.querySelector('statistics ratings average');
      const rating = avg ? parseFloat(avg.getAttribute('value') || '0') : null;
      const wt    = thing.querySelector('statistics ratings averageweight');
      const weight = wt ? parseFloat(wt.getAttribute('value') || '0') : null;
      const mechanics  = Array.from(thing.querySelectorAll('link[type="boardgamemechanic"]')).map(l => l.getAttribute('value'));
      const categories = Array.from(thing.querySelectorAll('link[type="boardgamecategory"]')).map(l => l.getAttribute('value'));

      matching.forEach(m => {
        m.thumb = thumb; m.image = image; m.year = year;
        m.rating = rating; m.weight = weight;
        m.mechanics = mechanics; m.categories = categories;
      });
    });
  } catch (e) {
    clog('Enrich batch failed: ' + e.message, 'error');
  }
}

// ═══════════════════════════════════════════════════════
//  MAIN FLOW
// ═══════════════════════════════════════════════════════
async function start() {
  stopped = false;
  allItems = [];
  displayed = [];
  subGeeklists = [];
  activeGlFilter = 'all';
  document.getElementById('cardGrid').innerHTML = '';
  document.getElementById('placeholder').textContent = '';
  document.getElementById('loadBtn').disabled = true;
  document.getElementById('stopBtn').style.display = '';
  document.getElementById('progressWrap').classList.add('show');
  document.getElementById('statsBar').classList.add('show');
  document.getElementById('filterBar').classList.add('show');
  document.getElementById('subGlBar').classList.add('show');
  updateStats();
  setProg(0, 'Fetching master geeklist…');

  try {
    // Step 1: Master list
    const glMap = await fetchMasterList();
    if (stopped) return finish();
    const glEntries = Array.from(glMap.entries());
    document.getElementById('stSubLists').textContent = glEntries.length;

    if (!glEntries.length) {
      clog('No sub-geeklists found in master list!', 'error');
      setStatus('No sub-geeklists found.');
      return finish();
    }

    // Step 2: Crawl sub-geeklists — ALL in parallel
    clog('Firing ' + glEntries.length + ' sub-geeklist requests in parallel…', 'ok');
    setProg(5, 'Fetching ' + glEntries.length + ' sub-geeklists in parallel…');

    let doneGL = 0;
    await Promise.all(
      glEntries.map(([id, hint]) =>
        fetchSubGeeklist(id, hint)
          .then(result => {
            doneGL++;
            const pct = 5 + Math.round((doneGL / glEntries.length) * 45);
            setProg(pct, 'Sub-geeklists: ' + doneGL + '/' + glEntries.length + ' — ' + allItems.length + ' items so far');
            setStatus('Crawling: ' + doneGL + '/' + glEntries.length + ' sub-geeklists');

            subGeeklists.push({ id: result.glId, title: result.glTitle, itemCount: result.items.length });
            allItems.push(...result.items);
            updateStats();
            renderSubGlPills();
            applyFilters();
            return result;
          })
          .catch(err => {
            doneGL++;
            clog('Failed sub-geeklist #' + id + ': ' + err.message, 'error');
            return null;
          })
      )
    );

    if (stopped) return finish();
    clog('All sub-geeklists done: ' + allItems.length + ' total items from ' + subGeeklists.length + ' lists', 'ok');

    // Step 3: Enrich — 100x parallel, 20 IDs per batch
    clog('Enriching ' + allItems.length + ' items — 100x parallel, 20 IDs per batch…');
    setProg(50, 'Enriching game covers & ratings…');

    const BATCH = 20;
    const allBatches = [];
    for (let i = 0; i < allItems.length; i += BATCH) allBatches.push(allItems.slice(i, i + BATCH));

    clog('Total enrichment batches: ' + allBatches.length + ' (20 IDs each)', 'info');

    // Fire ALL batches in parallel (100x concurrency — all at once with Promise.all)
    let doneBatch = 0;
    await Promise.all(
      allBatches.map(batch =>
        enrichItems(batch)
          .then(() => {
            doneBatch++;
            const pct = 50 + Math.round((doneBatch / allBatches.length) * 45);
            setProg(pct, 'Enriching: ' + doneBatch + '/' + allBatches.length + ' batches');
            patchEnrichedItems(batch);
          })
          .catch(() => { doneBatch++; })
      )
    );

    setProg(100, 'Done!');
    clog('Complete: ' + allItems.length + ' auction items enriched from ' + subGeeklists.length + ' sub-geeklists', 'ok');
    setStatus(allItems.length + ' auction items from ' + subGeeklists.length + ' sub-geeklists — ready!');
    applyFilters();
  } catch (e) {
    clog('Fatal error: ' + e.message, 'error');
    setStatus('Error: ' + e.message);
  }

  finish();
}

function finish() {
  document.getElementById('loadBtn').disabled = false;
  document.getElementById('stopBtn').style.display = 'none';
  setTimeout(() => {
    document.getElementById('progressWrap').classList.remove('show');
  }, 2000);
}

function stopCrawl() {
  stopped = true;
  clog('Crawl stopped by user', 'warn');
  setStatus('Stopped.');
  finish();
}

// ═══════════════════════════════════════════════════════
//  STATS
// ═══════════════════════════════════════════════════════
function updateStats() {
  document.getElementById('stSubLists').textContent = subGeeklists.length;
  document.getElementById('stGames').textContent = allItems.length;
  const priced = allItems.filter(i => i.price !== null);
  document.getElementById('stPriced').textContent = priced.length;
  if (priced.length) {
    const avg = priced.reduce((s, i) => s + i.price, 0) / priced.length;
    document.getElementById('stAvgPrice').textContent = '$' + avg.toFixed(2);
  }
  if (collLoaded) {
    const inColl = allItems.filter(i => collMap[i.objectId]).length;
    document.getElementById('stInColl').textContent = inColl;
  }
}

// ═══════════════════════════════════════════════════════
//  SUB-GEEKLIST PILLS (with clickable BGG links)
// ═══════════════════════════════════════════════════════
function renderSubGlPills() {
  const bar = document.getElementById('subGlBar');
  const sorted = [...subGeeklists].sort((a, b) => b.itemCount - a.itemCount);
  bar.innerHTML =
    '<div class="gl-pill ' + (activeGlFilter === 'all' ? 'active' : '') + '" onclick="filterByList(\'all\')">All <span class="gl-count">' + allItems.length + '</span></div>'
    + sorted.map(gl => {
      const label = esc(gl.title.length > 30 ? gl.title.slice(0, 28) + '…' : gl.title);
      return '<div class="gl-pill ' + (activeGlFilter === gl.id ? 'active' : '') + '" onclick="filterByList(\'' + esc(gl.id) + '\')" title="' + esc(gl.title) + '">'
        + label
        + ' <span class="gl-count">' + gl.itemCount + '</span>'
        + ' <a class="gl-link" href="https://boardgamegeek.com/geeklist/' + esc(gl.id) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Open on BGG">↗</a>'
        + '</div>';
    }).join('');
}

function filterByList(glId) {
  activeGlFilter = glId;
  renderSubGlPills();
  applyFilters();
}

// ═══════════════════════════════════════════════════════
//  FILTER + SORT (with collection support)
// ═══════════════════════════════════════════════════════
function applyFilters() {
  let items = [...allItems];

  // Geeklist filter
  if (activeGlFilter !== 'all') {
    items = items.filter(i => i.glId === activeGlFilter);
  }

  // Search
  const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  if (q) {
    items = items.filter(i =>
      i.name.toLowerCase().includes(q) ||
      i.seller.toLowerCase().includes(q) ||
      i.bodyText.toLowerCase().includes(q) ||
      i.glTitle.toLowerCase().includes(q)
    );
  }

  // Price filter
  const pf = document.getElementById('priceFilter').value;
  if (pf === 'has-price')  items = items.filter(i => i.price !== null);
  if (pf === 'under10')    items = items.filter(i => i.price !== null && i.price < 10);
  if (pf === 'under25')    items = items.filter(i => i.price !== null && i.price < 25);
  if (pf === 'under50')    items = items.filter(i => i.price !== null && i.price < 50);
  if (pf === 'over50')     items = items.filter(i => i.price !== null && i.price >= 50);

  // Collection filter
  const cf = document.getElementById('collFilter').value;
  if (cf !== 'all' && collLoaded) {
    if (cf === 'in-coll')      items = items.filter(i => !!collMap[i.objectId]);
    if (cf === 'not-in-coll')  items = items.filter(i => !collMap[i.objectId]);
    if (cf === 'own')          items = items.filter(i => collMap[i.objectId]?.own);
    if (cf === 'prevowned')    items = items.filter(i => collMap[i.objectId]?.prevowned);
    if (cf === 'fortrade')     items = items.filter(i => collMap[i.objectId]?.fortrade);
    if (cf === 'want')         items = items.filter(i => collMap[i.objectId]?.want);
    if (cf === 'wanttoplay')   items = items.filter(i => collMap[i.objectId]?.wanttoplay);
    if (cf === 'wanttobuy')    items = items.filter(i => collMap[i.objectId]?.wanttobuy);
    if (cf === 'wishlist')     items = items.filter(i => collMap[i.objectId]?.wishlist);
    if (cf === 'preordered')   items = items.filter(i => collMap[i.objectId]?.preordered);
    if (cf === 'rated')        items = items.filter(i => collMap[i.objectId]?.userRating > 0);
  }

  // Sort
  const sort = document.getElementById('sortSelect').value;
  if (sort === 'price-desc')      items.sort((a, b) => (b.price || 0) - (a.price || 0));
  if (sort === 'price-asc')       items.sort((a, b) => (a.price || 9999) - (b.price || 9999));
  if (sort === 'name-asc')        items.sort((a, b) => a.name.localeCompare(b.name));
  if (sort === 'name-desc')       items.sort((a, b) => b.name.localeCompare(a.name));
  if (sort === 'rating-desc')     items.sort((a, b) => (b.rating || 0) - (a.rating || 0));
  if (sort === 'weight-desc')     items.sort((a, b) => (b.weight || 0) - (a.weight || 0));
  if (sort === 'date-desc')       items.sort((a, b) => (b.postdate || '').localeCompare(a.postdate || ''));
  if (sort === 'userrating-desc') items.sort((a, b) => ((collMap[b.objectId]?.userRating) || 0) - ((collMap[a.objectId]?.userRating) || 0));

  displayed = items;
  renderCards(items);
}

// ═══════════════════════════════════════════════════════
//  RENDER CARDS (horizontal card layout with collection badges)
// ═══════════════════════════════════════════════════════
function renderCard(item) {
  const src = item.image || item.thumb;
  const imgTag = src
    ? '<img src="' + esc(src) + '" alt="' + esc(item.name) + '" loading="lazy" />'
    : '<div class="card-thumb-ph">🎲</div>';

  const priceHtml = item.priceRaw
    ? '<span class="card-price">' + esc(item.priceRaw) + '</span>'
    : '<span class="card-price no-price">—</span>';

  const itemUrl = 'https://boardgamegeek.com/geeklist/' + esc(item.glId) + '?itemid=' + esc(item.itemId);
  const gameUrl = 'https://boardgamegeek.com/boardgame/' + esc(item.objectId);

  return '<div class="game-card" data-objectid="' + esc(item.objectId) + '" onclick="window.open(\'' + itemUrl + '\',\'_blank\')">' 
    + '<div class="card-thumb" onclick="event.stopPropagation();window.open(\'' + gameUrl + '\',\'_blank\')">' 
    + imgTag
    + '</div>'
    + '<div class="card-content">'
    + '<div class="card-name">' + esc(item.name) + '</div>'
    + '<div class="auction-row">'
    + priceHtml
    + '<span class="auction-field af-bids">💬 ' + (item.numComments || 0) + '</span>'
    + (item.maxBidRaw ? '<span class="auction-field af-maxbid">🏆 ' + esc(item.maxBidRaw) + '</span>' : '')
    + '</div>'
    + '</div>'
    + '</div>';
}

function patchEnrichedItems(batch) {
  batch.forEach(item => {
    const src = item.image || item.thumb;
    if (!src) return;
    document.querySelectorAll('.game-card[data-objectid="' + item.objectId + '"]').forEach(card => {
      const thumb = card.querySelector('.card-thumb');
      if (thumb) thumb.innerHTML = '<img src="' + esc(src) + '" alt="' + esc(item.name) + '" loading="lazy" />';
    });
  });
}

function renderCards(items) {
  const grid = document.getElementById('cardGrid');
  const ph   = document.getElementById('placeholder');

  if (!items.length) {
    grid.innerHTML = '';
    ph.textContent = allItems.length ? 'No items match filters.' : '';
    return;
  }
  ph.textContent = '';

  const show = items.slice(0, 500);
  grid.innerHTML = show.map(renderCard).join(''); if(false){show.map(item=>{
    const imgSrc = item.image || item.thumb;
    const imgTag = imgSrc
      ? '<img src="' + esc(imgSrc) + '" alt="' + esc(item.name) + '" loading="lazy" />'
      : '<div class="card-thumb-ph">🎲</div>';

    const priceHtml = item.priceRaw
      ? '<div class="card-price">' + esc(item.priceRaw) + '</div>'
      : '<div class="card-price no-price">No price</div>';

    const ratingStr = item.rating ? '⭐ ' + item.rating.toFixed(1) : '';
    const yearStr   = item.year || '';
    const weightStr = item.weight ? '⚙ ' + item.weight.toFixed(1) : '';

    // Collection badges
    let collHtml = '';
    const c = collMap[item.objectId];
    if (c) {
      const badges = [];
      if (c.own)        badges.push('<span class="coll-badge cb-own">🏠 Own</span>');
      if (c.prevowned)  badges.push('<span class="coll-badge cb-prevowned">🔁 Prev</span>');
      if (c.fortrade)   badges.push('<span class="coll-badge cb-fortrade">💱 Trade</span>');
      if (c.want)       badges.push('<span class="coll-badge cb-want">⭐ Want</span>');
      if (c.wanttoplay) badges.push('<span class="coll-badge cb-wanttoplay">▶ WTP</span>');
      if (c.wanttobuy)  badges.push('<span class="coll-badge cb-wanttobuy">💸 WTB</span>');
      if (c.wishlist)   badges.push('<span class="coll-badge cb-wishlist">📝 Wish</span>');
      if (c.preordered) badges.push('<span class="coll-badge cb-preordered">📦 Pre</span>');
      if (c.userRating) badges.push('<span class="coll-badge cb-rated">🎯 ' + c.userRating.toFixed(1) + '</span>');
      if (c.numPlays)   badges.push('<span class="coll-badge cb-rated">🎮 ' + c.numPlays + 'p</span>');
      if (badges.length) collHtml = '<div class="coll-badges">' + badges.join('') + '</div>';
    } else if (collLoaded) {
      collHtml = '<div class="coll-badges"><span class="coll-badge cb-notincoll">Not in collection</span></div>';
    }

    // Mechanic/category tags
    const mechs = item.mechanics.slice(0, 3).map(m => '<span class="tag tag-mech">' + esc(m) + '</span>').join('');
    const cats  = item.categories.slice(0, 2).map(c => '<span class="tag tag-cat">' + esc(c) + '</span>').join('');
    const tagsHtml = (mechs || cats) ? '<div class="card-tags">' + mechs + cats + '</div>' : '';

    const bodySnip = item.bodyText ? item.bodyText.slice(0, 180) : '';

    const glUrl = 'https://boardgamegeek.com/geeklist/' + esc(item.glId);
    const gameUrl = 'https://boardgamegeek.com/boardgame/' + esc(item.objectId);

    return '<div class="game-card">'
      + '<div class="card-thumb" onclick="window.open(\'' + gameUrl + '\',\'_blank\')">'
      + imgTag
      + '</div>'
      + '<div class="card-content">'
      + '<div class="card-top">'
      + '<div class="card-name"><a href="' + gameUrl + '" target="_blank" rel="noopener">' + esc(item.name) + '</a></div>'
      + priceHtml
      + '</div>'
      + '<div class="card-meta-row">'
      + (yearStr ? '<span>📅 ' + esc(yearStr) + '</span>' : '')
      + (ratingStr ? '<span>' + ratingStr + '</span>' : '')
      + (weightStr ? '<span>' + weightStr + '</span>' : '')
      + '<span>👤 ' + esc(item.seller) + '</span>'
      + '</div>'
      + '<div class="auction-row">'
      + (item.postdate ? '<span class="auction-field af-start">🏁 ' + new Date(item.postdate).toLocaleDateString() + '</span>' : '')
      + (item.endDate  ? '<span class="auction-field af-end">⏰ ' + esc(item.endDate) + '</span>' : '<span class="auction-field af-end" style="opacity:0.35">⏰ —</span>')
      + '<span class="auction-field af-bids">💬 ' + (item.numComments || 0) + '</span>'
      + (item.maxBidRaw ? '<span class="auction-field af-maxbid">🏆 ' + esc(item.maxBidRaw) + '</span>' : '')
      + '</div>'
      + collHtml
      + tagsHtml
      + (bodySnip ? '<div class="card-body-text">' + esc(bodySnip) + '</div>' : '')
      + '<div class="card-footer">'
      + '<a href="' + glUrl + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">📋 ' + esc(item.glTitle.length > 45 ? item.glTitle.slice(0, 43) + '…' : item.glTitle) + '</a>'
      + '</div>'
      + '</div>'
      + '</div>';
  })}

  if (items.length > 500) {
    grid.innerHTML += '<div style="text-align:center;padding:1rem;color:var(--muted);font-size:0.8rem;">Showing 500 of ' + items.length + ' items. Use filters to narrow results.</div>';
  }
}
</script>
</body>
</html>
