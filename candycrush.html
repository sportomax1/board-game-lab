<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>BGG Candy Crush - Match 3 with your collection</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🍭</text></svg>">
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#ffeef6;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
  .card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,0.12);width:360px}
  h1{margin:0 0 8px;font-size:18px}
  #board{display:grid;gap:4px;background:#f7f7f9;border-radius:8px;padding:8px}
  .tile{width:100%;padding-top:100%;position:relative;border-radius:6px;overflow:hidden;background:#eee}
  .tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .controls{display:flex;gap:8px;margin-top:12px}
  .btn{flex:1;padding:10px;border-radius:8px;border:none;background:#ff6fb5;color:#fff;font-weight:700}
  .small{font-size:12px;padding:8px}
  #score{font-weight:700}
</style>
</head>
<body>
<div class="card">
  <h1>🍭 BGG Candy Crush</h1>
  <p style="margin:0 0 8px;font-size:13px;color:#666">Match 3 or more tiles of the same game thumbnail. Uses your BGG collection thumbnails.</p>
  <div style="display:flex;gap:8px;margin-bottom:8px">
    <input id="username" placeholder="BGG username" value="sportomax" style="flex:1;padding:8px;border-radius:8px;border:1px solid #ddd">
    <button id="load" class="btn small" style="flex:0 0 86px;background:#7b61ff">Load</button>
  </div>
  <div id="meta" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div>Score: <span id="score">0</span></div><div>Moves: <span id="moves">0</span></div></div>
  <div id="board" style="grid-template-columns:repeat(8,1fr);width:100%"></div>
  <div class="controls">
    <button id="shuffleBtn" class="btn small" style="background:#ffb86b">Shuffle</button>
    <button id="resetBtn" class="btn small" style="background:#6bd3ff">New</button>
  </div>
</div>
<script>
// Simple match-3 board using thumbnails fetched from collection
const IMAGE_PROXY = 'https://images.weserv.nl/?url=';
const boardEl = document.getElementById('board');
const loadBtn = document.getElementById('load');
const usernameInput = document.getElementById('username');
let gridSize = 8;
let board = []; // array of {id, thumb, img}
let collection = [];
let score = 0; let moves = 0;
let selected = null;

function idx(r,c){return r*gridSize+c}

function render(){
  boardEl.innerHTML='';
  boardEl.style.gridTemplateColumns = `repeat(${gridSize},1fr)`;
  for(let r=0;r<gridSize;r++){
    for(let c=0;c<gridSize;c++){
      const cell = board[idx(r,c)];
      const d = document.createElement('div'); d.className='tile'; d.dataset.r=r; d.dataset.c=c;
      const img = document.createElement('img'); img.alt='';
      if(cell && cell.img && cell.img.complete && cell.img.naturalHeight > 0) {
        img.src = cell.img.src;
      } else if(cell && cell.thumb) {
        img.src = IMAGE_PROXY + cell.thumb;
      } else {
        img.style.background='#f0f0f0';
      }
      d.appendChild(img);
      d.addEventListener('click', onTileClick);
      boardEl.appendChild(d);
    }
  }
}

function onTileClick(e){
  const el = e.currentTarget; const r=parseInt(el.dataset.r); const c=parseInt(el.dataset.c);
  if(!selected){ selected = {r,c}; el.style.outline='3px solid #ffd8f0'; return; }
  const prev = selected; selected=null; document.querySelectorAll('.tile').forEach(t=>t.style.outline='');
  if(Math.abs(prev.r-r)+Math.abs(prev.c-c)===1){ // adjacent -> swap
    swap(prev.r,prev.c,r,c); moves++; document.getElementById('moves').textContent=moves; 
    if(!resolveMatches()){ // if no match, swap back
      setTimeout(()=>swap(prev.r,prev.c,r,c),150);
    }
  }
}

function swap(r1,c1,r2,c2){ const i1=idx(r1,c1), i2=idx(r2,c2); [board[i1],board[i2]]=[board[i2],board[i1]]; render(); }

function resolveMatches(){
  const toClear = new Set();
  // horizontal
  for(let r=0;r<gridSize;r++){
    let runStart=0;
    for(let c=0;c<=gridSize;c++){
      const a = c<gridSize? (board[idx(r,c)]?.id||null) : null;
      const b = c>0? (board[idx(r,c-1)]?.id||null) : null;
      if(a===b){ /* continue */ } else {
        const runLength = c-runStart;
        if(runLength>=3){ for(let x=runStart;x<c;x++) toClear.add(idx(r,x)); }
        runStart=c;
      }
    }
  }
  // vertical
  for(let c=0;c<gridSize;c++){
    let runStart=0;
    for(let r=0;r<=gridSize;r++){
      const a = r<gridSize? (board[idx(r,c)]?.id||null) : null;
      const b = r>0? (board[idx(r-1,c)]?.id||null) : null;
      if(a===b){} else { const runLength=r-runStart; if(runLength>=3){ for(let y=runStart;y<r;y++) toClear.add(idx(y,c)); } runStart=r; }
    }
  }
  if(toClear.size===0) return false;
  score += toClear.size*10; document.getElementById('score').textContent=score;
  // clear and gravity
  const cols = Array.from({length:gridSize},()=>[]);
  for(let c=0;c<gridSize;c++){
    for(let r=gridSize-1;r>=0;r--){ const i=idx(r,c); if(!toClear.has(i)) cols[c].push(board[i]); }
    while(cols[c].length<gridSize){ cols[c].push(randomCell()); }
  }
  // write back
  for(let c=0;c<gridSize;c++){
    for(let r=gridSize-1;r>=0;r--){ board[idx(r,c)] = cols[c][gridSize-1-r]; }
  }
  render();
  // cascade additional matches
  setTimeout(()=>{ if(resolveMatches()){} },200);
  return true;
}

function randomCell(){ const g = collection[Math.floor(Math.random()*collection.length)]; return {id:g.id, thumb:g.thumbnail, img:g.image}; }

async function fetchCollection(user){
  const res = await fetch(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(user)}&own=1`);
  if(!res.ok) throw new Error('Collection fetch failed');
  const txt = await res.text(); const doc = new DOMParser().parseFromString(txt,'text/xml');
  const items = Array.from(doc.querySelectorAll('item')).map(it=>({ id: it.getAttribute('objectid'), thumbnail: it.querySelector('thumbnail')?.textContent || it.querySelector('image')?.textContent || '' } )).filter(x=>x.thumbnail);
  return items;
}

async function preloadForCount(items,count){
  for(let i=0;i<Math.min(items.length,count);i++){ const g=items[i]; g.image = new Image(); g.image.crossOrigin='Anonymous'; g.image.src = IMAGE_PROXY+g.thumbnail; }
}

loadBtn.addEventListener('click', async ()=>{
  const user = usernameInput.value.trim(); if(!user) return alert('Enter username');
  loadBtn.disabled = true; loadBtn.textContent='Loading...';
  try{
    const items = await fetchCollection(user);
    if(items.length<6) throw new Error('Need at least 6 images in collection');
    collection = items;
    await preloadForCount(collection,40);
    // init board
    board = Array.from({length:gridSize*gridSize},()=>randomCell()); score=0;moves=0; document.getElementById('score').textContent=0; document.getElementById('moves').textContent=0;
    render();
    // auto-clear initial matches to avoid starting matches
    setTimeout(()=>{ while(resolveMatches()){} },100);
  }catch(e){ alert(e.message); }
  loadBtn.disabled=false; loadBtn.textContent='Load';
});

document.getElementById('shuffleBtn').addEventListener('click', ()=>{ board = board.sort(()=>Math.random()-0.5); render(); });
document.getElementById('resetBtn').addEventListener('click', ()=>{ board = Array.from({length:gridSize*gridSize},()=>randomCell()); score=0;moves=0;document.getElementById('score').textContent=0;document.getElementById('moves').textContent=0; render(); });

// init empty board with placeholders
for(let i=0;i<gridSize*gridSize;i++) board.push({id:null,thumbnail:null,image:null}); render();
</script>
</body>
</html>
