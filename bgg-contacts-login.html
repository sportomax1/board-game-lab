<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BGG Contacts</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#07111f;color:#f4f7fb;font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh}
    #login{max-width:520px;margin:0 auto;padding:64px 16px}
    .box{background:#0b1726;border:1px solid #30445f;border-radius:15px;padding:18px}
    h2{margin:0 0 14px}
    input,button{width:100%;font:inherit;border:1px solid #30445f;border-radius:8px;padding:11px;background:#101e30;color:#fff}
    input{display:block;position:relative;pointer-events:auto;user-select:text;-webkit-user-select:text}
    button{margin-top:9px;background:#1677ff;border-color:#3b8cff;font-weight:700;cursor:pointer}
    #err{min-height:20px;margin-top:8px;color:#ff9bad;font-size:12px}
    #app{display:none;width:100%;height:100vh;border:0;background:#07111f}
  </style>
</head>
<body>
  <section id="login">
    <div class="box">
      <h2>BGG Contacts</h2>
      <input id="accessKey" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Access Key">
      <button id="openBtn" type="button">Unlock Dashboard</button>
      <div id="err"></div>
    </div>
  </section>
  <iframe id="app" title="BGG Contacts dashboard"></iframe>
  <script>
    const keyInput=document.getElementById('accessKey');
    const openBtn=document.getElementById('openBtn');
    const err=document.getElementById('err');
    const login=document.getElementById('login');
    const app=document.getElementById('app');

    async function unlock(){
      const key=keyInput.value.trim();
      if(!key){keyInput.focus();return;}
      openBtn.disabled=true;
      err.textContent='';
      try{
        const expected=await fetch('/api/get-password',{cache:'no-store'}).then(r=>r.text());
        if(key!==expected){err.textContent='Invalid key';keyInput.select();return;}
        localStorage.setItem('app_password_hint',key);
        login.style.display='none';
        app.style.display='block';
        app.onload=()=>{
          try{
            const d=app.contentDocument;
            const pw=d && d.getElementById('pw');
            const btn=d && d.getElementById('unlock');
            if(pw) pw.value=key;
            if(btn) btn.click();
          }catch(e){console.error(e)}
        };
        app.src='/bgg-contacts.html?wrapped=1&v=6';
      }catch(e){
        err.textContent='Could not validate access key';
      }finally{
        openBtn.disabled=false;
      }
    }

    openBtn.addEventListener('click',unlock);
    keyInput.addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
    setTimeout(()=>keyInput.focus(),0);
  </script>
</body>
</html>
