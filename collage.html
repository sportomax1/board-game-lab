<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Board Game Collage</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%234f46e5' width='100' height='100'/><text x='50' y='70' font-size='60' fill='white' text-anchor='middle' font-family='sans-serif' font-weight='bold'>C</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            height: 100%;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            padding-top: env(safe-area-inset-top, 0);
            padding-bottom: env(safe-area-inset-bottom, 0);
            padding-left: env(safe-area-inset-left, 0);
            padding-right: env(safe-area-inset-right, 0);
        }

        .header {
            flex-shrink: 0;
            padding: 1rem;
            border-bottom: 1px solid #eee;
            background: white;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            color: #333;
        }

        .search-section {
            flex-shrink: 0;
            padding: 1rem;
            background: white;
            border-bottom: 1px solid #eee;
        }

        .search-box {
            display: flex;
            gap: 0.5rem;
        }

        .search-input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            -webkit-appearance: none;
            appearance: none;
        }

        .search-input:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .search-btn {
            padding: 0.75rem 1rem;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            min-width: 50px;
        }

        .search-btn:active {
            opacity: 0.9;
            transform: scale(0.98);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 1px solid #eee;
            background: white;
            flex-shrink: 0;
        }

        .tab {
            flex: 1;
            padding: 1rem;
            text-align: center;
            border: none;
            background: white;
            color: #999;
            cursor: pointer;
            font-weight: 600;
            -webkit-appearance: none;
            appearance: none;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }

        .tab.active {
            color: #4f46e5;
            border-bottom-color: #4f46e5;
        }

        .tab:active {
            background: #f5f5f5;
        }

        .tab-content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 1rem;
            display: none;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .search-results {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .search-result-item {
            padding: 1rem;
            background: #f9f9f9;
            border-radius: 8px;
            border: 1px solid #eee;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .search-result-item:active {
            background: #e7f3ff;
            border-color: #4f46e5;
        }

        .result-thumb {
            width: 60px;
            height: 80px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .result-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            touch-action: none;
            pointer-events: none;
        }

        .result-info {
            flex: 1;
            min-width: 0;
        }

        .result-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
            word-break: break-word;
        }

        .result-year {
            font-size: 0.85rem;
            color: #999;
        }

        .grid-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            background: #f9f9f9;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .grid-cell {
            aspect-ratio: 1;
            background: white;
            border: 2px dashed #ddd;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            position: relative;
            transition: all 0.2s;
            -webkit-user-select: none;
            user-select: none;
        }

        .grid-cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .grid-cell.dragging {
            opacity: 0.5;
        }

        .grid-cell.drag-over {
            border-color: #4f46e5;
            background: #f0f0ff;
            transform: scale(0.95);
        }

        .grid-cell-close {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 24px;
            height: 24px;
            background: #ff3b30;
            border-radius: 50%;
            color: white;
            border: none;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            -webkit-appearance: none;
            appearance: none;
            z-index: 10;
        }

        .grid-cell:hover .grid-cell-close {
            display: flex;
        }

        .grid-cell-close:active {
            transform: scale(0.9);
        }

        .actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            flex: 1;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            transition: all 0.2s;
            min-height: 50px;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
        }

        .btn-primary:active {
            opacity: 0.9;
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #eee;
            color: #333;
        }

        .btn-secondary:active {
            background: #ddd;
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            padding: 1rem;
            text-align: center;
            color: #999;
            font-size: 0.9rem;
            background: #f9f9f9;
            border-radius: 8px;
        }

        .no-results {
            text-align: center;
            padding: 2rem 1rem;
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 2rem;
        }

        .spinner {
            display: inline-block;
            width: 1.5rem;
            height: 1.5rem;
            border: 3px solid #f0f0f0;
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .selected-count {
            padding: 0.5rem 1rem;
            background: #f0f0ff;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9rem;
            color: #4f46e5;
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 Collage Maker</h1>
        </div>

        <div class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="Search games..." autocomplete="off">
                <button id="searchBtn" class="search-btn">🔍</button>
                <button id="clearSearchBtn" class="search-btn" style="background: #999;" title="Clear">✕</button>
            </div>
            <div style="display: flex; gap: 0.5rem; margin-top: 0.75rem; flex-wrap: wrap;">
                <button id="searchTypeStarts" class="search-type-btn active" style="flex: 1; padding: 0.5rem; border: 1px solid #ddd; border-radius: 6px; background: #4f46e5; color: white; cursor: pointer; font-size: 0.85rem; font-weight: 600;" title="Search for games that start with the text">Starts With</button>
                <button id="searchTypeContains" class="search-type-btn" style="flex: 1; padding: 0.5rem; border: 1px solid #ddd; border-radius: 6px; background: white; color: #333; cursor: pointer; font-size: 0.85rem; font-weight: 600;" title="Search for games containing the text">Contains</button>
                <button id="searchTypeExact" class="search-type-btn" style="flex: 1; padding: 0.5rem; border: 1px solid #ddd; border-radius: 6px; background: white; color: #333; cursor: pointer; font-size: 0.85rem; font-weight: 600;" title="Search for exact game name match">Exact</button>
            </div>
        </div>

        <div class="main-content">
            <div class="tabs">
                <button class="tab active" data-tab="grid">Grid</button>
                <button class="tab" data-tab="results">Results</button>
            </div>

            <!-- Grid Tab -->
            <div class="tab-content active" id="grid-tab">
                <div class="selected-count" id="selectedCount">0 / 9 selected</div>
                <div class="grid" id="grid"></div>
                <div class="actions">
                    <button class="btn btn-primary" id="generateBtn" disabled>📸 Export</button>
                    <button class="btn btn-secondary" id="clearBtn">🗑️ Clear</button>
                </div>
                <div id="downloadArea"></div>
            </div>

            <!-- Results Tab -->
            <div class="tab-content" id="results-tab">
                <div id="searchStatus" class="status" style="display: none;"></div>
                <div id="searchResults" class="search-results"></div>
            </div>
        </div>
    </div>

    <script>
        let selectedGames = [];
        let searchResults = [];
        let draggedCell = null;
        let searchType = 'starts'; // 'starts', 'contains', 'exact'

        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const grid = document.getElementById('grid');
        const selectedCount = document.getElementById('selectedCount');
        const generateBtn = document.getElementById('generateBtn');
        const clearBtn = document.getElementById('clearBtn');
        const downloadArea = document.getElementById('downloadArea');
        const searchResults_ = document.getElementById('searchResults');
        const searchStatus = document.getElementById('searchStatus');
        const tabs = document.querySelectorAll('.tab');
        const tabContents = document.querySelectorAll('.tab-content');
        const searchTypeButtons = document.querySelectorAll('.search-type-btn');

        // Tab switching
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tabContents.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab + '-tab').classList.add('active');
            });
        });

        // Search type toggle buttons
        document.getElementById('searchTypeStarts').addEventListener('click', () => {
            searchType = 'starts';
            updateSearchTypeButtons();
        });
        document.getElementById('searchTypeContains').addEventListener('click', () => {
            searchType = 'contains';
            updateSearchTypeButtons();
        });
        document.getElementById('searchTypeExact').addEventListener('click', () => {
            searchType = 'exact';
            updateSearchTypeButtons();
        });

        function updateSearchTypeButtons() {
            searchTypeButtons.forEach(btn => {
                btn.style.background = 'white';
                btn.style.color = '#333';
                btn.style.borderColor = '#ddd';
            });
            let activeBtn;
            if (searchType === 'starts') activeBtn = document.getElementById('searchTypeStarts');
            else if (searchType === 'contains') activeBtn = document.getElementById('searchTypeContains');
            else activeBtn = document.getElementById('searchTypeExact');
            if (activeBtn) {
                activeBtn.style.background = '#4f46e5';
                activeBtn.style.color = 'white';
                activeBtn.style.borderColor = '#4f46e5';
            }
        }

        // Search
        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            searchResults_ .innerHTML = '';
            searchStatus.style.display = 'none';
            searchInput.focus();
        });

        async function performSearch() {
            const query = searchInput.value.trim();
            if (!query) {
                searchStatus.textContent = 'Enter a game name.';
                searchStatus.style.display = 'block';
                return;
            }

            searchStatus.innerHTML = '<div class="spinner"></div> Searching...';
            searchStatus.style.display = 'block';
            searchResults_.innerHTML = '';

            try {
                const url = `/api/bgg-helper?endpoint=search&query=${encodeURIComponent(query)}`;
                console.log('Searching with URL:', url);
                
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`Search failed: ${response.status} ${response.statusText}`);
                }
                
                const xmlText = await response.text();
                console.log('Search response length:', xmlText.length);
                
                const xml = new DOMParser().parseFromString(xmlText, 'text/xml');
                
                // Check for parse errors
                if (xml.querySelector('parsererror')) {
                    throw new Error('Invalid XML response from server');
                }
                
                const items = Array.from(xml.querySelectorAll('item[id]'));
                console.log(`Found ${items.length} games matching "${query}" from API`);
                
                if (items.length === 0) {
                    searchStatus.textContent = 'No games found. Try a different search term.';
                    return;
                }

                searchResults = items.map((item, idx) => {
                    const nameEls = item.querySelectorAll('name');
                    let name = 'Unknown';
                    
                    if (nameEls.length > 0) {
                        name = nameEls[0].getAttribute('value')?.trim();
                        if (!name) {
                            name = nameEls[0].textContent?.trim();
                        }
                        if (!name) {
                            name = 'Unknown';
                        }
                    }
                    
                    const year = item.querySelector('yearpublished')?.textContent?.trim() || '';
                    
                    return {
                        id: item.getAttribute('id'),
                        name: name,
                        year: year,
                        thumbnail: null  // Will be fetched later
                    };
                }).filter(game => {
                    const gameName = game.name.toLowerCase();
                    const queryLower = query.toLowerCase();
                    
                    if (searchType === 'starts') {
                        return gameName.startsWith(queryLower);
                    } else if (searchType === 'contains') {
                        return gameName.includes(queryLower);
                    } else if (searchType === 'exact') {
                        return gameName === queryLower;
                    }
                    return true;
                });

                if (searchResults.length === 0) {
                    searchStatus.textContent = `No games found matching "${query}" (${searchType} match).`;
                    return;
                }

                displaySearchResults();
                
                // Fetch thumbnails for all search results in batches
                searchStatus.innerHTML = '<div class="spinner"></div> Loading thumbnails...';
                await fetchThumbnailsForResults();
                
                searchStatus.style.display = 'none';
                
                // Switch to results tab
                document.querySelector('[data-tab="results"]').click();
            } catch (err) {
                console.error('Search error:', err);
                searchStatus.textContent = `❌ Error: ${err.message}. Check console for details.`;
            }
        }

        async function fetchThumbnailsForResults() {
            // Fetch thumbnails in batches with parallel processing (100x faster like weight.html)
            const batchSize = 5;
            const parallelBatches = 100; // Process 100 batches in parallel for faster loading
            let loadedCount = 0;
            
            // Create batches
            const batches = [];
            for (let i = 0; i < searchResults.length; i += batchSize) {
                batches.push(searchResults.slice(i, i + batchSize));
            }
            
            // Process batches in parallel groups
            for (let i = 0; i < batches.length; i += parallelBatches) {
                const batchGroup = batches.slice(i, i + parallelBatches);
                
                await Promise.all(batchGroup.map(async (batch) => {
                    const ids = batch.map(g => g.id).join(',');
                    
                    try {
                        const response = await fetch(`/api/bgg-helper?endpoint=thing&id=${ids}&stats=1`);
                        if (!response.ok) return;
                        
                        const xmlText = await response.text();
                        const xml = new DOMParser().parseFromString(xmlText, 'text/xml');
                        
                        xml.querySelectorAll('item').forEach(item => {
                            const itemId = item.getAttribute('id');
                            const thumbnail = item.querySelector('thumbnail')?.textContent?.trim() || 
                                            item.querySelector('image')?.textContent?.trim() || '';
                            
                            const game = searchResults.find(g => g.id === itemId);
                            if (game && thumbnail) {
                                game.thumbnail = thumbnail;
                                loadedCount++;
                                console.log(`✅ Got thumbnail for ${game.name}`);
                            }
                        });
                    } catch (err) {
                        console.warn('Error fetching batch:', err);
                    }
                }));
                
                // Update display after each parallel group
                displaySearchResults();
                searchStatus.innerHTML = `<div class="spinner"></div> Loading thumbnails... (${loadedCount}/${searchResults.length})`;
                
                // Small delay between parallel groups to avoid rate limiting
                await new Promise(resolve => setTimeout(resolve, 200));
            }
            
            // Final display update
            displaySearchResults();
        }

        function displaySearchResults() {
            searchResults_.innerHTML = searchResults.map((game, idx) => {
                const thumbHTML = game.thumbnail 
                    ? `<img src="${game.thumbnail}" alt="${game.name}" style="width:100%; height:100%; object-fit:cover;" onerror="this.parentElement.innerHTML='🎲'; this.parentElement.style.background='linear-gradient(135deg, #667eea, #764ba2)'; this.parentElement.style.color='white'; this.parentElement.style.fontSize='2rem';">`
                    : '<span style="font-size: 2rem;">🎲</span>';
                
                return `
                    <div class="search-result-item" onclick="selectGame(${idx})" style="cursor: pointer;">
                        <div class="result-thumb" style="${game.thumbnail ? '' : 'background: linear-gradient(135deg, #667eea, #764ba2); color: white; display: flex; align-items: center; justify-content: center;'}">
                            ${thumbHTML}
                        </div>
                        <div class="result-info">
                            <div class="result-name">${game.name}</div>
                            <div class="result-year">${game.year || 'Year unknown'}</div>
                            <div style="font-size: 0.75rem; color: #999; margin-top: 5px;">Click to add to grid →</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function selectGame(idx) {
            if (selectedGames.length >= 9) {
                alert('Maximum 9 games reached!');
                return;
            }
            const game = searchResults[idx];
            
            try {
                // Show loading feedback
                const originalItem = event.target.closest('.search-result-item');
                const originalContent = originalItem.innerHTML;
                originalItem.innerHTML = '<div style="padding: 1rem; text-align: center; color: white;">Loading image...</div>';
                
                // Fetch game details from thing endpoint using our API proxy
                const response = await fetch(`/api/bgg-helper?endpoint=thing&id=${game.id}&stats=1`);
                if (!response.ok) {
                    throw new Error(`Failed to fetch game details: ${response.status}`);
                }

                const xmlText = await response.text();
                const xml = new DOMParser().parseFromString(xmlText, 'text/xml');
                
                // Check for parse errors
                if (xml.querySelector('parsererror')) {
                    throw new Error('Invalid response from server');
                }
                
                const itemEl = xml.querySelector('item');
                if (!itemEl) {
                    throw new Error('Game not found in database');
                }

                // Get image - try multiple sources
                let imageUrl = itemEl.querySelector('image')?.textContent?.trim() || '';
                if (!imageUrl) {
                    imageUrl = itemEl.querySelector('thumbnail')?.textContent?.trim() || '';
                }

                if (!imageUrl) {
                    throw new Error(`No image available for "${game.name}"`);
                }

                // Add to selected games
                selectedGames.push({
                    id: game.id,
                    name: game.name,
                    image: imageUrl
                });
                
                renderGrid();
                updateCount();
                console.log(`✅ Added: ${game.name} with image`);
                
            } catch (err) {
                console.error('Error:', err);
                alert(`❌ Error: ${err.message}`);
            }
        }

        function renderGrid() {
            grid.innerHTML = selectedGames.map((game, idx) => `
                <div class="grid-cell" draggable="true" data-idx="${idx}">
                    <img src="${game.image}" alt="${game.name}" onerror="this.parentElement.innerHTML='<div style=&quot;background:#ddd;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:0.8rem;color:#999;padding:0.5rem;text-align:center;&quot;>${game.name}</div>';">
                    <button class="grid-cell-close" onclick="removeGame(${idx})">✕</button>
                </div>
            `).join('');

            // Add empty cells
            for (let i = selectedGames.length; i < 9; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.innerHTML = '+';
                cell.style.cursor = 'pointer';
                cell.addEventListener('click', () => {
                    document.querySelector('[data-tab="results"]').click();
                });
                grid.appendChild(cell);
            }

            // Drag and drop
            document.querySelectorAll('.grid-cell[data-idx]').forEach(cell => {
                cell.addEventListener('dragstart', (e) => {
                    draggedCell = cell;
                    cell.classList.add('dragging');
                });

                cell.addEventListener('dragend', (e) => {
                    cell.classList.remove('dragging');
                    document.querySelectorAll('.grid-cell').forEach(c => c.classList.remove('drag-over'));
                });

                cell.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    if (draggedCell && draggedCell !== cell) {
                        cell.classList.add('drag-over');
                    }
                });

                cell.addEventListener('dragleave', (e) => {
                    cell.classList.remove('drag-over');
                });

                cell.addEventListener('drop', (e) => {
                    e.preventDefault();
                    if (draggedCell && draggedCell !== cell) {
                        const fromIdx = parseInt(draggedCell.dataset.idx);
                        const toIdx = parseInt(cell.dataset.idx);
                        [selectedGames[fromIdx], selectedGames[toIdx]] = [selectedGames[toIdx], selectedGames[fromIdx]];
                        renderGrid();
                        updateCount();
                    }
                });
            });
        }

        function removeGame(idx) {
            selectedGames.splice(idx, 1);
            renderGrid();
            updateCount();
        }

        function updateCount() {
            selectedCount.textContent = `${selectedGames.length} / 9 selected`;
            generateBtn.disabled = selectedGames.length === 0;
        }

        clearBtn.addEventListener('click', () => {
            selectedGames = [];
            renderGrid();
            updateCount();
            downloadArea.innerHTML = '';
        });

        generateBtn.addEventListener('click', async () => {
            if (selectedGames.length === 0) return;
            
            generateBtn.disabled = true;
            generateBtn.textContent = '⏳ Generating...';

            try {
                const canvas = document.createElement('canvas');
                const cellSize = 200;
                canvas.width = 600;
                canvas.height = 600;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#f5f5f5';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                let idx = 0;
                for (const game of selectedGames) {
                    const row = Math.floor(idx / 3);
                    const col = idx % 3;
                    const x = col * cellSize;
                    const y = row * cellSize;

                    const img = new Image();
                    img.crossOrigin = 'anonymous'; // Allow CORS
                    await new Promise((resolve) => {
                        img.onload = () => {
                            ctx.drawImage(img, x, y, cellSize, cellSize);
                            resolve();
                        };
                        img.onerror = () => {
                            // If image fails, draw placeholder
                            ctx.fillStyle = '#ddd';
                            ctx.fillRect(x, y, cellSize, cellSize);
                            ctx.fillStyle = '#999';
                            ctx.font = '14px Arial';
                            ctx.textAlign = 'center';
                            ctx.fillText(game.name.substring(0, 20), x + cellSize / 2, y + cellSize / 2);
                            resolve();
                        };
                        img.src = game.image;
                    });
                    idx++;
                }

                canvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    downloadArea.innerHTML = `<a href="${url}" download="bgg-collage.png" class="btn btn-primary" style="text-decoration: none; display: flex; align-items: center; justify-content: center;">⬇️ Download PNG</a>`;
                    generateBtn.disabled = false;
                    generateBtn.textContent = '📸 Export';
                });
            } catch (err) {
                alert('Error generating image: ' + err.message);
                generateBtn.disabled = false;
                generateBtn.textContent = '📸 Export';
            }
        });

        renderGrid();
        updateCount();
    </script>
    <!-- Vercel Web Analytics -->
    <script type="module" src="analytics-init.js"></script>

</body>
</html>
