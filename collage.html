<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Collage Maker | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🖼️</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0b1120;
            --surface: #111827;
            --surface2: #1a2236;
            --border: rgba(255,255,255,0.07);
            --border-hover: rgba(255,255,255,0.15);
            --text: #f1f5f9;
            --muted: #64748b;
            --accent: #10b981;
            --accent-dark: #059669;
            --accent-glow: rgba(16,185,129,0.25);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            -webkit-tap-highlight-color: transparent;
        }

        /* ── Layout ── */
        .app-shell {
            display: flex;
            flex-direction: column;
            min-height: 100dvh;
        }

        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .brand-icon {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .brand-text h1 {
            font-size: 15px; font-weight: 800;
            letter-spacing: -0.5px; line-height: 1.1;
            text-transform: uppercase; font-style: italic;
        }
        .brand-text h1 span { color: var(--accent); }
        .brand-text p {
            font-size: 9px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.12em;
            color: var(--muted); margin-top: 2px;
        }

        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ── Desktop: side-by-side ── */
        .left-panel {
            width: 340px;
            flex-shrink: 0;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Mobile: tabs ── */
        .mobile-tabs {
            display: none;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }
        .mobile-tab {
            flex: 1;
            padding: 12px 8px;
            font-size: 9px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.12em;
            color: var(--muted);
            background: none; border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s;
        }
        .mobile-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            background: rgba(16,185,129,0.04);
        }

        @media (max-width: 700px) {
            .mobile-tabs { display: flex; }
            .left-panel {
                width: 100%;
                border-right: none;
                display: none;
            }
            .right-panel {
                display: none;
            }
            .left-panel.mob-active { display: flex; }
            .right-panel.mob-active { display: flex; }
        }

        /* ── Panel inner scroll ── */
        .panel-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        .panel-scroll::-webkit-scrollbar { width: 4px; }
        .panel-scroll::-webkit-scrollbar-track { background: transparent; }
        .panel-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

        /* ── Search Section ── */
        .search-box {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            display: flex;
            gap: 8px;
        }

        .search-input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 9px 12px;
            font-size: 12px;
            color: var(--text);
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input::placeholder { color: var(--muted); }
        .search-input:focus { border-color: var(--accent); }

        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 6px;
            padding: 9px 16px;
            border-radius: 10px;
            font-size: 10px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.1em;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s, transform 0.1s;
            font-family: inherit;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: #fff;
            box-shadow: 0 3px 10px var(--accent-glow);
        }
        .btn-primary:hover { opacity: 0.9; }
        .btn-ghost {
            background: var(--surface2);
            color: var(--muted);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { color: var(--text); border-color: var(--border-hover); }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn:disabled:active { transform: none; }

        /* ── Search Results ── */
        .results-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .result-item {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }
        .result-item:hover {
            border-color: var(--accent);
            background: rgba(16,185,129,0.05);
        }
        .result-item:active { transform: scale(0.99); }

        .result-thumb {
            width: 44px; height: 56px;
            border-radius: 8px;
            background: var(--bg);
            border: 1px solid var(--border);
            overflow: hidden;
            flex-shrink: 0;
        }
        .result-thumb img { width: 100%; height: 100%; object-fit: cover; }

        .result-info { flex: 1; min-width: 0; }
        .result-name {
            font-size: 11px; font-weight: 800;
            text-transform: uppercase; letter-spacing: -0.2px;
            font-style: italic;
            color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .result-year {
            font-size: 9px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.1em;
            color: var(--muted); margin-top: 3px;
        }

        .result-add {
            font-size: 8px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 0.12em;
            color: var(--accent);
            flex-shrink: 0;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
            font-size: 10px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.12em;
        }

        /* ── Grid Panel Header ── */
        .panel-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .panel-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .count-badge {
            font-size: 10px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.1em;
            color: var(--accent);
        }

        /* ── Grid Size Selector ── */
        .size-selector {
            display: flex;
            gap: 4px;
        }
        .size-btn {
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 9px; font-weight: 800;
            letter-spacing: 0.06em;
            cursor: pointer;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--muted);
            font-family: inherit;
            transition: all 0.2s;
        }
        .size-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .size-btn:hover:not(.active) { border-color: var(--border-hover); color: var(--text); }

        /* ── Collage Grid ── */
        .grid-wrap {
            padding: 16px;
        }

        .collage-grid {
            display: grid;
            gap: 6px;
        }
        .collage-grid.size-2 { grid-template-columns: repeat(2, 1fr); }
        .collage-grid.size-3 { grid-template-columns: repeat(3, 1fr); }
        .collage-grid.size-4 { grid-template-columns: repeat(4, 1fr); }

        .grid-cell {
            aspect-ratio: 1;
            border-radius: 10px;
            border: 2px dashed rgba(255,255,255,0.1);
            background: var(--surface2);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            transition: border-color 0.2s;
        }
        .grid-cell:hover { border-color: rgba(255,255,255,0.2); }
        .grid-cell.has-image { border-style: solid; border-color: rgba(255,255,255,0.06); cursor: grab; }
        .grid-cell.has-image:active { cursor: grabbing; }
        .grid-cell.drag-over { border-color: var(--accent) !important; background: rgba(16,185,129,0.12) !important; }
        .grid-cell img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; display: block; }

        .cell-plus {
            font-size: 20px;
            color: rgba(255,255,255,0.15);
        }

        .remove-btn {
            position: absolute;
            top: -5px; right: -5px;
            width: 20px; height: 20px;
            background: #ef4444;
            color: #fff;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 9px; font-weight: 900;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            border: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            z-index: 5;
        }
        .grid-cell:hover .remove-btn { opacity: 1; }

        /* ── Generate / Download ── */
        .action-bar {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            background: var(--surface);
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .download-area {
            margin: 0 16px 16px;
            background: var(--surface2);
            border: 1px solid rgba(16,185,129,0.2);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .download-area.hidden { display: none; }

        .download-label {
            font-size: 9px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.2em;
            color: var(--accent);
        }

        .download-preview {
            max-width: 260px;
            width: 100%;
            border-radius: 10px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }

        .btn-download {
            width: 100%;
            padding: 11px;
            background: #fff;
            color: #0f172a;
            border-radius: 10px;
            font-size: 10px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 0.12em;
            text-align: center;
            text-decoration: none;
            display: block;
            max-width: 260px;
            transition: opacity 0.2s;
        }
        .btn-download:hover { opacity: 0.88; }

        /* ── Status ── */
        .status-msg {
            padding: 10px 16px;
            font-size: 10px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.12em;
            color: var(--accent);
            text-align: center;
            display: none;
        }
        .status-msg.visible { display: block; }

        /* ── Spinner ── */
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        /* ── Bg decor ── */
        .bg-decor {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 0; overflow: hidden;
        }
        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
        }
    </style>
</head>
<body>
    <div class="bg-decor">
        <div class="bg-blob" style="top:-10%;left:-10%;width:40%;height:40%;background:rgba(16,185,129,0.06)"></div>
        <div class="bg-blob" style="bottom:5%;right:-5%;width:45%;height:45%;background:rgba(59,130,246,0.05)"></div>
    </div>

    <div class="app-shell" style="position:relative;z-index:1">
        <header>
            <div class="brand-icon">🖼️</div>
            <div class="brand-text">
                <h1>Collage <span>Maker</span></h1>
                <p>Build BGG Game Posters</p>
            </div>
        </header>

        <!-- Mobile tabs -->
        <div class="mobile-tabs">
            <button class="mobile-tab active" id="mob-tab-search" onclick="mobSwitchTab('search')">
                Search
            </button>
            <button class="mobile-tab" id="mob-tab-grid" onclick="mobSwitchTab('grid')">
                Grid <span id="mobCountBadge">(0)</span>
            </button>
        </div>

        <div class="main-content">
            <!-- LEFT: Search -->
            <div class="left-panel mob-active" id="panel-search">
                <div class="search-box">
                    <input type="text" id="searchInput" class="search-input" placeholder="Search BoardGameGeek…" onkeydown="if(event.key==='Enter') performSearch()">
                    <button class="btn btn-primary" onclick="performSearch()" id="searchBtn">Search</button>
                </div>
                <div class="panel-scroll">
                    <div id="resultsList" class="results-list">
                        <div class="empty-state">Search for a game to begin</div>
                    </div>
                </div>
            </div>

            <!-- RIGHT: Grid builder -->
            <div class="right-panel" id="panel-grid">
                <div class="panel-header">
                    <div class="panel-header-left" style="flex:1;min-width:0">
                        <span class="count-badge" id="countBadge">0 / 9</span>
                        <div class="size-selector">
                            <button class="size-btn" onclick="setGridSize(2)">2×2</button>
                            <button class="size-btn active" onclick="setGridSize(3)">3×3</button>
                            <button class="size-btn" onclick="setGridSize(4)">4×4</button>
                        </div>
                    </div>
                    <div style="display:flex;gap:6px;align-items:center;flex-shrink:0">
                        <button class="btn btn-ghost" onclick="clearGrid()" style="padding:5px 12px">Clear</button>
                        <button class="btn btn-primary" id="generateBtn" onclick="generateCollage()" disabled>Generate Poster</button>
                        <a id="downloadLink" download="bgg-collage.png" class="btn btn-ghost" style="display:none;text-decoration:none">Save PNG</a>
                    </div>
                </div>

                <div class="panel-scroll" id="gridScrollArea">
                    <div class="grid-wrap">
                        <div class="collage-grid size-3" id="collageGrid"></div>
                    </div>
                    <div id="statusMsg" class="status-msg"></div>
                    <div id="downloadArea" class="download-area hidden">
                        <p class="download-label">Poster Ready</p>
                        <img id="collagePreview" class="download-preview">
                    </div>
                </div>


            </div>
        </div>
    </div>

    <script>
        const IMAGE_PROXY = 'https://images.weserv.nl/?url=';
        let selectedGames = [];
        let searchResults = [];
        let gridSize = 3;
        let totalCells = 9;
        let dragIdx = null;

        // ── Mobile tab switching ──
        function mobSwitchTab(tab) {
            const panelSearch = document.getElementById('panel-search');
            const panelGrid = document.getElementById('panel-grid');
            document.getElementById('mob-tab-search').classList.toggle('active', tab === 'search');
            document.getElementById('mob-tab-grid').classList.toggle('active', tab === 'grid');
            panelSearch.classList.toggle('mob-active', tab === 'search');
            panelGrid.classList.toggle('mob-active', tab === 'grid');
        }

        // ── Grid size ──
        function setGridSize(size) {
            gridSize = size;
            totalCells = size * size;

            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            const grid = document.getElementById('collageGrid');
            grid.className = `collage-grid size-${size}`;

            // Trim selected games if more than new capacity
            if (selectedGames.length > totalCells) {
                selectedGames = selectedGames.slice(0, totalCells);
            }

            updateGrid();
        }

        // ── Search ──
        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const btn = document.getElementById('searchBtn');
            btn.innerHTML = '<span class="spinner"></span>';
            btn.disabled = true;

            const list = document.getElementById('resultsList');
            list.innerHTML = '<div class="empty-state" style="color:var(--accent)">Querying BoardGameGeek…</div>';

            try {
                const res = await fetch(`/api/bgg-helper?endpoint=search&query=${encodeURIComponent(query)}`);
                const xml = await res.text();
                const doc = new DOMParser().parseFromString(xml, 'text/xml');
                const items = Array.from(doc.querySelectorAll('item'));

                searchResults = items.map(item => ({
                    id: item.getAttribute('id'),
                    name: item.querySelector('name')?.getAttribute('value') || 'Unknown',
                    year: item.querySelector('yearpublished')?.getAttribute('value') || ''
                })).slice(0, 100);

                if (searchResults.length === 0) {
                    list.innerHTML = '<div class="empty-state" style="color:#f87171">No matches found</div>';
                    return;
                }

                await fetchThumbnails();
                renderResults();
            } catch(e) {
                list.innerHTML = '<div class="empty-state" style="color:#f87171">Search failed — try again</div>';
            } finally {
                btn.innerHTML = 'Search';
                btn.disabled = false;
            }
        }

        async function fetchThumbnails() {
            const ids = searchResults.map(r => r.id);
            const BATCH = 20;
            for (let i = 0; i < ids.length; i += BATCH) {
                const chunk = ids.slice(i, i + BATCH).join(',');
                try {
                    const res = await fetch(`/api/bgg-helper?endpoint=thing&id=${chunk}`);
                    const xml = await res.text();
                    const doc = new DOMParser().parseFromString(xml, 'text/xml');
                    doc.querySelectorAll('item').forEach(item => {
                        const id = item.getAttribute('id');
                        const thumb = item.querySelector('thumbnail')?.textContent;
                        const game = searchResults.find(r => r.id === id);
                        if (game && thumb) game.thumb = thumb;
                    });
                } catch(e) {}
            }
        }

        function escHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderResults() {
            const list = document.getElementById('resultsList');
            if (searchResults.length === 0) {
                list.innerHTML = '<div class="empty-state">No results</div>';
                return;
            }
            list.innerHTML = searchResults.map(g => `
                <div class="result-item" onclick="addGame('${escHtml(g.id)}')">
                    <div class="result-thumb">
                        ${g.thumb ? `<img src="${IMAGE_PROXY}${encodeURIComponent(g.thumb)}" loading="lazy">` : ''}
                    </div>
                    <div class="result-info">
                        <div class="result-name">${escHtml(g.name)}</div>
                        <div class="result-year">${escHtml(g.year)}</div>
                    </div>
                    <div class="result-add">+ Add</div>
                </div>
            `).join('');
        }

        // ── Game selection ──
        function addGame(id) {
            if (selectedGames.length >= totalCells) {
                // On mobile, show grid tab so user can see it's full
                mobSwitchTab('grid');
                showStatus('Grid is full! Clear a spot first.');
                return;
            }
            const game = searchResults.find(g => g.id === id);
            if (!game) return;
            selectedGames.push(game);
            updateGrid();
            mobSwitchTab('grid');
        }

        function removeGame(idx) {
            selectedGames.splice(idx, 1);
            updateGrid();
        }

        function clearGrid() {
            selectedGames = [];
            updateGrid();
            document.getElementById('downloadArea').classList.add('hidden');
            document.getElementById('downloadLink').style.display = 'none';
            hideStatus();
        }

        function updateGrid() {
            const container = document.getElementById('collageGrid');
            container.innerHTML = '';

            for (let i = 0; i < totalCells; i++) {
                const game = selectedGames[i];
                const cell = document.createElement('div');
                cell.className = `grid-cell${game ? ' has-image' : ''}`;

                if (game) {
                    cell.innerHTML = `
                        ${game.thumb ? `<img src="${IMAGE_PROXY}${encodeURIComponent(game.thumb)}" loading="lazy">` : ''}
                        <button class="remove-btn" onclick="event.stopPropagation(); removeGame(${i})">✕</button>
                    `;
                    cell.setAttribute('draggable', 'true');
                    const idx = i;
                    cell.addEventListener('dragstart', () => { dragIdx = idx; cell.style.opacity = '0.4'; });
                    cell.addEventListener('dragend', () => {
                        cell.style.opacity = '';
                        dragIdx = null;
                        document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
                    });
                    cell.addEventListener('dragover', e => { e.preventDefault(); if (dragIdx !== idx) cell.classList.add('drag-over'); });
                    cell.addEventListener('dragleave', () => cell.classList.remove('drag-over'));
                    cell.addEventListener('drop', e => {
                        e.preventDefault();
                        cell.classList.remove('drag-over');
                        if (dragIdx !== null && dragIdx !== idx) {
                            const tmp = selectedGames[dragIdx];
                            selectedGames[dragIdx] = selectedGames[idx];
                            selectedGames[idx] = tmp;
                            updateGrid();
                        }
                    });
                } else {
                    cell.innerHTML = `<span class="cell-plus">+</span>`;
                    cell.addEventListener('dragover', e => { e.preventDefault(); cell.classList.add('drag-over'); });
                    cell.addEventListener('dragleave', () => cell.classList.remove('drag-over'));
                    cell.addEventListener('drop', e => {
                        e.preventDefault();
                        cell.classList.remove('drag-over');
                        if (dragIdx !== null) {
                            const g = selectedGames.splice(dragIdx, 1)[0];
                            selectedGames.push(g);
                            updateGrid();
                        }
                    });
                    cell.onclick = () => mobSwitchTab('search');
                }

                container.appendChild(cell);
            }

            const count = selectedGames.length;
            document.getElementById('countBadge').textContent = `${count} / ${totalCells}`;
            document.getElementById('mobCountBadge').textContent = `(${count})`;
            document.getElementById('generateBtn').disabled = count < 1;
        }

        // ── Status messages ──
        function showStatus(msg) {
            const el = document.getElementById('statusMsg');
            el.textContent = msg;
            el.classList.add('visible');
        }
        function hideStatus() {
            document.getElementById('statusMsg').classList.remove('visible');
        }

        // ── Generate collage ──
        async function generateCollage() {
            const btn = document.getElementById('generateBtn');
            btn.innerHTML = '<span class="spinner"></span> Generating…';
            btn.disabled = true;
            hideStatus();
            document.getElementById('downloadArea').classList.add('hidden');

            const cellPx = 400;
            const canvas = document.createElement('canvas');
            canvas.width = gridSize * cellPx;
            canvas.height = gridSize * cellPx;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#0b1120';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let loaded = 0, failed = 0;

            for (let i = 0; i < selectedGames.length; i++) {
                const g = selectedGames[i];
                const col = i % gridSize;
                const row = Math.floor(i / gridSize);
                const x = col * cellPx, y = row * cellPx;

                if (!g.thumb) { failed++; continue; }

                await new Promise(resolve => {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => {
                        const scale = Math.min(cellPx / img.naturalWidth, cellPx / img.naturalHeight);
                        const w = img.naturalWidth * scale;
                        const h = img.naturalHeight * scale;
                        const dx = x + (cellPx - w) / 2;
                        const dy = y + (cellPx - h) / 2;
                        ctx.drawImage(img, dx, dy, w, h);
                        loaded++;
                        resolve();
                    };
                    img.onerror = () => { failed++; resolve(); };
                    img.src = `${IMAGE_PROXY}${encodeURIComponent(g.thumb)}`;
                });
            }

            if (loaded === 0) {
                showStatus('Could not load any images. Check your connection.');
                btn.innerHTML = 'Generate Poster';
                btn.disabled = false;
                return;
            }

            const dataUrl = canvas.toDataURL('image/png');
            document.getElementById('collagePreview').src = dataUrl;
            const dl = document.getElementById('downloadLink');
            dl.href = dataUrl;
            dl.style.display = '';
            document.getElementById('downloadArea').classList.remove('hidden');

            if (failed > 0) showStatus(`${failed} image(s) failed to load.`);

            btn.innerHTML = 'Generate Poster';
            btn.disabled = false;

            // Scroll to download area
            document.getElementById('downloadArea').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // ── Init ──
        updateGrid();
    </script>
    <script type="module" src="analytics-init.js"></script>
</body>
