<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Collage Maker | Sportomax</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='70'>🖼️</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
            height: 100dvh;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-dark {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tab-btn {
            @apply flex-1 py-3 text-[10px] font-black uppercase tracking-widest transition-all border-b-2 border-transparent text-slate-500;
        }
        .tab-btn.active {
            @apply border-emerald-500 text-emerald-400 bg-emerald-500/5;
        }

        .grid-cell {
            aspect-ratio: 1;
            @apply glass rounded-2xl border-2 border-dashed border-white/10 flex items-center justify-center text-2xl text-slate-700 cursor-pointer transition-all overflow-hidden relative;
        }
        .grid-cell.has-image { @apply border-solid border-white/5; }
        .grid-cell img { @apply w-full h-full object-cover pointer-events-none; }
        
        .remove-btn {
            @apply absolute -top-1 -right-1 w-6 h-6 bg-rose-500 text-white rounded-full flex items-center justify-center text-xs font-black shadow-lg opacity-0 transition-opacity;
        }
        .grid-cell:hover .remove-btn { @apply opacity-100; }

        .search-item {
            @apply glass rounded-2xl p-3 border border-white/5 flex items-center gap-4 cursor-pointer transition-all active:scale-95;
        }
        .search-item:hover { @apply border-emerald-500/30 bg-white/5; }

        .btn-primary {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }

        .view { display: none; height: 100%; flex-direction: column; }
        .view.active { display: flex; }
    </style>
</head>
<body class="selection:bg-emerald-500/30">
    <!-- Background Decor -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-emerald-900/20 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[10%] right-[0%] w-[50%] h-[50%] bg-blue-900/10 blur-[120px] rounded-full"></div>
    </div>

    <div class="relative z-10 flex flex-col h-full pt-safe">
        <!-- Header -->
        <header class="p-6 flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-white/5">
            <div class="flex flex-col">
                <h1 class="text-2xl font-black italic uppercase tracking-tighter leading-none text-white">Collage <span class="text-emerald-400">Maker</span></h1>
                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-1">Create 3x3 Game Posters</p>
            </div>
            <div class="flex items-center gap-2">
                <input type="text" id="searchInput" class="glass px-4 py-2 rounded-xl text-xs text-white focus:outline-none focus:ring-1 focus:ring-emerald-500/50 w-48" placeholder="Search BGG...">
                <button onclick="performSearch()" class="btn-primary px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest">Search</button>
            </div>
        </header>

        <!-- Tabs -->
        <div class="flex border-b border-white/5 bg-black/20">
            <button onclick="switchTab('grid')" id="tab-grid" class="tab-btn active">The Grid <span id="countLabel">(0/9)</span></button>
            <button onclick="switchTab('results')" id="tab-results" class="tab-btn">Search Results</button>
        </div>

        <!-- Views -->
        <main class="flex-1 min-h-0 relative">
            <!-- Grid View -->
            <div id="view-grid" class="view active p-6 overflow-y-auto custom-scrollbar">
                <div class="max-w-xl mx-auto w-full space-y-8">
                    <div class="grid grid-cols-3 gap-3" id="collageGrid">
                        <!-- 9 cells generated by JS -->
                    </div>

                    <div class="flex gap-3">
                        <button id="generateBtn" onclick="generateCollage()" disabled class="flex-1 btn-primary py-4 rounded-2xl font-black text-xs uppercase tracking-widest disabled:opacity-30 disabled:grayscale transition-all">Generate Image</button>
                        <button onclick="clearGrid()" class="px-6 rounded-2xl glass border-white/10 text-slate-500 hover:text-white transition-all text-xs font-black uppercase tracking-widest">Clear</button>
                    </div>

                    <div id="downloadArea" class="hidden animate-in">
                        <div class="glass p-6 rounded-[2rem] border-emerald-500/20 flex flex-col items-center gap-4">
                            <p class="text-[10px] font-bold text-emerald-400 uppercase tracking-[0.2em]">Poster Ready</p>
                            <img id="collagePreview" class="w-full max-w-[300px] rounded-xl shadow-2xl border border-white/10">
                            <a id="downloadLink" download="bgg-collage.png" class="w-full text-center py-3 bg-white text-slate-900 rounded-xl font-black text-[10px] uppercase tracking-widest">Download PNG</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Results View -->
            <div id="view-results" class="view p-6 overflow-y-auto custom-scrollbar">
                <div id="resultsList" class="max-w-2xl mx-auto w-full space-y-3">
                    <div class="text-center py-20 text-slate-600 italic uppercase text-[10px] font-bold tracking-widest">Search for a game to begin</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let selectedGames = [];
        let searchResults = [];
        const IMAGE_PROXY = 'https://images.weserv.nl/?url=';

        function switchTab(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`view-${id}`).classList.add('active');
            document.getElementById(`tab-${id}`).classList.add('active');
        }

        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if(!query) return;
            
            switchTab('results');
            const list = document.getElementById('resultsList');
            list.innerHTML = '<div class="text-center py-20 text-emerald-500 animate-pulse font-black uppercase text-[10px] tracking-widest">Querying BoardGameGeek...</div>';

            try {
                const res = await fetch(`/api/bgg-helper?endpoint=search&query=${encodeURIComponent(query)}`);
                const xml = await res.text();
                const doc = new DOMParser().parseFromString(xml, 'text/xml');
                const items = Array.from(doc.querySelectorAll('item'));

                searchResults = items.map(item => ({
                    id: item.getAttribute('id'),
                    name: item.querySelector('name')?.getAttribute('value') || 'Unknown',
                    year: item.querySelector('yearpublished')?.getAttribute('value') || ''
                })).slice(0, 20);

                if(searchResults.length === 0) {
                    list.innerHTML = '<div class="text-center py-20 text-rose-400 font-bold uppercase text-[10px]">No matches found</div>';
                    return;
                }

                await fetchThumbnails();
                renderResults();
            } catch(e) { list.innerHTML = '<div class="text-center py-20 text-rose-500 font-bold uppercase text-[10px]">Search Failed</div>'; }
        }

        async function fetchThumbnails() {
            const ids = searchResults.map(r => r.id).join(',');
            try {
                const res = await fetch(`/api/bgg-helper?endpoint=thing&id=${ids}`);
                const xml = await res.text();
                const doc = new DOMParser().parseFromString(xml, 'text/xml');
                doc.querySelectorAll('item').forEach(item => {
                    const id = item.getAttribute('id');
                    const thumb = item.querySelector('thumbnail')?.textContent;
                    const game = searchResults.find(r => r.id === id);
                    if(game) game.thumb = thumb;
                });
            } catch(e) {}
        }

        function renderResults() {
            const list = document.getElementById('resultsList');
            list.innerHTML = searchResults.map(g => `
                <div class="search-item" onclick="addGame('${g.id}')">
                    <div class="w-12 h-16 rounded-lg bg-black/40 border border-white/5 flex-shrink-0 overflow-hidden">
                        <img src="${IMAGE_PROXY}${encodeURIComponent(g.thumb)}" class="w-full h-full object-cover">
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="text-xs font-black text-white italic uppercase tracking-tighter truncate">${g.name}</div>
                        <div class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mt-1">${g.year}</div>
                    </div>
                    <div class="text-[8px] font-black text-emerald-500 uppercase tracking-widest">+ Add</div>
                </div>
            `).join('');
        }

        function addGame(id) {
            if(selectedGames.length >= 9) return alert('Grid is full!');
            const game = searchResults.find(g => g.id === id);
            selectedGames.push(game);
            updateGrid();
            switchTab('grid');
        }

        function removeGame(idx) {
            selectedGames.splice(idx, 1);
            updateGrid();
        }

        function updateGrid() {
            const container = document.getElementById('collageGrid');
            container.innerHTML = '';
            
            for(let i = 0; i < 9; i++) {
                const game = selectedGames[i];
                const cell = document.createElement('div');
                cell.className = `grid-cell ${game ? 'has-image' : ''}`;
                if(game) {
                    cell.innerHTML = `
                        <img src="${IMAGE_PROXY}${encodeURIComponent(game.thumb)}">
                        <button class="remove-btn" onclick="event.stopPropagation(); removeGame(${i})">✕</button>
                    `;
                } else {
                    cell.innerHTML = '+';
                    cell.onclick = () => switchTab('results');
                }
                container.appendChild(cell);
            }

            document.getElementById('countLabel').textContent = `(${selectedGames.length}/9)`;
            document.getElementById('generateBtn').disabled = selectedGames.length < 1;
        }

        function clearGrid() {
            selectedGames = [];
            updateGrid();
            document.getElementById('downloadArea').classList.add('hidden');
        }

        async function generateCollage() {
            const btn = document.getElementById('generateBtn');
            btn.textContent = 'Wait...';
            btn.disabled = true;

            const canvas = document.createElement('canvas');
            canvas.width = 1200; canvas.height = 1200;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, 1200, 1200);

            for(let i = 0; i < selectedGames.length; i++) {
                const g = selectedGames[i];
                const x = (i % 3) * 400;
                const y = Math.floor(i / 3) * 400;
                
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.src = `${IMAGE_PROXY}${encodeURIComponent(g.thumb)}`;
                
                await new Promise(r => {
                    img.onload = () => {
                        ctx.drawImage(img, x, y, 400, 400);
                        r();
                    };
                    img.onerror = r;
                });
            }

            const dataUrl = canvas.toDataURL('image/png');
            document.getElementById('collagePreview').src = dataUrl;
            document.getElementById('downloadLink').href = dataUrl;
            document.getElementById('downloadArea').classList.remove('hidden');
            btn.textContent = 'Generate Image';
            btn.disabled = false;
        }

        updateGrid();
    </script>
    <script type="module" src="analytics-init.js"></script>
</body>
</html>
