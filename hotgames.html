<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Hot Games | Sportomax</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .game-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .game-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .rank-badge {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .loading-pulse {
            animation: pulse-soft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="min-h-screen selection:bg-orange-500/30">
    <!-- Background Decor -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-orange-900/20 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[10%] right-[0%] w-[50%] h-[50%] bg-blue-900/10 blur-[120px] rounded-full"></div>
    </div>

    <div class="relative z-10 max-w-6xl mx-auto px-4 py-8 md:py-12">
        <!-- Header -->
        <header class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-12">
            <div class="space-y-2">
                <div class="flex items-center gap-3">
                    <span class="text-3xl md:text-4xl">🔥</span>
                    <h1 class="text-4xl md:text-5xl font-black italic uppercase tracking-tighter leading-none">
                        Hot <span class="text-orange-500">Games</span>
                    </h1>
                </div>
                <p class="text-slate-400 font-medium max-w-md">The most popular and trending board games on BoardGameGeek right now.</p>
            </div>
            
            <div class="flex items-center gap-3">
                <div id="statusBadge" class="hidden glass px-4 py-2 rounded-2xl border border-white/10">
                    <span id="gameCount" class="text-xs font-black uppercase tracking-widest text-slate-400">0 Games</span>
                </div>
                <a href="index.html" class="glass px-6 py-2 rounded-2xl border border-white/10 hover:bg-white/10 transition-all text-sm font-bold uppercase tracking-widest flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                    Back
                </a>
            </div>
        </header>

        <!-- Loading State -->
        <div id="loading" class="flex flex-col items-center justify-center py-20 space-y-6">
            <div class="relative">
                <div class="w-20 h-20 border-4 border-orange-500/20 border-t-orange-500 rounded-full animate-spin"></div>
                <div class="absolute inset-0 flex items-center justify-center text-2xl">🎲</div>
            </div>
            <p class="text-slate-500 font-black uppercase tracking-[0.2em] text-xs loading-pulse">Fetching Trends</p>
        </div>

        <!-- Content Grid -->
        <div id="cardsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>

        <!-- Empty State -->
        <div id="noResults" class="hidden flex flex-col items-center justify-center py-20 space-y-4">
            <span class="text-6xl">🏜️</span>
            <p class="text-slate-400 font-bold italic">No hot games found at the moment.</p>
            <button onclick="fetchHotGames()" class="text-orange-500 font-black uppercase tracking-widest text-xs hover:text-orange-400 transition-colors">Try Refreshing</button>
        </div>
    </div>

    <script>
        const cardsContainer = document.getElementById('cardsContainer');
        const loading = document.getElementById('loading');
        const noResults = document.getElementById('noResults');
        const statusBadge = document.getElementById('statusBadge');
        const gameCount = document.getElementById('gameCount');

        async function fetchHotGames() {
            try {
                loading.classList.remove('hidden');
                cardsContainer.classList.add('hidden');
                noResults.classList.add('hidden');
                statusBadge.classList.add('hidden');
                
                const resp = await fetch('/api/bgg-helper?endpoint=hot&type=boardgame');
                if (!resp.ok) throw new Error('Failed to fetch hot games');
                
                const xml = await resp.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(xml, 'text/xml');
                
                if (doc.documentElement.tagName === 'parsererror') {
                    throw new Error('Failed to parse BGG response');
                }
                
                const items = Array.from(doc.querySelectorAll('item'));
                
                if (items.length === 0) {
                    loading.classList.add('hidden');
                    noResults.classList.remove('hidden');
                    return;
                }
                
                loading.classList.add('hidden');
                cardsContainer.innerHTML = '';
                cardsContainer.classList.remove('hidden');
                statusBadge.classList.remove('hidden');
                gameCount.textContent = `${items.length} Trending`;
                
                items.forEach((item, index) => {
                    const rank = item.getAttribute('rank');
                    const id = item.getAttribute('id');
                    const name = item.querySelector('name')?.getAttribute('value') || 'Unknown';
                    const year = item.querySelector('yearpublished')?.getAttribute('value') || '';
                    const thumbnail = item.querySelector('thumbnail')?.getAttribute('value') || '';
                    
                    const card = createGameCard(rank, id, name, year, thumbnail, index);
                    cardsContainer.appendChild(card);
                });
                
            } catch (error) {
                console.error('Error loading hot games:', error);
                loading.classList.add('hidden');
                noResults.classList.remove('hidden');
                noResults.querySelector('p').textContent = `Error: ${error.message}`;
            }
        }

        function createGameCard(rank, id, name, year, thumbnail, index) {
            const card = document.createElement('div');
            card.className = `game-card glass rounded-[2.5rem] p-5 border border-white/5 cursor-pointer flex flex-col group animate-in`;
            card.style.animationDelay = `${index * 0.05}s`;
            
            const bggLink = `https://boardgamegeek.com/boardgame/${id}`;
            card.addEventListener('click', () => {
                window.open(bggLink, '_blank');
            });
            
            card.innerHTML = `
                <div class="relative w-full aspect-[4/3] rounded-3xl overflow-hidden mb-6 bg-black/40 border border-white/5 p-4 flex items-center justify-center">
                    ${thumbnail ? 
                        `<img src="/api/image-proxy?url=${encodeURIComponent(thumbnail)}" 
                              class="w-full h-full object-contain group-hover:scale-110 transition-transform duration-700" 
                              alt="${name}"
                              onerror="this.parentElement.innerHTML='<span class=\'text-4xl\'>🎲</span>'">` : 
                        `<span class="text-4xl">🎲</span>`
                    }
                    <div class="absolute top-3 left-3 rank-badge px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest text-white">
                        #${rank}
                    </div>
                </div>

                <div class="flex-1 flex flex-col">
                    <h2 class="text-lg font-black italic uppercase tracking-tighter leading-tight text-white line-clamp-2 mb-2 group-hover:text-orange-500 transition-colors">
                        ${name}
                    </h2>
                    <div class="mt-auto pt-4 border-t border-white/5 flex items-center justify-between">
                        <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">${year || 'TBA'}</span>
                        <div class="flex items-center gap-1 text-[10px] font-black uppercase tracking-tighter text-orange-500 italic">
                            Details
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                        </div>
                    </div>
                </div>
            `;
            
            return card;
        }

        window.addEventListener('DOMContentLoaded', fetchHotGames);
    </script>
    <!-- Vercel Web Analytics -->
    <script type="module" src="analytics-init.js"></script>
</body>
</html>
