<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Game Measurements</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
    }

    .game-card {
      transition: all 0.2s ease;
    }

    .game-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
    }

    .skeleton {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }
  </style>
</head>
<body class="pb-20">

  <header class="sticky top-0 z-30 w-full bg-white/80 backdrop-blur-md border-b px-4 py-4 shadow-sm">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-violet-600 text-white p-2 rounded-lg">
          <i class="fa-solid fa-ruler-combined"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">Game Measurements</h1>
          <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Box Dimensions</p>
        </div>
      </div>
      <div id="statsBox" class="text-right hidden">
        <div class="text-2xl font-bold text-violet-600" id="gameCount">0</div>
        <div class="text-[10px] text-slate-500 uppercase font-bold">Versions</div>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6">
    
    <!-- Fetch Section -->
    <div id="fetchSection" class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
      <h2 class="text-xl font-bold mb-4">Load Collection</h2>
      <div class="space-y-4">
        <div>
          <label class="text-xs font-bold text-slate-500 uppercase mb-2 block">BGG Username</label>
          <input 
            id="username" 
            type="text" 
            value="sportomax" 
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-violet-500 outline-none transition-all"
          >
        </div>
        <button 
          onclick="fetchCollection()" 
          id="fetchBtn"
          class="w-full bg-violet-600 text-white py-4 rounded-xl font-bold hover:bg-violet-700 shadow-lg shadow-violet-100 flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-download"></i> Load Games
        </button>
      </div>
    </div>

    <!-- Loading Section -->
    <div id="loadingSection" class="hidden">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
        <div class="flex items-center justify-center gap-3 mb-4">
          <i class="fa-solid fa-circle-notch fa-spin text-violet-600 text-2xl"></i>
          <span class="font-bold text-slate-700">Loading collection...</span>
        </div>
        <div class="text-sm text-slate-500 text-center" id="loadingStatus">Fetching games...</div>
        <div class="mt-4 bg-slate-100 rounded-full h-2 overflow-hidden">
          <div id="progressBar" class="bg-violet-600 h-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- Filters and Sort -->
    <div id="controlsSection" class="hidden bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
      <div class="flex flex-col sm:flex-row gap-3">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search games..." 
          oninput="filterGames()"
          class="flex-1 px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-violet-500 outline-none transition-all"
        >
        <select 
          id="sortSelect" 
          onchange="sortGames()" 
          class="px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-violet-500 outline-none transition-all bg-white font-medium text-sm"
        >
          <option value="name">Name: A-Z</option>
          <option value="volume-desc">Volume: Largest First</option>
          <option value="volume-asc">Volume: Smallest First</option>
          <option value="width-desc">Width: Widest First</option>
          <option value="length-desc">Length: Longest First</option>
          <option value="height-desc">Height: Tallest First</option>
        </select>
      </div>
    </div>

    <!-- Games List -->
    <div id="gamesSection" class="hidden space-y-3">
      <!-- Games will be populated here -->
    </div>

  </main>

<script>
let allVersions = [];
let displayedVersions = [];
let isLoading = false;

async function fetchCollection() {
  const username = document.getElementById('username').value.trim() || 'sportomax';
  const fetchBtn = document.getElementById('fetchBtn');
  const fetchSection = document.getElementById('fetchSection');
  const loadingSection = document.getElementById('loadingSection');
  const controlsSection = document.getElementById('controlsSection');
  const gamesSection = document.getElementById('gamesSection');
  const statsBox = document.getElementById('statsBox');
  
  fetchBtn.disabled = true;
  loadingSection.classList.remove('hidden');
  
  try {
    isLoading = true;
    
    // Fetch collection
    updateLoadingStatus('Fetching collection...');
    const collXml = await fetchAPI('collection', username, '&stats=1&own=1');
    const doc = new DOMParser().parseFromString(collXml, 'text/xml');
    const items = Array.from(doc.querySelectorAll('item'));
    
    const gameIds = items.map(item => item.getAttribute('objectid'));
    
    updateLoadingStatus(`Found ${gameIds.length} games. Loading measurements...`);
    
    // Show UI
    fetchSection.classList.add('hidden');
    controlsSection.classList.remove('hidden');
    gamesSection.classList.remove('hidden');
    statsBox.classList.remove('hidden');
    
    allVersions = [];
    displayedVersions = [];
    
    // Fetch thing API with versions in batches with 10x parallel processing
    const batchSize = 20;
    const parallelBatches = 10;
    const batches = [];
    for (let i = 0; i < gameIds.length; i += batchSize) {
      batches.push(gameIds.slice(i, i + batchSize));
    }
    
    const gamesFound = {};
    
    // Process batches in parallel groups
    for (let i = 0; i < batches.length; i += parallelBatches) {
      const batchGroup = batches.slice(i, i + parallelBatches);
      updateLoadingStatus(`Loading measurements ${Math.min(i + parallelBatches, batches.length)}/${batches.length}...`);
      updateProgress((Math.min(i + parallelBatches, batches.length) / batches.length) * 100);
      
      await Promise.all(batchGroup.map(async (batch) => {
        const ids = batch.join(',');
        
        try {
          const thingXml = await fetchAPI('thing', ids, '&type=boardgame&versions=1');
          const thingDoc = new DOMParser().parseFromString(thingXml, 'text/xml');
          
          // Build game lookup
          Array.from(thingDoc.querySelectorAll('item[type="boardgame"]')).forEach(item => {
            const id = item.getAttribute('id');
            const nameElem = item.querySelector('name[type="primary"]');
            gamesFound[id] = {
              name: nameElem ? nameElem.getAttribute('value') : 'Unknown',
              thumb: item.querySelector('thumbnail')?.textContent || ''
            };
          });
          
          // Get all version items
          const versionItems = thingDoc.querySelectorAll('item[type="boardgameversion"]');
          
          Array.from(versionItems).forEach(version => {
            const gameLink = version.querySelector('link[type="boardgameversion"][inbound="true"]');
            if (!gameLink) return;
            
            const gameId = gameLink.getAttribute('id');
            const game = gamesFound[gameId];
            if (!game) return;
            
            const widthAttr = version.querySelector('width')?.getAttribute('value');
            const lengthAttr = version.querySelector('length')?.getAttribute('value');
            const depthAttr = version.querySelector('depth')?.getAttribute('value');
            
            const width = widthAttr ? parseFloat(widthAttr) : 0;
            const length = lengthAttr ? parseFloat(lengthAttr) : 0;
            const height = depthAttr ? parseFloat(depthAttr) : 0;
            
            if (width > 0 && length > 0 && height > 0) {
              const versionName = version.querySelector('name[type="primary"]')?.getAttribute('value') || 'Standard Version';
              const versionThumb = version.querySelector('thumbnail')?.textContent || game.thumb;
              const languages = Array.from(version.querySelectorAll('link[type="language"]'))
                .map(l => l.getAttribute('value')).join(', ');
              
              const volume = (width * length * height) / 1000; // Convert to liters
              
              allVersions.push({
                gameId,
                versionId: version.getAttribute('id'),
                gameName: game.name,
                versionName,
                thumb: versionThumb,
                width,
                length,
                height,
                volume,
                languages,
                loaded: true
              });
            }
          });
          
        } catch (e) {
          console.error('Batch error:', e);
        }
      }));
      
      // Update display after each parallel group
      document.getElementById('gameCount').textContent = allVersions.length;
      displayedVersions = [...allVersions];
      sortGames();
      
      await wait(500);
    }
    
    updateLoadingStatus('Complete!');
    updateProgress(100);
    isLoading = false;
    
    // Hide loading indicator
    setTimeout(() => {
      loadingSection.classList.add('hidden');
    }, 500);
    
  } catch (e) {
    console.error(e);
    alert('Failed to fetch collection. Please try again.');
    fetchBtn.disabled = false;
    loadingSection.classList.add('hidden');
  }
}

function updateLoadingStatus(msg) {
  document.getElementById('loadingStatus').textContent = msg;
}

function updateProgress(percent) {
  document.getElementById('progressBar').style.width = percent + '%';
}

function filterGames() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  displayedVersions = allVersions.filter(v => 
    v.gameName.toLowerCase().includes(search) || 
    v.versionName.toLowerCase().includes(search)
  );
  sortGames();
}

function sortGames() {
  const sortBy = document.getElementById('sortSelect').value;
  
  if (sortBy === 'name') {
    displayedVersions.sort((a, b) => a.gameName.localeCompare(b.gameName));
  } else if (sortBy === 'volume-desc') {
    displayedVersions.sort((a, b) => b.volume - a.volume);
  } else if (sortBy === 'volume-asc') {
    displayedVersions.sort((a, b) => a.volume - b.volume);
  } else if (sortBy === 'width-desc') {
    displayedVersions.sort((a, b) => b.width - a.width);
  } else if (sortBy === 'length-desc') {
    displayedVersions.sort((a, b) => b.length - a.length);
  } else if (sortBy === 'height-desc') {
    displayedVersions.sort((a, b) => b.height - a.height);
  }
  
  renderGames();
}

function renderGames() {
  const container = document.getElementById('gamesSection');
  container.innerHTML = '';
  
  if (displayedVersions.length === 0) {
    container.innerHTML = '<div class="text-center text-slate-400 py-8">No versions with measurements found</div>';
    return;
  }
  
  displayedVersions.forEach(version => {
    const card = document.createElement('div');
    card.className = 'game-card bg-white rounded-xl shadow-sm border border-slate-100 p-4 cursor-pointer';
    card.onclick = () => window.open(`https://boardgamegeek.com/boardgame/${version.gameId}`, '_blank');
    
    card.innerHTML = `
      <div class="flex gap-4">
        <img 
          src="/api/image-proxy?url=${encodeURIComponent(version.thumb)}" 
          alt="${version.gameName}"
          class="w-20 h-20 rounded-lg object-cover bg-slate-200 flex-shrink-0"
          onerror="this.style.display='none'"
        >
        <div class="flex-1 min-w-0">
          <h3 class="font-bold text-slate-900 mb-1">${version.gameName}</h3>
          <div class="text-xs text-slate-500 mb-3">${version.versionName}</div>
          
          <div class="grid grid-cols-2 gap-2 text-xs">
            <div class="bg-violet-50 border border-violet-200 rounded px-2 py-1">
              <div class="text-violet-600 font-bold">${version.width.toFixed(1)} cm</div>
              <div class="text-violet-500">Width</div>
            </div>
            <div class="bg-blue-50 border border-blue-200 rounded px-2 py-1">
              <div class="text-blue-600 font-bold">${version.length.toFixed(1)} cm</div>
              <div class="text-blue-500">Length</div>
            </div>
            <div class="bg-green-50 border border-green-200 rounded px-2 py-1">
              <div class="text-green-600 font-bold">${version.height.toFixed(1)} cm</div>
              <div class="text-green-500">Height</div>
            </div>
            <div class="bg-amber-50 border border-amber-200 rounded px-2 py-1">
              <div class="text-amber-600 font-bold">${version.volume.toFixed(2)} L</div>
              <div class="text-amber-500">Volume</div>
            </div>
          </div>
          
          ${version.languages ? `
            <div class="text-[10px] text-slate-400 mt-2">${version.languages}</div>
          ` : ''}
        </div>
      </div>
    `;
    
    container.appendChild(card);
  });
}

async function fetchAPI(endpoint, user, queryParams = '') {
  if (endpoint === 'thing') {
    let url = `/api/bgg-helper?endpoint=${endpoint}&id=${encodeURIComponent(user)}${queryParams}`;
    for (let attempt = 0; attempt < 5; attempt++) {
      let res;
      try {
        res = await fetch(url);
      } catch (e) {
        await wait(1500 * Math.pow(2, attempt));
        continue;
      }
      if (res.status === 202) {
        await wait(3000);
        continue;
      }
      if (res.ok) {
        return await res.text();
      }
      await wait(2000);
    }
    throw new Error('Failed to fetch from BGG API');
  } else {
    if (!user || user.trim() === '') {
      throw new Error('Username is required');
    }
    let url = `/api/bgg-helper?endpoint=${endpoint}&username=${encodeURIComponent(user)}${queryParams}`;
    for (let attempt = 0; attempt < 5; attempt++) {
      let res;
      try {
        res = await fetch(url);
      } catch (e) {
        await wait(1000 * Math.pow(2, attempt));
        continue;
      }
      if (res.status === 202) {
        await wait(2000);
        continue;
      }
      if (res.ok) return await res.text();
      await wait(1500);
    }
    throw new Error('Failed to fetch from BGG API');
  }
}

function wait(ms) {
  return new Promise(r => setTimeout(r, ms));
}
</script>
</body>
</html>
