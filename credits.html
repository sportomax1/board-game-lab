<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Game Credits</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Inter:wght@400;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: white;
            overflow: hidden;
            user-select: none;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.9);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            border-bottom: 1px solid #333;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.25rem;
            font-weight: bold;
        }

        button {
            background: #ca8a04;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.875rem;
        }

        button:hover {
            background: #b45309;
        }

        button:active {
            transform: scale(0.95);
        }

        main {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding-top: 60px;
        }

        #creditsScroll {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .credit-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            text-align: center;
        }

        .credit-game {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            min-height: 100vh;
            padding: 60px 20px;
            justify-content: center;
        }

        .game-name {
            font-family: 'Cinzel', serif;
            font-size: clamp(2rem, 6vw, 3rem);
            font-weight: 600;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .game-image {
            max-width: min(100vw - 40px, 350px);
            max-height: 500px;
            width: auto;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }

        .game-details {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            font-size: clamp(0.85rem, 2vw, 1rem);
            color: #cbd5e1;
        }

        .detail-badge {
            display: inline-block;
            background: rgba(255,255,255,0.05);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            white-space: nowrap;
        }

        .title-card {
            font-family: 'Cinzel', serif;
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: 800;
            text-shadow: 0 0 30px rgba(255,255,255,0.5);
        }

        .count-display {
            font-size: 3rem;
            color: #fbbf24;
            margin-top: 20px;
        }

        /* Settings Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            width: 100%;
        }

        .modal-content h2 {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .modal-content > p {
            color: #94a3b8;
            font-size: 0.875rem;
            margin-bottom: 20px;
        }

        .setting-group {
            margin-bottom: 20px;
        }

        .setting-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: bold;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .setting-box {
            background: rgba(15,23,42,0.5);
            border: 1px solid rgba(51,65,85,0.5);
            border-radius: 8px;
            padding: 12px;
        }

        .theme-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .theme-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            cursor: pointer;
            border-radius: 6px;
        }

        .theme-option:hover {
            background: #1e293b;
        }

        .theme-option input[type="radio"] {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        .theme-label {
            font-size: 0.875rem;
            color: #cbd5e1;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 10px;
            color: white;
            font-family: inherit;
            margin-bottom: 10px;
        }

        input[type="text"]:focus, input[type="number"]:focus, select:focus {
            outline: none;
            border-color: #fbbf24;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-item input[type="checkbox"] {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        .checkbox-item label {
            cursor: pointer;
            color: #cbd5e1;
            font-size: 0.875rem;
        }

        .modal-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        #startBtn {
            padding: 12px;
            background: linear-gradient(to right, #ca8a04, #92400e);
            color: #000;
            font-weight: bold;
            border-radius: 8px;
        }

        #startBtn:hover:not(:disabled) {
            background: linear-gradient(to right, #b45309, #78340f);
        }

        #startBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #statusMsg {
            font-size: 0.875rem;
            color: #fbbf24;
            min-height: 20px;
            margin: 10px 0;
            word-break: break-words;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,0.8);
            padding: 12px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 99;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .controls.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .control-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            cursor: pointer;
            font-size: 1rem;
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.1);
        }

        .loader {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid #fbbf24;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            header {
                padding: 8px 12px;
            }
            .controls {
                bottom: 10px;
                padding: 10px 12px;
                gap: 6px;
            }
            .control-btn {
                width: 36px;
                height: 36px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>🎬 Credits</h1>
        <button id="settingsBtn">⚙️ Settings</button>
    </header>

    <main>
        <div id="creditsScroll"></div>
    </main>

    <div class="controls" id="controls">
        <button class="control-btn" id="playPauseBtn" title="Play/Pause">⏸</button>
        <button class="control-btn" id="restartBtn" title="Restart">↻</button>
        <button class="control-btn" id="stopBtn" title="Stop">⏹</button>
    </div>

    <div class="modal active" id="modal">
        <div class="modal-content">
            <h2>🎬 Credits Setup</h2>
            <p>Configure your collection and display settings.</p>

            <!-- Username -->
            <div class="setting-group">
                <label>BGG Username</label>
                <input type="text" id="usernameInput" value="sportomax" placeholder="e.g., sportomax">
            </div>

            <!-- Collection Filters -->
            <div class="setting-group">
                <label>Collection Filters</label>
                <div class="setting-box">
                    <div class="checkbox-group">
                        <label class="checkbox-item">
                            <input type="checkbox" id="filterOwn" checked>
                            <span>Own</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" id="filterPrevOwned">
                            <span>Prev. Owned</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" id="filterWantToPlay">
                            <span>Want to Play</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" id="filterWantToBuy">
                            <span>Want to Buy</span>
                        </label>
                        <label class="checkbox-item" style="grid-column: 1 / -1; border-top: 1px solid #334155; padding-top: 10px; margin-top: 8px;">
                            <input type="checkbox" id="filterExpansions">
                            <span>Include Expansions</span>
                        </label>
                        <label class="checkbox-item" style="grid-column: 1 / -1;">
                            <input type="checkbox" id="filterPlayedOnly">
                            <span>Played Only (1+ plays)</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Sort -->
            <div class="setting-group">
                <label>Sort By</label>
                <select id="sortBy">
                    <option value="name">Name (A-Z)</option>
                    <option value="name-desc">Name (Z-A)</option>
                    <option value="rating">Rating (High to Low)</option>
                    <option value="year">Year (Newest)</option>
                    <option value="plays">Play Count (Most)</option>
                    <option value="random">Random</option>
                </select>
            </div>

            <!-- Game Count -->
            <div class="setting-group">
                <label>Max Games (1-500)</label>
                <input type="number" id="gameCount" value="100" min="1" max="500">
            </div>

            <!-- Speed -->
            <div class="setting-group">
                <label>Speed (seconds per game, 1-60)</label>
                <input type="number" id="speed" value="5" min="1" max="60">
                <small>Lower = faster scrolling, Higher = slower scrolling</small>
            </div>

            <div id="statusMsg"></div>

            <div class="modal-buttons">
                <button id="startBtn">🎬 Start Credits</button>
                <button id="closeBtn">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById('modal');
        const creditsScroll = document.getElementById('creditsScroll');
        const controls = document.getElementById('controls');
        const settingsBtn = document.getElementById('settingsBtn');
        const closeBtn = document.getElementById('closeBtn');
        const startBtn = document.getElementById('startBtn');
        const statusMsg = document.getElementById('statusMsg');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const restartBtn = document.getElementById('restartBtn');
        const stopBtn = document.getElementById('stopBtn');

        let gamesData = [];
        let isPlaying = false;
        let isPaused = false;
        let autoScroll = null;

        settingsBtn.addEventListener('click', () => {
            modal.classList.add('active');
        });

        closeBtn.addEventListener('click', () => {
            modal.classList.remove('active');
        });

        startBtn.addEventListener('click', async () => {
            const username = document.getElementById('usernameInput').value.trim();
            if (!username) {
                statusMsg.textContent = 'Please enter a username';
                return;
            }

            startBtn.innerHTML = '<span class="loader"></span> Loading...';
            startBtn.disabled = true;
            statusMsg.textContent = '';

            try {
                const games = await loadGames(username);
                gamesData = games;

                if (games.length === 0) {
                    statusMsg.textContent = 'No games found. Check filters or username.';
                    startBtn.innerHTML = '🎬 Start Credits';
                    startBtn.disabled = false;
                } else {
                    statusMsg.textContent = `Loaded ${games.length} games! Starting...`;
                    setTimeout(() => {
                        modal.classList.remove('active');
                        startBtn.innerHTML = '🎬 Start Credits';
                        startBtn.disabled = false;
                        generateAndScroll(games);
                    }, 500);
                }
            } catch (err) {
                console.error(err);
                statusMsg.textContent = err.message;
                startBtn.innerHTML = '🎬 Start Credits';
                startBtn.disabled = false;
            }
        });

        async function loadGames(username) {
            let filters = [];
            if (document.getElementById('filterOwn').checked) filters.push('own=1');
            if (document.getElementById('filterPrevOwned').checked) filters.push('prevowned=1');
            if (document.getElementById('filterWantToPlay').checked) filters.push('wanttoplay=1');
            if (document.getElementById('filterWantToBuy').checked) filters.push('wanttobuy=1');

            const filterStr = filters.length > 0 ? '&' + filters.join('&') : '&own=1';
            const safeUsername = encodeURIComponent(username);

            const response = await fetch(`/api/bgg-helper?endpoint=collection&username=${safeUsername}${filterStr}&stats=1`);
            if (!response.ok) throw new Error('Failed to load collection');

            const text = await response.text();
            const parser = new DOMParser();
            const xml = parser.parseFromString(text, 'text/xml');

            if (xml.documentElement.tagName === 'parsererror') {
                throw new Error('Failed to parse BGG response');
            }

            const items = xml.querySelectorAll('item');
            let games = Array.from(items).map(item => {
                try {
                    const objectid = item.getAttribute('objectid');
                    const name = item.querySelector('name')?.textContent || 'Unknown';
                    const type = item.getAttribute('subtype') || '';
                    const year = item.querySelector('yearpublished')?.textContent || '';
                    const stats = item.querySelector('stats');
                    const minplayers = stats?.getAttribute('minplayers') || 'N/A';
                    const maxplayers = stats?.getAttribute('maxplayers') || 'N/A';
                    const playingtime = stats?.getAttribute('playingtime') || 'N/A';
                    const rating = parseFloat(stats?.querySelector('rating')?.querySelector('average')?.getAttribute('value') || '0');
                    const numplays = parseInt(item.querySelector('numplays')?.textContent || '0') || 0;

                    return {
                        objectid, name, type, year, minplayers, maxplayers, playingtime, rating, numplays, image: ''
                    };
                } catch (e) {
                    return null;
                }
            }).filter(g => g &&
                !(g.type === 'boardgameexpansion' && !document.getElementById('filterExpansions').checked) &&
                !(document.getElementById('filterPlayedOnly').checked && g.numplays < 1)
            );

            // Remove duplicates
            let unique = Array.from(new Map(games.map(g => [g.name, g])).values());

            // Fetch images in batches of 20 using thing API v2
            for (let i = 0; i < unique.length; i += 20) {
                const batch = unique.slice(i, i + 20);
                const ids = batch.map(g => g.objectid).join(',');
                try {
                    const thingResponse = await fetch(`/api/bgg-helper?endpoint=thing&id=${ids}`);
                    if (thingResponse.ok) {
                        const thingText = await thingResponse.text();
                        const thingXml = parser.parseFromString(thingText, 'text/xml');
                        const things = thingXml.querySelectorAll('item');
                        
                        things.forEach(thing => {
                            const thingId = thing.getAttribute('id');
                            const image = thing.querySelector('image')?.textContent || thing.querySelector('thumbnail')?.textContent || '';
                            const game = batch.find(g => g.objectid === thingId);
                            if (game && image) {
                                game.image = image;
                            }
                        });
                    }
                } catch (e) {
                    console.warn('Failed to fetch thing batch', e);
                }
                // Small delay between batches
                await new Promise(r => setTimeout(r, 100));
            }

            // Filter out games without images
            games = unique.filter(g => g.image);

            console.log(`📊 Fetched ${games.length} games with images (from ${unique.length} unique games)`);

            // Apply sorting
            const sortBy = document.getElementById('sortBy').value;
            switch(sortBy) {
                case 'name': games.sort((a, b) => a.name.localeCompare(b.name)); break;
                case 'name-desc': games.sort((a, b) => b.name.localeCompare(a.name)); break;
                case 'rating': games.sort((a, b) => b.rating - a.rating); break;
                case 'year': games.sort((a, b) => (b.year || 0) - (a.year || 0)); break;
                case 'plays': games.sort((a, b) => b.numplays - a.numplays); break;
                case 'random': games.sort(() => Math.random() - 0.5); break;
            }

            // Limit games
            const limit = Math.min(parseInt(document.getElementById('gameCount').value) || 100, games.length);
            return games.slice(0, limit);
        }

        function generateAndScroll(games) {
            creditsScroll.innerHTML = '';
            isPlaying = true;
            isPaused = false;

            // Opening
            const opening = document.createElement('div');
            opening.className = 'credit-item title-card';
            opening.textContent = '🎬 Presenting';
            creditsScroll.appendChild(opening);

            // Title
            const title = document.createElement('div');
            title.className = 'credit-item';
            title.innerHTML = `<div class="title-card">The Collection</div><div class="count-display">${games.length} Board Games</div>`;
            creditsScroll.appendChild(title);

            // Games
            games.forEach(game => {
                const item = document.createElement('div');
                item.className = 'credit-game';
                
                const players = game.minplayers !== 'N/A' && game.maxplayers !== 'N/A'
                    ? `${game.minplayers}-${game.maxplayers} Players`
                    : 'Players N/A';
                
                const time = game.playingtime !== 'N/A' ? `${game.playingtime} min` : 'Time N/A';
                const ratingStr = game.rating > 0 ? game.rating.toFixed(2) : 'Not Rated';
                
                item.innerHTML = `
                    <div class="game-name">${escape(game.name)}</div>
                    <img src="/api/image-proxy?url=${encodeURIComponent(game.image)}" alt="${escape(game.name)}" class="game-image" onerror="this.style.display='none'">
                    <div class="game-details">
                        <div class="detail-badge">⭐ ${ratingStr}</div>
                        <div class="detail-badge">👥 ${players}</div>
                        <div class="detail-badge">⏱️ ${time}</div>
                        <div class="detail-badge">📅 ${game.year || 'N/A'}</div>
                        <div class="detail-badge">🎲 ${game.numplays} plays</div>
                    </div>
                `;
                creditsScroll.appendChild(item);
            });

            // Ending
            const ending = document.createElement('div');
            ending.className = 'credit-item title-card';
            ending.innerHTML = '🎲<br>Thanks for Playing!';
            creditsScroll.appendChild(ending);

            controls.classList.add('visible');
            autoScroll = startAutoScroll(games.length);
        }

        function startAutoScroll(gameCount) {
            const speed = parseInt(document.getElementById('speed').value) || 5;
            const itemHeight = window.innerHeight;
            const totalItems = gameCount + 3;
            const totalHeight = itemHeight * totalItems;
            const totalTime = speed * totalItems * 1000;
            const pixelsPerMs = totalHeight / totalTime;

            let startTime = Date.now();
            let lastTime = startTime;

            function scroll() {
                if (!isPlaying) return;

                const now = Date.now();
                const elapsed = now - startTime;

                if (isPaused) {
                    startTime = now - elapsed;
                    lastTime = now;
                } else {
                    const scrollPos = pixelsPerMs * elapsed;
                    creditsScroll.scrollTop = scrollPos;

                    if (scrollPos >= totalHeight) {
                        stopScroll();
                        return;
                    }
                }

                requestAnimationFrame(scroll);
            }

            scroll();
            return { cancel: () => { isPlaying = false; } };
        }

        function stopScroll() {
            isPlaying = false;
            controls.classList.remove('visible');
            modal.classList.add('active');
            creditsScroll.scrollTop = 0;
        }

        playPauseBtn.addEventListener('click', () => {
            if (!isPlaying) return;
            isPaused = !isPaused;
            playPauseBtn.textContent = isPaused ? '▶' : '⏸';
        });

        restartBtn.addEventListener('click', () => {
            if (gamesData.length > 0) {
                generateAndScroll(gamesData);
            }
        });

        stopBtn.addEventListener('click', stopScroll);

        // Show controls on mouse move
        let hideTimeout;
        document.addEventListener('mousemove', () => {
            if (!isPlaying) return;
            controls.classList.add('visible');
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => {
                if (isPlaying && !isPaused) {
                    controls.classList.remove('visible');
                }
            }, 3000);
        });
    </script>
</body>
</html>
