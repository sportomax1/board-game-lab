<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, user-scalable=yes">
    <title>Arcade Credits Roller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            overflow: hidden; 
            background-color: #0d0d0d; 
            -webkit-tap-highlight-color: transparent; 
        }

        /* Credits Roll Container */
        .credits-container {
            height: 100vh;
            width: 100%;
            overflow: hidden;
            background-color: #0d0d0d; 
            position: relative;
        }

        /* Credits Content that scrolls */
        .credits-content {
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%) translateY(100vh);
            min-width: 250px;
            padding-bottom: 20vh;
        }

        .roll-animation {
            animation: creditsRoll linear infinite;
        }

        @keyframes creditsRoll {
            /* 'from' and 'to' values are set dynamically in JS */
            from { transform: translateX(-50%) translateY(100vh); }
        }

        .game-image {
            width: 120px;
            height: 120px;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5); 
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Fireworks Mode Styling */
        .firework {
            position: absolute;
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.5s, transform 3s cubic-bezier(0.25, 0.1, 0.25, 1);
            pointer-events: none;
            z-index: 50;
        }

        /* Raindrop Styling */
        .raindrop {
            position: absolute;
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 8px;
            opacity: 0;
            transition: transform linear, opacity 0.5s;
            pointer-events: none;
            z-index: 50;
        }

        /* Loading Screen Style */
        #loadingIndicator {
            transition: opacity 0.3s ease;
        }
    </style>

    <!-- External API Keys -->
    <script>
        // RAWG API Key (optional)
        window.RAWG_KEY = typeof __rawg_api_key !== 'undefined' ? __rawg_api_key : 'DEMO_API_KEY_REQUIRED';
    </script>
</head>
<body class="bg-[#0d0d0d] text-white flex flex-col min-h-screen">

    <!-- Settings Panel (Fixed on Mobile - Top Section) -->
    <div id="settingsPanel" class="w-full p-4 bg-gray-900 border-b border-gray-700 shadow-2xl z-20 transition-all duration-300">
        <h1 class="text-3xl text-indigo-400 mb-4 font-bold">Credits Setup</h1>

        <div class="space-y-4">
            <!-- BGG Username Input -->
            <div>
                <label for="bggUsername" class="block text-sm font-medium text-gray-300 mb-2">BoardGameGeek Username</label>
                <input type="text" id="bggUsername" placeholder="BGG Username" value="sportomax" class="w-full p-3 bg-gray-700 text-white rounded-xl border-2 border-gray-600 focus:ring-indigo-500 focus:border-indigo-500">
                <div class="text-xs text-gray-400 mt-1">Leave empty to use RAWG API, or enter BGG username for collection-based credits</div>
            </div>

            <!-- Collection Filters (shown only when BGG username is entered) -->
            <div id="collectionFilters" style="display: none;" class="bg-gray-800 p-3 rounded-xl border border-gray-600 space-y-2">
                <div class="flex items-center gap-3">
                    <input type="checkbox" id="filterOwn" checked class="w-4 h-4">
                    <label for="filterOwn" class="text-sm text-gray-300">Own Games</label>
                </div>
                <div class="flex items-center gap-3">
                    <input type="checkbox" id="filterPrevOwned" class="w-4 h-4">
                    <label for="filterPrevOwned" class="text-sm text-gray-300">Previously Owned</label>
                </div>
                <div class="flex items-center gap-3">
                    <input type="checkbox" id="filterWantToPlay" class="w-4 h-4">
                    <label for="filterWantToPlay" class="text-sm text-gray-300">Want to Play</label>
                </div>
                <div class="flex items-center gap-3">
                    <input type="checkbox" id="filterWantToBuy" class="w-4 h-4">
                    <label for="filterWantToBuy" class="text-sm text-gray-300">Want to Buy</label>
                </div>
                <div class="flex items-center gap-3">
                    <input type="checkbox" id="filterExpansions" class="w-4 h-4">
                    <label for="filterExpansions" class="text-sm text-gray-300">Include Expansions</label>
                </div>
            </div>

            <!-- Mode Selector -->
            <div>
                <label for="modeSelect" class="block text-sm font-medium text-gray-300 mb-2">Mode</label>
                <select id="modeSelect" class="w-full p-3 bg-gray-700 text-white rounded-xl border-2 border-gray-600 focus:ring-indigo-500 focus:border-indigo-500 appearance-none">
                    <option value="classic">🎥 Classic Roll (Bottom to Top)</option>
                    <option value="fireworks">🎇 Fireworks Launch (Tap to Launch)</option>
                    <option value="rain">🌧️ Image Rain (Passive Drop)</option>
                    <option value="action">🎬 Action (Random Animations)</option>
                </select>
            </div>

            <!-- Sorting Selector -->
            <div>
                <label for="sortSelect" class="block text-sm font-medium text-gray-300 mb-2">Sort By</label>
                <select id="sortSelect" class="w-full p-3 bg-gray-700 text-white rounded-xl border-2 border-gray-600 focus:ring-indigo-500 focus:border-indigo-500 appearance-none">
                    <option value="random">🎲 Random</option>
                    <option value="name">A-Z Title</option>
                    <option value="rating">⭐ Rating (Best First)</option>
                    <option value="rating-asc">⭐ Rating (Lowest First)</option>
                    <option value="released">📅 Year (Newest First)</option>
                    <option value="released-asc">📅 Year (Oldest First)</option>
                    <option value="playtime">⏱️ Playtime (Longest First)</option>
                    <option value="players">👥 Min Players</option>
                </select>
            </div>

            <!-- Speed Control (Applies to Classic & Rain Modes) -->
            <div id="speedControl">
                <label for="speedRange" class="block text-sm font-medium text-gray-300 mb-2">Speed (Pace): <span id="speedValue">1.0</span>x</label>
                <input type="range" id="speedRange" min="0.5" max="3" step="0.5" value="1.0" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer range-lg accent-indigo-500">
            </div>

            <!-- Debug Mode (Show index numbers) -->
            <div class="flex items-center gap-3">
                <input type="checkbox" id="debugMode" class="w-4 h-4">
                <label for="debugMode" class="text-sm text-gray-300">Debug Mode (Show Index)</label>
            </div>

            <!-- Action Buttons -->
            <div class="pt-2 space-y-3">
                <button id="startButton" class="w-full py-4 text-lg font-extrabold bg-green-600 hover:bg-green-700 text-white rounded-xl shadow-lg transition-colors duration-200 active:scale-[0.98]">
                    🚀 START CREDITS
                </button>
                <button id="stopButton" class="w-full py-4 text-lg font-extrabold bg-red-600 hover:bg-red-700 text-white rounded-xl shadow-lg transition-colors duration-200 active:scale-[0.98]" style="display: none;">
                    🛑 STOP CREDITS
                </button>
            </div>
            
            <div id="messageBox" class="text-sm text-center font-medium text-yellow-400 pt-3"></div>
        </div>
    </div>

    <!-- Credits Display Area (Takes up the rest of the screen) -->
    <div id="creditsArea" class="credits-container flex-grow relative" onclick="handleAreaClick(event)">
        
        <!-- Real-time Speed Control (shown during game) -->
        <div id="runtimeSpeedControl" class="absolute top-4 right-4 z-40 bg-gray-900/90 backdrop-blur p-3 rounded-lg border border-gray-700 hidden w-48">
            <label class="text-xs font-medium text-gray-300 block mb-2">Pace: <span id="runtimeSpeedValue">1.0</span>x</label>
            <input type="range" id="runtimeSpeedSlider" min="0.5" max="3" step="0.5" value="1.0" class="w-full h-2 bg-gray-700 rounded accent-indigo-500">
        </div>
        
        <!-- Loading Indicator (Initially visible, will be hidden after initial load) -->
        <div id="loadingIndicator" class="absolute inset-0 flex flex-col items-center justify-center bg-black bg-opacity-90 z-50">
            <svg class="animate-spin h-14 w-14 text-indigo-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="mt-4 text-indigo-400 text-xl font-bold">Loading Game Data...</span>
        </div>

        <div id="creditsContent" class="credits-content">
            <div id="initialPrompt" class="text-center p-8 mt-[30vh] text-gray-500 text-2xl font-light" style="display: none;">
                Settings are configured. Hit START to begin!
            </div>
        </div>
    </div>

    <script>
        // --- Global State ---
        let gameData = [];
        let isRunning = false;
        let rainInterval = null; // Interval for the rain effect
        let useBGGCollection = false; // Flag to track if using BGG collection
        let currentSpeedMultiplier = 1.0; // Speed multiplier for pace
        
        // --- DOM Elements ---
        const creditsContentEl = document.getElementById('creditsContent');
        const creditsAreaEl = document.getElementById('creditsArea');
        const startButton = document.getElementById('startButton');
        const stopButton = document.getElementById('stopButton');
        const speedRange = document.getElementById('speedRange');
        const speedValueEl = document.getElementById('speedValue');
        const runtimeSpeedControl = document.getElementById('runtimeSpeedControl');
        const runtimeSpeedSlider = document.getElementById('runtimeSpeedSlider');
        const runtimeSpeedValue = document.getElementById('runtimeSpeedValue');
        const sortSelect = document.getElementById('sortSelect');
        const modeSelect = document.getElementById('modeSelect');
        const speedControlEl = document.getElementById('speedControl');
        const messageBox = document.getElementById('messageBox');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const initialPrompt = document.getElementById('initialPrompt');
        const bggUsernameInput = document.getElementById('bggUsername');
        const collectionFiltersDiv = document.getElementById('collectionFilters');

        // The RAWG API endpoint for a list of popular games
        const RAWG_URL = 'https://api.rawg.io/api/games?';

        // --- API and Data Fetching ---
        
        // Exponential backoff retry logic for the fetch call
        async function fetchWithRetry(url, options, maxRetries = 3, delay = 1000) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response;
                } catch (error) {
                    if (i < maxRetries - 1) {
                        await new Promise(resolve => setTimeout(resolve, delay));
                        delay *= 2; // Exponential backoff
                    } else {
                        throw error;
                    }
                }
            }
        }

        async function fetchFromBGG(username) {
            try {
                // Build filter parameters
                let filters = [];
                if (document.getElementById('filterOwn').checked) filters.push('own=1');
                if (document.getElementById('filterPrevOwned').checked) filters.push('prevowned=1');
                if (document.getElementById('filterWantToPlay').checked) filters.push('wanttoplay=1');
                if (document.getElementById('filterWantToBuy').checked) filters.push('wanttobuy=1');

                const filterStr = filters.length > 0 ? '&' + filters.join('&') : '&own=1';
                const response = await fetch(`/api/bgg-helper?endpoint=collection&username=${username}${filterStr}&stats=1`);

                if (!response.ok) throw new Error('Failed to fetch collection');

                const text = await response.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, 'text/xml');

                const games = Array.from(xml.querySelectorAll('item')).map(item => {
                    const name = item.querySelector('name')?.textContent || 'Unknown';
                    const yearPublished = item.querySelector('yearpublished')?.textContent || 0;
                    const rating = parseFloat(item.querySelector('average')?.textContent || 0);
                    const image = item.querySelector('image')?.textContent || '';
                    const minplayers = parseInt(item.querySelector('minplayers')?.textContent || 1);
                    const playingtime = parseInt(item.querySelector('playingtime')?.textContent || 0);
                    
                    // Check if it's an expansion
                    const type = item.getAttribute('subtype') || '';
                    const isExpansion = type.toLowerCase() === 'expansion' || name.toLowerCase().includes('expansion');

                    return {
                        id: item.getAttribute('objectid'),
                        name: name,
                        released: parseInt(yearPublished),
                        rating: rating,
                        image: image,
                        metacritic: 0,
                        minPlayers: minplayers,
                        playtime: playingtime,
                        isExpansion: isExpansion
                    };
                }).filter(g => {
                    if (!g.image) return false;
                    // Filter out expansions unless explicitly enabled
                    if (g.isExpansion && !document.getElementById('filterExpansions').checked) return false;
                    return true;
                });

                // Remove duplicates
                return Array.from(new Map(games.map(g => [g.name, g])).values());
            } catch (error) {
                console.error('BGG Fetch Error:', error);
                throw error;
            }
        }

        async function fetchGameData() {
            loadingIndicator.style.display = 'flex'; // Show loading screen
            initialPrompt.style.display = 'none';

            try {
                const bggUsername = bggUsernameInput.value.trim();
                
                if (bggUsername) {
                    // Fetch from BGG collection
                    useBGGCollection = true;
                    const games = await fetchFromBGG(bggUsername);
                    if (games.length === 0) {
                        messageBox.textContent = '❌ No games found in BGG collection. Check username and filters.';
                        loadingIndicator.style.display = 'none';
                        initialPrompt.style.display = 'block';
                        return [];
                    }
                    gameData = games;
                    messageBox.textContent = `✅ Loaded ${games.length} games from BGG collection.`;
                    
                    // Log games to console with index and info
                    console.log(`=== BGG Collection Loaded (${games.length} games) ===`);
                    games.forEach((game, idx) => {
                        console.log(`#${idx + 1} ${game.name} - Rating: ${game.rating}, Released: ${game.released}, MinPlayers: ${game.minPlayers}, Playtime: ${game.playtime}m`);
                    });
                } else {
                    // Fetch from RAWG API
                    useBGGCollection = false;
                    const apiKey = window.RAWG_KEY;
                    const bearerToken = window.BEARER_TOKEN;

                    if (apiKey === 'DEMO_API_KEY_REQUIRED' || !bearerToken) {
                        messageBox.textContent = '❌ Error: API Key or Bearer Token secrets are missing. Cannot fetch data.';
                        loadingIndicator.style.display = 'none';
                        initialPrompt.style.display = 'block';
                        return [];
                    }
                    
                    const url = `${RAWG_URL}key=${apiKey}&page_size=40&platforms=1&ordering=-rating`; 
                    const fetchOptions = {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${bearerToken}`, 
                            'Content-Type': 'application/json'
                        }
                    };

                    const response = await fetchWithRetry(url, fetchOptions);
                    const data = await response.json();
                    
                    const games = data.results.map(g => ({
                        id: g.id,
                        name: g.name,
                        released: new Date(g.released).getFullYear() || 0,
                        rating: g.rating,
                        image: g.background_image, 
                        metacritic: g.metacritic || 0
                    })).filter(g => g.image);

                    gameData = games;
                    messageBox.textContent = `✅ Loaded ${games.length} games from RAWG API.`;
                    
                    // Log games to console with index
                    console.log(`=== RAWG API Games Loaded (${games.length} games) ===`);
                    games.forEach((game, idx) => {
                        console.log(`#${idx + 1} ${game.name} - Rating: ${game.rating}, Released: ${game.released}`);
                    });
                }
                return gameData;

            } catch (error) {
                console.error('API Fetch Error:', error);
                messageBox.textContent = `❌ API Error: ${error.message}`;
                return [];
            } finally {
                loadingIndicator.style.display = 'none'; // Hide loading screen
                initialPrompt.style.display = 'block';
            }
        }

        // --- Utility and Rendering ---

        function sortGames(games, sortBy) {
            const sorted = [...games]; 
            switch (sortBy) {
                case 'random':
                    return sorted.sort(() => Math.random() - 0.5);
                case 'name':
                    return sorted.sort((a, b) => a.name.localeCompare(b.name));
                case 'rating':
                    return sorted.sort((a, b) => b.rating - a.rating);
                case 'rating-asc':
                    return sorted.sort((a, b) => a.rating - b.rating);
                case 'released':
                    return sorted.sort((a, b) => b.released - a.released);
                case 'released-asc':
                    return sorted.sort((a, b) => a.released - b.released);
                case 'playtime':
                    return sorted.sort((a, b) => (b.playtime || 0) - (a.playtime || 0));
                case 'players':
                    return sorted.sort((a, b) => (a.minPlayers || 1) - (b.minPlayers || 1));
                default:
                    return sorted;
            }
        }

        function renderCreditsContent(games) {
            creditsContentEl.innerHTML = '';
            initialPrompt.style.display = 'none';

            // Create enough items for a seamless loop (at least 3x viewport height)
            const itemHeight = 150; 
            const totalItemsNeeded = Math.ceil(creditsAreaEl.clientHeight * 3 / itemHeight); 
            let itemsToRender = [];
            
            while (itemsToRender.length < totalItemsNeeded) {
                itemsToRender = itemsToRender.concat(games);
            }
            itemsToRender = itemsToRender.slice(0, totalItemsNeeded);

            const debugMode = document.getElementById('debugMode').checked;
            let globalIndex = 0;

            itemsToRender.forEach((game, index) => {
                const div = document.createElement('div');
                const color = index % 3 === 0 ? 'text-indigo-300' : index % 3 === 1 ? 'text-yellow-300' : 'text-green-300';
                
                div.className = 'game-item flex flex-col items-center justify-center p-6 w-full text-center';
                const gameIndex = globalIndex % games.length;
                const indexDisplay = `<div class="text-xs text-gray-500 mb-1">#${gameIndex + 1}</div>`;
                globalIndex++;
                
                div.innerHTML = `
                    ${indexDisplay}
                    <img src="${game.image}" 
                         onerror="this.onerror=null;this.src='https://placehold.co/120x120/1F2937/ffffff?text=${game.name.substring(0, 3)}'; this.className='game-image bg-gray-800';" 
                         class="game-image transition-all duration-300 transform" 
                         alt="${game.name}">
                    <div class="mt-4 text-xl font-semibold ${color}">${game.name}</div>
                    <div class="text-sm text-gray-400">Rating: ${game.rating.toFixed(2)} | Year: ${game.released}</div>
                    <div class="h-8"></div> <!-- Spacer -->
                `;
                creditsContentEl.appendChild(div);
            });
        }

        // --- Mode Logic ---

        function startClassicRoll() {
            if (isRunning) return;
            isRunning = true;
            stopButton.style.display = 'block';
            startButton.style.display = 'none';
            runtimeSpeedControl.classList.remove('hidden');

            const sortedGames = sortGames(gameData, sortSelect.value);
            renderCreditsContent(sortedGames);
            
            const totalContentHeight = creditsContentEl.scrollHeight;
            
            const styleSheet = document.styleSheets[0];
            const ruleIndex = [...styleSheet.cssRules].findIndex(rule => rule.name === 'creditsRoll');
            if (ruleIndex !== -1) {
                styleSheet.deleteRule(ruleIndex);
            }
            
            // Recalculate 'to' position based on content height for perfect loop
            const keyframes = `@keyframes creditsRoll {
                from {
                    transform: translateX(-50%) translateY(100vh);
                }
                to {
                    transform: translateX(-50%) translateY(-${totalContentHeight}px);
                }
            }`;
            styleSheet.insertRule(keyframes, styleSheet.cssRules.length);

            // Apply Animation with speed multiplier
            const baseDuration = 20; // Base animation time in seconds
            const duration = baseDuration / currentSpeedMultiplier;
            creditsContentEl.style.animationDuration = `${duration}s`;
            creditsContentEl.classList.add('roll-animation');
        }

        /* --- FIREWORKS MODE --- */
        function setupFireworksMode() {
            stopCredits(); 
            messageBox.textContent = "🎇 Tap anywhere on the black screen to launch a game image!";
            creditsContentEl.innerHTML = '';
            isRunning = true;
            stopButton.style.display = 'block';
            startButton.style.display = 'none';
        }

        function launchFirework(event) {
            const randomIndex = Math.floor(Math.random() * gameData.length);
            const game = gameData[randomIndex];

            const firework = document.createElement('img');
            firework.src = game.image;
            firework.className = 'firework';
            
            firework.style.left = `${event.clientX}px`;
            firework.style.top = `${event.clientY}px`;
            firework.style.opacity = '1';
            
            creditsAreaEl.appendChild(firework);

            const duration = Math.random() * 2 + 2; 
            const finalY = (Math.random() * 200) + 150; 
            const finalX = (Math.random() - 0.5) * 600; 

            firework.style.transitionDuration = `${duration}s`;
            firework.style.transitionTimingFunction = 'cubic-bezier(0.2, 0.8, 0.4, 1.2)';

            setTimeout(() => {
                firework.style.transform = `translate(${finalX}px, -${finalY}px) scale(1.5) rotate(${Math.random() * 720 - 360}deg)`;
                firework.style.opacity = '0';
            }, 50);

            setTimeout(() => {
                firework.remove();
            }, duration * 1000 + 500); 
        }

        /* --- RAIN MODE --- */
        function setupRainMode() {
            stopCredits();
            messageBox.textContent = "🌧️ Game covers are now raining down the screen!";
            creditsContentEl.innerHTML = '';
            isRunning = true;
            stopButton.style.display = 'block';
            startButton.style.display = 'none';

            const duration = parseInt(speedRange.value, 10);
            // Rain rate based on speed (slower speed means slower rain rate)
            const intervalTime = duration * 20; 

            rainInterval = setInterval(() => {
                if (gameData.length > 0) {
                    dropRaindrop();
                }
            }, intervalTime);
        }

        function dropRaindrop() {
            const randomIndex = Math.floor(Math.random() * gameData.length);
            const game = gameData[randomIndex];
            
            const drop = document.createElement('img');
            drop.src = game.image;
            drop.className = 'raindrop';
            
            // Random start X position across the width
            const startX = Math.random() * creditsAreaEl.clientWidth;
            // The fall speed (shorter duration = faster fall)
            const fallDuration = (Math.random() * 2) + 5; // 5s to 7s fall time

            drop.style.left = `${startX}px`;
            drop.style.top = `-100px`; // Start off-screen top
            drop.style.opacity = '1';
            drop.style.transitionDuration = `${fallDuration}s`;
            drop.style.transform = `translateY(${creditsAreaEl.clientHeight + 100}px) scale(0.8)`;
            
            creditsAreaEl.appendChild(drop);
            
            // Add a slight delay before starting the fall transition
            setTimeout(() => {
                drop.style.transform = `translateY(${creditsAreaEl.clientHeight + 100}px) scale(0.8)`;
            }, 10);
            
            // Cleanup after fall
            setTimeout(() => {
                drop.remove();
            }, fallDuration * 1000 + 500);
        }

        function stopRainMode() {
            if (rainInterval) {
                clearInterval(rainInterval);
                rainInterval = null;
            }
        }

        /* --- ACTION MODE (Random Animations) --- */
        function setupActionMode() {
            if (isRunning) return;
            isRunning = true;
            stopButton.style.display = 'block';
            startButton.style.display = 'none';
            runtimeSpeedControl.classList.remove('hidden');
            creditsContentEl.innerHTML = '';

            const sortedGames = sortGames(gameData, sortSelect.value);
            let currentGameIndex = 0;

            function showNextGame() {
                if (!isRunning || currentGameIndex >= sortedGames.length) {
                    if (isRunning) {
                        // Loop back
                        currentGameIndex = 0;
                    }
                    return;
                }

                const game = sortedGames[currentGameIndex];
                const gameContainer = document.createElement('div');
                gameContainer.className = 'absolute inset-0 flex items-center justify-center';

                // Random animation style
                const animations = ['slideIn', 'zoomIn', 'fadeIn', 'bounceIn', 'rotateIn'];
                const directions = ['left', 'right', 'top', 'bottom'];
                const selectedAnimation = animations[Math.floor(Math.random() * animations.length)];
                const selectedDirection = directions[Math.floor(Math.random() * directions.length)];
                
                const img = document.createElement('img');
                img.src = game.image;
                img.className = 'max-h-96 max-w-full object-contain rounded-2xl shadow-2xl';
                img.style.animation = `${selectedAnimation}${selectedDirection.charAt(0).toUpperCase() + selectedDirection.slice(1)} 0.6s ease-out`;

                const infoDiv = document.createElement('div');
                infoDiv.className = 'absolute bottom-8 left-0 right-0 text-center';
                infoDiv.innerHTML = `
                    <div class="text-3xl font-bold text-white drop-shadow-lg">${game.name}</div>
                    <div class="text-lg text-gray-300 mt-2">Rating: ${game.rating.toFixed(2)} | Year: ${game.released}</div>
                `;

                gameContainer.appendChild(img);
                gameContainer.appendChild(infoDiv);
                creditsContentEl.innerHTML = '';
                creditsContentEl.appendChild(gameContainer);

                currentGameIndex++;
                
                const delayMs = 3000 / currentSpeedMultiplier; // Adjust delay based on speed multiplier
                setTimeout(showNextGame, delayMs);
            }

            // Add CSS animations
            const style = document.createElement('style');
            style.textContent = `
                @keyframes slideInLeft { from { transform: translateX(-100%) translateY(-50%); opacity: 0; } to { transform: translateX(0) translateY(0); opacity: 1; } }
                @keyframes slideInRight { from { transform: translateX(100%) translateY(-50%); opacity: 0; } to { transform: translateX(0) translateY(0); opacity: 1; } }
                @keyframes slideInTop { from { transform: translateY(-100%) scaleX(0.8); opacity: 0; } to { transform: translateY(0) scaleX(1); opacity: 1; } }
                @keyframes slideInBottom { from { transform: translateY(100%) scaleX(0.8); opacity: 0; } to { transform: translateY(0) scaleX(1); opacity: 1; } }
                @keyframes zoomInLeft { from { transform: scale(0) translateX(-50%); opacity: 0; } to { transform: scale(1) translateX(0); opacity: 1; } }
                @keyframes zoomInRight { from { transform: scale(0) translateX(50%); opacity: 0; } to { transform: scale(1) translateX(0); opacity: 1; } }
                @keyframes zoomInTop { from { transform: scale(0) translateY(-50%); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
                @keyframes zoomInBottom { from { transform: scale(0) translateY(50%); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
                @keyframes fadeInLeft { from { transform: translateX(-30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
                @keyframes fadeInRight { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
                @keyframes fadeInTop { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
                @keyframes fadeInBottom { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
                @keyframes bounceInLeft { 0% { transform: translateX(-100%) scaleX(0.5); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateX(0) scaleX(1); } }
                @keyframes bounceInRight { 0% { transform: translateX(100%) scaleX(0.5); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateX(0) scaleX(1); } }
                @keyframes bounceInTop { 0% { transform: translateY(-100%) scaleY(0.5); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(0) scaleY(1); } }
                @keyframes bounceInBottom { 0% { transform: translateY(100%) scaleY(0.5); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(0) scaleY(1); } }
                @keyframes rotateInLeft { from { transform: rotate(-45deg) translateX(-100%); opacity: 0; } to { transform: rotate(0) translateX(0); opacity: 1; } }
                @keyframes rotateInRight { from { transform: rotate(45deg) translateX(100%); opacity: 0; } to { transform: rotate(0) translateX(0); opacity: 1; } }
                @keyframes rotateInTop { from { transform: rotate(-45deg) translateY(-100%); opacity: 0; } to { transform: rotate(0) translateY(0); opacity: 1; } }
                @keyframes rotateInBottom { from { transform: rotate(45deg) translateY(100%); opacity: 0; } to { transform: rotate(0) translateY(0); opacity: 1; } }
            `;
            if (!document.querySelector('style[data-action-mode]')) {
                style.setAttribute('data-action-mode', 'true');
                document.head.appendChild(style);
            }

            showNextGame();
        }

        function stopRainMode() {
            if (rainInterval) {
                clearInterval(rainInterval);
                rainInterval = null;
            }
            // Remove any lingering drops
            document.querySelectorAll('.raindrop').forEach(el => el.remove());
        }

        function stopModes() {
            // Stop Classic Roll
            creditsContentEl.classList.remove('roll-animation');
            creditsContentEl.style.transform = 'translateX(-50%) translateY(100vh)'; 
            
            // Stop Fireworks Mode
            document.querySelectorAll('.firework').forEach(el => el.remove());
            
            // Stop Rain Mode
            stopRainMode();
        }

        function stopCredits() {
            if (!isRunning) return;
            isRunning = false;
            stopButton.style.display = 'none';
            startButton.style.display = 'block';
            runtimeSpeedControl.classList.add('hidden');
            messageBox.textContent = "";
            document.getElementById('settingsPanel').style.display = 'block';

            stopModes();
        }

        // --- Event Listeners and Initialization ---

        bggUsernameInput.addEventListener('input', (e) => {
            if (e.target.value.trim()) {
                collectionFiltersDiv.style.display = 'block';
            } else {
                collectionFiltersDiv.style.display = 'none';
            }
        });

        startButton.addEventListener('click', async () => {
            // Only fetch if data is empty
            if (!gameData || gameData.length === 0) {
                const fetchedGames = await fetchGameData();
                if (fetchedGames.length === 0) {
                    return; // Stop if fetch failed
                }
            }
            
            // Hide settings panel for fullscreen mode
            document.getElementById('settingsPanel').style.display = 'none';
            stopModes(); // Clear previous mode effects

            const selectedMode = modeSelect.value;
            if (selectedMode === 'classic') {
                startClassicRoll();
            } else if (selectedMode === 'fireworks') {
                setupFireworksMode();
            } else if (selectedMode === 'rain') {
                setupRainMode();
            } else if (selectedMode === 'action') {
                setupActionMode();
            }
        });

        stopButton.addEventListener('click', stopCredits);
        
        speedRange.addEventListener('input', (e) => {
            const multiplier = parseFloat(e.target.value);
            currentSpeedMultiplier = multiplier;
            speedValueEl.textContent = `${multiplier}x`;
            
            const selectedMode = modeSelect.value;
            if (isRunning) {
                if (selectedMode === 'classic') {
                    // Update animation speed multiplier
                    const baseDuration = 20; // base animation time
                    creditsContentEl.style.animationDuration = `${baseDuration / multiplier}s`;
                } else if (selectedMode === 'rain') {
                    // Restart rain with new speed
                    stopRainMode();
                    setupRainMode(); 
                }
            }
        });

        runtimeSpeedSlider.addEventListener('input', (e) => {
            const multiplier = parseFloat(e.target.value);
            currentSpeedMultiplier = multiplier;
            runtimeSpeedValue.textContent = `${multiplier}x`;
            speedRange.value = multiplier;
            speedValueEl.textContent = `${multiplier}x`;
            
            const selectedMode = modeSelect.value;
            if (selectedMode === 'classic') {
                const baseDuration = 20;
                creditsContentEl.style.animationDuration = `${baseDuration / multiplier}s`;
            } else if (selectedMode === 'rain') {
                stopRainMode();
                setupRainMode();
            }
        });
        
        modeSelect.addEventListener('change', (e) => {
            // Update visibility of speed control based on mode
            const isVisualEffectMode = e.target.value === 'fireworks';
            speedControlEl.style.display = isVisualEffectMode ? 'none' : 'block';
            stopCredits(); // Stop and reset whenever mode changes
        });

        function handleAreaClick(event) {
            if (modeSelect.value === 'fireworks' && isRunning && gameData.length > 0) {
                launchFirework(event);
            }
        }

        window.addEventListener('load', () => {
            // Initial UI setup
            speedControlEl.style.display = modeSelect.value === 'fireworks' ? 'none' : 'block';
            collectionFiltersDiv.style.display = 'none'; // Hidden by default
            
            // Pre-fetch data immediately on load while showing the loading screen
            fetchGameData().then(data => {
                if (data.length > 0) {
                    // Show prompt now that data is ready
                    initialPrompt.style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
