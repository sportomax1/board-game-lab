<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, user-scalable=yes">
    <title>Arcade Credits Roller</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🎲</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            overflow: hidden; 
            background-color: #0d0d0d; 
            -webkit-tap-highlight-color: transparent; 
        }

        /* Credits Roll Container */
        .credits-container {
            height: 100vh;
            width: 100%;
            overflow: hidden;
            background-color: #0d0d0d; 
            position: relative;
        }

        /* Credits Content that scrolls */
        .credits-content {
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%) translateY(100vh);
            min-width: 250px;
            padding-bottom: 20vh;
        }

        .roll-animation {
            animation: creditsRoll linear infinite;
        }

        @keyframes creditsRoll {
            /* 'from' and 'to' values are set dynamically in JS */
            from { transform: translateX(-50%) translateY(100vh); }
        }

        .game-image {
            width: 120px;
            height: 120px;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5); 
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Fireworks Mode Styling */
        .firework {
            position: absolute;
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.5s, transform 3s cubic-bezier(0.25, 0.1, 0.25, 1);
            pointer-events: none;
            z-index: 50;
        }

        /* Raindrop Styling */
        .raindrop {
            position: absolute;
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 8px;
            opacity: 0;
            transition: transform linear, opacity 0.5s;
            pointer-events: none;
            z-index: 50;
        }

        /* Loading Screen Style */
        #loadingIndicator {
            transition: opacity 0.3s ease;
        }

        /* Vertical Slider Styling */
        #verticalSpeedSlider {
            writing-mode: vertical-lr;
            direction: rtl;
            height: 200px;
            width: 8px;
            accent-color: #6366f1;
            cursor: pointer;
        }

        /* Webkit slider track */
        #verticalSpeedSlider::-webkit-slider-runnable-track {
            background: linear-gradient(to top, #4f46e5, #818cf8);
            height: 200px;
            border-radius: 5px;
        }

        /* Webkit slider thumb */
        #verticalSpeedSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #ffffff;
            border: 2px solid #4f46e5;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        /* Firefox slider track */
        #verticalSpeedSlider::-moz-range-track {
            background: linear-gradient(to top, #4f46e5, #818cf8);
            height: 200px;
            border-radius: 5px;
        }

        /* Firefox slider thumb */
        #verticalSpeedSlider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #ffffff;
            border: 2px solid #4f46e5;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        /* Ready Set Go Countdown */
        #readySetGoOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            font-size: 10rem;
            font-weight: bold;
            text-shadow: 0 0 50px rgba(255, 255, 255, 0.8);
            user-select: none;
        }

        #readySetGoOverlay.ready { color: #fbbf24; }
        #readySetGoOverlay.set { color: #fbbf24; }
        #readySetGoOverlay.go { color: #22c55e; animation: pulse 0.3s ease-in-out; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
    </style>

    <!-- External API Keys -->
    <script>
        // RAWG API Key (optional)
        window.RAWG_KEY = typeof __rawg_api_key !== 'undefined' ? __rawg_api_key : 'DEMO_API_KEY_REQUIRED';
    </script>
</head>
<body class="bg-[#0d0d0d] text-white flex flex-col min-h-screen">

    <!-- Settings Panel (Fixed on Mobile - Top Section) -->
    <div id="settingsPanel" class="w-full p-4 bg-gray-900 border-b border-gray-700 shadow-2xl z-20 transition-all duration-300">
        <h1 class="text-2xl sm:text-3xl text-indigo-400 mb-3 font-bold">🎬 Credits Setup</h1>

        <div class="space-y-4 text-sm">
            <!-- BGG Username Input -->
            <div class="bg-gray-800 p-3 rounded-lg border border-gray-700">
                <label for="bggUsername" class="block text-xs sm:text-sm font-medium text-gray-300 mb-1.5">BoardGameGeek Username</label>
                <input type="text" id="bggUsername" value="sportomax" class="w-full p-2.5 bg-gray-700 text-white rounded-lg border border-gray-600 focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
            </div>

            <!-- Collection Filters -->
            <div id="collectionFilters" class="bg-gray-800 p-3 rounded-lg border border-gray-700">
                <label class="block text-xs sm:text-sm font-medium text-gray-300 mb-2">Collection Filters</label>
                <div class="grid grid-cols-2 gap-2">
                    <label class="flex items-center text-xs"><input type="checkbox" id="filterOwn" checked class="w-3 h-3 mr-2"> Own</label>
                    <label class="flex items-center text-xs"><input type="checkbox" id="filterPrevOwned" class="w-3 h-3 mr-2"> Prev Owned</label>
                    <label class="flex items-center text-xs"><input type="checkbox" id="filterWantToPlay" class="w-3 h-3 mr-2"> Want to Play</label>
                    <label class="flex items-center text-xs"><input type="checkbox" id="filterWantToBuy" class="w-3 h-3 mr-2"> Want to Buy</label>
                    <label class="flex items-center text-xs col-span-2"><input type="checkbox" id="filterExpansions" class="w-3 h-3 mr-2"> Include Expansions</label>
                </div>
            </div>

            <!-- Mode & Sort Row -->
            <div class="grid grid-cols-2 gap-2">
                <div class="bg-gray-800 p-3 rounded-lg border border-gray-700">
                    <label for="modeSelect" class="block text-xs font-medium text-gray-300 mb-1.5">Display Mode</label>
                    <select id="modeSelect" class="w-full p-2 bg-gray-700 text-white rounded-lg border border-gray-600 focus:ring-indigo-500 text-xs">
                        <option value="classic">🎥 Classic</option>
                        <option value="fireworks">🎇 Fireworks</option>
                        <option value="rain">🌧️ Rain</option>
                        <option value="action">🎬 Action</option>
                    </select>
                </div>
                <div class="bg-gray-800 p-3 rounded-lg border border-gray-700">
                    <label for="sortSelect" class="block text-xs font-medium text-gray-300 mb-1.5">Sort By</label>
                    <select id="sortSelect" class="w-full p-2 bg-gray-700 text-white rounded-lg border border-gray-600 focus:ring-indigo-500 text-xs">
                        <option value="random">🎲 Random</option>
                        <option value="name">A-Z Title</option>
                        <option value="rating">⭐ Rating</option>
                        <option value="released">📅 Year</option>
                        <option value="playtime">⏱️ Time</option>
                    </select>
                </div>
            </div>

            <!-- Speed Control -->
            <div class="bg-gray-800 p-3 rounded-lg border border-gray-700">
                <label class="block text-xs font-medium text-gray-300 mb-2">Speed (Pace): <span id="speedValue" class="text-indigo-400 font-bold">3</span>x</label>
                <input type="range" id="speedRange" min="1" max="10" step="1" value="3" class="w-full h-2 bg-gray-600 rounded accent-indigo-500">
            </div>

            <!-- Debug Mode -->
            <label class="flex items-center gap-2 bg-gray-800 p-3 rounded-lg border border-gray-700 text-xs cursor-pointer">
                <input type="checkbox" id="debugMode" class="w-3 h-3">
                <span class="text-gray-300">Debug Mode (Show Index)</span>
            </label>

            <!-- Action Buttons -->
            <div class="pt-2 space-y-2">
                <button id="startButton" class="w-full py-3 text-base sm:text-lg font-bold bg-green-600 hover:bg-green-700 text-white rounded-lg shadow-lg transition-colors">
                    🚀 START
                </button>
                <button id="stopButton" class="w-full py-3 text-base sm:text-lg font-bold bg-red-600 hover:bg-red-700 text-white rounded-lg shadow-lg transition-colors" style="display: none;">
                    🛑 STOP
                </button>
            </div>
            
            <div id="messageBox" class="text-xs text-center font-medium text-yellow-400 pt-2 min-h-5"></div>
        </div>
    </div>

    <!-- Credits Display Area (Takes up the rest of the screen) -->
    <div id="creditsArea" class="credits-container flex-grow relative" onclick="handleAreaClick(event)">
        
        <!-- Vertical Speed Slider on Left Side (shown during game) -->
        <div id="verticalSpeedControl" class="absolute left-2 top-1/2 -translate-y-1/2 z-40 hidden flex flex-col items-center gap-3 bg-gray-900/90 backdrop-blur p-3 rounded-lg border border-gray-700 w-16">
            <!-- Buttons at top -->
            <div class="flex flex-col gap-2 w-full">
                <button id="pauseBtn" class="w-full py-1.5 px-2 text-xs font-bold bg-yellow-600 hover:bg-yellow-700 text-white rounded transition-colors" title="Pause/Resume">⏸</button>
                <button id="restartBtn" class="w-full py-1.5 px-2 text-xs font-bold bg-blue-600 hover:bg-blue-700 text-white rounded transition-colors" title="Restart">↻</button>
                <button id="settingsBtn" class="w-full py-1.5 px-2 text-xs font-bold bg-purple-600 hover:bg-purple-700 text-white rounded transition-colors" title="Settings">⚙</button>
            </div>
            
            <!-- Speed label -->
            <div class="text-xs font-bold text-indigo-400">FAST</div>
            
            <!-- Vertical slider - Using standard writing-mode approach -->
            <input type="range" id="verticalSpeedSlider" min="1" max="10" step="1" value="3" style="writing-mode: vertical-lr; direction: rtl; width: 8px; height: 200px; accent-color: #6366f1; cursor: pointer;">
            
            <!-- Speed display -->
            <div class="text-xs text-indigo-300 font-bold"><span id="verticalSpeedValue">3</span>x</div>
            <div class="text-xs font-bold text-gray-400">SLOW</div>
            
            <!-- Exit button -->
            <button onclick="exitCreditsMode()" class="w-full py-1.5 px-2 text-xs font-bold bg-red-600 hover:bg-red-700 text-white rounded transition-colors" title="Exit">✕</button>
        </div>
        
        <!-- Ready Set Go Countdown -->
        <div id="readySetGoOverlay" style="display: none;">READY</div>

        <!-- Loading Indicator (Initially visible, will be hidden after initial load) -->
        <div id="loadingIndicator" class="absolute inset-0 flex flex-col items-center justify-center bg-black bg-opacity-90 z-50">
            <svg class="animate-spin h-14 w-14 text-indigo-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="mt-4 text-indigo-400 text-xl font-bold">Loading Game Data...</span>
        </div>

        <div id="creditsContent" class="credits-content">
            <div id="initialPrompt" class="text-center p-8 mt-[30vh] text-gray-500 text-2xl font-light" style="display: none;">
                Settings are configured. Hit START to begin!
            </div>
        </div>
    </div>

    <script>
        // --- Global State ---
        let gameData = [];
        let isRunning = false;
        let rainInterval = null; // Interval for the rain effect
        let actionModeInterval = null; // Interval for action mode
        let useBGGCollection = false; // Flag to track if using BGG collection
        let currentSpeedMultiplier = 3; // Speed multiplier for pace (default 3x)
        
        // --- DOM Elements ---
        const creditsContentEl = document.getElementById('creditsContent');
        const creditsAreaEl = document.getElementById('creditsArea');
        const startButton = document.getElementById('startButton');
        const stopButton = document.getElementById('stopButton');
        const speedRange = document.getElementById('speedRange');
        const speedValueEl = document.getElementById('speedValue');
        const runtimeSpeedControl = document.getElementById('runtimeSpeedControl');
        const runtimeSpeedSlider = document.getElementById('runtimeSpeedSlider');
        const runtimeSpeedValue = document.getElementById('runtimeSpeedValue');
        const sortSelect = document.getElementById('sortSelect');
        const modeSelect = document.getElementById('modeSelect');
        const speedControlEl = document.getElementById('speedControl');
        const messageBox = document.getElementById('messageBox');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const initialPrompt = document.getElementById('initialPrompt');
        const bggUsernameInput = document.getElementById('bggUsername');
        const collectionFiltersDiv = document.getElementById('collectionFilters');

        // The RAWG API endpoint for a list of popular games
        const RAWG_URL = 'https://api.rawg.io/api/games?';

        // --- API and Data Fetching ---
        
        // Exponential backoff retry logic for the fetch call
        async function fetchWithRetry(url, options, maxRetries = 3, delay = 1000) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response;
                } catch (error) {
                    if (i < maxRetries - 1) {
                        await new Promise(resolve => setTimeout(resolve, delay));
                        delay *= 2; // Exponential backoff
                    } else {
                        throw error;
                    }
                }
            }
        }

        async function fetchFromBGG(username) {
            try {
                // Build filter parameters
                let filters = [];
                if (document.getElementById('filterOwn').checked) filters.push('own=1');
                if (document.getElementById('filterPrevOwned').checked) filters.push('prevowned=1');
                if (document.getElementById('filterWantToPlay').checked) filters.push('wanttoplay=1');
                if (document.getElementById('filterWantToBuy').checked) filters.push('wanttobuy=1');

                const filterStr = filters.length > 0 ? '&' + filters.join('&') : '&own=1';
                const response = await fetch(`/api/bgg-helper?endpoint=collection&username=${username}${filterStr}&stats=1`);

                if (!response.ok) throw new Error('Failed to fetch collection');

                const text = await response.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, 'text/xml');

                const games = Array.from(xml.querySelectorAll('item')).map(item => {
                    const name = item.querySelector('name')?.textContent || 'Unknown';
                    const yearPublished = item.querySelector('yearpublished')?.textContent || 0;
                    const rating = parseFloat(item.querySelector('average')?.textContent || 0);
                    const image = item.querySelector('image')?.textContent || '';
                    const minplayers = parseInt(item.querySelector('minplayers')?.textContent || 1);
                    const playingtime = parseInt(item.querySelector('playingtime')?.textContent || 0);
                    
                    // Check if it's an expansion
                    const type = item.getAttribute('subtype') || '';
                    const isExpansion = type.toLowerCase() === 'expansion' || name.toLowerCase().includes('expansion');

                    return {
                        id: item.getAttribute('objectid'),
                        name: name,
                        released: parseInt(yearPublished),
                        rating: rating,
                        image: image,
                        metacritic: 0,
                        minPlayers: minplayers,
                        playtime: playingtime,
                        isExpansion: isExpansion
                    };
                }).filter(g => {
                    if (!g.image) return false;
                    // Filter out expansions unless explicitly enabled
                    if (g.isExpansion && !document.getElementById('filterExpansions').checked) return false;
                    return true;
                });

                // Remove duplicates
                return Array.from(new Map(games.map(g => [g.name, g])).values());
            } catch (error) {
                console.error('BGG Fetch Error:', error);
                throw error;
            }
        }

        async function fetchGameData() {
            loadingIndicator.style.display = 'flex'; // Show loading screen
            initialPrompt.style.display = 'none';

            try {
                const bggUsername = bggUsernameInput.value.trim();
                
                if (bggUsername) {
                    // Fetch from BGG collection
                    useBGGCollection = true;
                    const games = await fetchFromBGG(bggUsername);
                    if (games.length === 0) {
                        messageBox.textContent = '❌ No games found in BGG collection. Check username and filters.';
                        loadingIndicator.style.display = 'none';
                        initialPrompt.style.display = 'block';
                        return [];
                    }
                    gameData = games;
                    messageBox.textContent = `✅ Loaded ${games.length} games from BGG collection.`;
                    
                    // Log games to console with index and info
                    console.log(`=== BGG Collection Loaded (${games.length} games) ===`);
                    games.forEach((game, idx) => {
                        console.log(`#${idx + 1} ${game.name} - Rating: ${game.rating}, Released: ${game.released}, MinPlayers: ${game.minPlayers}, Playtime: ${game.playtime}m`);
                    });
                } else {
                    // Fetch from RAWG API
                    useBGGCollection = false;
                    const apiKey = window.RAWG_KEY;
                    const bearerToken = window.BEARER_TOKEN;

                    if (apiKey === 'DEMO_API_KEY_REQUIRED' || !bearerToken) {
                        messageBox.textContent = '❌ Error: API Key or Bearer Token secrets are missing. Cannot fetch data.';
                        loadingIndicator.style.display = 'none';
                        initialPrompt.style.display = 'block';
                        return [];
                    }
                    
                    const url = `${RAWG_URL}key=${apiKey}&page_size=40&platforms=1&ordering=-rating`; 
                    const fetchOptions = {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${bearerToken}`, 
                            'Content-Type': 'application/json'
                        }
                    };

                    const response = await fetchWithRetry(url, fetchOptions);
                    const data = await response.json();
                    
                    const games = data.results.map(g => ({
                        id: g.id,
                        name: g.name,
                        released: new Date(g.released).getFullYear() || 0,
                        rating: g.rating,
                        image: g.background_image, 
                        metacritic: g.metacritic || 0
                    })).filter(g => g.image);

                    gameData = games;
                    messageBox.textContent = `✅ Loaded ${games.length} games from RAWG API.`;
                    
                    // Log games to console with index
                    console.log(`=== RAWG API Games Loaded (${games.length} games) ===`);
                    games.forEach((game, idx) => {
                        console.log(`#${idx + 1} ${game.name} - Rating: ${game.rating}, Released: ${game.released}`);
                    });
                }
                return gameData;

            } catch (error) {
                console.error('API Fetch Error:', error);
                messageBox.textContent = `❌ API Error: ${error.message}`;
                return [];
            } finally {
                loadingIndicator.style.display = 'none'; // Hide loading screen
                initialPrompt.style.display = 'block';
            }
        }

        // --- Utility and Rendering ---

        function sortGames(games, sortBy) {
            const sorted = [...games]; 
            switch (sortBy) {
                case 'random':
                    return sorted.sort(() => Math.random() - 0.5);
                case 'name':
                    return sorted.sort((a, b) => a.name.localeCompare(b.name));
                case 'rating':
                    return sorted.sort((a, b) => b.rating - a.rating);
                case 'rating-asc':
                    return sorted.sort((a, b) => a.rating - b.rating);
                case 'released':
                    return sorted.sort((a, b) => b.released - a.released);
                case 'released-asc':
                    return sorted.sort((a, b) => a.released - b.released);
                case 'playtime':
                    return sorted.sort((a, b) => (b.playtime || 0) - (a.playtime || 0));
                case 'players':
                    return sorted.sort((a, b) => (a.minPlayers || 1) - (b.minPlayers || 1));
                default:
                    return sorted;
            }
        }

        function renderCreditsContent(games) {
            creditsContentEl.innerHTML = '';
            initialPrompt.style.display = 'none';

            const debugMode = document.getElementById('debugMode').checked;

            // Render ALL games with proper sequential indexing
            games.forEach((game, index) => {
                const div = document.createElement('div');
                const color = index % 3 === 0 ? 'text-indigo-300' : index % 3 === 1 ? 'text-yellow-300' : 'text-green-300';
                
                div.className = 'game-item flex flex-col items-center justify-center p-6 w-full text-center';
                // Show proper index with total count
                const indexDisplay = `<div class="text-xs text-gray-500 mb-1">#${index + 1}/${games.length}</div>`;
                
                div.innerHTML = `
                    ${indexDisplay}
                    <img src="${game.image}" 
                         onerror="this.onerror=null;this.src='https://placehold.co/120x120/1F2937/ffffff?text=${game.name.substring(0, 3)}'; this.className='game-image bg-gray-800';" 
                         class="game-image transition-all duration-300 transform" 
                         alt="${game.name}">
                    <div class="mt-4 text-xl font-semibold ${color}">${game.name}</div>
                    <div class="text-sm text-gray-400">Rating: ${game.rating.toFixed(2)} | Year: ${game.released}</div>
                    <div class="h-8"></div> <!-- Spacer -->
                `;
                creditsContentEl.appendChild(div);
            });
        }

        // --- Mode Logic ---

        function startClassicRoll() {
            if (isRunning) return;
            isRunning = true;
            stopButton.style.display = 'block';
            startButton.style.display = 'none';
            verticalSpeedControl.classList.remove('hidden');
            console.log('📍 VERTICAL CONTROL PANEL NOW VISIBLE on LEFT SIDE');
            console.log('    ⏸ Pause Button (top)');
            console.log('    ↻ Restart Button (center top)');
            console.log('    ⚙ Settings Button (center bottom)');
            console.log('    ║');
            console.log('    | | Vertical Speed Slider');
            console.log('    ║');
            console.log('    ✕ Exit Button (bottom)');

            const sortedGames = sortGames(gameData, sortSelect.value);
            
            console.log(`🎬 Classic roll starting: ${sortedGames.length} games, first game: "${sortedGames[0]?.name || 'UNKNOWN'}", speed: ${currentSpeedMultiplier}x`);
            
            // Clear the credits area completely
            creditsAreaEl.innerHTML = '';
            creditsContentEl.innerHTML = '';
            
            // Create a new container for the scroll
            const scrollContainer = document.createElement('div');
            scrollContainer.style.cssText = `
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: linear-gradient(to bottom, #0d0d0d, #1a1a2e);
                display: flex;
                align-items: center;
                justify-content: center;
            `;
            
            // Create the content that will scroll
            const scrollContent = document.createElement('div');
            scrollContent.style.cssText = `
                width: 100%;
                max-width: 600px;
                padding: 0 2rem;
                text-align: center;
            `;
            
            // Add opening space with LETS ROLL header
            const openingSpace = document.createElement('div');
            openingSpace.style.cssText = `
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 3.5rem;
                font-weight: bold;
                color: #fff;
                text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
                gap: 1rem;
            `;
            openingSpace.innerHTML = `
                <div>🎲</div>
                <div>LETS ROLL</div>
            `;
            scrollContent.appendChild(openingSpace);
            
            // Add each game as a "credit"
            sortedGames.forEach((game, index) => {
                const gameCredit = document.createElement('div');
                gameCredit.style.cssText = `
                    padding: 3rem 1rem;
                    margin: 2rem 0;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    gap: 1rem;
                    min-height: auto;
                `;
                
                // Game number
                const gameNumber = document.createElement('div');
                gameNumber.style.cssText = `
                    font-size: 0.875rem;
                    color: #888;
                    letter-spacing: 0.1em;
                    text-transform: uppercase;
                `;

            firework.src = game.image;
            firework.className = 'firework';

            firework.style.top = `${event.clientY}px`;

            const finalY = (Math.random() * 200) + 150;

            firework.style.transitionTimingFunction = 'cubic-bezier(0.2, 0.8, 0.4, 1.2)';

        /* --- RAIN MODE --- */
        function setupRainMode() {
            stopCredits();
            console.log('🌧️ Setting up RAIN MODE');
            messageBox.textContent = "🌧️ Game covers are now raining down the screen! Click screen or press ESC to exit.";
            creditsContentEl.innerHTML = '';
            isRunning = true;
            stopButton.style.display = 'block';
            startButton.style.display = 'none';

            const speedMultiplier = parseFloat(speedRange.value);
            // Rain rate based on speed: slower multiplier = slower rain, faster multiplier = faster rain
            const baseIntervalTime = 1000; // 1 raindrop per second at default speed
            const intervalTime = baseIntervalTime / speedMultiplier; 

            rainInterval = setInterval(() => {
                if (gameData.length > 0) {
                    dropRaindrop();
                }
            }, intervalTime);
        }

        function dropRaindrop() {
            if (gameData.length === 0) {
                console.warn('No game data available for raindrop');
                return;
            }
            const randomIndex = Math.floor(Math.random() * gameData.length);
            const game = gameData[randomIndex];
            
            const drop = document.createElement('img');
            drop.src = game.image;
            drop.className = 'raindrop';
            
            // Random start X position across the width
            const startX = Math.random() * creditsAreaEl.clientWidth;
            // The fall speed (shorter duration = faster fall)
            const fallDuration = (Math.random() * 2) + 4; // 4s to 6s fall time

            drop.style.left = `${startX}px`;
            drop.style.top = `-100px`; // Start off-screen top
            drop.style.opacity = '1';
            
            creditsAreaEl.appendChild(drop);
            
            // Trigger the fall transition
            requestAnimationFrame(() => {
                drop.style.transitionDuration = `${fallDuration}s`;
                drop.style.transform = `translateY(${creditsAreaEl.clientHeight + 100}px) scale(0.8)`;
            });
            
            // Cleanup after fall
            setTimeout(() => {
                drop.remove();
            }, fallDuration * 1000 + 500);
        }

        function stopRainMode() {
            console.log('Stopping RAIN MODE');
            if (rainInterval) {
                clearInterval(rainInterval);
                rainInterval = null;
            }
            // Remove all falling raindrops
            document.querySelectorAll('.raindrop').forEach(drop => drop.remove());
        }
