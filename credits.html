<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Credits">
    <title>Game Collection Credits</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='16' font-size='16' fill='%23fbbf24'>🎬</text></svg>" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Inter:wght@400;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: white;
            overscroll-behavior: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }

        .credits-title {
            font-family: 'Cinzel', serif;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #444; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #666; 
        }

        /* Credits Container */
        #creditsContainer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            transform: translateY(100%);
            will-change: transform;
        }

        #creditsContainer.scrolling {
            animation: scrollUp var(--scroll-duration) linear forwards;
        }

        @keyframes scrollUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(-100%);
            }
        }

        #creditsContainer.paused {
            animation-play-state: paused;
        }

        /* Game Credit Card */
        .credit-item {
            margin-bottom: clamp(80px, 25vh, 120px);
            opacity: 0;
            animation: fadeIn 1s ease-in forwards;
            width: 100%;
        }

        @media (max-width: 768px) {
            header {
                padding: 8px 12px !important;
            }
            .controls-overlay {
                bottom: 10px !important;
                padding: 10px 12px !important;
                gap: 6px !important;
            }
            .control-btn {
                width: 36px !important;
                height: 36px !important;
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .credit-category {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #fbbf24;
            margin-bottom: 40px;
            text-align: center;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
        }

        .credit-game-name {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.5rem, 6vw, 2.5rem);
            font-weight: 600;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            line-height: 1.2;
            padding: 0 10px;
        }

        .credit-game-image {
            max-width: min(100vw - 20px, 400px);
            max-height: 60vh;
            width: auto;
            height: auto;
            margin: 0 auto 20px;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            display: block;
        }

        .credit-details {
            text-align: center;
            font-size: clamp(0.85rem, 2.5vw, 1rem);
            color: #cbd5e1;
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            padding: 0 10px;
        }

        .credit-stat {
            display: inline-block;
            margin: 0;
            padding: clamp(6px, 1.5vw, 8px) clamp(10px, 2vw, 16px);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            white-space: nowrap;
        }

        .end-credits {
            font-family: 'Cinzel', serif;
            font-size: 3rem;
            font-weight: 800;
            text-align: center;
            margin: 200px 0;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
        }

        /* Controls Overlay */
        .controls-overlay {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .controls-overlay.visible {
            opacity: 1;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        /* Loading Spinner */
        .loader {
            border: 4px solid #1e293b;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Starfield Background */
        .starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Theme Styles */
        
        /* Space Theme */
        body.theme-space {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
        }
        .theme-space .starfield {
            opacity: 1;
        }
        .theme-space .credit-category {
            color: #60a5fa;
            text-shadow: 0 0 20px rgba(96, 165, 250, 0.6);
        }
        .theme-space .credit-game-name {
            color: #e0e7ff;
            text-shadow: 0 0 15px rgba(96, 165, 250, 0.4);
        }
        .theme-space .credit-stat {
            background: rgba(59, 130, 246, 0.1);
            border-color: rgba(96, 165, 250, 0.3);
            color: #bfdbfe;
        }

        /* Water Theme */
        body.theme-water {
            background: linear-gradient(135deg, #001f3f 0%, #0047ab 50%, #1e90ff 100%);
        }
        .theme-water .starfield {
            opacity: 0.1;
        }
        .theme-water .credit-category {
            color: #00f0ff;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
        }
        .theme-water .credit-game-name {
            color: #7fffd4;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }
        .theme-water .credit-stat {
            background: rgba(0, 240, 255, 0.1);
            border-color: rgba(0, 240, 255, 0.3);
            color: #afeeee;
        }

        /* Land Theme */
        body.theme-land {
            background: linear-gradient(135deg, #654321 0%, #8b7355 50%, #daa520 100%);
        }
        .theme-land .starfield {
            opacity: 0;
        }
        .theme-land .credit-category {
            color: #fff8dc;
            text-shadow: 0 0 20px rgba(218, 165, 32, 0.6);
        }
        .theme-land .credit-game-name {
            color: #fffacd;
            text-shadow: 0 0 15px rgba(218, 165, 32, 0.4);
        }
        .theme-land .credit-stat {
            background: rgba(218, 165, 32, 0.1);
            border-color: rgba(218, 165, 32, 0.3);
            color: #f0e68c;
        }

        /* Fire Theme */
        body.theme-fire {
            background: linear-gradient(135deg, #1a0000 0%, #4d0000 50%, #8b0000 100%);
        }
        .theme-fire .starfield {
            opacity: 0.2;
        }
        .theme-fire .credit-category {
            color: #ffb347;
            text-shadow: 0 0 20px rgba(255, 99, 71, 0.6);
        }
        .theme-fire .credit-game-name {
            color: #ffcc99;
            text-shadow: 0 0 15px rgba(255, 165, 0, 0.4);
        }
        .theme-fire .credit-stat {
            background: rgba(255, 69, 0, 0.1);
            border-color: rgba(255, 165, 0, 0.3);
            color: #ffa500;
        }

        /* Forest Theme */
        body.theme-forest {
            background: linear-gradient(135deg, #0d2818 0%, #1a5c3a 50%, #2d8659 100%);
        }
        .theme-forest .starfield {
            opacity: 0.1;
        }
        .theme-forest .credit-category {
            color: #7cfc00;
            text-shadow: 0 0 20px rgba(124, 252, 0, 0.6);
        }
        .theme-forest .credit-game-name {
            color: #90ee90;
            text-shadow: 0 0 15px rgba(144, 238, 144, 0.4);
        }
        .theme-forest .credit-stat {
            background: rgba(124, 252, 0, 0.1);
            border-color: rgba(144, 238, 144, 0.3);
            color: #a8e6a1;
        }

        /* Purple/Mystic Theme */
        body.theme-mystic {
            background: linear-gradient(135deg, #2d1b4e 0%, #4a235a 50%, #7e3a8c 100%);
        }
        .theme-mystic .starfield {
            opacity: 0.3;
        }
        .theme-mystic .credit-category {
            color: #da70d6;
            text-shadow: 0 0 20px rgba(218, 112, 214, 0.6);
        }
        .theme-mystic .credit-game-name {
            color: #ee82ee;
            text-shadow: 0 0 15px rgba(238, 130, 238, 0.4);
        }
        .theme-mystic .credit-stat {
            background: rgba(218, 112, 214, 0.1);
            border-color: rgba(238, 130, 238, 0.3);
            color: #dda0dd;
        }

        /* Neutral/Classic Theme */
        body.theme-neutral {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #3d3d3d 100%);
        }
        .theme-neutral .starfield {
            opacity: 0.15;
        }
        .theme-neutral .credit-category {
            color: #e0e0e0;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }
        .theme-neutral .credit-game-name {
            color: #f5f5f5;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }
        .theme-neutral .credit-stat {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
            color: #d0d0d0;
        }
    </style>
</head>
<body>

    <!-- Starfield Background -->
    <div class="starfield" id="starfield"></div>

    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 bg-black/80 border-b border-gray-800 p-3 flex justify-between items-center z-50 shadow-lg backdrop-blur-md">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-gradient-to-br from-yellow-500 to-amber-700 rounded-lg flex items-center justify-center font-bold text-lg">🎬</div>
            <h1 class="font-bold text-xl tracking-tight credits-title">Credits</h1>
        </div>
        <div class="flex gap-2">
            <button id="settingsBtn" class="px-3 py-1.5 text-sm bg-yellow-600 hover:bg-yellow-700 text-black font-semibold rounded-lg shadow transition-colors">
                ⚙️ Settings
            </button>
        </div>
    </header>

    <!-- Main Credits Display Area -->
    <main id="mainArea" class="h-screen w-full flex items-center justify-center">
        
        <!-- Credits Container -->
        <div id="creditsContainer" class="w-full max-w-4xl px-4">
            <!-- Credits will be populated here -->
        </div>

    </main>

    <!-- Controls Overlay -->
    <div id="controlsOverlay" class="controls-overlay">
        <button id="playPauseBtn" class="control-btn" title="Play/Pause">
            <svg id="pauseIcon" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
            </svg>
            <svg id="playIcon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
            </svg>
        </button>
        <button id="restartBtn" class="control-btn" title="Restart">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
        </button>
        <button id="speedSlowerBtn" class="control-btn" title="Slower">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
        </button>
        <button id="speedFasterBtn" class="control-btn" title="Faster">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
        </button>
        <button id="stopBtn" class="control-btn" title="Stop & Reset">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                <rect x="6" y="6" width="12" height="12"/>
            </svg>
        </button>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/95 backdrop-blur-md z-50 flex items-center justify-center p-4" style="display: flex;">
        <div class="bg-slate-900 w-full max-w-md rounded-2xl border border-slate-700 shadow-2xl overflow-hidden relative">
            <!-- X Close Button -->
            <button id="closeModalX" class="absolute top-4 right-4 text-slate-400 hover:text-white p-2 z-10">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <div class="p-6">
                <h2 class="text-2xl font-bold text-white mb-1 credits-title">Credits Setup</h2>
                <p class="text-slate-400 text-sm mb-6">Configure your collection and playback settings.</p>

                <div class="space-y-5">
                    <!-- Theme Selection -->
                    <div class="bg-slate-800/50 rounded-xl p-4 border border-slate-700/50">
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-3">Visual Theme</label>
                        <div class="grid grid-cols-2 gap-2">
                            <label class="flex items-center gap-3 cursor-pointer group p-2 rounded hover:bg-slate-700 transition">
                                <input type="radio" name="theme" value="space" checked class="peer sr-only">
                                <div class="w-4 h-4 border-2 border-slate-500 rounded-full peer-checked:bg-blue-500 peer-checked:border-blue-500 transition-all"></div>
                                <span class="text-sm text-slate-300 group-hover:text-white transition-colors">🌌 Space</span>
                            </label>
                            <label class="flex items-center gap-3 cursor-pointer group p-2 rounded hover:bg-slate-700 transition">
                                <input type="radio" name="theme" value="water" class="peer sr-only">
                                <div class="w-4 h-4 border-2 border-slate-500 rounded-full peer-checked:bg-cyan-400 peer-checked:border-cyan-400 transition-all"></div>
                                <span class="text-sm text-slate-300 group-hover:text-white transition-colors">💧 Water</span>
                            </label>
                            <label class="flex items-center gap-3 cursor-pointer group p-2 rounded hover:bg-slate-700 transition">
                                <input type="radio" name="theme" value="land" class="peer sr-only">
                                <div class="w-4 h-4 border-2 border-slate-500 rounded-full peer-checked:bg-yellow-600 peer-checked:border-yellow-600 transition-all"></div>
                                <span class="text-sm text-slate-300 group-hover:text-white transition-colors">🏜️ Land</span>
                            </label>
                            <label class="flex items-center gap-3 cursor-pointer group p-2 rounded hover:bg-slate-700 transition">
                                <input type="radio" name="theme" value="fire" class="peer sr-only">
                                <div class="w-4 h-4 border-2 border-slate-500 rounded-full peer-checked:bg-red-500 peer-checked:border-red-500 transition-all"></div>
                                <span class="text-sm text-slate-300 group-hover:text-white transition-colors">🔥 Fire</span>
                            </label>
                            <label class="flex items-center gap-3 cursor-pointer group p-2 rounded hover:bg-slate-700 transition">
                                <input type="radio" name="theme" value="forest" class="peer sr-only">
                                <div class="w-4 h-4 border-2 border-slate-500 rounded-full peer-checked:bg-green-500 peer-checked:border-green-500 transition-all"></div>
                                <span class="text-sm text-slate-300 group-hover:text-white transition-colors">🌲 Forest</span>
                            </label>
                            <label class="flex items-center gap-3 cursor-pointer group p-2 rounded hover:bg-slate-700 transition">
                                <input type="radio" name="theme" value="mystic" class="peer sr-only">
                                <div class="w-4 h-4 border-2 border-slate-500 rounded-full peer-checked:bg-purple-500 peer-checked:border-purple-500 transition-all"></div>
                                <span class="text-sm text-slate-300 group-hover:text-white transition-colors">✨ Mystic</span>
                            </label>
                            <label class="flex items-center gap-3 cursor-pointer group p-2 rounded hover:bg-slate-700 transition col-span-2">
                                <input type="radio" name="theme" value="neutral" class="peer sr-only">
                                <div class="w-4 h-4 border-2 border-slate-500 rounded-full peer-checked:bg-gray-400 peer-checked:border-gray-400 transition-all"></div>
                                <span class="text-sm text-slate-300 group-hover:text-white transition-colors">⚪ Neutral</span>
                            </label>
                        </div>
                    </div>

                    <!-- Username -->
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2">BGG Username</label>
                        <input type="text" id="usernameInput" value="sportomax" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-yellow-500 placeholder-slate-600 transition-all">
                    </div>

                    <!-- Collection Filters -->
                    <div class="bg-slate-800/50 rounded-xl p-4 border border-slate-700/50">
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-3">Collection Filters</label>
                        <div class="grid grid-cols-2 gap-3">
                            <label class="flex items-center gap-3 cursor-pointer group">
                                <div class="relative flex items-center">
                                    <input type="checkbox" id="filterOwn" checked class="peer sr-only">
                                    <div class="w-5 h-5 border-2 border-slate-600 rounded bg-slate-700 peer-checked:bg-yellow-500 peer-checked:border-yellow-500 transition-all"></div>
                                    <svg class="absolute w-3 h-3 text-black left-1 top-1 opacity-0 peer-checked:opacity-100 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                </div>
                                <span class="text-sm text-slate-300 group-hover:text-white transition-colors">Own</span>
                            </label>

                            <label class="flex items-center gap-3 cursor-pointer group">
                                <div class="relative flex items-center">
                                    <input type="checkbox" id="filterPrevOwned" class="peer sr-only">
                                    <div class="w-5 h-5 border-2 border-slate-600 rounded bg-slate-700 peer-checked:bg-yellow-500 peer-checked:border-yellow-500 transition-all"></div>
                                    <svg class="absolute w-3 h-3 text-black left-1 top-1 opacity-0 peer-checked:opacity-100 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                </div>
                                <span class="text-sm text-slate-300 group-hover:text-white transition-colors">Prev. Owned</span>
                            </label>

                            <label class="flex items-center gap-3 cursor-pointer group">
                                <div class="relative flex items-center">
                                    <input type="checkbox" id="filterWantToPlay" class="peer sr-only">
                                    <div class="w-5 h-5 border-2 border-slate-600 rounded bg-slate-700 peer-checked:bg-yellow-500 peer-checked:border-yellow-500 transition-all"></div>
                                    <svg class="absolute w-3 h-3 text-black left-1 top-1 opacity-0 peer-checked:opacity-100 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                </div>
                                <span class="text-sm text-slate-300 group-hover:text-white transition-colors">Want to Play</span>
                            </label>

                            <label class="flex items-center gap-3 cursor-pointer group">
                                <div class="relative flex items-center">
                                    <input type="checkbox" id="filterWantToBuy" class="peer sr-only">
                                    <div class="w-5 h-5 border-2 border-slate-600 rounded bg-slate-700 peer-checked:bg-yellow-500 peer-checked:border-yellow-500 transition-all"></div>
                                    <svg class="absolute w-3 h-3 text-black left-1 top-1 opacity-0 peer-checked:opacity-100 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                </div>
                                <span class="text-sm text-slate-300 group-hover:text-white transition-colors">Want to Buy</span>
                            </label>
                            
                            <label class="flex items-center gap-3 cursor-pointer group col-span-2 border-t border-slate-700 pt-3 mt-1">
                                <div class="relative flex items-center">
                                    <input type="checkbox" id="filterExpansions" class="peer sr-only">
                                    <div class="w-5 h-5 border-2 border-slate-600 rounded bg-slate-700 peer-checked:bg-purple-500 peer-checked:border-purple-500 transition-all"></div>
                                    <svg class="absolute w-3 h-3 text-white left-1 top-1 opacity-0 peer-checked:opacity-100 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                </div>
                                <span class="text-sm text-slate-300 group-hover:text-white transition-colors">Include Expansions</span>
                            </label>

                            <label class="flex items-center gap-3 cursor-pointer group col-span-2 border-t border-slate-700 pt-3 mt-1">
                                <div class="relative flex items-center">
                                    <input type="checkbox" id="filterPlayedOnly" class="peer sr-only">
                                    <div class="w-5 h-5 border-2 border-slate-600 rounded bg-slate-700 peer-checked:bg-green-500 peer-checked:border-green-500 transition-all"></div>
                                    <svg class="absolute w-3 h-3 text-white left-1 top-1 opacity-0 peer-checked:opacity-100 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                </div>
                                <span class="text-sm text-slate-300 group-hover:text-white transition-colors">Played Only (1+ plays)</span>
                            </label>
                        </div>
                    </div>

                    <!-- Sort Options -->
                    <div class="bg-slate-800/50 rounded-xl p-4 border border-slate-700/50">
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-3">Sort Games By</label>
                        <select id="sortBy" class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-yellow-500 cursor-pointer">
                            <option value="name">Name (A-Z)</option>
                            <option value="name-desc">Name (Z-A)</option>
                            <option value="rating">Rating (High to Low)</option>
                            <option value="rating-asc">Rating (Low to High)</option>
                            <option value="year">Year (Newest First)</option>
                            <option value="year-asc">Year (Oldest First)</option>
                            <option value="plays">Play Count (Most Played)</option>
                            <option value="plays-asc">Play Count (Least Played)</option>
                            <option value="random">Random Order</option>
                        </select>
                    </div>

                    <!-- Scroll Speed -->
                    <div class="bg-slate-800/50 rounded-xl p-4 border border-slate-700/50">
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-3">Scroll Speed</label>
                        <div class="flex items-center gap-4">
                            <input type="range" id="scrollSpeed" min="10" max="120" value="60" class="flex-1 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-yellow-500">
                            <span id="scrollSpeedDisplay" class="text-sm font-bold text-white bg-slate-700 px-3 py-1 rounded-lg min-w-16 text-center">60s</span>
                        </div>
                        <p class="text-xs text-slate-500 mt-2">Time for credits to complete one full scroll (per game)</p>
                    </div>

                    <!-- Game Limit -->
                    <div class="bg-slate-800/50 rounded-xl p-4 border border-slate-700/50">
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-3">Max Games to Display</label>
                        <div class="flex items-center gap-4">
                            <input type="range" id="gameLimit" min="5" max="200" value="50" class="flex-1 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-yellow-500">
                            <span id="gameLimitDisplay" class="text-sm font-bold text-white bg-slate-700 px-3 py-1 rounded-lg min-w-12 text-center">50</span>
                        </div>
                        <p class="text-xs text-slate-500 mt-2">Limit how many games appear in the credits (up to 200)</p>
                    </div>

                    <div id="statusMsg" class="text-center text-sm min-h-[20px] font-medium text-amber-400 break-words"></div>

                    <button id="startCreditsBtn" class="w-full bg-gradient-to-r from-yellow-600 to-amber-700 hover:from-yellow-500 hover:to-amber-600 text-black font-bold py-4 rounded-xl shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                        <span>🎬 Start Credits</span>
                    </button>
                    
                    <button id="cancelSettings" class="w-full py-2 text-slate-400 hover:text-white text-sm">
                        Close / Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- State ---
        let gamesData = [];
        let isScrolling = false;
        let isPaused = false;
        let currentSpeed = 60; // seconds per game
        let currentTheme = 'space';

        // --- DOM Elements ---
        const settingsModal = document.getElementById('settingsModal');
        const settingsBtn = document.getElementById('settingsBtn');
        const closeModalX = document.getElementById('closeModalX');
        const cancelSettingsBtn = document.getElementById('cancelSettings');
        const startCreditsBtn = document.getElementById('startCreditsBtn');
        const statusMsg = document.getElementById('statusMsg');
        const creditsContainer = document.getElementById('creditsContainer');
        const controlsOverlay = document.getElementById('controlsOverlay');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const restartBtn = document.getElementById('restartBtn');
        const stopBtn = document.getElementById('stopBtn');
        const speedSlowerBtn = document.getElementById('speedSlowerBtn');
        const speedFasterBtn = document.getElementById('speedFasterBtn');
        const scrollSpeedInput = document.getElementById('scrollSpeed');
        const scrollSpeedDisplay = document.getElementById('scrollSpeedDisplay');
        const gameLimitInput = document.getElementById('gameLimit');
        const gameLimitDisplay = document.getElementById('gameLimitDisplay');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');

        // --- Initialize Starfield ---
        function createStarfield() {
            const starfield = document.getElementById('starfield');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starfield.appendChild(star);
            }
        }
        createStarfield();

        // --- Theme System ---
        function applyTheme(theme) {
            document.body.className = 'theme-' + theme;
            currentTheme = theme;
            localStorage.setItem('creditsTheme', theme);
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('creditsTheme') || 'space';
            const themeRadio = document.querySelector(`input[name="theme"][value="${savedTheme}"]`);
            if (themeRadio) {
                themeRadio.checked = true;
            }
            applyTheme(savedTheme);
        }

        // Add theme change listeners
        document.querySelectorAll('input[name="theme"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                applyTheme(e.target.value);
            });
        });

        // Load theme on startup
        loadTheme();

        // --- API Logic ---
        async function fetchWithRetry(url, options, maxRetries = 3, delay = 1500) {
            let lastError;
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.status === 202) {
                        console.log('BGG is processing (202), retrying...');
                        throw new Error('Collection is processing, please wait...');
                    }
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response;
                } catch (error) {
                    console.warn(`Attempt ${i+1} failed: ${error.message}`);
                    lastError = error;
                    if (i < maxRetries - 1) {
                        statusMsg.textContent = `Retrying... (${i+1}/${maxRetries})`;
                        await new Promise(resolve => setTimeout(resolve, delay * (i + 1)));
                    } else {
                        throw lastError;
                    }
                }
            }
        }

        async function fetchFromBGG(username) {
            try {
                let filters = [];
                if (document.getElementById('filterOwn').checked) filters.push('own=1');
                if (document.getElementById('filterPrevOwned').checked) filters.push('prevowned=1');
                if (document.getElementById('filterWantToPlay').checked) filters.push('wanttoplay=1');
                if (document.getElementById('filterWantToBuy').checked) filters.push('wanttobuy=1');

                const filterStr = filters.length > 0 ? '&' + filters.join('&') : '&own=1';
                const safeUsername = encodeURIComponent(username);
                
                const response = await fetchWithRetry(`/api/bgg-helper?endpoint=collection&username=${safeUsername}${filterStr}&stats=1`);
                
                const text = await response.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, 'text/xml');
                
                const items = xml.querySelectorAll('item');
                if (items.length === 0) {
                    const errorNode = xml.querySelector('error');
                    if (errorNode) {
                        throw new Error(errorNode.textContent || 'BGG API returned an error');
                    }
                    const messageNode = xml.querySelector('message');
                    if (messageNode && messageNode.textContent.includes('process')) {
                         throw new Error('Collection is still processing at BGG. Try again in 10 seconds.');
                    }
                }

                const games = Array.from(items).map(item => {
                    const name = item.querySelector('name')?.textContent || 'Unknown';
                    const image = item.querySelector('image')?.textContent || item.querySelector('thumbnail')?.textContent || '';
                    const type = item.getAttribute('subtype') || '';
                    
                    const yearpublished = item.querySelector('yearpublished')?.textContent || '';
                    const stats = item.querySelector('stats');
                    const minplayers = stats?.getAttribute('minplayers') || 'N/A';
                    const maxplayers = stats?.getAttribute('maxplayers') || 'N/A';
                    const playingtime = stats?.getAttribute('playingtime') || 'N/A';
                    const rating = parseFloat(stats?.querySelector('rating')?.querySelector('average')?.getAttribute('value') || '0');
                    const numplays = parseInt(item.querySelector('numplays')?.textContent || '0') || 0;
                    
                    return {
                        id: item.getAttribute('objectid'),
                        name: name,
                        image: image,
                        subtype: type,
                        year: yearpublished,
                        minPlayers: minplayers,
                        maxPlayers: maxplayers,
                        playingTime: playingtime,
                        rating: rating,
                        numPlays: numplays
                    };
                }).filter(g => {
                    if (!g.image) return false;
                    if (g.subtype === 'boardgameexpansion' && !document.getElementById('filterExpansions').checked) return false;
                    if (document.getElementById('filterPlayedOnly').checked && g.numPlays < 1) return false;
                    return true;
                });

                // Remove duplicates by name
                let filteredGames = Array.from(new Map(games.map(g => [g.name, g])).values());
                
                // Apply sorting
                const sortBy = document.getElementById('sortBy').value;
                switch(sortBy) {
                    case 'name':
                        filteredGames.sort((a, b) => a.name.localeCompare(b.name));
                        break;
                    case 'name-desc':
                        filteredGames.sort((a, b) => b.name.localeCompare(a.name));
                        break;
                    case 'rating':
                        filteredGames.sort((a, b) => b.rating - a.rating);
                        break;
                    case 'rating-asc':
                        filteredGames.sort((a, b) => a.rating - b.rating);
                        break;
                    case 'year':
                        filteredGames.sort((a, b) => parseInt(b.year || 0) - parseInt(a.year || 0));
                        break;
                    case 'year-asc':
                        filteredGames.sort((a, b) => parseInt(a.year || 0) - parseInt(b.year || 0));
                        break;
                    case 'plays':
                        filteredGames.sort((a, b) => b.numPlays - a.numPlays);
                        break;
                    case 'plays-asc':
                        filteredGames.sort((a, b) => a.numPlays - b.numPlays);
                        break;
                    case 'random':
                        filteredGames.sort(() => Math.random() - 0.5);
                        break;
                }

                // Apply game limit
                const gameLimit = parseInt(gameLimitInput.value) || 20;
                if (gameLimit < filteredGames.length) {
                    filteredGames = filteredGames.slice(0, gameLimit);
                }

                return filteredGames;
            } catch (error) {
                console.error('BGG Fetch Error:', error);
                throw error;
            }
        }

        // --- Credits Generation ---
        function generateCredits(games) {
            creditsContainer.innerHTML = '';

            // Opening title
            const opening = document.createElement('div');
            opening.className = 'credit-item';
            opening.innerHTML = `
                <div class="end-credits">
                    🎬<br>
                    Presenting
                </div>
            `;
            creditsContainer.appendChild(opening);

            // Collection title
            const collectionTitle = document.createElement('div');
            collectionTitle.className = 'credit-item';
            collectionTitle.innerHTML = `
                <div class="credit-category">The Collection</div>
                <div class="credit-game-name" style="font-size: 3rem; color: #fbbf24;">
                    ${games.length} Board Games
                </div>
            `;
            creditsContainer.appendChild(collectionTitle);

            // Individual game credits
            games.forEach((game, index) => {
                const creditItem = document.createElement('div');
                creditItem.className = 'credit-item';
                
                const players = game.minPlayers !== 'N/A' && game.maxPlayers !== 'N/A' 
                    ? `${game.minPlayers}-${game.maxPlayers} Players` 
                    : 'Players: N/A';
                
                const time = game.playingTime !== 'N/A' ? `${game.playingTime} min` : 'Time: N/A';
                const year = game.year || 'Year Unknown';
                const rating = game.rating && game.rating > 0 ? game.rating.toFixed(2) : 'Not Rated';
                const plays = game.numPlays + ' plays';

                creditItem.innerHTML = `
                    <div class="credit-game-name">` + game.name + `</div>
                    <img src="` + game.image + `" alt="` + game.name + `" class="credit-game-image" onerror="this.style.display='none'">
                    <div class="credit-details">
                        <div class="credit-stat">⭐ ` + rating + `</div>
                        <div class="credit-stat">👥 ` + players + `</div>
                        <div class="credit-stat">⏱️ ` + time + `</div>
                        <div class="credit-stat">📅 ` + year + `</div>
                        <div class="credit-stat">🎲 ` + plays + `</div>
                    </div>
                `;
                creditsContainer.appendChild(creditItem);
            });

            // End credits
            const ending = document.createElement('div');
            ending.className = 'credit-item';
            ending.innerHTML = `
                <div class="end-credits">
                    Thanks for Playing!
                    <br><br>
                    🎲
                </div>
            `;
            creditsContainer.appendChild(ending);
        }

        // --- Credits Playback Control ---
        function startCredits() {
            if (gamesData.length === 0) {
                alert('Please load games first!');
                return;
            }

            // Hide settings modal
            settingsModal.style.display = 'none';
            
            // Generate credits
            generateCredits(gamesData);
            
            // Calculate scroll duration based on number of games and speed setting
            const speedPerGame = parseInt(scrollSpeedInput.value) || 60;
            const totalDuration = (gamesData.length + 3) * speedPerGame; // +3 for opening and ending
            currentSpeed = totalDuration;
            
            creditsContainer.style.setProperty('--scroll-duration', `${totalDuration}s`);
            
            // Start scrolling
            creditsContainer.classList.add('scrolling');
            isScrolling = true;
            isPaused = false;
            
            // Show controls
            controlsOverlay.classList.add('visible');
            
            // Listen for animation end
            creditsContainer.addEventListener('animationend', handleCreditsEnd, { once: true });
        }

        function handleCreditsEnd() {
            isScrolling = false;
            controlsOverlay.classList.remove('visible');
            settingsModal.style.display = 'flex';
            creditsContainer.classList.remove('scrolling');
            creditsContainer.style.transform = 'translateY(100%)';
        }

        function togglePlayPause() {
            if (!isScrolling) return;
            
            isPaused = !isPaused;
            if (isPaused) {
                creditsContainer.classList.add('paused');
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
            } else {
                creditsContainer.classList.remove('paused');
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
            }
        }

        function restartCredits() {
            stopCredits();
            setTimeout(startCredits, 100);
        }

        function stopCredits() {
            isScrolling = false;
            isPaused = false;
            creditsContainer.classList.remove('scrolling', 'paused');
            creditsContainer.style.transform = 'translateY(100%)';
            controlsOverlay.classList.remove('visible');
            settingsModal.style.display = 'flex';
            playIcon.classList.add('hidden');
            pauseIcon.classList.remove('hidden');
        }

        function adjustSpeed(faster) {
            if (!isScrolling) return;
            
            const currentDuration = parseInt(creditsContainer.style.getPropertyValue('--scroll-duration')) || currentSpeed;
            let newDuration;
            
            if (faster) {
                newDuration = Math.max(10, currentDuration - 10); // Min 10 seconds
            } else {
                newDuration = Math.min(600, currentDuration + 10); // Max 600 seconds
            }
            
            creditsContainer.style.setProperty('--scroll-duration', `${newDuration}s`);
            currentSpeed = newDuration;
            
            // Restart animation with new duration
            const wasPaused = isPaused;
            creditsContainer.classList.remove('scrolling', 'paused');
            setTimeout(() => {
                creditsContainer.classList.add('scrolling');
                if (wasPaused) {
                    creditsContainer.classList.add('paused');
                }
            }, 10);
        }

        // --- Event Listeners ---
        settingsBtn.addEventListener('click', () => {
            settingsModal.style.display = 'flex';
        });

        closeModalX.addEventListener('click', () => {
            settingsModal.style.display = 'none';
        });

        cancelSettingsBtn.addEventListener('click', () => {
            settingsModal.style.display = 'none';
        });

        startCreditsBtn.addEventListener('click', async () => {
            const username = document.getElementById('usernameInput').value.trim();
            if (!username) {
                statusMsg.textContent = "Please enter a username";
                return;
            }

            startCreditsBtn.innerHTML = '<span class="loader"></span> Loading...';
            startCreditsBtn.disabled = true;
            statusMsg.textContent = "";
            statusMsg.className = "text-center text-sm font-medium text-blue-400";

            try {
                const games = await fetchFromBGG(username);
                
                gamesData = games;
                
                if (games.length === 0) {
                    statusMsg.textContent = "No games found. Check filters or username.";
                    statusMsg.className = "text-center text-sm font-medium text-red-400";
                    startCreditsBtn.innerHTML = '🎬 Start Credits';
                    startCreditsBtn.disabled = false;
                } else {
                    statusMsg.textContent = `${games.length} games loaded!`;
                    statusMsg.className = "text-center text-sm font-medium text-green-400";
                    startCreditsBtn.innerHTML = '✓ Success';
                    
                    setTimeout(() => {
                        settingsModal.style.display = 'none';
                        startCreditsBtn.innerHTML = '🎬 Start Credits';
                        startCreditsBtn.disabled = false;
                        startCredits();
                    }, 800);
                }

            } catch (err) {
                console.error(err);
                let msg = err.message;
                if (msg === 'Failed to fetch') msg = "Network error. Check connection.";
                statusMsg.textContent = msg;
                statusMsg.className = "text-center text-sm font-medium text-red-400";
                startCreditsBtn.innerHTML = '🎬 Start Credits';
                startCreditsBtn.disabled = false;
            }
        });

        playPauseBtn.addEventListener('click', togglePlayPause);
        restartBtn.addEventListener('click', restartCredits);
        stopBtn.addEventListener('click', stopCredits);
        speedSlowerBtn.addEventListener('click', () => adjustSpeed(false));
        speedFasterBtn.addEventListener('click', () => adjustSpeed(true));

        scrollSpeedInput.addEventListener('input', (e) => {
            scrollSpeedDisplay.textContent = e.target.value + 's';
        });

        gameLimitInput.addEventListener('input', (e) => {
            gameLimitDisplay.textContent = e.target.value;
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (!isScrolling) return;
            
            switch(e.key) {
                case ' ':
                    e.preventDefault();
                    togglePlayPause();
                    break;
                case 'r':
                case 'R':
                    e.preventDefault();
                    restartCredits();
                    break;
                case 'Escape':
                    e.preventDefault();
                    stopCredits();
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    adjustSpeed(false);
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    adjustSpeed(true);
                    break;
            }
        });

        // Show controls on mouse move during playback
        let controlsTimeout;
        document.addEventListener('mousemove', () => {
            if (isScrolling) {
                controlsOverlay.classList.add('visible');
                clearTimeout(controlsTimeout);
                controlsTimeout = setTimeout(() => {
                    if (isScrolling && !isPaused) {
                        controlsOverlay.classList.remove('visible');
                    }
                }, 3000);
            }
        });
    </script>
</body>
</html>
