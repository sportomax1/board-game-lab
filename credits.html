<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BGG Credits Arcade</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='75' font-size='70'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
            touch-action: none; /* Prevent browser scrolling */
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 15%, rgba(0,0,0,0) 85%, rgba(0,0,0,0.9) 100%);
            transition: opacity 0.3s;
        }

        .header {
            text-align: center;
            pointer-events: auto;
            z-index: 10;
        }

        h1 {
            font-size: 1rem;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ccc;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .controls {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: rgba(40, 40, 40, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ddd;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
            font-weight: 500;
        }

        button.active {
            background: #1877f2;
            border-color: #1877f2;
            color: white;
            box-shadow: 0 0 10px rgba(24, 119, 242, 0.4);
        }

        button:active {
            transform: scale(0.95);
        }

        /* Settings Modal */
        #settings-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1c1e21;
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            display: none;
            pointer-events: auto;
            z-index: 100;
            border: 1px solid #333;
        }

        #settings-modal.visible {
            display: block;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { opacity: 0; transform: translate(-50%, -45%) scale(0.95); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #aaa;
            font-size: 0.85rem;
            text-transform: uppercase;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #242526;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #1877f2;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background: #242526;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #ddd;
        }
        
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #1877f2;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-primary {
            flex: 2;
            background: #1877f2;
            border: none;
            color: white;
        }
        
        .btn-secondary {
            flex: 1;
            background: #3a3b3c;
            border: none;
            color: #e4e6eb;
        }

        /* Loading */
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            display: none;
            z-index: 50;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: #1877f2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        #stats-bar {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
            pointer-events: none;
        }

        #toggle-ui-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            opacity: 0.5;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div id="ui-layer">
        <div class="header">
            <h1>Collection Arcade</h1>
            <div class="controls">
                <button onclick="setMode('slide')" id="btn-slide" class="active">Slide</button>
                <button onclick="setMode('rain')" id="btn-rain">Rain</button>
                <button onclick="setMode('grow')" id="btn-grow">Focus</button>
                <button onclick="setMode('fireworks')" id="btn-fireworks">Fireworks</button>
                <button onclick="setMode('credits')" id="btn-credits">Credits</button>
                <button onclick="toggleSettings()" style="padding: 8px 12px;">⚙️</button>
            </div>
        </div>
        <div id="stats-bar">Waiting to load...</div>
        <button id="toggle-ui-btn" onclick="toggleUI()">Hide UI</button>
    </div>

    <div id="loader">
        <div class="spinner"></div>
        <div id="loading-text" style="background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 4px;">Fetching Games...</div>
    </div>

    <div id="settings-modal">
        <div class="form-group">
            <label>BGG Username</label>
            <input type="text" id="username-input" value="sportomax" placeholder="Enter username">
        </div>
        <div class="form-group">
            <label>Filters</label>
            <div class="checkbox-grid">
                <div class="checkbox-item"><input type="checkbox" id="filter-own" checked> Own</div>
                <div class="checkbox-item"><input type="checkbox" id="filter-prevowned"> Prev Owned</div>
                <div class="checkbox-item"><input type="checkbox" id="filter-wanttoplay"> Want Play</div>
                <div class="checkbox-item"><input type="checkbox" id="filter-wanttobuy"> Want Buy</div>
                <div class="checkbox-item"><input type="checkbox" id="filter-wishlist"> Wishlist</div>
                <div class="checkbox-item"><input type="checkbox" id="filter-preordered"> Preorder</div>
            </div>
        </div>
        <div class="form-group">
            <label>Playback</label>
            <div class="checkbox-grid">
                <div class="checkbox-item"><input type="checkbox" id="randomize-order"> Randomize Order</div>
                <div class="checkbox-item"><input type="checkbox" id="loop-order" checked> Loop Order</div>
            </div>
        </div>
        <div class="modal-buttons">
            <button onclick="fetchData()" class="btn-primary">Load Games</button>
            <button onclick="toggleSettings()" class="btn-secondary">Close</button>
        </div>
    </div>

    <script>
        // --- API Configuration ---
        const API_BASE = '/api/bgg-helper'; // Exact path from your file
        const IMAGE_PROXY = 'https://images.weserv.nl/?url='; // Exact proxy from your file
        
        // --- State ---
        let games = [];
        let mode = 'slide'; // slide, rain, grow, fireworks
        let isUIVisible = true;
        let animationId;
        let lastTime = 0;
        
        // --- Physics/Animation State ---
        let entities = [];
        let speedMultiplier = 1.0; // Controlled by touch
        let baseSpeed = 100; // Pixels per second reference
        // Ordered playback
        let orderedGames = [];
        let orderIndex = 0;
        let randomizeOrder = false;
        let loopOrder = true;
        
        // --- Canvas ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Data Fetching (Replicating your file's logic) ---
        
        function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

        async function fetchBGG(endpoint, params = {}, retries = 5) {
            const queryParams = new URLSearchParams(params).toString();
            // Use the specific local API path requested
            const fullUrl = `${API_BASE}?endpoint=${endpoint}&${queryParams}`;
            
            try {
                const response = await fetch(fullUrl);
                
                // Handle BGG 202 Queue logic
                if (response.status === 202 && retries > 0) {
                    document.getElementById('loading-text').textContent = `BGG Queued... (${retries})`;
                    await wait(3000);
                    return fetchBGG(endpoint, params, retries - 1);
                }
                
                if (!response.ok) throw new Error(`API Error ${response.status}`);
                return await response.text();
            } catch (e) {
                console.error(e);
                throw e;
            }
        }

        async function fetchData() {
            const username = document.getElementById('username-input').value.trim();
            const modal = document.getElementById('settings-modal');
            const loader = document.getElementById('loader');
            
            modal.classList.remove('visible');
            loader.style.display = 'block';
            
            const params = { username: username };
            if (document.getElementById('filter-own').checked) params.own = 1;
            if (document.getElementById('filter-prevowned').checked) params.prevowned = 1;
            if (document.getElementById('filter-wanttoplay').checked) params.wanttoplay = 1;
            if (document.getElementById('filter-wanttobuy').checked) params.wanttobuy = 1;
            if (document.getElementById('filter-wishlist').checked) params.wishlist = 1;
            if (document.getElementById('filter-preordered').checked) params.preordered = 1;
            params.excludesubtype = 'boardgameexpansion'; 

            try {
                const xml = await fetchBGG('collection', params);
                const parser = new DOMParser();
                const doc = parser.parseFromString(xml, 'text/xml');
                const items = Array.from(doc.querySelectorAll('item'));
                
                if (items.length === 0) {
                    alert('No games found with these filters.');
                    loader.style.display = 'none';
                    return;
                }

                // Parse and Filter
                games = items.map(item => ({
                    id: item.getAttribute('objectid'),
                    title: item.querySelector('name')?.textContent || 'Unknown',
                    image: item.querySelector('image')?.textContent || '',
                    thumbnail: item.querySelector('thumbnail')?.textContent || ''
                })).filter(g => g.image); // Must have image

                // Prepare ordered list for slide/credits playback
                randomizeOrder = !!document.getElementById('randomize-order')?.checked;
                loopOrder = !!document.getElementById('loop-order')?.checked;
                orderedGames = games.map(g => g);
                if (randomizeOrder) {
                    for (let i = orderedGames.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [orderedGames[i], orderedGames[j]] = [orderedGames[j], orderedGames[i]];
                    }
                }
                orderIndex = 0;

                document.getElementById('stats-bar').textContent = `${games.length} Games Loaded`;
                loader.style.display = 'none';
                
                resetMode();

            } catch (err) {
                alert('Error: ' + err.message);
                loader.style.display = 'none';
                modal.classList.add('visible');
            }
        }

        // --- Animation Logic ---

        function setMode(m) {
            mode = m;
            document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${m}`).classList.add('active');
            resetMode();
        }

        function resetMode() {
            entities = [];
            speedMultiplier = 1.0; // Reset speed
            // Pre-fill slide/rain to avoid empty screen start
            if (games.length > 0) {
                if (mode === 'slide') {
                    // Fill screen horizontally using orderedGames sequence.
                    // Start all items well off-screen on the left so they flow left->right.
                    const spacing = Math.max(320, Math.floor(canvas.width * 0.45));
                    let idx = 0;
                    while (orderedGames.length > 0 && idx < orderedGames.length) {
                        const g = orderedGames[idx++];
                        const startX = -1200 - (idx * spacing); // start WAY off-screen left
                        spawnSlide(startX, g);
                    }
                }
            }
        }
        
        function getProxiedImage(url) {
            // Use the proxy to avoid CORS/Tainted Canvas issues
            return `${IMAGE_PROXY}${url}`;
        }

        // Spawn Helpers
        function spawnSlide(startX = -300, specificGame = null) {
            // Use ordered sequence when available, otherwise pick random
            let game = specificGame || orderedGames[orderIndex] || games[Math.floor(Math.random() * games.length)];
            if (!specificGame) {
                orderIndex++;
                if (orderIndex >= orderedGames.length) orderIndex = loopOrder ? 0 : orderedGames.length - 1;
            }
            const img = new Image();
            img.crossOrigin = "Anonymous";
            // Prefer collection thumbnail for slides to improve performance and consistency
            img.src = getProxiedImage(game.thumbnail || game.image);

            entities.push({
                type: 'slide',
                game: game,
                img: img,
                x: startX,
                y: canvas.height / 2 - 150, // Center-ish
                w: 200, h: 200, // Default until loaded
                vx: 150, // Base pixel/sec
                loaded: false
            });
        }

        function spawnRain() {
            const game = games[Math.floor(Math.random() * games.length)];
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = getProxiedImage(game.image);
            
            const colCount = Math.floor(canvas.width / 220);
            const col = Math.floor(Math.random() * colCount);
            const x = col * (canvas.width / colCount) + (canvas.width/colCount)/2 - 100;

            entities.push({
                type: 'rain',
                game: game,
                img: img,
                x: x,
                y: -300,
                w: 200, h: 200,
                vy: 100 + Math.random() * 100,
                loaded: false
            });
        }

        // Spawn Credits: one game at a time top-to-bottom centered
        function spawnCredits() {
            if (orderedGames.length === 0) return;
            const game = orderedGames[orderIndex];
            orderIndex++;
            if (orderIndex >= orderedGames.length) orderIndex = loopOrder ? 0 : orderedGames.length - 1;

            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = getProxiedImage(game.thumbnail || game.image);

            entities.push({
                type: 'credits',
                game: game,
                img: img,
                x: (canvas.width - 300) / 2,
                y: -300,
                w: 300,
                h: 300,
                vy: 180 + Math.random() * 80,
                loaded: false
            });
        }

        function spawnGrow() {
            const game = games[Math.floor(Math.random() * games.length)];
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = getProxiedImage(game.image);
            
            entities.push({
                type: 'grow',
                game: game,
                img: img,
                scale: 0.01,
                opacity: 0,
                state: 'in', // in, hold, out
                timer: 0,
                loaded: false
            });
        }

        function spawnFirework() {
            const game = games[Math.floor(Math.random() * games.length)];
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = getProxiedImage(game.thumbnail); // Thumbnails better for many particles
            
            entities.push({
                type: 'firework',
                img: img,
                x: Math.random() * canvas.width,
                y: canvas.height + 50,
                vx: (Math.random() - 0.5) * 300,
                vy: -(Math.random() * 500 + 400),
                rotation: 0,
                vr: (Math.random() - 0.5) * 5,
                gravity: 600,
                w: 80, h: 80,
                loaded: false
            });
        }

        function update(dt) {
            if (games.length === 0) return;

            // Apply friction to speedMultiplier to return to 1.0
            if (!isTouching) {
                const friction = 2.0 * dt;
                if (speedMultiplier > 1.0) speedMultiplier = Math.max(1.0, speedMultiplier - friction);
                else if (speedMultiplier < 1.0) speedMultiplier = Math.min(1.0, speedMultiplier + friction);
            }

            // --- Slide Mode (Left to Right) ---
            if (mode === 'slide') {
                // Spawn if gap at left (if speed negative/rewind) or right (normal)
                // Simplified: Just spawn at left boundary if last item moved in
                if (entities.length === 0 || entities[entities.length-1].x > -200) {
                     // Logic handles overlap elsewhere, just simple timer-ish spawning
                }
                
                // Better spawn logic based on space
                const rightmost = entities.reduce((max, e) => Math.max(max, e.x + e.w), -9999);
                if (rightmost < canvas.width + 100) {
                    spawnSlide(rightmost + 20); // Add gap
                }
                // Handle Rewind spawning (left side)
                const leftmost = entities.reduce((min, e) => Math.min(min, e.x), 99999);
                if (leftmost > -200) {
                    // If rewinding, we might need items on the left.
                    // For simplicity, circular buffer effect or just let it empty? 
                    // Let's just keep spawning on right for now.
                }

                entities.forEach((e, i) => {
                    // Update Aspect Ratio once loaded
                    if (!e.loaded && e.img.complete && e.img.naturalWidth) {
                        const h = canvas.height * 0.6; // 60% height
                        e.h = h;
                        e.w = h * (e.img.naturalWidth / e.img.naturalHeight);
                        e.y = (canvas.height - e.h) / 2;
                        e.loaded = true;
                    }
                    
                    e.x += e.vx * dt * speedMultiplier;
                    
                    // Cull off-screen
                    if (speedMultiplier > 0 && e.x > canvas.width + 1000) entities[i].dead = true;
                    if (speedMultiplier < 0 && e.x + e.w < -1000) entities[i].dead = true;
                });
            }

            // --- Credits Mode (one-at-a-time top->bottom) ---
            else if (mode === 'credits') {
                // ensure only one active at a time; spawn next when none present
                const activeCredits = entities.filter(e => e.type === 'credits');
                if (activeCredits.length === 0) {
                    spawnCredits();
                }

                entities.forEach((e, i) => {
                    if (e.type !== 'credits') return;
                    if (!e.loaded && e.img.complete && e.img.naturalWidth) {
                        // scale to fit width
                        const maxW = Math.min(canvas.width * 0.6, 500);
                        const aspect = e.img.naturalWidth / e.img.naturalHeight;
                        e.w = Math.min(maxW, 400);
                        e.h = e.w / aspect;
                        e.x = (canvas.width - e.w) / 2;
                        e.loaded = true;
                    }
                    e.y += e.vy * dt * speedMultiplier;
                    if (e.y > canvas.height + 50) e.dead = true;
                });
            }

            // --- Rain Mode (Top Down) ---
            else if (mode === 'rain') {
                if (Math.random() < 0.05 * Math.abs(speedMultiplier)) spawnRain();

                entities.forEach((e, i) => {
                    if (!e.loaded && e.img.complete && e.img.naturalWidth) {
                        e.w = 200; // Fixed width col
                        e.h = e.w * (e.img.naturalHeight / e.img.naturalWidth);
                        e.loaded = true;
                    }
                    e.y += e.vy * dt * speedMultiplier;
                    
                    if (e.y > canvas.height + 200 && speedMultiplier > 0) e.dead = true;
                    if (e.y < -500 && speedMultiplier < 0) e.dead = true;
                });
            }

            // --- Grow Mode (Focus) ---
            else if (mode === 'grow') {
                if (entities.length === 0) spawnGrow();
                
                const e = entities[0];
                const rate = 1.0 * dt * Math.abs(speedMultiplier); // Speed controls growth rate
                
                if (e.state === 'in') {
                    e.opacity += rate * 2;
                    e.scale += rate * 0.5;
                    if (e.opacity >= 1) e.opacity = 1;
                    if (e.scale > 0.8) e.state = 'out'; // Start fading early for flow
                } else if (e.state === 'out') {
                    e.scale += rate * 1.5; // Zoom in faster at end
                    e.opacity -= rate;
                    if (e.opacity <= 0) e.dead = true;
                }
            }

            // --- Fireworks Mode ---
            else if (mode === 'fireworks') {
                if (Math.random() < 0.1) spawnFirework(); // Constant spawn rate
                
                entities.forEach((e, i) => {
                    // Physics
                    e.x += e.vx * dt;
                    e.y += e.vy * dt;
                    e.vy += e.gravity * dt;
                    e.rotation += e.vr * dt;
                    
                    // Interaction: Speed multiplier affects Gravity? Or Time?
                    // Let's make speedMultiplier affect Time scale for this mode
                    // Actually, simple physics:
                    // If speedMultiplier > 1, launch them faster!
                    if (isTouching && speedMultiplier > 1) {
                         e.vy -= 2000 * dt; // Anti-gravity boost
                    }
                    
                    if (e.y > canvas.height + 200) e.dead = true;
                });
            }

            // Cleanup
            entities = entities.filter(e => !e.dead);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            entities.forEach(e => {
                if (!e.img.complete || e.img.naturalWidth === 0) return;

                ctx.save();
                
                if (mode === 'slide' || mode === 'rain') {
                    ctx.drawImage(e.img, e.x, e.y, e.w, e.h);
                    
                    // Shadow/Reflection for Slide
                    if (mode === 'slide') {
                        ctx.save();
                        ctx.transform(1, 0, 0, -1, 0, e.y + e.h * 2 + 10); // Flip vertical
                        ctx.globalAlpha = 0.2;
                        // Draw gradient mask logic roughly simulated by just drawing opacity
                        ctx.drawImage(e.img, e.x, e.y + e.h + 10, e.w, e.h * 0.5);
                        ctx.restore();
                    }
                }
                else if (mode === 'credits' && e.type === 'credits') {
                    ctx.drawImage(e.img, e.x, e.y, e.w, e.h);
                    // draw title below
                    ctx.fillStyle = 'rgba(255,255,255,0.9)';
                    ctx.font = 'bold 22px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(e.game.title, canvas.width/2, Math.min(canvas.height - 40, e.y + e.h + 30));
                }
                else if (mode === 'grow') {
                    const aspect = e.img.naturalWidth / e.img.naturalHeight;
                    let drawH = canvas.height * e.scale;
                    let drawW = drawH * aspect;
                    
                    // Center
                    let dx = (canvas.width - drawW) / 2;
                    let dy = (canvas.height - drawH) / 2;
                    
                    ctx.globalAlpha = e.opacity;
                    ctx.drawImage(e.img, dx, dy, drawW, drawH);
                    ctx.globalAlpha = 1.0;
                    
                    if (e.opacity > 0.4) {
                        ctx.fillStyle = `rgba(255,255,255,${e.opacity})`;
                        ctx.font = 'bold 24px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.shadowColor = 'black';
                        ctx.shadowBlur = 8;
                        ctx.fillText(e.game.title, canvas.width/2, canvas.height - 80);
                    }
                }
                else if (mode === 'fireworks') {
                    ctx.translate(e.x, e.y);
                    ctx.rotate(e.rotation);
                    ctx.drawImage(e.img, -e.w/2, -e.h/2, e.w, e.h);
                }

                ctx.restore();
            });

            // HUD
            if (Math.abs(speedMultiplier - 1.0) > 0.1) {
                ctx.fillStyle = 'white';
                ctx.font = '14px monospace';
                ctx.textAlign = 'right';
                const label = speedMultiplier < 0 ? '<< REWIND' : (speedMultiplier > 1.5 ? 'TURBO >>' : '');
                if(label) ctx.fillText(label, canvas.width - 20, 80);
            }
        }

        function loop(time) {
            const dt = Math.min((time - lastTime) / 1000, 0.1); // Cap dt
            lastTime = time;
            update(dt);
            draw();
            animationId = requestAnimationFrame(loop);
        }

        // --- Touch Interactions ---
        let isTouching = false;
        let startX, startY;
        let lastTouchTime = 0;

        canvas.addEventListener('pointerdown', e => {
            isTouching = true;
            startX = e.clientX;
            startY = e.clientY;
            canvas.setPointerCapture(e.pointerId);
        });

        canvas.addEventListener('pointermove', e => {
            if (!isTouching) return;
            e.preventDefault();
            
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            
            // Interaction logic based on mode
            if (mode === 'slide') {
                // Dragging right (positive dx) -> should Rewind? 
                // Natural scroll: Push left to move right.
                // Request: "slide fingers to increase speed or rewind"
                // Let's say: Drag in direction of motion (Right) adds speed. Drag Left subtracts.
                // Base motion is Left->Right (positive X).
                // So +dx increases speed. -dx decreases/rewinds.
                speedMultiplier = 1.0 + (dx / 100); 
            } 
            else if (mode === 'rain') {
                // Base motion is Down (positive Y).
                // Drag Down (+dy) -> Boost. Drag Up (-dy) -> Rewind.
                speedMultiplier = 1.0 + (dy / 100);
            }
            else {
                // Grow/Fireworks: Any movement excites the system
                const dist = Math.sqrt(dx*dx + dy*dy);
                speedMultiplier = 1.0 + (dist / 100);
            }
        });

        canvas.addEventListener('pointerup', () => {
            isTouching = false;
        });

        // --- UI Toggles ---
        function toggleSettings() {
            document.getElementById('settings-modal').classList.toggle('visible');
        }

        function toggleUI() {
            const ui = document.getElementById('ui-layer');
            isUIVisible = !isUIVisible;
            ui.style.opacity = isUIVisible ? '1' : '0';
            
            // Enable interacting with header even if opacity 0? No, hide it all.
            // But we need a way back. The "Hide UI" button is inside the layer.
            // Let's make a tap on canvas bring it back if hidden.
            if (!isUIVisible) {
                ui.style.pointerEvents = 'none';
            } else {
                ui.style.pointerEvents = 'none'; // Wrapper is always none
                document.querySelector('.header').style.pointerEvents = 'auto';
                document.getElementById('toggle-ui-btn').style.pointerEvents = 'auto';
                document.getElementById('settings-modal').style.pointerEvents = 'auto';
            }
        }
        
        // Tap canvas to restore UI
        canvas.addEventListener('click', (e) => {
            if (!isUIVisible && !isTouching && Math.abs(speedMultiplier - 1) < 0.1) {
                toggleUI();
            }
        });

        // Start
        requestAnimationFrame(loop);
        // Always show settings modal first so user configures filters/playback
        window.onload = () => { document.getElementById('settings-modal').classList.add('visible'); };

    </script>
</body>
</html>
