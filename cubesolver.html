<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D BGG Cube Solver</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #0f172a; 
            font-family: 'Inter', sans-serif; 
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        canvas { display: block; touch-action: none; }
        .ui-overlay { pointer-events: none; }
        .ui-overlay * { pointer-events: auto; }
        .btn-action {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent;
        }
        .btn-action:active { transform: scale(0.95); background: rgba(51, 65, 85, 1); }
        
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a; display: flex; align-items: center; justify-content: center;
            z-index: 100; transition: opacity 0.5s;
        }
        .bgg-input {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(51, 65, 85, 0.5);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            outline: none;
            width: 150px;
        }
        .bgg-input:focus { border-color: #3b82f6; }

        /* Reference Thumbnails */
        .reference-strip {
            display: flex;
            gap: 8px;
            padding: 8px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: auto;
        }
        .thumb-item {
            width: 45px;
            height: 45px;
            border-radius: 6px;
            object-fit: cover;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }
        .thumb-item:hover { border-color: #3b82f6; transform: scale(1.1); }
        @media (min-width: 768px) {
            .thumb-item { width: 60px; height: 60px; }
        }
    </style>
</head>
<body>

<div id="loading-screen">
    <div class="text-white text-2xl font-bold animate-pulse text-center">
        <div class="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
        LOADING ASSETS...
    </div>
</div>

<!-- UI Overlay -->
<div class="ui-overlay fixed inset-0 flex flex-col justify-between p-4 md:p-8 text-white">
    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-start gap-4">
        <div>
            <h1 class="text-xl md:text-4xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 uppercase">BGG Cube</h1>
            <p id="status-text" class="text-[10px] md:text-sm text-slate-400 uppercase tracking-widest font-semibold">OWNED COLLECTION ONLY</p>
        </div>
        
        <!-- Reference Thumbnails Strip -->
        <div id="reference-container" class="reference-strip">
            <!-- Populated by JS -->
        </div>

        <div class="flex flex-col gap-2 items-end w-full md:w-auto">
            <div class="flex gap-2 w-full md:w-auto justify-end">
                <input type="text" id="bgg-username" placeholder="BGG Username" class="bgg-input text-xs">
                <button onclick="loadUserCollection()" class="btn-action px-3 py-2 rounded-xl border border-blue-500 text-xs font-bold shadow-xl text-blue-400">LOAD</button>
                <button onclick="loadDefaultHot()" class="btn-action px-3 py-2 rounded-xl border border-slate-700 text-xs font-bold shadow-xl">HOT</button>
            </div>
            <div class="flex gap-2">
                <button onclick="randomizeThumbnails()" class="btn-action px-3 py-2 rounded-xl border border-emerald-500 text-xs font-bold shadow-xl text-emerald-400">RANDOMIZE</button>
                <button onclick="scrambleCube()" class="btn-action px-3 py-2 rounded-xl border border-slate-700 text-xs font-bold shadow-xl">SCRAMBLE</button>
                <button onclick="quickSolve()" class="btn-action px-3 py-2 rounded-xl border border-blue-500 text-xs font-bold shadow-xl text-blue-400">SOLVE</button>
            </div>
        </div>
    </div>

    <!-- Controls -->
    <div class="flex flex-col items-center gap-4 mb-2 md:mb-0">
        <div id="move-history" class="h-6 text-blue-400 font-mono text-sm md:text-lg overflow-hidden whitespace-nowrap opacity-60"></div>
        
        <div class="grid grid-cols-4 md:flex md:flex-wrap justify-center gap-2 max-w-lg">
            <button onclick="handleManualMove('U')" class="btn-action w-12 h-12 md:w-10 md:h-10 rounded-lg border border-slate-700 font-bold">U</button>
            <button onclick="handleManualMove('D')" class="btn-action w-12 h-12 md:w-10 md:h-10 rounded-lg border border-slate-700 font-bold">D</button>
            <button onclick="handleManualMove('L')" class="btn-action w-12 h-12 md:w-10 md:h-10 rounded-lg border border-slate-700 font-bold">L</button>
            <button onclick="handleManualMove('R')" class="btn-action w-12 h-12 md:w-10 md:h-10 rounded-lg border border-slate-700 font-bold">R</button>
            <button onclick="handleManualMove('F')" class="btn-action w-12 h-12 md:w-10 md:h-10 rounded-lg border border-slate-700 font-bold">F</button>
            <button onclick="handleManualMove('B')" class="btn-action w-12 h-12 md:w-10 md:h-10 rounded-lg border border-slate-700 font-bold">B</button>
            <button onclick="toggleInvert()" id="invert-btn" class="btn-action col-span-2 px-3 py-1 rounded-lg border border-slate-700 text-xs font-bold uppercase">CW</button>
            <button onclick="resetCube()" class="btn-action px-3 py-1 rounded-lg border border-slate-700 text-[10px] font-bold text-red-400 opacity-70">RESET</button>
        </div>
    </div>
</div>

<script>
    /**
     * CORE VARIABLES
     */
    let scene, camera, renderer, cubeGroup;
    let cubies = [];
    let isRotating = false;
    let isInverted = false;
    let moveStack = [];
    const CUBIE_SIZE = 1;
    const SPACING = 0.08;
    const ANIM_SPEED = 0.25;

    let gamePool = [];
    let activeGames = []; // Stores the 6 currently selected game objects
    let activeTextures = []; // Stores the 6 Three.js textures
    const textureLoader = new THREE.TextureLoader();

    const COLORS = [0xffffff, 0xffff00, 0xffa500, 0xff0000, 0x00ff00, 0x0000ff];

    /**
     * INITIALIZATION
     */
    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(7, 7, 10);
        camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0xffffff, 1.2);
        pointLight1.position.set(10, 15, 10);
        scene.add(pointLight1);

        // Load saved username or use default
        const savedUser = localStorage.getItem('bgg_cube_username') || "sportomax";
        document.getElementById('bgg-username').value = savedUser;

        setupPointerControls();
        window.addEventListener('resize', onWindowResize);
        window.addEventListener('keydown', onKeyDown);

        // Initial Load: Try user collection first, fallback to Hot Games
        loadUserCollection().catch(() => loadDefaultHot());

        setTimeout(() => {
            const ls = document.getElementById('loading-screen');
            if (ls) {
                ls.style.opacity = '0';
                setTimeout(() => ls.remove(), 500);
            }
        }, 1200);

        animate();
    }

    /**
     * BGG LOGIC
     */
    async function fetchWithRetry(url, retries = 3) {
        for (let i = 0; i < retries; i++) {
            const res = await fetch(url);
            if (res.status === 202) {
                updateStatus("BGG Queued... retrying", "wait");
                await new Promise(r => setTimeout(r, 3000));
                continue;
            }
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.text();
        }
        throw new Error("Max retries reached");
    }

    async function loadUserCollection() {
        const username = document.getElementById('bgg-username').value.trim();
        if (!username) return alert("Enter a username");
        
        localStorage.setItem('bgg_cube_username', username);
        updateStatus("Loading collection (own=1)...", "loading");

        try {
            const xmlText = await fetchWithRetry(`/api/bgg-helper?endpoint=collection&username=${encodeURIComponent(username)}&own=1&stats=1`);
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText, "text/xml");
            const items = Array.from(xmlDoc.querySelectorAll('item')).map(item => ({
                id: item.getAttribute('objectid'),
                name: item.querySelector('name')?.textContent,
                thumbnail: item.querySelector('thumbnail')?.textContent
            })).filter(i => i.thumbnail);

            if (items.length < 6) throw new Error("Need at least 6 owned games with thumbnails");

            gamePool = items;
            updateStatus(`Loaded ${items.length} owned games`, "ready");
            randomizeThumbnails();
        } catch (err) {
            updateStatus("Error loading collection", "error");
            alert("Could not load collection: " + err.message);
        }
    }

    async function loadDefaultHot() {
        updateStatus("Loading Hot Games...", "loading");
        try {
            const xmlText = await fetchWithRetry(`/api/bgg-helper?endpoint=hot`);
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText, "text/xml");
            const items = Array.from(xmlDoc.querySelectorAll('item')).map(item => ({
                id: item.getAttribute('id'),
                name: item.querySelector('name')?.getAttribute('value'),
                thumbnail: item.querySelector('thumbnail')?.getAttribute('value')
            })).filter(i => i.thumbnail);

            gamePool = items;
            updateStatus("Loaded Hot Games", "ready");
            randomizeThumbnails();
        } catch (err) {
            updateStatus("Error loading Hot Games", "error");
        }
    }

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    async function randomizeThumbnails() {
        if (gamePool.length < 6) return;
        activeGames = shuffle([...gamePool]).slice(0, 6);
        await refreshTextures();
    }

    async function refreshTextures() {
        updateStatus("Loading Textures...", "loading");
        
        const promises = activeGames.map(game => {
            return new Promise(resolve => {
                const proxiedUrl = `/api/image-proxy?url=${encodeURIComponent(game.thumbnail)}`;
                textureLoader.load(proxiedUrl, tex => resolve(tex), undefined, () => resolve(null));
            });
        });

        activeTextures = await Promise.all(promises);
        renderReferenceStrip();
        createCube();
        updateStatus("Cube Ready", "ready");
    }

    async function substituteThumbnail(index) {
        if (gamePool.length < 7) return; // Need extra to swap
        
        // Find a game in the pool not currently in activeGames
        const activeIds = new Set(activeGames.map(g => g.id));
        const availablePool = gamePool.filter(g => !activeIds.has(g.id));
        
        if (availablePool.length === 0) return;

        const newGame = availablePool[Math.floor(Math.random() * availablePool.length)];
        activeGames[index] = newGame;

        updateStatus(`Swapping #${index+1}...`, "loading");
        const proxiedUrl = `/api/image-proxy?url=${encodeURIComponent(newGame.thumbnail)}`;
        
        const newTex = await new Promise(resolve => {
            textureLoader.load(proxiedUrl, tex => resolve(tex), undefined, () => resolve(null));
        });

        activeTextures[index] = newTex;
        renderReferenceStrip();
        createCube();
        updateStatus("Cube Updated", "ready");
    }

    function renderReferenceStrip() {
        const container = document.getElementById('reference-container');
        container.innerHTML = '';
        activeGames.forEach((game, i) => {
            const img = document.createElement('img');
            img.src = game.thumbnail;
            img.className = 'thumb-item';
            img.title = game.name;
            img.onclick = () => substituteThumbnail(i);
            container.appendChild(img);
        });
    }

    function updateStatus(text, type) {
        const el = document.getElementById('status-text');
        el.innerText = text;
        el.className = "text-[10px] md:text-sm uppercase tracking-widest font-semibold " + 
            (type === 'error' ? 'text-red-400' : type === 'loading' ? 'text-blue-400' : 'text-slate-400');
    }

    /**
     * THREE.JS CUBE LOGIC
     */
    function createRoundedCubie(x, y, z) {
        const group = new THREE.Group();
        const coreSize = 0.95;
        const coreGeom = new THREE.BoxGeometry(coreSize, coreSize, coreSize);
        const coreMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
        group.add(new THREE.Mesh(coreGeom, coreMat));

        const stickerSize = 0.88;
        const stickerDepth = 0.05;
        const stickerGeom = new THREE.BoxGeometry(stickerSize, stickerSize, stickerDepth);

        const faceConfig = [
            { pos: [0.5, 0, 0], rot: [0, Math.PI/2, 0], tex: x === 1 ? activeTextures[0] : null, col: x === 1 ? COLORS[0] : null },
            { pos: [-0.5, 0, 0], rot: [0, -Math.PI/2, 0], tex: x === -1 ? activeTextures[1] : null, col: x === -1 ? COLORS[1] : null },
            { pos: [0, 0.5, 0], rot: [-Math.PI/2, 0, 0], tex: y === 1 ? activeTextures[2] : null, col: y === 1 ? COLORS[2] : null },
            { pos: [0, -0.5, 0], rot: [Math.PI/2, 0, 0], tex: y === -1 ? activeTextures[3] : null, col: y === -1 ? COLORS[3] : null },
            { pos: [0, 0, 0.5], rot: [0, 0, 0], tex: z === 1 ? activeTextures[4] : null, col: z === 1 ? COLORS[4] : null },
            { pos: [0, 0, -0.5], rot: [0, Math.PI, 0], tex: z === -1 ? activeTextures[5] : null, col: z === -1 ? COLORS[5] : null }
        ];

        faceConfig.forEach(cfg => {
            if (cfg.tex || cfg.col !== null) {
                let mat = cfg.tex ? new THREE.MeshLambertMaterial({ map: cfg.tex }) : new THREE.MeshLambertMaterial({ color: cfg.col, emissive: cfg.col, emissiveIntensity: 0.05 });
                const sticker = new THREE.Mesh(stickerGeom, mat);
                sticker.position.set(...cfg.pos);
                sticker.rotation.set(...cfg.rot);
                group.add(sticker);
            }
        });
        return group;
    }

    function createCube() {
        if (cubeGroup) scene.remove(cubeGroup);
        cubeGroup = new THREE.Group();
        cubies = [];
        moveStack = [];

        for (let x = -1; x <= 1; x++) {
            for (let y = -1; y <= 1; y++) {
                for (let z = -1; z <= 1; z++) {
                    const cubie = createRoundedCubie(x, y, z);
                    cubie.position.set(x * (CUBIE_SIZE + SPACING), y * (CUBIE_SIZE + SPACING), z * (CUBIE_SIZE + SPACING));
                    cubeGroup.add(cubie);
                    cubies.push(cubie);
                }
            }
        }
        scene.add(cubeGroup);
    }

    function rotateFace(face, clockwise = true, isAuto = false) {
        if (isRotating) return;
        isRotating = true;
        const pivot = new THREE.Group();
        scene.add(pivot);
        const movingCubies = [];
        const threshold = 0.1;

        cubies.forEach(c => {
            const pos = new THREE.Vector3();
            c.getWorldPosition(pos);
            let isPart = false;
            switch(face) {
                case 'R': if (pos.x > threshold) isPart = true; break;
                case 'L': if (pos.x < -threshold) isPart = true; break;
                case 'U': if (pos.y > threshold) isPart = true; break;
                case 'D': if (pos.y < -threshold) isPart = true; break;
                case 'F': if (pos.z > threshold) isPart = true; break;
                case 'B': if (pos.z < -threshold) isPart = true; break;
            }
            if (isPart) movingCubies.push(c);
        });

        movingCubies.forEach(c => pivot.add(c));
        let currentRot = 0;
        const step = (clockwise ? -1 : 1) * ANIM_SPEED;

        function animateRotation() {
            if (Math.abs(currentRot) < Math.PI / 2) {
                const delta = Math.min(Math.abs(step), Math.PI / 2 - Math.abs(currentRot)) * Math.sign(step);
                if (face === 'R' || face === 'L') pivot.rotation.x += delta;
                else if (face === 'U' || face === 'D') pivot.rotation.y += delta;
                else if (face === 'F' || face === 'B') pivot.rotation.z += delta;
                currentRot += delta;
                requestAnimationFrame(animateRotation);
            } else {
                finalizeRotation(pivot, movingCubies);
                if (!isAuto) {
                    moveStack.push({ face, clockwise });
                    logMove(face + (clockwise ? "" : "'"));
                }
            }
        }
        animateRotation();
    }

    function finalizeRotation(pivot, movingCubies) {
        pivot.updateMatrixWorld();
        movingCubies.forEach(c => { c.applyMatrix4(pivot.matrixWorld); cubeGroup.add(c); });
        scene.remove(pivot);
        isRotating = false;
    }

    function quickSolve() {
        if (isRotating || moveStack.length === 0) return;
        const reverseMoves = [...moveStack].reverse();
        moveStack = [];
        document.getElementById('move-history').innerText = "SOLVING...";
        let i = 0;
        const solveInterval = setInterval(() => {
            if (i < reverseMoves.length) { rotateFace(reverseMoves[i].face, !reverseMoves[i].clockwise, true); i++; }
            else { clearInterval(solveInterval); document.getElementById('move-history').innerText = "SOLVED"; }
        }, 300);
    }

    function onKeyDown(e) {
        const key = e.key.toUpperCase();
        if (['U', 'D', 'L', 'R', 'F', 'B'].includes(key)) rotateFace(key, !e.shiftKey);
    }

    function setupPointerControls() {
        let isDragging = false;
        let lastX, lastY;
        const onStart = (e) => { if (e.target.closest('.ui-overlay')) return; isDragging = true; lastX = e.clientX || (e.touches && e.touches[0].clientX); lastY = e.clientY || (e.touches && e.touches[0].clientY); };
        const onMove = (e) => {
            if (!isDragging) return;
            if (e.cancelable) e.preventDefault();
            const currentX = e.clientX || (e.touches && e.touches[0].clientX);
            const currentY = e.clientY || (e.touches && e.touches[0].clientY);
            const dx = (currentX - lastX) * 0.007;
            const dy = (currentY - lastY) * 0.007;
            const spherical = new THREE.Spherical().setFromVector3(camera.position);
            spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi - dy));
            spherical.theta -= dx;
            camera.position.setFromSpherical(spherical);
            camera.lookAt(0, 0, 0);
            lastX = currentX; lastY = currentY;
        };
        const onEnd = () => { isDragging = false; };
        renderer.domElement.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove, { passive: false });
        window.addEventListener('mouseup', onEnd);
        renderer.domElement.addEventListener('touchstart', onStart, { passive: false });
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchend', onEnd);
    }

    function scrambleCube() {
        if (isRotating) return;
        const moves = ['U', 'D', 'L', 'R', 'F', 'B'];
        let count = 0;
        const interval = setInterval(() => { rotateFace(moves[Math.floor(Math.random() * 6)], Math.random() > 0.5); if (++count >= 15) clearInterval(interval); }, 320);
    }

    function resetCube() { if (isRotating) return; createCube(); document.getElementById('move-history').innerText = "RESET"; }
    function handleManualMove(face) { rotateFace(face, !isInverted); }
    function toggleInvert() { isInverted = !isInverted; document.getElementById('invert-btn').innerText = isInverted ? "CCW" : "CW"; document.getElementById('invert-btn').classList.toggle('text-blue-400'); }
    function logMove(move) { const hist = document.getElementById('move-history'); hist.innerText = (hist.innerText + " " + move).split(' ').slice(-10).join(' '); }
    function onWindowResize() { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }
    function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
    init();
</script>
</body>
</html>
